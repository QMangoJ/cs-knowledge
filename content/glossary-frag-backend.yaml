# 后端工程学科词条：正文以 [[词]] 标记引用本表。
- term: 容器
  full: 容器（container）
  explain: 一种把应用和它的运行环境打包在一起、靠操作系统内核的隔离机制单独运行的进程：它不是虚拟机，没有自己的操作系统内核，与宿主机共享内核，靠命名空间获得「看起来独占系统」的错觉，靠控制组被限制能用的资源量。
- term: 镜像
  full: 镜像（image）
  explain: 容器的打包成品：把应用代码、运行时、依赖库和配置按层叠成一个只读的文件包；容器就是镜像跑起来的实例。同一个镜像在任何机器上跑出的环境都一样，这是容器解决「在我机器上是好的」的办法。
- term: 虚拟机
  full: 虚拟机（virtual machine, VM）
  explain: 用软件模拟出一整台计算机：有自己的虚拟硬件和完整的客户机操作系统内核，由虚拟机监视器（hypervisor）负责把真实硬件分给它们。隔离比容器强，代价是每台都要背一个操作系统，启动以分钟计。
- term: 命名空间
  full: 命名空间（namespace，Linux namespace）
  explain: Linux 内核的隔离机制，管的是「进程能看见什么」：PID 命名空间让容器里的进程以为自己是 1 号进程，网络命名空间给它一套独立的网卡与端口，挂载命名空间让它只看见自己的那套文件系统。
- term: 控制组
  full: 控制组（cgroups，control groups）
  explain: Linux 内核的限额机制，管的是「进程能用多少」：给一组进程划定 CPU 与内存的上限，内存超了会触发 OOM 杀掉进程，CPU 超了会被节流。容器在参数里写的内存与 CPU 限额，落到内核就是它。
- term: Dockerfile
  full: Dockerfile（镜像构建说明书）
  explain: 一个文本文件，从上到下写明镜像怎么一层层搭出来：从哪个基础镜像起、拷进什么文件、装什么依赖、启动时跑什么命令。docker build 照着它逐行执行，每行通常生成镜像的一层。
- term: 镜像仓库
  full: 镜像仓库（image registry）
  explain: 存放和分发镜像的服务，如 Docker Hub 与各云厂商的私有仓库：构建机把镜像推（push）上去，服务器再拉（pull）下来运行。它在容器世界里的地位相当于应用商店的服务器端。
- term: Pod
  full: Pod（Kubernetes 的最小调度单位）
  explain: Kubernetes 调度的最小单位，一组必须待在同一台机器上的容器：它们共享同一个 IP 地址和端口空间，也能共享存储卷。常见的搭配是一个主容器加一个帮忙的边车（sidecar）容器，比如专门收集日志的那个。
- term: Deployment
  full: Deployment（Kubernetes 的无状态应用控制器）
  explain: 你向它声明「我要这个应用的 3 个副本、用这个版本的镜像」，它通过 ReplicaSet 保证实际副本数与声明一致：副本挂了补新的，发新版本时按策略逐个替换。它是日常部署无状态服务最常用的对象。
- term: ReplicaSet
  full: ReplicaSet（副本集控制器）
  explain: 只负责一件事的控制器：数着某种 Pod 现在有几个，不够声明的数量就补、多出来就删。它通常不由人直接操作，而是由 Deployment 创建和管理——Deployment 每发一个新版本，就换一个新的 ReplicaSet。
- term: Service
  full: Service（Kubernetes 的服务入口）
  explain: 给一组会不断增减、IP 会不断变化的 Pod 准备的固定入口：它有稳定的 IP 与域名，靠标签选中背后的 Pod，并把请求分摊到它们身上。Pod 换了几茬，调用方用的地址始终不变。
- term: kubelet
  full: kubelet（节点上的 Kubernetes 代理）
  explain: 跑在每台工作节点上的代理程序：它盯着分给本机的 Pod 清单，指挥容器运行时把容器拉起来，再把探针结果和节点状态持续汇报给控制面。声明最终变成真实容器，靠的就是它。
- term: 调度器
  full: 调度器（kube-scheduler，Kubernetes 调度器）
  explain: Kubernetes 控制面的组件，专管「新 Pod 该放到哪台机器上」：先按资源请求与约束筛掉不合格的节点（过滤），再给剩下的节点打分排序，挑最合适的那台。它只做决定，不亲自启动容器。
- term: 声明式
  full: 声明式（declarative configuration）
  explain: 只描述「我想要的最终状态」而不写「一步步怎么做」的管理方式：你声明要 3 个副本，系统自己比较期望状态与实际状态的差距并动手补齐。Kubernetes 整个建立在这种方式上，与之相对的是命令式——直接下命令让系统执行某个动作。
- term: 自愈
  full: 自愈（self-healing）
  explain: 系统自己发现故障并自己恢复的能力：Kubernetes 里容器挂了会被重启、节点宕机后上面的 Pod 会被调度到别的节点重建，全程不需要人半夜爬起来操作。自愈的前提是状态有人持续盯着对比，也就是控制循环一直在转。
- term: 持续集成
  full: 持续集成（Continuous Integration, CI）
  explain: 每次有人提交代码，就自动把代码拉下来构建并跑测试，几分钟内告诉提交者「这次改动有没有把东西弄坏」。它治的是「攒了一周才合并、冲突与故障一起爆发」的老问题。
- term: 持续交付
  full: 持续交付（Continuous Delivery, CD）
  explain: 在持续集成的基础上再往前一步：每次改动都自动打包成一个随时可以发布的成品，发布动作本身保留一个人工确认的按钮。它保证的不是「一直在发布」，而是「随时能发布」。
- term: 持续部署
  full: 持续部署（Continuous Deployment）
  explain: 把持续交付最后那个按钮也去掉：通过全部自动检查的改动直接上线到生产环境。它对自动化测试与回滚能力的要求最高，常见于一天要发布很多次的互联网产品。
- term: 流水线
  full: 流水线（pipeline，CI/CD 流水线）
  explain: 把一次发布拆成一串自动执行的阶段：构建、测试、安全扫描、打包、部署，一关过了才进下一关。它是持续集成与持续交付的执行载体，任何一关失败，整条线就停在那一关。
- term: 制品
  full: 制品（artifact）
  explain: 构建过程产出的、可以直接拿去部署的成品文件，比如一个 jar 包或一个容器镜像。规矩是「只构建一次」：测试环境验过的那个制品，原样晋升到生产环境，绝不在生产前重新构建一遍。
- term: 蓝绿发布
  full: 蓝绿发布（blue-green deployment）
  explain: 备两套一模一样的环境：蓝在跑旧版本，绿部署新版本，验证没问题就把流量入口整体切到绿。出事时把入口切回蓝就完成回滚，快是它最大的优点，代价是发布期间要养两套环境的资源。
- term: 金丝雀发布
  full: 金丝雀发布（canary release）
  explain: 先让一小部分流量（比如 1%）用上新版本，盯着错误率等指标看一段时间，没问题再逐步放大到全部。名字来自矿工带金丝雀下井测毒气：先让最小范围替大家试险，出事时受影响的用户也最少。
- term: 回滚
  full: 回滚（rollback）
  explain: 发布后发现严重问题时，把系统退回到上一个已知正常的版本。它是发布动作的另一半：一个成熟的发布流程会先写好怎么回滚、回滚多久能完成，再谈怎么发布。
- term: 功能开关
  full: 功能开关（feature toggle / feature flag）
  explain: 在代码里给新功能留一个可远程控制的开关：部署归部署，打开归打开，两件事分开。出问题时关掉开关就能让功能下线，比回滚整个版本更快；代价是开关多了要记得清理。
- term: 可观测性
  full: 可观测性（observability）
  explain: 一种系统属性：只看系统对外吐出的数据（日志、指标、链路追踪），就能推断它内部正在发生什么。它与监控的区别是：监控回答你事先想到的问题，可观测性让你能追问事先没想到的新问题。
- term: 结构化日志
  full: 结构化日志（structured logging）
  explain: 不再把日志写成一句话，而是写成带固定字段的数据，比如每条都带时间、级别、订单号、耗时（毫秒）。机器能直接按字段过滤与统计，而不是靠人肉在一堆文本里搜关键词。
- term: 指标
  full: 指标（metrics）
  explain: 把系统状态汇成随时间变化的数字序列，比如每秒请求数、错误率、响应时间的第 99 百分位。它便宜、适合长期保存与设告警，但只有总数与分布，看不到任何一次具体请求的细节。
- term: 链路追踪
  full: 链路追踪（distributed tracing）
  explain: 给一次请求发一个全程通行证（trace id）：它路过每个服务时都记下一段耗时（span），最后拼成一棵时间树，一眼能看出这次请求慢在哪一环。它是三支柱里专门回答「慢在哪个服务」的那个。
- term: RED 方法
  full: RED 方法（Rate, Errors, Duration）
  explain: 给面向请求的服务定的一套最小仪表盘，每个服务只看三个数：请求速率、错误数、响应时长。由 Tom Wilkie 提出，与 Google 的四个黄金信号（延迟、流量、错误、饱和度）大体对应，是给「服务」看的体检表。
- term: USE 方法
  full: USE 方法（Utilization, Saturation, Errors）
  explain: 给硬件与资源定的一套排查清单：对每种资源（CPU、内存、磁盘、网络）都查利用率、饱和度（排队程度）与错误数。由 Brendan Gregg 提出，与 RED 方法分工：RED 看服务、USE 看资源。
- term: 采样
  full: 采样（sampling）
  explain: 链路追踪里只保存一部分请求的完整记录：比如随机留 1%，或者专留出错与慢的那批（尾部采样）。原因是全量保存的成本随流量线性上涨，大流量系统付不起，也没必要——统计规律靠样本已经能看清。
- term: Cookie
  full: Cookie（浏览器代存的状态凭证）
  explain: 服务器通过响应头让浏览器存下的一小段数据，之后浏览器访问这个站点时会自动带上它。它是给无记忆的 HTTP 打的补丁：登录态这类「记住你是谁」的需求，底层都靠它在每个请求里传递凭证。
- term: 会话
  full: 会话（session）
  explain: 服务器为一次登录在自己这边保存的一份状态记录，浏览器只拿一个随机编号当钥匙。数据在服务器手里，所以能随时作废某把钥匙把人踢下线；代价是每个请求都要凭编号查一遍。
- term: JWT
  full: JWT（JSON Web Token，自包含的签名令牌）
  explain: 头部、载荷、签名三段拼成的一个字符串：载荷里写着用户是谁、何时过期，服务器验一下签名就敢信，不必查数据库。代价是发出去之后收不回——想让它提前失效，只能另设黑名单或等它过期。
- term: OAuth
  full: OAuth（OAuth 2.0，开放授权框架）
  explain: 让一个应用在你许可下、有限度地使用你在另一个服务上的身份与数据的授权框架。「用 Google 账号登录」走的就是它：网站全程碰不到你的 Google 密码，只拿到一串有范围、有期限的令牌。
- term: OIDC
  full: OIDC（OpenID Connect，开放身份连接）
  explain: 建在 OAuth 2.0 之上的一层身份协议：OAuth 本来只管「允许做什么」，OIDC 补上「你是谁」，通过一个签过名的 id_token 把登录者的身份交给应用。现在的第三方登录基本都是它。
- term: RBAC
  full: RBAC（基于角色的访问控制，Role-Based Access Control）
  explain: 权限不直接发给个人，而是先发给角色（普通用户、客服、管理员），人再被授予角色。调整权限时只动角色的权限表，不用逐个用户改，是业务系统最常用的权限模型。
- term: 盐值
  full: 盐值（salt，密码存储的随机拌料）
  explain: 存密码时给每个用户随机生成的一串数据，与密码一起喂给哈希函数。作用是让两个相同密码的人存出的结果也不同，并让攻击者预先算好的彩虹表整张作废。
- term: Redis
  full: Redis（内存键值存储）
  explain: 把数据全部放在内存里的键值存储，读写在微秒量级，还提供字符串、哈希、列表、集合、有序集合等现成数据结构。后端里最常见的用法是当缓存，也常拿来做排行榜、计数器与简单队列。
- term: 缓存穿透
  full: 缓存穿透（cache penetration）
  explain: 请求查的数据根本不存在，缓存里永远攒不下，于是每次请求都穿过缓存砸到数据库上。常见于恶意扫描不存在的商品编号；防法是把空结果也短暂缓存，或先用布隆过滤器挡一层。
- term: 缓存击穿
  full: 缓存击穿（cache breakdown）
  explain: 一个热点数据的缓存刚好过期的那一瞬间，大量请求同时发现缓存没有，一起涌向数据库重建它。防法是重建只放一个请求进去（互斥），或用逻辑过期：先返回旧值，再由一个请求异步刷新。
- term: 缓存雪崩
  full: 缓存雪崩（cache avalanche）
  explain: 大批缓存数据在相近时间集中过期（或缓存整体宕机），请求瞬间全部压到数据库上把它打垮。防法是给过期时间加随机抖动把它们错开，并给数据库一侧留限流与降级的后手。
- term: 网关
  full: 网关（gateway / API gateway）
  explain: 摆在所有服务最前面的统一入口：请求先过它，再被分发到后面的服务。TLS 终止、限流、认证、路由这些每个入口都要做的活计，收在这里做一次，是它存在的理由。
- term: 中间件
  full: 中间件（middleware）
  explain: 夹在请求进入与业务处理之间的一层层处理函数，专管与具体业务无关的横切活计：打日志、计时、验登录、注入追踪编号。请求像穿过洋葱一样依次穿过它们，响应再反着穿出来。
- term: 限流
  full: 限流（rate limiting）
  explain: 给单位时间内的请求数设上限，超出的直接拒绝或排队。它保的不是公平而是命：流量洪峰或有人恶意刷接口时，先牺牲一部分请求，换整个服务不被拖垮。常用算法是令牌桶与漏桶。
- term: 幂等键
  full: 幂等键（Idempotency-Key，防重复提交的编号）
  explain: 客户端为一次操作生成的一个唯一编号，随请求一起发给服务器。服务器记下这个编号对应的结果：同一个编号再来时不再重复执行，直接返回上次的结果。支付与下单接口防重复提交的标准做法。
- term: 连接池
  full: 连接池（connection pool）
  explain: 预先建好一批数据库连接、用完不关而是还回去复用的池子。建连接要走网络握手与身份认证，贵且慢；没有池子，高并发时光建连接就能把服务拖死，池子太大又会把数据库压垮。
- term: 全表扫描
  full: 全表扫描（full table scan / Seq Scan）
  explain: 数据库为回答一次查询，把一张表从头到尾每一行都看一遍。表小的时候没问题，表大了就是慢查询的头号来源；执行计划里出现它，通常意味着该给过滤或联表的字段加索引了。
- term: SQL 注入
  full: SQL 注入（SQL injection）
  explain: 把用户输入直接拼进 SQL 语句时，攻击者可以输入一段特制的文字，让它被当成 SQL 的一部分执行，从而绕过登录、拖走整张表甚至删库。根治办法是参数化查询——让数据永远只当数据。
- term: 参数化查询
  full: 参数化查询（parameterized query / 预处理语句）
  explain: SQL 语句先用占位符写好结构发给数据库，用户输入随后作为纯数据单独传过去，永远没有机会被当成指令执行。它是防 SQL 注入的根治手段，几乎所有数据库驱动都支持。
- term: 越权
  full: 越权（broken access control，含 IDOR）
  explain: 用户访问到了不属于自己的数据或功能：把订单号改一位就看到别人的订单，叫水平越权；普通账号调通了管理员接口，叫垂直越权。根源是只验了「登录没有」，没验「这条数据归不归你」。
- term: 反向代理
  full: 反向代理（reverse proxy）
  explain: 挡在应用服务前面替它接待请求的服务器：用户连的是它，它再把请求转给后面真正的应用。顺手把 TLS 终止、静态文件、负载分发都接了过去，Nginx 是最常见的实现。
- term: systemd
  full: systemd（Linux 的服务管理器）
  explain: 现代 Linux 发行版的第一个进程与服务总管：负责开机拉起服务、服务崩溃后按策略重启、收集服务的输出日志。把一个程序交给它托管，进程守护就不用自己造轮子了。
- term: Nginx
  full: Nginx（Web 服务器与反向代理）
  explain: 以事件驱动著称的服务器软件：擅长直接发送静态文件、做反向代理与负载均衡，是单机部署里最常见的入口担当。它自己不跑你的业务代码，只负责把请求稳稳递给后面的应用。
- term: 单元测试
  full: 单元测试（unit test）
  explain: 只测一个最小单元（通常是一个函数）的测试：不连数据库、不发网络请求，毫秒级跑完。它拦的是逻辑算错这类 bug，数量应该占测试的大头。
- term: 集成测试
  full: 集成测试（integration test）
  explain: 把服务和它真实的依赖（数据库、缓存）接起来一起测的测试：SQL 写错、事务没生效、字段对不上这类配合问题只有它拦得住。慢是真的慢，所以数量要克制。
- term: 契约测试
  full: 契约测试（contract test）
  explain: 专门测服务之间约定的测试：调用方依赖的响应字段与格式写成一份可执行的契约，提供方每次改动都先过一遍。它拦的是「我改了我的接口，把下游悄悄弄坏了」这类事故。
- term: 测试金字塔
  full: 测试金字塔（test pyramid）
  explain: 一种测试配比的经验形状：底层单元测试多而快，中间集成测试适量，顶层端到端测试少而精。反过来堆成沙漏形状的团队，最后都会被慢而脆的测试拖住发布节奏。
- term: 微服务
  full: 微服务（microservices）
  explain: 把一个大系统按业务边界拆成许多小服务：每个服务独立开发、独立部署、独立扩容，自己管自己那份数据。它买的是团队与发布的独立性，付的是网络调用、数据一致性与运维复杂度的税。
- term: 单体
  full: 单体（monolith，单体架构）
  explain: 所有业务代码打包成一个进程、一次部署的应用形态。它被说成落后是冤枉的：团队小、边界没摸清时，它的开发与排障成本最低；很多系统先做成模块化单体，长大了才拆。
- term: 服务发现
  full: 服务发现（service discovery）
  explain: 微服务里解决「对方现在住哪」的机制：服务实例启动时把自己的地址登记到注册中心，调用方先查注册中心再发请求。没有它，实例一扩容一迁移，写死的地址立刻全部失效。
- term: 熔断器
  full: 熔断器（circuit breaker）
  explain: 挂在服务调用之间的一道保险丝：下游连续失败到阈值，它就直接断开，后续请求立刻失败不再傻等；过一阵放几个试探请求，下游恢复了再合上。它防的是一个慢下游把整条调用链拖死。
- term: 配置中心
  full: 配置中心（configuration center）
  explain: 集中存放并分发各服务配置的组件：改一处配置，所有服务动态生效，不用逐台改文件重启。它是服务数量上了规模才划算的基础设施，单机时代的环境变量就是它的前身。
- term: 缓存
  full: 缓存（cache）
  explain: 把一份数据的副本放在更快的存储里，让后续读取不必再去慢的源头重算或重查：CPU 缓存、浏览器缓存、应用层的 Redis 都是它在不同层的形态。它的核心矛盾永远是同一个：副本与原件是两份数据，一致性要专门维护。
- term: LFU
  full: LFU（Least Frequently Used，最不经常使用淘汰）
  explain: 一种缓存淘汰策略：内存满时优先删掉历史上被访问次数最少的数据。与它相对的是 LRU（删最久没被碰过的）：LFU 看频率，适合热点长期稳定的场景；LRU 看新近度，适合热点会迁移的场景。
- term: 向量数据库
  full: 向量数据库（vector database）
  explain: 专门存向量并支持「按相似度找最近邻」的数据库：给它一个向量，它能从上百万个向量里快速找出最像的那几个。它是大模型应用里给文档检索兜底的存储，靠的是近似最近邻索引（如 HNSW）。
