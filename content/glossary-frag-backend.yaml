# 后端工程学科词条：正文以 [[词]] 标记引用本表。
- term: 容器
  full: 容器（container）
  explain: 一种把应用和它的运行环境打包在一起、靠操作系统内核的隔离机制单独运行的进程：它不是虚拟机，没有自己的操作系统内核，与宿主机共享内核，靠命名空间获得「看起来独占系统」的错觉，靠控制组被限制能用的资源量。
- term: 镜像
  full: 镜像（image）
  explain: 容器的打包成品：把应用代码、运行时、依赖库和配置按层叠成一个只读的文件包；容器就是镜像跑起来的实例。同一个镜像在任何机器上跑出的环境都一样，这是容器解决「在我机器上是好的」的办法。
- term: 虚拟机
  full: 虚拟机（virtual machine, VM）
  explain: 用软件模拟出一整台计算机：有自己的虚拟硬件和完整的客户机操作系统内核，由虚拟机监视器（hypervisor）负责把真实硬件分给它们。隔离比容器强，代价是每台都要背一个操作系统，启动以分钟计。
- term: 命名空间
  full: 命名空间（namespace，Linux namespace）
  explain: Linux 内核的隔离机制，管的是「进程能看见什么」：PID 命名空间让容器里的进程以为自己是 1 号进程，网络命名空间给它一套独立的网卡与端口，挂载命名空间让它只看见自己的那套文件系统。
- term: 控制组
  full: 控制组（cgroups，control groups）
  explain: Linux 内核的限额机制，管的是「进程能用多少」：给一组进程划定 CPU 与内存的上限，内存超了会触发 OOM 杀掉进程，CPU 超了会被节流。容器在参数里写的内存与 CPU 限额，落到内核就是它。
- term: Dockerfile
  full: Dockerfile（镜像构建说明书）
  explain: 一个文本文件，从上到下写明镜像怎么一层层搭出来：从哪个基础镜像起、拷进什么文件、装什么依赖、启动时跑什么命令。docker build 照着它逐行执行，每行通常生成镜像的一层。
- term: 镜像仓库
  full: 镜像仓库（image registry）
  explain: 存放和分发镜像的服务，如 Docker Hub 与各云厂商的私有仓库：构建机把镜像推（push）上去，服务器再拉（pull）下来运行。它在容器世界里的地位相当于应用商店的服务器端。
- term: Pod
  full: Pod（Kubernetes 的最小调度单位）
  explain: Kubernetes 调度的最小单位，一组必须待在同一台机器上的容器：它们共享同一个 IP 地址和端口空间，也能共享存储卷。常见的搭配是一个主容器加一个帮忙的边车（sidecar）容器，比如专门收集日志的那个。
- term: Deployment
  full: Deployment（Kubernetes 的无状态应用控制器）
  explain: 你向它声明「我要这个应用的 3 个副本、用这个版本的镜像」，它通过 ReplicaSet 保证实际副本数与声明一致：副本挂了补新的，发新版本时按策略逐个替换。它是日常部署无状态服务最常用的对象。
- term: ReplicaSet
  full: ReplicaSet（副本集控制器）
  explain: 只负责一件事的控制器：数着某种 Pod 现在有几个，不够声明的数量就补、多出来就删。它通常不由人直接操作，而是由 Deployment 创建和管理——Deployment 每发一个新版本，就换一个新的 ReplicaSet。
- term: Service
  full: Service（Kubernetes 的服务入口）
  explain: 给一组会不断增减、IP 会不断变化的 Pod 准备的固定入口：它有稳定的 IP 与域名，靠标签选中背后的 Pod，并把请求分摊到它们身上。Pod 换了几茬，调用方用的地址始终不变。
- term: kubelet
  full: kubelet（节点上的 Kubernetes 代理）
  explain: 跑在每台工作节点上的代理程序：它盯着分给本机的 Pod 清单，指挥容器运行时把容器拉起来，再把探针结果和节点状态持续汇报给控制面。声明最终变成真实容器，靠的就是它。
- term: 调度器
  full: 调度器（kube-scheduler，Kubernetes 调度器）
  explain: Kubernetes 控制面的组件，专管「新 Pod 该放到哪台机器上」：先按资源请求与约束筛掉不合格的节点（过滤），再给剩下的节点打分排序，挑最合适的那台。它只做决定，不亲自启动容器。
- term: 声明式
  full: 声明式（declarative configuration）
  explain: 只描述「我想要的最终状态」而不写「一步步怎么做」的管理方式：你声明要 3 个副本，系统自己比较期望状态与实际状态的差距并动手补齐。Kubernetes 整个建立在这种方式上，与之相对的是命令式——直接下命令让系统执行某个动作。
- term: 自愈
  full: 自愈（self-healing）
  explain: 系统自己发现故障并自己恢复的能力：Kubernetes 里容器挂了会被重启、节点宕机后上面的 Pod 会被调度到别的节点重建，全程不需要人半夜爬起来操作。自愈的前提是状态有人持续盯着对比，也就是控制循环一直在转。
- term: 持续集成
  full: 持续集成（Continuous Integration, CI）
  explain: 每次有人提交代码，就自动把代码拉下来构建并跑测试，几分钟内告诉提交者「这次改动有没有把东西弄坏」。它治的是「攒了一周才合并、冲突与故障一起爆发」的老问题。
- term: 持续交付
  full: 持续交付（Continuous Delivery, CD）
  explain: 在持续集成的基础上再往前一步：每次改动都自动打包成一个随时可以发布的成品，发布动作本身保留一个人工确认的按钮。它保证的不是「一直在发布」，而是「随时能发布」。
- term: 持续部署
  full: 持续部署（Continuous Deployment）
  explain: 把持续交付最后那个按钮也去掉：通过全部自动检查的改动直接上线到生产环境。它对自动化测试与回滚能力的要求最高，常见于一天要发布很多次的互联网产品。
- term: 流水线
  full: 流水线（pipeline，CI/CD 流水线）
  explain: 把一次发布拆成一串自动执行的阶段：构建、测试、安全扫描、打包、部署，一关过了才进下一关。它是持续集成与持续交付的执行载体，任何一关失败，整条线就停在那一关。
- term: 制品
  full: 制品（artifact）
  explain: 构建过程产出的、可以直接拿去部署的成品文件，比如一个 jar 包或一个容器镜像。规矩是「只构建一次」：测试环境验过的那个制品，原样晋升到生产环境，绝不在生产前重新构建一遍。
- term: 蓝绿发布
  full: 蓝绿发布（blue-green deployment）
  explain: 备两套一模一样的环境：蓝在跑旧版本，绿部署新版本，验证没问题就把流量入口整体切到绿。出事时把入口切回蓝就完成回滚，快是它最大的优点，代价是发布期间要养两套环境的资源。
- term: 金丝雀发布
  full: 金丝雀发布（canary release）
  explain: 先让一小部分流量（比如 1%）用上新版本，盯着错误率等指标看一段时间，没问题再逐步放大到全部。名字来自矿工带金丝雀下井测毒气：先让最小范围替大家试险，出事时受影响的用户也最少。
- term: 回滚
  full: 回滚（rollback）
  explain: 发布后发现严重问题时，把系统退回到上一个已知正常的版本。它是发布动作的另一半：一个成熟的发布流程会先写好怎么回滚、回滚多久能完成，再谈怎么发布。
- term: 功能开关
  full: 功能开关（feature toggle / feature flag）
  explain: 在代码里给新功能留一个可远程控制的开关：部署归部署，打开归打开，两件事分开。出问题时关掉开关就能让功能下线，比回滚整个版本更快；代价是开关多了要记得清理。
- term: 可观测性
  full: 可观测性（observability）
  explain: 一种系统属性：只看系统对外吐出的数据（日志、指标、链路追踪），就能推断它内部正在发生什么。它与监控的区别是：监控回答你事先想到的问题，可观测性让你能追问事先没想到的新问题。
- term: 结构化日志
  full: 结构化日志（structured logging）
  explain: 不再把日志写成一句话，而是写成带固定字段的数据，比如每条都带时间、级别、订单号、耗时（毫秒）。机器能直接按字段过滤与统计，而不是靠人肉在一堆文本里搜关键词。
- term: 指标
  full: 指标（metrics）
  explain: 把系统状态汇成随时间变化的数字序列，比如每秒请求数、错误率、响应时间的第 99 百分位。它便宜、适合长期保存与设告警，但只有总数与分布，看不到任何一次具体请求的细节。
- term: 链路追踪
  full: 链路追踪（distributed tracing）
  explain: 给一次请求发一个全程通行证（trace id）：它路过每个服务时都记下一段耗时（span），最后拼成一棵时间树，一眼能看出这次请求慢在哪一环。它是三支柱里专门回答「慢在哪个服务」的那个。
- term: RED 方法
  full: RED 方法（Rate, Errors, Duration）
  explain: 给面向请求的服务定的一套最小仪表盘，每个服务只看三个数：请求速率、错误数、响应时长。由 Tom Wilkie 提出，与 Google 的四个黄金信号（延迟、流量、错误、饱和度）大体对应，是给「服务」看的体检表。
- term: USE 方法
  full: USE 方法（Utilization, Saturation, Errors）
  explain: 给硬件与资源定的一套排查清单：对每种资源（CPU、内存、磁盘、网络）都查利用率、饱和度（排队程度）与错误数。由 Brendan Gregg 提出，与 RED 方法分工：RED 看服务、USE 看资源。
- term: 采样
  full: 采样（sampling）
  explain: 链路追踪里只保存一部分请求的完整记录：比如随机留 1%，或者专留出错与慢的那批（尾部采样）。原因是全量保存的成本随流量线性上涨，大流量系统付不起，也没必要——统计规律靠样本已经能看清。
