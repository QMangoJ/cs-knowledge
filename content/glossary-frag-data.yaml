# data 数据存储学科术语补遗：正文里首次出现、glossary.yaml 本体尚无词条的专有名词。
# 格式与 glossary.yaml 相同，待合并回本体。
- term: 填充因子
  full: 填充因子（fill factor，页的目标填充比例）
  explain: 建索引或页分裂后每个页只填到几成的设置，留出的空位用来吸收后续插入、推迟下一次分裂。
- term: 溢出页
  full: 溢出页（overflow page，存放超长行溢出部分的页）
  explain: 一行太长、一页放不下时，把放不下的部分单独存到另一页里，主页里只留一个指向它的指针。
- term: 校验和
  full: 校验和（checksum，由数据算出的校验值）
  explain: 按页里的数据算出的一个数，读回时重新算一遍对一下，对不上就说明这一页写坏了或没有写完整。
- term: 算子
  full: 算子（operator，执行计划里的一个处理步骤）
  explain: 执行计划树里的一个节点，负责一件具体的事，比如从一张表取行、做过滤、做连接或做排序，行在算子之间逐级往上传递。
- term: 因果一致
  full: 因果一致（causal consistency）
  explain: 有因果关系的操作在所有副本上都按因果顺序被看到，没有因果关系的操作先后可以不同，强度在强一致与最终一致之间。
