id: network/tcp-handshake
subject: network
slug: tcp-handshake
order: 1
status: published
license: CC-BY-4.0
title: TCP 三次握手与四次挥手
summary: 连接建立要三次握手、断开要四次挥手，背后是序号、确认与状态机的严丝合缝。
premise: 以浏览器（客户端）连接一台推理服务（服务器）为例，看 SYN/ACK 与 seq 号如何对齐。
overview:
- key: 一句话总结
  value: 握手是双方交换初始序号并确认对方收得到，挥手是各自关闭发送方向
- key: 为什么三次
  value: 三次握手的核心理由（RFC 9293）是防旧的重复 SYN 让双方对连接状态产生混乱，两次做不到
- key: 关键字段
  value: SYN、ACK、seq（序号）、ack（确认号 = 对方 seq + 1）
- key: 状态
  value: CLOSED → SYN_SENT/SYN_RCVD → ESTABLISHED；关闭经 FIN_WAIT/TIME_WAIT
- key: 代价
  value: 建连要 1 个 RTT 才能发数据，TLS 还要再叠加握手
- key: 在终端里看一看
  value: ss -tn state time-wait　看 TIME_WAIT 连接；tcpdump -i any port 443　抓握手包
visual: swimlane
lanes:
- id: client
  label: 客户端
- id: server
  label: 服务器
logColumns:
- key: mode
  label: 当前状态
- key: event
  label: 发生了什么
level: 基础
minutes: 29
prereq: []
objectives:
- 按顺序写出三次握手的报文与双方状态
- 用序号/确认号解释为什么两次不够
- 说清四次挥手与 TIME_WAIT 存在的理由
aiLink: 每次新建到 LLM API 的连接都要先做 TCP 握手（再叠 TLS）：连接池与 HTTP keep-alive 存在的全部理由，就是让后续调用复用已建好的连接，省掉这 1 个 RTT 的握手与慢启动。理解握手与 TIME_WAIT，才懂为什么高并发推理网关要复用连接、为什么端口会耗尽。
design:
- mechanism: '三次握手是「最小充分」而非「保证成功」的设计：三包之后，双方各完成了一次「我发的初始序号被对方确认」的往返，序号同步在两个方向上都闭环，这是能开始可靠传数据的最低条件。'
  problem: '根本约束来自不可靠信道：在可能丢包的网络上，任何有限次消息交换都无法让通信双方获得绝对的共同确定——这就是两将军问题给出的不可能性结论，再多交换一轮也消不掉。'
  choice: '协议选择停在三次：第三包 ACK 让服务端的序号也被确认，两个方向各闭环一次；若再加第四包，只是把「最后一包到没到」的不确定性推给另一方，并不能真正消除它。'
  tradeoff: '代价是建连必须先花 1 个 RTT 才能发应用数据，跨洲场景这就是上百毫秒；换来的是绝大多数连接能以极低的额外开销可靠建立，残余风险交给重传与状态超时兜底处理。'
  root: '根源在推理层面而非实现技巧：最后一条消息的发送方永远无法知道它是否到达，因为能证明到达的下一条消息本身同样可能丢失，于是确认链条必然在某一层被人为截断下来。'
- mechanism: '防旧 SYN 靠的是第三包 ACK 携带的确认号：服务端发出自己的序号 y 之后，只接受 ack 恰好等于 y+1 的第三包，老连接残留在网络里的旧 SYN 或旧 ACK 对不上本次序号，会被直接用 RST 打掉。'
  problem: '网络中的报文可以迟到很久：一条早已放弃的连接的 SYN 副本漂流到服务端，若服务端收到 SYN 就立刻建连，就会凭空造出一条客户端根本不想要的幻影连接，白占端口与内存等状态资源。'
  choice: '所以不能两次就建连：两次时服务端无法确认客户端真的收到了服务端的初始序号，序号同步只完成了客户端到服务端这一个方向，另一个方向是否对齐完全没有被验证过。'
  tradeoff: '三次握手让服务端在收到第三包之前只保留很轻的半连接状态，代价是服务端要维护半连接队列并防御 SYN 泛洪类滥用；换来的是幻影连接在建立阶段就被识别，而不是等数据出错才发现。'
  root: 'RFC 9293 把防止旧的重复连接发起造成混乱列为三次握手的首要理由：序号是每条连接独立的命名空间，只有双向确认过的序号才能当作可靠通信的共同坐标系来使用。'
- mechanism: '四次挥手与 TIME_WAIT 是一套设计：连接全双工、两个方向独立关闭，每方用 FIN 宣布自己方向发完、用 ACK 确认对方的 FIN；主动关闭方在最后停留 TIME_WAIT，时长取 2 倍的报文最大生存时间 MSL。'
  problem: '关闭要同时解决两个残余风险：一是最后一条 ACK 可能丢失，对方会重传 FIN，需要有人还在原地重新确认；二是旧连接迟到的报文可能漂进复用了相同四元组的新连接，把新数据污染掉。'
  choice: 'TIME_WAIT 取 2MSL 而非 1MSL：一个 MSL 留给最后 ACK 或对方重传 FIN 的单程消散，另一个 MSL 保证一来一回之后，本连接在网络中可能残留的任何报文都已超过最大生存时间而过期。'
  tradeoff: '代价是主动关闭方要为每条已关连接保留约一分钟的状态，高并发短连接场景会堆积大量 TIME_WAIT 并耗尽本地临时端口；工程上靠连接复用与让服务端承担主动关闭来分摊这一成本。'
  root: '规范把 MSL 名义值定为 2 分钟，TIME_WAIT 因此名义上是 4 分钟量级；Linux 实现把这一等待硬编码为约 60 秒，是在「旧报文实际消散速度」与「端口回收压力」之间取的工程折中。'
quiz:
- q: 三次握手第三次 ACK 的确认号应该是？
  options:
  - 客户端自己的 seq
  - 服务器 seq + 1
  - '0'
  - 服务器 seq × 2
  answer: 1
  explain: ack = 期望收到的下一个字节序号，即对方已发 seq + 1（SYN 占一个序号）。
- q: 为什么挥手是四次而握手是三次？
  options:
  - 挥手多了校验
  - 关闭是两个方向各自独立关闭：一方发 FIN 只表示自己不再发，对方还可能继续发数据
  - 协议规定的凑数
  - 服务器比较慢
  answer: 1
  explain: 建立时服务器的 SYN 与 ACK 可合并一包；关闭时被动方的 ACK 与 FIN 往往不能合并，因为它可能还有数据要发。
- q: TIME_WAIT 停留在主动关闭方，作用是？
  options:
  - 占内存
  - 保证最后的 ACK 丢了能重发，并让旧连接的残留报文在网络中消散
  - 等服务器重启
  - 做日志统计
  answer: 1
  explain: 规范要求持续 2×MSL（MSL 名义值 2 分钟），Linux 实现硬编码为 60 秒；高并发短连接下 TIME_WAIT 堆积会耗尽本地端口。
steps:
- id: why
  title: 发数据之前，为什么先要握手
  tldr: TCP 要提供可靠有序的字节流，双方必须先对齐序号起点并确认对方在线。
  body: 'TCP 承诺的是可靠、有序、不重复的字节流。注意「字节流」三个字：它不保留应用写入的边界，你写三次、对方可能一次读完，可靠性全靠给每个字节编号、按号确认与重传来维持。要做到这一点，每一方在发数据之前都必须先搞清三件事：对方的字节从哪个序号开始数、对方确实能收到我的包、我也确实能收到对方的包。


    握手就是在发任何应用数据之前，先把这三件事确认完。它花掉 1 个 RTT（往返时延）——跨洲访问时这就是上百毫秒，所以连接复用如此重要。误解澄清：握手顺带协商的窗口、MSS 等参数只是搭车，参数在前两包里就能带完；握手真正的本体是双向的序号同步与可达性确认，这也是它省不掉的原因。换句话说，握手结束时双方要共同持有一套对齐的坐标系——两个方向的序号起点各一份——之后所有确认、重传、排序都建立在这套坐标系之上，坐标系没对齐之前，任何数据都没有意义。'
  derivation: original
  sources: []
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 浏览器
      state: CLOSED
      highlight: true
    - lane: server
      id: s
      label: 服务器
      state: LISTEN
    messages: []
  log:
  - mode: 准备
    event: 服务器在 LISTEN，客户端 CLOSED
- id: syn
  title: 第一次握手：SYN
  tldr: 客户端随机选初始序号 x，发 SYN 表示「我想连，我的字节从 x+1 开始」。
  body: '客户端发出 SYN 报文：SYN 标志位置 1，seq = x（x 是随机生成的初始序号 ISN，随机是为了让攻击者难以预测序号、伪造报文注入连接）。SYN 本身不携带应用数据，但要占一个序号，所以之后真正的数据从 x + 1 开始编号。用数字走一遍：设 x = 1000，那么这条 SYN 消耗掉序号 1000，客户端第一批应用数据的第一个字节序号就是 1001，对方回的确认号也将围绕这组数字展开。


    客户端随即进入 SYN_SENT 状态。若迟迟收不到回复，它会按指数退避重传 SYN（间隔大致翻倍），多次无果才放弃并报错——所以「连不上」时应用往往要等上数秒到数十秒，而不是立刻失败。MSS、窗口扩大、SACK 允许等选项也都搭在这第一包里发过去。'
  derivation: original
  sources:
  - ref: rfc-9293
    locator: §3.4/§3.5 握手与序号
    claim: SYN 占一个序号、ISN 应不可预测、三次握手防旧重复连接发起造成混乱
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 浏览器
      state: SYN_SENT
      highlight: true
    - lane: server
      id: s
      label: 服务器
      state: LISTEN
    messages:
    - id: m1
      from: c
      to: s
      label: SYN, seq=x
      active: true
  log:
  - mode: 握手 1/3
    event: 客户端发出 SYN（seq=x）
  code:
    lang: text
    code: 'SYN 报文关键字段：SYN=1, ACK=0, seq=x（随机 ISN）

      窗口、MSS 等选项也搭在这趟车上（如窗口扩大、SACK 允许）'
    note: 报文示意
- id: synack
  title: 第二次握手：SYN + ACK
  tldr: 服务器回自己的序号 y，并用 ack = x + 1 确认收到客户端的 SYN。
  body: '服务器收到 SYN 后进入 SYN_RCVD，回一个报文同时做两件事：SYN=1、seq = y（服务器自己的初始序号，与客户端的 x 独立选取），以及 ACK=1、ack = x + 1。ack 的语义是「下一个期望收到的字节序号」，所以 ack = x + 1 的意思正是：你的 SYN（占了序号 x）我收到了，之后请从 x + 1 开始发数据。


    接着上面的数字例：若 y = 5000，这包就是 seq=5000、ack=1001。这一包同时证明了服务器「能收也能发」：它收到了 SYN（否则不会回），也具备发出报文的能力。但注意不对称性——此刻服务器还不知道客户端能否收到这包 SYN+ACK，客户端的接收能力与它对 y 的确认都还没发生。服务器在这个阶段只保留一份较轻的半连接状态，还没有为完整连接分配全部资源。'
  derivation: original
  sources: []
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 浏览器
      state: SYN_SENT
    - lane: server
      id: s
      label: 服务器
      state: SYN_RCVD
      highlight: true
    messages:
    - id: m2
      from: s
      to: c
      label: SYN+ACK, seq=y, ack=x+1
      active: true
  log:
  - mode: 握手 2/3
    event: 服务器回 SYN+ACK
- id: ack
  title: 第三次握手：ACK，连接建立
  tldr: 客户端回 ack = y + 1，双方进入 ESTABLISHED，可以开始发数据。
  body: '客户端收到 SYN+ACK 后回 ACK：ack = y + 1（数字例里是 5001），确认服务器的序号起点 y 已收到、之后的数据请从 y + 1 开始。发完这包，客户端即进入 ESTABLISHED；服务器收到并核对 ack 恰好等于 y + 1 后，也进入 ESTABLISHED。到这里账目才齐：客户端的序号被服务器确认过（第二包），服务器的序号被客户端确认过（第三包），两个方向各完成一次闭环。


    一个常被忽略的细节：这第三包 ACK 本身不占序号，而且可以搭载应用数据——客户端不必干等连接「仪式完成」，可以在发 ACK 的同时把第一个请求的数据一起发出去。服务器侧则要等这包到达、核对确认号无误，才把连接交给应用层；确认号对不上的包（比如对应某条旧连接）会被 RST 打掉，这正是下一步要讲的防线。'
  derivation: original
  sources: []
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 浏览器
      state: ESTABLISHED
      highlight: true
    - lane: server
      id: s
      label: 服务器
      state: ESTABLISHED
      highlight: true
    messages:
    - id: m3
      from: c
      to: s
      label: ACK, ack=y+1
      active: true
  log:
  - mode: 握手 3/3
    event: 双方 ESTABLISHED，开始传数据
  points:
  - 三次分别确认：我能发（SYN 到达）→ 对方能收能发（SYN+ACK 到达）→ 我能收（ACK 到达）
  - SYN 与 FIN 都占一个序号，纯 ACK 不占
  mistake: 以为握手是为了「协商参数」才需要三次——参数协商搭载在前两包里就够了，第三次的根本理由是确认客户端的接收能力、防旧 SYN 误建连。
- id: why-not-two
  title: 为什么两次不够：单向同步与幻影连接
  tldr: 只有两包时，服务端既确认不了客户端收到了它的序号，又会被迟到的旧 SYN 骗出幻影连接。
  body: '设想把握手砍成两次：客户端 SYN、服务端回 SYN+ACK 后就直接建连。第一个漏洞是序号同步只完成了单向：服务端发出的初始序号 y 有没有被客户端收到，服务端完全无从知道；客户端若根本没收到第二包，服务端却已按 ESTABLISHED 的假设发数据，这些数据只会落进一个对坐标系毫无共识的连接里，出了乱序或缺口也无法收拾。


    第二个漏洞更致命：网络里的报文会迟到。一条早已被客户端放弃的旧连接，它的 SYN 副本在路由器里兜转很久后才到达服务端——若服务端见 SYN 就建连，就会建出一条客户端根本不想要的幻影连接：服务端分配了端口、内存与连接状态，甚至开始往一条无人接收的连接里发数据，白占资源，还可能把迟到报文和新连接的数据搅在一起。第三包 ACK 同时补上这两课：它既确认了服务端的 ISN，又用「能正确回应本次 y」证明客户端是现在真的想连——陈旧 SYN 引发的回应，其确认号与新连接对不上，会被 RST 清除。RFC 9293 把防止旧的重复连接发起造成混乱列为三次握手的首要理由，正是针对这一幕。'
  derivation: original
  sources:
  - ref: rfc-9293
    locator: §3.4 建立连接与旧重复 SYN
    claim: 三次握手的首要理由是防止旧的重复连接发起造成混乱，第三次确认同时验证对端序号
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端（早已放弃旧连接）
    - lane: server
      id: s
      label: 服务器
      state: 被旧 SYN 骚扰
      highlight: true
    messages:
    - id: m8
      from: c
      to: s
      label: 迟到的旧 SYN（副本）
    - id: m9
      from: s
      to: c
      label: 无第三次确认就会误建幻影连接
      active: true
  log:
  - mode: 反例
    event: 两次握手下，旧 SYN 可以骗出一条无人要的连接
- id: two-generals
  title: 三次是最小充分，不是保证：两将军问题
  tldr: 不可靠信道上任何有限次交换都给不出绝对确定，所以第三次之后不再加，靠重传与超时兜底。
  body: '有人会问：既然第三包 ACK 也可能丢，为什么不握四次、五次，把成功「保证」下来？这里有一条推理层面的硬边界——两将军问题：在一条可能丢消息的信道上，通信双方用任何有限次消息交换，都无法获得「双方都百分之百确定对方也确定了」的共同确定。道理是一个无限递推：最后一条消息的发送方永远不知道它到底到达没有；想确认它到达，就要再等一条确认，而那条确认的发送方面对的是完全相同的问题——不确定性没有被消灭，只是被往后推了一层。


    所以工程结论是：三次不是「能保证」的次数，而是最小充分的次数——三包恰好让两个方向各完成一次 ISN 确认，达到「可以开始可靠传数据」的最低闭环；继续加包只会白付 RTT，换来的确定性增量为零。剩下的残余风险（比如第三包真的丢了）不靠握手包数解决，而靠协议的日常机制兜底：服务端在 SYN_RCVD 等不到确认会重传 SYN+ACK，客户端也会重发，连接最终要么补上这包、要么超时撤销。把不可能性看清，才不会在面试里说出「三次握手保证连接可靠建立」这种过头话。'
  derivation: original
  sources:
  - ref: rfc-9293
    locator: §3.4 握手设计说明
    claim: 握手取三次完成双向序号确认，其余可靠性由重传与状态机制处理
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端
      state: 已确认对方序号
    - lane: server
      id: s
      label: 服务器
      state: 等第三包确认
      highlight: true
    messages:
    - id: m10
      from: c
      to: s
      label: ACK 是最后一包：到没到，发送方无从确知
      active: true
  log:
  - mode: 原理
    event: 不确定性只能推后一层，不能用有限包数消除
  points:
  - 三次 = 双向各完成一次 ISN 确认的最小包数，不是成功率的保证
  - 再加一轮握手只把不确定性推给另一方，并额外白付一个 RTT
- id: seq-sync
  title: 序号同步到底同步了什么：一次完整数字走例
  tldr: 把握手到第一批数据的序号连起来算一遍，ack 永远是「下一个期望序号」。
  body: '把前面数字例走完，序号账就彻底清楚了。客户端 ISN 为 1000：SYN 占 1000；服务端 ISN 为 5000：SYN 占 5000，双方第二包回 ack=1001、第三包回 ack=5001，握手结束。现在客户端发出 200 字节数据，序号区间是 1001 到 1200；服务端收到后回 ack=1201，含义是「1201 之前的字节全收到了，下一个请从 1201 发」——确认号永远指向下一个期望序号，而不是最后一个收到的序号，这是读抓包时最常算错的一位。


    同理，服务端回 300 字节数据时序号是 5001 到 5300，客户端回 ack=5301。FIN 与 SYN 一样占一个序号，所以关闭阶段的确认号同样要加一。记住三条：序号按字节计、SYN 与 FIN 各占一号、纯 ACK 不占号——抓包里所有 seq 与 ack 的对账都逃不出这三条规则。'
  derivation: original
  sources: []
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端（数据 1001–1200）
      highlight: true
    - lane: server
      id: s
      label: 服务器（回 ack=1201）
    messages:
    - id: m11
      from: c
      to: s
      label: 数据 seq=1001, len=200
      active: true
    - id: m12
      from: s
      to: c
      label: ACK, ack=1201（下一个期望）
  log:
  - mode: 走例
    event: 序号按字节编号，确认号指下一个期望
- id: data-fin
  title: 四次挥手：每个方向单独关闭
  tldr: 一方发 FIN 只关自己的发送方向；对方 ACK 后还可能继续发剩余数据，再发自己的 FIN。
  body: '为什么关闭要四包而建立只要三包？根源是 TCP 连接是全双工的：两个方向是两条独立的字节流，各关各的。建立时，服务端的「确认你的 SYN」与「发我的 SYN」可以合进同一包（SYN+ACK），所以三包够；关闭时却不同——一方发 FIN 只表示「我这个方向的数据发完了」，并不意味着对方也发完了。


    走一遍：先关的一方（设为客户端）发 FIN（seq=u）进入 FIN_WAIT；服务器先回 ACK（ack=u+1）表示「知道你不发了」，但服务器可能还有数据没发完，连接进入半关闭状态：客户端不能再发，仍必须继续接收。等服务器数据发完，它再发自己的 FIN（seq=v），客户端回 ACK（ack=v+1）并进入 TIME_WAIT，服务器收到 ACK 后 CLOSED。所以通常是四包：被动方还有数据要发时，它的 ACK 与 FIN 必须分开；若它恰好无数据可发，ACK 与 FIN 也可以合并成一包，实际抓包常只见三包——三包不是协议变体，只是合并了中间两包。'
  derivation: original
  sources: []
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端
      state: TIME_WAIT
      highlight: true
    - lane: server
      id: s
      label: 服务器
      state: CLOSED
    messages:
    - id: m4
      from: c
      to: s
      label: FIN, seq=u
    - id: m5
      from: s
      to: c
      label: ACK, ack=u+1
    - id: m6
      from: s
      to: c
      label: FIN, seq=v
    - id: m7
      from: c
      to: s
      label: ACK, ack=v+1
      active: true
  log:
  - mode: 挥手
    event: FIN/ACK × 2 个方向
- id: half-close
  title: 半关闭走例：FIN 之后对方还能发什么
  tldr: 客户端说「我发完了」时，服务端剩余的响应数据照样能流完，这正是半关闭的用处。
  body: '用一个具体场景把半关闭走实：客户端发完一个请求后调用关闭写方向（发出 FIN），意思是「请求到此为止、不会再追加」，但它的读方向仍然开着。服务端收到 FIN 并回 ACK 后，知道请求已经完整（这本身就是一种有用的信号：服务端不必靠超时猜请求发完了没有），于是继续把还没算完的响应数据一段段发回来，客户端照收不误。


    等服务端的结果全部发完，它才发自己的 FIN，客户端回最后的 ACK。若协议粗暴地规定「一发 FIN 整条连接立刻全关」，这类「写完即关写、但要等长响应」的交互就只能靠应用层再约一个结束标记来模拟，麻烦且容易出错。边界情况也要知道：半关闭可以合法地持续很久，只在对端迟迟不关它那一方向时，连接才会一直挂着——所以只关写方向的一方要给自己的等待设超时，不能无限等地把连接资源耗着。'
  derivation: original
  sources: []
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端（写关、读开）
      highlight: true
    - lane: server
      id: s
      label: 服务器（继续发剩余响应）
    messages:
    - id: m13
      from: s
      to: c
      label: FIN 之后，响应数据仍可流入
      active: true
  log:
  - mode: 半关闭
    event: 关的是发送方向，不是整条连接
- id: timewait-ack
  title: TIME_WAIT 的第一重作用：给丢失的最后 ACK 兜底
  tldr: 最后一个 ACK 若丢了，对方会重传 FIN；主动关闭方还在 TIME_WAIT，才能再补一个 ACK。
  body: '挥手的最后一包 ACK 没有任何后续包来确认它——和握手里第三包一样，它丢没丢，发送方无从知道。设想这包真的丢了：被动关闭方（服务端）迟迟等不到确认，会认为自己的 FIN 丢了，于是按重传机制把 FIN 再发一次。这时主动关闭方若早已把连接状态销毁，这个重传 FIN 只能换来一个 RST，服务端会以「异常关闭」收场，应用层可能报错，日志里也会多一笔说不清的失败。


    主动关闭方留在 TIME_WAIT 里，局面就完全不同：它收到重传的 FIN 后能再次回 ACK，并重新计一遍等待时间，直到确信对方已收到确认、不会再重传为止。也就是说，TIME_WAIT 首先是一个「善后值班岗」：由发出最后一包、且对端状态悬而未决的那一方留守，专门处理对方因没收到确认而重试的尾巴。这是 2MSL 里第一个 MSL 级别等待的直接理由。'
  derivation: original
  sources:
  - ref: rfc-9293
    locator: §3.3.2 TIME-WAIT 的用途
    claim: TIME-WAIT 使主动关闭方能对重传的 FIN 再次确认，避免连接异常终止
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端（TIME_WAIT 值班）
      highlight: true
    - lane: server
      id: s
      label: 服务器（重传 FIN）
    messages:
    - id: m14
      from: s
      to: c
      label: FIN 重传（没等到 ACK）
    - id: m15
      from: c
      to: s
      label: 再 ACK 一次
      active: true
  log:
  - mode: 兜底
    event: 最后 ACK 丢失时，TIME_WAIT 接住重传的 FIN
- id: timewait
  title: TIME_WAIT 的第二重作用与工程账：2MSL 与端口
  tldr: 等满 2MSL 还为了让旧连接的残留报文在网络中过期，避免污染复用同一四元组的新连接。
  body: 'TIME_WAIT 的第二重作用面向未来：网络里可能还漂着这条旧连接的迟到报文（被绕路、被重传的旧数据段）。若这条连接刚关、四元组（源 IP、源端口、目的 IP、目的端口）立刻被一条新连接复用，旧报文一旦恰好落进新连接的序号窗口，就会被当成新数据收下，造成难以复现的数据污染。等满 2MSL，意味着任何报文在网络中存活的上限（一个 MSL）加上一个来回的余量都已耗尽，残留报文必然过期失效，四元组这才可以安全复用。时长标尺要记准：规范要求 2×MSL，MSL 的名义值是 2 分钟；Linux 实现把 TIME_WAIT 硬编码为约 60 秒，不要把名义值和实现值混为一谈。


    工程账随之而来：压测或网关场景里若每请求新建一条短连接，主动关闭方会堆出成千上万个 TIME_WAIT，本地端口先耗尽（对单个目标 IP 与端口而言，默认临时端口范围 32768–60999 只有约 2.8 万个；换一个目标又是另一份额度）。对策是连接池复用、keep-alive，以及让服务器做主动关闭方分摊——这正是推理网关默认开连接池的原因。工程注记：curl 的耗时分解里 time_connect 一项量的就是 TCP 建连耗时；跨地域调用先看这一段，再谈 TLS 与应用处理时间，排障顺序不要反。'
  derivation: original
  sources:
  - ref: rfc-9293
    locator: §3.3.2/§3.4.2 TIME-WAIT 与 MSL
    claim: TIME-WAIT 持续 2MSL、MSL 名义值 2 分钟（Linux 实现硬编码 60 秒）
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端
      state: TIME_WAIT 60s
      highlight: true
    - lane: server
      id: s
      label: 服务器
      state: CLOSED
    messages: []
  log:
  - mode: 收尾
    event: TIME_WAIT 等待后 CLOSED
  code:
    lang: shell
    code: 'ss -s                      # 看各状态连接数

      ss -tn state time-wait | wc -l   # TIME_WAIT 堆了多少'
    note: 在终端里看一看
