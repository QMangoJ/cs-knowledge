id: network/tcp-handshake
subject: network
slug: tcp-handshake
order: 1
status: published
license: CC-BY-4.0
title: TCP 三次握手与四次挥手
summary: 连接建立要三次握手、断开要四次挥手，背后是序号、确认与状态机的严丝合缝。
premise: 以浏览器（客户端）连接一台推理服务（服务器）为例，看 SYN/ACK 与 seq 号如何对齐。
overview:
- key: 一句话总结
  value: 握手是双方交换初始序号并确认对方收得到，挥手是各自关闭发送方向
- key: 为什么三次
  value: 三次握手的核心理由（RFC 9293）是防旧的重复 SYN 让双方对连接状态产生混乱，两次做不到
- key: 关键字段
  value: SYN、ACK、seq（序号）、ack（确认号 = 对方 seq + 1）
- key: 状态
  value: CLOSED → SYN_SENT/SYN_RCVD → ESTABLISHED；关闭经 FIN_WAIT/TIME_WAIT
- key: 代价
  value: 建连要 1 个 RTT 才能发数据，TLS 还要再叠加握手
- key: 在终端里看一看
  value: ss -tn state time-wait　看 TIME_WAIT 连接；tcpdump -i any port 443　抓握手包
visual: swimlane
lanes:
- id: client
  label: 客户端
- id: server
  label: 服务器
logColumns:
- key: mode
  label: 当前状态
- key: event
  label: 发生了什么
level: 基础
minutes: 16
prereq: []
objectives:
- 按顺序写出三次握手的报文与双方状态
- 用序号/确认号解释为什么两次不够
- 说清四次挥手与 TIME_WAIT 存在的理由
aiLink: 每次新建到 LLM API 的连接都要先做 TCP 握手（再叠 TLS）：连接池与 HTTP keep-alive 存在的全部理由，就是让后续调用复用已建好的连接，省掉这 1 个 RTT 的握手与慢启动。理解握手与 TIME_WAIT，才懂为什么高并发推理网关要复用连接、为什么端口会耗尽。
quiz:
- q: 三次握手第三次 ACK 的确认号应该是？
  options:
  - 客户端自己的 seq
  - 服务器 seq + 1
  - '0'
  - 服务器 seq × 2
  answer: 1
  explain: ack = 期望收到的下一个字节序号，即对方已发 seq + 1（SYN 占一个序号）。
- q: 为什么挥手是四次而握手是三次？
  options:
  - 挥手多了校验
  - 关闭是两个方向各自独立关闭：一方发 FIN 只表示自己不再发，对方还可能继续发数据
  - 协议规定的凑数
  - 服务器比较慢
  answer: 1
  explain: 建立时服务器的 SYN 与 ACK 可合并一包；关闭时被动方的 ACK 与 FIN 往往不能合并，因为它可能还有数据要发。
- q: TIME_WAIT 停留在主动关闭方，作用是？
  options:
  - 占内存
  - 保证最后的 ACK 丢了能重发，并让旧连接的残留报文在网络中消散
  - 等服务器重启
  - 做日志统计
  answer: 1
  explain: 规范要求持续 2×MSL（MSL 名义值 2 分钟），Linux 实现硬编码为 60 秒；高并发短连接下 TIME_WAIT 堆积会耗尽本地端口。
steps:
- id: why
  title: 发数据之前，为什么先要握手
  tldr: TCP 要提供可靠有序的字节流，双方必须先对齐序号起点并确认对方在线。
  body: 'TCP 承诺的是可靠、有序、不重复的字节流。要做到这一点，每一方都要知道：对方的字节从哪个序号开始数、对方确实能收到我的包、我也能收到对方的包。


    握手就是在发任何应用数据之前，先把这三件事确认完。它花掉 1 个 RTT（往返时延）——跨洲访问时这就是上百毫秒，所以连接复用如此重要。'
  derivation: original
  sources: []
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 浏览器
      state: CLOSED
      highlight: true
    - lane: server
      id: s
      label: 服务器
      state: LISTEN
    messages: []
  log:
  - mode: 准备
    event: 服务器在 LISTEN，客户端 CLOSED
- id: syn
  title: 第一次握手：SYN
  tldr: 客户端随机选初始序号 x，发 SYN 表示「我想连，我的字节从 x+1 开始」。
  body: '客户端发出 SYN 报文：SYN 标志位置 1，seq = x（x 是随机生成的初始序号 ISN，随机是为了防预测攻击）。SYN 本身不携带数据，但要占一个序号，所以之后的数据从 x + 1 开始。


    客户端进入 SYN_SENT 状态。若迟迟收不到回复，会按指数退避重传 SYN。'
  derivation: original
  sources:
  - ref: rfc-9293
    locator: §3.4/§3.5 握手与序号
    claim: SYN 占一个序号、ISN 应不可预测、三次握手防旧重复连接发起造成混乱
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 浏览器
      state: SYN_SENT
      highlight: true
    - lane: server
      id: s
      label: 服务器
      state: LISTEN
    messages:
    - id: m1
      from: c
      to: s
      label: SYN, seq=x
      active: true
  log:
  - mode: 握手 1/3
    event: 客户端发出 SYN（seq=x）
  code:
    lang: text
    code: 'SYN 报文关键字段：SYN=1, ACK=0, seq=x（随机 ISN）

      窗口、MSS 等选项也搭在这趟车上（如窗口扩大、SACK 允许）'
    note: 报文示意
- id: synack
  title: 第二次握手：SYN + ACK
  tldr: 服务器回自己的序号 y，并用 ack = x + 1 确认收到客户端的 SYN。
  body: '服务器收到 SYN 后进入 SYN_RCVD，回一个报文同时做两件事：SYN=1、seq = y（服务器自己的初始序号），以及 ACK=1、ack = x + 1（意思：你的 x 我收到了，下一个字节请从 x + 1 发）。


    这一步同时证明了「服务器能收也能发」。若服务器不回复，说明路径或服务有问题。'
  derivation: original
  sources: []
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 浏览器
      state: SYN_SENT
    - lane: server
      id: s
      label: 服务器
      state: SYN_RCVD
      highlight: true
    messages:
    - id: m2
      from: s
      to: c
      label: SYN+ACK, seq=y, ack=x+1
      active: true
  log:
  - mode: 握手 2/3
    event: 服务器回 SYN+ACK
- id: ack
  title: 第三次握手：ACK，连接建立
  tldr: 客户端回 ack = y + 1，双方进入 ESTABLISHED，可以开始发数据。
  body: '客户端收到 SYN+ACK 后回 ACK：ack = y + 1，确认服务器的序号起点。发完这包，客户端即进入 ESTABLISHED；服务器收到后也进入 ESTABLISHED。


    为什么必须有第三次？RFC 9293 给的首要理由是防「旧的重复连接发起」造成混乱：网络里迟到的旧 SYN 若让服务器直接建连，双方状态会对不上；第三次 ACK 携带的确认号能证明这回应的是本次 SYN-ACK，对不上的旧连接会被 RST 打掉。顺带地，它也确认了客户端的接收能力——两边互发并确认了 ISN，序号才算对齐。'
  derivation: original
  sources: []
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 浏览器
      state: ESTABLISHED
      highlight: true
    - lane: server
      id: s
      label: 服务器
      state: ESTABLISHED
      highlight: true
    messages:
    - id: m3
      from: c
      to: s
      label: ACK, ack=y+1
      active: true
  log:
  - mode: 握手 3/3
    event: 双方 ESTABLISHED，开始传数据
  points:
  - 三次分别确认：我能发（SYN 到达）→ 对方能收能发（SYN+ACK 到达）→ 我能收（ACK 到达）
  - SYN 与 FIN 都占一个序号，纯 ACK 不占
  mistake: 以为握手是为了「协商参数」才需要三次——参数协商搭载在前两包里就够了，第三次的根本理由是确认客户端的接收能力、防旧 SYN 误建连。
- id: data-fin
  title: 四次挥手：每个方向单独关闭
  tldr: 一方发 FIN 只关自己的发送方向；对方 ACK 后还可能继续发剩余数据，再发自己的 FIN。
  body: '关闭连接时，先关的一方（设为客户端）发 FIN（seq=u）进入 FIN_WAIT；服务器先回 ACK（ack=u+1）表示「知道你不发了」，但服务器可能还有数据没发完，连接进入半关闭状态。


    等服务器数据发完，它再发自己的 FIN（seq=v），客户端回 ACK（ack=v+1）并进入 TIME_WAIT，服务器收到 ACK 后 CLOSED。所以通常是四包：被动方还有数据要发时，它的 ACK 与 FIN 必须分开；若它恰好无数据可发，ACK 与 FIN 也可以合并成一包（实际抓包常只见三包）。'
  derivation: original
  sources: []
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端
      state: TIME_WAIT
      highlight: true
    - lane: server
      id: s
      label: 服务器
      state: CLOSED
    messages:
    - id: m4
      from: c
      to: s
      label: FIN, seq=u
    - id: m5
      from: s
      to: c
      label: ACK, ack=u+1
    - id: m6
      from: s
      to: c
      label: FIN, seq=v
    - id: m7
      from: c
      to: s
      label: ACK, ack=v+1
      active: true
  log:
  - mode: 挥手
    event: FIN/ACK × 2 个方向
- id: timewait
  title: TIME_WAIT 与工程账
  tldr: 主动关闭方要等 2×MSL 才彻底释放，短连接高并发时这是真实的资源开销。
  body: 'TIME_WAIT 按规范要等 2×MSL（MSL 是报文最大生存时间，RFC 名义值 2 分钟；Linux 实现里硬编码约 60 秒）：一是最后那个 ACK 若丢了，对方会重传 FIN，本方还在才能再 ACK；二是让这条连接的残留报文在网络中过期，避免污染下一条复用了相同四元组的新连接。


    工程账：压测时若每请求新建一条短连接，客户端会堆出成千上万个 TIME_WAIT，本地端口先耗尽（对单个目标 IP:端口而言，默认临时端口范围 32768–60999 只有约 2.8 万个；换一个目标又是另一份额度）。对策是连接池复用、keep-alive，以及让服务器做主动关闭方分摊——这正是推理网关默认开连接池的原因。


    工程注记：curl -w ''@-'' 里看 time_connect 就能单独量出 TCP 建连耗时；跨地域调用先看这一段，再谈 TLS 与应用处理时间，排障顺序不要反。'
  derivation: original
  sources:
  - ref: rfc-9293
    locator: §3.3.2/§3.4.2 TIME-WAIT 与 MSL
    claim: TIME-WAIT 持续 2MSL、MSL 名义值 2 分钟（Linux 实现硬编码 60 秒）
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端
      state: TIME_WAIT 60s
      highlight: true
    - lane: server
      id: s
      label: 服务器
      state: CLOSED
    messages: []
  log:
  - mode: 收尾
    event: TIME_WAIT 等待后 CLOSED
  code:
    lang: shell
    code: 'ss -s                      # 看各状态连接数

      ss -tn state time-wait | wc -l   # TIME_WAIT 堆了多少'
    note: 在终端里看一看
