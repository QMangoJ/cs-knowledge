status: published
license: CC-BY-4.0
title: TCP 三次握手与四次挥手
summary: TCP（Transmission Control Protocol，传输控制协议）建立连接要三次握手、断开要四次挥手，核心不是走过场，而是把「收发两本账」对平。建连时，三趟报文让双方各自挑好初始序号，并亲眼确认对方收到了自己的起点，既防住迟到的旧请求骗出幻影连接，又踩在两将军问题的理论最低线上。数据传完准备挂断时，因为收和发两条通道各自独立，哪边发完哪边先喊停，于是拆成了四次挥手。最后主动挂断的一方还要在原地多守两倍报文最大生存时间，替可能丢掉的最后一声确认兜底，并等旧包彻底消散。
premise: 你在网页上点下发送，浏览器正准备把请求发给远端的推理服务。可两台机器素未谋面：对方在不在线、彼此发的字节该从几号开始算，全都没对过账，直接发数据只会乱套。这节课就盯着这一次建连和断连：浏览器连上推理服务前，为什么要先来回招呼三趟；用完挂断时，为什么又要客气地挥四次手，还得在原地多等一分钟。
position: 本课属于计算机网络路径的第一站「建立可靠连接」板块。在发出任何网页或接口请求之前，两台机器必须先在不可靠的底层网络上把编号起点和连通性谈妥，后面的传输才站得住脚。它把连接从刚打开铺到正式传数据，下一课《一个 HTTP 请求的一生》就会顺着这条建好的通道，继续往下算域名、加密和流式输出的账。
bridge:
  next: 通道已经顺利建好、进入正式传数据的状态了。下一课我们直接沿这条现成连接出发，跟踪一次完整的 HTTPS 请求：看浏览器怎么先问出地址、用加密握手锁上通道，再把模型生成的文字一段段流式推回页面。
overview:
- key: 一句话总结
  value: 握手是为了让双方各自报出起始编号并确认对方收得到；挥手是为了各自关掉自己的发送方向。只有先对齐号码起点，后面每个字节排第几、丢没丢才对得上账。
- key: 为什么三次
  value: 两次握手挡不住网络里迟到的旧连接请求，还会让服务端不确定客户端收没收到自己的起点；三次是双向对齐编号的最少次数（RFC 9293）。
- key: 关键字段
  value: "[[SYN]]（请求建连）、[[ACK]]（确认收到）、[[seq]]（发送序号）、[[ack]]（确认号 = 对方 seq + 1）"
- key: 状态
  value: 建连：CLOSED → SYN_SENT / SYN_RCVD → ESTABLISHED；断连：经 FIN_WAIT 进入 [[TIME_WAIT]] 等满再关闭
- key: 代价
  value: 建连先花 1 个 [[RTT]]（一个来回的时间），叠上加密握手还要更多往返，这段时间里用户的第一个业务字节还没出发。如果短连接用完就扔、频繁重连，固定耗时就会占掉大头。
- key: 在终端里看一看
  value: ss -tn state time-wait　看 TIME_WAIT 连接；tcpdump -i any port 443　抓握手包
