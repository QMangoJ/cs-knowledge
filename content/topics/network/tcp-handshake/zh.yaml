objectives:
- 按顺序写出三次握手的报文与双方状态
- 用序号/确认号解释为什么两次不够
- 说清四次挥手与 TIME_WAIT 存在的理由
aiLink: 每次新建到 [[LLM]] [[API]] 的连接都要先做 TCP 握手（再叠 [[TLS]]）：连接池与 [[HTTP]] [[keep-alive]] 存在的全部理由，就是让后续调用复用已建好的连接，省掉这 1 个 RTT 的握手与慢启动。理解握手与 TIME_WAIT，才懂为什么高并发推理网关一定要维护连接池，不然光建连延迟和本地端口耗尽就能把服务拖垮。
design:
- mechanism: 用三次握手达成「最小充分」的双向对账
  problem: 网络本身会丢包、会延迟。在可能丢包的信使路上，两台机器不管互相确认多少轮，永远没法靠有限次消息实现「双方都百分之百确定对方确定了」——这就是[[两将军问题]]。
  choice: 协议干脆停在第三次：一发一收加上最后一句确认，恰好让两个方向的起始序号都被对方确认过一次；再多发第四包，也只是把「最后一包丢没丢」的猜测推给对面。
  tradeoff: 建连必须先白花 1 个往返时间才能发应用数据，跨洋就是上百毫秒；但绝大多数连接能用极低成本稳稳建起来，剩下万分之一的丢包交给超时重传兜底。
  root: 最后一条确认发出后，发送方永远没法知道它到没到——证明到达的下一包本身一样会丢，确认链条在逻辑上天生没法无限闭环。
- mechanism: 靠第三包确认号挡住迟到的旧请求
  problem: 网络里绕路的旧数据包可能迟到很久。如果一条早已作废的连接当年的建连请求（SYN）突然漂到推理服务器，服务器若只要收到 SYN 就建连，就会平白造出一条浏览器根本不想要的「幻影连接」，白占端口和内存。
  choice: 不许两次就建连，必须等第三包确认：服务器报出自己的初始序号 y 后，只认带着确认号 ack = y + 1 的回信；陈旧请求对应的回信要么不来、要么号码对不上，会被直接复位打掉。
  tradeoff: 服务器在第三包到达前必须暂存半连接记录，这带来了抗 SYN 泛洪攻击的防守成本；换来的是把幻影连接拦在建连门外，不让它混进应用层。
  root: RFC 9293 把「防止旧的重复建连请求搞乱连接」列为三次握手的首要理由——序号是每条连接私有的计数尺，只有双向亲口核对过的起点，才能当共同坐标系。
- mechanism: 四次挥手单独关流，并在 TIME_WAIT 守满 2MSL
  problem: TCP 连接是全双工的，浏览器的发送通道和推理服务的发送通道互不耽误，挂断时一方说完「我不发了」，另一方可能还有半截响应没吐完。同时，最后那声确认可能丢在半路，旧连接的迷路数据包也可能漂进刚复用同一端口的新连接里。
  choice: 两边各自发 FIN 宣布本方向结束、各自回 ACK 确认，凑成四次挥手；最后发出确认的一方（主动关闭方）不能立刻撤摊，要在 TIME_WAIT 状态守满 2 倍报文最大生存时间（[[MSL]]）。
  tradeoff: 主动关闭方要为每条已关连接保留约一分钟的状态，短连接一多就会把本地几万个临时端口占满；工程上靠长连接复用，或让服务端主动关闭来分摊端口压力。
  root: 留 1 个 MSL 是等可能重传的 FIN，再留 1 个 MSL 是让旧包的双向残留彻底过期。RFC 名义上把 MSL 定为 2 分钟（2MSL 约 4 分钟），Linux 硬编码约 60 秒，是在「防数据串线」与「尽快回收端口」之间掐出的工程折中。
quiz:
- q: 三次握手第三次 ACK 的确认号应该是？
  options:
  - 客户端自己的 seq
  - 服务器 seq + 1
  - "0"
  - 服务器 seq × 2
  answer: 1
  explain: ack = 期望收到的下一个字节序号，即对方已发 seq + 1（SYN 占一个序号）。
- q: 为什么挥手是四次而握手是三次？
  options:
  - 挥手多了校验
  - 关闭是两个方向各自独立关闭：一方发 FIN 只表示自己不再发，对方还可能继续发数据
  - 协议规定的凑数
  - 服务器比较慢
  answer: 1
  explain: 建立时服务器的 SYN 与 ACK 可合并一包；关闭时被动方的 ACK 与 FIN 往往不能合并，因为它可能还有数据要发。
- q: TIME_WAIT 停留在主动关闭方，作用是？
  options:
  - 占内存
  - 保证最后的 ACK 丢了能重发，并让旧连接的残留报文在网络中消散
  - 等服务器重启
  - 做日志统计
  answer: 1
  explain: 规范要求持续 2×MSL（MSL 名义值 2 分钟），Linux 实现硬编码为 60 秒；高并发短连接下 TIME_WAIT 堆积会耗尽本地端口。
steps:
- id: why
  title: 发数据之前，为什么要先握手
  tldr: TCP 要靠编号重传来保证字节不乱不丢，所以正式发数据前，浏览器和推理服务必须先对齐各自的序号起点，并确认双向都能收能发。
  body: |-
    在浏览器里敲完提问按下发送时，底层的网线其实只管把包裹尽力往对面扔，并不保证不丢包、不乱序。为了让上层拿到完整不乱的一串字节，[[TCP]] 给每一个发送出去的字节都编了号，靠对方按编号回复确认、发现缺号就重传，来拼出可靠、有序的字节流。注意它不管应用写了几次：你分三次写入，服务器可能一口气全读走，边界全靠应用层自己认，TCP 只死磕字节顺序。

    可既然要按编号对账，开局就躲不开三个问题：浏览器这边第一个字节算几号、推理服务那边的字节又从几号起算、双方是不是真的都能收能发？如果在没对过这本账之前就直接发请求，服务器根本分不清收到的包裹是头还是尾，缺了哪一块也没法重传。

    三次握手就是正式开聊前先把这三件事谈妥，花掉 1 个 RTT（一个来回的时间，跨洲往往上百毫秒）。有人常误以为三次是为了协商窗口大小或最大分片长度，其实这些参数前两包就能顺带写完；握手真正的核心，是让两个方向各自确认对方的起始编号，把同一把计数尺立起来。
  derivation: original
  sources: []
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 浏览器
      state: CLOSED
      highlight: true
    - lane: server
      id: s
      label: 服务器
      state: LISTEN
    messages: []
  log:
  - mode: 准备
    event: 开局状态是：服务器在 LISTEN 等人来连，客户端还在 CLOSED，一包未发
- id: syn
  title: 第一次握手：SYN，报出我的起点
  tldr: 浏览器发出第一包 SYN，随机挑一个初始序号 x（如 1000）并占掉这个号，告诉服务器「我的第一批业务字节从 1001 开始」。
  body: |-
    浏览器按下连接键，发出的第一包把标志位 [[SYN]] 置为 1，意思是「我想新建一条连接」。同时在包头写上 seq = 1000——这叫初始序号 [[ISN]]。等一下，为什么不每次都从 0 或 1 开始数？因为如果起点固定为 1，黑客不用偷看线路就能猜出接下来的编号，直接伪造数据包往你的推理连接里塞脏东西；加上固定起点更容易和以前残留的旧包撞号。所以系统每次都会随手摇一个很难猜的随机数，这里我们就拿 x = 1000 跑一遍账。

    这里最容易算错一个数字：这包 SYN 明明还没带一个字的应用数据，却要实打实地消耗掉 1 个序号。算成具体数字就是：序号 1000 被 SYN 本身占用了，等连接建好后，浏览器发出去的第一个提问字节，编号就会是 1001。为什么纯控制包也要占号？因为凡是需要对方回复确认的信号，都得占一个坑位，确认号才能清楚写明「SYN 已收到」。

    发完这包后，浏览器状态切到 SYN_SENT 开始等回音，顺带把单包最大长度 [[MSS]]、窗口扩大倍数、允许选择性重传 [[SACK]] 等小参数塞在这包里带过去。万一这包石沉大海，浏览器会按指数间隔越等越久地重传几次，实在没回音才报错断开——这就是推理网站连不上时往往要卡住数秒到数十秒才弹错误的原因。
  derivation: original
  sources:
  - ref: rfc-9293
    locator: §3.4/§3.5 握手与序号
    claim: SYN 占一个序号、ISN 应不可预测、三次握手防旧重复连接发起造成混乱
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 浏览器
      state: SYN_SENT
      highlight: true
    - lane: server
      id: s
      label: 服务器
      state: LISTEN
    messages:
    - id: m1
      from: c
      to: s
      label: SYN, seq=x
      active: true
  log:
  - mode: 握手 1/3
    event: 第一次握手：客户端发出 SYN，序号是随机选定的 x
  code:
    lang: text
    code: |-
      SYN 报文关键字段：SYN=1, ACK=0, seq=x（随机 ISN）
      窗口、MSS 等选项也搭在这趟车上（如窗口扩大、SACK 允许）
    note: 报文示意
- id: synack
  title: 第二次握手：SYN + ACK，回礼并报出你的起点
  tldr: 推理服务回发 SYN+ACK：用 ack = 1001 确认收到了浏览器的起点，同时报出自己的随机初始序号 y（如 5000），但此时还只建半连接草稿。
  body: |-
    推理服务器一直蹲在 LISTEN 监听口，收到 seq = 1000 的 SYN 后，状态切成 SYN_RCVD，并立刻回一包同时带两个标志的报文：把 [[ACK]] 置 1 写上 ack = 1001，同时把自己的 SYN 置 1 写上 seq = 5000（即服务器的 y = 5000）。这个 5000 是服务器自己随机挑的初始序号，跟浏览器的 1000 毫无关系，各自独立计数。

    看清确认号 [[ack]] 的含义：它不是「我收到的最后一个号」，而是「我已经稳妥收下 1000，下一回期待你从 1001 开始发」。发完这一包，其实已经证明了「浏览器能发、服务器能收也能发」，参数也对得差不多了。

    那为什么服务器不趁着回这一包就直接进入 ESTABLISHED 开始收发业务数据呢？因为账还没闭环：服务器现在根本不知道自己报出去的 5000 浏览器收到没有，甚至不知道刚才那包 SYN 是不是网络里绕了半天的旧幽灵。所以服务器此刻只肯在半连接队列里留一张轻量级的草稿，不敢把正式的连接资源和端口全配齐。
  derivation: original
  sources: []
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 浏览器
      state: SYN_SENT
    - lane: server
      id: s
      label: 服务器
      state: SYN_RCVD
      highlight: true
    messages:
    - id: m2
      from: s
      to: c
      label: SYN+ACK, seq=y, ack=x+1
      active: true
  log:
  - mode: 握手 2/3
    event: 第二次握手：服务器回 SYN+ACK，同时报出自己的序号 y 并确认客户端的 x
- id: ack
  title: 第三次握手：ACK，双向对账闭环
  tldr: 浏览器回发纯 ACK（ack = 5001）确认收到服务器的起点，双方这才同时进入 ESTABLISHED 正式传数据，而且这一包可以顺带捎上第一批请求。
  body: |-
    浏览器拿到服务器发来的 seq = 5000、ack = 1001，立刻明白两件事：自己的 1000 对面已经认账，而且对面的编号起点是 5000。于是它赶紧回一包纯 ACK，写上 ack = 5001，自己顺手切入 ESTABLISHED。推理服务器收到这包后，核对确认号正好等于 5000 + 1，终于确认浏览器真的收到了自己的起点，也切入 ESTABLISHED，把连接正式交给应用层。

    和 SYN 不同，纯 ACK 报文自己不消耗序号——为什么？因为确认不需要再被确认，否则确认链条就死循环了。因此浏览器紧跟着发第一批提问数据时，第一个字节依然是 1001（而不是 1002）。不仅如此，第三包 ACK 还可以顺道把第一批请求数据一块捎带着发过去，省得干等一趟。

    还要记住一条保底防线：服务器在半连接状态下，只认确认号严丝合缝等于 5001 的那一声回信；如果收到莫名其妙的序号或者根本等不到对的编号，服务器会直接回一包 [[RST]]（强制复位连接的标志）把连接斩断——下一步我们就看这条防线到底拦住了什么祸。
  derivation: original
  sources: []
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 浏览器
      state: ESTABLISHED
      highlight: true
    - lane: server
      id: s
      label: 服务器
      state: ESTABLISHED
      highlight: true
    messages:
    - id: m3
      from: c
      to: s
      label: ACK, ack=y+1
      active: true
  log:
  - mode: 握手 3/3
    event: 第三次握手完成，双方都进入 ESTABLISHED，从这一刻起可以开始传应用数据
  points:
  - 三次各自证明一件事：第一包证明浏览器能发 → 第二包证明服务器能收能发 → 第三包证明浏览器能收
  - SYN 和 FIN 都要占 1 个序号，纯 ACK 不占号
  mistake: 以为握手非要三次是为了「谈妥窗口和分片大小」——参数前两包就谈完了，第三次的核心目的是确认浏览器真能收到服务器的序号，并顺手拦住迟到的旧请求。
- id: why-not-two
  title: 为什么两次不够：挡不住迟到的幻影连接
  tldr: 如果砍成两次握手，服务器既没法确认浏览器收到了自己的起点，还会在网络里遇到迟到的旧 SYN 时平白造出无人认领的「幻影连接」。
  body: |-
    假设把规矩改成两次握手：浏览器发 SYN，推理服务器回完 SYN+ACK 就直接建连。第一个问题立刻冒出来——序号对账只完成了一半。服务器自己选的 seq = 5000 浏览器到底收到没有，服务器两眼一抹黑；要是第二包在半路丢了，浏览器以为连不上，服务器却傻傻等着收数据甚至往外吐数据，两边的计数尺根本不在一个频道上。

    第二个漏洞才是最要命的「幻影连接」。设想十分钟前浏览器发过一次建连请求（旧 SYN），半路堵车迟迟没到，浏览器等不及早重连、聊完、关掉了。可那包迷路的旧 SYN 晃晃悠悠终于漂到了推理服务器门口。如果服务器只要见 SYN 就直接建连，它就会老老实实分配内存和端口，傻等浏览器发数据——而浏览器早就忘了这件事，压根不会搭理它，白白浪费服务器资源，甚至可能把迟到的脏数据搅进当前连接。

    加上第三次握手，幻影连接一招就能拆穿：服务器收到那个迟到的旧 SYN 后，照样回一包带新序号 seq = 8800 的 SYN+ACK，进入半连接等待；浏览器一看这包莫名其妙——「我最近根本没要连你啊」，直接回一包 RST 把它掐死，根本不会发第三包确认。服务器收不到 ack = 8801，半连接草稿到期自动作废，一条幻影连接就此胎死腹中。
  derivation: original
  sources:
  - ref: rfc-9293
    locator: §3.4 建立连接与旧重复 SYN
    claim: 三次握手的首要理由是防止旧的重复连接发起造成混乱，第三次确认同时验证对端序号
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端（早已放弃旧连接）
    - lane: server
      id: s
      label: 服务器
      state: 被旧 SYN 骚扰
      highlight: true
    messages:
    - id: m8
      from: c
      to: s
      label: 迟到的旧 SYN（副本）
    - id: m9
      from: s
      to: c
      label: 无第三次确认就会误建幻影连接
      active: true
  log:
  - mode: 反例
    event: 反例说明：两次握手下，一条迟到的旧 SYN 就能骗出一条没人想要的幻影连接
- id: two-generals
  title: 为什么不握四次五次：两将军问题的边界
  tldr: 在会丢包的网络上，有限次对话永远换不来「100% 共同确定」；三次已经是双向对账的最低包数，再加次数只会白花往返时间，残余风险靠重传和超时兜底。
  body: |-
    既然第三次确认也可能在半路丢掉，那多握一次、握成四次或五次，是不是就能保证建连万无一失了？计算机理论里早用[[两将军问题]]把这条路堵死了：两位将军隔着敌军山谷通信，信使随时可能被抓，不管双方来回传多少封「我收到你确认了」的信，最后发信的那一方永远不知道自己这一封有没有安全送到。你想再等一封回信来确认？那又把同样的不安推给了对面。

    所以网络协议放弃了「绝对确定」这个伪命题，把三次握手定在「最小充分」的红线上：三包刚好让两个方向的初始序号都各自被确认过一次，这已经是能开始可靠传数据的最低条件。再往后硬加第四包、第五包，除了每次白白多付一个 RTT，确定性半点不会增加。

    至于最后那包 ACK 万一真丢了怎么办？不用在握手阶段死磕，靠日常机制兜底就行：服务器迟迟等不到第三包，超时后会自动重传第二包 SYN+ACK，或者浏览器随后发来的第一批业务数据包里本来就自带 ACK 标志，照样能顺道把服务器推入 ESTABLISHED；实在等不到，半连接草稿超时作废，不留后患。
  derivation: original
  sources:
  - ref: rfc-9293
    locator: §3.4 握手设计说明
    claim: 握手取三次完成双向序号确认，其余可靠性由重传与状态机制处理
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端
      state: 已确认对方序号
    - lane: server
      id: s
      label: 服务器
      state: 等第三包确认
      highlight: true
    messages:
    - id: m10
      from: c
      to: s
      label: ACK 是最后一包：到没到，发送方无从确知
      active: true
  log:
  - mode: 原理
    event: 结论是：不确定性只能被推后一层，不能用有限个包彻底消除
  points:
  - 三次 = 两个方向各自完成一次起点确认的最少包数，不是 100% 成功的保证
  - 再加一轮握手只是把不安踢给对方，同时白付一个 RTT
- id: seq-sync
  title: 把序号账算到底：从握手到第一批数据
  tldr: 对账记住三条铁律——数据按字节递增、SYN 和 FIN 各占 1 号、纯 ACK 不占号，看任何抓包都不会算偏一位。
  body: |-
    把前面浏览器和推理服务的数字从头串到尾，对账就彻底清晰了。开局浏览器挑 seq = 1000 发 SYN（占掉 1000），服务器挑 seq = 5000 回 SYN+ACK（占掉 5000，并写 ack = 1001），浏览器回纯 ACK（不占号，写 ack = 5001）。握手结束时，双方脑子里的游标分别停在 1001 和 5001。

    现在浏览器发来一段 200 字节的提问，包的序号写 seq = 1001，它一口气覆盖了 1001 到 1200 这两百个编号。服务器全部收齐后，回一包 ACK 写 ack = 1201——注意看，不是 1200，而是「1201 之前我都收全了，下一包请从 1201 起发」，确认号永远指向下一个期望收到的编号。紧接着推理服务吐回 300 字节答案，覆盖 5001 到 5300，浏览器便回 ack = 5301。

    到了断开阶段也是一模一样的算术：只要发出带 [[FIN]] 标志的结束包，哪怕里面零字节数据，也像 SYN 一样要吃掉 1 个序号，所以对方的确认号同样得加 1。以后看抓包或排查丢包重传，只要默念「字节占多少算多少、SYN/FIN 占 1 号、纯 ACK 占 0 号」，每一格数字都能分毫不差地对上。
  derivation: original
  sources: []
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端（数据 1001–1200）
      highlight: true
    - lane: server
      id: s
      label: 服务器（回 ack=1201）
    messages:
    - id: m11
      from: c
      to: s
      label: 数据 seq=1001, len=200
      active: true
    - id: m12
      from: s
      to: c
      label: ACK, ack=1201（下一个期望）
  log:
  - mode: 对账
    event: 算账结论：序号按字节编号，确认号永远指向下一个期望收到的字节序号
- id: data-fin
  title: 四次挥手：收和发各关各的门
  tldr: TCP 连接是全双工通道，一方发 [[FIN]] 只代表「我这边说完了」，对方可能还有半截回答没发完，于是拆成先回 ACK、等发完再发 FIN 的四次挥手。
  body: |-
    很多人纳闷：建连能把服务端的 SYN 和 ACK 捏成一包、三次搞定，为什么挂电话偏偏要四次？根子在于 TCP 连接是全双工的——浏览器的发送通道和推理服务的发送通道是两条各自独立的马路。建立时大家刚好都没发数据，服务器顺手把两条通知装进一包；挂断时情况完全不同，浏览器说完「我的提问发完了」，推理服务手头的生成答案可能才刚吐了一半。

    于是标准流程走成四步：浏览器发出一包 FIN（假设此刻它的编号走到 seq = u），自己进 FIN_WAIT 等着，意思只是「我不再往外发新字节了，但耳朵还开着」。推理服务先立刻回一包 ACK（ack = u + 1），告诉浏览器「收到，你不用发了」，好让浏览器停掉重传计时器。

    此时连接进入半关闭状态：浏览器闭嘴只听，服务器把剩下的那半段答案接着发完。等所有文字吐尽，推理服务才发出自己的 FIN（假设此时序号为 v），浏览器最后回一包 ACK（ack = v + 1）并停进 TIME_WAIT，服务器收到这最后一声确认便彻底 CLOSED。顺带一提，如果服务器当时恰好也没数据要发，它确实会把自己的 ACK 和 FIN 合并成一包，抓包里偶尔只看到三次挥手就是这么来的——四次是通用规则，三次只是顺风车特例。
  derivation: original
  sources: []
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端
      state: TIME_WAIT
      highlight: true
    - lane: server
      id: s
      label: 服务器
      state: CLOSED
    messages:
    - id: m4
      from: c
      to: s
      label: FIN, seq=u
    - id: m5
      from: s
      to: c
      label: ACK, ack=u+1
    - id: m6
      from: s
      to: c
      label: FIN, seq=v
    - id: m7
      from: c
      to: s
      label: ACK, ack=v+1
      active: true
  log:
  - mode: 挥手
    event: 挥手是 FIN 与 ACK 在两个方向上各走一遍，所以通常是四包
- id: half-close
  title: 半关闭状态：我闭嘴，但还能收完你的回答
  tldr: 半关闭不是故障卡死，而是刻意留出的单向通道：请求方先关掉写方向来明确宣告「我说完了」，同时继续把服务器剩余的流式响应稳稳收完。
  body: |-
    拿刚才的推理对话看看「半关闭」到底有什么用。如果浏览器把一个很长的请求体发完后，直接调用接口把写方向关掉（也就是发出 FIN，但读方向保持打开），服务器收到 FIN 并回完 ACK 后，根本不用傻傻猜「后面还有没有下一包」或者干等超时——FIN 本身就是一个干净利落的结束信号。

    紧接着，推理服务器从容不迫地把后台算好的结果一段段发回来，浏览器照单全收，直到服务器把最后一段发完、自己也送出 FIN 才算彻底收工。假如协议一刀切规定「只要一方发 FIN，整条连接立刻双向作废」，这种「我发完请求就等着收长响应」的交互就全得靠应用层另发明一套结束符，麻烦还容易踩坑。

    不过真实工程里也有边界要防：半关闭在协议上是完全合法的，这就意味着万一对方一直不发自己的 FIN，主动关闭方的接收端可能长期吊在连接半开状态里耗着句柄。所以实战里哪怕进入半关闭，只关写的那一侧也必须给读等待配好超时兜底，不能无限等下去。
  derivation: original
  sources: []
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端（写关、读开）
      highlight: true
    - lane: server
      id: s
      label: 服务器（继续发剩余响应）
    messages:
    - id: m13
      from: s
      to: c
      label: FIN 之后，响应数据仍可流入
      active: true
  log:
  - mode: 半关闭
    event: 半关闭关掉的只是自己的发送方向，整条连接的接收方向还开着
- id: timewait-ack
  title: TIME_WAIT 的第一份班：接住对方重传的 FIN
  tldr: 主动关闭方发出最后那包 ACK 后必须留在 [[TIME_WAIT]] 值班，因为这包万一丢在半路、服务器重传 FIN 时，原地还得有人再补一包确认。
  body: |-
    挥手的第四包——浏览器发出的最后那句 ACK——跟第三次握手面临一模一样的困境：它后面再也没有下一包了，所以这句确认到没到服务器，浏览器自己绝对不会知道。

    设想这最后一句 ACK 恰好在路上丢了。推理服务器等了一会儿没等来回音，只能认定是自己的 FIN 丢了，于是按规矩把 FIN 再重传一遍。假如浏览器发完第四包就拍拍屁股彻底销毁连接记录、回到 CLOSED，那它收到这个莫名其妙的重传 FIN 时，只能冷冰冰地回一包 RST 把连接强行打断，服务器日志里就会多出一条报错，以为连接是异常崩掉的。

    相反，只要浏览器发完最后 ACK 后乖乖留在 TIME_WAIT 里多站一会儿班，等服务器重传的 FIN 找上门，它就能认出这是老连接的善后请求，再补发一包 ACK 并把等待计时器清零重计，让服务器顺顺利利闭环收工。这就是 2MSL 里至少要有 1 个 MSL 留给「一来一回补发与确认」的直接原因。
  derivation: original
  sources:
  - ref: rfc-9293
    locator: §3.3.2 TIME-WAIT 的用途
    claim: TIME-WAIT 使主动关闭方能对重传的 FIN 再次确认，避免连接异常终止
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端（TIME_WAIT 值班）
      highlight: true
    - lane: server
      id: s
      label: 服务器（重传 FIN）
    messages:
    - id: m14
      from: s
      to: c
      label: FIN 重传（没等到 ACK）
    - id: m15
      from: c
      to: s
      label: 再 ACK 一次
      active: true
  log:
  - mode: 兜底
    event: 最后的 ACK 丢失时，还在 TIME_WAIT 值班的一方能接住对方重传的 FIN 并再确认一次
- id: timewait
  title: TIME_WAIT 的第二份班：等满 2MSL，防旧包串线
  tldr: TIME_WAIT 还要等满 2MSL（Linux 硬编码约 60 秒）好让旧连接的迟到报文彻底过期，避免污染复用同一四元组的新连接；短连接太多时，这 60 秒会先把本地端口耗光。
  body: |-
    除了替丢失的最后 ACK 值班，TIME_WAIT 还要防一桩更隐蔽的事故：新老连接串线。一条连接靠「源 IP、源端口、目的 IP、目的端口」这组[[四元组]]认门。假设浏览器刚刚挂断连向推理服务的 54321 -> 443，下一毫秒同一台机器又拿一模一样的端口重连回去。万一前一条旧连接里还有个在公网绕了远路的数据包此刻姗姗来迟，序号又刚好落进新连接的接收窗口里，新连接就会毫无防备地把它当成正经响应吞下去，直接酿成极难排查的数据污染。

    为了把这种鬼故事扼杀在摇篮里，协议要求主动关闭方必须守满 2 × MSL（[[MSL]] 指一个报文在网络里最多存活的寿命）：一个 MSL 确保我发的最后 ACK 走完单程或过期，另一个 MSL 确保对面重传过来的 FIN 或旧包也超过寿命、被路由器全部丢弃。按 RFC 9293 建议，MSL 名义上算 2 分钟，2MSL 就是 4 分钟；但现代互联网数据包根本活不了那么久，Linux 内核直接把 TIME_WAIT 硬编码成约 60 秒——记住标准名义值归名义值、Linux 实操是约 60 秒，线上排查才不会对不上口径。

    这 60 秒的账算到高并发网关头上就很痛了：对单个目标 IP 与端口而言，默认临时端口范围 32768–60999 只有约 2.8 万个。要是压测或网关每请求新建一条短连接再由自己主动关掉，很快就会把本地端口全部卡死在 TIME_WAIT 里（换一个目标虽有另一份额度，但打向同一推理上游立刻耗尽），这正是网关默认开连接池的原因。最后送你三句建连断连口诀：建连三包对起点，随机 ISN 防猜测、第三 ACK 拦幽灵；断连四包各关门，FIN 也占一格号；主动关闭守 60 秒，长连接复用保端口。
  derivation: original
  sources:
  - ref: rfc-9293
    locator: §3.3.2/§3.4.2 TIME-WAIT 与 MSL
    claim: TIME-WAIT 持续 2MSL、MSL 名义值 2 分钟（Linux 实现硬编码 60 秒）
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端
      state: TIME_WAIT 60s
      highlight: true
    - lane: server
      id: s
      label: 服务器
      state: CLOSED
    messages: []
  log:
  - mode: 收尾
    event: TIME_WAIT 等满之后，这条连接才真正进入 CLOSED、状态被回收
  code:
    lang: shell
    code: |-
      ss -s                      # 看各状态连接数
      ss -tn state time-wait | wc -l   # TIME_WAIT 堆了多少
    note: 在终端里看一看
