  log:
  - mode: 阶段 5
    event: 第五段，服务器用 SSE 把生成中的 token 一段段流式返回
  code:
    lang: typescript
    code: |-
      // 前端消费 SSE 流的最小骨架（fetch + ReadableStream）
      const res = await fetch(url, { method: 'POST', body, headers });
      const reader = res.body!.getReader(); const dec = new TextDecoder();
      let buf = '';
      for (;;) { const { done, value } = await reader.read(); if (done) break;
        buf += dec.decode(value, { stream: true });
        const events = buf.split('\n\n'); buf = events.pop()!;   // 事件以空行分隔，尾巴留给下一块
        for (const ev of events) for (const line of ev.split('\n'))
          if (line.startsWith('data: ')) { const p = line.slice(6);
            if (p === '[DONE]') return;                          // 厂商约定的结束标记，不是 JSON
            render(JSON.parse(p)); } }
    note: 已含跨块缓冲与 [DONE] 处理；真实代码还要处理断线重发与错误事件
  points:
  - 首 token 时间（TTFT）决定体感，生下全文的时间决定总时长，两者要分开看
  - 流式不减少总生成时间，只是把等待摊开并提前呈现
- id: sse-fields
  title: SSE 的事件字段与重连：id、retry 与 Last-Event-ID
  tldr: 流式能跑之后，还剩断线怎么办这个尾巴：每个事件可带 id 与 event 类型；断线后 EventSource（浏览器原生的 SSE 客户端）自动带上 Last-Event-ID（最后收到的事件编号请求头）续接——但这份自动只属于 GET 场景，边界要划清。
  body: >-
    SSE 事件不止有 data。一个事件块里可以出现四类行：data 是正文（多行 data 会被拼成一段、用换行连接）、event 给事件起类型名、id 给这个事件编号、retry
    告诉客户端断线后隔多少毫秒再重连；以冒号开头的行是注释，常被拿来发心跳保活，防止空闲连接被中间设备掐掉。


    重连是 SSE 容易被用错的一半。浏览器原生的 EventSource 在连接断开后会自动重连，并在请求头里带上 Last-Event-ID（值是客户端收到的最后一个事件 id）；服务端据此只补发该 id
    之后的事件，客户端就能无缝续上、不重不漏。但注意边界：EventSource 只能发 GET 请求；而 LLM API 是 POST 加 fetch
    读流，断了不会有人替你重连，应用要自己决定是重发整个请求、还是放弃这次生成。把「SSE 会自动重连」当成普适结论，是接入流式 API 时最常见的误会之一。
  derivation: original
  sources:
  - ref: mdn-sse
    locator: Using server-sent events（事件字段、重连与 Last-Event-ID）
    claim: SSE 事件可含 data/event/id/retry 字段，EventSource 断线自动重连并发送 Last-Event-ID 请求头
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: EventSource（自动重连）
      highlight: true
    - lane: server
      id: s
      label: 服务器（按 id 补发）
    messages:
    - id: m12
      from: c
      to: s
      label: 重连请求头 Last-Event-ID 等于 42
      active: true
    - id: m13
      from: s
      to: c
      label: 只补发 id 大于 42 的事件
  log:
  - mode: 重连
    event: SSE 靠事件 id 实现断线后的断点续接，而不是把整条流重发一遍
- id: cache-intro
  title: 顺带一瞥：HTTP 缓存语义为什么也在这条链路上
  tldr: 顺着这条链路再瞥一眼缓存，因为它和流式恰好是一对反义词：静态资源靠 [[Cache-Control]] 与验证头省掉整次请求；流式 API 响应则必须明确禁止缓存，混了会出大问题。
  body: >-
    同是 HTTP 响应，缓存语义天差地别。普通 GET 响应可以带 Cache-Control（如 max-age 指定多少秒内直接用本地副本）和 [[ETag]] 这类验证标识：副本过期后，客户端带 [[If-None-Match]]
    问服务端「变了没」，没变就回一个无正文的 [[304]]，省下整个响应体的传输。静态资源、文档、图片靠这套机制把大量重复请求消灭在客户端本地，这也是 CDN 能缓存的前提——CDN 本质上是部署在网络边缘的共享缓存。


    反过来，流式生成响应是每个请求独一无二的结果，绝不能被任何缓存复用：API
    通常显式标注不缓存，网关与代理也不应把它当副本留存。若某个中间环节误把流式响应按普通响应缓存或缓冲，表现就是别人看到你的回答、或流变成一坨一次性吐出。可缓存性由响应头声明决定：同一条链路上，静态内容拼命缓存、生成内容坚决不缓存。
  derivation: original
  sources:
  - ref: rfc-9110
    locator: §13/§15 HTTP 缓存与条件请求
    claim: Cache-Control 控制缓存新鲜期，ETag 与条件请求可让未变更资源以 304 响应免传正文
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端（缓存/验证）
    - lane: server
      id: s
      label: 服务器/CDN
      highlight: true
    messages:
    - id: m14
      from: c
      to: s
      label: 静态资源可缓存；生成流标注不缓存
      active: true
  log:
  - mode: 缓存
    event: 同一条链路上，静态内容与生成内容执行的是两种相反的缓存策略
- id: ws
  title: SSE 与 WebSocket 的区别
  tldr: 流式讲完，总有人问为什么不用 WebSocket。这一步正面对比：需要双向实时才上 WebSocket；单向推送用 SSE 就够了，还白得 HTTP 的全部基础设施。
  body: >-
    WebSocket 是在 HTTP 升级握手后切换成的独立全双工协议：双方随时互发消息，适合聊天、协作编辑、游戏。但它脱离了普通 HTTP 语义，代理、负载均衡、断线重连都要自己操心。


    SSE 只是「一个迟迟不结束的普通 HTTP 响应」，单向（服务端→客户端）恰好匹配 LLM 生成场景，浏览器与网关天然支持。所以主流 LLM API 都选 SSE；只有需要客户端持续上行（如实时语音）时才考虑
    WebSocket。选型判据一句话：数据流方向是单向还是双向——单向需求硬套 WebSocket，等于为用不上的能力支付代理穿透、心跳、重连状态机全部自维护的成本。
  derivation: original
  sources:
  - ref: rfc-6455
    locator: 摘要与 §4 升级握手
    claim: WebSocket 经 HTTP 升级握手后切换为独立全双工协议，协议本身不规定重连
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端
    - lane: server
      id: s
      label: 服务器
    messages:
    - id: m8
      from: s
      to: c
      label: SSE：单向流（够用于 token 推送）
      active: true
    - id: m9
      from: c
      to: s
      label: WebSocket：双向消息
  log:
  - mode: 对比
    event: SSE 与 WebSocket 的选型判据是数据流方向：单向用 SSE，双向才上 WebSocket
  mistake: 以为流式必须用 WebSocket——对单向生成流，SSE 更简单且与 HTTP 基础设施完全兼容。
- id: buffering
  title: 收尾账：TTFT 的构成与代理缓冲这个坑
  tldr: 最后一站收成一笔排障账：用户感知的首 token 时间等于建连、排队、生成首 token 与中间环节缓冲之和，其中缓冲最阴险——前面每一段都在这笔账里有自己的位置。
  body: >-
    把整课收成一个排障视角：用户感知的首 token 时间（TTFT）可以拆成四段——建连时间（DNS 加 TCP 加 TLS，复用连接后约等于零）、服务端排队与预填充时间（请求在网关排队、模型读完提示词）、生成第一个 token
    的时间、以及数据在回程各环节被耽搁的时间。四段里最后一段最阴险：某些代理默认缓冲响应（proxy buffering），会把逐块到达的 token 攒成一大坨再统一发给客户端，表现为「等很久、然后哗一下全出来」或「流式但一卡一卡」。


    修法通常在网关侧：对流式路由关闭响应缓冲，并确保没有中间层把 chunked 转成带总长度的普通响应。验证方法：用 curl -N 直连后端与经网关各测一次，时间戳一比就知道缓冲发生在哪一跳。排查顺序建议：先量 TTFT
    四段、再动配置，不要一上来就怀疑模型生成慢。
  derivation: original
  sources: []
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端（等首 token）
    - lane: server
      id: s
      label: 网关/代理（可能在缓冲）
      highlight: true
    messages:
    - id: m15
      from: s
      to: c
      label: 被攒成一大坨的 token 流
      active: true
  log:
  - mode: 排障
    event: 排障时把 TTFT 拆成四段逐段定位，不要一上来就怀疑模型生成慢
