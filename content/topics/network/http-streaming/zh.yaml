    event: 靠事件 id 实现断点续接，而非重发全流
- id: cache-intro
  title: 顺带一瞥：HTTP 缓存语义为什么也在这条链路上
  tldr: 静态资源靠 Cache-Control 与验证头省掉整次请求；流式 API 响应则必须明确禁止缓存。
  body: '同是 HTTP 响应，缓存语义天差地别，先建立一个引子级的认识。普通 GET 响应可以带 Cache-Control（比如 max-age 指定多少秒内直接用本地副本、连请求都不用发）和 ETag 这类验证标识：副本过期后，客户端带 If-None-Match 问服务端「变了没」，没变就回一个无正文的 304，省下整个响应体的传输。静态资源、文档、图片靠这套机制把大量重复请求消灭在客户端本地，这也是 CDN 能缓存的前提——CDN 本质上是部署在网络边缘的共享缓存。


    反过来，流式生成响应是每个请求独一无二的结果，绝不能被任何缓存复用：API 通常显式标注不缓存，网关与代理也不应把 token 流攒下来当副本。若某个中间环节误把流式响应按普通响应缓存或缓冲，表现就是别人看到你的回答、或流变成一坨一次性吐出。记住对比即可：可缓存性由响应头声明决定，同一条链路上，静态内容拼命缓存、生成内容坚决不缓存。细节（缓存键、Vary、私有与共享缓存之分）留待专门主题展开。'
  derivation: original
  sources:
  - ref: rfc-9110
    locator: §13/§15 HTTP 缓存与条件请求
    claim: Cache-Control 控制缓存新鲜期，ETag 与条件请求可让未变更资源以 304 响应免传正文
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端（缓存/验证）
    - lane: server
      id: s
      label: 服务器/CDN
      highlight: true
    messages:
    - id: m14
      from: c
      to: s
      label: 静态资源可缓存；生成流标注不缓存
      active: true
  log:
  - mode: 缓存
    event: 同一条链路，两种相反的缓存策略
- id: ws
  title: SSE 与 WebSocket 的区别
  tldr: 需要双向实时才上 WebSocket；单向推送用 SSE 就够了，还白得 HTTP 的全部基础设施。
  body: 'WebSocket 是在 HTTP 升级握手后切换成的独立全双工协议：双方随时互发消息，适合聊天、协作编辑、游戏。但它脱离了普通 HTTP 语义，代理、负载均衡、断线重连都要自己操心。


    SSE 只是「一个迟迟不结束的普通 HTTP 响应」，单向（服务端→客户端）恰好匹配 LLM 生成场景，浏览器与网关天然支持。重连要分清：用浏览器的 EventSource（只能 GET）时断线会自动重连并补发 Last-Event-ID；但 LLM API 是 POST 请求、走 fetch 读流，没有自动重连，断了要应用自己重发请求。所以主流 LLM API 都选 SSE；只有需要客户端持续上行（如实时语音）时才考虑 WebSocket。选型判据一句话：数据流方向是单向还是双向——单向需求硬套 WebSocket，等于为用不上的能力支付代理穿透、心跳、重连状态机全部自维护的成本。'
  derivation: original
  sources:
  - ref: rfc-6455
    locator: 摘要与 §4 升级握手
    claim: WebSocket 经 HTTP 升级握手后切换为独立全双工协议，协议本身不规定重连
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端
    - lane: server
      id: s
      label: 服务器
    messages:
    - id: m8
      from: s
      to: c
      label: SSE：单向流（够用于 token 推送）
      active: true
    - id: m9
      from: c
      to: s
      label: WebSocket：双向消息
  log:
  - mode: 对比
    event: 按方向需求选协议
  mistake: 以为流式必须用 WebSocket——对单向生成流，SSE 更简单且与 HTTP 基础设施完全兼容。
- id: buffering
  title: 收尾账：TTFT 的构成与代理缓冲这个坑
  tldr: 首 token 时间等于建连、排队、生成首 token 与中间环节缓冲之和，其中缓冲最阴险。
  body: '把整课收成一个排障视角：用户感知的首 token 时间（TTFT）可以拆成四段——建连时间（DNS 加 TCP 加 TLS，复用连接后约等于零）、服务端排队与预填充时间（请求在网关排队、模型读完提示词）、生成第一个 token 的时间、以及数据在回程各环节被耽搁的时间。前两段可以用时间戳打点量出来，最后一段最阴险：某些代理默认缓冲响应（proxy buffering），会把逐块到达的 token 攒成一大坨再统一发给客户端，功能没错但流式体感全毁，表现为「等很久、然后哗一下全出来」或「流式但一卡一卡」。


    修法通常在网关侧：对流式路由关闭响应缓冲、或按响应类型单独配置，并确保没有中间层把 chunked 转成带总长度的普通响应。验证方法也很朴素：用 curl -N 直连后端与经网关各测一次，逐块到达的时间戳一比就知道缓冲发生在哪一跳。排查顺序建议：先量 TTFT 四段、再动配置，不要一上来就怀疑模型生成慢。'
  derivation: original
  sources: []
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端（等首 token）
    - lane: server
      id: s
      label: 网关/代理（可能在缓冲）
      highlight: true
    messages:
    - id: m15
      from: s
      to: c
      label: 被攒成一大坨的 token 流
      active: true
  log:
  - mode: 排障
    event: TTFT 拆四段，逐段定位
