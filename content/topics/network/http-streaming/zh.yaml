- id: client
  label: 客户端
- id: server
  label: 服务器
logColumns:
- key: mode
  label: 当前状态
- key: event
  label: 发生了什么
level: 基础
minutes: 32
prereq:
- network/tcp-handshake
objectives:
- 按时间顺序列出一次 HTTPS 请求的全部阶段与 RTT 账
- 说清 TLS 握手做了哪三件事
- 解释 LLM API 用 SSE 流式的原因与它同 WebSocket 的区别
aiLink: 你每天调的 LLM API 就是这一课本身：首 token 延迟里藏着 DNS/TCP/TLS 的握手账，流式输出用 SSE 把生成中的 token 逐块推给前端。理解 chunked 与 SSE，就理解为什么前端要用 ReadableStream 读响应、为什么连接复用能显著降低首字延迟。
design:
- mechanism: '流式响应的机制是把「一个响应」拆开时间维度：响应头先单独回来宣布开始，随后正文以 chunked 分块或事件帧的形式逐段下发，连接保持打开直到服务端明确宣告结束，客户端边收边解析边渲染。'
  problem: 'LLM 生成一次回答要数秒到数十秒，若等全部生成完才一次性返回，用户要对着空白界面等完全程，网关与浏览器还可能因长时间无数据而超时断开——等待被集中成了一段最难熬的长空白。'
  choice: '所以选择长连接逐块发：第一个 token 一生成就立刻下发，首字节延迟从「整段生成时间」压回「生成第一个 token 的时间」，后续 token 在用户阅读前文的同时在后台继续生成并流过来。'
  tradeoff: '代价是复杂度转移：客户端要维护增量解析状态、处理半途断线与半截内容，服务端连接被长时间占用，中间代理的缓冲策略也必须逐个适配——流式省的是感知延迟，不是总资源消耗。'
  root: '根本量是两种时延的区别：总时延由生成总量决定，流式改不了；但人感知的等待主要由首字节延迟与呈现连续性决定，把数据在时间上摊开交付，就能让感知等待远小于总时延。'
- mechanism: '连接复用（keep-alive）的机制是让一条已完成 DNS、TCP、TLS 全部握手的连接连续承载多个请求响应，浏览器与 API 客户端都维护连接池，按域名复用空闲连接，而不是每个请求重新建连。'
  problem: '冷连接的固定成本是串行叠加的：DNS 约一个往返、TCP 握手一个 RTT、TLS 1.3 再加一个 RTT，跨洋场景光建连就要数百毫秒；若每个 API 调用都重付一遍，首 token 延迟会被握手账直接主导。'
  choice: '选择以连接池换延迟：复用摊薄了握手成本，后续请求近乎零建连开销即可发数据；同时限制每个域名的并发连接数与空闲连接存活时间，防止连接资源被无限期地占住不放。'
  tradeoff: '代价是长连接要有人维护：服务端要为每条空闲连接保留状态，负载均衡时连接的亲和性会让流量分布不均，半开连接（对端已消失而本端不知）还会让复用时踩到已死的连接需要重试。'
  root: '底层原理是固定成本摊销：握手成本只与往返次数有关、与请求大小无关，所以请求越小越频繁，复用省下的比例越大——这正是高频小请求的 LLM 网关比低频大下载更依赖连接池的原因。'
quiz:
- q: 第一次访问一个 HTTPS 站点，见到第一个数据字节前大约要几个 RTT？
  options:
  - '0'
  - DNS 1 + TCP 1 + TLS（1.3 为 1），冷启动约 3 个（TLS 1.2 则约 4 个）
  - 10 个以上
  - 与 RTT 无关
  answer: 1
  explain: DNS、TCP 握手、TLS 握手（TLS 1.3 为 1 个）串行叠加；这也是连接复用与就近接入值钱的原因。
- q: TLS 握手没有做的事是？
  options:
  - 验证服务器证书身份
  - 协商对称会话密钥
  - 把之后的数据用 RSA 逐字节加密
  - 协商加密套件
  answer: 2
  explain: TLS 1.3 里证书的签名用来验证身份、(EC)DHE 用来协商密钥，数据本身用协商出的对称密钥做 AEAD 加密。
- q: LLM API 用 SSE 而不是等全部生成完再返回，是因为？
  options:
  - 省流量
  - 生成要数秒到数十秒，流式让首 token 尽快显示，用户体验与超时风险都好得多
  - SSE 更安全
  - 浏览器只支持 SSE
  answer: 1
  explain: 流式把「等全部生成」的长尾延迟变成逐 token 呈现；服务端也无需在内存里攒完整响应。
steps:
- id: dns-tcp
  title: 先把路修好：DNS + TCP
  tldr: 域名先解析成 IP，再完成 TCP 三次握手，应用数据才有通道。
  body: '浏览器先查 DNS（下一主题细讲）拿到服务器 IP；然后与该 IP 的 443 端口做 TCP 三次握手（上一主题）。这两步没完成之前，一个字节的应用数据都发不出去：DNS 命中缓存时近乎 0、问递归解析器约 1 个 RTT 起（未命中时解析器还要逐级问根/TLD/权威，更多），TCP 握手再 1 个 RTT。


    好在浏览器会缓存 DNS、复用已有连接——第二次请求往往可以直接跳到发数据。这笔账值得单独拎出来算：所有阶段都是串行的，时延只能相加不能并行抵消；本机到同城服务器 RTT 约几毫秒时总账不显眼，跨洋 RTT 达到一两百毫秒时，光这两步就是小半秒。所谓「首屏慢」，很多时候慢的不是页面本身，而是见到第一个字节之前这段纯等待。'
  derivation: original
  sources: []
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 浏览器
      state: 解析+握手
      highlight: true
    - lane: server
      id: s
      label: 服务器
      state: '443'
    messages:
    - id: m1
      from: c
      to: s
      label: TCP 三次握手
      active: true
  log:
  - mode: 阶段 1–2
    event: DNS 解析 + TCP 建连
- id: tls
  title: TLS 握手：验明身份，约定密钥
  tldr: 证书证明「你连的真是它」，双方协商出只有彼此知道的会话密钥。
  body: 'TCP 之上再叠一层 TLS。TLS 1.3 的握手用 1 个 RTT 做三件事：协商加密套件、验证服务器身份、协商出会话密钥。具体机制要分清三者的分工：服务器证书上的签名用来验证身份（证明对端持有该域名证书对应的私钥、且证书由受信任的 CA 签发）；密钥协商靠 (EC)DHE 这类临时密钥交换，双方各出随机材料算出相同的共享秘密，且私钥材料不经过网络；之后真正加密数据的，是从共享秘密派生出的对称会话密钥，加密方式是 AEAD（带完整性校验的对称加密）。


    所以「用 RSA 加密所有数据」是经典误解：非对称密码只在握手里做签名验身份与密钥协商这类低频动作，海量数据全程走快的对称加密。没有 TLS，路径上的任何中间节点都能看光、篡改你的请求——调用付费 API 的密钥也会裸奔。TLS 1.3 相比 1.2 把全握手从 2 个 RTT 压到 1 个，靠的正是把密钥份额提前塞进第一包 ClientHello。'
  derivation: original
  sources:
  - ref: rfc-8446
    locator: §1.2/§2 TLS 1.3 握手
    claim: TLS 1.3 全握手 1 个 RTT，(EC)DHE 协商密钥、证书签名验身份、数据用 AEAD 对称加密
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 浏览器
      state: 验证证书
      highlight: true
    - lane: server
      id: s
      label: 服务器
      state: 出示证书
    messages:
    - id: m2
      from: c
      to: s
      label: ClientHello + 密钥份额
    - id: m3
      from: s
      to: c
      label: 证书 + 服务器密钥份额
      active: true
  log:
  - mode: 阶段 3
    event: TLS 1.3 握手（1 RTT）
  code:
    lang: text
    code: 'TLS 1.3 握手（简化）：

      ClientHello（套件 + 客户端密钥份额） →

      ← ServerHello（选定套件 + 服务器密钥份额）+ 证书 + Finished

      双方各自算出相同会话密钥 → 之后全程对称加密'
    note: TLS 1.3 比 1.2 少一个 RTT
- id: request
  title: 发出请求：方法、路径、头、体
  tldr: 请求行 + 头部 + 可选的体；头部携带认证、内容类型与流式声明。
  body: '通道建好，浏览器发出请求（以 HTTP/1.1 为例）：第一行是方法与路径（POST /v1/chat/completions），随后是头部——Authorization 携带 API 密钥、Content-Type: application/json 指定体是 JSON，推理请求还会在体里写 stream: true 要求流式（这是 LLM API 厂商的约定字段，不是 HTTP 标准）。


    服务器按头部做认证、限流与路由，再决定由哪个后端处理。这一步的解析与校验通常是毫秒级，真正的等待在生成阶段。这里有个容易忽略的语义点：请求是否「幂等」决定了失败时能不能安全重试——GET 这类读操作重试无副作用，POST 生成请求盲目重试可能重复计费或重复下单，所以客户端的重试策略必须按方法与业务语义区分，不能一律自动重发。连接中途断掉时同理：先分清请求有没有被服务端收到、处理到哪一步，再决定重发还是查询状态。'
  derivation: original
  sources:
  - ref: rfc-9110
    locator: §9 方法语义与幂等性
    claim: HTTP 方法有安全与幂等语义之分，重试策略应据此区分
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 浏览器
      state: 已发请求
      highlight: true
    - lane: server
      id: s
      label: 服务器
      state: 认证/路由/排队
    messages:
    - id: m4
      from: c
      to: s
      label: POST /v1/chat（stream:true）
      active: true
  log:
  - mode: 阶段 4
    event: HTTP 请求发出
- id: keepalive
  title: keep-alive 与连接复用：握手账只付一次
  tldr: 一条连接连续跑多个请求，DNS/TCP/TLS 的固定成本被摊薄到近乎为零。
  body: 'HTTP/1.0 时代每个请求都要新建一条连接，握手账逐请求重付；keep-alive（HTTP/1.1 起默认开启）把规则改成：一次响应结束不等于连接关闭，连接回到空闲池里等下一个请求复用。算一笔账：冷连接见数据前要付 DNS 约 1 次往返 + TCP 1 个 RTT + TLS 1.3 的 1 个 RTT，跨洋 RTT 按 150 毫秒算就是约 450 毫秒的纯等待；复用连接的后续请求这笔账是 0，直接从发请求开始。对一个页面几十个资源、或一个网关每秒成千上万次小调用的场景，复用与否就是数倍的延迟差距。


    复用也有它的账要管：连接不能无限复用，服务端会设空闲超时与单连接最大请求数，超时后由一方主动关闭；客户端池子若捡到一条已被对端悄悄关掉的半开连接，第一次复用就会失败，需要识别并换新连接重试。长连接还与负载均衡相互作用：一条连接上的所有请求都落在同一台后端，扩缩容与下线时要考虑连接排空，不能把机器一关了之。'
  derivation: original
  sources:
  - ref: rfc-9110
    locator: §9.3/§9.4 连接复用与关闭
    claim: HTTP/1.1 连接默认可复用承载多个请求，服务端可通过超时与 Connection 头管理连接生命周期
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 浏览器（连接池）
      highlight: true
    - lane: server
      id: s
      label: 服务器
    messages:
    - id: m10
      from: c
      to: s
      label: 请求 1、2、3 共用同一条连接
      active: true
  log:
  - mode: 复用
    event: 握手成本被多个请求摊薄
- id: chunked
  title: chunked 编码走例：不知道总长度怎么发
  tldr: 没有 Content-Length 时，每块数据前标自己的长度，最后一块长度为 0 表示结束。
  body: '普通响应靠 Content-Length 告诉客户端「正文一共多少字节」，读满即止。但流式响应在发第一个字节时根本不知道总长度——生成还没结束，长度无从谈起。HTTP/1.1 的解法是 chunked 传输编码：响应头写 Transfer-Encoding: chunked 代替 Content-Length，正文切成一块块发，每块的格式是「本块字节数（十六进制）+ 换行 + 本块数据 + 换行」，最后发一块长度为 0 的块宣告正文结束。


    用一个小例子走一遍线缆上的样子：先发 5、换行、hello、换行，表示一块 5 字节的数据 hello；再发 6、换行和 world 加感叹号那一块；最后发 0 与换行，正文到此为止。客户端的解析器就是个计数状态机：读长度、按长度取数据、循环，直到读到 0。注意 chunked 切的是传输层的块，与 SSE 事件、与 token 都不对齐：一块可能装半个事件，也可能装三个事件，所以业务层解析必须自己再攒一层缓冲——这正是后面代码里要维护 buf 的原因。在 HTTP/2 里没有 chunked 这个概念了，等价功能由 DATA 帧的 END_STREAM 标志承担。'
  derivation: original
  sources:
  - ref: rfc-9110
    locator: §7.1 chunked 传输编码
    claim: chunked 编码以十六进制长度前缀逐块发送正文，零长度块标志正文结束
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端（按长度逐块解析）
    - lane: server
      id: s
      label: 服务器（逐块发出）
      highlight: true
    messages:
    - id: m11
      from: s
      to: c
      label: 5 hello / 6 world! / 0 结束
      active: true
  log:
  - mode: 编码
    event: 长度前缀分块，零块收尾
  code:
    lang: text
    code: 'Transfer-Encoding: chunked 的线上样子：

      5\r\n hello\r\n 6\r\n world!\r\n 0\r\n\r\n

      （数字是十六进制字节数；0 长度块 = 正文结束）'
    note: chunked 块与 SSE 事件边界无关，业务层要自己攒缓冲
- id: stream
  title: 流式响应：边生成边发（SSE）
  tldr: 服务器用 chunked 分块传输逐段发 token，前端逐段解析渲染，不等全文。
  body: '模型生成是逐个 token 的，可能持续几秒到几十秒。若等全部生成完再一次性返回，用户要盯着空白等完全程，网关与浏览器也容易超时。


    流式做法：响应头先回来（状态 200、Content-Type: text/event-stream），随后服务器把数据一块块发（HTTP/1.1 下通常是 chunked 编码；HTTP/2 则用流式 DATA 帧）。SSE 格式里每个事件由一行或多行 data: 字段组成、以一个空行结束，里面装着新生成的 token；OpenAI 等 API 约定最后再发一个 data: [DONE] 表示生成结束（这是厂商约定，不是 SSE 标准的一部分）。前端用 fetch 的 ReadableStream 边读边追加到界面上——你看到的打字机效果就是这么来的。两个指标要分开看：首 token 时间（TTFT）决定体感顺不顺，生成全文的总时长决定任务何时真正完成，流式优化的是前者，后者由模型速度决定，两者不能混成一句「流式更快」。'
  derivation: original
  sources:
  - ref: mdn-sse
    locator: Using server-sent events（事件流格式与 EventSource 重连）
    claim: SSE 事件由 data 字段组成、以空行结束；自动重连是 EventSource 的行为
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 浏览器
      state: 逐段渲染
      highlight: true
    - lane: server
      id: s
      label: 服务器
      state: 逐 token 生成
    messages:
    - id: m5
      from: s
      to: c
      label: 'data: {token: "你"}'
    - id: m6
      from: s
      to: c
      label: 'data: {token: "好"}'
    - id: m7
      from: s
      to: c
      label: 'data: [DONE]'
      active: true
  log:
  - mode: 阶段 5
    event: SSE 流式返回 token
  code:
    lang: typescript
    code: "// 前端消费 SSE 流的最小骨架（fetch + ReadableStream）\nconst res = await fetch(url, { method: 'POST', body, headers });\nconst reader = res.body!.getReader(); const dec = new TextDecoder();\nlet buf = '';\nfor (;;) { const { done, value } = await reader.read(); if (done) break;\n  buf += dec.decode(value, { stream: true });\n  const events = buf.split('\\n\\n'); buf = events.pop()!;   // 事件以空行分隔，尾巴留给下一块\n  for (const ev of events) for (const line of ev.split('\\n'))\n    if (line.startsWith('data: ')) { const p = line.slice(6);\n      if (p === '[DONE]') return;                          // 厂商约定的结束标记，不是 JSON\n      render(JSON.parse(p)); } }"
    note: 已含跨块缓冲与 [DONE] 处理；真实代码还要处理断线重发与错误事件
  points:
  - 首 token 时间（TTFT）决定体感，生下全文的时间决定总时长，两者要分开看
  - 流式不减少总生成时间，只是把等待摊开并提前呈现
- id: sse-fields
  title: SSE 的事件字段与重连：id、retry 与 Last-Event-ID
  tldr: 每个事件可带 id 与 event 类型；断线后 EventSource 自动带上 Last-Event-ID 续接。
  body: 'SSE 事件不止有 data。一个事件块里可以出现四类行：data 是正文（多行 data 会被拼成一段、用换行连接）、event 给事件起类型名（客户端可按类型分别监听）、id 给这个事件编号、retry 告诉客户端断线后隔多少毫秒再重连；以冒号开头的行是注释，常被服务端拿来发心跳保活，防止空闲连接被中间设备掐掉。事件之间仍以一个空行分隔，这与上一课的格式规则一致。


    重连机制是 SSE 设计里容易被用错的一半。浏览器原生的 EventSource 在连接断开后会自动重连，并且自动在请求头里带上 Last-Event-ID（值是客户端收到的最后一个事件 id）；服务端据此只补发该 id 之后的事件，客户端就能无缝续上、不重不漏。但注意两条边界：EventSource 只能发 GET 请求，没有自动重连兜底的是另一条路——LLM API 是 POST 加 fetch 读流，断了不会有人替你重连，应用要自己决定是重发整个请求、还是放弃这次生成。把「SSE 会自动重连」当成普适结论，是接入流式 API 时最常见的误会之一。'
  derivation: original
  sources:
  - ref: mdn-sse
    locator: Using server-sent events（事件字段、重连与 Last-Event-ID）
    claim: SSE 事件可含 data/event/id/retry 字段，EventSource 断线自动重连并发送 Last-Event-ID 请求头
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: EventSource（自动重连）
      highlight: true
    - lane: server
      id: s
      label: 服务器（按 id 补发）
    messages:
    - id: m12
      from: c
      to: s
      label: 重连请求头 Last-Event-ID 等于 42
      active: true
    - id: m13
      from: s
      to: c
      label: 只补发 id 大于 42 的事件
  log:
