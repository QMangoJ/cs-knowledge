title: 一个 HTTP 请求的一生：从点击到流式响应
summary: 一次完整的加密网页或大模型接口请求，并不是发一封信出去就坐等回音，而是要串行闯过查地址、TCP 建连、TLS 加密握手与正式收发四道关，冷启动往往要先等约 3 个往返才见到第一个业务字节。之所以推理接口还要把回答切块流式推送，是因为生成全文动辄十几秒，必须让服务器边算边往外推、浏览器边收边往页面上画，才能把用户的等待感压下来。顺着这条链路，你还会看清连接复用怎么把建连账摊薄成零、静态图和动态流为什么执行相反的缓存规矩，以及为什么首字卡顿常常是中间代理在暗中攒包。
premise: 你在聊天框里敲完问题按下回车，浏览器向 https://api.example.com/v1/chat 发出请求。从指尖离开键盘那一毫秒，到屏幕上蹦出回答的第一个字，这期间数据包到底在网线上来回跑了多少趟？模型还没想完后面的句子，前半截回答又是怎么一格一格挤到屏幕上的？这节课就全程盯住这一次对话请求，把从点击到字落屏幕的每一毫秒拆开算清楚。
position: 本课属于计算机网络「一次请求的旅程」板块，紧接上一课《TCP 三次握手与四次挥手》把连接通道铺平之后往下走：既然双方的收发序号已经对齐，请求究竟怎么通过加密认证把消息发出去，又怎么把结果一段段接回来？开头域名查地址那一步在本课先按一趟概算，下一课《DNS 解析与 CDN》就会专门把查名字和就近接入的细账展开。
bridge:
  prev: 上一课我们花了 1 个往返时间，让浏览器和服务器靠三次握手对齐了字节序号、打通了连接。这一课从通道刚通的那一刻接着跑，把一次加密流式请求的剩余路程补齐，算清在见到第一个返回字之前到底付了几趟往返。
  next: 这一课开头我们把「把域名翻译成 IP 地址」顺手记成了一笔固定开销。下一课专门回到这第一步：看看浏览器没缓存时，解析器怎么一层层问遍全球域名系统找到准确地址，又怎么借内容分发网络把你引到离自己最近的机房。
overview:
- key: 一句话总结
  value: 冷启动一次加密请求要串行经过查域名、TCP 握手、TLS 握手和正式收发，往往叠满 3–4 个往返才见到数据；连接复用能把前三步归零，流式输出则把整段生成拆成逐字推送。
- key: TLS
  value: 加密握手先凭数字证书验明对面确实是你要找的服务器，再用 [[(EC)DHE]] 商量出一把临时对称钥匙；真正传数据时全程用这把快钥匙加密，而不是拿慢吞吞的非对称算法硬算。
- key: 流式响应
  value: "[[chunked]] 分块传输配合 [[SSE]] 事件流：服务器刚算出一点就立刻往外发，浏览器收到一段就画在屏幕上，不用干等全文。"
- key: SSE vs WebSocket
  value: "[[SSE]] 是在普通 HTTP（HyperText Transfer Protocol，超文本传输协议）长响应上做服务端向客户端的单向推送；[[WebSocket]] 是升级后的独立双向通话协议，只有两边都要随时插话时才需要它。"
- key: 在终端里看一看
  value: "[[curl]] -v https://example.com　看握手与头部；curl -N 看流式逐块到达"
