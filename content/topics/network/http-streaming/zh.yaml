objectives:
- 按时间顺序列出一次 HTTPS 请求的全部阶段与 RTT 账
- 说清 TLS 握手做了哪三件事
- 解释 LLM API 用 SSE 流式的原因与它同 WebSocket 的区别
aiLink: 你每天使用的 AI 聊天界面正是这节课的全貌：打开网页首字跳出来前的犹豫，多半花在查地址和加密握手；回答能像打字机一样逐字涌现，靠的是分块传输加 SSE 事件流。搞懂前端为什么要用 [[ReadableStream]] 一块块啃字节流、网关为什么必须打开连接池，就能直接定位真实 AI 应用的首字卡顿。
design:
- mechanism: 把一个完整响应切碎，边算边发（流式响应）
  problem: 大模型写完一段回答动辄数秒到数十秒，如果非要攒到最后一个字生成完才打包发给浏览器，用户只能对着空白界面干等全程，网关与浏览器还可能嫌长时间没动静而超时掐线。
  choice: 服务器先发回响应头宣布开始，随后维持连接不关，每生成一个小片段就用 chunked 分块或事件帧往下推，浏览器边收边解析渲染。
  tradeoff: 省下的是人眼的等待感，不是总计算成本；作为交换，浏览器要自己维护增量拼接状态并处理断线半截内容，服务器和代理也得长时间占着连接并调整缓冲策略。
  root: 写完总耗时由模型算力锁死，流式变不了快；但人感知的等待取决于首字节延迟与画面是不是连贯动起来——把交付摊在时间轴上，感知等待就能远小于总时延。
- mechanism: 建好一条加密长连接，连续喂给多个请求（连接复用）
  problem: 一条全新的加密连接要把查域名、TCP 握手、TLS 握手串起来跑一遍，跨洋光建连就要数百毫秒；如果每次模型调用都要重新排一遍队，首字延迟会被握手账主导。
  choice: 浏览器和网关各自维护连接池，按域名把空闲连接留着不关（keep-alive），后续请求近乎零建连开销直接发；同时限制每域名并发连接数与空闲存活时间，防连接被无限占住。
  tradeoff: 服务端内存里要为每条空闲连接保留状态，负载均衡时连接亲和性容易导致各机器忙闲不均；客户端从池子里摸到已被对端悄悄关掉的半开连接时，还得能识别并换新连接重试。
  root: 握手耗时是一笔只按「新连接次数」算的固定成本，跟请求里装多少字无关；请求越零碎、调用越频繁，连接池把固定成本摊薄的威力就越大。
quiz:
- q: 第一次访问一个 HTTPS 站点，见到第一个数据字节前大约要几个 RTT？
  options:
  - "0"
  - DNS 1 + TCP 1 + TLS（1.3 为 1），冷启动约 3 个（TLS 1.2 则约 4 个）
  - 10 个以上
  - 与 RTT 无关
  answer: 1
  explain: DNS、TCP 握手、TLS 握手（TLS 1.3 为 1 个）串行叠加；这也是连接复用与就近接入值钱的原因。
- q: TLS 握手没有做的事是？
  options:
  - 验证服务器证书身份
  - 协商对称会话密钥
  - 把之后的数据用 RSA 逐字节加密
  - 协商加密套件
  answer: 2
  explain: TLS 1.3 里证书的签名用来验证身份、(EC)DHE 用来协商密钥，数据本身用协商出的对称密钥做 AEAD 加密。
- q: LLM API 用 SSE 而不是等全部生成完再返回，是因为？
  options:
  - 省流量
  - 生成要数秒到数十秒，流式让首 token 尽快显示，用户体验与超时风险都好得多
  - SSE 更安全
  - 浏览器只支持 SSE
  answer: 1
  explain: 流式把「等全部生成」的长尾延迟变成逐 token 呈现；服务端也无需在内存里攒完整响应。
steps:
- id: dns-tcp
  title: 先把路修好：找地址与打通 TCP
  tldr: 在发出第一个业务字节之前，浏览器必须先问出服务器 IP 并完成 TCP 三次握手；这两步必须串行等完，冷启动时就会花掉约 2 个往返时间。
  body: |-
    你在网页上向 https://api.example.com/v1/chat 按下发送键，数据还不能立刻上路。计算机在网线上只认数字地址不认英文字母，所以浏览器第一步得先查 [[DNS]]（下一课细拆），把域名翻成服务器的 [[IP]]；拿到地址后，再按上一课走过的流程，向对方 443 端口发包做 [[TCP]] 三次握手。这两关没过之前，提问的正文一个字也发不出去。

    拿具体延迟把这两步的账算一下。如果本地刚好留着地址缓存，查域名近乎 0 毫秒；要是没命中、得问一次递归解析器，通常至少花 1 个 [[RTT]]，紧接着 TCP 握手又实打实吃掉 1 个 RTT。因为必须先知道门朝哪开才能上去敲门，这两步只能串行相加，好在浏览器会缓存解析结果并复用旧连接，第二次发问常常可以直接跳过这笔费用。

    换算成体感时间就很直观了：同城机房 RTT 约 20 毫秒时，两步合起来约 40 毫秒，人根本感觉不到；可一旦服务部署在跨洋机房，RTT 拉长到 150 毫秒，光修路就已经耗掉约 300 毫秒，而且后面的安全锁还没开始拧呢。「点完没反应、首屏发呆」很多时候慢的不是服务器算得慢，而是见到第一个字之前这段纯等待。
  derivation: original
  sources: []
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 浏览器
      state: 解析+握手
      highlight: true
    - lane: server
      id: s
      label: 服务器
      state: "443"
    messages:
    - id: m1
      from: c
      to: s
      label: TCP 三次握手
      active: true
  log:
  - mode: 阶段 1–2
    event: 第一段路是 DNS 把域名解析成 IP，再用 TCP 三次握手把连接建好
- id: tls
  title: TLS 握手：验明身份，换一把对称快钥匙
  tldr: 通道刚通还是明文裸奔，TLS 1.3 用 1 个往返同时验完服务器证书、商量好共享对称密钥，之后全靠高速对称加密传数据，而不是全程用 RSA 硬算。
  body: |-
    TCP 路修通了，但整条管子是透明的——沿途任何路由器或公共 Wi-Fi 都能看光甚至篡改你的提问，所以上面必须套一层 [[TLS]] 加密锁。这里最常听到的一个误解，是以为浏览器会用 [[RSA]] 这类非对称算法把后面整段对话逐字加密；其实非对称运算极慢，真这么干的话，服务器算力早就被加解密拖垮了。

    真实的加密分工把「认人」和「传话」拆得很干净。现代主流的 TLS 1.3 用 1 个 RTT 同时办妥三件事：协商加密套件、验证服务器身份、凑出会话密钥。服务器先出示由权威机构 [[CA]] 签发的数字证书，用签名证明「我确实是 api.example.com 本尊」；同时双方各出一段临时随机材料，用 [[(EC)DHE]] 算法现场算出只有彼此知道的同一串共享秘密；最后从这串秘密派生出一把对称会话密钥，后面大量提问和响应全靠极快的 [[AEAD]] 对称算法加解密（既加密又防篡改）。

    顺便点破一个对比：老版本的 TLS 1.2 得先试探套件再互换密钥材料，来回要跑 2 个 RTT；TLS 1.3 之所以能把全握手压成 1 个 RTT，秘诀就是浏览器在第一包 [[ClientHello]] 里不等对面开口，直接把猜好的密钥份额提前塞进去，服务器收到后一并把选定方案、自己的密钥份额和证书回传，一个来回就把锁上好了。
  derivation: original
  sources:
  - ref: rfc-8446
    locator: §1.2/§2 TLS 1.3 握手
    claim: TLS 1.3 全握手 1 个 RTT，(EC)DHE 协商密钥、证书签名验身份、数据用 AEAD 对称加密
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 浏览器
      state: 验证证书
      highlight: true
    - lane: server
      id: s
      label: 服务器
      state: 出示证书
    messages:
    - id: m2
      from: c
      to: s
      label: ClientHello + 密钥份额
    - id: m3
      from: s
      to: c
      label: 证书 + 服务器密钥份额
      active: true
  log:
  - mode: 阶段 3
    event: 第三段是 TLS 1.3 握手，用 1 个 RTT 验明身份并协商出会话密钥
  code:
    lang: text
    code: |-
      TLS 1.3 握手（简化）：
      ClientHello（套件 + 客户端密钥份额） →
      ← ServerHello（选定套件 + 服务器密钥份额）+ 证书 + Finished
      双方各自算出相同会话密钥 → 之后全程对称加密
    note: TLS 1.3 比 1.2 少一个 RTT
- id: request
  title: 正式发请求：请求行、头部与幂等规矩
  tldr: 加密通道锁好后浏览器发出 HTTP 请求；发送前必须看清操作是否幂等，因为重复发一次非幂等的 POST 推理请求可能会重复扣费或重复生成。
  body: |-
    通道终于安全了，浏览器把你的对话内容装进 HTTP/1.1 请求发出去：第一行声明方法和路径，即 POST /v1/chat/completions；紧跟着是信封外的头部字段，其中 [[Authorization]] 带着接口密钥用来鉴权，[[Content-Type]]: application/json 说明正文格式是 JSON；最后在请求体里加上 stream: true 向后端声明要流式输出（这是大模型接口厂商约定的字段，不算 HTTP 协议标准）。

    服务器收到后按头部做鉴权、限流和路由排队。如果发出去之后网络半途闪断或者迟迟不回音，客户端敢不敢自动重发？这要看这个请求是否满足[[幂等]]——意思是「同一句话重复执行十遍，产生的结果和副作用是不是跟执行一遍完全一样」。

    读取配置的 GET 请求通常怎么重发都没副作用；可咱们的 POST 生成请求每调一次都会真实占用模型算力甚至触发计费、下单。连接中途断掉或超时时若盲目自动重发，用户就可能被连扣两次费，所以重试策略必须先分清请求的方法语义，搞清楚服务端收到没、处理到哪一步，再决定重发还是查状态。
  derivation: original
  sources:
  - ref: rfc-9110
    locator: §9 方法语义与幂等性
    claim: HTTP 方法有安全与幂等语义之分，重试策略应据此区分
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 浏览器
      state: 已发请求
      highlight: true
    - lane: server
      id: s
      label: 服务器
      state: 认证/路由/排队
    messages:
    - id: m4
      from: c
      to: s
      label: POST /v1/chat（stream:true）
      active: true
  log:
  - mode: 阶段 4
    event: 第四段，HTTP 请求正式发出，服务器开始认证、路由与排队
- id: keepalive
  title: keep-alive 与连接复用：握手账只付一次
  tldr: 算完冷启动 3 个 RTT 的建连账，靠 HTTP/1.1 默认开启的 keep-alive 连接复用，后续追问直接从连接池拿现成通道发请求，建连耗时几乎降为零。
  body: |-
    先把前面敲门的固定账合并结算：早期 HTTP/1.0 每发一个请求就建一条新连接、用完立刻拆掉，每个请求都要重付一次 DNS 约 1 次往返 + TCP 1 个 RTT + TLS 1.3 的 1 个 RTT。按跨洋 RTT 150 毫秒算，这冷启动 3 个来回就是约 450 毫秒的纯等待（如果还在用 TLS 1.2 更要约 4 个往返、600 毫秒）；若是高频调用或网页加载几十个小文件，每次重排一遍队直接能把延迟拉开好几倍。

    HTTP/1.1 起默认开启的 [[keep-alive]] 改变了规则：一次响应收完不拆线，把这条已经握过手、验过证书、换好钥匙的连接放回空闲连接池里待命。几秒钟后你继续追问第二句，浏览器或网关直接从池子里摸出这条现成通道发请求，前面那约 450 毫秒的握手账一分不用再交。

    复用同样有边界要守：连接不能永远白白占着内存，服务端会设置空闲超时和单条连接的最大请求数，到点由一方主动挂断；客户端池子万一捡到一条已被对端悄悄关掉的半开连接，第一次复用发送就会扑空报错，代码里必须能认出这种失效并换条新连接重试。
  derivation: original
  sources:
  - ref: rfc-9110
    locator: §9.3/§9.4 连接复用与关闭
    claim: HTTP/1.1 连接默认可复用承载多个请求，服务端可通过超时与 Connection 头管理连接生命周期
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 浏览器（连接池）
      highlight: true
    - lane: server
      id: s
      label: 服务器
    messages:
    - id: m10
      from: c
      to: s
      label: 请求 1、2、3 共用同一条连接
      active: true
  log:
  - mode: 复用
    event: 连接复用让握手成本被多个请求摊薄，后续请求近乎零建连开销
- id: chunked
  title: chunked 分块编码：不知道总长度怎么先发
  tldr: 流式回答开始吐字时根本不知道全文总共有多长，HTTP/1.1 用 chunked 分块传输在每块前面标上十六进制长度，最后发一块长度为 0 的空块宣告正文收尾。
  body: |-
    模型接单开始往外吐字，正常传网页或图片时，服务器会在响应头写明 [[Content-Length]] 告诉浏览器正文一共多少字节。可推理回答还在一个字一个字现写，发第一个字时连服务器自己都不知道最后一共多少字节，没法提前填总长度。HTTP/1.1 的解法是在响应头改写 [[Transfer-Encoding]]: chunked，意思是「别等总长度了，我切块发，每块开头先报这一块有多少字节」。

    直接看线上跑的字节长什么样：每一块的格式固定是「本块字节数（十六进制）+ 换行 + 本块数据 + 换行」，例如先发 5、换行、hello、换行，再发 6、换行、world!、换行，全部发完后发一块长度写着 0 和换行的结尾块。接收端的解析器就像个严格数数的状态机：先读一个长度数，按数吞掉对应字节，再读下一个数，直到看见 0 才收工。

    写前端或网关代码时千万留意一条暗坑：网络层的 chunked 切块纯粹取决于服务器何时凑出一段往外发，它和业务层的 SSE 事件或模型 token 边界完全不对齐——一块里可能只装着半个词，也可能一下子装进三条完整事件，解析层绝对不能指望「收一块就是一条完整消息」，必须自己用缓冲区接住再切分。到了 HTTP/2 里，这套文本数长度的做法被淘汰，改由二进制 [[DATA 帧]]上的 [[END_STREAM]] 标志位通知结束。
  derivation: original
  sources:
  - ref: rfc-9110
    locator: §7.1 chunked 传输编码
    claim: chunked 编码以十六进制长度前缀逐块发送正文，零长度块标志正文结束
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端（按长度逐块解析）
    - lane: server
      id: s
      label: 服务器（逐块发出）
      highlight: true
    messages:
    - id: m11
      from: s
      to: c
      label: 5 hello / 6 world! / 0 结束
      active: true
  log:
  - mode: 编码
    event: chunked 编码用长度前缀逐块发送，用一个零长度块宣告正文结束
  code:
    lang: text
    code: |-
      Transfer-Encoding: chunked 的线上样子：
      5\r\n hello\r\n 6\r\n world!\r\n 0\r\n\r\n
      （数字是十六进制字节数；0 长度块 = 正文结束）
    note: chunked 块与 SSE 事件边界无关，业务层要自己攒缓冲
- id: stream
  title: 流式响应：边生成边推的 SSE 事件流
  tldr: 服务器在分块通道里套上 text/event-stream 格式，每生成一点文本就封成一条 data 事件下发，前端边拆包边画，把死等全文变成实时打字机效果。
  body: |-
    模型写字是一个 token 接一个 token 蹦出来的，整段答完动辄几秒到几十秒。如果非要等全部生成完再一口气回传，用户只能盯着空白界面干等全程，网关与浏览器还可能因为长时间收不到字节而判定超时断开。

    走流式时做法正好相反：响应头先返回状态码 200 并标明 Content-Type: text/event-stream，随后服务器在 HTTP/1.1 下借 chunked 把生成出来的片段一块块往下推。里面装的格式叫 [[SSE]]：每条事件由一行或多行 data: 开头、以一个空行（即连续两个换行符）结尾；OpenAI 等推理接口还习惯在末尾多送一条 data: [DONE] 当结束暗号（注意这是厂商约定，不算 SSE 协议标准）。浏览器像右侧代码那样拿 ReadableStream 边收边拼进缓冲区，凑够空行切出一整条再 JSON 解析渲染，就做出了打字机效果。

    分析性能时千万分清两个数：首 token 时间（[[TTFT]]）决定用户觉得卡不卡，全文生成完的总耗时决定任务几秒结账。流式只能把等待在时间上摊开、抢出极低的 TTFT，并不能让 GPU 算得更快，千万不要说成「流式减少了总生成时间」。
  derivation: original
  sources:
  - ref: mdn-sse
    locator: Using server-sent events（事件流格式与 EventSource 重连）
    claim: SSE 事件由 data 字段组成、以空行结束；自动重连是 EventSource 的行为
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 浏览器
      state: 逐段渲染
      highlight: true
    - lane: server
      id: s
      label: 服务器
      state: 逐 token 生成
    messages:
    - id: m5
      from: s
      to: c
      label: 'data: {token: "你"}'
    - id: m6
      from: s
      to: c
      label: 'data: {token: "好"}'
    - id: m7
      from: s
      to: c
      label: "data: [DONE]"
      active: true
  log:
  - mode: 阶段 5
    event: 第五段，服务器用 SSE 把生成中的 token 一段段流式返回
  code:
    lang: typescript
    code: |-
      // 前端消费 SSE 流的最小骨架（fetch + ReadableStream）
      const res = await fetch(url, { method: 'POST', body, headers });
      const reader = res.body!.getReader(); const dec = new TextDecoder();
      let buf = '';
      for (;;) { const { done, value } = await reader.read(); if (done) break;
        buf += dec.decode(value, { stream: true });
        const events = buf.split('\n\n'); buf = events.pop()!;   // 事件以空行分隔，尾巴留给下一块
        for (const ev of events) for (const line of ev.split('\n'))
          if (line.startsWith('data: ')) { const p = line.slice(6);
            if (p === '[DONE]') return;                          // 厂商约定的结束标记，不是 JSON
            render(JSON.parse(p)); } }
    note: 已含跨块缓冲与 [DONE] 处理；真实代码还要处理断线重发与错误事件
  points:
  - 首 token 时间（TTFT）决定体感，生下全文的时间决定总时长，两者要分开看
  - 流式不减少总生成时间，只是把等待摊开并提前呈现
- id: sse-fields
  title: SSE 的事件字段与重连：id、retry 与 Last-Event-ID
  tldr: SSE 事件支持编号并可在断线后自动从断点续接，但浏览器原生的自动重连只属于 GET 方式的 EventSource；走 POST 加 fetch 的推理流断了得自己重连。
  body: |-
    标准 SSE 事件块里不止能写 data，其实还能塞进另外三种好用字段：event 给事件起类型名、id 给本条消息编个序号、retry 吩咐浏览器断线后隔多少毫秒重连；另外偶尔会见到冒号开头的行（例如 : keepalive），那是注释行，常被用来隔几秒发一次心跳保活，防止中间路由器嫌连接半天没字而掐断。

    编号 id 最大的作用是断线续接。浏览器原生的 EventSource 客户端一旦遇到网络闪断，会自动发起重连，并在请求头里附上 Last-Event-ID（值为刚刚收到的最后一个事件 id，例如 42）；服务器拿到 42，就只补发 id 大于 42 的消息，让前端无缝续上、不重也不漏。

    但接 LLM API 时几乎人人容易踩中这个误会：浏览器自带的 EventSource 只能发 GET 请求，塞不进长长的对话记录请求体；而我们的 POST 请求靠 fetch 读流，断线后根本不会有人替你自动重连。遇到半截断网，应用必须自己记录进度并决定是重发整个请求还是提示重试，千万别把「SSE 会自动重连」当成通用结论。
  derivation: original
  sources:
  - ref: mdn-sse
    locator: Using server-sent events（事件字段、重连与 Last-Event-ID）
    claim: SSE 事件可含 data/event/id/retry 字段，EventSource 断线自动重连并发送 Last-Event-ID 请求头
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: EventSource（自动重连）
      highlight: true
    - lane: server
      id: s
      label: 服务器（按 id 补发）
    messages:
    - id: m12
      from: c
      to: s
      label: 重连请求头 Last-Event-ID 等于 42
      active: true
    - id: m13
      from: s
      to: c
      label: 只补发 id 大于 42 的事件
  log:
  - mode: 重连
    event: SSE 靠事件 id 实现断线后的断点续接，而不是把整条流重发一遍
- id: cache-intro
  title: 顺路对比：为什么静态图拼命缓存，生成流严禁缓存
  tldr: 同在 HTTP 链路上跑，静态资源靠 Cache-Control 与 304 验证把请求拦截在本地或边缘；千人千面的流式回答则必须明确禁止缓存，防止攒包或泄露串号。
  body: |-
    同一条管道里其实跑着两种规矩完全相反的响应。对于页面图标、文档、脚本这类大家看到的都一样的静态资源，响应头会贴上 [[Cache-Control]]（如 max-age 规定多少秒内直接用本地副本）和类似文件指纹的 [[ETag]]。哪怕本地副本过期了，浏览器也会带 [[If-None-Match]] 问服务器一句「这份文件变了没」，没变就回一个不带正文的状态码 [[304]]，省下整份文件的传输——这也正是下一课讲的 CDN 能在边缘共享缓存的前提。

    轮到我们这个流式问答接口，情况刚好颠倒过来：每次生成的结果都是专属当前对话的新内容，绝不允许任何中间节点留存复用。

    因此流式 API 通常会在响应头显式标明不缓存，网关与代理也不该把流当副本存下来。万一链路上某个环节错把生成流按普通响应缓存或先存再吐，轻则打字机效果消失、等很久突然一坨吐完，重则闹出把别人的问答错吐给你的事故。
  derivation: original
  sources:
  - ref: rfc-9110
    locator: §13/§15 HTTP 缓存与条件请求
    claim: Cache-Control 控制缓存新鲜期，ETag 与条件请求可让未变更资源以 304 响应免传正文
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端（缓存/验证）
    - lane: server
      id: s
      label: 服务器/CDN
      highlight: true
    messages:
    - id: m14
      from: c
      to: s
      label: 静态资源可缓存；生成流标注不缓存
      active: true
  log:
  - mode: 缓存
    event: 同一条链路上，静态内容与生成内容执行的是两种相反的缓存策略
- id: ws
  title: 什么时候用 SSE，什么时候用 WebSocket
  tldr: 选型判据就看流向：只需要服务端单向往浏览器推内容，用天然走 HTTP 的 SSE 就够了；只有两边需要随时双向互推，才用独立协议 WebSocket。
  body: |-
    聊完流式推送，常有人追问为什么干脆不用 [[WebSocket]]。WebSocket 虽然也是先发一次 HTTP 请求敲门，但随后通过升级握手切换成一套独立的全双工协议：建立之后客户端与服务端随时能互相抢话发消息，特别适合实时语音对话、在线白板协作和联机游戏。

    可全双工是有代价的：一旦脱离普通 HTTP 轨道，网关现有的鉴权、限流、日志和代理穿透往往都要额外适配，连心跳保活和断线重连状态机都得团队自己写、自己扛。

    再看咱们这次提问：你提交问题后，接下来几十秒只剩服务器单向往屏幕推字，浏览器只负责静静接住渲染，根本不需要在它吐字时高频上行消息。SSE 本质上就是「一条迟迟没写完的普通 HTTP 响应」，单向特征恰好严丝合缝匹配推理输出，还白白吃透全部 HTTP 基础设施——单向需求硬套 WebSocket，只会平白多付一套自维护成本。
  derivation: original
  sources:
  - ref: rfc-6455
    locator: 摘要与 §4 升级握手
    claim: WebSocket 经 HTTP 升级握手后切换为独立全双工协议，协议本身不规定重连
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端
    - lane: server
      id: s
      label: 服务器
    messages:
    - id: m8
      from: s
      to: c
      label: SSE：单向流（够用于 token 推送）
      active: true
    - id: m9
      from: c
      to: s
      label: WebSocket：双向消息
  log:
  - mode: 对比
    event: SSE 与 WebSocket 的选型判据是数据流方向：单向用 SSE，双向才上 WebSocket
  mistake: 以为流式必须用 WebSocket——对单向生成流，SSE 更简单且与 HTTP 基础设施完全兼容。
- id: buffering
  title: 收尾排障账：首字迟迟不来，小心代理在攒包
  tldr: 用户等首字的总时间由「建连、排队预填充、吐出首字、沿途回传」四段相加；其中最隐蔽的坑不是模型慢，而是反向代理默认攒包把流式憋成了一坨。
  body: |-
    把整节课收成线上排障的第一视角。当用户抱怨「等好久才出第一个字」时，先把首字延迟（TTFT）拆成四段算清：第一段是建连耗时（DNS 加 TCP 加 TLS，命中连接池复用后近似为 0）；第二段是请求进网关后的排队与模型读完提问的预填充时间；第三段是模型吐出第一个 token 的计算时间；第四段是第一个字沿中间代理一路传回浏览器的耗时。

    四段里最后一段最阴险：很多反向代理默认开着响应缓冲（proxy buffering），为了减少系统调用，会把后端刚吐出的零碎小包先囤在内存里，攒满几 KB 或干脆等流结束才一口气往外吐。结果模型明明一秒内就吐了字，用户端却变成干等十秒然后哗地一下整屏砸出来，或者一卡一顿地成坨弹出。

    验证这个坑有一招直击要害：用 curl -N（关闭命令行缓冲）分别直连模型后端和绕过网关跑一次，看着屏幕上字出现的时间戳一对比，立刻知道包被卡在了哪一跳；修法通常是在网关流式路由上关闭响应缓冲，并确认没有中间层把 chunked 攒回普通响应。带走这三句排查口诀：冷连三趟看复用、首字排队查算力、一卡一坨用 curl -N 揪代理缓冲，排查顺序不踩偏，就不用每次一慢就先冤枉模型。
  derivation: original
  sources: []
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端（等首 token）
    - lane: server
      id: s
      label: 网关/代理（可能在缓冲）
      highlight: true
    messages:
    - id: m15
      from: s
      to: c
      label: 被攒成一大坨的 token 流
      active: true
  log:
  - mode: 排障
    event: 排障时把 TTFT 拆成四段逐段定位，不要一上来就怀疑模型生成慢
