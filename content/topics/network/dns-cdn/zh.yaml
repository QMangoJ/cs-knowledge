id: network/dns-cdn
subject: network
slug: dns-cdn
order: 3
status: published
license: CC-BY-4.0
title: DNS 解析与 CDN：名字如何变成最近的服务器
summary: 递归与迭代查询、多级缓存与 TTL，再到 CDN 边缘节点为什么能让全球访问都快。
premise: 以第一次打开 cs.ki-toko.com、在东京与圣保罗各访问一次为例。
overview:
- key: 一句话总结
  value: DNS 把域名逐级问出 IP 并层层缓存；CDN 把内容与接入点搬到离用户最近的边缘节点
- key: 两种查询
  value: 递归：解析器替你问到底；迭代：每级只告诉你下一步问谁
- key: 记录
  value: A/AAAA 给 IP，CNAME 给别名（CDN 调度的关键抓手）
- key: TTL
  value: 缓存有效期，秒级权衡新鲜与查询量
- key: 在终端里看一看
  value: dig cs.ki-toko.com　看解析结果与 TTL；dig +trace　看逐级迭代
visual: swimlane
