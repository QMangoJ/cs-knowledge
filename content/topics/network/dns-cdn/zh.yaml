    event: CDN 让边缘节点就近服务用户，访问不必每次都走回源站
  points:
  - 静态内容：边缘缓存命中即返回，未命中才回源拉取并缓存
  - 动态请求：边缘终结连接 + 骨干加速，握手 RTT 大幅缩短
- id: scheduling-compare
  title: CDN 怎么把人分对机房：DNS 调度 vs 任播
  tldr: DNS 调度在查地址时看来源下发不同的边缘 IP，可控性强但切流受 TTL 拖累；任播全网共用同一 IP 由路由器指路，故障秒级绕行却不归应用掌控。
  body: |-
    把东京用户送去东京节点、把圣保罗用户送去南美节点，CDN 在调度层主要有两条路线，它们出手的时机和优缺点完全对称。

    第一条路线是「DNS 调度」：还记得第 4 步给 cs.ki-toko.com 配的那条 CNAME 吗？递归解析器追到 CDN 权威面前时，CDN 调度器看一眼来问话的是东京还是圣保罗，分别把东京边缘 IP 或圣保罗边缘 IP 答复回去。它好在精细可控——哪座机房快满载或要维护，调度器随时能把一部分流量指去旁边城市；但短板是一旦在答复时把 IP 钉死，在接下来的 TTL 有效期内，拿到这份缓存的用户都被绑死在这个机房，真要故障切流只能等分钟级的缓存过期。

    第二条路线是「任播调度」：全球所有人问 cs.ki-toko.com 拿到的都是同一个任播 IP，具体每个包落进东京还是圣保罗，完全交给网络路由在包跑过来时实时决定。它的强项是切流极快——某座机房一撤路由宣告，周边路由器几秒内就能绕走，不等 TTL；代偿则是可观测性变差、应用无法精细控流，甚至同一 IP 前后两次访问在路由抖动时可能飘进不同机房。因此大型 CDN 往往两层叠用：先用 DNS 调度把用户粗分进大洲大区，大区内部再用任播收口。
  derivation: original
  sources: []
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: a
      label: 用户
    - lane: resolver
      id: r
      label: DNS 调度（按来源答不同 IP）
      highlight: true
    - lane: auth
      id: u
      label: 任播（同 IP 路由选落点）
      highlight: true
