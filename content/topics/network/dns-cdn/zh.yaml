  log:
  - mode: 分工
    event: 递归是承诺，迭代是分工
- id: iterate
  title: 缓存未命中：从根开始逐级问路
  tldr: 解析器向根、顶级域、权威逐级迭代，每级只被告知下一步问谁。
  body: '真未命中时，递归解析器（对客户端它在「递归」地代劳）向权威链发起迭代查询：先问根服务器「.com 问谁」，根返回 .com 的顶级域服务器地址；再问顶级域「ki-toko.com 问谁」，返回该域的权威服务器；最后问权威「cs.ki-toko.com 的 A 记录」，拿到 IP。


    每一级的回答都按 TTL 存进缓存，下次同域名的查询能直接跳步。补两个容易被跳过的细节：其一，解析器并不只缓存最终答案，指路信息（哪个域归哪组权威管）同样缓存，所以同一顶级域下的其他域名再来时，连根都不用再问。其二，解析器手里预置了根服务器的初始名单（根提示），这是整个体系唯一的「硬编码起点」——没有它，第一问都不知道发给谁。其三，若权威明确回答「此记录不存在」，这个否定结论也会被短时间缓存，避免同一错误域名反复冲击权威链。'
  derivation: original
  sources:
  - ref: rfc-1034
    locator: §2.3/§3.6 递归与迭代查询、CNAME
    claim: 迭代查询每级只返回转介，递归解析器顺根→TLD→权威问到底；裸域名不能配 CNAME
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: a
      label: 浏览器
      state: 等待
    - lane: resolver
