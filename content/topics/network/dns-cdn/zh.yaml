    event: 迭代查询 根→TLD→权威
  code:
    lang: shell
    code: 'dig +trace cs.ki-toko.com   # 逐级看根→.com→权威的迭代过程

      dig cs.ki-toko.com          # 看最终 A 记录与剩余 TTL'
    note: 在终端里看一看
- id: records
  title: 记录类型：A、CNAME 与 TTL 的权衡
  tldr: CNAME 把名字指向另一个名字，是子域名流量调度的关键抓手（注意：裸域名/区顶点不能配 CNAME）；TTL 决定调度变更的生效速度。
  body: '常见记录：A（IPv4 地址）、AAAA（IPv6 地址）、CNAME（别名，指向另一个域名）、TXT（验证与策略）。把 cs 指向 CDN 时，配的就是 CNAME：cs.ki-toko.com → 某 cdn 域名，最终解析到边缘节点。


    一条边界规则常坑人：CNAME 不能与其他记录共存于同一个名字，且裸域名（区顶点，如 ki-toko.com 本身）按规范不能配 CNAME——因为顶点上必须同时放 NS、SOA 等记录。想给裸域名也做别名调度，要靠服务商提供的别名类扩展记录或直接配 A 记录，不要硬写 CNAME 碰运气。解析链条也要算账：CNAME 每多跳一层，冷查询就要多追问一轮并多缓存一份，所以别名链不是越长越灵活，而是每层都拿延迟换调度自由。再补 TTL 的大图景：TTL 3600 秒时改解析最长要等一小时才全量生效；调成 60 秒切换飞快，但解析器缓存留不住、查询量与尾延迟上升，定量账看下一步。'
  derivation: original
  sources:
  - ref: rfc-1035
    locator: §3.2.1/§6.1.3 TTL 与记录类型
    claim: TTL 是记录可缓存的秒数，缓存中倒计时；A/CNAME/TXT 的语义
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
