    event: 两种调度的对比结论是：灵活性与切换速度不可兼得，要按场景取舍
- id: ecs-accuracy
  title: 调度为什么会指偏路：解析器位置与 ECS
  tldr: DNS 调度眼里默认只看得见「替你跑腿的递归解析器」在哪，如果东京用户配了个远在别的洲的公共解析器，权威就会误把远方机房的 IP 发回来。
  body: |-
    DNS 调度看起来很聪明，却有一个经常坑人的盲区：站在 CDN 权威面前敲门问路的，是你的递归解析器，而不是你的浏览器本人。假如你人坐在东京，却手动把电脑的 DNS 设成了一台位于另一大洲的公共解析器（或者公司网络把解析请求统一汇去海外总部出口），CDN 权威看到提问信封上的来源地址在另一大洲，就会老老实实挑一个距离彼大洲最近的边缘 IP 发给你。解析过程毫无毛病，结果你却顶着跨洋高延迟打开网页，南辕北辙。

    缓解这个错配的协议补丁叫 [[ECS]]（EDNS Client Subnet，客户端子网扩展）：解析器出门代问时，顺手在请求里附上一截用户真实 IP 的前几位网段（刻意抹掉末尾几位来保护隐私），让 CDN 权威照着「东京用户网段」而不是「海外解析器位置」来挑机房。

    开启 ECS 也带着真实代价：同一份域名记录要按成千上万个不同城市网段分开缓存，解析器的缓存碎片化严重、命中率跟着往下掉，加上并非所有解析器都愿意开启隐私暴露去发送 ECS。所以线上排障一旦遇到「某个地区用户突然连得慢」，千万先查这批用户的解析器出口和 ECS 有没有被带偏，再去怀疑边缘机房本身，顺序别搞反。
  derivation: original
  sources: []
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: a
      label: 东京用户
      highlight: true
    - lane: resolver
      id: r
      label: 远方公共解析器
    - lane: auth
      id: u
      label: CDN 权威（被位置误导）
    messages:
    - id: m11
