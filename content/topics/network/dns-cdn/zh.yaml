- id: ttl-quant
  title: TTL 的定量账：查询量与陈旧窗口怎么换算
  tldr: 权威查询量约与 TTL 成反比，变更的最坏陈旧时间约等于旧 TTL，两边都是可算的数。
  body: 'TTL 的权衡可以粗算，不要只凭感觉拍。先算负载：某个热门记录被 N 个独立解析器缓存着，稳态下权威每秒收到的查询量大致正比于 N 除以 TTL——TTL 从 3600 秒砍到 60 秒，权威查询量放大约 60 倍，同时用户侧每分钟就要多付一轮冷解析的尾延迟。对量级有个概念：一万个活跃解析器在缓存你、TTL 取 60 秒，权威平均每秒要接约一百多次本可被缓存挡掉的查询，大流量域名还要再往上叠。


    再算新鲜度：你把记录改掉的那一刻，全球缓存里旧副本的剩余寿命在 0 到旧 TTL 之间均匀分布，所以最坏全量生效时间约等于旧 TTL，平均约一半。这解释了故障切换的标准动作为什么是「提前降 TTL」：必须在切换前至少一个旧 TTL 周期（比如提前一小时以上）先把 TTL 降下来，让旧的长 TTL 副本全部自然过期，切换当天再改记录，新值才能以新 TTL 的速度传播——临时抱佛脚地在故障当下才降 TTL，对已被缓存一小时的旧副本毫无作用。'
  derivation: original
  sources:
  - ref: rfc-1035
    locator: §6.1.3 TTL 的缓存语义
    claim: 缓存按 TTL 倒计时过期，记录变更的最坏传播时间受旧 TTL 约束
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: a
      label: 用户（感知冷解析延迟）
    - lane: resolver
      id: r
      label: 全球解析器缓存
      highlight: true
    - lane: auth
      id: u
      label: 权威（查询量随 TTL 反比）
    messages:
    - id: m8
      from: r
      to: u
      label: TTL 砍到六十分之一，查询量约放大六十倍
      active: true
  log:
  - mode: 定量
    event: 新鲜度与负载是同一枚硬币的两面
- id: anycast-authority
  title: 根与顶级域为什么扛得住：任播部署
  tldr: 根只有少量逻辑地址，却靠任播在全球复制出大量实例，同一地址由就近实例应答。
  body: '一个自然的疑问：全世界解析的第一问都冲向根，根怎么没被压垮？答案之一是任播（Anycast）：同一个 IP 地址被分布在全球的许多实例同时对外宣告，用户的数据包由路由系统送到拓扑上最近的那个实例。所以「根服务器」在逻辑上是少量地址，在物理上是遍布全球的一大群机器，单点容量被复制成了全球容量，某个实例出故障时路由还会自动绕开它。


    顶级域服务器与大型公共解析、CDN 节点也大量使用同一招。任播还有个常被忽略的性质：它选的是「路由拓扑最近」，不保证是地理最近——跨境路由绕行时，最近的实例可能并不在你以为的城市。但对根这类只指路、不存状态的服务，任播的模型恰好完美匹配：任何实例给出的指路信息都一样，谁应答都行。这也与上一节呼应：权威链敢用「只指路」的迭代分工，正是因为指路服务无状态、可任播复制。'
  derivation: original
  sources:
  - ref: rfc-1034
    locator: §3.6 权威服务器与转介
    claim: 权威链每级只返回转介信息，无状态的指路服务适合多实例部署
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: a
      label: 全球解析器
    - lane: resolver
      id: r
      label: 路由系统（选最近实例）
      highlight: true
    - lane: auth
      id: u
      label: 根的全球任播实例
      state: 同一地址多地应答
    messages:
    - id: m9
      from: r
      to: u
      label: 同一个 IP，东京的问东京实例
      active: true
  log:
