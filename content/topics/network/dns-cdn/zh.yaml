- id: cdn
  title: CDN：把内容与接入点搬到用户旁边
  tldr: 边缘节点缓存静态内容、终结连接，让每一次访问少走几千公里。
  body: 'CDN 在全球布了大量边缘节点。静态资源（JS/CSS/图片、模型分片）被缓存在边缘，用户向最近节点取，命中就不再回源站；动态请求（如 API）也能借边缘做 TCP/TLS 终结等优化（各厂商实现不同），把 TCP 握手放在离用户近得多的地方完成，就能省下可观的时间（示意：同城毫秒级 vs 跨洋上百毫秒）。


    补一个回源细节：边缘未命中时才回源站拉取，并且可能有多个边缘同时未命中、同时回源的惊群问题，成熟 CDN 会用回源合并等手段只让一个请求真正回源、其余等它带回副本。缓存什么、不缓存什么，仍由源站响应头说了算（与 HTTP 缓存语义一脉相承）：标了不缓存的动态响应边缘不会擅自留副本。调度怎么做？解析时根据请求来源（权威服务器看到的解析器位置；若解析器发送了 EDNS 客户端子网 ECS，则还能看到用户子网）返回最近的边缘 IP；或用 Anycast：全球节点宣告同一个 IP，路由系统自动把包送到拓扑最近的那个。两种调度的细对比看下一步。'
  derivation: original
  sources: []
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: a
      label: 东京用户
      state: 就近接入
      highlight: true
    - lane: resolver
      id: r
      label: CDN 调度
      state: 返回最近边缘
    - lane: auth
      id: u
      label: 边缘节点（东京）
      state: 缓存命中/终结连接
      highlight: true
    messages:
    - id: m4
      from: a
      to: u
      label: 到边缘 20 ms，而不是回源 200 ms
      active: true
  log:
