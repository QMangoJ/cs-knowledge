    event: 边缘节点就近服务
  points:
  - 静态内容：边缘缓存命中即返回，未命中才回源拉取并缓存
  - 动态请求：边缘终结连接 + 骨干加速，握手 RTT 大幅缩短
- id: scheduling-compare
  title: 两种调度对比：DNS 调度 vs 任播
  tldr: DNS 调度决策在解析时做、依据粗但灵活；任播决策由路由做、切换快但不归应用管。
  body: '把两种调度摆在一起对比，选型逻辑就清楚了。决策时机：DNS 调度在查询应答那一刻按来源选 IP，一旦答出，在 TTL 内所有拿到这份缓存的用户都被钉在这个选择上；任播没有「答出哪个 IP」这回事，IP 恒定，落点由每个包的路由实时决定。粒度与准确性：DNS 调度看到的是递归解析器的位置（有 ECS 时能看到用户子网的前缀），用户若用了远方的公共解析器，调度就会选错城市；任播看的是真实路由拓扑，通常与用户实际路径更一致。


    故障切换：DNS 调度切流要等全球缓存过期，受 TTL 制约，分钟级起步；任播撤掉一个实例的路由宣告即可引流走，通常快得多，但路由收敛过程不归应用控制，短暂的落点抖动只能接受。可观测性正好相反：DNS 调度每次决策都留下可查的应答记录，任播里「同一 IP 刚才落在哪」要靠专门的探针才说得清。现实中的大型 CDN 往往两层都用：DNS 把用户分到区域，区域内再用任播收口，取两者之长。'
  derivation: original
  sources: []
