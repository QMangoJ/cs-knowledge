    event: 调度的依据默认是解析器的位置，它未必等于用户本人的位置
- id: ailink
  title: 落回 AI 实战：就近接入锁住首字延迟下限
  tldr: 模型算力再快，也跨不过跨洋光缆的物理延迟；把解析、调度与边缘终结做好，才能替全球用户的推理请求守住首字延迟的下限。
  body: |-
    最后把 cs.ki-toko.com 在东京与圣保罗的对比账落回 AI 应用实战。假设 cs.ki-toko.com 背后挂着一套部署在美国弗吉尼亚的推理服务，圣保罗用户每次遇上冷连接，光是 DNS 解析叠上跨洲 TCP 和 TLS 握手就可能吃掉 3 到 4 个跨洋 [[RTT]]——半秒过去了，GPU 还没见到他提问的第一个字。如果在东京和圣保罗都铺上边缘接入点或直接多地域部署推理集群，用 DNS 调度加任播把用户拉进同洲机房，就能把进门耗时压回本洲毫秒级量级。

    在企业级 AI 服务里，就近接入还顺带管着合规和算力账单：不同地域机房的 GPU 单价不同，隐私法规往往还死死规定「哪国用户的数据只能留在哪国机房处理」——一次调度选偏，不只是多几十毫秒延迟，还可能直接踩中数据驻留合规红线。

    带走这套查域名与就近接入的三步排障清单，遇到解析慢或切流不生效直接照着盘：第一查缓存层级（本地浏览器、系统还是公共解析器手握旧副本），切流前务必提前一到两个旧 TTL 周期降下 TTL；第二查记录与落点（是否误在裸域名配 CNAME，或解析器没带 ECS 把本地用户指去了海外机房）；第三查边缘回源策略（静态资源防惊群靠回源合并，动态接口靠边缘就近终结握手加专线回源）。
  derivation: original
  sources: []
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: a
