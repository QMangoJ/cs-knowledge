objectives:
- 画出根→顶级域→权威的迭代查询链
- 解释多级缓存与 TTL 如何把解析压到毫秒级
- 说清 CDN 用 CNAME/Anycast 把用户导向边缘节点的两种方式
aiLink: 全球用户同时调用同一个 AI 推理接口，有人秒出字、有人发呆半秒，差距常在接入层：DNS 调度与 CDN 就近接入决定了请求先落进哪座城市的机房。看懂解析链条和 TTL 缓存周期，才懂服务故障时为什么不能立刻秒切流量，以及多地域就近接入对压低首字延迟有多值钱。
design:
- mechanism: 按域名后缀层层甩手委派，并用 TTL 缓存挡掉绝大多数查询
  problem: 全世界域名数量庞大且由无数机构各自维护，如果全塞进一台集中式数据库，立刻会撞上容量瓶颈、同步延迟、单点故障与管理权冲突四堵墙。
  choice: 干脆按域名后缀分级委派：根只指出每个顶级域归谁管，顶级域只指出每个注册域的权威服务器，只有各家权威自己保存具体记录；沿途各级把指路牌和答案都按 TTL 缓存起来。
  tradeoff: 换来了全球可用性与高并发吞吐，代价则是数据只能最终一致：一旦改了目标 IP，全球缓存里的旧副本要等各自 TTL 倒计时耗尽才消失，切流天然存在一段不可压缩的过渡窗口。
  root: 根本权衡是权威负载与数据新鲜度之间的翘翘板：TTL 越大，缓存替权威挡掉越多查询、用户命中越快，但改完配置等得越久；TTL 越小，切换越灵活，查询量和尾延迟就越高。
- mechanism: 用 DNS 按来源答复，或用任播（Anycast）在路由层把用户拐进最近边缘节点
  problem: 哪怕名字 1 毫秒就查出来了，只要服务器远在几千公里外，数据来回一趟的物理下限就被光速和路由跳数锁死，必须在「落点选哪座机房」这一层缩短距离。
  choice: 内容分发网络在全球铺设边缘机房：静态内容直接放边缘就近命中，动态请求在边缘就近终结 [[TCP]] 和 [[TLS]] 握手后再走专线回源；具体落点靠 DNS 解析时按来源挑边缘 IP，或靠任播让全球节点共享同一个 IP。
  tradeoff: DNS 调度调控灵活，但往往只能看见解析器的位置且受 TTL 缓存拖累，切流较慢；任播撤掉路由宣告就能快速切走流量，但路由变化不由应用控制，同一 IP 在不同时刻可能飘进不同机房，排障观测难度上升。
  root: 调度决定下得越早（在解析答复阶段就定死机房），能省的跨洋往返越多，但当时能掌握的路由和用户位置线索也越粗糙。
quiz:
- q: 迭代查询中，根服务器返回的是什么？
  options:
  - 最终 IP
  - 负责该顶级域的服务器地址（下一步问谁）
  - 完整网页
  - 证书
  answer: 1
  explain: 迭代 = 每级只给指路信息；递归解析器顺着根→.com→权威一路问到底。
- q: TTL 设得很短（如 60 秒）的代价是？
  options:
  - 解析结果不准
  - 缓存很快过期，查询量与解析延迟上升，但切换生效快
  - 域名被注销
  - 只能解析一次
  answer: 1
  explain: TTL 是新鲜度与负载的权衡；大促/故障切换前常提前调低 TTL。
- q: CDN 让东京用户就近接入主要靠？
  options:
  - 把服务器搬去东京一台
  - CNAME 到 CDN 域名后按用户来源返回最近边缘节点 IP（或 Anycast 同 IP 多地宣告）
  - 压缩图片
  - 提高 TTL
  answer: 1
  explain: 调度发生在 DNS 应答阶段：解析器位置/用户位置决定返回哪个边缘 IP。
steps:
- id: cache-first
  title: 先翻本地缓存：大多数查域名根本不出门
  tldr: 浏览器敲下 cs.ki-toko.com 后会按「浏览器 → 操作系统 → 递归解析器」顺序逐层翻缓存，绝大多数热门域名根本不会惊动外面的权威服务器。
  body: |-
    你在东京或圣保罗的浏览器里刚敲完 cs.ki-toko.com 按回车，电脑其实很懒——能不跑远路就绝不出门。它会先翻浏览器自己存的 DNS 缓存，看刚刚是不是查过这个名字；没找着再去翻操作系统的本地缓存（包括本机配的 hosts 文件）；两层都扑空，才把问题发给网上的递归解析器（通常是宽带运营商配的默认节点，或 1.1.1.1、8.8.8.8 这类公共解析器），而这台解析器手里也攒着一大本公共缓存。

    三层缓存各自省掉的开销不一样：浏览器缓存命中几乎是零开销的内存读取；系统缓存省去一趟局域网或宽带往返；解析器缓存则省掉了后面漫长的全球多级问路。热门域名在公共解析器里的命中率极高，真正需要从头问到权威的冷查询只占极少数——这也正是后面的逐级问路就算绕远、也不会把整张互联网拖垮的根本原因。

    记住这个三层顺序，排查故障时能少走很多弯路：如果刚把网站迁去新 IP，自己电脑却死活还打开旧站点，排错顺序必须从浏览器缓存、系统缓存、再到递归解析器缓存一路往外清，不要一上来就怀疑权威配置没改对。
  derivation: original
  sources: []
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: a
      label: 浏览器
      state: 查缓存
      highlight: true
    - lane: resolver
      id: r
      label: 递归解析器
      state: 也有缓存
    - lane: auth
      id: u
      label: 权威服务器
    messages: []
  log:
  - mode: 解析 0
    event: 解析的第一步是先查三级缓存，命中就不必出门问权威
- id: recursive-vs-iterative
  title: 递归与迭代：谁负责跑腿，谁只负责指路
  tldr: 同一次出门查域名其实分两段接力：你的电脑对递归解析器用的是「递归」（你替我问到底），解析器对权威链用的是「迭代」（每级只指路，自己跑下一站）。
  body: |-
    假如 cs.ki-toko.com 刚好是第一次在当地被访问、三层缓存全没命中，请求就得真出门去问了。这时候有两个总被搞混的专业词，其实描述的是同一趟跑腿里的前后两棒，完全不是两回事。

    第一棒发生在你的电脑和递归解析器之间，叫「递归查询」：你的电脑只管把「cs.ki-toko.com 的 A 记录是什么」整个扔给解析器，然后两手一摊等最终答案。解析器接了单就得扛起「代劳到底」的服务承诺——中间要跑几趟、转几次弯，你的电脑统统不管，解析器必须把最后能拨号的 IP 交回来。

    第二棒发生在递归解析器和全球权威链之间，风格陡然变成「迭代查询」：解析器去问根服务器「.com 的事问谁」，根绝不替它跑腿去问，只冷冷回一句「凡是 .com 的归这组服务器管，你自己去找它们」。每问一级只拿到「下一步问谁」的指路牌，得解析器自己一站站跑到底。等一下，为什么根和顶级域这么高冷、不肯好心代劳到底？因为全世界几十亿设备的冷查询全往根上涌，要是每问一句都得帮着跑完全程并守着中间状态，内存和带宽瞬间就炸了；只有做成「只指路、不记状态」的轻量服务，才敢到处复制镜像稳稳扛住全球流量。
  derivation: original
  sources:
  - ref: rfc-1034
    locator: §2.3/§3.6 递归与迭代查询
    claim: 递归查询要求被问方给出最终答案，迭代查询只返回转介信息，由查询方继续追问
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: a
      label: 你的电脑（只要最终答案）
    - lane: resolver
      id: r
      label: 递归解析器（代劳到底）
      highlight: true
    - lane: auth
      id: u
      label: 权威链（每级只指路）
    messages:
    - id: m6
      from: a
      to: r
      label: 递归：替我把答案问出来
      active: true
    - id: m7
      from: r
      to: u
      label: 迭代：下一步问谁
  log:
  - mode: 分工
    event: 递归是解析器对客户端「问到底」的承诺，迭代是权威链每级只指路的分工
- id: iterate
  title: 缓存全空时：从根到权威走完四趟问路
  tldr: 完全冷启动时，递归解析器凭出厂预置的根名单出发，先后跑完根、.com 顶级域与域名权威三道门，加上与浏览器之间的一来一回，约花 4 个 RTT 才能拿到 IP。
  body: |-
    把没命中缓存的一趟完整追问从头跑一遍。递归解析器接活后，翻出系统预置的根服务器初始名单（这是整个体系唯一的硬编码起点），先跑第一趟问根：「cs.ki-toko.com 怎么走？」根一看末尾是 .com，甩回负责 .com 的[[顶级域|TLD]]服务器地址。解析器转头跑第二趟去问 .com 服务器，对方一看中间的 ki-toko.com，甩回该域名的权威服务器地址。解析器最后跑第三趟找上 ki-toko.com 自家的权威服务器，这才领回 cs.ki-toko.com 真正的 IP，交还给你的浏览器。

    解析器这趟腿可不是白跑的：拿回 IP 后，它不仅把最终记录按有效期存进缓存，还会把沿途收到的「.com 归谁管」「ki-toko.com 归谁管」这些指路牌顺手缓存下来。下次哪怕有人问一个从未见过的 pay.ki-toko.com，连根和 .com 都不用再惊动，直接奔向权威。甚至如果权威明确答复「根本没有这个名字」，解析器也会把这个否定结论短时间记下来，免得有人拿拼错的域名反复敲打权威。

    把上一课略过的细账算清：完全冷启动跑完这一圈，解析器要分别跟根、顶级域、权威各打一个来回，加上电脑和解析器之间的那一个来回，总共大约花 4 个 [[RTT]]；中途若再撞上 CNAME 别名跳转，来回还要接着往上加。日常查域名之所以快得像一眨眼，全靠各级缓存把这 4 个来回提前消灭掉了。
  derivation: original
  sources:
  - ref: rfc-1034
    locator: §2.3/§3.6 递归与迭代查询、CNAME
    claim: 迭代查询每级只返回转介，递归解析器顺根→TLD→权威问到底；裸域名不能配 CNAME
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: a
      label: 浏览器
      state: 等待
    - lane: resolver
      id: r
      label: 递归解析器
      state: 逐级迭代
      highlight: true
    - lane: auth
      id: u
      label: 根→.com→权威
      state: 逐级应答
    messages:
    - id: m1
      from: r
      to: u
      label: cs.ki-toko.com 的 A 记录？
      active: true
    - id: m2
      from: u
      to: r
      label: 逐级指路：先回 .com 的地址，最后由权威给出 IP
  log:
  - mode: 解析 1
    event: 未命中时，解析器沿根到顶级域再到权威的链条逐级迭代查询
  code:
    lang: shell
    code: |-
      dig +trace cs.ki-toko.com   # 逐级看根→.com→权威的迭代过程
      dig cs.ki-toko.com          # 看最终 A 记录与剩余 TTL
    note: 在终端里看一看
- id: records
  title: 权威手里的记录单：A、CNAME 与裸域名禁区
  tldr: 权威返回的不仅可以是写死的 IP（A/AAAA 记录），还能用 CNAME 把名字指给 CDN 调度域名；但区顶点裸域名因为必须放管理记录，按规范绝不能配 CNAME。
  body: |-
    问到权威服务器后，它手里的记录主要有四样：[[A 记录]]给 IPv4 数字地址、[[AAAA 记录]]给 IPv6 地址、[[TXT]] 用来贴域名所有权验证之类的文本说明，而把 cs.ki-toko.com 接入内容分发网络时最关键的抓手是 [[CNAME]]（别名记录）——不直接吐出死板的 IP，而是回一句「请去问某家 CDN 提供的专用域名」，从而把东京和圣保罗分流给不同机器的权力交给 CDN 动态决定。

    配记录时有条硬规矩特别容易踩坑：CNAME 非常「霸道」，只要一个名字配了 CNAME，就不能再跟任何其他记录共存，因为既然宣布它是别人的别名，所有类型查询都必须顺着别名找过去。

    这就直接划出了一条禁区：不带子域名前缀的裸域名（区顶点，如 ki-toko.com 本身）按规范不能配 CNAME——因为顶点上必须同时老老实实挂着 [[NS]]（谁是权威）和 [[SOA]]（域的起始管理信息）记录。想给裸域名做别名调度，得靠服务商提供的扩展记录在后台帮你算出动态 A 记录。另外别把别名链套太多层，CNAME 每多拐一道弯，冷查询就得多跑一趟来回；至于每条记录上附带的 [[TTL]]，设 3600 秒时改配置最长要熬满一小时，调成 60 秒切流飞快，背后的定量账我们下一步直接算给你看。
  derivation: original
  sources:
  - ref: rfc-1035
    locator: §3.2.1/§6.1.3 TTL 与记录类型
    claim: TTL 是记录可缓存的秒数，缓存中倒计时；A/CNAME/TXT 的语义
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: a
      label: 浏览器
      state: 拿到边缘 IP
    - lane: resolver
      id: r
      label: 递归解析器
      state: 按 TTL 缓存
