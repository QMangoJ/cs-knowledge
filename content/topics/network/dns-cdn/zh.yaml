- id: ttl-quant
  title: TTL 的定量账：切流前为什么要提前一小时调低它
  tldr: TTL 越短权威接到的查询越多（反比放大），而修改 IP 后最坏的全网生效时间受制于「旧 TTL」而不是新 TTL，因此必须在切换前提前降下 TTL。
  body: |-
    把 [[TTL]] 的权衡算成实打实的数字。先算权威压力这笔账：假设全球有 N 个活跃的递归解析器同时缓存着 cs.ki-toko.com，稳态下每个解析器每熬完一个 TTL 就会回来重问一次，所以权威每秒收到的查询量大致正比于 N 除以 TTL。假如原本 1 万个解析器都在缓存，你图切流快把 TTL 从 3600 秒（1 小时）一口气砍到 60 秒，权威查询量瞬间放大约 60 倍（从每秒不到 3 次猛蹿到平均每秒约 167 次），同时用户每分钟都得重新撞一次冷解析尾延迟。

    再算新鲜度这笔账：假设下午三点整你把记录改成了新机房 IP。此时世界各地解析器里攒着的旧副本，剩余寿命刚好在 0 到「旧 TTL」之间均匀分布——一分钟前刚拉过缓存的解析器，手里那份旧记录整整还要等一小时才过期！所以改完解析后，平均生效时间约等于旧 TTL 的一半，最坏全量生效时间约等于一整段旧 TTL。

    这就是运维界铁律「提前降 TTL」的由来：必须赶在切换前至少一个旧 TTL 周期（比如提前一小时以上），先把 TTL 调成 60 秒，等市面上拿着一小时旧门票的副本全部自然到期、重新换上 60 秒短门票之后，切换当天再动 IP，新地址才能在一分钟内全网跑通。出事那一刻才想起改 TTL，对已被缓存一小时的旧副本毫无用处。
  derivation: original
  sources:
  - ref: rfc-1035
    locator: §6.1.3 TTL 的缓存语义
    claim: 缓存按 TTL 倒计时过期，记录变更的最坏传播时间受旧 TTL 约束
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: a
      label: 用户（感知冷解析延迟）
    - lane: resolver
      id: r
      label: 全球解析器缓存
      highlight: true
    - lane: auth
      id: u
      label: 权威（查询量随 TTL 反比）
    messages:
    - id: m8
      from: r
      to: u
      label: TTL 砍到六十分之一，查询量约放大六十倍
      active: true
  log:
  - mode: 定量
    event: TTL 的新鲜度与权威负载是同一枚硬币的两面，只能换算、不能兼得
- id: anycast-authority
  title: 根与顶级域为什么扛得住：任播（Anycast）部署
  tldr: 全球查根的请求看似都奔向那少数几个公开地址，实际靠「任播」让几百座城市的机房同时宣告同一个 IP，路由器自动把包拐进最近的那一家。
  body: |-
    算完前面那笔查询量账，你心里肯定会冒出一个疑问：全世界几十亿台机器每次冷查询的第一步都冲向根服务器，可根服务器在名义上满打满算才十几个公开地址，为什么没被全球流量当场压垮？秘密武器就在底层的[[任播|Anycast]]部署。

    平时我们连网站是「单播」——一个 IP 只归全球某一台或某一座机房独享；而任播是让遍布世界各大洲的几百上千个根镜像机房，一起对外面的路由系统喊话：「这个 IP 归我管！」这样东京的解析器查根时，包刚出本地运营商没几跳就落进了东京本地的根实例；圣保罗的解析器问一模一样的 IP，数据包则直接拐进了南美机房。如果某地机房故障撤掉路由宣告，路由器几秒内就会把包自动改道给次近的节点。

    不过任播有个细节很容易误判：路由器挑的是「网络拓扑路径最近」，并不保证等于地图上的直线距离最近——一旦跨境光缆绕行，离你几百公里的邻居在网络上可能反而要绕道邻国。好在根和顶级域干的都是「只指路、不记任何历史状态」的纯无状态服务，全球所有副本里的指路单分毫不差，落到哪台实例都一样准，跟任播正好天生绝配。
  derivation: original
  sources:
  - ref: rfc-1034
    locator: §3.6 权威服务器与转介
    claim: 权威链每级只返回转介信息，无状态的指路服务适合多实例部署
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: a
      label: 全球解析器
    - lane: resolver
      id: r
      label: 路由系统（选最近实例）
      highlight: true
    - lane: auth
      id: u
      label: 根的全球任播实例
      state: 同一地址多地应答
    messages:
    - id: m9
      from: r
      to: u
      label: 同一个 IP，东京的问东京实例
      active: true
  log:
