- id: ecs-accuracy
  title: 调度为什么会选错：解析器位置与 ECS
  tldr: 权威默认只能看见解析器的地址；用户用远方解析器时，就近调度会被带偏。
  body: 'DNS 调度有个先天信息缺陷：查询到达 CDN 权威时，包的来源是递归解析器，不是用户本人。用户在东京、却把解析器设成了另一大洲的公共服务，权威看到的位置在彼大洲，就会返回彼大洲的边缘 IP——解析完全正确，调度却彻底南辕北辙，用户随后要跨洋访问一个本可同城命中的节点。


    缓解办法是 ECS（EDNS 客户端子网）：解析器在查询里附上用户 IP 的一个前缀（通常截断到较粗的粒度以保护隐私），权威据此按用户的大致位置调度。代价同样真实：带 ECS 的查询让缓存按子网碎片化（同一域名要为不同子网分别缓存答案），解析器缓存命中率下降；且并非所有解析器都发送 ECS。排障启示：遇到「某个地区用户突然变慢」，先查这批用户的解析器出口与 ECS 行为，再怀疑边缘节点本身，顺序不要反。'
  derivation: original
  sources: []
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: a
      label: 东京用户
      highlight: true
    - lane: resolver
      id: r
      label: 远方公共解析器
    - lane: auth
      id: u
      label: CDN 权威（被位置误导）
    messages:
    - id: m11
      from: r
      to: u
      label: 查询来源在别的大洲
      active: true
  log:
  - mode: 误差
    event: 调度依据是解析器位置，未必等于用户位置
- id: ailink
  title: 为什么 AI 服务拼命做就近接入
  tldr: 推理延迟里网络往返与生成时间一样真实，接入层决定下限。
  body: '举个示意例子（数字为量级示意）：一次在圣保罗调用部署在弗吉尼亚的推理 API：光是 DNS+TCP+TLS 就可能吃掉 3–4 个跨洋 RTT，半秒还没见到第一个 token。多地域部署 + DNS/Anycast 就近接入，能把接入往返压到同洲的量级。


    反过来，TTL 与缓存也决定了故障时流量切走的速度。所以接入层（解析、调度、边缘）与模型本身一样，是 AI 服务体验的一部分——这也是三节网络课收尾要说的工程账。工程注记：dig 经递归解析器查到的应答里，TTL 是「剩余秒数」：看到很小的数说明缓存快过期（直接问权威服务器则返回配置的原始 TTL）。切换解析前先把 TTL 提前一两个周期调低，切换当天才不会被旧缓存拖住。再补一笔：就近接入对推理服务还有一层合规与成本含义——请求落在哪个地域，往往同时决定了数据驻留与计费口径，调度策略从来不只是性能问题。'
  derivation: original
  sources: []
