    event: 根在逻辑上只有少量地址，在物理上靠任播复制成了全球大量实例
- id: cdn
  title: CDN 登场：把缓存与接入点搬到东京和圣保罗
  tldr: 名字查出最近的地址后，CDN 让东京和圣保罗的用户各自连进当地边缘机房：静态内容直接吐回不回源，动态请求也能就近握手后再走专线回源。
  body: |-
    域名总算翻成 IP 了，可物理距离这关还没过：假如 cs.ki-toko.com 的源站放在美国，哪怕域名 1 毫秒查出来，东京和圣保罗的用户只要得大老远跑去美国做 TCP 与 TLS 握手，光在跨洋光缆上来回几趟就得一两百毫秒起步。[[CDN]]（内容分发网络）就是把边缘节点铺到东京、圣保罗等全球各地，替用户把这几千公里砍掉。

    对于 JS 脚本、CSS、图片或模型静态分片这类大家看得都一样的文件，只要同城之前有人访问过，边缘节点就会把副本留下来；下一个东京用户请求进来，20 毫秒就从东京边缘拿到，根本不用跑去 200 毫秒外的美国源站。哪怕遇上热文件刚过期、成千上万个用户同时未命中，成熟 CDN 也会靠「回源合并」只派一个代表回源取货，其余请求都在边缘原地排队共享同一份结果，避免把源站打穿。

    至于哪些内容能缓、哪些绝不能缓，规矩依然由源站 HTTP 响应头说了算——标明了不缓存的动态响应，边缘节点绝不擅自扣留。面对不能缓存的动态接口，边缘节点也能先帮你把最费往返的 TCP 握手和 TLS 加密在 20 毫秒同城距离内接住终结掉，再顺着 CDN 维护的高速骨干长连接专线把请求送回源站，照样省下一大截等待时间。
  derivation: original
  sources: []
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: a
      label: 东京用户
      state: 就近接入
      highlight: true
    - lane: resolver
      id: r
      label: CDN 调度
      state: 返回最近边缘
    - lane: auth
      id: u
      label: 边缘节点（东京）
      state: 缓存命中/终结连接
      highlight: true
    messages:
    - id: m4
      from: a
      to: u
      label: 到边缘 20 ms，而不是回源 200 ms
      active: true
  log:
