objectives:
- 画出根→顶级域→权威的迭代查询链
- 解释多级缓存与 TTL 如何把解析压到毫秒级
- 说清 CDN 用 CNAME/Anycast 把用户导向边缘节点的两种方式
aiLink: 全球用户调同一个推理 API，有人快有人慢，差距常在接入层：DNS 调度与 CDN/Anycast 决定了请求落到哪个机房。理解解析链与 TTL，才懂故障切换为什么受 TTL 制约、为什么 AI 服务要多地域接入与就近路由。
design:
- mechanism: 'DNS 用分层委派组织全球命名空间：根只负责指出每个顶级域由谁管，顶级域只负责指出每个注册域的权威服务器，权威才保存具体记录；每一层只知道下一层的地址，从不保存全量数据。'
  problem: '域名总量是全球规模的，任何单点集中式数据库都会同时撞上容量、更新传播与单点故障三堵墙；而域名的管理权又天然分散在无数组织手里，集中托管在治理上也行不通，必须让各管各的。'
  choice: '于是选择按域名后缀逐级委派：查询沿委派链向下走，每级只做指路；同时允许每一级把上级给的指路信息与最终答案按 TTL 缓存下来，用缓存把绝大多数查询挡在权威服务器之外。'
  tradeoff: '代价是数据一致性变成最终一致：记录改了以后，散落在全球缓存里的旧副本要等各自 TTL 到期才消失，变更生效有一段不可压缩的灰色窗口，运维必须提前规划而不是改完即指望全量生效。'
  root: '根本权衡是权威负载对数据新鲜度：TTL 越长，权威被查询的次数越少、解析越快，但旧数据活得越久；TTL 越短，数据越新鲜、切换越灵活，代价是查询量与尾延迟同比上升，无免费取值。'
- mechanism: 'CDN 调度有两条路线：DNS 调度在解析应答阶段按请求来源选一个边缘 IP 返回；任播则让全球节点宣告同一个 IP，由互联网的路由系统把数据包送到拓扑上最近的那个宣告点。'
  problem: '用户分布在全球，源站在物理上只有一个位置；无论解析多快，只要最终落点离用户几千公里，往返时延的下限就被光速与路由跳数锁死，必须在「落点选择」这一层把距离问题解决掉。'
  choice: '静态内容优先靠边缘缓存加任播或 DNS 调度就近命中；动态请求则用边缘节点就近终结 TCP 与 TLS 再走优化过的骨干回源——两种调度常组合使用，而不是非此即彼的单选题。'
  tradeoff: 'DNS 调度灵活但粒度受解析器位置与 TTL 缓存拖累，切流慢且可能不准；任播切换快、粒度细，但路由变化不受应用控制，排障时同一个 IP 在不同时刻可能落到不同机房，可观测性变差。'
  root: '根源仍是距离决定时延下限：调度系统本质上是在用户发出第一个包之前，就替他做一次全局的「选哪个机房」的决策，决策时机越早（解析阶段），能省的往返越多、决策依据也越粗。'
quiz:
- q: 迭代查询中，根服务器返回的是什么？
  options:
  - 最终 IP
  - 负责该顶级域的服务器地址（下一步问谁）
  - 完整网页
  - 证书
  answer: 1
  explain: 迭代 = 每级只给指路信息；递归解析器顺着根→.com→权威一路问到底。
- q: TTL 设得很短（如 60 秒）的代价是？
  options:
  - 解析结果不准
  - 缓存很快过期，查询量与解析延迟上升，但切换生效快
  - 域名被注销
  - 只能解析一次
  answer: 1
  explain: TTL 是新鲜度与负载的权衡；大促/故障切换前常提前调低 TTL。
- q: CDN 让东京用户就近接入主要靠？
  options:
  - 把服务器搬去东京一台
  - CNAME 到 CDN 域名后按用户来源返回最近边缘节点 IP（或 Anycast 同 IP 多地宣告）
  - 压缩图片
  - 提高 TTL
  answer: 1
  explain: 调度发生在 DNS 应答阶段：解析器位置/用户位置决定返回哪个边缘 IP。
steps:
- id: cache-first
  title: 先翻缓存：大多数解析根本不出门
  tldr: 浏览器、操作系统、递归解析器多级缓存命中时，解析通常很快，不必真的出门问一圈。
  body: '你在地址栏回车之前，名字要先变 IP。但绝大多数时候这一步不出家门：浏览器有自己的 DNS 缓存，操作系统有系统缓存，二者未命中才问递归解析器（运营商或 1.1.1.1/8.8.8.8 这类公共解析器），解析器自己也有缓存。


    缓存的依据是每条记录的 TTL。热门域名的解析在层层缓存下几乎免费，这也是 DNS 能扛住全球流量的原因。把层级说清：浏览器缓存命中的代价近乎为零；操作系统缓存省掉一次到解析器的往返；解析器缓存命中则省掉后面整条权威查询链。反过来，排查「为什么我改了解析他还访问旧站」时也要按这个顺序逐层怀疑：先看是不是本地缓存没过期，再看解析器缓存，最后才轮到权威配置本身——顺序反了会浪费大量时间。'
  derivation: original
  sources: []
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: a
      label: 浏览器
      state: 查缓存
      highlight: true
    - lane: resolver
      id: r
      label: 递归解析器
      state: 也有缓存
    - lane: auth
      id: u
      label: 权威服务器
    messages: []
  log:
  - mode: 解析 0
    event: 三级缓存先行
- id: recursive-vs-iterative
  title: 递归 vs 迭代：一词之差，分工完全不同
  tldr: 客户端对解析器是递归（你替我问到底），解析器对权威链是迭代（每级只指路）。
  body: '这两个词描述的是同一趟查询的两个不同区段，不要混。用完整走例区分：你的电脑把「cs.ki-toko.com 的 A 记录是什么」整个问题甩给递归解析器，并只等一个最终答案——这叫递归查询，特点是「代劳到底」：中间问了多少人、绕了多少路，提问者一概不管，解析器负责把结果（或明确的无此记录）交回来。


    解析器接下活以后，对根、顶级域、权威说的话完全不同：它问根「.com 的事问谁」，根并不给最终答案，只回一份指路信息（负责 .com 的服务器名单）；它再拿这份名单去问下一级——每问一级只得到「下一步问谁」，自己一步步走完，这叫迭代查询。为什么权威链不肯代劳到底？因为根与顶级域要服务全球全部查询，若每个问题都代劳到底，它们要维护的状态与流量会爆炸；只指路、无状态，才能横向复制与任播部署。一个记法：递归是服务承诺（对提问者负责到底），迭代是协议分工（每级只交出自己那一段信息）。'
  derivation: original
  sources:
  - ref: rfc-1034
    locator: §2.3/§3.6 递归与迭代查询
    claim: 递归查询要求被问方给出最终答案，迭代查询只返回转介信息，由查询方继续追问
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: a
      label: 你的电脑（只要最终答案）
    - lane: resolver
      id: r
      label: 递归解析器（代劳到底）
      highlight: true
    - lane: auth
      id: u
      label: 权威链（每级只指路）
