title: DNS 解析与 CDN：名字如何变成最近的服务器
summary: 把一个好记的域名变成离你最近的服务器，靠的是两套配合默契的基础设施：一套是「层层指路、多级缓存」的全球域名查询网（DNS），另一套是「把节点铺到你家门口」的内容分发网络（CDN）。平时查十次域名有九次根本不用出门，浏览器、本地系统和递归解析器手里的缓存就能秒答；真遇上没见过的冷门域名，解析器才顺着根、顶级域和权威服务器逐级问到底，并按有效期缓存起来。等名字真要落成哪台机器时，CDN 再按照你的来源位置或网络路由把流量拐进当地边缘机房，既直接吐出静态内容，也让动态接口少跑几千公里。
premise: 你在浏览器地址栏敲下 cs.ki-toko.com 按回车，可底层的网线和路由器压根不认识英文字母，它们只认数字一样的 [[IP]] 地址。到底是谁帮你把这行好记的名字问成了地址？更神奇的是，同样敲这个名字，你在东京连上的节点来回只要二十毫秒，而远在圣保罗的朋友连上的则是南美另一台离他最近的机器——这背后是谁在分流、又是怎么扛住全球请求而不崩溃的？这节课就跟着东京和圣保罗两次首次访问 cs.ki-toko.com 的全程，把寻址和就近接入的来龙去脉跑一遍。
position: 本课归入计算机网络「名字变地址」板块，专门补全上一课《一个 HTTP 请求的一生》开头被一笔带过的寻址步骤：不先把域名翻译成 IP 地址，后面的三次握手连对方机器在哪都摸不着。等地址查准、节点也挑好之后，下一课就会转入「发送的节奏」板块，追问连接已经建好时，收发双方怎么靠窗口额度控制发包速度、避免把对方或网络塞堵。
bridge:
  prev: 上一课算一次加密请求的往返时间时，我们把域名查地址笼统记成了「大约一个来回」。这一课把这步拆开放大：没命中缓存时解析器到底要跑几趟腿，以及内容分发网络怎么挑出离你最近的那座机房。
  next: 名字已经落成最近的 IP 地址，连接也搭通了，接下来数据不能一古脑往网线里猛灌。下一课转向发送节奏的掌控：看收发双方怎么靠窗口配额管住发包量，又怎么在网络堵车时自动降速。
overview:
- key: 一句话总结
  value: DNS 靠分级委派和多级缓存把名字问成 IP；CDN 靠边缘节点就近接管流量，让你不用每次都跨半个地球回源站。
- key: 两种查询
  value: 递归是「你问我，我替你跑腿问到底」；迭代是「我只告诉你下一步去问谁，你自己接着跑」。
- key: 记录
  value: "[[A 记录]] 给 IPv4 地址、[[AAAA 记录]] 给 IPv6 地址，[[CNAME]] 把名字转指另一个名字（CDN 调度的核心抓手）。"
- key: TTL
  value: "[[TTL]] 是记录在缓存里能活多少秒的有效期，代表新鲜度与查询量之间的权衡：设得长，解析器反复复用旧答案、权威压力小，但改 IP 后全网等旧副本过期要很久；设得短，切流生效快，代价是大家会更频繁地回来重问。"
- key: 在终端里看一看
  value: "[[dig]] cs.ki-toko.com　看解析结果与 TTL；dig +trace　看逐级迭代"
