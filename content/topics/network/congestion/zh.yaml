aiLink: 跨区推理的尾延迟、分布式训练的同步效率、权重分发的吞吐，都直接受拥塞控制影响。理解 cwnd 的锯齿，才能解释「带宽明明没跑满、延迟却在抖」这类常见怪事。
design:
- mechanism: 经典拥塞控制拿丢包当成信号：发送方持续加窗试探，直到路由器队列溢出丢包再退让减半，不指望中间路由器主动发警报。
  problem: 互联网按端到端原则设计，沿途十几台路由器只顾闷头转发，谁都不负责通知端主机「我这里排队快满了」，发送方睁眼瞎，只能靠自己收得到的蛛丝马迹反推网络拥堵。
  choice: 于是协议选了「丢包」这个虽粗糙但百分百落得到的物理现象做信号：只要总流量超过瓶颈容量，队列最终必然溢出丢包或拉高延迟，不用改造全球任何一台中间设备就能跑起闭环控制。
  tradeoff: 信号天生带噪声又滞后：Wi-Fi 信号差丢个包会被当成堵车白白砍半速度；遇到缓冲区特别深的路由器，时延早炸到几百毫秒了包还没丢，算法还在傻傻加速。
  root: 更深层的原因是部署成本：指望全网成千上万家运营商同步升级路由器给主机发显式拥堵通知，在现实里推不动，谁不需要中间人配合就能独立运行，谁就能铺满全世界。
- mechanism: 拥塞避免采取 [[AIMD]] 规则：没丢包时每个往返加一个固定小量，一旦丢包就按固定比例砍掉（比如乘 0.5）；所有人跑同一条规则，不用中心裁判分配带宽。
  problem: 一条跨洋光缆上往往同时挤着几十条连接，如果大家只顾自己往死里加窗口，总流量瞬间冲垮路由器队列，所有人一起重传、有效吞吐跌成零（拥塞崩溃）。
  choice: 让每条流都在平稳期每次只加 1 个段（加性增），遇到丢包按比例一起砍半（乘性减）：涨的时候人人平起平坐，退的时候窗口大的流被砍掉的绝对量远多于窗口小的流。
  tradeoff: 为了摸清天花板在哪，系统必须不停往上蹭直到主动撞出一次丢包，周期性锯齿与轻微丢包是规则内生的代价；另外往返时间越长的流每分钟涨窗次数越少，先天吃短路径流的亏。
  root: 公平性来自简单的代数收敛：同时加上同一个数，两者的差距不变；同时乘以 0.5，差距直接缩水一半——这样一加一砍交替几轮，两条流的差距就按几何级数缩到趋近于零。
quiz:
- q: 实际发送速率由哪两个窗口共同决定？
  options:
  - 只由接收窗口决定
  - min（接收窗口 rwnd，拥塞窗口 cwnd)
  - 只由拥塞窗口决定
  - 由应用的心情决定
  answer: 1
  explain: rwnd 保护接收方缓冲，cwnd 保护网络；在途数据不得超过两者中较小的一个。
- q: AIMD 的「乘性减」为什么对公平重要？
  options:
  - 它让所有连接同时断开
  - 丢包时发得多的流减得绝对量更大，长期趋向均分带宽
  - 它提高了总带宽
  - 它消除了丢包
  answer: 1
  explain: 加性增人人相等、乘性减按比例，于是窗口大的流退让更多，多流自组织出大致公平。
- q: BBR 与经典 Reno/CUBIC 的根本不同是？
  options:
  - BBR 不用 ACK
  - BBR 按测量到的瓶颈带宽与 RTT 建模定速，而非主要依赖丢包信号调窗口
  - BBR 没有慢开始所以更快
  - BBR 只用于 UDP
  answer: 1
  explain: BBR 把目标定为「管道容量 = 带宽 × 传播时延」，主动避免把队列塞满；经典算法以丢包为主要拥塞信号。
steps:
- id: why
  title: 两个不同的「慢」：别把接收方和网络搞混
  tldr: 往法兰克福传大文件卡壳，背后只有两种完全不同的「慢」：要么对端来不及收，要么中间路由器堵死了。TCP 用 [[rwnd]] 和 [[cwnd]] 两个独立阀门分别盯死这两件事，实际在途数据量永远取两者的较小值。
  body: |-
    北京机房火力全开往法兰克福灌数据时，可能踩进两种截然不同的失败：第一种是法兰克福那边的程序读磁盘太慢，接收缓冲区塞满了，再发过去的包只能被对方原样扔掉；第二种是接收方内存空着，但半路某台骨干路由器的排队队列被无数条流一起塞爆，大家集体丢包重传、越重传越堵，最后有效吞吐跌回谷底（拥塞崩溃）。

    为了分别防住这两头，[[TCP]] 给发送方装了两个独立上限：接收方报上来的接收窗口（[[rwnd]]）管「对面还吃得下多少」，发送方自己估算的拥塞窗口（[[cwnd]]）管「路上还能塞多少才不堵」，真正允许发在路上还没收到确认的数据量 = min(rwnd, cwnd)。为什么不能合二为一？因为信息来源天差地别——rwnd 是对面主机在每个确认包里白纸黑字写出来的；cwnd 对应的中间路由器压根不会说话，发送方只能靠自己不断试探踩雷来猜全网余量，难度高了一个量级。

    把两者混为一谈，排查时就会反复误诊：如果链路空荡荡地几乎没丢包，发送方却发几 KB 就卡在原地，多半是接收端程序卡死把 rwnd 压到了零；反过来如果接收方窗口还大得很，带宽却跑不满还成片丢包，那就是 cwnd 已经冲破中间瓶颈，先别去折腾对端代码。
  derivation: original
  sources:
  - ref: rfc-5681
    locator: RFC 5681 Section 1-2（拥塞窗口与流量控制的关系）
    claim: TCP 发送量受接收窗口与拥塞窗口两者中较小者限制
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: sender
      id: s
      label: 发送方
      highlight: true
    - lane: net
      id: n
      label: 网络
    - lane: receiver
      id: r
      label: 接收方
    messages: []
  log:
  - mode: 分工
    event: 分工定清了：rwnd 防接收方缓冲溢出，cwnd 防网络被塞到拥塞
- id: flow
  title: 流量控制：接收方用 rwnd 实时报出还剩多少空位
  tldr: 流量控制是点对点的缓冲保护：接收方在每个 [[ACK]] 里写明自己还剩多少空闲缓存（[[rwnd]]），发送方保证已发未确认的数据不超过它；缓存一旦满到归零，发送方就得刹车并周期性探测，防止双方干等死锁。
  body: |-
    法兰克福接收端在内存里划了一块接收缓冲区，每次收到北京发来的数据包、回复 [[ACK]] 时，都会顺手在 TCP 包头的窗口字段里填上「我缓冲区里现在还剩多少字节空位」，这就是 [[rwnd]]。假设现在报回来还剩 64 KB 空位，北京这边就算算账：已发出去但还没拿到确认的数据必须控制在 64 KB 以内。一旦那边写磁盘慢了、缓冲区被填满，下个 ACK 里的 rwnd 就会变成 0，北京收到后必须立刻停发业务数据。

    等一下，16 位窗口字段最大只能写到 64 KB，跨洋百兆传大文件岂不是远远不够？确实如此，后面第 9 步算一算就会发现这根专线至少得同时放 1.25 MB 在路上才跑得满。TCP 的补救办法是在三次握手时协商一个「窗口扩大选项」（Window Scale），双方约好把包头里的 16 位整数往左移几位（比如左移 7 位就是乘以 128），把通告上限轻松拉到几十上百兆字节，这才撑得住现代高速链路。

    还有一个容易卡住的问题：rwnd 归零后我停发了，万一接收方读走数据腾出空位、发回来通知「重新开窗」的那一个 ACK 半路丢了怎么办？由于纯 ACK 不占序号、丢了不会重传，双方真就会僵在原地互相干等到天荒地老。为了堵死这个死锁洞，发送方停发后会按退避周期主动塞出只带 1 字节的零窗口探测包，逼接收方回一个带有最新 rwnd 的 ACK，直到看见空位重新大于零再恢复全速。
  derivation: original
  sources:
  - ref: rfc-9293
    locator: RFC 9293 流量控制与窗口机制一节
    claim: 接收方通过窗口通告控制发送方的在途数据量，窗口为零时发送方停止发送数据段
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
