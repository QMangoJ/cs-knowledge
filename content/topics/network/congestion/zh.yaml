objectives:
- 区分流量控制与拥塞控制各自的保护对象与信号来源
- 复述慢开始、AIMD 与超时反应的完整规则
- 说清 CUBIC 与 BBR 相对经典算法改变了什么
aiLink: 跨区推理的尾延迟、分布式训练的同步效率、权重分发的吞吐，都直接受拥塞控制影响。理解 cwnd 的锯齿，才能解释「带宽明明没跑满、延迟却在抖」这类常见怪事。
design:
- mechanism: '经典拥塞控制把丢包当作拥塞信号：发送方持续试探着加大在途数据量，直到路由器队列溢出发生丢包，再退让减速；重复 ACK 与超时就是这套机制的感官，窗口就在试探与退让之间锯齿运行。'
  problem: '端到端原则下，网络内部对端主机基本不可见：路由器只负责转发，没有义务、也没有标准机制向每条流通报「我这里堵了」，端主机想知道拥塞程度，只能从自己能观测到的现象里反推。'
  choice: '于是选择用丢包这个虽粗糙却必然可得的信号：队列的物理行为保证了过载最终一定表现为丢包或时延暴涨，发送方无需任何中间设备配合就能闭环控制，这使算法能部署在任何现存网络上。'
  tradeoff: '代价是信号有噪声也有滞后：无线误码造成的丢包会被误判成拥塞而白白降速，深队列时包还没丢、时延已经先爆；三十多年的后续算法演进，基本都是在修这个信号的毛病。'
  root: '更深一层是部署的历史路径：显式通知要求沿途每台设备都升级配合，在一个多方运营、设备异构的网络里，任何依赖中间设备配合的方案都极难全网落地，端侧自适应因此胜出。'
- mechanism: 'AIMD 的规则是每条流无丢包时每个往返把窗口加一个固定小量（加性增），检测到丢包时把窗口按固定比例砍掉（乘性减）；所有流执行同一条规则，不需要任何中心协调者来分配带宽。'
  problem: '多条流共享一个瓶颈时，公平不能靠自觉：若每条流都只顾把自己的速率最大化，总和必然冲过瓶颈容量引发集体丢包与重传，最终所有人的有效吞吐一起崩塌，即拥塞崩溃。'
  choice: '选择加性增加乘性减的组合：增长时人人加同样的绝对量，公平且温和地试探余量；收缩时按比例砍，当前窗口越大的流砍掉的绝对量越多，于是各流窗口被反复往相近的水平拉。'
  tradeoff: '代价是稳态必然伴随周期性丢包：窗口要靠「涨到丢包」才知道探到了顶，锯齿与丢包是这套规则的内生属性而非故障；且对往返时间长的流不友好，它们每单位时间加窗的次数更少。'
  root: '公平性的根在数学收敛：设两条流窗口一大一小，每轮加性增使两者差距不变，乘性减使差距按同一比例缩小，两步交替之下差距几何级数地衰减，系统必然趋向均分，这是已被证明的结论。'
quiz:
- q: 实际发送速率由哪两个窗口共同决定？
  options:
  - 只由接收窗口决定
  - min（接收窗口 rwnd，拥塞窗口 cwnd)
  - 只由拥塞窗口决定
  - 由应用的心情决定
  answer: 1
  explain: rwnd 保护接收方缓冲，cwnd 保护网络；在途数据不得超过两者中较小的一个。
- q: AIMD 的「乘性减」为什么对公平重要？
  options:
  - 它让所有连接同时断开
  - 丢包时发得多的流减得绝对量更大，长期趋向均分带宽
  - 它提高了总带宽
  - 它消除了丢包
  answer: 1
  explain: 加性增人人相等、乘性减按比例，于是窗口大的流退让更多，多流自组织出大致公平。
- q: BBR 与经典 Reno/CUBIC 的根本不同是？
  options:
  - BBR 不用 ACK
  - BBR 按测量到的瓶颈带宽与 RTT 建模定速，而非主要依赖丢包信号调窗口
  - BBR 没有慢开始所以更快
  - BBR 只用于 UDP
  answer: 1
  explain: BBR 把目标定为「管道容量 = 带宽 × 传播时延」，主动避免把队列塞满；经典算法以丢包为主要拥塞信号。
steps:
- id: why
  title: 两个不同的「慢」：别把对端和网络搞混
  tldr: 接收方处理不过来，与网络中间堵车，是两件独立的事，需要两个独立的阀门。
  body: '设想发送方火力全开：一种失败是接收方应用读得慢，接收缓冲被塞满，再发的只能丢弃重传；另一种失败是中间路由器的队列被所有流一起塞爆，大家集体丢包重传、越重传越堵（拥塞崩溃）。

    TCP 用两个窗口分别管这两件事：接收方通告的 rwnd 管「对端还收得下多少」，发送方自己维护的 cwnd 管「网络里适合在途多少」。实际能发的 = min(rwnd, cwnd)。握手一课管连接的生死，这一课管连接活着时该发多快。为什么必须分开？因为两者的信息来源完全不同：rwnd 是对端明说的（写在每个 ACK 里），cwnd 是网络从不明说的、只能靠发送方自己试探推断的。前者是点对点的礼貌，后者是分布式系统的全局协调问题——后者的难度高一个量级，也是本课大部分机制存在的原因。把两者混为一谈，就会在「明明带宽空着却发不动」（rwnd 被慢应用压到 0）和「带宽没标称满却疯狂丢包」（cwnd 集体过冲）这两种故障之间反复误诊。'
  derivation: original
  sources:
  - ref: rfc-5681
    locator: RFC 5681 Section 1-2（拥塞窗口与流量控制的关系）
    claim: TCP 发送量受接收窗口与拥塞窗口两者中较小者限制
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: sender
      id: s
      label: 发送方
      highlight: true
    - lane: net
      id: n
      label: 网络
    - lane: receiver
      id: r
      label: 接收方
    messages: []
  log:
  - mode: 分工
    event: rwnd 防对端溢出，cwnd 防网络拥塞
- id: flow
  title: 流量控制：rwnd 是怎么通告的
  tldr: 每个 ACK 都带一个窗口字段：我缓冲里还剩多少空位；发送方未确认的在途数据不得超过它。
  body: '接收方每发一个 ACK，就在 TCP 头的窗口字段里写上当前接收缓冲的剩余空间。发送方据此保证：已发出但还没被确认的数据量 ≤ rwnd。接收应用读得快、缓冲空，rwnd 就大；应用卡住不读，缓冲被填满，rwnd 变 0，发送方必须停发，只周期性发零窗口探测包等对方重新打开窗口。

    这是点对点的保护，与网络状态无关：哪怕链路空得能跑马，对面说收不下就不能发。补两个机制细节：其一，窗口字段本身只有 16 位、最大只能表示 64KB 量级，高带宽长时延链路上远远不够，所以握手时双方要协商窗口扩大选项，把通告值按位移放大——这也是握手要搭车带选项的一个实例。其二，零窗口时发送方不能彻底睡死：万一「窗口重新打开」的那个 ACK 丢了，双方会互相等到地老天荒，所以发送方要周期性发只带极少量数据的探测段，用对方的回 ACK 顺带刷新窗口信息，这是个专门防死锁的小设计。'
  derivation: original
  sources:
  - ref: rfc-9293
    locator: RFC 9293 流量控制与窗口机制一节
    claim: 接收方通过窗口通告控制发送方的在途数据量，窗口为零时发送方停止发送数据段
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: sender
      id: s
      label: 发送方
    - lane: net
      id: n
      label: 网络
    - lane: receiver
      id: r
      label: 接收方
      highlight: true
    messages:
    - id: m-fw
      from: r
      to: s
      label: ACK + 窗口通告：还剩 64KB 空位
      active: true
  log:
  - mode: 流控
    event: rwnd 随接收应用的读取速度实时变化
- id: signals
  title: 拥塞控制先要回答：怎么知道堵了
  tldr: 网络不会发「我堵了」的通知（基本不会），TCP 只能从丢包与时延的蛛丝马迹里猜。
  body: '路由器队列满了就直接丢包，没有义务通知任何人。所以经典 TCP 把丢包当作拥塞信号：收到 3 个重复 ACK（说明后面的包到了、中间的丢了）判定丢了一个包；更严重时只能等重传超时（RTO）。

    信号是有噪声的：无线链路的丢包可能只是信号不好，并非拥塞；反过来，队列很长但还没丢包时（bufferbloat），时延已经爆了包还没丢。现代算法（BBR、以及基于时延的 Vegas 系）因此还盯着 RTT 的变化来估拥塞。信号选错，后面所有控制律都会跟着错。再把两种丢包信号的时效性摆明：重复 ACK 是快信号，丢包后约一个 RTT 内就能推断出来，因为后续包一到达就会触发对同一序号的重复确认；超时是慢信号兼兜底信号，要等到明显超过正常往返时间还没确认才能下结论，代价是这段时间发送基本停摆。本课后面的快速重传与 RTO 两步，就是分别在打磨这快慢两个信号。'
  derivation: original
  sources:
  - ref: rfc-5681
    locator: RFC 5681 Section 2-3（丢包检测与快速重传）
    claim: 经典 TCP 以丢包（重复 ACK 与超时）作为拥塞的主要信号
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: sender
      id: s
      label: 发送方
      highlight: true
    - lane: net
      id: n
      label: 网络
    - lane: receiver
      id: r
      label: 接收方
    messages:
    - id: m-sg
      from: n
      to: s
      label: 队列满 → 丢包；发送方靠重复 ACK 猜到
      active: true
  log:
  - mode: 信号
    event: 丢包是延迟且有噪声的拥塞信号
- id: slow-start
  title: 慢开始：先指数试探
  tldr: 新连接不知道网络能吃多少：cwnd 从几个 MSS 起步，每收到 ACK 就涨，一个 RTT 翻一倍。
  body: '连接刚建好时对可用带宽一无所知，一上来猛发就是拥塞崩溃的元凶。慢开始（名字误会：其实涨得很快）让 cwnd 从很小的值起步（现代实现初始窗口常见 10 个 MSS 量级），每收到一个 ACK 就把 cwnd 加一个 MSS——效果是每个 RTT 大致翻倍，指数逼近可用带宽。


    为什么是指数而不是线性？因为可用带宽的量级完全未知（可能是拨号级，也可能是万兆级），线性爬升找到量级要花与量级成正比的时间，指数爬升只需要与量级对数成正比的几个 RTT。代价是指数增长的最后一跳可能冲过头、一次性打出超出管道的包，这正是它需要在出现丢包时立刻转入保守模式的原因。指数阶段在两种情况下结束：收到丢包信号，或 cwnd 涨到慢开始阈值 ssthresh（上次丢包时记下的值）。之后转入温和的线性试探。一条工程推论：短连接（只传几十 KB）常常一辈子都在慢开始里、还没探到真实带宽就结束了——这就是小请求延迟与长连接差一截的又一个原因。'
  derivation: original
  sources:
  - ref: rfc-5681
    locator: RFC 5681 Section 3.1 Slow Start
    claim: 慢开始阶段每个 ACK 使拥塞窗口增加至多一个 MSS，窗口随 RTT 近似指数增长直至 ssthresh 或丢包
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: sender
      id: s
      label: 发送方
      highlight: true
    - lane: net
      id: n
      label: 网络
    - lane: receiver
      id: r
      label: 接收方
    messages:
    - id: m-ss
      from: s
      to: n
      label: 'cwnd: 10 → 20 → 40 翻倍中'
      active: true
  log:
  - mode: 慢开始
    event: 指数增长是为了几 RTT 内找到量级
- id: aimd
  title: 拥塞避免与 AIMD：锯齿的由来
  tldr: 平稳期每个 RTT 把 cwnd 加约 1 个 MSS（加性增）；一旦丢包就把 cwnd 砍半（乘性减）。
  body: '进入拥塞避免阶段后规则变稳重：加性增（AI）——每个 RTT 大约 +1 MSS，慢慢试探更多带宽；乘性减（MD）——检测到丢包就把 cwnd 乘以 0.5（具体系数随算法版本而定）。快减慢加画出来就是那条经典的锯齿曲线。


    AIMD 的深意在多流共享时：所有流一起加、一损俱损地乘减，减得多的总是发得多的，长期看带宽被大体公平地切分——不用任何中心协调，靠同一条规则自组织出公平，这也是它统治了三十年的原因。一个极简的收敛图景：两条流窗口一为 20、一为 60，每轮加性增后变 21 与 61（差距仍是 40），遇丢包乘半后变约 10 与 30（差距缩到 20）——加的步调不改差距，减的步调按比例压缩差距，交替下去两条流必然越靠越近，这就是公平性的数学来源。超时（比丢包更严重的信号）的反应更激烈：ssthresh 记下当前一半，cwnd 打回初始，重新慢开始——因为超时意味着连重复 ACK 都没有，可能整条路径都已严重堵塞，必须按「从零试探」处理。'
  derivation: original
  sources:
  - ref: rfc-5681
    locator: RFC 5681 Section 3.1/3.2 Congestion Avoidance 与 Fast Retransmit
    claim: 拥塞避免阶段按 AIMD 调整窗口，丢包时窗口乘性减小，超时则回到慢开始
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: sender
      id: s
      label: 发送方（cwnd 锯齿）
      highlight: true
    - lane: net
      id: n
      label: 网络
    - lane: receiver
      id: r
      label: 接收方
