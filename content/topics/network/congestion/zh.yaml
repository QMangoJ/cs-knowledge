      label: 接收方
    messages:
    - id: m-ss
      from: s
      to: n
      label: "cwnd: 10 → 20 → 40 翻倍中"
      active: true
  log:
  - mode: 慢开始
    event: 慢开始用指数增长，是为了在几个 RTT 内先找到可用带宽的量级
- id: aimd
  title: 拥塞避免与 AIMD：线性慢加、丢包砍半，锯齿里藏着公平
  tldr: 摸到可用带宽量级后转入拥塞避免：无丢包时每个 RTT 给 [[cwnd]] 加 1 个段（加性增），发现丢包立刻砍半（乘性减），合称 [[AIMD]]；这一慢一快画出锯齿形曲线，也让多条流在没有裁判的情况下自动均分带宽。
  body: |-
    跨过慢启动阈值进入拥塞避免后，发送方换上细水长流的走法：每过一个完整的 RTT（100 毫秒）才允许给 cwnd 增加大约 1 个 [[MSS]]（加性增），像用脚尖一点点往前试探余量。一旦收到 3 个重复 ACK（轻度丢包），立刻把 cwnd 乘以 0.5 砍掉一半（乘性减，各版本系数略有差异），再从半山腰继续一格格往上爬，时间轴上画出来就是标志性的锯齿曲线。要是碰到的不是 3 个重复 ACK、而是熬到 [[RTO]] 超时，说明连后续包都回不来、整条路可能全堵死了，这时必须把慢启动阈值 ssthresh 记为当前窗口一半，再把 cwnd 打回初始值从零重新慢启动。

    为什么丢包时非要按比例乘 0.5，而不是大家都固定减 10 个段？拿数字走一遍多流共享的神奇收敛就懂了：假设北京机房同时有流 A 和流 B 共用这条出境瓶颈，此刻流 A 窗口是 20，后进来的流 B 抢到了 60（差距 40）。平稳跑几轮各加 1，变成 21 和 61（差距依然是 40）；等队列满了一次丢包，两条流同时砍半变成 10 和 30（差距瞬间缩水到 20）；接着各加 10 到 20 与 40，再撞丢包砍半变成 10 和 20（差距只剩 10）。涨的时候人人加一样的绝对值，跌的时候窗口越大的被砍掉的绝对量越多——全网不用中心调度器，几十条流自己就把带宽匀平了。

    当然这套规则也有固有代价：它必须靠「一直涨到把队列撞丢包」来确认上限，所以周期性轻度丢包和吞吐锯齿是正常呼吸而非故障；另外由于涨窗速度按 RTT 计步，北京到法兰克福 100 毫秒的长连接每分钟加窗次数天生只有同城 2 毫秒短连接的五十分之一，长距离流跟短流混跑时天然吃亏。
  derivation: original
  sources:
  - ref: rfc-5681
    locator: RFC 5681 Section 3.1/3.2 Congestion Avoidance 与 Fast Retransmit
    claim: 拥塞避免阶段按 AIMD 调整窗口，丢包时窗口乘性减小，超时则回到慢开始
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
