    event: rwnd 不是固定值，它随接收应用读取数据的速度实时变化
- id: signals
  title: 拥塞感知：路由器不说话，发送方只能靠丢包和时延猜
  tldr: 中间路由器队列满时只会直接扔包，基本不给发送方发警报。经典 TCP 只能拿「3 个重复 ACK」当轻度丢包快信号、拿「超时 [[RTO]]」当重度堵塞兜底信号；现代算法则还会盯着 [[RTT]] 有没有悄悄拉长。
  body: |-
    对端能用 rwnd 直接报空位，可北京到法兰克福中间跨着十几台骨干路由器，每台只顾把到达的包塞进队列按顺序往外发。队列排到上限了，多进来的包当场被悄悄丢掉，路由器绝不会额外发一封信回来提醒你减速——发送方想不被自己塞死，只能像盲人探路一样从回来的确认包里猜。

    经典 TCP 主要看一快一慢两种丢包迹象。快信号是 3 个重复 ACK：假设北京连发 8 个包，第 5 个在半路被丢掉，后面的 6、7、8 顺利到了法兰克福；对方每收到一个乱序包都回一个「我还在等 5」的确认，北京在大约 1 个 RTT（100 毫秒）内就会凑齐 3 个一模一样的重复 ACK，立刻知道「只是掉了一个包，路还通着」。慢信号兼兜底则是重传超时（[[RTO]]）：连后面的包都杳无音信，干等到超时计时器响起才下判断，说明整条路径大概率已经堵死或中断，这段时间发送基本停摆，必须大退让。

    那丢包就一定等于堵车吗？并不完全是，这个信号天生带噪声。一方面，遇到 Wi-Fi 或移动信号抖动引起的随机误码丢包，中间路由器压根没堵，经典算法照样会被吓得砍半速度；另一方面，有些网络设备配了巨大的缓冲区（俗称 [[bufferbloat]] 缓冲膨胀），队列早排出了几百毫秒的长队却还没满到溢出丢包，只看丢包的算法还在傻傻加速。所以后来像 [[BBR]]、[[Vegas]] 这类算法不再单押丢包，而是把 [[RTT]] 突然抬升也当作拥堵的先兆。
  derivation: original
  sources:
  - ref: rfc-5681
    locator: RFC 5681 Section 2-3（丢包检测与快速重传）
    claim: 经典 TCP 以丢包（重复 ACK 与超时）作为拥塞的主要信号
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
