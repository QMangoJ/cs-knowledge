objectives:
- 区分流量控制与拥塞控制各自的保护对象与信号来源
- 复述慢开始、AIMD 与超时反应的完整规则
- 说清 CUBIC 与 BBR 相对经典算法改变了什么
aiLink: 跨区推理的尾延迟、分布式训练的同步效率、权重分发的吞吐，都直接受拥塞控制影响。理解 cwnd 的锯齿，才能解释「带宽明明没跑满、延迟却在抖」这类常见怪事。
design:
- mechanism: 经典拥塞控制把丢包当作拥塞信号：发送方持续加大在途量试探，直到队列溢出丢包再退让减速；重复 ACK 与超时是它的感官，窗口在试探与退让间锯齿运行。
  problem: 端到端原则下网络内部对端主机不可见：路由器只负责转发，没有义务也没有标准机制向每条流通报「我这里堵了」，拥塞程度只能从自己能观测到的现象里反推。
  choice: 于是用丢包这个虽粗糙却必然可得的信号：队列的物理行为保证过载最终一定表现为丢包或时延暴涨，发送方无需任何中间设备配合就能闭环控制，算法可部署在任何现存网络上。
  tradeoff: 代价是信号有噪声也有滞后：无线误码造成的丢包会被误判成拥塞而白白降速，深队列时包还没丢、时延已经先爆；三十多年的算法演进基本都在修这个信号的毛病。
  root: 更深一层是部署路径：显式通知要求沿途每台设备升级配合，在多方运营、设备异构的网络里极难全网落地，端侧自适应因此胜出。
- mechanism: AIMD 的规则是：每条流无丢包时每个往返把窗口加一个固定小量（加性增），检测到丢包时按固定比例砍掉（乘性减）；所有流执行同一规则，不需要中心协调者分配带宽。
  problem: 多条流共享一个瓶颈时，公平不能靠自觉：若每条流都只顾把自己的速率最大化，总和必然冲过瓶颈容量引发集体丢包与重传，所有人的有效吞吐一起崩塌，即拥塞崩溃。
  choice: 选择加性增加乘性减的组合：增长时人人加同样的绝对量，温和地试探余量；收缩时按比例砍，当前窗口越大的流砍掉的绝对量越多，于是各流窗口被反复往相近的水平拉。
  tradeoff: 代价是稳态必然伴随周期性丢包：窗口要靠「涨到丢包」才知道探到了顶，锯齿与丢包是这套规则的内生属性而非故障；且对往返时间长的流不友好，它们每单位时间加窗的次数更少。
  root: 公平性的根在数学收敛：加性增使各流差距不变，乘性减使差距按同一比例缩小，两步交替之下差距几何级数地衰减，系统必然趋向均分。
quiz:
- q: 实际发送速率由哪两个窗口共同决定？
  options:
  - 只由接收窗口决定
  - min（接收窗口 rwnd，拥塞窗口 cwnd)
  - 只由拥塞窗口决定
  - 由应用的心情决定
  answer: 1
  explain: rwnd 保护接收方缓冲，cwnd 保护网络；在途数据不得超过两者中较小的一个。
- q: AIMD 的「乘性减」为什么对公平重要？
  options:
  - 它让所有连接同时断开
  - 丢包时发得多的流减得绝对量更大，长期趋向均分带宽
  - 它提高了总带宽
  - 它消除了丢包
  answer: 1
  explain: 加性增人人相等、乘性减按比例，于是窗口大的流退让更多，多流自组织出大致公平。
- q: BBR 与经典 Reno/CUBIC 的根本不同是？
  options:
  - BBR 不用 ACK
  - BBR 按测量到的瓶颈带宽与 RTT 建模定速，而非主要依赖丢包信号调窗口
  - BBR 没有慢开始所以更快
  - BBR 只用于 UDP
  answer: 1
  explain: BBR 把目标定为「管道容量 = 带宽 × 传播时延」，主动避免把队列塞满；经典算法以丢包为主要拥塞信号。
steps:
- id: why
  title: 两个不同的「慢」：别把对端和网络搞混
  tldr: 先把场面摆清：一条跨洋连接上传大文件，发送方到底能发多快？这里有两种完全不同的「慢」——接收方处理不过来，与网络中间堵车，是两件独立的事，需要两个独立的阀门，这一步先把分工分清。
  body: >-
    发送方火力全开：一种失败是接收方应用读得慢，接收缓冲被塞满，再发的只能丢弃重传；另一种失败是中间路由器的队列被所有流一起塞爆，大家集体丢包重传、越重传越堵（拥塞崩溃）。


    TCP 用两个窗口分别管这两件事：接收方通告的 rwnd 管「对端还收得下多少」，发送方自己维护的 cwnd 管「网络里适合在途多少」。实际能发的 = min(rwnd, cwnd)。两者必须分开，因为信息来源完全不同：rwnd
    是对端明说的（写在每个 ACK 里），cwnd 是网络从不明说的、只能靠发送方自己试探推断的。后者是分布式系统的全局协调问题，难度高一个量级。混为一谈，就会在「带宽空着却发不动」（rwnd 被慢应用压到
    0）和「带宽没标称满却疯狂丢包」（cwnd 集体过冲）之间反复误诊。实际排查时这两种情况的外在表现完全不同：前者是链路明明空闲、发送方却被窗口钉在原地；后者是链路利用率看着不高、丢包却已经成片出现——先分清是哪一种，再决定改接收端还是改发送策略。
  derivation: original
  sources:
  - ref: rfc-5681
    locator: RFC 5681 Section 1-2（拥塞窗口与流量控制的关系）
    claim: TCP 发送量受接收窗口与拥塞窗口两者中较小者限制
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: sender
      id: s
      label: 发送方
      highlight: true
    - lane: net
      id: n
      label: 网络
    - lane: receiver
      id: r
      label: 接收方
    messages: []
  log:
  - mode: 分工
    event: 分工定清了：rwnd 防接收方缓冲溢出，cwnd 防网络被塞到拥塞
- id: flow
  title: 流量控制：rwnd 是怎么通告的
  tldr: 先看简单的那个阀门——管对端的。场面是接收方应用读得快慢不一，缓冲时满时空：每个 ACK 都带一个窗口字段，意思是「我缓冲里还剩多少空位」；发送方未确认的在途数据不得超过它。
  body: >-
    接收方每发一个 [[ACK]]，就在 [[TCP]] 头的窗口字段里写上当前接收缓冲的剩余空间。发送方据此保证：已发出但还没被确认的数据量 ≤ rwnd。应用读得快、缓冲空，rwnd 就大；应用卡住不读，缓冲被填满，rwnd 变
    0，发送方必须停发，只周期性发零窗口探测包等对方重新打开窗口。


    这是点对点保护，与网络状态无关。两个机制细节：其一，窗口字段本身只有 16 位、最大只能表示 64KB
    量级，高带宽长时延链路上远远不够，所以握手时双方要协商窗口扩大选项，把通告值按位移放大。其二，零窗口时发送方不能彻底睡死：万一「窗口重新打开」的那个 ACK
    丢了，双方会互相等到地老天荒，所以发送方要周期性发只带极少量数据的探测段，用回 ACK 顺带刷新窗口信息，防死锁。
  derivation: original
  sources:
  - ref: rfc-9293
    locator: RFC 9293 流量控制与窗口机制一节
    claim: 接收方通过窗口通告控制发送方的在途数据量，窗口为零时发送方停止发送数据段
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: sender
      id: s
      label: 发送方
    - lane: net
      id: n
      label: 网络
    - lane: receiver
      id: r
      label: 接收方
      highlight: true
    messages:
    - id: m-fw
      from: r
      to: s
      label: ACK + 窗口通告：还剩 64KB 空位
      active: true
  log:
  - mode: 流控
    event: rwnd 不是固定值，它随接收应用读取数据的速度实时变化
- id: signals
  title: 拥塞控制先要回答：怎么知道堵了
  tldr: 对端的阀门是对方明说的，网络的阀门却没人告诉你。这一步先解决感知问题：网络不会发「我堵了」的通知（基本不会），TCP 只能从丢包与时延的蛛丝马迹里猜——猜不准，后面所有调速都无从谈起。
  body: >-
    路由器队列满了就直接丢包，没有义务通知任何人。所以经典 TCP 把丢包当作拥塞信号：收到 3 个重复 ACK（说明后面的包到了、中间的丢了）判定丢了一个包；更严重时只能等重传超时（[[RTO]]）。


    信号是有噪声的：无线链路的丢包可能只是信号不好，并非拥塞；反过来，队列很长但还没丢包时（bufferbloat），时延已经爆了包还没丢。现代算法（[[BBR]]、基于时延的 [[Vegas]] 系拥塞算法）还盯着 [[RTT]]
    的变化估拥塞。两种丢包信号的时效性也不同：重复 ACK 是快信号，丢包后约一个 RTT
    内就能推断出来，因为后续包一到达就会触发对同一序号的重复确认；超时是慢信号兼兜底信号，要等到明显超过正常往返时间还没确认才能下结论，代价是这段时间发送基本停摆。
  derivation: original
  sources:
  - ref: rfc-5681
    locator: RFC 5681 Section 2-3（丢包检测与快速重传）
    claim: 经典 TCP 以丢包（重复 ACK 与超时）作为拥塞的主要信号
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: sender
      id: s
      label: 发送方
      highlight: true
    - lane: net
      id: n
      label: 网络
    - lane: receiver
      id: r
      label: 接收方
    messages:
    - id: m-sg
      from: n
      to: s
      label: 队列满 → 丢包；发送方靠重复 ACK 猜到
      active: true
  log:
  - mode: 信号
    event: 丢包是一个既延迟、又有噪声的拥塞信号，用它调速要接受误判
- id: slow-start
  title: 慢开始：先指数试探
  tldr: 信号有了，新连接还剩一个问题：第一次该发多少？它对可用带宽一无所知。这一步看起步策略：cwnd 从几个 MSS 起步，每收到 ACK 就涨，一个 RTT 翻一倍，先指数试探出量级。
  body: >-
    连接刚建好时对可用带宽一无所知，一上来猛发就是拥塞崩溃的元凶。慢开始让 cwnd 从很小的值起步（现代实现初始窗口常见 10 个 [[MSS]] 量级），每收到一个 ACK 就把 cwnd 加一个 MSS——每个 RTT
    大致翻倍，指数逼近可用带宽。


    为什么是指数而不是线性？因为可用带宽的量级完全未知（可能是拨号级，也可能是万兆级），线性爬升找到量级要花与量级成正比的时间，指数爬升只需要与量级对数成正比的几个
    RTT。代价是指数增长的最后一跳可能冲过头，一次性打出超出管道的包，所以一出现丢包就得立刻转入保守模式。指数阶段在两种情况下结束：收到丢包信号，或 cwnd 涨到慢开始阈值
    ssthresh（上次丢包时记下的值）。之后转入温和的线性试探。
  derivation: original
  sources:
  - ref: rfc-5681
    locator: RFC 5681 Section 3.1 Slow Start
    claim: 慢开始阶段每个 ACK 使拥塞窗口增加至多一个 MSS，窗口随 RTT 近似指数增长直至 ssthresh 或丢包
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: sender
      id: s
      label: 发送方
      highlight: true
    - lane: net
      id: n
      label: 网络
    - lane: receiver
      id: r
      label: 接收方
    messages:
    - id: m-ss
      from: s
      to: n
      label: "cwnd: 10 → 20 → 40 翻倍中"
      active: true
  log:
  - mode: 慢开始
    event: 慢开始用指数增长，是为了在几个 RTT 内先找到可用带宽的量级
- id: aimd
  title: 拥塞避免与 AIMD：锯齿的由来
  tldr: 指数试探找到量级后，节奏要慢下来进入平稳期：每个 RTT 把 cwnd 加约 1 个 MSS（加性增）；一旦丢包就把 cwnd 砍半（乘性减）——合称 [[AIMD]]，锯齿曲线就从这组规则里长出来。
  body: >-
    进入拥塞避免阶段后规则变稳重：加性增（AI）——每个 RTT 大约 +1 MSS，试探更多带宽；乘性减（MD）——检测到丢包就把 cwnd 乘以 0.5（具体系数随算法版本而定）。快减慢加画出来就是那条经典的锯齿曲线。


    AIMD 的深意在多流共享时：所有流一起加、一损俱损地乘减，减得多的总是发得多的，长期看带宽被大体公平地切分——不用任何中心协调就自组织出公平，这也是它统治了三十年的原因。收敛图景：两条流窗口 20 与 60，加性增后变 21 与
    61（差距仍是 40），乘半后变约 10 与 30（差距缩到 20）——加不改差距，减按比例压缩差距，交替下去必然越靠越近。超时的反应更激烈：ssthresh 记下当前一半，cwnd 打回初始，重新慢开始——因为超时意味着连重复
    ACK 都没有，可能整条路径都已严重堵塞，必须按「从零试探」处理。
  derivation: original
  sources:
  - ref: rfc-5681
    locator: RFC 5681 Section 3.1/3.2 Congestion Avoidance 与 Fast Retransmit
    claim: 拥塞避免阶段按 AIMD 调整窗口，丢包时窗口乘性减小，超时则回到慢开始
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: sender
      id: s
      label: 发送方（cwnd 锯齿）
      highlight: true
    - lane: net
      id: n
      label: 网络
    - lane: receiver
      id: r
      label: 接收方
    messages:
    - id: m-aimd
      from: s
      to: n
      label: 每 RTT +1 MSS 慢加；丢包即 ×0.5 快减
      active: true
  log:
  - mode: AIMD
    event: 加性增保证持续试探余量，乘性减保证快速退让并让多条流趋向公平
- id: fast-recovery
  title: 快速重传与快速恢复：丢一个包的完整走例
  tldr: 前面说的丢包信号里，重复 ACK 是最快的那种，这一步把它完整走一遍：段 5 丢失、6/7/8 到达触发三个重复 ACK，发送方立刻补发段 5 并把窗口减半进入恢复，而非干等超时。
  body: >-
    发送方连发数据段 1 到 8，其中段 5 在队列里被丢，段 6、7、8 顺利到达。接收方的规则是对乱序到达的段一律回「确认号还停在段 5 起点」的 ACK，等于反复催问段 5——于是发送方接连收到三个内容相同的重复
    ACK。数到第三个，基本断定：段 5 不是还在路上（那样最多触发一两个重复确认），而是真的丢了，随即不等 RTO 立刻重传段 5，这就是快速重传：把丢包恢复从秒级超时等待压回约一个 RTT。


    快速恢复：这次丢包只是一个包而非全线崩溃，不重启慢开始，而是先把 ssthresh 记为当前窗口一半、cwnd 砍半，随后每再收到一个重复 ACK 就允许临时多发一个新段（证明网络还在流动），等段 5
    的确认到达后退出恢复、回到拥塞避免。三个重复 ACK 的门槛不是随手定的——门槛太低会被正常的包乱序误触发重传与降速，太高则在途段不够多时永远凑不齐、只能退化成等超时。短流尾部丢包恰好凑不齐三个重复 ACK，是快速重传的结构性盲区。
  derivation: original
  sources:
  - ref: rfc-5681
    locator: RFC 5681 Section 3.2 Fast Retransmit/Fast Recovery
    claim: 三个重复 ACK 触发快速重传，快速恢复期间窗口减半并按重复 ACK 临时放行新数据
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: sender
      id: s
      label: 发送方（数到 3 个重复 ACK）
      highlight: true
    - lane: net
      id: n
      label: 网络（段 5 被丢）
    - lane: receiver
      id: r
      label: 接收方（反复确认到段 4）
    messages:
    - id: m-fr
      from: s
      to: r
      label: 立刻重传段 5，窗口减半进恢复
      active: true
  log:
  - mode: 快恢复
    event: 快速恢复能在一个 RTT 内把丢的包补上，避免掉进秒级的超时等待
- id: rto-karn
  title: 慢信号怎么定：RTO 的测量与 Karn 规则引子
  tldr: 快信号讲完，再看慢信号怎么定数值：超时到底等多久才算数？这一步算 RTO——它设在平滑 RTT 之上留出波动余量；还有一条测量纪律，重传过的段不能拿来测 RTT，否则会把估计算坏。
  body: >-
    超时信号的全部难点在于 RTO（重传超时）设多少：设短了，正常抖动都会触发假重传，平白浪费带宽还误降窗口；设长了，真丢包时要干等很久才恢复，尾延迟全毁。标准做法是持续测量：每收到确认就采样一次往返时间，用加权平均估出平滑
    RTT，再用样本的波动幅度（偏差量级）在此之上留出安全余量，RTO 随实测水位动态漂移。连续超时还会让 RTO 按倍数退避放大，避免在路径疑似断裂时高频无效重传。


    测量里埋着一个著名陷阱：一个段重传过之后收到的 ACK，到底确认的是原始那一份还是重传那一份，分不清。若误把「重传后很快回来的确认」当作原始段的往返时间，测得的 RTT 会短得离谱，进而把 RTO 设得过小，引发更多假重传。Karn
    规则给出的处理引子是：凡涉及重传段的样本一律不用作 RTT 估计。Karn 的思想——不确定的样本宁可丢弃，不可污染估计——在所有自适应超时设计里都通用。
  derivation: original
  sources:
  - ref: rfc-5681
    locator: RFC 5681 Section 2/3 超时与重传管理引论
    claim: 重传超时应基于往返时间的测量与波动估计设定，重传段的确认存在歧义需谨慎处理
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: sender
      id: s
      label: 发送方（维护 RTO 估计）
      highlight: true
    - lane: net
      id: n
      label: 网络（时延在抖动）
    - lane: receiver
      id: r
      label: 接收方
    messages:
    - id: m-rto
      from: n
      to: s
      label: 这个 ACK 确认的是哪一份？测不准就不用
      active: true
  log:
  - mode: RTO
    event: 超时值不是拍出来的，是持续测出来的，而且要防止被重传样本污染
- id: ecn
  title: 显式拥塞通知 ECN：给丢包信号留的后门
  tldr: 前面一直预设「网络不会说话」，这一步看一个例外机制：如果路由器肯开口呢？支持 ECN 的路由器在队列将满时不丢包、改在包头打标记，接收方把信号回带给发送方提前降速——代价是一个包都不用丢。
  body: |-
    前面的设计里预设了「网络不会说话」，[[ECN]] 就是给这个预设开的后门：与其等队列满到丢包，为什么不让路由器在队列刚开始变长、还没到丢包程度时，就在路过的数据包头上打一个「我这里开始堵了」的标记？接收方收到带标记的包后，在回确认里把这个信号带回去，发送方据此像对待一次丢包一样把窗口减下来——区别是这一次，一个包都不用丢、也不用重传，代价被提前且无损地支付了。

    为什么这么好的机制没有取代丢包信号？因为它是一条全链路契约：发送方与接收方两端的操作系统要协商启用、沿途路由器要实现打标记、任何一台中间设备若把相关标记位清掉或误处理，信号就会失真或连接异常。部署了几十年，它在受控环境（数据中心内部等）用得很好，在公网则是部分路径可用——所以现实定位是增益项而非替代品：有 ECN 时少丢些包、降速更平滑，没有时丢包信号照样兜底。
  derivation: original
  sources:
  - ref: rfc-5681
    locator: RFC 5681 Section 6/相关说明与拥塞信号讨论
    claim: 除丢包外，显式拥塞通知可作为拥塞信号使发送方在丢包发生前调整窗口（作为补充机制）
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: sender
      id: s
      label: 发送方（收到回带信号后减半）
    - lane: net
      id: n
      label: 路由器（不丢包，改打标记）
      highlight: true
    - lane: receiver
      id: r
      label: 接收方（在 ACK 里回带标记）
    messages:
    - id: m-ecn
      from: n
      to: r
      label: 队列将满：包上做显式标记
      active: true
  log:
  - mode: ECN
    event: ECN 的好处是提前且无损，代价是依赖全链路每一台设备都配合
- id: bdp
  title: 定量一算：带宽时延积决定窗口要多大
  tldr: 机制都看完，这一步算一笔总账，免得排查时方向就错了：管道容量等于带宽乘往返时延；窗口小于它，链路必然跑不满，与算法无关——先算这个数，再谈调算法。
  body: >-
    把窗口换算成吞吐上限，公式只有一条：稳态吞吐不超过窗口除以 RTT，而要把一条链路喂满，在途数据必须至少等于带宽时延积 [[BDP]]（带宽乘以 RTT）。一条 100 Mbps、RTT 100 毫秒的跨洋链路，BDP 是 100 乘
    0.1 等于 10 兆比特、约 1.25 兆字节——窗口（rwnd 与 cwnd 的较小者）若只有 64KB，吞吐上限就是 64KB 除以 0.1 秒、约 5
    Mbps，链路利用率不到百分之五，换什么拥塞算法都救不了，必须先靠窗口扩大抬 rwnd、靠慢开始让 cwnd 爬到 BDP 量级。


    窗口远大于 BDP 并不更好，多出来的数据只能在瓶颈队列里站着排队，把时延顶高（这正是 bufferbloat 的算术本质）。一切拥塞算法的实际工作，都可理解为围绕 BDP
    这个锚点找合适的在途量：低于它浪费带宽，高于它浪费时延。排查「专线跑不满」时，先算 BDP、再查两端窗口配置。
  derivation: original
  sources:
  - ref: rfc-5681
    locator: RFC 5681 Section 2 窗口与吞吐关系
    claim: 发送方在途数据受窗口限制，吞吐上限由窗口与往返时延之比决定
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: sender
      id: s
      label: 发送方（窗口即吞吐上限）
      highlight: true
    - lane: net
      id: n
      label: 跨洋管道（BDP 约 1.25MB）
    - lane: receiver
      id: r
      label: 接收方
    messages:
    - id: m-bdp
      from: s
      to: n
      label: 窗口 64KB 时利用率不到百分之五
      active: true
  log:
  - mode: 定量
    event: 排查跑不满时先算管道容量 BDP，再谈拥塞算法的优劣
- id: modern
  title: 从 Reno 到 CUBIC 与 BBR
  tldr: 锚点有了，再看经典算法在长肥管道上为什么不够用：经典 AIMD 爬升太慢；CUBIC 改增长曲线，BBR 干脆换思路——直接估瓶颈带宽。这一步对比三代算法各自改了什么。
  body: |-
    带宽×时延（BDP）很大的「长肥管道」里，每 RTT +1 MSS 要爬很久才能填满管道。CUBIC（Linux 长期默认）让窗口增长走一条三次曲线：在接近上次丢包点时慢、之后加速探测，使爬升速度对 RTT 更公平。

    BBR（Google 提出）换了一套世界观：持续测量瓶颈带宽与往返传播时延两个量，把发送速率锚在「带宽 × 时延」这个管道容量上，不等丢包就主动收敛；它的目标是队列里不排长队（低时延），而不是把队列塞满再退。两条路线在同一网络里相遇时的公平性至今仍是研究话题——丢包派会把队列填满，建模派不填，两者共用瓶颈时份额如何分配并没有一劳永逸的答案。这也是为什么「换个拥塞算法测速就变」，测速前应先确认两端实际启用的算法。
  derivation: original
  sources:
  - ref: rfc-5681
    locator: RFC 5681（经典算法基线；CUBIC 与 BBR 为其后演进）
    claim: RFC 5681 定义经典慢开始与 AIMD，后续算法在其信号与增长律上演进
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: sender
      id: s
      label: 发送方
      highlight: true
    - lane: net
      id: n
      label: 网络
    - lane: receiver
      id: r
      label: 接收方
    messages:
    - id: m-md
      from: s
      to: n
      label: BBR：按估得的瓶颈带宽 × RTT 定速，不等丢包
      active: true
  log:
  - mode: 演进
    event: 现代算法之争本质是信号之争：用丢包判断，还是用时延与建模判断
- id: ai-link
  title: 与 AI 工程的连接
  tldr: 最后一站把账落回 AI 工程，看看这些窗口规则怎样放大成应用层的现象：梯度同步时一条流被误降速、整步训练都要等它，流式输出时窗口锯齿会变成 token 吐字的抖动——跨地域同步训练、模型权重分发、流式推理都受拥塞控制影响。
  body: |-
    分布式训练的梯度同步对网络极敏感：一条流被拥塞控制误伤（如随机丢包被当成拥塞），整步训练被最慢的流拖住（木桶效应）。生产系统因此会调 BDP 相关的内核参数、换拥塞算法，或把同步搬到专用网络。

    对推理服务更日常的影响是尾延迟：流式输出经过一条拥塞的链路时，cwnd 锯齿会直接变成 token 吐字的抖动——锯齿低点那几百毫秒窗口收窄，token 攒着晚到；锯齿恢复时又一拥而出。操作清单：先确认瓶颈是 rwnd 还是 cwnd（两端窗口与算法配置不同，修法完全不同），再看丢包属于拥塞性还是随机性（链路质量问题换算法无用），最后才考虑调初始窗口、换 CUBIC 或 BBR 这类动作——每一步都要有抓包或计数器证据，不要靠感觉调参。直觉校准：凡是「吞吐或延迟随时间呈规律锯齿」的现象，先想窗口在涨落；凡是「恒定地慢、毫无波动」的现象，先想窗口上限或链路本身被某个固定值钉死——波动的形状本身就是第一手诊断信息。
  derivation: original
  sources:
  - ref: rfc-5681
    locator: RFC 5681 Section 1（拥塞控制对网络稳定性的意义）
    claim: 拥塞控制是端主机对网络负载的主要调节机制，直接影响吞吐与时延
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: sender
      id: s
      label: 发送方
    - lane: net
      id: n
      label: 网络
      highlight: true
    - lane: receiver
      id: r
      label: 接收方
    messages:
    - id: m-ai
      from: n
      to: s
      label: 误判一次拥塞，整步训练等最慢的流
      active: true
  log:
  - mode: 影响
    event: 网络层的一个窗口参数，能被放大成应用层看得见的尾延迟
