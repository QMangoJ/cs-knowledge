      to: r
      label: 立刻重传段 5，窗口减半进恢复
      active: true
  log:
  - mode: 快恢复
    event: 快速恢复能在一个 RTT 内把丢的包补上，避免掉进秒级的超时等待
- id: rto-karn
  title: 慢信号怎么设阈值：RTO 动态漂移与 Karn 规则防污染
  tldr: 兜底的重传超时 [[RTO]] 不能设成固定毫秒，必须基于持续实测的往返时延均值与波动幅度动态留出余量；而且凡是重传过的数据段，回来的确认绝不能用来更新 RTT（Karn 规则），否则会把超时值越算越短。
  body: |-
    跨洋链路的真实 RTT 平时在 100 毫秒上下晃动，晚高峰偶尔抖到 150 毫秒。如果把 RTO 写死成 120 毫秒，每次正常高峰抖动都会触发假超时，白白重传一大堆已经在路上的包还把窗口打回起点；反过来写死成 5 秒，真掉包时整条连接就要像死机一样黑屏 5 秒。因此 TCP 每收到没重传过的新段确认就采样一次往返时间，算出一个随水位漂移的平滑均值，再加上几倍的波动偏差作为安全垫，让 RTO 动态跟着线路走。要是连续多次超时，RTO 还会按倍数指数退避，免得光缆真断了还在高频撞墙。

    测量里还埋着一个著名的 Karn 陷阱：假设段 5 原始在 0 毫秒发出去，熬到 300 毫秒没回来触发了超时重传；结果在 320 毫秒时，北京突然收到一个「段 5 已收妥」的 ACK。请问这个 ACK 确认的到底是 320 毫秒前那份原始的段 5（它只是半路堵车迟到了），还是 20 毫秒前刚补发那份重传的段 5？只看确认号根本分不清！假如发送方误以为是重传包的确认，算出来的 RTT 只有区区 20 毫秒，就会错判链路突然变快五倍、立刻把 RTO 拉低到三四十毫秒——结果下一批正常在途 100 毫秒的包还没回来就全算超时，引发连环假重传灾难。

    Karn 规则给出的纪律干脆利落：只要一个数据包重传过，它的任何确认样本一律作废、绝不用来更新 RTT 估计（现代实现再配合包头时间戳才能彻底消除歧义）。这条思想在分布式的自适应超时设计里全都通用：不确定的脏样本宁可扔掉，绝不能让它污染基准估计。
  derivation: original
  sources:
  - ref: rfc-5681
    locator: RFC 5681 Section 2/3 超时与重传管理引论
    claim: 重传超时应基于往返时间的测量与波动估计设定，重传段的确认存在歧义需谨慎处理
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: sender
      id: s
      label: 发送方（维护 RTO 估计）
      highlight: true
    - lane: net
      id: n
      label: 网络（时延在抖动）
    - lane: receiver
      id: r
      label: 接收方
    messages:
    - id: m-rto
      from: n
      to: s
      label: 这个 ACK 确认的是哪一份？测不准就不用
      active: true
  log:
  - mode: RTO
    event: 超时值不是拍出来的，是持续测出来的，而且要防止被重传样本污染
- id: ecn
  title: 显式拥塞通知 ECN：与其等丢包，不如请路由器提前打标
  tldr: 前面的机制都假设路由器绝不开口，[[ECN]] 则是给它开的一条通道：支持它的路由器在队列快满但还没溢满时，直接在路过数据包头上打一个「拥塞」标记，接收方再用 ACK 带回给发送方提前降速，全程零丢包。
  body: |-
    平时路由器不到队列彻底溢满绝不吭声，一旦溢满就直接摔掉数据包，代价是发送方要等重传、尾延迟跟着飙升。支持 [[ECN]] 的路由器则换了温和做法：当排队长度跨过警戒线（比如占到缓冲区的 70%）、离真塞满还有一段余地时，它先不扔包，只在路过的 IP 包头里改写两个标志位打个「这里开始堵了」的标记；法兰克福接收方一看见这个标，就在发回北京的 ACK 里点亮回显位；北京收到后就像碰到轻度丢包一样把 cwnd 温和减下来。整个过程中一个包都没丢、一趟重传都没发生。

    既然这么好，为什么丢包信号至今没退休？因为 ECN 依赖一条严苛的全链路契约：北京和法兰克福两端的操作系统必须先协商开启，沿途跨过的十几台路由器要正确打标，中间不能有任何一台老旧防火墙或网关看不懂那两位比特、顺手把标记抹掉甚至直接拒收带标包。公网路径由几十家运营商拼起来，谁也没法保证每一跳都乖乖遵守契约。

    所以它的现实定位很清晰：在自家掌控的数据中心机房内部和全链路可控的专线上，ECN 已经成了标配，能把队列排长引起的尾延迟压得很平；可在鱼龙混杂的公网上，它只能作为「链路支持就锦上添花、不支持就退回靠丢包兜底」的增益机制。
  derivation: original
  sources:
  - ref: rfc-5681
    locator: RFC 5681 Section 6/相关说明与拥塞信号讨论
    claim: 除丢包外，显式拥塞通知可作为拥塞信号使发送方在丢包发生前调整窗口（作为补充机制）
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
