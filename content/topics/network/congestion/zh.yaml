- id: slow-start
  title: 慢启动：先用指数翻倍试探，几个往返摸出带宽量级
  tldr: 连接刚建好时对前方管道有多宽一无所知，慢启动（也叫慢开始）让 [[cwnd]] 从 10 个 [[MSS]] 起步，每收到 1 个确认就加 1 个段——相当于每过 1 个 RTT 窗口翻一倍，只用七八轮就能从零摸清整条跨洋专线的量级。
  body: |-
    北京和法兰克福刚握完手，现代内核通常给一个约 10 个 [[MSS]]（每段 1460 字节，共约 14.6 KB）的初始拥塞窗口。第 1 个 100 毫秒发出 10 个段，全部安全抵达后回来 10 个确认，每个确认让 cwnd 加 1，窗口立刻变成 20 个段；第 2 轮发 20 回来变 40；第 3 轮变 80；第 4 轮 160；第 5 轮 320；第 6 轮 640；第 7 轮还没走完就已经逼近这根 100 Mbps 管道能装下的上限（约 850 个段），前后只用了不到 1 秒。

    为什么每轮翻倍这么猛，名字却叫「慢」启动？又为什么不每轮稳稳加 1 呢？叫「慢」是对比早期协议一建连就把窗口直接拉满然后瞬间打崩网络的做法——现在老老实实从区区 10 个包起步；而必须用指数翻倍不用线性加 1，是因为互联网链路跨度太大了，前面可能是 1 Mbps 小水管也可能是万兆骨干网，如果从 10 个段每轮只加 1 爬到 850 个段，要熬整整 840 个 RTT（84 秒），传个文件早就超时卡死了。

    指数翻倍的危险在于最后一跳很容易步子迈过头：本来管道只差 100 个段就满了，上一轮还在 640，下一轮突然甩出 1280 个段，多出来的几百个包会瞬间冲垮路由器队列。因此只要撞上一次丢包，或者窗口顶到了之前记下的慢启动阈值 ssthresh，慢启动就立刻踩刹车，切换进接下来温和的线性爬坡。
  derivation: original
  sources:
  - ref: rfc-5681
    locator: RFC 5681 Section 3.1 Slow Start
    claim: 慢开始阶段每个 ACK 使拥塞窗口增加至多一个 MSS，窗口随 RTT 近似指数增长直至 ssthresh 或丢包
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
