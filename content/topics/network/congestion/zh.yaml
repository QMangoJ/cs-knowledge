id: network/congestion
subject: network
slug: congestion
order: 4
status: published
license: CC-BY-4.0
title: 流量控制与拥塞控制：TCP 的另一半
summary: 握手只是开始：发送方还要同时回答两个问题——对面收得下吗（流量控制）、网络扛得住吗（拥塞控制）。
premise: 在一条跨洋连接上传一个大文件，接收方明明还有空间，速度却可能上不去，因为中间的网络也在堵。发送方到底该听谁的、发多快才既不压垮对面也不堵住网络？本课就用这条跨洋长肥连接上的大文件传输为例，看 TCP 怎样同时回答这两个问题。
position: 本课划入「发送的节奏」板块，接在三次握手把连接送进 ESTABLISHED 之后：建连只解决能不能发，没回答该以多快的节奏往管道里塞数据。学完你能区分 [[rwnd]] 保护接收缓冲与 [[cwnd]]
  试探网络容量的分工，也能复述慢开始翻倍与 AIMD 锯齿为何让多条流大体均分瓶颈带宽。
bridge:
  prev: 上一课靠 CNAME 与任播把用户导向最近的边缘 IP，本课接着问包真正上路之后的事：再近的落点，若发送窗口失控照样会在路由器队列里堵成丢包。
  next: 本课调的仍是单条 TCP 字节流的在途量，下一课便揭露这条流的结构性麻烦：多路复用时一个丢包为何会让毫不相干的 stream 一起被扣住等待。
overview:
- key: 一句话总结
  value: 实际发送窗口 = min（取两者较小值）（接收窗口 [[rwnd]]，拥塞窗口 [[cwnd]]），一个管对端、一个管网络
- key: 流量控制
  value: 接收方在 ACK 里通告剩余缓冲（rwnd），发送方不得超出
- key: 拥塞信号
  value: 拥塞信号传统上用丢包来判断，也就是重复 ACK 或超时；现代算法也用时延。网络设备基本不会主动发通知说自己堵了，发送方只能从包丢了、包变慢了这些间接迹象里猜，再据此决定要不要降速。
- key: 慢开始
  value: cwnd 从小开始指数增长，快速试探可用带宽
- key: AIMD
  value: 无丢包时线性加、丢包时乘性减——锯齿形曲线，所有流大体公平的来源
- key: 现代算法
  value: "[[CUBIC]] 是 Linux 长期默认；[[BBR]] 按瓶颈带宽与 [[RTT]] 建模，不把丢包当主要信号。原因是经典的加减窗口办法在高带宽、长时延的网络上爬升太慢，丢包出现时队列往往已经排了很久，所以新算法要么改窗口增长的曲线，要么直接去估网络的真实容量。"
