    - id: m-aimd
      from: s
      to: n
      label: 每 RTT +1 MSS 慢加；丢包即 ×0.5 快减
      active: true
  log:
  - mode: AIMD
    event: 加性增保试探，乘性减保公平与快速退让
- id: fast-recovery
  title: 快速重传与快速恢复：丢一个包的完整走例
  tldr: 段 5 丢失、6/7/8 到达触发三个重复 ACK，发送方立刻补发段 5 并把窗口减半进入恢复，而非干等超时。
  body: '用一段编号走例把快信号走实。发送方连发数据段 1 到 8，其中段 5 在队列里被丢，段 6、7、8 顺利到达。接收方的规则是对乱序到达的段一律回「确认号还停在段 5 起点」的 ACK，等于反复催问段 5——于是发送方接连收到三个内容相同的重复 ACK。数到第三个，发送方就基本断定：段 5 不是还在路上（那样最多触发一两个重复确认），而是真的丢了，随即不等 RTO 立刻重传段 5，这就是快速重传，它把丢包恢复从秒级的超时等待压回约一个 RTT。


    紧接着是快速恢复：这次丢包只是一个包而非全线崩溃，所以不重启慢开始，而是先把 ssthresh 记为当前窗口一半、cwnd 砍半，随后每再收到一个重复 ACK 就允许临时多发一个新段（相当于借后续段的到达证明网络还在流动、管道没有空转），等段 5 的确认真正到达后退出恢复、回到拥塞避免的线性增长。误解澄清：三个重复 ACK 的门槛不是随手定的——门槛太低会被正常的包乱序误触发重传与降速，太高则在途段不够多时永远凑不齐、只能退化成等超时。短流尾部丢包恰好凑不齐三个重复 ACK，是快速重传的结构性盲区。'
  derivation: original
  sources:
  - ref: rfc-5681
    locator: RFC 5681 Section 3.2 Fast Retransmit/Fast Recovery
    claim: 三个重复 ACK 触发快速重传，快速恢复期间窗口减半并按重复 ACK 临时放行新数据
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
