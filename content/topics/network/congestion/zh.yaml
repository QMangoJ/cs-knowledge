    event: 一个 RTT 内补包，避免掉进超时
- id: rto-karn
  title: 慢信号怎么定：RTO 的测量与 Karn 规则引子
  tldr: RTO 设在平滑 RTT 之上留出波动余量；重传过的段不能拿来测 RTT，否则会把估计算坏。
  body: '超时信号的全部难点在于 RTO（重传超时）设多少：设短了，正常抖动都会触发假重传，平白浪费带宽还误降窗口；设长了，真丢包时要干等很久才恢复，尾延迟全毁。标准做法是持续测量：每收到确认就采样一次往返时间，用加权平均估出平滑 RTT，再用样本的波动幅度（偏差量级）在此之上留出安全余量，RTO 随实测水位动态漂移，而不是写死一个常数。连续超时还会让 RTO 按倍数退避放大，避免在路径疑似断裂时高频无效重传。


    测量里埋着一个著名陷阱：一个段重传过之后收到的 ACK，到底确认的是原始那一份还是重传那一份？分不清。若误把「重传后很快回来的确认」当作原始段的往返时间，测得的 RTT 会短得离谱，进而把 RTO 设得过小，引发更多假重传的连锁反应。Karn 规则给出的处理引子是：凡涉及重传段的样本一律不用作 RTT 估计，并对连续超时做 RTO 退避。时间戳选项后来提供了更干净的测量办法，但 Karn 的思想——不确定的样本宁可丢弃，不可污染估计——在所有自适应超时设计里都通用。'
  derivation: original
  sources:
  - ref: rfc-5681
    locator: RFC 5681 Section 2/3 超时与重传管理引论
    claim: 重传超时应基于往返时间的测量与波动估计设定，重传段的确认存在歧义需谨慎处理
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: sender
      id: s
      label: 发送方（维护 RTO 估计）
      highlight: true
    - lane: net
      id: n
      label: 网络（时延在抖动）
    - lane: receiver
      id: r
      label: 接收方
    messages:
    - id: m-rto
      from: n
      to: s
      label: 这个 ACK 确认的是哪一份？测不准就不用
      active: true
  log:
  - mode: RTO
    event: 超时值是测出来的，且要防样本污染
- id: ecn
  title: 显式拥塞通知 ECN：给丢包信号留的后门
  tldr: 支持 ECN 的路由器在队列将满时不丢包、改在包头打标记，接收方把信号回带给发送方提前降速。
  body: '前面的设计里预设了「网络不会说话」，ECN（显式拥塞通知）就是给这个预设开的后门，逻辑很顺：与其等队列满到丢包，为什么不让路由器在队列刚开始变长、还没到丢包程度时，就在路过的数据包头上打一个「我这里开始堵了」的标记？接收方收到带标记的包后，在回给发送方的确认里把这个信号带回去，发送方据此像对待一次丢包一样把窗口减下来——区别是这一次，一个包都不用丢、也不用重传，代价被提前且无损地支付了。


    为什么这么好的机制没有取代丢包信号？因为它是一条全链路契约：发送方与接收方两端的操作系统要协商启用、沿途路由器要实现打标记、任何一台中间设备若把相关标记位清掉或误处理，信号就会失真或连接异常。部署了几十年，它在受控环境（数据中心内部等）用得很好，在公网则是部分路径可用——所以现实定位是增益项而非替代品：有 ECN 时少丢些包、降速更平滑，没有时丢包信号照样兜底。这再次印证了本课 design 的判断：端到端、零中间配合的方案在公网上有天然的部署优势。'
  derivation: original
  sources:
  - ref: rfc-5681
    locator: RFC 5681 Section 6/相关说明与拥塞信号讨论
    claim: 除丢包外，显式拥塞通知可作为拥塞信号使发送方在丢包发生前调整窗口（作为补充机制）
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: sender
      id: s
      label: 发送方（收到回带信号后减半）
    - lane: net
      id: n
      label: 路由器（不丢包，改打标记）
      highlight: true
    - lane: receiver
      id: r
      label: 接收方（在 ACK 里回带标记）
    messages:
    - id: m-ecn
      from: n
      to: r
      label: 队列将满：包上做显式标记
      active: true
  log:
  - mode: ECN
    event: 提前、无损，但依赖全链路配合
- id: bdp
  title: 定量一算：带宽时延积决定窗口要多大
  tldr: 管道容量等于带宽乘往返时延；窗口小于它，链路必然跑不满，与算法无关。
  body: '把窗口换算成吞吐上限，公式只有一条：稳态吞吐不超过窗口除以 RTT，而要把一条链路喂满，在途数据必须至少等于带宽时延积 BDP（带宽乘以 RTT）。走两个数例：一条 100 Mbps、RTT 100 毫秒的跨洋链路，BDP 是 100 乘 0.1 等于 10 兆比特、约 1.25 兆字节——窗口（rwnd 与 cwnd 的较小者）若只有 64KB，吞吐上限就是 64KB 除以 0.1 秒、约 5 Mbps，链路利用率不到百分之五，换什么拥塞算法都救不了，必须先靠窗口扩大把 rwnd 抬上去、靠慢开始让 cwnd 爬到 BDP 量级。


    另一个方向也要会算：窗口远大于 BDP 并不更好，多出来的数据只能在瓶颈队列里站着排队，把时延顶高（这正是 bufferbloat 的算术本质）。所以一切拥塞算法的实际工作，都可以理解为在围绕 BDP 这个锚点寻找合适的在途量：低于它浪费带宽，高于它浪费时延。排查「专线跑不满」类问题时，先算 BDP、再查两端窗口配置，顺序与查握手账一样，不要一上来就怪运营商。'
  derivation: original
  sources:
  - ref: rfc-5681
    locator: RFC 5681 Section 2 窗口与吞吐关系
    claim: 发送方在途数据受窗口限制，吞吐上限由窗口与往返时延之比决定
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: sender
      id: s
      label: 发送方（窗口即吞吐上限）
      highlight: true
    - lane: net
      id: n
      label: 跨洋管道（BDP 约 1.25MB）
    - lane: receiver
      id: r
      label: 接收方
