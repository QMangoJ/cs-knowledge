- id: bdp
  title: 定量算总账：带宽时延积 BDP 决定窗口至少要多大
  tldr: 网络管道里能同时飞多少数据有个硬指标——带宽乘以 RTT，即 [[BDP]]。北京到法兰克福这条 100 Mbps、RTT 100 毫秒的专线 BDP 约 1.25 MB；如果窗口只有 64 KB，吞吐上限直接被钉死在约 5 Mbps，95% 的带宽全在空转。
  body: |-
    稳态情况下，单条连接的吞吐上限永远逃不出这句死理：最大吞吐不超过实际有效窗口除以 RTT。把我们这根跨洋专线代进去算：带宽 100 Mbps（每秒 12.5 MB）乘以 RTT 0.1 秒，算出来的管道容量 [[BDP]] 等于 10 兆比特，也就是 1.25 MB（大约相当于 856 个 1460 字节的数据段）。意思是任何时刻管道里必须同时漂着至少 1.25 MB 还没确认的数据，才算把这条 100 Mbps 专线塞满。假如此时因为没开窗口扩大选项把 rwnd 死锁在 64 KB，那每 100 毫秒最多也就能放 64 KB 上路——算下来极限速率只有 64 KB / 0.1 s = 640 KB/s ≈ 5.1 Mbps，链路利用率连 5% 都不到，换再厉害的拥塞算法也神仙难救。

    那反过来，把窗口拼命调大到 5 MB 会更好吗？并不会！管道从物理上只能容纳 1.25 MB 在路上跑，多放出去的那 3.75 MB 数据根本飞不过去，只能全都堵在沿途瓶颈路由器的大内存队列里干坐着排队。按 100 Mbps 的排水口往外放这 3.75 MB 排队积压，相当于平白给每个后续包额外加上 300 毫秒的排队延迟——这正是前面提到的 [[bufferbloat]]（带宽没长一分，延迟却涨了三倍）的算术本质。

    不管拥塞控制算法怎么起名字、怎么画曲线，它们全都在找同一个甜点——把在途数据精准贴在 BDP 这根准星上：低于它浪费带宽，高于它白添排队延迟。日后排查「买了百兆专线却跑不出速度」，永远先拿计算器算 BDP、再查两端窗口配置有没有超过这个数，最后才轮得到调算法。
  derivation: original
  sources:
  - ref: rfc-5681
    locator: RFC 5681 Section 2 窗口与吞吐关系
    claim: 发送方在途数据受窗口限制，吞吐上限由窗口与往返时延之比决定
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: sender
      id: s
      label: 发送方（窗口即吞吐上限）
      highlight: true
    - lane: net
      id: n
      label: 跨洋管道（BDP 约 1.25MB）
    - lane: receiver
      id: r
      label: 接收方
    messages:
    - id: m-bdp
      from: s
      to: n
      label: 窗口 64KB 时利用率只有约百分之五
      active: true
  log:
  - mode: 定量
    event: 排查跑不满时先算管道容量 BDP，再谈拥塞算法的优劣
- id: modern
  title: 算法演进：Reno、CUBIC 与 BBR 各自盯着什么信号调速
  tldr: "[[Reno]] 每轮只加 1 个段的做法在 1.25 MB 大容量跨洋管道上爬得太慢；Linux 默认的 [[CUBIC]] 改用三次曲线更快逼近上次丢包点，但两者都靠「丢包」猜顶；Google 的 [[BBR]] 则换掉信号源，直接测量瓶颈带宽和最小 RTT 来定速，不等队列塞满。"
  body: |-
    就按刚才算的 BDP ≈ 856 个段来算一笔账：经典 [[Reno]]（就是前面讲的那套慢启动加 AIMD）在 856 附近只要掉一次包，cwnd 立刻砍半掉到 428，接下来每过 100 毫秒才加 1 个段爬回 856，整整要耗掉 428 个 RTT = 42.8 秒才能重新吃满这条 100 Mbps 专线！只要线路上几十秒偶发一次丢包，带宽曲线就永远趴在半山腰。Linux 长期默认的 [[CUBIC]] 为了解救长肥管道，把线性斜坡改成一条围绕「上次丢包窗口值」对称的三次函数曲线：刚砍半后迅速拉升逼近旧高点，快到时放慢步子细探，稳住一会没丢包再加速突破；同时增长快慢跟物理时间挂钩，不再死吃长 RTT 的亏——但它本质上依然要等「涨到丢包」才知道天花板在哪。

    Google 推出的 [[BBR]] 则彻底换了一套世界观。如果半路路由器配了一个 4 MB 的深缓冲，Reno 和 CUBIC 这两位「丢包派」会傻傻地把这 4 MB 队列全部垫满、把往返延迟拖爆到 400 多毫秒直到队列溢出丢包才肯刹车。BBR 干脆不再把丢包当作主要拥塞信号，它持续盯死两个物理量：每隔几轮小幅测探近期的最大接收速率（估计瓶颈带宽），再隔一阵刻意压低在途量测出队列排空时的最小 RTT（基础传播延迟），直接把发送速率锁在估算带宽上、把在途总量锚定在「带宽 × 最小 RTT（纯 BDP）」附近，力求管道满载的同时路由器队列里几乎不排队。

    当 BBR（只装满管道、不排队的建模派）和 CUBIC（一定要把缓冲区填满才停的丢包派）挤在同一台路由器端口抢路时，CUBIC 会强行垫高队列水位，两套逻辑怎么公平切分带宽至今都在持续演化（例如 BBRv2/v3 一直在修正对丢包信号的平衡退让）。所以同一个跨洋机房，换一套内核拥塞算法测出来的带宽和尾延迟能差出一大截——压测前务必先确认两端实际开启的是哪一版。
