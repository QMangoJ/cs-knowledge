- id: modern
  title: 从 Reno 到 CUBIC 与 BBR
  tldr: 经典 AIMD 在高带宽长时延网络上爬升太慢；CUBIC 改增长曲线，BBR 干脆换思路：直接估瓶颈带宽。
  body: '带宽×时延（BDP）很大的「长肥管道」里，每 RTT +1 MSS 要爬很久才能填满管道。CUBIC（Linux 长期默认）让窗口增长走一条三次曲线：在接近上次丢包点时慢、之后加速探测，使爬升速度对 RTT 更公平。


    BBR（Google 提出）换了一套世界观：持续测量瓶颈带宽与往返传播时延两个量，把发送速率锚在「带宽 × 时延」这个管道容量上，不等丢包就主动收敛；它的目标是队列里不排长队（低时延），而不是把队列塞满再退。换个角度对照三代算法的信号选择：Reno 系只有丢包一个信号；CUBIC 仍用丢包，但把增长律改成更适合大 BDP 的形状；BBR 则直接改测物理量（交付速率与最小时延），试图在丢包发生之前就把速率钉在 BDP 附近。两条路线在同一网络里相遇时的公平性至今仍是研究话题——丢包派会把队列填满，建模派不填，两者共用瓶颈时份额如何分配并没有一劳永逸的答案。这也是为什么「换个拥塞算法测速就变」是真实存在的现象，测速前应先确认两端实际启用的算法。'
  derivation: original
  sources:
  - ref: rfc-5681
    locator: RFC 5681（经典算法基线；CUBIC 与 BBR 为其后演进）
    claim: RFC 5681 定义经典慢开始与 AIMD，后续算法在其信号与增长律上演进
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
