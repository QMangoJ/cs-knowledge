    event: 加性增保证持续试探余量，乘性减保证快速退让并让多条流趋向公平
- id: fast-recovery
  title: 快速重传与快速恢复：段 5 丢了怎么靠 3 个重复 ACK 在 1 轮内补救
  tldr: 遇到 3 个重复 ACK 时，发送方不用干等秒级超时，当场补发丢失那一段（快速重传），再把窗口砍半而不跌回慢启动，边等确认边继续放行新包（快速恢复），把恢复耗时从秒级压回大约 1 个 RTT。
  body: |-
    顺着场景把段 1 到 8 走一遍：北京一口气发出数据段 1 到 8，段 1 到 4 顺利抵达法兰克福，段 5 在中间路由器队列里被丢了，后面的段 6、7、8 没掉、接着到达。TCP 接收方的死规矩是「只能连续确认，遇到乱序缺口绝不确认后面的包，每来一个乱序包就重复报缺口位置」：段 6 到了回「确认到段 4（催段 5）」，段 7 到了再回「确认到段 4」，段 8 到了继续回「确认到段 4」。北京接连收到 3 个一模一样的重复 ACK，立刻断定段 5 不是迟到而是真丢了，不等 RTO 定时器直接补发段 5——这就是快速重传。

    为什么这次不打回初始窗口重新慢启动？因为段 6、7、8 都能好好飞过去，说明路并没有堵死，只是局部掉了 1 个包，从头再爬太冤了。于是发送方把 ssthresh 设为当前窗口一半、把 cwnd 也减半直接进入快速恢复；在段 5 的新确认回到北京之前，每再收到一个重复 ACK，说明对面又有后续包安全抵达、给管道腾出了一个包的空间，发送方就借机临时放行 1 个新段维持流速。等法兰克福收到补发的段 5 并把确认号一口气推过段 8 时，发送方就退出恢复，回到稳重的拥塞避免。

    等一下，为什么偏偏设成数 3 个重复 ACK，1 个或 10 个不行吗？如果收到 1 个重复 ACK 就重传砍窗，公网上极其普通的轻微乱序（包 6 走得比包 5 快了半毫秒）就会频频误触发重传与降速；反过来如果门槛设高到 10 个，在途段不够多的短连接根本凑不出 10 个后续包，就永远等不到快速重传。即便门槛设在 3，一次短请求的最后两三个包如果刚好掉了最后一个，后面同样没有足够多的包凑齐 3 个重复 ACK，照样会掉进等 RTO 超时的盲区——后来才靠选择性确认（[[SACK]]）和尾部探测去补。
  derivation: original
  sources:
  - ref: rfc-5681
    locator: RFC 5681 Section 3.2 Fast Retransmit/Fast Recovery
    claim: 三个重复 ACK 触发快速重传，快速恢复期间窗口减半并按重复 ACK 临时放行新数据
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
