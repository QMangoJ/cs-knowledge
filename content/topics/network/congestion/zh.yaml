title: 流量控制与拥塞控制：TCP 的另一半
summary: TCP 发送方头上同时悬着两道阀门：对端报出的接收窗口（[[rwnd]]）防止压垮接收方内存，发送方自己试探的拥塞窗口（[[cwnd]]）防止塞爆沿途路由器，实际在途数据量永远取两者的较小值。全课先拆清这两个窗口各自归谁管、靠什么信号调速，再沿着一条连接的生命周期走完四步核心机制：慢启动怎样用几个往返翻倍摸出带宽量级，[[AIMD]] 怎样靠线性慢加、丢包砍半画出锯齿并拉平多流份额，以及 3 个重复确认和超时重传如何区分轻重丢包。最后算出一条管道能装多少字节的容量锚点（[[BDP]]），看懂从 Reno、[[CUBIC]] 到 [[BBR]] 为什么一再改换测速依据。
premise: 想象你在做一件很日常的工程事：从北京机房往法兰克福节点传一个几 GB 的大模型文件，两地之间往返一次要 100 毫秒，专线带宽 100 Mbps。明明对端服务器的接收内存还空出一大块，传输速度却死活飙不上去，甚至隔几秒就掉包回落——发送方到底该听谁的、一次该放多少数据在路上飞，才能既不压垮对面机器，又不把半路的路由器堵死？本课就拿这条 100 Mbps、100 毫秒的跨洋传输当主线，从头走完 TCP 控制发送节奏的整套账。
position: 本课属于网络科第四个板块「发送的节奏」，接在前面讲完的建连握手、请求旅程与域名寻址之后：找到最近机房并把连接打通，只解决了「发给谁」和「能不能发」，还没回答「该按多快往里灌」。学完这一课，你能分清接收窗口和拥塞窗口各自的保护对象，能手算管道容量并说透慢启动翻倍与多流均分带宽的来由；下一课的「传输层的演进」就会在此之上追问：就算速率调得再准，TCP 丢一包就整条死等的老脾气又会制造什么麻烦。
bridge:
  prev: 上一课我们顺着域名解析和内容分发网络，把流量导到了离用户最近的边缘机房；可路选近了只是前提，数据包真正上路之后还得按规矩排队出发——一旦发送方不管不顾往里猛塞，再近的路由节点也会在队列里堵成丢包。
  next: 这一课调了一整节，把单条 TCP 连接的在途数据量调得贴合管道容量；可哪怕速率分毫不差，TCP 还有一根改不掉的硬骨头——整条连接只是一串必须严格按序交付的字节流。下一课看 HTTP/2 和 QUIC 如何围绕它连打三场仗：为什么半路只丢一个包，同一连接上毫不相干的其他请求全得陪着干等。
overview:
- key: 一句话总结
  value: 实际在途数据上限 = min(接收窗口 [[rwnd]], 拥塞窗口 [[cwnd]])，前者保对端不溢出，后者保网络不堵死
- key: 流量控制
  value: 接收方在每个 [[ACK]] 里报出还剩多少接收缓冲（[[rwnd]]），发送方已发未确认的数据绝不能超过它
- key: 拥塞信号
  value: 中间路由器队列满时只会直接扔包、不发通知；经典算法靠 3 个重复 ACK（快）或超时 [[RTO]]（慢）猜堵车，现代算法还盯 [[RTT]] 变化
- key: 慢开始
  value: 慢启动（也叫慢开始）从 10 个 [[MSS]] 起步，每轮 RTT 窗口大致翻倍，先用指数增长摸出可用带宽的量级
- key: AIMD
  value: 平稳期每轮加 1 个段，撞上丢包就砍半——画出锯齿曲线的同时，也让多条流自然趋向均分带宽
- key: 现代算法
  value: "[[CUBIC]] 是 Linux 长期默认，把线性爬坡改成三次曲线；[[BBR]] 干脆不再死盯丢包，而是直接测量瓶颈带宽和最小 [[RTT]] 来定速"
