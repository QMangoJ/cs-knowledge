- id: ai-link
  title: 与 AI 工程的连接
  tldr: 跨地域同步训练、模型权重分发、流式推理，全都活在拥塞控制的脾气里。
  body: '分布式训练的梯度同步对网络极敏感：一條流被拥塞控制误伤（比如无线/跨云链路的随机丢包被当成拥塞），整步训练被最慢的流拖住（木桶效应）。生产系统因此会调 BDP 相关的内核参数、换拥塞算法，或把同步搬到专用网络。


    对推理服务更日常的影响是尾延迟：流式输出经过一条拥塞的链路时，cwnd 锯齿会直接变成 token 吐字的抖动——锯齿低点那几百毫秒窗口收窄，token 攒着晚到；锯齿恢复时又一拥而出。排查「为什么跨区调用忽快忽慢」时，拥塞控制与队列是绕不开的一层。落到操作清单：先确认瓶颈是 rwnd 还是 cwnd（两端窗口与算法配置不同，修法完全不同），再看丢包属于拥塞性还是随机性（链路质量问题换算法无用），最后才考虑调初始窗口、换 CUBIC 或 BBR 这类动作——每一步都要有抓包或系统计数器的证据支撑，不要靠感觉调参。最后留一个直觉校准：凡是「吞吐或延迟随时间呈规律锯齿」的现象，先想窗口在涨落；凡是「恒定地慢、毫无波动」的现象，先想窗口上限或链路本身被某个固定值钉死——波动的形状本身就是第一手诊断信息。'
  derivation: original
  sources:
  - ref: rfc-5681
    locator: RFC 5681 Section 1（拥塞控制对网络稳定性的意义）
    claim: 拥塞控制是端主机对网络负载的主要调节机制，直接影响吞吐与时延
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
