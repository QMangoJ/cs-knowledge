- id: ai-link
  title: 工程落地与自检：把窗口规则翻译成线上排障动作
  tldr: 分布式训练的同步尾延迟和大模型流式输出的吐字卡顿，经常是底层 rwnd 顶死或 cwnd 锯齿放大到了应用层；排查时先看吞吐波形是平直卡死还是锯齿跌落，再逐层对证窗口配置、链路随机丢包和拥塞算法。
  body: |-
    大模型多机分布式训练每一步都要做梯度全规约同步，几十上百条连接同时在网络里跑。只要其中某一条链路因为一次偶发误码丢包，被经典算法误判成拥塞把窗口砍半，整步训练的其它所有机器就必须站在那干等这最慢的一条流补齐（典型的木桶效应）。而在在线推理场景里，流式回答经由不稳定的公网发给用户时，cwnd 每次撞丢包砍半又缓慢爬坡的那几百毫秒低谷，反映在屏幕上就是 [[token]] 吐着吐着突然卡住半秒、恢复后又哗地一下全涌出来。

    遇到「传输慢」或「尾延迟抖」，不要一上来盲改内核参数，按三步拿抓包与计数器证据说话：第一步先算一遍这条路的 BDP，检查接收端缓冲区和窗口扩大选项有没有把 rwnd 卡在 64 KB；第二步查网卡和路由器错包计数，分清丢包是因为队列排满（拥塞性丢包）还是光模块与无线质量差（随机丢包——这种病换什么拥塞算法都白搭）；第三步才在服务端核对或切换 CUBIC 与 BBR 这类拥塞控制策略，对比改变前后的尾延迟曲线。

    看到曲线别瞎猜，先盯波形再下手，把这三问自检带走：如果速率恒定死水一潭上不去，先算 BDP 并查 rwnd（多半被对端缓冲或窗口上限钉死了）；如果速率或吐字呈规律锯齿起落，马上查 cwnd 与周期丢包（说明窗口反复撞队列天花板）；如果没怎么丢包延迟却一路高飘，盯死 RTT 和深缓冲（多半落进了 bufferbloat 排队陷阱）。
