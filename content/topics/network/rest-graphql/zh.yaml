  label: 发生了什么
status: published
license: CC-BY-NC-SA-4.0
overview:
- key: 一句话总结
  value: REST 把规矩固定在服务端换通用缓存与省心治理；GraphQL 把点菜权交给客户端换多端灵活，代价比表面多在 N+1 与查询防御上
- key: REST 四件套
  value: "URL 只放名词定资源、方法标明动作与[[幂等]]性、状态码做第一层分类、错误响应体配稳定机器错误码（如 RFC 9457）"
- key: 列表分页
  value: 后台小表要跳页用 offset；百万级流水与无限滚动一律改用[[游标分页]]，避免越翻越慢和插入错位
- key: GraphQL 三件套
  value: 先发 [[schema]] 后按需取数；必须配 [[DataLoader]] 合并 [[N+1]] 查询；上线前先配好限深、算复杂度与缓存替代方案
summary: 面对多端取数这笔账，业界分出了两条路：[[REST]] 把合同定死在服务器上，用标准化的 HTTP 方法、状态码和 URL 换来开箱即用的网络缓存与统一规则；[[GraphQL]] 则把取数权交给客户端，一次请求只拿点到的字段，代价比想象中更隐藏——查询嵌套一多就会引爆数据库 [[N+1]]、让 HTTP 缓存直接失灵，逼着服务端补上一整套复杂度防护。本课先从零拆透 REST 的资源建模、幂等保护、状态码与游标分页，再走一遍 GraphQL 如何靠 [[DataLoader]] 解掉 N+1 并算清它的隐藏治理账，最后给出直接能套用的工程选型与面试答法。
premise: 假设你在做电商系统：同一笔订单在数据库里躺着三十多个字段，可三个前端页面要的完全不一样——电脑后台管理页几乎全要，手机 App 订单列表只要订单号、首图、金额、状态这 6 个，智能手表卡片更是只显示状态和金额 3 个字段。接口做成固定返约 35 个字段，小端嫌太重还慢；拆成十几个小接口，复杂页面得连发五六个请求来回往返。这一课要解的就是这笔两难账：面对胃口各不相同的客户端，接口合同到底该由服务器定死（REST），还是让前端按需点菜（GraphQL）？
position: 本课属于网络学科第六个板块「接口的合同：RPC 与序列化」，紧接上一课《gRPC 与序列化》，也是整个网络学科的收官课。上一课处理的是自家微服务之间高并发、重效率的内部二进制合同；本课把视角转向系统最外层——直接面对浏览器、手机应用与第三方开发者的公开 HTTP 接口。学完这两课，从底层 TCP 握手、流量拥塞到上层应用接口契约的整张网络图就完整合拢了。
level: 进阶
minutes: 28
prereq:
- network/grpc
objectives:
- 能按资源建模原则设计一组 REST 接口：名词 URL、方法与幂等性、状态码与稳定错误体
- 能算清 offset 分页的性能与错位两笔账，说清大列表为什么改用游标分页
- 能讲透 GraphQL 如何消除多端取多与取少，以及随之而来的 N+1、缓存失灵和复杂度账
- 能根据消费者形态选出 REST、GraphQL 或两者混用，并套用「约束 → 取舍 → 补救」答出面试题
aiLink: 整条选型主线其实就一件事——复杂度放哪一端：[[REST]] 把合同定死在服务器，换取标准缓存与省心治理；[[GraphQL]] 把点菜权交给前端，换取多端适配灵活，但服务器必须接住 [[N+1]] 和深查询防御。
bridge:
  prev: 上一课的 .proto 合同是给自家内部服务之间用的：调用方和提供方都在公司内网，接口格式坐下来就能定死，传二进制效率最高。但一旦消费者换成用户手里的浏览器、更新缓慢的旧版手机应用，或者外部合作方，二进制就不方便调试了，各方要的字段还每天都在变——接口设计的重心也随之从「省字节」切换成「怎么管好变更与多端取数」。
design:
- mechanism: 把取数规则固定在服务端（REST），还是把点菜权交给客户端（GraphQL）
  problem: 同一个订单背后有三四十个字段，电脑端、手机端和手表要的截然不同：接口给死全量，小端白费流量和解析；拆成小接口，复杂页又要串行发一堆请求来回等。
  choice: 资源规整、吃 CDN 和浏览器缓存、面向第三方开放时用 REST；多端字段差异极杂且需要深度聚合时用 GraphQL；大型系统常对外留 REST、对内架一层 GraphQL 聚合网关。
  tradeoff: REST 省心稳妥，代价在版本分叉和多端适配慢；GraphQL 极其贴合前端点菜，代价却全留在服务端——N+1 查询、HTTP 缓存失灵和深查询打爆库都得自己出人力去补。
  root: 两种风格没有谁淘汰谁，区别只在于把复杂度放在哪一端：是让前端配合固定接口，还是让服务端接住任意组合查询。
- mechanism: 大列表放弃 offset 跳页，改用排序键游标书签
  problem: 传统的 LIMIT 20 OFFSET 100000 翻到深页时，数据库必须先从头数完十万行再丢掉，越翻越慢；翻页途中只要前面插进新订单，整列顺移就会导致重复读或漏读。
  choice: 无限滚动的时间线、百万级订单流水一律采用游标分页，拿着上一页最后一条的唯一排序键当书签往下续读；只有小数据且硬性要求跳页的后台表格保留 offset。
  tradeoff: 游标分页为了换来恒定查询开销和不重不漏，主动放弃了「直接跳到第 37 页」以及精确总数展示，且必须保证排序键唯一稳定。
  root: 两种分页的分水岭在索引定位方式：顺着 B+ 树索引从书签直接定位只需常数次定位加上一页读取，而算偏移量注定要为「跳过前面多少行」付出线性代价。
quiz:
- q: 下面哪个 URL 设计符合 REST 的资源建模？
  options:
  - POST /getOrderList
  - GET /orders?userId=42
  - GET /doDeleteOrder?id=7
  - POST /orders/queryByStatus
  answer: 1
  explain: 资源建模要求 URL 是名词（资源集合），动作交给 HTTP 方法：查列表是 GET /orders，删除是 DELETE /orders/7。把动词写进 URL 等于每个动作都要新造一套约定。
- q: 支付接口用 POST 创建支付单，用户网络抖动重试了两次，最可能出的问题与标准防法是？
  options:
  - POST 不是幂等方法，重试会建出两笔支付单；防法是客户端带幂等键（Idempotency-Key），服务器按键去重
  - 把方法改成 GET 就没事了
  - 状态码改成 201 就能防重复
  - 让用户不要重试
  answer: 0
  explain: 幂等性决定重试是否安全：GET、PUT、DELETE 天然幂等，POST 不是。支付、扣款这类 POST 接口要用幂等键把「同一次意图」标识出来，服务器只执行第一次。
- q: 一个有一千万行的工单列表，用 offset 分页翻到第 5000 页会发生什么？
  options:
  - 和第一页一样快
  - 数据库要先数过前面 10 万行才开始取这一页，越来越慢；期间新工单插入还会让已翻过的内容错位
  - 数据库会自动改用游标
  - 只要加了索引就没问题
  answer: 1
  explain: OFFSET 的成本随深度线性增长，因为「跳过」本身要逐行计数；再加上并发插入造成的错位，大列表的标准解法是游标分页：用最后一行的排序键当书签续读。
- q: GraphQL 服务上线后数据库查询数暴涨，最常见的原因与对策是？
  options:
  - GraphQL 协议本身要求每字段查一次库，无解
  - 解析器逐条解析列表里每行的关联字段，产生 N+1 次查询；对策是用 DataLoader 把同批 id 合并成一次批量查询
  - 客户端查询写得太长，限制长度即可
  - 把 GraphQL 换回 REST 才能解决
  answer: 1
  explain: N+1 在 GraphQL 里从 HTTP 层搬到了数据库层：1 次查列表加 N 次查关联。DataLoader 按请求攒批，把 N 次单查合成为一次 WHERE id IN (…) 批量查，并做单次请求内的缓存。
steps:
- id: three-clients-one-page
  title: 第一步：困境的起点——一笔订单，三端三种胃口
  tldr: 固定返回一套字段时，给多了小端白费流量、给少了大端多跑几趟往返——多端差异是接口分岔的直接导火索。
  body: |-
    回到开场那笔编号 `123` 的电商订单。后端数据库里这单装着订单号、总金额、状态、收货地址、支付方式、物流单号、十几条商品明细、优惠券分摊和发票抬头，拼起来约 35 个字段。现在同时来了三个页面：电脑管理后台几乎全要；手机 App 的订单列表页每行只放订单号、首件商品图、金额和状态这 6 个字段；智能手表通知卡只看状态和金额 3 个字段。

    如果服务端只提供一个固定返回的接口，左右两边总有一头难受：按后台胃口一次吐出 35 个字段，App 和手表每次刷列表都要白下载、白解析 80% 以上用不上的数据，这叫「取多了」（[[over-fetching]]）；如果按列表页胃口砍成 6 个字段，后台打开详情就得发第二个请求去拉物流、发第三个请求去拉发票，页面加载变成串行等待，这叫「取不够」（[[under-fetching]]）。

    面对这笔账，两种主流方案在这里分家：[[REST]] 选择把数据结构定死在服务器上、优先换取标准规则和全网缓存；[[GraphQL]] 选择让客户端像点菜一样声明字段。我们先走完 REST 这套全行业通用的规矩，再看 GraphQL 怎么接招。
  derivation: adapted
  sources:
  - ref: graphql-spec
    locator: "GraphQL Specification: Introduction"
    claim: 规范导言把 GraphQL 定位为让客户端声明所需数据的查询语言，其要解决的正是固定响应结构下取多与取少的问题。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
  canvas:
    kind: datastate
    caption: 同一个订单，三端的字段需求（业务场景示意）
    structure: array
    rows:
    - label: 三端的胃口
      cells:
      - v: 约 35 个字段
        sub: 几乎全要
      - v: 6 个字段
        sub: 其余是浪费
      - v: 3 个字段
        sub: 只看状态金额
      - v: 取多或取少
        sub: 总有一端不合身
  log:
  - at: 分岔口
    text: 合同定死在服务器，还是让客户端点菜
- id: rest-resources-nouns
  title: 第二步：REST 的建模规矩——URL 只写名词，不写动作
  tldr: 把接口按「系统里有什么东西」拆成资源路径，而不是按「能干什么操作」起名——路径里只要出现动词，通常说明建模偏了。
  body: |-
    刚从前端调用习惯转来写后端接口时，最容易写出 `/getOrder?id=123`、`/createOrder`、`/deleteOrderItem` 这样的路径。麻烦在于系统功能越加越多，每个动作都要发明一个新名字：今天叫 `queryOrder`，明天隔壁组叫 `fetchOrderList`，新人不把文档从头翻到尾根本猜不出接口路径在哪。

    [[REST]]（表述性状态转移）反过来要求按「资源」建模：先把系统里存在的东西摆出来——订单、商品明细、售后工单。URL 只负责标出资源的位置，一律写名词：`/orders` 指订单集合，`/orders/123` 指 `123` 号订单，`/orders/123/items` 就是这一单里的商品明细，从属关系直接顺着路径往下挂。

    至于对这笔订单做什么操作，全交给 HTTP 自带的方法动词（下一步细讲）。按这套规矩写出来的接口自带可猜测性：新同事看到 `/orders/123`，不用查文档就能猜到查列表、新增、删明细分别该往哪里发请求；反过来，URL 里只要出现动词，十有八九是建模偏回「过程式思维」了。
  derivation: original
  sources:
  - ref: rfc-9110
    locator: "RFC 9110: HTTP Semantics（资源与方法的标准语义）"
    claim: HTTP 语义把请求目标定义为资源标识、方法定义为对资源的操作，REST 的资源建模正是建立在这套标准语义之上。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
  canvas:
    kind: datastate
    caption: 同一组操作，两种 URL 风格
    structure: array
    rows:
    - label: URL 风格对照
      cells:
      - v: /orders/123
        sub: 名词加方法
        mark: active
      - v: /getOrder?id=123
        sub: 每动作造新词
      - v: /orders/123/items
        sub: 归属写在路径
        mark: active
  log:
  - at: 判据
    text: URL 里出现动词，先回头检查建模
- id: methods-idempotency
  title: 第三步：方法与幂等——网络抖了敢不敢自动重试，看动词
  tldr: GET、PUT、DELETE 天生[[幂等]]，连发十次世界状态不变；POST 会新建记录，直接重试就可能把同一笔订单扣两次款。
  body: |-
    URL 里把动作摘掉之后，HTTP 方法就得扛起「干什么」的语义：`GET /orders/123` 是只读查询，不许改服务器数据，浏览器、代理和爬虫才能放心缓存与预取；`PUT /orders/123` 是整单覆盖替换，把整份内容传过去，执行 1 次和执行 10 次结果一样；`DELETE /orders/123` 是删除，删掉之后再删一次顶多返回不存在（404），数据库的最终状态不变。这三个动作的共同点叫[[幂等]]——同一个请求重复执行，效果和执行一次相同。

    唯独 `POST /orders` 是「提交处理或新建」，天生不幂等：每发一次都会新生成一笔订单或支付单。放到线上事故现场就懂有多危险：用户在结账页点「支付」，请求其实已经送到支付网关，但回包在路上超时，前端网络库自动触发了一次重试——如果接口不做防重，用户银行卡上莫名其妙就多出一笔重复扣款。

    工程里的标准防线是[[幂等键]]（Idempotency-Key），好比前端防止按钮连点时常用的防重 Token：客户端在首次发起支付前，本地生成一个唯一编号放进 `Idempotency-Key` 请求头；哪怕网络抖动重试 3 次，带的都是同一个键。服务端先查账本：第一次见到就执行扣款并记下结果，后续带着同一个键进来的重试直接把上次结果原样吐回，不再动手扣第二遍。
  derivation: original
  sources:
  - ref: rfc-9110
    locator: "RFC 9110 §9.2.2: Idempotent Methods"
    claim: RFC 9110 明确 GET、PUT、DELETE 等方法为幂等，POST 不在幂等之列；幂等性指重复请求的预期效果与单次相同。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
  canvas:
    kind: datastate
    caption: 常用方法的语义与幂等性
    structure: array
    rows:
    - label: 方法速查
      cells:
      - v: 查 · 幂等
        sub: 不许有副作用
        mark: active
      - v: 整体替换 · 幂等
        sub: 重发不变
        mark: active
      - v: 删 · 幂等
        sub: 删十次一样
        mark: active
      - v: 建 · 不幂等
        sub: 要配幂等键
  log:
  - at: 事故线
    text: 重试是否安全，先看方法再谈实现
- id: status-codes
  title: 第四步：HTTP 状态码——给网关、浏览器和重试逻辑看的第一层信号
  tldr: 状态码把「谁出了错、能不能重试」做成行业通用语言；图省事全接口返回 200，等于废掉网关监控、重试和缓存三套现成基建。
  body: |-
    资源路径和方法定好之后，成功还是失败不能全指望人眼读文字，得让网关、监控看板和前端请求拦截器第一眼就看懂。HTTP 状态码按百位做第一层分类：`2xx` 表示成功（查订单回 `200`，新建订单成功回 `201` 并在 `Location` 响应头里写明新订单位置）；`4xx` 表示错在调用方（参数写错回 `400`，订单不存在回 `404`，状态冲突——比如对已经付完款的订单 `123` 重复发起关闭或支付——回 `409`，刷太猛触发限流回 `429`）；`5xx` 才是服务器内部挂了。

    行业里最常见的一股坏味道叫「永远返回 200」：无论成功失败，HTTP 状态码一律给 `200`，把真正的错误塞进 JSON 响应体的自定义 `code` 字段里。这样做的直接后果是把整套 HTTP 基础设施全废掉了：网关和监控图表看到的全是 `200` 成功率 100%，后端都报错半天了告警还不响；浏览器和 CDN 甚至可能误把本该拦截的失败当成正常内容缓存在本地；前端拦截器也没法按「`4xx` 不重试、`5xx` 可自动退避重试」的通用规矩走。

    等一下，业务里几十上百种细分报错，光靠十几个 HTTP 状态码装得下吗？当然装不下——状态码只负责把错误按大类分好给机器基建看，响应体里的业务错误码再负责第二层精准分支（下一步细看），两层各司其职才不打架。
  derivation: original
  sources:
  - ref: rfc-9110
    locator: "RFC 9110 §15: Status Codes"
    claim: RFC 9110 定义了状态码的分类语义：2xx 成功、4xx 客户端错误、5xx 服务器错误，201 表示已创建新资源。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
  canvas:
    kind: datastate
    caption: 状态码的第一层分类：谁的错、要不要重试，先看百位
    structure: array
    rows:
    - label: 状态码分工
      cells:
      - v: 成功
        sub: 201 已创建
        mark: active
      - v: 调用方的错
        sub: 参数/不存在/冲突
      - v: 服务器的错
        sub: 可重试要告警
      - v: 永远 200
        sub: 三件全失灵
  log:
  - at: 原则
    text: 状态码做第一层分类，业务 code 只做细分
- id: error-format
  title: 第五步：错误响应体——给前端代码分支用的稳定结构
  tldr: 状态码告诉你「属于 409 冲突」，响应体还要稳稳交出机器识别的错误码和给人看的提示，两者拆开才不会改一句文案就搞坏前端判断。
  body: |-
    接着上一步的 `409 Conflict` 往下看：如果用户重复提交了已支付的订单 `123`，前端光看到状态码 `409` 还不够，必须靠响应体决定是弹「去查看物流」还是「请换张卡再试」。合格的错误体至少拆出三样东西：一个发布后永不改名的机器可读错误码（比如 `ORDER_ALREADY_PAID`）、一句给人看的文字说明，外加一个可选明细区指明哪个字段填错。把「代码分支用的 code」和「屏幕显示的文案」拆开，运营明天把提示语改成另一句客套话，前端逻辑也不会跟着崩。

    这套信封结构不用每家公司重头拍脑袋发明，[[API]] 规范里已经有现成答案——RFC 9457 定义的 Problem Details（响应头写 `Content-Type: application/problem+json`），就像右边代码展示的那样，用 `type`、`title`、`status`、`detail`、`instance` 几个标准字段描述任意错误。团队用自家约定好的统一信封也可以，只要错误码有总表登记、全站格式一致就算合格。

    绝对不能踩的底线是偷懒直接把后端异常堆栈、表名和 SQL 语句原封不动丢回给客户端——那既让前端找不到稳定字段去判断，又等于把数据库内部结构免费送给攻击者。
  derivation: original
  sources:
  - ref: rfc-9457
    locator: "RFC 9457: Problem Details for HTTP APIs"
    claim: RFC 9457 定义了统一的错误响应结构（type/title/status/detail/instance）与 application/problem+json 媒体类型，供 HTTP API 描述错误细节。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
  code:
    lang: http
    code: |-
      HTTP/1.1 409 Conflict
      Content-Type: application/problem+json

      { "type": "https://api.example.com/errors/order-paid",
        "title": "订单已支付", "status": 409,
        "detail": "订单 123 已于 10:02 完成支付，不能重复支付",
        "code": "ORDER_ALREADY_PAID" }
  canvas:
    kind: datastate
    caption: 一份合格的错误响应要同时服务两个读者
    structure: array
    rows:
    - label: 错误体的读者
      cells:
      - v: 稳定错误码
        sub: 永不改名
        mark: active
      - v: 可读说明
        sub: 给人看留日志
      - v: 不抛堆栈
        sub: 细节不外泄
  log:
  - at: 标准
    text: RFC 9457 是现成的答案，不必自创
- id: pagination-offset
  title: 第六步：分页第一招 offset——好写跳页，但深翻页又慢又容易重漏
  tldr: 用页码换算成 LIMIT 20 OFFSET 100000 时，数据库其实是从头数过十万行再丢掉；途中只要插进一笔新订单，前后页就会错位。
  body: |-
    订单集合 `/orders` 动辄几十万上百万行，查询列表必须分页。最直觉的写法是按页码算偏移量：每页 20 条，查第 `N` 页就译成 `LIMIT 20 OFFSET (N - 1) × 20`。它有两笔躲不掉的账。第一笔是性能账：数据库执行 `OFFSET 100000` 时并不是瞬间传送过去，而是老老实实从头数完前面约十万行再丢掉，只留后面的 20 条——页码越深越慢，百万级订单表上翻到第 5000 页能直接拖出秒级卡顿。

    第二笔是正确性账：用户刷列表是持续几分钟的动作。假设你刚看完第 1 页第 20 条、准备点下一页的这几秒里，线上正好插进了 1 笔新订单——所有后续订单在排序里整体后移一位，刚才第 1 页末尾那条就会被挤进第 2 页开头，让你再看一遍（重复）；反过来如果前面删了一单，中间就会悄悄跳过一条（漏读）。

    公道地说，offset 并不是一无是处：后台管理表格数据量不大、产品明确要求「显示总页数并能直接跳去第 37 页」时，它反而是最合适的方案；但只要数据量上到百万级，或者前端是手机端一直往下滑的无限滚动，offset 的两笔账就都会到期。
  derivation: adapted
  sources:
  - ref: rfc-9110
    locator: "RFC 9110: 范围请求与内容协商之外的分页惯例（分页为 API 设计惯例，非协议规定）"
    claim: 分页不在 HTTP 协议范围内，是 API 层惯例；offset 的深翻页成本与并发插入错位是数据库按偏移量逐行计数的必然结果。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
  canvas:
    kind: datastate
    caption: offset 分页的两笔账（业务场景示意：订单流水）
    structure: array
    rows:
    - label: offset 的账
      cells:
      - v: 越深越慢
        sub: 逐行数过去
      - v: 会重会漏
        sub: 插入即错位
      - v: 小数据+跳页
        sub: 后台表格适用
        mark: active
  log:
  - at: 判断线
    text: 百万级数据或无限滚动，就别再用 offset
- id: pagination-cursor
  title: 第七步：分页第二招游标——用最后一条的排序键当书签
  tldr: "[[游标分页]]不再数跳过多少行，而是记住「上一页最后一条订单的编号」，下一页顺着索引直接接着读，翻多深都一样快还不重不漏。"
  body: |-
    看长小说时大家不会每次从第 1 页重新数到第 350 页，而是夹一张书签。[[游标分页]]换的就是这个记位置的方式：第一页返回 20 条订单的同时，后端把这一页最后一条的排序位置（比如编码后的订单 `id` 或创建时间）做成一个不透明的字符串游标 `cursor` 一并返给前端；滑到底部拉下一页时把这个游标带回来，后端查法变成 `WHERE id < 书签值 ORDER BY id DESC LIMIT 20`。

    刚才的两笔账在这里同时清掉：数据库顺着 B+ 树主键索引直接定到书签位置往下读 20 行就收工，不管翻到第 10 万页还是第 1 页，花费的时间几乎一模一样；而且新插进来的订单排在书签之前，根本不会挤动书签后面的相对位置，上下翻页不重也不漏。

    拿稳性能与一致性之后，代价也要主动认下：游标分页跳不了页——没有「直接跳去第 37 页」，只有上一页和下一页；也顺手给不出精确总条数和总页数（真要展示只能另发一次 count 查询）；同时用来当书签的排序键必须唯一且稳定，比如按创建时间排时如果同一毫秒有两笔订单，必须拼上自增 `id` 做复合键才不会漏读。工程里两者通常分工合作：订单流水与信息流用游标，需要跳页的管理后台表格保留 offset。
  derivation: adapted
  sources:
  - ref: rfc-9110
    locator: "RFC 9110: HTTP 语义（分页为 API 层惯例，此处为工程实践总结）"
    claim: 游标（keyset）分页以排序键为书签续读，查询成本与翻页深度无关且对并发插入稳定，是大列表与无限滚动场景的通行做法。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
  canvas:
    kind: datastate
    caption: 游标分页换来的与放弃的
    structure: array
    rows:
    - label: 游标的账
      cells:
      - v: 恒定成本
        sub: 与深度无关
        mark: active
      - v: 不重不漏
        sub: 插入不挤动
        mark: active
      - v: 跳页与总数
        sub: 只有上下页
      - v: 稳定排序键
        sub: 要唯一排序键
        mark: active
  log:
  - at: 对照
    text: 无限滚动用游标，管理表格用 offset
- id: versioning
  title: 第八步：接口演进与版本——老版本 App 还活着时怎么改字段
  tldr: 新增字段安全，删改字段或改单位会炸掉老客户端；REST 常用 /v1、/v2 并行过渡，GraphQL 则守着一份 schema 用 @deprecated 慢慢退役。
  body: |-
    接口一旦发到浏览器和手机 App 上，你很快会撞上一堵现实的墙：后端一天发版好几次，可用户手机里的老版本 App 能躺上一两年不更新。这决定了接口变更的铁律：往响应里**新增**一个字段（比如订单多返回一个优惠金额）是安全的，老客户端读不到它就忽略照跑；但**删掉**字段、把数字改成字符串、或者把金额单位从「元」改成「分」，都是破坏性变更，直接推上线一定把老版本弄崩。

    遇到非改不可的破坏性升级时，[[REST]] 最主流的过河办法是在路径上挂版本号：让 `/v1/orders` 和 `/v2/orders` 同时跑一段时间，新版 App 切去 `/v2`，老端继续留在 `/v1`，直到监控看着 `/v1` 流量掉到可忽略再提前公告下线。（也有人把版本塞进请求头让路径更干净，但调试和缓存配置都变麻烦，实际还是 URL 带 `/v1` 最直白。）

    [[GraphQL]] 对同一道题给出了截然相反的答案：整个图永远只有一份 [[schema]]，不设 `/v1`、`/v2` 版本号。要退役旧字段时，在契约里给它标上 `@deprecated` 并注明替代字段，老端继续用不报错，新端在开发工具提示下逐步改掉，等后台确认彻底没人查这个字段再删除。前者是「多份合同并存」，后者是「一份合同只增不减」——这组区别到最后一步选型还会派上用场。
  derivation: adapted
  sources:
  - ref: graphql-spec
    locator: "GraphQL Specification: schema 演进与字段弃用（@deprecated）"
    claim: GraphQL 规范提供字段级弃用指令，演进策略是单份 schema 只增不减、无大版本号，这与 REST 的版本分流形成对照。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
  canvas:
    kind: datastate
    caption: 破坏性变更的两种过河方式
    structure: array
    rows:
    - label: 版本策略
      cells:
      - v: 加字段加接口
        sub: 老端无感
        mark: active
      - v: "/v1 与 /v2 并行"
        sub: 流量降再下线
        mark: active
      - v: 不升版本
        sub: 标记弃用只增不减
        mark: active
  log:
  - at: 纪律
    text: 老客户端的寿命，决定变更的节奏
- id: graphql-client-orders
  title: 第九步：GraphQL 登场——一套 schema，客户端按需点菜
  tldr: 服务端先公开一份强类型 [[schema]]，前端发一段类似 JSON 骨架的查询过去，服务端只回点到的字段——第一步的三端胃口难题正面解开。
  body: |-
    现在回到第一步那道三端胃口不合的难题，看 [[GraphQL]] 的解法。它是 Facebook 在 2012 年为移动端信息流频繁改字段、来回串行发请求而内部做出来的，2015 年正式开源。形态和 REST 按资源拆出一堆路径完全不同：它通常只留一个入口（`POST /graphql`），服务器先发布一份带强类型系统的 [[schema]]——就像餐厅的总菜单，写明订单有哪些字段、订单怎么关联商品明细、每项是什么类型。

    前端怎么点菜看右边的代码：手表卡片只点 `status` 和 `total` 两行，App 列表再多点一层 `items { name quantity }`，管理后台则把地址、物流和发票全勾上。服务器收到这段查询文本后照单执行，吐回来的 JSON 形状和客户端发来的查询骨架严丝合缝，不多给一字节，也不少给一个字段。

    第一步里取多了（[[over-fetching]]）与取不够（[[under-fetching]]）的问题就此从结构上被正面解开，前端也不用为了拼一个聚合页连着串行发三四个请求。不过先别急着欢呼：把点菜自由完全放给客户端之后，真正的账单全躲在后面两步里。
  derivation: original
  sources:
  - ref: graphql-spec
    locator: "GraphQL Specification: Type System / Execution"
    claim: 规范定义了以 schema 为合同、客户端在查询中声明字段集合、服务器按声明执行并返回对应形状的执行模型；GraphQL 由 Facebook 于 2012 年内部创建、2015 年开源。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
  code:
    lang: graphql
    code: |-
      query {
        order(id: "123") {
          status        # 手表只要这两行
          total
          items { name quantity }  # App 再多点这一层
        }
      }
  canvas:
    kind: datastate
    caption: 一份 schema，三端各点各的（业务场景示意）
    structure: array
    rows:
    - label: 点菜模式
      cells:
      - v: 只有一个
        sub: 就一个端点
        mark: active
      - v: schema
        sub: 写明全部字段
      - v: 与查询同形
        sub: 点到才给
        mark: active
  log:
  - at: 出身
    text: Facebook 2012 年为移动端而做，2015 年开源
- id: graphql-n-plus-1
  title: 第十步：N+1 暗坑搬家——省掉了 HTTP 往返，却打爆了数据库
  tldr: GraphQL 把多次网络请求合成了一次，可如果不做攒批，字段解析器逐行查库，一次请求照样打出 1 + 50 = 51 条 SQL。
  body: |-
    还是这套电商系统，来看客服售后后台的一页：运营想一次拉出 50 张关联订单的售后工单，并且每行都要显示负责处理的客服姓名。GraphQL 在服务器端的执行方式是按字段调解析函数（resolver）——先跑列表解析拿到 50 张工单，接着碰到每行里的「负责人」字段时，再分别触发一次字段解析。

    如果「负责人」解析函数里图省事写着「按单个负责人 ID 查一次用户表」，灾难就悄无声息地来了：1 条 SQL 拉回 50 张工单后，紧接着 50 次字段解析各自打 1 条 SQL 去查用户表——外面看着只发了一个干净的 HTTP 请求，数据库后台瞬间挨了 `1 + 50 = 51` 条 SQL！这就是有名的 [[N+1]] 问题：它并没有被 GraphQL 消灭，只是从过去客户端发 51 个 HTTP 请求，偷偷搬家成了服务端往数据库打 51 条 SQL，藏得更深、代码审查时更难一眼揪出。

    标准解药是 Facebook 开源的 [[DataLoader]]。它在同一次请求里当「攒批中转站」：先把这一轮事件循环里散落的 50 次按 ID 查用户请求攒进队列、去重，再合并成一条 `WHERE id IN (...)` 批量语句一次查回，最后按 ID 分发回每行工单，并在单次请求内做缓存（同一个客服出现十遍也只查一遍）。加上它，查询数立刻压回 2 条。客观说，REST 拼聚合接口时同样会踩 N+1，只是 GraphQL 允许客户端任意嵌套字段，让它极易在不知不觉中爆发，所以 DataLoader 几乎是上线标配。
  derivation: original
  sources:
  - ref: dataloader-repo
    locator: "graphql/dataloader: README（批处理与缓存的工作方式）"
    claim: DataLoader 通过攒批把单次请求内的多次单条加载合并为一次批量加载并做请求内缓存，是 GraphQL 场景下治理 N+1 的标准工具。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
  canvas:
    kind: datastate
    caption: 50 张工单加负责人：查询数的变化（业务场景示意）
    structure: array
    rows:
    - label: N+1 的账
      cells:
      - v: 51 条 SQL
        sub: 1+50 次查询
      - v: 2 条 SQL
        sub: 批量加缓存
        mark: active
      - v: REST 也会犯
        sub: GraphQL 易中招
  log:
  - at: 标配
    text: 上 GraphQL 就要同时上 DataLoader
- id: graphql-hidden-costs
  title: 第十一步：GraphQL 的另外三笔账——缓存、深查询与监控
  tldr: 所有请求全走一个 POST 入口后，浏览器和 CDN 的 URL 缓存全部失效；客户端万一点出一道连环嵌套的霸王餐，服务器还得自己防打爆。
  body: |-
    解掉 N+1 还没完，把点菜权放出去后还有三笔必须自掏工程量去补的账。第一笔是**[[缓存]]失灵**：REST 的 `GET /orders/123` 天然能顺着 URL 被浏览器、[[CDN]] 和反向代理直接缓存，配合 [[ETag]] 还能做 `304` 协商省流量；可 GraphQL 几乎全走 `POST /graphql`，查询条件塞在请求体里，沿途网络设备只看见同一个 URL 和不能缓的 POST 动词。要补回缓存，要么前端用 Apollo/Relay 按对象主键在客户端做归一化缓存，要么把常用查询哈希成持久化查询 ID 改走 `GET` 才能重新吃上 CDN。

    第二笔是**查询复杂度失控**：既然前端能自由嵌套，万一有人发出一条「订单套商品、商品套店铺、店铺又套全部订单……」的十层循环嵌套查询，或者用别名把同一个高开销统计字段复制一千次，一条请求就能把数据库和内存拖垮。生产级 GraphQL 网关必须提前设防：限制最大查询深度、给昂贵字段标权重并设单次查询复杂度预算，并在生产环境关闭任意内省（introspection）。

    第三笔是**可观测性改造**：哪怕查询里部分字段解析失败，GraphQL 默认依然返回 HTTP `200`，把错装在响应体的 `errors` 字段里，且路径全叫 `/graphql`。以前靠状态码和 URL 统计错误率的监控大盘全失灵了，必须改造成解析请求里的操作名和响应体 `errors` 字段来打点告警。这三笔账都能解，只是全算在团队自己的工程量上。
  derivation: original
  sources:
  - ref: graphql-spec
    locator: "GraphQL Specification: Execution / Response（错误以 errors 字段随 200 返回的执行模型）"
    claim: GraphQL 的执行模型把字段级错误放进响应体而非 HTTP 状态码，且单端点 POST 形态不利用 HTTP 的 URL 缓存语义，治理需在应用层另行建设。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
  canvas:
    kind: datastate
    caption: GraphQL 上线前要先备好的三套治理
    structure: array
    rows:
    - label: 三笔账
      cells:
      - v: HTTP 缓存失效
        sub: 要另起一套
      - v: 深查询可打爆库
        sub: 限深算成本
      - v: 全是 200
        sub: 按操作名打点
  log:
  - at: 共性
    text: 都能解，都要自己出工程量
- id: selection-interview
  title: 第十二步：选型与面试收官——先问谁在消费，再算复杂度账
  tldr: 资源规整、要吃 HTTP 缓存、对外开放用 REST；多端字段差异大、视图聚合重用 GraphQL；对外 REST 配对内聚合网关也很常见。
  body: |-
    把两边的账合成选型规则，落地其实很清晰。用 [[REST]] 的典型场景：实体规整稳定、消费者种类不多、十分依赖浏览器与 [[CDN]] 缓存、要直接开放给外部第三方开发者（行业通用约定最省沟通成本），或者涉及文件上传下载。用 [[GraphQL]] 的典型场景：同一批数据要同时服务 Web、iOS、Android、手表等多个端且字段差异极大、页面需要跨实体深度聚合，或者前端迭代节奏明显快于后端。真实系统里两者并存同样非常常见：对外公开 API 继续用 REST 保稳妥和缓存，对内架一层 GraphQL 充当聚合网关（BFF），把后面各微服务的 REST 和 [[gRPC]] 接口拼好交给自家前端点菜。

    落到面试高频题——「你们项目为什么选（或不选）GraphQL？」千万别背「GraphQL 很灵活、REST 太死板」这种空话，直接按**「约束 → 取舍 → 补救」**三段答：① 先交代约束（有几端、字段差异大不大、谁牵头迭代）；② 再讲取舍（如果只有自家 Web 后台，REST 加游标分页和统一错误体已经够稳，硬上 GraphQL 等于平白多养一套复杂度和监控治理；反之多端视图天天变，GraphQL 省掉的反复写定制接口成本远大于治理代价）；③ 最后补一句兜底动作（上了 GraphQL 就说明配了 DataLoader 治 N+1 和查询限深，用 REST 就提一句幂等键和 RFC 9457 错误体）。

    到这里网络学科全部收官，带走一句能复用的全局判断口诀：**「内部服务互调签 `.proto` 压二进制（gRPC）；外部接口求稳求缓存按资源拆（REST）；多端胃口杂且聚合深再开点菜层（GraphQL），但点菜账得算到 DataLoader 和限深为止。」** 选对接口形态从来不是看谁时髦，而是算清谁在消费、复杂度究竟落在哪一侧。
  derivation: adapted
