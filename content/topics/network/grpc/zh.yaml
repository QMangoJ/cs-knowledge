objectives:
- 说清 JSON 接口放到高频内部调用时的三笔账，以及 gRPC 分别用哪件武器结清
- 手算 varint(300) 与常见小字段号的 tag 字节，算出一条小消息的 Protobuf 总字节数
- 背出接口演进的三条纪律：只用新号加字段、删字段必须 reserved、改号改类型必炸
- 根据请求与响应的条数和方向，在一元、服务端流、客户端流、双向流里选对调用形状
aiLink: 大模型推理网关和模型引擎之间，正是 [[gRPC]] 的典型主场：两边先用同一份 .proto 约好请求参数与逐 [[token]] 吐字的流式响应，[[deadline]] 管住单次生成最多跑多久，字段号演进纪律让接口在不停服的前提下安全新增推理参数。
design:
- mechanism: 先写 .proto 合同再生成代码
  problem: 如果接口格式只写在各自代码或口头文档里，谁悄悄改了字段名或把数字改成字符串，编译器根本拦不住，往往要等到上线收到真实流量、解析炸掉才发现；每多一种编程语言调用，还得重抄一遍拼装与校验的胶水代码。
  choice: 把接口字段、数字编号和调用方法统一收进一份独立的 .proto 文件，当作唯一事实源；开发改接口先改合同，再用 protoc 为各语言生成强类型客户端 stub 和服务端骨架。
  tradeoff: 开发流程多了一道改合同、重新生成代码和协调发版的工序，项目很小或只有三五个低频接口时，比直接写 JSON 显得笨重；如果合同缺少评审，字段同样会越加越乱。
  root: 把「线上运行到一半才暴露的字段对不上」提前到「本地编译期就直接报错」，本质是用一点流程规范成本，换掉线上排障的昂贵代价。
- mechanism: 线上只传字段号与变长二进制，不传字段名
  problem: JSON 每次发请求都要把键名连同引号、逗号一起重复发一遍，数字还要按字符逐个扫描转换；服务之间每秒互相调几万次时，大量带宽和 CPU 全耗在这些重复格式字符上。
  choice: 线上字节流里彻底去掉字段名，只传「字段号 + 类型」合出的 tag 和紧凑的 varint 变长整数，接收方拿着同一份 .proto 合同按号码对号还原；可读性不是丢了，而是从网线上搬回合同文件里。
  tradeoff: 排障门槛明显提高：抓包看到的是一串十六进制数字，手头没有 .proto 合同就一个字段也解不出来，平时拿 curl 随手试接口的便利也没了。
  root: 共享信息放在每条消息里是按调用次数重复买单，抽进双方事先约定好的合同里则是买断一次长期复用——调用越频繁、消息越短，抽走键名的收益越夸张。
- mechanism: 直接复用 HTTP/2 作传输底座，不重造传输层
  problem: 要给远程调用做多路复用、流量控制、头压缩和加密传输，如果从零设计一套新传输协议，每项都要经过多年网络验证，还得应付各类防火墙和中间设备的拦截。
  choice: gRPC 只补齐远程调用自己缺的那一层——.proto 合同、四种流式调用、超时预算传播和标准错误码；底层直接把每次调用映射成一条 HTTP/2 流，消息装进 DATA 帧、方法名和元数据走 HEADERS 帧并用 HPACK 压缩。
  tradeoff: 借用现成地基也把地基的缺陷一并继承过来：HTTP/2 跑在 TCP 之上，一条长连接一旦丢包，同一连接上并发跑着的其他调用依然会被按序交付卡住，还得照管 HTTP/2 的流控窗口调参。
  root: 协议分层的核心原则是复用现成底座：只有现成传输层语义实在不够用时才值得重写轮子，既然内网低丢包环境下 HTTP/2 已经够用，就把全部精力花在契约与调用语义上。
quiz:
- q: varint(300) 编码成哪两个字节？
  options:
  - 0x2C 0x02
  - 0xAC 0x02
  - 0x01 0x2C
  - 固定占 4 字节 0x2C 0x01 0x00 0x00
  answer: 1
  explain: 300 的低 7 位是 44（0x2C），续读旗置 1 后是 0xAC；高位剩 2，续读旗为 0，即 0x02。低位组先发。
- q: 字段号 2、类型为 [[LEN]] 的 [[tag]] 字节是多少？
  options:
  - "0x02"
  - "0x10"
  - "0x12"
  - "0x22"
  answer: 2
  explain: tag 等于字段号左移 3 位再或上[[类型号|wire type]]：(2 左移 3) 或 2 等于 18，即 0x12；低 3 位是类型，其余位是字段号。
- q: 下面哪种改 .proto 的做法是安全的？
  options:
  - 把字段 2 的类型从 string 改成 int32
  - 删掉字段 3 后把号码 3 给一个新字段用
  - 新增字段时用一个从没用过的新字段号
  - 把 name 字段的号码从 2 改成 5，显得更整齐
  answer: 2
  explain: 加新字段必须用全新号码，旧端能按类型跳过不认识的字段、新端读旧数据取默认值；删字段要 reserved 封号，改号与改类型都会让旧数据被误解。
- q: 客户端发一个请求、服务端陆续返回许多条结果（如逐 token 生成），该用哪种调用形状？
  options:
  - 一元调用，多调几次凑齐
  - 客户端流
  - 服务端流
  - 双向流
  answer: 2
  explain: 一问多答正是服务端流：一份请求换一条响应消息流，与上一课的流式响应同构，只是流的是结构化消息。
steps:
- id: why
  title: 为什么换掉 JSON：高频调用放大了三笔隐形账
  tldr: 键名重复传、文本逐字扫描、字段无合同约束——JSON 在网页调试里的便利，放到服务间每秒上万次调用里全成了实打实的成本。
  body: |-
    回到开头那个场景：订单服务每天向用户服务查几百万次 `{id: 150, name: "hi"}`。你平时在前端写 `fetch('/api/user')` 收回一串 [[JSON]] 很顺手，打开浏览器控制台一眼就能看清字段。可当调用双方都是自家后端服务、网关每秒要转发上万次这种短消息时，三笔以前不显眼的账立刻藏不住了。

    第一笔是体积账：`{"id":150,"name":"hi"}` 一共 22 个字节，真正有用的信息只有 `150` 和 `hi` 这 5 个字符，剩下的引号、括号和重复出现的键名 `id`、`name` 占了一大半。第二笔是解析账：数字 `150` 在线上是 `'1'` `'5'` `'0'` 三个字符，接收方必须逐字扫过逗号和引号再转换成整数。第三笔是无合同账：两边没有机器共认的接口文件，用户服务把 `id` 悄悄改成字符串或者改个字段名，编译时毫无报错，只能等线上流量跑过来、解析崩掉才发现。

    这套机制是被大规模微服务调用逼出来的：Google 在内部每天跑海量服务互调，正是为了结清这三笔账，才做出二进制格式 [[Protobuf]] 和开源框架 [[gRPC]]。放到前端视角里好比：写零散小脚本时直接拼 [[JSON]] 最省事，可大型工程里大家会先写 TypeScript 类型接口并配代码生成兜底——gRPC 就是把这份「先定类型合同」的规矩从编辑器延伸到了网线上。
  derivation: original
  sources:
