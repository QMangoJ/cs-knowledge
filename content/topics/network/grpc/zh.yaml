- id: protobuf
  title: ".proto 合同先行：字段名留在文件里，字段号才上网"
  tldr: ".proto 合同里等号后面的 1 和 2 不是默认值，而是字段在线上唯一的数字身份证；两端语言可以不同，但共认这一份文件。"
  body: |-
    动手写业务代码前，双方团队先共同维护一份 `.proto` 文本文件（也就是常说的 [[IDL]]，接口定义语言）。看右边代码：`message User` 声明一条用户记录有哪些字段，`service UserService` 声明服务开放了哪些方法、入参和返回值各自是什么类型（service 里的四种调用形状第八步展开）。

    新手看 `.proto` 最容易踩的坑，是误以为 `int32 id = 1;` 里等号后面的 `1` 是默认值。其实它既不是默认值，也不是写着好看的序号，而是这个字段在线上传输时唯一的「字段号」。`id` 和 `name` 这些英文名字只活在代码编辑器和 `.proto` 文件里，线上一个字母都不传，真正写进字节流里的只有字段号 `1` 和 `2`。好比两家公司签好标准合同后给条款编了不可更改的条号，以后对账只报「第 1 条、第 2 条」，谁也不用每回把条款标题重念一遍。

    合同定稿后交给编译器 [[protoc]]：订单服务用 Go 就生成一份 Go 语言的打包代码和客户端 [[stub]]，用户服务用 Java 或 Python 就生成对应语言的骨架代码。两端语言完全可以不同，但共用同一份 `.proto`，字段类型对不上的错误在编译期就会直接报错拦下。
  derivation: original
  sources:
