title: gRPC 与序列化：先签合同，再传字节
summary: "[[gRPC]] 是 Google 基于内部长期跑通的 RPC 体系开源出来的远程调用框架，搭配 [[Protobuf]] 二进制格式，专门解决服务间高频调用的三笔开销：动手写业务前先在 .proto 文件里给每个字段编上固定号码，由编译器直接生成跨语言现成的客户端与服务端代码；发包时不传字段名，只传紧凑的字段编号和变长整数；底层直接复用 [[HTTP/2]] 的一条连接并发收发请求。本课带着同一个查询用户的例子，从算清文本协议的代价起步，一路拆到字节级编码、兼容纪律、四种流式形状与全链超时传播，最后也划出不该上重装备的边界。"
premise: "订单服务每天要向用户服务查几百万次记录，每次拿回来的其实就是一条短消息：{id: 150, name: \"hi\"}。按平时写网页接口的习惯，用 fetch 配 [[JSON]] 再顺手不过，可调用量一上来，重复传送的键名和文本解析就吃掉大把带宽与 [[CPU]]，有人顺手改个字段名更是上线后才报错。这节课要解的就是这个困惑：两台机器天天高频对话，怎样先把接口写死成双方共认的合同，再把消息压成几个字节、沿着一条长连接高效送达？"
position: 本课属于网络学科第六个板块「接口的合同：RPC 与序列化」，是这一板块的第一课。前五课从三次握手、完整请求、域名解析、拥塞控制一路走到 HTTP/2 与 QUIC，已经把数据怎么可靠、快速地从一台机器送到另一台机器铺好底座；从本课起往上来到应用接口层，先解决内部微服务之间的机器对机器合同，下一课《REST 与 GraphQL》再切到面对浏览器与外部开发者的公开 HTTP 接口。
bridge:
  prev: 上一课讲到 HTTP/2 用二进制分帧和多路复用，让一条连接能并发跑许多条流而互不堵队。可高速路铺好之后，里面运的货物怎么打包、通信双方怎么对齐格式？这一课就看 gRPC 如何直接借这条现成高速路，在上面立起服务之间的调用规则。
  next: 内部服务靠 .proto 合同和二进制跑得又快又稳，可一旦接口要直接交到浏览器、手机应用或第三方开发者手里，二进制抓包看不懂、各方要的字段又天天变，这套重装备反而不顺手了。下一课转向面向外部客户端的接口世界，比较 REST 怎么用资源规矩保住缓存，GraphQL 又怎么放开按需点菜，以及各自要付什么治理代价。
overview:
- key: 一句话总结
  value: 先用 .proto 合同把字段编号定死，再把数据压成不带字段名的紧凑字节，最后借一条 HTTP/2 连接跑完所有远程调用
- key: 合同与形态
  value: ".proto 是一份独立文本文件，既写数据结构也写接口方法；编译器 [[protoc]] 把它生成各语言现成的客户端存根（[[stub]]）和服务端骨架"
- key: 编码省在哪
  value: 线上不传字段名，只传「字段号 + 类型」合出的 [[tag]]；整数改用变长编码 varint，常用小数字只占一两个字节
- key: 传输底座
  value: 不重造轮子，直接借 HTTP/2 一条连接并发跑多路请求、复用 [[HPACK]] 头压缩，同时继承了它基于 TCP 的按序约束
- key: 边界与取舍
  value: 内部微服务高频互调是它的主场；浏览器直连受限得靠代理转译，简单低频或对外公开接口继续用 JSON 更划算
