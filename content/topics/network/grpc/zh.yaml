- id: rpc-idea
  title: RPC 的写法与假象：代码像本地调用，失败还是远程的
  tldr: 合同编译出的 [[stub]] 替你藏起了打包与网络收发，让你能写出 userClient.getUser(150)；但它藏不住超时、断网和回包丢失。
  body: |-
    RPC（Remote Procedure Call，远程过程调用）的想法很直白：让订单服务去调用户服务的代码，写起来像调用自己内存里的函数一样，直接写一句 `userClient.getUser(150)`，不用手写 URL、调 `fetch`、拆状态码。

    替你包揽网络脏活的是一个由合同生成出来的客户端代理库，叫做 [[stub]]（存根）。它就以代码库的形式嵌在订单服务进程里：你把参数 `150` 交给它，它就地把对象压成字节、通过网络连接发给用户服务；用户服务那边也有一套骨架代码把字节解回参数、跑完业务逻辑再把结果发回来。就像前端用 OpenAPI 自动生成带类型的请求函数一样，业务代码只管按类型传参和收返回值。

    等一下，那是不是就能真的把 `userClient.getUser(150)` 当本地函数写了？千万别上当。本地函数要么成功返回，要么当场抛异常；远程调用中间隔着网线，可能超时、连不上，甚至用户服务其实已经执行成功，只是回包在半路丢了——你根本不知道到底执行没执行。所以 `stub` 只是写法上的方便，每个远程调用都必须显式定好超时上限，并想清楚能不能安全重试。
  derivation: original
  sources:
