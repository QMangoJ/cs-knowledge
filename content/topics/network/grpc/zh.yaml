- id: varint
  title: 逐字节拆解：varint 怎样把 300 压成两字节，tag 怎么算
  tldr: varint 每字节拿 7 位存数、最高位当续读标记、低位组先发；[[tag]] 则把字段号左移 3 位再拼上低 3 位的[[wire type]]。
  body: |-
    小整数为什么能用比固定 4 字节更少的空间传过去？秘密在变长整数编码 varint：每个字节拿低 7 位存数字载荷，最高那 1 位留作「续读旗」——`1` 表示后面还有字节，`0` 表示到此结束——并且把低位的那组 7 比特先发出去（小端序）。拿 `300` 手算一遍：`300` 的二进制是 `100101100`（9 位），1 字节装不下，就从低往高切成两组——低 7 位是 `0101100`（44），高位剩 `10`（2）。发第一个字节时在低位组前面加续读旗 `1`，拼成 `10101100`（`0xAC`）；发第二个字节时放入高位 `0000010` 并把续读旗置 `0`，得到 `0x02`。于是 `varint(300)` 就是 `0xAC 0x02` 两字节，解码端撕掉最高位拼回原位即可。

    再看线上不带名字怎么分清字段归谁。每个字段开头都要垫一个字节的 [[tag]]，算法是 `(字段号 << 3) | 类型号`——把低 3 位固定留给数据类型（[[wire type]]，用来告诉解码器后面怎么切字节），高几位放字段号。套回我们的 `User` 记录算一遍：`id` 是 1 号 varint 字段（类型号 `0`），`(1 << 3) | 0 = 8`（`0x08`），加上 `varint(150)` 的两字节 `0x96 0x01`，正好凑出代码区里的 `08 96 01` 共 3 个字节；`name` 是 2 号长度型字段（类型号 `2`，即 [[LEN]]，后面先跟字节长度再跟内容），`(2 << 3) | 2 = 18`（`0x12`），加上长度 `0x02` 和 `"hi"` 两个字符 `68 69`，正好是 `12 02 68 69` 共 4 个字节——合起来严丝合缝就是 7 字节。

    等一下，既然 varint 这么省空间，为什么不无脑全用它？因为它是在赌真实业务里小数字占多数：用户编号、状态枚举、页码通常很小，1 到 2 字节就能搞定；可如果字段里常装很大的 32 位随机数，每字节交出 1 位当续读旗反而会胀到 5 个字节（普通负数更是如此，需要另配 ZigZag 编码折成正数再压）。编码从来不是魔法，而是按常见分布赌来的空间收益。
  derivation: original
  sources:
  - ref: protobuf-encoding
    locator: Encoding（Base 128 Varints 与 Message Structure 的 tag 公式）
    claim: varint 每字节以最高位作续读位、低 7 位为载荷且低位组先行；tag 由 (字段号左移 3 位) 或上类型号构成
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
  canvas:
    kind: datastate
    structure: array
    caption: varint(300) 的拆分与两个 tag 的合成
    rows:
    - label: 300 拆 7 位组
      cells:
      - v: "0101100"
        mark: active
        sub: 低 7 位 = 44
      - v: "10"
        sub: 高位 = 2
      - v: 0xAC
        mark: found
        sub: 旗 1 加低组
      - v: 0x02
        mark: found
        sub: 旗 0 加高组
    - label: tag 合成
      cells:
      - v: 0x08
        sub: id：(1 左移 3) 或 0
      - v: 0x12
        sub: name：(2 左移 3) 或 2
  log:
  - mode: 手算
    event: 手算结果是 varint(300) 等于 0xAC 0x02，与脚本复核一致
  code:
    lang: text
    code: |-
      消息 {id:150, name:"hi"} 的 7 字节拆解（脚本复核）：
      id   = 08 96 01       tag 0x08 + varint(150)=0x96 0x01，共 3 字节
      name = 12 02 68 69    tag 0x12 + 长度 0x02 + "hi"，共 4 字节
      JSON 同内容 {"id":150,"name":"hi"} = 22 字节
    note: 150 的 varint 与官方 Encoding 文档的示例字节 08 96 01 完全一致
- id: compatibility
  title: 合同演进纪律：只许加新号，删字段必须封号
  tldr: 服务升级不可能瞬间同时重启，让新旧两端互不误读靠三条纪律：加字段用新号、删字段写 [[reserved]]、原地改号改类型必炸。
  body: |-
    线上发版时，订单服务和用户服务不可能同一微秒一起重启，总有一段窗口期是新版代码在跟旧版对话。想让升级期间两边不互相误读，唯一的安全动作是「用从没用过的新号码加字段」。比如要给 `User` 加一个 `vip_level`，就老老实实写成 `int32 vip_level = 3;`。旧版订单服务收到字节流看到不认识的 3 号字段，只要看一眼 tag 低 3 位的类型号就知道该跳过几个字节，直接忽略不崩（向前兼容）；新版用户服务读旧请求没见着 3 号字段，就自动填成默认值 `0`（向后兼容）。

    相反，最危险的动作是改字段号和改字段类型。因为线上只认号码不认名字：如果你图顺眼把 2 号字段从 `string` 改成 `int32`，旧端发过来的字符串字节会被新端当成变长整数硬解——两边编译都能顺利通过，到了线上却要么解析报错，要么悄悄解出一堆毫无意义的乱数。

    那旧字段真不需要了该怎么删？假如将来业务下线了原本的 2 号字段 `name`，删完之后千万别把空出来的号码留着给新人捡漏，必须在 `message` 里补上封号声明：`reserved 2;` 和 `reserved "name";`，把号码和旧名字一起贴上封条。以后无论谁想在 `.proto` 里重新复用 2 号或那个旧名字，编译器都会在编译期当场报错拦住。遇到含义彻底变了的大改，宁可新开一个字段号或新方法，也不要原地改写历史。
  derivation: original
  sources:
  - ref: protobuf-encoding
    locator: Proto3 Language Guide（Assigning Field Numbers、Deleting Fields 与 Reserved）及 Encoding（未知字段按类型跳过）
    claim: 字段号投入使用后不得更改或复用，删除字段必须 reserved 封存其号码与名字；解析器可按类型跳过不认识的字段
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
  canvas:
    kind: datastate
    structure: array
    caption: 演进动作的红绿灯
    rows:
    - label: 判定
      cells:
      - v: 加新字段用新号
        mark: found
        sub: 安全
      - v: 删字段加 reserved
        mark: found
        sub: 安全
      - v: 改号
        mark: active
        sub: 灾难
      - v: 改类型或复用旧号
        mark: active
        sub: 灾难
    aux:
    - label: 双向兼容
      items:
      - 向后：新代码读旧数据
      - 向前：旧代码读新数据
  log:
  - mode: 演进
    event: 字段号是已经发生的历史，只能追加新号，不能改写旧号
- id: http2-base
  title: 站在 HTTP/2 上跑：借走多路复用与分帧，也继承 TCP 的脾气
  tldr: gRPC 不重造传输层，而是把每次调用映射成一条 [[HTTP/2]] [[stream]]，消息进 [[DATA 帧]]、方法名与元数据交由 [[HPACK]] 压缩。
  body: |-
    把 `User` 压成 7 个字节后，它们怎么从订单服务送到用户服务？[[gRPC]] 没有另起一套传输协议，而是直接借用了上一课的 [[HTTP/2]]。两台服务之间只需维持极少数长连接，每次调用 `GetUser` 就占其中一条逻辑流（[[stream]]）：几百个并发调用交错着在一条连接上跑，省去了每次请求重新三次握手和 TLS 建连的耗时。

    上一课的另外两个设计也直接对号上岗。[[HTTP/2]] 的二进制分帧里，调用的方法名 `/UserService/GetUser` 与附带头信息装进 HEADERS 帧，序列化出来的 7 字节消息装进 [[DATA 帧]]；而几百万次调用里方法名与公共头部几乎完全重复，[[HPACK]] 头压缩把这些重复头收进动态表里，后续调用只发极短的索引编号就行。

    等一下，既然上一课说了 QUIC 还能治好 TCP 队头阻塞，gRPC 为什么主要还是跑在基于 TCP 的 HTTP/2 上？因为在机房内网里丢包率极低，[[TCP]] 与 [[HTTP/2]] 的内核流控、加密和负载均衡生态已经极为成熟；当然代价也原封不动被继承下来——一旦同一条长连接上真丢了一个包，TCP 按序交付的规矩照样会连累上面跑着的其他并发调用一起等重传。
  derivation: original
  sources:
  - ref: grpc-docs
    locator: FAQ（gRPC 与 HTTP/2 的关系：遵循 HTTP/2 语义并允许全双工流）
    claim: gRPC 大体遵循 HTTP/2 之上的 HTTP 语义，并在此之上明确支持全双工流式调用
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
  canvas:
    kind: datastate
    structure: array
    caption: 上一课的三个机制在本课的对应岗位
    rows:
    - label: HTTP/2 机制
      cells:
      - v: 多路复用
        mark: active
        sub: 一条连接跑所有调用
      - v: 二进制分帧
        sub: 消息进 DATA 帧
      - v: HPACK
        sub: 方法名与元数据只发索引
    aux:
    - label: 继承的代价
      items:
      - TCP 层队头阻塞仍在
  log:
  - mode: 复用
    event: 传输底座借 HTTP/2 现成的，创新预算只花在合同与调用语义上
- id: streaming-modes
  title: 四种调用形状：先数请求几条，再数响应几条
  tldr: 不必死记名词：在 .proto 的入参和返回值前，谁挂上 stream 谁就连续发多条，两两组合刚好覆盖一对一到多对多。
  body: |-
    普通函数天生是一问一答，但现实业务里经常出现「问一次要持续收几十条」或者「先连续推一批再要一个汇总」。借着 HTTP/2 全双工流的能力，[[gRPC]] 提供了四种调用形状——看右边代码就知道，完全不用死记，`.proto` 里括号哪一边挂了 `stream` 关键字，哪一边就能连续发一串结构化消息。

    按实际业务走一遍就清楚了。**一元调用**（一对一）最像普通函数，比如订单服务发一次 `GetUser(150)` 拿回一条 `User`；**服务端流**（一对多）是客户端发一个请求、服务端源源不断往回推消息，比如订单状态实时订阅，或者大模型推理服务逐个 [[token]] 往外吐字；**客户端流**（多对一）反过来，客户端分批上传一大串日志或文件切片，服务端最后回一个汇总结果；**双向流**（多对多）允许双方各自独立互发，适合实时协同编辑或音视频信令这类对话场景。

    选型时只需先问两个问题：数据在时间上是发完一次就停，还是分批连续到达？方向是单向推送，还是双向随时互发？原本适合服务端流的场景如果硬拆成前端/网关每隔几百毫秒轮询一次一元调用，省下来的传输层功夫全会被多余请求吃回去。
  derivation: original
  sources:
  - ref: grpc-docs
    locator: Core concepts, architecture and lifecycle（Service definition：四种服务方法）
    claim: gRPC 定义四种方法：一元、服务端流、客户端流与双向流，单次调用内消息顺序有保证
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
  canvas:
    kind: datastate
    structure: array
    caption: 四种形状就是请求条数乘响应条数
    rows:
    - label: 形状
      cells:
      - v: 一元
        sub: 一对一
      - v: 服务端流
        mark: active
        sub: 一对多
      - v: 客户端流
        sub: 多对一
      - v: 双向流
        sub: 多对多
  log:
  - mode: 选型
    event: 调用形状按请求与响应的条数和方向来选，不靠感觉
  code:
    lang: protobuf
    code: |-
      service Demo {
        rpc GetUser (Req) returns (User);                  // 一元
        rpc WatchOrders (Req) returns (stream Order);      // 服务端流
        rpc UploadLogs (stream Log) returns (Summary);     // 客户端流
        rpc Chat (stream Msg) returns (stream Msg);        // 双向流
      }
    note: stream 写在哪边，哪边就是连发的一方
- id: deadlines
  title: 超时与取消：整条调用链共用一只倒计时钟
  tldr: "[[deadline]] 沿调用链往下传的是扣掉已耗时后的剩余预算，而不是每跳重置；到点整链一齐取消，业务代码得接住信号停手。"
  body: |-
    线上一个用户请求往往要穿好几层服务：客户端发给网关，网关调订单服务，订单服务再调用户服务和库存服务。分布式系统最怕「最前面的客户端早就等不及断开走人了，最底下的服务还在满头大汗查慢 SQL」。因此 gRPC 立了一道规矩：调用时带上 [[deadline]]（截止期限），而且整条调用链共用这一只倒计时钟，绝不每跳重新清零计时。

    顺着画布上的数字走一遍：客户端给这次调用批了 `2.0` 秒总预算；网关自己先忙活了 `0.5` 秒才往下转发，传给订单服务时预算自动扣成剩 `1.5` 秒；订单服务又花了 `0.7` 秒才去调用户服务，传下去的就只剩 `0.8` 秒。注意一个关键细节：线上传递的是「还剩多少时长」而不是「北京时间几点几分截止」，这样就算两台机器的系统时钟快慢差了几百毫秒也不会算岔。2.0 秒一到还没出结果，客户端收到 [[DEADLINE_EXCEEDED]]，下游各跳收到 [[CANCELLED]]；但要盯紧代码——框架只负责递取消信号，业务代码必须主动检查取消状态并及时中断数据库查询，否则资源照样白白烧光。

    顺带记住另两条接口规矩：登录凭证、链路追踪编号（[[trace ID]]）这类不属业务入参的上下文信息，统一放进 [[metadata]]（随调用附带的键值对头部），别塞进消息体；调用失败直接返回 gRPC 标准状态码，别全包装成成功响应再在正文里塞报错文字，那样网关和熔断器根本没法统一判错。
  derivation: original
  sources:
  - ref: grpc-docs
    locator: Guides（Deadlines：Deadline Propagation）与 Core concepts（Deadlines/Timeouts、Metadata）
    claim: deadline 应沿调用链传播，传播时转为扣掉已耗时的剩余时长以避开时钟偏差；到点客户端得 DEADLINE_EXCEEDED、服务端调用被取消
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
  canvas:
    kind: datastate
    structure: array
    caption: 两秒预算沿链递减，而不是每跳重置
    rows:
    - label: 剩余预算
      cells:
      - v: 客户端
        mark: active
        sub: 2.0 秒
      - v: 网关
        sub: 剩 1.5 秒
      - v: 下游服务
        sub: 剩 0.8 秒
      - v: 到点
        mark: found
        sub: 全链取消
  log:
  - mode: 传播
    event: deadline 沿链传播时传的是剩余时长，不传绝对时刻，这样不受各机时钟偏差影响
- id: when-not
  title: 什么时候别用 gRPC：三种不划算的场景与全课口诀
  tldr: 浏览器直连受限、对外公开接口重可调试性、简单低频业务不划算——先问清调我的是谁、频次多高，再决定上不上这套重装备。
  body: |-
    最后划清边界：这三种场面别硬上 gRPC。第一是浏览器前端直接连后端：浏览器里的 JavaScript 拿不到原生 gRPC 要求的 HTTP/2 底层帧与尾部状态控制，必须经过 [[gRPC-Web]] 配合代理做一道转译，而且浏览器端目前只支持一元调用和服务端流，客户端流与双向流全用不了。第二是对外公开给第三方开发者的 [[API]]：别人拿 [[curl]] 一敲就能看清 [[JSON]] 返回，换成 gRPC 就得先传 `.proto` 合同、再装编译器生成代码，排障门槛陡增。第三是低频简单业务：一天只调几百次，JSON 那点体积与解析开销可以忽略，维护合同和发版同步的成本反而更重。

    把全课结清的四笔账并回一起：`.proto` 先行结清无合同账，字段号配 varint 结清体积与解析账，[[HTTP/2]] 底座结清连接并发账，[[deadline]] 与 `reserved` 管住超时传播和演进兼容。可见 gRPC 不是全场景通吃，而是在「两端都是自家服务、高频调用、跨语言互调」这一块主场里算到极致的选择。

    临走带走一句判断口诀和三问自检：**「对内高频签合同、压字节、走长链；对外开放图省事、能抓包、吃缓存。」** 以后给新接口选型时先问自己三句：① 调用方是自家后端，还是浏览器和外部开发者？② 调用量高到 JSON 的体积和解析真的开始吃 CPU 了吗？③ 团队能守住 `reserved` 不复用旧字段号的纪律吗？回答完这三问，要不要上 gRPC 心里就有谱了；要面对多变的浏览器和手机端，就交给下一课的 HTTP API 吧。
