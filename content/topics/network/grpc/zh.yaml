- id: serialization
  title: 序列化算总账：同一条用户记录，22 字节压成 7 字节
  tldr: "内存对象带着指针和对齐空洞没法直接上网线；同一条 {id: 150, name: \"hi\"}，[[JSON]] 文本占 22 字节，[[Protobuf]] 只占 7 字节。"
  body: |-
    序列化就是把内存里的对象压成一串能发过网线或存进磁盘的字节，收回来再拼回对象叫反序列化。内存对象里装着跨地址指针和对齐留白，直接按内存布局发给另一台机器根本认不出来，所以你平时在浏览器里调用 [[JSON.stringify]] 和 [[JSON.parse]]，干的也是同一件翻译的活，只是译出来是人眼能看懂的文本。

    继续拿用户记录 `{id: 150, name: "hi"}` 算一笔硬账：写成 `{"id":150,"name":"hi"}` 这段 [[JSON]] 文本，数一数正好 22 个字节——2 个大括号、6 个双引号、2 个冒号、1 个逗号、两个键名共 6 个字母，加上 `150` 和 `hi` 5 个有效字符。换成 [[Protobuf]] 二进制编码，整条消息只占 7 个字节：`id` 字段 3 字节，`name` 字段 4 字节，具体每一位怎么排出来的第五步逐字节拆开。

    省下的不只是 3 倍多带宽，还有解析速度：二进制解码不用逐字扫逗号和引号，而是顺着字节偏移直接读整数、按长度切字符串。代价也摆在明面上：字节流里一个字母的键名都没有，抓包工具截下来只能看到一串十六进制数字，离开合同文件完全读不懂——体积和速度，是用人眼直接可读性换来的。
  derivation: original
  sources:
  - ref: protobuf-encoding
    locator: Encoding（Message Structure：二进制消息只用字段号作键）
    claim: Protobuf 二进制消息以字段号为键组织记录，字段名与声明类型只能在解码端对照消息定义确定
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
