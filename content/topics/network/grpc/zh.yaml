title: gRPC 与序列化：先签合同，再传字节
summary: JSON 接口有体积、解析与无合同三笔账；gRPC 用 .proto 合同加 Protobuf 二进制编码，再站在 HTTP/2 上把这三笔账一次结清。
premise: 以你每天写的 fetch 加 JSON 接口为起点，对照同一条消息在 JSON 与 Protobuf 下的字节账。
position: 本课属于网络科新板块「接口的合同：RPC 与序列化」，是网络科的收官课：上一课 http2-quic 把 HTTP/2 的多路复用与二进制分帧讲透，本课接着看这套底座怎样被 gRPC 借去承载服务间调用，并补上此前各课都没正面处理的一层——机器之间先用什么合同约定接口、再怎样把对象压成字节。学完你能手算 varint 与 tag、说清字段号的兼容规则，并判断一个接口该用 gRPC 还是继续用 JSON。
bridge:
  prev: 上一课说 HTTP/2 的多路复用与二进制分帧不只是浏览器的加速器：帧与 stream 让一条连接并发跑许多请求，本课就看它怎样被 gRPC 借去当服务间通信的底座——每个 RPC 调用占一条 stream，消息装进 DATA 帧，元数据走 HEADERS 帧。
overview:
- key: 一句话总结
  value: 先用 .proto 签一份带字段号的合同，再按合同把对象编码成紧凑字节，最后借 HTTP/2 的一条连接跑全部调用
- key: 合同
  value: IDL 先行，.proto 既定义消息也定义服务方法，protoc 据此生成各语言的 stub 与骨架代码
- key: 编码
  value: 线上只传字段号不传字段名，整数用 varint 变长编码，小数字只占一两个字节
- key: 底座
  value: 不重造传输层，直接复用 HTTP/2 的多路复用、二进制分帧与 HPACK 头压缩
- key: 边界
  value: 浏览器直连受限、对外接口难调试、简单场景不划算——gRPC 是服务间高频调用的最优解，不是万能药
visual: datastate
