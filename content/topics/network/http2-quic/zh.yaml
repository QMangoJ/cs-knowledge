- id: hpack-qpack
  title: 头部压缩的顺带难题：HPACK 靠顺序同步，到 QUIC 改用 QPACK 防连坐
  tldr: 并发几十条流时，每条请求重复携带几百字节的 Cookie 和身份头太浪费，[[HPACK]] 靠双方同步动态表把重复头字段压成 1–2 个字节的索引；可这种严格按序同步在可乱序交付的 QUIC 上会复活队头阻塞，所以 HTTP/3 改用 [[QPACK]]。
  body: |-
    拉 20 张图片时，每次请求都带着五六百字节几乎一模一样的 Cookie、User-Agent 和授权头，平白吃掉不少流量。[[HPACK]] 的省字节办法很聪明：把最高频的标准头预先编号放进「静态表」（比如 GET 方法直接对应索引 2），把当前连接特有的长 Cookie 第一次完整发过去并登记进双方共用的「动态表」，同时用 [[Huffman 编码]] 压短字符串。后面 19 个请求再用到同一个 Cookie 时，线上只要发一两个字节的表编号就完事了。

    等一下，这套表这么省流量，为什么后面 QUIC（HTTP/3）不能直接抄过去用？问题出在动态表的同步依赖严格按顺序到达！假设流 1 的请求头里顺手往动态表第 65 号格写入一个新自定义头，紧接着流 3 的请求就只发了一句「查第 65 号格」。跑在 TCP 上时流 1 铁定先于流 3 送进解码器，毫不出差错；可一旦换到各流独立乱序交付的 QUIC，万一流 1 的包半路丢了、流 3 的包先到达，流 3 看着「查 65 号格」就根本解不出来，被迫干等流 1 重传——队头阻塞居然顺着压缩表借尸还魂了！

    [[QPACK]] 为了打破这层连坐，把表更新从业务流里剥了出来：专门开两条独立的单向控制流，一条只负责往对端推送「新增表项」指令，另一条由解码方回送「已确认收到」。如果流 3 实在想提前引用刚写入的表项（叫阻塞流），双方事先谈好上限（设为 0 就彻底零阻塞）；稳妥起见则只引用已确认落地的表项，宁可少压几个百分点，也保住各流之间绝对独立。
  derivation: original
  sources:
  - ref: rfc-9113
    locator: RFC 9113 Section 4.3/HPACK 引用（头部压缩与动态表）
    claim: HTTP/2 用 HPACK 以静态表、动态表与 Huffman 编码压缩头部，依赖连接内有序处理
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
