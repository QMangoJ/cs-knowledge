- id: h2-multiplex
  title: 第二场仗开打：HTTP/2 用二进制分帧在一条连接上并发
  tldr: "[[HTTP/2]] 把整块文本报文拆成带流编号的小二进制帧，让 HTML、CSS、图片在同一条 TCP 连接上切片交错收发、对端按编号各自拼装，一举解开了应用层的排队阻塞。"
  body: |-
    [[HTTP/2]] 没有改动方法、状态码和头字段这些业务语义，而是在传输和报文之间加了一层二进制分帧：所有请求和响应都被切成 HEADERS、[[DATA 帧]] 等小块，每个帧的头部都清清楚楚标上自己的 [[stream]] 编号（例如 HTML 是 stream 1、CSS 是 stream 3、大图是 stream 5）。

    用帧的视角看一看同一条 TCP 连接里发生了什么：以前拉大图就像一辆百吨重卡横在单车道上，后面小巧的 CSS 只能干瞪眼；现在大图被切成几十片带 stream 5 标签的 DATA 帧，于是发两片大图，可以立刻插一段 stream 3 的 CSS，再夹一片流式 AI 的回答（stream 7）。到达手机端后，接收方看着帧头的流编号，把碎片分别倒回 1 号、3 号、5 号、7 号各自的篮子里拼回完整文件——谁先到齐谁先渲染。

    这一招直接把并发数和 TCP 连接数拆开了：以前一个页面恨不得同时开几十条连接抢路，现在每个域名老老实实只维持 1 条连接就够几十条请求同时飞；浏览器不用再凑 6 连接，域名分片和雪碧图等土办法一起退休，服务器需要维护的每用户连接状态也陡降。
  derivation: original
  sources:
  - ref: rfc-9113
    locator: RFC 9113 Section 3-5（帧、流与多路复用、HPACK)
    claim: HTTP/2 用带流标识的二进制帧在单个连接上多路复用多个请求响应，并用 HPACK 压缩头部
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
