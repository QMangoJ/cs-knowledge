objectives:
- 逐层说清三次队头阻塞分别发生在哪一层、各被谁解决
- 解释 QUIC 选 UDP、内置加密与连接 ID 的动机
- 给出 HTTP/3 部署需要回退路径的理由
aiLink: gRPC、服务网格、移动端弱网、流式网关——协议选型直接写进尾延迟。这一课让你在看到「HTTP/2 偶尔比 1.1 慢」「App 切网络就断流」时，能立刻定位到传输层语义。
design:
- mechanism: QUIC 绕开内核 TCP 另起炉灶：在 [[UDP]] 之上于用户态重写可靠传输、拥塞控制、多流隔离与加密，把传输层变成可以跟着浏览器和服务端一起发布升级的代码库。
  problem: TCP 的实现写死在全球几十亿台设备的操作系统内核和沿途中间盒子里：只要你想改一点点协议规则，就会碰到海量不升级的老设备和直接丢弃生面孔包的防火墙，协议在工程上已经被冻僵了。
  choice: 既然改不动老房子，干脆借一块人人放行的空地重建——几乎所有网络都放行最小化的 UDP 数据报，于是把可靠交付、多流调度和加密全搬进用户态自建；并且顺手加密传输控制字段，不让中间盒子再伸手偷改。
  tradeoff: 用户态包处理开销普遍高于打磨了几十年的内核 TCP，吃更多 CPU；同时企业防火墙偶尔会限速或拦截大流量 UDP，线上必须永远保留一条回退到 HTTP/2 的退路。
  root: 根因叫协议僵化：协议能不能继续进化，不取决于标准文档写得多漂亮，而取决于全球已部署的中间件放不放行；当中间层变成事实审查官时，唯一出路就是把控制面加密并换一层地基。
- mechanism: 多路复用把几十条逻辑流塞进同一条连接：每块数据切片装帧并贴上流编号交错发送，对端按编号还原；同时设流级和连接级两层流控窗口防止互相饿死。
  problem: 老做法每条连接同一时刻只能跑一个请求，想并发就得连开 6 条甚至几十条连接，等于多付 6 倍握手延迟、6 次慢启动，还让连接数绑死并发数。
  choice: 用流编号把连接数和并发数拆开：1 条物理连接承载几十条并发流，握手和拥塞状态全连接共用一份，重复请求头还能借同连接上下文顺便压缩——这就是 HTTP/2 与 QUIC 共同的地基。
  tradeoff: 并发流共用一条连接就会带来邻居互相牵连的风险：跑在 TCP 上时丢一包全连坐；就算到了 QUIC 里隔离了交付顺序，总带宽与连接级流控总额度依然是共享的，某条流灌太猛仍会抢占别人。
  root: 分层系统的独立性必须每一层自己赢回来：应用层把请求拆成独立的流，只消灭了应用层的排队；只要下面传输层还是单根按序字节流，排队就会立刻在下一层借尸还魂。
quiz:
- q: HTTP/2 解决了什么、又留下了什么？
  options:
  - 全都解决了
  - 消除了应用层队头阻塞（多路复用），但 TCP 按序交付使丢包仍连坐所有流
  - 只解决了头部大小
  - 让 TCP 不丢包了
  answer: 1
  explain: HTTP/2 的多流共享一条有序字节流；单个丢包会阻塞整条流的交付。
- q: QUIC 为什么选 UDP 做地基？
  options:
  - UDP 更可靠
  - 能穿透只认 TCP/UDP 的中间设备，且实现可放在用户态快速演进
  - UDP 不丢包
  - 因为 TCP 被禁用了
  answer: 1
  explain: QUIC 需要在现有互联网上部署并快速迭代：UDP 提供最小通道，其余语义（可靠、拥塞、加密）自己在用户态实现。
- q: 连接迁移靠的是什么？
  options:
  - 更快的重连
  - 连接由协商的连接 ID 标识，与源地址解耦
  - 服务器记住用户密码
  - 双倍带宽
  answer: 1
  explain: 地址变化后凭同一连接 ID 继续通信，服务器验证新路径即可，不必重新建连。
steps:
- id: h1-problem
  title: 第一场仗：HTTP/1.1 的排队僵局，连开 6 条连接也治标不治本
  tldr: HTTP/1.1 在同一条连接上只能按顺序一问一答，排在前面的响应迟迟不回，后面的请求就得全部干等（应用层队头阻塞）；浏览器被迫每个域名硬开约 6 条连接凑并发，却白白多付了 6 份握手和慢启动成本。
  body: |-
    手机打开网页想同时拉 HTML、CSS、JS 和 20 张图片，在 HTTP/1.1 里却要面对一条死规矩：虽然连接建好后可以长连接复用（[[keep-alive]]），但同一时刻这条通道里只能跑一个请求，必须等上一个完整响应回来才能发下一个。万一排在最前面的接口响应慢了 500 毫秒，后面明明秒秒钟就能准备好的 CSS 和图片全被憋在队伍里，这就是第一场仗——应用层队头阻塞。

    那早期的「管线化」（pipelining）和浏览器的土办法怎么没救成场？管线化允许浏览器不等响应就一口气把请求 1、2、3 连着发出去，可协议偏偏规定服务器响应依然必须按 1、2、3 原顺序传回来，所以 1 号慢接口还是堵死 2 号和 3 号，加上中间代理经常解析错乱，管线化在实际工程里几乎全被关掉。于是浏览器只好退而采用每个域名开 6 条并行连接的硬办法，网站还得跟着搞域名分片、把小图标拼成一张雪碧图、把多个脚本合并打包。

    这些绕路办法治标不治本，反而添了新账：开 6 条连接等于把 TCP 三次握手和 TLS 加密握手重做 6 遍，还要经历 6 次独立慢启动慢慢爬坡；而把图标合并成大图又毁掉了精细缓存，改一个 2 KB 的按钮图标就得让用户重新下载整张大图。要想彻底治好这第一层排队，唯一出路是改造协议本身，让一条连接里真正能并发多个请求。
  derivation: original
  sources:
  - ref: rfc-9113
    locator: RFC 9113 Introduction（HTTP/1.1 的局限与设计目标）
    claim: HTTP/2 的设计目标之一是消除 HTTP/1.1 单连接串行请求造成的队头阻塞与连接数膨胀
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
