    - id: m-tcp
      from: n
      to: c
      label: 其余 stream 的数据先到，也得等丢失段补齐
      active: true
  log:
  - mode: 连坐
    event: 独立性在应用层做了，传输层又给合并了
- id: quic
  title: QUIC：把多流做进传输层
  tldr: 在 UDP 之上重写传输层：每条 stream 独立编号与交付，丢包只影响自己那条流。
  body: 'QUIC（RFC 9000）跑在 UDP 之上（为了能穿透只认 TCP/UDP 的中间设备、且能在用户态快速迭代），自己实现可靠传输、拥塞控制与 TLS 1.3 加密——加密是内置的、不是可选的。它原生的 stream 就是独立的：每条流的数据独立编号、独立确认与重传，一条流丢包不阻塞其他流向应用交付。


    注意丢包处理方式的差别：在 TCP 里丢失段之后的数据被「扣留」是协议语义；在 QUIC 里，每条流内部仍按序交付（流内语义不变），但流与流之间互不为质——图片流在重传它自己的缺口时，CSS 流的数据立刻就能交给应用。拥塞控制则仍在连接级统一做（丢包仍是全连接的拥塞信号），不要把「交付独立」误读成「资源独立」。为什么不直接改 TCP 来支持多流？因为 TCP 实现遍布全球内核与中间设备，任何语义改动都要等部署生态整体迁移——这正是 design 里讲的僵化问题，QUIC 选择在用户态重建一整层来绕开它。握手细节拆到下一步。'
  derivation: original
  sources:
  - ref: rfc-9000
    locator: RFC 9000 Section 1-3（设计目标、流、握手）
    claim: QUIC 在 UDP 上提供独立多路复用流与内置 TLS 1.3，合并握手并支持 0-RTT 恢复连接
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
