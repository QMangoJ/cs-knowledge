    event: 头部压缩省字节靠双方共享动态表，而共享状态必然带来同步顺序的约束
- id: tcp-hol
  title: 转折点：阻塞没有消失，而是下沉到了 TCP 传输层
  tldr: HTTP/2 在应用层把几十条流切开了，可脚下的 [[TCP]] 根本不知道什么叫多条流——它只认一根从头到尾必须按序交付的字节流，半路只要丢 1 个包，同一连接里所有无关的流全会被内核扣在缓冲区陪着等重传。
  body: |-
    在 HTTP/2 的世界里，HTML、CSS、图片和流式接口已经切成了互不相干的二进制帧；可把它们交到底层 [[TCP]] 时，TCP 眼里没有 stream 1、3、5 的概念，全部只是一整串按字节号单调排队的普通数据（比如第 1 到 10000 字节）。

    看一场典型的内核扣留现场：假设装着图片 stream 5 的第 4 号 TCP 包（第 3001–4000 字节）半路在路由器队列被丢掉了，紧跟在后面发出的第 5、6 号包（第 4001–6000 字节，里面恰恰装着完整的 stream 3 CSS 和流式回答的一个 token）其实安然无恙地先抵达了手机网卡。手机操作系统的 TCP 协议栈扫了一眼字节号：3001–4000 还空着一个洞，按照 TCP 必须「无空洞按序往上交」的铁律，哪怕 4001–6000 完好无缺，内核也一字节都不准交给浏览器！所有流只能一起躺在内核接收缓冲里干瞪眼，死等第 4 号包花 1 个 RTT 重传补齐。

    这种一人丢包、全员罚站在弱网下会闹出反直觉的结果：当网络丢包率爬到 2%–5% 时，开 6 条连接的 HTTP/1.1 丢 1 个包最多卡住 1/6 的资源，其余 5 条连接照常跑；而只靠 1 条 TCP 连接扛下一切的 HTTP/2 却会让 100% 的请求一起停摆，实测反而可能比 HTTP/1.1 更慢。应用层设计得再精细，也绕不过地基层的交付语义——要打完最后一仗，必须让传输层自己认得「多条独立的流」。
  derivation: original
  sources:
  - ref: rfc-9000
    locator: RFC 9000 Introduction（QUIC 的设计动机）
    claim: 基于单字节流的 TCP 会使多路复用的逻辑流因单个丢包互相阻塞，QUIC 以独立流解决
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端
    - lane: net
      id: n
      label: 网络（丢了 1 个包）
      highlight: true
    - lane: server
      id: s
      label: 服务器
    messages:
    - id: m-tcp
      from: n
      to: c
      label: 其余 stream 的数据先到，也得等丢失段补齐
      active: true
  log:
  - mode: 连坐
    event: 流的独立性在应用层做好了，却被 TCP 的单字节流交付在传输层又合并了回去
- id: quic
  title: 第三场仗收官：QUIC 搬进用户态 UDP，按流独立交付
  tldr: HTTP/3 换用的 QUIC（RFC 9000）直接架在 [[UDP]] 之上，在用户态自己实现可靠传输、拥塞控制与内置 [[TLS]] 1.3 加密；每条流独立编号、确认与重传，一条流丢包再也不会拖累别家。
  body: |-
    QUIC 把「多条独立流」写进了传输层骨子里：每一条流都在各自独立的偏移空间里编号、确认和补漏。再遇到刚才那个场景——图片 stream 5 掉了一个包，QUIC 接收端只把 stream 5 停下来等重传；同时或更晚到达的 CSS stream 3 与流式响应立刻越过缺口直接交给浏览器渲染和吐字（每条流内部依然严格按序交付，流与流之间互不为质）。注意分清边界：拥塞控制和总带宽依然全连接统一算（丢了包一样要降总速），独立的是交付顺序，不是带宽独立。

    很多人一定会追问：为什么不直接给内核里的 TCP 打补丁支持多流，非要跑去套一层 UDP 从零重写？答案叫协议僵化——TCP 的实现固化在全球几十亿台终端的操作系统内核里，更麻烦的是公网沿途无数路由器、NAT 网关和企业防火墙早就习惯了「看见不认识的 TCP 选项或改动就顺手扔包」。想等全世界所有中间盒子一起升级比登天还难；而全网几乎只放行 TCP 和 UDP 这两种老面孔，UDP 本身只是一层最轻的壳，QUIC 借壳穿过中间设备后，把所有逻辑放进跟随浏览器和服务端软件更新的用户态库里，几周就能发一版新特性。

    顺手还有个狠招：QUIC 把 [[TLS]] 1.3 加密焊死成了内置标配，连传输层的包号和确认帧头都加密。这不仅堵死了旁观者偷窥，更直接不给中间盒子看懂和篡改控制字段的机会，从制度上防止 QUIC 未来再走上 TCP 僵化的老路。
  derivation: original
  sources:
  - ref: rfc-9000
    locator: RFC 9000 Section 1-3（设计目标、流、握手）
    claim: QUIC 在 UDP 上提供独立多路复用流与内置 TLS 1.3，合并握手并支持 0-RTT 恢复连接
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端
    - lane: net
      id: n
      label: UDP 之上的 QUIC
      highlight: true
    - lane: server
      id: s
      label: 服务器
    messages:
    - id: m-q
      from: n
      to: c
      label: stream A 丢包重传中，stream B 照常交付
      active: true
  log:
  - mode: 根治
    event: QUIC 让每条流独立交付，队头阻塞在传输层这一层被消除
- id: quic-handshake
  title: 握手合并账：QUIC 把 TCP 加 TLS 两道门并成 1 轮甚至 0 轮
  tldr: 传统 HTTPS 得先走 1 轮 TCP 握手、再走 1–2 轮 TLS 加密握手，总共 2–3 个 RTT 才能发业务请求；QUIC 把传输建连和 TLS 1.3 密钥协商塞进同一轮往返，首次建连只需 1-RTT，恢复旧连接还能在第一包就带请求数据（[[0-RTT]]）。
  body: |-
    打开这个页面连一个新域名，算一算省了多少毫秒的跨洋等待（假设单次 RTT = 100 毫秒）：传统 HTTPS 跑在 TCP + TLS 1.3 上是串行叠两道门——第 1 个 RTT 跑完 TCP 三次握手把管道打通，第 2 个 RTT 再跑 TLS 1.3 的 [[ClientHello]] 和证书密钥交换（在早年的 TLS 1.2 甚至要再多 1 轮，一共 3 个 RTT = 300 毫秒）。等到第 200 毫秒之后，真正的 HTML 请求才算发出门。

    QUIC 干脆拆掉了中间这堵墙，把传输参数协商和 TLS 1.3 密钥材料缝进同一个数据包里同时送出去：客户端发第 1 包、服务器回 1 包确认加密参数和证书，前后只用 1 个 RTT（100 毫秒）就能开始发送应用数据。

    如果你几分钟前刚连过这个站、手里还留着服务端发下来的参数与会话票据，重新连接时还能压榨到极致——[[0-RTT]]：浏览器发出第一批握手包的同时，顺手把加密好的第一个 HTTP GET 请求塞在同一包里直发服务端！在跨洋 150 毫秒往返的场景里，这直接抢回整整 150 毫秒首屏时间。不过天下没有白拿的零等待：因为服务器还没机会发新随机数核验「这是不是当场新发的请求」，0-RTT 天生裸露在重放风险里，下一步看清它的使用红线。
  derivation: original
  sources:
  - ref: rfc-9000
    locator: RFC 9000 Section 3/握手与 RFC 8446 TLS 1.3 集成
    claim: QUIC 将传输参数交换与 TLS 1.3 握手结合，首次连接约一个往返即可发送应用数据
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端
      highlight: true
    - lane: net
      id: n
      label: 一轮往返
    - lane: server
      id: s
      label: 服务器
    messages:
    - id: m-qh
      from: c
      to: s
      label: 建连与密钥协商在同一轮完成
      active: true
  log:
  - mode: 握手
    event: QUIC 把分层串行叠加的握手合并成一轮，账从两个 RTT 变成一个
- id: zero-rtt
  title: 0-RTT 的安全底线：防不了重放，所以只许发幂等请求
  tldr: "[[0-RTT]] 虽然省下了一轮等待，但因为双方还没交换当次的新鲜随机数，攻击者把这段密文截下来原样重发一遍，服务器分不清它是迟到副本还是新请求——因此只许在 0-RTT 里发[[幂等]]请求。"
  body: |-
    很多人容易误会 0-RTT 是明文裸奔，其实不是：它照样用上一次握手缓存下来的密钥做了加密，路上有人偷看也解不开。它真正缺的不是保密性，而是抗重放保护和完整的前向安全——攻击者不需要破解任何密码，只要守在半路把你的 0-RTT 数据包原样录下来、隔几秒再发给服务器一份，因为第一包里还没有双方刚碰头确认的新鲜随机数，服务器单纯拿旧会话密钥去验密文，两份都能解通，根本分不出哪一份是真请求、哪一份是重放副本。

    普通的 1-RTT 握手一旦跑完，每次会话都会用全新的随机密钥锁定当次连接，旧密文重放过去当场验签失败被扔掉；0-RTT 缺的正是这道新鲜度锁。

    所以工程上划了一道死线：只把[[幂等]]操作放进 0-RTT，也就是同一件事执行一次跟执行十次结果完全一样（比如读取页面的 GET、拉取公共静态图）。凡是有副作用的操作——下单、扣款、提交表单、改密码——哪怕服务端自己在业务层叠了时间窗或防重放令牌，应用层死守不走 0-RTT 也是第一道防线，否则等于免费送给攻击者一张可以反复重放扣款的复制券。
  derivation: original
  sources:
  - ref: rfc-8446
    locator: §2.3/§8 TLS 1.3 的 0-RTT 与重放考虑
    claim: 0-RTT 数据缺乏抗重放保护，协议要求应用仅将其用于可容忍重放的幂等操作
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端（只发幂等请求）
      highlight: true
    - lane: net
      id: n
      label: 网络（可复制数据包）
    - lane: server
      id: s
      label: 服务器（分不清副本与新请求）
    messages:
    - id: m-0rtt
      from: n
      to: s
      label: 被重放的 0-RTT 数据又来了一份
      active: true
  log:
  - mode: 边界
    event: 0-RTT 省下一个 RTT，代价是抗重放的把关要由应用逐接口来做
- id: flow-control
  title: 两级流量控制：流级窗口防单流堵死，连接级窗口护住总内存
  tldr: 几十条流挤在同一条连接上，既怕某一条流把接收方总内存吃爆，也怕它抢光公共额度饿死别家；HTTP/2 和 QUIC 都设了两层接收窗口——单条流自己的窗口加整条连接的总窗口，任一层耗尽都必须停发。
  body: |-
    光有上一课讲过的 TCP 单层接收窗口已经不够用了。假设浏览器同时在拉取大图 stream 5 和流式吐字接口 stream 7：如果 stream 5 的磁盘写入慢了，数据积压在接收端没人读走，要是全连接只有一份公共窗口，这条慢流很快就会把公共额度吃干抹净，连累完全健康的 stream 7 也一帧都发不出来；反过来如果只管单流不管总量，页面一次开 100 条流每条囤 64 KB，接收方瞬间被吃光 6.4 MB 内存照样崩。因此必须立起两道闸：流级窗口保单条流不溢出、不拖累别人，连接级窗口把所有流还没消化的总数据量封顶。

    拿 HTTP/2 默认数字走一遍实际账：连接刚建好时，每条新流的初始窗口通常是 65535 字节（约 64 KB）。如果客户端往大图流发满 64 KB 还没等来服务端应用读走消费，这条流的发送额度就跌到 0 必须停发；等对端应用消费掉一部分数据后，接收方会发回一帧 WINDOW_UPDATE 把对应字节数补回额度（QUIC 里对应的是管单流的 MAX_STREAM_DATA 与管整连接的 MAX_DATA 帧，分工一模一样）。

    线上排障最常踩这个坑：流式接口吐字吐到一半突然卡死不动，表面上看跟断网一模一样，其实物理链路好端端的，多半是接收方应用读不动、没人补发 WINDOW_UPDATE 把窗口续上；而在高带宽长延迟的跨洋专线上跑 gRPC 或 HTTP/2 时，如果不调大默认 64 KB 的初始流控窗口，吞吐同样会被上一课算过的 [[BDP]] 死死卡在低谷。
  derivation: original
  sources:
  - ref: rfc-9113
    locator: RFC 9113 Section 5.2 Flow Control（连接级与流级窗口）
    claim: HTTP/2 流控同时作用于单个流与整个连接，初始窗口为 65535 字节量级，靠 WINDOW_UPDATE 补充
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 发送方（两层额度都够才发）
    - lane: net
      id: n
      label: 帧/包
    - lane: server
      id: s
      label: 接收方（逐层补窗口）
      highlight: true
    messages:
    - id: m-fc
      from: s
      to: c
      label: WINDOW_UPDATE 补回已消费额度
      active: true
  log:
  - mode: 流控
    event: 流控分两层：流级窗口保护单条流，连接级窗口保护接收方的总内存
- id: migration
  title: 连接迁移：用连接 ID 取代四元组，Wi-Fi 切 5G 不断线
  tldr: TCP 靠（源 IP、源端口、目的 IP、目的端口）这组[[四元组]]认连接，手机从 Wi-Fi 切到 [[5G]]、源 IP 一变连接立刻死亡；QUIC 改用双方协商出来的[[连接 ID]]当身份证，换了网照样不掉线接着传。
  body: |-
    刷着网页走出家门，手机从家里 Wi-Fi 切到运营商 [[5G]]，网卡瞬间换上了一组全新 IP 地址。在老的 TCP 世界里，连接身份死死焊在[[四元组]]上——服务端只认原 IP 加原端口，包一换新地址过来，服务器压根不知道它是谁、直接当陌生包丢掉，于是原本开着的网页长连接、视频通话或流式接口全部断线，只能老老实实重走握手再从头拉。

    QUIC 把连接身份从网络地址上彻底拆了出来：建连时双方先协商好一个专属的[[连接 ID]]，并写在每个数据包明文头部。手机切到 5G 以后，外层 IP 虽然变了，但只要数据包里还举着同一个连接 ID，服务端就认得出还是这位老朋友——刚才拉了一半的图片流、聊了一半的流式回答编号与进度原封不动续上，应用层甚至感觉不到刚刚换过网。

    等一下，难道谁随便抄个连接 ID、伪造一个源 IP 就能把别人的流量劫走？当然不行！服务端发现包从新地址冒出来后，并不会直接把大流量切过去，而是先往这个新地址发一个轻量的路径验证挑战包，等收到真端点回传正确响应、确认这个新 IP 确实归对方所有之后，才把流量正式迁移过去，同时在新路径上重新探测一遍带宽和延迟。
  derivation: original
  sources:
  - ref: rfc-9000
    locator: RFC 9000 Section 5/9（连接 ID 与连接迁移）
    claim: QUIC 以连接 ID 标识连接，允许端点地址变化后保持连接（连接迁移）
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 手机（Wi-Fi → 5G)
      highlight: true
    - lane: net
      id: n
      label: 网络
    - lane: server
      id: s
      label: 服务器
    messages:
    - id: m-mg
      from: c
      to: s
      label: 地址变了，连接 ID 没变：继续传
      active: true
  log:
  - mode: 迁移
    event: 连接迁移的本质是：连接的身份从四元组变成了双方协商出的连接 ID
- id: discovery
  title: 部署第一道坎：浏览器怎么第一次就知道服务器支持 HTTP/3
  tldr: 因为不少网络会拦 UDP，浏览器首次访问陌生域名不敢一上来就盲发 QUIC；通常先走稳妥的 HTTP/2，服务器在响应头里附带 [[Alt-Svc]] 声明自己开着 HTTP/3，浏览器下次才会试着升级。
  body: |-
    很多工程师刚在服务器上配好 HTTP/3，兴冲冲用浏览器抓包测试，却纳闷怎么第一次打开首页依然走的 TCP HTTP/2？这就是先保守探路、再按通知升级的引导机制：初次打开网页走的是可靠的 HTTP/2，服务器在回来的响应头里加上一行 Alt-Svc: h3=":443"，相当于给浏览器递张纸条说「我在这个域名的 UDP 443 端口也开着 HTTP/3 哦」。

    浏览器把纸条记进本地缓存，下次再访问（甚至当前页后续拉图片时）就会尝试往 UDP 443 发 QUIC 试探（有的部署还会借 DNS 的 HTTPS 记录提前告知，省掉首次摸索，或者干脆同时发起竞速建连）。一旦通了就切去走 HTTP/3；万一用户当时刚好连在封死 UDP 443 的公司内网里，超时没回音就立刻退回 HTTP/2，并在一段冷却时间内老实走 TCP。

    看清这条发现机制，能解释两个常见误判：一是为什么新域名上线 HTTP/3 后，监控大盘里 HTTP/3 占比往往要爬坡好几个小时甚至一两天才稳定；二是抓包全看到 HTTP/2 未必是你服务器配错了——排查时必须把「响应头里有没有吐出 [[Alt-Svc]]」和「用户网络允许 UDP 连通的成功率」分开统计，前者查你的配置，后者反映用户那边的网络现实。
  derivation: original
  sources:
  - ref: rfc-9110
    locator: §10.2/Alt-Svc 相关（替代服务宣告的语义来源）
    claim: 服务器可通过响应头宣告同一资源在其他协议与端点上的替代服务，客户端据此升级协议
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 浏览器（先旧协议，后升级）
      highlight: true
    - lane: net
      id: n
      label: 网络
    - lane: server
      id: s
      label: 服务器（响应带 Alt-Svc）
    messages:
    - id: m-alt
      from: s
      to: c
      label: Alt-Svc 声明本域提供 HTTP/3
      active: true
  log:
  - mode: 发现
    event: 客户端靠服务端的 Alt-Svc 宣告学到 HTTP/3，协议升级不靠猜
- id: costs
  title: 代价与边界：QUIC 这么强，为什么 TCP 还没退休
  tldr: QUIC 在用户态换来了多流独立交付与快速迭代，但也付出 CPU 消耗更高、部分网络限速拦截 UDP、传统抓包排障失效三笔账——所以公网弱网大力切 HTTP/3，高吞吐低丢包的机房内网依然稳守 TCP 和 HTTP/2。
  body: |-
    先算第一笔账——[[CPU]] 开销。操作系统内核里的 TCP 经过几十年打磨，早就有网卡分段卸载、校验和硬件计算和零拷贝等一整套加速手段，跑满百兆千兆非常省电；而 QUIC 跑在用户态，每收发一包都要走一遍用户态协议栈状态机和加解密，高并发高吞吐场景下吃掉的 CPU 明显更高，老机型和满载网关上这笔算力账不可忽略。

    第二笔账是公网对 UDP 的态度。许多企业防火墙、校园网甚至部分运营商为了防 UDP 泛洪攻击，对大流量 UDP 长期采取严格限速甚至一刀切封禁；这就决定 HTTP/3 绝不能单腿走路，线上架构必须永久挂着 HTTP/2 的自动回退路径。第三笔账则容易被忽视：过去网络卡了，运维敲一条 tcpdump 抓明文序号和 ACK 就能看清哪一跳在重传；QUIC 连包号和确认帧都加密了，抓包工具只能看到一坨加密 UDP 载荷，可观测性必须全部重建到两端应用打点（如 qlog 跟踪日志）上。

    正因为这三笔账，现实世界的协议格局并不是谁把谁彻底消灭：面向公网弱网、手机端频繁切网的浏览器与大型 CDN 积极推 HTTP/3；而同机房微服务内网路径可控、丢包率接近零、永远不用切网络，TCP 丢包连坐的痛点几乎碰不到，继续跑高效率内核 TCP 配 HTTP/2 反而最省事划算。
  derivation: original
  sources:
  - ref: rfc-9000
    locator: RFC 9000 Introduction（部署考虑）
    claim: QUIC 基于 UDP 部署，可穿透中间设备并在用户态迭代，但需考虑中间设备对 UDP 的处理差异
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
