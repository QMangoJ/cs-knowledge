    event: 一条连接 = 一条单车道
- id: h2-multiplex
  title: HTTP/2：分帧与多路复用
  tldr: 把报文切成带 stream 编号的帧，在一条 TCP 连接上交错发送——多条车道合流一条路。
  body: 'HTTP/2（其前身是 Google 的 SPDY）把协议改成二进制分帧：请求/响应被拆成 HEADERS、DATA 等帧，每帧头部带 stream id。多个 stream 的帧可以在一条连接上交错发送，到对端按 id 重新组装——这就是多路复用（multiplexing）。加上 HPACK 头部压缩（头字段大量重复，压完省很多字节），一条连接就能并发几十个请求，六连接与域名分片的 workaround 随之退休。


    用帧的眼光走一眼：浏览器同时要 HTML、CSS 与一张图，三条 stream 的帧在同一连接上轮流上路——CSS 的帧不必等图的 DATA 帧发完，图很大时它的帧会被切片，与其他 stream 的帧交错。接收方凭 stream id 把帧分拣回三条逻辑流，各自组装。两个推论随之成立：其一，连接数与并发数解耦后，服务端维护的连接状态从「每用户数条」回到「每用户一条」；其二，拥塞控制只需在一条连接上做一遍，带宽分配不再被「谁开的连接多谁占得多」扭曲。语义层没变：方法、状态码、头字段与 HTTP/1.1 一一对应，所以升级 HTTP/2 不需要改业务代码。'
  derivation: original
  sources:
  - ref: rfc-9113
    locator: RFC 9113 Section 3-5（帧、流与多路复用、HPACK)
    claim: HTTP/2 用带流标识的二进制帧在单个连接上多路复用多个请求响应，并用 HPACK 压缩头部
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
