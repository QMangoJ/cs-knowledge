    event: 省字节靠共享状态，共享状态带来同步约束
- id: tcp-hol
  title: 没想到：阻塞下沉到了 TCP 层
  tldr: TCP 只认一条字节流、必须按序交付应用：丢一个包，所有 stream 的已到达数据都被压在内核里等重传。
  body: '多路复用把许多逻辑流塞进了一条 TCP 字节流，而 TCP 的交付语义是整条流严格有序。传输中丢一个包，接收方 TCP 会把后续已到达的数据扣在接收缓冲里，必须等丢失段重传到齐、字节流连续了，才一起交给应用——哪怕那些数据属于毫不相干的 stream。


    用一个场景把连坐看实：一页里图片 stream 的某个 TCP 段丢了，而 CSS 与 JS 的数据其实已经完整到达内核；但因为它们在字节流里排在丢失段之后，浏览器一字节也拿不到，渲染只能干等一个重传往返。丢包率越高、并发流越多，这种「连坐」越严重：在高丢包网络上，HTTP/2 甚至可能比开多条连接的 HTTP/1.1 更慢，因为多条连接时丢包只堵住其中一条，其余连接继续交付。要根治，必须让传输层本身认识「多条独立的流」，交付粒度从整条连接细化到每条流——应用层做得再对，也绕不过地基的交付语义，这就是分层独立性必须层层赢得的含义。'
  derivation: original
  sources:
  - ref: rfc-9000
    locator: RFC 9000 Introduction（QUIC 的设计动机）
    claim: 基于单字节流的 TCP 会使多路复用的逻辑流因单个丢包互相阻塞，QUIC 以独立流解决
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端
    - lane: net
      id: n
      label: 网络（丢了 1 个包）
      highlight: true
    - lane: server
      id: s
      label: 服务器
