title: HTTP/2 与 QUIC：队头阻塞的三次战争
summary: 队头阻塞其实打了三场仗：HTTP/1.1 在应用层按顺序一问一答，前一个响应不回来、后面请求全得排队；[[HTTP/2]] 用二进制分帧和 [[stream]] 多路复用解开了应用层排队，却撞上 [[TCP]] 只认一条有序字节流的铁律——半路只要丢一个包，整条连接上所有流全得在内核缓冲里一起等重传；于是 HTTP/3 换用的 QUIC 干脆搬进 [[UDP]]，在用户态按流独立交付与重传，终于彻底打完这场仗。沿路还会顺带算清三笔连带账：头部压缩表在乱序下怎么防连坐（[[HPACK]] 到 [[QPACK]]）、QUIC 怎样把两轮握手并成 1 轮甚至 [[0-RTT]]，以及改用[[连接 ID]] 后手机切换网络为什么不断线。
premise: 你在手机上打开一个现代网页：浏览器需要同时拉回 HTML、CSS、JS 和 20 张图片，页面里还挂着一条实时吐字的流式接口；偏偏你边走边刷，路上偶发 1 次丢包，走出家门时手机又从 Wi-Fi 切到了 [[5G]]。这一路上，最怕「前面一个小东西卡住，后面几十个任务跟着全冻住」——这节课就跟着这一整套网页并发请求，看 HTTP 三代协议怎样一步步拆掉这种连坐式的队头阻塞。
position: 本课属于网络科第五个板块「传输层的演进」，接在上一课「发送的节奏」讲完的 TCP 拥塞控制之后回头审视地基：就算把发送窗口调到最准，TCP 规定整条连接只能按一根严格有序的字节流交付，这条底线本身照样会卡死现代并发网页。这一课把从 HTTP/1.1、HTTP/2 到基于 UDP 的 QUIC（HTTP/3）三代演进串成一条线，讲透每一代解开了哪层阻塞、又露出了哪层新瓶颈；下一课「接口的合同：RPC 与序列化」就会接着看 gRPC 怎样直接借用 HTTP/2 的多路复用当服务间通信底座。
bridge:
  prev: 上一课我们花了一整节把单条 TCP 连接的发送速率调得贴合管道容量；可哪怕窗口算得天衣无缝，TCP 还有个改不掉的脾气——前面一个字节没补齐，后面已经到达的所有字节死活不往上交给应用。这一课拿并发拉网页资源和流式接口做试验，看看这一条老脾气怎样逼出了 HTTP/2 到 QUIC 的两轮大改。
  next: HTTP/2 切出来的二进制帧和并发流，本来是为了治好网页加载排队，结果服务端工程师顺手拿去当成了服务间高性能调用的地基。下一课看 gRPC 怎样把接口写成合同、把对象压成紧凑二进制，再塞进 HTTP/2 的多路复用通道里一口气跑完。
overview:
- key: 一句话总结
  value: 三代协议逐层打掉队头阻塞：1.1 卡在请求排队，2 解开应用层却被 TCP 丢包连坐，3 靠 QUIC 在 UDP 上按流独立交付才算根除
- key: HTTP/2
  value: 用二进制分帧、单连接多路复用（[[stream]]）与 [[HPACK]] 头压缩，让几十个请求在同一条连接上切片交错收发，不再排队等上一条响应
- key: TCP 层队头阻塞
  value: TCP 只认一根按序字节流：半路丢 1 个包，后续已到达的其他 stream 帧全被内核扣住一起等重传
- key: QUIC
  value: 基于 [[UDP]] 在用户态重写传输层，每条 stream 独立确认与重传；内置 [[TLS]] 1.3，首次建连 1-[[RTT]]、恢复连接 [[0-RTT]]
- key: 连接迁移
  value: 用双方协商的[[连接 ID]]取代 IP+端口[[四元组]]当身份证，手机从 Wi-Fi 切 [[5G]] 不用重新建连
- key: 代价
  value: 部分网络限速或拦截 UDP、用户态加解密与状态机更吃 [[CPU]]、抓包排障生态不如传统 TCP 成熟
