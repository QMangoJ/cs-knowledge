- id: hpack-qpack
  title: 头部压缩的连坐问题：HPACK 与 QPACK 对比
  tldr: HPACK 靠双方同步的动态表省字节，但表的状态必须严格有序更新；QPACK 为 QUIC 的乱序交付改了同步方式。
  body: '头部压缩为什么能压：同一站点反复请求时，method、path 前缀、cookie、user-agent 等头字段高度重复。HPACK 的机制是静态表（常见头字段的预置编号）加动态表（双方在连接中同步维护、用过的自定义头字段登记入表之后只发编号），再加一层 Huffman 编码。一串几百字节的 cookie 在后续请求里可能只剩一两个字节的索引——代价是双方的动态表必须严丝合缝地同步：解码方要按编码顺序逐个处理 HEADERS 块，漏掉一个，后面全错位。


    这在 TCP 上不成问题（字节流天然有序），搬到 QUIC 就成了新连坐：QPACK（HTTP/3 的头部压缩）面对的是可乱序到达的流，若沿用 HPACK 的严格同步，一条流的头块可能要等另一条流上的表更新到达才能解码，队头阻塞会在压缩层借尸还魂。QPACK 的改法是给编码器指令与确认开专门的单向流：编码方可以通过指令提前把表项建好，头块里可以声明「我引用的表状态我等得起或等不起」——允许引用尚未确认表项的头块先行交付的模式叫阻塞流，条数由双方参数控制。对比结论：HPACK 用简单与强同步换压缩率，在有序地基上最优；QPACK 牺牲一点实现复杂度与压缩率上限，换掉乱序地基上的解码阻塞。'
  derivation: original
  sources:
  - ref: rfc-9113
    locator: RFC 9113 Section 4.3/HPACK 引用（头部压缩与动态表）
    claim: HTTP/2 用 HPACK 以静态表、动态表与 Huffman 编码压缩头部，依赖连接内有序处理
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 编码方
      highlight: true
    - lane: net
      id: n
      label: 动态表同步通道
    - lane: server
      id: s
      label: 解码方
    messages:
    - id: m-hp
