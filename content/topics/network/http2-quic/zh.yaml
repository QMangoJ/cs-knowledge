  log:
  - mode: 根治
    event: 队头阻塞在传输层被消除
- id: quic-handshake
  title: 握手合并账：TCP 加 TLS 与 QUIC 的往返对比
  tldr: 串行叠账是 1 加 1，QUIC 把传输握手与 TLS 1.3 握手并成一轮，恢复连接再省到 0。
  body: '把建连往返一笔记清。传统 HTTPS 是串行叠加：TCP 三次握手 1 个 RTT 建好管道，之后 TLS 1.3 再用 1 个 RTT 协商密钥与验明身份（TLS 1.2 时代是 2 个，总账 3 个），合计 2 个 RTT 才能发出第一个请求字节——两个协议分层各自握手，成本只能相加。QUIC 的做法是把两层握手缝成一轮：它没有独立的传输三次握手，建连消息里直接搭载 TLS 1.3 的握手材料，首次连接通常 1 个 RTT 就能开始发应用数据。


    恢复连接（之前连过、缓存了服务端参数与票据）时更进一步，可以在第一个包里就直接带上应用数据，即 0-RTT：省掉的这一轮，在跨洋 150 毫秒往返的链路上就是 150 毫秒的真金白银，对短请求占多数的 API 调用尤其显眼。但天下没有白省的 RTT：0-RTT 数据是在密钥协商完全确认之前发出的，它的保密性弱于 1-RTT 之后的数据，且天然暴露在重放攻击之下——具体边界看下一步。对比着记：1-RTT 全握手买的是完整的前向安全与抗重放语境，0-RTT 是拿一部分安全保证换一轮延迟，是否启用要由应用逐接口决策。'
  derivation: original
  sources:
  - ref: rfc-9000
    locator: RFC 9000 Section 3/握手与 RFC 8446 TLS 1.3 集成
    claim: QUIC 将传输参数交换与 TLS 1.3 握手结合，首次连接约一个往返即可发送应用数据
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端
      highlight: true
    - lane: net
      id: n
      label: 一轮往返
    - lane: server
      id: s
      label: 服务器
    messages:
    - id: m-qh
      from: c
      to: s
      label: 建连与密钥协商在同一轮完成
      active: true
  log:
  - mode: 握手
    event: 分层叠加变合并，账从两个 RTT 变一个
- id: zero-rtt
  title: 0-RTT 的重放风险边界：什么能放、什么不能放
  tldr: 0-RTT 数据可被截获复制、稍后再重放一遍；服务端分不清真假，所以只许放幂等请求。
  body: '重放风险的机理要说透：攻击者不需要破解任何加密，只要把客户端发出的 0-RTT 数据包原样抄下来，隔一会儿再发给服务器一份，服务器在密钥语境上无法区分这是原包的迟到副本还是新请求——因为 0-RTT 阶段本就没有双方共同确认的新鲜随机量来锚定「这确实是刚发生的第一次」。普通 1-RTT 之后的数据有握手新鲜度兜底，重放的密文对不上会话密钥，会被直接拒绝；0-RTT 缺的正是这层兜底，所以风险边界完全不同。


    因此使用规则是硬约束而非建议：只把幂等请求放进 0-RTT——即同一请求执行一次与执行两次效果相同的那些，例如读取数据的 GET。任何有副作用、不可重复执行的操作都不许进 0-RTT：下单、付款、扣库存、发消息、改状态，放进去就等于给攻击者发了一张免费的重复执行券。服务端还可以再叠一层自有防线（比如对 0-RTT 请求做更严的校验或直接拒绝敏感路径），但应用层先守住「只放幂等」这条线是前提。误解澄清：0-RTT 不是「不加密」——数据仍被密钥加密，缺的是抗重放与完整的前向安全，不要把风险说错位置。'
  derivation: original
  sources:
  - ref: rfc-8446
    locator: §2.3/§8 TLS 1.3 的 0-RTT 与重放考虑
    claim: 0-RTT 数据缺乏抗重放保护，协议要求应用仅将其用于可容忍重放的幂等操作
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端（只发幂等请求）
      highlight: true
    - lane: net
      id: n
      label: 网络（可复制数据包）
    - lane: server
      id: s
      label: 服务器（分不清副本与新请求）
    messages:
    - id: m-0rtt
      from: n
      to: s
      label: 被重放的 0-RTT 数据又来了一份
      active: true
  log:
  - mode: 边界
    event: 省一个 RTT 的价格由应用逐接口把关
- id: flow-control
  title: 流控细节：连接级与流级两层窗口
  tldr: 每条流有自己的接收窗口，连接还有总量窗口；任一层耗尽都会卡住，调参要分层看。
  body: '多路复用引入了一个新问题：一条流若无限制地灌数据，会把接收方的内存吃光并饿死其他流。解法是两级流控，HTTP/2 与 QUIC 结构相同、各有命名。流级：每条 stream 有自己的接收窗口，接收方按「我这条流还接得下多少」逐流放行，处理慢的流只堵自己。连接级：整条连接再设一个总窗口，把所有流的未处理数据之和封顶，保护接收方的总内存。下层类比正是拥塞课的 rwnd 思想，只是从一条连接细化成了两级账本。


    机制走例（以 HTTP/2 为准，数值是协议默认值）：连接开始时每条流的初始窗口是 65535 字节量级，接收方消费掉数据后发 WINDOW_UPDATE 把额度补回去；若应用读得慢、迟迟不补，发送方在该流窗口归零时就必须停发这条流（连接级窗口同理决定全连接的发送上限）。QUIC 对应概念是流级的 MAX_STREAM_DATA 与连接级的 MAX_DATA，语义同构。排障推论：流式接口「传到一半不动了」除了网络问题，还可能是流控窗口没人续——接收方应用卡死与网络断开的外在表现完全一样，要按流级、连接级逐层查窗口余量，不要只盯着链路。网关调优里调大初始窗口，就是为高带宽时延积连接准备的：窗口太小，多路复用出的几十条流要平分一份不够 BDP 的额度，单流吞吐被齐齐压低。'
  derivation: original
  sources:
  - ref: rfc-9113
    locator: RFC 9113 Section 5.2 Flow Control（连接级与流级窗口）
    claim: HTTP/2 流控同时作用于单个流与整个连接，初始窗口为 65535 字节量级，靠 WINDOW_UPDATE 补充
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 发送方（两层额度都够才发）
    - lane: net
      id: n
      label: 帧/包
    - lane: server
      id: s
      label: 接收方（逐层补窗口）
      highlight: true
    messages:
    - id: m-fc
      from: s
      to: c
      label: WINDOW_UPDATE 补回已消费额度
      active: true
  log:
  - mode: 流控
    event: 流级护单流，连接级护总量
- id: migration
  title: 连接迁移：换网络不断线
  tldr: TCP 连接由四元组（源/目的 IP+端口）定义，IP 一变连接即死；QUIC 用连接 ID 标识，换个网络继续用。
  body: '手机从 Wi-Fi 走到室外切到蜂窝网络，IP 地址变化：对 TCP 来说四元组变了，连接必须重建，长连接业务（通话、游戏、流式）全部重连。


    QUIC 连接由双方协商的连接 ID（Connection ID）标识，与底层地址解耦：客户端换地址后，用同一个连接 ID 在新路径上继续，服务器验证新路径后无缝迁移。把验证这一步补上：服务器不能见 ID 就认——它会向新地址发挑战、确认回包确实来自声称的那个端点之后，才把后续流量切过去，防止有人伪造地址把流量劫持到别处。迁移中拥塞与流控状态大致保留（换了路径后拥塞估计会重新探测，因为新路径的带宽时延可能完全不同），应用层则毫无感知：没有重连、没有重新握手、流的编号与已传进度全部延续。这解决的是移动时代最日常的一个痛点，也是「传输协议为什么要重写」最有说服力的例子之一——TCP 的四元组即身份这件事刻在内核与中间设备的共同假设里，同样属于改不动、只能换地基的那一类。'
  derivation: original
  sources:
  - ref: rfc-9000
    locator: RFC 9000 Section 5/9（连接 ID 与连接迁移）
    claim: QUIC 以连接 ID 标识连接，允许端点地址变化后保持连接（连接迁移）
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 手机（Wi-Fi → 5G)
      highlight: true
    - lane: net
      id: n
      label: 网络
    - lane: server
      id: s
      label: 服务器
    messages:
    - id: m-mg
      from: c
      to: s
      label: 地址变了，连接 ID 没变：继续传
      active: true
  log:
  - mode: 迁移
    event: 连接的身份从四元组变成协商出的 ID
- id: discovery
  title: 部署第一步：客户端怎么知道对面支持 HTTP/3
  tldr: 先用 HTTP/2 连上、靠 Alt-Svc 头得知有 HTTP/3，下次访问才升级——所以第一访永远走旧路。
  body: '一个部署细节常被漏掉：浏览器第一次打开一个站点时，并不知道它支持 HTTP/3。主流发现路径是引导式的：首次仍走 TCP 上的 HTTP/2 或 1.1，服务端在响应里带一个 Alt-Svc 头声明「本域名在某 UDP 端口上提供 HTTP/3」，浏览器记下后，后续访问才直接改用 QUIC 试探；成功则长期用它，失败（比如 UDP 被当前网络拦截）就退回 TCP 路线并在一段时间内不再尝试。


    这条路径解释了两个日常现象：为什么监控里新站点的 HTTP/3 占比要爬坡几天才稳定（用户群的第一访都还在旧协议上），以及为什么「我明明开了 HTTP/3、抓包却全是 HTTP/2」未必是配置错了——可能只是客户端还没学到、或它所在的网络把 UDP 挡住了在回退期。排障时要分开看两个指标：宣告是否正确下发，与客户端尝试 QUIC 的成功率；前者是你的配置，后者是用户网络环境的现实分布，两者混在一起看永远说不清。'
  derivation: original
  sources:
  - ref: rfc-9110
    locator: §10.2/Alt-Svc 相关（替代服务宣告的语义来源）
    claim: 服务器可通过响应头宣告同一资源在其他协议与端点上的替代服务，客户端据此升级协议
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 浏览器（先旧协议，后升级）
      highlight: true
    - lane: net
      id: n
      label: 网络
    - lane: server
      id: s
      label: 服务器（响应带 Alt-Svc）
    messages:
    - id: m-alt
      from: s
      to: c
      label: Alt-Svc 声明本域提供 HTTP/3
      active: true
  log:
  - mode: 发现
    event: 协议升级靠宣告学习，不靠猜
- id: costs
  title: 代价与边界：为什么 TCP 还没退休
  tldr: QUIC 在用户态跑、吃 CPU 更多；UDP 在某些网络被限速或拦截；可观测性生态也要重建。
  body: 'QUIC 的账也要算：实现在用户态（为了可迭代），包处理开销通常高于内核 TCP，老设备/高吞吐场景 CPU 成本明显；部分企业网络与运营商对 UDP 有限速或拦截策略，HTTP/3 需要保留回退到 HTTP/2 的路径；tcpdump 时代的排障直觉（看段、看重传）在加密的 QUIC 面前要换工具。


    再补一条常被宣传漏掉的账：加密内建意味着网络侧的传统运维手段（靠抓包看传输状态、靠中间设备做故障定位）大面积失效，可观测性要改到端点埋点这一侧重建，团队的学习成本是真金白银。所以现实格局是分工：浏览器与大厂服务在公网上积极上 HTTP/3，内网与长尾服务继续 HTTP/2/1.1 与 gRPC(HTTP/2）跑很久——内网环境可控、丢包低，TCP 层连坐的痛感本来就弱，为迁移支付全套成本不划算。协议选型没有银弹：先量化自己场景的丢包率分布与建连占比，再决定战场在哪。'
  derivation: original
  sources:
  - ref: rfc-9000
    locator: RFC 9000 Introduction（部署考虑）
    claim: QUIC 基于 UDP 部署，可穿透中间设备并在用户态迭代，但需考虑中间设备对 UDP 的处理差异
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端
    - lane: net
      id: n
      label: 网络（个别会拦 UDP)
    - lane: server
      id: s
      label: 服务器
      highlight: true
    messages:
    - id: m-cost
      from: s
      to: c
      label: HTTP/3 不通时自动回退 HTTP/2
      active: true
  log:
  - mode: 共存
    event: 新协议上线必须带回退路径
- id: ai-link
  title: 与 AI 工程的连接
  tldr: gRPC 跑在 HTTP/2 上，推理网关的长流式连接最能体会多路复用与队头阻塞的区别。
  body: '服务间调用的主力 gRPC 就是 HTTP/2 的亲生子：多路复用、双向流、头部压缩都是它性能的一部分；理解帧与流，才能看懂 gRPC 的流控窗口调参问题。


    对 LLM 场景：流式响应（SSE over HTTP/1.1 或 2）与大量并发短请求的网关，选 1.1 还是 2 直接决定连接数与尾延迟；而移动端 App 的弱网体验（高丢包 + 网络切换）正是 QUIC 的主场。落到选型清单上收尾：服务间 RPC 默认 HTTP/2 起步、把流控窗口按 BDP 调够；浏览器与 App 面向公网且丢包敏感的接口评估 HTTP/3，但必须实测自家用户网络的 UDP 成功率；长流式响应无论哪代协议，都要单独验证中间环节的缓冲与超时配置，别让上一课的代理缓冲坑在新协议上重演。协议层每消灭一次队头阻塞，应用层就少一类「莫名其妙的卡顿」——但消灭到哪一层为止，取决于你场景里阻塞的真实分布，不取决于协议的新旧。'
  derivation: original
  sources:
  - ref: rfc-9113
    locator: RFC 9113（gRPC 等应用协议的传输基础）
    claim: HTTP/2 的流与多路复用是 gRPC 等 RPC 框架的传输基础
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 网关
    - lane: net
      id: n
      label: 网络
    - lane: server
      id: s
      label: 推理服务
      highlight: true
    messages:
    - id: m-ai2
      from: c
      to: s
      label: gRPC 双向流 = HTTP/2 stream
      active: true
  log:
  - mode: 应用
    event: 框架的性能上限由传输层语义决定
