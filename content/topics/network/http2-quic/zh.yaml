id: network/http2-quic
subject: network
slug: http2-quic
order: 5
status: published
license: CC-BY-4.0
title: HTTP/2 与 QUIC：队头阻塞的三次战争
summary: HTTP/1.1 有队头阻塞，HTTP/2 在应用层消除了它，却卡在 TCP 层；QUIC 把传输层整个换掉，才算打完这场仗。
premise: 以一个要并发拉几十个资源的网页与一次流式 API 调用为例。
position: >-
  本课属于「传输层的演进」板块，站在上一课拥塞控制所依赖的那条 TCP 有序字节流之上回头审视它：窗口调得再好，也改变不了丢一包就得按序扣住后续字节的交付语义。学完你能逐层定位三次队头阻塞各发生在哪一层，也能讲清 QUIC 为何改用连接 ID 换网不断线、0-RTT 又为何只敢承载幂等请求。
bridge:
  prev: >-
    上一课讲 AIMD 如何让窗口在丢包信号间锯齿涨落，本课正从一次丢包出发追问连带伤害：为何 HTTP/2 的多条流会被 TCP 的按序交付一起拖住。
overview:
- key: 一句话总结
  value: 每一代都在消灭一层队头阻塞：1.1 的请求排队、2 的 TCP 丢包连坐、3 用 QUIC 独立流根除
- key: HTTP/2
  value: 二进制分帧 + 一条连接多路复用（stream)+ 头部压缩（HPACK)
- key: TCP 层队头阻塞
  value: TCP 按序交付：丢一个包，后面所有 stream 的数据都得等重传
- key: QUIC
  value: 跑在 UDP 之上，每条 stream 独立交付；TLS 1.3 内置，握手 1-RTT、恢复连接 0-RTT
- key: 连接迁移
  value: QUIC 用连接 ID 而非四元组标识连接，Wi-Fi 切 5G 不用重连
- key: 代价
  value: UDP 可能被中间设备限速/拦截；用户态实现吃 CPU；排障工具链不如 TCP 成熟
