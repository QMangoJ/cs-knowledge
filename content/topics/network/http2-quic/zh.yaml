- id: ai-link
  title: 协议选型与自检：不同战场该选 HTTP/1.1、HTTP/2 还是 QUIC
  tldr: "[[gRPC]] 默认站在 HTTP/2 之上跑服务间调用，面向公网弱网和移动端的接入层才最需要 QUIC；选哪代协议不看谁年份新，而看你业务里真实的阻塞停在哪一层。"
  body: |-
    把协议版图落回现代后端与 AI 工程：服务间高频通信的主力 [[gRPC]]，底层正是 HTTP/2——把每次远程调用装进独立 stream、靠两层窗口做反压、拿 HPACK 省掉重复头部。而在大模型推理网关里，如果下游用 HTTP/1.1 接流式吐字，并发两百路对话就得死撑两百条连接；换成 HTTP/2 虽然收成一条连接，可万一经过跨区或公网丢包，1 个丢包照样让两百路一起卡顿半秒吐不出字——只有把直接面向移动 App 和公网用户的那一环接入层换上 HTTP/3（QUIC），才能让弱网丢包和 Wi-Fi 切 5G 互不连累。

    落到日常架构选型动作上，按三条稳妥原则走：第一，同机房微服务与内部 RPC 继续放心用 HTTP/2（记得按上一课算好的 [[BDP]] 把流控初始窗口从 64 KB 调大，别被流控顶死）；第二，面对公网和高丢包地区的网页与 App 接入层评估打开 HTTP/3，但务必实测自家用户群的 UDP 通行率并保住 HTTP/2 回退；第三，只要涉及逐 [[token]] 吐字的流式响应，不管跑哪一代协议，都得单独检查沿途网关有没有默认攒满整块缓冲才转发。

    三代协议的演进脉络用一句口诀记住，选型排障不跑偏：1.1 卡在请求排队（应用层阻塞），2 用分帧解开应用却被 TCP 丢包连坐（传输层阻塞），3 搬进用户态 UDP 让流各自重传再加换网不断（彻底解绑）；内网低丢包稳用 2，公网弱网切 3 留退路。
  derivation: original
  sources:
  - ref: rfc-9113
    locator: RFC 9113（gRPC 等应用协议的传输基础）
