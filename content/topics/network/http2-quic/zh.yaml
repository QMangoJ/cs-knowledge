objectives:
- 逐层说清三次队头阻塞分别发生在哪一层、各被谁解决
- 解释 QUIC 选 UDP、内置加密与连接 ID 的动机
- 给出 HTTP/3 部署需要回退路径的理由
aiLink: gRPC、服务网格、移动端弱网、流式网关——协议选型直接写进尾延迟。这一课让你在看到「HTTP/2 偶尔比 1.1 慢」「App 切网络就断流」时，能立刻定位到传输层语义。
design:
- mechanism: 'QUIC 的做法是绕开 TCP 另起炉灶：在 UDP 之上于用户态重新实现可靠传输、拥塞控制、多流与加密，把传输层语义做成一个可以随应用一起发布升级的软件库，而不是等待操作系统内核缓慢更新。'
  problem: 'TCP 的实现固化在全球每一台设备与中间盒子里：任何对 TCP 语义的实质修改，都要面对海量已部署设备不升级、以及中间设备会丢弃或改写它们不认识的报文这一现实，协议在部署中被冻结了。'
  choice: '于是选择不在 TCP 上打补丁：UDP 只提供最小的不可靠数据报通道且被中间设备普遍放行，其余语义全在用户态自建；加密内建也让中间设备无从对传输参数指手画脚，进一步锁死语义。'
  tradeoff: '代价是重复造轮子的全部成本回到应用侧：用户态实现通常比内核 TCP 吃更多 CPU，运维排障要换一整套工具，且个别网络对 UDP 的限速与拦截使它必须永远保留回退到 TCP 路线的通道。'
  root: '根源是协议僵化（ossification）的推理：一个协议的可演进性不取决于规范写了什么，而取决于已部署生态允许它改什么；当中间层成为事实上的审查者，唯一可行的演进就是换一层地基。'
- mechanism: '多路复用的机制是把多个逻辑流的帧交错进同一条连接发送，每帧自带流编号，接收方按编号拆回各条流；每条流有独立的状态与流控，连接级再叠一层总流控，构成两级窗口。'
  problem: '单连接串行时，队头的一个慢响应会堵住后面全部请求；而多开连接绕行又要为每条连接重付握手与慢开始，还让拥塞控制按连接数抢带宽——并发与连接数被人为地绑在了一起。'
  choice: '选择在一条连接里复用多条逻辑流：并发量由流的数量决定而与连接数解耦，握手与拥塞状态只维护一份，头部还可借共享上下文压缩——这是 HTTP/2 与 QUIC 共同的地基设计。'
  tradeoff: '代价是流与流之间并非天然隔离：共享一条有序字节流时（HTTP/2 over TCP），一个丢包仍会连坐全部流；即便在 QUIC 里隔离了交付，连接级流控与带宽仍是共享的，吵闹邻居问题并未消失。'
  root: '根源在分层：独立性必须在每一层分别赢得——应用层把流分开，只解决了应用层的阻塞；传输层若仍按单字节流交付，阻塞会原样在下一层重现，这正是从 HTTP/2 走向 QUIC 的完整逻辑链。'
quiz:
- q: HTTP/2 解决了什么、又留下了什么？
  options:
  - 全都解决了
  - 消除了应用层队头阻塞（多路复用），但 TCP 按序交付使丢包仍连坐所有流
  - 只解决了头部大小
  - 让 TCP 不丢包了
  answer: 1
  explain: HTTP/2 的多流共享一条有序字节流；单个丢包会阻塞整条流的交付。
- q: QUIC 为什么选 UDP 做地基？
  options:
  - UDP 更可靠
  - 能穿透只认 TCP/UDP 的中间设备，且实现可放在用户态快速演进
  - UDP 不丢包
  - 因为 TCP 被禁用了
  answer: 1
  explain: QUIC 需要在现有互联网上部署并快速迭代：UDP 提供最小通道，其余语义（可靠、拥塞、加密）自己在用户态实现。
- q: 连接迁移靠的是什么？
  options:
  - 更快的重连
  - 连接由协商的连接 ID 标识，与源地址解耦
  - 服务器记住用户密码
  - 双倍带宽
  answer: 1
  explain: 地址变化后凭同一连接 ID 继续通信，服务器验证新路径即可，不必重新建连。
steps:
- id: h1-problem
  title: HTTP/1.1 的队头阻塞与六连接 workaround
  tldr: 1.1 一条连接同时只能跑一个请求：前一个响应不回来，后一个请求干等。
  body: 'HTTP/1.1 虽然有长连接（keep-alive）与流水线构想，但实际上一条连接上请求必须按序一问一答：响应慢，后面排队的请求全部堵住——应用层队头阻塞。浏览器的土办法是每个域名开约 6 条连接并行（具体上限随浏览器而异），站点则用域名分片、雪碧图、资源合并来绕。


    这些 workaround 本身带来新问题：连接多了握手与拥塞慢开始的成本重复付（六条连接等于六份 TCP 加 TLS 握手、六次慢开始爬坡），资源合并让缓存粒度变粗（改一个小图标要重下整张雪碧图），域名分片还人为打散本可共享的连接管理。流水线为什么没能救场？它允许不等响应就连发请求，但响应仍必须按请求顺序返回，队头那个慢响应照样堵住后面全部，且中间代理对流水线的支持参差，实际部署基本被放弃。根子在于协议语义：需要的是让一条连接里真正并发多个请求，而不是堆连接数量去掩盖串行。'
  derivation: original
  sources:
  - ref: rfc-9113
    locator: RFC 9113 Introduction（HTTP/1.1 的局限与设计目标）
    claim: HTTP/2 的设计目标之一是消除 HTTP/1.1 单连接串行请求造成的队头阻塞与连接数膨胀
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 浏览器
      highlight: true
