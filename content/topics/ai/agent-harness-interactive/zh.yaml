objectives:
- 对着一段 Claude Agent SDK 代码，说清 query() 内部一圈循环的七步各自在干什么
- 解释模型为什么只能提请求、不能自己执行工具，以及权限检查拦下的请求会怎样回到模型面前
- 说清结果回填为什么是循环的心跳，以及 maxTurns 这条保险丝防的是什么
aiLink: 你每天用的 Claude Code、Cursor 就是这套循环的产品形态：它们与裸调 API 的差别不在模型，而在 [[harness]] 把权限、上下文与工具执行做成了什么样。
design:
- mechanism: 为什么工具只能由 harness 执行，模型只能提请求
  problem: 模型是一个通过 API 远程调用的预测程序：它没有文件系统句柄，也没有进程权限；就算把权限给它，它说出的「我想删这个文件」也只是一段文本，无法自证真伪、无法审计。
  choice: 把执行权收归 [[harness]]：模型输出结构化的 tool_use 请求，harness 校验、执行、留痕，再把结果回填。模型与真实世界之间，永远隔着这层可编程的关卡。
  tradeoff: 代价是每一步工具调用都要多走一轮「请求—执行—回填」的往返，延迟与 token 成本随步数线性增长；工具的接口设计（粒度、返回值）也成了 harness 作者必须操心的事。
  root: 根子是操作系统里最老的隔离原则：不可信的计算单元只许通过受控接口（系统调用）碰资源。模型在这里相当于用户态进程，harness 相当于内核——提请求可以，动手必须过关卡。
- mechanism: 为什么权限检查要独立成一步，而不是写进工具里
  problem: 工具只知道自己能干什么，不知道这次任务该不该让它干：同一个 Bash，在修 bug 的任务里是必需品，在「只许读代码」的任务里就是事故源。把权限判断塞进每个工具，规则会散落且互相矛盾。
  choice: 在请求与执行之间设一道统一安检：白名单（allowedTools）、模式（permissionMode）、回调（canUseTool）三层都在这一步生效；拒绝时把「不允许」作为结果回填给模型，让它换个做法，而不是把循环卡死。
  tradeoff: 代价是多一次往返与误拦的摩擦：规则写严了，agent 动不动被拦、任务推进慢；写松了，这一步就形同虚设。松紧只能靠真实任务慢慢校准。
  root: 根子在最小权限原则的工程形态：权限不该由执行者自证，而该由调用链上独立的一环裁决——和 Web 后端把鉴权放在中间件、而不是每个 handler 里重写一遍，是同一道题。
- mechanism: 为什么循环必须有 maxTurns 这样的硬上限
  problem: 循环继续与否由模型提请求决定：模型一旦陷入「读文件—没看懂—再读一遍」的打转，或者工具持续报错而它不断重试，没有外力介入，就会一直转下去、一直烧 API 费用。
  choice: 由 [[harness]] 在循环之外数圈数：options.maxTurns 设死上限，先到先停；结束时在 result 里标明是被轮次截断的，而不是伪装成正常完成。
  tradeoff: 代价是长任务可能被误杀：真正需要二十轮的任务，会被十二轮的上限拦腰截断。所以上限要按任务给，而不是全站一个值；被截断时也要把中间状态交出来，方便续跑。
  root: 根子是任何反馈回路都要有独立于回路本身的停机条件：进程有超时、请求有 deadline、重试有次数上限——不能让回路用自己的判断，决定自己何时停。
steps:
- id: harness-loop
  title: 一圈循环走一遍：左边是代码，右边是流程图
  tldr: 点流程图的任意一步，左边代码会高亮到那一步对应的行，下方详解随之切换；按「播放一遍」，它会走完一圈、沿回环箭头再走一圈，最后停在终止步。
  body: |-
    读法很简单：右边流程图的七步，就是左边这段代码跑起来时，内部依次发生的七件事。点任意一步，下方详解会换成那一步的说明，代码也会高亮到对应的行——比如点第 4 步「权限检查」，高亮的是 allowedTools、permissionMode 和 canUseTool 那几行，因为安检的全部规则就写在那里。

    有两个地方值得盯着看。第一是第 3 步的菱形：模型每轮都要在「直接回答」和「提出 tool_use 请求」之间二选一，这个选择决定循环继续还是退出。第二是第 6 步回到第 2 步的回环箭头：它才是常态——真实任务里循环通常要转许多圈，第 7 步的终止反而是少数。

    还有一句实话先说在前面：第 6 步「结果回填」在 SDK 里没有对应的用户代码，它发生在 SDK 内部，所以那一步的高亮只能锚在 for await 那几行上。为什么循环要这样分工、权限为什么独立成步、上限为什么必须由 [[harness]] 强制，本课最后一步「为什么这样设计」会逐条交代。
