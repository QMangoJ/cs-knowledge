title: Agent Harness 实操：跟着代码走完一圈循环
summary: 模型只负责想和说，碰不到文件、执行不了命令；让它真能干活的，是包在模型外面的控制程序 [[harness]]。本课对着一段 51 行的 Claude Agent SDK 真实代码，把一次 query() 内部的循环拆成七步：组装上下文、调用模型、模型决策、权限检查、执行工具、结果回填、终止与交付——点流程图的任意一步，代码就高亮到对应的行。
premise: 以一个「读 src 目录、总结项目架构、把结论存成一条笔记」的任务为样本：它由一段 Claude Agent SDK 代码启动，任务不难，难的是看清按下回车之后、最终答复出现之前，模型与 [[harness]] 之间到底来回了多少趟——每一趟里，简报是谁备的、请求是谁批的、活是谁干的、结果又是怎样回到模型面前的。
position: 本课是人工智能科板块「从模型到 agent：Harness」的第二课，紧接在《Agent Harness：把只会吐字的模型装进循环、工具与权限》之后、常驻 Agent 一课之前：上一课用文字把循环、工具、上下文、压缩与权限的道理成套讲完，本课换成实操——摊开一段真实的 Claude Agent SDK 代码，把同一圈循环对着流程图一步步点完。学完你能对着这段代码指出每一行在循环里管哪一步；下一课再把尺度放大，看这套循环被围上外围五部件之后，怎样成为长期在岗的系统。
bridge:
  prev: 上一课把 harness 的道理讲透了：循环怎样转、工具怎样定义、上下文怎样装、权限怎样分级。但道理落在文字上，总像是隔着一层玻璃。这一课把同一套机制落到一段能跑的代码上：51 行 Claude Agent SDK 里，组装上下文、权限检查、结果回填各有其位——点着流程图走完一圈，上一课的每个概念都能在代码里找到对应的行。
  next: 这一课的循环只活在一次运行之内：任务结束，上下文散场，下次醒来什么都不记得。而产品里的 agent 要长期在岗：没人说话时记得住事，到点了能自己醒来，无人盯着时也不乱来。下一课把镜头拉到循环之外，看收件箱、计时器、记忆、权限与发件箱这五部件，怎样把一圈圈短命的循环缝成一个常驻系统。
overview:
- key: 一句话总结
  value: agent 的能力一半在模型、一半在 [[harness]]：模型负责决策，harness 负责执行、把关与回填；循环转多少圈，由模型提请求的次数和 maxTurns 上限共同决定
- key: 七步速览
  value: 组装上下文 → 调用模型 → 模型决策 → 权限检查 → 执行工具 → 结果回填 → 终止与交付；其中第 6 步回到第 2 步的回环是常态，走到第 7 步退出才是少数
- key: 分工的底线
  value: 模型只能提 tool_use 请求，碰不到真实世界；harness 掌握执行权与否决权——这是安全边界，不是实现细节
- key: 样本代码
  value: 51 行 Claude Agent SDK（TypeScript）：一个 query()、一个用 tool() 定义的 save_note 自定义工具、canUseTool 里一条拒绝 Bash 的规则
