- id: decode-bandwidth
  title: decode 的真瓶颈：不是算力，是显存带宽
  tldr: 每生成一个词，引擎要把全部权重（约 14 GB）与这条会话的全部 KV 从显存读过一遍；计算量却只有一个词的前向——算力在等数据，内存墙在推理侧原样复现。
  body: '为什么 decode 还是慢？把每一步的搬运量算出来：模型要产出新词，必须让新词的数据流过全部层，于是全部权重（14 GB）要从显存读进计算单元一遍；注意力查表要把这条会话的全部 KV（比如 2 GB）也读一遍。而这一步真正的新计算只有一个词的前向（约 140 亿次浮点运算）——在当代 GPU 上，这点计算是毫秒以下的零头，绝大部分时间花在等 16 GB 数据从显存里搬完。

    这就是组成科那道内存墙在推理侧的复现：算力这些年涨了几百倍，显存带宽只涨了几十倍，于是对「每读一字节只做一两次运算」的负载（decode 正是典型），快慢完全由带宽定价。一个直接推论：把权重压小就是把每步的搬运量压小——低精度量化（把权重从 FP16 压到 8 位甚至 4 位整数）在推理侧如此流行，第一性原因不是省显存，而是每步要读的字节直接减半、再减半，吐字速度跟着翻倍。

    第二个推论指向下一幕：既然每步都要读一遍 14 GB 权重，而读一遍的成本与服务几个人无关——那就让这一遍同时服务尽可能多的人。批处理在推理侧的意义，与训练侧完全不同：不是为了梯度统计，而是为了摊薄这笔每步必付的权重搬运费。'
