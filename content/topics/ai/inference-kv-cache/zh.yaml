- id: paged-attention
  title: PagedAttention：给 KV 缓存请来操作系统的分页
  tldr: 会话长度事先未知，整段预留会浪费、连续分配会碎片；把 KV 切成固定小块按需取用、再用块表索引——这正是 OS 虚拟内存治过的同一种病。
  body: 'KV 缓存的内存管理还藏着一道经典难题：一条会话最终会生成多长，开始时没人知道。若按最大长度整段预留，绝大多数会话用不满，显存白白闲置；若紧巴巴地连续分配，会话一长就要整段搬家，碎片也越攒越多。并发能开多大，被这道题卡着脖子。

    vLLM 给出的解法眼熟得让人会心：PagedAttention。它把每条会话的 KV 切成固定大小的小块（比如每块存 16 个 token 的 KV），块可以散落在显存的任何空位，另用一张块表记录这条会话的块按顺序都在哪。会话变长就再领一块，不需要连续、不需要预留、不需要搬家——浪费只剩最后一小块的零头，碎片问题随之消失，同一张卡能同时伺候的会话数明显涨了上去。

    认出它并不难：这正是操作系统课里虚拟内存分页的原样复刻——进程的逻辑地址连续、物理页框任意，靠页表翻译；当年治的是内存碎片与按需分配，今天治的是 KV 碎片与按需生长。本站的课彼此咬合的地方很多，这是最漂亮的一处：OS 的老智慧在 AI 引擎里又值了一次班。'
  derivation: original
