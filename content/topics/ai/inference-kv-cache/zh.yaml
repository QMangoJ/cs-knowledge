- id: naive-recompute
  title: 没有缓存的世界：每吐一词，重算整部前文
  tldr: 注意力要拿新词的 Q 去查全部历史的 K 与 V；若不存，每生成一步都要把整段历史的 K/V 重算一遍——生成 n 个词，总账是平方级的重复劳动。
  body: 'decode 每一步要算注意力：新词的 Q 去和前面所有词的 K 打分、再按权重取它们的 V。这里藏着一个要命的观察：第 t 步需要的历史 K 与 V，与第 t−1 步需要的几乎完全相同——历史已经定型，前文的每个词在每一层的 K、V 都是算过就不再变的常量。新词只是往表尾追加了自己一行。

    若不做任何缓存，每一步都老老实实把整段前文从头跑一遍：生成 100 个词，第 100 步要重处理前面 99 个词的全部层——总工作量随生成长度平方增长，而且其中绝大部分是在重复生产昨天就已经算好的数。这种浪费在工程上是最不能忍的那种：不是算法不够聪明，而是同一份已定型的结果被反复重算。

    解法顺理成章：把每个词在每层算出的 K 与 V 当场存下来，下一步直接取用——这就是 KV 缓存（KV Cache）。它与第一站反向传播存激活是同一种取舍的两面：那边存是为了省重算的麻烦、这边存是为了省重算的时间；而它占的显存有多大、会不会反过来卡住并发，是随后两幕的账。'
  derivation: original
