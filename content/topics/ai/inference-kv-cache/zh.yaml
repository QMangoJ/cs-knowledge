- id: continuous-batching
  title: 连续批处理：让一遍权重读取服务尽可能多的人
  tldr: 多条会话组批一起 decode，权重读一遍喂给所有人；静态组批要等最长会话生成完，连续批处理则按 token 级调度——谁结束就退出、新请求随时补位。
  body: '批处理（batching）的推理版这样工作：把多条会话当前步要生成的词打包成一批，一起送进模型——权重只读一遍，同时推进几十条会话各自的下一个词。每条会话每步的权重搬运费被摊薄到几十分之一，GPU 的吞吐立刻翻身。注意每条会话的 KV 是各自独立的，批的只是计算，不是数据。

    早期的静态批处理有个笨问题：必须等批里最长的那条会话生成完，整批才能散伙——先写完的会话陪着干等，新请求也要等下一批开场。连续批处理（continuous batching）把调度粒度细到单个 token：每一步重新组批，哪条会话结束了就退出，哪条新请求到了就插入空位。GPU 永远满载、用户不必凑齐才发车——这本质上是把操作系统进程调度的思想搬进了推理引擎：短的先走、长的慢慢跑、空位即时回收。

    批也不是越大越好：批越大，每步要读的 KV 总量越大（各会话的 KV 互不共享、都要读），且单步延迟会涨，个体的吐字速度反而可能变慢。引擎的调度器就是在「总吞吐」与「单人延迟」之间实时找平的那个角色——做过后端的人会认出这副面孔：它就是推理版的负载均衡。'
