- id: speculative
  title: 投机解码：小模型起草，大模型一次验多个
  tldr: 让一个小得多的模型先连猜几个词，大模型用一次并行前向同时验证：猜对的全部收下，第一个猜错处改对再继续——输出与逐词生成严格一致，步数却省了大半。
  body: '最后一招利用的是 decode 的算力闲置：每步本来就闲着大量算力（瓶颈在带宽），何不拿闲算力一次多干活。投机解码（speculative decoding）的做法像编辑审稿：先让一个又小又快的模型（起草者）顺着往下连猜几个词，比如 4 个；再让大模型对「前文 + 这 4 个猜测」做一次并行前向（形状类似 prefill），一次算出每个位置上大模型自己的选择；从左到右逐个比对，猜对的全部接受，遇到第一个猜错的位置，就用大模型在该位置的选择替换它、丢弃其后所有猜测，然后进入下一轮。

    关键的诚实点在分布上：这套接受与替换规则被设计成与逐个采样在统计上严格等价——输出的质量与分布和老老实实逐词生成完全一样，省下的只是步数。起草者与文本越合拍（简单文本、公式化段落），每轮收下的词越多，实测在论文报告的设置里能拿到 2 到 3 倍的加速；起草者全猜错时，最坏也只多花一次小模型的钱，不亏本。

    它与批处理、量化是正交的三把刀：量化砍每步的字节、批处理摊每步的权重读、投机减少步数本身。真实推理引擎是三把刀一起上，这也是为什么「推理优化」能长成一门独立手艺——下一幕收束时会把这件事讲透。'
  derivation: original
  sources:
