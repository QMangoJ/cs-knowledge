- id: why-a-business
  title: 为什么推理优化是一门独立生意
  tldr: 训练再贵也是一次性的资本开支，推理是每次调用都要付的边际成本，总量随用户增长而没有上限——当调用量足够大，推理账单终将超过训练账单，省下的每个百分点都是真金白银。
  body: '把全科的账在这一幕合上。训练的成本结构是「预付」：再大也是一笔有限的一次性投入，摊到模型的整个生命周期里会越摊越薄。推理的成本结构完全不同：它按次计价、随调用量线性增长、且没有上限——一个成功的产品，用户越多、聊得越多，这笔账就越大，直到超过当初的训练总账，只是时间问题。

    于是推理侧长出了完整的独立行当：专门的推理引擎（把批处理、分页缓存、量化、投机全部做成基础设施）、按 token 计费的定价学、为延迟与吞吐分别优化的部署策略。判断一家模型服务商的竞争力，最后常常不看模型本身，而看它每生成一百万个 token 的成本比对手低多少——本课算过的每一本账（KV 的字节、权重的字节、批的摊薄、步数的节省），都是这个成本数字的构成项。

    本科到此收官，请把四站连成一条线：第一站，反向传播让「学习」成为可计算的责任分摊；第二站，注意力让结构适配了并行硬件；第三站，训练的显存与计算账决定了知识压缩的代价；第四站，推理的缓存与带宽账决定了知识取用的价格。你日后每接触一个新模型或新引擎，都可以沿着这四本账去盘问它——账算得清， hype 就站不住。'
  derivation: original
