- id: kv-mechanics
  title: KV 缓存怎样工作：每步只算新词的 Q，再追加一行
  tldr: 有了缓存，decode 每步只需算新 token 自己的 Q/K/V，用 Q 查缓存里的全表，把新 K/V 追加到表尾；每步计算从「重处理全史」降到「处理一个词加查一次表」。
  body: '把机制走一遍。prefill 结束时，提示词里每个词在每一层的 K 与 V 都已算好并存进缓存，表的行数等于提示词长度。decode 每一步：新词进入，只需算它自己的 Q、K、V；拿它的 Q 与缓存里全部历史的 K 打分（外加它自己刚算出的那一份），按 softmax 权重取用全部 V，得到这个词的输出、采样出再下一个词；同时把新词的 K、V 追加到每一层表的尾部，供后续步骤查阅。

    账面变化立竿见影：每步真正的新计算只剩「一个词的前向」加上「一次查表」——查表的长度随上下文线性增长（要把全部历史的 K 读一遍打分），但比起不缓存时的整段重算（一整段前向，含每层的全部加工），已经是两个量级。生成因此从平方成本降到近似「每词一步、每步与长度成正比」。

    请注意缓存的内存形状：它是一本只追加的账本，按 token 逐行生长，行宽由模型的层数与维度决定，随时可查尾、从不回头改。这副形状会带来它自己的管理问题（长度事先未知、会话长短不一），那是 PagedAttention 登场的地方；先算它到底有多大。'
  derivation: original
  canvas:
