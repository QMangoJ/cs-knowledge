steps:
- id: two-phases
  title: 两段式生成：读题并行，吐字串行
  tldr: 一次回答先把整段提示词并行处理完（prefill），再逐个生成新词（decode）；前一段拼算力，后一段拼带宽，用户的等待也分挂在这两段上。
  body: '把一次提问的生命周期拆成两段。第一段叫 prefill（预填充）：你发来的整段提示词（可能几千个 token）一次性全部送进模型并行处理——每个词的位置互相已知，正确答案（就是提示词本身）全在眼前，所以这段的计算形状与训练时一样，是饱满的大矩阵乘，拼的是算力。它产出两样东西：第一个新词，以及一份覆盖全部提示词的中间状态（下一幕的主角）。

    第二段叫 decode（解码）：从这里开始逐词生成。每生成一个词，就要把它接回输入、再完整跑一次模型得到下一个词——上一课讲过，自回归的天性就是这样，第 n+1 个词所需要的输入正是第 n 个词本身，没出来就无从开工。这段里每步只有一个新 token 在跑，矩阵乘法瘦成「矩阵 × 向量」，算力大量闲置，真正的瓶颈变成了把权重从显存搬进来的速度。

    用户的体感精确地挂在这两段上：点下发送后等多久才蹦出第一个字（首 token 延迟），由 prefill 的长度与算力决定；之后字往外蹦的快慢（每 token 间隔），由 decode 的带宽账决定。一个产品若慢，要先问清慢的是哪一段——两段的药完全不同。'
