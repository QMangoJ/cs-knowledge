- id: kv-bill
  title: KV 的内存账：0.5 MB 一个词，并发下比权重还大
  tldr: 每 token 每层要存 K 与 V 各一份隐藏向量：2 份 × 32 层 × 4096 维 × 2 字节 ≈ 0.5 MB/token；4K 上下文一条会话约 2 GB，32 条并发就是约 69 GB——超过权重本身数倍。
  body: '逐项算清这本账本的行宽。存一份 K 或 V，就是存一个隐藏维度的向量：4096 个数，FP16 每个 2 字节，一份 8 KB。每个 token 在每一层都要存 K 与 V 两份：32 层 × 2 份 × 8 KB = 512 KB ≈ 0.5 MB。这只是「一个词」的价钱。

    往上乘：一条会话聊到 4,096 个 token 的上下文，KV 就是 4096 × 0.5 MB = 2 GB——一部手机内存的量级，只伺候一位用户。而推理服务的生意是并发：32 条会话同时在线，KV 合计约 69 GB。对比权重本体 14 GB：缓存轻轻松松长到权重的四倍多，而且它随两个变量同时涨——上下文越长行越多、并发越高本越厚。显存的真正分配因此是：权重占固定一块，KV 池占弹性的一大块，能同时接多少用户、每人能聊多长，先被这本账卡死。

    这也是长上下文为什么单独标价：把上下文从 4K 涨到 128K，单条会话的 KV 就从 2 GB 涨到约 69 GB——不是服务商贪心，是这本只追加的账本在显存里的真实占地。压它的方法下下幕见：把 KV 本身也用更低精度存、或把不那么重要的层与位置的缓存裁掉，都是在这本账上动刀。'
