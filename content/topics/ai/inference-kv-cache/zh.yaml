title: 推理与 KV Cache：逐词生成的慢，与它的解法
summary: 生成分两段：prefill 整段并行读题、decode 逐词串行吐字；KV 缓存把历史的 K/V 存下来免去重算，代价是约 0.5 MB/token 的显存；decode 的瓶颈是显存带宽而非算力，连续批处理、分页管理与投机解码都在围着这两本账打转。
premise: 以一个 32 层、隐藏维度 4096 的 7B 级模型回答一次提问为样本：走完 prefill 与 decode 两段，算清 KV 缓存每 token 0.5 MB 的来历，看它怎样在并发下长得比权重还大。
position: >-
  本课位于人工智能本科的收官一段「推理的账本」：前三站讲清了学、结构与训，本课补上「用」的成本结构。学完你能分辨 prefill 与 decode 各自的瓶颈、手算任意模型的 KV 缓存尺寸，并说清连续批处理、PagedAttention 与投机解码各自在解哪一笔账——这也是全科与全站的收束一课。
overview:
- key: 一句话总结
  value: 推理慢的形状由自回归决定：读题可以并行，吐字只能逐个；工程的全部功夫是把历史存下来复用、把权重读一遍喂给更多人
- key: 两段
  value: prefill（整段提示并行处理，算力瓶颈）与 decode（逐 token 生成，带宽瓶颈）——体验上对应等首字与看吐字速度
- key: KV 缓存
  value: 存下每个已处理 token 在每层的 K 与 V；新 token 只算自己的 Q 去查表，不再重算历史
- key: 本课账单
  value: KV 约 0.5 MB/token（32 层 × 4096 维 × K/V 两份 × FP16）；4K 上下文一条会话约 2 GB，32 条并发约 69 GB
- key: decode 的瓶颈
  value: 每生成一词都要把全部权重（约 14 GB）与全部 KV 从显存读过一遍；算力在等带宽
- key: 三招
  value: 连续批处理摊薄权重读取、PagedAttention 把 KV 的碎片管起来、投机解码让一次前向推进多个词
