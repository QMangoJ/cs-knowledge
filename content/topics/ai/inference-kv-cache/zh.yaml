minutes: 30
prereq:
- ai/training
objectives:
- 区分 prefill 与 decode 的任务与瓶颈，并说清用户等待分别挂在哪一段
- 手算给定层数与维度的 KV 缓存每 token 尺寸，并推出并发下的总量
- 解释 decode 受显存带宽而非算力限制的理由，以及量化为何能加速它
- 说清连续批处理、PagedAttention、投机解码各自解的是哪一笔账
aiLink: 你的浏览器早就在做同样的事：把看过的页面、图片缓存下来，下次直接取用而不是重新下载——KV 缓存与浏览器缓存共享同一条经济学：凡是还会用到、且不会变的东西，就值得用存储换时间。
design:
- mechanism: 为什么 KV 缓存这笔「用显存换计算」的买卖必赚
  problem: 根本约束是自回归的重复结构：每生成一个新词，注意力都要重新查阅全部历史，而历史的 K 与 V 一旦算出就永不改变。不缓存，等于对一份不可变的数据反复付出平方级的重算——这笔浪费与模型多聪明无关，纯粹是记性问题
  choice: 做法是把历史的 K 与 V 全部留在显存里只追加：每步的新计算降为「一个词的前向加一次查表」。用的是存储，买的是时间，且因为被存的东西永不失效，这笔交换没有缓存一致性之类的一切经典麻烦
  tradeoff: 代价是显存的弹性被它吃掉：KV 随上下文与并发双线膨胀，并发上限从此不由算力决定而由缓存池决定；长上下文之所以昂贵、并发之所以要排队调度，根子都在这本账本占的地
  root: 根子在缓存成立的最一般条件上：可缓存的对象必须不可变或可校验。历史 token 的 K/V 是由已冻结的权重与已确定的前文算出的常量，天然满足——它与数据库的物化视图、CDN 的静态资源、CPU 的只读缓存行共享同一个成立条件
- mechanism: 为什么 decode 阶段的一切优化都围着带宽，而不是算力
  problem: 根本约束是算术强度：decode 每步只处理一个新 token，对每个权重只做约一次乘加就把它放下——每从显存读入一字节权重，只换来约一次运算。现代 GPU 的算力与带宽之比高达数百比一，这种活儿注定让计算单元饿着等数据
  choice: 做法是全部优化都改写成带宽语言：量化减少要读的字节，批处理让同一遍读取喂饱更多请求，投机解码让一遍读取推进多个词，PagedAttention 保证显存不被碎片浪费而是全部拿去装 KV。没有一招是去提升算力的——算力根本不是瓶颈
  tradeoff: 代价是这些招数都有各自的税：量化掉精度、批处理涨单人延迟、投机要养一个小模型、分页要维护块表。推理引擎的日常，就是拿着延迟与吞吐两本账，在这些税之间反复配平
  root: 根子是组成科讲过的内存墙：几十年来算力的增速持续快于内存带宽的增速，两个指数的差距最终让一大类负载从计算受限滑向搬运受限。decode 是这条宏观曲线在 AI 上的投影——看懂它，就看懂了为什么硬件厂商开始比拼显存带宽与片上缓存
- mechanism: 为什么推理会从训练里独立出来，长成一门单独的生意
  problem: 根本约束是两种成本的数学形状不同：训练成本近似一笔固定投入，推理成本是随调用量线性增长的变量成本。当一个服务成功，调用量会冲到训练时的 token 总量之上并继续涨——变量成本迟早在总账上压过固定成本，且没有任何摊薄的终点
  choice: 做法是组织与技术的双重分家：推理用独立的引擎、独立的部署与独立的计费，把每 token 成本当成核心指标单独优化；模型发布之后，竞争的主战场从「谁的模型强」慢慢移到「谁能把同样的模型供得更便宜、更快」
  tradeoff: 代价是生态的撕裂：训练框架与推理引擎各自演化，模型要在两套系统间搬运与适配，量化、算子支持、数值对齐的坑都长在这条裂缝上；小团队则要为「自己养推理还是买服务」反复算账
  root: 根子在产业的一般规律上：固定成本与边际成本从来由不同的学科优化——发电厂与电网、影院与发行、编译器与运行时皆然。当一门技术的边际成本成为主要矛盾，它必然分化出自己的工程共同体与商业模式，推理之于 AI 正是如此
terminal:
- cmd: python3 -c "per=2*32*4096*2; print('bytes/token', per, 'GB@4K', per*4096/1e9, 'GB x32 sessions', per*4096*32/1e9)"
  note: 复算 KV 账：每 token 约 0.5 MB，4K 上下文单条约 2 GB，32 并发约 69 GB
