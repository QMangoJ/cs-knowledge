        mark: active
      - from: h
        to: o
        w: w2 = 2.05（+0.05）
        mark: active
    registers:
    - name: 更新式
      value: w := w − 0.1 × 梯度
    - name: 纪律
      value: 同一轮梯度，整批同时生效
  log:
  - mode: 更新
    event: 第一轮学习完成，旋钮各就各位，等待验算
- id: verify
  title: 验算：再走一次前向，损失 0.5 → 约 0.16
  tldr: 新配方前向：h = 0.7，out = 1.435，损失 = ½×(1.435−2)² ≈ 0.16——一轮学习，错误被砍掉三分之二，这就是「学会了一点」的全部含义。
  body: '不验算的学习是自欺。用新旋钮再走一次前向：h = 1 × 0.7 = 0.7；out = 0.7 × 2.05 = 1.435。新损失 L = ½×(1.435 − 2)² = ½×(0.565)² = ½×0.319 ≈ 0.16。对比第一轮的 0.5：一次更新，损失降到原来的三分之一，输出从 1.0 向目标 2 靠近了一大步——本课开头的所有数字，到这里全部对得上账，你可以拿计算器逐个复核。

    把镜头拉远：训练（training）就是这个四幕循环的无尽重复——前向出答案、损失记账、反向分摊、更新旋钮——换着样本（随机梯度下降里的「随机」，指的就是每轮抽一小批样本来算梯度）、重复亿万次，损失被一格一格压低，网络从胡说八道慢慢变成对答如流。没有什么额外的魔法被藏起来：大模型的训练日志里跳动的那个 loss 数字，就是本课这个 0.5 在更大规模上的同名亲戚。

    两处规模化的问题留给后两站：旋钮多到上亿、链长到上百层时，这一轮的账（存多少中间值、算多少次乘法）会膨胀成什么样；以及答题时这条链又该怎么跑得快。本课先收束一个地基性的结论：可训练的系统 = 一个巨大的可导函数，加上一台把梯度算回每个参数的机器。'
