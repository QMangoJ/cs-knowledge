license: CC-BY-4.0
title: 神经网络与反向传播：一次前向、一次反向之旅
summary: 神经元是一台加权求和的小机器，权重是它的旋钮；前向算出答案与损失，反向用链式法则把责任逐棒分摊回每个旋钮，梯度下降再把它们拧一小格——本课的每个数字都经过手算验证。
premise: 以最小的一条链（输入 x=1，经一个隐藏神经元，w1=0.5、w2=2，目标输出 2）为样本：走完一次前向、算出损失、一次反向分摊责任、一次更新，并验算损失确实从 0.5 降到了约 0.16。
position: 本课是人工智能本科的全景第一站，位于「学习是怎么发生的」一段：后面三站（注意力、训练、推理）的一切，都建立在「模型是一大堆可以被梯度拧动的旋钮」这个地基上。学完你能对着一条两节的小链，完整手算前向、损失、三棒梯度与一次更新，并说清为什么反向传播一次反扫就能算出全部参数的梯度。
overview:
- key: 一句话总结
  value: 学习就是拧旋钮：前向出分，损失记账，反向按链式法则分摊责任，更新把每个旋钮朝少错的方向拧一小格
- key: 神经元
  value: 一台小机器：把输入逐个乘上权重（旋钮）再加总，过一道整形（激活），交出一个数
- key: 损失
  value: 唯一记分牌：本课用 ½×(输出−目标)²；它必须光滑可导，反向才算得出梯度
- key: 链式法则
  value: 责任传递的乘法链，每一棒梯度等于下一棒梯度乘以本段的局部导数。比如算 w2 的梯度时，下一棒传来的梯度是 −1，本段的局部导数是 h 的值 0.5，两者相乘得到 −0.5，和本课算例里的数字正好对上。
- key: 本课算例
  value: 前向得 1.0（目标 2），损失 0.5；梯度 dL/dw2=−0.5、dL/dw1=−2；学习率 0.1 更新后损失降到约 0.16
- key: 梯度下降
  value: 沿负梯度走步长一小格：负号决定方向（让损失变小），学习率决定步子大小
- key: 规模化
  value: 反向一趟算全部梯度（与参数量无关地便宜）；前向中间结果必须存着等反向用——这是训练显存账的源头
visual: datastate
logColumns:
- key: mode
  label: 当前阶段
- key: event
  label: 发生了什么
steps:
- id: neuron
  title: 神经元具象化：一台加权求和的小机器
  tldr: 一个神经元做三件事：输入逐个乘上权重、加总、过一道整形门；权重就是旋钮，网络就是旋钮连成的网，「学习」专指拧旋钮这件事。
  body: >-
    神经元做的事一点也不玄：拿到几个输入数，每个先乘上一个专属系数，再全部加起来，最后把和送过一道固定的整形门（激活函数），输出一个数。比如两个输入 3 与 4，系数是 0.5 与 −1，加权和是 3×0.5 加 4×(−1) 等于
    −2.5，整形门若用 ReLU（负数归零、正数放行），输出就是 0。


    系数叫权重（weight），就是这台小机器的旋钮——决定这个输入有多重要、正着听还是反着听。成千上万台小机器分层连起来，前层输出当后层输入，就是神经网络；网络的全部「知识」就存在这些旋钮的角度里。


    但上亿个旋钮初始都是随机初始化，网络起初只会胡说八道。谁来告诉每个旋钮该往哪边拧、拧多少？本课就回答这一个问题：前半程看前向，后半程看反向。
  derivation: original
  canvas:
    kind: datastate
    structure: graph
    caption: 一条最小的链：x 经 w1 到隐藏神经元 h，再经 w2 到输出
    graph:
      nodes:
      - id: x
        label: 输入 x = 1
        x: 8
        y: 50
      - id: h
        label: 隐藏 h
        x: 48
        y: 50
      - id: o
        label: 输出 out
        x: 88
        y: 50
      edges:
      - from: x
        to: h
        w: w1 = 0.5
      - from: h
        to: o
        w: w2 = 2
    registers:
    - name: 旋钮清单
      value: w1 = 0.5（x→h），w2 = 2（h→输出）
    - name: 学习的对象
      value: 不是规则，是这两只旋钮的角度
  log:
  - mode: 结构
    event: 网络的知识全在权重里，学习就是系统地拧权重
- id: specimen
  title: 样本登场：把这条链的数值钉死
  tldr: 输入 1、目标 2（老师手里的标准答案）；本课在整形门的线性区里算账，乘法结构一目了然，链式法则的每一棒都手算得出。
  body: >-
    本课用最小的样本把账算到分毫不差：一个输入 x = 1，一条链上只有两个旋钮 w1 = 0.5 与 w2 = 2，样本带着标准答案——目标（target）是 2，即希望输入 1 时网络输出
    2。它现在还做不到，差距有多大、该怪谁，就是这堂课的剧情。


    先交代一处简化：隐藏神经元的整形门取在它的线性区——输入是正数时 ReLU
    放行、输出等于输入，于是链上的计算就是纯乘法。这不是作弊：真实网络的每个神经元在当前输入附近同样近似线性，链式法则的传递结构与整形门形状无关，形状只改变每一棒要乘的局部导数（ReLU 在正区间导数恰好是 1，负区间是
    0），且可推广到任何整形门。


    损失（loss，记分牌）约定为 L = ½×(out − 目标)²。选它有两个理由：差得越远惩罚涨得越狠（平方），且处处光滑可导——分摊责任全靠对它求导；½ 会和平方求导带下来的 2 正好抵消。
  derivation: original
  canvas:
    kind: datastate
    structure: graph
    caption: 样本钉死：x=1，w1=0.5，w2=2，目标=2
    graph:
      nodes:
      - id: x
        label: x = 1
        x: 8
        y: 50
        mark: active
      - id: h
        label: h = ?
        x: 48
        y: 50
      - id: o
        label: out = ?（目标 2）
        x: 88
        y: 50
      edges:
      - from: x
        to: h
        w: ×0.5
      - from: h
        to: o
        w: ×2
    registers:
    - name: 标准答案
      value: 输入 1 时，期望输出 2
    - name: 损失定义
      value: L = ½×(out − 2)²，处处可导
  log:
  - mode: 样本
    event: 数字越小越好：每一棒责任都能亲手验算
- id: forward
  title: 前向之旅：数据从左流到右
  tldr: 1 乘 0.5 得 h = 0.5，再乘 2 得 out = 1.0；前向就是把这条乘法链老老实实走一遍，网络的「答案」出来了。
  body: >-
    前向传播（forward pass）没有机巧：数据沿链一段段往右走，每过一个旋钮乘一次，每到一个神经元整形一次。放到样本上：x = 1 乘 w1 = 0.5，隐藏神经元收到 0.5，在线性区里原样放行，h = 0.5；再乘 w2 =
    2，输出 out = 1.0。


    而标准答案是 2——输出只有目标的一半，它答错了。可调哪个、调多少，两个旋钮都有嫌疑：w1 太小让 h 先天不足，w2 太小让 h 在最后一步被压扁。只看这一次前向，分不清责任配比。


    记下前向的另一个习惯，它在最后一课会变成大账：路上每个中间数（这里是 h = 0.5）都必须存好——反向时每棒的局部导数都要用它。存中间结果，是反向传播的入场券，也是它显存开销的来源。
  derivation: original
  canvas:
    kind: datastate
    structure: graph
    caption: 前向：1 ×0.5 → h = 0.5，×2 → out = 1.0
    graph:
      nodes:
      - id: x
        label: x = 1
        x: 8
        y: 50
      - id: h
        label: h = 0.5
        x: 48
        y: 50
        mark: visited
      - id: o
        label: out = 1.0
        x: 88
        y: 50
        mark: active
      edges:
      - from: x
        to: h
        w: ×0.5
        mark: active
      - from: h
        to: o
        w: ×2
        mark: active
    registers:
    - name: 前向结果
      value: out = 1.0（目标 2，答错了）
    - name: 顺带存下
      value: 中间值 h = 0.5，反向要用
  log:
  - mode: 前向
    event: 答题完毕：错了多少由损失判定，怪谁由反向判定
- id: loss
  title: 损失：把「错」压成一个可导的数
  tldr: L = ½×(1.0 − 2)² = 0.5。记分牌只给一个总数，不指名道姓——指名道姓是反向传播的工作，而它能工作的前提是损失处处可求导。
  body: |-
    把答案和标准答案并排，损失登场：L = ½×(out − 目标)² = ½×(1.0 − 2)² = ½×1 = 0.5。这个数就是记分牌：0 表示全对，越大错得越离谱，后面几万亿次更新盯着的都是把它往下压。

    但记分牌只给总数，不给明细：它不说 w1 错了几成、w2 错了几成——它甚至不知道旋钮的存在，只知道输出与目标的距离。责任分摊偏偏必须从这一个数出发。这正是反向传播存在的理由：靠计算图的乘法结构，把责任一份份倒推出来。

    损失为什么必须可导：分摊责任靠链式法则，它要对每一段求「输入动一格、输出动几格」的局部导数。若损失坑坑洼洼（比如数错几个字这种计数式标准），导数处处为零或不存在，责任就传不下去。分类用交叉熵、回归用平方差，共同的第一要求都是造一个光滑的斜坡，让梯度滑回参数那里。
  derivation: original
  canvas:
    kind: datastate
    structure: graph
    caption: 损失只看输出端：out=1.0 对目标 2，L = 0.5
    graph:
      nodes:
      - id: x
        label: x = 1
        x: 8
        y: 50
        mark: muted
      - id: h
        label: h = 0.5
        x: 48
        y: 50
        mark: muted
      - id: o
        label: out = 1.0 → L = 0.5
        x: 88
        y: 50
        mark: active
      edges:
      - from: x
        to: h
        w: ×0.5
      - from: h
        to: o
        w: ×2
    registers:
    - name: 损失
      value: L = ½×(1.0−2)² = 0.5
    - name: 待解问题
      value: 这 0.5 的损失，两个旋钮各担多少
  log:
  - mode: 记分
    event: 总分已出，接下来从右往左逐棒追责
- id: chain-rule
  title: 链式法则：责任沿链逐棒相乘
  tldr: 旋钮影响输出要经过一段段的中转；每段的影响力是一个局部导数，总影响是各段导数连乘——这就是责任能被机械算出的全部原理。
  body: >-
    分摊工具先亮相：链式法则（chain rule）。内容一句话：一个量经过几段中转才影响最终结果，它对结果的总影响力，等于每一段的局部影响力连乘。好比两段汇率换算，总汇率是两段的乘积。


    「局部影响力」的正式名字是导数，回答的问题是——「这一段的输入动一个极小的格，它的输出动几格」。本课的链全是乘法，局部导数好算：一段「乘以 w」的局部导数就是 w 本身（输入动一格，输出动 w 格）；一段「乘上游的
    h」的局部导数就是 h。


    反向传播的动作因此确定：从损失出发，逆着数据流走，每穿过一段就乘上那一段的局部导数；走到哪个旋钮，就得到「损失对这个旋钮的梯度」——它的责任读数：动一小格，损失跟着动几格、朝哪个方向。符号定方向，大小定分量。
  derivation: original
  canvas:
    kind: datastate
    structure: graph
    caption: 责任从右往左：每穿一段，乘上那段的局部导数
    graph:
      nodes:
      - id: x
        label: x = 1
        x: 8
        y: 50
      - id: h
        label: h = 0.5
        x: 48
        y: 50
      - id: o
        label: L ← out = 1.0
        x: 88
        y: 50
        mark: active
      edges:
      - from: h
        to: o
        w: 梯度往回走 →
      - from: x
        to: h
        w: 梯度往回走 →
    registers:
    - name: 总影响力
      value: 各段局部导数连乘
    - name: 梯度的读法
      value: 旋钮动一格，损失动几格、朝哪动
  log:
  - mode: 原理
    event: 追责不需要灵感，需要的是把乘法链倒着走一遍
- id: grad-first
  title: 第一棒：输出端先自首——dL/dout = −1
  tldr: 对损失直接求导：输出动一格，损失动 −1 格；负号在说：输出再大一点，损失反而小一点——它正欠着 1 的账。
  body: |-
    反向第一棒：L = ½×(out − 2)²，对 out 求导，½ 与平方带下的 2 抵消，得 dL/dout = out − 2 = 1.0 − 2 = −1。读数：此刻把 out 抬一小格（比如 0.01），损失大约往下掉 0.01——负号说的是「输出越大、损失越小」：输出欠账，该变大。

    读法立成规矩，之后每棒都这么读：梯度 = 损失对该量的导数，读作「这个量动 +1（小格），损失动多少」。正数表示同向（它变大损失也变大，该调小），负数表示反向（该调大），绝对值是分量轻重。注意梯度只是当前点的局部斜率，只对无穷小步长精确成立，所以每步只能走一小格——学习率存在的根本原因就在这里：走大了，斜坡形状就变了，读数随之作废。

    还剩两棒把这 −1 传回旋钮：先 w2，再隔着一层 h 的 w1。距离怎样改变责任读数——这是深层网络最要命现象的种子。
  derivation: original
  canvas:
    kind: datastate
    structure: graph
    caption: 第一棒：dL/dout = out − 2 = −1
    graph:
      nodes:
      - id: x
        label: x = 1
        x: 8
        y: 50
        mark: muted
      - id: h
        label: h = 0.5
        x: 48
        y: 50
        mark: muted
      - id: o
        label: out：梯度 −1
        x: 88
        y: 50
        mark: active
      edges:
      - from: x
        to: h
        w: ×0.5
      - from: h
        to: o
        w: ×2
    registers:
    - name: dL/dout
      value: −1（输出该变大）
    - name: 读数规矩
      value: 符号定方向，大小定分量，只对小步长成立
  log:
  - mode: 反向·一
    event: 输出端欠账 1，责任开始往旋钮方向传递
- id: grad-w2
  title: 第二棒：w2 的责任 = −1 × 0.5 = −0.5
  tldr: w2 是乘在 h 上的，h = 0.5 就是它的局部导数；链乘 −1 得 −0.5：w2 往大拧，损失按每格 0.5 的速率降。
  body: >-
    第二棒走到 w2：out = h × w2，固定 h，out 对 w2 的局部导数就是 h 本身——w2 每动一格，out 就动 h 格（现在 h = 0.5，即 0.5 格）。这里用上前向存下的中间值：没有那个
    0.5，这一棒就缺了乘数。


    链式法则合拢：dL/dw2 = dL/dout × dout/dw2 = (−1) × 0.5 = −0.5。读数：w2 往上拧一格，损失以约 0.5/格的速率下降。与输出端的 −1 比，分量减半——不是 w2
    不重要，而是它的影响力被 h 的当前取值（0.5）打了折：手里握着的料只有 0.5，每格动作传到输出只剩一半。责任分摊的公平性在这里显形：分量取决于当下实际经手的影响力，不是名义位置。
  derivation: original
  canvas:
    kind: datastate
    structure: graph
    caption: 第二棒：dL/dw2 = −1 × h(0.5) = −0.5
    graph:
      nodes:
      - id: x
        label: x = 1
        x: 8
        y: 50
        mark: muted
      - id: h
        label: h = 0.5（局部导数在此）
        x: 48
        y: 50
        mark: visited
      - id: o
        label: w2 梯度 −0.5
        x: 88
        y: 50
        mark: active
      edges:
      - from: x
        to: h
        w: ×0.5
      - from: h
        to: o
        w: w2 被追责
        mark: active
    registers:
    - name: dL/dw2
      value: −0.5 = −1 × 0.5
    - name: 分量为何减半
      value: 它经手的 h 只有 0.5
  log:
  - mode: 反向·二
    event: 近端旋钮定案：w2 的责任 −0.5，方向是往大拧
- id: grad-w1
  title: 第三棒：责任穿过 h——w1 的梯度 = −2
  tldr: 先算 h 的责任：−1 × w2(2) = −2；再乘 h 对 w1 的局部导数 x = 1，得 dL/dw1 = −2——隔了一层，责任反而被下游的大旋钮放大了。
  body: >-
    第三棒穿过 h 到 w1，分两步走。先算 h 处的读数：out = h × w2，out 对 h 的局部导数是 w2 = 2，于是 dL/dh = dL/dout × w2 = (−1) × 2 = −2。读数：h
    每往上动一格，损失以 2/格的速率下降——h 的分量比输出端还重，它下游站着 w2 这只数值 2 的大旋钮，一举一动被放大两倍才到达输出。


    再走完最后一段：h = x × w1，h 对 w1 的局部导数是 x = 1，于是 dL/dw1 = dL/dh × x = (−2) × 1 = −2。本轮追责定案：w1 的责任 −2，w2 的责任 −0.5——远端的小旋钮 w1
    反而最该动，因为它下游的通道更宽。


    这一幕藏着深层网络的两大命门。其一，下游连乘的数若普遍大于 1，责任越往前传越大，梯度爆炸；普遍小于 1 则越传越小，前面的层几乎收不到信号，梯度消失——几十层网络训不起来，病根就在这串连乘里。其二，所有棒次共享中间读数（dL/dh
    只算一次就服务于 w1 的追责），这正是反向一趟能算完上亿梯度的原因，下一幕定案时会回扣。
  derivation: original
  canvas:
    kind: datastate
    structure: graph
    caption: 第三棒：dL/dh = −2，dL/dw1 = −2 × 1 = −2
    graph:
      nodes:
      - id: x
        label: x = 1（局部导数在此）
        x: 8
        y: 50
        mark: visited
      - id: h
        label: h：梯度 −2
        x: 48
