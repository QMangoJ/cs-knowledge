bridge:
  next: 一条链的责任分摊已经清楚，可语言不是一条链：词与词之间谁该听谁的，距离还各不相同。下一站给每个词装上一套可导的「按需查表」——注意力，并看 Transformer 怎样靠它把整句并行地读完。
license: CC-BY-4.0
title: 神经网络与反向传播：一次前向、一次反向之旅
summary: 神经元是一台加权求和的小机器，权重是它的旋钮；前向算出答案与损失，反向用链式法则把责任逐棒分摊回每个旋钮，梯度下降再把它们拧一小格——本课的每个数字都经过手算验证。
premise: 以最小的一条链（输入 x=1，经一个隐藏神经元，w1=0.5、w2=2，目标输出 2）为样本：走完一次前向、算出损失、一次反向分摊责任、一次更新，并验算损失确实从 0.5 降到了约 0.16。
position: >-
  本课是人工智能本科的全景第一站，位于「学习是怎么发生的」一段：后面三站（注意力、训练、推理）的一切，都建立在「模型是一大堆可以被梯度拧动的旋钮」这个地基上。学完你能对着一条两节的小链，完整手算前向、损失、三棒梯度与一次更新，并说清为什么反向传播一次反扫就能算出全部参数的梯度。
overview:
- key: 一句话总结
  value: 学习就是拧旋钮：前向出分，损失记账，反向按链式法则分摊责任，更新把每个旋钮朝少错的方向拧一小格
- key: 神经元
  value: 一台小机器：把输入逐个乘上权重（旋钮）再加总，过一道整形（激活），交出一个数
- key: 损失
  value: 唯一记分牌：本课用 ½×(输出−目标)²；它必须光滑可导，反向才算得出梯度
- key: 链式法则
  value: 责任传递的乘法链：每一棒梯度 = 下一棒梯度 × 本段的局部导数
- key: 本课算例
  value: 前向得 1.0（目标 2），损失 0.5；梯度 dL/dw2=−0.5、dL/dw1=−2；学习率 0.1 更新后损失降到约 0.16
- key: 梯度下降
  value: 沿负梯度走步长一小格：负号决定方向（让损失变小），学习率决定步子大小
- key: 规模化
  value: 反向一趟算全部梯度（与参数量无关地便宜）；前向中间结果必须存着等反向用——这是训练显存账的源头
