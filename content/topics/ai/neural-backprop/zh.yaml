    structure: graph
    caption: 第三棒：dL/dh = −2，dL/dw1 = −2 × 1 = −2
    graph:
      nodes:
      - id: x
        label: x = 1（局部导数在此）
        x: 8
        y: 50
        mark: visited
      - id: h
        label: h：梯度 −2
        x: 48
        y: 50
        mark: active
      - id: o
        label: out：梯度 −1
        x: 88
        y: 50
        mark: muted
