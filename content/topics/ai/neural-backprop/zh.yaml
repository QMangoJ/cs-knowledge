    registers:
    - name: 责任定案
      value: dL/dw1 = −2，dL/dw2 = −0.5
    - name: 命门预告
      value: 连乘大于 1 爆炸，小于 1 消失
  log:
  - mode: 反向·三
    event: 追责完毕：远端旋钮反而担最重的责任
- id: update
  title: 更新：沿负梯度，各拧一小格
  tldr: 规则 w := w − 学习率 × 梯度，学习率取 0.1：w1 从 0.5 拧到 0.7，w2 从 2 拧到 2.05——负梯度的方向就是让损失下坡的方向。
  body: |-
    动手拧旋钮。梯度下降（gradient descent）的更新规则只有一行：新值 = 旧值 − 学习率 × 梯度。学习率（learning rate）是步长，本课取 0.1。代入：w1 := 0.5 − 0.1×(−2) = 0.5 + 0.2 = 0.7；w2 := 2 − 0.1×(−0.5) = 2 + 0.05 = 2.05。两个梯度都是负的，所以都往大里拧，与逐棒读出的「都该变大」严丝合缝。

    为什么减去梯度就是对的方向：梯度指向「损失上升最快」的方向（导数在多维空间里的几何意义），负梯度自然是下降最快的方向；走一小格，损失必然变小——前提是步子足够小，让局部斜率的近似还成立。学习率定生死正在于此：太小，几万步还在半山腰；太大，一步跨过谷底，甚至发散。

    别忽略更新的同时性：两个旋钮按同一轮梯度一起拧，不是拧完一个再重算另一个。梯度是「当前配方」的责任分摊表，配方一变表就过期——所以更新必须基于同一张表整批生效，然后重新前向、重新分摊。
  derivation: original
  canvas:
    kind: datastate
    structure: graph
    caption: 更新：w1 = 0.7，w2 = 2.05（学习率 0.1）
    graph:
      nodes:
      - id: x
        label: x = 1
        x: 8
        y: 50
      - id: h
        label: h = ?
        x: 48
        y: 50
      - id: o
        label: out = ?
        x: 88
        y: 50
