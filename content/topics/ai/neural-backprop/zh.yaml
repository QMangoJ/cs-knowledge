steps:
- id: neuron
  title: 神经元具象化：一台加权求和的小机器
  tldr: 一个神经元做三件事：输入逐个乘上权重、加总、过一道整形门；权重就是旋钮，网络就是旋钮连成的网，「学习」专指拧旋钮这件事。
  body: '先把神经元从神秘里请出来。它做的事一点也不玄：拿到几个输入数，每个输入先乘上一个专属的系数，再全部加起来，最后把和送过一道固定的整形门（激活函数），输出一个数。比如两个输入 3 与 4，系数是 0.5 与 −1，加权和是 3×0.5 加 4×(−1) 等于 −2.5，整形门若用 ReLU（负数归零、正数放行），输出就是 0。

    给每个部件起个日常名字：系数叫权重（weight），它就是这台小机器的旋钮——旋钮决定这个输入在它眼里有多重要、正着听还是反着听。把成千上万台这样的小机器分层连起来，前一层的输出当后一层的输入，就是神经网络。网络的全部「知识」不在别处，就存在这些旋钮的角度里。

    于是一个根本的问题浮起来了：上亿个旋钮，初始都是随手拧的（随机初始化），网络起初只会胡说八道。谁来告诉每个旋钮该往哪边拧、拧多少？本课剩下的全部内容，就是回答这一个问题。前半程先把网络「答题」的样子看清（前向），后半程看责任怎样被算回每个旋钮头上（反向）。'
  derivation: original
  canvas:
    kind: datastate
    structure: graph
    caption: 一条最小的链：x 经 w1 到隐藏神经元 h，再经 w2 到输出
    graph:
      nodes:
      - id: x
        label: 输入 x = 1
        x: 8
        y: 50
      - id: h
        label: 隐藏 h
        x: 48
        y: 50
      - id: o
        label: 输出 out
        x: 88
        y: 50
      edges:
      - from: x
        to: h
        w: w1 = 0.5
      - from: h
        to: o
        w: w2 = 2
    registers:
    - name: 旋钮清单
      value: w1 = 0.5（x→h），w2 = 2（h→输出）
    - name: 学习的对象
      value: 不是规则，是这两只旋钮的角度
  log:
  - mode: 结构
    event: 网络的知识全在权重里，学习就是系统地拧权重
- id: specimen
  title: 样本登场：把这条链的数值钉死
  tldr: 输入 1、目标 2（老师手里的标准答案）；本课在整形门的线性区里算账，乘法结构一目了然，链式法则的每一棒都手算得出。
  body: '为了把账算到分毫不差，本课用最小的样本：一个输入 x = 1，一条链上只有两个旋钮 w1 = 0.5 与 w2 = 2，一个训练样本带着它的标准答案——目标（target）是 2，也就是说，老师希望输入 1 时网络能输出 2。现在它还做不到，差距有多大、该怪谁，就是这堂课的剧情。

    一处简化先交代清楚：隐藏神经元的整形门本课取在它的线性区——输入是正数时 ReLU 放行、输出等于输入，于是链上的计算就是纯乘法。这不是作弊：真实网络里每个神经元在当前输入附近同样有一段近似线性的局部行为，链式法则的传递结构与整形门的具体形状无关，形状只改变每一棒要乘的那个局部导数（ReLU 在正区间的导数恰好是 1，在负区间是 0）。把数字算干净之后，结构原封不动地推广到任何整形门。

    约定损失（loss，记分牌）的长相：取输出与目标之差的平方的一半，L = ½×(out − 目标)²。选它有两个理由：差得越远惩罚涨得越狠（平方），且它处处光滑可导——后面分摊责任全靠对它求导，½ 是个小体贴，它会和平方求导带下来的 2 正好抵消。'
  derivation: original
  canvas:
    kind: datastate
    structure: graph
    caption: 样本钉死：x=1，w1=0.5，w2=2，目标=2
    graph:
      nodes:
      - id: x
        label: x = 1
        x: 8
        y: 50
        mark: active
      - id: h
        label: h = ?
        x: 48
        y: 50
      - id: o
        label: out = ?（目标 2）
        x: 88
        y: 50
      edges:
      - from: x
        to: h
        w: ×0.5
      - from: h
        to: o
        w: ×2
    registers:
    - name: 标准答案
      value: 输入 1 时，期望输出 2
    - name: 损失定义
      value: L = ½×(out − 2)²，处处可导
  log:
  - mode: 样本
    event: 数字越小越好：每一棒责任都能亲手验算
- id: forward
  title: 前向之旅：数据从左流到右
  tldr: 1 乘 0.5 得 h = 0.5，再乘 2 得 out = 1.0；前向就是把这条乘法链老老实实走一遍，网络的「答案」出来了。
  body: '前向传播（forward pass）没有任何机巧：数据从输入端出发，沿着链一段段往右走，每过一个旋钮乘一次，每到一个神经元整形一次。放到样本上：x = 1 乘 w1 = 0.5，隐藏神经元收到 0.5，在线性区里原样放行，h = 0.5；再乘 w2 = 2，输出 out = 1.0。

    前向走完，网络交出了它的答案：1.0。而老师的标准答案是 2。它答错了——而且错法很具体：输出只有目标的一半。日常直觉会说「那就把哪个旋钮调大一点」，可到底调哪个、调多少，两个旋钮都有份嫌疑：w1 太小会让 h 先天不足，w2 太小会让 h 在最后一步被压扁。只看这一次前向，你分不清责任配比。

    记下前向的另一个习惯，它在最后一课会变成大账：前向路上算出的每个中间数（这里是 h = 0.5）都必须先存好——反向分摊责任时，每一棒的局部导数都要用到当段的输入值。存中间结果，是反向传播的入场券，也是它显存开销的来源。'
  derivation: original
  canvas:
    kind: datastate
    structure: graph
    caption: 前向：1 ×0.5 → h = 0.5，×2 → out = 1.0
    graph:
      nodes:
      - id: x
        label: x = 1
        x: 8
        y: 50
      - id: h
        label: h = 0.5
        x: 48
        y: 50
        mark: visited
      - id: o
        label: out = 1.0
        x: 88
        y: 50
        mark: active
      edges:
      - from: x
        to: h
        w: ×0.5
        mark: active
      - from: h
        to: o
        w: ×2
        mark: active
    registers:
    - name: 前向结果
      value: out = 1.0（目标 2，答错了）
    - name: 顺带存下
      value: 中间值 h = 0.5，反向要用
  log:
  - mode: 前向
    event: 答题完毕：错了多少由损失判定，怪谁由反向判定
- id: loss
  title: 损失：把「错」压成一个可导的数
  tldr: L = ½×(1.0 − 2)² = 0.5。记分牌只给一个总数，不指名道姓——指名道姓是反向传播的工作，而它能工作的前提是损失处处可求导。
  body: '把答案和标准答案并排，损失登场：L = ½×(out − 目标)² = ½×(1.0 − 2)² = ½×1 = 0.5。这个数就是记分牌：0 表示全对，越大错得越离谱，后面几万亿次更新盯着的都是把它往下压。

    注意记分牌的克制：它只给总数，不给明细。它不说 w1 错了几成、w2 错了几成——它甚至不知道旋钮的存在，它只知道输出与目标的距离。然而责任分摊偏偏又必须从这一个数出发。这正是反向传播存在的理由：从唯一的一个总分出发，靠计算图自身的乘法结构，把每个旋钮的责任一份份倒推出来。

    损失为什么必须可导，此时可以说透：分摊责任的方法是微积分的链式法则，它要对每一段关系求「输入动一格、输出动几格」的局部导数。若损失长得坑坑洼洼（比如数错几个字这种计数式标准），导数处处为零或不存在，责任就传不下去。所以分类任务用交叉熵、回归任务用平方差，背后共同的第一要求都是：造一个光滑的斜坡，让梯度能一路滑回参数那里。'
  derivation: original
  canvas:
    kind: datastate
    structure: graph
    caption: 损失只看输出端：out=1.0 对目标 2，L = 0.5
    graph:
      nodes:
      - id: x
        label: x = 1
        x: 8
        y: 50
        mark: muted
      - id: h
        label: h = 0.5
        x: 48
        y: 50
        mark: muted
      - id: o
        label: out = 1.0 → L = 0.5
        x: 88
        y: 50
        mark: active
      edges:
      - from: x
        to: h
        w: ×0.5
      - from: h
        to: o
        w: ×2
    registers:
    - name: 损失
      value: L = ½×(1.0−2)² = 0.5
    - name: 待解问题
      value: 这 0.5 的损失，两个旋钮各担多少
  log:
  - mode: 记分
    event: 总分已出，接下来从右往左逐棒追责
- id: chain-rule
  title: 链式法则：责任沿链逐棒相乘
  tldr: 旋钮影响输出要经过一段段的中转；每段的影响力是一个局部导数，总影响是各段导数连乘——这就是责任能被机械算出的全部原理。
  body: '分摊工具先亮相：链式法则（chain rule）。它的内容一句话：若一个量经过几段中转才影响到最终结果，它对结果的总影响力，等于每一段的局部影响力连乘。好比汇率换算：人民币换美元再换欧元，总汇率是两段汇率的乘积，与中间在哪个柜台换的无关。

    「局部影响力」有正式名字：导数。它回答的问题极具体——「这一段的输入动一个极小的格，它的输出动几格」。本课的链全是乘法，局部导数好算得不像话：一段「乘以 w」的局部导数就是 w 本身（输入动一格，输出动 w 格）；一段「乘上游的 h」的局部导数就是 h。平方损失的导数在下一棒现场算。

    反向传播的动作因此确定了：从损失出发，逆着数据流的方向走，每穿过一段就乘上那一段的局部导数，走到哪个旋钮，就得到了「损失对这个旋钮的梯度」——也就是这个旋钮的责任读数：它动一小格，损失会跟着动几格、朝哪个方向动。梯度的符号定方向，大小定分量。下面三棒，一棒一棒地算。'
  derivation: original
  canvas:
    kind: datastate
    structure: graph
    caption: 责任从右往左：每穿一段，乘上那段的局部导数
    graph:
      nodes:
      - id: x
        label: x = 1
        x: 8
        y: 50
      - id: h
        label: h = 0.5
        x: 48
        y: 50
      - id: o
        label: L ← out = 1.0
        x: 88
        y: 50
        mark: active
      edges:
      - from: h
        to: o
        w: 梯度往回走 →
      - from: x
        to: h
        w: 梯度往回走 →
    registers:
    - name: 总影响力
      value: 各段局部导数连乘
    - name: 梯度的读法
      value: 旋钮动一格，损失动几格、朝哪动
  log:
  - mode: 原理
    event: 追责不需要灵感，需要的是把乘法链倒着走一遍
- id: grad-first
  title: 第一棒：输出端先自首——dL/dout = −1
  tldr: 对损失直接求导：输出动一格，损失动 −1 格；负号在说：输出再大一点，损失反而小一点——它正欠着 1 的账。
  body: '反向第一棒站在损失与输出之间。L = ½×(out − 2)²，对 out 求导，½ 与平方带下的 2 抵消，得 dL/dout = out − 2 = 1.0 − 2 = −1。这就是输出端的责任读数：此刻把 out 往上抬一小格（比如 0.01），损失大约会往下掉 0.01——负号精确描述了「输出越大、损失越小」的当前局势：输出欠账，它应该变大。

    把读数的方法立成规矩，之后每棒都这么读：梯度 = 损失对该量的导数，读作「这个量动 +1（小格），损失动多少」。正数表示同向（它变大损失也变大，该把它调小），负数表示反向（该把它调大），绝对值是分量轻重。注意梯度是当前点的局部斜率：它只对无穷小的步长精确成立，所以更新时每步只能走一小格——学习率存在的根本原因就在这里，走大了，斜坡的形状就变了，读数随之作废。

    还剩两棒要把这 −1 传回旋钮：先看离得近的 w2，再看隔着一层 h 的 w1。你会看到距离怎样改变责任的读数——这正是深层网络里最要命的现象的种子。'
  derivation: original
  canvas:
    kind: datastate
    structure: graph
    caption: 第一棒：dL/dout = out − 2 = −1
    graph:
      nodes:
      - id: x
        label: x = 1
        x: 8
        y: 50
        mark: muted
      - id: h
        label: h = 0.5
        x: 48
        y: 50
        mark: muted
      - id: o
        label: out：梯度 −1
        x: 88
        y: 50
        mark: active
      edges:
      - from: x
        to: h
        w: ×0.5
      - from: h
        to: o
        w: ×2
    registers:
    - name: dL/dout
      value: −1（输出该变大）
    - name: 读数规矩
      value: 符号定方向，大小定分量，只对小步长成立
  log:
  - mode: 反向·一
    event: 输出端欠账 1，责任开始往旋钮方向传递
- id: grad-w2
  title: 第二棒：w2 的责任 = −1 × 0.5 = −0.5
  tldr: w2 是乘在 h 上的，h = 0.5 就是它的局部导数；链乘 −1 得 −0.5：w2 往大拧，损失按每格 0.5 的速率降。
  body: '第二棒走到 w2。w2 在输出公式里站在乘法的位置：out = h × w2。固定 h 不看，out 对 w2 的局部导数就是 h 本身——因为 w2 每动一格，out 就动 h 格（现在 h = 0.5，所以 out 动 0.5 格）。这里正好用上前向时存下的中间值：没有那个 0.5，这一棒就缺了乘数。

    链式法则合拢：dL/dw2 = dL/dout × dout/dw2 = (−1) × 0.5 = −0.5。读数：w2 若往上拧一格，损失以约 0.5/格的速率下降。它和输出端的 −1 比起来分量减半——不是 w2 不重要，而是它的影响力被 h 的当前取值（0.5）打了折：手里握着的料只有 0.5，它的每格动作传到输出时只剩一半。责任分摊的公平性在这里显形：分量取决于你当下实际经手的影响力，不是名义位置。'
  derivation: original
  canvas:
    kind: datastate
    structure: graph
    caption: 第二棒：dL/dw2 = −1 × h(0.5) = −0.5
    graph:
      nodes:
      - id: x
        label: x = 1
        x: 8
        y: 50
        mark: muted
      - id: h
        label: h = 0.5（局部导数在此）
        x: 48
        y: 50
        mark: visited
      - id: o
        label: w2 梯度 −0.5
        x: 88
        y: 50
        mark: active
      edges:
      - from: x
        to: h
        w: ×0.5
      - from: h
        to: o
        w: w2 被追责
        mark: active
    registers:
    - name: dL/dw2
      value: −0.5 = −1 × 0.5
    - name: 分量为何减半
      value: 它经手的 h 只有 0.5
  log:
  - mode: 反向·二
    event: 近端旋钮定案：w2 的责任 −0.5，方向是往大拧
- id: grad-w1
  title: 第三棒：责任穿过 h——w1 的梯度 = −2
  tldr: 先算 h 的责任：−1 × w2(2) = −2；再乘 h 对 w1 的局部导数 x = 1，得 dL/dw1 = −2——隔了一层，责任反而被下游的大旋钮放大了。
  body: '第三棒要穿过 h 才能到 w1，分两步走。先算责任在 h 处的读数：out = h × w2，out 对 h 的局部导数是 w2 = 2，于是 dL/dh = dL/dout × w2 = (−1) × 2 = −2。读数：h 每往上动一格，损失以 2/格的速率下降——h 的分量比输出端还重，因为它下游站着 w2 这只数值 2 的大旋钮，它的一举一动被放大两倍才到达输出。

    再走完最后一段：h = x × w1，h 对 w1 的局部导数是 x = 1，于是 dL/dw1 = dL/dh × x = (−2) × 1 = −2。本轮追责全部定案：w1 的责任 −2，w2 的责任 −0.5——远端的小旋钮 w1，反而是本轮最该动的那个，因为它下游的通道更宽。

    把这一幕放大看，它藏着深层网络的两大命门。其一，下游连乘的数若普遍大于 1，责任越往前传越大，梯度爆炸；普遍小于 1 则越传越小，前面的层几乎收不到信号，梯度消失——几十层的网络训不起来，病根就在这串连乘里。其二，所有棒次共享中间读数（dL/dh 只算一次就同时服务于 w1 的追责），这正是反向一趟能算完上亿梯度的原因，下一幕定案时会回扣。'
  derivation: original
  canvas:
