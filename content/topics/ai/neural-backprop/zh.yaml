        to: h
        w: w1 = 0.7（+0.2）
        mark: active
      - from: h
        to: o
        w: w2 = 2.05（+0.05）
        mark: active
    registers:
    - name: 更新式
      value: w := w − 0.1 × 梯度
    - name: 纪律
      value: 同一轮梯度，整批同时生效
  log:
  - mode: 更新
    event: 第一轮学习完成，旋钮各就各位，等待验算
- id: verify
  title: 验算：再走一次前向，损失 0.5 → 约 0.16
  tldr: 新配方前向：h = 0.7，out = 1.435，损失 = ½×(1.435−2)² ≈ 0.16——一轮学习，错误被砍掉三分之二，这就是「学会了一点」的全部含义。
  body: |-
    不验算的学习是自欺。用新旋钮再走一次前向：h = 1 × 0.7 = 0.7；out = 0.7 × 2.05 = 1.435。新损失 L = ½×(1.435 − 2)² = ½×(0.565)² = ½×0.319 ≈ 0.16。对比第一轮的 0.5：一次更新，损失降到原来的三分之一，输出从 1.0 向目标 2 靠近了一大步——开头的所有数字到这里全部对得上账。

    训练（training）就是这个四幕循环的无尽重复——前向出答案、损失记账、反向分摊、更新旋钮——换着样本（随机梯度下降里的「随机」，指每轮抽一小批样本来算梯度）、重复亿万次，损失被一格一格压低，网络从胡说八道慢慢变成对答如流。大模型训练日志里跳动的 loss，就是本课这个 0.5 在更大规模上的同名亲戚。

    两处规模化的问题留给后两站：旋钮上亿、链长上百层时，这一轮的账会膨胀成什么样；答题时这条链又该怎么跑得快。本课先收束一个地基性的结论：可训练的系统 = 一个巨大的可导函数，加上一台把梯度算回每个参数的机器。
  derivation: original
  canvas:
    kind: datastate
    structure: graph
    caption: 验算：out = 1.435，L ≈ 0.16，确实学到了
    graph:
      nodes:
      - id: x
        label: x = 1
        x: 8
        y: 50
      - id: h
        label: h = 0.7
        x: 48
        y: 50
        mark: visited
      - id: o
        label: out = 1.435，L ≈ 0.16
        x: 88
        y: 50
        mark: found
      edges:
      - from: x
        to: h
        w: ×0.7
      - from: h
        to: o
        w: ×2.05
    registers:
    - name: 损失轨迹
      value: 0.5 → ≈0.16（一轮更新）
    - name: 训练全貌
      value: 四幕循环 × 亿万轮 × 海量样本
  log:
  - mode: 验算
    event: 数字全部对账：这就是机器「学习」时真正在发生的事
minutes: 26
prereq:
- math/probability
objectives:
- 用一句话说清神经元、权重、损失各自是什么，并给出前向的计算顺序
- 对本课的算例完整手算三棒梯度，并解释每棒的局部导数从何而来
- 说清梯度下降的更新式中负号与学习率各自的作用
- 解释反向传播为何一趟能算出全部参数的梯度，以及前向为何必须保存中间值
aiLink: 你平时刻意练习时的大脑回路与此惊人地相似：先做一遍（前向）、对照答案看差多少（损失）、复盘每一步错在哪（反向分摊）、针对性改一点（更新）——区别只是大脑的旋钮不用梯度来拧。
design:
- mechanism: 为什么整个学习信号只来自一个损失数字
  problem: 上亿个旋钮每个都需要「往哪拧、拧多少」的指令，而人类写不出逐旋钮的规则——规则若能写出来，就不需要学习了。系统只能自己从结果里导出每个参数的修改意见，而结果唯一可度量的形态，就是一个表示好坏的数。
  choice: 把「好坏」压缩成一个光滑可导的标量损失，再让链式法则把这一个数的影响力分解回每个参数。损失定义什么，模型就只学什么——分类用交叉熵、生成用下个词的预测误差，都是这条流水线的入口选择。
  tradeoff: 代价是指标即命运：损失没量到的东西模型一概不学，量歪的东西会被学得格外起劲。数据里的偏见、标注里的噪声，都会被这台优化机器原样放大，这是后来一切对齐与数据治理问题的总源头。
  root: 根子在优化的数学本质：要在亿维空间里改进一个函数，可规模化的唯一通用货币就是梯度。把评价压成可导标量，是给优化机器准备它唯一能吃的口粮——丰富反馈不是没人想给，而是无法逐参数地分摊。
- mechanism: 为什么反向传播一趟就能算出全部梯度，而不是逐个旋钮去试
  problem: 根本约束是逐个试探的成本：若每求一个旋钮的梯度就把整个网络重跑一遍（数值微分），上亿参数意味着上亿次前向，训练一天也走不完一步。梯度必须以接近一次前向的成本整批获得，否则深度学习在计算上直接破产。
  choice: 反向传播：把计算图从输出端倒着走一遍，每段的局部导数只算一次，每个中间读数（如本课的 dL/dh）被所有上游旋钮共享。责任沿链连乘、摊销复用，本质上是把链式法则做成一次动态规划式的反扫。
  tradeoff: 代价记在显存上：反扫用的局部导数依赖前向中间值，所以前向算出的一切激活都必须存着等反向用，网络越深、批量越大，这笔存储越吓人——训练显存的大头正是从这里来的。
  root: 根子在链式法则的链结构本身：总导数是各段导数的连乘，而连乘天然可以从尾到头逐段折叠，每折叠一步的结果都被更上游复用。反向传播不是技巧发明，而是这个数学结构自带的摊销性质——自动微分框架做的，就是在任意计算图上自动完成这件事。
- mechanism: 为什么更新只能走小步：学习率是这台机器的生死参数
  problem: 梯度只是当前点的局部斜率：它精确描述的只是无穷小邻域内的地形，步子一旦迈大，实际地形早已不是读数那副模样——可能越过谷底冲上更高的坡，也可能在峡谷两壁之间反复弹跳乃至发散。
  choice: 做法是小步迭代，并把步长做成可调的学习率，在训练中按计划衰减（初期大步找方向，后期小步收尾）。围绕它长出一整套工艺：预热、余弦衰减、梯度裁剪，都是在给「局部读数只在小范围成立」打补丁。
  tradeoff: 代价是训练成为一门调参手艺：学习率没有普适最优值，换模型、换数据都要重调；太小则时长与电费爆炸，太大则直接训崩。它与批量大小互相牵制，是训练工程师的第一道手感门槛。
  root: 根子在用一阶信息走高维非凸地形的先天局限：我们只有脚下这一点的斜率，没有地形图，也没有解析解。梯度下降的全部尊严与毛病都来自这句「只看脚下」——它便宜到可以跑亿万步，也盲目到必须步步为营。
terminal:
- cmd: python3 -c "w1,w2,x,t,lr=0.5,2.0,1.0,2.0,0.1; h=x*w1; o=h*w2; L=0.5*(o-t)**2; d_o=o-t; d_w2=d_o*h; d_w1=d_o*w2*x;
    w1-=lr*d_w1; w2-=lr*d_w2; h2=x*w1; o2=h2*w2; print(L, 0.5*(o2-t)**2)"
  note: 把本课算例敲进解释器：应打印 0.5 与约 0.16，亲手对一次账
