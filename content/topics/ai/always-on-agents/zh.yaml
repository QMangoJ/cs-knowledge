objectives:
- 说清 run 与 session 的区别，并解释「始终在线」为什么是使用体验而不是进程状态
- 复述收件箱三件套与单活跃 worker 的理由，并走查连发三条消息被合并成一次运行的账
- 区分跟进与日程两类计时器，并说清各自到期后状态怎样变化
- 按四类列出该存进记忆的内容，并说清什么东西只存指针不存副本
- 解释凭证代理、auto mode 与延后执行的工具调用各自挡住的是哪一种风险
aiLink: 你手机上的消息与邮件 App 早就是这个形状：推送到达才唤醒进程、处理完立刻被系统挂起，电池与流量都只花在真正干活的那几秒——「常驻」在移动端与服务端是同一套收件箱加计时器的把戏。
design:
- mechanism: 为什么一切触发都要先落进持久化收件箱，而不是直调 agent 或养一个常驻进程
  problem: 触发源是并发且不可靠的：webhook 会重试、用户会连发、进程会崩。直调让每个来源直接启动运行，两个同时到达的事件就会撞出两轮互不知情、可能互相覆盖的运行，进程在处理中途崩溃还会把事件无痕丢掉；而养常驻进程空等，又要在无事可做的时间里持续占着资源。
  choice: 在一切来源与 agent 之间垫一层持久化队列：事件先落表并按来源唯一标识去重，单个 worker 按「领取—运行—标记完成」的节奏消费；常驻性由队列与 worker 的存续来保证，模型本身只在有事件时被唤醒。可靠性来自顺序：先把「发生过」写进持久存储，再谈「处理它」。
  tradeoff: 代价是多了一跳的延迟与一整套队列的运维，还要接受单 worker 的串行：吞吐上限被单个用户的事件串行性锁住，只能靠按用户拆分收件箱把并行赎回来；处理语义也降为至少一次，重复投递的副作用要靠去重与幂等在上层消化。
  root: 根子在生产者与消费者解耦这道最老的题上：事件源与运行的速度、存亡、并发模型全不相同，中间必须有一块谁死了都不丢数据的缓冲带。这与中断先记账后处理、消息队列削峰、数据库先写日志后改数据页共享同一条原理——凡是要可靠地跨过时间与故障传递的事实，都得先落盘。
- mechanism: 为什么记忆要独立外存、只收查不到的东西，且与会话历史分开放
  problem: 运行之间不共享任何内存，会话历史又是按长度计价且会被压缩丢细节的易失载体：把连续性寄托在会话里，等于把档案写在草稿纸上；反过来若把一切都往记忆里抄，副本会过期打架，且每次运行都要为这堆副本再付一遍加载费。
  choice: 给记忆一块比任何运行都长寿的独立存储，按指令、笔记、已告知内容、任务进度四类分开；准入纪律是以后查不到的才存，已有权威出处的只存指针；组织上索引常驻、细节按需，让每轮必付的固定开销保持最小。
  tradeoff: 代价是一整套写读纪律与维护成本：记漏了会失忆、记错了会跨运行反复犯错，还要再养一层 dreaming 定期清理；索引加细文件的两级结构也比单个大文件复杂，出错面更大。
  root: 根子是存储层次的老权衡在 agent 身上的投影：上下文窗口是寄存器级的最贵存储，外部记忆是磁盘级的廉价持久层，中间隔着会话这层缓存。设计问题从来不是存哪里最方便，而是说什么配得上每次都付全价的加载成本——与虚拟内存把冷页换出、数据库把热数据留在缓冲池，是同一道题的三个版本。
- mechanism: 为什么权限要把凭证与批准都移出 agent 的运行循环
  problem: 常驻运行握着用户的完整权限且无人盯场，风险结构与有人值守时完全不同：凭证一旦进入运行环境，就可能随日志、上下文与被注入的提示一起泄露；而每个动作都同步等用户批准，又会让循环被一次几小时的等待冻结——安全与活性在这里直接对撞。
  choice: 两招一起上：凭证由运行环境之外的代理在请求发出时注入，模型物理上接触不到真值；批准则改成延后执行的工具调用——运行先结束、会话在中途存档，答复日后作为普通事件回来续上，等待被外化成队列里的一条记录而不是占着执行流的阻塞。
  tradeoff: 代价是代理与分类器成为新的故障点与延迟源，被延后的任务完成时间不可控，会话中途状态的存档与恢复也显著抬高实现门槛；分类器阈值偏保守还会带来误拦的摩擦，需要长期用评测校准。
  root: 根子在两条系统设计律的合成上：其一是最小权限不能靠自律，只能靠物理隔离——拿不到的东西不可能泄露；其二是等待不能占用执行资源——操作系统把阻塞进程换下 CPU、把就绪事件放回队列，延后调用只是把同一条律搬到 agent 层。安全边界与调度纪律，本来就是同一件事的两面。
steps:
- id: not-always-on
  title: 「常在线」是一种体验：休眠、唤醒与一次运行
  tldr: 常驻 agent 并不是一个不睡觉的进程：它大部分时间休眠，被事件唤醒后完成一次运行（run）、把发生的事存下来再睡回去；始终在线描述的是用户感受，不是模型的运行状态。
  body: |-
    先用一个比方立住画面：它像住在值班室的守夜人。再负责的守夜人也不是整夜睁眼盯着大门，而是睡在门边——有人敲门就起来处理，处理完登记一笔，再回去睡。「始终在线」卖的是「随时敲门都有人应」这个体验，不是「有人一直醒着」这个状态。原文开篇就点破：这类 agent 其实并不 always on，在线只是对使用体验的描述。

    把循环拆开看：每一段工作叫一次运行（run）——收到一个事件、完成任务、把发生过的事存下来。运行发生在一个会话（session）里，会话就是消息与工具调用的记录；续上旧工作的事件回到原会话，其他事件新开会话。运行一结束，agent 重新休眠，循环无限重复。注意它的定义是双份的：既有状态（跨会话管得住上下文）、又会主动做事（没人盯着时自己行动）。而底层干活的，仍是和普通 agent 相同的核心循环——模型看上下文、调工具、读结果、再决策；真正的差别全在外围：什么能唤醒它、哪些状态跨运行保留、结果怎样交到用户手里。

    为什么近来才值得做？原文给了两个理由。一是模型的判断力变好：更能理解用户意图，也更清楚什么时候该停下来确认——无人值守时，这一点决定生死。二是智能在变便宜，长周期任务受益最大：原文报告，在一项长周期编程基准上，新一代模型每解出一道题的成本比上一代低 78%，在典型负载上低 40%（均为 Anthropic 自报数字，口径是厂商自己的基准，不宜直接对外横比）。判断力与价格两件事凑齐，「养一个常驻 agent」才从烧钱变成划算。
  derivation: original
  sources:
  - ref: anthropic-always-on-agents
    locator: 开头与 The cycle behind the always-on agent 一节
    claim: 常驻 agent 的定义是既有状态又会主动行事；它并非真的常开，而是大部分时间休眠、被唤醒后完成一次 run 并存档再休眠；原文报告 Opus 5.5 在一项长周期编程基准上每解一题成本比 Opus 5 低 78%、典型负载低 40%（Anthropic 自报）
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-15
  canvas:
    kind: swimlane
    actors:
    - lane: user
      id: u
      label: 用户：随时敲门都有人应
    - lane: agent
      id: a
      label: Agent：休眠 → 被唤醒 → 一次 run → 存档 → 再睡
      highlight: true
    messages:
    - id: m1
      from: u
      to: a
      label: 在线是体验，不是进程状态
