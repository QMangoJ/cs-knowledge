title: 常驻 Agent 的外围架构：收件箱、计时器、记忆、权限与发件箱
summary: 模型只会「被叫一次、答一次」；让它像个 7×24 在岗的员工，要在模型外面围一圈事件驱动的架构：事件先落进持久化的收件箱由单个 worker
  领取，计时器负责到点自唤醒，记忆只存查不到的东西、靠它保持多次运行之间的连续性，权限把凭证与批准都挡在循环之外，发件箱只交结果不直播过程。
premise: 以一个替你盯邮箱与日程的助理 agent 为样本：走完「用户连发三条消息被合并成一次运行」与「运行给自己定下 24 小时跟进、次日准时自唤醒」两条链路，看清五部件各自在防哪种翻车。
position: 本课是人工智能科新板块「从模型到常驻系统：Agent 的外围架构」的唯一一课，也是全科的系统层收官：前四课讲的全是模型内部的账——怎样学、怎样组织、训与用各花多少钱；本课把镜头拉到模型之外，看它被装进一个长期无人值守的系统时，外围必须补齐的五部件。学完你能走查一条事件从收件箱到发件箱的完整旅程，并把每个部件对回消息队列、调度与持久化这些你在其他科见过的老问题。
bridge:
  prev: 上一课算清了「答一次」的成本结构：prefill 与 decode、KV 缓存与带宽，回答的是一个模型被调用一次时发生什么。但产品里的 agent 不是答完就消失的函数：它要在没人说话时记得住事、到点了能自己醒来、无人盯着时也不乱来。这一课换一个尺度——从单次推理走到长期运行，看同一套模型被围上哪五部件之后，才从「一次调用」变成「一个常驻的系统」。
overview:
- key: 一句话总结
  value: 常驻感来自外围架构而非模型本身：事件先排进收件箱等着被领取、计时器到点了把 agent 唤醒、状态存到单次运行之外的地方长期保留、凭证和批准都不放进 agent 的循环里、做完只把结果汇总发给用户——五部件把一次次短暂的推理缝成持续在岗
- key: 运行与会话
  value: run 是一次被唤醒后干活的段落，session 是消息与工具调用的记录；agent 大部分时间在休眠，token 只在 run 里花
- key: 收件箱
  value: 一切触发先落进持久化队列再被单个 worker 领取，并做到快速确认、按来源唯一标识去重、连发消息合并成一次运行。这样安排是因为触发来源并不可靠，webhook 会重试、用户会连发、进程会崩，先把事件写进持久存储，崩溃重启后也不会把发生过的事弄丢。
- key: 计时器
  value: 跟进是给自己定的截止时间，日程是固定节奏的周期任务；调度器轮询到期项，往收件箱投事件
- key: 记忆
  value: 只存以后查不到的东西，已在别的系统里的只存指针；指令、用户笔记、已告知内容、任务进度四类分开存。比如一条工单的状态已经记在工单系统里，记忆里只留一个指向它的编号就够了，存一份副本反而会和原文对不上。
- key: 权限
  value: 凭证由运行环境之外的代理在发请求时注入；高风险动作过分类器；要人拍板时把工具调用延后挂起，不卡死循环。这三招分别挡的是不同的风险，也就是凭证被 agent 本身拿到后滥用、危险动作无人过目就执行、以及等批准时把整轮运行一直占着。
- key: 发件箱
  value: 一次运行只交结果不推过程；多数场景一个发送工具就够，需要控节奏或失败恢复时才上正式发件箱加分发进程
