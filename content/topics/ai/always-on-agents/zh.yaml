      to: s
      label: 查得到的只留指针，查不到的才落盘
      active: true
    registers:
    - name: 入选标准
      value: 以后查不到的才存
    - name: 已有出处
      value: 只存指针，不抄副本
  log:
  - phase: 原则
    event: 记忆是跨运行的接力棒，不是第二个数据库
- id: memory-cost-dreaming
  title: 每次唤醒的入场费：加载成本、会话取舍与 dreaming
  tldr: 每次运行开工前都要把系统提示、工具定义与记忆文件装进上下文，这笔固定开销每轮必付、要尽量瘦身并用提示缓存压价；会话太长时压缩旧消息或新开会话，两者都丢细节，所以要留的信息必须趁早写进记忆；此外再加一层 dreaming，定期回看旧会话清理过期条目、提炼跨运行才看得出的规律。
  body: |-
    连续性不是免费的。每次运行做任何工作之前，都要先加载系统提示、工具定义与记忆文件——这笔初始上下文开销（原文称之为 overhead）每一轮都要付一遍。所以它必须精简，并用提示缓存（prompt caching）压价：让每轮都相同的那段前缀便宜下来，这与推理课里 KV 缓存的思路同源——不变的前缀，不该每轮都付全价。新会话的开局只有这笔开销加上触发事件；续上的旧会话还要额外带回此前运行的消息与工具调用，账更重。

    会话不能无限长：太长时有两条路——压缩（compact）较早的消息成摘要，或干脆新开一段会话。两条路都会丢细节。由此得出一条纪律：任何需要长期保留的信息，都不能只活在会话里，必须在运行过程中顺手写进记忆。会话是草稿纸，记忆才是档案柜；把草稿纸当档案柜用，丢的迟早是重要的那一页。

    最后还有一层不在运行内的维护，原文称之为 dreaming：回看过去的会话，替换已经过期的记忆条目，并找出只有跨很多次运行才浮现的规律——比如某个偏好在五次对话里各露了一角，单看哪一轮都成不了结论。它很像人睡眠时整理记忆，这也是得名的由来：记忆只写不理，迟早长成垃圾场，dreaming 就是给记忆定的定期清扫。
  derivation: original
  sources:
  - ref: anthropic-always-on-agents
    locator: Memory 一节的 Inside the context window 小节与 dreaming 段
    claim: 每次运行都要先加载系统提示、工具定义与记忆文件，这笔固定开销每轮都有，应保持精简并用提示缓存降本；会话过长时可压缩旧消息或新开会话，两者都会丢细节，故需持久化的信息应存进记忆；dreaming 回看旧会话清理过期条目并找跨运行规律
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-15
  canvas:
    kind: swimlane
    actors:
    - lane: agent
      id: a
      label: 每轮开工：先付一笔固定加载费
      highlight: true
    - lane: store
      id: s
      label: 记忆：dreaming 在运行之外定期清扫
    messages:
    - id: m1
      from: a
      to: s
      label: 要留的趁早写进档案柜，别只留在草稿纸上
      active: true
    registers:
    - name: 入场费
      value: 系统提示 + 工具定义 + 记忆文件，每轮必付
    - name: 会话处置
      value: 压缩或新开，都丢细节
  log:
  - phase: 成本
    event: 连续性每轮都在收费：为昨天的记忆付加载费
- id: permissions
  title: 权限：无人值守时，风险最大的一环
  tldr: 一次运行握着用户的访问权限、又没人盯着：每次工具调用都要在自行继续、拦下、等批准三者里选一个。原文给了三件套：凭证由运行环境之外的代理注入、auto mode 用分类器审高风险动作、拿不准的调用延后等用户拍板。
  body: |-
    权限是常驻 agent 风险最大的部分，原因在它的定义里：一次运行握着用户的访问权限，而它本来就是在没人看着的时候工作。每次调用工具，agent 都要决定是自己继续、直接拦下，还是等人批准。用到的组件与其他 agent 并无不同，原文特别强调了三种做法。

    第一是凭证保管。有用的常驻 agent 经常需要密码或访问令牌。推荐的格局是在 agent 的运行环境之外放一个代理：agent 发出的请求里不带真实凭证，代理在转发前把凭证注入进去。这样凭证永远不进模型的上下文——不会被写进日志、不会被提示注入套出来。安全不靠「模型自觉不泄露」，靠「它物理上拿不到」。这与 Agent SDK 里凭证隔离的建议一致。

    第二是 auto mode（自动模式）。常驻 agent 不能每一步都等人点头；Claude Code 的 auto mode 用一个分类器审查风险较高的操作，拦下它判断为危险的那些，让模型改走更稳妥的路。但它的定位要摆正：分类器是减负的过滤器，不是责任的承担者——最重要的决定，原文明确说仍须留给人看。

    第三件是延后执行的工具调用，留给下一课细讲。三件合起来看，权限系统的本体就是给每次工具调用做三选一：放行、拒绝、还是挂起问用户——前两件套划的是放行与拒绝的边界，第三件决定「挂起」怎样不拖垮系统。
  derivation: original
  sources:
  - ref: anthropic-always-on-agents
    locator: Permissions 一节
    claim: 推荐的凭证模式是把代理放在 agent 运行环境之外、由它向外发请求时注入真实凭证，agent 自己发出的请求不带凭证；auto mode 用分类器审查高风险操作并拦下危险项，但最重要的决定仍需用户审查
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-15
  canvas:
    kind: swimlane
    actors:
    - lane: agent
      id: a
      label: 每次工具调用：继续、拦下、还是等批准
    - lane: store
      id: s
      label: 凭证代理在环境之外：转发时才注入真凭证
      highlight: true
    messages:
    - id: m1
      from: a
      to: s
      label: 请求不带凭证出门，秘密不进上下文
      active: true
    registers:
    - name: 凭证位置
      value: 运行环境之外，代理注入
    - name: 分类器定位
      value: 过滤器，不是责任人
  log:
  - phase: 风险
    event: 无人值守放大的不是能力，是权限的暴露面
- id: deferred-calls
  title: 延后执行的工具调用：要批准，但别卡死
  tldr: 某些动作必须等用户补信息或拍板：与其让运行原地阻塞干等，不如把这次工具调用延后——当前运行结束、会话在调用中途被存下，请求递到用户面前；答复日后作为一条新事件回到收件箱，新运行把会话续上接着走，其间 worker 照常处理别的事件。
  body: |-
    先看朴素做法为什么不行。若运行在调用中途同步等待用户，这个等待可能长达几小时甚至几天——这段时间里，这段会话、这个 worker 都被一个人的一次犹豫冻结了。事件一多，这种冻结就是系统的主要死法。它和操作系统里「进程阻塞等 I/O 时必须把 CPU 让出来」是同一道题：等待者不能占着执行资源不放。

    延后的做法是把「等」外化成状态。在 Claude Code 里，可以用 hook 先把某次工具调用搁下、等用户补充信息；同样的模式搬到常驻 agent：调用被延后时，当前运行结束，会话停在这次调用的中途并保持可恢复；请求递到用户面前（原文举了用交互卡片呈现的例子）。用户的答复回来时，它走的不是什么特殊通道——就是收件箱里的一条普通事件；新运行领取它，把存下的会话恢复到那次调用的位置，带着用户的输入继续。而在等待期间，worker 可以去处理其他事件，agent 整体并没有被这一次等待阻塞。

    代价也要说清：被延后的任务，完成时间从此不可控，取决于用户什么时候回；会话中途状态必须完整可存、可准确恢复，对实现的要求比无状态调用高一截。但比起「整个 agent 挂起干等点击」，这是把不可控关进单个任务里，而不是让它污染整个循环——与上一课权限三件套的取舍形状完全一致。
  derivation: original
  sources:
  - ref: anthropic-always-on-agents
    locator: Permissions 一节的 Deferred tool calls 段
    claim: 工具调用被延后时当前运行结束、会话在调用中途被保存且可恢复；请求展示给用户，答复作为新事件回到收件箱、开启新运行续上会话，其间 worker 可处理其他事件，agent 不被阻塞
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-15
  canvas:
    kind: swimlane
    actors:
    - lane: agent
      id: a
      label: 调用延后：运行结束，会话中途存档
      highlight: true
    - lane: user
      id: u
      label: 用户：看到请求，答复成为一条新事件
    messages:
    - id: m1
      from: a
      to: u
      label: 等待被外化成事件，不占着 worker
      active: true
    registers:
    - name: 等待的形态
      value: 挂起会话，不占 worker
    - name: 答复的入口
      value: 收件箱里的一条普通事件
  log:
  - phase: 机制
    event: 把「等人」外化成事件，循环就不会被谁卡死
- id: outbox
  title: 发件箱：只交结果，不直播过程
  tldr: 普通 agent 把推理、工具调用与回答一路流式推给用户看；常驻 agent 的工作大半在后台，用户只该收到结果与少量细节。一次运行有三种收尾：往发件箱放一条消息、判定无事可发、或用延后调用向用户发问。
  body: |-
    先分清两种交付方式。普通 agent 的回答是流式生成的：用户能一路看着它推理、调工具、写答案。常驻 agent 的大部分工作在后台完成，用户看到的应该是结果和少量细节，而不是每一步的过程——把后台的查证、重试、改稿全推过去，等于让用户替系统读日志，他很快会把这个 agent 静音。

    一次运行有三种结局：往发件箱发一条消息；判断没什么需要发；或者用延后执行的工具调用去请求许可或补充信息。多数常驻 agent 其实只需要一个能直接把消息递给用户的「发送」工具就够了；只有当你要控制发送的节奏、或希望 agent 能从发送失败中恢复时，才需要正式的发件箱。正式版与收件箱正好镜像：一张存放待发消息的表，加一个分发进程（dispatcher）——像 worker 之于收件箱——负责读出待发消息、决定发哪些、再递到用户手里。延后调用的请求可以经过发件箱，也可以直接展示在界面上。

    最后是频率问题，它本质是产品问题而非技术参数：发太多会打扰用户，发太少又会漏掉他必须知道的事。原文建议用评测来找平衡点，并给出一条起步原则——先让 agent 少说话，再一点点争取用户更多的注意力。注意力是用户借给 agent 的额度，透支一次，额度就收紧一次。
  derivation: original
  sources:
  - ref: anthropic-always-on-agents
    locator: Outbox 一节
    claim: 一次运行以发送消息、无事可发、或延后调用请求许可三种方式之一收尾；多数常驻 agent 用一个直接发送的工具就够，需要控制发送节奏或从发送失败中恢复时才需要正式发件箱与分发进程；发送频率应先少后多、用评测找平衡
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-15
  canvas:
    kind: swimlane
    actors:
    - lane: agent
      id: a
      label: 运行收尾：发、或不发、或延后发问
    - lane: store
      id: s
      label: 发件箱：待发消息表 + 分发进程决定发哪些
      highlight: true
    messages:
    - id: m1
      from: a
      to: s
      label: 结果进发件箱，过程留在日志里
      active: true
    registers:
    - name: 收尾三选一
      value: 发消息 / 无事可发 / 延后发问
    - name: 频率原则
      value: 先少后多，用评测调
  log:
  - phase: 投递
    event: 交出去的是结论，不是全程直播
- id: full-cycle
  title: 走完一圈：三条连发与一次自唤醒
  tldr: 把五部件连起来走查两天：第一天用户连发的三条消息被收件箱合并成一次运行，发邮件这一步被延后等用户点同意、答复回来续上会话才发出，运行收尾给自己定下 24 小时跟进；第二天同一时刻，调度器把跟进翻译成事件投进收件箱，新运行查完进度、只发一条提醒，又睡回去。
  body: |-
    第一天上午 9 点，你在一分钟内连发三条消息，交代同一件事：给一位合作方发封跟进邮件，背景分三条说完。三条消息各带来源唯一标识落进收件箱，处理端点逐条快速确认。worker 被唤醒，先拉最新事件，把三条打包成一次运行：开新会话，加载记忆（行为指令、笔记索引、已告知内容），查完背景、拟好邮件。走到「发送」这一步——它属于要拍板的动作，于是这次工具调用被延后：运行结束，会话停在发送前存档，一张确认请求递到你面前。你点了同意，答复作为一条普通事件回到收件箱；新运行领取它、恢复会话、把邮件发出，随后往发件箱放一条汇报，分发进程递给你：「邮件已发，附要点。」运行收尾时，它给自己定了一个 24 小时的跟进计时器，然后睡去。

    第二天上午 9 点，调度器在例行轮询中扫到这条跟进到期——过去 24 小时它每分钟扫一次、共 1,440 次，前面的都空手而归。它把跟进标记为完成，往收件箱投一条「跟进到期」事件。worker 领取后开新运行：先读任务进度文件（邮件任务：已发送、等回复），再查邮箱确认对方仍未回复，于是往发件箱放一条短提醒：「对方还没回，要不要我再催一次？」运行结束，再睡。

    把两天的账合上：事件共 5 条（三条消息、一条批准答复、一条计时器事件），运行 3 次，你收到 3 条消息（一张确认卡、一条结果汇报、一条跟进提醒），其余全部时间 token 消耗为零。对照直调模型：三条消息会撞出三次互不知情的运行、可能三条零碎回复，且任何一次崩溃都会无痕丢事件。五部件各自挡住一种死法——收件箱挡并发与丢失，计时器挡「没人提醒就永远不跟进」，记忆挡失忆与重复播报，权限挡无人值守的失控，发件箱挡噪声淹没用户。没有一件是新发明：消息队列、调度器、持久化状态、最小权限、通知分发，全是你在分布式、操作系统与数据存储科里见过的老部件，这一课的新东西只有组合方式。人工智能科到此闭环：模型负责聪明，外围负责可靠。
