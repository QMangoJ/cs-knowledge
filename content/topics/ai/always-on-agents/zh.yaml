      value: 休眠，不消耗 token
    - name: 一次运行
      value: 事件到 → 干活 → 存档 → 再睡
  log:
  - phase: 全景
    event: 先分清「在岗体验」与「进程常开」是两回事
- id: event-inbox
  title: 事件收件箱：一切触发先排队，再唤醒
  tldr: 用户消息、webhook、定时任务、后台作业都可能触发运行；让每个来源直调 agent 会撞出两个并发运行、进程一崩事件就丢——做法是所有事件先写进一个持久化收件箱，再由 worker 领取。
  body: |-
    先看直调为什么翻车。多数 agent 只在用户发消息时运行，常驻 agent 的触发源却杂得多：webhook、定时任务、后台作业都算。若每个来源都直接调用 agent，两个同时到达的事件会启动两次互不知情的运行，各干各的、还可能互相覆盖；更糟的是崩溃——事件已经触发、处理到一半进程死了，这条事件在世上没留下任何痕迹，永远丢了。这正是分布式科的老毛病：没有持久化的「已发生」记录，就没有重试的依据。

    解法是所有来源先把事件送进收件箱，由一个 worker 领取。最简版本三件套：一份持久化的事件列表（通常是一张数据库表）、一个负责写入的处理端点（通常是 HTTP 接口）、一个从列表里读事件的 worker（通常是后台服务）。收件箱要记录每条事件的状态，并按来源给的唯一标识去重——同一条 webhook 被重试投递两次，只入队一次。原文建议从每个用户一个收件箱起步，需要更高并行度时再拆分。worker 被唤醒后领走待处理事件、启动运行、等运行结束再把事件标记为完成。

    还有一条入口纪律：处理端点要尽快确认收到。有些来源（比如 webhook 提供方）会把慢响应当作失败，转而重试或放弃；端点可以做轻量检查，但提示注入审查这类深活要留到运行过程中再做。入口的职责收敛成一件：把「发生过」可靠地记下来。后面会看到，整个架构的可靠性都建立在这个顺序上——先落盘，后处理。
  derivation: original
  sources:
  - ref: anthropic-always-on-agents
    locator: Event inbox 一节
    claim: 收件箱由持久化事件列表、写入用的处理端点与领取事件的 worker 三部分组成；事件按来源唯一标识去重，建议从每用户一个收件箱起步；处理端点应快速确认，深检查留到运行中做
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-15
  canvas:
    kind: swimlane
    actors:
    - lane: gate
      id: g
      label: 收件箱：事件落表、去重、记状态
      highlight: true
    - lane: agent
      id: a
      label: Worker：领事件 → 启动运行 → 标记完成
    messages:
    - id: m1
      from: g
      to: a
      label: 来源只许投递，领取只有一条道
      active: true
    registers:
    - name: 入口职责
      value: 只记账，快速确认
    - name: 去重键
      value: 来源给的唯一标识
  log:
  - phase: 机制
    event: 事件先有持久记录，才谈得上处理与重试
- id: single-worker-batch
  title: 单个 worker 与合并连发：少跑几次，才跑得对
  tldr: 同一个收件箱同一时间只许一个活跃 worker，避免两轮运行重复干活或互相覆盖；worker 醒来先拉最新事件，并把积压事件打包——用户连发的几条消息合并成一次运行，只回复一次。
  body: |-
    为什么只许一个 worker？直觉上多开几个更快，但对单个用户的事件流来说，并行是灾难：两轮运行读到同一份旧状态、各写各的结果，后写的盖掉先写的；同一条事件被两个 worker 同时领取，同一件事还会做两遍。与之配套的是把收件箱当作唯一可信来源：worker 被唤醒后，先从收件箱拉最新事件再开工。这样即使 worker 在运行中途死掉，那条事件还没被标记完成，新的 worker 能把同一条事件重新领走重试——至多重复处理，不会丢失（重复的副作用靠去重与幂等消化，那是另一课的事）。

    再走一笔小账，看打包的收益。用户在一分钟内连发三条消息、补充同一件事：直调模型下，三条消息触发三次运行、可能回三条各说一半的话，还彼此不知道对方存在。用收件箱：三条事件依次落表，worker 一次拉走三条、合并成一次运行——会话里三条消息都在眼前，只产出一整条回复。运行次数 3 降到 1、回复 3 条降到 1 条，token 跟着省。合并省的不只是钱，更是「回复自相矛盾」这种体验事故。

    运行中途来了新事件怎么办？原文给了三个选项：推到下一轮、并入当前这轮、或中断重开。选哪个取决于当前工作还能不能安全地继续：已经做出了不可撤回的动作，就只能推下一轮；只是补充信息，并入最省。这条没有标准答案，但必须事先有策略，不能等两个运行撞在一起再临场决定。
  derivation: original
  sources:
  - ref: anthropic-always-on-agents
    locator: Event inbox 一节的三条实践建议
    claim: 同一收件箱同一时间只应有一个活跃 worker；收件箱是唯一可信来源，worker 中途死掉后新 worker 可重试同一事件；worker 应把待处理事件打包，如把用户连发的几条消息合并成一次运行
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-15
