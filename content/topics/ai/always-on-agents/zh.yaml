    registers:
    - name: 并发策略
      value: 单收件箱单 worker
    - name: 合并账
      value: 3 条事件 → 1 次运行 → 1 条回复
  log:
  - phase: 纪律
    event: 先用单个 worker 串行领取保住正确性；要并行，靠拆分收件箱，不在同一收件箱里多开 worker
- id: timers
  title: 计时器：让 agent 给自己定闹钟
  tldr: 收件箱只管已经发生的事，主动跟进靠计时器：跟进是 agent 给自己定的截止时间，日程是固定节奏的周期任务；两者单独存一张表，由调度器轮询到期项、往收件箱投一条事件来唤醒运行。
  body: |-
    收件箱加计时器，agent 才显得主动。计时器分两类。跟进（follow-up）是一次性的截止时间，由 agent 给自己定：比如这次运行处理完一封邮件，就定下「24 小时后看看对方回了没有」。日程（schedule）是按已知节奏重复的任务：每日简报、每周汇总。两者结构差不多，区别只在日程多记一条重复规则。

    计时器单独存放在自己的持久化存储里（通常另一张表），不进收件箱——收件箱里只应放已经可以立刻处理的事件，一个明天才到期的跟进躺在队列里只会冒充待办。计时器自己不会启动运行：一个调度器（通常是后台服务）以固定间隔轮询这张表，找出到期的条目——跟进类的标记为完成，日程类的把到期时间改到下一次——然后往收件箱里加一条事件并唤醒 worker。也就是说，「时间到了」被翻译成一条普通事件，后面的路与用户消息完全相同。

    轮询这笔账值得算：调度器每分钟扫一次，一天就是 24×60 = 1,440 次扫描，绝大多数次空手而归。这与操作系统科 I/O 一课讲过的轮询是同一种笨办法：简单、可靠、代价是空转。能接受，是因为扫一张小表极便宜，而「到点必达」是刚需。原文也留了升级口：调度器可以自己写，也可以用现成的持久化执行引擎托管这套到期语义。
  derivation: original
  sources:
  - ref: anthropic-always-on-agents
    locator: Timers 一节
    claim: 计时器分跟进与日程两类，单独存放在持久化存储中；调度器以固定间隔轮询到期项，跟进标记完成、日程把到期时间改为下一次，并往收件箱添加事件唤醒 worker；调度器可自建或使用持久化执行引擎
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-15
  canvas:
    kind: swimlane
    actors:
    - lane: gate
      id: g
      label: 计时器表：跟进与日程分开记账
      highlight: true
    - lane: agent
      id: a
      label: 调度器：轮询到期项 → 投事件进收件箱
    messages:
    - id: m1
      from: g
      to: a
      label: 时间只负责敲门，不直接启动运行
      active: true
    registers:
    - name: 到期动作
      value: 跟进标完成，日程顺延下一次
    - name: 轮询代价
      value: 每分钟一次，一天 1,440 次
  log:
