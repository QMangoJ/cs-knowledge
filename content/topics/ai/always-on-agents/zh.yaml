    event: 计时器只生产事件，不直接启动运行
- id: memory
  title: 记忆：只存下次查不到的东西
  tldr: 跨运行的连续性靠一份独立存储的记忆维持：原则是只放 agent 以后查不到的信息，已存在于工单系统等外部系统里的只存一个指针；内容分四类——行为指令、用户笔记、已告知内容、任务进度。
  body: |-
    常驻 agent 要经历很多次互不相连的运行，前后的连续性只能靠记忆。记忆与收件箱、计时器一样，要有自己的存储。原文的产品实现是文件目录（比如 Claude Code 的自动记忆、Messages API 的记忆工具都是目录形态）；落到常驻 agent 上，这些目录应映射到数据库、对象存储或代码仓库里的文件——核心要求是记忆比任何一个 worker 都长寿，worker 换了一茬，记忆还在。

    存什么，有一条经验法则：只存 agent 以后查不到的东西。若信息已经存在于别的系统里（比如问题跟踪系统），就只存一个指向它的链接，不抄副本——副本会过期、会和正本打架，还白占加载成本。按这条法则，该存的分四类：①用户关于 agent 行为的指令，单独成文、每次运行开始时加载，因为用户不总在场，这份指令必须自己跨运行生效；②关于用户的笔记——角色、偏好、给过的纠正——从一个文件起步，多了再拆成小文件，先加载索引、细节按需再读；③已经告诉过用户的内容，存下来避免重复播报，可以单独成文，也可以由 worker 带入最近几条；④每项进行中任务的进度文件，写明做完了什么、还剩什么，新的运行照着接力，组织方式与笔记一样是索引加按需细读。

    这四类的共同点，是都是「下一轮开工前必须知道、而现场又无处可查」的信息。反过来想也成立：凡是能现场查到的，都不配占记忆的位置——这与数据库里「能推导出的列不落表」是同一条纪律，单一事实只许有一个出处。
  derivation: original
  sources:
  - ref: anthropic-always-on-agents
    locator: Memory 一节
    claim: 记忆只保存 agent 以后查不到的东西，已存在于其他系统的信息只存指针；记忆分用户指令、用户笔记、已告知内容与任务进度四类，笔记与进度用索引加按需读取组织；原文产品用文件目录实现，落到常驻 agent 应映射到数据库或对象存储
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-15
  canvas:
    kind: swimlane
