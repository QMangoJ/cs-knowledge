steps:
- id: rnn-limits
  title: RNN 为什么不够：顺读的两笔账
  tldr: 循环网络把句子从左到右一个词一个词地吞，状态边读边改；早期信息要穿过每个词才能影响后面，既被冲淡又让计算串行到无法并行训练。
  body: 'Transformer 之前，处理句子的主流是循环神经网络（RNN）：它像人逐字读书，维护一个不断更新的内部状态，读一个词、把状态改一改，再读下一个。结构很自然，账却有两笔越滚越大。第一笔是距离账：第 1 个词的信息想影响第 30 个词的理解，必须在状态里被转手 29 次，每次转手都掺进新词、被整形门挤压一轮——长距离依赖就这样被冲淡，模型对「句首的主语到底是谁」总是记不真切。

    第二笔是并行账，也是更致命的一笔：第 30 步的计算必须等第 29 步算完，整句话的训练是一条串行链，长度随句长线性增长。而现代 GPU 的算力形态是同时做海量相同的乘法（组成科的 SIMT 课讲过它的脾气）：串行链喂给它，等于让一万名工人排队用一把锤子。RNN 的表达能力并不差，它输掉的其实是与硬件的适配——这个判决方式本课结尾还会回来。

    理想的机制应该长什么样？任意两个词之间最好一跳直连，距离不再收过路费；整句的计算最好能同时展开，让并行算力吃饱。注意力（attention）就是按这两条要求设计的：它扔掉顺序处理，让每个词直接回头看全句。'
  derivation: original
  canvas:
    kind: datastate
    structure: array
    caption: RNN 的状态接力：词 1 的信息要转手多次才轮到词 5，早已变淡
    rows:
    - label: 顺序处理
      cells:
      - v: 猫
        sub: 词 1
        mark: active
      - v: 追
        sub: 词 2
      - v: 老鼠
        sub: 词 3
      - v: 它
        sub: 词 4
      - v: 跑
        sub: 词 5
    registers:
    - name: 距离账
      value: 信息转手越多次，被冲淡越厉害
    - name: 并行账
      value: 第 n 步等第 n−1 步，天生串行
  log:
  - mode: 病根
    event: 不是表达能力不行，是距离与串行两笔账算不过来
- id: attention-idea
  title: 注意力的直觉：按需回头查全句
  tldr: 理解一个词时，不靠被转手多次的记忆，而是当场回头扫全句：哪些词跟我相关，就按相关程度把它们的内容取过来混进我的表示。
  body: '注意力的想法来自一个很朴素的阅读体验：读到「它跑了」时，你不会只靠脑子里被转手多次的模糊印象，而是会当场回头扫一眼前文——「它」指谁？扫过「猫」「老鼠」，你的视线在「猫」上停得久些。注意力机制就是把这个「回头扫」做成了可计算的部件。

    具体化：每个词在每一层都要重新算一次自己的表示，算法是——拿自己当提问者，向全句所有词（包括自己）逐个询问相关程度，再按相关程度把各词的内容加权平均，混进自己的新表示里。提问与被问的都是同一批词，所以叫自注意力（self-attention）：句子在自己内部互相查阅。

    与 RNN 的对照立刻鲜明：任意两个词在这里都是一跳直连，距离不收费；而且每个词的查阅互不依赖，全句可以同时算——并行账当场平了。代价也从出生就带着：每个词都要和每个词打分，计算量随句长平方增长（n 个词两两组合是 n²），长上下文为什么贵，根子就在这个平方上，后两课还会各撞上它一次。'
  derivation: original
  canvas:
    kind: datastate
    structure: array
    caption: 「它」回头扫全句：与「猫」最相关，与自己最不相关
    rows:
    - label: 被查阅的全句
      cells:
      - v: 猫
        sub: 相关最高
        mark: found
      - v: 老鼠
        sub: 相关次之
        mark: visited
      - v: 它
        sub: 提问者本人
        mark: active
    registers:
    - name: 机制
      value: 按相关程度加权取用全句内容
    - name: 先天代价
      value: 打分次数随句长平方增长
  log:
  - mode: 机制
    event: 从「排队转手」换成「当场查表」，两笔老账一次平掉
- id: qkv
  title: QKV 分工：问题、标签与内容必须分家
  tldr: 每个词备三份投影：Q 是「我在找什么」，K 是「我贴的标签」，V 是「我的实际内容」；找什么与有什么分开，注意力才能既灵活又有信息量。
  body: '把「回头扫」落成数字，需要三个角色。每个词的表示先被三组不同的旋钮（三个权重矩阵）投影成三份东西：查询（Query，简称 Q）表达「这个词正在找什么样的信息」；键（Key，简称 K）表达「这个词对外贴的标签，说明我这儿有什么」；值（Value，简称 V）表达「这个词实际携带的内容，被取走时交出的就是它」。

    为什么非要分家？拿图书馆打比方：你去查资料，心里的问题（Q）是「明朝的海禁政策」，书脊上的分类标签（K）写着「历史·明·经济」，正文（V）才是你真正要读的内容。检索时拿 Q 去比对一排 K，匹配上了，取走的是 V——问题与标签是同种语言才好比对，标签与内容分开，书才能用粗标签被快速找到、又交出细内容。若三者合一（拿词本身去比词本身），「找什么」和「有什么」被绑成同一副面孔，模型想表达「代词要找先行词」这类不对称关系就无从下手。

    三个投影矩阵都是上一课说的那种旋钮，由反向传播在训练里拧出来——注意力不是一条写死的规则，而是一张形状固定、参数可学的查表机。查表机的打分规则下一幕揭晓：Q 与每个 K 做点积，分数就是相关程度。'
  derivation: original
  canvas:
    kind: datastate
    structure: array
    caption: 一个词的三份投影：找什么 / 贴什么标签 / 交什么内容
    rows:
    - label: 词「它」的三件套
      cells:
      - v: Q
        sub: 找：先行词是谁
        mark: active
      - v: K
        sub: 标签：代词，待指代
      - v: V
        sub: 内容：它自身的语义
    registers:
    - name: 分工
      value: Q 提问、K 应答标签、V 交内容
    - name: 参数来源
      value: 三个投影矩阵，仍是梯度拧出来的旋钮
  log:
  - mode: 角色
    event: 检索系统搬进网络内部：问题、标签、内容各就其位
- id: scores-softmax
  title: 打分与 softmax：[2, 1, 0] 怎样变成 [0.665, 0.245, 0.09]
  tldr: Q 与各 K 的点积给出原始相关分；过 softmax 把分数变成和为 1 的权重：指数放大差距、归一化保证可比，顺带处处可导。
  body: '算一笔真账。设「它」的 Q 分别与「猫」「老鼠」「它自己」的 K 做点积（点积就是对应项乘完再加总，两个向量越同向得分越高），得到原始分 [2, 1, 0]：最对味的是「猫」。这组分数还不能直接当权重用——它们可正可负、总和不定。负责把分数洗成权重的，是 softmax：对每个分数取指数 e 的幂，再除以全部指数之和。

    代入数字：e² ≈ 7.39，e¹ ≈ 2.72，e⁰ = 1，总和 ≈ 11.11。权重 = 各自除以总和：7.39/11.11 ≈ 0.665，2.72/11.11 ≈ 0.245，1/11.11 ≈ 0.09——和恰为 1。softmax 干了三件事：把任意实数洗成正数且总和为 1 的配比；用指数放大差距（分差 1 分，权重差出约 e 倍，赢家更赢）；并且处处光滑可导——最后一条是上一课的纪律：不可导的部件进不了这台学习机器，梯度传不过去，它就永远学不会。

    补一个工程细节：真实实现里点积还要除以 √d（d 是 K 的维度），叫缩放点积注意力。原因不玄：维度越高，点积的数值天然越大，大到 softmax 会被推向接近独热的极端、梯度随之消失；除以 √d 是把分数的波动拉回 softmax 的舒适区。机制仍是同一台，多的是一只恒温器。'
  derivation: original
  sources:
  - ref: attention-paper
    locator: 第 3.1 节 Scaled Dot-Product Attention 与第 3.2 节 Multi-Head Attention
    claim: 注意力用查询与键的点积打分、除以 √d_k 缩放后过 softmax 得到权重，再对值加权求和；多头注意力把多组这样的注意力并行拼接
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: softmax 前后：原始分洗成总和为 1 的权重
    rows:
    - label: 原始分（点积）
      cells:
      - v: 2
        sub: 对「猫」
      - v: 1
        sub: 对「老鼠」
      - v: 0
        sub: 对「它」
    - label: 权重（softmax）
      cells:
      - v: 0.665
        sub: 猫
        mark: found
      - v: 0.245
        sub: 老鼠
        mark: visited
      - v: 0.09
        sub: 它
    registers:
    - name: 总和检查
      value: 0.665 + 0.245 + 0.09 = 1.00
    - name: 恒温器
      value: 点积先除以 √d，防梯度被极端值堵死
  log:
  - mode: 打分
    event: 权重不是规定出来的，是分数洗出来的，且全程可导
- id: weighted-sum
  title: 加权取用：「它」被当场改写成偏向「猫」
  tldr: 按权重把各词的 V 加权求和：0.665×10 + 0.245×20 + 0.09×30 = 14.25——「它」的新表示明显偏向「猫」的内容，指代就这样在一轮查表里被解掉大半。
  body: '最后一步是取用：把每个词的 V 按刚算出的权重加权求和，得到的结果就是「它」在这一层的新表示。为了手算，每个词的 V 先压成一个数（真实模型里 V 是几百上千维的向量，原理相同）：设「猫」的 V = 10、「老鼠」的 V = 20、「它」自己的 V = 30。加权和 = 0.665×10 + 0.245×20 + 0.09×30 = 6.65 + 4.90 + 2.70 = 14.25。

    读这个结果：「它」原本的内容（30）只占了新表示里不到两成，新表示（14.25）被明显拉向「猫」（10）的地盘。翻译成人话：经过这一轮查阅，「它」这个词在模型内部的含义已经从一个光秃秃的代词，变成了「偏向于指猫的那个东西」——指代消解没有经过任何规则引擎，就发生在一轮加权平均里。下一层再查一轮、再改写一轮，含义就这样逐层加工。

    把一轮的全流程收束：提问者逐个打分、softmax 洗权重、加权取 V。注意整轮里没有一处「顺序」的参与——全句同时进行、各词互不等待，这正是并行账的平账现场；也没有一处写死的语言规则，QKV 三个投影学成什么样，注意力就长成什么样。'
  derivation: original
  canvas:
    kind: datastate
    structure: array
    caption: 加权取用：14.25，「它」的新表示偏向「猫」
    rows:
    - label: 各词的 V（内容，压成单数演示）
      cells:
      - v: 10
        sub: 猫 ×0.665
        mark: found
      - v: 20
        sub: 老鼠 ×0.245
        mark: visited
      - v: 30
        sub: 它 ×0.09
    registers:
    - name: 加权和
      value: 6.65 + 4.90 + 2.70 = 14.25
    - name: 含义
      value: 代词被上下文当场改写
  log:
  - mode: 取用
    event: 一轮自注意力走完：打分、洗权重、取内容
- id: multihead-position
  title: 多头与位置编码：一双眼不够，顺序也要外加
  tldr: 多头是让多组 QKV 并行各查一种关系再拼接，像多个频道同时看一句话；注意力对词序天然无感，顺序信息必须靠位置编码从外面注入。
  body: '一轮查表只用一张权重分布，等于只允许一个词同时认真看一种关系。可真实的句子里关系是叠着的：「它」既要找指代对象，又要和谓语对时态，还要和并列成分对结构。解法是多头注意力（multi-head）：把 QKV 的投影复制成多组（比如 8 组、96 组），每组独立查一轮——一组盯指代、一组盯动宾、一组盯就近修饰——最后把各组取回的内容拼起来再加工。多头不是多算几遍同一件事，而是给「看」这件事开了多个频道，频道分化成什么样，仍是训练自己拧出来的。

    另一处先天缺陷要补：注意力这台机器对词序天然无感。把句子打乱词序，每个词的查阅对象集合没变，它的计算结果一模一样——对它而言句子只是一个词袋。可语序当然携带信息，「狗咬人」与「人咬狗」不能同义。补丁是位置编码（positional encoding）：给每个位置造一个独特的向量，词进网络时把位置向量加到词表示上，从此每个词的身份里混着「我是第几个」的信息，模型才有材料去学顺序敏感的关系。

    这两处补丁藏着同一类设计气质：机制本身的对称与简洁不轻易破坏，缺什么就从外部以加法注入（位置以向量加、关系种类以并行头加），而不是把机制改回臃肿。下一幕看整层与整网的拼法。'
  derivation: original
  canvas:
    kind: datastate
    structure: array
    caption: 多头并看 + 位置外加：一句话被多个频道、带着座位号处理
    rows:
    - label: 头 1（示意）
      cells:
      - v: 指代
        sub: 它→猫
        mark: found
    - label: 头 2（示意）
      cells:
      - v: 动宾
        sub: 追→老鼠
        mark: visited
    - label: 位置编码
      cells:
      - v: 第 1 位
      - v: 第 2 位
      - v: 第 3 位
      - v: 第 4 位
        mark: active
    registers:
    - name: 多头
      value: 多组 QKV 并行，分工由训练长成
    - name: 位置
      value: 注意力无感，外加向量注入
  log:
  - mode: 扩展
    event: 机制保持简单，欠缺的能力一律以加法补齐
- id: transformer-block
  title: 一层 Transformer：注意力外加三件套
  tldr: 注意力层之外还要前馈小网络逐词加工、残差连接给信息与梯度留高速通道、归一化稳住数值；这样的一层堆叠几十上百层，就是 Transformer 的全身。
  body: '把一层拆开看，除了注意力还有三件套。第一件是前馈网络（feed-forward）：每个词的表示被单独送进一个两层的小网络加工一遍——注意力负责词与词之间交换信息，前馈负责每个词自己「消化」。分工很清楚：一个管通信，一个管思考，轮流上岗。

    第二件是残差连接（residual connection）：每个子层的输出不是替换输入，而是加回输入上（输出 = 输入 + 子层的加工）。它对训练的意义回扣上一课：深层网络的责任要穿过几十上百段连乘，稍不注意就梯度消失；残差给梯度留了一条不经过任何旋钮的直通道，每层的梯度至少能原样传回上一层，网络才深得起来。信息同理：任何一层的加工只做增量改写，原始信息不会被某一层失手抹掉。

    第三件是归一化（normalization）：把每层表示的数值分布拉回稳定的范围，防止几百层堆下去数值漂移失控。三件套加注意力构成一层（block），把这样的层堆几十到上百层、宽度做到几千维、旋钮堆到上千亿，就是当代大模型的全身——没有新部件了，剩下的全是规模与工程，后两站算的就是规模与工程的账。'
  derivation: original
  canvas:
    kind: datastate
    structure: array
    caption: 一层 = 注意力（通信）+ 前馈（消化）+ 残差（高速通道）+ 归一化（稳数值）
    rows:
    - label: 一层的流水线
      cells:
      - v: 注意力
        sub: 词间交换
        mark: visited
      - v: 前馈
        sub: 逐词加工
      - v: 残差+
        sub: 输出加回输入
        mark: active
      - v: 归一化
        sub: 拉稳分布
    registers:
    - name: 堆叠
      value: 同层重复几十至上百次
    - name: 残差的意义
      value: 梯度与信息的保底通道
  log:
  - mode: 组装
    event: 部件到齐：后面的故事只剩规模、训练与推理
- id: autoregressive
  title: 自回归生成：戴着因果面具逐词往外吐
  tldr: 生成时每个词只能看它左边的词（因果掩码），吐出一个再把它接回句尾继续；训练时靠已知答案可以全句并行，生成时却天生串行——推理慢的根子在此。
  body: '最后看它怎样写文章。语言模型的任务是「预测下一个词」：给前文，输出下一个词的概率分布，挑出一个词，接回句尾，再预测下一个——这种把自己的输出当下一步输入的方式叫自回归（autoregressive）。聊天机器人逐字往外蹦的字，就是这样一个一个蹦出来的。

    注意力在这里要戴面具：预测第 5 个词时，绝不能偷看第 6 个词及以后的内容（那等于考试看答案）。实现上把打分表里「看向未来」的位置全部屏蔽（分数置为负无穷，softmax 后权重为零），叫因果掩码（causal mask）。于是每个位置的查阅范围都是「我与我左边」——上一幕说注意力并行，是在每个位置各算各的意义上并行，信息流向仍严守从左到右。

    由此埋下后两站的账：训练时整句的正确答案都在手边，每个位置可以同时算（教师强制，teacher forcing），并行账是平的；生成时答案要自己逐个产出，第 n 个词没出来，第 n+1 个词无从算起——串行是生成方式自带的，谁也绕不开。推理为什么慢、KV 缓存为什么会出现，全从这一幕的面具与逐词吐字里长出来。'
  derivation: original
  canvas:
    kind: datastate
    structure: array
    caption: 因果面具：每个词只能查阅自己与左边的词
    rows:
    - label: 第 4 个词「它」的可见范围
      cells:
      - v: 猫
        sub: 可见
        mark: visited
      - v: 追
        sub: 可见
        mark: visited
      - v: 老鼠
        sub: 可见
        mark: visited
      - v: 它
        sub: 本人
        mark: active
      - v: 跑
        sub: 未来，屏蔽
        mark: muted
    registers:
    - name: 训练
      value: 答案齐备，全句并行算
    - name: 生成
      value: 逐词产出，天生串行
  log:
  - mode: 生成
    event: 同一张注意力表，训练与生成是两种时间结构
- id: quadratic
  title: 平方账：注意力从出生就带着的先天税
  tldr: 每个词与每个词打分，计算量与注意力表的大小都随句长平方涨：句子长 10 倍，账涨 100 倍——长上下文的一切昂贵都源出于此。
  body: '把账算明：n 个词两两打分，一张注意力表就是 n×n 个数。n = 1,000 时是一百万个分数，还不算事；n = 100,000（一本小说的长度）时是一百亿个分数——光是把这张表存下来就是几十 GB。计算量同理：句长翻 10 倍，注意力的账翻 100 倍，而词自己的加工（前馈）只翻 10 倍。上下文越长，注意力在总账里的占比就越碾压一切。

    这不是实现不够优化，而是机制的形状税：全连接的查阅天然是平方的。工业界的所有应对都在围着它打转：训练侧用更聪明的算法避免把整张表真正铺开在显存里（只改存储与计算顺序，不改结果）；结构侧出现过窗口注意力（只看附近一段）、稀疏注意力（只连一部分位置）等变体，各自拿表达能力换长度；系统侧则把长上下文的价格直接标在价目表上——你为 128K 上下文付的钱，大头就是这张平方表。

    下一课的训练显存账和下下课的 KV 缓存账，都会再遇到这张表：它既是注意力的力量来源（任意两词直连），也是它一切昂贵的总源头。理解 Transformer 的成本结构，先记住这一个平方。'
  derivation: original
  canvas:
    kind: datastate
    structure: array
    caption: 注意力表随句长平方膨胀：1K → 100 万格，100K → 100 亿格
    rows:
    - label: 句长与表大小
      cells:
      - v: 1K 词
        sub: 100 万格
      - v: 10K 词
        sub: 1 亿格
      - v: 100K 词
        sub: 100 亿格
        mark: active
    registers:
    - name: 形状税
      value: 计算与存储 ∝ n²
    - name: 应对方向
      value: 省着算 / 少连些 / 明码标价
  log:
  - mode: 成本
    event: 力量与账单同源：直连多远，平方就有多大
- id: recap
  title: 收束：Transformer 的全部秘密只剩规模问题
  tldr: 一台可导的查表机（注意力）加逐词加工（前馈），用残差与归一化堆深，用位置补顺序、用面具保因果——部件到此为止，后两站算训练与用它的账。
  body: '收束本科第二站。Transformer 的配方已经到齐：一组可训练的查表机（多头注意力）负责让信息在词与词之间按需流动，一组逐词的小网络负责各自消化，残差与归一化保证堆到上百层还训得动，位置编码把顺序喂进来，因果面具让它能逐词生成。配方里没有任何一步依赖语言学规则，全部旋钮仍由第一站那台反向传播机器来拧——两者咬合的方式值得再看一眼：注意力之所以能被训练，正是因为打分、softmax、加权和每一步都可导，责任能从一个「下一个词猜错了」的损失，一路分摊到某个 Q 投影矩阵的某个元素上。

    也请记住它的三笔先天账，因为后两站全是在还这些账：平方的注意力表、逐词生成的串行、以及为了反向而存下的全部中间结果。训练一站先算中间结果与参数状态的显存账，推理一站再算逐词生成时怎样靠缓存把重复计算赊回来。

    若只带走一句话：Transformer 的革命不在某个聪明公式，而在把「理解一句话」彻底翻译成 GPU 能并行执行的矩阵运算——表达力向硬件形状投降的那一刻，反而赢得了全部。'
  derivation: original
  canvas:
    kind: datastate
    structure: array
    caption: 配方收束：查表机 + 逐词加工 + 堆叠纪律，剩下的全是账
    rows:
    - label: 部件清单
      cells:
      - v: 注意力
        sub: 可导查表
        mark: visited
      - v: 前馈
        sub: 逐词消化
      - v: 残差/归一化
        sub: 堆深纪律
      - v: 位置+面具
        sub: 顺序与因果
        mark: active
    registers:
    - name: 待还的账
      value: 平方表 / 串行生成 / 中间结果
    - name: 下一站
      value: 训练的显存与计算总账
  log:
  - mode: 收束
    event: 部件到齐之后，AI 工程的主战场从结构转向账本
minutes: 28
prereq:
- ai/neural-backprop
objectives:
- 说清 RNN 的距离账与并行账分别是什么，注意力如何一次平掉两笔
- 解释 Q、K、V 的分工，并手算一组 softmax 权重与加权和
- 说清多头与位置编码各自补的是注意力的哪处先天欠缺
- 解释因果掩码与自回归生成为什么使推理天生串行
aiLink: 你读长文时眼睛的跳动就是一种生物注意力：不会逐字等速扫过，而是跳到关键词、回看指代、在难句上停留更久——Transformer 把这种选择性阅读做成可训练的部件，背后是同一条经济学：算力与带宽都有限，只能花在相关的信息上。
design:
- mechanism: 为什么并行性赢了表达力之争：Transformer 对 RNN 的真正胜负手
  problem: 根本约束在硬件经济学上：当代算力的增长来自大规模并行（GPU 用成千上万个简单核心同时做矩阵乘），任何计算结构若把工作排成一条长链，链有多长，算力闲置就有多久——RNN 的每一步都等前一步，它的训练时间被句长直接锁死，与它表达能力多强无关
  choice: 做法是彻底换结构：Transformer 放弃循环，只用注意力与前馈——句内任意两词一跳直连，且所有位置的计算互不依赖，整句可以折成几个大矩阵乘一次算完。它把序列问题翻译成了 GPU 最擅长的语言，于是同一块硬件上，它能用几天走完 RNN 几个月的训练路
  tradeoff: 代价是注意力的平方账：两两打分让计算与显存随句长平方膨胀，长上下文从此成为昂贵的特例而不是理所当然；同时位置信息、顺序结构这些 RNN 天生自带的东西，都要靠额外部件（位置编码、掩码）一件件补回来
  root: 根子是算法竞争的裁决权早已不在纸面复杂度手里：谁能把自己折进当代硬件的形状，谁就骑上算力每两年翻倍的电梯；折不进去的，再优雅也只能留在论文里。SIMT 课里那条「让一万名工人同时抡锤」的硬件脾气，就是这一课的历史判官
- mechanism: 为什么权重用 softmax 的软分配，而不是「只听最相关的那个」
  problem: 根本约束还是可导性：硬性地只取最大（argmax）会把梯度在除赢家外所有位置上切断，模型无法从「第二相关其实也该听一点」里学到任何东西；而语言里的相关性本就是程度问题——代词的主要指代之外，次要线索常常也携带真信息
  choice: 做法是用 softmax 给出软权重：所有词都按比例参与，梯度能流回每一个打分，模型可以学出「七分听猫、三分听鼠」的细腻配比。硬选择被软化，是深度学习里反复出现的同一手法：凡是要进训练回路的裁决，都先做成可导的近似
  tradeoff: 代价是注意力永远关不严：哪怕毫不相关的词也会分到一点权重，长句里大量微小权重会聚成噪声底噪；这也是后来出现稀疏注意力等变体的动机——它们想在保留可导的前提下把门关紧一些
  root: 根子在训练回路的准入规则上：一个部件能否被用，不取决于它直觉上是否最合理，而取决于梯度能不能穿过它。深度学习的大量设计——软权重、连续松弛、平滑损失——都是这条准入规则的产物：先活下来进回路，才谈得上被优化
- mechanism: 为什么位置编码是外加的，而不是把顺序做进注意力内部
  problem: 根本约束来自注意力的对称性：它本质上是集合上的运算——把输入词任意调换顺序，每个词的查阅集合不变、结果也不变。这种置换不变性让它泛化干净，却也让它先天分不清语序，而语序偏偏是语言的核心信息之一
  choice: 做法是不动机制本身，在入口处给每个位置加一个独一无二的位置向量，让词的表示里从一开始就混着座位号。顺序信息以加法注入，学不学、怎么用，交给训练自己决定——机制保持纯粹，欠缺从外部以增量方式补齐
  tradeoff: 代价在长度外推上：训练时只见过一定长度内的位置向量，遇到比训练长得多的句子，没见过的位置编码会让模型表现失常；后来的一系列改进（旋转位置编码等）本质上都在修补这张外加座位表的泛化边界
  root: 根子是一条普遍的系统设计原则：一个机制的盲区如果来自它的核心对称性，修法通常不是破坏对称性，而是把缺失的信息以正交的通道另行注入。操作系统给进程的虚拟地址、数据库给记录的主键，都是同一种「机制保持简单、身份从外部赋予」的结构
