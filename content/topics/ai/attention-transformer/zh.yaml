title: 注意力与 Transformer：每个词都回头看全句
summary: RNN 把一句话顺着读，远距离信息被冲淡、训练还串行；注意力让每个词按相关程度回头查全句：QKV 分工、softmax 配权重、加权取内容，多头并看、多层堆叠，再戴上因果面具逐词生成。
premise: 以一句话「猫追老鼠，它跑了」为样本：单看代词「它」怎样用一轮注意力，从「猫」与「老鼠」那里按 0.665 与 0.245 的权重取回内容，把自己的含义当场改写。
position: >-
  本课位于人工智能本科的第二段「注意力与 Transformer」，接在反向传播之后：上一站给的是一条固定链的分摊法，这一站把链换成可变的连接——连接强度由内容实时算出，且同样可导。学完你能完整走完一轮自注意力（打分、softmax、加权和），并说清并行性为什么是 Transformer 赢下表达力之争的真正原因。
overview:
- key: 一句话总结
  value: 注意力是一张可导的按需查表：每个词拿着自己的问题（Q），去和全句的标签（K）比对，按匹配度取用各词的内容（V）
- key: RNN 的两笔账
  value: 信息要顺着链一步步传，远距离被冲淡；计算天生串行，GPU 的并行算力喂不饱
- key: QKV 分工
  value: Q 是我在找什么，K 是我这儿贴着什么标签，V 是我实际的内容
- key: 本课算例
  value: 「它」的原始分 [2, 1, 0] 经 softmax 变权重 [0.665, 0.245, 0.09]，加权取回内容 14.25——指代在一轮里被解掉大半
- key: 多头与位置
  value: 多头是多组 QKV 各看一种关系；注意力本身不分先后，顺序要靠位置编码外加
- key: 生成方式
  value: 自回归：戴因果面具只看左边，逐词往外吐；训练可并行、生成天生串行（下一课与下下课的账源）
