    log:
      - phase: 全景
        event: 先分清引擎与宿主：agent = 模型 + harness
  - id: agent-loop
    title: agent 循环：一次工具调用一个来回，7 次调用修好一个测试
    tldr: 模型想用工具时，响应以 stop_reason 为 tool_use 结束，并带上工具名与参数；harness 执行后把结果作为 tool_result 塞回去，再调一次模型。循环一直转到模型不再要工具，或撞上 harness 设的上限。
    body: |-
      循环的一个来回是这样的。harness 发请求时附上工具清单；模型如果决定用工具，返回里会带一个 tool_use 块（工具名和参数），并以 stop_reason: "tool_use" 结束这次响应。这时模型已经停了，它不会自己去执行任何东西。harness 读到这个块，真的去跑命令，把输出包成 tool_result 块，连同之前的全部消息再发一次请求；模型看到结果，再决定下一步。用 V8 的话说：模型像一段只会 return 的函数，副作用全由宿主执行，结果作为下一次调用的参数传回来。

      拿修测试走一遍。Claude Code 文档给过这个任务的典型路径：跑测试看哪里挂了、读错误输出、搜索相关源文件、读这些文件、改代码、再跑一遍测试验证。读错误输出就是看第一次 tool_result，不单独调工具，所以本课的样本里实际是 6 次工具调用：① npm test ② grep 找相关文件 ③ 读测试文件 ④ 读源文件 ⑤ 编辑源文件 ⑥ 再跑 npm test。每次工具调用都要先有一次模型调用来发出请求，最后还要一次调用写结论，合计 7 次模型调用。你只说了一句话，模型被调用了 7 次。

      循环什么时候停？正常情况是模型某一轮不再请求工具，直接给出文字答复。但不能只靠模型自觉：Anthropic 的《Building effective agents》建议加停止条件，比如最大迭代次数；它的 SWE-bench 脚手架规则是一直采样，直到模型自己认为做完，或者用满 200k 的上下文长度。你也是一个停止条件：在 Claude Code 里按 Esc 会取消正在执行的工具调用；直接打字回车则排进队列，等当前这批工具调用结束后，在同一轮里被模型读到。

      工具报错了，循环会崩吗？不会，也不该崩。命令失败的输出（比如测试还是红的）照样作为 tool_result 交回模型，这正是《Building effective agents》强调的：agent 每一步都要从环境拿到真实结果（工具输出、代码执行结果）来判断进度。对 harness 来说，测试失败是一条普通观察，不是异常；真正要 harness 兜底的是另一类问题，比如工具输出大到把窗口塞爆，第 5 步会讲 Claude Code 怎么处理。
    code:
      lang: ts
      code: |-
        const messages = [{ role: "user", content: "把挂掉的测试修好" }];
        for (let turn = 0; turn < MAX_TURNS; turn++) {            // 停止条件之一：迭代上限
          const res = await client.messages.create({ model, max_tokens: 4096, system, tools, messages });
          messages.push({ role: "assistant", content: res.content });
          if (res.stop_reason !== "tool_use") break;              // 模型不再要工具：收工
          const results = [];
          for (const block of res.content) {
            if (block.type !== "tool_use") continue;
            const output = await runTool(block.name, block.input);  // 权限检查、超时都在这里
            results.push({ type: "tool_result", tool_use_id: block.id, content: output });
          }
          messages.push({ role: "user", content: results });       // 结果作为下一轮输入
        }
      note: 去掉权限、压缩和错误处理之后，harness 的骨架就这十几行；本课后面几步讲的，都是往这个循环里加东西。
