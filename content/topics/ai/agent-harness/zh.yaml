  - id: tools
    title: 工具是给模型用的接口：说明写成什么样，模型就用成什么样
    tldr: 工具定义 = 名字 + 描述 + input_schema（JSON Schema）；模型只能凭这几行文字决定什么时候用、参数怎么填。Anthropic 做 SWE-bench agent 时，花在打磨工具上的时间比打磨整体提示还多。
    body: |-
      模型看到的工具不是代码，是一份说明书：一个名字、一段描述、一个用 JSON Schema 写的 input_schema。它凭这几行字决定什么时候调用、参数怎么填。前端对照很直接：这就是组件的 props 类型加注释，类型和注释写得含糊，调用方就会传错；区别是这里的调用方是模型，它读不到你的实现，只读得到说明。Anthropic 把这一层叫作 agent-computer interface（ACI），建议在它上面投入和人机界面一样多的精力：站在模型的位置看说明够不够清楚、参数名能不能更直白，多跑一些例子看它在哪里犯错。

      最好的例子来自 SWE-bench。Anthropic 做这个 agent 时发现，agent 离开仓库根目录之后，模型在使用相对路径的工具时会出错。他们没有去提示里加一句「注意当前目录」，而是把工具改成必须传绝对路径，之后模型用得毫无差错。原文的结论是，他们花在优化工具上的时间比花在整体提示上的还多。这一招叫 poka-yoke（防呆）：改参数设计，让错误的调用根本写不出来，和你用 TypeScript 联合类型把非法状态排除在类型之外是同一个思路。

      工具也不是越多越好。那套 SWE-bench 脚手架只有一个提示和两个工具：执行 bash 命令的 Bash Tool、查看与编辑文件的 Edit Tool，就拿到了 49%，高于当时最好的 45%。Anthropic 后来在上下文工程一文里把臃肿的工具集列为最常见的失败之一：功能重叠、什么时候该用哪个说不清。如果一位工程师都说不准某个场景该用哪个工具，就别指望 agent 做得更好。Claude Code 的内置工具也只分五类：文件操作、搜索、执行、网页、代码智能。

      接外部服务怎么办？Claude Code 可以通过 [[MCP]]（Model Context Protocol，Anthropic 提出的开放协议）接入第三方工具。工具说明本身也要占上下文，所以 MCP 工具的定义默认延迟加载：开头只占工具名和服务说明，等模型真要用某个工具时，再通过工具搜索把完整定义装进来。这笔上下文账，下一步来算。
    derivation: original
    sources:
