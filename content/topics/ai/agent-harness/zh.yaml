          label: 把缺的能力补进环境
          active: true
        - id: m2
          from: h
          to: m
          label: 看得见、强制得了
      registers:
        - name: 五个月
          value: 约 100 万行 · 约 1,500 个 PR
        - name: 出错时问
          value: 缺了什么能力，而不是再努力一点
    log:
      - phase: 实务
        event: 人的工作从写代码移到造环境：文档进仓库、规则写成 lint
  - id: full-walk
    title: 走完一圈：一句话、7 次调用、2 次确认
    tldr: 把修测试的全程串起来：harness 先装好系统提示、工具清单和 CLAUDE.md；7 次模型调用里 6 次请求工具、1 次给出结论；harness 执行 6 次工具、问你 2 次、改文件前拍 1 次快照，7 次调用累计发送约 133k 输入 token。
    body: |-
      你在 React 仓库里输入「把挂掉的测试修好」。harness 开一个新会话，拼上系统提示、工具定义（MCP 工具只带名字）、CLAUDE.md 和自动记忆，发出第 1 次调用。模型返回 tool_use：npm test。harness 判断这是 bash 命令，弹出确认；你选「不再询问」，规则存进 settings.local.json，命令执行，2 个用例失败的输出作为 tool_result 拼回历史。第 2 到第 4 次调用，模型先 grep 找到 src/utils/formatDate.ts，再读测试文件和源文件，三次都是只读，harness 直接放行。第 5 次调用请求编辑源文件，harness 再问你一次，你同意后它先给文件拍快照，再写入修改。第 6 次调用请求再跑 npm test，命中刚存的规则，不问，结果全绿。第 7 次调用，模型不再请求工具，回一段说明：哪里错了、改了什么。stop_reason 不再是 tool_use，循环结束。

      合上账：7 次模型调用、6 次工具执行、2 次确认、1 份快照。按第 4 步的假设，输入 token 累计约 133k，最终窗口只有 28k，离需要压缩还远；任务要是长到 60 多次工具调用，就轮到第 5 步的压缩和子 agent。整件事里模型只做了一件事：每一轮读完整段输入、决定下一步。其余都是 harness 的活：拼上下文、执行、拦截、记账、撤销。

      最后给一张能带走的对照表，右边是 V8 那张表里的对应物：

      - 循环：模型提 tool_use，harness 执行、回 tool_result；停在不再要工具、迭代上限或你按 Esc。对应事件循环。
      - 工具：名字、描述加 schema 就是模型能看到的全部接口，用防呆参数代替提示里的叮嘱。对应宿主 API。
      - 上下文：每轮重发，越长越贵越钝；少量预装，其余按需取。对应每次新起、堆为空的 V8 实例。
      - 压缩与记忆：快满就写摘要，长期规则写文件，大探索交给子 agent。对应 Web Worker。
      - 权限：按能不能撤销分级放行。对应浏览器的权限弹窗。

      评估一个 agent 工具好不好用，先问三件事：它看得到什么（上下文），能做什么（工具），不能做什么（权限）。
