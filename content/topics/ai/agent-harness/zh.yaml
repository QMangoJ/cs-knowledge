        locator: "Appendix 2: Prompt engineering your tools"
        claim: 建议在 agent-computer interface 上投入与人机界面同样多的精力；对工具做防呆设计；做 SWE-bench agent 时花在优化工具上的时间多于整体提示，把工具改为必须使用绝对路径后模型使用无误
