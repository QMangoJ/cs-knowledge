  - id: harness-engineering
    title: Harness engineering：agent 出错时，先问缺了什么能力
    tldr: OpenAI 一个团队用五个月让 Codex 写出约一百万行代码、合并约 1,500 个 PR，人不直接写代码。工程师的工作变成给 agent 造环境：短 AGENTS.md 当目录、知识进仓库、用自定义 lint 机械地守住架构，并让报错信息直接告诉 agent 怎么改。
    body: |-
      造 harness 不只是 Claude Code、Codex 这些产品团队的事，用 agent 的团队也在做。OpenAI 在 2026 年 2 月的 Harness engineering 一文里讲了一个实验：从 2025 年 8 月底的一个空仓库开始，五个月里应用逻辑、测试、CI 配置、文档全部由 Codex 编写，人不直接贡献代码。仓库长到约一百万行，三名工程师驱动 Codex 合并了约 1,500 个 PR，平均每人每天 3.5 个；团队扩到七人后，人均吞吐还在上升。他们估计整体用时约为手写的十分之一。

      文章里最值得带走的是出错时怎么办。早期进展比预期慢，原因不是 Codex 能力不够，而是环境描述不足：agent 缺少需要的工具、抽象和内部结构。修法几乎从来不是「再努力一点」，而是问：缺了什么能力，怎样让它对 agent 既看得见、又强制得了。看得见，是因为 agent 运行时看不到的东西等于不存在，放在 Google Docs、聊天记录、人脑里的知识它都拿不到，所以知识要以带版本的文件进仓库。强制得了，是他们把架构规则（每个业务域内只能沿 Types → Config → Repo → Service → Runtime → UI 单向依赖）写成自定义 linter 和结构测试，而且 lint 报错里直接写修复方法，报错本身就成了注入给 agent 的上下文。

      前端对照：这就是你给团队配的 ESLint 规则和 CI 门禁，只是读报错的换成了 agent，所以报错要写「怎么改」，不能只写「哪里错」。他们还让应用能按 git worktree 各起一份实例，把 Chrome DevTools Protocol 接进 agent 运行时，让 Codex 自己截图、读 DOM、复现 bug、验证修复。Anthropic 的长时间编程实验得出了同样的结论：明确要求模型用浏览器自动化工具、像真实用户一样做端到端测试之后，它能找出只看代码发现不了的 bug。

      边界也要说清。OpenAI 自己写明：这套能力高度依赖那个仓库特定的结构和工具，没有同等投入，不要假设能直接推广；一个完全由 agent 生成的系统，架构一致性几年后会怎样，他们也还不知道。agent 还会照抄仓库里已有的坏模式，团队一度每周五（一周的 20%）手动清理，后来改成把规则写进仓库，让后台任务定期扫描偏差、开重构 PR。
    derivation: original
    sources:
      - ref: openai-harness-engineering
        locator: 开头、Redefining the role of the engineer 与 We started with an empty git repository 几节
        claim: 首个提交在 2025 年 8 月底；五个月内所有代码由 Codex 编写；约一百万行、约 1,500 个 PR、三名工程师、人均每天 3.5 个 PR，扩到七人后吞吐上升；估计用时约为手写的 1/10；早期慢是因为环境描述不足，修法是问缺了什么能力、如何让它对 agent 可读且可强制
        status: verified
        checkedBy: repo eng 核查
        checkedAt: 2026-11-19
      - ref: openai-harness-engineering
        locator: Increasing application legibility、We made repository knowledge the system of record 与 Enforcing architecture and taste 几节
        claim: 应用可按 git worktree 启动并接入 Chrome DevTools Protocol；agent 运行时访问不到的知识等于不存在；按 Types → Config → Repo → Service → Runtime → UI 的固定分层用自定义 linter 与结构测试强制依赖方向，lint 报错中写入修复说明
        status: verified
        checkedBy: repo eng 核查
        checkedAt: 2026-11-19
      - ref: openai-harness-engineering
        locator: Entropy and garbage collection 与 What we're still learning 两节
        claim: Codex 会复制仓库中已有的不佳模式；团队曾每周五（一周的 20%）手动清理，后改为编码规则并由后台任务定期扫描开重构 PR；这些行为依赖该仓库特定的结构与工具，不应假设可直接推广
        status: verified
        checkedBy: repo eng 核查
        checkedAt: 2026-11-19
      - ref: anthropic-long-running-harness
        locator: Testing 一节
        claim: 明确提示使用浏览器自动化工具、像人类用户一样做端到端测试后，Claude 能发现只看代码不明显的 bug
        status: verified
        checkedBy: repo eng 核查
        checkedAt: 2026-11-19
    canvas:
      kind: swimlane
      actors:
        - lane: user
          id: u
          label: 工程师：定方向、写验收标准、补缺的能力
        - lane: harness
          id: h
          label: Harness：AGENTS.md 目录 + 仓库内文档 + 自定义 lint
          highlight: true
        - lane: model
          id: m
          label: Codex：执行、自查、开 PR
      messages:
        - id: m1
          from: u
