  - id: compaction-memory
    title: 窗口装满之后：压缩、写文件与子 agent
    tldr: 快满时 harness 让模型把历史总结成摘要、开新窗口接着干；要跨压缩、跨会话保留的东西写进文件（CLAUDE.md、进度笔记、git）；需要大量探索的子任务交给子 agent，在独立窗口里做完只交回摘要。
    body: |-
      任务一长，第 4 步那张台面迟早放不下。假设窗口是 200k，按每次工具调用涨 3k 算，60 次之后就是 10k + 60×3k = 190k，再来几轮就满。第一招是压缩：把快满的对话交给模型总结，用摘要开一个新窗口接着干。Claude Code 的做法是让模型保留架构决策、未解决的 bug 和实现细节，丢掉重复的工具输出，然后带着摘要和最近访问过的 5 个文件继续。最轻的一种是清掉早期的工具结果：很久以前跑过的一条命令，后面基本不需要再看它的原始输出。

      压缩会丢细节。Claude Code 文档写得很直接：压缩后，对话早期的详细指令可能丢失，所以长期规则要写进 CLAUDE.md（每次会话开头都会加载），不要指望对话历史；还可以在 CLAUDE.md 里加一节 Compact Instructions，或者用 /compact 指定这次压缩重点保留什么。还有一种边界情况：单个文件或工具输出大到每次压缩后窗口立刻又满，Claude Code 试几次后会停止自动压缩、直接报错，而不是无限循环下去。

      第二招是把要留的东西写到窗口外面。会话之间本来互不相通：Claude Code 每个新会话都从空窗口开始，跨会话的连续性靠 CLAUDE.md 和自动记忆（MEMORY.md 的前 200 行或前 25KB，以先到者为准，在会话开始时加载）。Anthropic 的长时间编程实验走得更远：第一个会话专门搭环境，写一个 init.sh 启动脚本、一份 claude-progress.txt 进度日志、一份列了 200 多个功能的 JSON 清单（初始全部标为未通过），并做一次初始 git 提交；之后每个会话只做一个功能，结束时提交 git、更新进度。他们选 JSON 而不用 Markdown，是因为模型不太容易误改或覆盖 JSON 文件。新会话先读进度文件和 git log，几步就能接上之前的工作。

      第三招是子 agent：把一个要大量探索的子任务交给另一个 agent，它在自己的窗口里干，只把结论交回来。Anthropic 的说法是，子 agent 可能探索几万 token 甚至更多，但只返回 1,000–2,000 token 的浓缩摘要。走一笔账：主 agent 要查「这个测试依赖的 mock 在哪些地方被改过」，自己查要读进 40k token 的文件和搜索结果；交给子 agent，主窗口只多 1.5k，省下 38.5k。代价是那 40k 仍然要付费，而且主 agent 只看得到摘要，摘要漏掉的就真漏了。V8 这边的对应物是 Web Worker：另起一个有自己堆内存的线程，干完用 postMessage 只把结果传回来。
    derivation: original
    sources:
      - ref: anthropic-context-engineering
        locator: Compaction、Structured note-taking 与 Sub-agent architectures 三节
        claim: Claude Code 的压缩让模型总结消息历史，保留架构决策、未解决的 bug 与实现细节，丢弃冗余工具输出，随后带着压缩后的上下文与最近访问的 5 个文件继续；清除工具结果是最轻的压缩；子 agent 可能用掉数万 token 探索，只返回约 1,000–2,000 token 的浓缩摘要
        status: verified
        checkedBy: repo eng 核查
        checkedAt: 2026-11-19
      - ref: claude-code-how-it-works
        locator: Work with sessions 与 When context fills up 两节
        claim: 每个新会话从全新上下文窗口开始；自动记忆 MEMORY.md 的前 200 行或 25KB（先到者为准）在会话开始时加载；压缩后早期详细指令可能丢失，持久规则应写入 CLAUDE.md；可用 Compact Instructions 或 /compact 指定保留重点；单个输出过大导致反复填满时，几次尝试后停止自动压缩并报错；子 agent 在自己的上下文窗口中工作，完成后返回摘要
        status: verified
