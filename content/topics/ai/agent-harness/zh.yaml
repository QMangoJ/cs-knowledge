title: Agent Harness：把只会吐字的模型装进循环、工具与权限
summary: 模型只会读一段文本、再吐一段文本；Claude Code、Codex CLI 这类编程 [[agent]] 能读文件、跑测试、改代码，靠的是包在模型外面的那层程序——[[harness]]：它跑循环、替模型执行工具、决定每一轮往[[上下文窗口]]里装什么、窗口快满时怎样压缩，并按风险分级拦下危险动作。同一个模型换一套 harness，成绩可以差得很远。
premise: 以你在一个 React 仓库里对编程 agent 说一句「把挂掉的测试修好」为样本：走完这句话触发的 7 次模型调用、6 次工具执行和 2 次权限确认，分清哪些是模型在想、哪些是 harness 在做。
position: 本课是人工智能科「从模型到 agent：Harness」一段的唯一一课，排在推理一课之后、常驻 Agent 一课之前：推理一课讲单次调用的成本，本课讲怎样把一次次调用串成一个有人在场时能干活的 agent，常驻 Agent 一课再在它外面围上收件箱与计时器，让它无人值守。学完你能画出 agent 循环的一次往返、算出一轮任务的上下文账，并说清同一个模型在不同 harness 里表现为什么不同。
bridge:
  prev: 上一课的主角是单次调用：prefill 整段读题、decode 逐词吐字、KV 缓存省掉重算。可你用的 Claude Code 一句话能连跑几十步，读文件、跑测试、改代码，这些不是一次调用能做完的。本课看模型外面那层程序怎样把很多次调用串成循环，以及为什么每一轮都要把 prefill 的钱重新付一遍。
  next: harness 默认你一直坐在屏幕前：你发一句话它才开始循环，要批准时弹窗等你点。下一课把你从现场拿走——没人发消息时谁来唤醒它、跨天的事记在哪、没人点同意时危险动作怎么办，这些要在 harness 外面再围一圈事件驱动的架构。
overview:
  - key: 一句话总结
    value: agent = 模型 + harness：模型每一轮只负责读完整段输入、决定下一步；拼上下文、执行工具、拦截危险动作、压缩历史、撤销改动，全是 harness 的活
  - key: 循环
    value: 模型返回 tool_use 后就停下，harness 执行工具、把结果作为 tool_result 发回，再调一次模型；停在模型不再要工具、撞上迭代上限或你按下 Esc
  - key: 工具
    value: 名字、描述加 input_schema 就是模型能看到的全部接口；工具少而清楚、参数设计成不容易填错，比在提示里反复叮嘱管用
  - key: 上下文
    value: 模型不记得上一轮，每次调用都把系统提示、工具定义和全部历史重新发一遍；少量说明预装，其余用 grep、读文件按需取
  - key: 压缩与记忆
    value: 窗口快满就让模型写摘要、开新窗口接着干；长期规则写进 CLAUDE.md，进度写进文件和 git；大量探索交给子 agent，只收摘要
  - key: 权限
    value: 只读操作直接放行，跑命令、改文件要确认，确认可以存成规则；本地文件改动可用快照回退，部署、改数据库这类远程动作只能事先挡住
  - key: Harness engineering
    value: agent 出错时先问缺了什么能力：知识以文件形式进仓库，架构规则写成 lint，报错信息直接告诉 agent 怎么改
