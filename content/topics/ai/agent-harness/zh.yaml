  - id: permissions
    title: 权限与撤销：模型提要求，harness 决定放不放行
    tldr: 模型只能请求调用工具，执行前由 harness 按风险分级：只读操作直接放行，跑命令、改文件要确认，确认可以存成规则；改文件前先拍快照可以回退，但部署、改数据库这类远程动作退不回来。
    body: |-
      第 2 步说过，模型发出 tool_use 后就停下了，执行与否由 harness 决定，权限正好落在这里。前端对照还是那张表：网页里的 JS 调用摄像头，弹出「允许使用摄像头吗」的是浏览器，不是 V8，页面代码绕不过去。Claude Code 默认的分级是：读文件、grep 这类只读操作在工作目录内不用批准；执行 bash 命令要批准（一组内置的只读命令除外），选「不再询问」后按仓库和命令永久记住；改文件要批准，选「不再询问」只管到本次会话结束；抓取网页、搜索网页也要批准。

      拿修测试的 6 次工具调用数一遍（手动模式）。① npm test 是 bash 命令，要确认，你选「不再询问」，规则存进仓库根目录的 .claude/settings.local.json；② grep、③④ 读两个文件都是只读，不问；⑤ 改源文件，要确认；⑥ 再跑 npm test，命中刚才存的规则，不问。6 次调用，你只被问了 2 次。下次在同一个仓库开新会话，npm test 仍然不问，改文件则要重新确认。

      不想逐个点，可以换模式（Shift+Tab 切换）：Accept edits 直接改文件、执行 mkdir、mv 这类常用文件命令，其他命令照问；Plan 只探索、出方案，不改源文件；Auto 用一个分类器在后台审查大多数动作、拦下有风险的，代替你点确认。团队也可以把信得过的命令（比如 npm test、git status）写进 .claude/settings.json 一起提交。更底层还有沙箱：在操作系统层面限制 bash 命令能访问的文件和网络。

      批准之外还有撤销。Claude Code 改每个文件之前先拍快照，出错了按两次 Esc 就能回到之前的状态；但快照只管本地文件，部署、改数据库、调外部 API 这些远程动作退不回来，只能靠权限模式和规则事先挡住。判断的关键就在这里：能撤销的操作可以放宽，撤销不了的要收紧。没人在旁边点同意的时候怎么办？那是下一课的事：常驻 agent 把凭证挪出运行环境，把批准改成延后执行的工具调用。
