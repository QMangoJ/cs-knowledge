      kind: swimlane
      actors:
        - lane: harness
          id: h
          label: Harness：每一轮重装整张台面
          highlight: true
        - lane: model
          id: m
          label: 模型：不记得上一轮
      messages:
        - id: m1
          from: h
          to: m
          label: 系统提示 + 工具 + CLAUDE.md + 全部历史
          active: true
      registers:
        - name: 第 7 次调用输入
          value: 10k + 6×3k = 28k
          changed: true
        - name: 7 次累计
          value: 70k + 63k = 133k 输入 token
