  - id: context-window
    title: "[[上下文窗口]]是唯一的工作台：每一轮都把整张台面重新搬一遍"
    tldr: 模型不记得上一轮，harness 每次调用都要把系统提示、工具定义、CLAUDE.md 和全部历史重新发一遍；窗口越满越贵，模型对其中信息的召回也越差（context rot）。所以 harness 只预装少量说明，其余用 grep、读文件按需取。
    body: |-
      模型本身没有会话记忆：每次调用都是一次独立的推理，上一轮看过什么，全靠 harness 这一轮重新放进输入。用 V8 的话说，每次调用都像新起一个 V8 实例，堆是空的，状态全靠宿主传进来。Claude Code 文档列过窗口里装着什么：对话历史、文件内容、命令输出、CLAUDE.md、自动记忆、已加载的技能和系统指令。

      把修测试的 7 次调用算一遍（数字是为演示取的整数）。假设系统提示加工具定义共 10k [[token]]，每次工具调用连同结果平均让历史增加 3k。第 1 次调用输入 10k；第 2 次多了第一次的调用和结果，是 13k；依此类推，第 7 次是 10k + 6×3k = 28k。7 次加起来是 7×10k + 3k×(0+1+…+6) = 70k + 63k = 133k 输入 token，而最终窗口里只有 28k。重复发送的部分正是上一课的 [[prefill]]：每一轮都要把整段前缀重新读一遍。好在前缀几乎不变，[[提示缓存]]可以让重复的前缀按较低价格计费；缓存按前缀匹配，所以 harness 只往历史末尾追加、不去改前面的内容，缓存才命中得了。

      窗口不只是贵，还会变钝。Anthropic 的上下文工程一文提到 context rot：窗口里的 token 越多，模型准确回忆其中信息的能力越差。原因之一回到第二课的[[注意力]]：n 个 token 两两之间有 n² 对关系，长度一涨，注意力就被摊薄。这是一条渐变的曲线而不是悬崖，结论却很明确：上下文是边际收益递减的有限资源，要找的是让期望结果最可能出现的最小一组高信号 token。

      于是 harness 要决定哪些东西预装、哪些按需取。Claude Code 用混合策略：CLAUDE.md 一开始就直接放进上下文，其余靠 glob、grep 这类工具在需要时再读文件；整个仓库不预先塞进去，只保留文件路径这类轻量指针，用到再加载，和前端路由懒加载一个道理。OpenAI 那篇文章给了反面教训：他们试过把规则全写进一个巨大的 AGENTS.md，结果失败了——指令挤占了任务和代码的位置，什么都标重要等于没有重点，内容很快过期，还没法做机械校验。后来他们把 AGENTS.md 缩到约 100 行，只当目录，指向 docs/ 里的详细文档。
    derivation: original
    sources:
      - ref: claude-code-how-it-works
        locator: The context window 一节
        claim: 上下文窗口装有对话历史、文件内容、命令输出、CLAUDE.md、自动记忆、已加载的技能与系统指令
        status: verified
        checkedBy: repo eng 核查
        checkedAt: 2026-11-19
      - ref: anthropic-context-engineering
        locator: Why context engineering is important 与 Context retrieval and agentic search 两节
        claim: context rot：上下文 token 增多时模型准确回忆信息的能力下降；Transformer 中 n 个 token 有 n² 对关系；上下文是边际收益递减的有限资源；Claude Code 采用混合策略，CLAUDE.md 预先放入上下文，glob 与 grep 按需检索文件
        status: verified
        checkedBy: repo eng 核查
        checkedAt: 2026-11-19
      - ref: openai-harness-engineering
