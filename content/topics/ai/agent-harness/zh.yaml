        claim: 一个巨大 AGENTS.md 的做法失败：挤占上下文、过多指引等于没有指引、迅速过时、难以校验；改为约 100 行的 AGENTS.md 作为目录，指向结构化 docs/ 目录
        status: verified
        checkedBy: repo eng 核查
        checkedAt: 2026-11-19
