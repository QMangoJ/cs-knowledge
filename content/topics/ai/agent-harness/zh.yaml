objectives:
  - 说清模型与 harness 的分工，并解释同一个模型为什么在不同 harness 里成绩不同
  - 画出一次工具调用的往返（tool_use → 执行 → tool_result），并列出循环的三种停止条件
  - 手算一轮任务的上下文账：每次调用的输入、累计输入 token，以及为什么重复前缀能靠提示缓存省钱
  - 区分压缩、写文件和子 agent 三种应对窗口上限的办法，并说出各自丢掉的是什么
  - 按「能不能撤销」解释权限分级，并数出一次任务里哪些工具调用需要确认
aiLink: 同样调用一个大模型，编辑器里的单行补全只能给你下一行，agent 模式却能跑测试、改好几个文件：能力上的差别，来自外面那层程序给了它什么工具、装进多少上下文、放了多大权限。
design:
  - mechanism: 为什么循环与工具执行放在 harness 里，而不是让模型自己去做
    problem: 模型一次调用只产出文本。读文件、跑测试需要副作用和机器访问权限，而且要在多轮之间来回：执行哪条命令、结果怎样回到下一轮、命令失败或挂死谁来处理、哪些动作必须先问人，这些都不是一次推理能承担的。
    choice: 模型只输出结构化的调用请求（tool_use）然后停下；harness 在你的机器上做权限判断、执行工具、把结果包成 tool_result 拼回下一轮输入。循环、停止条件、超时与错误处理全写在 harness 这一侧的普通代码里。
    tradeoff: 每走一步都多一次完整的模型调用，历史越长每轮越贵；工具设计、上下文管理、停止条件的好坏直接决定成绩，同一个模型在不同 harness 里的表现可以差得很远，评测分数也必须连同 harness 一起看。
    root: 根子是决策与执行分离：模型像一个只返回指令的纯函数，副作用集中交给宿主执行。V8 不自带 I/O、能力由浏览器或 Node 提供，用户程序只能发系统调用、由内核决定执不执行，都是同一个结构。
  - mechanism: 为什么上下文要按需取、快满就压缩，而不是把能放的都放进去
    problem: 模型不记得上一轮，每次调用都要把整段历史重新发一遍：窗口越满，每一轮的 prefill 越贵；token 一多，模型从中准确回忆信息的能力也会下降。把整个仓库或一份巨大的规则文件预先塞进去，既烧钱又把真正的任务挤到角落。
    choice: 只预装少量说明（CLAUDE.md、工具清单），其余保留文件路径这类轻量指针，用 grep、读文件在需要时加载；快满时让模型写摘要换新窗口，长期规则写进文件，大量探索交给有独立窗口的子 agent。
    tradeoff: 按需读取比预先加载慢，模型还可能用错工具、走进死胡同浪费上下文；摘要会丢细节，早期的指令可能在压缩后消失；子 agent 的探索要另外付费，主 agent 只看得到摘要。
    root: 根子是信噪比：窗口是按 token 计价、又会被注意力摊薄的稀缺资源，设计问题不是能装多少，而是哪些 token 值得每一轮都付全价。前端控制首屏包体积、只加载当前路由用得到的代码，是同一个取舍。
  - mechanism: 为什么权限按能不能撤销分级，而不是一律询问或一律放行
    problem: agent 握着你终端的全部能力：一律询问，几十步的任务要点几十次确认，人很快会不看内容直接点同意；一律放行，一条删库或部署命令就可能造成退不回来的损失。
    choice: 只读操作直接放行；执行命令、改文件、访问网络要确认，确认可以按仓库和命令存成规则；改文件前先拍快照，能回退的放宽，回退不了的远程动作靠权限模式和规则事先挡住；另有模式可选：只出方案不改文件，或由分类器代替人审查。
    tradeoff: 规则和模式本身要维护，存得太宽等于没设防，存得太窄又回到频繁打扰；分类器会误拦或漏拦；快照只覆盖本地文件，远程副作用仍然要靠人判断。
    root: 根子是最小权限加可逆性：能力按需授予，代价按能否撤销定价。数据库事务能回滚所以可以放心试，已经发出去的外部请求收不回来所以要先审——agent 的权限分级只是把这条老规矩搬到了工具调用上。
quiz:
  - q: '模型的响应以 stop_reason: "tool_use" 结束、并带着一个调用 npm test 的 tool_use 块，接下来发生什么？'
    options:
      - 模型已经在服务器上跑完了 npm test，结果就在这次响应里
      - 这次响应作废，harness 会重新请求一次直到模型给出文字答案
      - harness 读取这个块、做权限判断后在本地执行命令，把输出包成 tool_result 连同历史再发一次请求
      - 需要用户把命令复制到终端手动运行，再把结果粘贴回去
    answer: 2
    explain: tool_use 只是一个请求，模型发出后就停了。真正执行、判断要不要先问你、把结果作为 tool_result 拼回下一轮输入，都是 harness 的工作；这一个来回就是 agent 循环的一步。
  - q: 假设系统提示加工具定义共 10k token，每次工具调用及其结果平均让历史增加 3k。修测试共 7 次模型调用，第 7 次调用的输入大约是多少？
    options:
      - 28k：10k + 6×3k，前 6 次的调用和结果都要重新发送
      - 13k：每次只需发送系统提示和最新一次的结果
      - 3k：模型记得之前的内容，只需发新结果
      - 133k：第 7 次要把前面所有调用的输入全部重发
    answer: 0
    explain: 模型不记得上一轮，每次调用都带上全部历史：第 7 次是 10k + 6×3k = 28k。133k 是 7 次调用的输入累计（70k + 63k），不是某一次的大小；重复发送的前缀正是提示缓存能省钱的地方。
  - q: Anthropic 做 SWE-bench agent 时发现，agent 离开仓库根目录后，模型使用相对路径的工具时会出错。他们最后怎么解决？
    options:
      - 在系统提示里反复强调要注意当前目录
      - 换了一个更大的模型
      - 禁止 agent 执行 cd 命令
      - 把工具改成必须传绝对路径，之后模型用得毫无差错
    answer: 3
    explain: 这是防呆（poka-yoke）：改参数设计，让错误的调用写不出来，而不是靠提示叮嘱。原文还提到，他们花在优化工具上的时间比花在整体提示上的还多。
  - q: 主 agent 需要查清某个 mock 在哪些地方被改过，预计要读约 40k token 的文件与搜索结果。交给子 agent 的主要收益是什么？
    options:
      - 子 agent 读文件不花钱
      - 探索过程留在子 agent 自己的窗口里，主窗口只多一段约 1,000–2,000 token 的摘要
      - 子 agent 可以直接修改主 agent 的上下文，替它删掉旧内容
      - 子 agent 能看到主 agent 看不到的文件
    answer: 1
    explain: 子 agent 在独立窗口里探索，只把浓缩后的结论交回，主窗口省下了大头。代价是那 40k 仍然要付费，而且主 agent 只看得到摘要，摘要漏掉的细节就真的漏了。
steps:
  - id: model-vs-harness
    title: 模型只会吐字，干活的是外面那层 [[harness]]
    tldr: 模型收到一段文本、返回一段文本，本身不会读文件也不会跑命令。Claude Code 文档把包在模型外面、提供工具并管理模型所见上下文的那层程序叫作 agentic harness：agent = 模型 + harness。
    body: |-
      先把分工摆出来。你对编程 agent 说「把挂掉的测试修好」，真正发生的是：一段程序把你的话、项目说明和可用工具清单拼成一整段输入发给模型；模型回的是文本，其中可能夹着一个结构化的请求——「我要调用某个工具，参数是这些」；那段程序照着去执行，把结果拼进下一次输入。Claude Code 官方文档的说法是：agent 循环由会推理的模型和能动手的工具两部分驱动，Claude Code 就是模型外面那一层，负责提供工具、管理模型看到的上下文，这一层就叫 agentic harness。

      前端里有个现成的同构：V8。V8 只会执行 JavaScript，本身不会发网络请求、不会读文件，连定时器都没有；fetch 和 setTimeout 是浏览器给的，fs 是 Node 给的。同一个 V8 装进 Chrome 能操作 DOM，装进 Node 能读写磁盘，能做什么完全由宿主决定。模型就是那台引擎，harness 是宿主：工具对应宿主 API，agent 循环对应事件循环，权限确认对应浏览器那句「允许此网站使用摄像头吗」。后面每一步都回到这张对照表。

      它以什么形式存在？就是一个普通程序。Claude Code、Codex CLI 是装在你电脑上的命令行工具，Cursor 的 agent 跑在编辑器里，OpenHands 是开源项目；也可以是一个库，Anthropic 把 Claude Agent SDK 称作通用的 agent harness，你在自己的代码里调用它。它的配置以文件形式放在仓库里：CLAUDE.md 或 AGENTS.md 写项目说明，.claude/settings.json 写权限规则。harness 原义是马具，软件里早有 test harness（驱动测试的框架）的说法；OpenAI 在 2026 年 2 月发表的文章直接以 Harness engineering 为题，讲怎样给 agent 搭环境。顺带一提，同名的 Harness 公司做的是 CI/CD 平台，和本课无关。

      为什么要单独学它？因为你看到的很多「模型成绩」，测的其实是这一整套。Anthropic 在 SWE-bench 那篇文章里写明：这个基准评的不是孤立的模型，而是模型加外围脚手架组成的整个 agent；脚手架负责生成提示、解析模型输出去执行动作、管理循环，即使底层模型相同，分数也会因脚手架不同而差得很远。所以看到「某模型在某榜单上拿了多少分」，先问一句：用的是哪套 harness。
