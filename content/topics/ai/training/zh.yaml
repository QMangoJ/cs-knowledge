- id: why-training-costs
  title: 为什么训练比推理贵得多：三重乘积
  tldr: 单 token 训练约是推理的 3 倍价（6N 对 2N），训练 token 是万亿级的批发量，同一批数据还要多看几轮——三笔乘起来，就是「推理按次卖、训练按月烧」的全部原因。
  body: '把两课的账并排，贵的原因一目了然。其一，单价差：生成一个 token 只需一次前向（2N），而训练里一个 token 要走前向加反向（6N），单价约 3 倍。其二，总量差：推理是零售生意，用户问一句才算一句的钱；训练是批发预付，要先把万亿 token 全部学过，才轮到第一个用户提问。其三，轮次差：数据不是看一遍就够，质量好的语料会被反复学上好几轮（epoch），每轮都是一整套 6N 的全价。

    再往深看一层，这笔贵其实买的是「把知识压进参数」这一件事本身：推理贵的是把参数里的知识取出来回答一次，训练贵的是把全人类的文本逐字压进那 14 GB 的权重里且不出错。压缩的成本天然远高于解压，这与信息领域的老规律同构——索引建起来贵、用起来便宜，编译贵、运行便宜。AI 的商业模式也随之定了形：训练是一次性的巨额资本开支，推理是每次调用的边际成本，下一课的主角就是后者如何再被压低。

    收束本课：训练的工程问题可以全部翻译成两句话——显存账决定这模型要切成几张卡，计算账决定这批数据要跑多少天。下一站，模型训好了、权重冻结了，我们换到它被使用的那一侧：生成一个词为什么仍然慢，以及 KV 缓存怎样救场。'
  derivation: original
  canvas:
    kind: datastate
    structure: array
    caption: 三重乘积：3 倍单价 × 万亿总量 × 多轮重复
    rows:
    - label: 训练 vs 推理
      cells:
      - v: 单价 ×3
        sub: 6N 对 2N
        mark: visited
      - v: 总量 万亿级
        sub: 批发预付
        mark: visited
      - v: 轮次 多轮
        sub: 每轮全价
        mark: active
    registers:
