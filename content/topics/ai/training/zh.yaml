title: 训练是怎么回事：一本显存账与计算账
summary: 以 70 亿参数模型为例逐项算账：参数 14 GB、梯度 14 GB、FP32 主权重 28 GB、Adam 状态 56 GB，合计约 112 GB 还没算激活；每 token 训练约 6N 次浮点运算，是生成一个 token 的约 3 倍，再乘上万亿级的 token 量。
premise: 以一个 70 亿（7B）参数的 Transformer、用混合精度与 Adam 训练为样本：逐项点名显存的四类住户、算每 token 的浮点账、看 batch 与学习率这对连体旋钮，最后解释训练为何比推理贵得多。
position: >-
  本课位于人工智能本科的第三段「训练的账本」，接在注意力之后：结构既定，本课把第一站的四幕循环放大到工业规模算总账。学完你能对任何参数量，手算训练显存的构成与下限、说清 6N 计算账的来历，并解释分布式训练为什么是被显存账逼出来的。
overview:
- key: 一句话总结
  value: 训练贵在两本账：显存账决定一张卡装不装得下（装不下就只能切到多卡），计算账决定一个集群跑不跑得完
- key: 显存四住户
  value: 参数、梯度、优化器状态、激活——推理只需要第一户，训练四户全要伺候
- key: 本课账单
  value: 7B 模型混合精度 + Adam：每参数 16 字节 → 约 112 GB（未含激活）；同期推理只需约 14 GB 的权重
- key: 计算账
  value: 每 token：前向约 2N、反向约 4N、合计约 6N 次浮点运算；7B 即约 420 亿次/token
- key: 连体旋钮
  value: batch 决定每步梯度的噪声与价格，学习率要随 batch 联动调整，两者必须成对地调
- key: 贵的三重乘积
  value: 单 token 贵约 3 倍 × token 总量万亿级 × 同批数据还要看多轮——训练是批发预付，推理是按需零售
visual: datastate
logColumns:
- key: mode
  label: 当前账目
- key: event
  label: 发生了什么
steps:
- id: loop-at-scale
  title: 先把舞台放大：工业级的一轮学习长什么样
  tldr: 语料先切成 token、打乱、分批；一步 = 一批样本走完前向、反向、更新；这样的步要走十万到百万级，数据总量以万亿 token 计。
  body: '第一站的四幕循环（前向、损失、反向、更新）在这里原样放大，只是每一处的量级都变了。原料是语料：互联网级文本先被切成 token（词元，模型眼里的最小文字单位），打乱后按批（batch）装箱——一批可能就是几十万个 token。一歩（step）的定义随之放大：一批数据整体走完一次前向（每个 token 都在预测自己的下一个词）、算出总损失、反向把梯度分摊回全部参数、按梯度更新一次。这样的步要重复几十万到几百万次，喂进去的数据总量以万亿 token 计。

    放大之后，第一站里一句带过的两件事变成主角：前向时存下的中间值（激活）多到吓人；更新时除了旋钮本身，还需要一整套「记着每个旋钮历史」的辅助状态（优化器状态）。它们与参数、梯度一起，构成显存的四类住户——本课接下来逐户点名，把每一户的尺寸算到 GB。

    选一个具体的主角算账：70 亿参数（7B）的 Transformer，这是当代中型模型的典型尺寸。训练方式取业界最常见的组合：混合精度（计算用 16 位浮点、关键累加用 32 位）加 Adam 优化器。所有数字都可以手算复核，算完你会对「训练一次要几张卡」有肌肉记忆。'
  derivation: original
  canvas:
    kind: datastate
    structure: array
    caption: 样本主角：7B 参数，混合精度 + Adam，显存四户待点名
    rows:
    - label: 显存的四类住户
      cells:
      - v: 参数
        sub: 旋钮本体
        mark: visited
      - v: 梯度
        sub: 每旋钮一份
      - v: 优化器状态
        sub: 旋钮的历史
      - v: 激活
        sub: 前向的存货
        mark: active
    registers:
