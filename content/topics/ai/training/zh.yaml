      value: 一批 token 的前向 + 反向 + 更新
    - name: 规模感
      value: 步数十万计，数据万亿 token 计
  log:
  - mode: 全景
    event: 四幕循环不变，变的是每户住户的体量
- id: params-grads
  title: 住户一二：参数与梯度，各 14 GB
  tldr: 每个参数在计算时以 FP16 存放（2 字节）→ 7B 共 14 GB；反向算出的梯度与参数一一对应、同尺寸，再 14 GB——这两户是账单的地板。
  body: '第一户是参数本体。训练时真正参与矩阵乘法的那份权重用 16 位浮点（FP16/BF16）存放，每个参数 2 字节：70 亿 × 2 字节 = 140 亿字节 ≈ 14 GB。推理时你只需要伺候这一户，所以「7B 模型要 14 GB 显存」这句常见的话，说的只是推理的地板价。

    第二户是梯度：反向传播给每个参数算出一份梯度，梯度的形状与参数完全相同，也是一份 per 参数的账。常见实现里梯度与计算权重同精度存放，又是 14 GB。这两户合计 28 GB，是任何训练方案都逃不掉的下限——旋钮要拧，就必须先有地方放「往哪拧」的读数。

    先记住这个 28 GB，再往下看大头：接下来两户——优化器的记忆与精度的主本——加起来是这两户的三倍。训练显存之所以动辄上百 GB，惊讶点不在参数身上，而在围着参数转的辅助结构上。这正是本课想让你带走的直觉：贵的是伺候旋钮的成本，不是旋钮本身。'
  derivation: original
  canvas:
    kind: datastate
    structure: array
    caption: 先记地板价：参数 14 GB + 梯度 14 GB = 28 GB
    rows:
    - label: 账单（7B，累计）
      cells:
      - v: 参数 FP16
        sub: 14 GB
        mark: visited
      - v: 梯度 FP16
        sub: +14 GB
        mark: visited
      - v: 小计
        sub: 28 GB
        mark: active
    registers:
    - name: 每参数单价
      value: 参数 2 字节 + 梯度 2 字节
    - name: 对照
      value: 推理只需其中的参数一份
  log:
  - mode: 显存账·一
    event: 地板价 28 GB——大头还在后面两户
- id: optimizer-state
  title: 住户三：优化器状态 56 GB，与那份 FP32 主权重 28 GB
  tldr: Adam 给每个参数记两份 FP32 的历史（一阶动量与二阶动量），8 字节/参数 = 56 GB；混合精度还要另存一份 FP32 主权重（4 字节）= 28 GB——辅助结构正式超过参数本体。
  body: '第三户是本课的「反直觉冠军」：优化器状态。最朴素的梯度下降不需要历史，可工业训练用的是 Adam：它给每个参数单独维护两份统计量——一阶动量（梯度的滑动平均，记方向）与二阶动量（梯度平方的滑动平均，记每个参数自己的波动尺度，好给每个参数定制步长）。两份都以 FP32 存放，每个参数 8 字节：70 亿 × 8 = 56 GB，一户就顶参数本体的四倍。

    为什么非要 FP32 记账？因为参数的更新量往往极小：学习率乘上梯度，常常是万分之一量级甚至更小。FP16 在 1.0 附近的最小刻度约为千分之一——比它还小的更新加到权重上，会被舍入直接吞掉，等于这一步白走。所以混合精度的分工是：矩阵乘法用 FP16 图快，但另存一份 FP32 的主权重负责累加更新，这份主本又是 4 字节/参数 = 28 GB。（浮点位数决定最小可分辨变化，这是组成科浮点一课的同一笔账。）

    四户点名前三户：参数 14 + 梯度 14 + FP32 主权重 28 + Adam 状态 56 = 每参数 16 字节，7B 合计约 112 GB。这还没请进第四户激活。一张主流训练卡的显存是 80 GB 量级——结论已经在桌上：单卡根本装不下，这不是优化问题，是算术问题。'
  derivation: original
  sources:
  - ref: adam-paper
    locator: 摘要与第 2 节（Algorithm 1：维护梯度的一阶矩与二阶矩的指数滑动平均）
    claim: Adam 为每个参数维护一阶矩估计 m 与二阶矩估计 v 两组状态，并据此为每个参数自适应地缩放更新步长
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: 辅助结构反客为主：主权重 28 GB + Adam 状态 56 GB
    rows:
    - label: 账单（7B，累计）
      cells:
      - v: 参数 + 梯度
        sub: 28 GB
        mark: muted
      - v: FP32 主权重
        sub: +28 GB
        mark: visited
      - v: Adam 状态
        sub: +56 GB
        mark: active
      - v: 小计
        sub: 112 GB
    registers:
    - name: 每参数总价
      value: 2+2+4+8 = 16 字节
    - name: 单卡现实
      value: 80 GB 级显存，装不下
  log:
  - mode: 显存账·二
    event: 112 GB 达成——伺候旋钮的成本是旋钮本身的数倍
- id: forced-distributed
  title: 装不下的后果：分布式训练是被算术逼出来的
  tldr: 112 GB 大于单卡 80 GB，于是模型必须切开：权重分片、流水分工、数据并行各算一份再同步梯度——分布式科的全部麻烦，在这里按步收费。
  body: '算术不讲情面：装不下，就只能把模型切到多张卡上。切法有几个流派：把每层的矩阵横竖拆开分算（张量并行）、把层流水线式地分给不同卡接力（流水线并行）、或者每张卡放完整模型但喂不同数据、每步把梯度汇总平均（数据并行）。真实的大训练是三者的混合，目标只有一个：让每张卡的显存账各自平掉，同时少为切分付通信费。

    请注意这里的呼应：上一科刚讲完的分布式全部的难——消息会迟到、同步要等最慢的那个、梯度同步本质上是每步一次全体归约（all-reduce）——在训练里不是抽象概念，而是每一步都要交的过路费。数据并行每步同步一次全量梯度，7B 模型就是每步搬运十几 GB 的梯度数据过网络；卡越多，这笔通信在一步里占的比例越扎眼。GPU 集群为什么要用昂贵的高速互联、卡为什么要同机同柜，答案都在这笔账里。

    还有第四户悬着：激活。它与前三户性质完全不同——大小不取决于参数量，而取决于你一次喂多少数据。下一幕请它进来，账才算齐。'
  derivation: original
  canvas:
    kind: datastate
    structure: array
    caption: 装不下 → 切：三种切分都在为同一笔显存账找平
    rows:
    - label: 三种切法
      cells:
      - v: 张量并行
        sub: 拆每层矩阵
      - v: 流水线并行
        sub: 层间接力
      - v: 数据并行
        sub: 同步梯度
        mark: active
    registers:
    - name: 逼出来的
      value: 112 GB > 单卡 80 GB
    - name: 每步过路费
      value: 梯度归约的通信量随参数量走
  log:
  - mode: 后果
    event: 分布式不是炫技，是显存算术的唯一解
- id: activations
  title: 住户四：激活——唯一随「吃多少」涨的住户，与重计算的交换
  tldr: 激活是每层前向为每个 token 留下的中间结果，尺寸随 batch×序列长度×层数线性涨；装不下时用梯度检查点：反向时重算一遍前向，约多付三分之一的计算，换回大半激活显存。
  body: '第四户激活（activations），是反向传播的存货（第一站立过规矩：局部导数要用前向的中间值）。它的大小公式与参数量无关：每层给批里的每个 token 都留一份与隐藏维度同宽的中间结果，所以总量 ≈ 批大小 × 序列长度 × 隐藏维度 × 层数 × 每数值的字节数。批开得越大、句子越长、层越深，它涨得越凶——开满批时，它完全可以再吃掉几十 GB，与前三户同量级对坐。

    激活装不下时有一招经典的以算换存：梯度检查点（gradient checkpointing）。做法是前向时只在每隔若干层留一个检查点、其余中间结果算完就扔；反向走到某段时，拿最近的检查点把这段的前向临时重算一遍，得到局部导数需要的中间值，用完再扔。代价是多付一遍部分前向：整体计算量大约多出三分之一（多付的那份约等于一次前向，而一轮训练的总计算约为前向的三倍，下一幕细算），换回的是激活显存从「与层数成正比」降到「只剩检查点」。

    这笔交换值得记住形状：显存与计算在训练里是可以互相兑换的两种货币，兑换率随手可调。同一形状你在别处见过——数据库拿空间换时间的索引、CPU 拿缓存换带宽。AI 工程的一大半日常，就是在每张卡的显存与算力之间反复找平这本账。'
  derivation: original
  canvas:
    kind: datastate
    structure: array
    caption: 激活公式：批 × 序列 × 隐藏 × 层数；检查点用重算把它压下去
    rows:
    - label: 两种存法
      cells:
      - v: 全存
        sub: 显存 ∝ 层数
        mark: muted
      - v: 检查点
        sub: 计算 +约 1/3
        mark: active
      - v: 激活
        sub: 只剩检查点
        mark: found
    registers:
    - name: 激活的主人
      value: 批与序列，不是参数
    - name: 兑换关系
      value: 显存 ⇄ 计算，随时可调
  log:
  - mode: 显存账·三
    event: 四户到齐：112 GB 固定盘 + 随批涨的激活盘
- id: compute-bill
  title: 计算账：每 token 约 6N，反向是前向的两倍
  tldr: 一次乘加算 2 次浮点运算：前向每 token 每参数用一次 → 2N；反向要同时算对输入与对权重的两路梯度 → 约 4N；一轮训练每 token 合计约 6N，7B 即约 420 亿次。
  body: '显存账算完算计算账，规则同样朴素。矩阵乘法里每个参数在处理一个 token 时被用一次：一次乘法加一次加法，算 2 次浮点运算（FLOPs）。前向一遍，每 token 的计算量 ≈ 2×参数量 N。7B 的前向就是约 140 亿 FLOPs/token——这也是推理生成一个 token 的大致成本，先记住。

    反向为什么贵一倍？链式法则在每一层要算两路东西：一路是把责任继续往前传的梯度（对该层输入的梯度），另一路是本科第一站的主角——对该层每个权重的梯度。两路各约等于一次前向的乘加量，于是反向 ≈ 4N。一轮训练每 token 合计 ≈ 2N + 4N = 6N。代入 7B：约 420 亿 FLOPs/token。再乘上万亿级的 token 总量，总计算量来到 10²³ 量级——这就是为什么大训练要以「集群 × 数月」为单位报价。

    这条 6N 经验式还有个用处：它是拿来对账的尺。任何一篇训练报告，只要给出参数量与数据量，你就能用 6N×token 数估出总计算量，再对比它公布的卡时数，反推硬件利用率——宣传与现实的差距 often 就藏在这个除法里。把尺子留好，它比记住任何单个模型的数字都耐用。'
  derivation: original
  canvas:
    kind: datastate
    structure: array
    caption: 计算账：前向 2N + 反向 4N = 训练 6N / token
    rows:
    - label: 每 token 的浮点账（N = 参数量）
      cells:
      - v: 前向 2N
        sub: 7B → 约 140 亿
        mark: visited
      - v: 反向 4N
        sub: 两路梯度
        mark: visited
      - v: 合计 6N
        sub: 约 420 亿
        mark: active
    registers:
    - name: 对照
      value: 推理生成一 token 只有前向 2N
    - name: 尺子
      value: 6N × token 数 ≈ 总计算量
  log:
  - mode: 计算账
    event: 反向的两路梯度决定了训练单价是推理的约 3 倍
- id: batch-lr
  title: 连体旋钮：batch 与学习率必须成对地调
  tldr: batch 是一次更新引用的样本量：大 batch 的梯度更稳、硬件更饱满，但更新次数变少；学习率通常要随 batch 放大——单调一个，训练不是变慢就是变乱。
  body: '还剩下对每个训练工程师都绕不开的连体旋钮。batch（一批的大小）决定每一步的梯度是拿多少样本平均出来的：批越大，平均的意见越稳（噪声小），每一步也越贵；批越小，每步便宜、更新频繁，但每步的梯度都是带着噪声的个体意见，方向抖。第一站说过梯度是局部读数——batch 决定这份读数的采样量，读数噪声直接决定步子能迈多大。

    学习率与它连体：梯度越稳（大 batch），步子就可以迈得越大，所以经验上放大 batch 时学习率要近似同比例放大；反过来小 batch 配大步长，等于拿着抖动的读数横冲直撞，训练很容易被噪声掀翻。它们从来不是两个独立开关，而是一组配合：先定批（受显存与并行方式约束），再按批定率的大盘，细调在小范围里找。

    这背后有个值得点破的视角：梯度噪声不纯是坏事。适度的噪声会把参数从尖锐的坏地形里抖出来、落进更平坦宽阔的区域，这类区域往往泛化更好——这也是为什么不能把 batch 无限放大求「最准的梯度」：最准未必最好。训练调参的一大半手感，就是在这份噪声里找有用的那一档。'
  derivation: original
  canvas:
    kind: datastate
    structure: array
    caption: 一对连体旋钮：批定噪声，率定步长，必须成对动
    rows:
    - label: 两种极端
      cells:
      - v: 小批 + 大步
        sub: 噪声掀翻训练
        mark: muted
      - v: 大批 + 小步
        sub: 稳但更新太少
        mark: muted
      - v: 成对调
        sub: 批放大，率跟放大
        mark: found
    registers:
    - name: 批的职责
      value: 决定梯度读数的噪声
    - name: 率的职责
