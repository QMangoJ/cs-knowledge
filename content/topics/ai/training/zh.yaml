      value: 压缩贵、解压便宜
    - name: 下一站
      value: 推理侧的边际成本怎么压
  log:
  - mode: 收束
    event: 两本账算齐：切几张卡、跑多少天，都有了出处
- id: gpu-echo
  title: 为什么是 GPU 吃下这本账：回扣组成科的 SIMT
  tldr: 训练的计算几乎全是大矩阵乘——成千上万个相同的乘加同时进行，正是 GPU 的 SIMT 形状；CPU 的强项（分支、延迟）在这种活儿面前完全用不上。
  body: '把计算账的成分拆开：前向、反向、梯度，落到最后几乎全是矩阵乘法——同一个运算在成百万个数据位置上重复，没有分支、没有等待、没有数据之间的依赖。这种形状你其实见过：组成科的 GPU/SIMT 课讲过，GPU 是用成千上万个简单核心执行同一条指令的机器，专为这种「一个动作、万处执行」的活儿而生；CPU 的核心少而聪明，擅长把单个任务的第 3 步不等第 2 步就猜着做，可面对矩阵乘，它再聪明也只能一个乘加一个乘加地排队。

    于是训练的硬件史就是一部适配史：GPU 为矩阵乘长出了专门的低精度计算单元（Tensor Core，专吃 FP16/BF16 的矩阵乘），正好和混合精度的分工严丝合缝——计算用低精度不只是省显存，更是只有低精度才走得通那条最快的硬件通道。参数规模每次上台阶，背后都站着一代更能乘的硬件。

    反过来，训练框架的头等大事也是把一切计算都整理成矩阵乘的形状：注意力要折成批量矩阵乘、不同长度的句子要打包对齐，宁可多算一点填充，也不让计算流里出现喂不饱 GPU 的零碎形状。这与上一课「并行性赢了表达力之争」是同一条规律在工程层的回声：结构的胜负，先由硬件的形状裁决。'
  derivation: original
  canvas:
    kind: datastate
    structure: array
    caption: 训练的计算形状 = 大矩阵乘连乘，正中 SIMT 的靶心
    rows:
    - label: 计算成分
      cells:
      - v: 矩阵乘
        sub: 占绝对大头
        mark: found
      - v: 逐元素
        sub: 激活/归一化
        mark: visited
      - v: 通信
        sub: 梯度同步
    registers:
    - name: 硬件适配
      value: 低精度矩阵乘有专门通道
    - name: 框架的纪律
      value: 一切计算先折成矩阵形状
  log:
  - mode: 硬件
    event: 第二次见证：谁能折进硬件的形状，谁就赢
- id: step-anatomy
  title: 一步的时间花在哪：为什么利用率到不了百分之百
  tldr: 一步里有计算、有梯度通信、有等待最慢那张卡的空转，还有数据搬运；真实大训练的硬件利用率常在三到五成——剩下的不是偷懒，是分布式与流水线的结构性损耗。
  body: '最后给「跑多少天」补上现实感。一歩的时间并不全花在矩阵乘上：数据并行要在步末同步梯度（通信，且全员等最慢的那张卡说完）、流水线并行有气泡（前几层算完时后几层还没开工）、检查点要周期性地把上百 GB 状态写进存储、数据加载与预处理偶尔还会让 GPU 等饭吃。这些环节各自只吃一小口，叠起来就把硬件利用率（MFU，实际算力占峰值算力的比例）压到一个经验区间：组织得好的大训练常在三到五成。

    不要小看这个数字对账单的影响：用 6N 经验式算出总计算量、除以峰值算力得到的天数，还要再除以利用率才是真实工期——三到五成意味着工期是理想值的两到三倍。训练预算的会议桌上，争的从来不是要不要更多卡，而是利用率能不能再抬五个点：五个点的利用率，值回成百上千张卡。

    这也回扣了分布式科的收官句：难的剂量是设计选的。卡间互联的拓扑、切分策略、检查点频率，每一个选择都在这本时间账上标了价。训练工程师与分布式工程师，在这一课里正式变成同一批人。'
  derivation: original
  canvas:
    kind: datastate
    structure: array
    caption: 一步的构成：计算只是其中一段，同步与等待寸土必争
    rows:
    - label: 一步的时间去向
      cells:
      - v: 矩阵乘
        sub: 真计算
        mark: found
      - v: 梯度同步
        sub: 等最慢的卡
        mark: visited
      - v: 流水气泡
        sub: 结构性空转
      - v: 检查点
        sub: 百 GB 落盘
        mark: active
    registers:
    - name: 利用率经验值
      value: 常在三到五成
    - name: 工期公式
      value: 理想天数 ÷ 利用率
  log:
  - mode: 时间账
    event: 账算到这一步，训练与分布式已经是同一门手艺
minutes: 28
prereq:
- ai/attention-transformer
- co/gpu-simt
objectives:
- 逐项算出 7B 模型混合精度训练的显存构成，并说清单卡装不下的后果
- 用乘加计数推出前向 2N、反向 4N、训练 6N 的每 token 计算账
- 说清 batch 与学习率为何必须成对调整，梯度噪声为何不纯是坏事
- 用三重乘积解释训练成本与推理成本的量级差
aiLink: 健身的账与训练惊人地像：增肌期（训练）要吃下远超日常的热量与时间，维持期（推理）只是按需支出——真正改变身体组成的，永远是那段昂贵的、反复刺激加恢复的时期，而不是日常活动本身。
design:
- mechanism: 为什么优化器状态能比参数本身大好几倍，还非用不可
  problem: 根本约束是逐参数步长的需求：不同参数的梯度尺度差出几个数量级，统一学习率会让一部分参数原地踏步、另一部分反复震荡。想给每个参数定制步长，就必须记住它各自的历史——记忆按参数逐个存，状态总量必然与参数量同阶甚至翻倍
  choice: 做法是接受这笔存储税：Adam 用两份 FP32 动量换取对学习率不敏感、收敛又快又稳的训练过程。在几周的集群账单面前，调参失败重跑一次的成本远高于多买几张卡的显存，工程界的选择从来没犹豫过
  tradeoff: 代价是显存结构被状态绑架：参数量每涨一倍，状态跟着涨一倍，单卡容量先被辅助结构吃掉，逼得切分、卸载（把状态放到 CPU 内存）等技术层层加码，系统的复杂度有相当一部分是在替优化器还债
  root: 根子是一个普遍的交换：走得稳需要历史，历史需要存储。数据库用日志买回滚能力、CPU 用分支历史买预测准确、优化器用动量买收敛稳定——同一条「空间换行为质量」的曲线，在每一层系统里都要重新付一次
- mechanism: 为什么混合精度要留一份 FP32 主权重，不全用 FP16 省显存
  problem: 根本约束是浮点表示的分辨率：FP16 在数值 1.0 附近的最小刻度约是千分之一，而训练后期典型的单步更新比这个刻度还小。更新加回权重时会被舍入整个吞掉——参数看似在更新，实际纹丝不动，训练会在毫无报错中悄悄停滞
  choice: 做法是精度分工：计算密集的矩阵乘法用 FP16/BF16 吃硬件的高速通道，参数的主本与累加用 FP32 保住小更新。混合精度省的是算力与带宽，主本的 28 GB 是为「别把学习吞掉」付的保费
  tradeoff: 代价是账面变厚且多一层转换：同一参数存两份、每步要在两种精度间搬运与同步，显存账（本课的 16 字节/参数）有一半是在为精度分工买单；若改用全 FP32 训练，计算速度又会被砍掉一截
  root: 根子在组成科那本浮点账上：位数决定可分辨的最小变化，动态范围与分辨率不可兼得。深度学习的数值问题极少是算法问题，几乎都是表示问题——先查这数在当前精度里还分不分得清，再怀疑别的
- mechanism: 为什么 batch 不能无限放大：梯度噪声为什么不纯是坏事
  problem: 根本约束在优化地形上：用全量数据算出的最准梯度，每步最可信，但步数被昂贵地压到最少，且经验表明沿最准方向收敛到的解未必泛化最好；小批的噪声步子虽抖，却带着探索性，能避开一部分尖锐的坏地形
  choice: 做法是把 batch 放在硬件吃得饱与噪声还有用的交界带上，并让学习率随 batch 联动。批的上限由显存与并行形态先卡死，实际取值是在这个上限之内，拿验证集的成绩一点点试出来的经验值
  tradeoff: 代价是这组成了训练里最玄学的一对参数：没有公式能从模型尺寸直接算出最优批与率，换数据、换模型都要重调，它们与优化器、衰减计划纠缠在一起，构成训练工程师无法外包给手册的核心手感
  root: 根子在随机优化的本质上：我们手里从来不是地形图，而是带着噪声的罗盘。噪声既是误差也是探索的来源，调参的技艺就是控制这份噪声的剂量——把它当纯粹的敌人消灭掉，反而会连它带来的泛化一起消灭
terminal:
- cmd: python3 -c "n=7e9; print('params GB', n*2/1e9, 'grads', n*2/1e9, 'fp32 master', n*4/1e9, 'adam', n*8/1e9, 'total', n*16/1e9)"
  note: 复算本课的显存账单：应得到 14 / 14 / 28 / 56 / 112
