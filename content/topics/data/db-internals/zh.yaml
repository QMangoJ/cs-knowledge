minutes: 30
prereq:
- data/btree-index
- os/virtual-memory
objectives:
- 用三件套心智模型说清一次写入与一次读取各自经过哪些部件
- 解释页为什么必须等大、读写为什么以页而不是行为单位
- 按顺序复述提交成立的瞬间发生了什么、断电之后靠什么恢复
aiLink: 读懂这一课，才能读懂现代数据基础设施的取舍：向量数据库的索引同样按页与块组织，LLM 推理里的 KV 缓存分页（PagedAttention）借的正是「等大分块 + 按号定位」的页思想——存储与推理在最底层用的是同一套算术。
design:
- mechanism: 为什么数据库敢在数据还没写进文件时就回复「提交成功」——因为它把承诺押在一本只许往后写的日志上，而不是押在数据文件上
  problem: 根本约束是两头堵：如果每次改完都立刻把涉及的页写回文件，那是散布在全盘的随机写，慢且贵，提交延迟会被它拖死；如果只改内存不落盘，一断电就把已提交的数据弄丢，持久性当场破产，快与稳看似只能二选一
  choice: 做法是立一条预写日志的铁律：数据页可以躺在内存里慢慢排队，但描述这次修改的日志必须先顺序追加并刷盘，做完这一步才许回复提交成功；日志是天然只增的流，顺序写比随机写便宜一到两个数量级，于是最热的提交路径只付最便宜的那种 IO
  tradeoff: 代价有三笔：一是每次提交至少等一次日志刷盘，延迟有了硬下限，要靠把多个事务拼到同一批刷盘（组提交）来摊薄；二是系统必须养着后台线程做检查点、推进书签、回收日志；三是崩溃恢复要花时间重演积压的日志，重启速度从此和日志积压量挂钩
  root: 根子在介质的价格表上：顺序与随机之间差着数量级，那就把必须立刻做的事全部改造成顺序的（记账），把可以慢慢做的事留给随机的（回写数据页）；日志本质上是替随机写买的一份保险单，而保费按顺序写的价格收取
- mechanism: 为什么数据库搬运数据永远整页进行，明明你只想要其中一行——因为页同时是硬件的块、定位的地址与全系统的记账单位
  problem: 根本约束有三层：硬件按块读写，你要一行它也只能给一整块；无序的大文件没法快速定位，必须先有一种能靠计算得出的地址；缓存、刷盘、日志、恢复这些子系统若各用各的计量单位，光是对齐与换算就会让整套系统散架
  choice: 做法是把文件切成完全等大的页并顺序编号：位置等于页号乘页大小，定位变成一次乘法；一行数据连同它的邻居一起装进页里，搬运、缓存、落盘、恢复全部以页为单位进行，上层结构（B+ 树）也直接拿页当节点，不再另设单位
  tradeoff: 代价是放大与浪费：改一行也要搬整页（写放大），页里永远有填不满的空隙（内部碎片），页大小必须在搬运成本与浪费比例之间选折中，长行超过一页还得再加一套溢出页机制兜底；16KB 这类取值是长期磨合出的经验解，不是算出来的最优解
  root: 根子在局部性与可计算性这两条底层事实上：数据访问天然扎堆，整页预取大概率不亏本；等大分块又让「在哪」从搜索问题变成算术问题。数据库与操作系统的虚拟内存不约而同都选了页，正是因为它们撞上的是同一堵墙
- mechanism: 为什么数据库不信任操作系统的文件缓存，非要自己再维护一个缓冲池，把页的进出全管起来
  problem: 根本约束是信息差：操作系统只看见文件与字节，看不见语义——它不知道哪页是 B+ 树的根（请出去一次，全站查询陪葬）、哪页正被一个报表查询顺序扫过（留着纯属浪费）、哪页是脏的且写回次序被日志纪律锁死；按通用策略管数据库的页，必然在最要紧的地方犯错
  choice: 做法是数据库绕开操作系统的页缓存（直接 IO），自己维护缓冲池：页的换入、淘汰与刷盘全由最懂访问模式的一方说了算，淘汰算法也能按数据库的脾气改造，比如给顺序扫描路过的页降权，不许它冲掉真正的热点页
  tradeoff: 代价是重复建设与内存账目变复杂：同一份数据在两层缓存各存一份的风险，要靠绕开 OS 缓存来避免；缓冲池大小得人工规划，给多了饿着操作系统与其他进程，给少了命中率当场塌方，等于把内存管理的责任从操作系统手里接到了运维手里
  root: 根子是一条通用工程原则：缓存策略的好坏取决于对访问模式的了解程度，谁离业务近，谁就该拿主导权；下层不够懂时上层再实现一遍不是浪费，而是把决策放回信息最全的地方——虚拟机、浏览器与数据库里到处都是这个形状
terminal:
- cmd: SHOW VARIABLES LIKE 'innodb_page_size';
  note: 在 MySQL 里看 InnoDB 的页大小，默认 16384（16KB）
- cmd: SHOW VARIABLES LIKE 'innodb_flush_log_at_trx_commit';
  note: 值为 1 表示每次提交都把 redo 刷进磁盘
- cmd: PRAGMA page_size;
  note: 在 sqlite3 里看 SQLite 的页大小，默认 4096（4KB）
- cmd: PRAGMA journal_mode=WAL;
  note: 把 SQLite 切到 WAL 模式，观察多出的 -wal 文件
