steps:
- id: model
  title: 先认三件套：身体、办公桌和账本
  tldr: 数据库没有多神秘：数据住在页文件里，修改发生在内存里，可靠性押在日志上。
  body: '先把数据库拆开看，它其实只有三件套。第一件是身体：一个躺在磁盘上的大文件，里面装着你全部的表和索引，但这个文件不是一整坨，而是被整齐切成许多等大的小块，每块叫一页（page），数据最终都住在这些页里。第二件是办公桌：内存里划出的一大片区域，叫缓冲池（Buffer Pool），文件里的页要先搬上桌才能被翻看和修改，引擎从不在磁盘上直接涂改。

    第三件是账本：一本只许往后写、不许回头涂改的流水日志，引擎做的每笔重要修改都先记账，记完账才敢对外说「办妥了」。三件套的分工一句话就能记住：数据最终住在文件里，修改发生在内存里，可靠性押在日志上。

    后面两段旅程——一次写入、一次读取——本质上都是在这三处之间搬运页：写入时页从文件上桌、在桌上被改、改动先进账本、最后才回写文件；读取时先看桌上有没有这页，没有才去文件里取。先把这张地图钉在脑子里，剩下的机制（锁、版本、检查点）都只是在这张地图上补的细节，不会再有第四个地方冒出来。

    还有一个先入为主的观念要提前立住：同一行数据，在同一瞬间，三处的内容可以正大光明地不一样——内存里是刚改完的新值，日志里躺着改动记录，磁盘文件里还是旧值。这不是出错，而是这套机器的正常工作状态。整门课要讲的全部精巧之处，说穿了就是如何让这种「三处不一致」既跑得快、又永远不至于真的丢数据。'
