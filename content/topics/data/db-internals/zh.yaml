- id: write-locate
  title: 写入之旅·一：接单、定位、先上桌
  tldr: UPDATE 先被拆成执行计划，再顺 B+ 树算出行住在哪页，最后先问缓冲池要页。
  body: '现在正式上路。场景是一句 UPDATE accounts SET balance = balance - 100 WHERE id = 7。第一幕是接单：引擎把这句 SQL 解析成执行计划——改哪张表、走哪个索引、动哪一列，都在这里定死。接着是定位：顺着上一课的 B+ 树从根页一层层往下跳，算出 id=7 住在哪一页，先假设是第 312 页。

    第二幕是找页，而且顺序不能反：先问 Buffer Pool「312 页在你桌上吗」。在，叫命中，零磁盘开销直接开工；不在，叫未命中，只能去磁盘的数据文件里，按 312 × 16KB 算出的偏移把这一页整页读进来放上桌——顺带把同页的几十行邻居也带了进来。这次磁盘读是整条写路径上最贵的一步，所以缓冲池的命中率几乎就是数据库的生命线。

    留意此刻的进度：页只是被「借阅」到了内存，磁盘上的原件纹丝未动，修改还没开始，更没有任何东西落盘。把这一步和后面几步连起来看你会发现，数据库做一次更新，花在「找」上的功夫远多于花在「改」上——这和上一课索引存在的理由正好呼应。'
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: a
      label: 应用：提交一笔扣款
    - lane: engine
      id: e
      label: 引擎：解析计划、顺 B+ 树定位
      highlight: true
    - lane: pool
      id: p
      label: Buffer Pool：先找 312 页
    - lane: disk
      id: d
      label: 数据文件：未命中才按偏移读页
