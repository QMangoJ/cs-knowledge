title: 数据库底层：页、日志与一次读写之旅
summary: 数据库的身体是一个被切成等大页的文件，干活在内存、承诺靠日志——跟着一笔扣款和一次查询，走完数据在系统里的全程。
premise: 以 MySQL（InnoDB）为主要样本：accounts 表里 id=7 的一行，一笔扣 100 的更新与一次按 id 的查询；页大小取 InnoDB 默认的 16KB。
position: >-
  本课位于数据存储板块的新一段「引擎内幕：页、日志与一次读写」，卡在 B+ 树与事务两课之间：上一课回答页怎样组织成一棵树，本课回答页在整台机器里怎样流动——从磁盘进内存、在内存里被涂改、靠日志抢先落盘、最后随检查点写回文件。学完你能完整复述一笔更新从解析到提交成立、再到断电恢复的全程，也能说清一次查询的快慢为什么几乎只由缓冲池命中与否和版本链长短决定。
bridge:
  prev: >-
    上一课把 B+ 树讲透了页与页之间怎样组织、一次点查怎样只跳三四页，本课接过那块砖往系统里看：一页被读进来之后放在哪、改完之后靠什么落盘、崩溃之后凭什么复活。
  next: >-
    本课的读取之旅在版本链前停了脚：只说了沿 undo 往回挑一个对自己可见的版本，下一课就把这条链彻底摊开，讲清快照的判定规则、四档隔离级别各自放行什么怪现象，以及长事务为什么能把全库拖慢。
overview:
- key: 一句话总结
  value: 数据库只有三件套：切成等大页的数据文件（身体）、内存里的缓冲池（办公桌）、只许往后写的日志（账本）
- key: 页是什么
  value: 文件被切成的等大块；第 N 页的位置 = 页号 × 页大小，一次乘法定位
- key: 写入的次序
  value: 页先上桌、旧值先留底、改动只落在内存，日志刷盘的那一刻提交才成立，数据文件慢慢再说
- key: 读取的关键
  value: 先问缓冲池有没有这页，再沿版本链挑一个对自己可见的版本，全程不上锁
- key: 崩溃了怎么办
  value: 重启时顺日志重做已提交的、拿 undo 擦掉没提交的，世界恢复到承诺过的样子
- key: SQLite 的对照
  value: 同一套三件套压缩进一个函数库：没有服务器进程，单写者，日志换成追加整页的 WAL
