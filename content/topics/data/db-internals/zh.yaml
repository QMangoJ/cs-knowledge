- id: page-why
  title: 为什么最小单位是页，不是一行
  tldr: 页的大小算清了，还剩一个更基本的问题没答：你要的明明只是某一行，为什么搬运的最小单位是整页，而不是一行？这一步给出三个根本原因：硬件本来就按块给货、被查的那一行的邻居大概率马上也要被查、全系统要用同一种单位记账。
  body: >-
    你可能会问：我要的明明只是某一行，为什么非得整页搬运？第一个原因是硬件的脾气：磁盘和 [[SSD]] 在物理上就按块读写，你只想要 100 字节，它也只能把一整块端上来。把读写单位定成页，等于顺着硬件的块放大一号对齐，而不是跟它别扭。

    第二个原因是邻居的便宜。数据访问有局部性：今天被查的那一行，左邻右舍近期大概率也会被查——按 id 顺序翻、看最近一小时的记录，都是这个道理。整页搬进内存等于买一行送一排：把 id=7 所在那页读进来，id=8 到 id=80
    顺道全在桌上，后面的查询直接在内存里命中。

    第三个原因最隐蔽：页是全系统的统一货币。缓存淘汰按页请出、刷盘按页写回、日志按页记账（「第几页的哪处改成了什么」）、崩溃恢复按页重做、B+ 树按页组织节点。所有子系统都拿页结算，零件之间才严丝合缝。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: pool
      id: p
      label: Buffer Pool：整页常驻
      highlight: true
    - lane: disk
      id: d
      label: 磁盘：按块读写
    messages:
    - id: m1
      from: d
      to: p
      label: 整页搬运：买一行，送一排
      active: true
    registers:
    - name: 原因一
      value: 硬件按块读写，最小一份就是一块
    - name: 原因二
      value: 局部性：邻居大概率马上要用
    - name: 原因三
      value: 缓存/刷盘/日志/恢复全按页记账
  log:
