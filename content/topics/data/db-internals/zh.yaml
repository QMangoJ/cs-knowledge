    event: 锁与底稿就位，改动只发生在内存，磁盘仍是旧值
- id: write-redo-commit
  title: 写入之旅·三：日志刷盘的那一刻，提交才成立
  tldr: 改动先写成流水账顺序追加进 redo，账刷进磁盘，数据库才敢回你「提交成功」。
  body: '现在到全课最关键的一幕。引擎把刚才这次修改写成一条流水账，记法是贴着物理位置的：「第 312 页、某某偏移处、改成什么字节」，然后顺序追加进一本叫 redo 的日志——redo 就是重做日志，专门用来在事故之后把改动原样重演一遍。注意动词是追加：日志永远只在尾巴上往后写，从不回头改前面，这正是它快的原因，顺序写是磁盘最便宜的动作。

    提交（COMMIT）这一刻，规矩只有一条、毫不动摇：先让这条 redo 真正刷进磁盘（完成一次 fsync，把数据从操作系统的缓存里逼到盘面上），数据库才敢回你「提交成功」。这条次序有个名字叫预写日志（WAL，Write-Ahead Logging）：日志必须走在数据页前面；数据页什么时候写回可以商量，日志不行。

    于是出现一个反直觉却完全正确的画面：你收到「成功」时，磁盘数据文件里 id=7 还是 1000，新值 900 只活在内存和日志里。数据库敢这么承诺，底气全在那本账上——接下来哪怕立刻断电，重启时照着 redo 从头重演，已提交的一笔都不会少。承诺的有效性不押在数据文件上，而押在日志上，这是整个存储引擎最核心的一次置换。'
  derivation: original
  sources:
  - ref: mysql-innodb-docs
    locator: InnoDB Redo Log 内部文档（预写日志与提交刷盘）
    claim: redo 日志是对数据页修改的预写日志，提供持久性；事务提交时，用户线程必须等 redo 刷盘到该事务日志的末尾
