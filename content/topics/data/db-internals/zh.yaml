title: 数据库底层：页、日志与一次读写之旅
summary: 数据库的身体是一个被切成等大页的文件，干活在内存、承诺靠日志——跟着一笔扣款和一次查询，走完数据在系统里的全程。
premise: 以 [[MySQL]]（InnoDB）为主要样本：accounts 表里 id=7 的一行，一笔扣 100 的更新与一次按 id 的查询；页大小取 InnoDB 默认的 16KB。
position: 本课位于数据存储板块的新一段「引擎内幕：页、日志与一次读写」，卡在 B+
  树与事务两课之间：上一课回答页怎样组织成一棵树，本课回答页在整台机器里怎样流动——从磁盘进内存、在内存里被涂改、靠日志抢先落盘、最后随[[检查点]]写回文件。学完你能完整复述一笔更新从解析到提交成立、再到断电恢复的全程，也能说清一次查询的快慢为什么几乎只由[[缓冲池]]命中与否和版本链长短决定。
bridge:
  prev: 上一课把 B+ 树讲透了页与页之间怎样组织、一次点查怎样只跳三四页，本课接过那块砖往系统里看：一页被读进来之后放在哪、改完之后靠什么落盘、崩溃之后凭什么复活。
  next: 本课的读取之旅在版本链前停了脚：只说了沿 [[undo]] 往回挑一个对自己可见的版本，下一课就把这条链彻底摊开，讲清快照的判定规则、四档隔离级别各自放行什么怪现象，以及长事务为什么能把全库拖慢。
overview:
- key: 一句话总结
  value: 数据库说到底只有三件套，切成等大页的数据文件是身体，内存里的[[缓冲池]]是办公桌，只许往后写的日志是账本。后面所有花哨的机制，都是围着这三样东西怎么配合转的。
- key: 页是什么
  value: 页是文件被切成的等大块，每页大小固定，所以位置很好算。第 N 页的位置等于页号乘以页大小，一次乘法就能定位，不用从头数。
- key: 写入的次序
  value: 一次写入的次序是，页先被搬进缓冲池，改之前的旧值先抄一份留底，改动只落在内存里。等日志刷进磁盘的那一刻，这次提交才算成立，数据文件本身可以慢慢再写回去。
- key: 读取的关键
  value: 读一页先问缓冲池里有没有，有就直接用，没有才去磁盘搬。拿到页之后还要沿版本链挑一个对当前事务可见的版本，整个读过程不上锁，不挡着别人写。
- key: 崩溃了怎么办
  value: 崩溃后重启，数据库顺着日志把已经提交的改动重做一遍，再拿 [[undo]] 把没提交的擦掉。恢复完的世界，就是它对外承诺过的样子，没提交的东西当作没发生过。
- key: "[[SQLite]] 的对照"
  value: SQLite 是把同一套三件套压缩进一个函数库，没有独立的服务器进程，同一时刻只许一个写者。日志也换了形式，用追加整页的 [[WAL]]（Write-Ahead Logging，预写日志：改数据页之前，必须先把描述改动的日志写进磁盘）代替，道理还是一样，日志先行、数据随后。
