  - id: page-what
    title: 文件切成等大页：一次乘法算出偏移，16KB 是读写折中
    tldr: 把数据文件裁成尺寸严格相等的页（InnoDB 默认 16KB，[[SQLite]] 默认 4KB）并从 0 编号后，第 N 页在文件中的字节偏移就是 N × 页大小，一次乘法直接定位。
    body: |-
      如果数据库文件是一整卷没有页码的长纸，想找第 312 处内容只能从头往后翻。把它裁成每页尺寸完全相同的书——InnoDB 默认 `16KB`（16384 字节），[[SQLite]] 默认 `4KB`（4096 字节），页号从 `0` 开始顺序排下去——找位置立刻变成算术：第 `N` 页在文件里的起始偏移就是 `N × 页大小`，一次乘法直达，不用逐页数过去。「严格等大」不是整齐癖，而是乘法成立的前提：一旦页有大有小，找位置就得退回从头累加长度的老路，跟数组下标寻址、内存分页是同一种把戏。

      一张 16KB 的页能塞多少东西？扣掉页头等固定开销后，按一行约 200B 算能塞七八十行；要是装上一课 [[B+ 树]]的内节点导航项，一页能装上千个键——B+ 树之所以三四层封顶，靠的就是这块大砖头。

      那砖头为什么定在 16KB，不再大一点或小一点？页切太小，一页装不下几行，树被迫长高、查询多跳磁盘；页切太大，只改一行也要整页搬运和写回，[[缓冲池]]能常驻的热页数也会缩水。16KB 是服务器负载长期磨出来的折中点——换成跑在手机与嵌入式设备上的 SQLite，按小内存重新算账，默认页大小就顺理成章定在了 4KB。
    derivation: original
    sources:
      - ref: mysql-innodb-docs
        locator: 17.8.1 InnoDB Startup Configuration（innodb_page_size）
        claim: InnoDB 默认页大小为 16384 字节（16KB），可在初始化时改为 4KB 至 64KB
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
      - ref: sqlite-docs
        locator: File Format 文件格式文档（page_size）
        claim: SQLite 页大小可为 512 至 65536 的 2 的幂，默认 4096 字节（4KB）
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
