- id: page-what
  title: 页是什么：一卷纸和一本书的区别
  tldr: 没有页码的一卷纸只能从头翻；切成等大页之后，位置 = 页号 × 页大小，一次乘法翻到。
  body: '把一个数据库文件想象成一整卷没有页码的纸：想在里面找任何一行，只能从头往后翻，翻到哪儿算哪儿。现在把这卷纸裁开、装订成一本有页码的书：每一页大小完全相同——InnoDB 默认 16KB，SQLite 默认 4KB——页从 0 开始顺序编号。省事的地方随即出现：第 N 页在文件里的位置，就是 N 乘以页大小，一次乘法直接翻到，不必逐页去找。

    「等大」不是整齐癖，而是这条乘法成立的前提：页有大有小，位置就得靠从第一页起逐页累加长度来推算，等于退回到从头数的老路。所以所有数据库都把文件切成等大页，页号就是地址，页大小就是步长——跟数组下标算地址、跟内存分页是同一种把戏。

    那一页能装多少行？粗算一笔：16KB 的一页，一行若是 200 字节上下，能塞七八十行（还要扣掉页头之类的开销）。上一课的 B+ 树之所以只有三四层，靠的正是「一页装很多」：导航页一页装上千个键，数据页一页装几十行。页是整座数据库的基本砖块，砖的尺寸决定了所有上层建筑的形状。

    砖也不是越大越好：页太小，一页装不下几行，树被迫长高、每次查询要多跳几页；页太大，为了改一行要搬运和写回的数据成倍膨胀，缓冲池里能常驻的页数也变少。16KB 是这笔账长期磨出来的折中点，不是哪个公式算出的天命——记住这一点，后面讲 SQLite 为什么用 4KB 时就不会奇怪：它的舞台是手机与嵌入式设备，账要按小内存重新算。'
  derivation: original
  sources:
