title: 数据库底层：页、日志与一次读写之旅
summary: 存储引擎说穿了只靠三件套配合：切成等大页的数据文件是身体，内存里的[[缓冲池]]是干活的办公桌，只许顺序追加的预写日志（[[WAL]]）是保命的账本——一切修改都在内存页上完成，靠日志抢先刷盘兑现持久性，脏数据页留给后台[[检查点]]从容写回。本课跟着 7 号账户的一笔扣款与一次查询，走完数据页从磁盘进内存、记日志提交、断电恢复到无锁多版本读取的全程，最后对照嵌入式函数库 [[SQLite]] 的同构实现。
premise: 应用向 [[MySQL]]（InnoDB，默认 16KB 页）发出一句给 7 号账户扣款 100 元的请求：UPDATE accounts SET balance = balance - 100 WHERE id = 7，紧接着又查了一次余额。收到「提交成功」的那一瞬间，磁盘上的表文件里其实还写着扣款前的旧余额 1000——数据库凭什么敢在数据还没写回表文件时就拍胸脯说办妥了，万一这秒钟断电又怎么把账找回来？
position: 本课位于数据存储学科第二板块「引擎内幕：页、日志与一次读写」，承接上一课 B+ 树的页级查找与操作系统虚拟内存的换页思想，往下为下一课并发事务铺平底座。学完你能完整复述一笔更新从定位、写 [[undo]] 与 [[redo]] 到断电恢复的全链路，也能说清查询快慢为何取决于[[缓冲池]]命中率与版本链长短。
bridge:
  prev: 上一课算清了顺着 B+ 树跳三四页就能定位到目标行所在的页；这一课接过这张页往引擎肚子里看：它被搬进内存后住在哪儿、改完靠什么落盘保命、突然断电后又凭什么原样复活。
  next: 本课的读取路径在版本链前留了悬念：只说顺着 [[undo]] 挑一个对自己可见的旧版本，还没拆解可见性的精确标尺。下一课就把这条多版本链彻底摊开，看四档隔离级别各自放行什么异常，以及长事务为什么能把整台库拖垮。
overview:
  - key: 一句话总结
    value: 存储引擎只有三件套：切成等大页的数据文件存老底，内存[[缓冲池]]当办公桌，只追加的日志当账本；所有读写都只在这三处之间倒腾。
  - key: 等大页的算术
    value: 文件被切成固定大小的页（InnoDB 默认 16KB，[[SQLite]] 默认 4KB），第 N 页的文件偏移就是 N × 页大小，一次乘法直达。
  - key: 写入的次序
    value: 页先搬进缓冲池，上行锁、把旧值抄进 [[undo]] 留底，再改脏内存页；等 [[redo]] 日志顺序刷盘（[[fsync]]）提交即成立，[[脏页]]由后台慢慢写回。
  - key: 无锁读取
    value: 读一页先查缓冲池，未命中才读盘；拿到页后按快照（[[ReadView]]）沿 undo 版本链挑可见版本，全程不加锁、读写互不挡道。
  - key: 崩溃恢复
    value: 断电重启后先顺着 redo 重做所有已提交改动，再用 undo 擦除未提交半成品，把世界精确还原到生前承诺过的状态。
  - key: "[[SQLite]] 的对照"
    value: SQLite 把同一套三件套压进应用进程内的函数库，单写者并发，[[WAL]] 模式下把整页新版本追加进 -wal 文件，同样遵循日志先行、检查点回搬。
