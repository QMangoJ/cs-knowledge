- id: write-lock-undo
  title: 写入之旅·二：先上锁、先留底，再改内存页
  tldr: 动手之前两件规矩事：把这一行锁住，把改之前的旧值抄进 undo 仓库，然后才许改。
  body: '页上了桌，动手之前还有两件规矩事。第一件是上锁：把 id=7 这一行锁住（行级排他锁，意思是「这行我正在改，别人先等着」），锁的是行而不是整页，同页的其他行别人照样能动。第二件是留底：把这一行改之前的旧值（balance = 1000）抄一份，存进一个叫 undo 的地方——可以理解成引擎的后悔药仓库。两件都办妥，才许动手改。

    留底看着像浪费，其实一石二鸟。其一，事务要是中途反悔或执行失败，拿着 undo 就能把数据擦回原样，这是回滚的原料。其二，别的事务可能正读着这一行，它们需要看到「还没被我改动」的旧版本，undo 里这份拷贝就是留给它们的快照——读取之旅会顺着这条线展开，这里先把伏笔埋下。

    然后才是真正的修改，而且只改桌上这一份：内存页里 id=7 的 balance 被写成 900，这一页随即被打上「脏」的标记——脏页就是内存比磁盘新、迟早要还账的页。到这一步为止，磁盘上的数据文件里依然写着 1000；世界上只有三处知道真相：内存里的脏页、undo 里的旧账，以及马上要讲的那本日志。'
  derivation: original
  sources:
