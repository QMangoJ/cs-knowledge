    - name: 记录区
      value: 一行挨一行塞进来
    - name: 页目录
      value: 槽位指针，页内二分靠它
  log:
  - mode: 放大
    event: 一页之内自带页目录这个小索引，页内找一行先二分定位，不必逐条比对
- id: page-os
  title: 数据库为什么在操作系统之上再自管一层缓存
  tldr: 看到这里你可能会觉得眼熟：把磁盘页换进内存、把不用的页请出去，这和操作系统管内存的办法几乎一样。那数据库为什么还要自己再管一层缓存，不直接用操作系统的？这一步就回答这个重复建设的问题：操作系统不懂数据库的访问模式，不知道哪一页最要紧。
  body: >-
    把磁盘页换进内存、把最久没用的页请出去，这套动作和操作系统虚拟内存里的缺页与页面置换一模一样。Buffer Pool
    就是数据库在操作系统之上、亲手又搭的一层「虚拟内存」：页在磁盘与内存之间流动，热页常驻、冷页淘汰，逻辑完全同构，区别只是 OS 管的是内存页、数据库管的是数据页。

    为什么要多此一举，不直接蹭操作系统的文件缓存？因为操作系统不知道这些页都是谁。它不知道哪一页是 B+
    树的根、每次查询都要碰，请出去一次全站陪葬；不知道哪一页正被一个报表查询顺序扫过、留着纯属浪费；更不知道哪一页是脏的、写回顺序还被日志纪律锁死。按通用策略管数据库的页，必然在最要紧的地方犯错。

    分工是：数据库用直接 IO 绕开操作系统的页缓存，避免同一页在两层缓存里各存一份、白占内存；操作系统退回到只管进程与文件本身。这看着重复，其实是「谁更懂、谁来管」这条工程原则的必然结果。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: o
      label: 操作系统：页缓存（被直接 IO 绕开）
    - lane: engine
      id: e
      label: 数据库：自管 Buffer Pool 的进出
      highlight: true
    messages:
    - id: m1
      from: e
      to: o
      label: 你不懂我的访问模式，我自己管
      active: true
    registers:
    - name: OS 页缓存
      value: 只认文件，不认页的身份
    - name: 数据库[[缓冲池]]
      value: 知道根页、热页、[[脏页]]各是谁
  log:
  - mode: 分工
    event: 同一种换页思想在操作系统和数据库两层各跑一遍，页的进出决策权交给最懂访问模式的数据库这一方
- id: write-locate
  title: 写入之旅·一：接单、定位、先上桌
  tldr: 地图和零件都认完了，现在正式跟着一笔业务跑一遍。场面是一句给 7 号账户扣 100 的更新：它先被拆成执行计划，再顺着 B+ 树算出这一行住在哪一页，最后先问[[缓冲池]]要页。这一步只走到把页拿到手，改还没开始。
  body: >-
    现在正式上路。场景是一句 UPDATE accounts SET balance = balance - 100 WHERE id = 7。第一幕是接单：引擎把这句 SQL
    解析成执行计划——改哪张表、走哪个索引、动哪一列，都在这里定死。接着是定位：顺着上一课的 B+ 树从根页一层层往下跳，算出 id=7 住在哪一页，先假设是第 312 页。

    第二幕是找页，而且顺序不能反：先问 Buffer Pool「312 页在你桌上吗」。在，叫命中，零磁盘开销直接开工；不在，叫未命中，只能去磁盘文件里按 312 × 16KB
    算出的偏移把整页读进来放上桌。这次磁盘读是整条写路径上最贵的一步，所以缓冲池的命中率几乎就是数据库的生命线。

    留意此刻的进度：页只是被「借阅」到内存，磁盘原件纹丝未动，修改还没开始、没有任何东西落盘。数据库做一次更新，花在「找」上的功夫远多于花在「改」上——这和上一课索引存在的理由正好呼应。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: a
      label: 应用：提交一笔扣款
    - lane: engine
      id: e
      label: 引擎：解析计划、顺 B+ 树定位
      highlight: true
    - lane: pool
      id: p
      label: Buffer Pool：先找 312 页
    - lane: disk
      id: d
      label: 数据文件：未命中才按偏移读页
    messages:
    - id: m1
      from: a
      to: e
      label: UPDATE … WHERE id = 7
      active: true
    - id: m2
      from: e
      to: p
      label: 312 页在桌上吗？
    - id: m3
      from: e
      to: d
      label: 未命中：读入第 312 页
    registers:
    - name: 目标页
      value: 第 312 页（刚读进内存）
    - name: 磁盘原件
      value: 未动
  log:
  - mode: 写入·定位
    event: 页已经搬上桌了，但修改还没有开始，磁盘上的数据文件仍然是旧值
- id: write-lock-undo
  title: 写入之旅·二：先上锁、先留底，再改内存页
  tldr: 页已经拿到手了，但还不能直接改。上一步留下的局面是：磁盘上的原件还没动，改动一旦开始，中途反悔或者别人正读着这一行怎么办？所以动手之前先办两件规矩事：把这一行锁住，再把改之前的旧值抄进 [[undo]] 仓库留底，两件都办妥才许改内存里的页。
  body: >-
    页上了桌，动手之前还有两件规矩事。第一件是上锁：把 id=7 这一行锁住（行级排他锁，「这行我正在改，别人先等着」），锁行不锁页，同页的其他行别人照样能动。第二件是留底：把改之前的旧值（balance =
    1000）抄一份，存进一个叫 undo 的地方——可以理解成引擎的后悔药仓库。两件都办妥，才许动手改。

    留底看着像浪费，其实一石二鸟：其一，事务中途反悔或失败，拿着 undo 就能把数据擦回原样，这是回滚的原料；其二，别的事务可能正读着这一行，它们需要看到改动前的旧版本，undo
    这份拷贝就是留给它们的快照——读取之旅会顺着这条线展开。

    然后才是真正的修改，而且只改桌上这一份：内存页里 id=7 的 balance 被写成 900，这一页随即被打上「脏」的标记——[[脏页]]就是内存比磁盘新、迟早要还账的页。到这一步，磁盘文件里依然写着
    1000；只有三处知道真相：内存里的脏页、undo 里的旧账，以及马上要讲的那本日志。
  derivation: original
  sources:
  - ref: mysql-innodb-docs
    locator: 10.5.2 Optimizing InnoDB Transaction Management（undo 与旧版本保留）
    claim: 行被修改或删除后，旧数据保留在 undo 日志中，直到早先开始的并发事务结束，它们仍能读到修改前的状态
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: engine
      id: e
      label: 引擎：上行锁、抄旧值
      highlight: true
    - lane: pool
      id: p
      label: Buffer Pool：第 312 页变脏（900）
    - lane: disk
      id: d
      label: 磁盘：数据文件仍是 1000；undo 存着旧值
    messages:
    - id: m1
      from: e
      to: p
      label: 给 id=7 上行锁，只改内存页
      active: true
    - id: m2
      from: e
      to: d
      label: 旧值 1000 先抄进 undo
    registers:
    - name: 内存里的页
      value: balance = 900（脏页）
      changed: true
    - name: undo 旧值
      value: balance = 1000
    - name: 磁盘数据文件
      value: balance = 1000（未动）
  log:
  - mode: 写入·留底
    event: 行锁和旧值底稿都已就位，改动只发生在内存里的页上，磁盘上的数据文件仍是旧值
- id: write-redo-commit
  title: 写入之旅·三：日志刷盘的那一刻，提交才成立
  tldr: 内存里的页已经改成新值了，可它还没落盘，这时候凭什么敢跟用户说提交成功？这一步是全课最关键的一幕：把这次改动先写成流水账，顺序追加进 [[redo]]，等这本账刷进磁盘，数据库才敢回你提交成功。
  body: >-
    现在到全课最关键的一幕。引擎把这次修改写成一条贴着物理位置的流水账：「第 312 页、某某偏移处、改成什么字节」，顺序追加进一本叫 redo 的日志——redo
    就是重做日志，专门用来在事故之后把改动原样重演一遍。动词是追加：日志只在尾巴上往后写、从不回头改前面，这正是它快的原因——顺序写是磁盘最便宜的动作。

    提交（COMMIT）这一刻，规矩只有一条、毫不动摇：先让这条 redo 真正刷进磁盘（完成一次 [[fsync]]，把数据从操作系统缓存逼到盘面上），才敢回你「提交成功」。这条次序叫预写日志（[[WAL]]，Write-Ahead
    Logging）：日志必须走在数据页前面；数据页什么时候写回可以商量，日志不行。

    于是出现一个反直觉却完全正确的画面：你收到「成功」时，磁盘数据文件里 id=7 还是 1000，新值 900 只活在内存和日志里。敢这么承诺，底气全在那本账上——接下来哪怕立刻断电，重启时照 redo
    重演，已提交的一笔都不会少。承诺的有效性不押在数据文件上，而押在日志上，这是整个存储引擎最核心的一次置换。
  derivation: original
  sources:
  - ref: mysql-innodb-docs
    locator: InnoDB Redo Log 内部文档（预写日志与提交刷盘）
    claim: redo 日志是对数据页修改的预写日志，提供持久性；事务提交时，用户线程必须等 redo 刷盘到该事务日志的末尾
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: engine
      id: e
      label: 引擎：等 redo 刷盘才回复
    - lane: pool
      id: p
      label: Buffer Pool：[[脏页]]先躺着
    - lane: disk
      id: dd
      label: redo 日志：追加并刷盘 ★
      highlight: true
    messages:
    - id: m1
      from: e
      to: dd
      label: 先落账，再回复成功
      active: true
    registers:
    - name: 内存里的页
      value: balance = 900（脏页）
    - name: redo 日志
      value: 已刷盘 ✓ 提交成立
      changed: true
    - name: 磁盘数据文件
      value: balance = 1000（仍是旧值）
  log:
  - mode: 写入·提交
    event: redo 日志落盘的这一瞬间，提交才正式算数；数据文件可以迟到慢慢写，账必须先到
- id: write-checkpoint
  title: 写入之旅·四：[[脏页]]慢慢还账，与断电彩蛋
  tldr: 提交已经成立了，但改过的页还躺在内存里欠着账没写回磁盘。这一步看这笔账平时怎么慢慢还：脏页由后台成批写回，[[检查点]]像书签一样往前推进；顺带把最坏的场面也演一遍：这时候突然断电，重启时靠 [[redo]] 重做、靠 [[undo]] 撤销，世界照样能复原成承诺过的样子。
  body: |-
    账记完了，脏页还欠着。什么时候还？由后台线程在系统空闲时，或[[缓冲池]]需要腾地方时，成批把脏页写回数据文件。这叫检查点（checkpoint），像一枚书签：标记「这个位置之前的修改，数据文件里已经全有了」，日志里书签之前的部分从此可以回收重用。把随机写回攒成批慢慢做，正是日志先行换来的自由。
    现在放出彩蛋：假设提交成功后、脏页还没回写的那一秒断了电。重启时引擎做两件事：先顺着 redo 把日志重演一遍，已提交的修改被重新做到数据页上，哪怕它们生前从没写回过；再用 undo 把改到一半、没来得及提交的事务留下的痕迹一一擦净。重做在前、撤销在后，数据库从断电里醒来时，世界和它断电前承诺过的分毫不差。
    回头算总账：应用等到的只有一次日志刷盘的延迟（顺序写，便宜）；昂贵的数据页随机写回被推迟、合并、批量化；崩溃恢复的成本押后到重启时一次算清。存储引擎的取舍手势是：让最热的路径只付最便宜的 IO，其余的账记到冷处慢慢还——后面每一课都会反复见到。
  derivation: original
  sources:
  - ref: mysql-innodb-docs
    locator: "[[MySQL]] Glossary 与 InnoDB Recovery（checkpoint / 崩溃恢复）"
    claim: 检查点记录所有已修改页均已刷盘的位置；崩溃恢复时 InnoDB 用 redo 重做并回滚未提交事务
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: pool
      id: p
      label: Buffer Pool：脏页排队等写回
    - lane: disk
      id: d
      label: 磁盘：检查点推进，数据文件追平
      highlight: true
    messages:
    - id: m1
      from: p
      to: d
      label: 脏页批量写回（检查点）
      active: true
    registers:
    - name: 平时
      value: 后台刷脏，检查点书签前移
    - name: 断电重启
      value: redo 重做已提交 + undo 撤销未提交
  log:
  - mode: 写入·收尾
    event: 提交这条最热的路径只付顺序写日志的钱，数据页随机写回的账留给后台和崩溃恢复慢慢还
- id: read-path
  title: 读取之旅·一：快慢只压在命中与否上
  tldr: 写的一生走完了，换一条路走读。场面是查一次 7 号账户的余额：前半程和写入一模一样，先定位到页、再问[[缓冲池]]。这一步先把快慢的账算清：页在内存里和在磁盘上，取它的耗时差着数量级，所以读的快慢几乎只压在命中没命中这一件事上。
  body: |-
    换一条路走读取：SELECT balance FROM accounts WHERE id = 7。前半程和写入一模一样——解析、顺 B+ 树定位到第 312 页、先问 Buffer Pool。读路径的快慢几乎都压在「命中还是未命中」上，先把耗时账算清：从内存里拿一页，大约是百纳秒的量级；从 [[SSD]] 读一页，几十微秒；从机械硬盘读一页，要几毫秒——相邻两档差着一到两个数量级。
    这张表解释了数据库世界的一大半焦虑：为什么运维盯着缓冲池命中率不放，为什么热点数据要想方设法留在内存，为什么一次全表扫描能把系统拖垮——它会把大量冷页冲进缓冲池，把别人的热页挤回磁盘。命中时，这次查询全程不碰磁盘；未命中才付一次读页的代价，把 312 页搬上桌。
    找到页还不等于能把行直接端给应用：页上那一行可能正被某个事务改到一半，也可能已经是别人改完、但「不该让你看见」的新版本。所以读路径真正的最后一步是版本判定——决定这一行的哪个版本属于你，下一幕单独展开。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: a
      label: 应用：查 id=7 的余额
    - lane: engine
      id: e
      label: 引擎：定位到第 312 页
    - lane: pool
      id: p
      label: Buffer Pool：命中就不碰磁盘
      highlight: true
    - lane: disk
      id: d
      label: 磁盘：未命中才读页
    messages:
    - id: m1
      from: a
      to: e
      label: SELECT … WHERE id = 7
      active: true
    - id: m2
      from: e
      to: p
      label: 先查缓冲池
    registers:
    - name: 内存拿页
      value: 约百纳秒量级
    - name: SSD 读页
      value: 约几十微秒量级
    - name: 机械盘读页
      value: 约毫秒量级
  log:
  - mode: 读取·定位
    event: 缓冲池命中还是未命中，直接决定了这条查询的耗时属于哪个数量级
- id: read-version
  title: 读取之旅·二：沿着版本链，挑一个属于你的版本
  tldr: 页找到了，还不能直接把行端出去，因为上一步的写入之旅留下一个问题：同一行这时候可能同时躺着好几个版本，有的还是别人没提交完的。这一步看读的人怎么挑：按自己开事务时领的那份快照，沿着 [[undo]] 链往回走，挑第一个对自己可见的版本，全程不用上锁。
  body: >-
    版本判定要解决的问题是：同一行同时躺着好几个版本，你该看哪一个？规矩叫快照读：事务开始时先领一份快照，记下那一刻已经提交的事务名单（InnoDB 里叫
    [[ReadView]]，可以理解成一张「我出生时世界长什么样的合影名单」）。读一行时先看最新版本是谁写的：写者在名单里且已提交，这个版本就归你看；写者是你出生之后才冒出来的事务，那对你来说等于还没发生，跳过。

    跳过去哪找旧的？靠写入之旅里埋下的那条线：每一行都留着一个指针，指向 undo
    里它上一个版本的拷贝，旧版本又指向上上个，串成一条版本链。判定就是沿链往回走，直到找到第一个「在我的快照里可见」的版本。两个事务同时读同一行，可能一个停在链头的新版本、一个走到链中间的旧版本——各自看到各自时刻的世界，互不打架。

    最妙的是全程不上锁：读的人沿链挑版本，写的人在链头造新版本，谁也不等谁，这正是数据库扛住高并发读的看家本领。这里只走到「会挑版本」为止：快照的精确判定规则、四档隔离级别放行哪些怪现象、版本链太长为什么拖慢读，是下一课的正题。
  derivation: original
  sources:
  - ref: mysql-innodb-docs
    locator: InnoDB Multi-Versioning（多版本与 ReadView）
    claim: InnoDB 用 undo 中的旧版本支持一致性读：读事务按 ReadView 判断版本可见性，沿版本链回溯到可见版本
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: engine
      id: e
      label: 引擎：拿快照名单逐个核对
      highlight: true
    - lane: pool
      id: p
      label: 版本链：新版本 → 旧版本 → 更旧版本（undo）
    messages:
    - id: m1
      from: e
      to: p
      label: 沿 undo 链挑我可见的那个版本
      active: true
    registers:
    - name: 我的快照
      value: 开事务那一刻的已提交名单
    - name: 判定结果
      value: 链上第一个对我可见的版本
    - name: 锁
      value: 不上锁，读写互不等待
  log:
  - mode: 读取·判定
    event: 读不加锁的秘密在于，读的不是最新版本，而是按自己快照挑出来的、对自己成立的那个版本
- id: sqlite-contrast
  title: 收尾对照：[[SQLite]] 把整套机器装进一个函数库
  tldr: 最后一站换个极端场面收尾：把同一套三件套压缩进一个函数库，没有独立的服务器进程、没有连接线程，就是 SQLite 的样子；再往远看，[[D1]] 把这个文件钉到了全球一张网上。形态差这么远，底层规矩却没变，这正是要对照看的原因。
  body: >-
    最后把镜头切到另一个极端：SQLite。它把这整套机器压缩进一个函数库：没有独立的服务器进程，应用在自己的进程里调用函数就把活干完；数据只住在一个文件里，默认页大小 4KB，同样是页加 B+
    树的组织。麻雀虽小，规矩不缺：它照样有页缓存（迷你版的[[缓冲池]]），照样靠日志保命。

    它的日志可以切成 [[WAL]] 模式：改动不直接写主文件，而是把整页的新版本顺序追加进 -wal 伴随文件，提交即追加完成；主文件等[[检查点]]时再把 WAL 里的页搬回去——和
    InnoDB「日志先行、数据页后还」是同一套心法，只是日志里装的是整页拷贝而不是字节级改动。它和 [[MySQL]] 最大的分野在并发：同一时刻只许一个写者，读可以并发且不挡写。用单写者的简单，换零运维与无处不在。

    把视野再拉远一句：云上的 D1，就是把这一个 SQLite 文件钉在一个主节点上独占写入，再把日志复制到全球的只读副本。选型也就清楚了：进程内、单机、低运维，SQLite 一档；多机并发写与完整的事务体系，MySQL
    一档。形态天差地别，底层那三件套从头到尾没有变过——这正是本课想留给你的那张地图。
  derivation: original
  sources:
  - ref: sqlite-docs
    locator: Write-Ahead Logging（WAL 模式与检查点、单写者）
    claim: WAL 模式下改动以整页帧顺序追加进 -wal 文件，检查点再把页搬回主数据库文件；同一时刻只允许一个写者，读者不阻塞写者
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: a
      label: 应用进程：SQLite 就住在里面
      highlight: true
    - lane: disk
      id: d
      label: 磁盘：一个主文件 + -wal 日志
    messages:
    - id: m1
      from: a
      to: d
      label: 函数调用直达，没有服务器这一层
      active: true
    registers:
    - name: 页大小
      value: 4KB（默认）
    - name: 写者
      value: 同一时刻只有一个
    - name: 日志
      value: WAL 追加整页，检查点回搬
  log:
  - mode: 对照
    event: 从服务器数据库到嵌入式函数库，形态可以天差地别，但页、缓冲与日志这三件套始终不变
minutes: 30
prereq:
- data/btree-index
- os/virtual-memory
objectives:
- 用三件套心智模型说清一次写入与一次读取各自经过哪些部件
- 解释页为什么必须等大、读写为什么以页而不是行为单位
- 按顺序复述提交成立的瞬间发生了什么、断电之后靠什么恢复
aiLink: 读懂这一课，才能读懂现代数据基础设施的取舍：向量数据库的索引同样按页与块组织，LLM 推理里的 KV 缓存分页（PagedAttention）借的正是「等大分块 + 按号定位」的页思想——存储与推理在最底层用的是同一套算术。
design:
- mechanism: 为什么数据库敢在数据还没写进文件时就回复「提交成功」——因为它把承诺押在一本只许往后写的日志上，而不是押在数据文件上
  problem: 两头堵：每次改完都立刻把涉及的页写回文件，是散布全盘的随机写，慢且贵，提交延迟会被拖死；只改内存不落盘，一断电就把已提交的数据弄丢，持久性当场破产——快与稳看似只能二选一
  choice: 立一条预写日志的铁律：数据页可以躺在内存里慢慢排队，但描述这次修改的日志必须先顺序追加并刷盘，做完这一步才许回复提交成功；日志是天然只增的流，顺序写比随机写便宜一到两个数量级，于是最热的提交路径只付最便宜的那种 IO
  tradeoff: 代价有三笔：一是每次提交至少等一次日志刷盘，延迟有了硬下限，要靠组提交（多个事务拼到同一批刷盘）摊薄；二是系统必须养着后台线程做检查点、推进书签、回收日志；三是崩溃恢复要花时间重演积压的日志，重启速度和日志积压量挂钩
  root: 根子在介质的价格表上：顺序与随机之间差着数量级，那就把必须立刻做的事全部改造成顺序的（记账），可以慢慢做的留给随机的（回写数据页）；日志本质上是替随机写买的一份保险单，保费按顺序写的价格收取
- mechanism: 为什么数据库搬运数据永远整页进行，明明你只想要其中一行——因为页同时是硬件的块、定位的地址与全系统的记账单位
  problem: 根本约束有三层：硬件按块读写，你要一行它也只能给一整块；无序的大文件没法快速定位，必须先有一种能靠计算得出的地址；缓存、刷盘、日志、恢复这些子系统若各用各的计量单位，光对齐与换算就会让整套系统散架
  choice: 把文件切成完全等大的页并顺序编号：位置等于页号乘页大小，定位变成一次乘法；一行数据连同邻居一起装进页里，搬运、缓存、落盘、恢复全部以页为单位，上层结构（B+ 树）也直接拿页当节点，不再另设单位
  tradeoff: 代价是放大与浪费：改一行也要搬整页（写放大），页里永远有填不满的空隙（内部碎片），页大小要在搬运成本与浪费比例之间选折中，长行超过一页还得加溢出页机制兜底；16KB 这类取值是长期磨合出的经验解，不是算出来的最优解
  root: 根子在局部性与可计算性这两条底层事实上：数据访问天然扎堆，整页预取大概率不亏本；等大分块又让「在哪」从搜索问题变成算术问题。数据库与操作系统的虚拟内存不约而同都选了页，正是因为撞上的是同一堵墙
- mechanism: 为什么数据库不信任操作系统的文件缓存，非要自己再维护一个缓冲池，把页的进出全管起来
  problem: 根本约束是信息差：操作系统只看见文件与字节，看不见语义——不知道哪页是 B+
    树的根（请出去一次，全站查询陪葬）、哪页正被报表查询顺序扫过（留着纯属浪费）、哪页是脏的且写回次序被日志纪律锁死；按通用策略管数据库的页，必然在最要紧的地方犯错
  choice: 数据库绕开操作系统的页缓存（直接 IO），自己维护缓冲池：页的换入、淘汰与刷盘全由最懂访问模式的一方说了算，淘汰算法也能按数据库的脾气改造，比如给顺序扫描路过的页降权，不许它冲掉真正的热点页
  tradeoff: 代价是重复建设与内存账目变复杂：同一份数据在两层缓存各存一份的风险，要靠绕开 OS 缓存来避免；缓冲池大小得人工规划，给多了饿着操作系统与其他进程，给少了命中率当场塌方，内存管理的责任就此从操作系统转到了运维手里
  root: 根子是一条通用工程原则：缓存策略的好坏取决于对访问模式的了解程度，谁离业务近，谁就该拿主导权；下层不够懂时上层再实现一遍不是浪费，而是把决策放回信息最全的地方
terminal:
- cmd: SHOW VARIABLES LIKE 'innodb_page_size';
  note: 在 MySQL 里看 InnoDB 的页大小，默认 16384（16KB）
- cmd: SHOW VARIABLES LIKE 'innodb_flush_log_at_trx_commit';
  note: 值为 1 表示每次提交都把 redo 刷进磁盘
- cmd: PRAGMA page_size;
  note: 在 sqlite3 里看 SQLite 的页大小，默认 4096（4KB）
- cmd: PRAGMA journal_mode=WAL;
  note: 把 SQLite 切到 WAL 模式，观察多出的 -wal 文件
