- id: page-what
  title: 页是什么：一卷纸和一本书的区别
  tldr: 三件套认完了，先放大看最基本的那块砖：页。为什么非要把文件切成等大的页？打个比方，没有页码的一卷纸只能从头翻；切成等大页之后，第几页在哪就是位置等于页号乘以页大小，一次乘法直接翻到。这一步把这条算术弄清，上一课里树的层数为什么那么少也就有了根。
  body: |-
    把数据库文件想象成一整卷没有页码的纸：想找任何一行，只能从头往后翻。现在把这卷纸裁开、装订成一本有页码的书：每一页大小完全相同——InnoDB 默认 16KB，[[SQLite]] 默认 4KB——页从 0 开始顺序编号。省事的地方随即出现：第 N 页在文件里的位置，就是 N 乘以页大小，一次乘法直接翻到，不必逐页去找。
    「等大」不是整齐癖，而是这条乘法成立的前提：页有大有小，位置就得靠从第一页起逐页累加长度来推算，等于退回到从头数的老路——这跟数组下标算地址、内存分页是同一种把戏。
    那一页能装多少行？粗算一笔：16KB 的一页，一行若是 200 字节上下，能塞七八十行（还要扣掉页头之类的开销）。上一课的 B+ 树之所以只有三四层，靠的正是「一页装很多」：导航页一页装上千个键，数据页一页装几十行。砖的尺寸决定了上层建筑的形状，但砖也不是越大越好：页太小，一页装不下几行，树被迫长高、查询要多跳几页；页太大，改一行要搬运和写回的数据成倍膨胀，[[缓冲池]]能常驻的页数也变少。16KB 是这笔账长期磨出来的折中点，不是公式算出的天命——记住这一点，后面讲 SQLite 为什么用 4KB 时就不会奇怪：它的舞台是手机与嵌入式设备，账要按小内存重新算。
  derivation: original
  sources:
  - ref: mysql-innodb-docs
    locator: 17.8.1 InnoDB Startup Configuration（innodb_page_size）
    claim: InnoDB 默认页大小为 16384 字节（16KB），可在初始化时改为 4KB 至 64KB
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  - ref: sqlite-docs
    locator: File Format 文件格式文档（page_size）
    claim: SQLite 页大小可为 512 至 65536 的 2 的幂，默认 4096 字节（4KB）
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
