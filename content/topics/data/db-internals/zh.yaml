    event: 热路径只付顺序写的钱，随机写的账留给后台与恢复慢慢还
- id: read-path
  title: 读取之旅·一：快慢只压在命中与否上
  tldr: 读路径前半程和写入相同：定位到页、先问缓冲池；内存与磁盘之间差着数量级。
  body: '换一条路走读取：SELECT balance FROM accounts WHERE id = 7。前半程和写入一模一样——解析、顺 B+ 树定位到第 312 页、先问 Buffer Pool。读路径的全部快慢，几乎都压在「命中还是未命中」这一问上，所以先把耗时账算清楚：从内存里拿一页，大约是百纳秒的量级；从 SSD 读一页，几十微秒；从机械硬盘读一页，要几毫秒。相邻两档之间，差着一到两个数量级。

    这张数量级表解释了数据库世界的一大半焦虑：为什么运维盯着缓冲池命中率不放，为什么热点数据要想方设法留在内存，为什么一次全表扫描能把系统拖垮——它会把大量冷页冲进缓冲池，把别人的热页挤回磁盘。命中时，这次查询全程不碰磁盘；未命中才付一次读页的代价，把 312 页搬上桌、顺带预取整页邻居，后面的相邻查询跟着受益。

    找到页还不等于能把行直接端给应用：页上那一行可能正被某个事务改到一半，也可能已经是别人改完、但「不该让你看见」的新版本。所以读路径真正的最后一步，是版本判定：决定这一行的哪个版本属于你。这一步单独展开，就是下一幕。'
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: a
      label: 应用：查 id=7 的余额
    - lane: engine
      id: e
      label: 引擎：定位到第 312 页
    - lane: pool
      id: p
      label: Buffer Pool：命中就不碰磁盘
      highlight: true
    - lane: disk
      id: d
      label: 磁盘：未命中才读页
    messages:
    - id: m1
      from: a
      to: e
      label: SELECT … WHERE id = 7
      active: true
    - id: m2
      from: e
      to: p
      label: 先查缓冲池
