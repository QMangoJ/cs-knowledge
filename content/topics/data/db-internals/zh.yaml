  - id: page-why
    title: 只查一行也要整页搬：顺应硬件块、白捡邻居、统一全库货币
    tldr: 哪怕只读写一行，数据库也一律按整页搬运，原因有三：磁盘与 [[SSD]] 物理上按块读写、同页相邻行极大概率紧接着被查、全系统子模块都拿页统一记账。
    body: |-
      明明只要 `id = 7` 那一行 200B，为什么非得把整张 16KB 的页搬进内存？第一层原因是**硬件脾气**：机械盘和 [[SSD]] 在物理底层本来就按块读写，你只向它讨 100 字节，它也只能把一整块端上来。把最小读写单位定成页，是顺着硬件块放大对齐，不跟底层物理对着干。

      第二层原因是**白捡邻居的便宜**。数据访问自带局部性：今天刚查完 `id = 7`，左邻右舍近期大概率也会被查——按 `id` 顺序翻页、拉取最近一小时流水都是如此。整页搬进内存等于买一行送一排：`id = 7` 所在的页上了桌，同页的 `id = 8` 到 `id = 80` 顺道全在内存里，紧跟着的查询直接零磁盘开销命中。

      第三层原因最隐蔽：**页是全系统的统一结算货币**。缓存淘汰按页请出、后台刷盘按页写回、日志按页记账（「第几页哪处改成了什么」）、崩溃恢复按页重做、B+ 树按页组织节点——所有子系统拿同一种单位结算，零件咬合才严丝合缝。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: pool
          id: p
          label: Buffer Pool：整页常驻
          highlight: true
        - lane: disk
          id: d
          label: 磁盘：按块读写
      messages:
        - id: m1
          from: d
          to: p
          label: 整页搬运：读一行时，同页的相邻行一起进内存
          active: true
      registers:
        - name: 原因一
          value: 硬件按块读写，最小一份就是一块
        - name: 原因二
          value: 局部性：邻居大概率马上要用
        - name: 原因三
          value: 缓存/刷盘/日志/恢复全按页记账
    log:
      - mode: 单位
        event: 页不是图省事的近似，而是缓存、刷盘、日志和恢复全系统对齐过的统一计量单位
  - id: page-anatomy
    title: 掀开 16KB 页的盖子：页头防坏页，槽位目录撑起页内二分
    tldr: 单张数据页采用槽位页（Slotted Page）版式：顶部页头存页号、[[校验和]]与最后修改日志序号，中部塞记录并留空闲，底部槽位目录用指针支持页内二分定位。
    body: |-
      把一页放大看，它不是一张白纸，而是有固定版式的槽位页（Slotted Page）。最顶上是**页头**：记着页号、页类型（装数据行还是装索引路标）、一串[[校验和]]（读盘时重算核对，当场识破断电写了一半的损坏页），以及「最后修改日志序号」（崩溃恢复时靠它判断这页需不需要拿日志重做）。页头往下是**记录区**与**空闲区**，一行行记录挨着塞进来，留出空地给新插入和变长更新使用；最底部则倒着长出一排小指针，叫**页目录**（槽位数组）。页内找一行时，引擎先在槽位指针上二分锁定一小段，再顺着走几步即达，根本不用把整页记录逐条翻一遍。

      把这张图接回上一课：[[B+ 树]]的根页、内节点页、叶子页，物理上全长这副模样，只是页头里的类型标记不同；树高三层，就是顺着页内指针跳三张页；[[回表]]，就是拿主键再去另一棵树的页里跳几趟。
    derivation: original
    sources:
      - ref: cmu-15445
        locator: Database Storage 讲义（槽位页 Slotted Page 布局）
        claim: 数据页采用槽位页布局：页头记录元信息，槽位数组指向页内记录，支持页内定位与空闲管理
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
    canvas:
      kind: swimlane
      actors:
        - lane: engine
          id: e
          label: 引擎：在页目录的槽位上二分
          highlight: true
        - lane: disk
          id: d
          label: 一页的内部：页头 / 记录区 / 空闲 / 页目录
      messages:
        - id: m1
          from: e
          to: d
          label: 页内查找先走目录，不逐行翻
          active: true
      registers:
        - name: 页头
          value: 页号 · 类型 · 校验和 · 最后修改的日志序号
        - name: 记录区
          value: 一行挨一行塞进来
        - name: 页目录
          value: 槽位指针，页内二分靠它
    log:
      - mode: 放大
        event: 一页之内自带页目录这个小索引，页内找一行先二分定位，不必逐条比对
  - id: page-os
    title: 绕开操作系统页缓存：谁懂根页与刷盘纪律，谁管内存
    tldr: 操作系统文件缓存分不清数据页的轻重缓急与日志先行纪律，因此主流数据库用直接 [[IO]] 绕开 OS 页缓存，由[[缓冲池]]全权掌管换入、淘汰与刷脏次序。
    body: |-
      把磁盘页换进内存、把冷页请出去，这套动作和操作系统虚拟内存的缺页与页面置换一模一样。既然操作系统自带现成的文件页缓存，数据库干嘛还要在上面亲手搭一层[[缓冲池]]？因为**操作系统只认文件块，完全不认识这些页在数据库里的身份**。

      要是直接蹭操作系统的通用缓存，立刻会踩两个大坑：第一，OS 不知道哪张页是 [[B+ 树]]每秒被敲上万次的根页（一旦被踢出去全站陪葬），也不知道哪批页只是夜间报表顺序扫过一次的冷数据（留着纯属占座）；第二，OS 更不懂哪张页是未落日志的脏页——刷盘次序明明被预写日志纪律锁死，OS 若在后台自作主张提前把脏页刷下盘，崩溃恢复的规矩当场就破了。

      所以主流分工很干脆：数据库开启直接 IO 绕开操作系统的页缓存，既避免同一张页在内核缓存与缓冲池里存双份白占内存，又把淘汰策略（比如给顺序扫描路过的页降权防冲刷）和刷脏时机牢牢攥在最懂访问模式的自己手里。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: app
          id: o
          label: 操作系统：页缓存（被直接 IO 绕开）
        - lane: engine
          id: e
          label: 数据库：自管 Buffer Pool 的进出
          highlight: true
      messages:
        - id: m1
          from: e
          to: o
          label: 数据库按自己的访问模式管理页的进出
          active: true
      registers:
        - name: OS 页缓存
          value: 只认文件，不认页的身份
        - name: 数据库缓冲池
          value: 知道根页、热页、脏页各是谁
    log:
      - mode: 分工
        event: 同一种换页思想在操作系统和数据库两层各跑一遍，页的进出决策权交给最懂访问模式的数据库这一方
  - id: write-locate
    title: 扣款第一步：顺树算出页号，未命中先从磁盘借上桌
    tldr: 执行 UPDATE 扣款时，引擎先解析计划并顺 B+ 树算出 id = 7 住在第 312 页，随后优先向[[缓冲池]]要页；只有未命中时才按偏移从磁盘读入内存，此时数据尚未涂改。
    body: |-
      正式跟着 `UPDATE accounts SET balance = balance - 100 WHERE id = 7` 走一趟写路径。引擎接单后先把这句 SQL 解析成执行计划——改哪张表、走哪棵索引、动哪一列就此敲定；接着顺着上一课的主键 B+ 树从根往下跳，算出 `id = 7` 住在表文件的**第 312 页**。

      拿到页号后次序绝不能反：先问内存里的[[缓冲池]]「第 312 页在桌上吗」。在，叫命中，零磁盘开销直接进下一步；不在，叫未命中，只能去磁盘文件里按 `312 × 16KB` 算出的偏移把整张页读进来摆上桌。这次未命中读盘往往是整条写路径上最贵的一次随机读，缓冲池命中率为什么是数据库的生命线，就在这一步。

      留意此刻的进度：第 312 页只是被「借阅」到了内存桌上，磁盘原件纹丝未动，余额还是 `1000`——数据库做一次更新，花在「找页上桌」上的功夫往往比「动笔改数」多得多。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: app
          id: a
          label: 应用：提交一笔扣款
        - lane: engine
          id: e
          label: 引擎：解析计划、顺 B+ 树定位
          highlight: true
        - lane: pool
          id: p
          label: Buffer Pool：先找 312 页
        - lane: disk
          id: d
          label: 数据文件：未命中才按偏移读页
      messages:
        - id: m1
          from: a
          to: e
          label: UPDATE … WHERE id = 7
          active: true
        - id: m2
          from: e
          to: p
          label: 312 页在缓冲池里吗？
        - id: m3
          from: e
          to: d
          label: 未命中：读入第 312 页
      registers:
        - name: 目标页
          value: 第 312 页（刚读进内存）
        - name: 磁盘原件
          value: 未动
    log:
      - mode: 写入·定位
        event: 页已经搬上桌了，但修改还没有开始，磁盘上的数据文件仍然是旧值
  - id: write-lock-undo
    title: 改内存前先办两件事：给行上锁，把旧值 1000 抄进 [[undo]]
    tldr: 动手改内存页之前必须先锁住 id = 7 这一行，并把旧值 balance = 1000 写入 [[undo]] 日志留底（供回滚与并发快照读使用），随后才把内存页改成 900 并标为[[脏页]]。
    body: |-
      第 312 页摆上桌后，引擎动手前必须先守两条规矩：第一件是**上锁**，给 `id = 7` 这一行挂上行级排他锁（「这行我正在改，别人先等着」）——只锁行不锁整页，同页的其他行别人照样能动；第二件是**留底**，把改之前的旧余额 `balance = 1000` 抄一份存进 [[undo]]（撤销日志）。

      这份 undo 底稿一石二鸟：一是万一事务半路报错或主动回滚，照着 undo 就能把数据擦回 `1000`；二是别的并发事务此刻若来读 `id = 7`，不用排队傻等锁释放，顺着指针读 undo 里的旧拷贝即可。

      两件规矩办妥，引擎才真正涂改内存桌上这一份：第 312 页里 `id = 7` 的 `balance` 被改成 `900`，这张内存页随即贴上「脏」标记——[[脏页]]就是内存比磁盘新、迟早要写回还账的页。定格看这一刻：磁盘数据文件里依然写着 `1000`，知道真相的只有内存脏页、undo 旧账，以及下一步登场的重做日志。
    derivation: original
    sources:
      - ref: mysql-innodb-docs
        locator: 10.5.2 Optimizing InnoDB Transaction Management（undo 与旧版本保留）
        claim: 行被修改或删除后，旧数据保留在 undo 日志中，直到早先开始的并发事务结束，它们仍能读到修改前的状态
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
    canvas:
      kind: swimlane
      actors:
        - lane: engine
          id: e
          label: 引擎：上行锁、抄旧值
          highlight: true
        - lane: pool
          id: p
          label: Buffer Pool：第 312 页变脏（900）
        - lane: disk
          id: d
          label: 磁盘：数据文件仍是 1000；undo 存着旧值
      messages:
        - id: m1
          from: e
          to: p
          label: 给 id=7 上行锁，只改内存页
          active: true
        - id: m2
          from: e
          to: d
          label: 旧值 1000 先抄进 undo
      registers:
        - name: 内存里的页
          value: balance = 900（脏页）
          changed: true
        - name: undo 旧值
          value: balance = 1000
        - name: 磁盘数据文件
          value: balance = 1000（未动）
    log:
      - mode: 写入·留底
        event: 行锁和旧值底稿都已就位，改动只发生在内存里的页上，磁盘上的数据文件仍是旧值
  - id: write-redo-commit
    title: 提交成立的生死线：[[redo]] 顺序刷盘落定，数据页不必急着回写
    tldr: 遵循预写日志（[[WAL]]）铁律，引擎把改动追加进 [[redo]] 重做日志并调用 [[fsync]] 刷上磁盘后，才敢回复「提交成功」——用一次廉价的日志顺序写，替代昂贵的数据页随机写。
    body: |-
      内存页改成了 `900`，可内存断电即空，数据库凭什么敢向用户拍胸脯保证扣款不丢？靠的是把这次修改写成一条带物理位置的流水账（「第 312 页、某偏移处、改成什么字节」），顺序追加进一本叫 [[redo]] 的重做日志。关键在「追加」二字：日志永远只在末尾往后写、绝不回头来回寻道，吃的正是磁盘最便宜的顺序写红利。

      到了 `COMMIT` 提交这一刻，引擎死守一条铁律（即 [[WAL]]，Write-Ahead Logging，预写日志，自 IBM ARIES 恢复算法确立起便是关系库标配）：必须先让这条 redo 真正刷上物理盘面（执行一次 [[fsync]] 穿透操作系统缓存），才准向客户端返回「提交成功」。日志必须走在数据页前面；数据页什么时候写回可以商量，日志半步不让。

      于是出现了那个反直觉却固若金汤的画面：你收到「提交成功」时，磁盘数据文件里 `id = 7` 还是 `1000`，新值 `900` 只活在内存和 redo 日志里。敢这么承诺，是因为哪怕下一毫秒机房断电，重启后照着盘上的 redo 重演一遍，已提交的一笔都跑不掉——把持久性押在顺序日志上而非随机数据文件上，是存储引擎最核心的一次置换。
    derivation: original
    sources:
      - ref: mysql-innodb-docs
        locator: InnoDB Redo Log 内部文档（预写日志与提交刷盘）
        claim: redo 日志是对数据页修改的预写日志，提供持久性；事务提交时，用户线程必须等 redo 刷盘到该事务日志的末尾
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
    canvas:
      kind: swimlane
      actors:
        - lane: engine
          id: e
          label: 引擎：等 redo 刷盘才回复
        - lane: pool
          id: p
          label: Buffer Pool：脏页先放在这里
        - lane: disk
          id: dd
          label: redo 日志：追加并刷盘 ★
          highlight: true
      messages:
        - id: m1
          from: e
          to: dd
          label: 日志先刷盘，再回复提交成功
          active: true
      registers:
        - name: 内存里的页
          value: balance = 900（脏页）
        - name: redo 日志
          value: 已刷盘 ✓ 提交成立
          changed: true
        - name: 磁盘数据文件
          value: balance = 1000（仍是旧值）
    log:
      - mode: 写入·提交
        event: redo 日志落盘的这一瞬间，提交才正式算数；数据文件可以迟到慢慢写，日志必须先落盘
  - id: write-checkpoint
    title: 后台[[检查点]]批量还[[脏页]]，断电重启先 [[redo]] 后 [[undo]]
    tldr: 平时后台线程分批把[[脏页]]刷回数据文件并前移[[检查点]]书签以回收旧日志；一旦中途断电，重启时先顺着 [[redo]] 重做已提交改动，再用 [[undo]] 擦除未提交半成品。
    body: |-
      提交成立后，内存里欠着的[[脏页]]什么时候还？由后台线程趁系统空闲、或[[缓冲池]]空间吃紧时，成批把脏页写回数据文件，并把一枚叫[[检查点]]（checkpoint）的书签往前推，宣告「书签之前的修改，数据文件原件里已经全齐了」——日志里书签之前的那段空间从此可以安全回收循环使用。

      再把最惊险的断电现场走一遍：假设提交刚成功、第 312 页还没来得及刷回表文件，旁边另一个事务又改到一半没提交，突然断了电。重启时引擎按死规矩干两件事：第一步先顺着 redo 往后重演，把已提交的 `900` 重新刷到数据页上；第二步再拿 undo 把那些没来得及提交的半截改动一一擦回原样。重做在前、撤销在后，醒来后的数据库与断电前对外承诺过的分毫不差。

      算一笔写路径总账：前台用户等待的只有一次廉价的日志顺序刷盘；昂贵的数据页随机写回被推迟到后台攒批摊平；崩溃恢复的开销则留给极少发生的重启时刻一次结清——**让最热的路径只付最便宜的 IO，其余的账挪到冷处慢慢还**。
    derivation: original
    sources:
      - ref: mysql-innodb-docs
        locator: "[[MySQL]] Glossary 与 InnoDB Recovery（checkpoint / 崩溃恢复）"
        claim: 检查点记录所有已修改页均已刷盘的位置；崩溃恢复时 InnoDB 用 redo 重做并回滚未提交事务
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
    canvas:
      kind: swimlane
      actors:
        - lane: pool
          id: p
          label: Buffer Pool：脏页排队等写回
        - lane: disk
          id: d
          label: 磁盘：检查点推进，数据文件追平
          highlight: true
      messages:
        - id: m1
          from: p
          to: d
          label: 脏页批量写回（检查点）
          active: true
      registers:
        - name: 平时
          value: 后台刷脏，检查点书签前移
        - name: 断电重启
          value: redo 重做已提交 + undo 撤销未提交
    log:
      - mode: 写入·收尾
        event: 提交这条最热的路径只付顺序写日志的钱，数据页随机写回的账留给后台和崩溃恢复慢慢还
  - id: read-path
    title: 查询快慢的分水岭：[[缓冲池]]命中百纳秒，落盘慢出几个数量级
    tldr: 执行 SELECT 查余额时，定位到第 312 页后先查[[缓冲池]]：内存命中仅百纳秒量级，一旦未命中落到 [[SSD]]（几十微秒）或机械盘（几毫秒），耗时当场跳升两到四个数量级。
    body: |-
      再跟着 `SELECT balance FROM accounts WHERE id = 7` 走一趟读路径。前半程与写入完全一样：解析、顺着主键 B+ 树定位到第 312 页、先问[[缓冲池]]。这一问直接划开了快慢的数量级：从内存直接拿页大约是**百纳秒**量级；去 [[SSD]] 读一页要**几十微秒**；落到机械硬盘上则要**几毫秒**——每往下掉一档就差出一到两个数量级。

      这组数字解释了运维大半的监控指标：为什么死盯缓冲池命中率不放，为什么千方百计把热数据留在内存，以及为什么一条没走索引的全表扫描能把整台库拖垮——十几万张冷页冲进缓冲池，会把所有正常业务的热页挤回磁盘。

      不过，就算第 312 页稳稳命中在内存里，引擎也不能抓起上面的 `900` 直接端给应用：那一行可能正被别的事务改到一半未提交，也可能是你开事务之后别人才提交的新版本。读路径的最后一关，是决定哪个版本归你看。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: app
          id: a
          label: 应用：查 id=7 的余额
        - lane: engine
          id: e
          label: 引擎：定位到第 312 页
        - lane: pool
          id: p
          label: Buffer Pool：命中就不碰磁盘
          highlight: true
        - lane: disk
          id: d
          label: 磁盘：未命中才读页
      messages:
        - id: m1
          from: a
          to: e
          label: SELECT … WHERE id = 7
          active: true
        - id: m2
          from: e
          to: p
          label: 先查缓冲池
      registers:
        - name: 内存拿页
          value: 约百纳秒量级
        - name: SSD 读页
          value: 约几十微秒量级
        - name: 机械盘读页
          value: 约毫秒量级
    log:
      - mode: 读取·定位
        event: 缓冲池命中还是未命中，直接决定了这条查询的耗时属于哪个数量级
  - id: read-version
    title: 读为什么不用等锁：拿 [[ReadView]] 快照沿 [[undo]] 链挑版本
    tldr: 读事务开启时领取一份记录当时提交界限的快照（[[ReadView]]），读行时顺着行内回滚指针沿 [[undo]] 版本链往回找第一个可见版本，全程不加锁、读写互不等待。
    body: |-
      同一行同时躺着好几个版本时，读事务该看哪一个？规矩叫**快照读**：事务开始时先领一张快照名单（InnoDB 里叫 [[ReadView]]，好比拍下一张「我出生那一刻哪些事务已经提交」的合影）。读第 312 页上的 `id = 7` 时，先看链头最新版本是谁写的：写者在名单里已经提交，这个版本就归你看；写者还没提交，或是你出生之后才开启的新事务，那对你而言等于尚未发生，直接跳过。

      跳过去哪找旧值？全靠第 7 步埋下的伏笔：每一行都带着一个回滚指针，指向 [[undo]] 里它上一个版本的拷贝（如 `1000`），旧版本又指向上上个版本，串成一条**版本链**。引擎顺着链条往回捋，直到撞见第一个在当前快照里可见的版本为止。两个事务同时读同一行，完全可能一个拿走链头的 `900`、另一个拿走链中间的 `1000`，各自看见属于自己时刻的一致世界。

      整套机制最妙的一点是**全程不上锁**：写的人在链头追加新版本，读的人顺着链往回挑老版本，谁也不拦谁——这正是现代数据库扛住高并发读写的看家本领（至于四档隔离级别怎么调快照时机、长事务不提交为什么会把版本链拖爆，下一课细拆）。
    derivation: original
    sources:
      - ref: mysql-innodb-docs
        locator: InnoDB Multi-Versioning（多版本与 ReadView）
        claim: InnoDB 用 undo 中的旧版本支持一致性读：读事务按 ReadView 判断版本可见性，沿版本链回溯到可见版本
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
    canvas:
      kind: swimlane
      actors:
        - lane: engine
          id: e
          label: 引擎：拿快照名单逐个核对
          highlight: true
        - lane: pool
          id: p
          label: 版本链：新版本 → 旧版本 → 更旧版本（undo）
      messages:
        - id: m1
          from: e
          to: p
          label: 沿 undo 链挑我可见的那个版本
          active: true
      registers:
        - name: 我的快照
          value: 开事务那一刻的已提交名单
        - name: 判定结果
          value: 链上第一个对我可见的版本
        - name: 锁
          value: 不上锁，读写互不等待
    log:
      - mode: 读取·判定
        event: 读不加锁的秘密在于，读的不是最新版本，而是按自己快照挑出来的、对自己成立的那个版本
  - id: sqlite-contrast
    title: 收尾对照：[[SQLite]] 把整座引擎塞进函数库，三件套规矩不变
    tldr: "[[SQLite]] 省去独立服务器进程，以进程内函数库形态管理单个 4KB 分页文件与 -wal 预写日志，用单写者换取零运维；收尾带走排查读写与落盘的「引擎三问」。"
    body: |-
      最后把镜头切到形态完全相反的另一端：[[SQLite]]（2000 年由 D. Richard Hipp 为舰载软件免运维运行而设计）。它没有独立的服务器进程和网络连接，而是直接嵌进你应用进程里的一个函数库；整座数据库只住在一个默认 `4KB` 页大小的文件里，同样用页加 [[B+ 树]]组织，内存里照样有迷你版页缓存，落盘照样靠日志保命。

      切到 [[WAL]] 模式后，改动不直接写主文件，而是把整张 4KB 页的新版本顺序追加进旁边的 `-wal` 伴随文件，追加落盘即提交成立；等[[检查点]]触发时再把 `-wal` 里的页搬回主文件——和 InnoDB「日志先行、数据页后还」完全同源，只是日志里装的是整页拷贝而非字节差量，并发上则规定「同一时刻只许一个写者，多读者与写者互不阻塞」。连边缘云上的 [[D1]]，也是把这一个 SQLite 文件钉在主节点独占写入、再把日志复制到全球只读副本。

      合上这一课，遇到任何数据库快慢或落盘疑问，拿这「引擎三问」一照就清——一问**页在不在内存桌上**（慢在[[缓冲池]]未命中读盘，还是慢在版本链回溯）；二问**提交时日志真刷盘了吗**（每次提交是否严格执行了日志 [[fsync]]，有没有放宽刷盘换吞吐）；三问**形态选对没有**（进程内单机低运维选 SQLite，多机高并发写选 [[MySQL]] / PostgreSQL）。从嵌入式库到服务器集群，底下的页、缓冲与日志三件套从未变过。
    derivation: original
    sources:
      - ref: sqlite-docs
        locator: Write-Ahead Logging（WAL 模式与检查点、单写者）
        claim: WAL 模式下改动以整页帧顺序追加进 -wal 文件，检查点再把页搬回主数据库文件；同一时刻只允许一个写者，读者不阻塞写者
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
    canvas:
      kind: swimlane
      actors:
        - lane: app
          id: a
          label: 应用进程：SQLite 就住在里面
          highlight: true
        - lane: disk
          id: d
          label: 磁盘：一个主文件 + -wal 日志
      messages:
        - id: m1
          from: a
          to: d
          label: 函数调用直达，没有服务器这一层
          active: true
      registers:
        - name: 页大小
          value: 4KB（默认）
        - name: 写者
          value: 同一时刻只有一个
        - name: 日志
          value: WAL 追加整页，检查点回搬
    log:
      - mode: 对照
        event: 从服务器数据库到嵌入式函数库，形态可以天差地别，但页、缓冲与日志这三件套始终不变
minutes: 30
prereq:
  - data/btree-index
  - os/virtual-memory
objectives:
  - 用页文件、缓冲池与日志三件套说清一次更新和一次查询各自经过哪些部件
  - 解释数据页为什么必须严格等大、为什么只查一行也要整页搬运
  - 按次序复述提交成立的瞬间发生了什么，以及断电重启后靠什么恢复
aiLink: 现代 AI 基础设施在最底层用的是同一套算术：向量数据库的磁盘索引同样按块与页管理缓存，大模型推理里的 PagedAttention（KV 缓存分页）更是直接借走了「等大分块 + 按号寻址」的页思想。
design:
  - mechanism: 预写日志（WAL）：提交只等顺序写日志落盘，脏页留给后台慢慢还
    problem: 如果每次更新都当场把涉及的数据页写回表文件，散布全盘的随机写会把提交延迟拖垮；可如果只改内存不落盘，一旦断电已提交的数据就会丢失，持久性当场破产。
    choice: 立下预写日志铁律：内存里的脏页可以排队晚点写，但描述这次修改的 redo 日志必须先顺序追加并 fsync 刷盘，刷完才回复提交成功；由于日志只在末尾追加，最热的前台提交路径只付最便宜的顺序 IO。
    tradeoff: 每次提交至少要等一次日志刷盘（高并发下常靠组提交把多笔事务拼成一批摊薄）；后台必须常驻线程做检查点刷脏并回收旧日志；万一断电重启，恢复耗时与检查点之后积压的日志量成正比。
    root: 磁盘介质上顺序写比随机写快一到两个数量级，把「必须立刻兑现的承诺」改造成纯顺序记账，把「可以容忍延迟的归档」留给后台随机批量写回，才能同时保住低延迟与不丢数据。
  - mechanism: 等大分页作统一货币：一次乘法算偏移，顺应硬件块与访问局部性
    problem: 硬件底层按块读写，哪怕只要一行也得读出一整块；如果文件里的记录块大小不一，就没法直接算出地址；再加上缓存、刷盘、日志、恢复如果各用各的粒度，对账与换算会让引擎彻底乱套。
    choice: 把表文件切成严格等大的页并从 0 编号，第 N 页偏移等于 N × 页大小，一次乘法直接定位；搬运、缓存、记日志、崩溃恢复以及上层 B+ 树节点全部统一以页为单位结算。
    tradeoff: 只改一行也要整页读写（写放大），页内总有填不满的空闲碎片，超长行超过一页还得额外引入[[溢出页]]兜底；16KB 或 4KB 都是在搬运开销与碎片浪费之间磨出来的经验折中。
    root: 数据访问天然扎堆（相邻行大概率紧接着被查，整页预取不亏），而等大分块又把磁盘寻址从顺序翻找变成了简单乘法——数据库与操作系统虚拟内存撞上同一堵物理墙，自然选了同一块砖。
  - mechanism: 绕开 OS 缓存自建缓冲池：把留谁、踢谁与刷盘次序攥回引擎手里
    problem: 操作系统的文件页缓存只看得见字节块，看不见数据库语义——既分不清每天必碰的 B+ 树根页与夜间报表扫过的冷页，更不知道未刷日志的脏页绝对不能提前落盘。
    choice: 数据库通过直接 IO 绕过操作系统的页缓存，亲手维护内存缓冲池：不仅能保护热页、给全表扫描路过的冷页降权防冲刷，还能严格按预写日志纪律控制脏页写回时机。
    tradeoff: 内存账目得由数据库运维自己操心：不绕开 OS 缓存会造成双份缓存浪费，绕开后缓冲池配太大容易挤占系统内存，配太小又会让命中率跳水。
    root: 缓存命中率与安全性取决于谁最懂访问模式和写入约束；当底层通用机制缺乏关键业务语义时，由贴近语义的上层接管调度才是总成本最低的做法。
terminal:
  - cmd: SHOW VARIABLES LIKE 'innodb_page_size';
    note: 在 MySQL 里看 InnoDB 的页大小，默认 16384（16KB）
  - cmd: SHOW VARIABLES LIKE 'innodb_flush_log_at_trx_commit';
    note: 值为 1 表示每次提交都把 redo 刷进磁盘
  - cmd: PRAGMA page_size;
    note: 在 sqlite3 里看 SQLite 的页大小，默认 4096（4KB）
  - cmd: PRAGMA journal_mode=WAL;
    note: 把 SQLite 切到 WAL 模式，观察多出的 -wal 文件
