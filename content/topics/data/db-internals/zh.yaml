      highlight: true
    - lane: pool
      id: p
      label: 版本链：新版本 → 旧版本 → 更旧版本（undo）
    messages:
    - id: m1
      from: e
      to: p
      label: 沿 undo 链挑我可见的那个版本
      active: true
    registers:
