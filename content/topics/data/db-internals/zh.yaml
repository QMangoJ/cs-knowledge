- id: page-why
  title: 为什么最小单位是页，不是一行
  tldr: 三个根本原因：硬件按块给货、邻居大概率一起被查、全系统要用同一种单位记账。
  body: '你可能会问：我要的明明只是某一行，为什么非得整页搬运，不能只读那一行？第一个原因是硬件的脾气：磁盘和 SSD 在物理上就按块读写，块是它们能给出的最小一份，你只想要 100 字节，它也只能把一整块端上来。把数据库的读写单位定成页，等于顺着硬件的块再放大一号对齐，而不是跟它别扭。

    第二个原因是邻居的便宜。数据访问有个脾气叫局部性：今天被查的那一行，它的左邻右舍近期大概率也会被查——按 id 顺序翻、看最近一小时的记录，都是这个道理。整页搬进内存，等于买一行送一排：把 id=7 所在那页读进来，id=8 到 id=80 顺道全在桌上了，后面的查询直接在内存里命中，不再惊动磁盘。

    第三个原因最隐蔽：页是全系统的统一货币。缓存装不下时按页请出（淘汰整页）、刷盘按页写回、日志按页记账（「第几页的哪处改成了什么」)、崩溃恢复按页重做、B+ 树按页组织节点。所有子系统都拿页结算，零件之间才严丝合缝；若是各用各的单位，光是换算和对齐就能把整个系统拖垮。'
  derivation: original
  canvas:
