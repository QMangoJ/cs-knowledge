- id: write-checkpoint
  title: 写入之旅·四：脏页慢慢还账，与断电彩蛋
  tldr: 脏页由后台批量写回，检查点像书签推进；断电重启时 redo 重做、undo 撤销，世界复原。
  body: '账记完了，脏页还欠着。什么时候还？由后台线程在系统空闲时，或缓冲池需要腾地方时，成批把脏页写回数据文件。这个推进动作叫检查点（checkpoint），它像一枚书签：标记「这个位置之前的修改，数据文件里已经全有了」，日志里书签之前的部分从此可以回收重用。把随机、零散的写回攒成批慢慢做，正是日志先行换来的自由。

    现在放出彩蛋：假设提交成功后、脏页还没回写的那一秒断了电。重启时引擎做两件事：先顺着 redo 把日志重演一遍，所有已提交的修改被重新做到数据页上，哪怕它们生前从没写回过；再检查有没有改到一半、没来得及提交的事务，用 undo 把它们留下的痕迹一一擦净。重做在前、撤销在后，数据库从断电里醒来时，世界和它断电前承诺过的分毫不差。

    回头给这条写路径算总账：应用等到的只有一次日志刷盘的延迟（顺序写，便宜）；昂贵的数据页随机写回被推迟、合并、批量化；崩溃恢复的成本押后到重启时一次算清。快、稳、便宜不能兼得时，存储引擎的选择是让最热的路径只付最便宜的 IO，其余的账都记到冷处慢慢还——这也是后面每一课都会反复见到的取舍手势。'
  derivation: original
  sources:
  - ref: mysql-innodb-docs
    locator: MySQL Glossary 与 InnoDB Recovery（checkpoint / 崩溃恢复）
    claim: 检查点记录所有已修改页均已刷盘的位置；崩溃恢复时 InnoDB 用 redo 重做并回滚未提交事务
    status: verified
    checkedBy: Muse 核查
