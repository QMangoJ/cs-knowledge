  log:
  - mode: 读取·判定
    event: 读不加锁的秘密：不是读最新，而是读对自己成立的那个版本
- id: sqlite-contrast
  title: 收尾对照：SQLite 把整套机器装进一个函数库
  tldr: 没有服务器、没有连接线程，同一套三件套被压缩到极致；D1 再把这个文件钉到全球一张网上。
  body: '最后把镜头切到另一个极端：SQLite。它把这整套机器压缩进一个函数库：没有独立的服务器进程，没有连接线程，应用调用它的函数，就在自己的进程里把活干完；数据只住在一个文件里，默认页大小 4KB，同样是页加 B+ 树的组织。麻雀虽小，规矩不缺：它照样有页缓存（迷你版的缓冲池），照样靠日志保命。

    它的日志可以切成 WAL 模式：改动不直接写主文件，而是把整页的新版本顺序追加进一个 -wal 伴随文件，提交即追加完成；主文件等检查点时，再把 WAL 里的页搬回去——和 InnoDB「日志先行、数据页后还」是同一套心法，只是日志里装的是整页拷贝而不是字节级改动。它和 MySQL 最大的分野在并发：同一时刻只许一个写者，读可以并发且不挡写。用单写者的简单，换零运维与无处不在。

    把视野再拉远一句：云上的 D1，就是把这一个 SQLite 文件钉在一个主节点上、由它独占写入，再把日志复制到全球的只读副本。选型到这里也就清楚了：进程内、单机、低运维，SQLite 一档；多机并发写与完整的事务体系，MySQL 一档。形态天差地别，底层那三件套从头到尾没有变过——这正是本课想留给你的那张地图。'
  derivation: original
  sources:
