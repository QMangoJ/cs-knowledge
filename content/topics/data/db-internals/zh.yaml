      value: 约百纳秒量级
    - name: SSD 读页
      value: 约几十微秒量级
    - name: 机械盘读页
      value: 约毫秒量级
  log:
  - mode: 读取·定位
    event: 命中与否决定这条查询属于哪个数量级
- id: read-version
  title: 读取之旅·二：沿着版本链，挑一个属于你的版本
  tldr: 同一行同时有好几个版本；按你开事务时领的快照，沿 undo 链往回挑第一个可见的。
  body: '版本判定要解决的问题是：同一行，世界上同时躺着好几个版本，你该看哪一个？规矩叫快照读：事务开始时先领一份快照，记下那一刻已经提交的事务名单（InnoDB 里叫 ReadView，可以理解成一张「我出生时，世界长什么样的合影名单」）。读一行时先看最新版本是谁写的：写它的人在名单里且已提交，这个版本就归你看；它是你出生之后才冒出来的事务写的，那对你来说等于还没发生，跳过。

    跳过去哪找旧的？靠写入之旅里埋下的那条线：每一行都留着一个指针，指向 undo 里它上一个版本的拷贝，旧版本又指向上上个版本，串成一条版本链。判定就是沿着链往回走，直到找到第一个「在我的快照里可见」的版本为止。两个事务同时读同一行，可能一个停在链头的新版本、一个走到链中间的旧版本——各自看到各自时刻的世界，互不打架。

    最妙的是全程不上锁：读的人沿链挑版本，写的人在链头造新版本，谁也不等谁，这正是数据库扛住高并发读的看家本领。这里只走到「会挑版本」为止：快照的精确判定规则、四档隔离级别各自放行哪些怪现象、版本链拉得太长为什么会把所有读都拖慢，是下一课的正题。'
  derivation: original
  sources:
  - ref: mysql-innodb-docs
    locator: InnoDB Multi-Versioning（多版本与 ReadView）
    claim: InnoDB 用 undo 中的旧版本支持一致性读：读事务按 ReadView 判断版本可见性，沿版本链回溯到可见版本
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
