steps:
  - id: model
    title: 拆开存储引擎只有三件套：页文件、[[缓冲池]]与追加日志
    tldr: 数据库把数据住在等大分页的磁盘文件里，所有翻看与涂改都在内存[[缓冲池]]上完成，持久性承诺则押在只许顺序追加的日志上——同一瞬间三处数据正大光明地不一致，正是引擎兼顾速度与安全的常态。
    body: |-
      像 [[MySQL]] 这样跑在服务器上的独立守护进程 `mysqld`（[[InnoDB]] 就是嵌在它内部的存储引擎模块），拆开外壳其实只有三件家当。第一件是**身体**：躺在磁盘上的表空间大文件（如 `.ibd`），被整整齐齐切成等大的小块，每一块叫一页（page），全部表与索引都住在页里。第二件是**办公桌**：引擎在内存里划出的一大片[[缓冲池]]（Buffer Pool），磁盘里的页必须先搬上桌才能读取和修改，引擎从不在磁盘原件上直接涂改。第三件是**账本**：一本只许往末尾追加、不许回头涂改的流水日志，每笔修改先记账落盘，才敢对外答复「办妥了」。

      接下来跟着 7 号账户走的一笔扣款和一次查询，不论中间冒出锁、版本链还是[[检查点]]，本质上都只是在这三处之间搬运页，不会再冒出第四个地方。

      上路前先把一个反直觉的常态钉牢：**同一行数据在同一瞬间，在三处的内容可以正大光明地不一样**——7 号账户刚扣完 100 元时，内存办公桌上已经是新值 `900`，日志账本里躺着改动记录，磁盘数据文件里却还是旧值 `1000`（好比前端界面先乐观更新出新数字、操作队列已写进本地持久化存储，后端主表稍后才异步落库）。这不是故障，而是存储引擎既跑得快、断电又丢不了数据的全部秘密。
    derivation: original
    sources:
      - ref: mysql-innodb-docs
        locator: InnoDB Buffer Pool（缓冲池）章节
        claim: 缓冲池是 InnoDB 在内存中缓存表与索引数据的区域，数据页在内存中被读取与修改
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
