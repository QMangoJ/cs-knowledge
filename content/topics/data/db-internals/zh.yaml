    locator: 10.5.2 Optimizing InnoDB Transaction Management（undo 与旧版本保留）
    claim: 行被修改或删除后，旧数据保留在 undo 日志中，直到早先开始的并发事务结束，它们仍能读到修改前的状态
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
