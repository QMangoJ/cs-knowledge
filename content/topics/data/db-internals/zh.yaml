- id: page-anatomy
  title: 把一页放大：里面其实自成一个小世界
  tldr: 页的外部尺寸和搬运方式都清楚了，这一步把一页放大，看它内部长什么样。场面就像翻开一页表格：页头写着这一页的身份，记录区挨着塞行，底部还倒着长出一排槽位指针，页内找一行先在这些指针上二分，不用逐行翻。
  body: |-
    把一页放大看，它不是一页白纸，而是一张有固定版式的表格。最上面是页头：写着我是第几页、哪种页（装数据的还是装索引的）、一串校验和（识破写了一半的烂页），还有一个日志序号，标记这一页最后被哪一笔日志改过——崩溃恢复时靠它判断这一页需不需要重做。页头之下是记录区，一行行记录挨着塞进来，下方留着大片空闲，预备给新插入的行和会变长的行；页的最底部倒着长出一排小指针，叫页目录（槽位数组），每个槽位指向一条记录。页内找一行，引擎先在槽位上二分锁定一小段，再顺着记录走几步便到，不必逐条比对。一页之内，页头、记录、空闲、目录，自成一个小数据库。
    接上一课：B+ 树的每个节点就是这样的一页，根页、枝页、叶子页只是页头里写的类型不同；树高三层，就是顺着页里的指针跳三页；回表，就是拿主键再去另一棵树跳几页。砖块的内部版式，决定了上层结构的成本形状。
  derivation: original
  sources:
  - ref: cmu-15445
    locator: Database Storage 讲义（槽位页 Slotted Page 布局）
    claim: 数据页采用槽位页布局：页头记录元信息，槽位数组指向页内记录，支持页内定位与空闲管理
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: engine
      id: e
      label: 引擎：在页目录的槽位上二分
      highlight: true
    - lane: disk
      id: d
      label: 一页的内部：页头 / 记录区 / 空闲 / 页目录
    messages:
    - id: m1
