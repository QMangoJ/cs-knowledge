- id: page-anatomy
  title: 把一页放大：里面其实自成一个小世界
  tldr: 页头写着身份与账龄，记录区挨着塞行，底部倒长出一排槽位指针，页内找行先走二分。
  body: '把一页放大看，它不是一页白纸，而是一张有固定版式的表格。最上面是页头：写着我是第几页、我是哪种页（装数据的还是装索引的）、一串校验和（用来当场识破写了一半的烂页），还有一个日志序号，标记这一页最后被哪一笔日志改过——崩溃恢复时就靠它判断这一页需不需要重做。页头之下是记录区，一行行记录挨着塞进来。

    记录区之下留着大片空闲，预备给新插入的行和会变长的行；页的最底部倒着长出一排小指针，叫页目录（槽位数组），每个槽位指向记录区里的一条记录。在页内找一行时，引擎先在槽位上二分查找，锁定一小段范围，再顺着记录走几步便到，不必从第一行逐条比对。一页之内，页头、记录、空闲、目录，自成一个小数据库。

    顺带把上一课接上：B+ 树的每个节点就是这样的一页，根页、枝页、叶子页只是页头里写的类型不同。所谓树高三层，就是顺着页里的指针跳三页；所谓回表，就是拿着主键再去另一棵树跳几页。砖块的内部版式，决定了所有上层结构的成本形状。'
  derivation: original
  sources:
