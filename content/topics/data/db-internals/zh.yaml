- id: page-os
  title: 数据库为什么在操作系统之上再自管一层缓存
  tldr: 页在内存与磁盘间换进换出，和虚拟内存同构——只是操作系统不懂数据库的访问模式。
  body: '细心的你可能已经发现：把磁盘页换进内存、把最久没用的页请出去，这套动作和操作系统虚拟内存里的缺页与页面置换一模一样。没错，Buffer Pool 就是数据库在操作系统之上、亲手又搭的一层「虚拟内存」：页在磁盘与内存之间流动，热页常驻、冷页淘汰，逻辑完全同构，区别只是 OS 管的是内存页、数据库管的是数据页。

    为什么要多此一举，不直接蹭操作系统的文件缓存？因为操作系统不知道这些页都是谁。它不知道哪一页是 B+ 树的根、每次查询都要碰，请出去一次全站陪葬；不知道哪一页正被一个报表查询顺序扫过、留着纯属浪费；更不知道哪一页是脏的、写回顺序还被日志纪律锁死。按通用策略管数据库的页，必然在最要紧的地方犯错。

    实践中的分工是：数据库用直接 IO 绕开操作系统的页缓存，避免同一页在两层缓存里各存一份、白占内存；操作系统退回到只管进程与文件本身。同一套思想在两层各跑一遍，看着重复，其实是「谁更懂、谁来管」这条工程原则的必然结果——读系统源码时你会反复见到这个画面：每一层都嫌下层不够懂业务，于是自己再实现一遍。'
  derivation: original
  canvas:
