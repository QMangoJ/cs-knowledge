    event: 合并的触发看四类信号，策略的选择看读写比例，先把写放大的量级算清再动手调
- id: crash-recovery
  title: 断电恢复走例：[[MemTable]] 蒸发不可怕，[[WAL]] 刷到哪才算到哪
  tldr: 断电瞬间 [[MemTable]] 全部清零，但已落盘的 [[SSTable]] 原地可用、未刷盘的改动靠顺序重放 [[WAL]] 重建；临界时刻的写入保不保得住，完全取决于日志选了逐笔同步还是按窗口批量刷盘。
  body: |-
    把镜头对准断电前一刻的连续两笔写入：第一笔写入 `甲键 = 1`，[[WAL]] 记录追加后立即同步刷入磁盘，键值插进 [[MemTable]]，客户端收到成功响应；紧接着第二笔写入 `乙键 = 2`，此时系统配的是按时间窗口批量刷盘策略，日志记录刚写进操作系统页缓存、还没来得及真正落盘，MemTable 已更新且客户端同样收到了成功。就在这一瞬间机房断电，内存里的 MemTable 和页缓存当场清零。

    机器重启后，恢复剧本只有简明两步：先前已经刷成不可变 [[SSTable]] 的磁盘文件完好无损、直接挂载可用（它们对应的旧日志早已安全归档删除）；尚在活跃期的 [[MemTable]] 则靠从头顺序重放剩余的 WAL 日志重建。重放时，`甲键 = 1` 的日志早已稳稳躺在磁盘上，顺利插回新 MemTable 完成复活；而 `乙键 = 2` 当时还悬在操作系统缓存里未曾落盘，重放根本见不到它的踪影，只能按从未持久化处理。

    乙键丢失并非引擎出了故障，而是配置者在吞吐与持久性之间签下的明文契约：如果业务要求已应答数据零丢失，就必须打开逐笔同步刷盘，绝不在 [[fsync]] 完成前向客户端点头；选了时间窗口批量刷盘，就等于默认接受崩溃时损失最后一个窗口的数据。此外，断电常让日志末尾停在半截没写完的记录上，每条日志都自带[[校验和]]，重放扫到校验失败的残缺尾巴便直接截断丢弃，绝不让脏半截污染状态——与关系型事务一样，日志才是唯一真相，内存表随时丢、随时能重搭。
  derivation: original
  sources:
  - ref: cmu-15445
    locator: 数据库存储讲义（[[WAL]] 与崩溃恢复）
    claim: "[[LSM]] 崩溃后重放日志恢复未刷盘部分，已刷成文件的部分直接可用，尾部不完整记录靠校验和丢弃"
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: 断电后：刷过盘的甲键还在，停在缓存里的乙键按配置丢失
    rows:
