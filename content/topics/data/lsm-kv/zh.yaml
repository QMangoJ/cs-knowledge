title: LSM 树与 KV 存储：为写而生的数据结构
summary: B+ 树是原地更新，LSM 是只追加、后合并——写密集场景（日志、时序、特征）为什么纷纷倒向 LSM。
premise: 以 RocksDB/LevelDB 这类嵌入式 KV 存储的写读路径为例。
position: >-
  本课划入「为写优化的存储」板块，紧接上一课预写日志先落盘的纪律往前再走一步：既然顺序追加的日志已能兜住持久性，干脆让全部写入都改成顺序追加、整理留待后台合并。学完你能画出从 WAL 与 MemTable 刷成 SSTable 的写路径，也能拿写放大、读放大、空间放大三个数解释 leveling 与 tiering 为何没有同时最优解。
bridge:
  prev: >-
    上一课里 WAL 只负责在数据页之前抢先落盘保命，本课则让追加式日志从配角变主角，整个存储结构都按只追加、后合并重新组织起来。
overview:
- key: 一句话总结
  value: 写入先记 WAL + 进内存表，攒够了顺序刷成有序文件，后台再把文件逐层合并
- key: 为什么写得快
  value: 所有落盘都是顺序写，没有随机原地更新
- key: 读的代价
  value: 一个键可能在内存表与多层文件里，要逐层找，靠布隆过滤器跳过不存在的文件
- key: 三个放大
  value: 写放大（合并重写）、读放大（多层查找）、空间放大（旧版本未清）——LSM 的全部调优在三者间权衡
- key: 与 B+ 树的分工
  value: 读密集/范围扫用 B+ 树；写密集/键值型用 LSM
- key: 工程里
  value: RocksDB、Cassandra、LevelDB；向量与特征存储的底层也常见它的身影
