- id: tombstone-read
  title: 墓碑与读的短路：删除标记如何终止查找
  tldr: 任何一层先命中的结果都说了算，命中墓碑就立刻返回不存在——提前丢墓碑会让深层旧值复活。
  body: '给键四十二排一条完整的时间线：先写入值一，合并后沉到第一层；再写入值二，还在第零层；最后执行删除，墓碑作为最新记录进入内存表。现在来读这个键：顺序是内存表优先，内存表里先命中的就是墓碑，于是立刻返回不存在，不再往下查任何一层——这就是读的短路：因为层越深版本越旧，任何一层先命中的结果，无论是值还是墓碑，都注定是最终答案，继续往下找只会找到更旧的版本。再看反方向：若新写入发生在墓碑之后，新值躺在内存表里，读时先命中新值，墓碑被它遮蔽，两者要等日后合并相遇时才一起了断。最要命的细节是墓碑不能提前丢：它必须一路下沉到最底层、并确认自己下面再没有同一键的旧版本，才能连同旧值一起消失。若在中间层图省事把墓碑扔了，深层的旧值失去遮挡，日后读路径走到那一层会把已删除的数据重新读出来，工程上这叫数据复活，是 LSM 实现里最经典的事故类型。范围删除同理：一条范围墓碑覆盖一整段键，读与合并时都要拿它去匹配范围内的每个键，短路与下沉规则完全一致。'
