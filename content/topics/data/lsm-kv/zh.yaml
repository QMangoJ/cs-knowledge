- id: ai-link
  title: AI 工程里的同构体：从在线特征库、[[Kafka]] 到向量段合并
  tldr: 在线特征存储、Agent 会话状态、[[Kafka]] 日志段乃至向量数据库的段合并与删除位图，底层都在跑「前台顺序追加、后台归并回收」的同一套 [[LSM]] 剧本。
  body: |-
    AI 在线特征存储天生就是教科书级的写密集加点查负载：离线与流式管线每秒大批量灌入最新用户与物品特征，线上推理只按实体主键做毫秒级点查，因此大量特征库直接内嵌 [[RocksDB]] 或采用分布式 [[LSM]] 系 [[KV]] 存储（如 [[Cassandra]]）；高频刷新的 Agent 多轮会话状态与检查点同理。至于需要复杂条件过滤的业务元数据，往往还是交回 [[B+ 树]]或倒排索引各司其职。

    哪怕走进专门做相似度检索的向量数据库，底层段式架构也是 LSM 的孪生兄弟：新灌入的向量先进内存缓冲区，攒够一批便刷成不可变的小段（Segment）并独立建局部向量索引；后台任务持续把多个零碎小段归并成大段、重建图或量化索引；删除某条向量时也不原地拆图，而是先在删除位图里打个标（等价于[[墓碑]]），等段合并时再真正剔除释放空间。查询时同样要同时扫内存新段与磁盘历史段，确保刚写入的向量立即可见。

    再把视野拉宽一层：凡是遵循「写入先追加不可变日志、后台异步归并出紧凑读视图」的系统——从 [[Kafka]] 的日志压缩（Log Compaction）到流处理引擎的状态后端——骨子里全是同一套账本。把本课的追加日志、分层合并、墓碑短路与三个放大吃透，日后翻开任何现代数据基础设施的架构文档，基本都是在认老熟人。
  derivation: original
  sources:
  - ref: cmu-15445
    locator: 数据库存储讲义（log-structured 的应用范围）
    claim: 日志结构化思想广泛应用于现代键值与流式存储系统
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
