- id: write-path
  title: 写路径只干两件快事：追加 [[WAL]] 保命，插入 [[MemTable]] 接客
  tldr: 一次 PUT 请求只顺序追加一条 [[WAL]] 日志并插入内存有序表 [[MemTable]]，全程不碰磁盘数据文件；表满后冻结，由后台线程整表顺序刷成不可变的 [[SSTable]]。
  body: |-
    一条写请求进门只走两步：先往磁盘末尾顺序追加一条 [[WAL]]（预写日志，专门负责崩溃后重放保命），再把键值对插入内存里的有序结构 [[MemTable]]。由于两步都完全不碰磁盘上的历史数据文件，前台写延迟既低又稳。等 MemTable 写满（常见几十 MB 量级，视配置而定）便当场冻结为只读状态，同时立刻换上一张空的新表继续接客；冻结的旧表由后台线程从头到尾顺序刷盘，写成一张不可变的有序文件 [[SSTable]]，刷盘期间前台读写丝毫不停。

    为什么 MemTable 偏爱用[[跳表]]而不是红黑树？因为跳表插入只需改动局部几个指针、查找保持期望对数级复杂度，最关键的是刷盘时需要整表按序输出——顺着跳表最底层链表从头走一遍就是天然的有序流，省去了红黑树中序遍历和密集旋转调指针的麻烦，并发加锁也更容易拆细。

    WAL 怎么刷盘则是持久性与吞吐之间的调节旋钮：每写一笔都调用 [[fsync]] 同步落盘最安全，但延迟最高；按几毫秒时间窗口攒批刷盘能大幅拉高吞吐，代价是突然断电时可能丢掉最后一个窗口内已向客户端返回成功的写入。选哪一档没有标准答案，必须和业务对丢数据的容忍底线严格对齐。
