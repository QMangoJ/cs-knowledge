- id: read-path
  title: 读路径：为什么要布隆过滤器
  tldr: 查一个键要从新到旧逐层找；大多数文件根本没有这个键——布隆过滤器用极小的内存先回答「肯定没有」。
  body: '读一个键：先查 MemTable，再查 L0 的文件、L1、L2……同一键可能有多个版本，第一个找到的就是最新值。最坏情形要翻很多文件，每个文件还要读索引定位——读放大由此而来。

    缓解靠布隆过滤器（Bloom Filter）：每个 SSTable 配一个位数组，对键做几次哈希置位。查一个键时先问过滤器：任一位为 0 → 这个文件肯定没有，直接跳过；全为 1 → 可能有（小概率误报），再去读文件。它只需要极低的内存（约每键十比特量级、误报率约 1% 量级，随参数而定），就把「查不存在的键」从灾难变成接近免费。

    把点查的最坏情形说透：查一个不存在的键时没有任何捷径能提前下结论，只能逐层问过去，这正是布隆过滤器存在的意义——它把每一层的排除成本压到查几个比特，用大约每键十比特的内存换来约百分之一量级的误报率（具体数值随参数变化）。误报的代价仅仅是白读一次那个文件的索引块，结论仍然正确，所以过滤器可以放心地用内存换误报率，正确性毫发无损。还有两个常见加速：文件索引块与过滤器常驻内存或缓存，以及给热点层加块缓存。范围扫描则享受不到这种短路：它要在内存表与每一层上同时开归并迭代器，像多路归并排序一样边走边合并版本，新旧取舍在迭代中完成，这就是 LSM 范围读先天贵于 B 加树叶子链表的机制原因。'
  derivation: original
  sources:
