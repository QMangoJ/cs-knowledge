- id: read-path
  title: 点查从新往旧翻，靠[[布隆过滤器]]挡掉九成九白跑
  tldr: 点查按「[[MemTable]] → L0 → L1…」由浅入深查找，第一个命中的版本即为最新值；每张 [[SSTable]] 配备约 10 bit/键的[[布隆过滤器]]，能以零漏报当场跳过肯定不含目标键的文件。
  body: |-
    点查一个键必须按新鲜度从新往旧搜：先查活跃与冻结的 [[MemTable]]，未命中再查 `L0` 的所有可能文件，接着依次问 `L1`、`L2`……因为浅层永远比深层新，只要在哪一层先撞见目标键，当场就能收工返回。麻烦在于查冷键或根本不存在的键时，没有任何一层能提前拦住，最坏得把沿途几十张文件逐个打开读索引定位——这就是[[读放大]]的由来。

    救场全靠[[布隆过滤器]]（Bloom Filter）：生成每张 [[SSTable]] 时附带一个位数组，对文件内每个键做几次[[哈希]]并把对应比特置为 `1`。点查打开文件前先问过滤器：只要任意一位是 `0`，说明该键**绝对不在文件里**，直接跳过整张文件；只有全部位都是 `1` 才说明「可能在」（存在小概率哈希撞车误报），此时再去读文件索引块。它平均每个键只花约 10 bit 内存，就能把误报率压到约 1% 量级，硬生生把「查不存在的键」从翻遍磁盘变成查几下内存比特。

    你可能会担心那 1% 的误报会不会返回脏数据——完全不会。误报只是让引擎白读一次那张文件的索引块，进去比对真键后自然发现不存在，正确性毫发无损。工程上还会把文件的索引块与过滤器常驻内存，再配一层块缓存兜住热点数据块。唯独范围扫描（如 `SCAN k1..k2`）沾不上单键布隆过滤器的光：它必须在内存表与各层文件上同时打开迭代器，像多路归并排序那样边扫边比对新旧版本，因此 [[LSM]] 的范围读天生比 [[B+ 树]]顺着叶子链表平推要贵。
