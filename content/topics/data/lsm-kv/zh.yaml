      cells:
      - v: RocksDB：特征与会话状态
      - v: Kafka：写先追加进日志段
      - v: 流处理状态存储：先记日志再合并视图
  log:
  - mode: 迁移
    event: 先追加写入、后慢慢整理，这个模式在特征存储、消息日志和流处理状态里到处都是
level: 进阶
minutes: 32
prereq:
- data/transactions
objectives:
- 画出 LSM 从 WAL、MemTable 到多层 SSTable 的完整读写路径，并指认各环节开销来源
- 讲清布隆过滤器为何能保证「零假阴性」，以及墓碑提前丢弃为何会引发数据复活
- 用写放大、读放大、空间放大定量对比 leveling 与 tiering，并结合业务负载在 LSM 与 B+ 树间做出选型
aiLink: 在线特征存储、Agent 会话检查点与向量数据库的段式合并都在复用 LSM 架构；算清写放大、读放大与空间放大三本账，才能看懂 RocksDB 的调参面板与各类存储基准测试背后的猫腻。
design:
- mechanism: 前台顺序追加 + 后台分层合并
  problem: 写密集负载下，B+ 树每次更新乱序键都要定位并随机改写磁盘页——机械盘卡在毫秒级寻道，固态盘也要背闪存垃圾回收的额外损耗，随机 IO 很快先于 CPU 把吞吐卡死。
  choice: 前台写入只干两件最快的顺序活：追加一条 WAL 日志保命、把键值插入内存有序表 MemTable；表满整块顺序刷成不可变的 SSTable，把维护全局有序的重活推迟给后台合并慢慢做。
  tradeoff: 前台省下的债全转移到了读路径、磁盘空间与后台带宽上：同一个键可能散在多层文件里造成读放大，旧版本与墓碑合并前白占磁盘造成空间放大，后台反复归并重写同一份数据还会带来数倍至数十倍的写放大。
  root: 无论机械盘还是固态盘，顺序写的单位成本都远低于随机原地改写，而后台合并恰好也是大块顺序读写；把前台昂贵的随机写批发换成后台廉价的顺序写，再用布隆过滤器与缓存补齐点查短板，写占比越高这笔总账越划算。
- mechanism: 每张 SSTable 配备单向可靠的布隆过滤器
  problem: 点查不存在的键或深层冷键时无法提前终止，若老老实实逐层打开每张 SSTable 读索引块，每次未命中都要把读放大全额付满。
  choice: 为每张 SSTable 生成一个位数组，写入文件时对所有键做多次哈希置 1；点查前先查位数组，只要任一位为 0 就断定文件里绝对没有该键并当场跳过，仅花约 10 bit/键的内存就把排除开销压成几次内存位运算。
  tradeoff: 哈希碰撞会让它以约 1% 的小概率把「没有」误判成「可能有」（假阳性），代价只是多读一次文件索引块，绝不影响最终结果；但反过来绝不漏报，说「没有」就百分百真没有。
  root: 置位操作具有单调性——凡是写进文件的键，其哈希位必然全为 1，因此遇到任何一个 0 位都能给出数学上严格可靠的否定结论；用极小内存买下零漏报的快速排除权，是概率数据结构在存储引擎中最经典的一次登场。
quiz:
- q: LSM 树写入吞吐远高于原地更新结构的根本原因是？
  options:
  - 它完全不用写任何日志
  - 前台落盘只有顺序追加（WAL 追加 + MemTable 整表顺序刷盘），消除了随机原地改页
  - 它把全量历史数据永久放在内存里
  - 它放弃了崩溃后的持久性保证
  answer: 1
  explain: LSM 前台写路径只需顺序追加 WAL 并插入内存 MemTable，表满后整表顺序写成不可变 SSTable，把随机更新转换成了顺序 IO 与后台异步归并。
- q: 当布隆过滤器回答「这张 SSTable 文件里没有目标键」时，这个结论可信吗？
  options:
  - 100% 可信：布隆过滤器无假阴性，只要判无就绝对不存在
  - 不可信，仍需打开文件核对
  - 大约只有一半把握
  - 只对整数类型的主键可信
  answer: 0
  explain: 写入文件的键已将其所有哈希位置为 1，查询时只要发现任意一位为 0，说明该键绝未被写入过（零假阴性）；反之全为 1 时才存在小概率假阳性误报。
- q: 在 LSM 引擎中执行 DELETE 删除一个键，当下立刻发生的操作是？
  options:
  - 立刻遍历所有层级的 SSTable 把旧版本物理擦除
  - 追加写入一条最新的墓碑（Tombstone）标记，真正的物理回收留到后续后台合并时完成
  - 什么都不写，直接返回成功
  - 当场把整层文件推倒重建
  answer: 1
  explain: SSTable 一旦生成便不可原地修改，因此删除也是追加写一条带墓碑标记的新记录；点查撞见墓碑即短路返回不存在，直到后台合并沉底时才与旧版本一并丢弃。

