- id: levels
  title: 文件分层与后台 [[compaction]]：越浅越新，逐层归并消肿
  tldr: 新刷出的 [[SSTable]] 先落入允许键范围重叠的 L0，后台 [[compaction]] 持续将上层文件与下层重叠文件归并排序，维持深层文件互不重叠，并保证同一键的最新版本永远住在更浅层。
  body: |-
    磁盘上的 [[SSTable]] 按新鲜程度从浅到深分层：刚由内存表刷出的文件全落在 `L0`，越往下层号越大、数据越「冷」。后台合并线程（[[compaction]]）持续挑出上层文件，与下一层键范围重叠的文件做多路归并排序——遇到同一个键只保留新版本、覆盖旧版本，遇到删除标记（[[LSM]] 不做原地擦除，删除只是新写一条[[墓碑]]记录）则在沉底时连同旧值一并清理。合并铁律保证了任意键的最新状态一定出现在更浅的层里，读路径因此拥有从浅到深的确定查找次序。

    分层容量通常按每深一层放大约 10 倍设计（量级示意，各实现可调），整库一般 5 到 7 层封顶，绝大部分数据都住在最底层。其中 `L0` 最特殊：每张文件都是不同时刻内存表的全量快照，键范围彼此重叠；而从 `L1` 开始，同层文件经归并切分后键范围互不重叠。正因 `L0` 重叠会拖慢读取，引擎对 `L0` 文件数设有硬门槛：攒多了先触发向 `L1` 合并；若前台灌入太猛导致后台合不过来、`L0` 继续堆积，引擎就会主动触发写入限速甚至短暂停写（Write Stall），强行压慢前台给后台让路——线上常见的写入延迟毛刺，十有八九源头就在这里。

    墓碑回收同样受分层节奏制约：一条墓碑必须逐层下沉到最底层，才能把压在底下的旧值彻底清走；如果上层不断有新文件落下、迟迟轮不到它下沉，明明删掉的数据也会一直占着磁盘不松手。
  derivation: original
