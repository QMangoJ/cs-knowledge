steps:
- id: why
  title: 原地改页扛不住写洪峰：把随机写翻成顺序追加
  tldr: "[[B+ 树]]每次更新乱序键都要定位、读入并随机写回磁盘页；[[LSM]] 树放弃原地改页，前台落盘只做顺序追加，把维护全局有序的苦活整体挪给后台合并。"
  body: |-
    面对日志采集、行为埋点与时序指标这类每秒灌入几十万条乱序键值的负载，[[B+ 树]]很快就会在磁盘 [[IO]] 上见顶：它的叶子页散布在磁盘各处，每次更新一个随机键都要定位、换入、改写再刷回所在页；键分布越乱，随机读写越碎。[[LSM]] 树（Log-Structured Merge Tree）干脆把思路反过来：前台落盘一律只做顺序追加，绝不原地改页，至于「整理成有序结构」则推迟到后台慢慢归并。

    算细存储介质的价格差就能看懂这笔账：机械硬盘一次随机寻道要几毫秒，顺序读写却能跑满带宽，两者相差一到两个数量级；到了 [[SSD]] 时代，随机写虽不再受机械寻道之苦，仍会触发闪存内部的垃圾回收与设备级[[写放大]]，而顺序追加在任何介质上都能吃满预读、批量刷盘与页缓存的红利。注意，LSM 并没有放弃有序，只是把排序开销从前台写路径摘除、挪到后台合并阶段；读路径为此要承担多层查找的代价，这笔交易划不划算，全看业务负载里写占多大比重。

    在工程形态上，最常见的 [[RocksDB]] 与 LevelDB 甚至不是独立部署的数据库进程，而是直接链接进业务服务的嵌入式存储库，管着磁盘目录里一堆只追加的 `.log` 日志和不可变的 `.sst` 数据文件——好比前端遇到高频状态变更时，先把动作顺序推入内存队列攒批落快照，而不是每敲一下键盘就重算并覆写整份本地存储。这套思想由 Patrick O'Neil 等人在 1996 年提出，后经 Google LevelDB 与 Meta RocksDB 打磨成现代写密集系统的标配底座。
