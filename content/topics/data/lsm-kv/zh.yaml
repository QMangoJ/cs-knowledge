- id: vs-btree
  title: "[[LSM]] 对照 [[B+ 树]]：先答「选型三问」再拍板"
  tldr: 没有谁淘汰谁：写密集、按键点查、成片范围删除选 [[LSM]]；读密集、高频范围扫描、反复原地修改同一批热键或依赖复杂 SQL 事务选 [[B+ 树]]。
  body: |-
    把两套引擎摆上同一张桌面逐项对账：**点查**两边都能胜任，热数据常驻缓存时 [[B+ 树]]路径更短；**范围扫描**是 B+ 树叶子双向链表的主场，[[LSM]] 得跨层做多路归并；**写入吞吐**由全顺序落盘的 LSM 完胜；**尾延迟抖动**两边各有脾气，B+ 树抖在节点分裂与刷脏页，LSM 抖在 [[MemTable]] 切换与 `L0` 写入限速；**磁盘空间**上 B+ 树有页内空隙碎片，LSM 有待合并的旧版本冗余；**复杂查询与多表事务生态**则是深耕多年的 B+ 树关系库更成熟。

    真到线上选型，还有两个极易踩坑的隐藏维度。第一看**更新热点**：如果业务每秒都在反复改写同一小撮热键（比如热门商品库存计数器），B+ 树始终在内存中同一张热页上原地改写，开销恒定；LSM 却每次都往浅层塞一条新版本，旧版本得等合并才消掉，很容易把浅层撑肥。第二看**范围删除与范围读取谁多**：按区间删掉一整段过期键，LSM 只需追加一条范围[[墓碑]]，几乎零成本，B+ 树却要逐页定位逐条删；反过来按区间读一整段键，B+ 树顺序扫链表又反过来完胜。

    此外别忽略运维成本：LSM 暴露的调参面板（合并并发、限速阈值、块缓存、过滤器比特数）远比一棵 B+ 树复杂，团队没有调优精力时未必兑现得出纸面吞吐；不少现代系统干脆混用两者，拿 B+ 树管小而热的元数据、拿 LSM 吞海量主体数据。拍板前不妨先答完**选型三问**：① 业务的真实读写比是多少？② 范围扫描占查询多大比例？③ 单条值有多大、更新是否高度集中在少数热键？
