- id: vs-btree
  title: LSM vs B+ 树：一张选型表
  tldr: 没有胜负，只有负载匹配：把两者的强弱逐项对齐自己的场景。
  body: '点查：两者都可（缓存友好时 B+ 树更直接）；范围扫描：B+ 树叶子链表完胜，LSM 要跨层归并；写入吞吐：LSM 完胜（顺序写）；写延迟稳定性：B+ 树的分裂与刷脏更抖，LSM 的 MemTable 切换也有毛刺；空间：B+ 树有页内碎片，LSM 有未合并的旧版本；事务与复杂查询生态：B+ 树阵营的传统关系库更成熟。

    现实里也有混血：很多系统用 B+ 树存元数据、LSM 存数据本体，或反过来。选型先问三个数：读写比、范围查询占比、单键大小。

    选型再补两个维度。更新热点：如果业务反复改同一小批键，B 加树是在同一页上原地改，成本恒定；LSM 每次改都产生一个新版本躺在浅层，旧版本要等合并才消失，热点更新会把浅层撑得很肥。删除形态：按范围删一段键，LSM 只需写一条范围墓碑，几乎免费，B 加树则要逐页定位逐条删；反过来按范围读一段键，B 加树的链表顺序扫完胜。事务生态之外还有一个现实维度：LSM 系存储的调参面（合并、限速、块缓存、过滤器内存）远大于一棵 B 加树，选了 LSM 就等于签下持续调参的合同，团队没有这个运维投入时，账面上的写吞吐未必兑现得出来。'
