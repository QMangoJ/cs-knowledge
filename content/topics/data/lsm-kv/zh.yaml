- id: levels
  title: 文件分层：L0 与 L1…Ln
  tldr: 新刷出的文件进 L0（可能互相重叠），后台合并（compaction）把它们与下层文件归并成有序、不重叠的层。
  body: 'SSTable 按新鲜程度分层：刚刷出的在 L0，同层文件键范围可以重叠；越往下层数越大、文件越「冷」。后台 compaction 持续把上层文件与下一层重叠文件合并：排序归并、新版本覆盖旧版本、已删除的键真正丢弃（删除在 LSM 里只是写一条墓碑标记，要等合并才消失）。

    合并保证了一个性质：任一键的「最新值」总是出现在更浅的层里，于是读路径有了确定的查找顺序。

    补容量与节奏的账：分层合并的常见设定是每往下一层容量约放大十倍（量级示意，各实现可调），最底层装着绝大部分数据，层数一般五到七层封顶。第零层最特殊：它的文件是内存表整表刷出的，键范围彼此重叠，不像更深层那样互不重叠；第零层文件数有硬阈值，堆高了先触发向第一层的合并，再堆高就会触发写入限速，主动把前台写入压慢来给后台合并让路——线上看到的写入毛刺与短暂停顿，很多来自这里。再有是墓碑的旅程：一条删除墓碑要逐层下沉，直到最底层、且确认它下面再没有更旧版本时，才能连同旧值一起真正丢弃；上层若不断有新文件落下，墓碑下沉被反复推迟，删掉的数据迟迟不释放空间，就是这么来的。'
