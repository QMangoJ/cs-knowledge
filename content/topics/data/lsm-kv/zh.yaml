- id: compaction-trigger
  title: 合并何时触发：两种策略的定量对比
  tldr: 触发信号只有几类；真正要算的是分片与分层各自把写放大推到什么量级、又换回多少读便宜。
  body: '合并不是想合才合，触发信号就四类：第零层文件数达到阈值（常见为个位数到两位数，依实现而定）；某一层总大小超出它的容量预算；单个文件被读时反复未命中攒下的寻求计数超标（经典实现用它惩罚重叠严重的文件）；以及墓碑与过期版本比例过高、空间放大报警。触发之后选哪种策略，才是定量账的主场。设定层间倍率为十、共五层来算：分片策略下，同层先攒齐一批同尺寸文件（约四到十个）再一次性合并下沉，一份数据在每层大约只被重写一次，总写放大量级在个位数倍；分层策略下，上层文件一批批地与下层的大文件做小合并，一份数据在每层大约被重写与倍率同量级的次数，总写放大可达数十倍量级。作为交换，分片的读最坏要逐个查同层的多个文件再乘上层数，读放大明显更高；分层从第一层起每层文件互不重叠，点查每层至多命中一个文件，读放大与空间放大都低。以上数字都是量级示意，真实值随倍率、文件大小与负载浮动，但方向恒定不变：合并越勤快、组织越规整，读越便宜、写越贵。线上调参就是先测出自己的读写比，再决定往光谱的哪一端站。'
  derivation: original
  sources:
  - ref: cmu-15445
    locator: 数据库存储讲义（compaction 触发与策略）
    claim: LSM 合并由层文件数、层大小等信号触发，分片与分层策略的写放大与读放大呈定量级差异
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: 同五层、倍率十：分片写放大个位数倍，分层可达数十倍量级
    rows:
    - label: size-tiered 分片
      cells:
      - v: 写放大 个位数倍
        mark: found
      - v: 读放大 高
        mark: active
    - label: leveled 分层
      cells:
      - v: 写放大 数十倍量级
        mark: active
      - v: 每层至多一文件
        mark: found
  log:
  - mode: 合并
    event: 触发看信号，选策略看读写比，量级先行
- id: crash-recovery
  title: 崩溃恢复走例：日志与内存表谁说了算
  tldr: 断电瞬间内存表蒸发，能不能找回只看日志刷到哪——恢复就是把没刷成文件的尾巴重放一遍。
  body: '按时间线走一遍。第一笔写入把甲键置一：日志记录顺序追加并已同步刷盘，键值同时进内存表，客户端收到成功。第二笔写入把乙键置二：日志记录已追加，但刷盘策略是按窗口批量同步，记录此刻还停在操作系统缓存与内存里，客户端也已收到成功。就在此刻断电。重启后的恢复流程是固定的：已经刷成排序文件的部分直接可用、不需要任何处理；然后重放日志——甲键的记录在盘上完好，重放进一张新的内存表，甲键恢复。第二笔的记录没有真正落盘，重放时根本读不到它，乙键被判定为从未持久化。注意这里没有对错之分，只有一致性之问：若配置承诺的是每写必刷盘，乙键的成功就不该在刷盘前返回；批量同步的配置等于事先声明可以丢最后一个窗口，客户端收到成功与数据可丢并存，是配置者主动签的合同。最后一个细节：日志尾部可能停在半条记录上，重放时靠每条记录自带的校验和识别并丢弃不完整的尾巴，绝不把半条当真。这套纪律与事务一课的预写日志完全同源：日志是唯一真相，内存里的状态永远可以由它重建，所以内存表丢了从来不是事故，日志没刷才是。'
  derivation: original
  sources:
  - ref: cmu-15445
    locator: 数据库存储讲义（WAL 与崩溃恢复）
    claim: LSM 崩溃后重放日志恢复未刷盘部分，已刷成文件的部分直接可用，尾部不完整记录靠校验和丢弃
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: 断电后：刷过盘的甲键活，停在缓存里的乙键按配置丢
    rows:
    - label: 恢复后
      cells:
      - v: 甲键 在（日志已刷盘）
        mark: found
      - v: 乙键 丢（窗口未刷）
        mark: active
    - label: 已刷文件
      cells:
      - v: SSTable 直接可用
        mark: found
      - v: 对应日志可删
  log:
  - mode: 恢复
    event: 日志是唯一真相，内存状态永远可由它重建

- id: ai-link
  title: 与 AI 工程的连接
  tldr: 特征存储、会话状态、向量库的底层，绕不开在 B+ 与 LSM 之间做同样的权衡。
  body: '训练特征的写入是典型写密集：离线批量灌、在线按 key 点查——很多特征存储选 LSM 系（RocksDB 内嵌或分布式 KV）。聊天会话与 Agent 状态也是键值型高频写。向量数据库里，向量索引（图或量化结构）之外，元数据与原始向量常落在 KV/对象存储上，过滤查询则回到 B+ 树/倒排那套。

    更一般地：任何「写先追加日志、读再合并视图」的设计——从 Kafka 到流处理的状态存储——都是 LSM 思想的同构体。

    向量这一侧再补一个同构例子：向量索引的段式组织里，新向量先进入一个个小段、独立建小索引，段攒多了在后台合并成大段并重建索引结构，删除先打标记、合并时才真回收——与排序文件的合并、墓碑的下沉是同一套剧本，只是合并时搬运的对象从键值对换成了向量与图结构。特征存储的在线点查也遵循同样的新鲜度顺序：刚写进去的特征必须立刻可读，所以读路径永远先问内存层与最新段。把这一课的层、合并、墓碑三个概念吃透，再去读任何现代存储系统的文档，基本都是在认亲戚。'
  derivation: original
  sources:
  - ref: cmu-15445
    locator: 数据库存储讲义（log-structured 的应用范围）
    claim: 日志结构化思想广泛应用于现代键值与流式存储系统
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: 同一思想的不同化身
    rows:
    - label: 同构体
      cells:
      - v: RocksDB 特徵/状态
      - v: Kafka 日志段
      - v: 流处理状态存储
  log:
  - mode: 迁移
    event: 先追加、后整理——到处都是这个模式
level: 进阶
minutes: 32
prereq:
- data/transactions
objectives:
- 画出 LSM 的写路径与读路径并指出各自的成本来源
- 解释布隆过滤器为什么没有假阴性
- 用三个放大对比 leveling 与 tiering，并给 B+ 树一个选型结论
aiLink: 特征存储、Agent 会话状态、训练数据管线的落地存储都在做 B+ vs LSM 的选型题；理解三个放大，才能读懂 RocksDB 的参数面板与各家 KV 数据库的 benchmark 争议。
design:
- mechanism: 为什么 LSM 甘愿牺牲读的便宜来换写的便宜——把随机原地更新换成顺序追加加后台合并，是一笔严格按介质价格算的总账
  problem: 根本约束是随机写的价格：写密集负载下 B 加树每次更新都要定位并改写散布在磁盘上的页，机械盘上是毫秒级寻道，固态盘上也要背内部垃圾回收的账，而业务写入的键分布越随机，这笔账付得越频繁，最终 IO 先于 CPU 成为瓶颈
  choice: 做法是写入路径只做两件最便宜的事：顺序追加一条日志保命，把键值放进内存有序表；攒满后整表顺序刷成不可变文件，把维护全局有序这件贵活整体推迟给后台合并慢慢做，前台写延迟里从此不含随机 IO
  tradeoff: 代价全记在读与空间头上：一个键可能躺在内存表与多层文件里，点查要逐层找、范围查要多路归并，这就是读放大；新旧版本与墓碑在合并前一直占着地方，这就是空间放大；后台合并还要持续吃写带宽，合并重写的总量是逻辑写入的数倍到数十倍
  root: 根子在介质的价格差上：顺序写的成本比随机写低一到两个数量级，而合并产生的重写恰好也是大块顺序 IO；LSM 本质上是把前台的随机写按批发价换成后台的顺序写，读多花的那部分靠布隆过滤器与缓存压回去，读写比越偏向写，这笔总账越赚
- mechanism: 为什么每个排序文件都要配一个会撒谎的布隆过滤器——只许它单向地错说可能有，绝不许它说错没有，无假阴性是不可谈判的底线
  problem: 根本约束是读路径的排除成本：点查一个不存在的键时，若老老实实逐层打开文件查索引，等于每次都把读放大付满，而真实负载里大量点查的键根本不存在或只在浅层，钱全花在证明文件里没有这个键上
  choice: 做法是给每个文件配一个位数组，把文件里所有键哈希后置位；查键先过过滤器，任一位为零就断定文件里肯定没有、当场跳过，全为一才打开文件细查，用大约每键十比特的内存把排除成本压到查几个比特
  tradeoff: 代价是它会以百分之一量级的概率说可能有而文件里其实没有（假阳性），白读一次文件索引块，但仅此而已；方向反过来绝不允许：说没有就必须真的没有，这个不对称是它敢用在正确性路径上的前提
  root: 根子在概率工具的不对称价值上：无假阴性来自置位逻辑的单调性——键写进去时它的每一位都被置过一，后来者只要有一位是零，就不可能是被写过的键；用极小内存买一个单向可靠的否定答案，是概率型数据结构在存储引擎里最划算的一次上场
quiz:
- q: LSM 写入快的主要原因是？
  options:
  - 它不用写日志
  - 落盘只有顺序追加（WAL + 整表刷盘），没有随机原地更新
  - 它把数据都放内存
  - 它跳过了持久性
  answer: 1
  explain: 写路径 = WAL 顺序追加 + MemTable 内存插入；整理数据的随机/重写工作被推迟到后台合并。
- q: 布隆过滤器回答「这个文件没有这个键」时，可信度是？
  options:
  - 完全可信：它无假阴性，说没有就一定没有
  - 不可信
  - 五五开
  - 只对数字键可信
  answer: 0
  explain: 任一哈希位为 0 说明键从未被写入，无假阴性；反之全 1 只是可能有，小概率假阳性。
- q: 删除一个键在 LSM 里立刻发生什么？
  options:
  - 找到所有版本并物理删除
  - 写入一条墓碑标记，真正的回收在后续合并时发生
  - 什么都不做
  - 整层重建
  answer: 1
  explain: LSM 不原地修改：删除 = 追加一条更新的墓碑记录，合并归并时新版本压过旧版本、键被真正丢弃。
