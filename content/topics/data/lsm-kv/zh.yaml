steps:
- id: why
  title: 原地更新的问题：写为什么慢
  tldr: B+ 树更新一行要把那一页读进来改再写回——随机 IO；写多时，IO 全花在找页与改页上。
  body: 'B+ 树的叶子页散布在磁盘上。每次更新一个键，都要定位、（可能）换入、修改、写回它所在的页，键的分布越随机，IO 越碎。对读多写少的业务这很划算；但日志、埋点、时序、会话这类写密集负载，每秒几十万次写入，随机写先成为瓶颈。

    LSM 树（Log-Structured Merge Tree）的思路是把问题反过来：落盘只做顺序追加，绝不原地修改；「整理成有序结构」这件苦差事推迟到后台慢慢做。

    把介质账算细：机械盘上一次随机寻道是毫秒量级，顺序读写却能跑满带宽，两者差一到两个数量级；到了固态盘时代，随机写虽然没那么惨，但仍要背设备内部垃圾回收与写放大的账，而且任何介质上顺序追加都能享受预读、批量刷与操作系统页缓存的全部好处。还要澄清一个常见误解：LSM 并不是放弃有序，它只是把维护有序这件苦差事从写入路径上摘下来，推迟到后台合并时再做。读路径为此要付出多层查找的代价，所以这笔交易划不划算，只取决于一个数：你的负载里写占多大比例。'
  derivation: original
