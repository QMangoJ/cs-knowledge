- id: tradeoffs
  title: "[[写放大]]、[[读放大]]与[[空间放大]]：摁下两头，第三头必翘"
  tldr: "[[LSM]] 调优全在三笔可量化的开销间腾挪：分层（leveling）勤合并压低读与空间成本却推高重写倍数，分片（tiering）懒合并省下写带宽却让点查文件数与旧版本冗余双双抬头。"
  body: |-
    懂不懂调 [[LSM]]，就看能不能盯住三本量化账：**[[写放大]]**等于磁盘实际写入字节除以业务逻辑写入字节，同一份数据在跨层合并里被反复搬运，往往放大数倍到数十倍；**[[读放大]]**等于一次查询平均触碰的文件或数据块数；**[[空间放大]]**等于磁盘实际占用字节除以有效存活数据量，多出来的全是被覆盖的旧版本与尚未沉底的[[墓碑]]。

    两种经典合并策略正好站在这条光谱的两端：**分层策略（leveling）** 一旦有数据下沉就与该层重叠文件立即归并，保证同层文件互不重叠，换来极低的读放大与空间放大，代价是写放大居高不下；**分片策略（tiering / size-tiered）** 允许同层先堆满多张待合并文件再一把归并，写放大压得很低，读放大与空间放大却明显上涨。日常调参没有免费午餐：合并调懒了，查询变慢、磁盘发胖；合并调勤了，写放大飙升，后台还会跟前台抢 [[IO]] 带宽。

    单条值的体积也会改写这笔账。当值长达几 KB 甚至上 MB 时，每次合并跟着重写完整大值会把写放大撑爆。为此工程上演化出「键值分离」（如 WiscKey 与 [[RocksDB]] BlobDB）：把大值单独顺序追加进独立的值日志文件，[[SSTable]] 里只存键和短短的值位置指针；后台合并只需搬运轻量指针，写放大应声骤降，交换代价则是点查多跳一次指针、值日志文件也要单独做垃圾回收。
  derivation: original
  sources:
