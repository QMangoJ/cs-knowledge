- id: write-path
  title: 写路径：WAL + MemTable
  tldr: 一次 PUT 做两件事：顺序追加一条 WAL 日志（保命），把键值放进内存的有序表（MemTable）。
  body: '写请求进来先写 WAL（就是事务课的预写日志：顺序落盘，便宜且保证崩溃可恢复），然后把键值对插入 MemTable——内存里一张有序结构（常用跳表）。两步都不碰磁盘上的数据文件，所以写延迟低且稳定。

    MemTable 写满（比如几十 MB 量级，各实现不同）就冻结，换一张新的继续接客；冻结的表由后台线程整表顺序刷盘，成为一个不可变的有序文件（SSTable）。内存表 + WAL 的组合，就是「快」与「不丢」的分工。

    补两个机制细节。其一，内存表为什么常用跳表：它插入时只改局部几个指针，期望对数级查找，还能天然按序遍历——刷盘时要把整表按序输出，跳表从头走一遍就是有序流，红黑树反而要中序遍历且指针更密。其二，日志刷盘策略是个可调旋钮：每写必同步刷盘最安全但延迟最高；按时间窗口批量刷能显著提吞吐，代价是崩溃时可能丢掉最后一个窗口里已应答的写。选哪档本质是持久性承诺的选择，必须与业务对丢数据的容忍度对齐，不能照抄别人的配置。冻结旧表刷盘期间，新表继续接客，读写都不停，这是写入延迟平滑的关键。'
