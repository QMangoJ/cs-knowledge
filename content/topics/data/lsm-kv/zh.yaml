- id: tombstone-read
  title: "[[墓碑]]短路与数据复活：删掉的键为什么绝不能半路扔掉"
  tldr: 点查由浅入深一旦撞见[[墓碑]]便当场返回「不存在」，不再往下翻旧层；墓碑必须一路下沉到确认底下再无旧版本的最深层才能销毁，若半路提前丢弃，深层旧值就会重新冒出来酿成「数据复活」事故。
  body: |-
    顺着 `key = 42`（键四十二）走一条完整时间线：起初写入 `v1`（值一），经几轮合并沉到了 `L1`；随后更新为 `v2`（值二），刷盘后停在 `L0`；最后执行 `DELETE 42`，引擎往 [[MemTable]] 里插入一条最新的[[墓碑]]标记。此时同一个键的三份历史记录，同时安静地躺在内存表、`L0` 和 `L1` 三个地方。

    这时发起 `GET 42`，引擎按从新到旧的铁律先查 MemTable，第一眼撞见的就是墓碑，于是当场返回「键不存在」，底下的 `L0` 和 `L1` 连看都不用看。这就是**读路径短路**：既然浅层版本必定比深层新，最先命中的那条记录——不管是正常值还是墓碑——就注定是最终答案；倘若删完之后又新写了 `v3`，MemTable 里的 `v3` 排在墓碑前头，读取时先命中 `v3` 正常返回，底下的墓碑与旧值留待日后合并相遇时一并勾销。

    这里藏着 [[LSM]] 实现里最凶险的一条红线：**墓碑绝不能在中间层提前丢弃**。它必须一路跟到最底层（或者明确证明更深层绝无该键的键范围），确认底下再没有半条同键旧记录后，才能和旧值同归于尽。要是在 `L0 → L1` 合并前图省事把墓碑提前抹了，压在深层的旧值失去遮挡，下一次 `GET 42` 穿透上层直达底下，就会把早已删掉的数据幽灵般重新读出来——工程上称之为**数据复活（Data Resurrection）**。按区间删数据的范围墓碑，在读取短路与沉底销毁上也严守同一条规矩。
  derivation: original
  sources:
  - ref: cmu-15445
    locator: 数据库存储讲义（LSM 墓碑与读路径）
    claim: LSM 删除以墓碑实现，读按层序命中墓碑即返回不存在，墓碑须下沉至最底层才可丢弃
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: 键四十二的命运：命中墓碑，查找当场终止
    rows:
    - label: 内存表
      cells:
      - v: 墓碑（最新）
        mark: found
      - v: 命中即返回不存在
        mark: found
    - label: 更深层
      cells:
      - v: L0 的值二 不再查
        mark: muted
      - v: L1 的值一 不再查
        mark: muted
  log:
  - mode: 墓碑
    event: 读的短路靠层与层之间的新旧顺序保证，墓碑丢得太早，深层的旧值就会重新被读出来
- id: compaction-trigger
  title: 合并何时拉响警报：分片与分层的[[写放大]]差出一个数量级
  tldr: 后台合并由 L0 文件堆积、层容量超标、单文件空查过多及[[墓碑]]占比过高四类信号触发；同样 5 层、层间倍率 10 的设定下，分片（tiering）写放大仅个位数倍，而分层（leveling）可达数十倍量级。
  body: |-
    后台合并并非盲目空转，拉响开工警报的信号主要有四类：① `L0` 文件数触及上限（常见个位数到十几张文件）；② 某一层的总字节数超出容量预算；③ 单张文件在点查中反复未命中、攒够了无效查找计数（经典实现用它精准消灭键范围重叠严重的文件）；④ 文件内[[墓碑]]与过期版本占比过高，[[空间放大]]越界亟待瘦身。

    警报拉响后按哪种策略合，直接决定了写带宽烧多少。拿「共 5 层、每深一层容量放大 10 倍」的典型账本算一遍：**分片策略（size-tiered）** 让同层先攒够 4 到 10 张尺寸相近的文件再一次性归并下沉，每份数据在每一层大约只被重写 1 次，整库总[[写放大]]稳在个位数倍；**分层策略（leveled）** 则让上层小文件一批批并入下层约 10 倍大的重叠文件里，同一份数据在单层内就可能被陪跑重写接近倍率（约 10 次）的量级，5 层累算下来总写放大动辄冲到数十倍。

    分层多烧掉的十倍写带宽换回了什么？从 `L1` 往下每层内部文件键范围绝不重叠，点查在每一层**至多只需检查 1 张文件**，[[读放大]]与空间冗余都被死死按住；而分片策略同层叠着多张重叠文件，最坏得把每层多张文件乘上层数挨个查一遍。具体倍数虽随倍率、文件尺寸与键分布浮动，但底层铁律不变：越勤快归并、层内越规整，读就越省、写就越贵。
  derivation: original
  sources:
  - ref: cmu-15445
    locator: 数据库存储讲义（compaction 触发与策略）
    claim: "[[LSM]] 合并由层文件数、层大小等信号触发，分片与分层策略的写放大与读放大呈定量级差异"
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: 同五层、倍率十：分片写放大个位数倍，分层可达数十倍量级
    rows:
    - label: size-tiered 分片
      cells:
      - v: 写放大 个位数倍
        mark: found
      - v: 读放大 高
        mark: active
