title: LSM 树与 KV 存储：为写而生的数据结构
summary: "[[LSM]] 树（Log-Structured Merge Tree）放弃了 B+ 树的原地改页，把一切前台写入变成「追加 [[WAL]] 日志 + 插入内存有序表 [[MemTable]]」，攒满后整表顺序刷成不可变的 [[SSTable]] 文件，再由后台合并（[[compaction]]）逐层归并整理。本课顺着键值写入、删除与点查全链路，拆解分层文件、[[布隆过滤器]]、[[墓碑]]短路、三种放大与崩溃恢复，最后给出 LSM 与 B+ 树的工程选型对照。"
premise: 日志采集、行为埋点与在线特征更新这类系统每秒要灌进几十万条乱序键值对——拿 [[B+ 树]]原地改页，磁盘立刻被满屏的随机读写敲垮。[[RocksDB]]、LevelDB 这类 [[KV]] 存储凭什么能把随机写吞吐翻上好几倍，代价里「读要翻好几层、删一条数据反而要新写一条记录」又是怎么兜住不崩盘的？
position: 本课位于数据存储学科第四板块「为写优化的存储」，承接上一课预写日志先顺序落盘的思想再往前推一步：既然顺序日志已经能保住持久性，干脆让全部数据写入都改成顺序追加，整理留给后台合并。学完你能画出从 [[WAL]]、[[MemTable]] 到多层 [[SSTable]] 的读写全貌，并拿[[写放大]]、[[读放大]]、[[空间放大]]算清 leveling 与 tiering 为何无法同时最优。
bridge:
  prev: 上一课里 [[WAL]] 只在改脏数据页之前充当抢先落盘的保命账本；本课干脆扶正这套追加写法，让整座存储引擎彻底按「只追加、后合并」重构数据布局。
  next: 前四课把单个键和单张页的找、写、保命与合并拆到了文件底层；下一课把镜头拉高到整句 SQL——当一次查询要扫几万行还要跨多张表拼接时，优化器凭什么在动手前先算出一条最便宜的执行路线。
overview:
- key: 一句话总结
  value: "[[LSM]] 写路径只干两件快事：顺序追加 [[WAL]] 保命、插入内存有序表 [[MemTable]]；表满整块顺序刷成不可变 [[SSTable]] 文件，后台再逐层合并整理。"
- key: 为什么写得快
  value: 前台落盘只有 WAL 追加与整表顺序刷盘，彻底消灭了 [[B+ 树]]「定位旧页 → 读入改写 → 随机刷回」的磁盘寻道与闪存垃圾回收开销。
- key: 读的代价
  value: 同一个键可能散在内存表与多层文件里，点查得从新往旧逐层翻；每个文件配一个[[布隆过滤器]]（约 10 bit/键），能当场跳过绝大多数肯定不含该键的文件。
- key: 三个放大
  value: 调优全在三本账间腾挪：[[写放大]]是合并反复重写同一份数据，[[读放大]]是一次查找翻多个文件，[[空间放大]]是旧版本与[[墓碑]]尚未回收白占磁盘——压下两头，第三头必涨。
- key: 与 B+ 树的分工
  value: 读密集、范围扫描多、原地更新同一批热键选 B+ 树；写密集、按键点查为主、大批量范围删除选 LSM。
- key: 工程里
  value: 嵌入式库 [[RocksDB]]、LevelDB，分布式库 [[Cassandra]]，乃至在线特征存储与向量数据库段合并，底层跑的全是这套剧本。
