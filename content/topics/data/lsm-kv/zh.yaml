- id: tradeoffs
  title: 三个放大：LSM 调优的全部内容
  tldr: 写放大、读放大、空间放大此消彼长；compaction 策略就是在这三者之间选一个平衡点。
  body: '写放大：一个键的数据在多次合并中被反复重写，实际落盘字节数是逻辑写入的数倍到数十倍（取决于策略与层数）。读放大：一次点查可能翻多层多文件。空间放大：旧版本与墓碑在合并前一直占着空间，磁盘里实际存的比有效数据多。

    两种经典合并策略正好在光谱两端：分层（leveling）让每层内文件不重叠，读放大与空间放大低、写放高；分片（tiering）同层允许多个待合并文件堆积，写放低、读与空间放大高。没有免费午餐，只有场景选型。

    把三个放大变成可监控的数，你才算会调 LSM。写放大等于实际落盘字节除以逻辑写入字节，在线盯合并写出的流量就能算；读放大等于一次点查平均触碰的文件或块数；空间放大等于磁盘实际占用除以有效数据量。调参的日常就是看着这三个数挪动策略：合并太懒，读放大与空间放大涨；合并太勤，写放大涨还会跟前台抢 IO 带宽。值大小也会改写这笔账：值越大，每次合并重写整值的成本越高，所以大值场景有键值分离的做法，把值放进独立的追加日志文件，排序文件里只存键与值的位置指针，合并时只搬小小的指针，写放大立刻降下来，代价是点查多一次跳转、且值文件也要单独做垃圾回收。'
