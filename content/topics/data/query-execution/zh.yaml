    event: 连接顺序之争，争的是每一步要搬运的行数规模
- id: nested-loop
  title: 连接算法一：嵌套循环——逐行去对面点查
  tldr: 外层每出一行，就拿它的键去内层索引里点查一次；内层有索引时，这是最稳的一招。
  body: '三种连接算法里最朴素的一种：嵌套循环（nested loop join）。外层表先出一行，拿这一行的连接键去内层表里找匹配，找到就拼上、吐出，再取外层下一行，周而复始。名字里的循环，就是这两层 for 的形状——写过双重循环的人对它不会陌生。

    它的成败完全押在内层那一跳上：内层连接列上有索引，这一跳就是一次 B+ 树点查，三四页了事，外层十万行就是十万次便宜的点查；内层没索引，这一跳退化成把内层整表扫一遍，十万行乘十万行，当场爆炸。所以嵌套循环是「外层小、内层有索引」时的王道，也是按主键逐行回表这类活的天然形态。

    引擎还给它打了补丁：外层行先攒成一批，内层索引一次查一批（批量键访问），或把外层的一批行装进一块缓冲再整块比对（块嵌套循环），本质都是攒批摊薄每行的固定开销。记住它的性格：单行便宜、全靠索引，规模一大就力不从心——这正是后两种算法要解决的问题。

    也给它算笔总账：外层十万行、内层点查一次穿三四层索引，逻辑上要访问三四十万页次，听着吓人，可这些页绝大多数是索引的上层页与热点数据页，常年躺在缓冲池里，真实读盘远没有账面那么多——这正是它在在线交易场景里经久不衰的原因：小而热的点查，正是缓冲池的主场。反过来，外层换成百万行、内层索引又冷门，账面与实际一起爆炸，谁也救不了。'
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: exec
      id: x
      label: 执行器：外层逐行出键
      highlight: true
    - lane: store
      id: s
      label: 内层索引：一次点查三四页
    messages:
    - id: m1
      from: x
      to: s
      label: 拿键点查，拼上就吐
      active: true
    registers:
    - name: 形状
      value: 两层 for 循环
    - name: 命门
      value: 内层连接列必须有索引
  log:
  - mode: 连接·嵌套循环
    event: 逐行点查：外层多小、内层索引多好，它就多快
- id: hash-join
  title: 连接算法二：哈希连接——把小表装进内存一次配对
  tldr: 小表全量读进内存建成哈希表，大表流过逐行探测；没有索引也能打，但只认等值连接。
  body: '第二种算法换了个思路：既然逐行去对面查太慢，那就把小表一次性请进内存。哈希连接（hash join）分两段：先拿较小的那张表，按连接键算哈希，建成一张内存哈希表；再把大表整表流过，每出一行就在哈希表里探一下，探中就拼上吐出。两张表都只完整读一遍，总开销从乘积塌缩成两表行数之和。

    它的适用面写在脸上：连接条件得是等值（等于号），因为哈希只回答「有没有这个键」，回答不了大于、小于；两表谁都没有可用索引时，它是唯一不爆炸的打法，现代 MySQL 在等值连接又没有合适索引时默认就选它。代价也明摆着：内存要装得下小表的哈希表，装不下就得分批、把溢出的部分落到磁盘文件里分而治之，性能随之打折——内存预算（join_buffer_size 一类参数）就是它头上的天花板。

    把两种算法摆在一起看：嵌套循环是拿索引换次数（每行一跳，但每跳便宜），哈希连接是拿内存换遍数（一遍读完，但要先把小表整个装下）。选哪个，仍然回到成本模型里算页数与行数的那本账。

    建表时为什么挑小的那张？因为哈希表要整张住进内存，挑小的建，内存账最小；探测的一方无论多大都只是流过，不占地方。这个「拿小的建、拿大的探」的分工是哈希连接的第一直觉。还有个前提常被忽略：哈希探测只在连接键完全相等时命中，所以键上有函数加工（比如对字符串做大小写转换）会同时废掉索引与哈希的精确匹配——写连接条件时让键保持原样，是给优化器留路。'
  derivation: original
  sources:
  - ref: mysql-optimizer-docs
    locator: 10.2.1.4 Hash Join Optimization（哈希连接的适用条件与内存限制）
    claim: MySQL 在等值连接且没有可用索引时默认使用哈希连接；哈希连接的内存用量受 join_buffer_size 限制，超限部分会落到磁盘文件处理
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
