- id: index-choice
  title: 选索引的取舍：不是有索引就该走
  tldr: 走索引要付回表的钱；筛剩的行太多时，全表顺序扫反而便宜——选择性决定一切。
  body: '单表这一段，先看最常见的抉择：走索引还是全表扫。直觉总说有索引就该走，账算起来却未必。走索引的流程是先在索引树上找到命中的条目，再拿着主键回数据页把整行取出来（这个动作叫回表）；命中的行越分散，回表要碰的页就越多，每行几乎都要单独读一页。

    所以真正的分水岭是选择性：这一筛能剩下几成行。条件能筛掉 99.9%（一百万行只剩一千行），走索引只需碰一千来页，完胜；条件只能筛掉一半，走索引等于先翻索引、再把半个表的页以随机顺序读一遍，比把全表从头到尾顺序读一遍还贵——顺序读可以预取、可以成批，是磁盘最便宜的读法。这就是为什么给性别这种低基数列建的索引常年被优化器晾在一边：不是索引坏了，是账面上它划不来。

    还有一种两全：要取的列全都在索引里，连回表都省了，这叫覆盖索引，是调优时最值钱的一招。参谋在每个候选索引上把这笔账各算一遍，挑总分最低的；账算错的经典场面，就是它高估了某个条件的选择性，把宝押在回表爆炸的路线上。

    把数字摆出来更直观。还拿百万行订单表算：每页装约八十行，整表约一万两千五百页。若条件筛剩千分之一，一千行散布在约一千页里，走索引回表只需读约一千页，全表扫却要读全部一万两千五百页，索引完胜十倍不止。若条件筛剩一半，五十万行几乎铺满每一页，走索引等于把全部页以随机次序再读一遍，随机读没有预取的便宜、还多一趟索引遍历——同一页数，顺序读的实际耗时明显更低，全表扫反败为胜。分水岭不在某个固定百分比上，而在「命中的行要碰的页数」追上「整表页数」的那一点上。'
  derivation: original
  canvas:
    kind: swimlane
