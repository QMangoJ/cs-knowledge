license: CC-BY-4.0
title: 一次查询的执行之旅：优化器怎样算账选路
summary: "[[SQL]] 只声明想要什么结果，真正决定怎么取数的是数据库进程内部的[[优化器]]：它不真跑查询，而是翻开事先采样好的统计账（行数、[[基数]]、[[直方图]]），用[[成本模型]]把候选路线折算成「预计读多少页、过手多少行」的总分，挑最便宜的一棵计划树交给[[执行器]]按需拉取。全课顺着同一条百万行订单连表查询，从单表走索引还是扫全表的分水岭算起，拆开三种连接算法各自的胜场，再看清统计过期怎样让计划翻车、线上又该按什么顺序救火。"
premise: "你在 [[MySQL]]（[[InnoDB]]）里写下一句后台常客查询：从 100 万行的 orders 表和 10 万行的 users 表里，查出最近一个月下过单的用户姓名与订单金额。[[SQL]] 里只写了想要什么结果，一个字都没提先筛哪张表、走哪个索引、两张表谁先连谁——可同样一句话，选对路只要几毫秒，选错路却能把整张表翻个底朝天直奔超时。数据库到底靠什么在动手前算出最便宜的路？为什么平时飞快的查询，某天一行代码没改却突然卡死？"
position: 本课位于数据存储板块第五段「查询的执行」，排在 LSM 存储之后，把前几课的单点零件组装成完整查询引擎：B+ 树铺好了按页寻路的索引，引擎内幕走通了单行读写，这一课回答面对跨表成批取数的任意 SQL 时引擎怎样先算账后干活，也为下一课并发争抢时的锁范围打好底子。
bridge:
  prev: 上一课看清了 LSM 怎样用多层文件接住海量写入，到此为止我们的视线都停在单个键或单行记录上；可真实业务张口就要筛出十万笔订单再跨表拼出用户名，引擎面对成百上千种取数顺序，得先有一套算账选路的本事。
  next: 这一课算账选路时一直默认场内只有你一个人，没有任何人同时在改数据；下一课把高并发写请求放进来，看看两个事务同时伸手改同一批行时，锁究竟挂在哪儿，又怎么一步步拧成谁也动不了的死锁。
overview:
- key: 一句话总结
  value: "[[SQL]] 只管点菜不管做法；[[优化器]]翻统计账给每条候选路线估出「读页数 + 处理行数」总价，挑最便宜的一棵算子流水线树交给[[执行器]]逐行拉取。"
- key: 优化器的原料
  value: 事先抽样备好的三样统计数据：表大约多少行、索引列有多少个不同值（[[基数]]）、非索引列的取值分布（[[直方图]]）；账只在抽样刷新时更新，过期就会估歪。
- key: 成本的货币
  value: 磁盘取一页比内存算一行慢几个数量级，[[成本模型]]主要按「预计读多少页、过手多少行」计价，纸面推演比总分，不真跑查询。
- key: 三种连接算法
  value: "[[嵌套循环]]靠内层索引逐行点查，赢在「外层小 + 内层有索引」；[[哈希连接]]把小表装进内存建哈希表扫一遍配对，无索引等值连接靠它兜底；[[排序合并]]两边先排好序再拉链对齐扫，适合两张大表且结果刚好要排序。"
- key: 执行计划的形状
  value: 一棵自底向上的[[算子]]流水线树（火山迭代器模型）：上层要一行、下层现取一行，中间结果不堆积；用 [[EXPLAIN]] 看形状，用 EXPLAIN ANALYZE 抓估错的算子。
- key: 计划为什么翻车
  value: 十有八九是数据分布变了而统计账还停在旧时代，或预处理语句拿一套计划硬套冷热悬殊的参数；排障按「刷统计 → 补索引 → 改 SQL → 最后才用 [[hint]] 钉死」走。
