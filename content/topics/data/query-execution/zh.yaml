- id: plan-gone-wrong
  title: 计划翻车学：账错在哪，怎么纠
  tldr: 翻车多半不是优化器笨，是它被过期统计喂了假情报；纠法是先刷新账，再谈改路线。
  body: '收尾看翻车。最经典的剧本：某列的数据分布悄悄变了——比如一个状态列，半年前九成是「已完成」，新业务上线后九成变成「处理中」——统计账还停在半年前。优化器按旧账估算「筛这一列只剩一成行」，放心地选了走索引逐行回表；现实是九成行都命中，它把大半个表的页随机读了一遍，一条查询拖垮全站。

    纠错的顺序也有讲究：先别急着用提示（hint）强按优化器的头，那等于绕过参谋自己指挥，数据再变还得改。正确的第一动作是刷新原料：重新 ANALYZE TABLE 采样统计，很多「莫名其妙的慢」在这一步就消失了。账是新的还选错，才轮到考虑加对索引（让好路线存在）、改写查询（把参谋容易误判的写法拆开），最后才是用提示钉死路线。

    回头把这一课和底层之旅接上：单行之旅里，一次点查的成本是确定的三四页；到了任意查询，成本变成了参谋估出来的数字。数据库把执行的确定性，换成了声明式语言的省心——你只管说要什么，代价是必须有人替你算账，而算账永远可能算错。调优这门手艺，就是和这份不确定性打一辈子交道。

    还有一类翻车与统计无关，藏在「同一句 SQL、不同的参数」里：预处理语句的计划会被缓存复用，可同一条件换个取值，选择性可能天差地别——查状态为「已完成」的行占九成、查「已退款」只占万分之一，共用一份按平均值算的计划，必然有一头吃亏。处理办法从「为每个参数重新算计划」到「给热点取值单独备一份计划」都有，本质仍是那句老话：估算与真实的距离，决定优化的成败。'
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: opt
      id: o
      label: 优化器：被旧账喂了假情报
    - lane: exec
      id: x
      label: 执行器：照错计划跑出大半表随机读
      highlight: true
    - lane: store
      id: s
      label: 存储引擎：无辜，账在参谋手里
    messages:
    - id: m1
      from: o
      to: x
      label: 先刷新统计，再谈改路线
      active: true
    registers:
    - name: 病根
      value: 数据变了，统计没跟上
    - name: 纠错序
      value: 刷新账 → 加索引 → 改写 → 提示钉死
  log:
  - mode: 收尾
    event: 优化是拿估算赌真实，赌输时先查原料再怪参谋
minutes: 30
level: 进阶
prereq:
- data/db-internals
- data/btree-index
objectives:
- 说清优化器与执行器的分工，以及统计信息在其中的作用
- 用成本模型解释一次选索引与连接顺序的取舍
- 区分嵌套循环、哈希、排序合并三种连接算法的适用场面与代价
- 拿到一份 EXPLAIN 输出时，能指出每个算子在流水线里的位置
aiLink: 这套「按成本选路」的思想在 AI 系统里随处可见：RAG 检索要在向量索引与关键词索引之间选路、LLM 网关要在多个模型之间按成本与延迟路由，本质上都是优化器问题——先有统计，再算账，再执行。
design:
- mechanism: 为什么 SQL 只许说要什么，把怎么做整体外包给优化器——因为数据分布只有引擎掌握，计划的好坏又完全由分布决定
  problem: 根本约束是信息差与组合爆炸：一句查询的执行路线可以差出数量级，而路线好坏取决于行数、基数、数据倾斜这些只有引擎才掌握的信息；让人手写计划，等于让最缺信息的一方做最要紧的决定，且数据一变计划就作废
  choice: 做法是把语言声明式化，再配一个基于成本的优化器：引擎持续维护统计信息，对每条查询现场生成候选计划、逐一估价、择优执行；人只负责描述结果，路线随数据变化自动重算
  tradeoff: 代价是确定性被让渡出去：同一句 SQL 换一版数据就可能换一条路线，偶发性的「突然变慢」从此成为常态；优化器是个黑盒，排查要靠 EXPLAIN 这类验账工具，调优因此变成一门长期手艺
  root: 根子仍是那条通用原则：把决策权交给信息最全的一方。优化器之于查询，正如缓冲池之于页——引擎比任何人都懂自己的数据，计划这件事就该它说了算，代价是使用者必须接受「自己说了不算」
- mechanism: 为什么成本模型拿「页」当主要货币，而不是老老实实预测 CPU 时间
  problem: 根本约束是瓶颈资源的悬殊差距：内存里处理一行是纳秒级，从磁盘读一页是微秒到毫秒级，两者差几个数量级；若按总时间建模，CPU 那点开销基本被 IO 淹没，且真实时间还受缓存命中、并发争抢影响，无法在纸面推演里稳定复现
  choice: 做法是只按最贵的资源计价：成本模型以预计读取的页数与处理的行数为主要货币，CPU 开销按固定系数粗略折算进来，让每条候选路线都能在执行之前被估出一个可比的总分
  tradeoff: 代价是模型对 IO 不敏感型查询会系统性估偏：大量字符串运算、复杂表达式过滤、内存里的排序，页数不多但 CPU 很贵，这类计划的估价容易过于乐观，优化器偶尔会放走真正的瓶颈
  root: 根子在定价原则上：任何估算系统都只能精确度量一两种主导资源，选谁当货币，取决于谁决定生死。对以取页为生的数据库，页就是那个主导资源——这和工程里用瓶颈工序的节拍给整条产线定价是同一个道理
- mechanism: 为什么 MySQL 敢在工具箱里缺了排序合并连接，只保留嵌套循环与哈希两种
  problem: 根本约束是工程资源的有限性：每多一种连接算法，优化器就要多一套成本公式与边界处理，执行器要多一条久经考验的代码路径，测试矩阵随之膨胀；而排序合并的独占胜场（两边都大且要排序输出）出现的频率，远低于前两种的覆盖面
  choice: 做法是做减法：嵌套循环守住「外层小、内层有索引」的点查型场景，哈希连接守住「无索引、等值连接」的大场面，需要有序结果时靠 B+ 树索引天然有序直接产出，或在计划里单加一个排序算子兜底
  tradeoff: 代价是某些场景确实不如有排序合并的同行：两张大表按非索引键连接且结果要排序时，MySQL 只能先哈希再单独排序，多付一遍工；这类查询占比再高一点，这笔取舍就要重新算
  root: 根子在边际收益：系统设计不是把每种武器都配齐，而是让高频场景各有一件称手兵器，再拿通用机制兜住长尾。第三种算法的边际收益小于它的终身维护成本时，缺席本身就是正确的设计
terminal:
- cmd: EXPLAIN SELECT * FROM orders WHERE user_id = 42;
  note: 看这条查询选了哪个索引、预估要扫多少行
- cmd: EXPLAIN ANALYZE SELECT ...;
  note: 真跑一遍：对比每个算子的预估行数与真实行数，差最大的就是病灶
- cmd: ANALYZE TABLE orders;
  note: 刷新统计账（重采样行数与直方图），计划翻车时先做这一步
- cmd: SHOW INDEX FROM orders;
  note: 看 Cardinality 列：每个索引的值有多分散，优化器据此估选择性
