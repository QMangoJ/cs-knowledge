steps:
- id: beyond-one-row
  title: 先把镜头拉远：从一行到任意查询
  tldr: 底层之旅走的是一行；真实查询要的是成批的行、还要跨表拼接，做不做得对先看路线怎么选。
  body: '前几课的旅程都很克制：按 id 找一行、给一行扣款。可真实世界里的查询长这样：查出最近一个月下过单的用户名和订单金额——要先在百万行订单里筛掉九成，再把剩下的十万行逐一对到用户表里拼上姓名。同样一句话，路线选得好，几页数据就办完；路线选得差，先扫一遍全表再逐行回表，能慢出成百上千倍。

    麻烦在于，SQL 这门语言只负责说要什么，从不说怎么做：先筛订单还是先连用户、走哪个索引、两表谁先谁后，全是空白。这片空白就是本课的主角要填的东西。把单行读写比作在城里找一户人家，本课讲的则是整支车队的调度：先走哪条路、哪辆车打头、哪里换乘。

    先立住一个分工：算路线的是优化器（optimizer，可以理解成出主意的参谋），照路线干活的是执行器（executor，真正下场取页的伙计）。后面的旅程分两段：先看参谋怎样算账选路，再看伙计怎样照着计划把活干完。

    先感受一下路线之差能有多大。同一句查询，走对了路：按时间索引筛出十万行、每行再点查一次用户表，满打满算碰几十万页次但大半命中内存；走错了路：百万行订单先全表扫出来、再逐行回表拼接，光是把订单表整个读一遍就先欠下上万页的磁盘账，还没开始连接。两条路线之间隔着的，往往就是线上系统里「毫秒」与「超时」的区别——而选路的权力，完全握在参谋手里。'
