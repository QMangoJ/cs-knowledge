- id: join-order
  title: 连接顺序：让中间结果先瘦下来
  tldr: 连接的每一步都在决定下一批行有多少；先处理能把行数压小的连接，总账最省。
  body: '轮到两表相连。连接顺序这道题，核心只有一句话：让中间结果尽早瘦下来。假设订单先按时间筛过、剩十万行，再去连用户表，连接要处理的是十万行这个量级；要是不过滤先连接，百万订单先和用户表全量拼一遍，中间结果膨胀到百万级，后面每一步都在大水里捞针。总工作量差的不是常数，是数量级。

    表再多一张，排法就组合爆炸：三张表有六种顺序、四张表二十四种，每种还要再挑连接算法与索引。优化器不可能把每种都精算一遍，它按成本模型剪枝：只保留有希望的排法逐级比较，长得离谱的中间结果提前淘汰。这也是为什么它偶尔会在多表连接上栽跟头——剪枝剪掉的，可能正是最优解。

    执行器这一侧能做的配合，是把每一步的产物控制住：一个算子吐出的行立刻喂给下一个算子，不落地、不堆积。整份计划因此长成一棵流水线树，这棵树的形状就是下一段的主角。

    这里还藏着一个反直觉点：连接顺序与你在 SQL 里写表的顺序基本无关。你写 FROM users JOIN orders 还是 FROM orders JOIN users，优化器都会把所有排法重新算一遍，按自己的账决定谁当外层。它有这个权力，正因为连接在数学上满足交换律——先连谁结果都一样，不一样的是成本。写 SQL 的人因此省了心，也因此失了控：你以为自己排好了顺序，其实你只递交了一份无序的名单。'
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: opt
      id: o
      label: 优化器：排连接顺序，剪掉膨胀的排法
      highlight: true
    - lane: exec
      id: x
      label: 执行器：中间结果逐级传递
    messages:
