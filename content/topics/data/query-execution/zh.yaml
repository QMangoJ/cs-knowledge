    - name: 天花板
      value: 内存装不下就溢出落盘
  log:
  - mode: 连接·哈希
    event: 拿内存换遍数：没有索引可走时，这是唯一不爆炸的路
- id: sort-merge
  title: 连接算法三：排序合并——两边先排队再对齐
  tldr: 两边按连接键排好序，像拉链一样并行扫一遍配对；适合两边都大、结果又正好要排序的场面。
  body: '第三种算法最讲秩序：排序合并（sort-merge join）。先把两张表各自按连接键排好序，然后两个指针像拉链的两头一样并行向前走：键相等就配对成串吐出，小的一边先推进。排序各花一份钱，合并只是一遍线性扫描，账面总开销是「两遍排序 + 一遍合并」。

    它胜出的场面很具体：两张表都很大、谁也装不进内存做哈希；或者查询最后本来就要按连接键排序输出（比如还要 ORDER BY 同一个键），排序的钱反正要花，顺手把连接做了。范围连接（大于、小于）它也接得住，这是哈希连接做不到的。

    但要对你诚实：MySQL 本身没有实现排序合并连接，它的工具箱里只有嵌套循环与哈希两种；排序合并是 PostgreSQL、Oracle 等同行在用的打法，这里讲它是为了把三种经典算法摆齐。MySQL 敢缺这一件，算盘在后面的设计区块里细说——先记住结论：缺了它，绝大多数场景靠索引的有序与哈希的兜底仍然够用。

    排序这一步本身也有讲究：数据量装得进内存，就在内存里排；装不下，要把排好的一段段先写到磁盘临时文件、再归并起来，叫外部排序，等于把归并排序搬到了磁盘上（数据结构课里的老朋友）。另外别忘了 B+ 树叶子层本来就是按顺序排好的：连接键正好是索引键时，两边的数据顺着索引读出来天然有序，排序这笔钱可以直接免掉——排序合并与索引，是天生的搭档。'
  derivation: original
  canvas:
    kind: swimlane
    actors:
