- id: stats
  title: 参谋的原料：统计信息这本账
  tldr: 优化器没见过你的数据，它只有一本统计账：多少行、值多分散、取值长什么分布。
  body: '优化器做决定时，并不真的去数数据——真数一遍，查询还没开始就先慢死了。它靠的是一本事先备好的统计账：每张表大约多少行；每个索引里不同的值有多少个（这个数叫基数，cardinality，可以理解成「值有多分散」：一百万行里有一百万个不同 id，基数就高；只有男女两值的性别列，基数就是 2）；对没有索引的列，还可以采样画一张直方图，记下取值的大致分布。

    这本账是估算的唯一原料。举例：过滤条件 created_at 在最近一个月，优化器要估这一筛能剩下几成行——它拿不出真数，只能按直方图与基数推算：这一列取值均匀铺在过去三年里，那最近一个月约占三十六分之一。估得准不准，直接决定后面路线的贵贱判断。

    账还有个要命的属性：会过期。表里天天在增删改，统计却只在被抽样更新时才刷新（比如执行 ANALYZE TABLE，或后台按变化量自动触发）。数据已经翻天覆地、账还停在上个月，参谋照着旧地图指挥新战斗——本课最后讲的计划翻车，十有八九翻在这里。

    账的数据从哪来也值得知道：行数来自存储引擎的粗略计数，索引的基数靠随机抽样若干页估出来，直方图则是对某一列采样后按取值分布切成的桶。三者都是抽样估算而非精确清点——统计这门手艺从原料开始就带着误差，优化器后面所有的精算，都是建在这层沙子上的。这不是偷工减料：精确清点的代价等于把每条查询先全表扫一遍，谁也付不起。'
  derivation: original
  sources:
  - ref: mysql-optimizer-docs
    locator: 10.9.6 Optimizer Statistics（列直方图与行数估算）
    claim: 优化器用列直方图统计估算谓词的选择率（能筛掉几成行），直方图由 ANALYZE TABLE 按需生成、不会随数据修改自动更新
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
