title: 一次查询的执行之旅：优化器怎样算账选路
summary: 前几课走的都是单行读写；这一课把镜头拉远，看任意一条 SQL 怎样被优化器算账、选路，最后变成一棵一步步取页的流水线。
premise: 以 MySQL（InnoDB）为主要样本：一条带过滤与两表连接的查询——查最近一个月下过单的用户姓名与订单金额，orders 表百万行量级、users 表十万行量级。
position: >-
  本课位于数据存储板块的新一段「查询的执行」，排在 LSM 之后，是把前面几课的零件组装成整机的一站：B+ 树给了按页找路的地图，底层之旅走通了单行的读与写，本课则回答当查询要的是成千上万行、还要跨表拼接时，引擎怎样先算账再动手。学完你能看懂一份执行计划的形状，能说清优化器为什么有时选错索引，也能解释三种连接算法各自在什么场面胜出。
bridge:
  prev: >-
    上一课 LSM 把读路径拆到要逐层翻找多个文件，本课换个方向拉远镜头：不再盯着一个键或一行，而是看引擎面对任意查询时，怎样决定按什么顺序、走哪条路把成千上万行取齐。
  next: >-
    本课里所有查询都假设世界是安静的，没人同时改数据；下一课就把并发请进来：当两个事务同时要改同一批行时，锁到底锁住了什么，又为什么会锁成一个谁也动不了的死结。
overview:
- key: 一句话总结
  value: SQL 只说要什么；优化器先用统计信息给候选路线逐一估价，选最便宜的一条，执行器再照着计划一步步取页
- key: 优化器的原料
  value: 统计信息——每张表多少行、每个索引里值有多分散、列的取值直方图
- key: 成本的货币
  value: 以要读的页数与要处理的行为主要计价单位，把不同路线折算成可比较的数字
- key: 三种连接算法
  value: 嵌套循环靠索引逐行点查，哈希连接把小表装进内存一次配对，排序合并让两边先排队再并行对齐
- key: 执行计划的形状
  value: 一棵算子流水线树：叶子取数，中间连接与过滤，行像传送带上的零件逐级向上流
- key: 计划为什么翻车
  value: 账算错多半是原料过期：统计信息没跟上数据变化，估算与现实脱节
