- id: plan-tree
  title: 计划的真身：一棵往上冒行的流水线树
  tldr: EXPLAIN 看到的不是步骤清单，而是一棵算子树：叶子取数、内部连接过滤，行逐级向上流动。
  body: '路选定了、算法挑好了，整份计划的真身是一棵树。用 EXPLAIN FORMAT=TREE 把它打印出来，形状大致是：最底下是叶子算子，各自负责从一张表里取数（全表扫、索引扫、点查）；往上是连接算子，把两路行拼到一起；再往上是过滤、排序、聚合；树根吐出的，就是最终结果。可以把它想成一条传送带流水线：零件从叶子进入，逐级加工，成品从树根出来。

    执行的方式有个小讲究：算子之间不是「下层把全部结果攒齐再交给上层」，而是上层要一行、下层就现做一行，像水龙头一样按需拉取（这种执行模型常被称作火山模型或迭代器模型）。好处是内存里永远只留手头这几行，先筛的过滤能立刻砍掉后面的工作量；LIMIT 只要前十行时，整棵树做够十行就停。

    想验证参谋的账靠不靠谱，还有 EXPLAIN ANALYZE：它把计划真跑一遍，在每个算子上标出真实吐出的行数与真实耗时。估算行数与真实行数差出几倍的地方，就是这份计划的病灶——调优这门手艺，很大一半就是对着这棵树找出差最大的那个算子。

    拿本课的查询把这棵树具体化：底层左路是 orders 表按时间索引的范围扫描，先把近一月的订单筛出来；右路是 users 表的全表扫描；中间一个哈希连接按 user_id 把两路拼起来；树根再挂一个简单的投影，只留下姓名与金额两列。你在 EXPLAIN 里看到的缩进层级，就是这棵树的枝干——自下而上读它，等于把执行器要走的路提前走了一遍。'
  derivation: original
  canvas:
