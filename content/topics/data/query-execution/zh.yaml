steps:
- id: beyond-one-row
  title: SQL 只管点菜：好路线与烂路线能差出上千倍
  tldr: "[[SQL]] 只声明想要什么结果，不指定怎么取数；同一句百万行连表查询由[[优化器]]算账选路、[[执行器]]取页拼行，选对路与选错路能差出「几毫秒」与「直接超时」。"
  body: |-
    当应用发来一句「查最近一个月下过单的用户姓名与订单金额」（`orders` 表 100 万行、`users` 表 10 万行），[[SQL]] 里只写了想要什么列、满足什么条件，至于先筛订单还是先连用户、走哪个索引、两表谁当外层，全是一片空白。接管这片空白的是数据库服务进程（如 `mysqld`）内部的两个核心模块：[[优化器]]（基于成本选路这一脉源自 1979 年 IBM 的 System R）负责在动手前算出最便宜的执行路线，[[执行器]]负责照着计划去缓冲池和磁盘取页、拼行。

    别小看选路这一步，同一句查询走不同路线能差出成百上千倍耗时。走对了路：先顺着时间索引筛出近一月的 10 万笔订单，每笔再去用户表主键上点查姓名，热页大半躺在内存里，眨眼就回包；走错了路：先把 100 万行订单全表扫出来再逐行[[回表]]拼接，光把订单表从头读一遍就先欠下上万页的磁盘账。线上「几毫秒返回」和「接口直接超时」之间，隔着的往往就是优化器那一次拍板。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: a
      label: 应用：查近一月下单用户的姓名与金额
    - lane: opt
      id: o
      label: 优化器：这句话要怎么办？
      highlight: true
    - lane: exec
      id: x
      label: 执行器：等计划下达
    - lane: store
      id: s
      label: 存储引擎：orders 百万行 / users 十万行
    messages:
    - id: m1
      from: a
      to: o
      label: SQL 只说了要什么
      active: true
    registers:
    - name: 本课的问题
      value: 先筛还是先连、走哪个索引、谁先谁后
    - name: 分工
      value: 优化器算账，执行器干活
  log:
  - mode: 拉远镜头
    event: 从一行走到任意查询，多出来的全部工作就是先把执行路线算对，路线错了后面全是白干
- id: stats
  title: 算账不靠现场清点：全凭抽样攒下的统计账
  tldr: 现场去数一遍表比跑查询本身还慢，[[优化器]]只能靠平时随机抽样记下的表行数、索引[[基数]]和列[[直方图]]估算筛选比例；这本账不会随每次写入实时更新，一旦过期就会估歪。
  body: |-
    优化器拍板前绝不会真去表里数一遍有多少行满足条件——真数一遍等于先把全表扫完，查询还没开跑就先慢死了。它手头唯一的凭据是一本平时抽样备好的统计账，记着三样家底：每张表大约多少行；每个索引上有多少个不同的值（叫[[基数]]，cardinality，衡量值有多分散：100 万行主键基数接近 100 万，只有男女两值的列基数就是 2）；对没有索引的列，还能采样切桶画一张[[直方图]]记下取值分布。

    拿我们的过滤条件 `created_at >= 近一月` 走一遍：优化器翻开直方图一看，订单时间大体均匀铺在过去三年（36 个月）里，立刻推算出最近一个月约占 1/36，也就是几万行量级。注意行数、基数、直方图全靠存储引擎随机抽样若干数据页估出来，从根子上就带着合理误差——用一点抽样偏差，换掉每条查询前全表清点的天价成本。

    这本账最要命的脾气是**会过期**。业务表每秒都在增删改，统计信息却只在后台攒够一定修改量或手动跑 `ANALYZE TABLE` 时才重采样（直方图更是按需生成、不会自动跟着改）。一旦表里数据早已翻天覆地而账本还停在上个月，优化器后面算得再精，也是在流沙上盖楼。
  derivation: original
  sources:
  - ref: mysql-optimizer-docs
    locator: 10.9.6 Optimizer Statistics（列直方图与行数估算）
    claim: 优化器用列直方图统计估算谓词的选择率（能筛掉几成行），直方图由 ANALYZE TABLE 按需生成、不会随数据修改自动更新
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: opt
      id: o
      label: 优化器：翻统计账估行数
      highlight: true
    - lane: store
      id: s
      label: 统计账：行数 / 基数 / 直方图
    messages:
    - id: m1
      from: o
      to: s
      label: 不真数，只查账
      active: true
    registers:
    - name: 基数
      value: 一列里不同值的个数（值有多分散）
    - name: 账的弱点
      value: 只在抽样时更新，会过期
  log:
  - mode: 备料
    event: 优化器的一切判断都建立在这本统计账上，而这本账只在采样时更新、会过期
- id: cost-model
  title: "[[成本模型]]怎么比贵贱：按读页数和过手行数统一打分"
  tldr: 先筛后连、先连后筛、走索引还是扫全表没法直接比长短，[[成本模型]]抓住最贵的磁盘读页与行处理开销，把每条候选路线折算成纸面总分，挑最低分出战。
  body: |-
    面对先筛后连、先连后筛、走甲索引还是全表扫这一堆候选排法，优化器靠[[成本模型]]（cost model）给它们发同一种计价货币：把每条路线预计要读多少个数据页、[[CPU]] 要过手多少行记录，按固定单价折算成一个总分，谁分低选谁。之所以拿「页」当大头货币，是因为内存里算一行只要纳秒级，从磁盘取一页却是微秒到毫秒级——掐住取页数量，排序就八九不离十。

    放到订单连表场景里做一次纸面推演：路线甲先走时间索引筛近一月订单再[[回表]]，估读索引与数据页约 10000 页，随后按主键点查用户表；路线乙先把两张表全量连起来再过滤时间，光两表全扫就要 13000 多页，还得把 100 万行中间结果逐行过手比对。账面总分差出一大截，优化器毫不犹豫选甲。

    注意这笔账纯属动手前的纸面推演，优化器绝不会把每条路线真跑一遍再挑。成本模型只负责把「统计账上的数字」翻译成可比的价格——只要统计账准，它就选得准；一旦两条路线分数咬得很紧而统计账恰好偏了，纸面上的险胜落到真实磁盘上就会变成惨败。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: opt
      id: o
      label: 优化器：给每条路线打分
      highlight: true
    - lane: store
      id: s
      label: 候选路线：先筛后连 / 先连后筛 / 全表扫
    messages:
    - id: m1
      from: o
      to: s
      label: 按页数与行数折算总分
      active: true
    registers:
    - name: 计价货币
      value: 要读的页 + 要处理的行
    - name: 估价方式
      value: 纸面推演，不真跑
  log:
  - mode: 估价
    event: 成本模型把路线之争变成了数字之争，而这些数字全部来自统计账上的估算
- id: index-choice
  title: 有索引也未必走：回表随机读追上全表页数就反亏
  tldr: 二级索引命中后还要按主键逐行[[回表]]随机读数据页；筛剩极少数行时走索引完胜，筛剩大半张表时全表顺序扫反而更便宜，[[覆盖索引]]则连回表也一并省掉。
  body: |-
    很多人看到查询没走刚建好的二级索引，第一反应是数据库抽风了，其实多半是账没算过全表扫描。二级索引的叶子只存了索引列和主键值，找到匹配条目后，还得拿着主键回聚簇索引把整行捞出来（即[[回表]]）；命中的行越分散，回表就越像满磁盘乱跳的随机读。

    拿 100 万行的 `orders` 表算一笔硬账：每页装约 80 行，整张表一共约 12500 页。如果条件筛掉 99.9%、只剩 1000 行，哪怕每行各占一页，走索引加回表也就读 1000 来页，比全表扫 12500 页快十倍不止；可如果条件只筛掉一半、还剩 50 万行，这 50 万行几乎把 12500 个数据页铺满了——走索引等于先翻一趟索引树，再按随机次序把全表数据页挨个读一遍，既丢了磁盘顺序预读的便宜，又多跑一趟索引，总耗时远不如从头顺序扫一遍全表。给性别这类低[[基数]]列建单列索引常年被[[优化器]]无视，根子就在这笔账。

    想既走索引又彻底甩掉回表包袱，最值钱的一招叫[[覆盖索引]]：把查询要取的列一并放进联合索引里，叶子页上货就齐了，连聚簇索引的大门都不用进。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: opt
      id: o
      label: 优化器：比较走索引与全表扫的总分
      highlight: true
    - lane: store
      id: s
      label: 索引：命中后还要回表取整行
    messages:
    - id: m1
      from: o
      to: s
      label: 选择性高才走索引
      active: true
    registers:
    - name: 分水岭
      value: 这一筛剩下几成行
    - name: 最优解
      value: 覆盖索引：连回表都省了
  log:
  - mode: 选路·单表
    event: 索引不是免费通道，走索引的回表成本要和全表顺序扫正面比过，才知道哪条路更便宜
- id: join-order
  title: 多表连接怎么排先后：谁能先让中间结果瘦身谁打头
  tldr: 连接顺序与 [[SQL]] 里写表的先后无关，[[优化器]]会利用连接交换律重排候选顺序并剪掉膨胀分支，优先跑能把中间行数压到最小的那一步。
  body: |-
    两表以至多表相连，排先后只有一条铁律：**让中间结果尽早瘦下来**。在我们的查询里，先把 100 万行 `orders` 按近一月条件筛成 10 万行，再拿去连 `users`，连接环节只需过手 10 万行；要是反过来先不加过滤把两表全量连起来，中间结果瞬间膨胀到 100 万行，后面每一步都在大水漫灌里捞针，总工作量差出一个数量级。

    这里藏着一个常被误传的迷信：不少人以为把小表写在 `FROM` 前面就能指挥数据库先读小表。其实无论你写 `FROM users JOIN orders` 还是 `FROM orders JOIN users`，内连接在数学上满足交换律与结合律，[[优化器]]都会无视字面顺序，自己重排所有候选方案算总分。

    一旦连的表多起来，候选顺序就会阶乘级爆炸：3 张表 6 种、4 张表 24 种，再乘上每一步可选的索引和连接算法根本算不完。优化器只能边算边按[[成本模型]]剪枝，把中间结果看着离谱的排法提前淘汰——当一条 SQL 硬连了七八张大表而选出昏招时，往往就是剪枝不小心把真正的最优解一块儿剪掉了。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: opt
      id: o
      label: 优化器：排连接顺序，剪掉膨胀的排法
      highlight: true
    - lane: exec
      id: x
      label: 执行器：中间结果逐级传递
    messages:
    - id: m1
      from: o
      to: x
      label: 先筛后连，中间结果先瘦
      active: true
    registers:
    - name: 原则
      value: 让中间结果尽早变小
    - name: 难点
      value: 排法组合爆炸，只能剪枝估算
  log:
  - mode: 选路·连接
    event: 连接顺序之争，争的不是先后好看，而是每一步要搬运的行数规模
- id: nested-loop
  title: "[[嵌套循环]]连接：外层表要小，内层连接列必须有索引"
  tldr: "[[嵌套循环]]就像两层 for 循环，外层每出一行就拿连接键去内层做一次索引点查；外层行数少且内层有索引时极快，内层一旦没索引就会退化成行数相乘的灾难。"
  body: |-
    连接顺序敲定后，最朴素的第一种配对手艺叫[[嵌套循环]]（nested loop join），长得跟代码里的双重 `for` 循环一模一样：外层驱动表先吐出一笔订单，拿着里面的 `user_id` 去内层 `users` 表找对应的用户名，拼好往上交，接着取下一笔订单。

    它的生死全系在「内层那一跳」有没有索引。我们筛剩 10 万笔订单当外层，内层 `users.id` 是高 3 到 4 层的 [[B+ 树]]主键：每笔订单去对面点查只需翻 3 到 4 页。账面上虽然要碰三四十万页次，但索引上层节点和活跃用户页常年泡在[[缓冲池]]内存里，真实落盘少之又少，所以在线交易的短平快查询几乎全是它的主场。反过来，要是内层连接列忘了建索引，外层每出一行都得把 10 万行 `users` 全表硬扫一遍，10 万 × 10 万 = 100 亿次比对，数据库当场卡死。

    为了把单趟开销再往下压，引擎还给它打过攒批补丁：比如把外层一批行先攒进内存缓冲块再整批比对（块嵌套循环），或是攒一批键再去内层索引成批捞回（批量键访问）。但无论怎么凑批，一旦外层胀到百万行、内层页面又冷，逐行点查就力不从心了。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: exec
      id: x
      label: 执行器：外层逐行出键
      highlight: true
    - lane: store
      id: s
      label: 内层索引：一次点查三四页
    messages:
    - id: m1
      from: x
      to: s
      label: 拿键点查，拼上就吐
      active: true
    registers:
    - name: 形状
      value: 两层 for 循环
    - name: 命门
      value: 内层连接列必须有索引
  log:
  - mode: 连接·嵌套循环
    event: 嵌套循环的速度由两件事决定：外层有多少行、内层索引的点查有多便宜
- id: hash-join
  title: "[[哈希连接]]：连接列没索引时，把小表装进内存扫一遍配齐"
  tldr: "[[哈希连接]]先把小表读进内存按连接键建好哈希表，再让大表流过逐行探测，两张表各读一遍就能配完；只认等值连接，且受 join_buffer_size 内存上限约束。"
  body: |-
    要是两张表的连接列上恰好都没建索引，逐行点查的路就断了，这时轮到[[哈希连接]]（hash join）上场。它分「建表」与「探测」两段：先把体型较小的 10 万行 `users` 读出来，按连接键算哈希在内存里搭一张哈希表；再让 `orders` 表从头到尾流式扫过，每出一行就算一次 `user_id` 的哈希去内存表里撞一下，撞中就拼成结果往上吐。两张表都只完整读一遍，总工作量从两表行数相乘一下子压成了相加。

    建哈希表为什么专挑小的那张？因为整张哈希表得常驻内存，拿 10 万行 `users` 建表比拿 100 万行 `orders` 省十倍地方；探测的那张表哪怕有上亿行，也只是逐行流过不占坑。现代 [[MySQL]] 遇到等值连接又无合适索引可用时，默认选的就是它。

    用它得记住两条硬边界：第一，哈希只答得出「相等不相等」，所以它只接 `=` 等值连接，碰上大于、小于的范围连接直接没辙；第二，内存受 `join_buffer_size` 这类预算封顶，小表一旦胖到内存塞不下，引擎就得按哈希分桶把溢出块写进磁盘临时文件分批配对，速度随之打折。另外连接键上千万别套函数（比如大小写转换），那会把索引和原键匹配的路一块儿堵死。
  derivation: original
  sources:
  - ref: mysql-optimizer-docs
    locator: 10.2.1.4 Hash Join Optimization（哈希连接的适用条件与内存限制）
    claim: MySQL 在等值连接且没有可用索引时默认使用哈希连接；哈希连接的内存用量受 join_buffer_size 限制，超限部分会落到磁盘文件处理
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: exec
      id: x
      label: 执行器：小表建哈希，大表流式探测
      highlight: true
    - lane: store
      id: s
      label: 两表各完整读一遍
    messages:
    - id: m1
      from: x
      to: s
      label: 总开销 ≈ 两表行数之和
      active: true
    registers:
    - name: 限定
      value: 只认等值连接
    - name: 天花板
      value: 内存装不下就溢出落盘
  log:
  - mode: 连接·哈希
    event: 哈希连接是拿内存换遍数，两张表各读一遍就配对完，没有索引可走时它是唯一不爆炸的路
- id: sort-merge
  title: "[[排序合并]]连接：两边先排好序，再像拉链一样一遍扫完"
  tldr: "[[排序合并]]先把两张表按连接键排好序，再用双指针同步推进线性合并；适合两张大表都塞不进内存或结果恰好要按同键排序的场面，[[PostgreSQL]] 等同行常用而 [[MySQL]] 主动未实现。"
  body: |-
    第三种经典连接手艺叫[[排序合并]]（sort-merge join）。做法跟归并排序的合并阶段一模一样：先把两张表各自按连接键从小到大排好序，再在两头各放一个指针像拉拉链一样同步往前推——连接键相等就配成一对吐出，哪边数字小就先把哪边指针挪一格。账面总开销是「两遍排序 + 一遍线性扫描」。

    它在三个场面里最能打：一是两张表都是几千万行的大块头，谁也装不进内存做哈希，排序可以借[[外部排序]]先分块排成磁盘顺串再多路归并，全程都是磁盘最擅长的顺序读写；二是查询末尾本来就写了 `ORDER BY` 同一个连接键，排序的钱横竖要花，顺手就把连接办了；三是连接条件带了大于、小于这类范围比较，[[哈希连接]]接不住而它能接。要是两边连接键上本来就有 [[B+ 树]]索引，顺着叶子链表读出来天然有序，连两遍排序的钱都能当场免掉。

    不过要如实交代一句：[[MySQL]] 压根没有实现排序合并连接，它的工具箱里只有[[嵌套循环]]与哈希两样；排序合并是 [[PostgreSQL]]、Oracle 等同行里的常备武器。MySQL 敢省掉这一件，是因为靠「B+ 树有序 + 嵌套循环」和「哈希兜底」已经能应付绝大多数在线查询。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: exec
      id: x
      label: 执行器：两边排序后像拉链对齐
      highlight: true
    - lane: store
      id: s
      label: 两张大表：各排一次序
    messages:
    - id: m1
      from: x
      to: s
      label: 合并阶段只扫一遍
      active: true
    registers:
    - name: 胜场
      value: 两边都大 / 结果正好要排序
    - name: 诚实标注
      value: MySQL 未实现，同行在用
  log:
  - mode: 连接·排序合并
    event: 排序合并是先付两遍排序的钱、再换一遍线性合并，三种经典连接算法到此摆齐
- id: plan-tree
  title: 执行计划长什么样：按需拉取的火山流水线树
  tldr: 执行计划是一棵自底向上的[[算子]]树，上层每调一次 Next 下层才现产一行；用 [[EXPLAIN]] 看选定的路线，用 EXPLAIN ANALYZE 对比预估行数与真实行数来抓病灶。
  body: |-
    路线和连接算法敲定后，优化器交到[[执行器]]手里的是一棵内存里的[[算子]]流水线树。敲一句 `[[EXPLAIN]] FORMAT=TREE` 把我们的订单查询打印出来，自底向上一清二楚：底下左叶子是 `orders` 表走时间索引做范围扫描，右叶子是 `users` 表全表扫描；往上一层是个[[哈希连接]]算子按 `user_id` 把两路拼拢；最顶上的树根做列投影，只留姓名和金额吐给客户端。

    这棵树跑起来用的是经典的「火山模型」（Volcano 迭代器模型）：不是底层先把 10 万行全算完堆在内存里再端给上层，而是树根对下层喊一声「给我下一行」，连接算子再去催叶子现取一行——跟前端 [[JavaScript]] 里的生成器 `yield` 或 [[ReadableStream]] 按需拉取是一个道理。这样内存里永远只留手头正在过手的几行；要是查询末尾带了 `LIMIT 10`，树根拉够 10 行直接收工，底下剩的 99990 行根本不用白跑。

    光跑 `EXPLAIN` 看到的只是优化器的纸面预算；真要抓慢查询的病根得用 `EXPLAIN ANALYZE`。它会把计划树真刀真枪跑一遍，在每个算子旁边同时印出「预估行数」和「实际吐出行数、实际耗时」——顺着树找哪个算子的预估数和真实数差出了十倍百倍，那里就是优化器被假账骗了的第一现场。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: opt
      id: o
      label: 优化器：交出算子流水线树
    - lane: exec
      id: x
      label: 执行器：按需拉取，行逐级上流
      highlight: true
    - lane: store
      id: s
      label: 叶子算子：全表扫 / 索引扫 / 点查
    messages:
    - id: m1
      from: o
      to: x
      label: EXPLAIN FORMAT=TREE 看到的就是它
      active: true
    - id: m2
      from: x
      to: s
      label: 要一行，现取一行
    registers:
    - name: 形状
      value: 叶子取数，根部出结果
    - name: 验账工具
      value: EXPLAIN ANALYZE 真跑一遍
  log:
  - mode: 执行
    event: 执行计划不是步骤清单而是一棵流水线树，行在算子之间按需拉取、逐级往上流动
- id: plan-gone-wrong
  title: 慢查询翻车救火指南：先刷统计账，最后才动 hint
  tldr: 代码没改查询却突然超时，病根多半是数据分布变了而统计账过期，或是冷热悬殊的参数共用了同一份缓存计划；排障应按「刷统计 → 补索引 → 改 SQL → 钉 hint」四步走。
  body: |-
    线上最让人头疼的故障，莫过于一句跑了大半年都只要 5 毫秒的查询，某天凌晨一行代码没改突然飙成 10 秒超时。复盘下来十有八九不是[[优化器]]变笨，而是数据分布变了、统计账没跟上：比如 `orders` 表有个状态列，半年前「处理中」只占 1%，大促积压后涨到 80%，统计账却还停在旧时代。优化器高高兴兴选了走状态索引逐行[[回表]]，结果一头扎进 80 万次随机读的泥潭。另一类暗箭藏在预处理语句的计划缓存里：第一次拿只占万分之一的「已退款」参数生成了走索引的计划，下一秒换上占九成的「已完成」参数直接复用这份旧计划，当场翻车。

    遇到慢查询，很多人第一反应是塞一句 `FORCE INDEX` 之类的优化器提示（[[hint]]）强行摁头改路。千万别拿它当首选——一旦写死 hint，你就替数据库背起了终身算账的包袱，等下个月数据分布变回去，钉死的路线自己就成了新故障。

    把整课收成一套值班和面试都能直接掏出来的**慢查询排障四步法**：**① 验账刷账**——先跑 `EXPLAIN ANALYZE` 揪出预估行数与实际行数差得最离谱的算子，跑一遍 `ANALYZE TABLE` 刷新统计账，大半「突然变慢」到这一步直接痊愈；**② 铺好索引路**——账是最新的还选错，检查是不是缺了高选择性联合索引或[[覆盖索引]]，或者连接键、过滤列上套了函数把索引废掉了；**③ 拆开难估写法**——把冷热极端分化的参数或大杂烩多表查询拆开，别让一套计划硬扛两头；**④ 最后才下 [[hint]]**——前三招全试过仍纠不回来，再钉死路线并留好注释定期复查。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: opt
      id: o
      label: 优化器：被旧账喂了假情报
    - lane: exec
      id: x
      label: 执行器：照错计划跑出大半表随机读
      highlight: true
    - lane: store
      id: s
      label: 存储引擎：只按计划取页，路线由优化器决定
    messages:
    - id: m1
      from: o
      to: x
      label: 先刷新统计，再谈改路线
      active: true
    registers:
    - name: 病根
      value: 数据变了，统计没跟上
    - name: 纠错序
      value: 刷新账 → 加索引 → 改写 → 提示钉死
  log:
  - mode: 收尾
    event: 优化本质上是拿估算赌真实数据，赌输时先查统计这份原料，再怪优化器选错路
minutes: 30
level: 进阶
prereq:
- data/db-internals
- data/btree-index
objectives:
- 说清优化器与执行器的职责分工，以及行数、基数、直方图三项统计信息怎么参与估价
- 用页数和成本模型算清「走二级索引回表」与「全表顺序扫」的分水岭
- 区分嵌套循环、哈希连接、排序合并三种连接算法的适用场面与硬边界
- 读懂 EXPLAIN / EXPLAIN ANALYZE 算子流水线树，掌握慢查询翻车时的四步排障顺序
aiLink: 这套「先看统计、再算成本、择优走路线」的思路在 AI 基础设施里随处可见：[[RAG]] 检索要在向量索引与关键词倒排索引之间挑路，[[LLM]] 网关要在大小模型之间按成本与延迟做动态路由，底层逻辑和数据库[[优化器]]如出一辙。
design:
- mechanism: SQL 只声明要什么结果，把取数路线交给优化器现算
  problem: 同一句查询换条执行路线能慢出上千倍，而哪条路便宜完全取决于表行数、索引分散度和数据倾斜——这些实时家底只有存储引擎自己清楚。要是让写代码的人手写取数步骤，等于让信息最匮乏的人做最关键的决定，而且线上数据一涨，手写路线当场作废。
  choice: 让 SQL 只负责描述「想要什么结果」，在数据库内部配一个基于成本的[[优化器]]：平时抽样维护统计账，每次收到查询现场生成候选计划、逐条算分，挑总价最低的交给[[执行器]]跑。
  tradeoff: 你交出了手写步骤的苦差事，也一并交出了执行的确定性：同一句 SQL 昨天走索引 5 毫秒，今天统计账偏了就可能偷换全表扫跑超时；排障必须学会用 [[EXPLAIN]] 拆开黑盒对账。
  root: 把拍板权交给手里握着最多现场信息的那一方——数据分布天天在变，只有紧贴存储层的引擎才算得过这笔动态账。
- mechanism: 成本模型拿「读页数与处理行数」计价，而不直接测算真实耗时
  problem: 内存里比对一行只要几纳秒，从磁盘读一页却要几十微秒到几毫秒，两者差了好几个数量级；更麻烦的是真实耗时还会跟着当前缓存命中率、别的线程抢没抢磁盘剧烈抖动，纸面推演根本算不出稳定的毫秒数。
  choice: 抓住最贵的瓶颈资源定价：[[成本模型]]以「预计读多少个数据页」和「过手多少行记录」当计价货币，乘上固定权重算出可比的总分，不纠结瞬时毫秒数。
  tradeoff: 一旦遇到不怎么读盘、却在内存里猛烧 [[CPU]] 的查询——比如长正则匹配、复杂函数计算或大块内存排序——页数很少但算力极贵，成本模型容易给它打出过于乐观的低分，漏掉真正的瓶颈。
  root: 估算系统没法把全世界所有变量都塞进公式，只能盯死决定生死的头号稀缺资源；对磁盘数据库来说，少读一页盘永远比省几百条指令值钱。
- mechanism: MySQL 省略排序合并连接，只留嵌套循环与哈希两件兵器
  problem: 每往数据库里塞一种连接算法，优化器就得多维护一套估价公式和边界规则，执行器也得多养一条必须扛住极端并发的代码路径；而[[排序合并]]真正独占优势的场面（两张超大表都没索引且结果刚好要按同键排序），在日常在线业务里占比并不高。
  choice: 主动做减法：用[[嵌套循环]]吃透「小表驱动 + 内层有索引」的高频点查，用[[哈希连接]]兜底「没索引的等值大表连接」；真遇到要有序输出，要么直接顺着 [[B+ 树]]天然有序的叶子读，要么在哈希连接后面单挂一个排序算子解决。
  tradeoff: 真撞上「两张大表按非索引列连接还要排序输出」，MySQL 就只能先哈希配对再额外排一次序，比自带排序合并的 [[PostgreSQL]] 多干一道活。
  root: 工程工具箱讲究二八定律而非攒齐图鉴：两件主力兵器加 B+ 树天然有序已经覆盖了九成以上场景，第三件兵器的边际收益抵不上它终身的维护复杂度时，不加就是克制。
terminal:
- cmd: EXPLAIN SELECT * FROM orders WHERE user_id = 42;
  note: 看这条查询选了哪个索引、预估要扫多少行
- cmd: EXPLAIN ANALYZE SELECT ...;
  note: 真跑一遍：对比每个算子的预估行数与真实行数，差最大的就是病灶
- cmd: ANALYZE TABLE orders;
  note: 刷新统计账（重采样行数与直方图），计划翻车时先做这一步
- cmd: SHOW INDEX FROM orders;
  note: 看 Cardinality 列：每个索引的值有多分散，优化器据此估选择性
