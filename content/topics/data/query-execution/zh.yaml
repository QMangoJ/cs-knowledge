- id: cost-model
  title: 把路线折算成钱：成本模型
  tldr: 候选路线没法直接比长短，成本模型把它们统一折算成页与行的消耗，数字小者胜。
  body: '路线不止一条：先连后筛、先筛后连、走甲索引、走乙索引、干脆全表扫——每种排法都是一种候选计划。参谋要从里面挑一条，就得先有办法给它们逐一估价。估价的办法叫成本模型（cost model）：把每条路线预计要读多少页、要处理多少行，按事先定好的单价折算成一个总分，分低者胜。

    为什么计价货币主要是页和行？接上一课底层之旅的数量级表：内存里算一行的开销是纳秒级，从磁盘读一页是微秒到毫秒级，瓶颈永远在取页上。所以成本模型干脆以「要碰多少页、要过手多少行」为主要货币——抓住最贵的资源计价，估出来的排序大体就不会离谱。

    这笔账是估的，不是测的：参谋不会把每条路线真跑一遍再挑（那比执行本身还贵），它只能拿统计账上的数字做纸面推演。这决定了优化的本质是一种赌博：数据分布与账面一致时赌得准，数据倾斜或账过期时，就会把宝押在错路线。理解这一点，后面看到任何「数据库莫名其妙选了慢路」的故事，都能一眼看穿病根。

    举个纸面推演的小例子：路线甲，先按时间索引筛订单，估读索引与回表约一万页，再逐行点查用户表；路线乙，先把两表全量连接再过滤，估两表全扫一万三千页，外加百万行中间结果逐行过手。两条路线的总分差距若是数倍，参谋选得毫不犹豫；麻烦只出在两者接近、而统计又恰好估反了的时候——纸面上的险胜，到了真实数据里就是惨败。成本模型给了可比性，却给不了正确性，正确性押在统计账的新鲜程度上。'
  derivation: original
  canvas:
