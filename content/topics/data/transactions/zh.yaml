level: 进阶
minutes: 36
prereq:
- data/btree-index
- os/file-system
objectives:
- 把 ACID 四条性质逐一对应到底层引擎零件与应用职责
- 按四档隔离级别列出各自封杀与放行的并发读异常
- 用快照可见性手算 MVCC 读到哪一版，说清长事务与写入偏斜的危害
aiLink: AI 应用的数据层处处需要事务纪律：向量库与关系库元数据的双写一致、Token 计费扣额防超扣、异步任务队列的「至少一次 + 幂等键」。吃透 MVCC 与 WAL，才能看清各类数据底座的一致性边界。
design:
- mechanism: MVCC 多版本并发：写者挂新版本、读者看旧快照，读写从此互不阻塞
  problem: 纯靠悲观锁做隔离时，只要写者攥着排他锁，所有读同一行的查询都得排队干等；而绝大多数业务读远多于写，让占大头的读请求为少数写请求陪绑排队，吞吐随并发上升反而塌方。
  choice: 更新时不原地覆盖旧值，而是生成带创建与删除事务号的新版本；每个读事务启动时领一份快照，读行时顺着版本链挑快照内最新且已提交的版本，把互斥压缩到少数「写写同行」之间。
  tradeoff: 旧版本在所有老快照结束前都不敢物理删除，一旦有长事务迟迟不提交，就会钉住全库旧版本，导致表空间膨胀、版本链拉长、全体读查询一起变慢，必须配后台清理（vacuum / purge）并严管长事务。
  root: 读多写少的负载下，用额外的存储空间和后台垃圾回收成本，买走读者与写者之间的锁等待，是一笔几乎稳赚不赔的买卖。
- mechanism: 预写日志（WAL）：先顺序刷日志再慢写脏页，兼顾毫秒级提交与断电不丢
  problem: 数据页散布在磁盘各处，每次提交若强求把脏页当场写回，昂贵的随机 IO 会拖死提交延迟；可若只改内存就回成功，断电就会弄丢已提交账目，持久性直接破产。
  choice: 死守「先日志后数据页」铁律：描述修改的 redo 与 undo 日志必须先顺序追加并 fsync 落盘，随后即可确认提交；内存里的脏页留给后台慢慢写回，崩溃重启时靠日志重做已提交、撤销未提交。
  tradeoff: 提交延迟下限仍卡在一次日志刷盘上（需靠组提交拼批摊薄），且引擎必须周期性推进检查点来控制崩溃恢复重放的日志长度与磁盘占用。
  root: 磁盘上顺序写比随机写便宜一到两个数量级，而日志天生是只追加的顺序流——先用最低成本锁死一份能重建现场的账本，随机写数据页就从「火烧眉毛」降级成了「后台慢活」。
- mechanism: 四档可调隔离级别：不搞一刀切串行化，把异常容忍度交给业务定价
  problem: 串行化虽能封杀一切并发怪象，但无论是重度加锁还是严格冲突中止，都会砍掉大量并发吞吐；而大盘统计、普通列表查询根本不在乎毫秒级的略旧数据，全库按最高档收费纯属浪费。
  choice: 把隔离做成从读未提交到串行化的四档旋钮，每升一档多关掉一类读异常：报表查询开读已提交轻装上阵，转账扣库存等核心链路再升档或叠加显式行锁、乐观版本号兜底。
  tradeoff: 程序员必须真正吃透每档放行的异常（如快照隔离仍会漏过跨行的写入偏斜），还要核对具体数据库的实现差异；一旦选错档位，账目往往在高并发偶发撞车时才悄悄出错。
  root: 隔离每放松一分，锁竞争与冲突中止就少一分；既然不同业务对「读歪一点」的代价天差地别，把档位选择权交给最懂业务边界的开发者才最划算。
quiz:
- q: COMMIT 返回成功后下一毫秒突然断电，这笔事务的改动为什么丢不了？
  options:
  - 因为所有改过的 16KB 数据页都已经同步写回了表文件
  - 因为提交返回前日志已按 WAL 规矩顺序刷盘，重启时可按 redo 重做
  - 因为内存条自带永久供电备份
  - 因为操作系统保证进程崩溃不影响内存数据
  answer: 1
  explain: 持久性押在预写日志上：脏数据页可以晚写，redo 日志必须在提交前 fsync 落盘，重启后照日志重演即可找回。
- q: MVCC 实现「读不被写阻塞」的核心做法是？
  options:
  - 读之前先把整张表锁成只读
  - 写操作生成新版本，读事务按自己的快照沿版本链挑可见的旧版本
  - 把所有写请求攒到凌晨低峰期统一执行
  - 直接禁止两个连接同时访问同一张表
  answer: 1
  explain: 写者只管在链头挂新版本，读者按快照挑属于自己时刻的已提交版本，除写写同行外互不等待。
- q: 幻读与不可重复读最核心的区别是？
  options:
  - 没有任何区别，只是不同数据库的叫法不同
  - 幻读是同一行的值变了，不可重复读是满足条件的行数变了
  - 幻读是同一范围查询的结果集行数变了，不可重复读是同一行的值变了
  - 幻读只会在执行 DELETE 时发生
  answer: 2
  explain: 不可重复读针对已存在的单行字段值被修改；幻读针对按条件查询的行集合因新行插入（或删除）而增减。

