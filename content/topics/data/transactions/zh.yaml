    event: 每条性质都有对应的实现零件，不是口号
- id: anomalies
  title: 三种读现象：隔离不够时会看到什么
  tldr: 脏读、不可重复读、幻读——名字按「读到的东西有多不可信」排序。
  body: '脏读：事务 T1 改了余额还没提交，T2 读到了这个中间值；T1 随后回滚，T2 相当于读到了一个从未存在过的值。不可重复读：T1 两次读同一行，中间 T2 把这行改了并提交，两次结果不同。幻读：T1 两次按条件查一批行，中间 T2 插入了新行并提交，第二次多出几行像幻觉——与不可重复读的区别是针对「行集合」而非某一行。

    这三种现象是 SQL 标准定义隔离级别的坐标系：每个级别就是一份「允许出现哪些现象」的清单。'
  derivation: original
  sources:
  - ref: cmu-15445
    locator: 并发控制讲义（异常与隔离级别）
    claim: 脏读、不可重复读与幻读是按隔离级别划分的经典并发异常
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: txn
      id: t
      label: T1 / T2
    - lane: db
      id: d
      label: 数据库
      highlight: true
    - lane: log
      id: l
      label: 日志 / 存储
    messages:
    - id: m-an
      from: d
      to: t
      label: T2 未提交的改动被 T1 读到 = 脏读
      active: true
  log:
  - mode: 异常
    event: 先给现象命名，隔离级别就是禁止其中几种
- id: levels
  title: 隔离级别：四档取舍
  tldr: 读未提交 < 读已提交 < 可重复读 < 串行化：每升一档关掉一类现象，代价是并发度下降。
  body: '四档标准级别与它们禁止的现象：读未提交（Read Uncommitted）什么都可能发生，很少真用；读已提交（Read Committed）禁止脏读——读到的都是已提交版本，许多数据库（如 PostgreSQL）以它为默认；可重复读（Repeatable Read）再禁止不可重复读——同一事务内反复读同一行结果稳定（MySQL InnoDB 默认在这个级别，并用间隙锁等手段处理幻读）；串行化（Serializable）全部禁止，效果等价于事务排队执行，最安全也最贵。

    选级别就是选「我能容忍哪种异常」：报表统计通常读已提交够用；涉及扣款扣库存的关键路径，要么升到可重复读 + 显式锁，要么用乐观锁（版本号）在应用层兜底。'
  derivation: original
  sources:
  - ref: cmu-15445
    locator: 并发控制讲义（SQL 隔离级别与现象对照）
    claim: 四档隔离级别分别禁止脏读、不可重复读与幻读，串行化提供完全隔离
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: txn
