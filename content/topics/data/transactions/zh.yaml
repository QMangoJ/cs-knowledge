steps:
- id: why
  title: 中途断电与并发超卖：事务要封死的两类事故
  tldr: 事务用 BEGIN、COMMIT 与 ROLLBACK 把多步读写打包成原子整体，同时堵住「中途崩溃留下半截账」和「并发读写交错导致丢失更新」两类事故。
  body: |-
    转一笔 `100` 元的账至少要执行两句更新：给 A 扣 `100`，再给 B 加 `100`。如果没有一层整体打包机制，两类事故随时找上门：第一类是**中途崩溃**，刚扣完 A 还没给 B 加上时断了电，数据停在总账凭空少 `100` 的半截状态；第二类是**并发交错**，仓库只剩最后 `1` 件库存，事务一读到 `1`、事务二也同时读到 `1`，两边各自减一写回 `0` 并提交——货卖出去了两件，库存却只减了一次（这类错叫**丢失更新**）。

    这两类错都不是业务代码写出了 bug，而是缺少「把一组操作当成一个不可分割整体」的契约。事务（transaction，由图灵奖得主 Jim Gray 等人在 1970 年代奠定理论框架）在代码里的形态就是一对括号：`BEGIN` 开始，中间跑一串读写语句，`COMMIT` 拍板生效，半路任何一步失败就 `ROLLBACK` 全部抹回原样；多个事务并发跑起来时，最终效果还要等价于按某种串行顺序一个个执行完。

    并发交错与中途崩溃是两个互相正交的故障维度，数据库为此立下了 [[ACID]] 四条性质，把两头漏洞同时焊死。
