title: 事务：ACID、隔离级别与 MVCC
summary: 多个请求同时改同一份数据、改一半进程崩了——事务用四条性质和一套版本机制把这两件事管住。
premise: 以银行转账与电商扣库存两个经典场景为例。
position: >-
  本课归入「事务：并发与崩溃下的规矩」板块，接在底层之旅把页、日志与一次读写走通之后：找得到、也知道一页在系统里怎么流动了，两个事务同改一行、改到一半又断电时还需要另一套秩序。学完你能把脏读、不可重复读与幻读对回四档隔离级别，也能用快照可见性规则判断一个读事务在版本链上究竟该挑中哪个版本。
bridge:
  prev: >-
    上一课的写入之旅把一次改动送上内存页、记进 redo、又把旧值抄进 undo，本课正式接管这三样东西要守的规矩：同一行被两个事务先后读到库存 1 时，怎样才不会卖出两件。
  next: >-
    本课的预写日志把先记顺序日志、数据页从容落盘立成铁律，下一课的 LSM 便把这条纪律推到极致，索性让数据本身也只追加、后合并。
overview:
- key: 一句话总结
  value: 事务把一组操作打包成「全做或全不做」，并发时看起来像按某种顺序一个个执行
- key: ACID
  value: 原子性（日志 undo）、一致性（约束 + 应用）、持久性（日志 redo + fsync）、隔离性（锁或版本）
- key: 三种读现象
  value: 脏读（读到未提交）、不可重复读（同行变了）、幻读（行数变了）
- key: 隔离级别
  value: 读已提交 / 可重复读 / 串行化：级别越高越安全也越慢
- key: MVCC
  value: 写不覆盖旧值而是造新版本，读按快照看版本——读写互不阻塞的主流实现
- key: WAL
  value: 改数据前先把日志顺序落盘，崩溃后 redo 已提交、undo 未提交
