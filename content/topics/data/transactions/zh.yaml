level: 进阶
minutes: 36
prereq:
- data/btree-index
- os/file-system
objectives:
- 把 ACID 四性质逐一对应到实现机制
- 按隔离级别列出各自禁止的读现象
- 解释 MVCC 的可见性规则与长事务的危害
aiLink: AI 应用的数据层同样需要事务思维：向量与元数据的双写一致、计费扣额、任务队列的「至少一次 vs 恰好一次」。理解 MVCC 与 WAL，才能读懂现代数据库（含向量库）的并发与持久性设计。
design:
- mechanism: 为什么隔离的主流实现是多版本而不是锁读——让读者看旧版本、写者造新版本，读写从此不必互相等待，现代数据库几乎一边倒地选了它
  problem: 根本约束是锁的互斥性太贵：悲观锁下写者持排他锁期间读者只能排队，长查询会把短事务堵成长队，吞吐随并发上升反而塌方；而绝大多数业务负载里读远多于写，让占多数的读为占少数的写让路，总账不划算
  choice: 做法是更新不覆盖旧值，而是生成带创建与删除事务标记的新版本；每个读事务在开始时领取一份快照，读一行时沿版本链挑快照内最新且可见的版本，于是读者永远读现成的旧版本，写者只管造新版本
  tradeoff: 代价是版本垃圾：旧版本在被所有活跃快照放行之前不能回收，长事务会把快照钉住，让旧版本不断堆积、版本链越拉越长、所有读者的查找都变慢，所以系统必须有后台清理，还要监控与掐断长事务
  root: 根子在读写比这本账上：读多写少的世界里，把冲突从读写之间挪到写写之间，等于只让少数派之间互斥；多版本用存储空间与清理成本，买走了读者与写者之间的等待，这笔交换在读占压倒多数时几乎总是赚的
- mechanism: 为什么改数据前日志必须先落盘——预写日志把持久性押在顺序写这条最便宜的 IO 路径上，先日志后数据页的顺序永远不许颠倒
  problem: 根本约束有两条：一是数据页散布在磁盘各处，改完立刻全部写回是随机写，贵且慢，提交延迟会被它拖死；二是只改内存不落盘，断电就丢已提交数据，持久性直接破产，两头都不能接受
  choice: 做法是定一条铁律，叫预写日志：任何数据页落盘之前，描述这次修改的日志记录必须先顺序追加并刷盘；内存里的数据页可以攒着慢慢写回，崩溃后用日志把已提交的修改重做、把未提交的修改撤销
  tradeoff: 代价是每次提交至少要等一次日志刷盘，提交延迟有了硬下限，要靠组提交把多事务拼一批来摊薄；同时还要周期性做检查点推进恢复起点，日志的写入、回收与检查点节奏成为数据库运维的核心旋钮
  root: 根子在介质的顺序账上：顺序写的成本比随机写低一到两个数量级，而日志恰好是天然只追加的顺序流；先攥住一份能重建一切的顺序日志，随机的数据页写回就从必须立刻做降级为可以从容做，持久性与性能第一次能同时成立
- mechanism: 为什么隔离级别要做成可调档位而不是一律串行化——正确性需求因场景而异，最安全的档位要付最贵的并发账，一刀切反而是更贵的选择
  problem: 根本约束是串行化的成本：在锁实现下它意味着大面积互斥与频繁死锁回滚，在快照实现下意味着严格的冲突检测与更高的中止率；而报表统计这类场景根本不怕读到略旧或略有出入的数据，一律按最高标准收费是浪费
  choice: 做法是把隔离做成四档旋钮，从读未提交到串行化逐档收紧，每升一档关掉一类读现象，让业务按自己能容忍的异常程度选档：统计报表用读已提交足够，扣款扣库存这类关键路径再升档或配合显式锁与版本号兜底
  tradeoff: 代价是心智负担与误判风险：选档的人必须真懂每档放行的异常长什么样，还要面对各家数据库实现强度与标准表格不完全一致的现实，选错档位时数据不会立刻坏，而是以偶发脏数据的方式慢慢爆雷
  root: 根子在并发的收益结构上：隔离每放松一分，锁与版本的约束就少一分，吞吐与延迟就好一分；既然不同业务对读错的容忍度天差地别，把这笔交换做成显式档位交给最懂业务的人定价，比系统一刀切更接近总成本最优
quiz:
- q: COMMIT 返回成功后立刻断电，这笔事务为什么不会丢？
  options:
  - 因为数据页已经全写回磁盘
  - 因为提交前日志已通过 WAL 顺序落盘，恢复时可以 redo
  - 因为内存有备份
  - 因为断电不会影响数据库
  answer: 1
  explain: 持久性靠日志先落盘：数据页可以晚写，日志不行；恢复用日志重做已提交事务。
- q: MVCC 让读不被写阻塞的办法是？
  options:
  - 读时给整表加锁
  - 更新生成新版本，读事务按自己的快照挑可见版本
  - 把写请求排队到半夜执行
  - 禁止并发写
  answer: 1
  explain: 多版本 + 快照可见性：读者看旧版本，写者造新版本，互不等待（写写冲突除外）。
- q: 幻读与不可重复读的区别是？
  options:
  - 没有区别
  - 前者是同一行的值变了，后者是满足条件的行数变了
  - 前者是行数变了，后者是同一行的值变了
  - 幻读只发生在删除时
  answer: 2
  explain: 不可重复读针对单行值的变化；幻读针对查询结果集行数的变化（新行插入/删除）。
