- id: mvcc
  title: "[[MVCC]] 多版本实战：写者挂新链头，读者按快照挑旧版"
  tldr: "[[MVCC]] 让更新生成带事务号的新版本而不覆盖旧值，读事务按快照挑最新可见版本，使读写互不阻塞；但迟迟不提交的长事务会钉住旧版本导致表膨胀。"
  body: |-
    多版本并发控制（MVCC）是现代数据库实现隔离的主力：每一行允许同时保留多个版本，每个版本记着创建和删除它的事务号；事务启动时领一份快照（当时已提交的事务集合），读行时只挑快照里「最新且可见」的版本。于是读者读旧版本、写者造新版本，两边互不挡路，只有两个写者抢改同一行时才冲突等待或回滚重试。

    拿具体编号把可见性判定走一遍：某行现有三个版本，`v1` 由事务 `T3` 创建且已提交，`v2` 由事务 `T7` 创建且已提交，`v3` 由事务 `T9` 创建但尚未提交。一个读事务在 `T7` 提交之后、`T9` 开始之后拍下快照，它的可见集合包含 `T3` 与 `T7`、不含未提交的 `T9`；引擎沿版本链从新往旧查，跳过不可见的 `v3`，当场命中并返回 `v2`。

    物理存放上分两派：一派（如 [[PostgreSQL]]）把整行新版本追加进表页，旧版本留原地等后台 `vacuum` 清扫；另一派（如 InnoDB）原地放最新版本，把旧版本串进回滚段的版本链。两派共享同一笔代价：只要还有老事务没结束，它快照钉住的旧版本就不能回收——运维里说「长事务是万恶之源」，就是因为一个不提交的慢事务会让旧版本堆积、表体积膨胀、版本链拉长，拖慢所有读查询。
  derivation: original
  sources:
