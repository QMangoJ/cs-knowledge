- id: levels
  title: 隔离级别：四档取舍
  tldr: 读未提交 < 读已提交 < 可重复读 < 串行化：每升一档关掉一类现象，代价是并发度下降。
  body: '四档标准级别与它们禁止的现象：读未提交（Read Uncommitted）什么都可能发生，很少真用；读已提交（Read Committed）禁止脏读——读到的都是已提交版本，许多数据库（如 PostgreSQL）以它为默认；可重复读（Repeatable Read）再禁止不可重复读——同一事务内反复读同一行结果稳定（MySQL InnoDB 默认在这个级别，并用间隙锁等手段处理幻读）；串行化（Serializable）全部禁止，效果等价于事务排队执行，最安全也最贵。

    选级别就是选「我能容忍哪种异常」：报表统计通常读已提交够用；涉及扣款扣库存的关键路径，要么升到可重复读 + 显式锁，要么用乐观锁（版本号）在应用层兜底。

    补一条重要的现实注脚：SQL 标准是用现象来定义级别的，但各家数据库的实际实现强度并不完全等于标准表格。比如有的数据库在可重复读档位用快照隔离实现，连幻读也顺带防住了；有的数据库读已提交在分布式场景下的语义又另有讲究。所以选级别时背表只是第一步，还必须查所用数据库的文档，确认它在这一档到底承诺什么。级别是下限承诺而不是行为说明书，把标准表当成跨数据库的精确合同，是选型时最常见的误判来源。

    还有一个选档的实务维度：同一套业务里混用档位是常态，而不是全库统一一个开关。主库上的扣款写路径用高档位，只读副本上的统计查询用低档位就足够；读写分离时还要叠加考虑副本复制延迟带来的读旧问题，那是另一种与隔离级别无关的旧。档位本质上是按事务逐个声明的属性，写的人必须对每个事务单独想清楚它怕哪种异常。代码评审里，隔离级别的声明值得像审金额字段一样逐行审，因为选错时系统不会立刻报错，只会以偶发脏数据的形式把账记在几个月之后。'
