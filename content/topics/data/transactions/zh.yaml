- id: acid
  title: 拆开 [[ACID]] 四件套：三条靠引擎零件，一条靠应用合守
  tldr: 原子性靠 [[undo]] 擦除半成品，持久性靠 [[WAL]] 预写 [[redo]] 加 [[fsync]] 落盘，隔离性靠锁或 [[MVCC]] 隔开并发，一致性则由引擎约束与业务代码共同守住。
  body: |-
    别停在背四个英文单词，直接拆开看底下干活的引擎零件：**A 原子性**管「要么全成、要么全回滚」，改数据前先把旧值记进 [[undo]] 日志，失败时反着擦回去；**D 持久性**管「`COMMIT` 返回成功后哪怕立刻断电也不丢」，靠把日志先刷上磁盘（[[WAL]] + [[fsync]]）；**I 隔离性**管「并发事务互不踩脚」，靠悲观加锁或多版本并发控制（[[MVCC]]）实现。四条里 I 与 D 的性能代价最重，真实系统常通过调低隔离档位来换吞吐。

    唯独 **C 一致性**最容易背错：数据库能自动把关的，只有你声明过的唯一键、外键、`balance >= 0` 这类显式约束；至于「转账前后两账户总金额守恒」这种业务不变量，数据库压根不知道——要是代码漏写了给 B 加钱那句就提交，引擎照样放行。所以 A、I、D 是存储引擎提供的硬机制，C 是机制加上表约束与正确业务代码共同守住的结果。

    再留意一条暗线：原子性回滚靠提前记下的旧值，持久性重做靠提前落盘的新值——两边其实共用同一条「日志必须走在数据页前面」的纪律。
  derivation: original
  sources:
  - ref: cmu-15445
    locator: 并发控制与恢复讲义（ACID 实现机制）
    claim: 原子性由 undo 日志保证、持久性由预写日志与 redo 保证、隔离性由锁或多版本并发控制保证
