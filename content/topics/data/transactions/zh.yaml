- id: occ
  title: "[[乐观并发控制]]：私有区先干活，提交瞬间验版本号定输赢"
  tldr: "[[乐观并发控制]]赌并发冲突罕见：全程不加锁在私有区修改，提交时核对读集版本号是否被别人动过，没变才落盘，变了就作废重试。"
  body: |-
    设想一个商品详情编辑页：一天几百人点开看，真正点保存的只有一两个人，改的还多半不是同一件商品。要是为这种极低撞车率的场景让所有人进门先加锁排队，等待费花得太冤。**[[乐观并发控制]]**赌的就是冲突罕见。

    它分三段走：第一段是**读与暂存**，把所读数据连同当前版本号记下来，所有修改先写在事务自己的私有工作区里，不碰真实数据、不拿一把锁；第二段是**验证**，提交瞬间回头逐行核对读过的那些版本号变没变，只要有一行被别人抢先改过，整笔事务当场作废重来；第三段是**写入**，验证全通过才把修改一次性落盘，并把版本号加 `1`（好比前端请求带 `ETag / If-Match` 头防覆盖；业务代码里最常见的手工版则是给表加 `version` 列，更新时带上 `WHERE version = 旧值`，看受影响行数是否为 `0` 来抓冲突）。

    它省掉了锁等待与死锁，冲突低时吞吐远胜悲观锁；可一旦冲突频繁，每撞翻一次就得把整份活白干重来，总成本反而高于老实加锁，长事务还容易被短事务反复撞翻而「饿死」。选这条路之前只问一句：**真实冲突率到底有多低**。
  derivation: original
  sources:
  - ref: cmu-15445
    locator: 并发控制讲义（乐观并发控制）
    claim: 乐观并发控制在提交时验证读集未被修改，冲突罕见时以重试换取无锁的高并发
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
