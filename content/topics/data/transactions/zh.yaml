- id: wal
  title: "[[WAL]] 与组提交：顺序日志兜底崩溃，拼车刷盘拉高吞吐"
  tldr: 预写日志（[[WAL]]）要求含 [[redo]] 与 [[undo]] 信息的日志必须在脏页落盘前先 [[fsync]] 刷盘，配合周期性[[检查点]]截断恢复起点，并用组提交拼批摊薄刷盘延迟。
  body: |-
    持久性靠预写日志（WAL）闭环：改数据时先往日志末尾顺序追加记录（包含「改成什么」的 [[redo]] 信息与「原来是什么」的 [[undo]] 信息），日志刷盘后内存里的脏数据页可以慢慢写回；万一崩溃重启，顺读日志把已提交事务的改动 redo 重演（哪怕数据页生前没写回过），把未提交事务的改动 undo 撤销。先攥住廉价的顺序日志、再从容整理随机数据页，这套母题在下一课 LSM 树里还会原样重逢。

    为了不让日志无限增长，数据库会周期性做[[检查点]]，把内存脏页刷回磁盘并记下恢复起点：起点之前的日志在崩溃恢复时无需再重放，旧日志文件也能循环回收——否则重启一次得从开库第一条日志重放到今天，恢复时间根本没法接受。

    再算一笔提交刷盘账：`COMMIT` 的延迟下限就是等那一次日志 [[fsync]] 落盘的时间。高吞吐数据库的标配优化叫**组提交（Group Commit）**：开一个极短的微秒级等待窗口，把同一瞬间到达的多笔提交事务的日志拼成一批，只调一次 `fsync` 全部刷下盘——持久性丝毫不减，单笔事务分摊到的刷盘成本却趋近于零，写吞吐当场拉高一个量级。
  derivation: original
  sources:
  - ref: cmu-15445
    locator: 恢复讲义（WAL 与 ARIES 思想）
    claim: 预写日志要求日志在数据页落盘前先落盘，恢复时对已提交事务 redo、未提交事务 undo
