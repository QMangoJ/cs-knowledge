- id: anomalies
  title: 隔离不够会看见什么：[[脏读]]、[[不可重复读]]与[[幻读]]
  tldr: "[[脏读]]读到了别人未提交且可能回滚的假数据，[[不可重复读]]在同一事务内两次读同一行值变了，[[幻读]]则在同一条件查询下结果集行数变了。"
  body: |-
    隔离没拉满时，并发读会撞上三类经典怪象，SQL 标准正是拿它们当尺子来划分隔离级别。危害最重的叫**[[脏读]]**：事务 T1 改了余额还没提交，T2 读到了这个半截中间值；随后 T1 回滚，T2 等于读到了一个从未正式存在过的假数——要是 T2 还顺着这个假数往外写了别的表，对方一回滚污染就彻底收不回来了，因此真实生产系统里几乎没人敢开读未提交这一档。

    第二类叫**[[不可重复读]]**，盯的是**单行的值变了**：事务一先读到余额 `100` 并据此决定放行支付，转头事务二把这行余额扣成 `80` 并提交；事务一复核同一行时读出 `80`，前后两次读数打架，刚才放行支付的依据已经失效。

    第三类叫**[[幻读]]**，盯的是**满足条件的行集合变了**：事务一统计余额过万的账户数出 `5` 个准备发报表，中间事务二新插入一个达标账户并提交；事务一再按原条件查一遍变成了 `6` 个，多出的行像凭空冒出的幻觉，导致同一事务内报表口径漂移。
  derivation: original
  sources:
  - ref: cmu-15445
    locator: 并发控制讲义（异常与隔离级别）
    claim: 脏读、不可重复读与幻读是按隔离级别划分的经典并发异常
