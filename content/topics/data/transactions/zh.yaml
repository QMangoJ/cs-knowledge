- id: occ
  title: 乐观并发控制：先干完，提交时再验
  tldr: 冲突罕见时别先锁：私有区里随便改，提交时验一遍读过的行有没有被人动过，没动才落盘。
  body: '乐观并发控制赌的是冲突罕见，适合读多写少、很少撞车的场景，比如商品信息编辑与文档协作。它分三段走。读阶段：事务把要读的数据连同版本号一起记下，修改都写在自己的私有工作区里，不碰真实数据、不拿任何锁，别人完全不受影响。验证阶段：提交时逐个检查读过的行，版本号与当初读到的一不一致——只要有一行被别人改过，验证失败，整个事务作废重来。写阶段：验证通过，才把私有区里的修改一次性落盘并递增版本号。对比悲观锁：没有锁等待、没有死锁，冲突低时吞吐明显更高，读者更不会被堵。但账的另一面是：冲突一旦频繁，每次失败都要把活重干一遍，总成本反超加锁；长事务在验证期被后来者撞掉的概率更高，还可能反复失败饿死。工程里最常见的它的化身，是给行加一个版本号列，更新时带上版本号相等的条件，更新行数为零就说明被人抢先了——各类框架里的乐观锁、带条件更新的接口，都是同一思想的手工版。选型只问一句：真实冲突率到底有多低。'
