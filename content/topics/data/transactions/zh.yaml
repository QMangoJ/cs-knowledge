- id: write-skew
  title: "[[快照隔离]]的隐蔽盲区：各改各行却撞碎规矩的[[写入偏斜]]"
  tldr: 在[[快照隔离]]下，两个事务基于同一份快照各自修改不同行，因无同行写冲突而双双提交成功，却会合力打破跨行业务约束——这种异常叫[[写入偏斜]]。
  body: |-
    [[快照隔离]]读到的一致画面很强，写冲突也拦得住同行争抢，但它漏掉了一个教科书级的盲区，叫**[[写入偏斜]]（Write Skew）**——它也一针见血地点破了「可重复读不等于串行化」。

    拿医院排班走一遍：院规要求「每个夜班至少留 1 名医生在岗」，当前班次有甲、乙两人在岗。事务一先看快照：2 人在岗，请假合规，于是把**甲那一行**改成休假；几乎同一时刻，事务二看同一份快照：也是 2 人在岗，于是把**乙那一行**改成休假。提交时引擎做写冲突检查：一个改甲行、一个改乙行，没有碰同一行，双双绿灯提交！结果夜班变成 0 人在岗，每一步单独看都合规，合起来却把跨行规矩撞碎了。

    病根在于业务约束横跨两行，而快照隔离只检查单行级的写写冲突——两人做决定的前提都被对方的提交悄悄抽空了。工程上有三条标准解法：一是把跨行规矩物化成一行共享数据让大家去抢（比如建一行「班次在岗计数」，请假都必须减这一行，人为制造同行写冲突触发重试）；二是只把这条关键路径升到**串行化**；三是用显式锁把涉及的甲、乙两行同时锁住。
  derivation: original
  sources:
  - ref: cmu-15445
    locator: 并发控制讲义（快照隔离与写入偏斜异常）
    claim: 快照隔离下修改不同行的事务可共同破坏跨行不变量，即写入偏斜异常
    status: verified
