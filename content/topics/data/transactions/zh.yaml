- id: two-phase-locking
  title: 悲观路线[[两阶段锁]]：先涨后缩保串行，成环死锁挑牺牲者拆解
  tldr: "[[两阶段锁]]把事务生命周期切为「只拿锁不放锁」与「只放锁不拿锁」两段以保证可串行化；互相等锁成环时，引擎回滚代价最小的牺牲者拆解死锁。"
  body: |-
    靠锁实现隔离的悲观路线，基本法叫**[[两阶段锁]]（Two-Phase Locking）**。基础互斥规矩很直白：读数据前拿共享锁（共享锁之间互不排斥），写数据前拿排他锁（与任何锁都互斥，拿不到就排队等）。但光加锁还不够，必须管死放锁时机：整个事务切成增长与收缩两段——**增长段**只许拿锁、不许放锁，**收缩段**只许放锁、不许再拿新锁，释放第一把锁的那一刻叫**锁点**。按锁点给所有并发事务排队，排出来的恰好是一条严格等价的串行顺序。实际引擎普遍采用更严的**严格两阶段锁**：排他锁必须死攥到事务提交或回滚才放，既防脏读，也避免回滚时连累别人跟着级联回滚。

    有等待就会撞上**死锁**。拿转账走一遍：事务一先锁住账户 A，正要锁 B；事务二先锁住 B，正要锁 A——两边都等对方先松手，等待图上的箭头首尾相接成了环（`T1 → T2 → T1`）。数据库定期在等待图里找环，一旦揪出环路，就挑一个回滚代价最小的事务（比如已改行数最少的那个）当牺牲者强行回滚、释放全部锁，让其余事务继续跑，外加锁等待超时兜底。

    悲观锁的代价也明摆着：锁攥在手里多久，后面抢同一行的请求就堵多久，热点行门口动辄排起长龙——这逼出了下一条不加锁的乐观路线。
  derivation: original
  sources:
  - ref: cmu-15445
    locator: 并发控制讲义（两阶段锁与死锁检测）
    claim: 两阶段锁以锁点保证可串行化，等待图成环即死锁，数据库检测成环后回滚牺牲者
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: txn
      id: t
      label: T1 锁 A 等 B
      highlight: true
    - lane: db
      id: d
      label: 数据库（锁管理器）
