- id: practice
  title: 线上事务保命纪律：压短范围、幂等重试、盯死长事务指标
  tldr: 线上事故多因把慢调用塞进事务或漏做冲突重试；守住「外部动作移出事务、无副作用幂等重试、大任务分批提交」，并用评审「事务三问」把关。
  body: |-
    线上大半事务事故，都是把事务当成背包什么都往里塞惹出来的。四条实战纪律必须守死：第一，**事务范围压到最小**，绝不在事务里发远程网络请求或等用户输入，你持锁与钉快照的每一毫秒都是别人的排队时间；第二，**为写冲突和死锁备好重试**，串行化冲突、[[MVCC]] 写冲突以及死锁被挑作牺牲者都是正常保护机制，怕的是代码不捕获重试、直接把报错甩给用户；第三，**重试前提是无外部副作用**——要是事务里夹带了发短信或调第三方扣款，无脑重跑就会重复发送、重复扣钱，必须把外部动作移出事务或配上防重幂等键与状态机；第四，**百万行变更拆成几百行一批提交**，避免单笔巨型事务制造海量日志与版本垃圾。

    监控看板上，有三个指标永远先于接口平均延迟报警：**最长活跃事务的存活年龄**、**每分钟死锁次数**、**锁等待队列长度**——把这三条曲线和发版时间轴对齐看，刚上线的慢查询或坏批处理还没酿成雪崩就能被当场揪出。

    最后把整课收成代码评审时逐处核对的「事务三问」——一问**框里短不短**（`BEGIN` 到 `COMMIT` 之间有没有夹带外部 RPC 或大循环）；二问**档位对不对**（这条业务怕不怕[[不可重复读]]、[[幻读]]或跨行的[[写入偏斜]]，要不要配显式锁或版本号）；三问**重试安不安全**（遇上死锁或冲突重跑一趟，会不会触发重复扣款或重复通知）。
  derivation: original
  sources:
  - ref: cmu-15445
