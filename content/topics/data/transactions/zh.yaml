- id: mvcc
  title: MVCC：写造新版本，读看旧快照
  tldr: 更新不覆盖原行，而是生成带时间戳的新版本；读事务按自己开始时的快照挑版本——读写互不阻塞。
  body: '多版本并发控制（MVCC）是现代数据库隔离的主流实现：每一行可以有多个版本，每个版本记录是哪个事务创建/删除的。事务开始时拿到一个快照（当时已提交事务集合），读一行时挑这个快照里「最新且可见」的版本。

    于是读者永远不被写者挡住（读的是旧版本），写者也不被读者挡住（造新版本即可）；只有写写同行时才冲突，要等或回滚重试。代价是：旧版本要定期清理（vacuum/gc），长事务迟迟不提交，它钉住的快照会让旧版本堆积、表膨胀——运维里「长事务是万恶之源」的说法由此而来。

    可见性判断走一个具体例子：一行现有三个版本，版本一由事务三创建且已提交，版本二由事务七创建且已提交，版本三由事务九创建但尚未提交。读事务在事务九开始之后、事务七提交之后建立快照，它的可见集合包含事务三与事务七、不含事务九，于是沿版本链从新到旧找，版本三不可见、版本二可见，读到版本二，这就是读者不被写者挡住的完整过程。实现形态有两派：一派把整行新版本追加存放、旧版本留在原地等清理；另一派原地放最新版本、把旧版本串进回滚段的版本链。两派的共同代价是版本链会变长：长事务钉住的旧版本迟迟不能清，读者每次都要沿着长链往下找，读延迟被所有人一起分摊。'
  derivation: original
