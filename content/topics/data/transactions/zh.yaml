level: 进阶
minutes: 20
prereq:
- data/btree-index
- os/file-system
objectives:
- 把 ACID 四性质逐一对应到实现机制
- 按隔离级别列出各自禁止的读现象
- 解释 MVCC 的可见性规则与长事务的危害
aiLink: AI 应用的数据层同样需要事务思维：向量与元数据的双写一致、计费扣额、任务队列的「至少一次 vs 恰好一次」。理解 MVCC 与 WAL，才能读懂现代数据库（含向量库）的并发与持久性设计。
quiz:
- q: COMMIT 返回成功后立刻断电，这笔事务为什么不会丢？
  options:
  - 因为数据页已经全写回磁盘
  - 因为提交前日志已通过 WAL 顺序落盘，恢复时可以 redo
  - 因为内存有备份
  - 因为断电不会影响数据库
  answer: 1
  explain: 持久性靠日志先落盘：数据页可以晚写，日志不行；恢复用日志重做已提交事务。
- q: MVCC 让读不被写阻塞的办法是？
  options:
  - 读时给整表加锁
  - 更新生成新版本，读事务按自己的快照挑可见版本
  - 把写请求排队到半夜执行
  - 禁止并发写
  answer: 1
  explain: 多版本 + 快照可见性：读者看旧版本，写者造新版本，互不等待（写写冲突除外）。
- q: 幻读与不可重复读的区别是？
  options:
  - 没有区别
  - 前者是同一行的值变了，后者是满足条件的行数变了
  - 前者是行数变了，后者是同一行的值变了
  - 幻读只发生在删除时
  answer: 2
  explain: 不可重复读针对单行值的变化；幻读针对查询结果集行数的变化（新行插入/删除）。
