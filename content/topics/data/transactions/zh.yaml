  code:
    lang: sql
    code: "BEGIN;\nUPDATE accounts SET balance = balance - 100 WHERE id = 1;\nUPDATE accounts SET balance = balance + 100 WHERE id = 2;\nCOMMIT;  -- 返回成功前，日志已落盘：断电也丢不了这笔转账"
    note: 两条 UPDATE 在日志里是一个不可分割的事务
    highlight: 4
- id: practice
  title: 工程实践清单
  tldr: 事务要短、冲突要可重试、长事务要监控——大多数线上事故来自把事务当背包什么都往里塞。
  body: '四条实战经验：其一，事务范围最小化：事务里别发网络请求、别等用户输入，持锁/钉快照的时间就是别人的等待时间。其二，为冲突重试做准备：串行化与 MVCC 写冲突都会让事务失败，代码路径要能安全重试（幂等）。其三，死锁不可怕（数据库会检测并牺牲一个事务），怕的是不重试直接报错给用户。其四，批量任务分片提交：一个改一百万行的事务，会产生巨量日志与版本垃圾，拆成每批几百行、逐批提交。

    下一课的 LSM 树把「先记日志、再整理数据」推向极致：连数据本身都只先追加、后合并。'
  derivation: original
  sources:
  - ref: cmu-15445
    locator: 并发控制讲义（死锁处理与事务设计）
    claim: 数据库通过死锁检测牺牲事务，应用需对可重试的事务失败做幂等重试
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
