- id: levels
  title: 四档隔离级别价目表：按业务容忍度在安全与吞吐间选档
  tldr: 从读未提交、读已提交、可重复读到串行化，每升一档多封杀一类异常、也多让出一分并发吞吐；注意各家数据库在同一档名下的底层实现强度并不完全一致。
  body: |-
    四档标准隔离级别就是一份「禁止哪些异常」的价目表：**读未提交（Read Uncommitted）**什么怪象都放行，极少真用；**读已提交（Read Committed）**封杀[[脏读]]，保证读到的全是已提交版本，[[PostgreSQL]] 等主流库以它为默认；**可重复读（Repeatable Read）**再封杀[[不可重复读]]，保证同一事务内反复读同一行结果稳定（[[MySQL]] InnoDB 默认在此档，并用间隙锁等手段一并处理[[幻读]]）；最高的**串行化（Serializable）**三类全禁，效果等价于事务排队串行，最安全也最贵。

    选级别就是选「这条业务能容忍哪种异常」：跑经营统计报表用读已提交足够；涉及扣款扣库存的关键路径，要么升档配显式锁，要么用版本号乐观锁在应用层兜底。同一系统里混用档位才是常态——主库扣款写路径开高档，只读副本统计查询开低档（读写分离时还要叠加副本复制延迟带来的读旧问题，那与单机隔离级别是两码事）。代码评审时，事务隔离级别的声明值得像审金额字段一样逐行审。

    更要避开一个选型大坑：**SQL 标准只规定每档的下限承诺，不是跨数据库的精确行为合同**。比如有的数据库在可重复读档底层跑的是[[快照隔离]]，顺带防住了幻读，却会放行第 9 步的[[写入偏斜]]；分布式数据库的读已提交语义也各有讲究。上手前务必核对所用数据库的官方文档。
  derivation: original
  sources:
