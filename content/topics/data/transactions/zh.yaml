steps:
- id: why
  title: 两个必须解决的问题
  tldr: 并发交错会互相踩，执行中途崩溃会留半成品——事务就是为这两件事发明的打包机制。
  body: '转账：A 扣 100、B 加 100。扣完还没加时进程崩了，钱凭空消失；两个请求同时读到库存 1、各扣一次，库存变 −1。这些不是业务代码 bug，而是「一组操作必须当成一个整体」这个需求没有被满足。

    事务（transaction）就是这层打包：BEGIN 开始，COMMIT 提交，中间任何一步失败就 ROLLBACK 全部撤销；并发执行时，效果要等价于某种串行顺序。数据库为此提供了 ACID 四条性质。

    把超卖的交错时序摆开看：库存只剩 1 件，事务一读到 1、事务二也读到 1，事务一写回 0 并提交，事务二按自己读到的 1 也写回 0 并提交——卖出两件，库存只减了一次，这类错误叫丢失更新。它不是代码写错了，而是两个事务的读写交错破坏了各自眼中的世界。再叠加崩溃维度：转账扣了 A 还没给 B 加上时断电，数据就停在钱少了 100 的中间态。并发交错与中途崩溃是两个正交的维度，事务机制必须同时封住它们，这就是它存在的全部理由。'
  derivation: original
  sources:
