- id: savepoints
  title: "[[保存点]]部分回滚：百行导入第 57 行出错，只退半步保前功"
  tldr: "[[保存点]]在事务内部的撤销链上插一枚位置书签，出错时只需回滚到书签处抹掉后续操作，书签之前的成果与外层事务本身继续存活。"
  body: |-
    一批任务导入 `100` 行数据，跑到第 `57` 行格式报错——要是整笔事务一退到底，前 `56` 行全部白干，重跑成本与日志开销都很冤。**[[保存点]]（Savepoint）**就是插在事务内部的后悔药书签：先给当前位置起名打标，后面出错时只回滚到该保存点，抹掉书签之后的操作，前 `56` 行稳稳留住，外层事务也不结束，修好数据接着往下跑；不再需要时释放掉书签即可。

    底层实现上它几乎免费：保存点只是日志与 [[undo]] 撤销链上的一个位置标记，所谓部分回滚，走的还是整事务回滚那同一套撤销机制，只是退到书签处提前停手。日常开发常在三处见到它：批处理导入容错、应用框架模拟「嵌套事务」（外层开真事务，内层每进一层打一个保存点）、以及试探性写入校验。

    唯独要记住两条边界：第一，保存点不是独立子事务，不能单独提交，一旦外层事务最终整体回滚，书签内外的成果一律清零；第二，退回保存点后书签之后拿过的锁放不放，依各家数据库实现而定，不能想当然。
  derivation: original
  sources:
  - ref: cmu-15445
    locator: 恢复与事务处理讲义（保存点与部分回滚）
    claim: 保存点是撤销链上的位置标记，回滚到保存点只撤销其后操作而事务继续
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
