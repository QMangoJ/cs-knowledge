title: 事务：ACID、隔离级别与 MVCC
summary: 事务把一组操作绑成同生共死的原子单位：靠 [[undo]] 撤销半截操作、靠预写日志（[[WAL]]）加 [[redo]] 兜住断电不丢、靠锁或多版本并发控制（[[MVCC]]）隔开并发干扰，再与应用层逻辑共同守住 [[ACID]] 四条底线。本课顺着转账与抢库存场景，拆解三种并发读异常与四档隔离级别取舍，走通 MVCC 版本链可见性、[[两阶段锁]]、[[乐观并发控制]]、[[写入偏斜]]与[[保存点]]，最后收成线上事务治理铁律。
premise: A 向 B 转账 100 元要连改两行账户记录，刚给 A 扣完 100 进程突然崩了，钱凭空蒸发；或者两个人同一毫秒盯上最后 1 件库存，双双读到 1 又各自写回 0，仓库当场超卖。面对「中途崩溃留半截」和「并发读写撞成一团」这两场日常事故，数据库靠什么把一组操作焊成整体，又怎么在不锁死全表的前提下挡住错乱？
position: 本课位于数据存储学科第三板块「事务：并发与崩溃下的规矩」，承接上一课引擎内幕里的 [[undo]]、[[redo]] 与版本链底座，把单笔读写的物理机制升级为多事务并发与断电恢复的完整契约。学完你能把[[脏读]]、[[不可重复读]]、[[幻读]]对回四档隔离级别，并按快照规则手算读事务在版本链上挑中哪一版。
bridge:
  prev: 上一课已经看到一笔更新怎样改脏内存页、把旧值抄进 [[undo]]、靠 [[redo]] 刷盘提交；这一课正式接管这套零件之上的并发与恢复规矩：当两个事务同时读到库存为 1 或转账半途断电时，数据库靠什么保住账面不乱。
  next: 本课的预写日志立下了「顺序记账在先、数据页随机落盘在后」的铁律；下一课的 LSM 树干脆把这条思路推到极致——连主数据本身也不再原地涂改，一律改成顺序追加、留给后台慢慢合并。
overview:
- key: 一句话总结
  value: 事务用 BEGIN / COMMIT / ROLLBACK 把多步读写绑成一个整体：中途崩了全退回，并发跑起来像排好队一个个执行。
- key: "[[ACID]]"
  value: 原子性（A）靠 [[undo]] 回滚半成品；持久性（D）靠 [[WAL]] 预写 [[redo]] 加 [[fsync]]；隔离性（I）靠锁或 [[MVCC]]；一致性（C）则是前三者配合数据库约束与应用逻辑共同守住的业务不变量。
- key: 三种读现象
  value: "[[脏读]]是读到别人未提交的半截数据；[[不可重复读]]是同一事务两次读同一行值变了；[[幻读]]是同一条件两次查结果集行数变了。"
- key: 隔离级别
  value: 从松到严依次为读未提交、读已提交、可重复读、串行化；档位越高封杀的异常越多，并发吞吐代价也越重，按业务容忍度按需选档。
- key: "[[MVCC]]"
  value: 写操作不原地覆盖旧值，而是挂出带事务号的新版本；读操作按启动时领到的快照沿版本链挑可见旧版，读写从此互不阻塞。
- key: "[[WAL]]"
  value: 任何脏页落盘前日志必须先顺序刷盘，崩溃后用 redo 重做已提交、用 undo 撤销未提交；高并发下靠组提交把多笔日志拼成一批刷盘摊薄延迟。
