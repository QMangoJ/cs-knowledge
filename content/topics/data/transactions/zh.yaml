- id: practice
  title: 工程实践清单
  tldr: 事务要短、冲突要可重试、长事务要监控——大多数线上事故来自把事务当背包什么都往里塞。
  body: '四条实战经验：其一，事务范围最小化：事务里别发网络请求、别等用户输入，持锁/钉快照的时间就是别人的等待时间。其二，为冲突重试做准备：串行化与 MVCC 写冲突都会让事务失败，代码路径要能安全重试（幂等）。其三，死锁不可怕（数据库会检测并牺牲一个事务），怕的是不重试直接报错给用户。其四，批量任务分片提交：一个改一百万行的事务，会产生巨量日志与版本垃圾，拆成每批几百行、逐批提交。

    下一课的 LSM 树把「先记日志、再整理数据」推向极致：连数据本身都只先追加、后合并。

    重试这条要划清边界：可串行化失败与写冲突失败之所以能自动重试，前提是事务的全部效果都还在数据库内、重放一遍没有外部副作用。若事务里已经给用户发了短信、调了第三方支付，失败后无脑重放就会重复发送、重复扣款。正确姿势是把不可撤销的外部动作移出事务，或给外部动作配幂等键与状态机，让重放天然安全。再给三个先于平均延迟报警的监控指标：最长活跃事务的年龄、每分钟死锁次数、锁等待队列的长度，线上事故在这三个数上露头的时间，远早于用户投诉。

    最后一条关于观测：事务的健康指标本身就应该上看板——可串行化中止率、死锁发生率、长事务数量、锁等待时长，任何一个突然抬头，都说明负载形态或代码路径发生了变化。把这些曲线与业务发布时间轴对齐看，往往能在一行新上线的慢查询或一次批量任务的改版酿成事故之前就定位到它。事务治理的顺序也由此而来：先能看见，再谈优化；看不见的长事务与死锁，是在用整个实例的吞吐为一行没人注意的代码还债。'
  derivation: original
  sources:
  - ref: cmu-15445
    locator: 并发控制讲义（死锁处理与事务设计）
    claim: 数据库通过死锁检测牺牲事务，应用需对可重试的事务失败做幂等重试
    status: verified
