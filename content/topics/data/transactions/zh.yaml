- id: wal
  title: WAL 与崩溃恢复：日志先走一步
  tldr: 规矩只有一条：数据页可以晚点落盘，但它对应的日志必须先落盘（write-ahead）。
  body: '持久性的实现细节：改数据时，先在日志里顺序追加一条记录（包含 redo 信息：改成什麼；与 undo 信息：原来是什麼），日志刷盘后内存里的数据页可以慢慢写回。崩溃后恢复：读日志，已提交事务的改动 redo（哪怕数据页还没写回去），未提交事务的改动 undo 撤销。

    顺序写日志 + 随机写数据页的组合，也是日志型设计（回想 LSM、下一步）反复出现的母题：顺序 IO 便宜，随机 IO 贵；先把「能重建一切的顺序日志」攥在手里，剩下的数据整理可以从容慢慢做。COMMIT 的延迟主要就是等这一次日志 fsync，所以「组提交」（把多个事务的日志合并一次刷）是高吞吐数据库的标配优化。

    再补检查点这块拼图：日志不能无限长，数据库会周期性做检查点，把内存里的脏数据页刷回磁盘，并记录一个恢复起点，起点之前的日志在恢复时不必再重放，对应文件也可以回收。没有检查点，一次崩溃要从盘古开天地的第一条日志开始重放，恢复时间不可接受。另一笔账是刷盘成本：提交延迟的下限就是一次日志刷盘的时间，组提交的办法是设一个极短的等待窗口，把窗口内到达的多个事务的日志拼成一批一次刷完，每个事务分摊到的刷盘成本趋近于零，吞吐因此能拉高一个量级。这笔顺序写加批量刷的账，在 LSM 一课的写路径里会原样再出现一次。'
  derivation: original
  sources:
  - ref: cmu-15445
