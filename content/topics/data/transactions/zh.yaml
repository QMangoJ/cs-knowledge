- id: write-skew
  title: 快照隔离的盲区：写入偏斜
  tldr: 各改各的行、没有写写冲突、不变量却被打破——快照隔离防不住的经典异常长这样。
  body: '快照隔离听起来很强：每个事务读一份一致快照，只有改到同一行才冲突。但它有一个教科书级的盲区叫写入偏斜。场景是医院排班，不变量是每个班次至少要有一名医生在岗。某班次有医生甲与乙两人在岗。事务一看快照：两人在岗，我请假没问题，于是把自己改成休假——改的是甲自己的行。事务二同时看同一份快照：两人在岗，我请假也没问题，把乙自己的行改成休假。两个事务改的是不同的行，没有任何写写冲突，在快照隔离下双双提交成功。结果是这个班次零人在岗，不变量被打破，而把每一步单独拎出来看都完全合法。根子在于：快照隔离只检查行级的写冲突，而这条不变量横跨两行，每个事务的决策依据（两人在岗）被对方的提交悄悄作废，它却毫不知情。解法有三条：一是把不变量物化成一行让大家争，比如班次在岗计数行，两个事务都要改它，写冲突就会触发、其中一个被迫重试并在新快照下改变决定；二是只对这条关键路径升到可串行化；三是显式对相关行加锁。这也点破一个常见误解：可重复读不等于串行化，两者的差距恰恰藏在这种跨行不变量里。'
  derivation: original
  sources:
  - ref: cmu-15445
    locator: 并发控制讲义（快照隔离与写入偏斜异常）
    claim: 快照隔离下修改不同行的事务可共同破坏跨行不变量，即写入偏斜异常
    status: verified
    checkedBy: Muse 核查
