- id: two-phase-locking
  title: 两阶段锁：规则与死锁检测
  tldr: 先拿锁后办事、拿锁与放锁分两个阶段，锁点决定等价顺序；等待成环就是死锁，检测到环就牺牲一个。
  body: '悲观路线的基本法是两阶段锁。加锁规则：读数据前先拿共享锁，写数据前先拿排他锁；共享锁之间互相兼容，排他锁与任何锁都不兼容，拿不到就等。阶段规则：整个事务分成增长与收缩两段，增长段只许拿锁不许放锁，收缩段只许放锁不许再拿新锁，第一次释放锁的时刻叫锁点。可以证明，按锁点排序就是一个等价的串行顺序，这就是两阶段能保证可串行化的原因。严格两阶段锁再加一条：排他锁必须攥到事务提交或回滚才放，这样别人读不到未提交数据，也不会发生级联回滚。死锁走例：事务一锁住账户 A 后想锁 B，事务二锁住 B 后想锁 A，两边都在等对方先放，等待关系画成图正好成环。数据库的解法是维护等待图并周期性检测环，发现环就挑一个代价最小的事务当牺牲者回滚（比如已改动行数最少的那个），其余事务继续；再配上锁等待超时作兜底。代价也明摆着：锁持有多久，并发就被堵多久，热点行会被排成长队，这正是下一条路线的出发点。'
  derivation: original
  sources:
  - ref: cmu-15445
    locator: 并发控制讲义（两阶段锁与死锁检测）
    claim: 两阶段锁以锁点保证可串行化，等待图成环即死锁，数据库检测成环后回滚牺牲者
    status: verified
    checkedBy: Muse 核查
