steps:
- id: why
  title: 两个必须解决的问题
  tldr: 并发交错会互相踩，执行中途崩溃会留半成品——事务就是为这两件事发明的打包机制。
  body: '转账：A 扣 100、B 加 100。扣完还没加时进程崩了，钱凭空消失；两个请求同时读到库存 1、各扣一次，库存变 −1。这些不是业务代码 bug，而是「一组操作必须当成一个整体」这个需求没有被满足。

    事务（transaction）就是这层打包：BEGIN 开始，COMMIT 提交，中间任何一步失败就 ROLLBACK 全部撤销；并发执行时，效果要等价于某种串行顺序。数据库为此提供了 ACID 四条性质。'
  derivation: original
  sources:
  - ref: cmu-15445
    locator: 事务与并发控制讲义（ACID 与调度）
    claim: 事务将一组操作作为原子单位执行，并发调度需保证等价于某种串行顺序
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
