- id: acid
  title: ACID 各自靠什么实现
  tldr: 原子性靠 undo 日志，持久性靠 redo 日志 + fsync，一致性靠约束，隔离性靠锁或 MVCC。
  body: '逐条拆开看机制，别停在背单词：A 原子性——要么全生效要么全回滚，靠日志记录「改之前的值」，回滚时反着擦（undo）。C 一致性——事务前后数据满足约束（外键、唯一、余额非负），这是数据库约束与应用逻辑共同的责任。I 隔离性——并发事务互不干扰，靠加锁（悲观）或多版本（MVCC）实现，下一课的主角。D 持久性——COMMIT 返回成功后哪怕立刻断电也不能丢，靠把日志先落盘（WAL + fsync，与文件系统一课的 fsync 是同一件事）。

    注意 I 与 D 的成本最高：真实系统常把隔离级别往下调来换吞吐，这是后面几步的主题。

    一致性这条最容易背错：数据库能自动保证的只有声明过的约束，如唯一、外键、检查约束；转账前后总金额守恒这类业务不变量，数据库根本不知道，必须靠应用把相关操作放进同一事务、并写对逻辑。换句话说，原子性、隔离性、持久性是数据库提供的机制，一致性是机制加约束加应用逻辑共同守住的结果。还有一层关系常被忽略：原子性的回滚要靠旧值来撤销，所以改之前必须先把旧值记进日志，这与持久性要求的日志先行其实是同一条纪律的两面，下一课讲 WAL 时会合流。'
  derivation: original
