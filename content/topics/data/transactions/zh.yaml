- id: savepoints
  title: 保存点：事务内部的部分回滚
  tldr: 整批回滚太浪费时，在事务里打书签：错了只退到书签处，事务本身继续活着。
  body: '场景很具体：一批导入一百行，跑到第五十七行格式出错，整个事务回滚等于前五十六行白干，大事务重跑的成本与日志量都难看。保存点就是事务内部的书签：执行保存点语句给当前位置起个名字，之后出错时回滚到这个保存点，只撤销书签之后的操作，书签之前的工作保留，事务本身不结束，修正数据后可以接着往下跑；不再需要时用释放语句删掉书签。机制上它几乎免费：保存点只是日志与撤销链上的一个位置标记，所谓部分回滚就是顺着撤销记录退回到这个标记处，与整事务回滚走的是同一套撤销 machinery，只是停得早。它的常见化身有三个：批处理与数据导入的容错、应用框架用它模拟嵌套事务（外层是真的事务、内层每进一层打一个保存点）、以及试探性写入——先把数据写进去做完整校验，不过关就退回保存点当无事发生。但有两条边界必须记住：保存点不是子事务，它不能独立提交，外层事务一旦整体回滚，书签内外的成果一起清零；另外回滚到保存点之后，书签之后拿到的锁如何处理依实现而定，写代码时不能想当然。'
  derivation: original
  sources:
  - ref: cmu-15445
    locator: 恢复与事务处理讲义（保存点与部分回滚）
    claim: 保存点是撤销链上的位置标记，回滚到保存点只撤销其后操作而事务继续
