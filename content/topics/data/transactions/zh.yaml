- id: anomalies
  title: 三种读现象：隔离不够时会看到什么
  tldr: 脏读、不可重复读、幻读——名字按「读到的东西有多不可信」排序。
  body: '脏读：事务 T1 改了余额还没提交，T2 读到了这个中间值；T1 随后回滚，T2 相当于读到了一个从未存在过的值。不可重复读：T1 两次读同一行，中间 T2 把这行改了并提交，两次结果不同。幻读：T1 两次按条件查一批行，中间 T2 插入了新行并提交，第二次多出几行像幻觉——与不可重复读的区别是针对「行集合」而非某一行。

    这三种现象是 SQL 标准定义隔离级别的坐标系：每个级别就是一份「允许出现哪些现象」的清单。

    各补一个走例。不可重复读：事务一先读到余额 100 并据此决定放行一笔支付，事务二把余额改成 80 并提交，事务一复核时读到 80，两次读数打架，放行依据已经失效。幻读：事务一统计余额过万的账户有 5 个并准备按此发报表，事务二新插入一个达标账户并提交，事务一再统计变成 6 个，报表口径在同一事务内漂移。脏读的危害最重：读到的是别人未提交的中间值，若据此再写别的数据，未提交事务一回滚，污染已经扩散出去收不回来，所以读未提交这一档在真实系统里几乎没人敢开。'
  derivation: original
  sources:
