- id: spectrum
  title: 回望：主从复制站在一致性谱系的哪一格
  tldr: 异步主从是最典型的最终一致：写只在一处成立，读到新值的时间取决于复制追赶到哪儿。
  body: '把这一课的概念与更大的地图对一下。主库自己是强一致的：写完立刻在主库读，必是新值。从库则是最终一致的活标本：只要复制还在追赶，改动迟早会到达每个副本，但「迟早」没有时间承诺——这正是最终一致（eventual consistency）的字面含义。读写分离架构，本质上是把「读」按价格分成了两等：主库的读是现货，从库的读是期货。

    半同步往强一致的方向挪了一格：它保证已提交的账至少在两处有据，把宕机丢失的窗口压小，但读从库仍然可能读到旧值——它加强的是持久性，不是读的新鲜度。想让从库的读也「读到已提交的最新」，就得让读去等重放进度，那就等于把延迟转嫁给读路径。谱系上的每一格，都是延迟、可用性、正确性三者之间的一次重新出价，没有一格是免费的。

    这张谱系图先在本课画个轮廓：强一致、因果一致、最终一致各自的定义与代价，是分布式系统那一科的正题。到那时你会发现，主从复制里这些说不清的别扭——等签收、认丢失、防脑裂——在更大的世界里都有正式的名字与成熟的解法。

    谱系中间还藏着几格细格，先混个脸熟：读己之写（自己刚写的，必须自己能立刻读到）、单调读（同一个读者读到的版本只许前进不许倒退）。主从架构里这两格恰恰是最常被延迟击穿的——换一台从库刷新，昵称又变回旧的，就是单调读被击穿的样子。把用户的不满翻译回谱系的格子，是设计读写分离时最实用的功夫。'
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: src
      id: s
      label: 主库：写后即读 = 强一致
    - lane: replica
      id: r
      label: 从库：迟早到达 = 最终一致
      highlight: true
