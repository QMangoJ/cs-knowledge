steps:
- id: why-replicate
  title: 为什么要把数据复制到别的机器
  tldr: 读要分摊、机器会坏、备份不能扰主——三个理由背后是同一招：让同一份数据活在多台机器上。
  body: '先说清复制要解决的问题。第一是读的压力：一台机器的 CPU 与磁盘有上限，而读请求可以水平摊开——主库专心收写，几台从库分头接读，这是绝大多数系统长出主从结构的第一个理由。第二是容灾：机器会坏、机房会断电，主库倒下时若数据只有一份，业务只能停摆等它复活；有副本在，就能把一台从库扶正顶上。第三是杂活隔离：跑报表、做全量备份这类重活会拖慢主库，把它们挪到从库上，主库只管在线业务。

    三个理由指向同一招：让同一份数据活在多台机器上，并且保持内容一致。难点随即出现：主库每改一行，从库们就得跟着改同一行，一台也不能落下、一行也不能改错、顺序也不能乱。

    解法的骨架你在底层之旅里已经见过：日志。单机内部靠 redo 让数据文件「迟早追上」内存；跨机器时同理——把主库的每一次改动按顺序记成一本账，从库把账拉回去照着重放一遍，就能走出一条与主库相同的时间线。复制的全部学问，就是把这本账记得对、传得稳、放得快，以及账传不过去时怎么办。

    有一条边界先划清：复制摊得开读，摊不开写。所有写仍然只能进主库这一道门，从库再多，写的总吞吐仍等于一台机器的上限——这正是分片（把数据按范围拆给多个主）要解决的问题，不在本课范围。本课的主从结构里，主库是全系统唯一的写入口，这既是它的简单之处，也是它规模的天花板，更是后面脑裂悲剧的根源：唯一入口一旦被复制出第二个，秩序立刻崩坏。'
  derivation: original
