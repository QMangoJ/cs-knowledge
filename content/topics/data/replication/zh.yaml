- id: lag-consequences
  title: 延迟的用户后果：刚写完就读，可能读不到
  tldr: 写走主、读走从的架构里，延迟意味着「你刚改的数据，刷新页面却没变」；对策是给关键读留一条回主库的路。
  body: '延迟落到用户头上的样子很具体：你在主库上刚把昵称改掉，页面随即去从库刷新，读到的还是旧昵称——不是没存上，是从库还没重放到那一笔。这类「写后读不一致」是主从架构与生俱来的体验税，所有「写主读从」的系统都要正面回答它。

    对策按严格程度排成一列。最松的是接受它：评论数、点赞数这类读到几秒前数据的场面无伤大雅，什么都不做。中间档是会话粘性：同一个用户写完之后的一小段时间，他的读继续走主库，等从库追平了再切回去。最严的是显式等位：读从库之前，先让会话确认从库已经重放到自己刚提交的那笔事务之后（MySQL 提供了等待指定事务被重放完成的机制）——正确性拉满，代价是读延迟被从库的追赶速度绑架。

    这三档没有标准答案，只有业务对「不一致窗口」的出价。但有一条要记死：永远不要在不知情的情况下默认最松的那档。主从延迟平时以毫秒计，赶上大促或大事务就是几十秒；在设计读写分离时，先问清每个读场面能容忍多旧的数据，再决定它走主还是走从。

    工程上的落点通常在路由层：应用或中间件为每条读标注「能忍多旧」，忍不了的直接打到主库，忍得了的才被分给从库，还要给从库的延迟设一道闸——落后超过阈值的从库先摘出读池，等追平了再放回来。读写分离从来不是把连接串改一改就完事，它是把一致性与延迟的取舍，郑重地写进了每一次读的路由决定里。'
