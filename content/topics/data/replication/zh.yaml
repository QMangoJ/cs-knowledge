- id: formats
  title: 账怎么记：STATEMENT、ROW 与 MIXED
  tldr: 记原话短小但怕不确定函数，记行变化确凿但臃肿，混合格式让引擎按条自动选。
  body: '账的记法有三种。第一种 STATEMENT（语句格式）：把你执行的 SQL 原话记进账里，从库照着原话重跑一遍。它的好处是账本短小——一句更新一百万行的语句，账上只占一行；坏处是原话里藏着不确定因素：NOW()、UUID() 这类每次执行结果都不同的函数，主从两次跑出的值会不一样；带 LIMIT 又没排序的删除，两边删掉的可能不是同一批行。原话重放等于把「结果取决于执行上下文」的风险原样复制过去。

    第二种 ROW（行格式）：不记原话，记每一行改动前后的具体值。那句更新一百万行的语句，在账上要老老实实躺一百万条行事件，账本臃肿得多；换来的是确凿——从库不需要理解语句、不需要重跑逻辑，照着行变化直接落值，主从绝不跑偏。它是现代 MySQL 的默认格式，官方甚至已预告语句格式未来将被淘汰：宁可账厚一点，也要结果确定。

    第三种 MIXED（混合格式）：默认按语句记，引擎判定某条语句带不确定因素时自动切换成行格式，想兼得短小与安全。三种记法没有谁全胜：账的厚度与重放的确定性，是一笔要按场景算的账——这也是分布式系统里「传命令还是传结果」这个母题的第一次亮相。

    再补一笔行格式的小脾气：它记的是每行改动前与改动后的完整镜像（按配置可以只记改动列），所以一条 UPDATE 哪怕只改了一个字节，账上也要躺下整行的前后样子。在写密集、行又宽的表上，binlog 的体积可能比数据本身长得还快，磁盘与网络先于业务被账压满——运维盯 binlog 的大小，与盯数据文件同样认真。'
  derivation: original
  sources:
  - ref: mysql-replication-docs
    locator: 19.2.1 Replication Formats（复制格式与默认格式）
    claim: 语句格式记录 SQL 原文并在从库重新执行，行格式记录每行如何被改变且为默认格式，混合格式按语句情况自动切换；语句格式曾用函数的不确定性是其主要风险
