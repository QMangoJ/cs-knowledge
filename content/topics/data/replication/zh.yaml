id: data/replication
subject: data
slug: replication
order: 7
status: published
license: CC-BY-4.0
title: 主从复制：一本账，多个副本
summary: 把主库的每次改动记成一本跨机器的账，从库照着重放追赶——读扩展、容灾与延迟、脑裂，全从这一条复制链上长出来。
premise: 以 MySQL 主从复制为样本：一台主库（Source）带两台从库（Replica），默认异步复制，binlog 采用默认的 ROW 格式。
position: >-
  本课位于数据存储板块的压轴一段「复制：一本账，多个副本」，是本科把视野从一台机器推向多台机器的第一步：前面几课的日志、锁与事务都发生在一台机器内部，本课看同一本账被送到别的机器上重放时，要多付哪些代价、多担哪些风险。学完你能画出一条复制链的完整解剖，能说清从库延迟的成因链，也能解释故障切换与脑裂为什么是复制的原生难题、而不是实现没做好。
bridge:
  prev: >-
    上一课的锁把单台机器内部的写秩序管到了极致，可秩序再好也只护得住一台机器；本课把账本复制到别的机器上：当数据有了多个副本，新的问题不再是「谁先改」，而是「别人什么时候才知道我改了」。
overview:
- key: 一句话总结
  value: 主库把改动写进 binlog 这本跨机器的账，从库把账拉回去照着重放，于是每个副本都沿同一条时间线往前走
- key: binlog 与 redo 的分工
  value: redo 记物理页改动、给自己崩溃恢复用；binlog 记逻辑事件、给别的机器重放用
- key: 三种记录格式
  value: STATEMENT 记原话、ROW 记每行变化（默认）、MIXED 自动切换，各有翻车点
- key: 延迟的本质
  value: 默认异步：主库提交不等从库，从库重放的速度追不上主库写入的速度时，差距就以秒计地攒下来
- key: 切换与脑裂
  value: 主库故障时要选最不落后的从库顶上；网络分区时若两个主同时收写，两本账从此分叉
- key: 与 D1 的呼应
  value: D1 的「单个写者加日志复制到全球副本」与主从复制是同一副骨架，只是主的位置由平台托管
