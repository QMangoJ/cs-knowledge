steps:
  - id: why-replicate
    title: 复制摊得开读流量与容灾，却摊不开单点写入口
    tldr: 主从复制用一本按序传递的改动账本同时解决读扩展、故障容灾和重查询隔离三件事；但全系统写请求依然只进主库一道门，写吞吐上限没变，唯一入口一旦裂成两个就会引发[[脑裂]]。
    body: |-
      线上数据库迟早会被三股力量逼出单机：第一是读压力，单台机器的 [[CPU]] 与磁盘有硬上限，把写留给主库、把读水平摊给几台从库是最直接的扩容手段；第二是容灾，机器会坏、机房会断电，只有一份数据时主库倒下业务就得停摆，有副本才能随时挑一台从库扶正顶上；第三是重活隔离，跑大报表、做全量备份会抢占在线事务的资源，挪到从库执行才能护住主库延迟。

      三个诉求指向同一个目标：让同一份数据活在多台机器上，而且每改一行，所有副本都得一字不差、顺序不乱地跟上。解法的骨架你在单机存储里已经见过——日志。单机内部靠 [[redo]] 让磁盘数据页迟早追上内存；跨机器同样如此：主库把每次改动按顺序记成一本账，从库把账拉回去重放一遍，就能走出一条跟主库完全一致的时间线。

      动手前必须先把边界划死：**复制摊得开读，摊不开写**。无论挂多少台从库，所有写请求依然只能进主库这一道门，总写吞吐仍然受限于单台主库的上限（想摊开写得靠按范围拆库的分片，不在本课范围）。「全局唯一写入口」既是主从复制足够简单的原因，也是后面[[脑裂]]悲剧的总根源——只要场上同时冒出第二个收写的主库，两本账立刻分叉。
    derivation: original
    canvas:
      kind: swimlane
