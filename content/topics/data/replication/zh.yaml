objectives:
- 画出一条复制链：主库写 binlog、从库拉账存 relay log、再重放
- 区分 binlog 与 redo 各自记录什么、服务于谁
- 沿成因链解释从库延迟，并给出读写分离时的三档对策
- 说清故障切换的裁决难点与脑裂为什么无法自动愈合
aiLink: 大模型服务同样在做复制：模型权重与 KV 缓存要分发到许多推理节点，灰度发布与故障摘除的裁决逻辑与主从切换一脉相承；先懂数据库的复制，才懂推理基础设施为什么那样调度副本。
design:
- mechanism: 为什么复制传的是日志，而不是定期把数据文件整个拷过去
  problem: 根本约束是变化量远小于存量：一台跑了多年的主库有上百 GB 数据，而每秒真正变化的可能只有几百 KB；若靠整表拷贝同步，副本永远在搬运旧数据，追赶速度被拷贝带宽锁死，延迟以小时计
  choice: 做法是只传变化本身：主库把每次改动按发生顺序记成一本逻辑账，从库按账重放；传的量与改动量成正比，与存量无关，且账的顺序天然就是主库的时间线，从库只需照单全收
  tradeoff: 代价是重放要再付一遍执行成本，且账的记法要在厚度与确定性之间二选一（语句格式薄而险、行格式厚而稳）；从库一旦落后太多、账又被主库清理掉，就只能重新全量拷贝一份再接着追，复制链没有断点续传的无限耐心
  root: 根子在增量与全量的不对称：任何同步问题，先问能不能只传差量。日志是变化的最小完备表示，又自带全序，它同时是单机恢复的答案与跨机复制的答案——同一件武器，打通了两个战场
- mechanism: 为什么复制默认异步，而不是等从库都确认了才回复提交成功
  problem: 根本约束是延迟与可用性的连坐：同步等待意味着每次提交的延迟都要加上网络往返与最慢从库的处理时间，更致命的是任何一台从库故障或网络抖动，都会直接传导成主库不可写——副本本是来保命的，反而成了新的故障源
  choice: 做法是分层设防：默认异步，主库先对自己负责、提交不等任何人；把同步做成可选档（半同步只等一台签收），让真正怕丢数据的业务按需购买，而不是让全体为最严的保证买单
  tradeoff: 代价是异步窗口内的已提交事务在主库宕机时会蒸发，读写分离还要额外背负写后读不一致的产品问题；这些代价不会消失，只是被挪到切换与读路径上慢慢偿还
  root: 根子仍是那条熟悉的出价逻辑：先让本地成立，远程慢慢还——redo 之于数据页、异步复制之于副本，是同一个手势在不同尺度上的重演。系统的每一层都在重复这个决定，因为每一层面对的都是同一组物理事实
- mechanism: 为什么脑裂没法靠复制协议自己解决，必须把裁决权交给链之外的多数派
  problem: 根本约束是不可区分性：网络分区时，一方收不到另一方的消息，这与对方进程已死、机器已毁在观察上完全一样；任何只靠链内消息的协议，都无法排除「我以为它死了、其实它活得好好的」这种情形，于是双主并存永远防不干净
  choice: 做法是把「谁有资格当主」从复制链里剥离出来，交给一个由多数派构成的外部裁决：只有拿到多数派认可的一方能自立为主，少数派一侧宁可停写；裁决机制本身就是下一科要讲的共识问题
  tradeoff: 代价是系统多了一层要部署与运维的组件，且在分区时少数派一侧必然牺牲可用性——但与两本账分叉后的人工裁决相比，这笔代价便宜得多，属于提前买好的保险
  root: 根子是信息论意义上的无解：当观察不足以区分两种世界时，任何协议都不能保证在两个世界里都做对。工程上的出路从来不是更聪明的猜测，而是引入新的信息渠道——多数派投票，就是给系统多开了一双眼睛
