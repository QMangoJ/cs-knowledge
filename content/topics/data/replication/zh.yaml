    log:
      - mode: 解剖
        event: 两本账分工不同：记物理页改动的账管本机崩溃复活，记逻辑事件的账管跨机器同步
  - id: formats
    title: 记原话省体积怕跑偏，记行变化臃肿却最笃定
    tldr: "[[binlog]] 有三种记法：[[STATEMENT]] 记 SQL 原文最省空间，但遇上 NOW()、UUID() 等不确定操作会主从跑偏；[[ROW]] 逐行记前后镜像体积最大却绝对确定，是现代 [[MySQL]] 默认值；[[MIXED]] 按语句自动切换。"
    body: |-
      同一笔数据修改，[[binlog]] 有三种记账格式，对应分布式系统里经典的「传命令还是传结果」之争。第一种是 [[STATEMENT]]（语句格式），把执行的 [[SQL]] 原话记进账本，从库拿原话重跑一遍：一句更新一百万行的语句在账上只占一行，体积最小；致命伤是原话里藏着不确定因素——`NOW()`、`UUID()` 这类函数主从两次执行算出的值不同，不带 `ORDER BY` 的 `DELETE ... LIMIT` 在两边删掉的也可能不是同一批行，主从数据就此悄悄漂移。

      第二种是 [[ROW]]（行格式），不记 SQL 原话，老老实实记每一行修改前后的具体数值。同样那句更新一百万行的语句，账本里要躺满一百万条行事件，体积暴涨；换来的是铁板钉钉的确定性——从库不必理解查询逻辑、也不重算函数，照着行镜像直接落值，主从绝不跑偏。现代 [[MySQL]] 默认采用 ROW 格式，官方也已预告未来将逐步淘汰语句格式：在数据库眼里，结果确定永远排在省空间前面。

      第三种是 [[MIXED]]（混合格式），平时按语句记，一旦引擎识别出语句含有不确定因素就自动切回行格式，试图兼顾体积与安全。还要留心 ROW 格式的一个工程细节：默认配置下它会记下整行修改前后的完整镜像，哪怕一条 `UPDATE` 只改了一个字节，宽表里几十个未改字段也要跟着写两遍；在写密集的大宽表上，binlog 增长速度甚至会反超数据文件本身，先把磁盘与内网带宽吃满。
    derivation: original
    sources:
      - ref: mysql-replication-docs
        locator: 19.2.1 Replication Formats（复制格式与默认格式）
        claim: 语句格式记录 SQL 原文并在从库重新执行，行格式记录每行如何被改变且为默认格式，混合格式按语句情况自动切换；语句格式曾用函数的不确定性是其主要风险
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
    canvas:
      kind: swimlane
      actors:
        - lane: src
          id: s
          label: 主库：为每次改动选记法
          highlight: true
        - lane: log
          id: g
          label: binlog：原话 / 行变化 / 自动切换
      messages:
        - id: m1
          from: s
          to: g
          label: ROW 是默认：账厚，但确凿
          active: true
      registers:
        - name: STATEMENT
          value: 短小，怕不确定函数
        - name: ROW
          value: 臃肿（默认），结果确定
        - name: MIXED
          value: 引擎按条自动切换
    log:
      - mode: 格式
        event: 账里传命令还是传结果，是所有复制系统在记账之前都要先答的一道题
  - id: async-lag
    title: 默认异步不等人：主库并发写、从库排队放攒出延迟
    tldr: 默认异步复制下主库写完 [[binlog]] 即回客户端成功；主库多线程并发落账而从库重放速度受限（尤其遇上百万行大事务与读流量争抢），写快放慢的速度差就会累积成 [[Seconds_Behind_Source]] 延迟。
    body: |-
      [[MySQL]] 主从复制默认是纯异步的：主库把事务写进 [[binlog]]、提交引擎后立刻回复应用「成功」，至于从库拉没拉走、重放完没有，主库一概不等。这种彻底解耦保住了主库极低的写入延迟，代价全记在了「主从延迟」这本账上。

      延迟是怎么一秒秒攒出来的？根源在于两端吞吐不对等：主库由几十个业务连接多线程并发写入，从库早年却只有一个 SQL 线程串行重放——十车道汇成独木桥，到达速率大于处理速率，队列自然越排越长，`SHOW REPLICA STATUS` 里的 [[Seconds_Behind_Source]] 读数随之节节攀升。遇上更新百万行的大事务更是雪上加霜：主库提交完一拍屁股走了，从库必须把这一百万条行事件整块啃完才能处理下一笔；加上从库还要承接线上读请求，[[CPU]] 和磁盘带宽还得被读流量分走一半。

      现代 MySQL 支持开启 `replica_parallel_workers` 多线程并行重放，由协调线程分析事务间有没有写冲突，把互不干扰的事务分发给多个工作线程同时执行，把主库原本的并行度复原出来。但并行重放只能治「有并行空间却串行放」的瓶颈，若主库长期写入速率超过从库硬件极限，积压迟早还会冒头。另外看监控时要懂 `Seconds_Behind_Source` 的脾气：它是拿「当前正在重放的事件在主库生成的时刻」与从库本地时钟做差算出来的，啃大事务中途读数会陡然飙高、啃完瞬间归零，设告警要盯持续趋势而非单秒毛刺。
    derivation: original
    sources:
      - ref: mysql-replication-docs
        locator: 19.4.10 Semisynchronous Replication 与 19.2.3 Replication Threads（异步语义与并行应用线程）
        claim: MySQL 复制默认为异步，主库不确认从库是否已收到事务；从库可配置 replica_parallel_workers 用协调线程加多个工作线程并行应用 relay log 中的事务
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
    canvas:
      kind: swimlane
      actors:
        - lane: src
          id: s
          label: 主库：多线程并发落账，不等从库
        - lane: log
          id: g
          label: binlog：事件持续涌入
        - lane: replica
          id: r
          label: 从库：重放排队，落后秒数爬升
          highlight: true
      messages:
        - id: m1
          from: s
          to: r
          label: 到达快于重放 → 积压
          active: true
      registers:
        - name: 默认模式
          value: 异步：提交不等人
        - name: 延迟公式
          value: 到达速率 − 重放速率，攒下的全是债
    log:
      - mode: 延迟
        event: 延迟的本质不是故障而是排队：写入和重放两端的速度差多少，从库账上就欠多少
  - id: lag-consequences
    title: 刚改完昵称就刷出旧值：按容忍度给写后读分三档
    tldr: 写走主库、读走从库必然带来「写后读不一致」；工程上按业务对旧数据的容忍度分成直接接受、短时间会话粘回主库、显式等待从库追平位点三档，并配合延迟熔断摘除慢从库。
    body: |-
      主从延迟落到用户眼前就是个经典翻车现场：用户在主库把昵称改成了新名字，页面立刻刷新去从库查个人资料，屏幕跳出来的还是旧昵称，吓得用户以为没保存成功又连点三下。数据其实早落进主库了，只是从库还没重放到那一笔——这种「写后读不一致」是所有读写分离架构与生俱来的体验税。

      应对方案按严苛程度排成三档：
      - **直接接受**：点赞数、评论列表这类晚几秒刷新也无伤大雅的展示位，直接走从库，零额外成本。
      - **会话粘性（写后短期读主）**：同一个用户刚产生写操作后的几秒内，路由层把他的后续读请求固定打回主库，等从库大概率追平后再放回从库。
      - **显式等位或强行读主**：扣款查余额、改密后校验这类一步都不能错的路径，要么直接读主库，要么调用 MySQL 的位点等待机制确认从库已重放完刚才那笔事务再读——正确性拉满，代价是读延迟被从库追赶速度拖住，或者主库要多扛一部分读流量。

      工程铁律只有一条：**绝不在没问清业务容忍度时盲目把读全切给从库**。平时主从延迟只有几毫秒，没人察觉；一到大促峰值或后台跑大事务，延迟瞬间拉到几十秒，隐蔽的写后读 Bug 就会集中引爆。成熟的数据库中间件不仅允许按接口标注「能否忍受旧数据」，还会给从库设一道延迟闸门——一旦落后秒数越过阈值，先把慢从库摘出读池止损，追平后再重新挂回。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: app
          id: a
          label: 应用：刚改完昵称就刷新
          highlight: true
        - lane: replica
          id: r
          label: 从库：还没重放到这一笔，返回旧值
      messages:
        - id: m1
          from: a
          to: r
          label: 写后读不一致现场
          active: true
      registers:
        - name: 对策三档
          value: 接受 / 会话粘性 / 显式等位
        - name: 原则
          value: 按场面给不一致窗口定价
    log:
      - mode: 后果
        event: 延迟最终会以写后读不一致的用户体验形式还账，设计读写分离时要先把这笔账认领下来
  - id: semisync
    title: "[[半同步]]复制：主库提交前，先等至少一台从库签收落盘"
    tldr: 纯异步下主库刚回复成功就宕机会永久丢掉未传走的事务；[[半同步]]让主库在刷完 [[binlog]] 后、向引擎提交前等至少一台从库写进[[中继日志]]落盘，超时无人应答则自动退回异步。
    body: |-
      纯异步藏着一个尖锐隐患：主库刚回复用户「提交成功」就断电暴毙，而这笔新账还没来得及发给任何从库——它就彻底蒸发了，事后扶正哪台从库都找不回来。[[半同步]]复制（semisynchronous replication）专门来堵这个洞：默认配置下，主库把 [[binlog]] 刷盘之后、向存储引擎正式提交之前先停一步，等**至少一台从库**回信确认「事件已写入我本地的[[中继日志]]并落盘」，主库才完成引擎提交并回复应用。

      看准它等的到底是什么：**只等从库把账抄进本地盘签收，不等从库把 SQL 重放完**。全同步要等所有从库执行完才提交，任何一台慢从库都能把主库拖死；半同步只要任意一台从库签收，多付的只是一次机房内网络往返（通常一两毫秒），就换来了「凡是客户端收到成功的事务，至少在两台机器的磁盘上有据可查」，即使主库下一秒烧毁，新主重放完自己的中继日志也分毫不少。

      半同步还留了一条保命退路：万一网络抖动或从库全挂、等签收超过设定超时仍无人应答，主库不会把自己无限期憋死，而是**自动降级回异步模式**先把线上写流量跑通，等从库追上再切回半同步。所以它卖的是「常态下至少两处有据」，而不是数学意义上的绝对零丢失。
    derivation: original
    sources:
      - ref: mysql-replication-docs
        locator: 19.4.10 Semisynchronous Replication（半同步的确认语义与降级）
        claim: 半同步下主库等至少一台从库确认已把事件写入 relay log 并落盘后才提交；只等接收确认不等执行完成；超时无人确认时主库自动退回异步复制
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
    canvas:
      kind: swimlane
      actors:
        - lane: src
          id: s
          label: 主库：提交前先等签收
        - lane: replica
          id: r
          label: 从库：事件落进 relay log 即回签
          highlight: true
      messages:
        - id: m1
          from: s
          to: r
          label: 账传到你那儿，我再提交
          active: true
      registers:
        - name: 等的是
          value: 签收落盘，不是重放完成
        - name: 保底
          value: 已提交的至少在两处有据
        - name: 脾气
          value: 超时自动降级回异步
    log:
      - mode: 半同步
        event: 半同步用一次网络往返的延迟，买主库宕机时已提交的账不会随它一起蒸发的安心
  - id: failover
    title: 主库宕机做 [[failover]]：难的不在改配置，在比账与隔离旧主
    tldr: 主库倒下时必须先比对各从库进度、挑账最全的一台扶正，再改其余从库与写流量指向；异步未传出的已提交事务只能认丢，修好的旧主也必须隔离审查而不能直接归队当主。
    body: |-
      凌晨三点主库突然宕机，故障切换（[[failover]]）启动。第一步不是随便抓台从库顶上去，而是**比账选新主**：每台从库拉账和重放的位点往往差着几拍，必须挑出落后最少、账本最全的那台追平剩余中继日志后扶正——选错了就等于亲手扔掉更多已提交数据。第二步才是改指向：让其余从库改向新主拉账，同时把应用的写入口整体切过去。

      切换现场有两笔硬账躲不掉：第一，异步模式下（或[[半同步]]恰好超时退回异步那几秒），旧主宕机前虽已回复用户成功、但还没来得及发出来的那几笔事务会随旧主一起沉底，用户再来查就会发现「刚提示成功却没记录」；第二，等旧主修好开机后，**绝不能直接放回队伍继续当主**——它盘里可能躺着从未传给任何从库的孤本事务，与新主的时间线早已分叉，官方手册明确要求先将旧主隔离审查。

      成熟生产环境都靠专门的高可用管家自动探活、比位点、切地址，把「哪本账算数」的裁决规则提前写死在代码里。切换期间写入会短暂中断几秒到几十秒，这是保一致性必交的过路费——总好过主未定就两头乱写，一步踏进[[脑裂]]。
    derivation: original
    sources:
      - ref: mysql-replication-docs
        locator: 19.4.10 Semisynchronous Replication（异步下宕机丢事务与旧主处置）
        claim: 异步复制下主库宕机时，已提交但未传输到任何从库的事务会随切换丢失；半同步场景中出过故障的旧主不应再被复用为源，应予隔离
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
    canvas:
      kind: swimlane
      actors:
        - lane: src
          id: s
          label: 旧主：宕机，未传走的账随它沉底
        - lane: replica
          id: r
          label: 账最全的从库：被扶正为新主
          highlight: true
        - lane: app
          id: a
          label: 应用：写流量整体切向新主
      messages:
        - id: m1
          from: r
          to: a
          label: 先比账，再扶正
          active: true
      registers:
        - name: 选新主
          value: 重放进度最靠前者
        - name: 必须认的账
          value: 异步下未传走的已提交事务会丢
    log:
      - mode: 切换
        event: 切换的难点不在改指向这些技术动作，而在裁决到底哪一本账算数
  - id: split-brain
    title: "[[脑裂]]为什么靠复制链自己无解：分不清对方是死是断网"
    tldr: 网络分区让从库误以为原主已死而自立新主，双主同时收写会导致账本永久分叉且无法自动合并；防脑裂必须引入链外多数派裁决，并严守「先[[隔离|fencing]]旧主、后扶正新主」。
    body: |-
      比主库彻底死透可怕十倍的是网络分区：原主库活得好好的，只是它与从库之间的网络断了。从库迟迟收不到心跳，按容灾剧本把自己扶正成新主开口收写；原主库那边还连着一半应用服务器，毫不知情地继续收写。同一份数据瞬间冒出两个源头各自记账——这就是[[脑裂]]（split-brain）。等网络一通，两本账在同一批行上记满了互相矛盾的修改，没有任何算法能自动猜出「同一个账户的两笔扣款该留谁」，只能停服靠人工逐笔核销补偿。

      为什么靠复制链自己防不住脑裂？因为在异步网络里，收不到消息的一方**永远分不清对面是机器毁了，还是仅仅网线断了**。只靠主从内部互探心跳，谁也没法单方面排除对方还活着的可能；想铁板钉钉裁决谁有资格当主，必须请复制链之外的多数派（比如奇数节点的共识集群）投票表决，拿不到多数票的一侧自动封笔停写。

      工程落地上与选主死死绑在一起的保命动作叫隔离（[[fencing]]）：在扶正新主接客之前，必须先确保旧主再也收不到任何写入——摘掉流量入口、收回写权限甚至通过带外管理直接断电，而且顺序绝不能反：**先隔离旧主、后扶正新主**。漏掉这一步，旧主哪怕只多喘一分钟气，分叉的烂账就多攒一箩筐。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: src
          id: s
          label: 原主库：不知情，继续收写（账 A）
        - lane: replica
          id: r
          label: 被扶正的从库：也开始收写（账 B）
          highlight: true
        - lane: app
          id: a
          label: 应用流量：被网络分区劈成两半
      messages:
        - id: m1
          from: a
          to: s
          label: 一半写进账 A
          active: true
        - id: m2
          from: a
          to: r
          label: 一半写进账 B
      registers:
        - name: 病根
          value: 分不清对方是死是断
        - name: 愈合代价
          value: 矛盾的账只能人工裁决
    log:
      - mode: 脑裂
        event: 脑裂是复制链内部无解的问题，它的裁决要靠链之外的多数派，这正是分布式系统这门科的入场券
  - id: spectrum
    title: 放到一致性谱系里对表：主库读是现货，从库读是期货
    tldr: 同一条主从链横跨两格一致性：读主库是写完立即可见的强一致，读异步从库则是只保迟早收敛、不保何时追上的[[最终一致]]，连「读己之写」和「单调读」都可能被延迟击穿。
    body: |-
      把主从复制放到一致性标尺上量一量，同一套集群其实劈成了两个世界：盯着主库读，写完下一微秒去查必是新值，这是实打实的**强一致（现货）**；转头去读从库，系统只承诺「只要主库停笔不再写，所有副本迟早会追成一样」，至于迟早是 2 毫秒还是 20 秒概不打包票——这就是[[最终一致]]（eventual consistency）最鲜活的工程标本（**期货**）。

      注意别把[[半同步]]的保底范围搞混：半同步只保证「主库崩了账本至少在从库磁盘上留了一份」，并没等从库把中继日志真正重放进数据表，所以就算开了半同步，去读从库照样可能读到旧值。

      在强一致与最终一致之间，还有[[因果一致]]以及两格最贴近日常直觉的小台阶：一是**读己之写**（自己刚改完的昵称，自己刷新必须立刻看见），二是**单调读**（同一个用户先后刷新两次，看到的数据版本只许往前走、不许倒退）。多从库轮询时这两格恰恰最容易碎——第一次刷新打到快从库看见新昵称，第二次负载均衡切到了慢从库，昵称居然时光倒流变回旧的！第五步讲的会话粘性与等位点，补的就是这两道口子。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: src
          id: s
          label: 主库：写后即读 = 强一致
        - lane: replica
          id: r
          label: 从库：迟早到达 = 最终一致
          highlight: true
      messages:
        - id: m1
          from: s
          to: r
          label: 同一条链，两格谱系
          active: true
      registers:
        - name: 主库的读
          value: 现货：强一致
        - name: 从库的读
          value: 期货：最终一致
    log:
      - mode: 定位
        event: 主从复制是一致性谱系最贴身的第一个样本：同一条链上，主库的读是强一致，从库的读是最终一致
  - id: d1-echo
    title: 云上回扣与收官三问：[[D1]] 托管了同一副骨架
    tldr: Cloudflare [[D1]] 底层同样是「单个主写节点 + 日志复制到全球只读副本」，平台替你扛下了选主与防[[脑裂]]的运维债；设计读写分离时先过一遍收官三问。
    body: |-
      最后看一眼云时代的无服务器数据库 Cloudflare [[D1]]，掀开盖子正是本课讲透的这副骨架：每个数据库在任意时刻只有唯一一个主实例顺序收写，绝不允许冒出第二个主；写完之后，变更日志由平台自动分发到铺在全球边缘节点的只读副本上，读请求就近命中边缘副本，写请求则跨网绕回主节点所在机房执行（所以离主越远写延迟越高）。它没变什么魔法，只是由云平台把探活、[[failover]] 选主和防[[脑裂]]那些半夜惊魂的苦活收进了托管层，换走的是你手调底层拓扑的控制权。

      整个数据存储科从一页 16KB 字节一路走到了跨机房的多副本账本，而「多台机器之间究竟怎么投票选出唯一真主」正是下一科「分布式系统」的开场白。在把主从复制画进你的业务架构图前，先带走这**复制架构三问**：**① 写流量真没撞上单机天花板吗？**（主从只扩读不扩写，写爆了得拆库分片而不是加从库。）**② 这条读接口能忍几秒旧数据？**（扣款查账这类零容忍接口老实走主库或等位点，列表展示才放去从库并配好延迟摘除。）**③ 主库倒下那一秒怎么防丢账与双主？**（怕丢已提交事务就开[[半同步]]，自动切换必须配外部多数派仲裁并严守「先[[隔离|fencing]]旧主、后扶正新主」。）
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: src
          id: s
          label: D1 的主：单个写者，顺序执行
        - lane: log
          id: g
          label: 变更日志：平台内部复制
        - lane: replica
          id: r
          label: 全球只读副本：就近读
          highlight: true
      messages:
        - id: m1
          from: s
          to: r
          label: 同一副骨架，平台托管
          active: true
      registers:
        - name: 相同
          value: 单写者 + 日志复制
        - name: 不同
          value: 裁决与运维归平台，不归你
    log:
      - mode: 收官
        event: 数据存储科到此收官，它的终点正是分布式系统的起点：多台机器之间到底听谁的
minutes: 28
level: 进阶
prereq:
  - data/db-internals
  - data/locks-deadlocks
objectives:
  - 画出主库转储线程、从库 I/O 线程（写中继日志）与 SQL 重放线程的三棒接力链，区分 redo 与 binlog 的职责
  - 对比 STATEMENT、ROW、MIXED 三种记账格式在体积与主从一致性上的取舍
  - 顺着并发写与重放速度差解释复制延迟，给出读写分离下的三档写后读治理方案
  - 说清半同步签收语义、故障切换的比账规则，以及脑裂为什么必须靠隔离（fencing）与外部多数派破局
aiLink: 大模型推理集群同样在天天和副本打交道：上百 GB 的模型权重与 [[KV 缓存]]要分发到多台推理节点，网关做会话亲和路由、坏节点摘除与主控切换时，踩的正是和数据库读写分离、[[failover]] 完全同构的延迟与裁决问题。
design:
  - mechanism: 传逻辑变更日志，而不定期整块拷贝数据文件
    problem: 一台跑了几年的主库磁盘上躺着几百 GB 存量数据，但每秒真正变动的往往只有几百 KB；要是靠定期拷表文件同步，网卡永远在搬运没变过的陈年旧账，从库追赶延迟动辄以小时计，主库页内物理偏移稍有差异还会拷坏。
    choice: 只传增量变化本身：主库把每次事务改动按提交顺序记进逻辑账本 [[binlog]]，从库拉回去依序重放；网络传输量只跟改动量成正比，与总库大小彻底脱钩。
    tradeoff: 从库得把写操作再执行一遍，记账格式还要在「语句薄但怕跑偏（[[STATEMENT]]）」和「行镜像稳但占磁盘（[[ROW]]）」之间权衡；一旦从库停机太久、主库老 binlog 已被轮转清掉，就断了续传线索，只能重拉全量备份再追。
    root: 状态同步的黄金法则是「传差量不传全量」——带全序的追加日志恰好是状态变化的最小完备记录，单机崩溃恢复和跨机复制殊途同归都落在了日志上。
  - mechanism: 出厂默认异步复制，把半同步做成按需选配
    problem: 如果强迫主库每次提交都死等所有从库重放完再回包，每一笔写操作都要平白背上跨机网络往返与慢从库拖尾耗时；更致命的是任何一台从库重启或抖动都会连坐主库停写——本来用来容灾保命的副本，反倒成了拖垮主库的累赘。
    choice: 默认采用纯异步复制，主库落完本地账立刻回复成功，跟从库死活解耦；另外提供可选的[[半同步]]插件（只等至少一台从库落盘签收、超时自动退回异步），让怕丢账的核心业务自己掏一程网络往返买安心。
    tradeoff: 异步窗口里主库一旦暴毙，未传出的已提交事务就会永久蒸发；搞读写分离的业务还得自己接住写后读不一致、单调读倒退这些体验包袱。
    root: 跨机房物理光速省不掉——要么在提交那一刻付等待延迟，要么提交先放行、把延迟挪到后台慢慢还；把默认档设在最快一端，把安全档留给业务按身价选购。
  - mechanism: 把防脑裂的选主裁决剥离给复制链之外的多数派
    problem: 网络断连时，从库收不到主库心跳，这跟主库彻底断电烧毁在网线这头看起来一模一样；只靠一主一从两台机器内部通信，谁也没法排除「我以为它死了，其实它还在对面欢快收写」，双主[[脑裂]]靠复制链自己是道死题。
    choice: 把「谁是合法主库」的裁判权移交给外部多数派组件（如三节点或五节点共识集群），并配死「先[[隔离|fencing]]掐断旧主写路、再扶正新主」的操作铁律；拿不到多数票的一侧宁可停写也不许自立山头。
    tradeoff: 架构里多了一套高可用仲裁组件要部署维护，且机房网络劈裂时处于少数派一侧的节点必须牺牲写可用性——但比起双主劈叉后停服人工对账的灾难，这点保险费划算太多。
    root: 当局部观测分不清「对方已死」还是「链路中断」时，靠猜测永远赌不赢；唯一出路是引入超过半数节点的投票交集，用数学上的「不可能同时凑出两个多数派」锁死唯一真主。
terminal:
  - cmd: SHOW REPLICA STATUS\G
    note: 看 Seconds_Behind_Source：从库落后主库多少秒，延迟长什么样一目了然
  - cmd: SHOW BINARY LOG STATUS;
    note: 主库的 binlog 写到了哪个文件、哪个位置——这是复制链的源头刻度
  - cmd: SHOW VARIABLES LIKE 'binlog_format';
    note: 当前账的记法：ROW 为默认，STATEMENT 与 MIXED 是另外两档
