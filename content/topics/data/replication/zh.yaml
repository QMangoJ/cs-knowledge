  note: 看 Seconds_Behind_Source：从库落后主库多少秒，延迟长什么样一目了然
- cmd: SHOW BINARY LOG STATUS;
  note: 主库的 binlog 写到了哪个文件、哪个位置——这是复制链的源头刻度
- cmd: SHOW VARIABLES LIKE 'binlog_format';
  note: 当前账的记法：ROW 为默认，STATEMENT 与 MIXED 是另外两档
