    locator: 19.2.3 Replication Threads（复制线程的组成）
    claim: 主库用 Binlog Dump 线程向从库发送 binlog；从库用 I/O 接收线程把事件写入 relay log，再由 SQL 应用线程读取 relay log 并执行其中的事务
