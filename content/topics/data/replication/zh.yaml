          to: r
          label: 读分给从库
      registers:
        - name: 三个理由
          value: 读扩展 / 容灾 / 杂活隔离
        - name: 骨架
          value: 把单机的日志思想搬到多台机器
    log:
      - mode: 动机
        event: 数据活在多台机器上之后，一致性不再是天然成立的，而是要靠复制链持续维护的状态
  - id: anatomy
    title: "[[redo]] 管本机复活，[[binlog]] 靠三个线程跨机器传账"
    tldr: 主库身上有两本账：记物理页字节改动的 [[redo]] 只供本机崩溃恢复，记逻辑事件的 [[binlog]] 才供跨机器复制与按时间点恢复；复制链由主库推送线程、从库接收写[[中继日志]]线程与重放线程三棒接力。
    body: |-
      主库身上同时背着两本日志，千万别混为一谈。[[redo]] 记的是「第几号数据页的哪段偏移改成了什么字节」，紧贴本机存储引擎的磁盘布局，只给主库自己崩溃重启时重做用；[[binlog]]（二进制日志）记的是逻辑事件——「某个事务把哪张表哪一行的哪一列改成了什么值」，别的机器无需共享底层页结构，拿过去就能重放。因此，跨机器复制传的永远是 binlog，不是 redo。

      一条复制链靠三个线程接力跑通：主库起一个转储线程（`Binlog Dump`），源源不断把 binlog 新增事件推给连上来的从库；从库的接收线程（[[I/O]] 线程）连着主库，把收到的事件原封不动抄进本地的[[中继日志]]（`relay log`）先落盘；从库的应用线程（[[SQL]] 线程）再从中继日志里按序取出事件，真刀真枪执行一遍。把「抄账」和「重放」拆成两棒，是为了让网络收发与本地执行互不拖累——哪怕从库重放一时卡慢，先把账抄进本地盘落袋为安。

      除此之外，binlog 还兼任着救命的「按时间点恢复」（PITR）：万一有人误删了整张表，运维会先把昨晚的全量备份恢复出来，再拿 binlog 把昨晚备份后到误删前一秒的所有事件重放一遍，精准停在事故发生前。正因它同时充当复制传送带和灾备底片，线上对 binlog 保留时长格外敏感：留久了占磁盘，留短了从库多停机几天就会面临旧账已被清理、只能重做全量同步的窘境。
    derivation: original
    sources:
      - ref: mysql-replication-docs
        locator: 19.2.3 Replication Threads（复制线程的组成）
        claim: 主库用 Binlog Dump 线程向从库发送 binlog；从库用 I/O 接收线程把事件写入 relay log，再由 SQL 应用线程读取 relay log 并执行其中的事务
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
    canvas:
