- id: d1-echo
  title: 收尾回扣：D1 与主从复制，同一副骨架
  tldr: 单个写者加一本向外复制的账——云上的 D1 把这副骨架托管了：主的位置你不用管，副本铺满全球。
  body: '最后把镜头拉回你真正用过的系统。云数据库 D1 的形态，拆开看正是这一课的骨架：每个数据库只有一个写者，所有写都排到它那里顺序执行——等价于主从里的主库，而且是永远不许出现第二个主的那种；写完之后，变更被复制到分布在全球的只读副本上，近处读请求就近命中副本——等价于从库，只是副本的地理分布由平台替你铺好。

    差别在运维的归属：MySQL 主从里，选主、切换、防脑裂这些最难的裁决要你自己搭仲裁与脚本；D1 把整个主的位置与复制链收进平台内部，你只面对「写去一处、读就近」这个简化后的世界。它替你付掉的，正是本课后半程讲的那些难题的工程成本；它收走的，则是你对拓扑的控制权。

    数据存储科到此收官：从一页数据的内部构造，一路走到多台机器之间的一本账。你手里的地图已经能解释绝大多数后端系统的数据层了。而脑裂那一幕留下的裁决难题——多台机器之间，到底听谁的——将是下一科「分布式系统」的开场白。

    顺带把写延迟的账也对上：D1 的写必须回到主所在的那一处执行，离主越远的应用，每次写就多付一程网络往返——这与主从架构里「写只能进主库那道门」是同一条约束，只是门的地理位置由平台选定。读就近、写归一，这六个字可以当作一切单写者复制系统的统一注脚。'
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: src
      id: s
      label: D1 的主：单个写者，顺序执行
    - lane: log
      id: g
      label: 变更日志：平台内部复制
    - lane: replica
      id: r
      label: 全球只读副本：就近读
