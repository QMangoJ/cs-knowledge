- id: split-brain
  title: 脑裂：两个主同时收写，两本账从此分叉
  tldr: 网络分区时两边都以为对方已死、各自扶正收写；分区愈合时，两套互相矛盾的账没有任何办法自动合并。
  body: '比宕机更难缠的是分区：主库没死，只是它与从库之间的网络断了。从库一侧等不到主库的心跳，按容灾剧本把自己扶正、开始收写；主库一侧毫不知情，也在继续收写。同一份数据，此刻有两个源头在各自往前改——这叫脑裂（split-brain），一个大脑裂成两个，各想各的。

    分区愈合时的场面才是真正的灾难：两本账在同一批行上记下了互相矛盾的修改，谁也不包含谁，没有任何算法能自动判断「同一账户的两笔扣款该怎么合并」——因为矛盾的内容是业务语义，不是格式问题。处理往往只能人工介入：选一本账为准，另一本账上的写入逐笔审查、补偿或丢弃。

    预防脑裂的关键认知是：靠复制链自己防不住。链上的每一方都无法区分「对方死了」和「对方只是联系不上」——这正是分布式世界里最根本的不可区分性。要裁决谁有资格当主，必须引入链之外的第三方：多数派投票、外部仲裁者。这已经踏进了分布式系统的正题，本课先把问题钉在这里：下一科的第一课，就从「为什么单机的一切手段到了多机都会失灵」讲起。

    工程上与脑裂配套的动作叫隔离（fencing）：在扶正新主的同时，必须确保旧主再也收不到写——摘掉它的流量入口、改掉它的权限、甚至直接断电——顺序还不能反：先隔离、后扶正。漏了这一步，旧主哪怕只多活一分钟、多收一笔写，分叉的账就多一笔要人工对账的债。脑裂防的从来不只是「两个主」，而是「旧主复活时手里还攥着没对齐的账」。'
