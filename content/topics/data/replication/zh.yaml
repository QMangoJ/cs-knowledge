- id: async-lag
  title: 默认异步：延迟的成因链
  tldr: 主库提交不等从库确认，从库重放的速度一旦追不上主库写入，落后就以秒为单位攒成延迟。
  body: '复制默认是异步的：主库把事务写进 binlog、回复应用「提交成功」，完全不等任何从库——从库拉没拉到、重放完没有，主库一概不知，也一概不管。这个「不等」是刻意的，主库的提交延迟因此与从库的死活彻底解耦，代价则全部记在延迟这本账上。

    延迟的成因是一条链：主库可以多线程并发地写，从库的重放却长期只有一个 SQL 线程串行地放——主库十个事务并行落账，从库只能排成一列逐个重演，到达速度大于服务速度，队列必然越排越长，落后秒数（SHOW REPLICA STATUS 里的 Seconds_Behind_Source）随之爬升。雪上加霜的还有大事务：一个更新百万行的事务在主库上是并行完成的，到从库却要整块重放完才算追平一笔；从库同时还接着读请求时，CPU 与磁盘又要分一半出去。

    缓解的办法是让从库也并行：现代 MySQL 可以开多个应用工作线程，由一个协调线程按事务间的依赖关系分发，互不冲突的事务同时重放——本质是把主库上「本来就并行」的事实，在从库侧复原一部分。但并行重放治不了源头：主库持续写入的速率若长期高于从库的极限吞吐，延迟只会被推迟、不会被消除。

    还有个看数字的提醒：Seconds_Behind_Source 是按「正在重放的事件在主库上发生的时刻」与从库当前时刻的差估出来的，它在重放一个大事务的过程中会突然跳高、放完又骤降，看它要看一段时间的趋势，而不是某一秒的读数。把告警阈值钉在瞬时值上，运维会被大事务的正常重放反复惊醒——延迟是真问题，但读数本身也是个需要理解口径的估算。'
  derivation: original
  sources:
  - ref: mysql-replication-docs
