- id: failover
  title: 主库倒了：切换不是把从库改个名那么简单
  tldr: 先选账最全的那台从库扶正，再把其余从库改指向它；异步下已提交却未传走的事务，要认账为丢失。
  body: '主库宕机，切换（failover）开始。第一步不是随便抓一台从库顶上，而是比账：每台从库的重放进度不同，落后最少、账最全的那台才是新主的人选——选错了，等于主动丢掉更多的已提交数据。第二步是改指向：新主就位后，其余从库要改成向新主拉账，应用的写流量也要整体切过去。整个过程要快，但快的每一步都在和「数据到底齐不齐」讨价还价。

    异步模式下有一笔账必须认：主库在宕机前已经回复成功的事务里，可能有一部分还没传给任何从库，它们随着旧主一起没了。切换完成、新主接客之后，这些事务在用户眼里就是「明明提示成功了，后来却查不到」。半同步能把这个窗口压到接近零，但压不到数学意义上的零——超时降级的那一小段时间，风险仍然敞着。

    旧主修好之后也不能直接放回队伍当主：它肚子里可能存着没被任何从库确认的事务，与新主的账已经对不上。官方对手册里对半同步场景的警告正是这句：出过事的旧主应当被隔离审查，而不是原样复用。切换考验的从来不只是速度，而是对「哪本账为准」的裁决。

    这套动作在成熟系统里由专门的管家自动完成：它持续探活主库、判定宕机、按重放进度选出新主、改好其余从库的指向、再把写入口的地址切换过去。自动化的意义在于把裁决规则事先写死——真到了凌晨三点事故现场，没有人有精力现场发明「哪本账为准」。而切换期间写入会短暂不可用，这是为一致性付的过路费：宁可停一小会儿，也不能在主未定之时放任两处同时收写，因为那正通向下一幕的脑裂。'
