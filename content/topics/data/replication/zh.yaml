- id: semisync
  title: 半同步：让一台从库先签收再提交
  tldr: 提交前等至少一台从库把事件落进它的中继日志——不等重放完，只等账传到，换「至少两处有据」。
  body: '异步的风险点很尖锐：主库回复「提交成功」后立刻宕机，而这一笔还没来得及传给任何从库——它就随着主库一起没了，事后再扶正哪台从库都找不回来。半同步复制（semisynchronous replication）就是来堵这个洞的：主库在提交前多等一步，等至少一台从库确认事件已经收到、并写进它本地的中继日志落了盘，才正式提交并回复应用。

    注意它等的只是签收，不是执行完：事件到了从库的账本上就算数，重放可以慢慢来。这样一旦主库宕机，被扶正的从库账上至少有这一笔，不会蒸发。它在异步与全同步之间取了个中间点：全同步要等所有从库都执行完才提交，延迟会被最慢的从库拖死；半同步只要任意一台签收，代价约等于一次网络往返的时间。

    它的脾气也要知道：若等签收等到超时仍没人应答，主库不会无限期卡住，而是自动降级回异步模式先把业务跑起来，等从库追上再切回半同步。所以半同步给的是「正常情况下至少两处有据」，而不是数学意义上的绝不丢失——又一笔明码标价的交易。

    一个容易混淆的细节：半同步等签收的时点，是在主库把 binlog 刷盘之后、正式向存储引擎提交之前（这是默认档位）。也就是说，应用收到「提交成功」时，这笔事务在主库与至少一台从库的账本上都已经落了盘，两处都有据可查；就算主库下一秒宕机，被扶正的从库重放完自己的中继日志，这一笔分毫不少。等待点每往后挪一格，语义就变一分，这类细节正是复制配置里最值得逐字读文档的地方。'
