- id: anatomy
  title: 解剖一条复制链：两本账，三个线程
  tldr: 主库写 binlog、从库 IO 线程拉回存进 relay log、SQL 线程再重放——先分清 binlog 与 redo 不是一本账。
  body: '先纠正一个高频混淆：主库身上有两本账。redo 你已经熟了——它记的是「第几页的哪处字节改成了什么」这种物理改动，服务对象是主库自己，崩溃重启时照着重做。binlog（binary log，二进制日志）记的是逻辑事件——「有这么一个事务，把某行的某列改成了什么」，服务对象是别人：从库、以及按时间点恢复的工具。物理账贴着页，只有本机引擎看得懂；逻辑账贴着行与语句，别的机器拿去就能重放。复制传的是后者。

    一条复制链由三个线程接力。主库一侧有个转储线程，负责把 binlog 的新增内容源源不断推给连上来的从库。从库一侧分工更细：IO 线程（接收线程）与主库相连，把收到的事件原样抄进本地的中继日志（relay log）先落袋为安；SQL 线程（应用线程）再从中继日志里依次取出事件，在从库上真正执行一遍。抄账与重放拆成两段，是为了让网络抖动与重放慢互不拖累：账先存下来，重放可以慢慢追。

    记住这条链的形状，后面每一个问题都能对号入座：延迟出在重放跟不上，格式之争在账怎么记，切换之难在账还没传完主库就倒了。

    binlog 还有一份兼职：按时间点恢复。误删了一张表之后，运维会先把最近一次全量备份恢复出来，再拿 binlog 把备份之后到误删之前的那段账重放一遍，世界就停在事故前一秒。这也是为什么生产环境对 binlog 的保留期斤斤计较：它同时是复制的传送带与灾备的底片，留得越久，能回溯与能续传的窗口就越长；留得太短，从库多停机几天，账就被清理干净、只能重做全量。'
  derivation: original
  sources:
