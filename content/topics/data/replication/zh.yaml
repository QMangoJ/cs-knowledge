title: 主从复制：一本账，多个副本
summary: 主从复制靠主库把每次逻辑改动写进 [[binlog]]、从库拉回[[中继日志]]按序重放来对齐多台机器；读扩展、复制延迟、[[半同步]]折中与故障切换时的[[脑裂]]风险，全都长在这条「单写者 + 异步传账」链路上。
premise: 一台 [[MySQL]] 主库带着两台从库做读写分离（默认异步复制、[[ROW]] 格式 [[binlog]]）：为什么用户刚改完昵称一刷新又跳回旧名字？主库突然断网失联时，为什么从库贸然顶上会酿成无法自动合并的双主烂账？
position: 本课是数据存储学科收官板块「复制：一本账，多个副本」的压轴课：前面几课的日志、索引、事务与锁都守在单机内部，本课第一次把同一份数据推向多台机器。学完你能拆清三线程复制链与格式取舍，算准复制延迟的成因与应对档位，并看透故障切换与脑裂背后的分布式边界。
bridge:
  prev: 上一课用行锁与间隙锁把单机内部的并发写秩序管得严丝合缝，却防不住整台机器断电宕机或读流量撑爆单机；一旦把数据复制到多台机器上，难题立刻从「谁先改这一行」变成了「别的机器什么时候才知道我改过了」。
overview:
  - key: 一句话总结
    value: 主库把每次修改按序记进跨机器逻辑账本 [[binlog]]，从库拉回本地[[中继日志]]逐条重放；所有副本沿同一条时间线演进，读流量与容灾由此摊开，但写入口始终只有一个
  - key: binlog 与 [[redo]] 的分工
    value: redo 记录数据页字节级物理改动，仅供本机崩溃恢复；binlog 记录表行级逻辑事件，专为从库重放与按时间点恢复而生
  - key: 三种记录格式
    value: "[[STATEMENT]] 记 SQL 原文最省空间但怕 NOW() 等不确定函数；[[ROW]] 记逐行前后镜像体积大却绝对确凿（默认）；[[MIXED]] 由引擎按语句自动切换"
  - key: 延迟与写后读
    value: 默认异步复制下主库提交不等从库，主库并发写快于从库重放就会攒出秒级延迟；写后读需按容忍度在「直接接受、短期粘主、显式等位」三档间定价
  - key: 切换与[[脑裂]]
    value: "[[半同步]]靠等至少一台从库落盘中继日志堵住主库暴毙丢账；但网络分区时复制链自身分不清主库是死是断网，防脑裂必须靠外部多数派裁决并先[[隔离|fencing]]旧主"
  - key: 与 [[D1]] 的呼应
    value: Cloudflare [[D1]] 底层同样是「单个主写节点 + 日志复制到全球只读副本」加会话令牌保[[因果一致]]，区别仅在于选主与切换由平台托管
