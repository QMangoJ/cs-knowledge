- id: two-orders
  title: 收束：两套秩序，一条索引路
  tldr: MVCC 守读的秩序、锁守写的秩序，两者都挂在同一棵索引树上——这是数据并发的完整拼图。
  body: '收个尾。把事务课与本课拼起来，数据库的并发世界其实只有两套秩序：读的秩序归 MVCC——每个读者领一份快照，沿版本链各看各的世界，谁也不等谁；写的秩序归锁——所有写者按索引这条路排队，锁住记录、守住间隙，冲突时排队、成环时处决一个。普通读不上锁、当前读必上锁的那条分界线，就是两套秩序的接缝。

    还要记住那个贯穿全课的起点：两套秩序都挂在同一棵 B+ 索引树上。版本链的行藏在索引记录里，锁也锁在索引记录与间隙上；找行走索引、看版本走索引、排队也走索引。所以「让查询走对索引」从来不只是快慢问题，它同时决定了锁的范围与相撞的概率——这也是上一课结尾处那句「选错路线的代价」，在并发世界里的续集。

    单机之内的秩序到此讲完。但真实系统里数据从来不止一份：主库改完，还要把改动送到从库去重放——秩序一旦跨出单台机器，问题就从「谁先改」变成了「别人怎么知道我改了」。下一课，主从复制。'
