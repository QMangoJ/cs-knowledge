- id: avoid
  title: 少死锁的工程习惯：让环没机会闭合
  tldr: 固定顺序加锁拆掉循环等待，短事务缩小持锁窗口，走索引把锁的行数降下来。
  body: '死锁可以事后破，更可以事前少招惹。四条件里最容易拆的是循环等待：只要全系统约定同一套加锁顺序——比如永远按 id 从小到大更新——所有事务都朝同一个方向逐个拿锁，等待关系只能排成朝一个方向的链，环在几何上就不可能出现。这一个习惯，能挡掉线上绝大多数死锁。

    第二个习惯是让事务短：持锁的时间越短，与别人迎面相撞的概率越低。把查数据、算业务、等外部接口这些慢活都挪到事务之外，事务里只留下最核心的几句改数据就立刻提交，锁的窗口自然收窄。第三个习惯是让更新走索引：前面说过，锁挂在索引记录上，走索引的更新锁住的只是命中的少数行；不走索引的更新顺着扫描把整片都锁上，等于凭空把相撞面积放大了几百倍。

    也别忘了最后一档选择：若业务就是高并发争抢同一批热点行，死锁与等待都免不了，可以把死锁检测关掉、改靠锁等待超时，并把超时设得短些——让冲突以「快速失败、快速重试」的方式消化，而不是在检测与长队里慢慢磨。姿势选对了，死锁就从事故降级成日志里偶尔一闪的噪音。

    最后一个习惯关乎批量操作：一次更新十万行的长事务，等于把锁一口气铺满半张表、还攥上很久，任何并发在这段时间都寸步难行。把它拆成每批几百行、批批独立提交的小事务，锁的覆盖面与持有时间同时缩小——代价是整批不再是一个原子整体，中途失败要靠业务自己对账。锁的世界里没有银弹，只有一笔笔具体的账：原子性、并发、失败处理，三者的配比永远要按业务逐案去谈。'
