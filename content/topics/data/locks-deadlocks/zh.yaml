steps:
- id: why-locks
  title: 有了 [[MVCC]] 还要锁：写者必须在最新版本上排队
  tldr: 版本链只能让读者各看历史快照，挡不住两个写者同时基于余额 1000 算出 900 互相覆盖；写者必须拿锁排队，且锁要一直攥到事务结束才统一释放。
  body: |-
    `accounts` 表里 `id=7` 的账户余额是 1000，事务 A 和事务 B 几乎同时来各扣 100：要是没锁，两人先后读到 1000、各自减成 900 写回去，最终账上只剩 900，白白蒸发了一笔扣款（丢失更新）。事务课讲的 [[MVCC]] 在这儿帮不上忙——版本链能让读者各看各的历史快照互不打扰，可两个写者改的是同一笔钱，没法「各改各的平行宇宙」，必须老老实实在最新版本上排成一队，前一个人改完后一个人才许上手。

    而且这把锁不是「改完这一句就撒手」，必须一直攥在手里，直到整笔事务提交或回滚才统一放开（即[[两阶段锁]]纪律）。道理很实在：要是 A 刚改完余额还没提交就提前放锁，B 拿这个半成品接着往下算，转头 A 报错回滚了，B 的依据就瞬间清零。攥到最后一起放，别人看到的才永远是定案后的真账。

    前端写状态更新时若有两个并发 `await` 先读旧值再覆盖写回，撞上的也是同一类丢失更新；而在数据库进程内部，专门有一块内存表由「锁管理器」统一登记每把锁归谁、谁在后面排队。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: txa
      id: a
      label: 事务 A：读到 1000，要扣 100
    - lane: txb
      id: b
      label: 事务 B：也读到 1000，要扣 100
    - lane: lockmgr
      id: l
      label: 锁管理器：写者必须排队
      highlight: true
    messages:
    - id: m1
      from: a
      to: l
      label: 先改的先拿锁
      active: true
    - id: m2
      from: b
      to: l
      label: 后来的等着
    registers:
    - name: 没有锁的下场
      value: 两笔扣款只生效一笔（丢失更新）
    - name: 锁的职责
      value: 给写者排先来后到
  log:
  - mode: 动机
    event: 版本链只管读不管写者相争，两个写者改同一行时的秩序只能靠锁来排
- id: locks-on-index
  title: 最反直觉的真相：[[InnoDB]] 锁的是索引条目，不是数据行
  tldr: "[[InnoDB]] 的行锁一律挂在索引记录上（没建索引也会挂在隐藏[[聚簇索引]]上）；更新走哪条索引就沿哪条路径加锁，不走索引就会把整张表扫过的记录全锁上。"
  body: |-
    很多人以为行锁是直接贴在数据行身上的封条，但在 [[InnoDB]] 里，**[[记录锁]]永远挂在索引条目（index record）上**——就是 [[B+ 树]]叶子页里的那条记录；哪怕建表时一个索引都没写，引擎也会在底下悄悄造一棵隐藏[[聚簇索引]]专供锁落脚。道理其实很通透：数据库里没有绕开索引直达数据本体的暗道，所有人找行都得顺着索引树往下摸；把锁设在索引这个必经关卡上，谁来改都逃不过检查。

    一旦看穿「锁挂在索引上」，两个让人头大的线上怪象立刻水落石出：第一，更新语句要是漏了索引退化成全表扫描，引擎就只能顺着聚簇索引把沿途扫过的每一条记录挨个上锁，一句 `UPDATE` 当场演变成锁表事故；第二，事务 A 走[[二级索引]]改一批行、事务 B 走主键改同一批行，两边摸过索引条目的先后顺序往往不一致，迎面撞成[[死锁]]。

    再补一个排障必知细节：同一行账户数据，在二级索引和聚簇索引里各有一条记录。拿二级索引当条件做 `UPDATE` 时，引擎会先锁住二级索引上的条目，再顺着主键摸回聚簇索引把真正的行记录也锁上——一次更新同时在两棵树上落锁，查锁等待时如果只盯一头就会漏掉另一半现场。
  derivation: original
  sources:
  - ref: mysql-locking-docs
    locator: 17.7.1 InnoDB Locking（Record Locks 一节）
    claim: InnoDB 的记录锁永远锁的是索引记录；表上没有索引时，InnoDB 会创建隐藏的聚簇索引并用它来加锁
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: txa
      id: a
      label: 事务 A：UPDATE … WHERE id = 7
    - lane: lockmgr
      id: l
      label: 锁管理器：把锁记在索引条目上
    - lane: idx
      id: i
      label: 索引记录 id=7：锁挂在这里
      highlight: true
    messages:
    - id: m1
      from: a
      to: i
      label: 锁的不是行，是索引条目
      active: true
    registers:
    - name: 锁的对象
      value: 索引记录（不是数据行本体）
    - name: 推论
      value: 走哪条索引，就锁哪条路径
  log:
  - mode: 对象
    event: 锁守在所有人找行的必经之路也就是索引上，这个位置决定了后面锁的范围和行为
- id: lock-kinds
  title: 锁的三种区间形状：单点记录、纯空隙与左开右闭的[[临键锁]]
  tldr: 顺着有序索引排列，[[记录锁]]单守已有条目，[[间隙锁]]封死两条记录间的空缺，[[临键锁]]则把「记录 + 前面那段间隙」合体成左开右闭区间无缝铺满值域。
  body: |-
    顺着索引叶子页从小到大的刻度看过去，行级锁长出三种严丝合缝的区间形状：[[记录锁]]（record lock）只钉死某一条现成的索引记录，不许别人改删；[[间隙锁]]（gap lock）专门封住两条索引记录之间的那段空缺——那里原本一行数据都没有，锁住的是「不许往这段空档里新插记录」；[[临键锁]]（next-key lock）则是两者的合体，一把锁同时管住一条记录和它前面那段间隙。

    拿一组具体的索引值跑一遍最有画面感：假设索引上现在躺着 `10`、`11`、`13`、`20` 四条记录，临键锁就会把整条数轴切成五段**左开右闭**区间——`(-∞, 10]`、`(10, 11]`、`(11, 13]`、`(13, 20]` 和 `(20, +∞)`。每条现成记录正好做区间的右端点，前面的空档做区间内部，整片值域被无缝铺满，没有任何三不管死角。

    除了守哪块地盘，锁还分软硬模式与层级招呼：读用的[[共享锁]]彼此放行，写用的[[排他锁]]跟谁都冲突；表一级还有个专门打招呼的[[意向锁]]——事务下场锁某几行前，先在表门口挂一块「我里面有行锁」的牌子，后面谁想锁整张表，看一眼门牌就知道能不能进，省得把百万行挨个翻一遍。
  derivation: original
  sources:
  - ref: mysql-locking-docs
    locator: 17.7.1 [[InnoDB]] Locking（意向锁与记录锁/间隙锁/临键锁各节）
    claim: InnoDB 支持多粒度锁：意向锁是表级标记；记录锁锁索引记录，间隙锁锁记录之间的空缺，临键锁是记录锁与其前间隙的组合
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: lockmgr
      id: l
      label: 锁管理器：三种基本形状
      highlight: true
    - lane: idx
      id: i
      label: 索引：10 · 11 · 13 · 20 与它们之间的空缺
    messages:
    - id: m1
      from: l
      to: i
      label: 记录锁守行，间隙锁守空缺
      active: true
    registers:
    - name: 记录锁
      value: 锁住一条索引记录
    - name: 间隙锁
      value: 锁住记录之间的空缺
    - name: 临键锁
      value: 记录 + 它前面的间隙
  log:
  - mode: 谱系
    event: 锁的形状从守一行到守一段范围，对应的是从改一行到守护一整段查询结果的不同需求
- id: gap-nextkey
  title: "[[间隙锁]]专治[[幻读]]：对着空气上锁，只拦插入不拦同伴"
  tldr: "[[快照读]]挡不住范围更新时新行插进来引发的[[幻读]]，[[REPEATABLE READ]] 靠[[临键锁]]封死整段空档；间隙锁之间彼此相容，只拦第三方的插入意向。"
  body: |-
    为什么要费劲给「连一行记录都没有的空档」上锁？为了堵死[[幻读]]。设想事务 A 先查 `id` 在 10 到 20 之间的账户，看到 3 行；半路事务 B 往里新插了一行 `id=15` 并提交；等 A 再对这个范围动手更新或当前读重查时，凭空多出第 4 行，如同幻影。在默认的 [[REPEATABLE READ]] 下，A 一旦对范围做锁定读或更新，就会亮出[[临键锁]]把 `(10, 20]` 整段的记录连同空隙统统封死——B 想插 `id=15`，刚伸手申请插入意向就被空隙上的锁顶回去排队，幻影连落脚的机会都没有。

    间隙锁有个反直觉的怪脾气：**不同事务往同一段空隙上加间隙锁，居然互不冲突、和平共处**！因为间隙锁唯一的使命是「不许往这儿插新行」，守门的卫兵之间没必要自己打自己；只有当别的事务真执行 `INSERT`、申请插入[[意向锁]]时，才会跟空档上所有的间隙锁迎头相撞。这就解开了线上一个经典悬案：明明没人动任何旧行，一句普通的 `INSERT` 却卡到超时——它撞上的正是别人加在空气里的间隙锁。

    记住两条天天用得上的降级例外：第一，用**唯一索引做等值查询且确实命中**（如主键查 `id = 11`），根本没有范围可言，临键锁会自动退化成只锁那一行的[[记录锁]]，不封两边空隙；第二，把隔离级别调到 [[READ COMMITTED]]，间隙锁基本被关掉，撤掉幻读防线换取更顺畅的并发插入。
  derivation: original
  sources:
  - ref: mysql-locking-docs
    locator: 17.7.1 [[InnoDB]] Locking（Gap Locks / Next-Key Locks 两节）
    claim: 临键锁锁住索引记录及其前面的间隙，[[REPEATABLE READ]] 下用它防止幻读；唯一索引等值命中时只加[[记录锁]]；READ COMMITTED 下间隙锁基本禁用
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: txa
      id: a
      label: 事务 A：临键锁锁住 (10, 20] 整段
    - lane: txb
      id: b
      label: 事务 B：想插入 id=15，被间隙挡住
    - lane: idx
      id: i
      label: 索引：10 · 11 · 13 · 20，间隙全部上锁
      highlight: true
    messages:
    - id: m1
      from: b
      to: i
      label: 插入意向与临键锁冲突，先等着
      active: true
    registers:
    - name: 防的是
      value: 幻读：范围里凭空多出新行
    - name: 手段
      value: 锁住新行将要落脚的间隙
  log:
  - mode: 间隙
    event: 给还不存在记录的位置上锁之后，幻读在新行插入的那一刻就被挡下了
- id: mvcc-division
  title: "[[MVCC]] 与锁怎么划界：普通读看快照，要动手的必须[[当前读]]"
  tldr: 普通 SELECT 走[[快照读]]看历史版本、全程零加锁；UPDATE、DELETE 与 [[FOR UPDATE]] 走[[当前读]]，必须读最新已提交版本并当场加锁，先普通查再直接改极易丢更新。
  body: |-
    把事务课的版本链和本课的锁摆到一起，读写分界线只看一句话：**这次读完，你接不接着动手改？**普通的 `SELECT` 只是看看，走的是[[快照读]]——拿着开事务时领到的快照沿 [[undo]] 版本链挑可见版本，全程一把锁都不沾，所以读永远不挡写、写也永远不挡读。反过来，`UPDATE`、`DELETE` 和带了 `SELECT ... [[FOR UPDATE]]` 的语句都是奔着动数据去的，一律走[[当前读]]：必须直读最新已提交版本，并当场把锁扣在索引记录上。

    业务代码里最隐蔽的坑，是在一个事务里写「先普通 `SELECT` 查出余额 1000，在代码里减 100，再发 `UPDATE` 把余额设成 900」。前一句是快照读没加锁，中间那几毫秒别人可能早把余额扣成 800 并提交了——你拿快照里过期的 900 写回去，当场把别人的扣款无声盖掉。凡是「先查后算再改」，要么查的时候就加上 `FOR UPDATE` 占住锁，要么在 `UPDATE` 的条件里带上原值或版本号核对。

    再补一块 [[READ COMMITTED]] 档位下的减负小机制，叫「半一致性读」：当 `UPDATE` 扫到某行正被别人锁着时，不会立刻干等，而是先偷看一眼这行最新已提交的版本满不满足 `WHERE` 条件——不满足就直接跳过不加锁，真满足了才排队等锁再重读最新版。这也说明：脱离隔离级别谈一句 SQL 怎么加锁，往往鸡同鸭讲。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: txa
      id: a
      label: 普通读：沿版本链挑快照版本
    - lane: lockmgr
      id: l
      label: 当前读：读最新版并当场上锁
      highlight: true
    - lane: idx
      id: i
      label: 同一行：快照版本与最新版本并存
    messages:
    - id: m1
      from: a
      to: i
      label: 看归看，不上手
      active: true
    registers:
    - name: 快照读
      value: 不上锁，看历史版本
    - name: 当前读
      value: 读最新版，加锁占住
  log:
  - mode: 分工
    event: 读的秩序归版本链、写的秩序归锁，两者的分界线是这次读完之后要不要动手改
- id: wait-and-timeout
  title: 抢不到锁怎么办：挂进队列睡等，超时闹钟兜底
  tldr: 申请锁被拒后不会立刻报错或空转烧 CPU，而是挂进等待队列睡眠并登记进[[等待图]]；万一持锁方迟迟不放，由 innodb_lock_wait_timeout 超时回滚兜底。
  body: |-
    事务 B 伸手要拿 `id=7` 的排他锁，发现正攥在事务 A 手里，接下来会发生什么？它既不会当场报错，也不会在原地死循环空转，而是被锁管理器挂进等待队列睡过去，等 A 提交或回滚松手后再按序唤醒。反映到业务接口上，就是这句 SQL 像冻住一样迟迟不返回——线上接口突然成片卡顿，多半就睡在这条队列里。

    睡觉不能没个闹钟：万一持锁的事务 A 卡在某个慢接口上迟迟忘了提交，后面排队的人总不能无限期陪葬。所以引擎设了一道笨但管用的底线——锁等待超时（`innodb_lock_wait_timeout`），睡过时限还没拿到锁就直接报错回滚。与此同时，锁管理器会把每一条「谁在等谁的哪把锁」实时记成一张内存里的[[等待图]]，并通过 `performance_schema` 里的 `data_locks` 与 `data_lock_waits` 两张表敞开给你查；值班遇上接口卡死，先查这两张表顺藤摸瓜揪出队首那个长事务，一抓一个准。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: txb
      id: b
      label: 事务 B：申请锁被拒，挂进等待队列
    - lane: lockmgr
      id: l
      label: 锁管理器：记下「B 在等 A」这条边
      highlight: true
    - lane: txa
      id: a
      label: 事务 A：正持着锁干活
    messages:
    - id: m1
      from: b
      to: l
      label: 睡下等待，超时自动回滚
      active: true
    registers:
    - name: 等待的形态
      value: 进队列睡眠，不空转
    - name: 兜底
      value: 锁等待超时 → 报错回滚
  log:
  - mode: 等待
    event: 等待关系被一条边一条边记成图，谁在等谁全是现成的线索，死锁检测靠的就是它
- id: deadlock-form
  title: "[[死锁]]怎么拧成环：交叉拿锁让双方互等对方先松手"
  tldr: 事务 A 攥着 id=7 等 id=9，事务 B 攥着 id=9 等 id=7，[[等待图]]里的箭头闭合成环；死锁四条件全部凑齐，没有任何一方能靠自己醒来。
  body: |-
    现在让两笔转账按相反顺序撞个满怀：事务 A 先更新 `id=7` 攥住 7 的排他锁，同一时刻事务 B 先更新 `id=9` 攥住 9 的排他锁；紧接着 A 转头要改 `id=9`（被 B 占着，睡下等 B），B 转头要改 `id=7`（被 A 占着，睡下等 A）。看一眼[[等待图]]，`A → B → A` 首尾咬合成了一个死环。两人都睡着了，醒来的唯一条件是对方先提交放锁，可对方也正睡着等你先放——[[死锁]]当场锁死。

    拿教科书上的死锁四条件逐条对号，本现场一应俱全：排他锁同时只归一人（**互斥**）、攥着手里这把又去要下一把（**占有并等待**）、未提交事务的锁旁人硬抢不走（**不可剥夺**）、等待箭头绕成闭环（**循环等待**）。它跟普通排长队的本质区别只在那个环：单向长链再长，排头一提交就会顺次解开；一旦成环，哪怕等到地老天荒也不会再动一下。

    最棘手的是，单看 A 或 B 各自的代码都挑不出半点语法毛病，本地单测跑一万次也全是绿的，偏偏在线上高并发交错的那几毫秒里撞出了闭环。好在每次死锁发生，InnoDB 都会把双方的 SQL 原文和持锁清单写进 `SHOW ENGINE INNODB STATUS` 的死锁日志里，留下一份专供事后破案的黑匣子。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: txa
      id: a
      label: 事务 A：持有 7，在等 9
    - lane: txb
      id: b
      label: 事务 B：持有 9，在等 7
    - lane: lockmgr
      id: l
      label: 等待图：A → B → A，环闭合
      highlight: true
    messages:
    - id: m1
      from: a
      to: l
      label: 我等 B 放 9
      active: true
    - id: m2
      from: b
      to: l
      label: 我等 A 放 7
    registers:
    - name: A 的状态
      value: 持有 7，等 9
    - name: B 的状态
      value: 持有 9，等 7
    - name: 破局可能
      value: 内部无解，必须外力介入
  log:
  - mode: 死锁
    event: 等待图一旦闭环，局内就没有任何一方能靠自己走出来，这和排成链的等待会自行解开完全不同
- id: deadlock-detect
  title: 当场破案：新等待入图时顺藤找环，高并发可关检测
  tldr: 锁管理器在每次新增等待边时顺着[[等待图]]即时追查闭环，秒级揪出[[死锁]]；但上千线程同抢一行热数据时搜图本身会烧满 CPU，可关掉检测改靠短超时兜底。
  body: |-
    局内人自己醒不过来，只能靠锁管理器下场破案。它的侦测不是开个后台线程定时瞎转悠，而是精准的**事件驱动**：原本无环的老图绝不会自己长出环来，只有当某个事务拿不到锁、往[[等待图]]里新添一条等待边的那一刻，锁管理器才顺着箭头一路往前摸——「你在等谁，他背后又在等谁」。只要追着追着绕回了出发者本人，闭环当场坐实，一毫秒冤枉觉都不用多睡。

    这套即时检测在日常并发下又快又轻，唯独怕一种极端场面：秒杀大促时，成百上千个线程同一瞬间冲向同一行商品库存。等待队列瞬间排成长龙，每新挤进来一个线程，锁管理器就要把这张庞大的长图重追一遍，搜图本身反倒成了拖垮全场 [[CPU]] 的元凶。

    为此 [[InnoDB]] 留了 `innodb_deadlock_detect` 开关：常规业务默认开着享受秒级破锁；真到了热点行千人哄抢的战场，可以把死锁检测关掉，退回锁等待超时并把时限调短到一两秒——用偶尔撞锁时多等一秒钟，换掉正常排队路径上的沉重搜图税。
  derivation: original
  sources:
  - ref: mysql-locking-docs
    locator: 17.7.5.2 Deadlock Detection（死锁检测与可禁用性）
    claim: "[[InnoDB]] 默认开启死锁检测，自动发现死锁并回滚涉事事务；高并发下检测会拖慢等待路径，可关闭检测、改靠 innodb_lock_wait_timeout 兜底"
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: lockmgr
      id: l
      label: 锁管理器：顺等待边追踪找环
      highlight: true
    - lane: txa
      id: a
      label: 事务 A：在环上
    - lane: txb
      id: b
      label: 事务 B：也在环上
    messages:
    - id: m1
      from: l
      to: a
      label: 追回出发点 → 环成立
      active: true
    registers:
    - name: 检测时机
      value: 每次新等待产生时
    - name: 检测代价
      value: 等待图越大越贵，高并发可关
  log:
  - mode: 检测
    event: 破案靠的是把等待关系显式记成图来追踪，环在这张图里无处藏身
- id: victim
  title: 挥刀解套：挑已改行数最少的事务处决回滚
  tldr: 闭环一旦成形就必须强行回滚一方来放锁破局；[[InnoDB]] 按已插入、更新、删除的行数挑改动最少的「小事务」牺牲，应用收到[[死锁]]错后必须整笔事务重来。
  body: |-
    闭环抓到了，怎么破局？常有人问：「能不能谁也别杀，强行让一个人把锁先借给对方？」不行——锁底下护着的是已经写进数据页里的半截未提交改动，想松开锁，必须先拿 [[undo]] 日志把改了一半的现场擦回原样，而「擦干净并放锁」就叫回滚。锁管理器挑牺牲品从不抓阄，而是算经济账：比较环上各方已经插入、更新、删除了多少行，专挑改动行数最少、刚动手没两下的「小事务」回滚。它一退场，名下所有锁瞬间清空，已经搬了半座山的大事务立刻被唤醒跑完，全场白费的总功夫最少。

    写业务代码时记住两条保命规矩：第一，收到数据库抛回的死锁错误不是代码出了 bug，而是高并发争抢下的常规交通疏导，捕获后自动重试是标准写法；第二，**重试必须整笔事务从头再来**，绝不能只补发报错的那最后一句 SQL——被选作牺牲品的整个事务都已经彻底回滚，它前面改过的数据和拿过的锁早就不存在了。
  derivation: original
  sources:
  - ref: mysql-locking-docs
    locator: 17.7.5.2 Deadlock Detection（牺牲者挑选准则）
    claim: InnoDB 检测到死锁后回滚其中一个事务，并倾向于挑规模小的事务——规模按其已插入、更新、删除的行数衡量
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: lockmgr
      id: l
      label: 锁管理器：按改动行数挑牺牲者
      highlight: true
    - lane: txa
      id: a
      label: 被回滚的事务：锁全释放
    - lane: txb
      id: b
      label: 幸存的事务：被唤醒，继续
    messages:
    - id: m1
      from: l
      to: a
      label: 你改得最少，请你重来
      active: true
    registers:
    - name: 挑选准则
      value: 已改动行数最少
    - name: 应用的姿势
      value: 收到死锁错误，整笔重试
  log:
  - mode: 处决
    event: 破局不靠讲理靠算账：挑回滚代价最小的事务牺牲，让全体浪费的总成本最小
- id: avoid
  title: 工程防[[死锁]]四招：统一加锁顺序，收窄锁面与持锁窗口
  tldr: 所有事务固定按主键升序拿锁就能从几何上消灭闭环；配合短事务、更新必走索引、十万行大任务拆小批提交，能提前挡掉线上九成以上的死锁。
  body: |-
    与其等死锁发生后再回滚重试，不如在写代码时直接拆掉它成环的条件。死锁四条件里最好下手的突破口就是「循环等待」：**全系统约定按同一顺序加锁**。回到开头的转账场景，不管是 7 转给 9 还是 9 转给 7，代码里先对两个账户 id 排个升序，一律先锁 `id=7` 再锁 `id=9`。所有人都朝同一个方向拿锁，[[等待图]]里只会出现单向排队的链，永远绕不出闭环。

    第二招是**把事务削到最短**：调外部接口、做复杂风控计算这类慢活统统放在开启事务之前，进事务只跑最核心的几句改表就立刻提交，持锁窗口从几百毫秒压到几毫秒，迎面撞车的概率自然断崖下跌。第三招是**严防无索引更新**：锁挂在索引记录上，走精准索引只锁命中的几行，漏掉索引扫全表则等于把相撞靶面凭空放大成千上万倍。

    第四招专门针对后台批量订正与历史数据清理：千万别一句 `UPDATE` 或 `DELETE` 一口气改十万行——那等于把半张表死死锁住几十秒，线上正常请求全得陪绑超时。把它按主键切成每批 500 行、批批独立提交的小事务，锁面和持锁时长同时缩到最小；代价只是整批不再天然原子，中途中断靠业务记录游标续跑即可。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: txa
      id: a
      label: 事务 A：按 id 升序拿锁
    - lane: txb
      id: b
      label: 事务 B：同序拿锁，只排队不成环
    - lane: lockmgr
      id: l
      label: 等待图：只有链，没有环
      highlight: true
    messages:
    - id: m1
      from: a
      to: l
      label: 同序加锁，环无从闭合
      active: true
    registers:
    - name: 习惯一
      value: 全系统固定加锁顺序
    - name: 习惯二
      value: 事务短、持锁窗口小
    - name: 习惯三
      value: 更新走索引，锁收窄
  log:
  - mode: 预防
    event: 固定加锁顺序拆掉的是死锁四条件里最容易拆的循环等待，光这一个习惯就能大幅降低死锁发生的概率
- id: two-orders
  title: 单机并发总收束：读归快照，写归索引锁，带走三问
  tldr: 单机并发由 [[MVCC]] 快照与索引锁共同撑起，两者都挂在同一棵 [[B+ 树]]上；审视任何高并发 SQL，依次问清「读法、索引路径、加锁顺序」三件事即可。
  body: |-
    把事务课和本课拼成整图，单机数据库的并发世界其实只靠两套秩序运转：读的秩序归 [[MVCC]]——普通查询领一份快照沿版本链各看各的，谁也不挡谁；写的秩序归锁——所有改数据的[[当前读]]顺着索引排队，用[[记录锁]]护行、[[间隙锁]]防[[幻读]]，撞成闭环就挑最小代价回滚。这两套秩序扎根在同一棵 [[B+ 树]]上：版本链挂在索引记录里，锁也卡在索引记录与空隙上，所以「走对索引」既决定了查询有多快，也决定了锁面有多窄。

    以后评审任何高并发写代码时，直接在脑子里过一遍这**并发审查三问**：**① 这次读是快照读还是当前读？**（先查后算再改的逻辑，有没有漏加 `FOR UPDATE` 或乐观版本号而埋下丢失更新？）**② 这句写操作走了哪条索引？**（是唯一索引等值命中退化成单行记录锁，还是范围扫描带出了临键锁，甚至漏掉索引锁了全表？）**③ 多行修改的加锁顺序固定吗？**（有没有先按主键升序排列、把慢操作挪出事务外，并配好整笔事务的死锁重试？）
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: txa
      id: a
      label: 读者：快照读，不上锁
    - lane: txb
      id: b
      label: 写者：按索引排队拿锁
    - lane: idx
      id: i
      label: 同一棵索引树：版本与锁都挂在上面
      highlight: true
    messages:
    - id: m1
      from: a
      to: i
      label: 读的秩序
      active: true
    - id: m2
      from: b
      to: i
      label: 写的秩序
    registers:
    - name: 读秩序
      value: MVCC 快照
    - name: 写秩序
      value: 锁与死锁检测
    - name: 共同地基
      value: 索引记录
  log:
  - mode: 收束
    event: 单机之内并发的拼图到此合拢，下一站把同一本账送出这台机器，看复制怎么运转
minutes: 30
level: 进阶
prereq:
- data/transactions
- data/db-internals
objectives:
- 说清 InnoDB 行锁真正挂靠在索引记录上的机制，以及不走索引与二级索引更新时的加锁推论
- 画出记录锁、间隙锁与左开右闭临键锁的区间形状，解释间隙锁怎样防幻读及两大退化例外
- 划清 MVCC 快照读与加锁当前读的分界线，推演一次交叉更新从等待图成环到处决小事务的全过程
- 用「并发审查三问」和四条工程习惯在代码上线前消除大部分死锁与锁膨胀隐患
aiLink: 多智能体协作与分布式任务编排里同样躲不开这套规矩：多个 [[worker]] 同时争抢同一份工单或共享记忆时，一样要靠乐观版本号、排他租约、超时退场与按固定顺序拿资源来防卡死；吃透数据库的索引锁与[[死锁]]，就握住了所有共享可变状态的协作底线。
design:
- mechanism: 把行锁挂在索引条目上，而不直接锁数据本体
  problem: 数据库里找到任何一行都必须顺着索引树逐页往下摸，压根没有绕开索引直达数据本体的暗道；要是把锁贴在底层数据上而不管寻路入口，走不同索引找过来的事务很难在第一时间统一拦截，更没法给「尚不存在记录的空档」上锁防插入。
  choice: 让所有行级锁一律登记在索引条目与条目之间的空隙上——有主键挂主键、走二级索引先锁二级再锁主键，连一个索引都没建的表也由引擎自动生成隐藏[[聚簇索引]]给锁挂靠。
  tradeoff: 锁的范围从此跟查询选的索引死死绑在一起：更新一旦漏掉索引退化成全表扫描，扫过的每条记录都会被顺手上锁；两个事务走不同索引改同一批行时，拿锁先后天然不一致，平白多了撞成[[死锁]]的机会。
  root: 管制点必须设在所有访问路径的咽喉要道上；对数据库记录来说，索引就是唯一的寻址入口，守住索引条目与空隙就守住了整张表的全部读写通道。
- mechanism: 隔离级别分档出售，允许关掉间隙锁换取并发吞吐
  problem: 想在范围查询和更新里彻底防住[[幻读]]，就得用[[临键锁]]把沿途空隙统统封死，可这会把毫不相干的正常并发插入一并挡在门外；而现实里很多业务根本不在乎多出来的一行，全员强制上满最严的锁纯属白交吞吐税。
  choice: 把防护做成明码标价的档位菜单：默认的 [[REPEATABLE READ]] 开着间隙锁严防幻读；切到 [[READ COMMITTED]] 则基本关掉间隙锁、只留[[记录锁]]（还配上不匹配即跳过的半一致性读），让业务自己拿一点异常风险换顺畅的写入并发。
  tradeoff: 选型责任落回了工程师肩上：切到低隔离档位前必须亲自想清楚「幻读和不可重复读在我的业务里会不会算错钱」，一旦漏判不会当场报错，只会在高并发角落悄悄对不上账。
  root: 并发世界里没有白送的隔离——每多防一种并发异常，就要多圈禁一片原本能并行的空间；各业务的容错底线天差地别，做成可选档位才是最划算的公约数。
- mechanism: 死锁采用「事后找环 + 处决小事务」，而非事前强行预防
  problem: 交互式事务里 SQL 是一句接一句现发过来的，数据库开场时根本不知道这笔事务后面还要锁哪些行；要是强行在事前杜绝死锁，就得逼所有人开场一次性报齐全部锁或按全局死规矩拿锁，并发度和易用性都会大打折扣。
  choice: 允许死锁偶尔发生，但把它变成一件低成本小事：每次新产生锁等待时顺着[[等待图]]即时找环，一旦成环当场挑已改行数最少的小事务回滚放锁，让其余事务立刻继续。
  tradeoff: 被挑中的事务干了一半的活全部白费，业务代码必须把「捕获死锁错并整笔事务重试」当成基本功；到了千人争抢同一热点行的极端场面，找环本身还会反客为主烧光 [[CPU]]，只能关掉检测退回超时闹钟兜底。
  root: 对低频且能靠回滚无损擦净的故障，事后花极小代价快速解套，远比事前让每一笔正常请求都背上沉重枷锁划算得多。
terminal:
- cmd: SHOW ENGINE INNODB STATUS\G
  note: 翻到 LATEST DETECTED DEADLOCK 一节，复盘最近一次死锁的双方与被回滚方
- cmd: SELECT * FROM performance_schema.data_lock_waits;
  note: 实时看谁在等谁：等待图的一条边就是一行
- cmd: SET SESSION innodb_lock_wait_timeout = 5;
  note: 把锁等待超时调小：本地实验死锁时不用干等默认时长
