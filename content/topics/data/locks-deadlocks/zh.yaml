- id: victim
  title: 处决：挑一个代价最小的事务回滚
  tldr: 环上必须死一个：挑改动行数最少的回滚，它的锁全部释放，环断，其余人继续。
  body: '环找到了，破法只有一招：从环上挑一个事务，强制回滚。它的锁随之全部释放，环断开，其他事务被逐个唤醒、继续执行，像什么都没发生过。被挑中的那个，应用层会收到一个死锁错误——它干过的活全部作废，得由应用自己决定是否重试。

    挑谁？总不能随机。准则很实际：挑回滚代价最小的那个。InnoDB 的算法是看事务已经改动了多少行——插入、更新、删除的行数越少，这个事务已经投入的工作越少，撤销它浪费的社会总成本越低，锁等待超时同理。说白了，处决的是那个「还没干多少活」的新手，而不是已经搬了半座山的壮汉，因为让壮汉重来一遍的代价大得多。

    对写代码的人，结论有两条：一，死锁是并发系统里的正常事件而不是程序错误，收到死锁错误就重试，是数据库应用的标准姿势，框架层通常会代劳；二，重试要整笔事务重来，不能只补发失败的那一句——被回滚的是整个事务，它先前拿到的锁与改动都已不存在了。

    还有一个常被问的问题：为什么不干脆不回滚、让环上的人按某种顺序继续排队？因为两个事务都已睡死、且都持有对方需要的锁，任何「继续」都需要先有一方松手，而松手等于放弃它已完成的那部分工作——回滚正是「有代价的松手」的正式名字。处决与重试合起来，就是这套机制的全部代价：偶尔白干一小笔，换绝大多数时候的高并发。'
