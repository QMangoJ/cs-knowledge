- id: gap-nextkey
  title: 间隙锁防的是幻读：给不存在的位置上锁
  tldr: 同一事务两次查同一范围，中间被人插入新行就是幻读；把间隙锁住，新行便插不进来。
  body: '间隙锁防的怪事叫幻读：事务 A 两次执行同一个范围查询，第一次查 id 在 10 到 20 之间有三行；中间事务 B 插入一行 id=15 并提交；A 再查，变成四行——同一事务里同一句话，行数凭空多出一行，如同幻影。快照读能防住「同一行被改」，却防不住「多出一行」，因为新行根本不在 A 的快照视野的判定方式之内（它出生在 A 开始之后，却落进了 A 的查询范围）。

    解法就是把范围里的间隙全部锁住：A 做范围更新时，按临键锁把 (10, 20] 这一段的记录与间隙整体锁死，B 想往里插入 id=15，必须先在这段间隙上申请插入意向，而它与 A 的临键锁冲突，只能等 A 结束。幻影被堵在门外，靠的不是锁住新行——新行还不存在——而是锁住它将要落脚的位置。

    两个实用的例外要记牢：其一，用唯一索引做等值查询且确实命中时，只锁那条记录、不锁间隙（范围不存在，幻读无从谈起）。其二，把隔离级别降到 READ COMMITTED，间隙锁基本被关闭，幻读防线随之撤掉，换来的是插入并发更顺——这是隔离级别菜单里一笔明码标价的交易。

    间隙锁还有个怪脾气要提前知道：它纯粹是「只拦插入」的，不同事务在同一段间隙上加的间隙锁互不冲突，可以和平共存——因为它们要拦的是第三方的插入，而不是彼此。可一旦有人真往这段间隙里插，插入请求要先拿插入意向锁，这把锁与所有间隙锁都冲突，于是插的人要等间隙上的锁全部释放。这解释了一个常见现场：明明没人改任何已有的行，一个 INSERT 却莫名其妙地卡住——它在等的，是别人对着空气上的一把锁。'
  derivation: original
  sources:
  - ref: mysql-locking-docs
    locator: 17.7.1 InnoDB Locking（Gap Locks / Next-Key Locks 两节）
    claim: 临键锁锁住索引记录及其前面的间隙，REPEATABLE READ 下用它防止幻读；唯一索引等值命中时只加记录锁；READ COMMITTED 下间隙锁基本禁用
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
