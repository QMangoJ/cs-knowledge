level: 进阶
prereq:
- data/transactions
- data/db-internals
objectives:
- 说清 InnoDB 的锁真正锁住的对象，以及这个事实带来的推论
- 区分记录锁、间隙锁、临键锁各自守护的范围与场面
- 推演一次死锁从成环、检测到处决牺牲者的全过程
- 列出减少死锁的三条工程习惯及其拆解的死锁条件
aiLink: 多智能体系统与分布式任务调度里同样有这套问题：多个执行者争抢同一份共享状态时，需要同样的排队、超时与冲突消解；理解数据库的锁，等于理解一切「共享可变状态」的协作底线。
design:
- mechanism: 为什么锁要挂在索引记录上，而不是直接锁住数据行本身
  problem: 根本约束是拦截点必须位于必经之路上：数据库里找到一行的方式只有沿索引逐页下行，不存在绕开索引直达数据本体的通道；若锁挂在数据本体上，不同索引路径来的人可能互不知情，锁便拦不住本该拦住的访问
  choice: 做法是让一切锁都登记在索引记录与间隙上：行锁即索引记录锁，范围锁即一串记录加它们之间的间隙；没有索引的表也要先造一个隐藏聚簇索引，让锁永远有地方挂靠
  tradeoff: 代价是锁的范围被索引路径绑架：走哪条索引就锁哪条路径，不走索引的更新要沿扫描路线逐条上锁、范围失控；两个事务用不同索引改同一批行时，加锁顺序天然不一致，平白多出死锁的温床
  root: 根子在寻址方式上：一个系统里，凡是要对某个对象施加管制，管制点必须设在所有访问的汇合处。对行而言汇合处就是索引——锁守在那里，等于守住了这行的一切出入口
- mechanism: 为什么隔离级别要分档出售，而不是一律用最严的锁法把幻读之类全部锁死
  problem: 根本约束是正确性与并发的兑换率：要防住幻读，就得给范围查询配上间隙与临键锁，可这些锁会挡住毫不相干的插入，把并发吞吐实打实地压下去；而并非每笔业务都真的在乎幻读，多花的锁纯属浪费
  choice: 做法是把防线拆成档位明码标价：默认的可重复读保留间隙锁、防住幻读；读已提交则关掉间隙锁、只留记录锁，拿一部分异常的可能性换更顺的插入并发；要用哪档，由业务在开事务时自己选
  tradeoff: 代价是心智负担转移给了使用者：选低档位的人必须自己回答「幻读在我这个场景里会不会真的造成错误」，选错了不会报错，只会在某个并发时刻悄悄算错账，属于最难查的一类故障
  root: 根子在「没有免费的正确」：每多防一种异常现象，就要多锁住一片本来可以并行的空间。把防线做成菜单而不是铁律，是因为异常的代价因业务而异，只有业务自己知道哪种错最贵
- mechanism: 为什么死锁靠「检测加处决」事后处理，而不是从设计上彻底预防
  problem: 根本约束是循环等待无法廉价地事前判定：事务是随到随执行的，没人事先知道每个事务将要按什么顺序拿哪些锁；若强行预防，就得要求全系统统一加锁顺序或一次性申请全部锁，前者约束业务写法、后者大幅降低并发，都比死锁本身更贵
  choice: 做法是承认死锁会发生，转而让它发生得便宜：把等待关系显式记成图，每有新等待就顺图找环，一旦成环立刻挑回滚代价最小的事务处决，用一个小事务的白干换全体解套
  tradeoff: 代价是被处决事务的工作全部作废且不可预期，应用必须把「死锁重试」写成默认动作；高并发时检测本身成为负担，还得退回更笨的超时制来兜底，等于承认检测也有它的规模上限
  root: 根子在罕见事件的最优策略：对低频且可挽回的故障，事后廉价处理优于事前昂贵封堵——这和写入路径先记日志、崩溃后再恢复是同一种哲学，数据库在很多地方都选了「先让它发生，用回滚与重放兜底」
terminal:
- cmd: SHOW ENGINE INNODB STATUS\G
  note: 翻到 LATEST DETECTED DEADLOCK 一节，复盘最近一次死锁的双方与被回滚方
- cmd: SELECT * FROM performance_schema.data_lock_waits;
  note: 实时看谁在等谁：等待图的一条边就是一行
- cmd: SET SESSION innodb_lock_wait_timeout = 5;
  note: 把锁等待超时调小：本地实验死锁时不用干等默认时长
