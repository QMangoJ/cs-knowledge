- id: deadlock-form
  title: 死锁成环：两个人互相等对方先放手
  tldr: A 锁住 7 等 9，B 锁住 9 等 7——等待图里出现环，谁也不会先醒，死锁就此成形。
  body: '现在让两只手以相反的顺序伸向同两行。事务 A 先更新 id=7，拿到了 7 的锁；事务 B 先更新 id=9，拿到了 9 的锁。接着 A 要更新 id=9——被 B 占着，A 睡下等 B；B 要更新 id=7——被 A 占着，B 睡下等 A。等待图里，A 指向 B、B 又指回 A，一个环闭合了。两个人都睡着，都在等对方先醒来放手，而醒来的唯一条件恰恰是对方先动——死锁成立，这个局没有任何一方能靠自己走出来。

    把教科书的死锁四条件逐一对号，会发现它们在本场景里全齐：互斥——行锁是排他的，一把锁同时只能归一个事务；占有并等待——两人都攥着一把锁、等着另一把；不可剥夺——锁只能由持有者自己释放，旁人抢不走；循环等待——等待关系绕成了环。四条凑齐，死锁不是可能发生，而是必然僵死。

    注意死锁与普通锁等待的区别只在那个环：排成一条链的等待，再长也会随着队首提交逐个解开；成了环的等待，等到天荒地老也不会有任何变化。破局只能靠外力——下一幕，锁管理器亲自下场。

    值得留意的是，这出戏里没有任何一方做错事：两个事务各自的语句都合法、顺序也都说得通，错误只存在于两者交错的时序里。这正是并发问题最难缠的地方——同样的代码跑一万次可能只撞上一回，测试环境里几乎无法复现，只能靠理解成环的机理去预防、靠保留现场去复盘。死锁日志里留下的双方语句与持锁清单，就是为这种「万里挑一」的相撞准备的黑匣子。'
  derivation: original
  canvas:
