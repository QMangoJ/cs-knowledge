subject: data
slug: locks-deadlocks
order: 6
status: published
license: CC-BY-4.0
title: 锁与死锁：锁的到底是什么
summary: "[[InnoDB]] 的行级锁从来不直接锁数据行，而是挂在 [[B+ 树]]索引的条目与空隙上：[[记录锁]]守住已有条目，[[间隙锁]]封死两条记录之间的空档防[[幻读]]，两者合体的[[临键锁]]把整个值域切成左开右闭区间无缝看守。普通读走 [[MVCC]] 快照不加锁，改数据走[[当前读]]按索引排队；一旦交叉拿锁让[[等待图]]闭合成环，锁管理器就挑已改行数最少的小事务回滚解套。全课顺着 accounts 表的扣款与转账，从锁的落脚点、区间谱系一直拆到死锁侦破与工程防环习惯。"
premise: "在 [[MySQL]]（[[InnoDB]]，默认隔离级别 [[REPEATABLE READ]]）的 accounts 账户表上，事务 A 和事务 B 同时动手转账扣款：两人先对同一个余额 1000 的账户各扣 100，为什么没锁时有一笔扣款会凭空消失？加上锁之后，A 先改 id=7 再改 id=9，B 先改 id=9 再改 id=7，程序怎么又突然卡死甚至收到报错回滚？更怪的是，有时明明没人动旧行，新插一条记录也会被空气挡在门外。数据库里的锁究竟挂在哪儿，又怎么解开拧成死结的等待？"
position: 本课位于数据存储板块第六段「锁与死锁」，承接事务课与查询执行课往并发深水区推进：事务课用版本链解决了读者之间互不阻塞，查询执行课讲清了索引寻路，这一课补齐写者撞车时的排队规矩与死锁解套机制，也为下一课跨出单机做主从复制打下写序基础。
bridge:
  prev: 上一课看优化器算账选路时，我们默认整张表安安静静没人同时动手修改；一旦真实流量涌进来、两个事务的手同时伸向同一批账户记录，光会算路就不够了，引擎必须先立起写者之间的排队规矩。
  next: 靠着 MVCC 与索引锁两套秩序，单台数据库内部的读写并发已经安排得明明白白；可生产环境从不敢把身家性命只押在一台机器上，下一课把改动的账本送出本机，看多台机器怎样靠主从复制对表追赶。
overview:
- key: 一句话总结
  value: "[[InnoDB]] 的锁是写者之间的排队规矩，只挂在索引条目和条目之间的空隙上；走哪条索引就锁哪条路，更新漏掉索引会把扫描沿途统统锁住。"
- key: 为什么有锁
  value: "[[MVCC]] 只管让普通读看历史快照，管不了两个写者同时改同一行；写必须落在最新版本上排队，并把锁一直攥到事务提交或回滚才释放（[[两阶段锁]]）。"
- key: 锁的谱系
  value: "[[记录锁]]守单条索引记录，[[间隙锁]]封两条记录间的空缺拦插入，[[临键锁]]（记录 + 前面间隙的左开右闭区间）是默认档防[[幻读]]的主力，表级还挂[[意向锁]]先打招呼。"
- key: 与 MVCC 的分工
  value: 普通 SELECT 走[[快照读]]不上锁，读永远不挡写；UPDATE、DELETE 和 SELECT ... [[FOR UPDATE]] 走[[当前读]]，必须读最新已提交版本并当场上锁。
- key: "[[死锁]]的下场"
  value: 锁管理器把「谁等谁」记成[[等待图]]，新等待边一旦闭合成环就当场坐实死锁，挑已改动行数最少（回滚最便宜）的事务处决回滚；千人抢热行时也可关检测改靠超时兜底。
- key: 少死锁的习惯
  value: 全系统按同一顺序（如主键升序）加锁直接消灭环形等待；把慢操作挪出事务缩短持锁窗口；更新务必走索引，大批量任务拆成每批几百行独立提交。
