steps:
- id: why-locks
  title: 有了 MVCC，为什么还要锁
  tldr: 版本链管住了读，管不住两个写者同时改一行；锁就是写者之间的先来后到。
  body: '先演一出小剧场。账户余额 1000，事务 A 与事务 B 几乎同时各扣 100：两人先后读到 1000，各自减成 900，再先后写回——最终余额 900，可正确答案是 800。有一笔扣款凭空蒸发了，这叫丢失更新。它不是谁写错了代码，而是两个写者基于同一份旧值各自计算，又互相覆盖。

    事务课讲的 MVCC 在这里帮不上忙：版本链的本事是让读者各看各的版本、互不等待，可两个写者要改的是同一个行，不存在「各改各的版本」——写必须落在最新版本上，还必须排成一队，一个改完下一个才许动。管理这支队伍的，就是锁。

    所以锁的职责可以一句话说清：它是写者的排队纪律。谁先拿到锁谁先改，后来者要么等、要么读旧版本（普通读），但绝不许和持锁者同时动手。后面所有花样——锁的种类、粒度、死锁——都是这支队伍在不同场面下的排队规则。

    排队的方式也有讲究：锁不是「改完立刻消失」的，它要一直攥在手里直到事务提交或回滚才统一释放，这叫两阶段锁定的后半段规矩——中途不许提前放锁。原因很实际：若改完一行就放行，别人基于你的半成品结果接着改，你最后却回滚了，对方的依据便凭空消失，错误会像涟漪一样传出去。攥到最后一起放，贵是贵一点，换来的是别人永远只会看到你完整提交后的样子。'
  derivation: original
  canvas:
