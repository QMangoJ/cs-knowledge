- id: mvcc-division
  title: 锁与 MVCC 的分工：谁管读，谁管写
  tldr: 普通读走快照不上锁，当前读才加锁；更新必须读最新版本，这是两条秩序的分界线。
  body: '把锁和事务课的版本链摆在一起，分工其实很清爽。普通的 SELECT 是快照读：按开事务时领的快照沿版本链挑一个可见版本，全程不加任何锁，读者与写者互不等待——这是数据库读并发的来源。而 UPDATE、DELETE 与 SELECT … FOR UPDATE 这类动作属于当前读：它们要动数据，必须读到这一行最新已提交的版本，并且当场上锁占住，不许别人同时动。

    为什么更新非得读最新版？设想在旧版本上改：你按余额 1000 算出 900 写回去，可这期间别人已经把它改成 800 并提交，你的 900 一落盘，对方的修改就被无声覆盖——又回到丢失更新。所以规矩是：写必须站在最新版本上接着写，锁则保证你站上去之后、写完之前，没人再动它。

    实践中最容易踩的误会，是以为「我在一个事务里，先查后改，查到的就是我改的」。查是快照、改是当前读，两者可能隔着别人的提交；先查后改的代码若不加 FOR UPDATE 或不做版本校验，查到的值只能当参考，不能当依据。分工线划清了，并发代码里的大半事故都能提前避开。

    补一个 READ COMMITTED 下的小机制，叫半一致性读：UPDATE 在逐行判断是否匹配条件时，若某行正被别人锁着，它不干等，而是先读这行最新已提交的版本来判断匹不匹配；不匹配就跳过、不必加锁，匹配了才真正排队等锁、再读最新版来改。它是在低隔离档位下给更新减负的补丁，也再次说明同一句话在不同档位下走的完全是不同的路——脱离隔离级别谈锁的行为，几乎总是谈不拢的。'
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: txa
      id: a
      label: 普通读：沿版本链挑快照版本
    - lane: lockmgr
      id: l
