- id: deadlock-detect
  title: 破案：沿着等待图找环
  tldr: 每当有人开始等待，锁管理器就顺着等待边往前追；追回自己，就是死锁，当场立案。
  body: '破案方法意外地朴素：每当一个事务新睡下、等待图里多出一条边，锁管理器就顺着这条边往前追——你在等谁，他又在等谁，一路追下去。若追着追着回到了出发者本人，环出现了，死锁当场坐实，不必再等任何超时。

    这种「一有新等待就查一遍」的即时检测，好处是反应快：死锁在成形的瞬间就被抓住，而不是等某个闹钟响起。代价则是检测本身要花钱：等待图越大、等的人越多，一次追踪要走的边就越多。在并发不高时这点开销可以忽略；但在成百上千个线程争抢同一把热锁的场面，等待队伍排成长龙，每次有人入队都把长图重追一遍，检测自己反倒成了拖慢全场的元凶。

    所以官方留了一个开关：高并发场面可以把死锁检测关掉，退回上一幕那道笨兜底——锁等待超时。牺牲的是破案速度，换来的是等待路径上不再有检测开销。两种姿势没有对错，只有与场面是否相配：等待队伍短就开着检测，队伍长到检测本身成为负担，就靠超时过日子。

    检测的触发点也值得说清：它不是有个后台线程定时巡逻，而是事件驱动——只有当一条新的等待边出现时才需要复查，因为环只可能因新边的加入而闭合，老图里没环的图不会自己长出环来。这个小小的观察让检测的开销与「等待发生的次数」成正比而不是与时间成正比，是它能常开在生产环境里的前提。'
  derivation: original
  sources:
  - ref: mysql-locking-docs
