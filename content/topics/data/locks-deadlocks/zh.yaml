- id: wait-and-timeout
  title: 拿不到锁时：排队睡下，超时兜底
  tldr: 锁被占时请求不报错、不空转，而是挂进等待队列睡下；睡过头了由锁等待超时叫醒并回滚。
  body: '申请锁被拒之后会发生什么？不是立刻报错，也不是傻等空转：这个请求被挂进锁管理器的等待队列里睡下，等持锁者提交或回滚、把锁释放，再按队列被唤醒接着走。对应用来说，表现就是这条 SQL 卡住不动——线上「某个请求 hang 住了」，十有八九是在这里睡觉。

    睡觉不能没有闹钟。万一持锁的事务自己也卡住了、或者干脆忘了提交，所有等它的人就陪着无限期睡下去。所以有一道兜底：锁等待超时（由 innodb_lock_wait_timeout 控制），等超过时限还没拿到锁，这个请求报错、事务回滚，把位置让出来。它是笨办法——不问青红皂白，只看时长——但正因为笨，它能罩住一切检测机制罩不住的等待。

    等待关系本身还被记成一张图：谁在等谁，一条边一条边连起来。这张图平时只是账目，下一幕里它会成为破案工具：死锁的侦破，靠的就是在这张图里找出一个环。

    等待图这本账记得相当具体：每条等待边连同「在等哪条记录上的哪种锁」都登记在案，performance_schema 里的 data_locks 与 data_lock_waits 两张表就是它的对外窗口。线上遇到请求卡住，先别急着重启，去这两张表里看一眼谁在等谁、等的是哪把锁，多半能直接定位到那个迟迟不提交的事务——锁的问题，一大半是某个事务开了太久，而不是锁机制本身出了毛病。'
