- id: lock-kinds
  title: 锁的谱系：从一行到一段空缺
  tldr: 记录锁守已有的行，间隙锁守不存在的位置，临键锁把两者合起来；意向锁是表级的一声招呼。
  body: '顺着索引这条线，锁有三种基本形状。记录锁最直白：锁住某一条索引记录，别人不能改也不能删它。间隙锁（gap lock）则锁住两条记录之间的那段空缺——那里明明没有行，锁的是「不许往这个空档里插入新行」。临键锁（next-key lock）是两者的合体：锁住一条记录，连带锁住它前面的那段间隙，像给一段区间整体上了锁。

    再往上还有两个配角。共享锁与排他锁决定锁与锁之间能不能共存：读用的共享锁彼此相容，写用的排他锁与谁都冲突。意向锁（intention lock）则是表一级的招呼：事务在给某些行上锁之前，先在表上挂一个意向标记，意思是「我在这张表里有行锁」；有人想锁整张表时，看一眼意向标记就知道行不行，不必逐行去查。

    这套谱系存在的理由，是让不同的查询能选不同的守法范围：只改确定的一行，用记录锁就好、互不干扰；要守护一段范围的查询结果不被插入污染，就得出动间隙与临键。下一幕就看后者到底在防什么。

    临键锁的覆盖范围有个具体的形状，值得先有个画面：若索引里现有的值是 10、11、13、20，那么临键锁能锁住的区间依次是（负无穷， 10]、（10, 11]、（11, 13]、（13, 20]、（20, 正无穷）——每把临键锁管一段「左开右闭」的区间，记录是区间的右端点，间隙是区间的内部。整个值域被这些区间无缝铺满，任何一行、任何一个空位，都明确归某把锁管辖，不存在三不管地带。'
  derivation: original
  sources:
  - ref: mysql-locking-docs
    locator: 17.7.1 InnoDB Locking（意向锁与记录锁/间隙锁/临键锁各节）
    claim: InnoDB 支持多粒度锁：意向锁是表级标记；记录锁锁索引记录，间隙锁锁记录之间的空缺，临键锁是记录锁与其前间隙的组合
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
