- id: locks-on-index
  title: 反直觉的起点：锁挂在索引记录上
  tldr: 你以为锁住的是一行数据，其实锁住的是索引里的一条记录；没索引可锁时，引擎会自己造一个。
  body: '本课最反直觉、也最要紧的一句先说在前面：在 InnoDB 里，行级锁锁住的不是数据行本身，而是索引记录（index record）——就是 B+ 树叶子页里的那个条目。官方文档的说法很直白：记录锁永远锁的是索引记录；哪怕一张表连一个索引都没建，引擎也会偷偷给它造一个隐藏的聚簇索引，专供锁挂靠。

    为什么非得挂在索引上？想想锁要守的是什么：它要拦住的是「别人按某种路径找到这一行来改」。大家找行都走索引这条路，锁守在路的门上，才能保证谁来都得先过锁这一关。若把锁挂在数据本体上，走不同索引来的人就可能绕过去，锁便形同虚设。

    推论立刻出现，而且都很实用：其一，更新走哪个索引，就沿哪条路径加锁；不走索引的全表更新，等于顺着扫描路径把扫过的行逐条上锁，锁的范围膨胀到近乎整表。其二，两个事务用不同索引改同一批行，可能以不同顺序逐条加锁——这是后面死锁最常见的温床。记住这条：谈锁的范围，先问走的哪条索引。

    还有个容易忽略的细节：同一行数据，在主键索引与二级索引里是两条不同的记录。用二级索引做更新条件时，引擎先在二级索引上锁住那条记录，再顺着主键到聚簇索引上锁住真正的行——一次更新可能在两棵树上各留一把锁。线上排查锁等待时若只盯着一张索引看，就会漏掉另一半现场。锁跟着索引走这句话，完整版是：你走过的每条索引路径，都会留下锁。'
  derivation: original
  sources:
  - ref: mysql-locking-docs
    locator: 17.7.1 InnoDB Locking（Record Locks 一节）
    claim: InnoDB 的记录锁永远锁的是索引记录；表上没有索引时，InnoDB 会创建隐藏的聚簇索引并用它来加锁
