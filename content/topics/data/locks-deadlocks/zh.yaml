title: 锁与死锁：锁的到底是什么
summary: 锁锁的不是数据行，而是索引上的条目与空隙——从这个反直觉的起点出发，看清间隙锁防幻读、死锁怎样成环、数据库又怎样挑一个事务处决。
premise: 以 MySQL（InnoDB）、默认隔离级别 REPEATABLE READ 为样本：两个事务在 accounts 表上交叉更新 id=7 与 id=9 两行。
position: >-
  本课位于数据存储板块的新一段「锁与死锁」，紧挨着前面事务一课的并发规矩往深处走：事务课讲了快照怎样让读互不阻塞，本课补上写的秩序——当两个事务同时要改同一批行时，靠锁排队、靠死锁检测收拾残局。学完你能说清锁真正挂住的对象是什么，能推演一次死锁从成环到被处决的全过程，也能解释为什么「更新没走索引」会把锁的范围放大到近乎整表。
bridge:
  prev: >-
    上一课的执行之旅里，所有查询都被默认成世界安安静静、没人同时在改；本课把并发请上台：当两个事务的手同时伸向同一批行，引擎要靠什么维持秩序，又会在什么地方被秩序本身卡死。
overview:
- key: 一句话总结
  value: 锁是写者的排队纪律：它真正锁住的是索引记录与记录之间的间隙，而不是数据行本身
- key: 为什么有锁
  value: MVCC 只解决读与写不互等；两个写者同时改同一行，必须有一方先来后到
- key: 锁的谱系
  value: 记录锁守一行，间隙锁守一段空缺，临键锁是两者相加、默认档位的主力
- key: 与 MVCC 的分工
  value: 普通读走快照不上锁；更新、删除与 FOR UPDATE 这类当前读才动用锁
- key: 死锁的下场
  value: 等待图里出现环即判定死锁，挑改动最少的事务回滚，其余继续
- key: 少死锁的习惯
  value: 固定加锁顺序、事务短小、让更新走索引把锁收窄
