- id: clustered
  title: 聚簇索引、二级索引与回表
  tldr: InnoDB 式组织：主键索引的叶子就是整行数据；二级索引的叶子只存主键值，查整行要再走一次主键索引。
  body: '表数据本身怎么放？主流做法（InnoDB）是把表组织成一棵以主键为键的 B+ 树：叶子节点直接存整行，这棵树叫聚簇索引——所以主键查询最快，且主键范围扫描就是顺序读叶子。

    在其他列上建的二级索引是另一棵 B+ 树，叶子存的是「该列值 → 主键值」。用它查整行要两次走树：先在二级索引拿到主键（回表），再去聚簇索引取行。若查询的列都在二级索引里（覆盖索引），就免了回表。建索引前先想清楚查询模式，就是这个原因。

    主键选型的影响从这里来：自增主键让新行永远追加到最右边的叶子，写入是顺序的、分裂最少、页填充率高；随机 UUID 主键则把新行撒到整棵树的各个叶子，到处触发分裂与碎片，同样的数据体积更大、缓存命中更差，这就是有序 ID 在写密集场景受欢迎的底层原因。再看回表的优化方向：若一个查询要的列很多、又无法全塞进二级索引，常见做法是延迟回表——先用二级索引筛出主键集合并排序，再按主键顺序批量回表，把随机回表变成近似顺序读。索引设计从来不是建或不建的二选一，而是把每次访问的页数与 IO 形态算清楚之后的取舍。'
  derivation: original
  sources:
