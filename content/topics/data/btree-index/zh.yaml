- id: delete-merge
  title: 删除与合并：树如何变矮
  tldr: 插入会让树长高，删除多了树也得会变矮，不然删掉一半数据还占着原来的高度。这一步和分裂那一步正好对称着看：一个节点删到低于下限，先向旁边的兄弟借一个键，借不到就和兄弟合并，合并一路传到根的时候，树就矮一层。
  body: >-
    用玩具容量走一遍：每个节点最多 4 个键、最少 2 个键（真实系统里下限是页容量的一半量级，原理相同）。叶子 A 是 [30， 40]，右兄弟 B 是 [50， 60， 70]，父节点分隔键是 50。删 A 中的 30 后 A 只剩
    [40]，低于下限 2。先看能不能借：B 有 3 个键、多于下限，借最小的 50 给 A——A 变 [40， 50]、B 变 [60， 70]，父节点分隔键从 50 更新为 60，借键完成、树形不变。若 B 也只剩 [60，
    70]，借无可借，就合并 A 与 B 成 [40， 60， 70]，父节点删掉分隔键 50；父节点若因此低于下限，同样的借与合并向上传播；根若只剩一个孩子，就让它当新根，树矮一层——这是 B
    加树唯一的变矮方式，与根分裂长高严格对称。

    工程提醒有二：其一，删插交界处反复分裂合并会抖动，实现里常允许节点暂时低于下限或延迟合并；其二，批量删历史数据留下大量半空页，逻辑空间靠合并回收，物理文件未必自动变小，常要靠重建索引或整理表空间把磁盘还回去。
  derivation: original
  sources:
  - ref: cmu-15445
    locator: Lecture 08 B+Tree 删除与节点合并
    claim: "[[B+ 树]]删除在节点低于最小占用时先向兄弟借键、否则与兄弟合并，根合并使树高降低"
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: 删 30 之后：借得到就改分隔键，借不到就合并
    rows:
    - label: 借键（B 富余）
      cells:
      - v: A [40 50]
        mark: found
      - v: B [60 70]
      - v: 父键 50 改 60
        mark: found
    - label: 合并（B 也不富余）
      cells:
      - v: 合并为 [40 60 70]
        mark: active
      - v: 父删键 50
        mark: active
  log:
  - mode: 删除
    event: 删除时的借键与合并和插入时的分裂正好对称，树变矮也只发生在根部
- id: prefix-varlen
  title: 变长键与前缀压缩：扇出为什么会缩水
  tldr: 前面算扇出时一直假设每个键都是定长的 16B，可真实业务里的键常常是邮箱、网址这类长短不一的字符串，装不下原先估算的条数，扇出会缩水、树会变高。这一步看数据库怎么补救：内节点只存最短的可区分前缀，把被长键吃掉的扇出抢回来。
  body: >-
    前面的扇出账假设每条导航项定长
    16B，可真实业务键常是变长字符串：邮箱平均二三十字节，一页只能装五六百条，键再长更少——扇出缩水、树随之长高。对策分两层。内节点层用后缀截断：分隔键不必是完整键，只需短到能分开左右孩子的值域——如相邻真实键分别是 apple
    开头与 apricot 开头的一长串，分隔键存 app
    量级的最短可区分前缀就够导航，省下的空间全换成扇出。叶子层用页内前缀压缩：同一页里的键按序排列，相邻键往往共享长公共前缀，每条只存与前一条不同的后缀部分加一个共享长度，比较时按规则还原。

    代价是实现复杂度：插入可能改变邻居的压缩形态，分隔键在分裂合并时要重算，是 [[CPU]] 换空间的账。结论：真实扇出由键长分布决定，判断索引健康度看平均页填充率与树高监控，比套公式可靠得多。
  derivation: original
  sources:
  - ref: cmu-15445
    locator: Lecture 08 B+Tree 键表示与页内组织
    claim: 变长键通过分隔键截断与页内压缩减少导航项体积，以维持高扇出
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: 同一页的键共享前缀，每条只存差异部分
    rows:
    - label: 完整键
      cells:
      - v: reservation/2026/001
      - v: reservation/2026/002
    - label: 压缩后
      cells:
      - v: 共享 reservation/2026/00
        mark: found
      - v: 后缀 1 与 2
        mark: found
  log:
  - mode: 压缩
    event: 内节点只存能区分左右的最短前缀，叶子页内让相邻键共享公共前缀，省下的空间都换成扇出
- id: covering-walk
  title: "[[覆盖索引]]完整走例：一次[[回表]]到底贵在哪"
  tldr: 回表那一步前面只说了概念，到底贵在哪还没算过具体的页数。这一步拿同一个查询走两遍：一遍老老实实回表，一遍让索引里多带一列、直接在叶子上返回，把两条路的页数逐页算清，你就能判断多带一列到底值不值。
  body: >-
    查询是按邮箱查年龄：SELECT age FROM users WHERE email 等于某个给定值。走法一，[[二级索引]]只建在 email 上：在二级索引树走约 3 层定位到邮箱，叶子条目只有主键 42；再拿 42 去[[聚簇索引]]走约
    3 层，读到整行才取出 age——前后约 6 页访问，其中回表那一跳是纯随机 [[IO]]，批量查询时回表次数随结果行数线性增长，这才是它贵的地方。走法二，把 age 建成组合索引或包含列：同样约 3 层定位，叶子直接带着 age
    当场返回，0 次回表、总访问约 3 页，批量时全是沿一棵树的顺序推进。

    代价也要记账：索引变宽意味着一页条目变少、扇出下降、磁盘与缓存占用变大，age 每次更新还要同步维护这棵索引。包含列是折中：age
    只存、不用作排序与定位，专门免回表。判断标准只有一条：查询频率乘以省下的回表成本，能不能覆盖索引变宽与多维护的成本。
  derivation: original
  sources:
  - ref: cmu-15445
    locator: Lecture 08 覆盖索引与索引包含列
    claim: 查询所需列全在二级索引内时可免去回表，代价是索引更宽、写维护更贵
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: 同一次查询：回表版约 6 页，覆盖版约 3 页
    rows:
    - label: 只建 email 索引
      cells:
      - v: 二级索引约 3 层
      - v: 拿到主键 42
      - v: 回表再走约 3 层
        mark: active
    - label: 覆盖索引
      cells:
      - v: 索引含 age
        mark: found
      - v: 叶子直接返回
        mark: found
      - v: 0 次回表
        mark: found
  log:
  - mode: 覆盖
    event: 覆盖索引的本质，是把每次查询都要付的回表成本，提前付成索引本身更大的体积
- id: why-not-hash
  title: 为什么不用[[哈希]]做主索引
  tldr: 讲到这里一定会有人问：既然怕层数多，为什么不用哈希？哈希查单个键是一步到位的常数级，看起来完胜。这一步把两边摆在一起比：哈希输掉的是范围查询、顺序和磁盘上的存放形态，而业务里的查询从来不只有查单个键这一种。
  body: |-
    哈希索引点查只算一次哈希定位到桶，常数级命中，单看点查比 B 加树的对数级漂亮。但主索引要扛的远不止点查，哈希有四处硬伤。第一，无序：相邻键被打散到各个桶，范围查、排序、取最大值最小值、分页全做不了，而范围与排序占了业务查询的大头。第二，扩容形态：桶满扩容要把全部键按新桶数重新散列搬迁，是一次全量抖动；B 加树的分裂只是局部的、成本被均摊。第三，磁盘形态：相邻键毫无位置相关性，预读与缓存局部性全部失效，每次访问近似一次随机 [[IO]]；B 加树的叶子链表把顺序访问的路铺好了。第四，部分键查询：按前缀查，哈希连定位的起点都给不出。
    所以哈希退到更适合的位置：内存哈希表、哈希连接、后面 LSM 一课里只需回答在不在的布隆过滤器。磁盘主索引的统治者始终是有序结构，根子就两个事实：查询不只有点查，磁盘偏爱顺序。
  derivation: original
  sources:
  - ref: cmu-15445
    locator: Lecture 08 索引结构比较（哈希索引与树索引）
    claim: 哈希索引支持点查但不支持范围与顺序访问，主磁盘索引因此以有序树结构为主
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: 点查哈希占优，其余四项 B 加树全胜
    rows:
    - label: 哈希索引
      cells:
      - v: 点查 常数级
        mark: found
      - v: 范围与排序 不支持
        mark: active
      - v: 扩容 全量重散列
        mark: active
    - label: B 加树
      cells:
      - v: 点查 层数级
      - v: 范围走叶子链表
        mark: found
      - v: 分裂 局部均摊
        mark: found
  log:
  - mode: 选型
    event: 主索引最终选了有序结构，因为业务查询需要范围和顺序，磁盘也更擅长顺序读，两边都要求有序
level: 进阶
minutes: 36
prereq:
- dsa/bst-trees
- os/file-system
objectives:
- 从页大小算出一棵 B+ 树的扇出与层数量级
- 说清 B+ 与 B 树的三点区别与范围扫描的路径
- 解释回表、覆盖索引与索引失效的典型情形
aiLink: 向量数据库的索引（HNSW 等）是另一类结构，但「用空间与写成本换查速度、按介质设计结构」的思维完全同源；RAG 系统的元数据过滤、时序数据的按时间索引，也都是在 B+ 树与倒排索引之间做选择。先把这一课吃透，再看任何新型索引都不慌。
design:
- mechanism: 为什么索引用 B 加树而不是 B 树或二叉树——内节点只导航、数据只在叶子且叶子成链，是对着磁盘页形态做的结构选择
  problem: 磁盘按页读写且随机 IO 昂贵：二叉树一层一次随机读，千万级数据要几十层；普通 B 树把数据行散在各层，导航项被数据行挤占、扇出上不去，范围查询还要在层间跳跃
  choice: 让一个节点恰好占一页，内节点只存放分隔键与子指针、不存数据行，一页容量全部让给导航；全部数据只存同一深度的叶子层，叶子之间用双向链表按顺序串起来
  tradeoff: 点查必须一路走到叶子才能拿到数据，不能像 B 树那样在内节点提前命中；叶子链表与分裂合并让写入维护更复杂，半满页的空间浪费要靠填充因子与重建管理
  root: 一页 16KB 按每条导航项约 16B 能装约上千个键，扇出约一千时三层容量就到 10 的 9 次方量级，绝大多数表三到四层足够；数据只在叶子又让范围扫描退化成沿链表的顺序读，顺序读正是磁盘最便宜的访问形态
- mechanism: 为什么二级索引的叶子存主键而不是行地址——用一层间接换取行搬家时全体索引不用跟着改，回表就是这层间接的日常价格
  problem: 若直接存行的物理地址，聚簇索引一旦分裂、行被搬到新页，所有二级索引里的行地址都要同步修正，维护成本随索引个数爆炸
  choice: 二级索引叶子只存主键值，查整行时拿主键再走一次聚簇索引，也就是回表；行的物理位置只由聚簇索引一处知道，行怎么搬家都只改这一处
  tradeoff: 每次用二级索引查整行都要多走一棵树、多几次页访问，批量查询时回表成本随行数放大；缓解办法是覆盖索引把常用列放进二级索引叶子免掉回表，但索引随之变宽、写维护更贵
  root: 被多处引用的位置信息都要收敛到单一权威来源，否则一次移动就要付出与引用数成正比的修正代价；这与虚拟内存用页表间接、文件系统用 inode 间接是同一种设计本能
- mechanism: 为什么磁盘主索引不用哈希而用有序结构——点查这一项输给哈希不要紧，范围、顺序与前缀才是主索引真正要扛的活
  problem: 哈希点查是常数级，单看点查比树的对数级更优，诱惑很大；但主索引要同时服务范围查询、排序、最大最小值与前缀匹配，哈希把相邻键打散之后，这些操作全都失去定位基础
  choice: 主索引坚持用保持键序的 B 加树，叶子链表提供顺序扫描的路径；哈希则退到内存哈希表、哈希连接与布隆过滤器这些只需要回答点查或在不在的场景里去发挥
  tradeoff: 点查要付出三到四层页访问而不是一次哈希定位，且有序结构要持续支付分裂合并与页填充率的维护成本；换来的是一个结构同时覆盖点查、范围、排序与前缀四类查询
  root: 根子在查询形态与介质形态的双重要求上：业务查询以范围与有序访问为大头，磁盘又对顺序读给出远低于随机读的成本，有序结构恰好同时讨好这两边；哈希的常数级点查优势，在这张总账面前只是一个小项
quiz:
- q: B+ 树为什么层数能做到 3–4 层就装千万级键？
  options:
  - 因为键都被压缩了
  - 节点按磁盘页设计，一页装数百上千个键，扇出极大
  - 因为数据只存一半
  - 因为用了哈希
  answer: 1
  explain: 扇出约 10^3 时容量按层乘 10^3，三层即约 10^9 量级。
- q: B+ 树相比 B 树最关键的两个设计是？
  options:
  - 节点更小、层数更多
  - 数据只存在叶子且叶子同层并以链表相连
  - 不用排序
  - 根节点存全部数据
  answer: 1
  explain: 内节点只导航使扇出更大；叶子链表使范围扫描成为顺序读。
- q: 哪种查询通常用不上普通 B+ 树索引？
  options:
  - WHERE id = 42
  - WHERE name LIKE 'ab%'
  - WHERE name LIKE '%ab'
  - WHERE ts > 100
  answer: 2
  explain: 前缀通配打头无法在有序索引中定位起点，只能全扫。
