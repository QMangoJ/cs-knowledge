- id: shape
  title: B+ 树的形状：内节点导航，叶子装数据
  tldr: 与 B 树的区别在「+」：内节点只放分隔键不放数据，全部数据（或行指针）在叶子层，叶子用链表串起来。
  body: 'B+ 树是多路搜索树：每个内节点存 k 个分隔键、指向 k+1 个孩子，键把值域切成 k+1 段。查找时在节点内对分隔键做二分（和二分查找课同款），决定往哪个孩子走，直到叶子。

    「+」的两个设计：其一，内节点不存数据行，于是同样一页能塞更多导航键、扇出更大；其二，所有叶子在同一深度（完美平衡）且按序用链表相连——定位到一个叶子后，范围扫描就是沿链表顺序读，不需要回树上折腾。真正的 B 树（无 +）数据散在各层，没有叶子链表，范围扫与扇出都吃亏，所以现代数据库索引几乎都用 B+ 树。

    两个最常见的误解先澄清。误解一：内节点的分隔键必须是真实存在的键。其实分隔键只是路标，它只需要能把值域切开，可以是不等于任何真实行的值；查找时按大于等于分隔键往右走即可，真正的键只活在叶子层。误解二：B 树只是少了链表。差别不止链表：B 树的内节点也存数据行，一行按 200B 算一页只能放约 80 行，扇出从约 1000 掉到约 80，同样 10 的 9 次方量级的数据要 5 层左右，而且范围扫描要在不同层之间上下跳，没法顺序读。扇出与范围扫两头吃亏，才是 B 树在数据库里被 B 加树取代的完整原因。'
  derivation: original
  sources:
  - ref: cmu-15445
    locator: Lecture 08 B+Tree 定义（叶存值、内节点 k 键 k+1 孩子、叶子同深度）
    claim: B+ 树仅在叶子节点保存值、叶子层以兄弟指针相连支持高效范围扫描，且树是完美平衡的
