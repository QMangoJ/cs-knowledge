- id: when-not
  title: 索引的代价与用不上的情形
  tldr: 每加一个索引，每次写入都要多维护一棵树；而有些查询模式，索引压根用不上。
  body: '索引不是免费的：INSERT/UPDATE/DELETE 都要同步维护所有相关 B+ 树（还可能触发分裂）；索引占磁盘与缓存空间；列基数太低（如性别）时索引区分不了多少行，优化器干脆不用。

    经典「用不上」清单（来自 CMU 讲义的例子）：LIKE ''%abc'' 前缀通配打头无法定位起点（''abc%'' 可以）；对索引列做函数/运算（如 WHERE lower(name)=…，除非建函数索引）；隐式类型转换导致走不了索引。写 SQL 时先想「这棵 B+ 树能不能帮我定位起点」，大半问题迎刃而解。

    再补组合索引的最左前缀原则：为（a， b）两列建的组合索引，键按先 a 后 b 的字典序排列，所以只查 a、或 a 与 b 一起查都能定位起点，单查 b 则不行，原理仍然是有没有一段连续区间可扫。低基数列也不是绝对禁区：性别单独建索引没用，但拼在高基数列后面组成组合索引时，区分度由组合决定，完全可以建。最后一个现实因素是优化器的成本估算：当预计要取出的行数占全表比例过高（经验上到三成量级）时，逐行回表的随机 IO 反而比全表顺序扫更贵，优化器会主动放弃索引，这时加索引、改写查询都救不了，应该改的是查询本身或数据组织方式。'
  derivation: original
  sources:
