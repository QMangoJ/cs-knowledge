steps:
- id: why
  title: 没有索引时，查询在做什么
  tldr: 先从没有索引的日子看起：手里只有一张有一千万行的表和一个用户编号，要把这个人找出来，只能一页一页翻完所有数据。这一步先把这种笨办法的账算清楚，后面才知道索引到底省在了哪里。
  body: >-
    SELECT * FROM users WHERE id = 42。没有索引时数据库只能全表扫描：把每一页读进来逐行比对，1000 万行每次点查都要把几十 GB 数据过一遍，瓶颈是 [[IO]] 不是 [[CPU]]。

    索引的本质：额外维护一份「按某个键排好序、能快速定位」的数据副本，用空间与写入时的维护成本，换查询时只读 O(层数) 页。选结构取决于介质：数据在磁盘上，就必须按「页」思考。

    算一笔账：1000 万行、平均每行约 200B，表数据约 2GB，按 16KB 一页约 12.5 万页——全表扫描要把这 12.5 万页全读一遍，索引只要读 3 到 4
    页，差距是四到五个数量级。还有一笔隐性账：全表扫描会把大量冷页冲进缓冲池、挤走热点页，慢的从来不只是这一条查询。索引优化的目标因此很明确：把一次查询要碰的页数，从跟数据总量成正比，压到只跟树高成正比。
  derivation: original
  sources:
  - ref: cmu-15445
    locator: Lecture 08 Indexes & Filters（索引定义）
    claim: 索引是表属性子集的有序副本，使 DBMS 能比全表顺序扫描更快定位元组
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: 全表扫描时，每一页都要读进来检查一遍，没有捷径
    rows:
    - label: 表的页
      cells:
      - v: 页1 读
        mark: active
      - v: 页2 读
        mark: active
      - v: ……
      - v: 第 N 页 读
        mark: active
  log:
  - mode: 扫描
    event: 只查一行，却要把整张表从头读到尾，这就是没有索引时的代价
- id: fanout
  title: 关键数字：一页能装多少键
  tldr: 知道了全表扫描有多贵，下一个问题自然是：索引凭什么能只读三四页？关键在一个数字上——一个节点一页到底能装多少个键。这一步就把这笔账算出来：页 16KB 除以每条约 16B，约等于 1000，也就是说每多一层，容量就乘以约 1000。
  body: >-
    搜索树的层数由扇出（每节点的孩子数）决定。二叉树扇出 2：装 10^9 个键要约 30 层，每层一次随机 [[IO]]，点查就偏慢了。

    磁盘最小读写单位是页（常见 16KB 量级）。让一个节点恰好一页：约 16KB / 16B ≈ 1000 条「键 + 子指针」，扇出约 1000；容量随层数乘 1000——1 层 10^3、2 层 10^6、3 层
    10^9，三四层够装绝大多数业务表，上层通常被缓存，真正的磁盘 IO 往往只剩叶子那 1 次。

    两个边界：扇出不是越大越好——节点内二分在扇出 1000 时约 10 次比较，微不足道，但页做到 1MB，读入与缓存占用又会抬头，16KB 是 IO 粒度与 [[CPU]] 成本磨出的折中；而 1000
    是定长键估算，变长字符串键装得明显更少、树可能多出一层（后面前缀压缩那一步专门讲）。公式给的是量级，不是承诺。
  derivation: original
  sources:
  - ref: cmu-15445
    locator: Lecture 08 B+Tree 性质（m 路搜索树与扇出）
    claim: "[[B+ 树]]是高扇出的平衡搜索树，节点按页大小设计以减少磁盘访问层数"
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: 扇出约 1000 时，层数与容量的关系（量级示意）
    rows:
    - label: 层数
      cells:
      - v: 1 层 ~10^3
      - v: 2 层 ~10^6
      - v: 3 层 ~10^9
        mark: found
    - label: 二叉树对照
      cells:
      - v: 10^9 需要 ~30 层
        mark: muted
  log:
  - mode: 扇出
    event: 磁盘按页读写的介质特点决定了一个节点装多大，节点大小又决定了整棵树有几层
- id: shape
  title: "[[B+ 树]]的形状：内节点导航，叶子装数据"
  tldr: 扇出的账算完了，接着看这棵树具体长什么样。它和普通的 B 树（每个节点既放键也放数据的多叉搜索树）的区别就在名字里那个「+」上：内节点只放分隔键用来导航、不放数据，全部数据都放在叶子这一层，叶子之间再用链表串起来。这一步把形状看清，后面查一个键时每一步往哪走才有依据。
  body: >-
    B+ 树是多路搜索树：内节点存 k 个分隔键、指向 k+1 个孩子，把值域切成 k+1 段；查找时在节点内对分隔键二分，决定往哪个孩子走，直到叶子。

    「+」的两个设计：内节点不存数据行，同样一页塞更多导航键、扇出更大；所有叶子同深度且按序用链表相连，定位到一个叶子后范围扫描就是沿链表顺序读。普通 B 树数据散在各层、没有叶子链表，范围扫与扇出都吃亏，所以现代数据库索引几乎都用
    B+ 树。

    两个常见误解。误解一：分隔键必须是真实存在的键。其实它只是路标，只需能切开值域，可以不等于任何真实行，查找时按大于等于分隔键往右走即可，真正的键只活在叶子层。误解二：B 树只是少了链表。不止——B 树内节点也存数据行，一行按
    200B 算一页只能放约 80 行，扇出从约 1000 掉到约 80，10 的 9 次方量级数据要 5 层左右，范围扫还要在层间上下跳、没法顺序读。扇出与范围扫两头吃亏，才是 B 树被取代的完整原因。
  derivation: original
  sources:
  - ref: cmu-15445
    locator: Lecture 08 B+Tree 定义（叶存值、内节点 k 键 k+1 孩子、叶子同深度）
    claim: B+ 树仅在叶子节点保存值、叶子层以兄弟指针相连支持高效范围扫描，且树是完美平衡的
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: 内节点只导航；叶子层装全部数据并串成链表
    rows:
    - label: 内节点
      cells:
      - v: 分隔键 100 | 200
        mark: active
    - label: 叶子（链表）
      cells:
      - v: …87, 92…
      - v: …130, 166… →
      - v: …210, 258…
  log:
  - mode: 结构
    event: 查单个键时顺着树往下走，查一段范围时先定位到起点叶子、再沿着叶子链表顺序读
- id: lookup
  title: 一次点查到底读几页
  tldr: 树的形状清楚了，现在真的拿一个键走一遍，看一次查找到底要读几页。结论先放在这里：从根走到叶子要读的页数就等于层数，通常 3 到 4 页，而且上层的页大多已经在内存缓存里，真正要去磁盘读的往往只剩叶子那 1 次。
  body: >-
    查 id=166：读根页，在分隔键 [100, 200] 里定位到 100 ≤ 166 < 200，走中间孩子；读到内节点页再比一次，进对应叶子页；在叶子内二分找到 166，取行指针（或直接取行，见聚簇一节）。全程 3–4 页。

    把账算到页一级：假设三层树，根页 1 页、第二层约 1000 页、叶子约 100 万页。根页几乎 100% 常驻缓冲池（buffer pool），第二层总量约 16MB
    量级，也基本能被装下，所以稳态下一次点查的真实磁盘读通常只有叶子 1 页，约毫秒级，页内二分是微秒级的内存操作。优化直觉由此而来：数据库优化拼的是减少页访问次数，而不是减少比较次数，比较再贵也贵不过一次磁盘
    [[IO]]。还有一个边界：查一个不存在的键，也要完整走完根到叶子的全程才能确认不存在，不存在性没有捷径，这一点在 LSM 一课里会以完全不同的方式再次出现。
  derivation: original
  sources:
  - ref: cmu-15445
    locator: Lecture 08 B+Tree 查找过程
    claim: "[[B+ 树]]查找从根逐层向下到叶子，访问页数等于树高"
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: 查 166 的路径：根 → 内节点 → 叶子
    rows:
    - label: 路径
      cells:
      - v: 根 [100|200]
      - v: → 中间孩子
      - v: 叶子内二分命中
        mark: found
  log:
  - mode: 查询
    event: 一次点查要读的页数就等于树高，数据总量再涨，只要树高不变，页数基本不变
- id: split
  title: 插入与分裂：树如何长高
  tldr: 查的路走通了，再看写的时候这棵树怎么维护自己。场面是往一个已经写满的叶子页里再塞一行：放不下，就把这个叶子分裂成两个，再向父节点塞一个分隔键；父节点也满了就继续往上分裂，分裂一路传到根的时候，整棵树就长高一层。这一步看清分裂的规矩，才能理解后面随机写入为什么会让表变胖。
  body: |-
    插入先定位叶子：有空位直接插入并保持有序；满了就分裂成两个各装一半的叶子，父节点插入新分隔键指向新叶子。父节点也满就递归向上分裂；根分裂时新建一个根、树高 +1——这是 [[B+ 树]]唯一的长高方式，所以叶子永远同深度。删除对称地触发合并。分裂/合并是索引的主要写成本之一，也是「批量导入时先建数据后建索引更快」的原因：逐条插入不断分裂，自底向上批量构建一次成型。
    分裂成本看摊还：一次分裂把一个满节点变成两个半满节点，要重新填满才会再分裂，所以均摊到每次插入是常数级，不必谈分裂色变。工程参数是填充因子：批量建索引时只填到比如九成，留空吸收后续插入、推迟分裂。反过来，随机主键乱序插入让每个叶子不停半满分裂，页利用率长期只有五到七成——这正是随机 [[UUID]] 主键让表体积虚胖的机制，下一节[[聚簇索引]]还会回到这里。
  derivation: original
  sources:
  - ref: cmu-15445
    locator: Lecture 08 B+Tree 插入与节点分裂；自底向上批量构建
    claim: B+ 树插入在节点满时分裂并向上传播，根分裂使树增高；排序后自底向上构建最快
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: 叶子满 → 分裂 → 父节点多一个分隔键
    rows:
    - label: 分裂前
      cells:
      - v: 叶子 [10 20 30 40] 满
        mark: active
    - label: 分裂后
      cells:
      - v: "[10 20]"
      - v: "[30 40]"
      - v: 父节点插入键 30
        mark: found
  log:
  - mode: 写入
    event: 分裂只从根部长高，所以所有叶子始终处在同一深度，不会出现一边深一边浅
- id: clustered
  title: "[[聚簇索引]]、[[二级索引]]与[[回表]]"
  tldr: 前面一直把「叶子装数据」当成理所当然，这一步要把这件事说细，因为表里其实有两棵树。先看 [[InnoDB]] 的做法：主键索引的叶子就是整行数据；二级索引的叶子只存主键值，拿它查整行还要再走一次主键索引。这多走的一趟，就是后面要算的回表成本。
  body: >-
    表数据本身怎么放？先交代一个前提：主键是能唯一认出一行的那一列，比如用户编号，同一张表里不会有两个人共用同一个编号。主流做法（InnoDB）是把表组织成一棵以主键为键的 [[B+ 树]]，叶子直接存整行，这棵树叫聚簇索引——所以主键查询最快，主键范围扫描就是顺序读叶子。

    其他列上的二级索引是另一棵 B+ 树，叶子存「该列值 → 主键值」。用它查整行要两次走树：先在二级索引拿到主键，再去聚簇索引取行，这一步叫回表；若要的列都在二级索引里（[[覆盖索引]]），就免了回表。建索引前先想清查询模式，就是这个原因。

    主键选型的影响从这里来：自增主键让新行永远追加到最右叶子，写入顺序、分裂最少、填充率高；随机 [[UUID]] 把新行撒到各个叶子，到处分裂与碎片，体积更大、缓存命中更差——这是有序 ID
    在写密集场景受欢迎的底层原因。回表也有优化：延迟回表先用二级索引筛出主键集合并排序，再按主键顺序批量取行，把随机回表变成近似顺序读。索引设计不是建或不建的二选一，而是把每次访问的页数与 [[IO]] 形态算清后的取舍。
  derivation: original
  sources:
  - ref: cmu-15445
    locator: Lecture 08 索引组织与表存储讨论
    claim: 表可按键组织为聚簇索引，二级索引保存主键引用，取完整行需二次查找
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: 二级索引查整行：先拿主键，再回表
    rows:
    - label: 二级索引（email)
      cells:
      - v: email → 主键 42
        mark: active
    - label: 聚簇索引（主键）
      cells:
      - v: 主键 42 → 整行
        mark: found
  log:
  - mode: 回表
    event: 如果要查的列都在二级索引里，第一步就能直接返回，不用再回表走第二棵树
- id: when-not
  title: 索引的代价与用不上的情形
  tldr: 前面几步都在讲索引的好处，这一步换个方向，把它的代价和用不上的场面摆出来。场面很日常：每多加一个索引，每次写入都要多维护一棵树；而有些查询写法，就算建了索引也根本用不上。先把这两笔账认清，才不会见列就建索引。
  body: >-
    索引不是免费的：INSERT/UPDATE/DELETE 都要同步维护所有相关 [[B+ 树]]（还可能触发分裂），索引还占磁盘与缓存；列基数太低（如性别）时区分不了多少行，优化器干脆不用。

    经典「用不上」清单（来自 CMU 讲义）：LIKE '%abc' 前缀通配打头无法定位起点（'abc%' 可以）；对索引列做函数/运算（如 WHERE lower(name)=…，除非建函数索引）；隐式类型转换也会让索引失效。写
    [[SQL]] 时先想「能不能定位起点」，大半问题迎刃而解。

    再补三点。一，组合索引的最左前缀原则：（a, b）组合索引按先 a 后 b 的字典序排列，只查 a、或 a 与 b 一起都能定位起点，单查 b
    不行——原理仍是有没有连续区间可扫。二，低基数列不是绝对禁区：性别单独建没用，拼在高基数列后面组成组合索引时，区分度由组合决定，完全可以建。三，优化器的成本账：预计取出的行数占全表到三成量级时，逐行[[回表]]的随机 [[IO]]
    比全表顺序扫更贵，优化器会主动放弃索引——该改的是查询本身或数据组织方式。
  derivation: original
  sources:
  - ref: cmu-15445
    locator: Lecture 08/09 索引使用条件（LIKE 前缀示例）
    claim: 以通配符开头的 LIKE 无法使用 B+ 树索引，而前缀匹配可以；索引增加写入维护成本
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
