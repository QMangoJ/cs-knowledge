- id: delete-merge
  title: 删除与合并：树如何变矮
  tldr: 删到低于下限先向兄弟借，借不到就合并，合并传到根时树矮一层，与分裂长高严格对称。
  body: '用玩具容量走一遍：设每个节点最多放 4 个键、最少放 2 个键（真实系统里下限是页容量的一半量级，原理相同）。叶子 A 是 [30， 40]，右兄弟 B 是 [50， 60， 70]，父节点里的分隔键是 50。现在删 A 中的 30：A 只剩 [40]，低于下限 2。先看能不能借：B 有 3 个键，多于下限，可以借最小的 50 给 A，A 变成 [40， 50]，B 变成 [60， 70]，同时把父节点分隔键从 50 更新为 60，借键完成，树形不变。若 B 也只剩 [60， 70] 两个键，借无可借，就把 A 与 B 合并成 [40， 60， 70]，父节点删掉分隔键 50；父节点若因此低于下限，同样的借与合并继续向上传播；最后根节点若只剩一个孩子，就让这个孩子当新根，树矮一层，这是 B 加树唯一的变矮方式，与根分裂长高严格对称。工程提醒有二：其一，删插交界处反复分裂合并会抖动，实现里常允许节点暂时低于下限或延迟合并；其二，批量删历史数据会留下大量半空页，逻辑空间靠合并回收，物理文件未必自动变小，常常要靠重建索引或整理表空间才能把磁盘真正还回去。'
  derivation: original
  sources:
  - ref: cmu-15445
    locator: Lecture 08 B+Tree 删除与节点合并
    claim: B+ 树删除在节点低于最小占用时先向兄弟借键、否则与兄弟合并，根合并使树高降低
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: 删 30 之后：借得到就改分隔键，借不到就合并
    rows:
    - label: 借键（B 富余）
      cells:
      - v: A [40 50]
        mark: found
      - v: B [60 70]
      - v: 父键 50 改 60
        mark: found
    - label: 合并（B 也不富余）
      cells:
      - v: 合并为 [40 60 70]
        mark: active
      - v: 父删键 50
        mark: active
  log:
  - mode: 删除
    event: 借与合并对称于分裂，树只从根处变矮
- id: prefix-varlen
  title: 变长键与前缀压缩：扇出为什么会缩水
  tldr: 邮箱、网址这类变长键装不下定长估算的条数；内节点只存最短可区分前缀，把扇出抢回来。
  body: '前面的扇出账假设每条导航项是定长 16B，可真实业务键常常是变长字符串：一个邮箱平均二三十字节，一页就只能装五六百条，键再长些还会更少，扇出缩水、树随之长高。数据库的对策分两层。内节点层用后缀截断：分隔键不需要是完整键，只需要短到能把左右孩子的值域分开——相邻真实键是 apple 开头的一长串与 apricot 开头的一长串时，分隔键存一个 app 量级的最短可区分前缀就够导航了，省下的空间全换成扇出。叶子层用页内前缀压缩：同一页里的键按序排列，相邻键往往共享长公共前缀，每条只存与前一条不同的后缀部分加一个共享长度，比较时按规则还原。代价是实现复杂度：插入一个键可能改变邻居的压缩形态，分隔键在分裂合并时要重新计算，CPU 换空间的账要算。结论是：扇出公式给的是量级，真实扇出由键长分布决定，线上判断索引健康度时，看平均页填充率与树高监控比套公式可靠得多。'
  derivation: original
  sources:
  - ref: cmu-15445
    locator: Lecture 08 B+Tree 键表示与页内组织
    claim: 变长键通过分隔键截断与页内压缩减少导航项体积，以维持高扇出
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
