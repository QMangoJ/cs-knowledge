steps:
  - id: why
    title: 全表扫描的代价：查一行却要翻遍 12.5 万页
    tldr: 没有索引时查一行只能把整张表的所有磁盘页逐页读入比对；索引的本质是用额外的磁盘空间与写入维护成本，换取查询时只读树高那么几页。
    body: |-
      执行 `SELECT * FROM users WHERE id = 42` 时，如果表上没有任何索引，数据库只能走全表扫描：把表文件里的每一页依次读进内存逐行比对。算一笔硬账：`users` 表有 1000 万行、平均每行约 200B，整表大约 2GB；按 16KB 一页折算就是 12.5 万页。明明只找一个人，却要把 12.5 万页从头翻到尾，慢的根源不在 [[CPU]] 比对，而在磁盘 [[IO]]；更糟的是，这 12.5 万个冷页一路冲进内存缓存，还会把别人正在高频访问的热点页挤出去。

      索引干的事就一件：按某个键排好序维护一份快速定位结构，把一次查找要碰的页数从「跟数据总量成正比」压到「只跟树高成正比」（从 12.5 万页压到 3～4 页，差出四五个数量级）。它不是独立运行的外部服务，而是和表数据一起躺在数据库文件里的磁盘页集合（比如 [[InnoDB]] 里就存放在同一个 `.ibd` 表空间文件内），好比前端在数组之外额外维护一张 `Map` 来省掉每次 `Array.find` 全量遍历——区别在于数据住在磁盘上，结构设计必须围着「页」转。

      这套结构也是被数据规模一步步逼出来的：早期表小，顺序扫一遍就够用；表大了以后，人们先给文件按主键排好序、再配一份只记每段起点的稀疏目录，可一旦插入新行就得搬动大半个文件；直到 1970 年代 B 树及其变体 [[B+ 树]]成熟，靠节点自发分裂与合并保持平衡，才彻底解决了动态增删与少读磁盘页的两难。
    derivation: original
    sources:
      - ref: cmu-15445
        locator: Lecture 08 Indexes & Filters（索引定义）
        claim: 索引是表属性子集的有序副本，使 DBMS 能比全表顺序扫描更快定位元组
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
    canvas:
      kind: datastate
      structure: array
      caption: 全表扫描时，每一页都要读进来检查一遍，没有捷径
      rows:
        - label: 表的页
          cells:
            - v: 页1 读
              mark: active
            - v: 页2 读
              mark: active
            - v: ……
            - v: 第 N 页 读
              mark: active
    log:
      - mode: 扫描
        event: 只查一行，却要把整张表从头读到尾，这就是没有索引时的代价
  - id: fanout
    title: 扇出算术：16KB 页塞千把个键，三层装下十亿行
    tldr: 把树节点对齐 16KB 磁盘页后，每页可装约 1000 条「键 + 子指针」，容量每深一层乘以约 1000，3 层就能覆盖 10^9 量级的键。
    body: |-
      为什么不用内存里最熟悉的平衡二叉树？算一下层数就明白了：二叉树每个节点只分 2 个叉（扇出为 2），装下 `10^9`（十亿）个键需要约 30 层。节点散落在磁盘上时，每往下走一层就是一次随机 [[IO]]，查一行跳 30 次磁盘根本扛不住。

      既然磁盘最小读写单位是一页（常见 16KB），最顺应硬件的做法就是让一个树节点恰好占满一页。按每条「键 + 子指针」约 16B 估算，一个 16KB 节点能装 `16KB / 16B ≈ 1000` 条导航项，扇出约 1000。扇出一旦上千，容量随层数按千倍增长：1 层 `10^3`、2 层 `10^6`、3 层直接到 `10^9`。千万行的业务表三四层绰绰有余，而且上层节点体积小、常驻内存，真正的磁盘 IO 往往只剩叶子那 1 次。

      看到这儿你可能会问：既然扇出越大层数越少，为什么不干脆把页设成 1MB？因为页大小是 IO 粒度与 [[CPU]]、缓存开销磨出的折中：扇出 1000 时页内二分查找只需约 10 次比较，几乎免费；一旦把页做到 1MB，读入与写回的带宽浪费以及缓存占用都会抬头。另外记住，1000 只是定长整数键的量级估算——换成变长字符串键，一页装得明显更少，树可能多长一层（第 9 步专门拆解）。
    derivation: original
    sources:
      - ref: cmu-15445
        locator: Lecture 08 B+Tree 性质（m 路搜索树与扇出）
        claim: "[[B+ 树]]是高扇出的平衡搜索树，节点按页大小设计以减少磁盘访问层数"
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
