    event: 内节点存最短可区分前缀，叶子做页内前缀共享
- id: covering-walk
  title: 覆盖索引完整走例：一次回表到底贵在哪
  tldr: 同一个查询，索引里多带一列就能省掉整棵聚簇树的二次查找——把这笔账逐页算清。
  body: '查询是按邮箱查年龄：SELECT age FROM users WHERE email 等于某个给定值。走法一，二级索引只建在 email 上：先在二级索引树里走约 3 层定位到邮箱，叶子条目只有主键 42；再拿着 42 去聚簇索引走约 3 层，读到整行才取出 age，前后约 6 页访问，其中回表那一跳是纯随机 IO，批量查询时回表次数随结果行数线性增长，这才是它贵的地方。走法二，把索引建成 email 与 age 的组合（或把 age 作为包含列附在索引里）：同样约 3 层定位到邮箱，叶子条目直接带着 age，当场返回，0 次回表，总访问约 3 页，且批量时全是沿一棵树的顺序推进。高频查询若只多读几列，覆盖的收益就是这么来的。代价同样要记账：索引变宽意味着一页装的条目变少、扇出下降、占的磁盘与缓存变大，且 age 每次被更新都要同步维护这棵索引。折中做法是包含列：age 只存不用作排序与定位，不参与键的比较，专门用来免回表。判断标准只有一条：这个查询的频率乘以省下的回表成本，能不能覆盖索引变宽与多维护的成本。'
  derivation: original
  sources:
  - ref: cmu-15445
    locator: Lecture 08 覆盖索引与索引包含列
    claim: 查询所需列全在二级索引内时可免去回表，代价是索引更宽、写维护更贵
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: 同一次查询：回表版约 6 页，覆盖版约 3 页
    rows:
    - label: 只建 email 索引
      cells:
      - v: 二级索引约 3 层
      - v: 拿到主键 42
      - v: 回表再走约 3 层
        mark: active
    - label: 覆盖索引
      cells:
      - v: 索引含 age
        mark: found
      - v: 叶子直接返回
        mark: found
      - v: 0 次回表
        mark: found
  log:
  - mode: 覆盖
    event: 把回表成本预付成索引体积，是覆盖索引的本质
- id: why-not-hash
  title: 为什么不用哈希做主索引
  tldr: 哈希点查是常数级，看起来完胜；输掉的是范围、顺序与磁盘形态——而业务查询从来不只有点查。
  body: '哈希索引点查只要算一次哈希定位到桶，常数级就能命中，单看点查确实比 B 加树的对数级层数漂亮。但主索引要扛的远不止点查，哈希在四件事上硬伤明显。第一是无序：哈希把相邻的键打散到各个桶，按时间段查、按大小排序、取最大值最小值、分页翻页全都做不了，而业务查询里范围与排序占了大头。第二是扩容形态：桶装满要扩容时，要把全部键按新桶数重新散列搬迁，是一次全量抖动；而 B 加树的分裂只是局部的、成本被均摊的。第三是磁盘形态：范围相邻的键在哈希里毫无位置相关性，预读与缓存局部性全部失效，每次访问都近似一次随机 IO；B 加树的叶子链表则把顺序访问的路铺好了。第四是部分键查询：按前缀查、以某列开头模糊匹配这类需求，哈希连定位的起点都给不出。所以哈希并没有消失，它退到更适合的位置：内存里的哈希表、连接算法里的哈希连接、以及后面 LSM 一课里布隆过滤器这类只需回答在不在的场景。磁盘主索引的统治者始终是有序结构，根子在于两个事实：查询不只有点查，磁盘偏爱顺序。'
  derivation: original
  sources:
  - ref: cmu-15445
    locator: Lecture 08 索引结构比较（哈希索引与树索引）
    claim: 哈希索引支持点查但不支持范围与顺序访问，主磁盘索引因此以有序树结构为主
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: 点查哈希占优，其余四项 B 加树全胜
    rows:
    - label: 哈希索引
      cells:
      - v: 点查 常数级
        mark: found
      - v: 范围与排序 不支持
        mark: active
      - v: 扩容 全量重散列
        mark: active
    - label: B 加树
      cells:
      - v: 点查 层数级
      - v: 范围走叶子链表
        mark: found
      - v: 分裂 局部均摊
        mark: found
  log:
  - mode: 选型
    event: 主索引选有序结构，因为查询形态与介质形态都要求有序
level: 进阶
minutes: 36
prereq:
- dsa/bst-trees
- os/file-system
objectives:
- 从页大小算出一棵 B+ 树的扇出与层数量级
- 说清 B+ 与 B 树的三点区别与范围扫描的路径
- 解释回表、覆盖索引与索引失效的典型情形
aiLink: 向量数据库的索引（HNSW 等）是另一类结构，但「用空间与写成本换查速度、按介质设计结构」的思维完全同源；RAG 系统的元数据过滤、时序数据的按时间索引，也都是在 B+ 树与倒排索引之间做选择。先把这一课吃透，再看任何新型索引都不慌。
design:
- mechanism: 为什么索引用 B 加树而不是 B 树或二叉树——内节点只导航、数据只在叶子且叶子成链，是对着磁盘页形态做的结构选择
  problem: 要解决的根本约束是磁盘按页读写且随机 IO 昂贵：二叉树一层一次随机读，千万级数据要几十层；普通 B 树把数据行散在各层，单页能装的导航项被数据行挤占，扇出上不去，范围查询还要在层间跳跃
  choice: 做法是让一个节点恰好占一页，内节点只存放分隔键与子指针、不存数据行，把一页的容量全部让给导航；全部数据只存放在同一深度的叶子层，叶子之间再用双向链表按顺序串起来
  tradeoff: 代价是点查必须一路走到叶子才能拿到数据，不能像 B 树那样在内节点提前命中；同时叶子链表与分裂合并让写入维护更复杂，索引页里还存在半满页的空间浪费，要靠填充因子与重建来管理
  root: 根子在介质账上：一页 16KB 按每条导航项约 16B 估算能装约上千个键，扇出约一千时三层容量就到 10 的 9 次方量级，绝大多数表三到四层足够；数据只在叶子又让范围扫描退化成沿链表的顺序读，顺序读正是磁盘最便宜的访问形态
- mechanism: 为什么二级索引的叶子存主键而不是行地址——用一层间接换取行搬家时全体索引不用跟着改，回表就是这层间接的日常价格
  problem: 二级索引需要一种能找到整行的方式：若直接存行的物理地址，聚簇索引一旦发生分裂、行被搬到新页，所有二级索引里的这个行地址都要同步修正，维护成本会随索引个数爆炸
  choice: 做法是二级索引叶子只存主键值，查整行时拿着主键再走一次聚簇索引，也就是回表；行的物理位置只由聚簇索引一处知道，行怎么搬家都只改这一处
  tradeoff: 代价是每次用二级索引查整行都要多走一棵树、多几次页访问，批量查询时回表成本随行数放大；缓解办法是覆盖索引把常用列直接放进二级索引叶子，免掉回表，但索引随之变宽、写维护更贵
  root: 根子在间接层原理上：任何被多处引用的位置信息都要收敛到单一权威来源，否则一次移动就要付出与引用数成正比的修正代价；这与虚拟内存用页表间接、文件系统用 inode 间接是同一种设计本能
- mechanism: 为什么磁盘主索引不用哈希而用有序结构——点查这一项输给哈希不要紧，范围、顺序与前缀才是主索引真正要扛的活
  problem: 哈希点查是常数级，单看点查比树的对数级更优，诱惑很大；但主索引要同时服务范围查询、排序、最大最小值与前缀匹配，哈希把相邻键打散之后，这些操作全都失去定位基础
  choice: 做法是主索引坚持用保持键序的 B 加树，叶子链表提供顺序扫描的路径；哈希则退到内存哈希表、哈希连接与布隆过滤器这些只需要回答点查或在不在的场景里去发挥
  tradeoff: 代价是点查要付出三到四层页访问而不是一次哈希定位，且有序结构要持续支付分裂合并与页填充率的维护成本；换来的是一个结构同时覆盖点查、范围、排序与前缀四类查询
  root: 根子在查询形态与介质形态的双重要求上：业务查询以范围与有序访问为大头，磁盘又对顺序读给出远低于随机读的成本，有序结构恰好同时讨好这两边；哈希的常数级点查优势，在这张总账面前只是一个小项
quiz:
- q: B+ 树为什么层数能做到 3–4 层就装千万级键？
  options:
  - 因为键都被压缩了
  - 节点按磁盘页设计，一页装数百上千个键，扇出极大
  - 因为数据只存一半
  - 因为用了哈希
  answer: 1
  explain: 扇出约 10^3 时容量按层乘 10^3，三层即约 10^9 量级。
- q: B+ 树相比 B 树最关键的两个设计是？
  options:
  - 节点更小、层数更多
  - 数据只存在叶子且叶子同层并以链表相连
  - 不用排序
  - 根节点存全部数据
  answer: 1
  explain: 内节点只导航使扇出更大；叶子链表使范围扫描成为顺序读。
- q: 哪种查询通常用不上普通 B+ 树索引？
  options:
  - WHERE id = 42
  - WHERE name LIKE 'ab%'
  - WHERE name LIKE '%ab'
  - WHERE ts > 100
  answer: 2
  explain: 前缀通配打头无法在有序索引中定位起点，只能全扫。
