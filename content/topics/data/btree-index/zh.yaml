title: B+ 树与数据库索引
summary: 索引为什么不用二叉树而用 [[B+ 树]]（B-plus tree，一种每个节点能分出很多叉的平衡搜索树）？因为磁盘按页读写——让一页装几百个键，树就只有 3–4 层。
premise: 一张表里有一千万行，只知道一个用户 id，想在里面把这个人找出来，难道要从第一行一路翻到最后吗？本课以一张千万级行数、按用户 id 查询的表为例，页大小取 16KB 量级，看索引怎样把查找从翻完一本书变成查几次目录。
position: 本课位于「索引：先找到再读」板块，是数据存储路径的起点，却同时站在两门先修之上：搜索树课的根到叶查找逻辑与文件系统课的页与 fsync 观念，在这里合流成按页组织的磁盘结构。学完你能由 16KB
  页大小推算约千级扇出为何只需三四层，也能算清[[二级索引]]查整行时[[回表]]多走一棵树的页账。
bridge:
  next: 本课解决了顺着树少读几页、把目标行住在哪一页算清的问题，下一课便钻进这一页在系统里的日常：它怎样被搬进内存、被改脏、被日志抢先记账，又怎样在断电之后被原样找回。
overview:
- key: 一句话总结
  value: "[[B+ 树]]是为磁盘访问优化过的多叉搜索树，内节点只放键用来导航，不放数据。数据全在叶子这一层，叶子之间再用链表连起来，点查和范围查都能照顾到。"
- key: 为什么不用二叉树
  value: 二叉树每个节点只分两个叉，层数太多，一次查找要走几十层，每层就是一次随机 [[IO]]。B+ 树一个节点能分上千个叉，3 到 4 层就装下千万级键，IO 次数一下就降下来了。
- key: 扇出怎么来
  value: 扇出就是一个节点能有多少个孩子，它由一页能装多少导航项决定。一页 16KB，每条导航项约 16B，一页大约能放上千个键和指针，这个上千就是扇出的来源。
- key: 范围查询
  value: 范围查询先顺着树定位到起点的那个叶子，再沿着叶子之间的链表顺序往后扫就行。不用回到树上反复跳，这正是[[哈希]]索引做不到的事，哈希只能回答单个键在不在。
- key: 写的代价
  value: 写不是免费的，叶子写满了要分裂成两个，分裂还可能向上传播到父节点。索引本身也要跟着每次写入一起维护，所以写多读少的表上索引加多了反而是负担。
- key: 聚簇与[[二级索引]]
  value: 主键索引是聚簇的，它的叶子直接就是整行数据，顺着主键查一次就拿到行。二级索引的叶子只存主键值，查整行还要拿主键值再去主键索引里查一次，这一步叫[[回表]]。
