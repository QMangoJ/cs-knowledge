- id: lookup
  title: 一次点查到底读几页
  tldr: 从根到叶子读「层数」页（通常 3–4），上层页大概率在内存缓存里，真实磁盘 IO 往往只剩 1 次。
  body: '查 id=166：读根页，在分隔键 [100, 200] 里定位到 100 ≤ 166 < 200，走中间孩子；读到内节点页再比一次，进对应叶子页；在叶子内二分找到 166，取行指针（或直接取行，见聚簇一节）。

    账要算清楚：3–4 页的访问里，根与上层节点被反复使用、常驻缓冲池（buffer pool），所以慢的只有叶子那一次可能的磁盘读。对照全表扫描的几十万页，这就是索引快几个数量级的原因。

    把账算到页一级：假设三层树，根页 1 页、第二层约 1000 页、叶子约 100 万页。根页几乎 100% 常驻内存，第二层总量约 16MB 量级，也基本能被缓冲池装下，所以稳态下一次点查的真实磁盘读通常只有叶子 1 页，约毫秒级，而页内二分是内存操作，微秒级。由此得到一条优化直觉：数据库优化拼的是减少页访问次数，而不是减少比较次数，比较再贵也贵不过一次磁盘 IO。还有一个边界情形：查一个不存在的键，也要完整走完根到叶子的全程才能确认不存在，不存在性没有捷径，这一点在 LSM 一课里会以完全不同的方式再次出现。'
  derivation: original
  sources:
  - ref: cmu-15445
    locator: Lecture 08 B+Tree 查找过程
    claim: B+ 树查找从根逐层向下到叶子，访问页数等于树高
    status: verified
