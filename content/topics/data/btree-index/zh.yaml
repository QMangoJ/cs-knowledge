    log:
      - mode: 扇出
        event: 磁盘按页读写的介质特点决定了一个节点装多大，节点大小又决定了整棵树有几层
  - id: shape
    title: "[[B+ 树]]带「+」号的两处改造：内节点只指路，叶子串成链"
    tldr: 相比普通 B 树，[[B+ 树]]把数据行全部请出内节点以保住千级扇出，并让同深度的叶子用链表按序相连，使范围查询变成顺序读。
    body: |-
      [[B+ 树]]是一棵严格平衡的多路搜索树：内节点存 `k` 个分隔键、指向 `k + 1` 个孩子，把值域切成 `k + 1` 段；查找时在节点内对分隔键二分，决定往哪个孩子走，一路落到叶子。

      名字里那个「+」号，改的正是普通 B 树两头吃亏的毛病。第一，**内节点不存数据行**：普通 B 树把整行数据散放在各层节点里，按一行 200B 算，16KB 的一页只能塞约 80 行，扇出从约 1000 暴跌到约 80，`10^9` 量级数据要涨到 5 层左右；B+ 树让内节点只放分隔键和指针，满满一页全留给导航。第二，**所有叶子同深度且用链表按序相连**：普通 B 树做范围查询得在树层间上下回溯跳跃，而 B+ 树只要定位到起点叶子，顺着链表往后平推就是纯顺序读。扇出与范围扫两头占优，现代关系数据库才几乎清一色选了 B+ 树。

      顺手澄清一个常见误解：内节点里的分隔键必须是表里真实存在的 `id` 吗？不必。分隔键只是切开左右值域的路标，哪怕对应那一行早已被删掉，路标依然能留在内节点里工作——查找时按「大于等于分隔键往右走」即可，真正的键存不存在，落到叶子层自见分晓。
    derivation: original
    sources:
      - ref: cmu-15445
        locator: Lecture 08 B+Tree 定义（叶存值、内节点 k 键 k+1 孩子、叶子同深度）
        claim: B+ 树仅在叶子节点保存值、叶子层以兄弟指针相连支持高效范围扫描，且树是完美平衡的
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
