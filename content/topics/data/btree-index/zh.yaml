title: B+ 树与数据库索引
summary: 数据库索引之所以放弃二叉树而选用 [[B+ 树]]，是因为磁盘按页（常见 16KB）读写：让内节点只存导航键不存数据，一页就能分出约 1000 个叉，3 到 4 层即可装下十亿级键；全部数据落到同深度的叶子层并用双向链表串起来，点查与范围扫描便同时兼顾。本课顺着一张千万行用户表，算清扇出账、拆解分裂与合并、对比[[聚簇索引]]与[[回表]]开销，最后划出索引失效与不选[[哈希]]的边界。
premise: users 表里躺着 1000 万行用户记录（每行约 200B，整表约 2GB），现在只凭一句 WHERE id = 42 想把这个人找出来。如果不建任何目录，数据库只能把磁盘上 12.5 万个 16KB 数据页从头翻到尾；可为什么加一个索引之后，同样找这一行就只需读三四页，而且连范围查找也不会退化？
position: 本课位于数据存储学科第一板块「索引：先找到再读」，是整条存储路径的起点，承接数据结构课的搜索树查找逻辑与操作系统课的文件页、fsync 观念，把内存里的树改造成按磁盘页组织的索引结构。学完你能由 16KB 页大小手算千级扇出与树高，并算清[[二级索引]][[回表]]与[[覆盖索引]]各自的读页账。
bridge:
  next: 顺着 B+ 树跳三四页就能算清目标行住在哪一页，可这一页被定位到之后在机器里怎么过日子？下一课钻进存储引擎内部，看数据页怎样搬进内存[[缓冲池]]、怎样在内存里改脏、靠日志抢先落盘，又怎样在断电重启后原样找回。
overview:
  - key: 一句话总结
    value: "[[B+ 树]]是为磁盘页定制的多叉平衡搜索树：内节点只放分隔键做路标，数据全沉在同层叶子上并用链表相连，点查少跳层、范围查顺着扫。"
  - key: 为什么不用二叉树
    value: 二叉树每个节点只分两叉，10 亿个键要走约 30 层、触发约 30 次随机 [[IO]]；B+ 树一页分出上千叉，3 到 4 层封顶。
  - key: 扇出怎么算
    value: 磁盘最小读写单位是页（如 [[InnoDB]] 默认 16KB），一条「键 + 子页指针」约 16B，一页能塞约 1000 条导航项，扇出由此达到千级。
  - key: 范围查询
    value: 先顺着树定位到起点叶子页，再沿叶子间的双向链表顺序往后读，不必回树上反复上下跳——这正是打散顺序的[[哈希]]索引做不到的。
  - key: 写的代价
    value: 每次增删改都要同步维护表上所有 B+ 树，页满了要分裂、删空了要合并；写多读少的表盲目加索引反而拖慢写入。
  - key: 聚簇与[[二级索引]]
    value: 主键索引（聚簇）的叶子直接存整行数据；二级索引叶子只存主键值，取整行得拿主键再去聚簇索引查一趟，即[[回表]]。
