      kind: datastate
      structure: array
      caption: 内节点只导航；叶子层装全部数据并串成链表
      rows:
        - label: 内节点
          cells:
            - v: 分隔键 100 | 200
              mark: active
        - label: 叶子（链表）
          cells:
            - v: …87, 92…
            - v: …130, 166… →
            - v: …210, 258…
    log:
      - mode: 结构
        event: 查单个键时顺着树往下走，查一段范围时先定位到起点叶子、再沿着叶子链表顺序读
  - id: lookup
    title: 点查走树实测：跳三四层页，稳态下只读一次盘
    tldr: 点查访问的页数等于树高（通常 3～4 页）；由于根页与二层内节点体积小、常驻内存缓冲池，稳态下真正触发磁盘 [[IO]] 的往往只有叶子那 1 页。
    body: |-
      拿 `id = 166` 实际走一趟：先读根页，在分隔键 `[100, 200]` 里算出 `100 ≤ 166 < 200`，顺着中间指针跳进第二层内节点页；在第二层页内再做一次二分，进入对应叶子页；最后在叶子页内二分命中 `166`，取出整行或行指针。全程访问 3～4 页。

      把内存缓存（缓冲池，buffer pool）算进账里，画面更清楚：假设三层树，根页只有 1 页（16KB），几乎 100% 常驻缓冲池；第二层约 1000 页，合计也就 16MB 左右，同样基本装得进内存；只有第三层约 100 万页的叶子层没法全放进内存。因此系统跑稳后，前两层都是微秒级的内存二分，真正落到盘上的随机读通常只剩叶子那 1 页——机械硬盘时代约几毫秒，现行固态盘约几十微秒。数据库调优的核心直觉也从这里来：拼的是少碰几张磁盘页，比较次数再省也抵不过少一次磁盘 [[IO]]。

      要是查一个根本不存在的 `id = 167`，能半路提前返回吗？不能。内节点的路标只管划范围、不管具体谁在不在，引擎必须老老实实走完根到叶子的全程，在目标叶子页里二分扑空后才能确认不存在（第 4 课 LSM 树面对海量文件时，会专门搬出过滤器来省这趟冤枉路）。
    derivation: original
    sources:
      - ref: cmu-15445
        locator: Lecture 08 B+Tree 查找过程
        claim: "[[B+ 树]]查找从根逐层向下到叶子，访问页数等于树高"
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
    canvas:
      kind: datastate
      structure: array
      caption: 查 166 的路径：根 → 内节点 → 叶子
      rows:
        - label: 路径
          cells:
            - v: 根 [100|200]
            - v: → 中间孩子
            - v: 叶子内二分命中
              mark: found
    log:
      - mode: 查询
        event: 一次点查要读的页数就等于树高，数据总量再涨，只要树高不变，页数基本不变
  - id: split
    title: 写满就对半劈：只从根部长高，随机主键最伤填充率
    tldr: 叶子页写满时对半分裂并向父节点推入分隔键，分裂一路传到根才会让树高加 1；乱序插入的随机 [[UUID]] 主键会导致各处半满分裂，让表体积虚胖。
    body: |-
      插入新行时先顺着树定位叶子：页里有空位就直接按序塞进去；页满了（例如 `[10, 20, 30, 40]` 满载），就对半劈成 `[10, 20]` 和 `[30, 40]` 两个半满叶子，并把新分隔键 `30` 插进父节点指向新叶子。父节点也满就递归往上劈；直到根节点分裂时在头顶新建一个根，树高加 1——这是 [[B+ 树]]唯一的长高方式，所以所有叶子永远同深度。

      分裂听着动静大，按摊还账算其实可控：满页劈成两个半满页后，得各自再塞满一半才会再次分裂，平摊到单次插入只是常数级开销。工程上批量建索引时会设[[填充因子]]（比如只填到九成），留一成空隙吸收后续插入、推迟分裂；导大批量数据时「先排好序自底向上批量建树，别开着索引逐条插入」，也是为了绕开一路分裂的损耗。

      真正怕分裂的是随机 [[UUID]] 主键：自增主键让新行永远追加在最右叶子末尾，旧页紧实饱满；随机 UUID 把新行乱撒到全表各个旧叶子，逼得各处频繁半满分裂又填不满，页利用率长期只有五到七成——表文件白胖一圈，缓冲池里的有效数据密度也跟着打折。
    derivation: original
    sources:
      - ref: cmu-15445
        locator: Lecture 08 B+Tree 插入与节点分裂；自底向上批量构建
        claim: B+ 树插入在节点满时分裂并向上传播，根分裂使树增高；排序后自底向上构建最快
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
    canvas:
      kind: datastate
      structure: array
      caption: 叶子满 → 分裂 → 父节点多一个分隔键
      rows:
        - label: 分裂前
          cells:
            - v: 叶子 [10 20 30 40] 满
              mark: active
        - label: 分裂后
          cells:
            - v: "[10 20]"
            - v: "[30 40]"
            - v: 父节点插入键 30
              mark: found
    log:
      - mode: 写入
        event: 分裂只从根部长高，所以所有叶子始终处在同一深度，不会出现一边深一边浅
  - id: clustered
    title: 表里藏着两类树：[[聚簇索引]]存整行，[[二级索引]]多跑一趟[[回表]]
    tldr: 在 [[InnoDB]] 中，表本身就是按主键组织的[[聚簇索引]]（叶子存整行）；其他列上的[[二级索引]]叶子只存主键值，取整行得拿主键再去聚簇索引走一趟[[回表]]。
    body: |-
      表里的整行数据到底存在哪？在 [[InnoDB]] 这类主流引擎里，表数据并没有单独散放，而是直接以主键（如唯一标识一行的用户 `id`）为键组织成一棵 [[B+ 树]]，叶子页里存的就是完整数据行，这棵树叫[[聚簇索引]]。所以按主键点查一步到位，按主键范围扫描就是顺着叶子链表直接读整行。

      给邮箱等其他列建的[[二级索引]]则是另一棵独立的 B+ 树，它的叶子不存整行，只存「`email` 值 → 主键值」（如 `'a@b.c' → 42`）。拿它查整行要走两遍树：先在二级索引拿到主键 `42`，再去聚簇索引把 `42` 对应的整行取出来，这第二趟就叫[[回表]]；如果查询要的列本来就都在二级索引里（即[[覆盖索引]]），当场就能返回，免掉回表。

      二级索引为什么不直接存行的物理磁盘地址，省掉回表走树？因为一旦聚簇索引发生页分裂、数据行搬了家，如果五个二级索引存的都是物理地址，五棵树就得全部跟着改写；改存逻辑主键值，行怎么搬家都只动聚簇索引一处。另外，遇到批量回表嫌随机 [[IO]] 太碎时，引擎还会用「延迟回表 / MRR」优化：先从二级索引捞出主键排好序，再按主键顺序批量回表，把随机乱跳捋成近似顺序读。
    derivation: original
    sources:
      - ref: cmu-15445
        locator: Lecture 08 索引组织与表存储讨论
        claim: 表可按键组织为聚簇索引，二级索引保存主键引用，取完整行需二次查找
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
    canvas:
      kind: datastate
      structure: array
      caption: 二级索引查整行：先拿主键，再回表
      rows:
        - label: 二级索引（email)
          cells:
            - v: email → 主键 42
              mark: active
        - label: 聚簇索引（主键）
          cells:
            - v: 主键 42 → 整行
              mark: found
    log:
      - mode: 回表
        event: 如果要查的列都在二级索引里，第一步就能直接返回，不用再回表走第二棵树
  - id: when-not
    title: 索引不是白送的：写多维护贵，找不到有序起点就失效
    tldr: 每多一棵索引，每次增删改就得多维护一棵 [[B+ 树]]；查询一旦带左通配符、对索引列套函数、断掉最左前缀或命中行数过多，索引都派不上用场。
    body: |-
      索引不是白送的加速器：每次 `INSERT`、`UPDATE`、`DELETE` 都要同步修改表上挂着的所有 [[B+ 树]]（还可能触发页分裂与合并），索引本身也占用磁盘与内存缓存。所以建索引前得先算读写比——读得越频越赚，写得越猛越要克制。

      就算建了索引，写法不对也会当场失效。判断准则就一句：**看能不能在有序的树上直接定位到连续扫描起点**。`LIKE 'abc%'` 能落到 `'abc'` 开头的那张叶子往后扫，换成左通配 `LIKE '%abc'` 开头字母未知，连起点在哪都找不到；对索引列做函数或运算（如 `WHERE lower(name) = 'x'`，除非专门建函数索引）以及隐式类型转换，都会打乱树里原有的排列顺序而使索引失效。写 [[SQL]] 时先问一句「能不能定位起点」，大半失效坑都能躲开。

      顺着这条逻辑还能推清三件事。第一是组合索引的**最左前缀原则**：`(a, b)` 按先 `a` 后 `b` 的字典序排列，单查 `a` 或同查 `a` 与 `b` 都有连续区间可扫，单查 `b` 时 `b` 散在各个 `a` 底下，自然没法定位。第二是低基数列（如性别）：单独建索引区分不了几行，优化器懒得用，但把它拼在高基数列后面组成组合索引却完全可行。第三是优化器的成本底线：如果预计捞出的行数占全表两三成以上，逐行[[回表]]的随机 [[IO]] 比把整表顺序扫一遍还贵，优化器会主动放弃索引改走全表扫描。
    derivation: original
    sources:
      - ref: cmu-15445
        locator: Lecture 08/09 索引使用条件（LIKE 前缀示例）
        claim: 以通配符开头的 LIKE 无法使用 B+ 树索引，而前缀匹配可以；索引增加写入维护成本
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
    canvas:
      kind: datastate
      structure: array
      caption: 能定位起点才有索引可用
      rows:
        - label: 用得上
          cells:
            - v: id = 42
              mark: found
            - v: name LIKE 'ab%'
              mark: found
            - v: ts BETWEEN a AND b
              mark: found
        - label: 用不上
          cells:
            - v: name LIKE '%ab'
            - v: lower(name) = 'x'
    log:
      - mode: 选型
        event: 索引是拿写入时的维护成本换查询时的速度，读得越多越划算，写得越多越要掂量
    code:
      lang: sql
      code: |-
        -- 建索引前，先写出你要加速的查询
        CREATE INDEX idx_users_email ON users(email);
        -- 命中：WHERE email = 'a@b.c'      （定位起点）
        -- 命中：WHERE email LIKE 'a@%'     （前缀范围）
        -- 不命中：WHERE email LIKE '%@b.c' （起点无法定位）
      note: 索引的全部技巧都在「能不能定位」
      highlight: 2
  - id: delete-merge
    title: 删空先借后合：只从根部变矮，删行未必立刻缩文件
    tldr: 节点删到低于半满下限时，先向富余的相邻兄弟借键并更新父节点分隔键，借不到就与兄弟合并；合并一路传到根只剩独苗时，树高才会减 1。
    body: |-
      删除过多数据后树也得会收回高度，动作与分裂严格对称。拿「每节点最多 4 个键、最少 2 个键」的玩具容量走一遍（真实系统里下限约为页容量的一半）：叶子 A 是 `[30, 40]`，右兄弟 B 是 `[50, 60, 70]`，父节点分隔键是 `50`。删掉 A 里的 `30` 后 A 只剩 `[40]`，跌破下限 2。第一步先看邻居能不能借：B 有 3 个键、比下限富余，就把最小的 `50` 借给 A——A 变成 `[40, 50]`、B 变成 `[60, 70]`，父节点分隔键从 `50` 改成 `60`，树形不变。要是 B 当时也只剩 `[60, 70]` 没得借，就把 A 与 B 合并成 `[40, 60, 70]`，同时从父节点删掉分隔键 `50`；若父节点因此也跌破下限，借键与合并继续向上传播；直到根节点只剩唯一一个孩子时，让它接任新根，树矮一层——这是 [[B+ 树]]唯一的变矮方式。

      落到真实工程里有两个细节得提防：一是删插临界点上来回操作容易触发反复分裂与合并抖动，实现里常允许节点暂时低于下限或延迟合并；二是批量删掉大批历史行后，合并只把空闲页收回引擎内部复用，磁盘上的表文件并不会自动变小，往往要靠重建索引或整理表空间才能把物理磁盘还给操作系统。
    derivation: original
    sources:
      - ref: cmu-15445
        locator: Lecture 08 B+Tree 删除与节点合并
        claim: "[[B+ 树]]删除在节点低于最小占用时先向兄弟借键、否则与兄弟合并，根合并使树高降低"
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
    canvas:
      kind: datastate
      structure: array
      caption: 删 30 之后：借得到就改分隔键，借不到就合并
      rows:
        - label: 借键（B 富余）
          cells:
            - v: A [40 50]
              mark: found
            - v: B [60 70]
            - v: 父键 50 改 60
              mark: found
        - label: 合并（B 也不富余）
          cells:
            - v: 合并为 [40 60 70]
              mark: active
            - v: 父删键 50
              mark: active
    log:
      - mode: 删除
        event: 删除时的借键与合并和插入时的分裂正好对称，树变矮也只发生在根部
  - id: prefix-varlen
    title: 长字符串吃掉扇出：内节点截断后缀，叶子页共享前缀
    tldr: 邮箱、网址等变长字符串会让单页可装条目缩水并拉高树层；数据库靠内节点只截留最短可区分前缀、叶子页提取相邻键公共前缀来抢回扇出。
    body: |-
      前面按 16B 定长项算出千级扇出，可真实业务键常是长短不一的字符串：邮箱平均二三十字节，16KB 一页只能塞五六百条，路径字符串更长时扇出缩水更狠，树也跟着长高。数据库分两层把空间抢回来：在内节点层做**后缀截断**——分隔键只当路标，不必存完整长串，比如左右相邻真实键分别以 `apple` 和 `apricot` 开头，分隔键截留到能把两边劈开的最短前缀（如 `apr`）就够导航，省下的字节全换成扇出；在叶子层做**页内前缀压缩**——同一页的键按序紧挨着，像 `reservation/2026/001` 与 `reservation/2026/002` 共享长前缀，只需存一份公共前缀，每条记录只记共享长度与差异后缀 `1`、`2`，比对时按规则还原。

      这笔省空间的买卖是用 [[CPU]] 和实现复杂度换的：插入新键可能改写邻居的压缩边界，分裂与合并时还要重算最短分隔键。所以真实扇出取决于键长分布，线上判断索引健不健康，盯平均页填充率与实际树高监控远比套理论公式靠谱。
    derivation: original
    sources:
      - ref: cmu-15445
        locator: Lecture 08 B+Tree 键表示与页内组织
        claim: 变长键通过分隔键截断与页内压缩减少导航项体积，以维持高扇出
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
    canvas:
      kind: datastate
      structure: array
      caption: 同一页的键共享前缀，每条只存差异部分
      rows:
        - label: 完整键
          cells:
            - v: reservation/2026/001
            - v: reservation/2026/002
        - label: 压缩后
          cells:
            - v: 共享 reservation/2026/00
              mark: found
            - v: 后缀 1 与 2
              mark: found
    log:
      - mode: 压缩
        event: 内节点只存能区分左右的最短前缀，叶子页内让相邻键共享公共前缀，省下的空间都换成扇出
  - id: covering-walk
    title: "[[覆盖索引]]逐页算账：多带一列省掉一半页访问与随机[[回表]]"
    tldr: 把查询所需列放进二级索引（组合索引或包含列），就能在二级索引叶子页当场返回结果，单次点查从约 6 页降到约 3 页，批量查更省掉成片随机 [[IO]]。
    body: |-
      拿「按邮箱查年龄」这句 `SELECT age FROM users WHERE email = 'a@b.c'` 逐页算两遍账。走法一，[[二级索引]]只建在 `email` 上：先在二级索引树走约 3 层定位到邮箱，叶子条目只有主键 `42`；再拿 `42` 去[[聚簇索引]]走约 3 层读出整行才拿到 `age`——前后共约 6 页访问，而且回表那一跳是纯随机 [[IO]]，一旦按范围批量查出几百行，回表次数就随结果行数线性暴涨。走法二，把 `age` 一起放进组合索引 `(email, age)` 或包含列（`INCLUDE`）：同样走约 3 层落到二级索引叶子，`age` 就在手边当场返回，0 次回表、总访问约 3 页，批量查时也只是顺着一棵树的叶子链表顺序推进。

      当然，多带列也要记成本账：索引变宽后一页装的条目变少、磁盘与缓冲池占用变大，而且每次更新 `age` 都要同步维护这棵索引（包含列的折中之处在于 `age` 只存进叶子页免回表，不参与排序也不挤占内节点）。建不建覆盖索引只看一条账：查询频率 × 省下的随机回表开销，能不能盖过索引变宽与写维护的代价。
    derivation: original
    sources:
      - ref: cmu-15445
        locator: Lecture 08 覆盖索引与索引包含列
        claim: 查询所需列全在二级索引内时可免去回表，代价是索引更宽、写维护更贵
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
    canvas:
      kind: datastate
      structure: array
      caption: 同一次查询：回表版约 6 页，覆盖版约 3 页
      rows:
        - label: 只建 email 索引
          cells:
            - v: 二级索引约 3 层
            - v: 拿到主键 42
            - v: 回表再走约 3 层
              mark: active
        - label: 覆盖索引
          cells:
            - v: 索引含 age
              mark: found
            - v: 叶子直接返回
              mark: found
            - v: 0 次回表
              mark: found
    log:
      - mode: 覆盖
        event: 覆盖索引的本质，是把每次查询都要付的回表成本，提前付成索引本身更大的体积
  - id: why-not-hash
    title: 为什么[[哈希]]当不了主索引：赢了单点常数级，输掉范围与顺序
    tldr: "[[哈希]]索引虽能常数级点查，却打散了键序，无法支持范围扫描、排序、前缀匹配与磁盘顺序预读；最后收成上线前的「建索引三问」。"
    body: |-
      单看等值点查（`WHERE id = 42`），[[哈希]]索引算一次哈希直达桶位是常数级，比 [[B+ 树]]走三四层更利落；可主索引要扛的远不止点查，哈希撞上了四处硬伤。第一是**无序**：相邻键被打散到各个桶，范围查、排序、最大最小值、分页全做不了，而这些恰恰占了业务查询的大头；第二是**扩容抖动**：桶满了扩容得把全部键重新散列搬迁，不像 B+ 树只对满页做局部对半分裂、把成本平摊掉；第三是**磁盘无局部性**：相邻键毫无位置关联，磁盘预读与页缓存局部性统统失效，每次访问近似纯随机 [[IO]]；第四是**不支持前缀与部分键**：像 `LIKE 'ab%'` 连算哈希的完整输入都凑不齐，根本找不到起点。

      所以哈希退居到了只问「等值在不在」的专职岗位：内存哈希表、查询执行里的哈希连接，以及第 4 课 LSM 树里替文件看门的[[布隆过滤器]]。磁盘主索引始终由有序的 B+ 树坐镇，原因就两条：业务查询离不开范围与顺序，磁盘介质最偏爱顺序读。

      最后把整课浓缩成写业务时随手可用的「建索引三问」——一问**能不能定位起点**（过滤条件有没有左通配、套函数或断掉最左前缀）；二问**要不要[[回表]]**（高频查询能不能顺带覆盖所需列，主键是不是有序自增以免乱序分裂把表撑胖）；三问**读写账划不划算**（查询省下的读页次数，抵不抵得过每次写入多维护一棵树的开销）。拿这三问过一遍，索引就既不乱建也不漏建。
    derivation: original
    sources:
      - ref: cmu-15445
        locator: Lecture 08 索引结构比较（哈希索引与树索引）
        claim: 哈希索引支持点查但不支持范围与顺序访问，主磁盘索引因此以有序树结构为主
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
    canvas:
      kind: datastate
      structure: array
      caption: 点查哈希占优，其余四项 B 加树全胜
      rows:
        - label: 哈希索引
          cells:
            - v: 点查 常数级
              mark: found
            - v: 范围与排序 不支持
              mark: active
            - v: 扩容 全量重散列
              mark: active
        - label: B 加树
          cells:
            - v: 点查 层数级
            - v: 范围走叶子链表
              mark: found
            - v: 分裂 局部均摊
              mark: found
    log:
      - mode: 选型
        event: 主索引最终选了有序结构，因为业务查询需要范围和顺序，磁盘也更擅长顺序读，两边都要求有序
level: 进阶
minutes: 36
prereq:
  - dsa/bst-trees
  - os/file-system
objectives:
  - 从 16KB 页大小手算一棵 B+ 树的千级扇出与层数量级
  - 说清 B+ 树相比普通 B 树的两处核心改造及范围扫描路径
  - 算清回表与覆盖索引的读页账，识别索引失效的典型写法
aiLink: 向量数据库的索引（如 HNSW）虽是图结构，但「拿空间与写维护换查询少碰磁盘、顺着介质粒度定节点尺寸」的思路如出一辙；RAG 系统的元数据过滤与时序数据检索，底层依然在 B+ 树与倒排索引之间做选型。把这棵树吃透，再看新型索引都有坐标可循。
design:
  - mechanism: B+ 树的磁盘页适配：内节点只当路标，数据全沉叶子并串成链表
    problem: 磁盘按页读写且随机 IO 昂贵：二叉树每层一次随机读，十亿键要跳约 30 层；普通 B 树把整行数据散在各层节点里，挤占了导航项空间导致扇出骤降，做范围查询还得在树层间来回跳跃。
    choice: 让一个树节点恰好对齐一页（如 16KB），内节点只存分隔键与子指针、不存数据行，把整页容量全留给导航；所有数据行统一下沉到同深度的叶子层，再用双向链表把叶子按序串起来。
    tradeoff: 点查没法像普通 B 树那样走运在内节点提前命中，每次都得走到底层叶子；同时节点分裂合并与链表指针增加了写入维护开销，随机插入留下的半满页空间浪费得靠填充因子或重建表来治理。
    root: 一页 16KB 按每条导航项约 16B 能塞下约 1000 个叉，扇出上千让三层树就能装下十亿级键；数据全归叶子并成链，又把高频的范围扫描直接变成了磁盘最便宜的顺序读。
  - mechanism: 二级索引存主键值：多绕一层间接，换数据行搬家时索引免改
    problem: 如果二级索引叶子直接记录数据行的物理页号与偏移，一旦聚簇索引发生页分裂、数据行搬去新页，表上挂着的所有二级索引就得跟着挨个修改指针，写放大随索引数量失控。
    choice: 二级索引叶子只存稳定的主键值，行的真实物理位置只交给聚簇索引一处维护；用二级索引查整行时，先拿主键值再去聚簇索引走一趟树（即回表）。
    tradeoff: 每次通过二级索引取整行都得多跑一棵树，批量查询时随机回表开销随结果行数线性放大；虽能用覆盖索引把常用列冗余进二级索引叶子来免掉回表，但索引体积和更新成本也会随之上涨。
    root: 被多处引用的物理位置必须收敛到单一权威入口，否则一次搬迁就要付出与引用数成正比的修正成本——这与操作系统虚拟内存用页表间接、文件系统用 inode 间接是同一种工程直觉。
  - mechanism: 主索引选有序树弃哈希：让出常数级点查，保住范围扫描与顺序 IO
    problem: 哈希表等值点查是常数级，单看点查比走树更诱人；但数据库主索引还得扛范围扫描、排序、极值与前缀匹配，而哈希会把相邻键彻底打散，让这些查询连起点都摸不到。
    choice: 磁盘主索引坚持采用保持键序的 B+ 树，靠叶子链表铺平顺序扫描通道；把哈希留给内存哈希表、哈希连接和布隆过滤器这类只需回答「等值在不在」的局部场景。
    tradeoff: 等值点查要走三四层页而不是一次散列直达，写入时还得持续承担按序插入、分裂合并的维护成本；换来的是用一套结构同时兜住点查、范围、排序与前缀四类主流查询。
    root: 业务查询里范围与排序占了大头，而磁盘介质本身又给顺序读写远低于随机读写的成本——B+ 树的有序性恰好同时顺应了业务需求与硬件脾气，常数级点查那点局部优势在总账面前并不划算。
quiz:
  - q: B+ 树为什么只用 3–4 层就能装下千万乃至十亿级键？
    options:
      - 因为所有键都被无损压缩成了 1 字节
      - 节点对齐磁盘页且内节点不存数据行，一页装上千个导航键，扇出极大
      - 因为数据库只把一半数据放进索引
      - 因为内节点改用了哈希桶跳跃
    answer: 1
    explain: 16KB 页只放「键 + 子指针」时扇出约 1000，容量每深一层乘以约 1000，3 层即可覆盖约 10^9 量级。
  - q: B+ 树相比普通 B 树最核心的两处改造是？
    options:
      - 节点切得更小、树高建得更深
      - 数据只存在同深度的叶子层，且叶子之间用链表按序相连
      - 插入时不再维持键的顺序
      - 把全部数据行都集中在根节点
    answer: 1
    explain: 内节点腾空只做导航保住了千级扇出；同层叶子连成链表让范围查询直接退化为顺序读。
  - q: 下面哪种 SQL 条件通常用不上普通 B+ 树索引？
    options:
      - WHERE id = 42
      - WHERE name LIKE 'ab%'
      - WHERE name LIKE '%ab'
      - WHERE ts > 100
    answer: 2
    explain: 左通配 %ab 开头字符未知，没法在按字典序排列的 B+ 树里定位连续扫描起点，只能退回全表扫描。
