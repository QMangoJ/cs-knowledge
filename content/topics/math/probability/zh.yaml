- id: total-bayes-chain
  title: 全概率与贝叶斯链：从总失败率倒推病因
  tldr: 先按链路占比把总失败率加权拆开，再拿一次失败反问它最可能来自哪条链路。
  body: '场景：请求经三条链路分发，流量占比分别是零点五、零点三、零点二，三条链路自身的失败率分别是百分之一、百分之四、百分之十。先用全概率公式算总失败率：把样本空间按链路划分，每块用它自己的失败率乘以流量权重再相加，等于零点五乘零点零一，加零点三乘零点零四，加零点二乘零点一，等于零点零零五加零点零一二加零点零二零，总失败率约百分之三点七。现在观测到一次真实失败，用贝叶斯反推它来自第三条链路的概率：第三块的贡献零点零二零除以总量零点零三七，约百分之五十四。结论很醒目：第三条链路只占两成流量，却贡献了过半的失败，排障与扩容都应先扑向它。这套先划分、再加权、后反推的链式套路，是贝叶斯在工程里最常见的出场方式：全概率负责把整体拆开正着算，贝叶斯负责拿着结果倒着找原因。使用前提只有一条：划分必须互斥且完备，各块权重之和为一，漏掉一条链路，后面所有后验都会跟着错，这种错误还不会报错，只会安静地把你引向错误的链路。'
  derivation: original
  sources:
