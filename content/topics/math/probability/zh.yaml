- id: independence
  title: 独立性：最容易被滥用的假设
  tldr: 独立 = 知道 B 不改变对 A 的判断（P(A∩B)=P(A)P(B））；系统里「双机房同挂」多半是独立性假设破产。
  body: '独立的定义很干净：P(A|B) = P(A)。它让很多计算成立：连乘概率、方差相加、二项分布。但现实里独立性是最爱被默认、又最容易破产的假设：两个「独立」副本在同一机架、同一可用区、同一上游依赖时，故障是相关的——以为的双保险其实是单点。

    工程用法有二：一是算概率时明确写下「这里假设独立」并想想靠不靠谱；二是设计上主动制造独立（跨可用区、不同依赖、不同实现），让假设更接近真相。

    再补一个误判重灾区：把相关当独立证据连乘。两个告警同时响，若它们同源于一台过载的机器，它们根本不是两份独立证据；但在贝叶斯更新里若按独立连乘两次似然，后验会被推得过度自信——著名的朴素贝叶斯分类器就是故意做这个近似，名字里的朴素指的正是它，特征近独立时它又快又能用，强相关特征堆叠时它会自信地犯错。工程上审独立性只问一个问题：知道了乙发生，我对甲的概率估计要不要改？要改，就不独立，改多少正是条件概率要算的活。至于给了某个条件之后反而不相关了的情况，叫条件独立，是下一步的正题。'
  derivation: original
  sources:
