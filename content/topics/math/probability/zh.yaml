- id: ai-link
  title: 与 AI 工程的连接
  tldr: 采样是按分布掷骰子，评估是抽样估计，置信度要校准——概率是模型的母语。
  body: '生成模型每步输出的是词表上的概率分布，温度参数把分布拉尖或拍平再抽样——温度高就是让低概率词更容易被抽中。模型评估（准确率、通过率）本质是抽样估计：样本越少，读数越要带着置信区间看，拿 20 条样本的 95% 和 2000 条的 95% 比大小是经典笑话。

    还有校准（calibration)：模型说「80% 把握」的一批预测里，长期真的应有约 80% 正确——期望与频率的长期一致性，就是这一课的大数定律。读任何 benchmark 前，先问三件事：样本量、先验（基础率）、是否独立抽样。

    把两笔账预告在这里，后面专门有一步细算。温度的账：温度本质是给分布做指数缩放，温度低于一时高概率词的份额被放大、生成更保守，温度高于一时分布被拍平、低概率词更容易被抽中，温度趋近于零就退化成永远取最大概率的贪心。置信区间的账：通过率这类比例的抽样波动半径大约按样本量的平方根缩小，样本一百时半径是百分点量级，样本一万时才收窄一个数量级，所以拿两百条样本上的百分之九十五去压两千条样本上的百分之九十三，是拿噪声当结论。读任何评测数字之前，先找样本量，这是概率课给工程师留下的第一反射。'
  derivation: original
  sources:
  - ref: mit-6041
    locator: MIT 6.041SC 大数定律与统计推断章节
    claim: 样本均值随样本量增大收敛到期望，构成抽样估计与频率解释的基础
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: 读 benchmark 的三连问
    rows:
    - label: 三连问
      cells:
      - v: 样本量多大？
      - v: 基础率多少？
      - v: 抽样独立吗？
        mark: found
  log:
  - mode: 应用
    event: 概率不是考试题，是读数的眼镜
level: 基础
minutes: 32
prereq: []
objectives:
- 用样本空间与三条公理为简单场景建模
- 独立算出带基础率的贝叶斯后验并解释结果
- 正确使用期望线性与方差相加的条件
aiLink: 概率是模型的母语：采样温度在改分布，评估在做抽样估计，置信度需要校准。学完这一课，再看任何模型指标与实验报告，都能先问对问题。
design:
- mechanism: 为什么描述不确定要用概率而不是确定性规则——规则只能给有或没有，概率能给程度，而工程决策恰恰活在程度上
  problem: 根本约束是世界本身带随机性：同样的输入，请求可能超时也可能不超时，检测可能命中也可能误报，确定性规则被迫把连续的可能性压成非黑即白的结论，既丢掉了程度信息，也无法表达证据累积时信念该如何渐变
  choice: 做法是给每个事件赋一个零到一之间的数并服从三条公理，用条件概率表达看到证据后如何更新，用期望与方差分别表达长期中心与波动半径，让不确定从需要掩盖的缺陷变成可以计算、可以比较、可以定价的对象
  tradeoff: 代价是概率数字本身需要来源与校准：先验拍脑袋、独立性假设不成立、样本空间漏项，都会让算出的数字精确地错；同时概率结论天然带区间，向习惯了确定答案的协作方解释成本不低，还要时刻防着把概率当保证来用
  root: 根子在频率的长期账上：大数定律保证重复次数足够多时，频率会收敛到概率，于是概率不是主观感觉，而是对长期行为的可验证预测；确定性规则给不出这种长期承诺，它在随机世界里能做的只有假装世界不随机
- mechanism: 为什么贝叶斯里先验丢不得——后验是似然与先验共同定的，扔掉先验等于默认所有假设一样常见，而现实里它们从来不一样常见
  problem: 根本约束是证据的强度必须放在基数上称：检测再准，若被检测的事情本身极其罕见，正常样本基数产生的误报就会在数量上淹没真命中，只看检出率与误报率本身，永远算不出一次告警到底有几分可信
  choice: 做法是坚持后验正比于似然乘先验的完整形式：先写下假设的基础率，再乘证据在该假设下的出现概率，最后归一化；哪一步都不能省，尤其不能把似然直接当后验报出去，那正是把患者有症状率误当有症状者患病率的经典翻车
  tradeoff: 代价是先验需要估计且常有争议，不同人给的先验不同会算出不同后验，团队要为先验的来源与取值达成共识；同时后验对先验的取值敏感，基础率差一个数量级，结论就可能反转，敏感性分析因此成为必做功课而不是选做
  root: 根子在分母的构成上：后验的分母是所有能产生这份证据的路径的加权和，罕见假设的路径权重被它的基础率压得极小，常见假设哪怕单条路径概率低，靠基数也能在分母里占主导；基础率千分之一、误报百分之一时后验只有约百分之九，就是这笔基数账算出来的必然
- mechanism: 为什么期望的线性不需要独立而方差需要——一个是定义的直接展开，一个会被协方差项改写，这条分界线决定了做估算时先审什么
  problem: 根本约束是工程估算天天要算总和：总延迟、总成本、总失败数都要由分量加总，但分量之间往往相关，若连期望相加都要先证明独立，大半估算在第一步就卡死，实践中根本推行不下去
  choice: 做法是把两条规则分开记牢：期望的和等于和的期望无条件成立，因为期望的定义是加权求和，求和与求和天然可交换顺序；方差的和则要多出一项两倍协方差，只有当协方差为零，也就是不相关或独立时，才能干净地相加
  tradeoff: 代价是方差与尾部估计必须先审相关性：同机部署、共因故障、流量尖峰都会让协方差为正，按独立算出的总方差会系统性偏小、尾延迟偏乐观，这类低估平时不显形，专挑高压时刻以事故的形式兑现
  root: 根子在数学结构上：期望是一阶矩，线性来自求和符号的分配律，不依赖任何概率假设；方差是二阶矩，展开平方和时交叉项就是协方差，它记录的正是变量同涨同落的程度——能不能相加的区别，本质上是一阶与二阶在代数上的区别
quiz:
- q: 检测系统对罕见故障的告警大多是误报，主要因为？
  options:
  - 检测系统质量差
  - 基础率（先验）太低：正常样本的绝对数量远大于故障样本
  - 告警声音太小
  - 概率不适用于工程
  answer: 1
  explain: 后验 ∝ 似然 × 先验；故障占 0.1% 时，1% 的误报率产生的误报数远超真故障的检出数。
- q: 关于期望与方差的相加，正确的是？
  options:
  - 两者都需要独立才成立
  - 期望相加永远成立；方差相加需要独立（或不相关）
  - 两者都永远成立
  - 期望相加需要独立
  answer: 1
  explain: 线性是期望的固有性质；方差相加时会出现协方差项，只有不相关时才消失。
- q: P(A|B） 与 P(B|A) 的关系是？
  options:
  - 总是相等
  - 一般不相等，靠贝叶斯公式与各自的先验换算
  - 前者总是更大
  - 后者不定义
  answer: 1
  explain: 「患者有症状率」与「有症状者患病率」是两个数，混淆它们是概率推理的头号错误。
