    event: 全概率正着拆，贝叶斯倒着推
- id: cond-independence
  title: 条件独立：给了条件，相关可以消失也可以出现
  tldr: 无条件独立与条件独立互不蕴含：固定住共同原因，两个信号的相关会被解释掉；固定住共同结果，又会凭空生出相关。
  body: '定义先写清：给定条件丙之后甲与乙独立，意思是已知丙的前提下，甲乙同时发生的概率等于各自概率之乘，换句话说，在丙的世界里再知道乙，对甲的判断不再有任何增量。第一个方向，相关被条件消掉：两个告警都由同一台机器的过载状态决定，不知道机器状态时两个告警高度相关、一响齐响；一旦已知机器确实过载，第一个告警响不响就不再提供关于第二个的新信息，它们的相关性被共同原因解释完了，故障定位时先固定根因再逐个看信号，靠的就是这个原理。第二个方向更反直觉，相关被条件造出来：两个本来独立的因素共同决定一个结果时，若把结果固定住回头看两个因素，它们反而会呈现负相关，因为一个因素强，另一个就必须弱才能凑出同样的结果。两个方向合起来说明：独立性从来不是事件的固有标签，而是相对于你已知什么而言的。工程用法有二：一是建模时主动找那个能解释掉相关的共同原因，用条件独立把复杂的联合分布拆成能算的 pieces；二是警惕反向误用，把相关消失说成没有关系，它只说明关系被给定的变量中介了而已。'
  derivation: original
  sources:
  - ref: mit-6041
    locator: MIT 6.041SC 条件独立性一节
    claim: 条件独立指给定条件下联合概率可分解，它与无条件独立互不蕴含
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: 相关不是固有标签，取决于你已经知道了什么
    rows:
    - label: 不知机器状态
      cells:
      - v: 两告警一响齐响
        mark: active
      - v: 高度相关
        mark: active
    - label: 已知机器过载
      cells:
      - v: 相关被解释掉
        mark: found
      - v: 条件独立
        mark: found
  log:
  - mode: 条件独立
    event: 固定共因消相关，固定共果生相关
- id: binomial
  title: 二项分布直觉走例：失败几次算正常
  tldr: 单次失败率百分之一、独立一百次：期望失败一次，一次不失败的概率只有约三成六——偶发失败是常态不是事故。
  body: '设定：单次请求失败率是百分之一，独立重复一百次，失败次数服从二项分布。先算中心与半径：期望等于一百乘零点零一等于一次，方差等于一百乘零点零一乘零点九九约零点九九，标准差约一次。所以一百次里失败一两次是分布的正中央，不值得大惊小怪。再算一个常被误判的数：一百次一次都不失败的概率是零点九九的一百次方，约等于百分之三十六点六——也就是说近三分之二的情况下都会至少失败一次，把持续集成偶发一次红灯当成有人搞破坏，是对二项分布没有直觉。三次或更多失败的概率约百分之八量级，偶尔也会出现；但若连续观察到五次失败，其概率只有约百分之零点四量级，这时该怀疑的就不是运气，而是失败率本身已经不是百分之一了——分布漂移、新上线的缺陷、依赖方劣化，先查这些。最后划成立条件：二项分布要求每次试验概率相同且彼此独立，线上若存在尖峰相关，比如一个故障引发一连串失败，独立性破产，实际方差会远大于公式给出的值，这种现象叫过离散，它正是告警风暴在数学上的面孔。用二项分布做判断前，先审这两条假设，就是在审自己的数据配不配用这个模型。'
  derivation: original
  sources:
  - ref: mit-6041
    locator: MIT 6.041SC 二项分布与随机变量章节
    claim: 二项分布描述独立重复试验的成功次数，其期望为 np、方差为 np(1-p)
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: n=100、p=0.01：期望 1 次，全绿概率只有约 36.6%
    rows:
    - label: 失败次数
      cells:
      - v: 期望 1 次
        mark: found
      - v: 0 次 ≈ 36.6%
      - v: ≥5 次 ≈ 0.4%
        mark: active
    - label: 判断
      cells:
      - v: 1 到 2 次 常态
        mark: found
      - v: 5 次 查分布漂移
        mark: active
  log:
  - mode: 二项
    event: 先算期望与半径，再判断几次失败算异常
- id: expectation-apps
  title: 期望的定量应用：采样温度与置信区间
  tldr: 温度是对分布做指数缩放，置信区间是给点估计配半径——这两笔账是期望与方差在 AI 工程里的日常用法。
  body: '先算温度。某一步生成时三个候选的原始概率是零点七、零点二、零点一。温度的作用等价于把每个概率取一除以温度次幂后再归一化：温度取零点五时指数是二，权重变成零点四九、零点零四、零点零一，归一化后约零点九一、零点零七、零点零二，分布明显变尖，生成更保守更确定；温度取二时指数是零点五，权重是三者的平方根约零点八四、零点四五、零点三二，归一化后约零点五二、零点二八、零点二零，分布被拍平，低概率候选被抽中的机会大幅上升，生成更随机更多样（具体数值随实现细节略有出入，量级与方向如此）。再算置信区间：评估集两百条、通过率零点八五，比例的标准误约等于根号下零点八五乘零点一五除以两百，约百分之二点五，百分之九十五置信区间约为零点八五正负零点零五。这意味着另一个模型测出零点八八完全落在本模型的噪声半径之内，两者分不出胜负；想把半径压到百分之一以内，样本量要提到约两千条量级，标准误降到约百分之零点八。两笔账其实是同一件事的两面：温度在主动操纵分布的形状，置信区间在诚实报告估计的半径；期望给中心、方差给半径，这门课的工具在 AI 工程的日常里就是这样合流的。只报点估计不报样本量与区间的评测，等于只报了一半信息。'
  derivation: original
  sources:
  - ref: mit-6041
    locator: MIT 6.041SC 期望、方差与抽样估计章节
    claim: 抽样比例的标准误约为根号下 p(1-p)/n，样本量决定置信区间的宽度
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: 温度改形状，样本量定半径：n=200 时通过率的半径约 ±5 个百分点
    rows:
    - label: 温度 T=0.5
      cells:
      - v: 0.7 升到约 0.91
        mark: found
      - v: 分布变尖
        mark: found
    - label: 温度 T=2
