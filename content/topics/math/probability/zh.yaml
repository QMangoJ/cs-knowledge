  code:
    lang: python
    code: "# 贝叶斯一行版：告警响了，真是故障的概率\nprior = 0.001        # 基础率：故障本身多罕见\nsens = 0.99          # 真故障时告警的概率（检出率）\nfpr = 0.01           # 正常时误报的概率\nposterior = sens * prior / (sens * prior + fpr * (1 - prior))\nprint(posterior)     # ≈ 0.09 —— 九成是误报"
    note: 改三个数，就能给任何检测系统算后验
    highlight: 5
- id: expectation
  title: 随机变量与期望：长期平均的预测
  tldr: 期望 E[X] = Σ x·P(X=x)：不是「最可能的值」，是重复很多次后的平均落点。
  body: '随机变量是把结果变成数字的函数（掷骰子的点数、一次请求的延迟）。期望是按概率加权的平均：骰子期望 3.5——一次永远掷不出 3.5，但掷一万次的平均会稳定在 3.5 附近（大数定律）。

    期望最有用的性质是线性：E[X+Y] = E[X] + E[Y]，不需要 X、Y 独立。总延迟 = 各段延迟之和时，总期望直接相加，不管各段是否相关——这是做容量与成本估算时天天在用的免费午餐。方差 Var 量波动大小：Var(X)=E[(X−E[X])²]；它就没有这么客气了，只有独立（至少不相关）时才有 Var(X+Y)=Var(X)+Var(Y)。

    补两个走例把分工钉死。成本估算：一台机器日均一百万次请求、单次平均成本零点零零二元，日成本的期望直接是一百万乘单次期望等于两千元，线性让这笔账不需要知道请求之间相不相关、不需要任何分布假设。波动估算：两个独立服务各段延迟的方差都是四平方毫秒，串联总延迟的方差是八、标准差约二点八三毫秒；但若两服务同机部署、负载同涨同落，协方差为正，总方差会大于八，按独立算出的尾延迟会系统性偏乐观。结论是：期望负责算预算的中心，方差负责算余量的半径，拿期望谈稳定性、拿方差谈平均值，都是用错了工具。'
  derivation: original
  sources:
  - ref: mit-6041
    locator: MIT 6.041SC 随机变量、期望与方差章节
