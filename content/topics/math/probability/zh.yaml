title: 概率基础：条件概率、贝叶斯与期望
summary: 不确定的世界用概率说话：这一课只学四件工程与 AI 天天在用的工具——条件概率、贝叶斯、期望、方差与独立性。
premise: 以告警系统误报、采样温度与 A/B 实验读数三个场景为例。
position: >-
  本课属于「概率的语言」板块，虽是数学基础里孤零零的一站，却是全站反复借用的暗线底座：模型置信度、采样温度、A/B 读数与延迟分位数，本质上都在用同一套不确定度量衡说话。学完你能亲手算出基础率千分之一时告警后验为何只有约百分之九，也能分清期望相加何时免费、方差相加为何必须先审独立性与协方差。
overview:
- key: 一句话总结
  value: 概率是给「不确定」定的度量衡；条件概率是更新认知的规则，期望是长期平均的预测
- key: 三条公理
  value: 非负、总和为 1、不相交事件可加——其余公式都由此推出
- key: 条件概率
  value: P(A|B) = P(A∩B) / P(B)：知道 B 发生后，样本空间缩到 B 里面
- key: 贝叶斯
  value: 后验 ∝ 似然 × 先验；忽略先验（基础率）是最常见的推理错误
- key: 期望与方差
  value: 期望是加权平均且线性可加（不需要独立）；方差量的是波动，相加则需要独立等条件
- key: 大数定律的直觉
  value: 样本均值随样本量增大收敛到期望——一切抽样估计的地基
