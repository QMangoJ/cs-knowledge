steps:
- id: why
  title: 为什么工程师要学概率
  tldr: 模型输出的是概率，实验读的是抽样，系统抖的是随机变量——不用概率的语言，就读不懂三者的说明书。
  body: '分类模型吐出的 0.8 是概率；A/B 实验说「转化率提升 2%，p<0.05」是概率；请求延迟的 P99 是分布的分位数；采样温度调的是分布的形状。AI 与后端工程的日常语言，一半是概率。

    这一课不求全，只求四件工具真正会用：条件概率（看到证据怎么更新）、贝叶斯（先验别丢）、期望（长期平均怎么算）、方差与独立性（波动有多大、什么时候能相加）。

    再把场景说具体。值班同学面对的告警系统一天响两百次、真故障只有两次，不会算后验的人会把精力平均撒在两百次上，会算的人先问基础率。A/B 实验读到转化率提升两个百分点，样本只有两百人时，这个数大概率是抽样噪声而不是真实效果，急着全量上线就是拿概率当儿戏。概率给工程师的核心产出不是某个公式，而是一套判断数字可信度的直觉：点估计是多少、波动半径有多大、手里证据的强度够不够支撑正在做的决定。这一课每个公式都会落到一个工程场景上，公式可以现推，场景感一旦建立就不会丢。'
