- id: model
  title: 概率模型：样本空间、事件与三条公理
  tldr: 先圈定所有可能结果（样本空间），事件是它的子集，概率是给事件赋值的三条规矩。
  body: '任何概率问题先建模：样本空间 Ω 是全部可能结果的集合（掷骰子是 {1..6}）；事件是 Ω 的子集（「掷出偶数」）；概率 P 给每个事件一个 0 到 1 的数，只需满足三条公理：非负；P(Ω)=1；互不相交的事件并集概率 = 各自概率之和。

    公式感来自建模：把问题翻译成「样本空间是什么、事件是哪个子集」，剩下的大半是集合运算。建模错了（比如把不独立当独立、把样本空间漏了），公式再熟也救不回来。

    补一个建模走例：给一次接口调用建模，样本空间取成功、超时、报错三种结果，依历史统计赋概率零点九七、零点零二、零点零一，失败事件是超时与报错的并集，两者不相交，按可加性失败概率等于零点零三，全程没有新公式。再点两个建模翻车点：一是样本空间漏项，比如返回了错误数据但状态码是两百的静默失败没被列进任何结果里，后面算什么都系统性偏低；二是把连续量硬塞格子，延迟是连续的，谈某个精确毫秒值的概率没有意义，要谈落在区间内的概率，也就是用分布而不是单点。最后一条纪律：每个概率都要能说清来源——频率统计、机理推导，或者明确标注的假设，拍脑袋填的先验会在贝叶斯更新里被放大成拍脑袋的结论。'
  derivation: original
  sources:
  - ref: mit-6041
    locator: MIT 6.041SC Unit I（概率模型与公理）
    claim: 概率由样本空间、事件与满足非负/归一/可加三条公理的概率律定义
