- id: poisson
  title: 泊松分布：单位时间里平均来 λ 个的计数
  tldr: 桥搭好后，从最常见的计数场面开始认形状：接口一分钟报几次错，只关心次数、不关心具体时刻。这类「一段时间里发生几次」用泊松：整张表只由平均速率 λ 一个参数定死。
  body: |-
    先说它在数什么。有些事你不关心它几点几分发生，只关心一段时间里一共发生几次：接口每分钟报几次错、客服每小时接到几通电话、放射性样品每秒衰变几次。这类计数有个共同脾气：平均速率大致稳定，各次发生彼此独立，上一次刚发生不影响下一次什么时候来。满足这几条，次数就服从泊松分布，整张表只由一个参数决定：[[λ|lambda]]，单位时间里平均发生的次数。公式是 P(X=k) 等于 e 的负 λ 次方乘 λ 的 k 次方再除以 k 的阶乘——先别怕，它只是在说：平均来 λ 个时，恰好来 k 个的概率是多少。走例：某接口每分钟平均报错三次，λ 等于三。恰好零次的概率是 e 的负三次方，约百分之四点九八——平均三次不等于每分钟必有三次，大约二十分钟里才有一分钟是干净的。恰好五次的概率是 e 的负三乘三的五次方除以一百二十，约百分之十点一，比恰好三次的约百分之二十二点四低不少。注意均值与方差都是 λ：平均三次，典型波动是根号三约一点七次，看到五次先别慌，那还在分布的身体里；看到十次，才该怀疑 λ 本身变了。
  derivation: original
  sources:
  - ref: openstax-stats
    locator: OpenStax《Introductory Statistics 2e》4.6 Poisson Distribution
    claim: 泊松分布给出固定时间或空间区间内事件发生次数的概率，事件以已知平均速率发生且独立于上次发生的时间；参数 μ（即 λ）是该区间的平均发生次数，P(X=x)=μ^x·e^(−μ)/x!
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
