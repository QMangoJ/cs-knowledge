- id: ab-practice
  title: A/B 实验收官：先定样本量，再看数据
  tldr: 两种错都认清了，最后收官到真实的 A/B 实验：先定样本量、再看数据，顺序不能反。基线 10% 想看出 +1 个百分点的提升，α=0.05、功效 0.8 时每组约需 1.5 万人——先算这笔账，再开实验。
  body: |-
    收官走例，把整课拧成一股绳。场景：基线转化率百分之十，新版期望提升一个百分点到百分之十一——注意这是一个百分点，不是百分之一。先定纪律，再看数据：主要指标就转化率一个，α 定零点零五（双侧），功效定零点八。样本量用双比例标准公式算：把两组比例的方差、α 对应的 z 值一点九六、功效对应的 z 值零点八四代入，每组约需一万四千七百五十一人，量级一万五，两组共约三万人。为什么这么多？一个百分点的差异，相对于单人转化与否的巨大随机波动（转或不转是零一变量，标准差约零点三），信号被噪声淹得很深，只能靠根号 n 那条账慢慢把标准误压下去：每组一万五时，两组差值的标准误才降到约零点三六个百分点，一个百分点的真提升才有八成机会被查出来。若只跑每组一千人就急着看结果，标准误比待测的差异还大，显著多半是运气、不显著也说明不了没效果——功效不足的实验，怎么做都是浪费流量。整课回收成一句纪律：先认分布的形状，再算标准误与样本量，先定指标、α 与功效，然后才配看数据；顺序反了，p 值再漂亮，也只是事后编的故事。
  derivation: original
  sources:
  - ref: openstax-stats
    locator: OpenStax《Introductory Statistics 2e》9.2（功效与样本量）
    claim: 检验功效为 1−β，增大样本量可以提高功效；α 是预先设定的第一类错误概率
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
  canvas:
    kind: datastate
    structure: array
    caption: 基线 10%、α=0.05、功效 0.8：想测出的提升越小，每组样本量涨得越凶（人）
    rows:
    - label: 每组样本量
      display: bars
      cells:
      - v: 57763
