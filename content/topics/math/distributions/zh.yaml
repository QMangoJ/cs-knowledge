title: 概率分布与假设检验：先认形状，再问结论可信度
summary: 承接概率基础：先认整批数据的形状（泊松、正态、指数、均匀），再用抽样分布、置信区间与假设检验，判断两组读数的差异凭什么算数。
premise: 接口每分钟报多少次错、一个请求要等多久、抛一枚硬币到底公不公平、[[A/B 实验]]里转化率涨的那一点算不算数，这四个问题表面上毫不相干，其实都要先回答同一件事，就是这批数据本来长什么形状、波动有多大。本课就用这四个场景为例，先学着认分布的形状，再学着判断由数据得出的结论到底可不可信。
position: 本课是数学科「概率的语言」板块的第二站，紧接上一课 probability：上一课把单个事件算清——条件概率更新认知、贝叶斯算告警后验、期望与方差量中心与半径；本课把视角从单个事件换到整批数据，先问数据的整体形状叫什么名字（泊松、正态、指数、均匀），再问由这批数据得出的结论有多可信——两组读数的差异是真的，还是抽样噪声装的。学完你能手算泊松与正态的基础概率，说清标准误与那条 ±5% 的来历，准确说出 p 值的定义，并为一个 A/B 实验估出样本量的量级。
bridge:
  prev: 上一课算的是单个告警响起时它是真故障的后验概率，以及两百条评估样本给出的通过率置信度；本课先把镜头拉远，问整批数据的整体形状叫什么名字，再问两组读数的差异凭什么算数——从一个事件的可信度，走向一批数据的形状与一串结论的可信度。
overview:
- key: 一句话总结
  value: 分布是给每个可能结果分派概率的一张表或一条曲线；先认形状，再套公式，最后才谈结论可信度。顺序不能反，比如先认出报错次数服从泊松分布，才知道该用哪套公式算它涨一倍是不是异常，不然公式套得再对也是在猜。
- key: 常见分布
  value: "[[泊松分布]]数单位时间里发生的次数，[[正态分布]]是许多小扰动相加的钟形，[[指数分布]]数等待且无记忆，[[均匀分布]]是人人一样可能；其中 [[λ|lambda]] 表示单位时间平均发生的次数，[[μ|mu]] 表示均值、[[σ|sigma]] 表示标准差"
- key: 抽样分布
  value: 样本均值自己也是随机变量，它的波动叫[[标准误]] σ/√n——样本越大，均值越稳，但只按根号变稳
- key: 置信区间
  value: "[[置信区间]] = 估计 ± 约 2 个标准误（95%）；九十五说的是方法的长期命中率，不是一个已算好的区间的命中概率"
- key: 假设检验
  value: 先立「没效果」的[[原假设]]（记作 H0）让数据来反驳；[[p 值]]是 H0 为真时看到这么极端数据的概率，不是 H0 为真的概率
