- id: random-variable
  title: 随机变量与分布：把样本空间变成数
  tldr: 要认形状，先得把文字结果变成数字。这一步的随机变量就给样本空间的每个结果派一个数；离散看表，连续看曲线下面积——上一课的二项分布就是一张现成的表，正好拿来接上。
  body: |-
    先把上一课的样本空间接过来。上一课说样本空间是全部可能结果的集合，结果本身可以是文字：接口调用的结果是成功、超时、报错。但文字没法做加减乘除，更没法画形状——随机变量就是那座桥：给每个结果派一个数，成功记零、失败记一，一次调用就变成一个取零或一的数；一百次调用里失败的次数，就是一个取零到一百的数。上一课二项分布那一步数的正是它：一百次里失败几次，期望一次、全绿概率约百分之三十六点六，那张「次数对概率」的表，就是失败次数这个随机变量的分布。随机变量分两类。离散的靠数：失败次数、每分钟报错数，取值一个一个可数，分布是一张表，每个取值配一个概率，所有概率之和等于一。连续的靠量：延迟、身高，取值是区间里的任意实数，谈某个精确值的概率没有意义（恰好一百点零零零毫秒的概率是零），要谈落在区间内的概率，它等于分布曲线下那段区间的面积，整条曲线下总面积等于一。分清在数还是在量，是选表还是选曲线的分水岭。还有一处回收：上一课算过的期望与方差，正是从这张表里压出来的两个数——期望把整张表压成中心，方差把整张表压成半径；本课反过来，先把整张表认全，再谈那两个数够不够用。
  derivation: original
  sources:
  - ref: openstax-stats
    locator: OpenStax《Introductory Statistics 2e》4.1 离散随机变量的概率分布函数与 5.1 连续随机变量导论
    claim: 离散随机变量的取值由计数得到、连续随机变量的取值由测量得到；离散分布各概率之和为一，连续分布的概率是密度曲线下的面积
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
  canvas:
    kind: datastate
    structure: array
    caption: 同一座桥的两端：数出来的看表，量出来的看面积
    rows:
    - label: 离散（数）
      cells:
      - v: 失败次数 0 到 100
      - v: 分布是一张表
      - v: 概率之和 = 1
