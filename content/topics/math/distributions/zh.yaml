steps:
- id: why
  title: 从单个事件到整批数据：先认形状
  tldr: 先把视角交代清：上一课算的是一个事件可不可信；这一课把镜头拉远，先认整批数据长什么形状，再问由它得出的结论算不算数——为什么先认形状，是因为形状认错，后面公式套得再准也用错了表。
  body: >-
    上一课的视角始终钉在单个事件上：一次告警响了，它是真故障的概率约百分之九；两百条评估样本，通过率的半径约正负五个百分点。这两个问题都很重要，但工程里更多时候面对的不是一个事件，而是一整批数据：这一分钟来了几次报错、这一万次请求的延迟长什么样、两组实验读数的差距算不算数。面对整批数据，第一步不是套公式，而是先认形状：数据是挤在中间、两边对称地散开，还是拖着一条长尾巴，还是每个取值一样平？形状认对了，该用哪张概率表、哪条曲线，自己就浮出来了；认错了，后面算得再精确，也是拿错地图找路。这一课给出的定义只有一句：分布，就是给随机变量的每个可能结果分派概率的一张表（离散时）或一条曲线（连续时），全部分派加起来等于一。后面所有内容——泊松、正态、抽样分布、置信区间、假设检验——都围着这张表转：先认它叫什么名字，再问由它算出的结论有多可信。这也是读任何一份实验报告应有的顺序：先问数据是什么形状、该用哪张表，再问差异有多大、结论站不站得住；顺序反了，数字越精确，错得越体面。
  derivation: original
