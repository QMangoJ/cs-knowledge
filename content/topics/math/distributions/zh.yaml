      cells:
      - v: p=0.03 → H0 有 3% 概率为真
        mark: active
      - v: 结论有 97% 概率正确
        mark: active
    - label: 正读
      cells:
      - v: H0 为真时，这么极端的数据只有 3%
        mark: found
      - v: 算的是数据的概率
        mark: found
  log:
  - mode: 检验
    event: 检验要先立「没效果」的原假设，只有 p 小于事先定好的 α 才推翻它
- id: coin-test
  title: 完整手算一例：硬币抛 100 次出 65 次正面
  tldr: 框架讲完，完整走一遍才算学会：有人说一枚硬币偏正，抛 100 次出了 65 次正面，到底冤不冤枉它。期望 50、标准差 5，65 次是 3 个标准差之外；二项精确双侧 p 约 0.0035，公平这个假设站不住。
  body: |-
    把框架完整走一遍。有人说这枚硬币偏正：抛一百次，出了六十五次正面。正面概率真是零点五吗？第一步立 H0：硬币公平，p 等于零点五；备择是 p 不等于零点五（双侧，因为偏正偏反都算偏）。第二步算在 H0 下该看到什么：一百次抛掷的正面次数服从二项分布（上一课的老朋友），期望是五十次，标准差是根号下一百乘零点五乘零点五，等于五次。观测的六十五次离期望十五次，正好是三个标准差，[[z 分数]]等于三。第三步算 p 值：纯靠运气，正面次数偏离五十达到十五次或更多的概率有多大？正态近似给出双侧 p 约零点零零二七；二项精确计算是把六十五次及以上的概率、加上对称的三十五次及以下的概率，双侧 p 约零点零零三五——两种算法量级一致，都在千分之几。第四步下结论：事先定 α 等于零点零五，p 远小于 α，拒绝 H0，这枚硬币不公平的证据很强。但注意措辞：我们否掉的是「公平」这一个具体假设，并没有直接算出真实概率；想知道它大概是多少，那是置信区间的活：零点六五正负约零点零九，区间不含零点五，和检验结论互相印证。
  derivation: original
  sources:
  - ref: mit-6041
    locator: MIT 6.041SC 二项分布与随机变量章节
    claim: 二项分布描述独立重复试验的成功次数，其期望为 np、方差为 np(1-p)
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
  - ref: openstax-stats
    locator: OpenStax《Introductory Statistics 2e》9.4（p 值定义与 α 比较）
    claim: p 值按原假设为真时得到一样或更极端结果的概率计算，并与预先设定的显著性水平 α 比较作决策
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
  canvas:
    kind: datastate
    structure: array
    caption: 公平硬币下 65 次正面落在 3 个标准差处，双侧尾概率只有千分之几
    rows:
    - label: H0 下
      cells:
      - v: 期望 50 次
      - v: 标准差 5 次
      - v: 观测 65 次 = +3σ
        mark: active
    - label: p 值
      cells:
      - v: 正态近似 ≈ 0.0027
      - v: 二项精确 ≈ 0.0035
        mark: found
      - v: 小于 α=0.05 → 拒绝 H0
        mark: found
  log:
  - mode: 手算
    event: 这一例里 z 等于 3、双侧 p 约 0.0035，硬币公平的假设被数据否掉
  code:
    lang: python
    code: |-
      # 二项精确双侧 p：公平硬币抛 100 次，出 >=65 或 <=35 次正面的概率
      from math import comb
      pmf = lambda k: comb(100, k) * 0.5**100
      p_two = sum(pmf(k) for k in range(101) if k >= 65 or k <= 35)
      print(p_two)  # ≈ 0.0035
    note: 正态近似给 0.0027，精确计算给 0.0035，量级一致
    highlight: 4
- id: errors
  title: 两类错误与多重比较：冤枉、放走，与挑出来的显著
  tldr: 检验会下结论，就会犯错；这一步把两种错和一个专坑多指标的陷阱算清，不然下一步定样本量就没有依据。第一类错误率就是 α，第二类错误率是 β，功效是 1−β；同时看 20 个指标，至少一个假显著的概率约 64%。
  body: |-
    检验下结论时有两种错法，法庭的比方最清楚。第一类错误是冤枉好人：H0 本来是真的（没效果、被告无罪），却被数据里的巧合骗得拒绝了它——它的概率正是你事先定的 α，定零点零五，就是接受长期有百分之五的冤案率。第二类错误是放走坏人：明明有效果，却没看出来、没有拒绝 H0，它的概率记作 [[β|beta]]。与 β 相对的是[[功效]]，等于一减 β：真有效果时能把它查出来的概率，行业里常以零点八为及格线。两类错误此消彼长：门槛 α 定得越严，越不容易冤枉，但也越容易放走；想同时压低两者，唯一的出路是加大样本量——样本越大，噪声越小，真假越容易分开，这也是下一步样本量公式的由来。还有一个专坑多指标场景的陷阱：同时盯二十个指标，每个都按 α 等于零点零五判显著，就算新版按钮其实毫无效果，至少有一个指标纯靠运气「显著」的概率也是一减零点九五的二十次方，约百分之六十四。看的指标越多、又专挑最亮的那个报，假阳性就越是被系统性地制造出来。对策只有纪律：事先定主要指标，其余指标的显著只当线索，不当结论。
  derivation: original
  sources:
  - ref: openstax-stats
    locator: OpenStax《Introductory Statistics 2e》9.2 Outcomes and the Type I and Type II Errors
    claim: 第一类错误是 H0 为真时拒绝它、概率为 α；第二类错误是 H0 为假时不拒绝它、概率为 β；检验功效为 1−β，增大样本量可提高功效
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
  canvas:
    kind: datastate
    structure: array
    caption: 两种错的账：α 你自己定，β 靠样本量压；指标越多，假显著越躲不掉
    rows:
    - label: 冤枉好人
      cells:
      - v: 第一类错误
      - v: 概率 = α（常定 0.05）
        mark: active
    - label: 放走坏人
      cells:
      - v: 第二类错误
      - v: 概率 = β，功效 = 1−β
    - label: 20 个指标
      cells:
      - v: 至少一个假显著 ≈ 64%
        mark: active
      - v: 先定主要指标
        mark: found
  log:
  - mode: 错误
