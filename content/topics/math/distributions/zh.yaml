- id: hypothesis-testing
  title: 假设检验：先立「没效果」，让数据来反驳
  tldr: 区间回答的是「真值大概在哪」，这一步换一个问法：两组读数的差异凭什么算数。先立「没效果」的假设让数据来反驳——p 值是「H0 为真时看到这么极端数据的概率」，不是「H0 为真的概率」；α 是看数据之前定的门槛。
  body: |-
    换一个问法。前面问的是「真值大概在哪」，现在问「两组读数的差异，凭什么算数」。新版按钮让转化率高了一点，会不会只是抽样噪声？假设检验的起手式很反直觉：先立一个「没效果」的[[原假设]] H0——按钮没用、硬币公平、药和安慰剂一样——然后让数据来反驳它。这叫举证责任倒置：默认无罪，证据不够强就不推翻。证据强度用 p 值量，它的定义必须一字不差：p 值是「假设 H0 为真时，看到像这次一样极端、或更极端的数据的概率」。注意它算的是数据的概率，不是假设的概率——p 等于零点零三，绝不是「H0 有百分之三的概率是真的」，也不是「结论有百分之九十七的概率正确」；它只说：如果本来就没效果，纯靠运气抽出这么偏的数据，只有百分之三的机会。判不判 H0 死刑，要拿 p 和事先定好的门槛 [[α|alpha]] 比：α 是你在看数据之前就定下的[[显著性水平]]，常用零点零五，p 小于 α 就拒绝 H0、称结果显著。门槛必须事前定：先看数据再挪门槛，等于射完箭再画靶心，多小的 p 都能被「造」出来。
  derivation: original
  sources:
  - ref: openstax-stats
    locator: OpenStax《Introductory Statistics 2e》9.4 Rare Events, the Sample, Decision and Conclusion
    claim: p 值是若原假设为真时，另一随机样本的结果与已得样本一样极端或更极端的概率；决策时把 p 值与预先设定的 α 比较，α 即第一类错误的概率
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
