      cells:
      - v: +0.5 个百分点
      - v: +1 个百分点
        mark: found
      - v: +2 个百分点
      - v: +5 个百分点
  log:
  - mode: 收官
    event: 做 A/B 实验要先定主要指标、α、功效与样本量，定完这些才配看数据
level: 进阶
minutes: 34
prereq:
- math/probability
objectives:
- 给一个场景先说清它在数什么，再选对分布（泊松、正态、指数、均匀）
- 手算泊松概率与正态 68-95-99.7 区间概率
- 用标准误 σ/√n 解释置信区间的 ± 半径从哪来、宽窄由什么决定
- 准确复述 p 值的定义，并为 A/B 实验估算每组样本量的量级
aiLink: 评估模型时同样要先看指标的分布与显著性：通过率的置信区间有多宽、两版模型读数的差异是真提升还是抽样噪声——先算标准误与样本量，再谈谁赢。
design:
- mechanism: 为什么用参数化分布——两三个参数买下整张概率表
  problem: 整批数据的可能取值成千上万，真去逐个记录每个取值的频率，既存不下，也推不到没见过的新情况：下周的报错次数、下一次的延迟都不在旧表里，只攒频率等于没有模型
  choice: 做法是先认生成机制再选分布族，用少数参数把形状定死：计数机制选泊松、一个 λ 定整张表；小扰动相加选正态、μ 与 σ 两个参数定整条曲线；参数一旦定死，任意区间的概率、尾部有多厚、分位数在哪，全都能算出来
  tradeoff: 代价是形状选错全盘皆错：把厚尾数据当正态，会系统性低估极端事件；把相关计数当独立泊松，会低估成串爆发的概率。参数化是压缩，压缩必有损，用之前要验形状——看直方图、看尾部，而不是只看均值对不对得上
  root: 根子在生成机制决定形状族：单位时间独立发生的计数必然走向泊松，许多独立小扰动之和必然走向正态，这是大数定律与中心极限定理保证的规律，不是拟合出来的巧合；参数只是把机制的强度量化，机制认对了，参数才有意义
- mechanism: 为什么假设检验要举证责任倒置——先立「没效果」的 H0 让数据反驳
  problem: 根本约束是人天然想证明自己的方案有效：若默认有效、再去找支持证据，任何抽样噪声都能被挑出来当功劳，实验做得越多、指标看得越多，假证据攒得越快，最后全量上线的全是运气
  choice: 做法是把立场反过来：默认 H0 没效果，想推翻它，数据必须在 H0 之下罕见到 p 小于事先定好的 α 才行；这等于是把举证责任交给「有效」一方，且证据标准在看数据之前就写死，不许事后挪门槛
  tradeoff: 代价是保守，而且只给一半答案：真有效果但样本不够时会被放走（第二类错误）；就算拒绝了 H0，也只说明「没效果」站不住，不告诉你效果到底有多大、值不值得上线——那一半要靠效应量与置信区间补上
  root: 根子在可计算的不对称上：「没效果」是一个精确的假设，它能给出完整的抽样分布，于是数据的罕见程度算得出来；而「有效」有无穷种有效法，无法逐一给出分布去算概率。检验只能拿那个算得出的假设当靶子，用排除法逼近结论
- mechanism: 为什么报区间胜过报单个 p 值——p 只答罕不罕见，区间还答有多大、多准
  problem: 根本约束是决策需要两类信息：效果有多大、估计有多准。p 值只保留了第一类的一半：样本极大时毫无意义的微小差异也能显著，样本极小时真正的大效果也可能不显著，只报 p 等于把决策最需要的量藏起来
  choice: 做法是报告效应量加置信区间：中心是点估计，答「有多大」；宽度由标准误与样本量决定，答「有多准」；区间是否包含零，还顺带给出与 α 对应的显著性判断，一个数升级成一组数
  tradeoff: 代价是坏消息藏不住：区间一宽，估计其实很水就明明白白写在脸上，汇报不如一个「显著」星号好看；且区间同样依赖分布与抽样假设，假设错了，区间照样精确地错，只能靠把样本量与方法写全来让人审
  root: 根子在信息压缩的损失上：p 值是把整条抽样分布压成一个尾概率再过一道阈值，两次压缩丢掉了位置与尺度；置信区间保留了这两维，读者能自己判断这个效果值不值得行动。统计报告的诚实程度，往往就体现在肯不肯把不确定度一起报出来
quiz:
- q: 泊松分布最适合描述下面哪个量？
  options:
  - 一群人的身高分布
  - 接口每分钟的报错次数（平均速率 λ 已知且各次独立）
  - 请求延迟恰好等于 100.000 毫秒的概率
  - 轮盘停在每个角度的概率
  answer: 1
  explain: 泊松数的是固定区间内以平均速率 λ 发生的独立事件次数；身高近正态，延迟的单点概率对连续量无意义，轮盘角度是均匀分布。
- q: 关于 p 值，正确的说法是？
  options:
  - p=0.03 表示原假设有 3% 的概率为真
  - p=0.03 表示结论有 97% 的概率正确
  - p=0.03 表示若原假设为真，看到这么极端或更极端数据的概率是 3%
  - p=0.03 表示效果有 3% 是噪声造成的
  answer: 2
  explain: p 值算的是「H0 为真」这个前提下数据的概率，条件与结论不能颠倒；它不是 H0 为真的概率，这正是贝叶斯一课里 P(A|B) 与 P(B|A) 之分在检验里的重演。
- q: 总体 σ=10，样本量从 100 增到 400，样本均值的标准误如何变化？
  options:
  - 从 1 变成 0.25
  - 从 1 变成 0.5
  - 从 1 变成 2
  - 不变，标准误只取决于 σ
  answer: 1
  explain: 标准误 = σ/√n：n=100 时是 10/10=1，n=400 时是 10/20=0.5。n 翻四倍，标准误减半，这也是置信区间宽度减半的代价。
- q: 基线转化率 10%，想以 α=0.05、功效 0.8 测出提升到 11%（+1 个百分点），每组样本量的量级约为？
  options:
  - 约 150 人
  - 约 1,500 人
  - 约 15,000 人
  - 约 1,500,000 人
  answer: 2
  explain: 双比例样本量公式代入 z(0.975)≈1.96、z(0.8)≈0.84，每组约 14,751 人。差异只有 1 个百分点而单人结果是 0/1 的大波动，只能靠大样本把标准误压下去。
