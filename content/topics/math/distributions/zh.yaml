- id: normal
  title: 正态分布：许多小扰动相加的钟形
  tldr: 计数认完，再看测量量的形状：身高、延迟这类由许多小扰动相加的量，长成一条钟形曲线。μ 定中心、σ 定胖瘦；68-95-99.7 规则让你不查表也能手算区间概率。
  body: |-
    先说它在数什么。量一个人的身高，结果由成百上千个小因素决定：基因、营养、睡眠、测量时站得直不直——每个因素只推高或拉低一点点，加总起来，身高就大多挤在平均附近、离平均越远越少。正态分布数的正是这种「许多小扰动相加」的量：请求延迟、测量误差、考试分数，背后都是它。它的形状是一条钟形曲线，只由两个参数定死：μ 定中心在哪，σ 定胖瘦。为什么偏偏是这条曲线无处不在？中心极限定理给的直觉是：不管单个扰动的分布长什么样，只要是许多独立小扰动相加，和的分布就会向钟形靠拢——边界要说清：扰动要彼此独立、单个不能大到主导总和，金融收益那种一个极端值掀翻全场的厚尾数据，就不在它的地盘里。手算工具是六八、九十五、九九点七规则：落在 μ 正负一个 σ 内约百分之六十八，正负两个 σ 内约百分之九十五，正负三个 σ 内约百分之九十九点七。走例：某个量 μ 等于一百、σ 等于十五，落在八十五到一百一十五之间正好是正负一个 σ，概率约百分之六十八（精确值百分之六十八点二七）；落在五十五到一百四十五之外不到百分之零点三——真观测到那里，先怀疑数据或 μ、σ 变了，而不是感叹运气差。
  derivation: original
  sources:
  - ref: openstax-stats
    locator: OpenStax《Introductory Statistics 2e》6.1 The Standard Normal Distribution（经验法则）
    claim: 正态分布的经验法则：约 68% 的取值落在均值 ±1σ 内，约 95% 落在 ±2σ 内，约 99.7% 落在 ±3σ 内；z 分数以标准差为单位度量偏离
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
