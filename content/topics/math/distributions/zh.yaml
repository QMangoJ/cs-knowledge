- id: exponential-uniform
  title: 一瞥均匀与指数：没个性的平，和没记性的等
  tldr: 钟形看完，再一瞥两个脾气很特别的亲戚，免得遇到时认不出来：均匀只看区间长度占比；指数数等待且无记忆——它和第二步的泊松是同一件事的两面，一个数次数、一个数间隔。
  body: |-
    先看两个一瞥而过的亲戚。均匀分布在数什么？它数的是「区间里每个位置一样可能」的量：一个在零到一百毫秒之间完全随机的抖动、抽奖轮盘停下的角度。它的密度是一条水平线，概率只看区间长度占总长度的比例：抖动落进一百毫秒区间的后二十毫秒里，概率就是百分之二十——没有中心、没有偏好，是最没个性的分布，常被当作「完全不知道形状」时的默认假设。指数分布数的则是等待：事件平均每分钟来三个（还是上一步的接口报错），那两次报错之间要等多久？它和泊松是同一件事的两面：泊松数固定时间里来几次，指数数两次之间隔多久，平均间隔是一除以速率，这里是三分之一分钟、二十秒。它有个反直觉的脾气，叫无记忆性：已经干等了很久还没来，再等超过一分钟的概率，和刚开始等时一模一样——拿数字说，等超过一分钟的概率是 e 的负三次方，约百分之四点九八，已经等了十分钟，这个数纹丝不动。等了多久不影响还要等多久，因为每次发生彼此独立，过去的等待攒不下任何「快轮到我了」的信用。边界也要说清：设备老化、故障率随时间上升的场景不服从指数分布，别拿无记忆性去安慰一台越用越坏的机器。
  derivation: original
  sources:
  - ref: openstax-stats
    locator: OpenStax《Introductory Statistics 2e》5.2 均匀分布、5.3 指数分布与第 5 章复习（泊松与指数的关系）
    claim: 均匀分布在区间内各值等可能；指数分布具有无记忆性 P(X>r+t|X>r)=P(X>t)；若间隔时间服从参数 λ 的指数分布，则单位时间内的事件数服从均值 λ 的泊松分布
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
