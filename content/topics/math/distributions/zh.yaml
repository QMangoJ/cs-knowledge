- id: confidence-interval
  title: 置信区间回收加深：±5% 到底从哪来
  tldr: 标准误算出来了，正好回收上一课留下的一个悬案：那里的 ±5% 到底从哪来。这一步拆账：95% 区间 ≈ 估计 ± 2 个标准误；九十五说的是方法的长期命中率，不是一个区间的命中概率。
  body: |-
    回收上一课的一笔账。那一课说：评估集两百条、通过率零点八五，百分之九十五置信区间约为零点八五正负零点零五——这个正负五是从哪来的？现在能算清了。比例的标准误是根号下 p 乘一减 p 再除以 n：根号下零点八五乘零点一五除以两百，约百分之二点五。而正态曲线里正负约两个标准误（精确是一点九六个）正好罩住中间约百分之九十五，所以区间就是估计值正负约两倍标准误：二点五的两倍，正是那五个百分点。这也把区间的读法钉死了：百分之九十五说的是方法的长期命中率——用同样方法反复抽样、反复造区间，一百个区间里约九十五个会罩住真值；不是说真值有百分之九十五的概率落在这一个已经算好的区间里，真值是固定的，要么在里面，要么不在。区间宽窄由三件事决定：标准误（背后是 σ 与样本量，n 翻四倍宽度减半）、想要的置信水平（九十九的区间必然比九十五的宽，没有又准又稳的免费午餐）、数据本身的波动 σ。只报点估计不报区间的评测，等于把这三件事全藏了起来。
  derivation: original
  sources:
  - ref: nist-handbook
    locator: NIST/SEMATECH e-Handbook 7.1.4 What are confidence intervals? 与术语表 standard error 条
    claim: 置信区间给出可能包含总体参数的取值范围；同一总体反复抽样并造 95% 区间时约 95% 的区间会罩住真参数；正负 2 个标准误通常即约 95% 置信区间
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
  - ref: openstax-stats
    locator: OpenStax《Introductory Statistics 2e》第 8 章 Confidence Intervals
    claim: 置信水平更准确的含义是重复抽样所造区间中包含真总体参数的百分比，区间由点估计加减误差界构成
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
  canvas:
    kind: datastate
    structure: array
