- id: sampling
  title: 抽样分布：样本均值自己也是随机变量
  tldr: 形状都认过之后，问题升级了：我们平时拿到的不是总体、只是一批样本，样本均值自己有多不稳？这一步算这笔账——均值的波动叫标准误，等于 σ/√n：σ=10、n=100 时标准误是 1；想减半，样本要翻四倍。
  body: |-
    现在把视角抬高一层。上一课说样本均值会收敛到期望，但每次抽样算出的均值并不相等：抽一百个用户算平均消费，这次是五十二，下次可能是四十九——样本均值自己也是一个随机变量，它也有自己的分布，叫抽样分布。这个分布长什么样？中心极限定理这次说正式版：不管总体分布多歪，只要样本量够大、抽样独立，样本均值的分布就近似正态，中心还是总体均值 μ，胖瘦由[[标准误]]决定。标准误就是样本均值的标准差，公式是 σ 除以根号 n，分母里的根号是全部关键。走例：总体 σ 等于十，抽 n 等于一百，标准误等于十除以十，等于一——意思是每批一百个样本算出的均值，典型地只在真均值上下一点零的范围里晃。想把晃动减半，n 要翻四倍到四百，标准误变成零点五；n 涨到一万，标准误只剩零点一。为什么均值会变稳？直觉是平均会把运气对冲掉：样本里一个特别大的值，要被其余九十九个普通值摊薄。记住这笔账：单个数据的波动看 σ，一批均值的波动看 σ 除以根号 n，混淆这两者，是读实验报告最常见的翻车点。
  derivation: original
  sources:
  - ref: openstax-stats
    locator: OpenStax《Introductory Statistics 2e》7.1 The Central Limit Theorem for Sample Means
    claim: 样本均值的抽样分布随样本量增大近似正态、均值等于总体均值；其标准差称为标准误，等于总体标准差除以根号 n
