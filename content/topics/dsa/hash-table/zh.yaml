steps:
- id: why
  title: 数组按下标一步直达，哈希表把这本事搬到名字上
  tldr: 数组按编号取值只需要 1 步，按名字翻名单却要从头扫到尾（100 万人平均看 50 万次）。哈希表干的事就是把名字也硬算成一个数组编号，让按名查表同样一步到位。
  body: |-
    先算笔账：如果 100 万名用户的成绩按普通数组排开，按名字查只能从第 0 号往后一个个核对——最坏比对 100 万次，平均也要 50 万次，这就是 O(n)。用户涨 10 倍，查找就慢 10 倍，亿级规模根本等不起。

    可要是反过来，你知道某个学生坐在 3 号位，数组取它却永远只要 1 步。因为 CPU 根本不用从头数，直接拿「数组起始地址 + 3 × 每个格子的字节数」就能一步跳到内存里。编译器按变量名找符号、数据库按用户名查记录，都被同一个需求逼急了：能不能像数组算地址那样，直接把字符串名字也算成格子编号？

    回到这节课的 8 桶成绩表（编号 0 到 7），现在要放 Alice、Bob 和 Carol。理想情况下三人算完各占一个桶，查谁都只要算一次位置加一次核对；麻烦只会在两个人不小心算进同一个桶时冒出来——哈希表后面所有的规矩，其实都是在收拾「撞桶」这件事。
