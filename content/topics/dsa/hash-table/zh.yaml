- id: open-addr
  title: 两条冲突路线的代价：拉链怕指针跳转，开放寻址删人要留[[墓碑]]
  tldr: 拉链法不会装满，但节点散在堆内存里指针跳来跳去；开放寻址把所有人挤进同一块连续数组，省指针又讨好 CPU 缓存，代价是删掉 Alice 时绝不能直接清空 3 号桶，必须留一块[[墓碑]]防止把后面的 Bob 找丢。
  body: |-
    先翻开拉链法的账本：链表想挂多长挂多长，永远不会因为没空桶而拒收。万一某一个桶真的太长，Java 8 的 [[HashMap]] 还留了一手兜底：当单条链达到 8 个节点且总桶数至少 64 时（两个条件同时满足），把这条链改装成[[红黑树]]，最坏查找压回 O(log n)；总桶数还不够 64 时它宁可先扩容，因为小表挂长链多半只是地方太小。拉链法真正的暗亏在硬件上：链表节点东一块西一块散在内存里，顺着链找人等于反复触发 [[CPU]] 缓存未命中。

    开放寻址（Python 的 dict 走的就是这套路子）反过来，所有元素都住在同一块连续数组里，顺着格子往后探往往命中同一条缓存行，极快。按画布第二行看 Alice 和 Bob 的下落：Alice 占住 3 号桶；Bob 也算到 3 号，发现有人了就往后探 1 步，在 4 号桶落脚。

    **等一下，现在假如 Alice 转学走了，直接把 3 号桶清空不行吗？** 绝对不行！照着画布第三行想象一下：如果 3 号桶变成真·空位，下回有人来查 Bob，算完哈希先看 3 号桶——迎面撞见一个空位，程序会以为「当年 Bob 如果来过，3 号空着肯定就住这了，不可能往后跑」，当场误报 Bob 不存在！所以删掉 Alice 只能把 3 号桶改成一块写着「已删除」的[[墓碑]]：查 Bob 时看见 3 号桶是墓碑就知道「这里以前住过人，继续往后找」，探到第 2 步就能在 4 号桶稳稳找回 Bob。墓碑的全部意义，就是替后面探出去的兄弟守住这条探测链不断。
  derivation: original
