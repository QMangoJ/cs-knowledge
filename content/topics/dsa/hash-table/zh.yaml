- id: consistent-hashing
  title: 引子：一致性哈希为什么要上环
  tldr: 机器增减时普通取模会让几乎所有键搬家；把映射放上圆环，只搬出事的那一段。
  body: '把哈希表放大到多台机器，普通取模会出大事：3 台机器时落点等于哈希值对 3 取余，增加一台变成对 4 取余，几乎所有键的落点都变了，缓存集体失效、数据全网搬家。问题不在哈希函数，而在桶数一变，整条映射规则就被重写了一遍。

    一致性哈希把映射拆成两跳：先把机器和键都哈希到同一个圆环上，键顺时针找到的第一台机器就是它的家。走例：把圆环展开成一条线，依次是机器 A、键 k1、机器 B、键 k2，再绕回 A。k1 顺时针先遇 B，归 B；k2 过了 B 继续走，绕回 A，归 A。现在 B 下线，只有原本归 B 的 k1 需要搬到 A，k2 纹丝不动——受影响的只有出事机器的那一段弧。

    这只是引子：它解决的是分布式缓存与分片里机器增减时的搬迁量问题，代价是分布均匀性变差，需要给每台机器放多个虚拟节点来抹平。本课的单机哈希表是它的地基：先理解取模的脆弱，才理解上环的价值。分布式缓存与 Dynamo 风格的存储都用了这条思路。'
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 11 散列函数
    claim: 散列函数把键映射到表槽，一致性哈希在此基础上把槽位组织成环以减少节点增减时的搬迁
