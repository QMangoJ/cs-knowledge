    event: "Alice 放好了：她的键算出的哈希值对 8 取余是 3，成绩放进桶 3，查找时照同样方法算一遍就能直达。"
  code:
    lang: typescript
    code: >-
      // 最小拉链法哈希表：key 先哈希到桶，桶内链表处理冲突

      class HashMap<K, V> {
        private buckets: [K, V][][] = Array.from({ length: 16 }, () => []);
        private hash(k: K) { let h = 0; const s = String(k); for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % this.buckets.length; }
        set(k: K, v: V) { const b = this.buckets[this.hash(k)]!; const e = b.find(([x]) => x === k); if (e) e[1] = v; else b.push([k, v]); }
        get(k: K) { return this.buckets[this.hash(k)]!.find(([x]) => x === k)?.[1]; }
      }
    note: TypeScript 实现
- id: hash-function-design
  title: 哈希函数设计：除法法与乘法法
  tldr: "落桶的最后一步是把大整数压缩进桶号范围，压缩方式直接决定分布质量。这一步比较除法法和乘法法两种经典压缩，拿相邻的键 21、22、23 算一遍，看它们被打散还是挤在一起。"
  body: >-
    哈希函数分两步：先把键算成整数（字符串逐字符累积），再压缩进 0 到 m−1 的桶号。压缩有两种经典做法。除法法：桶号等于哈希值对 m 取余，坑在 m 的选法——m 取 2 的幂时取余只保留低位比特，高位再随机也被扔掉；所以
    CLRS 建议 m 选远离 2 的幂的素数，让所有比特都参与。


    乘法法：取 0 到 1 之间的常数 A，算哈希值乘 A 的小数部分，再乘 m 向下取整。它对 m 不挑剔，m 可取 2 的幂方便位运算，主要看高位信息，与除法法互补。走例：m 取 8、A 取约 0.618，键 21 算得 21 乘
    0.618 约 12.978，小数 0.978 乘 8 得 7.82，落桶 7；键 22 算得约 13.596，小数 0.596 乘 8 得 4.76，落桶 4；键 23 落桶 1。相邻的键被打散，正是想要的效果。


    工程里更常见的是先用混合得足够好的整数哈希，再对 2 的幂取模，速度快且分布可接受，Java [[HashMap]] 走的就是这条折中路线。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 11 散列：除法法与乘法法
    claim: 除法法取余的表长宜选远离 2 的幂的素数，乘法法用常数的小数部分乘表长取整
