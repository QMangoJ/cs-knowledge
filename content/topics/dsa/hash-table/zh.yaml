level: 基础
minutes: 28
prereq: []
objectives:
- 解释哈希函数、冲突与负载因子的关系
- 对比拉链法与开放寻址的取舍
- 说清扩容为什么均摊是 O(1)
aiLink: 查表在 AI 管线里无处不在，但要分清三种：分词器把 token 映射到 id 是真正的哈希表（词表 dict）；embedding 层是拿 id 直接索引向量矩阵的行——同为 O(1) 查表，但没有哈希函数、没有冲突，不是哈希表；特征哈希（hashing trick）用哈希函数把特征直接定到列下标，是真哈希。理解冲突与扩容，就理解哈希类查表为什么平均 O(1)、最坏会退化。
design:
- mechanism: '负载因子决定平均链长与探查长度：链表法的平均链长约等于负载因子，开放寻址在均匀假设下不成功查找的期望探查约为 1 除以 (1 减负载因子)，两者都随负载上升而变陡，且越过约 0.7 后斜率明显放大。'
  problem: '表太空浪费内存，太挤则每次操作都要为冲突付账，而且越挤越容易继续变挤；实现需要一个在内存浪费与冲突代价之间自动平衡、无需人工盯着的触发点。'
  choice: '把阈值定在 0.7 到 0.75 一带（Java HashMap 默认 0.75，本课实验室用 0.7），越线就把桶数翻倍并全表再哈希，用偶尔一次线性的搬运换回低负载状态。'
  tradeoff: '阈值再低则扩容太频繁、内存利用率差；再高则长链与长探查成为常态。翻倍扩容还会带来一次延迟尖刺，延迟敏感的场景要预估容量、一次建够来躲开它。'
  root: '根源是概率曲线的形状：冲突不是随负载线性变坏，而是在高负载区加速恶化，所以阈值必须定在拐点之前；翻倍策略则让历次搬运总量被几何级数压住，均摊仍是常数。'
- mechanism: '带随机种子的哈希让哈希值由键与进程级随机种子共同决定：同一进程内结果稳定自洽，不同进程里同一键的落点不同，攻击者无法离线预计算出一批必然冲突的键。'
  problem: '确定性哈希是公开可算的，攻击者能批量构造同桶键，把平均 O(1) 强行打成 O(n) 的逐个比对，形成哈希洪水式的拒绝服务，而服务端事先无从分辨。'
  choice: '标准库改用带随机种子的哈希（如 SipHash），种子只存在于进程内存、每次启动重新生成；再叠加链长上限树化与单请求参数个数限制，做纵深防御。'
  tradeoff: '代价是跨进程不可复现：同一键在两个进程里的桶序不同，任何依赖哈希顺序的逻辑都会失效，线上问题也更难在本地按原样复现，调试要另留日志线索。'
  root: '根本矛盾是哈希函数既要确定以便查找自洽、又不能被对手预测；随机性把可预测性从函数里拆出来单独保管，只保留进程内的一致，对外则不可预测。'
- mechanism: '开放寻址把所有元素放进一个连续数组，探查沿数组顺序进行，缓存命中率天然高；链表法每个桶外挂节点，节点散落在堆上，沿链跳转就是逐次的指针追逐与缓存未命中。'
  problem: '冲突处理既要正确（删除不能截断别人的探查链），又要快（现代 CPU 上慢的主要原因常常是缓存未命中，而不是比较次数本身），两个目标经常互相拉扯。'
  choice: '开放寻址用墓碑保正确：删除只标记不清空，查找越过墓碑继续；链表法用直接摘链保正确，并以树化兜底最坏链长。两种实现各自选了与自身存储布局匹配的删除语义。'
  tradeoff: '墓碑会污染探查链，只能靠再哈希定期清理；链表法则付出指针内存与缓存代价。两种删除都不是免费的，只是把代价记在了不同的账本上，随场景对冲。'
  root: '根源在存储布局决定访问语义：连续数组里的空位本身是查找的终止信号，所以不能随便清空；链式结构里位置没有语义，删掉就真的消失，语义差异来自布局差异。'
quiz:
- q: 负载因子过高时哈希表变慢的原因？
  options:
  - 内存不足
  - 冲突变多，同一桶/探查链变长，平均查找步数上升
  - 哈希函数变慢
  - CPU 降频
  answer: 1
  explain: 负载因子 = 元素数/桶数；扩容阈值因实现而异，如 Java HashMap 是 0.75。
- q: 扩容时逐个把 n 个元素搬进新表，为什么插入的均摊复杂度还是 O(1)？
  options:
  - 因为搬运免费
  - 每次扩容容量翻倍，搬运成本被后面大量 O(1) 插入摊薄
  - 因为用了 GPU
  - 因为不真搬
  answer: 1
  explain: 几何级数求和：总搬运量 < 2n，分摊到 n 次插入是常数。
- q: 开放寻址法删除元素为什么不能简单置空？
  options:
  - 会变慢
  - 会截断后来元素的探查链，使它们查不到；要用墓碑标记
  - 会内存泄漏
  - 哈希值会变
  answer: 1
  explain: 探查链断了，后面依赖这条链的元素就找不到了，所以用 tombstone。
