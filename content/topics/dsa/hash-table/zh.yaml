title: 哈希表：冲突与扩容
summary: 哈希表干的其实就是一件事：用哈希函数把任意名字直接算成桶编号，让查找、插入和删除平均只需一步。天下没有白捡的快——无穷多样的名字挤进有限个桶里，碰撞早晚会发生，表填得越挤找得越慢。全课顺着三条线把这笔账算透：怎么把名字打散落桶、撞进同一个桶后是挂链表还是往后找空位、表变挤时为什么必须在 0.7 左右提前翻倍扩容。最后还会看清平均 O(1) 怎样被人故意塞满冲突键打塌，以及多机场景下为什么得把映射搬上圆环。
premise: 一份成绩单如果只是一张普通名单，按名字查 Alice 的分数就得从头一个个翻，人数一多根本翻不过来。能不能直接对着名字算一笔账，立刻算出她的成绩在几号桶，查的时候一步拿走？这一课就用一个只有 8 个桶的成绩表，把 Alice、Bob、Carol 等同学陆续放进去，看哈希表怎样靠名字直达位置，又会撞上什么麻烦。
position: 本课是数据结构与算法「按名与按序查找」板块的第一站，也是全科的起点。它先不管数据怎么排大小，而是直接回答最基础的查表问题：手头没有整数下标时，怎样靠一个名字就把数据放进对应桶里并一步取回。学完这里的碰撞处理与扩容节奏，下一课二分查找就会换一条相反的路——放弃把键打散，靠数组原本的顺序每次砍掉一半候选。
bridge:
  next: 哈希表为了按名字一步找人，把元素按哈希值打散放进各个桶里，原本的大小顺序全都丢了。如果手头的数据刚好已经排好序，下一课二分查找就走另一条路——不打散、不建桶，只靠看一眼中间元素就每次排除掉一半候选。
overview:
- key: 一句话总结
  value: 用哈希函数把键直接算成桶下标，平均 [[O(1)|大 O 记号]] 完成查找、插入和删除。查的时候不用从头翻，把键再算一遍就知道该去哪个桶拿，前提是冲突不能太多。
- key: 冲突
  value: 不同的键算出同一个桶号，这件事早晚会发生。因为可能的名字有无数个，桶的数量却有限，鸽子多笼子少，总有两个键会撞进同一个桶，只能想办法安顿它们，而不是指望不撞车。
- key: 负载因子
  value: "[[负载因子]]就是已存元素数除以桶数，衡量表有多挤；Java [[HashMap]] 默认一过 0.75 就扩容。比如 8 个桶装到 6 个元素就已经压线，再往里硬塞冲突会急剧增多，先翻倍扩容再继续装才划算。"
- key: 工程里
  value: JS 的 Map 和 Object、Python 的 dict、Redis 哈希结构、数据库哈希索引，底层都跑着同一套思路：靠哈希函数直接定位，再配一套冲突处理和扩容机制。
- key: Big-O 直觉
  value: O(1) 说的是平均耗时不随数据量涨：表里从 1000 条涨到 100 万条，平均还是算一次就找到；最坏情况是所有键全撞进同一个桶，查找当场退化成在一条长链里从头翻的 O(n)。
- key: 复杂度
  value: 查找、插入、删除平均都是 O(1)，最坏 O(n)；翻倍扩容那一次虽然要搬动全部元素，但它越来越难触发，把搬运成本均摊到每次插入上仍旧是 O(1)。
- key: 好的哈希函数
  value: 必须守住三条线：同一键每次算出的结果一模一样（否则存完就找不到）、把键尽量均匀分散到各个桶、算起来足够快。
- key: 开放寻址
  value: "[[开放寻址]]不挂链表，而是用[[线性探测]]等办法顺着数组往后找空桶。删除时不能直接清空，否则会截断后面元素的探测链，让它们再也找不到，必须留一个[[墓碑]]标记占着位。"
- key: 安全
  value: "[[哈希洪水攻击]]就是攻击者故意造出大量互相冲突的键塞给服务器，把哈希表拖慢到 O(n)；防御办法是给哈希加上进程启动时随机生成的种子（如 [[SipHash]]），让对手离线算好的冲突键当场失效。"
- key: 哈希集合
  value: 哈希集合只存键不存值，专门用来去重和判存在，JS 的 Set 就是它。把日志里的用户 ID 丢进集合，重复的自动只留一份，查某个 ID 来过没有也是一步到位。
