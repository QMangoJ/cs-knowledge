- id: hash
  title: 哈希函数：把键变成位置
  tldr: 哈希函数把任意键算成一个数字，再对桶数取余，得到放在哪个桶。
  body: '比如把 Alice 按字符逐个累积算成一个大整数 63350371，再除以桶数 8 取余，63350371 除以 8 余 3，得到桶 3，就把她的成绩放进桶 3。查找时用完全相同的方法再算一次，直接去桶 3 拿，不用逐个比对。

    好的哈希函数有三条硬要求：第一，同一个键每次必须算出同一个结果，否则存进去就再也找不到；第二，分布均匀，相近的键如 user1001 与 user1002 不能扎堆到同一个桶；第三，算得快，因为每次操作都要先付这笔钱。

    一个常见误解是以为取余可有可无：哈希值可以是几十亿，而桶只有 8 个，不取余根本没有地方放。取余还有一层副作用：它只保留一部分比特信息，所以哈希函数各位比特要充分混合，否则规律性的键会成片冲突，这一点下一节讲哈希函数设计时展开。'
  derivation: original
  sources:
  - ref: mit-6006
    locator: Hashing 相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
