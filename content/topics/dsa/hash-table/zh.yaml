- id: clustering
  title: "[[开放寻址]]的聚集：为什么表越挤，探测长度飙得越快"
  tldr: 顺着往后找空位的线性探测有个滚雪球毛病：连续占满的一排桶会像磁铁一样吸住新键、越滚越长。当负载因子从 0.5 爬到 0.9，不成功查找的期望探测次数会从约 2 次一路飙到约 10 次，所以开放寻址必须在 0.7 左右踩刹车扩容。
  body: |-
    用[[线性探测]]（被占就顺着加 1 往下找）时，表里会自发长出一种滚雪球现象，叫一次聚集。看画布里的 2 到 6 号桶，一旦这 5 个位置连成一整段，接下来新来的同学不管是算到 2、3、4、5 还是 6 号，都会被一路推到尾巴上的 7 号桶才停住。连成一片的段越长，接住新键的概率就越大，结果长的更长、空的永远空着。

    拿数字感受这条曲线有多陡：在均匀哈希假设下，[[CLRS]] 算出的不成功查找期望探测次数约为 `1 / (1 − 负载因子)`。表装到一半（0.5）时平均只需探 2 次；装到 0.75 时翻倍成 4 次；冲到 0.9 时一下子飙到 10 次——越逼近 1 涨得越疯。这正是开放寻址普遍把[[负载因子]]压在 0.7 上下的原因：再往后拐点就立起来了。

    想拆散这堵车阵，可以把步子迈开：[[二次探测]]改按 1²、2²、3² 的步长跳出堵点，[[双重哈希]]则用第二个哈希函数给不同键算出不同步长。但只要表快满了、空桶本来就所剩无几，怎么跳都救不了——唯一的铁律还是提前扩容。
  derivation: original
