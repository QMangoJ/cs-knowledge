- id: clustering
  title: 开放寻址的聚集：探查为什么越挤越慢
  tldr: 连续占用段会自我放大；负载因子约 0.9 时探查次数涨到约 10 次。
  body: '开放寻址有一个会自我放大的毛病，叫一次聚集：某一段连续桶被占满之后，新元素只要哈希进这一段的任何位置，都会被推到段尾，段就变得更长；段越长，被命中的概率越大，长得越快。就像停车场里连成片的车位会越停越满，空着的段却一直空着。这也是线性探测最被诟病的一点。

    定量地看：CLRS 在均匀哈希假设下分析，不成功查找的期望探查次数约为 1 除以 (1 减负载因子)。负载因子 0.5 时约 2 次，还很轻松；0.75 时约 4 次；到 0.9 时涨到约 10 次；越接近 1 发散得越快。这就是开放寻址实现通常把负载因子压在 0.7 上下的原因：不是装不下，而是探查长度的曲线在这里开始明显变陡。

    缓解办法是换探测方式：二次探测让步长越走越大，跳出已占的段；双重哈希用第二个哈希函数算步长，不同键步长不同，不容易排成一串。但它们只缓解不根除：只要负载逼近 1，任何开放寻址都会慢下来。所以真正的纪律是提前扩容，而不是指望换一种更聪明的探测把高负载撑过去。'
  derivation: original
  sources:
