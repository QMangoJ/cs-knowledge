    event: "Alice 放好了：她的键算出的哈希值对 8 取余是 3，成绩放进桶 3，查找时照同样方法算一遍就能直达。"
  code:
    lang: typescript
    code: >-
      // 最小拉链法哈希表：key 先哈希到桶，桶内链表处理冲突

      class HashMap<K, V> {
        private buckets: [K, V][][] = Array.from({ length: 16 }, () => []);
        private hash(k: K) { let h = 0; const s = String(k); for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % this.buckets.length; }
        set(k: K, v: V) { const b = this.buckets[this.hash(k)]!; const e = b.find(([x]) => x === k); if (e) e[1] = v; else b.push([k, v]); }
        get(k: K) { return this.buckets[this.hash(k)]!.find(([x]) => x === k)?.[1]; }
      }
    note: TypeScript 实现
- id: hash-function-design
  title: 压缩进桶号：除法取余避开 2 的幂，乘法取小数读高位
  tldr: 把整数哈希压进 0 到 m−1 的桶号时，直接对 2 的幂取余会丢光高位信息，相邻的键全粘在相邻桶里。要么像除法法挑远离 2 的幂的素数当桶数，要么改用乘法法把高位混进小数部分再取整。
  body: |-
    先把名字搁一边，拿三个连号学号 `21、22、23` 专门盯死「大整数压缩进桶号」这最后一跳。用最直接的除法法（`键 % m`）时，如果桶数 `m` 刚好取 `8`（也就是 2 的 3 次方），取余只看最低 3 个比特，高位再怎么随机全被一刀砍掉：画布第一行里 `21 % 8 = 5`、`22 % 8 = 6`、`23 % 8 = 7`，相邻学号还是挨着排；遇到间隔 8 的学号更会集体撞进同一个桶。所以 [[CLRS]] 建议除法法的桶数 `m` 选远离 2 的幂的素数，逼着所有比特都参与运算。

    可很多工程实现偏偏想要 2 的幂当桶数，因为翻倍扩容和位掩码实在太快——这时就轮到乘法法出场。挑一个 0 到 1 之间的常数 `A`（经典取黄金分割小数约 `0.618`），算 `键 × A` 后只留小数部分，再乘上桶数 `m` 向下取整。照画布第二行对 `m = 8` 走一遍数字：`21 × 0.618 ≈ 12.978`，小数 `0.978 × 8 = 7.82` 落进桶 7；`22 × 0.618 ≈ 13.596`，小数 `0.596 × 8 = 4.76` 落进桶 4；`23` 则落进桶 1。连号学号被彻底打散到 `7、4、1`，因为乘法把高位也揉进了小数里。

    真实工程往往折中这两条路：桶数依然用 2 的幂图个位运算顺手，但在取模前先把高半截比特右移异或进低位（Java [[HashMap]] 就这么干），让高位低位都有投票权。
