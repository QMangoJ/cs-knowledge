- id: consistent-hashing
  title: "引子：[[一致性哈希]]为什么要把映射弯成环"
  tldr: 把哈希表拆到多台缓存机器上时，多加一台机器会让普通取模改写整张映射规则，几乎所有数据跟着大搬家。把机器和键一起哈希到同一个圆环上、顺时针找最近的那台机器，就能把节点上下线的影响锁死在它负责的那一小段弧里。
  body: |-
    假如成绩表大到一台机器装不下，拆到 3 台缓存服务器上，原本靠 `hash(名字) % 3` 决定存哪台。现在流量暴涨，需要加第 4 台服务器，算式一夜之间变成 `% 4`——随便找个哈希值 `10` 来试：`10 % 3 = 1`、`10 % 4 = 2`，几乎所有键的余数同时变卦，缓存集体失效、全网数据大搬家。错不在哈希函数，而在直接拿机器台数当除数。

    [[一致性哈希]]改用圆环解绑这件事：把机器编号和键一起哈希到同一个圆环上，每个键从自己的位置顺时针往前走，遇见的头一台机器就是它的家。把画布里的圆环拉直看一遍：`机器A（位置 0）→ k1 → 机器B（位置 4）→ k2 → 绕回 A`。`k1` 顺时针先碰到 B，就归 B 管；`k2` 过了 B 绕一圈回到 A，就归 A 管。现在就算 `机器B` 突然下线，只有原本归 B 的 `k1` 需要顺延交给 A，`k2` 原封不动。

    这就是分布式缓存和 [[Dynamo]] 一类存储系统应付机器增删的绝招：出事只搬坏掉那台机器前面的一段弧。不过现实里机器如果只有几台，随机落点可能很不均匀（有的机器管大半圈），工程上会给每台物理机在环上多放几十上百个[[虚拟节点]]，把负载再抹平。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 11 散列函数
    claim: 散列函数把键映射到表槽，一致性哈希在此基础上把槽位组织成环以减少节点增减时的搬迁
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: 圆环展开：k1 顺时针归 B，k2 绕回归 A；B 下线时只有 k1 要搬
    rows:
    - label: 环（展开）
      cells:
      - v: 机器A
        mark: active
        sub: 位置0
      - v: ""
        sub: ""
      - v: k1
        mark: new
        sub: 归B
      - v: ""
        sub: ""
      - v: 机器B
        mark: active
        sub: 位置4
      - v: ""
        sub: ""
      - v: k2
        sub: 归A
      - v: ""
        sub: 绕回A
      pointers:
      - at: 2
        label: 顺时针先遇 B
      - at: 6
        label: 过 B 后绕回 A
    aux:
    - label: 对比
      items:
      - 取模：加一台机器，几乎全搬
      - 上环：只搬出事的那一段
  log:
  - mode: 扩展
    event: "哈希从单机走到了多机：映射放上圆环之后，机器增减只影响出事的那一段弧。"
- id: engineering
  title: 工程里的哈希表与收尾三问：精准点查的天花板，顺序查询的禁区
  tldr: JS 的 Map/Object、Python 的 dict 底层都是哈希表，但按插入顺序遍历是语言规范额外补的，哈希表本身并不保序、也答不了范围查询。把哈希表写进业务前，过一遍「键会变吗、要范围吗、怕卡顿吗」这三问就不会踩坑。
  body: |-
    日常写 JS 用 `new Map()` 做缓存、去重、计数，底层用的就是哈希表——算一次哈希直奔 3 号桶拿到 Alice 的成绩。有两个细节最常绊倒人：第一，用普通 `Object` 当字典时所有键都会被偷偷转成字符串（`obj[1]` 和 `obj["1"]` 会撞成同一个），而 `Map` 会保留键原本的类型；第二，JS 的 `Map` 能按插入顺序遍历，那是语言规范额外附带的功能，不是哈希表天生的本事。

    更凶险的一个 bug 是「进表之后还改键」：在 JS 里用对象当 `Map` 的键时比的是内存引用，两个长得一模一样的对象字面量 `{}` 算出来其实是两个键；而在允许自定义哈希字段的语言里，如果一个对象放进表后被人改了参与算哈希的属性，下次去查时会算出一个完全不同的桶号，原本那条记录就永远困死在旧桶里再也找不回来。另外记住：哈希表不管排序也答不了「大于 80 分的有几个人」这类范围问题——只要沾上排序或区间，果断换平衡树或[[跳表]]；拿它当内存缓存时也要记得自己补淘汰策略，哈希表只管存取不管过期。

    临走前带走这套**选型与排坑三问**：① **键会变吗？**（字符串、不可变 ID 最稳妥；入表后可能改内容的字段绝不拿来算哈希）② **要按顺序或范围查吗？**（只做精确点查用哈希表，要找相邻项或区间计数换平衡树）③ **怕不怕突发尖刺或洪水攻击？**（外部请求当键要确认底层有 SipHash 类随机种子，延迟敏感的服务在建表时就把容量一次开够）。
  derivation: original
  sources:
  - ref: mit-6006
    locator: Hashing 相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: 哈希表适合精确查找，不支持有序操作
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
  canvas:
    kind: datastate
    structure: array
    caption: map.get("Alice")：算一次哈希，直接到桶 3
    rows:
    - label: 桶
      cells:
      - v: ""
        sub: "0"
      - v: ""
        sub: "1"
      - v: ""
        sub: "2"
      - v: Alice
        mark: found
        sub: "3"
      - v: ""
        sub: "4"
      - v: ""
        sub: "5"
      - v: Carol
        sub: "6"
      - v: ""
        sub: "7"
      pointers:
      - at: 3
        label: get
    aux:
    - label: JS
      items:
      - new Map()
      - map.set(k, v)
      - map.get(k)
  log:
  - mode: 查找
    event: "日常用法收口为一句：按键一步取到值靠的是哈希表，需要顺序和范围时要换平衡树或跳表。"
level: 基础
minutes: 28
prereq: []
objectives:
- 解释哈希函数、冲突与负载因子的关系
- 对比拉链法与开放寻址的取舍
- 说清扩容为什么均摊是 O(1)
aiLink: AI 管线里到处都在查表，但只有一种是真的哈希表：分词器把词（token）转成数字 ID 靠词表字典，这是真哈希表；特征哈希（hashing trick）直接拿哈希函数把海量稀疏特征压进固定列下标，也是真哈希；而模型里的 embedding 层虽然同样 O(1) 取一行向量，靠的是拿数字 ID 直接当行号索引数组，中间没有哈希函数也没有冲突，千万别混为一谈。
design:
- mechanism: 负载因子一越过 0.7–0.75 就翻倍再哈希
  problem: 表太松浪费内存，太挤则探测链和链表急剧拉长——开放寻址过了 0.7 探测曲线会突然翘头，不提前拦截每次查表都要为堵车买单。
  choice: 盯住「已存元素（开放寻址还要算上墓碑）÷ 桶数」这条线，一过阈值（Java HashMap 用 0.75，本课实验用 0.7）就把桶数翻倍，全表重算位置搬家。
  tradeoff: 阈值设低了省冲突但费内存，设高了省内存但撞车多；而且翻倍搬家那一下会制造一次延迟尖刺，怕卡顿的业务要么提前开够容量，要么改成渐进式搬迁。
  root: 冲突不是线性变慢、而是在高负载区急剧恶化，所以阈值必须卡在拐点前；每次翻倍让历次搬运总量被几何级数压在 2n 以内，均摊下来每次插入还是 O(1)。
- mechanism: 哈希计算偷偷拌入进程级随机种子
  problem: 公开固定的哈希算式谁都能离线跑，攻击者只要算出一万个同桶参数塞进请求，就能把服务端哈希表当场拖死成 O(n) 链式扫描。
  choice: 像 Python、Rust 标准库改用 SipHash 这类带密钥的哈希，进程启动时随机生成种子只留在自己内存里，再叠加上限树化和请求参数个数封顶。
  tradeoff: 同一个键每次重启进程落进的桶顺序都不一样，靠遍历顺序写死测试或线上复现 bug 会变麻烦，得靠日志记录排查线索。
  root: 哈希函数平时既要「对内确定」方便查到自己，又要「对外不可猜」防住对手——把随机性单独放进进程种子，刚好把这两件事拆开解决。
- mechanism: 开放寻址用墓碑保探测链，拉链法直接摘节点
  problem: 现代 CPU 慢往往慢在跳指针等内存而不是多比一次数，开放寻址把数据铺在连续数组里换来极好的缓存命中，可一旦删人就可能截断后面元素的寻路线索。
  choice: 开放寻址删元素时留一块墓碑标记，查找路过继续探、新插入优先覆写；拉链法直接改指针把节点摘掉，链长超限再转红黑树兜底。
  tradeoff: 墓碑攒多了照样拖慢查找、非得等下次再哈希才能扫净；拉链法删得干净，却要为每个节点多付指针内存和缓存未命中的账。
  root: 物理摆放方式决定了删除的规矩：连续数组里「空桶」自带「后面肯定没找头了」的语义，所以删掉不能真置空；链表节点之间全靠指针认亲，摘掉一个就干干净净消失了。
quiz:
- q: 负载因子过高时哈希表变慢的原因？
  options:
  - 内存不足
  - 冲突变多，同一桶/探查链变长，平均查找步数上升
  - 哈希函数变慢
  - CPU 降频
  answer: 1
  explain: 负载因子 = 元素数/桶数；扩容阈值因实现而异，如 Java HashMap 是 0.75。
- q: 扩容时逐个把 n 个元素搬进新表，为什么插入的均摊复杂度还是 O(1)？
  options:
  - 因为搬运免费
  - 每次扩容容量翻倍，搬运成本被后面大量 O(1) 插入摊薄
  - 因为用了 GPU
  - 因为不真搬
  answer: 1
  explain: 几何级数求和：总搬运量 < 2n，分摊到 n 次插入是常数。
- q: 开放寻址法删除元素为什么不能简单置空？
  options:
  - 会变慢
  - 会截断后来元素的探查链，使它们查不到；要用墓碑标记
  - 会内存泄漏
  - 哈希值会变
  answer: 1
  explain: 探查链断了，后面依赖这条链的元素就找不到了，所以用 tombstone。
