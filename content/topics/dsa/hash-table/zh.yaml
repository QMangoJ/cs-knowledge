- id: resize
  title: 负载因子与扩容
  tldr: 表越满冲突越多，所以元素多到一定比例，就换一张更大的表。
  body: '负载因子 = 元素个数 ÷ 桶数，它衡量表有多挤。8 个桶装 7 个元素时负载因子约 0.88，平均每条链接近 1 个元素还不算糟，但再往里塞，链长和探查长度都会加速上升，所以要在失控之前扩容。

    超过阈值（例如 Java HashMap 的 0.75）时，常见做法是把桶数翻倍，再把所有元素按新桶数重新算位置放进去，这一步叫再哈希，旧位置全部作废。单次扩容要搬全部元素，看起来很贵，但它很少发生。

    数字例子：从 16 个桶开始、阈值 0.75，插入 100 万个元素共扩容约 17 次，总搬运量约 157 万次，小于 2n。把总搬运量摊到 100 万次插入上，每次不到 2 次搬运，所以插入的均摊复杂度仍是 O(1)。这与动态数组 push 的均摊 O(1) 是同一个几何级数道理：每次翻倍，搬运总量被最后一项主导。

    注意均摊不等于每次都快：恰好触发扩容的那一次插入要搬 n 个元素，延迟会出现一个尖刺。对延迟敏感的系统要么按预估容量一次建够，要么接受这个尖刺——理解均摊，才能提前做这种取舍。'
  derivation: original
  sources:
