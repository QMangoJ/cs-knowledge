- id: open-addr
  title: 两种处理冲突的方式各有什么代价
  tldr: 链表法简单、能装超过桶数的元素；开放寻址更省内存、缓存更友好，但删除麻烦。
  body: '链表法：表很挤时链会变长，但不会“装满”；Java 8 的 HashMap 在一个桶的链长达到 8 且表容量至少 64 时（两个条件都满足），还会把那条链变成红黑树（容量不够时优先扩容）。

    开放寻址：所有元素都在一个连续数组里，顺着往后找对 CPU 缓存很友好，Python dict 就用这种思路。

    但开放寻址删除时不能直接清空格子，否则后面的元素就找不到了，要留一个“已删除”标记。'
  derivation: original
  sources:
  - ref: mit-6006
    locator: Hashing 相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: 链表法简单、能装超过桶数的元素；开放寻址更省内存、缓存更友好，但删除麻烦。
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
