- id: resize
  title: "[[负载因子]]与扩容"
  tldr: "探查变长的根源是表太挤。这一步看负载因子这把尺子：元素个数和桶数的比值冲过阈值就扩容。拿从 16 个桶开始装 100 万个元素算一遍总搬运量，看单次很贵的扩容摊到每次插入上为什么仍然便宜。"
  body: >-
    负载因子 = 元素个数 ÷ 桶数，衡量表有多挤。8 个桶装 7 个元素时约 0.88，再往里塞，链长和探查长度都会加速上升，所以要在失控之前扩容。


    超过阈值（例如 Java [[HashMap]] 的 0.75）时，把桶数翻倍，再把所有元素按新桶数重新算位置放进去，这一步叫[[再哈希]]，旧位置全部作废。单次扩容要搬全部元素，看起来贵，但它很少发生。


    数字例子：从 16 个桶开始、阈值 0.75，插入 100 万个元素共扩容约 17 次，总搬运量约 157 万次，小于 2n；摊到每次插入不到 2 次搬运，均摊复杂度仍是 [[O(1)|大 O 记号]]。这与动态数组 push 的均摊 O(1)
    是同一个几何级数道理：每次翻倍，搬运总量被最后一项主导。


    均摊不等于每次都快：触发扩容的那一次插入要搬 n 个元素，延迟会出现尖刺。延迟敏感的系统要么按预估容量一次建够，要么接受尖刺。
  derivation: original
  sources:
  - ref: mit-6006
    locator: Hashing / 动态数组相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
