- id: chaining-delete
  title: 删除的两种命运：链上摘除与[[墓碑]]积累
  tldr: "上一歩提到删除是两种路线的分水岭，这一步专门算这笔账：链表法删完当场摘除、不留痕迹；[[开放寻址]]只能留墓碑，墓碑攒多了探查会变长。最后看墓碑攒到什么程度，就必须整表[[再哈希]]清理一次。"
  body: >-
    链表法删一个元素，就是在链上找到它、把前驱指针接到后继，当场摘除：链变短，后续查找只会更快。墓碑问题在链表法里根本不存在。


    开放寻址则相反：删掉的位置只能留墓碑，表里混着真空位与墓碑。查找遇到墓碑继续探，遇到真空位才停；插入可复用遇到的第一个墓碑。墓碑只增不减，反复插入删除后，一张只装了一半元素的表探查也可能很长。


    走例：桶 3 是墓碑、桶 4 是 Bob、桶 5 是空位。查一个不存在且哈希到 3 的键，要连过墓碑与 Bob 两格，到桶 5
    才敢下结论。解法是把墓碑也计入负载：活元素与墓碑之和超过阈值就再哈希到一张干净的表，清掉全部墓碑——扩容也是给探查链做大扫除。
  derivation: original
