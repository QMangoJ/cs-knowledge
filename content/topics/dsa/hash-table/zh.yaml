- id: chaining-delete
  title: 删除的两种命运：拉链法当场摘除，开放寻址靠[[再哈希]]清墓碑
  tldr: 删掉 Alice 之后，拉链法把链条一接、表立刻变短变快；开放寻址却要在 3 号桶留下一块只增不减的墓碑，删多插多之后表哪怕只剩一半活元素照样慢如蜗牛，只能把墓碑算进负载、在下次再哈希时一次扫光。
  body: |-
    在拉链法里删掉 Alice，过程干脆利落：顺着 3 号桶找到她，把前一个指针直接改指到 Bob，Alice 当场从链上摘掉，Bob 直接顶上 3 号桶第一名。链条变短了，之后所有查找只会更快，没有任何遗留垃圾。

    开放寻址的成绩表就截然相反：Alice 走了，3 号桶变成墓碑，4 号桶是 Bob，5 号桶才是真空位。现在来查一个不存在、却正好也算到 3 号桶的新名字：程序得先跨过 3 号桶的墓碑，再核对 4 号桶的 Bob 不是它，一路摸到 5 号的真空位才敢停下宣告「查无此人」。新插入元素虽然能覆盖掉路上遇见的第一个墓碑，但只要反复增删，墓碑还是会越攒越多——表里明明只存了一半活人，探测链却长得像装满了 90%。

    解法很务实：别只拿活元素算挤不挤，把「活元素 + 墓碑」加在一起计入负载！只要这笔总账冲过阈值，就整表做一次[[再哈希]]搬进干净的新桶数组，所有墓碑在搬家那一刻原地消失。对开放寻址来说，扩容同时就是给探测链做一次大扫除。
  derivation: original
