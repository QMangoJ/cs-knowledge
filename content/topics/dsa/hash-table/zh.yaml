- id: collision
  title: 冲突：两个键挤进同一个桶
  tldr: "函数和落桶都会了，麻烦随之而来：Bob 算完也落进桶 3。这一步先说清冲突为什么是数学必然、躲不掉，再看安顿冲突的两条路——挂成链表、往后找空桶——各自怎么走。"
  body: >-
    Bob 也被算到了桶 3，这就是冲突。冲突不是实现失误，而是数学必然：键的取值有无穷多，桶只有 8 个，按抽屉原理，只要键比桶多，就一定有不同的键落进同一个桶。


    处理有两条路：一是链表法（[[拉链法]]），每个桶挂一串，冲突元素排在一起，查找先定位桶、再沿链比对；二是[[开放寻址]]，桶被占了就按规则找下一个空桶。


    走例：桶 3 里 Alice 在前、Bob 在后，查 Bob 要比对两次；查一个同样落到桶 3 却不存在的键，要比对完整条链才能下结论。大量键挤在同一个桶，链长从 1 涨到 n，查找就退化成链表比对，[[O(1)|大 O 记号]]
    当场破产。哈希表快不快，一大半取决于冲突处理，而不是哈希函数算得多快。
  derivation: original
  sources:
  - ref: mit-6006
    locator: Hashing 相关讲义，冲突处理
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: 通过链接或开放寻址解决冲突
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
