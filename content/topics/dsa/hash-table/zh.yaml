- id: resize
  title: 负载因子与扩容
  tldr: 表越满冲突越多，所以元素多到一定比例，就换一张更大的表。
  body: '负载因子 = 元素个数 ÷ 桶数，它衡量表有多挤。

    超过阈值（例如 0.75）时，常见做法是把桶数翻倍，再把所有元素重新算位置放进去。

    单次扩容要搬全部元素，但它很少发生，平均摊到每次插入上仍是 O(1)，这叫“均摊”。


    数字例子：从 16 个桶开始、负载因子 0.75 扩容，插入 100 万个元素共扩容约 17 次，总搬运量约 157 万次（<2n）——每次插入均摊仍是常数。这与动态数组 push 的均摊 O(1) 是同一个几何级数道理。'
  derivation: original
  sources:
  - ref: mit-6006
    locator: Hashing / 动态数组相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: 表大小翻倍使插入的均摊代价为 O(1)
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
