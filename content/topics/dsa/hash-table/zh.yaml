title: 哈希表：冲突与扩容
summary: 按“名字”直接找到东西，平均只要一步。代价是要处理冲突，并在变挤时扩容。
premise: 以一个 8 个桶的表存放几位同学的成绩为例。
overview:
- key: 一句话总结
  value: 用哈希函数把键变成位置，平均 O(1) 查找、插入、删除
- key: 冲突
  value: 不同的键算出同一个位置，必然会发生
- key: 负载因子
  value: 已存元素 ÷ 桶数；太高就扩容（Java HashMap 默认阈值 0.75）
- key: 工程里
  value: JS 的 Map / Object、Python dict、Redis、数据库哈希索引
- key: Big-O 直觉
  value: O(1) 指耗时不随数据量增长；最坏情况（全部冲突）会退化到 O(n)
- key: 复杂度
  value: 平均 O(1)，最坏 O(n)；扩容均摊 O(1)
- key: 好的哈希函数
  value: 快、分布均匀；相等的键必须得到相同的哈希
- key: 开放寻址
  value: 线性探测等；删除需留墓碑标记
- key: 安全
  value: 哈希洪水攻击，防御用随机种子哈希（SipHash）
- key: 哈希集合
  value: 只存键不存值，用来去重（JS 的 Set）
