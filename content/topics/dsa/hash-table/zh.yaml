- id: open-addr
  title: 两种处理冲突的方式各有什么代价
  tldr: "冲突有两条安顿路线，这一步把它们的代价摆在一起算：链表法能一直往后挂，[[开放寻址]]更省内存、又对缓存友好。用 Alice 和 Bob 的落桶过程算一遍，再看删除时为什么开放寻址必须留[[墓碑]]。"
  body: >-
    链表法：链可以一直往后挂，不会装满；Java 8 的 [[HashMap]] 在一个桶的链长达到 8 且表容量至少 64 时（两条件同时满足），会把那条链变成红黑树，把最坏查找压回 O(log n)；容量不够 64
    时优先扩容，因为小表长链多半是容量不足，而不是哈希函数太差。


    开放寻址：所有元素都在一个连续数组里，冲突时顺着找空位，对 [[CPU]] 缓存友好，Python dict
    就用这种思路。代价是装得太满时探查链急剧变长，而且删除不能直接清空格子，否则后面的元素会在查找时提前遇到空位、被误判不存在，所以要留已删除标记（墓碑）。


    算账：Alice 占桶 3，Bob 探测 1 次落到桶 4；删 Alice 留墓碑后查 Bob，先看桶 3 是墓碑继续往后，第 2 次探测在桶 4 找到。若直接清空桶 3，查 Bob 第 1
    步就撞到空位停下，误报不存在——墓碑的全部理由就是保住探查链的连续性。
  derivation: original
  sources:
  - ref: mit-6006
    locator: Hashing 相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: 链表法简单、能装超过桶数的元素；开放寻址更省内存、缓存更友好，但删除麻烦。
