- id: hash
  title: 哈希函数：先把名字算成大整数，再对桶数取余落桶
  tldr: 把名字变成 0 到 7 的桶号只需两步：哈希函数先把字符串揉成一个大整数，再除以桶数 8 取余。它必须满足三条硬杠：同一个人永远落进同一桶、不同人尽量铺开、而且算得够快。
  body: |-
    等一下，为什么不直接一步算出 0 到 7，非要先拐弯算成一个动辄几十亿的大整数？因为哈希函数压根不知道你的表今天有 8 个桶还是明天扩成 8000 个桶。通用做法是像右侧代码那样逐字符滚雪球，先稳稳把 `"Alice"` 算成一个无符号大整数 `63350371`，最后才对当前桶数 8 取余：`63350371 % 8 = 3`，于是 Alice 的成绩落进 3 号桶。下次查 Alice，照着同一套算式再跑一遍，直接去 3 号桶拿人。

    别小看最后那步取余：表只有 8 个桶时，对 8 取余本质上只看那个大整数二进制的最低 3 位，高位全被丢掉了。如果前面没有把每个字符的信息充分揉匀，长得像 `user1001` 和 `user1002` 这样只差一位的键就极容易成片挤进同一个桶。

    这直接定下了好哈希函数的三条底线：第一必须确定，Alice 这回算 3、下回还必须是 3，否则刚存进去转头就找不着；第二分布要均匀，相似的键不能扎堆；第三算得必须快，因为每一次 get 和 set 都得先过它这一关。
  derivation: original
  sources:
