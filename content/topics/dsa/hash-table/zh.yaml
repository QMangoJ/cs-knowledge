- id: chaining-delete
  title: 删除的两种命运：链上摘除与墓碑积累
  tldr: 链表法删除是当场摘除、不留痕迹；开放寻址只能留墓碑，还要定期清理。
  body: '同样是删除，链表法和开放寻址的难度天差地别。链表法删一个元素，就是在桶对应的链上找到它、把前驱的指针接到它的后继上，当场摘除，不留任何痕迹：链变短，后续查找只会更快。前面讲的墓碑问题，在链表法里根本不存在。

    开放寻址则相反：删掉的位置只能留墓碑顶替，表里会同时混着真空位与墓碑。查找遇到墓碑要继续往后探，遇到真空位才停；插入可以复用途中遇到的第一个墓碑位置。麻烦在于墓碑只增不减：反复插入删除之后，一张只装了一半元素的表，探查也可能要走很长，因为路上全是墓碑。

    走例：桶 3 是墓碑、桶 4 是 Bob、桶 5 是空位。查一个不存在且哈希到 3 的键，要连过墓碑与 Bob 两格，到桶 5 才敢下结论不存在，这两次无效探测全是墓碑欠的债。工程上的解法是把墓碑也计入负载：活元素与墓碑之和超过阈值就再哈希到一张干净的表，顺带把墓碑全部清掉——扩容不只是为了装更多，也是为了给探查链做大扫除。'
  derivation: original
  sources:
