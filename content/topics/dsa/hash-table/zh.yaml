- id: engineering
  title: 工程里的哈希表
  tldr: JS 的 Map 和 Object、Python 的 dict 都是哈希表的思路。
  body: '在 JS 里用 Map 做缓存、去重、计数，就是在用哈希表；Map 还按插入顺序遍历，这是语言规范保证的，不是哈希表天生的性质。

    哈希表不保证按大小有序，需要“找最接近的值”或范围查询时，要用有序结构。

    键要能稳定地算出哈希：用对象当 Map 的键，比较的是引用，不是内容。


    工程注记：把用户 id、session、请求结果做内存缓存时，记得给负载因子留阈值并监控最长链——哈希表退化成链表的事故（被构造 key 的哈希洪水）真实发生过，语言标准库为此引入了随机种子哈希。'
  derivation: original
  sources:
  - ref: mit-6006
    locator: Hashing 相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: 哈希表适合精确查找，不支持有序操作
