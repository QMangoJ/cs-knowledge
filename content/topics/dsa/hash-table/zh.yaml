- id: resize
  title: "[[负载因子]]与扩容：翻倍搬家看似贵，均摊下来每次不到 2 步"
  tldr: 当元素数除以桶数冲过阈值（如 Java HashMap 的 0.75），就把桶数翻倍并把所有元素重新算位置搬进新表。单看这一回搬家要动全表 n 个元素，但由于每次翻倍让下次扩容越来越远，装 100 万个元素摊下来每次插入还不到 2 次搬运。
  body: |-
    我们的 8 桶成绩表陆续装进了 A 到 G 共 7 名同学（A、B、C 和另外四位同学），此时[[负载因子]] = 7 ÷ 8 ≈ 0.88，已经冲过 Java [[HashMap]] 的 0.75 警戒线。不能只加桶不搬人：因为之前算桶号是 `% 8`，桶数改成 16 后如果还留在原地，下次按 `% 16` 来查就找错了门。必须触发一次[[再哈希]]——把桶数翻倍成 16，让 7 位同学全部按新桶数重算一遍落点搬过去（比如画布里 D 搬去 9 号桶、B 搬去 11 号桶，3 号桶只剩 A 自己），负载因子立刻回落到 7/16 ≈ 0.44。

    等一下，每次触发扩容都要把表里所有人重新搬一遍，插入难道不就变成 O(n) 了吗？只看触发扩容那倒霉的一次插入确实是，可平摊到整段生命周期并不是。算笔大账：从 16 个桶、阈值 0.75 起步一路插满 100 万个元素，总共只会触发约 17 次扩容，累计搬运总次数约 157 万次（小于 2n）。把这 157 万次搬运摊到 100 万次插入头上，平均每次插入只多付不到 2 次搬运，均摊复杂度稳稳还是 [[O(1)|大 O 记号]]——和动态数组翻倍扩张是同一笔几何级数的账。

    工程里务必分清「均摊快」和「每次都快」：如果表里已经有上千万条在线数据，翻倍扩容那一次插入会突然卡顿很久（延迟尖刺）。对延迟敏感的系统，要么建表时按预估人数一次把桶开够，要么像 Redis 那样把搬家拆成每次请求顺带搬几个桶的渐进式再哈希，避开单次大停顿。
  derivation: original
  sources:
  - ref: mit-6006
    locator: Hashing / 动态数组相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
