- id: worst-case
  title: 最坏情况与哈希洪水攻击
  tldr: O(1) 是平均情况；如果攻击者故意造出大量冲突的键，哈希表会变慢到 O(n)。
  body: '哈希表的 O(1) 是平均情况，依赖一个前提：键被均匀打散。如果大量键落在同一个桶，每次操作都要沿链逐个比对，n 个键全挤一桶时，一次查找就是 O(n)，把这样的表建起来更是 O(n²)。

    这不只是理论：2011 年前后，研究者演示了针对多种 Web 框架的哈希洪水攻击——提交大量精心构造、哈希值相同的请求参数，让服务器把 CPU 耗在一条长链的比对上，少量请求就能拖垮服务。本质上，是攻击者把平均情况强行改造成了最坏情况。

    防御办法是用带随机种子的哈希函数（如 SipHash）：种子在进程启动时随机生成，攻击者离线算好的冲突键换个种子就不再冲突；Python、Rust 等语言的标准库都这样做。另一条防线是给链长设上限并树化（前面讲的 Java 做法），或限制单个请求的参数个数，多层设防。'
  derivation: original
  sources:
