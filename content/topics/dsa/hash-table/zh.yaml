- id: clustering
  title: "[[开放寻址]]的聚集：探查为什么越挤越慢"
  tldr: "开放寻址还有一个会自我放大的毛病：连续占用的桶段会越长越长。这一步看这种聚集怎样形成，再用公式算清[[负载因子]]从 0.5 涨到 0.9 时，期望探查次数怎样从约 2 次涨到约 10 次。"
  body: >-
    开放寻址有个会自我放大的毛病，叫一次聚集：某段连续桶被占满后，新元素只要哈希进这一段，都会被推到段尾，段更长；段越长被命中的概率越大，长得越快。空着的段却一直空着。这是[[线性探测]]最被诟病的一点。


    定量看：CLRS 在均匀哈希假设下，不成功查找的期望探查约为 1 除以 (1 减负载因子)。负载因子 0.5 时约 2 次，0.75 时约 4 次，到 0.9 时约 10 次，越接近 1 发散越快。这就是开放寻址把负载因子压在
    0.7 上下的原因：探查曲线在这里开始明显变陡。


    缓解是换探测：[[二次探测]]让步长越走越大，跳出已占的段；[[双重哈希]]用第二个哈希函数算步长，不同键步长不同。但负载逼近 1，任何开放寻址都会慢——真正的纪律是提前扩容。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 11 开放寻址分析
