- id: playground
  title: 动手实验：哈希表游乐场
  tldr: 换不同的键集亲手插入，看冲突如何连环发生、扩容如何把探测次数拉回来。
  body: '在下面的实验室里试三组键：连环冲突组的键模 8 全是 0，每个新键都要顺延好几格，亲手数一遍探查次数 1、2、3 如何累加；触发扩容组在第 6 个键插入前负载因子超过 0.7，容量翻倍、全表重新散列，观察每个键的新位置与旧位置完全不同。也可以输入自己的一组数字，验证你的预测：先手算每个键的哈希值与落点，再点单步看它实际落在哪。

    再想一层：为什么扩容后连环冲突组会散开？因为模数从 8 变成 16，原来模 8 同余的键被更高位的比特区分开了——这正是桶数取 2 的幂时对低位特别敏感的原因。还可以故意输入一组全部同余的键，看探查次数如何随已占长度线性增长。建议先写下预测再点单步：预测错在哪一步，恰好暴露你对探测规则或扩容时机的误解。'
