title: 哈希表：冲突与扩容
summary: 按“名字”直接找到东西，平均只要一步。代价是要处理冲突，并在变挤时扩容。
premise: 按名字查一个人的成绩，如果把数据放在普通数组里，只能从头一个个看过去，人越多越慢。有没有办法根据名字直接算出它应该放在哪里，查的时候一步到位？本课用一个只有 8 个桶的表存放几位同学的成绩为例，看哈希表怎样定位，又会撞上什么麻烦。
position: 本站从「按名与按序查找」板块起步，哈希表是这一板块的入口，因为它先回答最原始的问题：不靠逐个比对，怎样用哈希函数把任意键直接算成桶下标。学完你能判断[[负载因子]]冲过约 0.7
  时为何必须扩容，并说清[[拉链法]]与[[开放寻址]]在冲突处理上各自付了什么代价。
bridge:
  next: 哈希表把键打散后顺序全丢，下一课二分查找要解决的是：当数组已经有序时，怎样靠一次比较就排除一半候选。
overview:
- key: 一句话总结
  value: 用哈希函数把键变成位置，平均 [[O(1)|大 O 记号]] 就能完成查找、插入、删除。查的时候不用遍历，只要把键再算一遍哈希，就知道该去哪个桶里找，前提是冲突不要太多。
- key: 冲突
  value: 不同的键算出同一个位置，这件事必然会发生。因为可能的键有无数个，桶的数量却有限，鸽子多笼子少，总会有两个键被分到同一个桶，只能想办法安顿它们，而不是指望不发生。
- key: 负载因子
  value: "[[负载因子]]是已存元素除以桶数，太高就扩容，Java [[HashMap]] 默认阈值是 0.75。比如 8 个桶装到 6 个元素就到了这条线，再往里装冲突会明显变多，先扩容再继续装更划算。"
- key: 工程里
  value: JS 的 Map 和 Object、Python 的 dict、Redis、数据库哈希索引，底层都是哈希表的思路。它们用起来都像按名字直接取值，快的背后靠的都是同一套哈希定位加冲突处理。
- key: Big-O 直觉
  value: O(1) 指的是耗时不随数据量增长；最坏情况，也就是全部冲突时，会退化到 O(n)。数据从一千条涨到一百万条，平均查找时间基本不变，但如果所有键都挤在一个桶里，查找就变回了在一条长链表里逐个找。
- key: 复杂度
  value: 平均是 O(1)，最坏是 O(n)；扩容的均摊成本是 O(1)。扩容那一次要把全部元素重新放一遍，单看很贵，但它很少发生，把这笔账摊到每次插入上，每次只多付很小一点。
- key: 好的哈希函数
  value: 好的哈希函数要算得快、分布均匀；相等的键必须得到相同的哈希值。分布不均匀时某些桶会挤满而另一些空着，查找就慢了；相等的键算出不同结果更致命，刚存进去的值转头就查不到。
- key: 开放寻址
  value: "[[开放寻址]]包括[[线性探测]]等做法；删除时需留[[墓碑]]标记。桶被占了就顺着往后找下一个空位，删除时如果直接清空，后面靠探测排进来的元素就会被这条断链挡住再也找不到，所以只能先留个标记占着位置。"
- key: 安全
  value: "[[哈希洪水攻击]]是攻击者故意造出大量互相冲突的键，把哈希表拖慢到 O(n)；防御办法是用带随机种子的哈希，比如 [[SipHash]]。种子随机之后，攻击者没法提前算好哪些键会冲突，攻击就无从下手。"
- key: 哈希集合
  value: 哈希集合只存键不存值，用来去重，JS 的 Set 就是它。比如把一串日志里的用户编号放进集合，重复的自动只留一份，判断某个编号出现过没有也是一步到位。
