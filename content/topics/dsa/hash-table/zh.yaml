steps:
- id: why
  title: 为什么需要哈希表
  tldr: 在数组里按名字找人，只能一个个看过去；数据越多越慢。
  body: '有 100 万个用户，按名字逐个比对，最坏要看 100 万次，平均也要看 50 万次，这叫 O(n)：耗时和数据量成正比。数据量翻 10 倍，查找就慢 10 倍，到了亿级用户根本等不起。

    数组按下标取值却只要一步，因为位置能直接算出来：基地址加上下标乘以元素大小，就是目标地址，不需要任何比对。哈希表的想法是把这条路搬到字符串键上：把名字也变成一个下标。

    走一遍具体数字：8 个桶的小表里放 Alice、Bob、Carol 三个人，理想情况下每人占一个桶，查谁都是一次哈希加一次比对。后面几步会看到，现实里两个人可能算到同一个桶，这正是哈希表全部复杂度的来源：冲突处理与扩容，而不是查找本身。

    记住这个对照：数组是键恰好就是整数下标的特例，哈希表是把任意键硬变成下标的推广。推广的代价，就是接下来要逐项算清的冲突账。'
  derivation: original
  sources:
