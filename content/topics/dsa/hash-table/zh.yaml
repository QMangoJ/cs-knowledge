- id: collision
  title: 冲突：两个键挤进同一个桶
  tldr: 桶比可能的键少得多，不同的键迟早会算到同一个桶。
  body: 'Bob 也被算到了桶 3，这就是冲突。冲突不是实现失误，而是数学必然：键的可能取值有无穷多，桶只有 8 个，按抽屉原理，只要键比桶多，就一定有不同的键落进同一个桶。

    常见做法一是链表法（拉链法）：每个桶挂一串，冲突的元素排在一起，查找时先定位桶、再沿链逐个比对；二是开放寻址：桶被占了就按固定规则找下一个空桶，把元素放进去。

    走例：桶 3 里现在是 Alice 在前、Bob 在后，查 Bob 要比对两次；查一个同样落到桶 3 却不存在的键，要把整条链比对完才能下结论。冲突少时这点代价可以忽略；但如果大量键挤在同一个桶，链长从 1 涨到 n，查找就退化成在链表上逐个比对，O(1) 的承诺当场破产。换句话说，哈希表快不快，一大半取决于冲突被处理成什么样，而不是哈希函数算得多快。'
  derivation: original
  sources:
  - ref: mit-6006
    locator: Hashing 相关讲义，冲突处理
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: 通过链接或开放寻址解决冲突
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
