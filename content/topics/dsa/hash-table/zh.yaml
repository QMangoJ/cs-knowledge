- id: collision
  title: 冲突躲不掉：Bob 也算进了桶 3，两条路安顿他
  tldr: 名字无穷多、桶只有 8 个，Bob 和 Alice 算进同一个 3 号桶是数学必然。安顿碰撞只有两条路：同一个桶里挂一串链表排队（拉链法），或者顺着表往后找下一个空桶（开放寻址）。
  body: |-
    回到 8 桶成绩表，Alice 已经稳稳坐在 3 号桶，现在把 Bob 放进去——很不巧，他的名字算完取余也是 3！别怪哈希函数没写好：按[[抽屉原理]]，可能出现的人名有无穷多个，桶只有 8 个，就算表还没装满，两个键撞车也是迟早的事。问题不是怎么消灭冲突，而是撞了之后怎么安顿。

    工程里分出两条路。第一条叫[[拉链法]]：每个桶后面挂一条小链表，3 号桶里 Alice 坐前面、Bob 挂在她后头（画布里正是这样，Carol 自己安安静静坐在 6 号桶）。第二条叫[[开放寻址]]：不另外挂链表，3 号桶既然被 Alice 占了，Bob 就按约定的步法顺着往后找空桶住下。

    看看拉链法在冲突后的查账成本：查 Bob 时，算完哈希直奔 3 号桶，先比对 Alice 不匹配，再顺着链比到 Bob，总共 2 次比较命中；要是查一个压根没存过、偏偏也算进 3 号桶的名字，就得把整条链上的 Alice 和 Bob 全看一遍才敢说不存在。万一成千上万个键全挤进 3 号桶，链长拉到 n，引以为傲的 [[O(1)|大 O 记号]] 就直接退化成遍历链表了。
  derivation: original
  sources:
