- id: worst-case
  title: 最坏情况与[[哈希洪水攻击]]
  tldr: "前面所有结论都建立在平均情况上。这一步看平均怎样被人为打坏：攻击者故意造出大量互相冲突的键提交给服务器，哈希表当场退化。看完攻击手法，再看带随机种子的哈希为什么能防住它。"
  body: >-
    哈希表的 [[O(1)|大 O 记号]] 是平均情况，前提是键被均匀打散。大量键落在同一个桶，每次操作都要沿链比对，n 个键全挤一桶时一次查找就是 O(n)，把这样的表建起来更是 O(n²)。


    这不只是理论：2011 年前后，研究者演示了针对多种 Web 框架的哈希洪水攻击——提交大量精心构造、哈希值相同的请求参数，让服务器把 [[CPU]] 耗在一条长链的比对上，少量请求就能拖垮服务。攻击者把平均情况强行改造成了最坏情况。


    防御是用带随机种子的哈希函数（如 [[SipHash]]）：种子在进程启动时随机生成，攻击者离线算好的冲突键换个种子就不再冲突，Python、Rust 等标准库都这样做。另一条防线是给链长设上限并树化（前面讲的 Java
    做法），或限制单个请求的参数个数。
  derivation: original
  sources:
