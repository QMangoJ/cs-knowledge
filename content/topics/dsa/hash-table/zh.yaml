- id: hash
  title: 哈希函数：把键变成位置
  tldr: "上一歩说要把名字变成下标，这一步看这个变换具体怎么做：哈希函数把键算成一个大整数，再对桶数取余落桶。跟着 Alice 算一遍她落到哪个桶，再把好哈希函数的三条硬要求立好。"
  body: |-
    把 Alice 按字符逐个累积算成大整数 63350371，再除以桶数 8 取余，63350371 除以 8 余 3，得到桶 3，把她的成绩放进桶 3。查找时用相同方法再算一次，直接去桶 3 拿。

    好的哈希函数有三条硬要求：同一个键每次必须算出同一结果，否则存进去就找不到；分布均匀，相近的键如 user1001 与 user1002 不能扎堆同桶；算得快，因为每次操作都要先付这笔钱。

    取余不可省略：哈希值可以是几十亿，桶只有 8 个，不取余没地方放。取余只保留一部分比特，所以各位比特要充分混合，否则规律性的键会成片冲突（下一节展开）。
