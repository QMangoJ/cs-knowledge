- id: playground
  title: 动手实验：哈希表游乐场
  tldr: 在实验室里亲手用线性探测加 0.7 扩容跑几组键：一边数连环冲突时探测次数怎样按 1、2、3 累加，一边看桶数从 8 翻倍成 16 时高位比特怎样把原本挤死在一起的键重新打散。
  body: |-
    先选预置键集跑两遍。「连环冲突组」里的 8、16、24 对 8 取余全得 0：8 直接住进 0 号桶（1 次探测），16 撞上 0 号桶顺延到 1 号（2 次探测），24 一路顺延到 2 号（3 次探测），累计探测 6 次。「触发扩容组」（5、13、21、29、37、45、53）在插第 6 个键之前[[负载因子]]会冲过 0.7，桶数从 8 翻倍成 16、整表再哈希，最终 53 落到 8 号桶、总探测 22 次。

    为什么之前模 8 全撞成一团的键，一扩容成 16 个桶就散开了？因为取模从 8 变成 16 后，二进制第 4 位开始参与算桶号，原本在低 3 位一模一样的键被高位拉开了——这也正是前面说「桶数取 2 的幂对低位格外敏感」的现场验证。你也可以自输一串数字，每次先心算落点再点单步：预测失手的那一步，正是规则理解有偏差的地方。
