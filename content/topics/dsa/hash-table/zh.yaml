- id: open-addr
  title: 两种处理冲突的方式各有什么代价
  tldr: 链表法简单、能装超过桶数的元素；开放寻址更省内存、缓存更友好，但删除麻烦。
  body: '链表法：表很挤时链会变长，但不会装满，因为链可以一直往后挂；Java 8 的 HashMap 在一个桶的链长达到 8 且表容量至少 64 时（两个条件同时满足），会把那条链变成红黑树，把最坏查找压回 O(log n)；容量不够 64 时则优先扩容，因为小表里的长链多半是容量不足，而不是哈希函数太差。

    开放寻址：所有元素都在一个连续数组里，冲突时顺着往后找空位，对 CPU 缓存很友好，Python dict 就用这种思路。代价是装得太满时探查链急剧变长，而且删除不能直接清空格子，否则排在它后面的元素会在查找时提前遇到空位、被误判为不存在，所以要留一个已删除标记（墓碑）。

    用画布的例子算笔账：Alice 占桶 3，Bob 探测 1 次落到桶 4；删 Alice 留墓碑后查 Bob，先看桶 3 是墓碑、继续往后，第 2 次探测在桶 4 找到。若当初直接清空桶 3，查 Bob 第 1 步就撞到空位停下，误报不存在——墓碑存在的全部理由，就是保住探查链的连续性。'
  derivation: original
  sources:
