- id: worst-case
  title: "最坏情况与[[哈希洪水攻击]]：平均 O(1) 怎么被一招打垮"
  tldr: 哈希表的 O(1) 靠的是键分布均匀。一旦攻击者故意算出几万个全落进 3 号桶的请求参数，查表就会塌成单链逐个比对、几条请求就能拖死 CPU；标准库靠带随机种子的哈希把算式变成黑盒，才让离线算好的冲突键失效。
  body: |-
    前面所有的好消息都建立在「键分散在不同桶里」这条前提上。要是来了一批坏数据，把 n 个键全塞进 3 号桶（如图里挂出一条 `K1 → K2 → … → Kn` 的长龙），每次查找就得顺着这条链比完 n 个节点，退化成 O(n)；把这 n 个键一个个插进表的总耗时更会飙到 O(n²)。

    2011 年前后，安全研究者把这种打法变成了现实中的[[哈希洪水攻击]]：既然语言标准库的哈希算式公开透明，攻击者就能离线提前算好成千上万个哈希值一模一样的表单或 JSON 参数名，打包塞进一个 HTTP 请求发给服务器。服务器一解析参数就把 [[CPU]] 全耗在 3 号桶那条长链上，几个小请求就能让整台 Web 服务卡死。

    现代系统靠两道防线封住这个口子。核心防线是换用带随机种子的哈希函数（例如 Python、Rust 标准库采用的 [[SipHash]]）：服务进程每次启动时在内存里现抽一个随机种子，对手离线算好的冲突键只要换了种子立刻分散到四面八方。第二道防线是兜底限制：比如像 Java 那样把过长链表转成红黑树，或者在网关层限制单个请求最多能带多少个参数。
  derivation: original
  sources:
  - ref: mit-6006
    locator: Hashing 相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: O(1) 是平均情况；如果攻击者故意造出大量冲突的键，哈希表会变慢到 O(n)。
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
  canvas:
    kind: datastate
    structure: array
    caption: 攻击者构造的键全部算到桶 3：查找退化成在一条长链上逐个比对
    rows:
    - label: 桶
      cells:
      - v: ""
        mark: muted
        sub: "0"
      - v: ""
        mark: muted
