- id: worst-case
  title: 最坏情况与哈希洪水攻击
  tldr: O(1) 是平均情况；如果攻击者故意造出大量冲突的键，哈希表会变慢到 O(n)。
  body: '哈希表的 O(1) 依赖键被均匀打散，如果大量键落在同一个桶，每次操作都要逐个比对。

    2011 年前后，研究者演示了针对多种 Web 框架的攻击：提交大量精心构造、哈希相同的参数，就能让服务器 CPU 跑满。

    防御办法是用带随机种子的哈希函数（如 SipHash），让攻击者猜不到哪些键会冲突；Python、Rust 等都这样做。'
  derivation: original
  sources:
  - ref: mit-6006
    locator: Hashing 相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
