  title: 为什么需要哈希表
  tldr: 在数组里按名字找人，只能一个个看过去；数据越多越慢。
  body: '有 100 万个用户，按名字逐个比对，最坏要看 100 万次，这叫 O(n)：耗时和数据量成正比。

    数组按下标取值却只要一步，因为位置能直接算出来。

    哈希表的想法是：把“名字”也变成一个下标。'
