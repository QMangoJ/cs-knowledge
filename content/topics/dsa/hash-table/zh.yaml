- id: engineering
  title: 工程里的哈希表
  tldr: "最后收口到日常使用：缓存、去重、计数背后都是哈希表。这一步逐项对号入座，再把它的边界点名——不保顺序、答不了范围问题、键被改过就再也找不到——免得拿它去干不该干的活。"
  body: >-
    在 JS 里用 Map 做缓存、去重、计数，就是在用哈希表；Map 按插入顺序遍历是语言规范额外保证的，不是哈希表天生的性质。Object 也能当字典用，但键会被转成字符串，Map 则保留键的原始类型。


    哈希表不保证有序：它回答不了下一个是谁、比某个键大的最小键是谁、某个区间里有几个键。需要范围查询或找最接近的值时，要用平衡树或跳表。选结构前先列清要支持的操作集合。


    键要能稳定地算出哈希：用对象当 Map 的键时比较的是引用，两个内容相同的对象字面量是不同的键；可变对象入表后被改了参与哈希的字段，就会永远找不回来，这是最常见的哈希表
    bug。做内存缓存时还要给[[负载因子]]留阈值并监控最长链，并配淘汰策略——哈希表只负责存取，不管过期。
  derivation: original
  sources:
  - ref: mit-6006
    locator: Hashing 相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: 哈希表适合精确查找，不支持有序操作
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
  canvas:
    kind: datastate
    structure: array
    caption: map.get("Alice")：算一次哈希，直接到桶 3
    rows:
    - label: 桶
      cells:
      - v: ""
        sub: "0"
      - v: ""
        sub: "1"
      - v: ""
        sub: "2"
      - v: Alice
        mark: found
        sub: "3"
      - v: ""
        sub: "4"
      - v: ""
        sub: "5"
      - v: Carol
        sub: "6"
      - v: ""
        sub: "7"
      pointers:
      - at: 3
        label: get
    aux:
    - label: JS
      items:
      - new Map()
      - map.set(k, v)
      - map.get(k)
  log:
