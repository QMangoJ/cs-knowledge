steps:
- id: why
  title: 为什么需要哈希表
  tldr: "先把场面摆好：按名字查一个人的成绩，放在普通数组里只能从头一个个看，人一多就慢得不能用。这一步先算清逐个查找的账，再点出数组按下标一步取值的本事——哈希表要做的，就是把这份本事搬到字符串键上。"
  body: |-
    有 100 万个用户，按名字逐个比对，最坏看 100 万次，平均 50 万次，这叫 O(n)：数据量翻 10 倍，查找慢 10 倍，亿级用户根本等不起。

    数组按下标取值只要一步，因为位置能直接算：基地址加下标乘元素大小就是目标地址，不需要比对。哈希表就是把这条路搬到字符串键上：把名字也变成下标。

    小表走例：8 个桶放 Alice、Bob、Carol，理想情况下每人一桶，查谁都是一次哈希加一次比对。现实里两个人可能算到同一个桶——哈希表全部复杂度正源于此：冲突处理与扩容，而不是查找本身。数组是键恰好是整数下标的特例，哈希表是把任意键硬变成下标的推广。
