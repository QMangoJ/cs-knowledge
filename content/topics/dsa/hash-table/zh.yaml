- id: engineering
  title: 工程里的哈希表
  tldr: JS 的 Map 和 Object、Python 的 dict 都是哈希表的思路。
  body: '在 JS 里用 Map 做缓存、去重、计数，就是在用哈希表；Map 还按插入顺序遍历，这是语言规范额外保证的，不是哈希表天生的性质，不要把两者混为一谈。Object 也能当字典用，但键会被转成字符串，Map 则保留键的原始类型。

    哈希表不保证按大小有序：它回答不了下一个是谁、比某个键大的最小键是谁、某个区间里有几个键。需要范围查询或找最接近的值时，要用有序结构，如平衡树或跳表。选结构之前，先把要支持的操作集合列清楚。

    键要能稳定地算出哈希：用对象当 Map 的键时，比较的是引用而不是内容，两个内容相同的对象字面量是两个不同的键；同理，可变对象在入表之后被改了参与哈希的字段，就会永远找不回来，这是新手最常见的哈希表 bug。

    工程注记：把用户 id、会话、请求结果做内存缓存时，记得给负载因子留阈值并监控最长链——哈希表退化成链表的事故真实发生过，语言标准库为此引入了随机种子哈希；缓存还要配淘汰策略，哈希表本身只负责存取，不管过期。'
  derivation: original
  sources:
