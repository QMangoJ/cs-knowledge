- id: hash
  title: 哈希函数：把键变成位置
  tldr: 哈希函数把任意键算成一个数字，再对桶数取余，得到放在哪个桶。
  body: '比如把“Alice”算成一个大整数，除以 8 取余，得到桶 3，就把她的成绩放进桶 3。

    查找时用同样的方法再算一次，直接去桶 3 拿，不用逐个比对。

    好的哈希函数会把键尽量均匀地撒到各个桶里。'
  derivation: original
  sources:
  - ref: mit-6006
    locator: Hashing 相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: 哈希函数将键映射到表中的位置
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
  canvas:
    kind: datastate
    structure: array
    caption: hash("Alice") % 8 = 3
    rows:
    - label: 桶
      cells:
      - v: ''
        sub: '0'
      - v: ''
        sub: '1'
      - v: ''
        sub: '2'
      - v: Alice
        mark: new
        sub: '3'
      - v: ''
        sub: '4'
      - v: ''
        sub: '5'
      - v: ''
        sub: '6'
      - v: ''
        sub: '7'
      pointers:
      - at: 3
        label: Alice → 3
  log:
  - mode: 插入
    event: Alice 放入桶 3
  code:
    lang: typescript
    code: "// 最小拉链法哈希表：key 先哈希到桶，桶内链表处理冲突\nclass HashMap<K, V> {\n  private buckets: [K, V][][] = Array.from({ length: 16 }, () => []);\n  private hash(k: K) { let h = 0; const s = String(k); for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % this.buckets.length; }\n  set(k: K, v: V) { const b = this.buckets[this.hash(k)]!; const e = b.find(([x]) => x === k); if (e) e[1] = v; else b.push([k, v]); }\n  get(k: K) { return this.buckets[this.hash(k)]!.find(([x]) => x === k)?.[1]; }\n}"
    note: TypeScript 实现
- id: collision
  title: 冲突：两个键挤进同一个桶
  tldr: 桶比可能的键少得多，不同的键迟早会算到同一个桶。
  body: '“Bob”也被算到了桶 3，这就是冲突。

    常见做法一是“链表法”：每个桶挂一串，冲突的元素排在一起；二是“开放寻址”：桶被占了就按规则找下一个空桶。

    冲突少时影响不大；如果大量键挤在同一个桶，查找会退化成逐个比对。'
  derivation: original
  sources:
  - ref: mit-6006
    locator: Hashing 相关讲义，冲突处理
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: 通过链接或开放寻址解决冲突
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
  canvas:
    kind: datastate
    structure: array
    caption: 链表法：冲突的元素挂在同一个桶后面
    rows:
    - label: 桶
      cells:
      - v: ''
        sub: '0'
      - v: ''
        sub: '1'
      - v: ''
        sub: '2'
      - v: Alice
