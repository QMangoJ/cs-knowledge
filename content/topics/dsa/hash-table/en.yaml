- id: open-addr
  title: What each way of handling collisions costs
  tldr: "There are two roads for settling collisions, and this step lays their costs side by side: chaining can keep hanging elements indefinitely, while [[open addressing|开放寻址]] saves memory and treats the cache kindly. Run Alice and Bob through the landing process once, then see why open addressing must leave a [[tombstone|墓碑]] behind when it deletes."
  body: >-
    Chaining: a chain can keep growing and never fills up. Java 8's [[HashMap]] turns a bucket's chain into a red-black tree once the chain reaches length 8 and the table capacity is at least 64 (both conditions at once), pressing worst-case lookup back down to O(log n); when capacity is below 64 it resizes instead, because long chains in a small table usually mean too little capacity, not a poor hash function.


    Open addressing: every element lives in one contiguous array, and on a collision you probe forward for an empty slot — friendly to the [[CPU]] cache, and Python's dict follows this approach. The price is that probe sequences lengthen sharply as the table fills, and a deletion cannot simply empty its slot: elements behind it would run into the empty slot early during a lookup and be misjudged as absent. So a deleted marker (a tombstone) has to stay behind.


    The arithmetic: Alice takes bucket 3; Bob probes once and lands in bucket 4. Delete Alice and leave a tombstone, and a lookup for Bob first sees the tombstone at bucket 3 and keeps going; the second probe finds him in bucket 4. If bucket 3 were simply emptied, the lookup for Bob would stop at its very first step on the empty slot and falsely report him missing. That is the tombstone's whole reason for existing — keeping the probe chain unbroken.
  derivation: original
