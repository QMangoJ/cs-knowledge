- id: consistent-hashing
  title: "A peek ahead: why [[consistent hashing|一致性哈希]] needs a ring"
  tldr: "Scale a hash table up to many machines and a new problem appears: add or remove one machine, and plain modulo makes almost every key move house. This step first does the math on why modulo is so fragile, then shows why — once the mapping lives on a ring — only the arc where something happened needs to move."
  body: >-
    Scale a hash table across machines and plain modulo causes a disaster: with 3 machines a key lands at its hash value mod 3; add a fourth machine and it becomes mod 4, and almost every key's landing spot changes — caches invalidate en masse and data moves house across the whole network. The problem is not the hash function; it is that the moment the bucket count changes, the entire mapping rule is rewritten.


    Consistent hashing splits the mapping into two hops: machines and keys are both hashed onto the same ring, and the first machine a key meets going clockwise is its home. A worked example: unrolled, the ring reads machine A, key k1, machine B, key k2, then wraps back to A. k1 meets B first, so it belongs to B; k2 passes B and wraps around to A, so it belongs to A. Now B
    goes offline: only k1, which belonged to B, has to move to A; k2 does not move. Only the arc that belonged to the machine where something happened is affected.


    What it solves is the data-movement problem when machines join or leave distributed caches and sharded stores. The price is a less even spread, which takes several [[virtual nodes|虚拟节点]] per machine to smooth out. Understand modulo's fragility first, and the value of going onto a ring becomes clear; distributed caches and [[Dynamo]]-style stores both build on this idea.
  derivation: original
  sources:
  - ref: clrs
    locator: "Chapter 11, hash functions"
    claim: A hash function maps keys to table slots; consistent hashing builds on this by organizing the slots into a ring, reducing the data movement when nodes join or leave
    status: verified
    checkedBy: Checked by Muse
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: "The ring, unrolled: k1 goes clockwise to B, k2 wraps around to A; when B goes offline, only k1 has to move"
    rows:
