- id: clustering
  title: "Clustering in [[open addressing|开放寻址]]: why probes slow down the fuller it gets"
  tldr: "Open addressing has one more flaw, and it amplifies itself: runs of consecutively occupied buckets grow longer and longer. This step shows how that clustering forms, then works the formula to see how the expected number of probes climbs from about 2 to about 10 as the [[load factor|负载因子]] rises from 0.5 to 0.9."
  body: >-
    Open addressing has a self-amplifying flaw called primary clustering: once a run of consecutive buckets is occupied, any new element that hashes into the run gets pushed to the run's tail, and the run grows longer; and the longer the run, the higher the chance of being hit, so the faster it grows. Runs that are empty stay empty. This is the most criticized weakness of [[linear probing|线性探测]].


    Quantitatively: under the uniform-hashing assumption, CLRS puts the expected number of probes for an unsuccessful search at about 1 / (1 − load factor). At load factor 0.5 that is about 2 probes; at 0.75, about 4; at 0.9, about 10 — and the closer the load gets to 1, the faster it diverges. That is why open addressing keeps the load factor around 0.7: this is where the probe curve starts to bend sharply upward.


    The mitigation is to change the probing: [[quadratic probing|二次探测]] takes larger and larger steps, leaping out of the occupied run; [[double hashing|双重哈希]] computes the step from a second hash function, so different keys stride differently. But as the load approaches 1, every form of open addressing slows down — the real discipline is to resize early.
  derivation: original
  sources:
  - ref: clrs
    locator: "Chapter 11, analysis of open addressing"
    claim: Under the uniform-hashing assumption, the expected number of probes for an unsuccessful search in open addressing is about 1/(1−α)
    status: verified
