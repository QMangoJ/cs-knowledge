- id: worst-case
  title: "Worst cases and [[hash flooding attacks|哈希洪水攻击]]"
  tldr: "Every conclusion so far rests on the average case. This step shows how the average can be sabotaged on purpose: an attacker crafts large numbers of mutually colliding keys and submits them to a server, and the hash table degenerates on the spot. Once you have seen the attack, see why a hash with a random seed defends against it."
  body: >-
    A hash table's [[O(1)|大 O 记号]] is an average-case statement, premised on keys spreading evenly. When many keys land in the same bucket, every operation compares along the chain; with n keys all squeezed into a single bucket, one lookup is O(n), and building such a table in the first place costs O(n²).


    This is not just theory: around 2011, researchers demonstrated hash flooding attacks against a range of web frameworks — submit a large batch of carefully crafted request parameters whose hash values are all the same, and the server burns its [[CPU]] comparing along one long chain, so that a small number of requests can bring the service down. The attacker forcibly turns the average case into the worst case.


    The defense is a hash function with a random seed (such as [[SipHash]]): the seed is generated randomly when the process starts, so the colliding keys an attacker computed offline stop colliding under a different seed — the standard libraries of Python, Rust, and others do exactly this. A second line of defense caps the chain length and converts long chains to trees (the Java approach from earlier), or limits the number of parameters in a single request.
  derivation: original
  sources:
  - ref: mit-6006
    locator: Hashing lectures
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: O(1) is the average case; if an attacker deliberately crafts many colliding keys, the hash table slows down to O(n)
