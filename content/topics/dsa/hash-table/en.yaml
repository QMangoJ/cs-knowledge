- id: resize
  title: "[[Load factor|负载因子]] and resizing"
  tldr: "Probe sequences grow long because the table is too crowded. This step looks at the load factor, the ruler for that crowding: when the ratio of elements to buckets crosses a threshold, you resize. Work through inserting a million elements starting from 16 buckets and total the carrying work, to see why a resize that is expensive once is still cheap spread across every insertion."
  body: >-
    Load factor = number of elements ÷ number of buckets; it measures how crowded the table is. Seven elements in 8 buckets gives about 0.88; squeeze in still more and chain lengths and probe lengths both accelerate upward — so you resize before things get out of hand.


    Once past the threshold (Java's [[HashMap]], for example, uses 0.75), you double the bucket count and recompute every element's position under the new count and place it again. This step is called [[rehashing|再哈希]], and every old position is void. A single resize moves all the elements and looks expensive — but it happens rarely.


    A numeric example: starting from 16 buckets at threshold 0.75, inserting a million elements triggers about 17 resizes, with total carrying work of about 1.57 million moves — less than 2n. Spread across the insertions, that is under 2 moves per insertion, and the amortized complexity is still [[O(1)|大 O 记号]]. It is the same geometric-series argument as the amortized O(1) of a dynamic array's push: with each doubling, the total carrying work is dominated by the last term.


    Amortized does not mean every operation is fast: the one insertion that triggers a resize has to move n elements, and latency spikes. Latency-sensitive systems either build the table at its estimated capacity in one go, or accept the spike.
  derivation: original
  sources:
  - ref: mit-6006
    locator: Hashing / dynamic array lectures
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
