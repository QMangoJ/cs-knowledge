- id: collision
  title: "Collisions: two keys squeeze into one bucket"
  tldr: "The function and the landing are in place — and trouble arrives with them: Bob computes to bucket 3 as well. This step first explains why collisions are a mathematical certainty that cannot be dodged, then looks at the two roads for settling them — hang them in a list, or move on to an empty bucket — and how each one works."
  body: >-
    Bob was computed to bucket 3 as well. That is a collision. A collision is not an implementation blunder but a mathematical necessity: there are infinitely many possible keys and only 8 buckets. By the [[pigeonhole principle|抽屉原理]], once there are more keys than buckets, two different keys must land in the same bucket.


    There are two roads for handling it. One is chaining ([[separate chaining|拉链法]]): each bucket hangs a list, colliding elements line up together, and a lookup first locates the bucket, then compares along the chain. The other is [[open addressing|开放寻址]]: when the bucket is taken, follow a rule to find the next empty bucket.


    A worked example: in bucket 3, Alice sits in front and Bob behind her, so looking up Bob takes two comparisons; looking up a key that also lands in bucket 3 but does not exist means comparing the entire chain before you may conclude anything. When large numbers of keys crowd into one bucket, the chain grows from 1 to n and lookup degenerates into comparing along a list — [[O(1)|大 O 记号]]
    goes bankrupt on the spot. Whether a hash table is fast depends, more than half, on collision handling — not on how fast the hash function computes.
  derivation: original
  sources:
