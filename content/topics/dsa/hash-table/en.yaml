order: 1
status: published
license: CC-BY-4.0
title: "Hash Tables: Collisions and Resizing"
summary: Find things directly by name — one step on average. The price is handling collisions, and resizing when the table gets crowded.
premise: To look up a person's grade by name, if the data sits in a plain array you can only scan it from the start, one entry at a time — the more people, the slower it gets. Is there a way to compute, straight from the name, where the entry should go, so a lookup lands in a single step? Using a table with only 8 buckets holding a few students' grades, this lesson shows how a hash table finds its target — and what trouble it runs into.
position: This site opens with the "Lookup by Name and by Order" section, and the hash table is its entry point, because it answers the most basic question first — without comparing entries one by one, how do you use a hash function to turn an arbitrary key directly into a bucket index? After this lesson you will be able to judge why resizing is unavoidable once the
  [[load factor|负载因子]] pushes past about 0.7, and to explain what [[separate chaining|拉链法]] and [[open addressing|开放寻址]] each pay for handling collisions.
bridge:
  next: A hash table scatters its keys and throws all order away. The next lesson, binary search, tackles the opposite setup — when the array is already sorted, how can a single comparison rule out half the candidates?
overview:
- key: In one sentence
  value: Use a hash function to turn a key into a position, and lookup, insertion, and deletion all take average [[O(1)|大 O 记号]]. A lookup never scans — hash the key once more and you know which bucket to look in, provided collisions stay under control.
- key: Collisions
  value: Different keys computing to the same position is bound to happen. There are infinitely many possible keys but only finitely many buckets — more pigeons than holes — so two keys will always end up assigned to the same bucket. The only option is to find them a place to live, not to hope it never happens.
- key: Load factor
  value: "The [[load factor|负载因子]] is the number of stored elements divided by the bucket count; when it climbs too high, you resize — Java's [[HashMap]] uses a default threshold of 0.75. For example, 8 buckets holding 6 elements already reach that line; pack in more and collisions multiply noticeably, so resizing first and then continuing is the better deal."
- key: In practice
  value: JavaScript's Map and Object, Python's dict, Redis, database hash indexes — underneath, they all run on the hash-table idea. They all feel like fetching a value directly by name, and the speed rests on the same machinery — hash positioning plus collision handling.
- key: Big-O intuition
  value: O(1) means the running time does not grow with the amount of data; the worst case — everything colliding — degrades to O(n). Grow the data from a thousand entries to a million and the average lookup time barely moves; but if every key crowds into a single bucket, a lookup turns back into walking a long linked list node by node.
- key: Complexity
  value: Average O(1), worst case O(n); the amortized cost of resizing is O(1). One resize re-places every element, which looks expensive in isolation, but it happens so rarely that, spread across all the insertions, each one pays only a tiny extra.
- key: A good hash function
  value: A good hash function computes fast and spreads keys evenly, and equal keys must produce equal hash values. An uneven spread leaves some buckets stuffed while others sit empty, and lookups slow down; equal keys hashing to different values is worse — a value you just stored cannot be found again.
- key: Open addressing
  value: "[[Open addressing|开放寻址]] covers schemes such as [[linear probing|线性探测]]; a deletion has to leave a [[tombstone|墓碑]] marker behind. When a bucket is taken, you probe forward for the next empty slot. If a deletion simply emptied its slot, elements that had probed past it would be cut off by the broken chain and never found again — so a marker stays behind to hold the place."
- key: Security
  value: "A [[hash flooding attack|哈希洪水攻击]] is an attacker deliberately crafting large numbers of mutually colliding keys to drag a hash table down to O(n); the defense is a hash with a random seed, such as [[SipHash]]. With a random seed, the attacker cannot precompute which keys will collide, and the attack has nowhere to start."
- key: Hash sets
  value: A hash set stores keys without values; it is for deduplication, and JavaScript's Set is exactly that. Drop the user IDs from a stream of logs into a set and duplicates automatically keep a single copy — checking whether an ID has shown up before is a single step too.
