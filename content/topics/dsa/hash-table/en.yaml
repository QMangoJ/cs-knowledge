- id: chaining-delete
  title: "Deletion's two fates: unlinking from a chain vs. accumulating [[tombstones|墓碑]]"
  tldr: "The last step named deletion as the dividing line between the two roads; this step does that math in full. Chaining unlinks the element on the spot and leaves no trace; [[open addressing|开放寻址]] can only leave a tombstone, and as tombstones pile up, probes grow longer. Finally: how far can tombstones accumulate before the whole table must be [[rehashed|再哈希]] to clean them out?"
  body: >-
    Deleting an element from a chain means finding it in the list and splicing its predecessor to its successor — unlinked on the spot. The chain gets shorter, and later lookups only get faster. The tombstone problem simply does not exist in chaining.


    Open addressing is the mirror image: a deleted position can only leave a tombstone, so the table ends up mixing truly empty slots with tombstones. A lookup steps over tombstones and stops only at a truly empty slot; an insertion may reuse the first tombstone it meets. Tombstones never decrease on their own — after enough insert/delete cycles, a table holding only half its capacity in live elements can still probe for a long time.


    A worked example: bucket 3 is a tombstone, bucket 4 is Bob, bucket 5 is empty. Looking up a key that does not exist and hashes to 3 means passing two cells — the tombstone and Bob — before bucket 5 lets you conclude anything. The fix is to count tombstones into the load: when live elements plus tombstones pass the threshold, rehash into a clean table and clear every tombstone at once. Resizing doubles as spring cleaning for the probe chains.
  derivation: original
  sources:
