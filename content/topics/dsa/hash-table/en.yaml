  log:
  - mode: Insert
    event: "Alice is in: her key's hash value mod 8 is 3, so her grade went into bucket 3 — and a lookup runs the same computation to go straight there."
  code:
    lang: typescript
    code: >-
      // A minimal chaining hash table: hash the key to a bucket; a list inside the bucket handles collisions

      class HashMap<K, V> {
        private buckets: [K, V][][] = Array.from({ length: 16 }, () => []);
        private hash(k: K) { let h = 0; const s = String(k); for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % this.buckets.length; }
        set(k: K, v: V) { const b = this.buckets[this.hash(k)]!; const e = b.find(([x]) => x === k); if (e) e[1] = v; else b.push([k, v]); }
        get(k: K) { return this.buckets[this.hash(k)]!.find(([x]) => x === k)?.[1]; }
      }
    note: TypeScript implementation
- id: hash-function-design
  title: "Designing the hash function: the division and multiplication methods"
  tldr: "The final step of landing in a bucket is squeezing a large integer into the bucket-number range, and the way you squeeze directly decides the quality of the spread. This step compares the two classic squeezes — the division method and the multiplication method — and runs the neighboring keys 21, 22, 23 through both, to see whether they scatter or bunch together."
  body: >-
    A hash function works in two steps: first turn the key into an integer (for a string, accumulate character by character), then squeeze it into the bucket range 0 to m−1. There are two classic squeezes. The division method: the bucket number is the hash value mod m. The trap is the choice of m — when m is a power of two, the modulo keeps only the low bits, and however random the high bits may be, they are thrown away. That is why
    CLRS recommends choosing m as a prime far from a power of two, so that every bit takes part.


    The multiplication method: take a constant A between 0 and 1, multiply the hash value by A and keep the fractional part, then multiply by m and round down. It is not picky about m — m may be a power of two, which is convenient for bit operations — because it mainly reads the high-order information, complementary to the division method. A worked example: with m = 8 and A ≈ 0.618, key 21 gives 21 ×
    0.618 ≈ 12.978; the fraction 0.978 × 8 = 7.82, so it lands in bucket 7. Key 22 gives ≈ 13.596; 0.596 × 8 = 4.76, bucket 4. Key 23 lands in bucket 1. Neighboring keys get scattered — exactly the effect we want.


    What real systems do more often is first run an integer hash that mixes thoroughly enough, then take the modulo by a power of two: fast, with an acceptable spread. Java's [[HashMap]] takes this compromise route.
  derivation: original
