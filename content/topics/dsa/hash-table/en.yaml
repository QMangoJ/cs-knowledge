- id: hash
  title: "Hash functions: turning a key into a position"
  tldr: "The last step promised to turn names into indexes; this step shows how the transformation actually works — the hash function computes a large integer from the key, then takes it modulo the bucket count to land in a bucket. Follow Alice through one computation to see which bucket she lands in, then pin down the three hard requirements of a good hash function."
  body: |-
    The hash function computes Alice into the large integer 63350371. Divide by the bucket count, 8, and take the remainder — 63350371 mod 8 is 3 — which gives bucket 3, and her grade goes into bucket 3. A lookup runs the identical computation once more and goes straight to bucket 3 to fetch it.

    A good hash function has three hard requirements: the same key must always compute to the same result, or what you stored can never be found again; the spread must be even — keys as similar as user1001 and user1002 must not pile into the same bucket; and it must compute fast, because every single operation pays this cost first.

    The modulo step cannot be skipped: a hash value can run into the billions while there are only 8 buckets — without the modulo there is nowhere to put anything. The modulo keeps only some of the bits, so every bit has to be thoroughly mixed in; otherwise patterned keys collide in droves (the next section expands on this).
  derivation: original
  sources:
  - ref: mit-6006
    locator: Hashing lectures
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: A hash function maps keys to positions in the table
    status: verified
    checkedBy: Checked by Muse
    checkedAt: 2026-11-07
    note: Verified against the primary source on 2026-11-07; see docs/curriculum-audit.md
  canvas:
    kind: datastate
    structure: array
    caption: hash("Alice") % 8 = 3
    rows:
