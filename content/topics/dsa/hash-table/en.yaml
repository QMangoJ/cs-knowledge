      cells:
      - v: ""
        sub: "0"
      - v: ""
        sub: "1"
      - v: ""
        sub: "2"
      - v: Alice
        mark: found
        sub: "3"
      - v: ""
        sub: "4"
      - v: ""
        sub: "5"
      - v: Carol
        sub: "6"
      - v: ""
        sub: "7"
      pointers:
      - at: 3
        label: get
    aux:
    - label: JS
      items:
      - new Map()
      - map.set(k, v)
      - map.get(k)
  log:
  - mode: Lookup
    event: "Everyday use boils down to one line: fetching a value by key in a single step is the hash table's job; when you need order or ranges, switch to a balanced tree or a skip list."
level: 基础
minutes: 28
prereq: []
objectives:
- Explain how the hash function, collisions, and the load factor relate
- Compare the trade-offs of separate chaining and open addressing
- Explain why resizing is amortized O(1)
aiLink: Lookups are everywhere in AI pipelines, but keep three kinds apart — a tokenizer mapping tokens to ids is a true hash table (the vocabulary dict); the embedding layer uses an id to index a row of the vector matrix directly — also an O(1)
  lookup, but with no hash function and no collisions, so it is not a hash table; feature hashing (the hashing trick) uses a hash function to pin a feature directly to a column index, which is true hashing. Understand collisions and resizing, and you understand why hash-based lookups are O(1) on average — and how they degrade in the worst case.
design:
- mechanism: The load factor decides the average chain length and probe length — with chaining the average chain length is roughly the load factor, and with open addressing, under the uniform-hashing assumption, the expected number of probes for an unsuccessful search is about 1 / (1 − load factor). Both steepen as the load rises, and past about 0.7 the slope grows markedly.
  problem: Too empty a table wastes memory; too full, and every operation pays for collisions — and the fuller it gets, the more easily it keeps filling. An implementation needs a trigger point that balances memory waste against collision cost automatically, with no one watching it.
  choice: Set the threshold in the 0.7 to 0.75 band (Java's HashMap defaults to 0.75; this lesson's lab uses 0.7). Cross the line and the bucket count doubles and the whole table is rehashed — an occasional linear carrying job buys the low load back.
  tradeoff: A lower threshold resizes too often and uses memory poorly; a higher one makes long chains and long probes the norm. Doubling also brings a one-off latency spike, so latency-sensitive scenarios estimate the capacity and build the table big enough in one go to dodge it.
  root: The root is the shape of the probability curve — collisions do not worsen linearly with load but accelerate in the high-load region, so the threshold must sit before the bend. The doubling strategy keeps the total carrying work across all resizes bounded by a geometric series, so the amortized cost stays constant.
- mechanism: A randomly seeded hash makes the hash value depend jointly on the key and a process-level random seed — stable and self-consistent within one process, different landing spots for the same key in different processes, and an attacker cannot precompute offline a batch of keys guaranteed to collide.
  problem: A deterministic hash is publicly computable, so an attacker can mass-produce same-bucket keys and forcibly turn the average O(1) into O(n) one-by-one comparisons — a hash-flooding denial of service that the server has no way to spot in advance.
  choice: Standard libraries switched to randomly seeded hashes (such as SipHash), with the seed living only in process memory and regenerated at every start; on top of that, treeification past a chain-length cap and limits on the number of parameters per request provide defense in depth.
  tradeoff: The price is no reproducibility across processes — the same key has a different bucket order in two processes, so any logic that depends on hash order breaks, production issues are harder to reproduce locally exactly as they happened, and debugging needs its own trail of log clues.
  root: The fundamental tension is that a hash function must be deterministic enough for lookups to stay self-consistent, yet unpredictable to an opponent. Randomness takes predictability out of the function and keeps it under separate guard — consistency is retained inside the process, unpredictability faces outward.
- mechanism: Open addressing puts all elements in one contiguous array and probing walks along the array in order, so the cache hit rate is naturally high. Chaining hangs nodes off each bucket; the nodes are scattered across the heap, and walking a chain is pointer chasing, one cache miss after another.
  problem: Collision handling must be correct (a deletion must not cut off someone else's probe chain) and fast (on a modern CPU, the main cause of slowness is often cache misses rather than the number of comparisons) — and the two goals frequently pull against each other.
  choice: Open addressing stays correct with tombstones — a deletion only marks, never empties, and lookups step over tombstones and continue. Chaining stays correct by unlinking directly, with treeification as a backstop for the worst chain length. Each implementation chose deletion semantics that match its own storage layout.
  tradeoff: Tombstones pollute the probe chains and can only be cleaned out periodically by rehashing; chaining pays in pointer memory and cache behavior instead. Neither deletion is free — each simply books the cost in a different ledger, to be hedged according to the scenario.
  root: The root is that storage layout decides access semantics — in a contiguous array, an empty slot is itself the signal that terminates a lookup, so it cannot be emptied casually; in a linked structure, a position carries no semantics, so deleting really makes it disappear. The difference in semantics comes from the difference in layout.
quiz:
- q: Why does a hash table slow down when the load factor gets too high?
  options:
  - Out of memory
  - Collisions multiply; chains and probe sequences lengthen, and the average lookup takes more steps
  - The hash function gets slower
  - The CPU throttles down
  answer: 1
  explain: Load factor = number of elements / number of buckets; the resize threshold varies by implementation — Java's HashMap, for instance, uses 0.75.
- q: Resizing moves all n elements into the new table one by one — why is insertion still amortized O(1)?
  options:
  - Because moving is free
  - Each resize doubles the capacity, so the carrying cost is spread thin over the many O(1) insertions that follow
  - Because it uses a GPU
  - Because nothing actually moves
  answer: 1
  explain: Sum the geometric series — the total carrying work is less than 2n, which spread across n insertions is a constant.
- q: Why can't open addressing delete an element by simply emptying its slot?
  options:
  - It would get slower
  - It would cut the probe chains of elements inserted later, making them unfindable; a tombstone marker is required
  - It would leak memory
  - The hash values would change
  answer: 1
  explain: Break the probe chain, and the elements that depend on that chain can no longer be found — hence the tombstone.
