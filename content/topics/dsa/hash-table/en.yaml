- id: playground
  title: "Hands-on: the hash table playground"
  tldr: "The rules are covered — now it is your turn: insert with the preset key sets by hand and watch collisions chain up and resizing pull the probe counts back down. Compute each key's landing spot by hand first, then single-step to check it; the step where your prediction fails is exactly where a misunderstanding is hiding."
  body: >-
    Try three key sets in the lab: in the chain-collision set, every key is 0 mod 8, so each new key slides forward past the ones before it — count how the probe counts 1, 2, 3 accumulate. In the resize-triggering set, the [[load factor|负载因子]] passes
    0.7 before the 6th key is inserted, the capacity doubles, the whole table is rehashed, and the new positions are completely different from the old ones. You can also enter a set of numbers of your own: compute the hash values and landing spots by hand first, then single-step to check.


    Why does the chain-collision set scatter after resizing? Because the modulus changes from 8 to 16, and keys that were congruent mod 8 are separated by the higher bits — exactly why a power-of-two bucket count is so sensitive to the low bits. Now deliberately enter a set of keys that are all congruent, and watch the probe count grow linearly with the occupied run. Write your prediction down before you single-step: the step where the prediction fails exposes precisely your misunderstanding of the probing rule or the resize timing.
  derivation: original
  sources: []
  log: []
