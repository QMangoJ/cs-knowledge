steps:
- id: why
  title: Why do we need hash tables?
  tldr: "Set the scene first — looking up one person's grade by name, a plain array leaves you scanning from the start, and with enough people that becomes unusably slow. This step first does the math on scanning, then points to the array's one real talent — fetching by index in a single step. What a hash table does is move that talent onto string keys."
  body: |-
    With a million users, comparing names one by one means up to a million comparisons in the worst case and half a million on average. That is O(n): ten times the data, ten times the lookup time — at a hundred million users, nobody can afford to wait.

    Reading an array by index takes a single step, because the position is computed directly: base address plus index times element size gives the target address, no comparisons needed. A hash table brings that same route to string keys — it turns the name into an index too. This route was forced into existence by the need to look things up by name: a compiler looks up symbols by identifier, a database looks up records by key, and none of those keys arrive as ready-made integer indexes. So people set out to study how any key can be turned, stably, into an index — and the hash function is what that research produced.

    A small worked example: 8 buckets holding Alice, Bob, and Carol. Ideally each person gets a bucket of their own, and looking anyone up costs one hash plus one comparison. In reality, two people can compute to the same bucket — and that is where all of a hash table's complexity comes from: collision handling and resizing, not the lookup itself. An array is the special case where the key happens to be an integer index; a hash table is the generalization that forcibly turns arbitrary keys into indexes.
  derivation: original
