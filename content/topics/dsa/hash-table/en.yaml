      cells:
      - v: Node A
        mark: active
        sub: "pos 0"
      - v: ""
        sub: ""
      - v: k1
        mark: new
        sub: "to B"
      - v: ""
        sub: ""
      - v: Node B
        mark: active
        sub: "pos 4"
      - v: ""
        sub: ""
      - v: k2
        sub: "to A"
      - v: ""
        sub: "wraps to A"
      pointers:
      - at: 2
        label: Clockwise, meets B first
      - at: 6
        label: Past B, wraps back to A
    aux:
    - label: The contrast
      items:
      - "Modulo: add one machine, almost everything moves"
      - "Ring: only the affected arc moves"
  log:
  - mode: Scaling out
    event: "Hashing has traveled from one machine to many: with the mapping on a ring, machines joining or leaving only affect the arc where it happened."
- id: engineering
  title: Hash tables in everyday engineering
  tldr: "Finally, back to daily use: caching, deduplication, and counting all run on hash tables underneath. This step matches each use to its place, then names the boundaries — no preserved order, no range queries, and a key that gets mutated is lost forever — so you do not reach for it for a job it should not do."
  body: >-
    Using a Map in JS for caching, deduplication, or counting is using a hash table. Map iterates in insertion order, but that is an extra guarantee from the language specification, not a native property of hash tables. Object can serve as a dictionary too, but its keys are converted to strings; Map preserves the key's original type.


    A hash table guarantees no order: it cannot answer who comes next, which key is the smallest one greater than a given key, or how many keys fall inside an interval. When you need range queries or nearest-value lookups, reach for a balanced tree or a skip list. Before choosing a structure, list the set of operations it must support.


    A key has to hash stably: when an object is used as a Map key, comparison is by reference, so two object literals with identical contents are different keys; and if a mutable object already in the table has a field that feeds into the hash changed, it can never be found again — the most common hash-table
    bug. For an in-memory cache, also keep a threshold on the [[load factor|负载因子]], monitor the longest chain, and pair it with an eviction policy — a hash table is responsible for storage and retrieval, not for expiry.
  derivation: original
  sources:
  - ref: mit-6006
    locator: Hashing lectures
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: Hash tables suit exact lookups and do not support ordered operations
    status: verified
    checkedBy: Checked by Muse
    checkedAt: 2026-11-07
    note: Verified against the primary source on 2026-11-07; see docs/curriculum-audit.md
  canvas:
    kind: datastate
    structure: array
    caption: 'map.get("Alice"): one hash computation, straight to bucket 3'
    rows:
