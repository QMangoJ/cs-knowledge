- id: matrix-chain
  title: 矩阵链乘：按最后一次切分枚举
  tldr: 状态从前缀变成区间，转移枚举最后一次乘法的位置，计算顺序必须按区间长度从小到大，这是区间 DP 的标志。
  body: '矩阵链乘问的不是乘积值，而是加括号的顺序。三个矩阵维度依次是 10 乘 100、100 乘 5、5 乘 50，先乘前两个的代价是 10 乘 100 乘 5 等于 5000，再乘第三个是 10 乘 5 乘 50 等于 2500，合计 7500；先乘后两个的代价是 100 乘 5 乘 50 等于 25000 再加 10 乘 100 乘 50 等于 50000，合计 75000。同一条链只换括号就差了十倍，维度越悬殊差距越大，这不是常数优化而是数量级问题。

    状态按区间定义，dp[i][j] 是第 i 到第 j 个矩阵连乘的最小代价，转移枚举最后一次乘法的位置 k，把区间切成 i 到 k 与 k 加 1 到 j 两段，代价是两段的最优加上合并成本，合并成本由三段维度相乘给出，对所有 k 取最小。单个区间的转移要试遍内部每个切分点，所以总复杂度是 O(n 的三次方)，状态数是平方级、每个状态的转移是线性级，账正好对得上。

    计算顺序是这题的难点，dp[i][j] 依赖更短区间的答案，所以要按区间长度从小到大填表，先算长度 2 再算长度 3，沿对角线方向推进，随手按行填会读到空格。它与背包的差别在于子问题是区间而不是前缀，识别出状态可以是区间，是从序列 DP 迈向区间 DP 的标志，石子合并与最优二叉搜索树都是同一家族。'
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 15.2 Matrix-Chain Multiplication
    claim: 矩阵链乘用区间状态与枚举最后切分点的转移求最优括号化，须按区间长度递增的顺序计算
