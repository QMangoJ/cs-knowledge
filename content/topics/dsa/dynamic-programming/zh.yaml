- id: design
  title: 拿到一道题：四步设计法
  tldr: 写不出递推循环别硬凑：先一句话定义清楚状态格子代表什么，写出能跑的暴力递归再顺手加上缓存，先把逻辑写对，最后才改填表和压空间。
  body: |-
    遇到新题照着固定四步走：第一，定状态，用一句话说死 dp 的每个维度代表什么、答案住在哪一格；第二，写转移，站在最后一格问「最后一步有几种选择」（拿不拿、选谁结尾、最后从哪切一刀），每种选择写一项；第三，填边界，把空集、长度 0 和 1 的初始格子填对；第四，排顺序，确保算新格时依赖的旧格都有值了。要是一时绕不清循环顺序，先写暴力递归把答案算出来（递归函数本身就是状态定义），再给它加个表变成[[记忆化]]——记忆化和递推只是同一套状态的两种执行方式，先写对，最后再谈滚动数组压空间。

    最常翻车的三个坑提前盯住：第一是状态漏维度，比如转移还依赖「上一次选了谁」却没写进下标，上下格就会串味；第二是边界漏填整行整列，像[[编辑距离]]第一行第一列代表和空串互变的代价（0、1、2、3…），只填 dp[0][0] 会让全表错位；第三是答案取错格，背包取右下角 dp[n][W]，[[LIS]] 却要扫整张表取最大值，交付前一定要回到第一句状态定义核对答案住在哪。

    动键盘前还有个土办法极好使：拿纸笔把 n 等于 2 或 3 的小表格手填一遍，顺一遍每个格子从哪几个邻居算过来，填对了再敲代码。
  derivation: original
  sources:
  - ref: mit-6006
    locator: 动态规划讲义（状态与子问题设计）
    claim: DP 设计流程为定义子问题、猜测选择、写出递推、确定计算顺序与复杂度
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
