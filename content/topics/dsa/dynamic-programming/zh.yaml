- id: knapsack-state
  title: 背包问题：状态怎么定义
  tldr: 状态 = 「考虑到前 i 件物品、容量还剩/已用 c 时的最优价值」；转移 = 这件拿还是不拿，两者取大。
  body: '0/1 背包，n 件物品各有重量 w 与价值 v，背包容量 W，每件至多拿一次，求最大总价值。贪心不行（按性价比拿会被大件堵死），但 DP 可以。定义 dp[i][c] 为只考虑前 i 件、容量上限 c 时的最大价值。看第 i 件，不拿它，答案是 dp[i−1][c]；拿它，前提是 c 不小于 w_i，答案是 dp[i−1][c−w_i] 加 v_i。取两者最大值就是转移方程；边界 dp[0][*] 等于 0。状态总数 n 乘 W，每个状态 O(1) 转移，总复杂度 O(nW)。

    拿三个物品走一遍状态的含义，容量 W 等于 5，物品是重量 2 价值 3、重量 3 价值 4、重量 4 价值 5。dp[1][5] 只看第一件，拿得下，值 3。dp[2][5] 看前两件，不拿第二件是 3，拿第二件是 dp[1][2] 加 4 等于 7，取大得 7，对应拿下前两件总重正好 5。dp[3][5] 再比较，不拿第三件是 7，拿第三件是 dp[2][1] 加 5，容量 1 时前两件都拿不了值 0，结果 5，取大仍是 7。

    这个小例子说明状态的两个维度缺一不可，只记容量不记考虑到第几件，就会把同一件物品重复计算。还要留意 W 出现在复杂度里意味着它是伪多项式，W 的数值大到 10 的 9 次方时表根本开不出来，这时要换按价值定义状态或改用近似算法，状态维度的选择直接决定这道题还算不算得动。'
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 15/16 背包问题讨论（0/1 与分数的对比）
    claim: 0/1 背包用按物品与容量定义的 DP 状态求最优，贪心对 0/1 背包不适用
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
