title: 动态规划：把重复子问题存下来
summary: DP 不是某个算法，而是一种视角：问题能拆成重叠的子问题、且子问题的最优能拼出全局最优时，把子答案存下来避免重复计算。
premise: 以斐波那契、0/1 背包与最长递增子序列为例。
position: >-
  本课是「记住子问题的答案」板块的唯一一站，它接在二叉搜索树每比较一次便排除一整棵子树的拆分方式之后，指出当拆出的子问题彼此重叠时光拆不存只会反复重算。学完你能先用最优子结构与子问题重叠两道检查判断一道题能否用 DP，并为 0/1 背包写出按物品与容量定义的状态和拿与不拿取大的转移。
bridge:
  prev: >-
    上一课平衡树靠旋转把树高锁在对数级以免操作退化，本课则盯住递归树的规模失控：斐波那契的朴素递归正因不存表，才会把 fib(3) 这类子问题算上许多遍。
overview:
- key: 一句话总结
  value: 状态定义 + 转移方程 + 边界 + 计算顺序，四件套缺一不可
- key: 两个前提
  value: 最优子结构（大问题的最优含子问题的最优）+ 子问题重叠（同一子问题被反复求解）
- key: 两种实现
  value: 自顶向下记忆化（递归 + 缓存）与自底向上递推（按顺序填表），等价
- key: 与分治区别
  value: 分治的子问题互不重叠（归并排序）；重叠了就是 DP 的地盘
- key: 与贪心区别
  value: 贪心每步只选一个最优、不可撤销；DP 把所有候选子状态都算过再取最优
- key: 复杂度
  value: 状态数 × 每个状态的转移成本；状态设计错了，再优化也白搭
visual: datastate
logColumns:
- key: mode
  label: 当前状态
- key: event
  label: 发生了什么
steps:
- id: why
  title: 从斐波那契看清「重复」有多贵
  tldr: fib(n) 的朴素递归会把 fib(n−2) 算指数次；画出递归树就知道浪费在哪。
  body: 'fib(5) 会调用 fib(4) 与 fib(3)，fib(4) 又调用 fib(3)，同一子问题在递归树里出现许多次，总调用量随 n 指数增长，不是算法思路错，是同一份答案被反复重算。只要把算过的子答案存进一张表（记忆化），每个子问题只算一次，总成本立刻降到 O(n)。DP 的全部魔力就这一句，识别重叠的子问题，并保证每个只解一次。

    把重复的账算到具体数字，fib(5) 的递归树里 fib(3) 出现 2 次、fib(2) 出现 3 次、fib(1) 与 fib(0) 各出现多次，节点总数约按 1.6 的 n 次方量级增长，n 到 50 时朴素递归的调用量已经大到跑不完，而不同的子问题其实只有 n 加 1 个。记忆化的改法只有两处，算之前先查表，表里有就直接返回，算完之后把结果存回表里再返回，递归结构一字不改，于是每个子问题真正计算一次，查表是 O(1)，总代价变成 O(n)，额外付出的只是一张 n 大小的表。

    这里要分清，省下的不是常数倍而是指数到线性的量级跨越，且跨越的来源单一，就是不再重算。反过来若子问题互不重叠，比如归并排序的两半各算各的，存表纯属浪费内存，所以 DP 的第一课就是先确认重复真的存在，再谈怎么存、按什么顺序算。'
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 15 Dynamic Programming（记忆化与最优子结构）
