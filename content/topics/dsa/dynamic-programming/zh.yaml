steps:
- id: why
  title: 从斐波那契看清「重复」有多贵
  tldr: 朴素递归慢，不是思路错了，而是把同一个小问题算了几百万遍；只加一张表记下算过的答案，就能把指数级死循环拉回线性时间。
  body: |-
    先看 fib(5) 展开出来的递归树：算 fib(5) 要调 fib(4) 和 fib(3)，算 fib(4) 时又会去调一遍 fib(3) 和 fib(2)。数一数具体数字，fib(3) 被算了 2 次、fib(2) 被算了 3 次，越往下重复越凶，整棵树的调用次数大约按 1.6 的 n 次方狂涨。到了 fib(50)，调用量已经飙到千亿量级，程序直接卡死。

    可你冷静数一数，从 fib(0) 到 fib(50)，真正互不相同的子问题其实只有 51 个（也就是 n 加 1 个）。问题根本不在计算本身，而在于递归函数「转头就忘」，每次从不同路径走到 fib(3) 都要老老实实重头算一遍。

    改法只需在原递归里插进两句话：进函数先查表，表里记过就直接返回；算完之后把结果顺手抄进表里（这就是[[记忆化]]）。递归骨架一字不用改，每个子问题真正只算 1 次，查表是 O(1)，总耗时瞬间从指数级掉成 O(n)，付出的只是长度为 n 的一张小表。记住，如果子问题压根不重复（比如归并排序的左右两半），存表纯属白占内存——先看见重复，再谈 [[DP]]。
