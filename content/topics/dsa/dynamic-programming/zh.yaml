- id: knapsack-fill
  title: 填表：顺序为什么重要
  tldr: dp[i] 只依赖 dp[i−1]，所以按 i 从小到大算即可；空间还能压成一维，但容量必须倒着遍历。
  body: '自底向上实现时，转移只引用上一行，所以从 i 等于 1 算到 n 一定没问题（需要的值都已算出）。进一步，第 i 行只用到第 i−1 行，表可以压成一维数组，dp[c] 表示当前考虑完已处理物品、容量 c 的最优。一维化有个著名陷阱，若 c 从小到大遍历，同一件物品会被本轮重复使用（变成完全背包）；必须让 c 从大到小遍历，保证每个 c 引用的是上一轮的值。这一行顺序，就是 0/1 与完全背包在代码上的全部分界。

    把二维表的头两行实际填出来体会顺序，容量从 0 到 5，第一件重量 2 价值 3，第一行在容量小于 2 时全是 0，从容量 2 起全是 3，因为只有一件可拿。第二行看第二件重量 3 价值 4，容量 5 处比较不拿的 3 与拿的 dp[1][2] 加 4 等于 7，填 7。填每一格时只回头看上一行，依赖方向全部朝上，所以从上到下逐行算不会遇到空格，这就是计算顺序由依赖关系决定的具体含义。

    一维化之后依赖变成同一行内的左右关系，倒序遍历保证读到的 dp[c 减 w] 还是上一行的旧值，正序则会读到本行刚写的新值，等于允许当前物品再拿一次。把内层循环改成正序并非写错，它精确地对应完全背包，也就是每件物品不限件数的版本，两种背包在代码上只差一个遍历方向，理解了依赖就理解了这行代码为什么不能随手改。'
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 15 自底向上计算顺序
    claim: DP 表的计算顺序须保证转移引用的子问题先被求解
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
