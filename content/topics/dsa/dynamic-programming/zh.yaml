- id: lcs
  title: 最长公共子序列：二维表完整走例
  tldr: 状态是两前缀的 LCS 长度，末尾相同就左上加 1，不同就取上与左的较大者，走完 abc 与 ac 的整张表答案是 2。
  body: '最长公共子序列 LCS 要求在两个字符串里按原顺序各挑出一串相同的字符，不要求连续。状态是 dp[i][j] 表示 A 的前 i 个字符与 B 的前 j 个字符的 LCS 长度，转移分两种，末尾字符相同则 dp 等于 dp[i 减 1][j 减 1] 加 1，不同则取 dp[i 减 1][j] 与 dp[i][j 减 1] 的较大者，边界是任一串为空时答案为 0。

    拿 A 等于 abc、B 等于 ac 走完整张表。i 等于 1 是 a，j 等于 1 是 a 相同得 1，j 等于 2 是 c 不同，取左与上的大者得 1。i 等于 2 是 b，与 a、c 都不同，这一整行照抄上方最大值保持 1。i 等于 3 是 c，j 等于 1 时取大者 1，j 等于 2 时末尾 c 相同，取 dp[2][1] 加 1 等于 2。最终 dp[3][2] 等于 2，对应公共子序列 ac，每一步的来历都能在表里指出来。

    还原具体子序列要从右下角倒着走，相同就收下该字符并往左上，不同就往值更大的方向走。LCS 与编辑距离是同一张表的两种读法，前者只数匹配，后者把增删改都计价，diff 工具展示的两份文本差异，底层正是这个家族在算哪些行该保留、哪些行该增删。'
