- id: ai-link
  title: 与 AI 工程的连接
  tldr: 解码里的 beam search 是近似版 DP 思想；强化学习的价值迭代就是字面意义的 DP。
  body: '序列生成不能枚举全部句子（指数级），beam search 每步只保留得分最高的 k 条前缀，相当于把 DP 表按宽度截断、用近似换可行性（它与 Viterbi 的关系是，Viterbi 是在隐马尔可夫模型上做精确 DP，beam 是它的工程近似）。强化学习更直接，贝尔曼方程就是转移方程，价值迭代就是自底向上填表。序列对齐（注意力之前的时代）、语音识别解码、拼写纠正，也都是编辑距离家族。当你能把一个工程问题写成状态加转移，一半的解法已经在手里了。

    再把束搜索与精确 DP 的边界说清，束宽 k 固定时它丢弃的前缀永远不会回来，所以结果不保证全局最优，这与束搜索是贪心截断的定版说法一致。k 越大越接近精确解但计算与显存也随之上涨，线上系统是在延迟预算里选 k，而不是在正确性里选。Viterbi 则不同，它在每个时间步保留每个隐状态的最优前缀，状态数固定时是精确求解，语音与序列标注至今仍在用它。

    强化学习里还有一层对应，策略评估是已知转移时反复套贝尔曼方程填表，价值迭代则在填表时顺带取最优动作，两者都是字面意义的自底向上 DP，只是状态来自环境而不是题目。把这三件事放在一起看，DP 在 AI 里既是精确算法也是近似框架的设计母版，能写出状态与转移，就能判断该用精确求解还是该截断。'
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 15（Viterbi 类序列解码的思想背景）
    claim: 基于状态转移的精确动态规划（如 Viterbi）是序列解码的标准方法，束搜索是其实用的近似
    status: verified
