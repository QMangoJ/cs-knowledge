prereq:
- dsa/binary-search
- dsa/merge-quick-sort
objectives:
- 判断一道题是否满足 DP 的两个前提
- 独立写出 0/1 背包的状态、转移与一维优化（含倒序原因）
- 用四步法为序列问题设计状态与转移
aiLink: beam search 的近似 DP、强化学习的贝尔曼方程、序列对齐与解码——DP 是 AI 工程里最隐形的基本功。面试里它也是出现频率最高的题型之一，状态设计能力就是这里的分水岭。
quiz:
- q: 使用动态规划的两个前提是？
  options:
  - 数据有序 + 可以二分
  - 最优子结构 + 子问题重叠
  - 可以贪心 + 数据量小
  - 递归深度有限
  answer: 1
  explain: 子问题的最优能拼出全局最优，且同一子问题被反复求解，存表才有意义。
- q: 一维 0/1 背包为什么容量要倒序遍历？
  options:
  - 为了让数组更好看
  - 正序会引用本轮刚更新的值，导致同一物品被重复使用（变成完全背包）
  - 倒序速度更快
  - 没有区别，随便选
  answer: 1
  explain: 倒序保证 dp[c−w] 还是「未考虑当前物品」时的值，每件物品至多用一次。
- q: 记忆化递归与自底向上递推的关系是？
  options:
  - 完全不同的两种算法
  - 同一状态定义的两种执行方式：前者按需计算，后者按依赖顺序全算
  - 递推一定更慢
  - 记忆化不需要定义状态
  answer: 1
  explain: 两者共享状态与转移方程；记忆化只算被用到的状态，递推按顺序算全部状态。
