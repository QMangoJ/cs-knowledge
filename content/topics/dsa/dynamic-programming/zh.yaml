    event: "区间 DP 顺序立好：枚举最后切分点，按区间长度从小到大沿对角线填表。"
- id: space-compression
  title: 空间压缩：什么时候能把表压成一行
  tldr: 表能不能压小，全看转移公式回头引用几行；不过省空间的代价是丢失历史记录，压完就没法顺着表倒推具体选了哪几件物品或字符。
  body: |-
    空间压缩的判据只有一条：看转移到底引用前面哪几行。背包每行只看上一行，留两行交替甚至压成一维都行；[[编辑距离]]与 [[LCS]] 引用左、上、左上三个邻居，同样用[[滚动数组]]就能搞定，不过压成一维时记得用临时变量把左上角旧值先存下来，免得更新当前格时把它盖掉——漏存它是最常见的压缩 bug。斐波那契更省，只看前两项，两个变量就够了。

    矩阵链乘则压不动，因为算长区间要枚举里面所有切分点，任意长度的短区间都会被翻出来引用，整张三角表必须留着。

    还要注意一笔容易忽略的代价：压缩不是白捡的。把前面几行覆盖掉之后，表里只剩最后一个数字，要是题目不仅问最大价值 7、还让你打印具体拿了哪几件物品或还原出 ac 子序列，光看被盖掉的一维表根本倒推不回去——要还原具体方案，要么留着整表，要么额外存一份决策记录。先写对逻辑，再谈省空间。
  derivation: original
  sources:
  - ref: mit-6006
    locator: 动态规划讲义（计算顺序与空间优化）
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: DP 的空间可按转移的依赖范围压缩，仅依赖上一层状态时可用滚动数组，但会失去由表回溯具体解的能力
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: 依赖形状决定压法，不是每张表都能压
    rows:
    - label: 背包与编辑距离
      cells:
      - v: 只引上一行
      - v: 可滚动
        mark: found
    - label: 斐波那契
      cells:
      - v: 只引前两项
      - v: 两个变量
        mark: found
    - label: 矩阵链乘
      cells:
      - v: 引任意短区间
      - v: 压不动
        mark: active
  log:
  - mode: 空间
    event: "压缩判据收清：依赖形状决定能压多少，压掉旧行后不能靠表直接回溯方案。"
- id: state-compression
  title: 状态压缩引子：用一个整数装下一组开关
  tldr: 当状态是一组「选没选、去没去过」的开关时，把开关压成二进制整数的每一位就能继续建表；但状态数按 2 的 n 次方狂涨，n 到 20 左右就到头了。
  body: |-
    遇上棋盘哪几格放了棋子、集合里哪些元素选没选这类「一组开关」的状态怎么办？n 个开关一共 2 的 n 次方种组合，把一种组合直接压成一个 n 位二进制整数，某一位是 1 就代表选中，这就是状态压缩 [[DP]]。转移时不用拆开成数组，直接用位运算按位与检查冲突、用 [[lowbit]] 取出最低位 1，全都是 O(1) 操作。

    [[旅行商问题]]是它的招牌应用：用 dp[S][i] 表示「已访问城市集合是 S、目前停在城市 i 时的最短路」。转移时挑一个还没进 S 的城市 j 走过去，把 S 的第 j 位置成 1 得到新集合。

    写之前务必先估算状态数量级：总状态数是 2 的 n 次方乘 n。n 到 20 左右还能在秒级算完；只要 n 涨到 30，状态表先把内存爆掉。这条硬天花板提醒我们，算得过就编码建表，算不过就趁早换贪心、近似算法或启发式搜索。
  derivation: original
  sources:
  - ref: mit-6006
    locator: 动态规划讲义（状态压缩与旅行商问题）
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: 旅行商问题可用按访问集合编码的状态压缩 DP 求解，状态数为 2 的 n 次方乘 n，仅适用于小规模
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
