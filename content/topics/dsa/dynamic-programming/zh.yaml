- id: space-compression
  title: 空间压缩：什么时候能把表压成一行
  tldr: 判据只有一条，看转移引用哪几行哪几列；只引上一行就能滚动，但压掉维度后具体方案就无法再靠表回溯。
  body: '空间压缩的判据只有一条，看转移到底引用哪几行哪几列。背包的每一行只引用上一行，所以留两行滚动甚至压成一维都安全，编辑距离与 LCS 引用左、上、左上三个邻居，同样只需保留上一行与当前行，滚动数组足够，压一维时要单独存左上角那个值，因为它在更新当前行时会被覆盖，漏存它是最常见的压缩 bug。

    但压缩不是免费的，压掉行维度后就无法再靠表回溯出具体方案，背包要输出拿了哪几件、LCS 要输出子序列本身时，要么保留整表，要么在压缩的同时另存决策记录，两者只能选其一。斐波那契是另一个极端，只引用前两项，两个变量就够，连一行数组都不需要，这说明压缩的下限同样由依赖形状决定，不是由愿望决定。

    矩阵链乘则压不动，它的转移要枚举切分点，任意更短区间都会被引用，必须保留整张三角表。还有一类状态依赖跨越多行或带全局约束，硬压会读到已覆盖的错值。结论是，先看依赖形状再决定压法，省空间永远排在写对之后，这也呼应了设计一节把空间优化放到最后一步的顺序，先有对的整表，再谈能不能压。'
  derivation: original
  sources:
  - ref: mit-6006
    locator: 动态规划讲义（计算顺序与空间优化）
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: DP 的空间可按转移的依赖范围压缩，仅依赖上一层状态时可用滚动数组，但会失去由表回溯具体解的能力
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
