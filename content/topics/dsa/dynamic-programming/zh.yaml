- id: design
  title: 拿到一道题：四步设计法
  tldr: 先定义状态（「dp[x] 到底表示什么」说清一句话），再写转移，再定边界与遍历顺序，最后数复杂度。
  body: '实战口诀，一是状态，一句话说清 dp 的每一个维度代表什么、答案在哪个格子里；二是转移，最后一个决策有几种可能（拿或不拿、选谁结尾、最后一步从哪来），每种写一项；三是边界，最小状态（空集、长度 0 与 1）逐个填对；四是顺序，保证转移引用的状态先算出（必要时画依赖方向）。写不出来时先暴力递归把问题解出来（递归函数 f 就是状态的定义），再给它加缓存，记忆化与递推只是同一状态的两种执行方式。最后才谈空间压缩（滚动数组），别为了省空间先把逻辑写错。

    补三个最常见的翻车点。第一是状态定义里藏了决策历史，比如 dp 还依赖上一次选了什么却没把这点写进维度，转移就会串味，这时要加维度而不是打补丁。第二是边界只填了 dp[0] 却漏了整行整列，编辑距离的第一行第一列分别代表与空串互变的代价，漏填会让全表错位。第三是答案取错位置，有的题答案在 dp[n][W]，有的要在整行取最大，比如 LIS 的答案是全表最大值，交付前要回到状态定义那句话核对答案到底住在哪个格子。

    还有一个流程建议，先在纸上把最小规模的表手填一遍，n 等于 2 或 3 就够，手填对了再写代码，能拦下绝大多数转移笔误，这也是本课每个例子都先给小数字的原因。手填时顺带把依赖箭头画出来，顺序与边界两个坑在纸面上就会自己暴露，比在调试器里追一整张错表要便宜得多。'
  derivation: original
  sources:
  - ref: mit-6006
    locator: 动态规划讲义（状态与子问题设计）
    claim: DP 设计流程为定义子问题、猜测选择、写出递推、确定计算顺序与复杂度
