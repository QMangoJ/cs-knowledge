- id: conditions
  title: 两个前提：最优子结构 + 子问题重叠
  tldr: 大问题的最优解能由子问题的最优解拼出来，且子问题会被反复用到——两条都满足才用 DP。
  body: '最优子结构，问题的最优解包含其子问题的最优解。背包里容量 c 时的最优必然建立在容量更小时的最优之上；最短路径的子路径也是最短的（Dijkstra 与 Bellman-Ford 背后也是这个性质）。子问题重叠，子问题总数是多项式级且被高频复用。若子问题互不重叠（如归并排序的两半），那是分治，不需要存表，两个前提不全满足时 DP 也用不上。

    最优子结构也有反例，最长简单路径里，大问题的最优路径经过某个点后，剩下的子路径必须避开已用过的点，子问题之间互相牵制，没法独立求最优，这正是它需要指数级搜索的原因，也是判断一个问题能不能 DP 的试金石。再看重叠的量化，背包的状态总数是 n 乘 W，朴素递归若不存表，同一对 i 与 c 会在无数条决策路径上被重复求解，存表后每个状态只算一次，复杂度从指数压到状态数乘转移代价。

    还要澄清一组近亲关系，贪心也要求最优子结构，但它只沿一个选择走到底，DP 则把每个选择都试一遍再比较，当你能证明某个选择必然最优时用贪心更省，证明不了就老实 DP。状态设计的第一关，就是把问题切成能独立求解又会被复用的子问题，切法错了，后面写得再工整也是错的。'
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 15.3 Elements of Dynamic Programming
