- id: knapsack-state
  title: 背包问题：先说清「这一格到底代表什么」
  tldr: 写对 0/1 背包的关键，是先用一句话钉死「dp[i][c] 表示只看前 i 件物品、限重 c 时能装出的最大价值」，再写出拿与不拿二选一的转移方程。
  body: |-
    先摆出题目：n 件物品各有重量 w 和价值 v，背包总限重 W，每件物品要么整件拿走、要么不拿，求总价值最大是多少。这里按性价比从高到低硬抢会被大件卡死（下一课用反例当场打脸），我们用 [[DP]] 来算总账。写代码前先用一句话钉死每个格子的含义：dp[i][c] 代表「只看前 i 件物品、背包限重 c 时，能凑出的最大价值」。

    站在这格里做决定，面对第 i 件物品其实只有两条路：不拿它，那价值原封不动等于「只看前 i−1 件、限重还是 c」的 dp[i−1][c]；拿走它（前提是容量 c 够装下 w_i），那背包先被占掉 w_i，剩下容量去前 i−1 件里找最优，总价值就是 dp[i−1][c−w_i] 加 v_i。两条路挑更大的那个，就是右边第 9 行高亮的转移方程；边界也很直白，0 件物品时价值全是 0（dp[0][*] = 0）。

    拿三件物品、总容量 W 等于 5 走一遍数字，感受两个维度为什么一个都不能少：物品分别是（重 2, 值 3）、（重 3, 值 4）、（重 4, 值 5）。算 dp[1][5] 只看第 1 件，放得下，值 3；算 dp[2][5] 看前两件，不拿第 2 件是 3，拿第 2 件则查 dp[1][5−3] 加 4 等于 dp[1][2] 加 4 等于 7，取大得 7（总重正好 5）；再到 dp[3][5]，不拿第 3 件是 7，拿第 3 件得查 dp[2][5−4] 加 5 等于 dp[2][1] 加 5，容量 1 前两件都装不下值 0，加上 5 只有 5，不如不拿，最终还是 7。顺带留个心眼：状态总数是 n 乘 W，因为 W 是数值大小，它属于[[伪多项式]]复杂度——要是容量 W 大到 10 的 9 次方，表根本开不出来，得换按价值定义状态或近似算法。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 15/16 背包问题讨论（0/1 与分数的对比）
    claim: 0/1 背包用按物品与容量定义的 DP 状态求最优，贪心对 0/1 背包不适用
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
