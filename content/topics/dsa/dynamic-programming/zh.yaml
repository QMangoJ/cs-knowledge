- id: state-compression
  title: 状态压缩引子：用一个整数装下一组开关
  tldr: n 个开关编码成一个 n 位整数就是一种状态，旅行商是招牌应用，状态数指数增长划定了它只能算 n 在 20 上下的问题。
  body: '有些问题的状态天生是一组开关，比如棋盘每格放没放、集合里每个元素选没选，n 个开关就是 2 的 n 次方种组合。可以把一种组合直接编码成一个 n 位二进制整数，位是 1 表示选中，这就是状态压缩 DP。转移时用位运算枚举子集或检查相邻与冲突，常见的有取出最低位 1 的 lowbit 技巧与按位与判断两个集合是否相交，这些操作都是常数级的。

    旅行商问题是它的招牌应用，dp[S][i] 表示已访问集合是 S、当前停在 i 的最短路，转移是把一个不在 S 里的点 j 加进来。状态数是 2 的 n 次方乘 n，转移还要枚举下一个点，n 到 20 左右还能算，再大状态表先于时间爆掉，这条边界是硬性的，没有靠技巧绕过去的余地，写之前先把这笔账估完。

    它与普通 DP 的关系是状态定义方式的推广，状态不再只是几个整数下标，而可以是任何能编码的结构，能编码就能建表，能建表就能转移。代价同样直白，估算不过就趁早换贪心、近似或启发式，别等爆内存才回头，DP 家族内部也要按规模选武器，这与背包遇到大容量要换状态维度是同一种判断力。'
  derivation: original
  sources:
  - ref: mit-6006
    locator: 动态规划讲义（状态压缩与旅行商问题）
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: 旅行商问题可用按访问集合编码的状态压缩 DP 求解，状态数为 2 的 n 次方乘 n，仅适用于小规模
    status: verified
