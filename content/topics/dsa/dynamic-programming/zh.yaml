    kind: datastate
    structure: array
    caption: 精确 DP 太宽时，beam search 按得分把表截成 k 列
    rows:
    - label: 精确 DP
      cells:
      - v: 全部前缀状态
      - v: 最优保证
    - label: beam k=4
      cells:
      - v: 每步只留前 4
        mark: active
      - v: 近似最优
  log:
  - mode: 近似
    event: "工程近似取舍：束宽 k 越大越接近精确 DP，计算和显存开销也跟着涨。"
level: 进阶
minutes: 37
prereq:
- dsa/binary-search
- dsa/merge-quick-sort
objectives:
- 判断一道题是否满足 DP 的两个前提
- 独立写出 0/1 背包的状态、转移与一维优化（含倒序原因）
- 用四步法为序列问题设计状态与转移
aiLink: beam search 的近似 DP、强化学习的贝尔曼方程、序列对齐与解码——DP 是 AI 工程里最隐形的基本功。面试里它也是出现频率最高的题型之一，状态设计能力就是这里的分水岭。
design:
- mechanism: 为什么存表而不是纯递归：真正互不相同的子问题只有 n 加 1 个，纯递归却按指数次反复重算它们，存表把每个子问题锁死为只算 1 次
  problem: 递归写法逻辑本身没错，错在同一个小问题会从不同分支被反复展开：n 稍微一大，总调用次数就按 1.6 的 n 次方爆炸，fib(50) 直接跑不完。
  choice: 给递归加个缓存变成记忆化，或者按依赖顺序自底向上填表。两条路共用同一套状态和转移，记忆化只算真用到的格子，递推把所有格子一次刷齐。
  tradeoff: 用和状态总数一样大的内存换回线性或多项式时间，外加想清楚状态和顺序的心智负担；要是子问题根本不重复，这张表就是纯浪费。
  root: 总计算量该由「不同子问题的个数」决定，而不是由「递归树被叫了多少次」决定；重复调用不会生出任何新信息，DP 只是规定每个子问题只算 1 次。
- mechanism: 状态怎么定义，在写第一行循环前就已经决定这道题能不能解：总复杂度等于「状态格数 × 填一格的代价」
  problem: 状态少一个维度会丢掉关键信息导致前后串味，多一个维度表格体积立刻乘一个量级；像 0/1 背包拿容量 W 当下标是伪多项式复杂度，W 到十亿时内存直接开不出来。
  choice: 写状态前逐字确认每个维度代表什么、答案住在哪一格，优先选只看常数个邻居就能算出的切法；遇上大容量背包时，改按价值定义状态或换近似做法。
  tradeoff: 状态拆得越细通用性越强、内存越贵，拆得越粗算得越快却容易漏掉限制条件，没有哪套状态定义能一口通吃所有变体。
  root: DP 本质上就是把解题转化成在一张多维空间表里连线——空间的格子数就是状态数，转移只是格子间的箭头；先把这张表画对，再去连线写循环。
- mechanism: DP 敢把小问题的最优拼成大问题的最优，靠的是最优子结构：从全局最优解里切一刀，两边都还得是各自范围内的最优
  problem: 一旦子问题之间互相卡脖子——比如最长简单路径里后半段不能踩前半段走过的点——小问题的最优就会随前面怎么选而改变，DP 在这种题上会悄悄算错。
  choice: 动手前先过两道关：切开后两边能不能各自求最优再拼回来，同一个子问题会不会被反复撞到；两关都过才建表，过不了就老老实实退回搜索、贪心或近似。
  tradeoff: 严格过这两关会筛掉一批看起来像、实则用不了 DP 的题，换来的是不再把指数难题误当成多项式题硬啃、不在错地基上白费力气。
  root: 拼装成立的前提是子问题之间只能通过状态接口传话，不能私下共享「走过哪些点」之类的隐藏历史；隐藏耦合一出现，最优子结构就塌了。
quiz:
- q: 使用动态规划的两个前提是？
  options:
  - 数据有序 + 可以二分
  - 最优子结构 + 子问题重叠
  - 可以贪心 + 数据量小
  - 递归深度有限
  answer: 1
  explain: 子问题的最优能拼出全局最优，且同一子问题被反复求解，存表才有意义。
- q: 一维 0/1 背包为什么容量要倒序遍历？
  options:
  - 为了让数组更好看
  - 正序会引用本轮刚更新的值，导致同一物品被重复使用（变成完全背包）
  - 倒序速度更快
  - 没有区别，随便选
  answer: 1
  explain: 倒序保证 dp[c−w] 还是「未考虑当前物品」时的值，每件物品至多用一次。
- q: 记忆化递归与自底向上递推的关系是？
  options:
  - 完全不同的两种算法
  - 同一状态定义的两种执行方式：前者按需计算，后者按依赖顺序全算
  - 递推一定更慢
  - 记忆化不需要定义状态
  answer: 1
  explain: 两者共享状态与转移方程；记忆化只算被用到的状态，递推按顺序算全部状态。
