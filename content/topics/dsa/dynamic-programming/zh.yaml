    - label: dp[i][c]
      cells:
      - v: = 两者取 max
        mark: found
  log:
  - mode: 状态
    event: "状态和转移钉死：dp[i][c] 的两个维度决定表的大小，漏了物品维度就会重复拿同一件。"
  code:
    lang: typescript
    code: |-
      // 0/1 背包：二维状态定义与拿/不拿转移方程
      function knapsack2D(w: number[], v: number[], W: number): number {
        const n = w.length;
        const dp = Array.from({ length: n + 1 }, () => new Array(W + 1).fill(0));
        for (let i = 1; i <= n; i++) {
          for (let c = 0; c <= W; c++) {
            dp[i]![c] = dp[i - 1]![c]!;                             // 不拿第 i 件
            if (c >= w[i - 1]!) {
              dp[i]![c] = Math.max(dp[i]![c]!, dp[i - 1]![c - w[i - 1]!]! + v[i - 1]!);
            }
          }
        }
        return dp[n]![W]!;
      }
    note: 第 9 行就是转移方程：不拿 vs 拿，两者取 max
    highlight: 9
- id: knapsack-fill
  title: 记忆化递归 vs 填表：一维滚动为什么要倒序刷
  tldr: 自顶向下记忆化和自底向上填表算的是同一套状态；把二维表压成一维滚动数组时，容量必须从大到小倒序刷，否则就会把同一件物品反复塞进背包。
  body: |-
    状态和转移写好后有两种跑法：自顶向下[[记忆化]]递归从目标 solve(n, W) 一路往下问需要哪些小格、边算边存表，好处是只算真正用到的格子、不用操心循环顺序；自底向上填表则是按 i 从 1 到 n 老老实实一行行刷过去，因为每行只依赖上一行，从小到大一定不会读到空格，还省掉递归栈开销，两种写法结果完全等价。

    既然第 i 行只用到第 i−1 行，工程里常把整张二维表压成一行一维[[滚动数组]] dp[0..W]，边算边用新值盖掉旧值。等一下，为什么内层循环必须从大到小倒着刷？拿第一件物品（重 2、值 3）在容量 5 的数组上走一遍数字就懂了：初始全 0，假如正序从小到大刷，走到 c = 2 时算出 dp[2] = dp[0] + 3 = 3 并当场写入；紧接着走到 c = 4 时要查 dp[4−2] + 3——结果读到刚刚改写的 dp[2] = 3，于是 dp[4] 算出 6！这等于把同一件物品硬生生拿了两次，把 0/1 背包写成了不限件数的完全背包。

    反过来从 c = 5 倒序刷到 2：先算 dp[5] = dp[3] + 3 = 3，再算 dp[4] = dp[2] + 3 时，dp[2] 还没被本轮改写过，里面稳稳躺着上一轮的旧值 0，算出来就是 3。只差第 5 行循环的一个方向，倒序保住每件最多拿一次（0/1 背包），正序则允许无限复用（完全背包）。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 15 自底向上计算顺序
    claim: DP 表的计算顺序须保证转移引用的子问题先被求解
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: 一维背包：容量倒序遍历是 0/1 的关键
    rows:
    - label: c 正序（错）
      cells:
      - v: 本轮新值被复用
        mark: active
      - v: 物品被重复拿
    - label: c 倒序（对）
      cells:
      - v: 引用上轮的值
        mark: found
      - v: 每件至多一次
        mark: found
  log:
  - mode: 实现
    event: "填表顺序定清了：同一份转移，一维正序对应完全背包、倒序对应 0/1 背包，方向就是全部分界。"
  code:
    lang: typescript
    code: |-
      // 0/1 背包：一维 DP，容量必须倒序
      function knapsack(w: number[], v: number[], W: number): number {
        const dp = new Array(W + 1).fill(0);   // dp[c]: 容量 c 的最大价值
        for (let i = 0; i < w.length; i++) {
          for (let c = W; c >= w[i]!; c--) {   // 倒序：保证每件只用一次
            dp[c] = Math.max(dp[c]!, dp[c - w[i]!]! + v[i]!);
          }
        }
        return dp[W]!;
      }
    note: 把内层改成正序，语义就变成完全背包
    highlight: 5
- id: sequence
  title: 序列型 [[DP]]：[[LIS]] 与[[编辑距离]]
  tldr: 状态不止能挂在容量上：挂在「结尾位置」或「两个前缀」上，每次回头看前面几个邻居，就能解出最长递增子序列和文本差异比对。
  body: |-
    换一类常见题型，状态不再挂在容量上，而是挂在序列下标和前缀上。先看最长递增子序列（[[LIS]]）：dp[i] 代表「必须以第 i 个数 a[i] 结尾的最长递增子序列有多长」。转移时回头扫所有排在前面的 j（j < i），只要 a[j] < a[i] 就能接在它后面，长度变成 dp[j] + 1，全挑最大的即可，耗时 O(n²)。拿序列 3、1、2 手算一遍：以 3 结尾的 dp 是 1，以 1 结尾也是 1；到 2 时回头找比它小的，3 接不上、1 可以接，所以 dp 等于以 1 结尾的 dp 加 1 等于 2，全表最大值 2 就是答案（子序列 1、2）。它还有维护各长度最小尾巴加二分的 O(n log n) 做法，不过那份尾巴数组只记长度不记路径，要还原具体子序列还得另存前驱。

    再看[[编辑距离]]（[[Levenshtein]]）：把字符串 A 改成 B 最少要几步？定义 dp[i][j] 为「把 A 的前 i 个字符变成 B 的前 j 个字符的最小操作数」。站在这一格，最后一步无非三选一：删掉 A 的末尾字符（看上方 dp[i−1][j] 加 1）、给 A 补上 B 的末尾字符（看左边 dp[i][j−1] 加 1），或者看左上角 dp[i−1][j−1]（末尾相同加 0、不同加 1 替换）。

    试一下把 abc 变成 abd：前两位 ab 与 ab 完全相同，所以 dp[2][2] 等于 0；第三位 c 对 d 不同，走左上角替换转移得 dp[2][2] 加 1 等于 1，跟直觉完全对上。日常的 [[diff]] 工具、拼写纠错和 DNA 序列比对，底层都在跑这张按前缀转移的表。
  derivation: original
