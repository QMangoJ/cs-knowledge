  log:
  - mode: 实现
    event: 同一份转移，一维正序是完全背包、倒序是 0/1 背包
  code:
    lang: typescript
    code: "// 0/1 背包：一维 DP，容量必须倒序\nfunction knapsack(w: number[], v: number[], W: number): number {\n  const dp = new Array(W + 1).fill(0);   // dp[c]: 容量 c 的最大价值\n  for (let i = 0; i < w.length; i++) {\n    for (let c = W; c >= w[i]!; c--) {   // 倒序：保证每件只用一次\n      dp[c] = Math.max(dp[c]!, dp[c - w[i]!]! + v[i]!);\n    }\n  }\n  return dp[W]!;\n}"
    note: 把内层改成正序，语义就变成完全背包
    highlight: 5
- id: sequence
  title: 序列型 DP：LIS 与编辑距离
  tldr: 状态挂在「位置」上：LIS 的 dp[i] 是以 a[i] 结尾的最长递增子序列；编辑距离的 dp[i][j] 是两前缀互变的最小代价。
  body: '另一大类是序列问题。最长递增子序列（LIS），dp[i] 是必须以 a[i] 结尾的最长递增子序列长度，转移是回头看所有 j 小于 i 且 a[j] 小于 a[i] 的 dp[j] 加 1 取最大，O(n²)；另有维护尾巴数组加二分的 O(n log n) 解法（与二分查找一课呼应）。编辑距离（Levenshtein），dp[i][j] 是把字符串 A 的前 i 个字符变成 B 的前 j 个字符的最小操作数，转移三选一，删（dp[i−1][j] 加 1）、增（dp[i][j−1] 加 1）、改或不变（dp[i−1][j−1] 加本位是否相同）。diff 工具、拼写纠正、DNA 比对都是它的变体。

    LIS 补一个走例，序列是 3、1、2。以 3 结尾的 dp 是 1，以 1 结尾也是 1，到 2 时回头找比它小的，3 不行、1 可以，于是 dp 等于以 1 结尾的 dp 加 1 等于 2，全表最大值 2 就是答案，对应子序列 1、2。编辑距离也补一行实感，把 abc 变成 abd，前三位里只有末位 c 与 d 不同，走替换转移是 dp[2][2] 加 1，而 dp[2][2] 因为 ab 与 ab 相同是 0，所以总代价 1，与直觉一致。

    两类题的状态都挂在前缀或位置上，转移只回头看有限个邻居，这正是序列 DP 的指纹。最后提醒，LIS 的 O(n log n) 优化维护的不是答案本身，而是各长度子序列的最小可能尾巴，它不能直接给出具体子序列，要还原路径还得另存前驱，别把优化版与还原版的需求混在一起。'
  derivation: original
  sources:
