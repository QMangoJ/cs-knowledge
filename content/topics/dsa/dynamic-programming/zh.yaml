    event: "序列型看清了：状态挂在位置和前缀上，转移只回头看附近的格子或前驱。"
- id: lcs
  title: 最长公共子序列：手填二维表找公共字符
  tldr: 末尾字符相同就取左上角加 1，不同就挑上格和左格里更大的那个——填满二维表后从右下角倒着走回去，就能把公共子序列拼出来。
  body: |-
    最长公共子序列（[[LCS]]）想在两个字符串里按原顺序挑出一串相同字符，不要求紧挨着。定义 dp[i][j] 为 A 的前 i 个字符与 B 的前 j 个字符的 LCS 长度，任一串为空时边界为 0。比较末尾字符时只有两种情况：相等就直接配成一对，长度等于去掉末尾后的 dp[i−1][j−1] 加 1；不等则至少舍弃其中一边，从「A 退一格」dp[i−1][j] 和「B 退一格」dp[i][j−1] 里挑更大的。

    拿 A 等于 abc、B 等于 ac 实际把表填满。第 1 行看 a：对上 B 的 a 时相等，得 1；对上 c 时不等，取左和上里较大的 1。第 2 行看 b：跟 a、c 都不等，整行照抄上一行最大值保持 1。第 3 行看 c：先对 a 时取较大值 1；最后对上 B 的 c 时末尾相等，顺着左上角 dp[2][1] 等于 1 再加 1 得到 2。右下角 dp[3][2] 等于 2，对应公共子序列 ac。

    要想输出具体字符而不只报个数字，只需从右下角倒着走回去：遇上末尾字符相等就收下该字符并往左上角退；不等就往左和上里数字更大的方向退。LCS 跟编辑距离本就是同一张表的两种用法，[[diff]] 展示代码改动时，底层正是靠它算出哪些行保留、哪些行标成增删。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 15.4 Longest Common Subsequence
    claim: 最长公共子序列用按两串前缀定义的状态与末字符相同或不同的两种转移求解，并可由表回溯出子序列本身
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: abc 与 ac 的 LCS 表，右下角的 2 来自左上角加 1
    rows:
