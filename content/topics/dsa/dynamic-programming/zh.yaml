    event: 宽度换速度：beam 越宽越接近精确解
level: 进阶
minutes: 37
prereq:
- dsa/binary-search
- dsa/merge-quick-sort
objectives:
- 判断一道题是否满足 DP 的两个前提
- 独立写出 0/1 背包的状态、转移与一维优化（含倒序原因）
- 用四步法为序列问题设计状态与转移
aiLink: beam search 的近似 DP、强化学习的贝尔曼方程、序列对齐与解码——DP 是 AI 工程里最隐形的基本功。面试里它也是出现频率最高的题型之一，状态设计能力就是这里的分水岭。
design:
- mechanism: 为什么存表而不是纯递归，关键在子问题的计数账，斐波那契不同的子问题只有 n 加 1 个，朴素递归却按指数次重复求解它们，存表把每个子问题钉死为只算一次，账立刻从指数变线性
  problem: 递归写法本身没有错，错在同一子问题沿不同调用路径被反复展开，n 稍大调用量就按黄金比例的幂爆炸，思路对、答案对，程序却永远跑不完，这是纯递归必须面对的真实账单
  choice: 给递归加缓存得到记忆化，或按依赖顺序自底向上填表得到递推，两条路线共享同一套状态与转移，前者只算被用到的状态，后者把全部状态一次算齐，选哪条看状态利用率与实现习惯
  tradeoff: 存表用与状态数同量级的内存换掉指数级时间，还要多付定义状态与确定顺序的心智成本，若子问题其实互不重叠，这张表就是纯浪费，所以存表之前必须先验明重叠确实存在
  root: 根本原因是计算量由不同子问题的个数决定而不是由调用次数决定，重复调用不产生任何新信息，DP 只是把这句常识变成纪律，每个不同子问题恰好求解一次，不多也不少
- mechanism: DP 的复杂度等于状态数乘以每个状态的转移代价，所以状态怎么定义在写第一行转移之前就已经决定了这道题是多项式可解，还是状态空间大到根本开不出表来，无可挽回
  problem: 状态少一个维度会丢信息导致转移串味，多一个维度状态数立刻乘上一个量级，背包把容量上限写成数值维度得到的是伪多项式，容量到十亿时表直接开不出来，维度选错满盘皆输
  choice: 定义状态时逐字回答每个维度代表什么、答案住在哪个格子，并优先挑选能让转移只看常数个邻居的切法，必要时换维度，比如背包改按价值定义状态来应对大容量输入
  tradeoff: 维度取得越精细适用面越广但状态数越贵，取得越粗速度越快却可能装不下题目的约束，本质是在表达力与规模之间配平，没有一份状态定义能通吃同一问题的所有变体
  root: 根本原因是 DP 把求解转化成了枚举子问题空间，空间的形状就是状态的形状，转移只是空间内部的连线，先画对空间再谈连线，顺序反了只会在错误的地基上越写越乱
- mechanism: DP 敢把子问题的最优拼成全局最优，靠的是最优子结构，切开最优解的任意一刀，两边各自仍是对应子问题的最优解，反设某一边不是最优，替换进去就能得到更优的全局解而矛盾
  problem: 若子问题之间互相牵制，比如最长简单路径里走过的点不能再走，子路径的最优会随全局路径的选择而改变，拼装的前提被抽掉，DP 在这类问题上会系统性地给出错误答案还不自知
  choice: 动手前先做两个检验，能否把大问题的最优解切成子问题的最优解，同一子问题是否会被不同路径反复求解，两项都通过才进入状态设计，有一项不过就改走贪心、搜索或近似路线
  tradeoff: 严格检验会让一些勉强能套 DP 的题目被挡在门外，看似少了一件工具，换来的是不把指数问题误判成多项式、不在错误前提上浪费实现与调试时间，这笔账长远看是赚的
  root: 根本原因是拼装是一种无损压缩，它成立当且仅当子问题之间的耦合只通过状态接口传递，耦合一旦绕过接口，比如共享已用集合，最优子结构这块地基就不复存在，楼盖得再高也要塌
quiz:
- q: 使用动态规划的两个前提是？
  options:
  - 数据有序 + 可以二分
  - 最优子结构 + 子问题重叠
  - 可以贪心 + 数据量小
  - 递归深度有限
  answer: 1
  explain: 子问题的最优能拼出全局最优，且同一子问题被反复求解，存表才有意义。
- q: 一维 0/1 背包为什么容量要倒序遍历？
  options:
  - 为了让数组更好看
  - 正序会引用本轮刚更新的值，导致同一物品被重复使用（变成完全背包）
  - 倒序速度更快
  - 没有区别，随便选
  answer: 1
  explain: 倒序保证 dp[c−w] 还是「未考虑当前物品」时的值，每件物品至多用一次。
- q: 记忆化递归与自底向上递推的关系是？
  options:
  - 完全不同的两种算法
  - 同一状态定义的两种执行方式：前者按需计算，后者按依赖顺序全算
  - 递推一定更慢
  - 记忆化不需要定义状态
  answer: 1
  explain: 两者共享状态与转移方程；记忆化只算被用到的状态，递推按顺序算全部状态。
