- id: conditions
  title: 两个前提：[[最优子结构]] + [[子问题重叠]]
  tldr: 不是所有能拆的题都能用 DP：大问题的最优解必须能由小问题的最优解拼出来，且小问题得会被重复用到，缺一不可。
  body: |-
    第一道检查叫「[[最优子结构]]」，大白话就是「整体最好，拆开后每一段也得是各自范围内的最好」。比如背包容量为 5 时的最优装法，如果拿掉里面一件重 2 的物品，剩下的方案必须是容量为 3 时的最优装法；最短路径也一样，经郑州从北京到广州的最短路线，北京到郑州这一截必然也是最短的（Dijkstra 与 Bellman-Ford 都靠这个性质撑腰）。

    反过来，一旦小问题之间互相牵制，这道检查就过不了。经典反例是图上的「最长简单路径」（不能走重复点的最长路）：假如 A 到 C 经过 B 算出了最长路，C 到 D 算出的最长路不小心也经过 B，两段一拼就出现重复节点、直接作废——因为后一段必须避开前一段用过的点，小问题没法独立算最优，所以它只能指数级搜索，硬套 DP 只会悄悄算出错误答案。

    第二道检查叫「[[子问题重叠]]」，意思是不同路径会反复撞进同一个小状态，比如背包总共只有 n 乘 W 个状态格，存表后每个格子只算 1 次，直接压掉 2 的 n 次方次穷举。顺带分清近亲：贪心同样要求最优子结构，但贪心站在路口只猜一条路走到底，DP 则是把两条路都算完存表再挑大的——证不出来哪条稳赢时，老老实实全算一遍最保险。
