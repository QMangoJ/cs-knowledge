title: 动态规划：把重复子问题存下来
summary: 动态规划（DP）不是某套固定套路，而是一种「记账不重算」的解题视角：只要大问题能拆成互相重叠的小问题，且小问题的最优解能拼出大问题的最优解，把每个小答案只算一次并存表复用，就能把指数级开销压成多项式时间。全课先用斐波那契算清重算到底有多贵、立住适用 DP 的两道前提；再用 0/1 背包把核心流程跑透——先定义「这一格到底代表什么」的状态，再写拿与不拿的转移方程，并打通记忆化递归和倒序一维填表；随后延伸到序列前缀、区间切分、空间与状态压缩，最后收成四步设计口诀以及 AI 生成解码里的束搜索近似。
premise: 这节课从一个让人抓狂的卡顿现场开始：你用递归写了几行代码算斐波那契数 fib(50)，程序却原地转圈半天跑不完——拆开调用树才发现，fib(3) 之类的小账被重复算了几百万遍。接着再往容量 5 斤的背包里装三件物品、比对两段字符串的差异，表面上看题目换了，卡住的地方却一模一样：如何把算过的子答案记进表里，下次直接拿来用？
position: 本课在数据结构与算法里独撑「记住子问题的答案」这一板块，上承二叉搜索树每次比较就扔掉半棵子树的拆分思路，下启贪心每步当场定死、绝不回头的取舍策略。当问题拆出来的子问题互相重叠、没法像树那样直接抛弃一半时，把子答案存下来就是破局的关键。学完你能用两道前提检查筛出能用 DP 的题，也能亲手为背包、序列比对和区间问题写出不漏维度的状态定义与填表顺序。
bridge:
  prev: 上一课的平衡二叉搜索树靠旋转把树高锁在对数级，保证每次比较稳稳排掉半棵子树；可有些问题拆开后子问题会反复撞车，不把算过的账本存下来，递归树立刻指数膨胀。
  next: 存表救了重复子问题，可一旦状态维度太高，光建表就能把内存撑爆。离开前还要追问一句：有没有一类问题，每步选完当场拍板、永远用不着反悔，连一张表都省掉？
overview:
- key: 一句话总结
  value: 想写对动态规划，全靠四件事：状态一句话说清这一格代表什么、转移写出它怎么由更小的格算出来、边界填对起点、顺序保证算新格时依赖的旧格都已有值。
- key: 两个前提
  value: 适用 [[DP]] 先过两道检查：一是[[最优子结构]]（大问题的最优解里包着小问题的最优解），二是[[子问题重叠]]（同一小问题会被反复算很多遍）。缺重复就没必要存表，缺最优子结构就拼不出正确答案。
- key: 两种写法
  value: 自顶向下[[记忆化]]（递归加查表）只算实际用得上的状态，直观好写；自底向上填表按顺序把格子刷满，省掉递归栈开销。两者共享同一套状态和转移，算出的答案一模一样。
- key: 和分治的区别
  value: 分治拆出的子问题各算各的、互不重叠，比如归并排序左半边和右半边完全不相干；只要在递归树里看见同一个小问题反复出现，那就该换 DP 上场记账了。
- key: 和贪心的区别
  value: 贪心站在路口只选眼前最好的一条路、绝不回头；DP 把所有可行分支都算过一遍存进表里再挑大的。DP 慢一点但稳，贪心快却必须先证明不会选死。
- key: 复杂度怎么算
  value: 总时间大致等于状态格子总数乘上填一格的代价，所以状态定义得太粗会漏掉决策信息，定义得太细会让格子数直接爆炸——把状态那句话说准，比事后调代码更关键。
