- id: matrix-chain
  title: 矩阵链乘：把状态定义在区间上
  tldr: 算区间 DP 必须按区间长度从小到大斜着填表，不能按行硬刷，否则转移引用右边的短区间时会读到还没算出的空格子。
  body: |-
    矩阵连乘满足结合律，最终数值一样，可加括号的顺序能让计算量差出十倍。拿三个矩阵算笔账，维度依次是 10 乘 100、100 乘 5、5 乘 50：先乘前两个花 10 乘 100 乘 5 等于 5000，再乘第三个花 10 乘 5 乘 50 等于 2500，合计 7500；反过来先乘后两个，第一步就花 100 乘 5 乘 50 等于 25000，再乘第一个还要 10 乘 100 乘 50 等于 50000，合计 75000。维度越悬殊差距越大，这直接决定了数量级。

    这种题没法只记前缀，因为最后一对括号可以从任何地方合拢，所以要把状态定义在一段区间上：dp[i][j] 表示第 i 到第 j 个矩阵连乘的最小代价。转移只需枚举「最后一次乘法切在哪」k，把区间劈成 i 到 k 与 k 加 1 到 j 两段，总代价就是两段最优加上最后两块大矩阵相乘的成本，对所有切分点 k 取最小。共有平方级个区间状态，每个状态试遍线性个切分点，总账 O(n 的三次方)。

    填表顺序是这里的卡点：算 dp[1][4] 时会同时引用右侧更短的区间 dp[2][4]，如果按行从上往下填，dp[2][4] 所在的下一行根本还没算！所以必须按区间长度从小到大推进，先算长度 2 再算长度 3，沿着对角线斜着刷上去。能看出「状态可以是一段区间」，是跨进区间 [[DP]] 的标志。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 15.2 Matrix-Chain Multiplication
    claim: 矩阵链乘用区间状态与枚举最后切分点的转移求最优括号化，须按区间长度递增的顺序计算
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: 同一条链两种括号，7500 对 75000
    rows:
    - label: 先乘前两个
      cells:
      - v: 5000 加 2500
      - v: 合计 7500
        mark: found
    - label: 先乘后两个
      cells:
      - v: 25000 加 50000
      - v: 合计 75000
        mark: active
    - label: 转移
      cells:
      - v: 枚举切分点 k 取最小
  log:
