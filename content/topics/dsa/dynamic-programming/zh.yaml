    event: "设计顺序固定：先递归加缓存写对，再改递推和省空间，手填 n=2/3 小表防笔误。"
- id: ai-link
  title: 与 AI 工程的连接，以及带走一套四问清单
  tldr: 大模型解码的束搜索，是把指数级 DP 表每步砍成宽度 k 的工程近似；强化学习的价值迭代，则是字面意义上照着贝尔曼方程在状态表上刷更新。
  body: |-
    把视线挪到 AI 工程现场：大模型生成文本时，每步有几万个候选词，精确枚举整句话是指数级的，根本算不完。于是推理引擎常用 [[beam search]]（束搜索）：每一步只保留得分最高的 k 条前缀（比如 k=4），把其余分支当场丢掉——相当于把完整的 DP 表按宽度截断，用放弃全局最优保证换回可接受的延迟与显存。对比语音识别或序列标注里的 [[Viterbi]] 算法，它因为隐状态数固定、每步都为每个状态保留最优前缀，所以是货真价实的精确 DP；强化学习则更直白，[[贝尔曼方程]]本身就是转移方程，价值迭代就是在环境状态表上一遍遍自底向上刷更新。

    把整课收成一套带得走的「DP 动手四问清单」：一问「真有重复吗」——没重叠子问题别硬建表；二问「子最优能独立拼吗」——互相卡死就没有最优子结构；三问「这一格到底代表什么、最后一步有几种选法」——先说清状态和转移，手填 n=2 小表或先写记忆化递归；四问「压空间会丢回溯吗」——一维背包别忘倒序，需要输出具体路径就留整表或另存决策。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 15（Viterbi 类序列解码的思想背景）
    claim: 基于状态转移的精确动态规划（如 Viterbi）是序列解码的标准方法，束搜索是其实用的近似
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
