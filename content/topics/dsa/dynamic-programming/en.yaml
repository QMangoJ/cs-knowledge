  log:
  - mode: Motivation
    event: "The motivation is set: dynamic programming is recursion plus an answer table — a subproblem that has been computed is never recomputed, and all the waste is plugged at this one spot."
- id: conditions
  title: "Two prerequisites: [[optimal substructure|最优子结构]] + [[overlapping subproblems|子问题重叠]]"
  tldr: "A table cannot be used just anywhere. This step sets up two checks — can the big problem's optimum be assembled from the small problems' optima, and will the same small problem be used repeatedly? Only when both pass does [[DP]] take the stage; along the way, look at a counterexample that fails the checks, so DP does not get used on problems it should not touch."
  body: >-
    Optimal substructure — a problem's optimal solution contains its subproblems' optimal solutions. In the knapsack, the optimum at capacity c necessarily builds on the optima at smaller capacities; a shortest path's subpaths are also shortest (this property also sits behind Dijkstra and Bellman-Ford). Overlapping subproblems — the total number of subproblems is polynomial, and they are reused at high frequency. If the subproblems do not overlap at all (merge sort's two halves, for instance), that is divide and conquer and no table is needed; when the two prerequisites are not both met, DP does not apply either.


    Optimal substructure has counterexamples too. In the longest simple path problem, the remaining subpath must avoid the points already used, so the subproblems constrain each other and cannot be optimized independently — which is exactly why it needs exponential search. Now quantify the overlap: the knapsack has n times
    W states in total; with a table, each state is computed once, and the complexity is pressed down from exponential to the number of states times the transition cost.


    One family relationship also needs clarifying. Greedy also requires optimal substructure, but it follows a single choice all the way down, while DP tries every choice and then compares. When some choice can be proved necessarily optimal, greedy is cheaper; when it cannot be proved, do DP honestly.
  derivation: original
  sources:
