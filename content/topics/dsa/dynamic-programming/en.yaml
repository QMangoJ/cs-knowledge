steps:
- id: why
  title: "Seeing from Fibonacci how expensive repetition is"
  tldr: "First, see how expensive it is not to keep a table — naive Fibonacci recursion recomputes the same subproblem again and again. This step draws the recursion tree and counts the repeated positions one by one, then shows why adding just one table — check before computing, store after computing — pulls the total cost back from exponential to linear."
  body: >-
    fib(5) calls fib(4) and fib(3), and fib(4) calls fib(3) again — the same subproblem appears many times in the recursion tree, and the total number of calls grows exponentially with n. The algorithmic idea is not wrong; the same answer is simply being recomputed over and over. Store each computed sub-answer in a table ([[memoization|记忆化]]) and each subproblem is computed only once, and the total cost drops to O(n) at once. The whole magic of [[DP]] is this one sentence — spot the overlapping subproblems, and make sure each is solved only once.


    Put the repetition into concrete numbers. In fib(5)'s recursion tree, fib(3) appears 2 times, fib(2) appears 3 times, and fib(1) and fib(0) each appear many times; the total node count grows roughly like 1.6 to the power of n, and by n = 50 the naive recursion's call count is already too large to ever finish — while the distinct subproblems number only n + 1. Memoization changes only two places — before computing, check the table first and return at once if the answer is there; after computing, store the result back into the table before returning. The recursion structure does not change by a single character, so each subproblem is genuinely computed once, a table lookup is O(1), the total cost becomes
    O(n), and the only extra price is a table of size n.


    What is saved is not a constant factor but a leap in magnitude, from exponential to linear, and it comes from a single source — no recomputation. Conversely, if the subproblems do not overlap at all — merge sort's two halves each compute their own — storing a table is pure waste. DP's first lesson is to confirm first that the repetition really exists.
  derivation: original
  sources:
