- id: ai-link
  title: The connection to AI engineering
  tldr: "Finally, shift the view to the engineering field: when decoding generated text, keeping only the highest-scoring few prefixes at each step is an approximation that truncates the [[DP]] table by width; value iteration in reinforcement learning is table-filling in the literal sense. This step looks at what each of these two applications keeps of DP, and what guarantee it gives up."
  body: >-
    Sequence generation cannot enumerate every sentence (there are exponentially many). [[beam search]] keeps only the k highest-scoring prefixes at each step, which amounts to truncating the DP table by width and trading exactness for feasibility (its relation to [[Viterbi]] is that Viterbi does exact DP on a hidden Markov model, while beam search is its engineering approximation). Reinforcement learning is even more direct — the [[Bellman equation|贝尔曼方程]] is a transition equation, and value iteration is bottom-up table-filling. Sequence alignment (from the era before attention), speech recognition decoding, and spelling correction are also all in the [[edit distance|编辑距离]] family. Once you can write an engineering problem as state plus transition, half the solution is already in hand.


    The boundary between beam search and exact DP needs stating clearly: with a fixed beam width k, the prefixes it discards never come back, so the result is not guaranteed to be globally optimal; the larger k is, the closer it gets to the exact solution, but the computation and the memory grow with it, and a production system chooses k inside its latency budget. Viterbi
    instead keeps, at each time step, the best prefix for every hidden state, and is an exact solution when the number of states is fixed. Value iteration in reinforcement learning is DP in the literal sense of filling a table while taking the best action along the way — except that the states come from the environment rather than from a problem statement.
  derivation: original
  sources:
