  log:
  - mode: Space
    event: "The compression criterion is pinned down: look at the transition's dependency shape first, then decide how many rows it can be pressed to — saving space always ranks after getting it right."
- id: state-compression
  title: "A peek at state compression: pack a set of switches into one integer"
  tldr: "A state need not be a number or an interval — it can also be a set of switches. This step encodes n switches into an n-bit integer and looks at how the [[traveling salesman|旅行商问题]] problem transitions on such a state; estimate the state-count account first, then decide whether this method can be used at all."
  body: >-
    Some problems' states are inherently a set of switches — whether each cell of a board holds a piece, whether each element of a set is chosen. n switches make 2 to the power of n combinations. One combination can be encoded directly as an n-bit binary integer, a bit of 1 meaning chosen — this is state-compression
    [[DP]]. Transitions use bitwise operations to enumerate subsets or check adjacency and conflicts; common ones are the [[lowbit]] trick for extracting the lowest 1 bit and bitwise AND to test whether two sets intersect, and all of these operations are constant-time.


    The traveling salesman problem is its signature application — dp[S][i] is the shortest route whose visited set is S and which currently stops at i, and the transition adds in a point j that is not in S. The number of states is 2 to the power of n times n, and the transition must also enumerate the next point, so it is still computable up to around n = 20;
    any larger and the state table blows up before the time does. This boundary is hard — estimate this account before writing anything.


    Its relation to ordinary DP is a generalization of how a state is defined: a state can be any encodable structure — if it can be encoded, a table can be built; if a table can be built, transitions can be made. The price is equally plain — if the estimate does not pass, switch early to greedy, approximation, or heuristics.
