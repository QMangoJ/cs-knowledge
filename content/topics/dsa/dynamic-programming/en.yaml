      - v: 5000 + 2500
      - v: Total 7500
        mark: found
    - label: Last two first
      cells:
      - v: 25000 + 50000
      - v: Total 75000
        mark: active
    - label: Transition
      cells:
      - v: Enumerate split k, take min
  log:
  - mode: Interval DP
    event: "The interval family is set: the transition enumerates the last split, and the table must be filled in order of increasing interval length."
- id: space-compression
  title: "Space compression: when can the table be pressed into one row?"
  tldr: "How small the table can be pressed depends on exactly which rows and columns the transition references. This step checks the dependency shapes of the tables above one by one — what references only the previous row can roll, what references only the previous two entries needs just two variables, and what enumerates split points cannot be pressed at all; finally, reckon what the space saved by compression is traded for."
  body: >-
    There is only one criterion for space compression — look at exactly which rows and columns the transition references. Each row of the knapsack references only the previous row, so keeping two rows rolling, or even pressing it into one dimension, is safe. [[Edit distance|编辑距离]] and [[LCS]]
    reference three neighbors — left, top, and top-left — so they likewise need only the previous row and the current row; a [[rolling array|滚动数组]] suffices, and when pressing to one dimension the top-left value must be stored separately, because updating the current row overwrites it — forgetting to store it is the most common compression bug.


    But compression is not free: once the row dimension is pressed away, the concrete solution can no longer be recovered from the table by backtracking. When the knapsack must output which items were taken, or LCS must output the subsequence itself, either keep the whole table or store decision records separately. Fibonacci is the other extreme — it references only the previous two entries, so two variables suffice; the lower bound of compression is likewise decided by the dependency shape.


    Matrix chain multiplication cannot be pressed at all — its transition enumerates split points, so any shorter interval may be referenced, and the whole triangular table must be kept. The conclusion: look at the dependency shape first, then decide how to press; saving space always ranks after getting it right.
  derivation: original
  sources:
  - ref: mit-6006
    locator: "Dynamic programming lectures (computation order and space optimization)"
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: A DP's space can be compressed according to the range its transitions depend on; when it depends only on the previous layer of states a rolling array works, but the ability to recover the concrete solution from the table is lost
    status: verified
    checkedBy: Checked by Muse
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
