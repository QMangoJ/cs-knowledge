- id: matrix-chain
  title: "Matrix chain multiplication: enumerate by the last split"
  tldr: "The states so far were all prefixes; in this step the state becomes an interval — the minimum cost of multiplying a chain of matrices. First compute how two parenthesizations of the same chain differ by a factor of ten, then see how the transition enumerates the position of the last multiplication, and why the table must be filled in order of increasing interval length."
  body: >-
    Matrix chain multiplication asks not for the product's value but for the order of parenthesization. Three matrices have dimensions, in sequence, 10 by 100, 100 by 5, and 5 by 50. Multiplying the first two first costs 10 × 100 × 5 = 5000, then multiplying by the third costs 10 × 5 × 50 = 2500, for a total of
    7500; multiplying the last two first costs 100 × 5 × 50 = 25000, plus 10 × 100 × 50 = 50000, for a total of 75000. The same chain, with only the parentheses moved, differs by a factor of ten — and the more lopsided the dimensions, the larger the gap. This is not a constant-factor optimization but a matter of magnitude.


    The state is defined by interval — dp[i][j] is the minimum cost of multiplying matrices i through j — and the transition enumerates the position k of the last multiplication, splitting the interval into i through k and k + 1 through j; the cost is the two parts' optima plus the merge cost, which the product of the three dimensions gives, and the minimum is taken over all k. A single interval's transition has to try every split point inside it, so the total complexity is O(n cubed) — the number of states is quadratic, each state's transition is linear, and the accounts match exactly.


    The computation order is this problem's difficulty: dp[i][j] depends on the answers for shorter intervals, so the table must be filled by interval length from small to large — compute length 2 first, then length 3, advancing along the diagonal; filling row by row on a whim reads empty cells. Its difference from the knapsack is that the subproblems are intervals rather than prefixes — recognizing that a state can be an interval is the mark of moving from sequence
    [[DP]] to interval DP.
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 15.2 Matrix-Chain Multiplication
    claim: Matrix chain multiplication finds the optimal parenthesization with an interval state and a transition that enumerates the last split point, and must be computed in order of increasing interval length
    status: verified
