- id: design
  title: "Given a problem: the four-step design method"
  tldr: "The examples are done — now collect them into a workflow you can use on a new problem: first define the state in one sentence, then write the transition, then fix the base cases and the traversal order, and finally count the complexity. This step spells out the four steps one by one, then names the three most common failure points — a state missing a dimension, base cases left unfilled, and the answer taken from the wrong cell."
  body: >-
    A practical mantra. One, the state — say in one sentence what each dimension of dp means and in which cell the answer lives. Two, the transition — how many possibilities does the last decision have (take or don't take, end with whom, where does the last step come from), and write one term for each. Three, the base cases — fill in the smallest states (the empty set, lengths 0 and
    1) one by one, correctly. Four, the order — guarantee that the states a transition references are computed first (draw the dependency directions if needed). When you cannot write it, first solve the problem with brute-force recursion (the recursive function f
    is the state's definition), then add a cache to it — [[memoization|记忆化]] and iteration are just two ways of executing the same state. Only at the end talk about space compression (the rolling array); do not write the logic wrong in order to save space first.


    Add the three most common failure points. The first is a decision history hidden inside the state definition — for example, dp also depends on what was chosen last time, but that point is not written into the dimensions, so the transition gets contaminated; the fix is to add a dimension, not to patch. The second is filling only dp[0] as a base case while missing a whole row or column — [[edit distance|编辑距离]]'s first row and first column are exactly the costs of converting to and from the empty string, and leaving them unfilled shifts the whole table out of place. The third is taking the answer from the wrong position — some problems' answer is at dp[n][W], others need the maximum over a whole row; [[LIS]]'s
    answer, for example, is the maximum over the whole table. Before delivering, go back to the state definition's one sentence and check which cell the answer actually lives in.


    One more workflow suggestion: first fill the smallest table by hand on paper — n = 2 or 3 is enough. If the hand-fill is right, then write the code; this catches the vast majority of transition slips.
  derivation: original
  sources:
