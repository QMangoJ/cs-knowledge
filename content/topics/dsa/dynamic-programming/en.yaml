      - v: All prefix states
      - v: Optimality guaranteed
    - label: beam k=4
      cells:
      - v: Keep only the top 4 per step
        mark: active
      - v: Approximately optimal
  log:
  - mode: Approximation
    event: "The approximation account is done: the wider the beam, the closer to the exact solution — and the higher the computation and memory, so a production system must choose the width inside its latency budget."
level: 进阶
minutes: 37
prereq:
- dsa/binary-search
- dsa/merge-quick-sort
objectives:
- Judge whether a problem meets DP's two prerequisites
- Independently write the 0/1 knapsack's state, transition, and one-dimensional optimization (including why reverse order)
- Use the four-step method to design states and transitions for sequence problems
aiLink: Beam search's approximate DP, reinforcement learning's Bellman equation, sequence alignment and decoding — DP is the most invisible fundamental skill in AI engineering. In interviews it is also one of the most frequent problem types, and state-design ability is exactly the watershed here.
design:
- mechanism: Why store a table instead of using pure recursion comes down to the subproblem-counting account — Fibonacci has only n + 1 distinct subproblems, yet naive recursion solves them exponentially many times over; storing the table pins each subproblem to being computed exactly once, and the account turns from exponential to linear at once
  problem: The recursive formulation itself is not wrong; what is wrong is that the same subproblem gets expanded again and again along different call paths, and once n grows a little the call count explodes like a power of the golden ratio — the idea is right and the answer is right, yet the program never finishes. That is the real bill pure recursion has to face
  choice: Add a cache to the recursion to get memoization, or fill a table bottom-up in dependency order to get iteration; the two routes share the same set of states and transitions — the former computes only the states that get used, the latter computes all states in one pass — and which to choose depends on the state utilization rate and implementation habit
  tradeoff: Storing the table trades memory on the order of the state count for exponential time, and adds the mental cost of defining the state and determining the order; if the subproblems in fact do not overlap, the table is pure waste — so before storing, verify that the overlap really exists
  root: The root cause is that the amount of computation is decided by the number of distinct subproblems, not by the number of calls; repeated calls produce no new information at all. DP simply turns this common sense into a discipline — each distinct subproblem is solved exactly once, no more and no less
- mechanism: A DP's complexity equals the number of states times each state's transition cost, so how the state is defined decides, before the first line of any transition is written, whether the problem is polynomially solvable or whether the state space is so large that no table can even be allocated — beyond recovery
  problem: One dimension too few in the state drops information and contaminates the transition; one dimension too many multiplies the state count by an order of magnitude at once. The knapsack writes the capacity limit as a numeric dimension and gets a pseudopolynomial — when the capacity reaches a billion, the table simply cannot be allocated. Choose the dimensions wrong and the whole game is lost
  choice: When defining a state, answer word by word what each dimension means and in which cell the answer lives, and prefer a cut that lets the transition look at only constantly many neighbors; when needed, swap dimensions — for example, define the knapsack's state by value instead, to cope with large-capacity inputs
  tradeoff: The finer the dimensions, the wider the applicability but the more expensive the state count; the coarser, the faster the speed but the less able it is to hold the problem's constraints. In essence it is balancing expressive power against scale — no single state definition covers every variant of the same problem
  root: The root cause is that DP turns solving into enumerating the subproblem space; the space's shape is the state's shape, and a transition is only a connection inside the space. Draw the space right first, then talk about connections — reverse the order and you only write more and more chaos on a wrong foundation
- mechanism: DP dares to assemble subproblems' optima into the global optimum because of optimal substructure — cut an optimal solution at any point and both sides are still optimal for their corresponding subproblems; suppose one side were not optimal, and swapping in a better one would yield a better global solution, a contradiction
  problem: If the subproblems constrain each other — in the longest simple path, for example, points already visited cannot be visited again, so a subpath's optimum changes with the global path's choices — the premise of assembly is pulled away, and DP on such problems systematically produces wrong answers without knowing it
  choice: Before starting, run two tests — can the big problem's optimal solution be cut into subproblems' optimal solutions, and will the same subproblem be solved repeatedly along different paths? Only when both pass do you enter state design; if either fails, switch to a greedy, search, or approximation route
  tradeoff: Strict testing keeps some problems that could only barely be forced into DP outside the door, which looks like one tool fewer; in exchange you do not mistake an exponential problem for a polynomial one and do not waste implementation and debugging time on a wrong premise — over the long run, this account is a gain
  root: The root cause is that assembly is a lossless compression, and it holds if and only if the coupling between subproblems passes only through the state interface; once the coupling bypasses the interface — sharing a visited set, for example — the foundation of optimal substructure no longer exists, and however tall the building rises, it will collapse
quiz:
- q: What are the two prerequisites for using dynamic programming?
  options:
  - Sorted data + binary search applies
  - Optimal substructure + overlapping subproblems
  - Greedy works + the data is small
  - The recursion depth is limited
  answer: 1
  explain: The subproblems' optima must assemble into the global optimum, and the same subproblem must be solved repeatedly — only then does storing a table mean anything.
- q: Why must the capacity in the one-dimensional 0/1 knapsack be traversed in reverse?
  options:
  - To make the array look nicer
  - Forward order would reference values just updated in this round, causing the same item to be used repeatedly (it becomes the unbounded knapsack)
  - Reverse order is faster
  - There is no difference; pick either
  answer: 1
  explain: Reverse order guarantees that dp[c−w] is still the value from before the current item was considered, so each item is used at most once.
- q: What is the relation between memoized recursion and bottom-up iteration?
  options:
  - Two completely different algorithms
  - Two ways of executing the same state definition — the former computes on demand, the latter computes everything in dependency order
  - Iteration is necessarily slower
  - Memoization needs no state definition
  answer: 1
  explain: The two share the state and the transition equation; memoization computes only the states that get used, while iteration computes all states in order.
