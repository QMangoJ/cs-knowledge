title: "Dynamic Programming: Store Subproblem Answers Instead of Recomputing Them"
summary: DP (dynamic programming) is not a single algorithm but a way of looking at problems — when a problem splits into overlapping subproblems and the subproblems' optima combine into the global optimum, store the sub-answers to avoid recomputing them.
premise: Some problems, computed by direct recursion, solve the same small problem over and over and waste enormous time doing it; dynamic programming exists to fix exactly that, by storing small problems' answers and fetching them next time. This lesson looks at it through three examples — the Fibonacci sequence, to see how severe repeated computation gets; the 0/1 knapsack, to see how a state is defined; and the longest increasing subsequence, to see what a state looks like when it hangs on a position.
position: This lesson is the only stop in the "Remember the Subproblems' Answers" section. It follows the binary search tree's way of splitting, where each comparison rules out a whole subtree, and points out that when the split-out subproblems overlap each other, splitting without storing just recomputes them again and again. After this lesson you will be able to first check a problem with the two tests of [[optimal substructure|最优子结构]] and [[overlapping subproblems|子问题重叠]] to judge whether DP applies, and to write, for the
  0/1 knapsack, a state defined by items and capacity together with a transition that takes the larger of taking and not taking.
bridge:
  prev: The previous lesson, on balanced trees, used rotations to lock the tree height at logarithmic so operations would not degrade; this lesson stares instead at a recursion tree whose size runs out of control — naive Fibonacci recursion recomputes subproblems like fib(3) many times over precisely because it keeps no table.
  next: Storing a table rescues overlapping subproblems, but the table itself is a cost — once there are too many states it grows too large to store. So before leaving this section, one more question — is there a class of problems where each step's choice can be settled on the spot, never needs revisiting, and does not need a table at all?
overview:
- key: In one sentence
  value: The four-piece set — state definition, transition equation, base cases, and computation order — is indispensable. First say clearly what a state actually means, then write how it is derived from smaller states, then fix the values of the first few states, and finally arrange the order in which to fill them in; get the order wrong and a state may not have been computed yet when you need it.
- key: Two prerequisites
  value: Using [[DP]] takes two prerequisites. The first is [[optimal substructure|最优子结构]] — the big problem's optimal solution contains the small problems' optimal solutions inside it. The second is [[overlapping subproblems|子问题重叠]] — the same small problem gets solved repeatedly. Without overlap, storing buys nothing; without optimal substructure, what you assemble is not the optimum.
- key: Two implementations
  value: The two implementations are equivalent. One is top-down [[memoization|记忆化]] — recursion plus a cache. The other is bottom-up iteration — filling a table in order. The former computes only the states that are actually used; the latter has no recursion overhead. Which one to pick depends on the shape of the problem, but the answers they produce are exactly the same.
- key: Difference from divide and conquer
  value: Divide and conquer's subproblems do not overlap each other — in merge sort, the left and right halves are each sorted on their own and do not affect each other. Overlapping subproblems are DP's territory. The test is direct — draw the recursion tree, and if the same small problem appears many times in the tree, its answer should be stored.
- key: Difference from greedy
  value: A greedy algorithm picks one optimum at each step, and the pick cannot be undone; DP computes every candidate sub-state and then takes the best. So DP is slower but steadier, while greedy is faster but first needs a proof that picking the local optimum at each step never misses the global optimum.
- key: Complexity
  value: The complexity equals the number of states times the transition cost per state; get the state design wrong and no amount of later optimization helps. A state defined too coarsely drops information that is needed, and one defined too finely makes the state count explode — saying the state's one sentence clearly matters far more than tuning constants afterwards.
