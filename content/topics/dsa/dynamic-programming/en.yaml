- id: knapsack-state
  title: "The knapsack problem: how to define the state"
  tldr: "Both checks passed — on to the first complete problem, the 0/1 knapsack. This step does exactly one thing — state the state definition clearly: considering up to which item, with what capacity limit, what is the maximum value? Then hand-compute a few states with three items, to verify the definition drops no dimension."
  body: >-
    The 0/1 knapsack — n items, each with weight w and value v, a knapsack of capacity W, each item taken at most once; find the maximum total value. Greedy does not work (taking by value density gets blocked by a large item), but [[DP]] does. Define dp[i][c] as the maximum value considering only the first i items with capacity limit c. Look at item i — do not take it, and the answer is dp[i−1][c]; take it, provided c is at least w_i, and the answer is dp[i−1][c−w_i] plus v_i. Taking the maximum of the two is the transition equation; the base case is dp[0][*] = 0. The total number of states is n times W, each state transitions in O(1),
    and the total complexity is O(nW).


    Walk through what the states mean with three items, capacity W = 5, the items being weight 2 value 3, weight 3 value 4, and weight 4 value 5. dp[1][5] looks only at the first item — it fits, value 3. dp[2][5] looks at the first two — not taking the second item gives 3, taking it gives
    dp[1][2] + 4 = 7, and the maximum is 7, corresponding to taking both of the first two items at total weight exactly 5. dp[3][5] compares again — not taking the third item gives 7; taking it gives dp[2][1] + 5, and at capacity 1 neither of the first two items fits, so the value is 0 and the result is 5; the maximum is still 7.


    This example shows that neither of the state's two dimensions can be dropped — record only the capacity and not how many items have been considered, and the same item gets counted repeatedly. Also note that W appearing in the complexity means this is [[pseudopolynomial|伪多项式]] — when W grows to 10 to the 9th power, the table cannot even be allocated, and it is time to switch to a state defined by value, or to an approximation algorithm.
  derivation: original
  sources:
  - ref: clrs
    locator: "Chapters 15/16, discussion of the knapsack problem (the 0/1 vs. fractional contrast)"
    claim: The 0/1 knapsack is solved optimally with a DP state defined by items and capacity; greedy does not apply to the 0/1 knapsack
    status: verified
    checkedBy: Checked by Muse
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: "The whole transition: take or don't take, take the larger"
    rows:
    - label: Don't take item i
      cells:
      - v: dp[i−1][c]
    - label: Take item i
      cells:
      - v: dp[i−1][c−wᵢ] + vᵢ
    - label: dp[i][c]
      cells:
      - v: = max of the two
        mark: found
  log:
  - mode: State
    event: "The state is pinned down: the state's two dimensions decide the table's size and the total complexity, and dropping either dimension counts the same item repeatedly."
- id: knapsack-fill
  title: "Filling the table: why the order matters"
  tldr: "The state and the transition are in place; this step looks at why the order of filling the table cannot be written carelessly — each row depends only on the previous row, so computing from small to large never reads an empty value. Finally, when the table is compressed to one dimension, the capacity must be traversed in reverse — the difference between forward and reverse order is the entire dividing line between the 0/1 knapsack and the unbounded knapsack."
  body: >-
    In a bottom-up implementation, the transition references only the previous row, so computing from i = 1 up to n is always safe (every value needed has already been computed). Going further, row i uses only row i−1, so the table can be compressed into a one-dimensional array, where dp[c] means the optimum at capacity c after the items processed so far have been considered. One-dimensional compression has a famous trap — if c is traversed from small to large, the same item gets used again within the current round (it becomes the unbounded knapsack); c must be traversed from large to small, so that every c references the previous round's value. This one line's direction is the entire dividing line between the 0/1 and unbounded knapsacks in code.


    After the compression to one dimension, the dependency becomes a left-right relation within the same row — traversing in reverse guarantees that the dp[c − w] you read is still the previous row's old value, while traversing forward reads the new value just written in this row, which amounts to allowing the current item to be taken once more. Forward order corresponds exactly to the unbounded knapsack (an unlimited number of each item) — the two knapsacks differ in code by nothing but a traversal direction.
  derivation: original
  sources:
  - ref: clrs
    locator: "Chapter 15, bottom-up computation order"
    claim: The computation order of a DP table must guarantee that the subproblems a transition references are solved first
    status: verified
    checkedBy: Checked by Muse
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: "One-dimensional knapsack: reverse capacity traversal is the key to 0/1"
    rows:
    - label: c forward (wrong)
      cells:
      - v: This round's new value gets reused
        mark: active
      - v: The item gets taken repeatedly
    - label: c reverse (right)
      cells:
      - v: References the previous round's value
        mark: found
      - v: Each item at most once
        mark: found
  log:
  - mode: Implementation
    event: "The filling order is pinned down: with the same transition, one-dimensional forward order corresponds to the unbounded knapsack and reverse order to the 0/1 knapsack — the direction is the entire dividing line."
  code:
    lang: typescript
    code: |-
      // 0/1 knapsack: one-dimensional DP, capacity must go in reverse
      function knapsack(w: number[], v: number[], W: number): number {
        const dp = new Array(W + 1).fill(0);   // dp[c]: maximum value at capacity c
        for (let i = 0; i < w.length; i++) {
          for (let c = W; c >= w[i]!; c--) {   // reverse: ensures each item is used only once
            dp[c] = Math.max(dp[c]!, dp[c - w[i]!]! + v[i]!);
          }
        }
        return dp[W]!;
      }
    note: Change the inner loop to forward order and the semantics become the unbounded knapsack
    highlight: 5
- id: sequence
  title: "Sequence [[DP]]: [[LIS]] and [[edit distance|编辑距离]]"
  tldr: "The knapsack's state hangs on items and capacity; this step switches to another family of problems, where the state hangs on positions and prefixes. First, see how the longest increasing subsequence looks back for a predecessor it can attach to; then see how the edit distance's cell chooses among its three neighbors — left, top, and top-left; and finally work the transitions through with two small examples."
  body: >-
    Another large family is sequence problems. The longest increasing subsequence (LIS) — dp[i] is the length of the longest increasing subsequence that must end at a[i], and the transition looks back at every j < i with a[j] < a[i] and takes the maximum of dp[j] + 1,
    which is O(n²); there is also an O(n log n) solution that maintains a tails array plus binary search (echoing the binary search lesson). Edit distance ([[Levenshtein]]) — dp[i][j] is the minimum number of operations to turn the first i characters of string A into the first j
    characters of string B, and the transition is a three-way choice — delete (dp[i−1][j] + 1), insert (dp[i][j−1] + 1), or replace-or-keep (dp[i−1][j−1] + whether this position matches). The [[diff]] tool, spelling correction, and DNA alignment are all variants of it.


    Add a worked example for LIS, with the sequence 3, 1, 2. The dp for ending at 3 is 1, and for ending at 1 it is also 1; at 2, look back for smaller elements — 3 does not qualify, 1 does — so dp equals the dp for ending at 1 plus 1, which is 2, and the table's maximum, 2, is the answer, corresponding to the subsequence
    1, 2. Give edit distance a row of feel as well: to turn abc into abd, only the last character differs among the three positions, c versus d, so the replace transition gives dp[2][2] + 1, and dp[2][2] is 0 because ab and ab are identical — a total cost of 1, matching intuition.


    Both families hang their states on a prefix or a position, and their transitions look back at only finitely many neighbors — that is sequence DP's fingerprint. One last reminder: the O(n log n) optimization for LIS maintains the smallest possible tail for each subsequence length; it cannot directly produce the subsequence itself, and reconstructing the path takes separately stored predecessors.
  derivation: original
  sources:
  - ref: clrs
    locator: "Chapter 15, longest common subsequence and edit-distance-type problems"
    claim: Sequence problems can be solved with DP over states defined by prefixes, and edit distance is built from the three transitions of insertion, deletion, and substitution
    status: verified
    checkedBy: Checked by Muse
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: "The edit distance table: each cell comes from its three neighbors — left, top, top-left"
    rows:
    - label: dp[i][j]
      cells:
      - v: Delete dp[i−1][j]+1
      - v: Insert dp[i][j−1]+1
      - v: Replace dp[i−1][j−1]+?
        mark: found
  log:
  - mode: Sequences
    event: "This family is clear: the state is defined on a prefix, and the transition looks back only at nearby cells or predecessors."
- id: lcs
  title: "Longest common subsequence: a full walk through the 2D table"
  tldr: "The [[edit distance|编辑距离]] table takes the minimum of three neighbors; this step looks at its close relative, the longest common subsequence — when the last characters match, take the top-left plus one; when they differ, take the larger of top and left. Walk the whole table with two short strings, then see, once the answer is computed, how to walk backwards and assemble the subsequence itself."
  body: >-
    The longest common subsequence, [[LCS]], asks for a string of characters picked from each of two strings in their original order, identical in both, not necessarily contiguous. The state is dp[i][j], the LCS length of the first i characters of A and the first j characters of B, and the transition has two cases — if the last characters are the same, dp equals dp[i − 1][j − 1] + 1; if they differ, take the larger of dp[i − 1][j] and dp[i][j − 1]. The base case is an answer of 0 when either string is empty.


    Walk the whole table with A = abc and B = ac. At i = 1, the character is a — at j = 1, a matches a, giving 1; at j = 2, c differs, so take the larger of left and top, giving 1. At i = 2, the character is b, which matches neither a nor c, so the whole row copies the maximum from above and stays at 1. At i
    = 3, the character is c — at j = 1 the larger value is 1; at j = 2 the last characters, both c, match, so take dp[2][1] + 1 = 2. In the end dp[3][2] = 2, corresponding to the common subsequence ac, and every step's origin can be pointed to in the table.


    Reconstructing the actual subsequence means walking backwards from the bottom-right corner — on a match, collect the character and move to the top-left; on a mismatch, move in the direction of the larger value. LCS and edit distance are two readings of the same table — the text differences the [[diff]] tool displays are, underneath, exactly this family computing which lines to keep and which to add or delete.
  derivation: original
  sources:
