level: 进阶
minutes: 34
prereq:
- dsa/dynamic-programming
- dsa/greedy
objectives:
- Use the growth accounts of polynomial vs. exponential to judge whether a brute-force algorithm is feasible at a given scale
- Rewrite optimization problems such as the traveling salesman and the knapsack as decision problems, and state the verification condition for a problem to belong to NP
- Use the direction of a reduction to judge which problem is harder, and explain NP-completeness's shared-glory structure
- On recognizing an NP-complete problem, list the five coping routes of approximation, heuristics, special-case structure, parameterization, and solvers
aiLink: Large models hit this same wall when solving problems — on combinatorial optimization and planning tasks, a model leans on heuristic search and on calling SAT and planning solvers as a backstop, rather than truly having a polynomial exact algorithm. Understand NP-completeness and you understand why intelligent systems outsource hard problems to solvers, and why they can promise only good enough, never optimal.
design:
- mechanism: Decision problems as the common currency — every problem is first rewritten as a yes-or-no question answering only yes or no, so the answer is unified into a single bit, and only then can difficulty be compared, verification be uniformly defined, and reduction have a common interface
  problem: Optimization problems' answers come in every form — a shortest path is a number, a course schedule is a table, a coloring is an assignment — and with different forms there is no way to compare directly who is harder, still less to define uniform rules for verification and translation; the entire theory of difficulty cannot even lay its foundation flat
  choice: Add a threshold to an optimization problem and rewrite it as a decision version — the traveling salesman asks whether there is a route of at most K, the knapsack asks whether a packing of at least V can be made — and use threshold binary search to guarantee that the decision and optimization versions are equivalent in difficulty in the polynomial sense; the alternative is building the theory directly on the optimization forms, whose interfaces are doomed to fragment
  tradeoff: The rewrite drops the information of the optimum itself, so every search for the optimum must call the decision version repeatedly for several extra rounds; in exchange, the whole theory shares one set of definitions and every later conclusion can be stacked on the same foundation — a trade that half a century of practice has proved extremely worthwhile
  root: The root cause is that comparison needs a common measure; a yes-or-no question presses the answer space down to the smallest single bit, so all of a problem's difficulty can only hide in the search process — with nowhere to hide, difficulty becomes, for the first time, something that can be discussed precisely and passed between problems
- mechanism: Reduction proves relative difficulty while bypassing absolute lower bounds — translate A into B and borrow B's solver to solve A, weaving the relative conclusion that B is at least as hard as A into a network along which difficulty is transmitted
  problem: Proving directly that some problem has no polynomial algorithm is a millennium-scale difficulty — to this day nobody has completed such an absolute lower-bound proof for any natural problem; insist on proving the lower bound first and then talking about difficulty, and the whole field cannot move an inch
  choice: Prove relative difficulty instead — it takes only a polynomial-time translation that lets a known hard problem parasitize the new problem, and the difficulty is transmitted along the reduction chain; the alternative is hard-proving a lower bound separately for every problem, for which there is neither a tool nor a precedent
  tradeoff: A relative conclusion is forever conditional — it says that if B is solvable then A is solvable, not that A is absolutely unsolvable; the whole network ultimately hangs on the undecided question of whether P equals NP, and however dense the network, it cannot substitute for that final proof
  root: The root cause is that the transmission of difficulty is easier to prove than its origin — a translation is a concrete object that can be constructed by hand, while the non-existence of a fast algorithm is a negation over all possible algorithms; the asymmetry between construction and negation is the entire reason the reduction method exists
- mechanism: NP-completeness's shared-glory structure — this hardest batch of problems can all be reduced to each other, so if any one of them is solved in polynomial time, every NP problem is solved along with it, and conversely none of them can become simple on its own
  problem: If every hard problem were hard in its own way, researchers would forever be scattered across thousands of isolated islands, attacking them one by one, unable either to concentrate their force or, on meeting a new problem, to judge quickly whether it is worth grinding on
  choice: Use reduction to link this hardest batch into an equivalence class — a new problem need only join the chain to inherit the whole class's conclusions; the first anchor proof that Cook and Levin gave SAT gave the chain its starting point; the alternative is studying each problem independently, with conclusions that cannot migrate
  tradeoff: Shared glory also means a shared-fate kind of risk pooling — a great deal of practice in cryptography and optimization engineering defaults to this batch being unsolvable, so if any link in the chain is ever broken through, what is struck is not one problem but an entire landscape of technology
  root: The root cause is that the transitivity of reduction turns difficulty into a quantity that can flow; this batch of problems shares a single difficulty waterline, and when the waterline rises or falls it necessarily moves for all of them together — which is both why they are worth attacking in concentration and why engineers should avoid them in concentration
quiz:
- q: At n = 100, roughly how far apart are n cubed and 2 to the 100th power?
  options:
  - About 100 times
  - About 10 to the 6th power times
  - About 10 to the 24th power times
  - Roughly the same size
  answer: 2
  explain: n cubed is 10 to the 6th power, and 2 to the 100th power is about 1.27 × 10 to the 30th power — a difference of about 10 to the 24th power times; even at 10 to the 9th power operations per second it would take about 4 × 10 to the 13th power years.
- q: What is the condition for a decision problem to belong to NP?
  options:
  - A polynomial-time algorithm already exists that solves it
  - A yes answer comes with a piece of evidence that is not long, which can be verified in polynomial time once obtained
  - Its number of candidate answers is exponential
  - It can be reduced to SAT
  answer: 1
  explain: NP's intuitive definition is exactly easy to verify — both the evidence's length and the verification time are polynomial; being solvable quickly is P's condition, which is stronger than NP.
- q: Problem A is known to reduce to problem B in polynomial time. What is the correct conclusion?
  options:
  - A is at least as hard as B
  - B is at least as hard as A
  - A is as easy as B
  - The two's difficulties are unrelated
  answer: 1
  explain: A reduction translates A's instances into B's instances and borrows B's solver to solve A, which shows that A's difficulty does not exceed B's — B is at least as hard as A; reverse the direction and every conclusion reverses.
- q: Which of the following statements about factoring large integers and the knapsack's DP is correct?
  options:
  - Factoring large integers is an NP-complete problem, and cryptography bets on it
  - The knapsack's O(nW) is a polynomial algorithm, so the knapsack is not among the NP-complete problems
  - Factoring large integers is in NP but has not been proved NP-complete, and the knapsack's O(nW) is pseudopolynomial — polynomial in the numeric value rather than in the number of bits
  - Both have already been proved to belong to P
  answer: 2
  explain: Factoring is easy to verify and in NP, but has not been proved NP-complete; the knapsack DP's running time grows with the numeric value of W, while the input occupies only about log W bits, so it is pseudopolynomial and does not overturn its NP-completeness.
