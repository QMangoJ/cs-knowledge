- id: examples
  title: "A circle of familiar [[NP]]-complete problems"
  tldr: "The definitions are done; now line this hardest batch up in a circle and check each one's fingerprint — the [[traveling salesman|旅行商问题]], [[graph coloring|图着色]], [[vertex cover|顶点覆盖]], [[subset sum|子集和]], and the decision version of the knapsack. Each verifies with nothing but a linear scan, while finding means turning over an exponential space of combinations. Finally, recover one puzzle: the knapsack plainly has a table-storing algorithm, so why does it still count as NP-complete?"
  body: >-
    Line this hardest batch up in a circle and you will find they are all old acquaintances. The traveling salesman decision version asks whether there is a route of at most K — verifying means adding up the handed-over route segment by segment and comparing with K; the hardness is that the number of routes explodes with the cities. Graph coloring asks whether a map can be colored with three colors so that neighbors differ — verifying means checking, edge by edge, that the two ends differ; the hardness is that the color combinations explode with the vertices. Vertex cover asks whether at most K vertices can be chosen to cover every edge — verifying means confirming, edge by edge, that at least one end is chosen; the hardness is that the vertex-choice combinations explode. Their shared fingerprint is exactly the same: verification takes only a linear scan, while finding means turning over an exponential combination space.


    Subset sum and the knapsack decision version deserve a separate recovery. Verifying a group of numbers for subset sum is one addition; verifying a packing for the knapsack decision version is one summing of weight and value. But why doesn't the O(nW) that the previous lesson's DP gave the knapsack count as having solved it? The key is how the input scale is accounted: writing W into the input takes only about log W bits — when W equals 10 to the 9th power, it occupies only about 30 bits in the input, yet the DP table must be opened to the order of 10 to the 9th power, so the running time grows polynomially in the value's magnitude rather than in the number of bits. An algorithm that disguises itself as polynomial by riding on the numeric value like this is called [[pseudopolynomial|伪多项式]]; it does not overturn the knapsack's NP-completeness — it only reminds us that complexity must be accounted against the input's encoding length.


    The practical value of recognizing this circle of problems is instant judgment. When a requirement involves combinatorial choices — scheduling, packing, siting, coloring, covering — and demands an exact optimum, your experience library should light up at once: this is very likely NP-complete, so do not promise a schedule yet; talk first about scale and the room for approximation. The light is triggered not by memorizing a list but by reading the fingerprint — candidate combinations exploding exponentially while a single candidate is extremely easy to verify; when both appear together, it is basically it.
  derivation: original
  sources:
