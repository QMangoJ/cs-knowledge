- id: poly-vs-exp
  title: "Feasible vs. infeasible: the growth account of polynomial against exponential"
  tldr: "To talk about what cannot be computed, you first need a ruler that does not change with the machine. This step defines feasible as [[polynomial time|多项式时间]] and hitting the wall as exponential time, then works the account at scale 100 down to concrete numbers to see how large the gap really is; finally, it names why small-scale tests always deceive."
  body: >-
    To talk about what cannot be computed, fast and slow first have to be defined as a standard an account can be kept in. In everyday speech, fast usually means a result in a few seconds, but that standard changes with the machine and with one's mood — it cannot serve as a ruler. The ruler the theory community uses looks only at the shape of growth: if the running time is a polynomial in the input scale n — n, n squared, n cubed, for example — it counts as the feasible tier; if the running time carries an exponential term such as 2 to the power of n, it counts as the wall tier. A faster machine changes only the constants, not the shape, so this ruler has not gone out of date in decades.


    Work the account into numbers. Take n = 100. On the polynomial side take n cubed, which equals a million, that is, 10 to the 6th power. On the exponential side take 2 to the 100th power, which is about 1.27 × 10 to the 30th power; the two differ by a factor of about 10 to the 24th power. Convert further into time: suppose a machine can do 10 to the 9th power basic operations per second. The polynomial side then needs only about a thousandth of a second, while the exponential side needs about 1.27 × 10 to the 21st power seconds, which is about 4 × 10 to the 13th power years — about 2900 times the age of the universe, 13.8 billion years.


    This account explains why small-scale tests always deceive. At n = 20, 2 to the power of n is only about a million, and it runs with no pressure at all, so a brute-force method passes every sample and only shows its true form in production, on real scale. To judge whether an algorithm is usable, do not look at how fast it runs on small data; look first at which side its growth shape stands on, polynomial or exponential.
  derivation: original
  sources:
  - ref: sipser
    locator: Chapter 7.1 Measuring Complexity and 7.2 The Class P
    claim: Polynomial time serves as the operational boundary of feasible computation, and exponential time quickly becomes infeasible as the scale grows
    status: verified
    checkedBy: Checked by Muse
    checkedAt: 2026-11-13
  canvas:
