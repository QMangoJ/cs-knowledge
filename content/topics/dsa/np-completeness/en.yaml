- id: decision
  title: "[[Decision problems|判定问题]]: first turn the problem into a yes-or-no question"
  tldr: "The ruler is in place; what is still missing is a common unit of measurement — problems whose answers come in every shape cannot have their difficulties compared directly. This step rewrites optimization problems uniformly as decision problems that answer only yes or no, adding a threshold to the shortest route, [[subset sum|子集和]], and the knapsack each, and shows why the rewrite does not make the problem any simpler."
  body: >-
    When the theory community talks about difficulty, it talks almost exclusively about one form of problem — the decision problem, whose answer is only yes or no. Why go to this trouble? Because a question like what the optimum is has answers in every shape, and there is no way to compare directly which of two problems is harder; a yes-or-no question's answer is a single bit, so all decision problems stand under the same ruler, their difficulties become comparable at once, and the translation and solver-borrowing to come later get a common interface. It is like an exam first turning every word problem into a true-or-false question — not to make it simpler, but to make uniform grading possible.


    The rewrite is mechanical: add a threshold to the optimization problem. The [[traveling salesman|旅行商问题]] originally asks how short the shortest route is; rewritten, it asks — does there exist a route that visits every city with total length no more than K? Subset sum could originally ask for the largest sum that can be formed; rewritten, it asks — can a group be picked from the given numbers whose sum is exactly the target T? The knapsack originally asks for the maximum value; rewritten, it asks — can a packing be made with total value at least V and total weight no more than the capacity? The thresholds K, T, and V are all given by the asker.


    The decision version has not made the problem any simpler. Ask the decision version repeatedly and the optimum can be squeezed out by binary-searching the threshold, so the decision and optimization versions are equivalent in difficulty in the polynomial sense. The real gain is uniformity: from this step on, every problem this lesson discusses is a yes-or-no question, and the concepts of verification, [[reduction|归约]], and completeness all stand on this level ground. On seeing an optimization problem, translating it in your head into a yes-or-no question first is the entry move for understanding everything that follows.
  derivation: original
  sources:
  - ref: clrs
    locator: "Chapter 34.1 Polynomial Time (the relation between decision problems and optimization problems)"
    claim: Complexity theory takes decision problems as its basic objects; an optimization problem can be rewritten as a decision problem via a threshold, at equivalent difficulty
    status: verified
    checkedBy: Checked by Muse
    checkedAt: 2026-11-13
