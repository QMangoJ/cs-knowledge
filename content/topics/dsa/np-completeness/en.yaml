license: CC-BY-4.0
title: "NP-Completeness: Some Problems Are Not Slow — Nobody Can Compute Them Fast"
summary: The first ten lessons kept computing problems faster and faster; this closing lesson asks the reverse — there is a class of problems whose answers verify in a flash yet seem to admit no shortcut at all in finding them, and they are all tied together in one bundle, so solving one would solve them all.
premise: The earlier lessons kept finding ways to compute problems faster, but there is a class of problems for which, over decades, nobody in the world has found a genuinely fast solution — grow the scale even slightly and brute-force trying explodes on the spot. This lesson explains where exactly these problems are hard, how they relate to each other, and what playbook an engineer should switch to after recognizing one, using three examples — course scheduling hitting the wall, the route explosion of the [[traveling salesman|旅行商问题]], and the verification of [[subset sum|子集和]] — in plain language and hand-computed numbers throughout, assuming no background in the theory of computation.
position: >-
  This lesson opens a new section, "Problems That Cannot Be Computed: The Ceiling of Complexity," and is also the closing lesson of the data structures and algorithms subject. It follows string matching's optimization of passing over the text only once, and asks in reverse where the end of optimization lies. After this lesson you will be able to judge, with the growth accounts of polynomial versus exponential, whether an algorithm is feasible; to rewrite an optimization problem as a [[decision problem|判定问题]]; to explain what verification, guessing, and [[reduction|归约]] each mean; and, on recognizing that a problem is NP (nondeterministic [[polynomial time|多项式时间]]) complete, to switch playbooks at once instead of grinding on for an efficient exact solution that very likely does not exist.
bridge:
  prev: The first ten lessons all kept computing problems faster and faster; this closing lesson asks the reverse — there is a class of problems that nobody can make fast. First, see clearly what this wall looks like — it is not that some machine is not fast enough, nor that some programmer is not clever enough, but a class of problems for which all of humanity has found no shortcut in decades.
overview:
- key: In one sentence
  value: "[[NP]]-complete problems verify an answer in a flash, seem to admit no shortcut at all in finding one, and [[reduce|归约]] to each other — solving one amounts to solving them all. Take the [[traveling salesman|旅行商问题]] problem: hand you a route, and one pass adding up its total length tells you whether it is short enough; but to find the shortest route among all routes, there is currently no method much faster than trying a great many of them."
- key: An operational definition of feasible
  value: Here, feasible is defined as [[polynomial time|多项式时间]] and hitting the wall as exponential time; at n = 100 the two differ by a factor of about 10 to the 24th power. In polynomial time, 100 elements take on the order of tens of thousands to a few million steps; in exponential time, each additional element doubles the work, and by 100 the account is already unrealistically large.
- key: A common currency
  value: First rewrite the problem as a [[decision problem|判定问题]] that only answers yes or no, and only then can difficulties be compared and problems reduced to each other. For example, turn finding the shortest route into asking whether there exists a route no longer than a given length — the answer is left with only yes or no, and different problems finally share a common way to be compared and translated.
- key: The core tool
  value: A reduction is a translation — translate a new problem into an old problem and borrow the old problem's solver to solve it — and the direction decides the difficulty conclusion. If an old problem can be translated into a new problem, the new problem is at least as hard as the old one; write the direction backwards and the difficulty conclusion comes out entirely reversed.
- key: Engineering discipline
  value: On recognizing NP-completeness, switch playbooks — approximation, heuristics, special-case structure, [[parameterization|参数化]], and constraint solvers are the everyday way out. Recognizing one is not surrender; it is stopping the time spent on an exact optimum and going instead for an answer that is good enough, or using the special structure of your own batch of data to press the scale down.
