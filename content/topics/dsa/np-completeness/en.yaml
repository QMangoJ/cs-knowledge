- id: np-complete
  title: "[[NP]]-completeness arrives: the hardest batch inside NP"
  tldr: "The [[reduction|归约]] ruler is ready; this step layers the inside of NP once more — a small batch of problems are both easy to verify and able to receive a reduction from every NP problem; they are the NP-complete problems. First see why this definition means solving one amounts to solving them all, then see which problem first stood in this position."
  body: >-
    With the reduction ruler in hand, the inside of NP can be layered once more. Most problems in NP are merely easy to verify, at uneven difficulties; but a small batch are the hardest among them, meeting two conditions — first, they are themselves in NP, their answers easy to verify; second, every problem in NP can be reduced to them in [[polynomial time|多项式时间]]. A problem meeting both is called NP-complete — intuitively, the hardest batch in NP, hard enough to concentrate the difficulty of all of NP into a single problem of its own.


    Shared glory is its most astonishing structural property. Suppose one day someone finds a polynomial-time algorithm for any one NP-complete problem. Then any NP problem can first be reduced to it and then call that algorithm, so every NP problem is solved together, and P equals NP. The reverse holds as well: these problems can all be reduced to each other, so none of them can become simple on its own. They are like a string of keys tied by the same rope — turn one open and the whole string of locks opens at once; half a century of failing to turn any one of them is also side evidence that the rope is real.


    The first problem proved NP-complete was [[SAT]]. SAT asks: given a Boolean formula built from AND, OR, and NOT, can each variable be assigned true or false so that the whole formula comes out true? In 1971, [[Cook and Levin|Cook–Levin 定理]] each independently proved that the verification process of any NP problem can be encoded as a Boolean formula, so SAT became the first NP-complete problem. This lesson takes only the intuition: verification is nothing but a string of yes-or-no judgments, and a Boolean formula happens to be the universal language for recording yes-or-no judgments, so it can hold any verification process. There is no need to carry the proof's details; with SAT as the anchor, a later problem need only receive a reduction from SAT to prove, in relay, that it too is NP-complete.
  derivation: original
  sources:
