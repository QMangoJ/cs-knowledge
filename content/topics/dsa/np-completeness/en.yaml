- id: reduction
  title: "[[Reduction|归约]]: translate a new problem into an old problem"
  tldr: "With the definition of [[NP]] in place, a ruler for comparing difficulty is still needed. This step introduces the reduction: translate a new problem into an old problem and borrow the old problem's solver to solve it. The point is to nail the direction down — the direction of the translation and the direction of the difficulty conclusion are exactly opposite, and writing it backwards here reverses every conclusion that follows."
  body: >-
    Now for the lesson's core tool, the reduction. First in everyday words: you meet a problem in Chinese that you cannot solve, but you have a machine that solves only problems in English. As long as you can translate the Chinese problem into an English problem sentence by sentence, and translate the English answer back, you can in effect solve the Chinese problem. The translation here is called a reduction; the English problem is the old problem, the Chinese problem is the new problem, and the machine is the old problem's solver. The translation itself must be fast enough — the requirement is [[polynomial time|多项式时间]] — or the translation costs more than solving the problem and the deal does not stand.


    Nail the notation down. Reducing problem A to problem B means giving a polynomial-time translation that turns every instance of A into an instance of B, with the answer before and after translation both yes or both no. Then, as long as there is a solver for B, wrapping it with the translation solves A — the flow is translate first, then call, then take the answer as delivered. In one sentence, A's difficulty does not exceed B plus the cost of the translation. Read backwards, that is the key conclusion: B is at least as hard as A, because even A can be solved by parasitizing B.


    Direction is the only easy place to go wrong here, and the favorite trap of interviews and exams. A reduces to B — the hard one is B, not A. The translation's direction turns A into B; the difficulty conclusion's direction is that B is no lower than A. Keep one memory aid only: to prove a new problem hard, reduce a known hard problem to it and let the hard problem parasitize it; reducing the new problem to the hard problem instead only shows the new problem is no harder than the hard one, and proves no hardness at all. Everything later about judging who is NP-complete relies on this sense of direction.
  derivation: original
  sources:
  - ref: sipser
    locator: "Chapter 7.4 NP-completeness (the definition and transitivity of polynomial-time reduction)"
    claim: When A reduces to B in polynomial time, if B is solvable then A is solvable, so B is at least as hard as A
    status: verified
    checkedBy: Checked by Muse
