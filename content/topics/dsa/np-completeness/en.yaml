- id: verify
  title: "The intuition of [[NP]]: hard to solve, fast to verify"
  tldr: "The [[decision problem|判定问题]] is set up; this step looks at the lesson's most important contrast — finding an answer and verifying an answer are two tasks of entirely different difficulty. First set the scene with Sudoku, then compute it once with [[subset sum|子集和]] — finding means turning over every subset, verifying takes a single addition. Collect this class of problems together and you get NP."
  body: >-
    Next, the lesson's most important contrast: finding an answer and verifying an answer are two tasks of entirely different difficulty. Sudoku is a ready-made example. Fill a Sudoku board in from the empty cells and you may be trial-and-erroring for a long while; but if someone hands you a completed board directly, verifying whether it is right takes only scanning it row by row, column by column, and box by box, confirming at each place that 1 through 9 do not repeat — done in a few minutes. Filling is search; verifying is checking. The former gropes through an enormous candidate space; the latter simply checks off a ready-made answer item by item.


    Subset sum turns this into pure arithmetic. Given the set 3, 7, 1, 8 and the target 11, finding a group of numbers summing to 11 means picking among 16 subsets; but once someone tells you the answer is 3 + 8, you need only one addition — 3 + 8 = 11 — and it is verified on the spot. Another group, 3 + 7 + 1, also equals 11, and is verified by one addition just the same. The verifier does not need to know how the answer was found; the addition itself is all the work, and however many subsets there are in total has no effect at all on the time to verify one group.


    Collect this class of problems together and you get NP: a problem belongs to NP if and only if, in its yes-or-no version, every yes answer comes with a piece of evidence that is not long, and given the evidence it can be verified within [[polynomial time|多项式时间]]. Now look at P — it is the problems whose answers can both be found in polynomial time and verified. What can be found can of course be verified — just rerun the finding process — so P is contained in NP. Every suspense in the rest of this lesson comes down, in the end, to one sentence: is every problem that verifies fast also findable fast? Nobody knows yet.
  derivation: original
  sources:
