- id: p-vs-np
  title: "P vs. [[NP]]: the wall with a million-dollar bounty"
  tldr: "The whole lesson gathers into one question: does verifying fast necessarily mean finding fast? This step looks at this wall's official price tag and the mainstream conjecture, then lands on why an ordinary person should care — modern cryptography's sense of security is bet precisely on easy-to-verify, hard-to-find; along the way it corrects a common misreport: factoring large integers is not believed to be NP-complete."
  body: >-
    Gather the whole lesson into one question: does P equal NP? In human terms — can every problem whose answer can be verified quickly also have its answer found quickly? If they are equal, the entire wall this lesson describes vanishes in an instant, and every NP-complete problem gains a polynomial algorithm; if they are not equal, the wall is proved mathematically real, and that territory of easy-to-verify, hard-to-find is an inherent structure of the universe. Since the problem was formally posed in 1971, neither direction has been proved by anyone; it is the most famous open problem in computer science.


    Its weight carries an official price tag. In 2000, the [[Clay|Clay 数学研究所]] Mathematical Institute listed P versus NP as one of the seven [[Millennium Prize Problems|千禧年大奖问题]], and the first person to give a complete, correct solution receives 1 million US dollars; of the seven problems, only one has been solved to date, and P versus NP is not among them. The mainstream of the field generally conjectures that P does not equal NP — that the wall is real. The reason is plain: so many clever people have searched for a shortcut for half a century and found nothing; but a conjecture is not a proof, and until a proof lands, engineers can only arrange their work as if the wall is real.


    Why should an ordinary person care about this wall? Because modern cryptography's sense of security is bet on easy-to-verify, hard-to-find. Multiplying two large primes together is a moment's work, and verifying the product takes one multiplication; factoring the product back into primes, by contrast, has no known fast method — online banking and encrypted communication borrow exactly this asymmetry. One point must be stated precisely here: the problem of factoring large integers is in NP and its answers are easy to verify, but it is not believed to be NP-complete, and may not even remain uncomputable-fast forever; it merely happens to stand on an open patch of ground beside the wall. Calling factoring NP-complete is a common game of telephone; this lesson corrects it deliberately — the wall's shape is far finer than the slogan.
