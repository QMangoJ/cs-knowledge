    locator: "Chapter 7.3 The Class NP (the equivalence theorem between the verifier definition and the nondeterministic Turing machine definition)"
    claim: NP equals both the class of problems with a polynomial-time verifier and the class of problems solvable in nondeterministic polynomial time
    status: verified
    checkedBy: Checked by Muse
    checkedAt: 2026-11-13
