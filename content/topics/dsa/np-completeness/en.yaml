- id: np-hard
  title: "[[NP]]-hard: hard, but not necessarily easy to verify"
  tldr: "NP-completeness requires both hard and easy to verify. This step looks at problems that meet only the hard half and are not in NP — NP-hard: the optimization version of the [[traveling salesman|旅行商问题]] is not even a yes-or-no question, and the [[halting problem|停机问题]] has no algorithm at all. Finally, one passage draws the containment relations among P, NP, NP-complete, and NP-hard clearly."
  body: >-
    One puzzle piece remains. The definition of NP-complete has two conditions — hard is only one of them; the other is being in NP, that is, easy to verify. If a problem meets only the hard condition — every NP problem can be [[reduced|归约]] to it — but is not itself in NP, it is called NP-hard. Without the easy-to-verify constraint, NP-hard's territory is larger than NP-complete's; it shelters problems whose difficulty is at the ceiling yet for which even a handed-over answer cannot be checked quickly — and some problems are so hard that no algorithm exists for them at all.


    Two ready-made examples. The optimization version of the traveling salesman requires outputting the shortest route itself; it is NP-hard rather than NP-complete, because it is not a yes-or-no question at all — it is not on [[decision problem|判定问题]] territory, so being in NP is out of the question; its decision version is the NP-complete one. More extreme is the halting problem: given a program and an input, will it halt? It has no algorithm at all, let alone being easy to verify, yet NP problems can still be reduced to it, so it also counts as NP-hard. Clearly, NP-hard measures only a lower bound on difficulty — not verifiability or solvability; it is a ruler that measures hardness alone.


    Draw the four's relations as a containment diagram in words. From the inside out: P is innermost — it is both easy to solve and easy to verify; NP circles every problem that is easy to verify, and P is its subset; NP-complete is the small patch inside the NP circle pressed against its top edge, intersecting the NP-hard circle; the NP-hard circle is the largest, spilling outward beyond NP, and the intersection is exactly NP-complete. Memorize this diagram and every concept in this lesson falls into place; whether P equals NP is still unknown, so whether the territory between P and NP-complete in the diagram truly exists is exactly the next section's millennium problem.
  derivation: original
  sources:
  - ref: clrs
    locator: "Chapter 34.3 NP-completeness and reducibility (the distinction between the definitions of NP-hard and NP-complete)"
    claim: NP-hard requires only that every NP problem can be reduced to it, not that it is itself in NP; NP-complete is the intersection of the two
    status: verified
    checkedBy: Checked by Muse
    checkedAt: 2026-11-13
  canvas:
    kind: datastate
    structure: array
    caption: "The containment relations of the four, circle inside circle from the inside out — the intersection is NP-complete"
    rows:
