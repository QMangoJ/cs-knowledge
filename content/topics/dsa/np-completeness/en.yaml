- id: guess
  title: "Another way to say it: a guessing machine with outrageous luck"
  tldr: "The last step defined [[NP]] through verification; this step gives it an equivalent face — a machine that, at every fork, can pick the direction leading to the answer directly. First see which step it saves when solving [[subset sum|子集和]], then make clear why it is only a thought experiment, not a real machine."
  body: >-
    The verification account has a completely equivalent twin account, which sounds like cheating the first time you hear it, but it helps you picture NP more intuitively. Imagine a special machine that, facing every fork in the road, can pick directly the road that leads to the answer — its luck is forever outrageous and it never backtracks. Solving subset sum with it, it does not enumerate the 16 subsets; instead, for each number it directly guesses take or don't take, and guesses right every time, so the only work left is adding up the guessed group and checking the sum. The steps it walks after guessing right are exactly the steps of verification.


    This machine's name is a nondeterministic machine. The word nondeterministic sounds intimidating; its meaning is actually very plain — at a fork, instead of trying each road one by one, it is allowed to walk the right one directly. Unpacking the letters, NP is nondeterministic [[polynomial time|多项式时间]] — in human terms, this luck machine can solve the problem by guessing plus verifying within a polynomial number of steps. Note that it is not a real machine, still less a quantum computer; it is only a thought experiment, giving the property of being easy to verify a different face.


    Why are the two accounts equivalent? The guessing part is, in essence, producing out of thin air the evidence the previous section described; the verifying part is identical, word for word, in both accounts. Conversely, any problem that can be verified quickly can be handed to this machine to guess the evidence first and then verify it. So from now on, whenever you see NP, you can switch freely between the two pictures — an exam question that grades in a flash once handed in, or a hard problem a luck machine guesses in one shot — and use whichever is handier. This lesson takes the intuition only; there is no need to memorize any formal definition of an automaton.
  derivation: original
  sources:
