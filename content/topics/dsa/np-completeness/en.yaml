- id: practice
  title: "The engineer's discipline for coping, and the subject's close"
  tldr: "The final section lands back in engineering: recognizing [[NP]]-completeness is not surrender — it is the signal to switch playbooks. This step lays the menu out — approximation, heuristics, special-case structure, [[parameterization|参数化]], mature solvers — then punctures a paradox: these problems often run very fast on real instances, because NP-completeness speaks of the worst case."
  body: >-
    The final section lands back in engineering. On recognizing that a problem is NP-complete, the correct move is not to keep staying up nights hunting for an exact polynomial algorithm, but to switch playbooks at once. The first tier is approximation algorithms — give up optimality and guarantee not being too far off; for example, [[vertex cover|顶点覆盖]] has a simple two-fold approximation: pick an edge and take both its ends, using at most twice the optimal number of vertices. The second tier is heuristics and metaheuristics — [[simulated annealing|模拟退火]], [[genetic algorithms|遗传算法]], and local search guarantee no optimality, yet often give good-enough solutions on real data, and the production systems for scheduling and route planning mostly run on them. The third tier is exploiting special-case structure: on a tree, on a planar graph, or when some parameter is very small, the problem often becomes solvable again — parameterized algorithms are exactly about locking the exponential explosion inside the cage of a small parameter.


    One paradox still needs puncturing. [[SAT]] is an NP-complete problem, yet real-world SAT solvers often handle industrial instances with millions of variables quickly, because real instances carry a great deal of structure and are far from the worst case. NP-completeness speaks of no shortcut in the worst case; it does not pronounce a death sentence on every instance. So the complete version of the engineering discipline is: first recognize the fingerprint, then look at the scale and the structure — solve small scale exactly as usual, hand medium scale to a mature solver, and put approximation and heuristics on large scale, writing the worst-case expectation into the plan rather than pretending it does not exist.


    The subject closes here. Starting from hashing and binary search, these ten lessons kept learning how to compute problems faster; the final lesson learns to recognize which problems cannot be made fast, and how to walk around them gracefully when they cannot. Knowing how to optimize is a skill; knowing when to stop optimizing and to spend the energy on approximation quality and problem modeling is the more expensive skill. The wall does not disappear because you ignore it — seeing it clearly is, precisely, the last tool this course leaves you.
  derivation: original
  sources:
