steps:
- id: why
  title: "The wall, on site: it is not you — the problem itself cannot be computed fast"
  tldr: "First, look at a scene that happens every day: scheduling times and classrooms for dozens of courses, with a long string of constraints — the program tries every schedule and cannot finish even a ten-thousandth of them in a day. This step first lays out the wall-hitting scene clearly, then sets up the first judgment — there is a class of problems where nobody's skill is lacking; no shortcut has been found in decades."
  body: >-
    First, a scene that happens every day. A registrar has to schedule times and classrooms for dozens of courses, with a long string of constraints — a teacher cannot be in two places at once, classrooms cannot overlap, and certain courses must be staggered. She has a program try every possible schedule, and quickly finds that the number of schedules explodes with the number of courses — running for a whole day, the program cannot finish even a ten-thousandth of them. She brings in a faster machine and cleverer colleagues, and all that changes is that the feasible scale moves from twenty courses to twenty-five; the wall does not budge.


    The [[traveling salesman|旅行商问题]] is the classic portrait of the same wall. A salesman must visit a number of cities, each exactly once, and return to the start, finding the shortest route. With only 5 cities the routes can be counted on one's fingers; with 20 cities, the routes a brute-force enumeration must consider already number about 6.08 × 10 to the 16th power — this lesson will compute that account by hand later. The problem itself is not hard to understand at all — an elementary school student can follow it; what is hard is that the candidate answers are too many to ever finish counting.


    The first ten lessons' experience will mislead you here. Sorting can be optimized from quadratic to n log n, search can be optimized to logarithmic, and DP can press the exponential down to polynomial, so it is easy to assume that any problem can be made faster with a little more thought. The first judgment this lesson sets up is exactly the opposite: there is a class of problems for which humanity has searched seriously for over half a century and never found an exact algorithm in [[polynomial time|多项式时间]]. Facing them, the first reaction should not be self-blame or head-on grinding, but to recognize the wall first, then decide how to walk around it.
