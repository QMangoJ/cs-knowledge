license: CC-BY-4.0
title: NP 完全性：有些问题不是慢，是全人类都算不动
summary: 前十课都在把问题越算越快，本课收官问反面：有一类问题，答案验起来飞快、找起来却疑似没有任何捷径，而且它们彼此绑成一团，解开一个就等于解开全部。
premise: 前面几课一直在想办法把问题算得更快，但有一类问题，几十年里全世界都没人找到真正快的解法，规模稍微变大，暴力尝试就直接爆炸。本课要讲清这类问题到底难在哪里、彼此之间有什么关系、工程师认出它们之后该换什么打法，用排课撞墙、旅行商的路线爆炸与子集和的验算三个例子来讲，全程只用大白话与手算数字，不预设任何计算理论背景。
position: 本课开新板块「算不动的问题：复杂度的天花板」，也是数据结构与算法这一科的收官课，它接在字符串匹配把文本只过一遍的优化之后，反过来问优化的尽头在哪里。学完你能用多项式与指数的增长账判断一个算法是否可行，能把优化问题改写成判定问题，能说清验证、猜测与归约各自在说什么，并能认出一道题是 NP 完全时立刻换打法，而不是继续死磕一个很可能不存在的高效精确解。
bridge:
  prev: 前面十课都在把问题越算越快，本课收官要问的是反面——有一类问题无论谁来都快不了，先看清这堵墙长什么样：它不是某台机器不够快，也不是某个程序员不够聪明，而是几十年里全人类都没找到过捷径的一类问题。
overview:
- key: 一句话总结
  value: NP 完全问题验答案飞快、找答案疑似没有捷径，且彼此互相归约，解开一个等于解开全部。比如旅行商问题，给你一条路线，算一遍总长度就知道它够不够短；但要从所有路线里找出最短的那条，目前没有比大量尝试更快多少的办法。
- key: 可行的操作定义
  value: 这里把可行定成多项式时间、把撞墙定成指数时间，n 等于 100 时两者差出约 10 的 24 次方倍。多项式时间下 100 个元素大约是几万到几百万步的量级，指数时间则是每多一个元素工作量就翻倍，账算到 100 时已经大到不现实了。
- key: 统一货币
  value: 先把问题改写成只需回答是或否的判定问题，难度才可比、才能互相归约。比如把找最短路线改成问存不存在一条不超过给定长度的路线，答案只剩是或否，不同问题之间才有了统一的比较和翻译方式。
- key: 核心工具
  value: 归约就是翻译，把新问题翻译成老问题，借老问题的解法器来解，方向决定难度结论。如果能把老问题翻译成新问题，说明新问题至少和老问题一样难；方向写反，得出的难度结论就会整个反过来。
- key: 工程师纪律
  value: 认出 NP 完全就换打法，近似、启发式、特例结构、参数化与约束求解器才是日常出路。认出来不是投降，而是停止在精确最优解上耗时间，转去拿一个够好的答案，或者利用自己这批数据的特殊结构把规模压下来。
