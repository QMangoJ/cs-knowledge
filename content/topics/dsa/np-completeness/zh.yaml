  log:
  - mode: 归约
    event: 翻译必须是多项式时间，借来的解法器才算数
- id: np-complete
  title: NP 完全登场：NP 里最难的那一批
  tldr: 既在 NP 里、又能让所有 NP 问题都归约进来的问题叫 NP 完全，解开任何一个等于解开全部。
  body: >-
    有了归约这把尺子，就能给 NP 内部再分层。NP 里绝大多数问题只是好验，彼此难度参差；但有一小批问题站在塔尖，它们满足两个条件，第一自己在 NP 里，答案好验，第二 NP 里的每一个问题都能多项式时间归约到它身上。满足这两条的问题叫 NP 完全，直观说就是 NP 里最难的一批，难到把整个 NP 的难度都浓缩在自己一个问题里。


    一荣俱荣是它最惊人的结构性质。假设某天有人给任何一个 NP 完全问题找到了多项式时间算法，那么任意 NP 问题都可以先归约到它、再调用这个算法，于是全部 NP 问题一起被解开，P 就等于 NP。反过来也一样，这批问题彼此都能互相归约，谁也别想单独变简单。它们像被同一根绳子拴住的一串钥匙，拧开一把，整串锁同时开；半个世纪拧不开任何一把，也侧面说明这根绳子是真的。


    第一个被证明 NP 完全的问题是 SAT。SAT 问的是，给一个由与、或、非拼成的布尔公式，能不能给每个变量赋真或假让整个公式为真。1971 年 Cook 与 Levin 各自独立证明，任何 NP 问题的验证过程都能被编码成一个布尔公式，于是 SAT 第一个站上塔尖。本课只取这个直觉，验证无非是一串是非判断，而布尔公式恰好是记录是非判断的通用语言，所以它能装下任何验证过程。证明细节不必装，有了 SAT 这个锚点，后来者只需把 SAT 归约到新问题，就能接力证明新问题也是 NP 完全。
  derivation: original
  sources:
  - ref: sipser
    locator: Chapter 7.4 The Cook-Levin Theorem（定理 7.37，SAT 是 NP 完全的）
    claim: Cook 与 Levin 于 1971 年前后证明 SAT 是第一个 NP 完全问题，任何 NP 问题可归约到 SAT
