- id: verify
  title: P 与 [[NP]] 的核心直觉：自己找答案很难，别人递来答案验起来飞快
  tldr: P 装的是「自己能快快算出来」的问题，而 NP 装的是「只要别人递来一份证据，我就能快快核对完对不对」的问题——能快找的当然能快验，所以 P 稳稳蹲在 NP 里面。
  body: |-
    现在就能把最让人头晕的两个字母讲透。先想开头的排课现场：让你从零开始硬排出满足几十条冲突规矩的课表，想破脑袋都排不出；可要是同事直接递过来一张填好的课表，让你在 1 秒钟内当裁判查它合不合格，你只需顺着格子看一圈，几下就能核对完毕。填九宫格数独也是同理：空白盘面可能折磨你半天，拿一份填满的解答去验每行每列每宫是不是 1 到 9 齐活，只要几秒。找答案是在大海里捞针，验答案是拿着针比对刻度，难度根本不在一个次元。

    拿[[子集和]]算一组具体的数：手里有集合 {3, 7, 1, 8}，目标凑出 11。想从头找出一组能凑出 11 的数，最坏得把 2 的 4 次方也就是 16 个子集翻个底朝天（集合有 100 个数时就是 2 的 100 次方个子集）；可只要有人递给你一张小纸条写着「选 3 和 8」，甚至「选 3、7、1」，你不需要管他是不是靠做梦算出来的，只需做一次加法：3 加 8 等于 11、3 加 7 加 1 等于 11，啪地一下当场盖章通过！

    把这种「只要答案是『是』，就一定附带一份不算太长的证据，拿到这份证据就能在[[多项式时间]]内验证通过」的所有是非题打包起来，就是 NP（很多人误以为 NP 是「非多项式 Non-Polynomial」，大错特错！它真正讲的是有快速验证法，全称下步拆解）。而 P 则是要求更严的那一撮：不仅好验，连从零开始找出答案本身都能在多项式时间内搞定。既然自己都能快速找出答案，验一遍自然也不在话下，所以毫无疑问 P 包含于 NP。整座计算复杂性大厦最大的悬念只剩一句话：是不是所有「验起来飞快」的题，背后其实都藏着某种「找起来也很快」的算法？
  derivation: original
  sources:
  - ref: sipser
    locator: Chapter 7.3 The Class NP（验证者与证书的定义，子集和为例）
    claim: NP 是存在多项式时间验证者的问题类，子集和的候选子集可由一次求和验证，P 包含于 NP
    status: verified
