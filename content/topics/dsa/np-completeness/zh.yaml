- id: guess
  title: 换个说法：运气爆棚的猜测机
  tldr: NP 还有一个等价形象，一台每步都猜对的机器先把答案猜出来，剩下的工作只有验证。
  body: >-
    验证的说法有一个完全等价的孪生说法，第一次听会觉得像作弊，但它能帮你把 NP 想得更直观。设想一台特别的机器，它面对每个岔路口都能直接挑中通向答案的那条路，运气永远爆棚，从不走回头路。用它解子集和，它不枚举 16 个子集，而是对每个数直接猜拿还是不拿，而且每次都猜中，最后剩下的工作只有把猜出的这组数加一遍验算。猜对之后要走的步数，恰好就是验证的步数。


    这台机器的名字叫非确定性机器，非确定性这个词听着唬人，意思其实很朴素，岔路口不必逐条试，允许它直接走对的那条。NP 四个字母拆开就是非确定性多项式时间，翻译成人话就是，这台运气机器能在多项式步数内猜加验地解决问题。注意它不是现实机器，更不是量子计算机，它只是一个思想实验，用来给好验这件事换一副面孔。


    两种说法为什么等价？猜的那部分，本质就是把上一节说的证据凭空变出来；验的那部分两种说法一字不差。反过来，能被快速验证的问题，都可以交给这台机器先猜证据再验证。所以以后看到 NP，你可以在两个画面间自由切换，交卷后批改飞快的考题，或者运气机器一把猜中的难题，哪个顺手用哪个。本课取直觉即可，不必背任何自动机的形式定义。
  derivation: original
  sources:
  - ref: sipser
    locator: Chapter 7.3 The Class NP（验证者定义与非确定性图灵机定义的等价定理）
    claim: NP 同时等于有多项式时间验证者的问题类与非确定性多项式时间可解的问题类
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
