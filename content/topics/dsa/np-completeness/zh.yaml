    event: 撞墙现场摆明了：问题规模刚涨一点候选数量就爆炸，先查是不是题本身算不动，别只顾着怀疑代码写得菜。
- id: poly-vs-exp
  title: 画一条不变的尺子：多项式跑得动，指数一定撞墙
  tldr: 算法能不能用不能看跑出了几秒，得看时间随输入规模怎么涨：按 n 的几次方往上涨（[[多项式时间]]）就算跑得动，每多一个元素就翻倍（指数时间）哪怕换超级计算机也救不了。
  body: |-
    平时聊快慢总喜欢说「跑了两秒还是两小时」，但这把尺子靠不住——换台新电脑速度立刻变，没办法拿它当理论界线。计算机科学用的是一把不随硬件过时的尺子，只盯工作量随输入规模 n 增长的形状：耗时像 n、n 平方、n 三次方这样是规模的幂次方，叫做多项式时间，算作「可行」这一档；一旦耗时里出现 2 的 n 次方甚至 n 的阶乘，每多加一个元素计算量就翻倍或乘倍，就叫做指数时间，算作「撞墙」这一档。硬件升级只能把总时间砍掉一个固定倍数，根本掰不动增长曲线的弯曲方向。

    拿 n 等于 100 亲自算一笔账就知道差距有多离谱。多项式一侧取 n 的 3 次方，总共是 100 万（10 的 6 次方）次操作；指数一侧取 2 的 100 次方，大约是 1.27 乘 10 的 30 次方次操作，两边硬生生差出约 10 的 24 次方倍！假如台式机每秒能干 10 的 9 次方次操作，n 三次方只需要约 0.001 秒（一眨眼还没眨完）；而 2 的 100 次方需要约 1.27 乘 10 的 21 次方秒，算下来约等于 4 乘 10 的 13 次方年——是宇宙目前年龄 138 亿年的大约 2900 倍。

    这也顺手拆穿了为什么本地测试经常骗人。开发测试时图省事，拿 n 等于 20 的小样例跑一遍，2 的 20 次方才刚一百万出头，照样毫秒级秒出结果、全绿通过；等程序真正上线遇到 n 等于 100 的生产数据，才瞬间卡死到天荒地老。判断解法行不行，先看增长曲线站在哪一侧，别被小样例给哄骗了。
