- id: verify
  title: NP 的直觉：解难找，验飞快
  tldr: 数独解出来要想半天，验一遍只需扫一遍；这类验比找容易得多的问题，合起来就叫 NP。
  body: >-
    接下来全课最重要的一组对照，找答案与验答案是两件难度完全不同的事。数独就是现成的例子，让你从空格开始填满一盘数独，可能要试错半天；可要是有人直接递给你一张填满的盘面，你验它对不对，只需逐行逐列逐宫扫一遍，每处确认 1 到 9 不重复，几分钟就验完。填是搜索，验是检查，前者要在巨大的候选空间里摸索，后者只是照着一份现成答案逐项核对。


    子集和把这件事变成纯算术。给定集合 3、7、1、8 与目标 11，找一组和为 11 的数，要在 16 个子集里挑；可一旦有人告诉你答案是 3 加 8，你只需做一次加法，3 加 8 等于 11，当场验完。另一组 3 加 7 加 1 也等于 11，同样一加就验完。验证者不需要知道答案是怎么找到的，加法本身就是全部工作，而且候选有多少个子集，丝毫不影响验一组的时间。


    把这类问题收集起来就是 NP：一个问题属于 NP，当且仅当它的是非题版本里，是的答案都附带一份不长的证据，拿到证据后能在多项式时间内验完。再看 P，它是既能多项式时间找出答案、也能验的问题。能找当然能验，把找的过程重跑一遍即可，所以 P 包含于 NP。本课后面所有悬念，归根结底只有一句，验得快的问题，是不是全都也找得快？目前没人知道。
  derivation: original
  sources:
  - ref: sipser
    locator: Chapter 7.3 The Class NP（验证者与证书的定义，子集和为例）
    claim: NP 是存在多项式时间验证者的问题类，子集和的候选子集可由一次求和验证，P 包含于 NP
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
