steps:
- id: why
  title: 撞墙现场：不是你菜，是题本身算不动
  tldr: 排课与旅行商这类问题，规模稍微变大暴力法就直接爆炸，几十年没人找到捷径，这不是水平问题。
  body: >-
    先看一个每天都在发生的现场。教务老师要给几十门课排时间与教室，约束有一长串，老师不能分身、教室不能重叠、某些课必须错开。她试着让程序把所有排法都试一遍，很快发现排法数量随课程数爆炸，程序跑一整天也试不完万分之一。她换了更快的机器、更聪明的同事，结果只是把能排的规模从二十门推到二十五门，墙纹丝不动。


    旅行商是同一堵墙的经典画像。一名推销员要走遍若干城市各一次再回到起点，求最短路线。城市只有 5 座时路线屈指可数，20 座时暴力枚举的路线数已经约 6.08 乘 10 的 16 次方条，本课后面会亲手算这笔账。问题本身一点都不难懂，小学生都能听明白，难的是候选答案多到根本数不完。


    前十课的经验在这里会误导你。排序能从平方优化到 n log n，查找能优化到对数，DP 能把指数压成多项式，于是很容易以为任何问题只要再想想就能变快。本课要立的第一个判断恰恰相反：有一类问题，人类认真找了半个多世纪，始终没找到多项式时间的精确算法。面对它们，第一反应不该是自责或硬刚，而是先认出墙，再决定绕墙的走法。
  derivation: original
  sources:
  - ref: garey-johnson
    locator: 第 1 章引言与附录 NP 完全问题目录（旅行商等问题的难解性总览）
    claim: 旅行商等大量日常组合问题被归类为 NP 完全，长期无人找到多项式时间精确算法
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
