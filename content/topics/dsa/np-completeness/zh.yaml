    event: 可行看增长形状，不看某台机器上的秒数
- id: decision
  title: 判定问题：先把问题改成一道是非题
  tldr: 把求最短路线改成问有没有不超过 K 的路线，答案只剩是或否，难度才变得可比、可归约。
  body: >-
    理论界谈难度时，几乎只谈一种形态的问题，判定问题，也就是答案只有是或否的问题。为什么要多此一举？因为最优值是多少这类问题，答案五花八门，没法直接比较两个问题谁更难；而是非题的答案只有一比特，所有判定问题站在同一把尺子下，难度立刻可以比较，后面要讲的翻译与借解法器也才有统一的接口。这就像考试先把应用题都改成判断题，不是为了简单，是为了能统一判卷。


    改写的方法很机械，给优化问题加一个门槛。旅行商原本问最短路线有多短，改写后问：存不存在一条走遍所有城市、总长不超过 K 的路线？子集和原本可以问能凑出的最大和，改写后问：能不能从给定的数里挑出一组，和恰好等于目标 T？背包原本问最大价值，改写后问：能不能装出总价值至少 V 且总重不超过容量的装法？门槛 K、T、V 都由提问者给定。


    判定版并没有把问题变简单。能反复问判定版，就能用二分门槛的办法逼出最优值，所以判定版与优化版在多项式意义下难度相当。真正的收获是统一：从这一步起，本课说的每一个问题都是是非题，验证、归约、完全性这些概念全都建立在这块平整的地基上。看到一道优化题，先在心里把它翻译成是非题，是读懂后面所有内容的入场动作。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 34.1 Polynomial Time（判定问题与优化问题的关系）
    claim: 复杂性理论以判定问题为基本对象，优化问题可经门槛改写为判定问题且难度相当
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
  canvas:
    kind: datastate
    structure: array
    caption: 同一问题，优化问法与判定问法的对照
    rows:
