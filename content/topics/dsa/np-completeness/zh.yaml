  log:
  - mode: 收官
    event: 停止死磕精确解，把精力转到近似质量与建模上
level: 进阶
minutes: 34
prereq:
- dsa/dynamic-programming
- dsa/greedy
objectives:
- 用多项式与指数的增长账判断一个暴力算法在给定规模下是否可行
- 把旅行商、背包等优化问题改写成判定问题，并说清一个问题属于 NP 的验证条件
- 用归约的方向判断哪个问题更难，并说清 NP 完全的一荣俱荣结构
- 认出 NP 完全问题后能列出近似、启发式、特例结构、参数化与求解器五种应对路线
aiLink: 大模型解题时同样撞在这堵墙上，组合优化与规划类任务里模型靠启发式搜索与调用 SAT、规划求解器兜底，而不是真有多项式精确算法；看懂 NP 完全，就看懂了为什么智能系统要把难题外包给求解器、又为什么只能承诺足够好而非最优。
design:
- mechanism: 判定问题作统一货币，所有问题先改写成只答是或否的是非题，答案统一成一比特，难度才可比较、验证才有统一定义、归约才有统一接口
  problem: 优化问题的答案形态各异，最短路是一个数、排课是一张表、染色是一份赋值，形态不同就无法直接比较谁更难，更无法定义统一的验证与翻译规则，整个难度理论连地基都铺不平
  choice: 给优化问题加一个门槛改写成判定版，旅行商问有没有不超过 K 的路线、背包问能否装出至少 V 的价值，并用二分门槛保证判定版与优化版在多项式意义下难度相当，替代方案是直接在优化形态上建理论，接口注定碎片化
  tradeoff: 改写丢掉了最优值本身的信息，每次求最优都要反复调用判定版多问几轮，换来的是全理论共用一套定义，所有后续结论都能在同一地基上叠加，这笔交易被半个世纪的实践证明极其划算
  root: 根本原因是比较需要共同的度量衡，是非题把答案空间压到最小的一比特，问题的全部难度便只能藏在寻找过程里，藏无可藏，难度第一次变得可以被精确讨论与互相传递
- mechanism: 归约证相对难度，绕开绝对下界，把 A 翻译成 B 并借 B 的解法器解 A，用 B 至少和 A 一样难的相对结论织成一张难度传递网
  problem: 直接证明某个问题不存在多项式算法是千年量级的难题，至今无人能对任何一个自然问题完成这种绝对下界证明，若坚持先证下界再谈难度，整个领域将寸步难行
  choice: 改证相对难度，只需给出一个多项式时间的翻译让已知难题寄生到新问题上，难度便沿归约链传递，替代方案是为每个问题单独硬证下界，既无工具也无先例
  tradeoff: 相对结论永远条件化，它说的是若 B 可解则 A 可解，而不是 A 绝对不可解，整张网最终悬在 P 是否等于 NP 这个未决问题上，网再密也替代不了那最后一步证明
  root: 根本原因是难度的传递比难度的起源容易证明，翻译是一个可以动手构造的具体对象，而不存在快速算法是对一切可能算法的否定，构造与否定之间的不对称，正是归约方法存在的全部理由
- mechanism: NP 完全的一荣俱荣结构，塔尖问题彼此可互相归约，任何一个被多项式解开，全部 NP 问题随之一起被解开，反之谁也不能单独变简单
  problem: 若每个难题各难各的，研究者将永远分散在成千上万个孤岛上重复攻坚，既无法集中力量，也无法在遇到新问题时快速判断它值不值得死磕
  choice: 用归约把塔尖问题连成等价类，新问题只需接上链条就能继承整类的结论，Cook 与 Levin 给 SAT 的第一个锚点证明使这条链有了起点，替代方案是逐题独立研究，结论无法迁移
  tradeoff: 一荣俱荣也意味着一损俱损式的风险共担，密码学与优化工程的大量实践都默认这批问题不可解，一旦链上任一环被攻破，受冲击的不是一道题而是整片技术版图
  root: 根本原因是归约的传递性把难度做成了可流动的量，塔尖问题共享同一个难度水位，水位升降必然全体同步，这既是它们值得被集中攻坚的理由，也是工程师应集中回避它们的理由
quiz:
- q: n 等于 100 时，n 的三次方与 2 的 100 次方大约相差多少？
  options:
  - 约 100 倍
  - 约 10 的 6 次方倍
  - 约 10 的 24 次方倍
  - 基本一样大
  answer: 2
  explain: n 的三次方是 10 的 6 次方，2 的 100 次方约 1.27 乘 10 的 30 次方，相差约 10 的 24 次方倍，每秒 10 的 9 次方次运算也要约 4 乘 10 的 13 次方年。
- q: 一个判定问题属于 NP 的条件是？
  options:
  - 已经有多项式时间算法能解出它
  - 是的答案附带一份不长的证据，拿到后能在多项式时间内验证
  - 它的候选答案数量是指数级的
  - 它能被归约到 SAT
  answer: 1
  explain: NP 的直觉定义就是好验，证据长度与验证时间都是多项式级；能快速解出是 P 的条件，比 NP 更强。
- q: 已知问题 A 可以多项式时间归约到问题 B，正确的结论是？
  options:
  - A 至少和 B 一样难
  - B 至少和 A 一样难
  - A 与 B 一样简单
  - 两者难度无关
  answer: 1
  explain: 归约把 A 的实例翻译成 B 的实例并借 B 的解法器解 A，说明 A 的难度不超过 B，B 至少和 A 一样难，方向反了结论全反。
- q: 关于大数分解与背包的 DP，下列哪句是对的？
  options:
  - 大数分解是 NP 完全问题，密码学押在它身上
  - 背包的 O(nW) 是多项式算法，所以背包不在 NP 完全之列
  - 大数分解在 NP 里但未被证明 NP 完全，背包的 O(nW) 是对数值而非位数多项式的伪多项式
  - 两者都已经被证明属于 P
  answer: 2
  explain: 分解好验、在 NP 里，但未证 NP 完全；背包 DP 的运行时间随 W 的数值增长，而输入只占约 log W 位，所以是伪多项式，不推翻其 NP 完全性。
