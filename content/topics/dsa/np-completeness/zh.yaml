- id: np-hard
  title: NP 难：难，但未必好验
  tldr: NP 完全要求又难又好验，只难不好验的问题归 NP 难，它的地盘比 NP 还要大一圈。
  body: >-
    还剩最后一块拼图。NP 完全的定义有两条，难只是其中一条，另一条是在 NP 里、也就是好验。若一个问题只满足难这一条，所有 NP 问题都能归约到它，但它自己不在 NP 里，它叫 NP 难。少了好验这条约束，NP 难的地盘比 NP 完全更大，它收留的是难度封顶、却连递来一份答案都没法快速核对的问题，有的问题甚至难到根本不存在算法。


    两个现成的例子。优化版旅行商要求直接输出最短路线本身，它是 NP 难而不是 NP 完全，因为它根本不是是非题，不在判定问题的地盘里，自然谈不上在 NP 里；它的判定版才是 NP 完全。更极端的是停机问题，给一段程序与输入，问它会不会停下来，它连算法都不存在，更不可能好验，却仍有 NP 问题能归约到它，所以它也算 NP 难。可见 NP 难只论难度下限，不论可验与可解，它是一把只量硬度的尺子。


    四者的关系用文字画一张包含图。从小到大说，P 在最里面，它既好解又好验；NP 圈住所有好验的问题，P 是它的子集；NP 完全是 NP 圈内贴着上沿的那一小片，与 NP 难的圈相交；NP 难的圈最大，向外溢出 NP，交集部分恰好就是 NP 完全。背下这张图，本课的概念就全部归位，P 是否等于 NP 仍未知，所以图中 P 与 NP 完全之间那片地带是否真实存在，正是下一节的千禧年问题。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 34.3 NP-completeness and reducibility（NP 难与 NP 完全的定义区分）
    claim: NP 难只要求所有 NP 问题可归约到它而不要求自身在 NP 里，NP 完全是两者的交集
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
