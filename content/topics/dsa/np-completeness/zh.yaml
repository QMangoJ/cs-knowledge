- id: examples
  title: 一圈眼熟的 NP 完全问题
  tldr: 旅行商、子集和、背包判定版、图着色、顶点覆盖全在塔尖，每个都好验，每个都难找。
  body: >-
    把塔尖的问题排成一圈，你会发现全是老熟人。旅行商判定版问有没有不超过 K 的路线，验是把递来的路线逐段加总再比 K，难在路线数随城市爆炸。图着色问能不能用三种颜色给地图染色让相邻不同色，验是逐条边检查两端异色，难在颜色组合随点数爆炸。顶点覆盖问能不能选至多 K 个点盖住所有边，验是逐边确认至少一端被选，难在选点组合爆炸。它们的共同指纹一模一样，验只需线性扫描，找却要翻指数级的组合空间。


    子集和与背包判定版值得单独回收。子集和验一组数的和是一次加法，背包判定版验一份装法是加总重量与价值一次。可上一课 DP 给背包的 O(nW) 为什么不算已经解决？关键在输入规模的记账方式，W 写进输入只需要约 log W 个比特，W 等于 10 的 9 次方时输入里它只占约 30 位，DP 的表却要开出 10 的 9 次方量级，运行时间是按数值大小而不是按位数多项式增长的。这种按数值伪装成多项式的算法叫伪多项式，它没有推翻背包的 NP 完全性，只是提醒复杂度要对着输入的编码长度算账。


    认出这一圈问题的实用价值在于秒判。需求里出现排班、装箱、选址、染色、覆盖这类组合选择，又要求精确最优，你的经验库应该立刻亮灯，这大概率是 NP 完全，先别承诺工期，先谈规模与近似空间。亮灯靠的不是背名单，而是看指纹，候选组合指数爆炸、单个候选却极易验证，两条同时出现，基本就是它。
  derivation: original
  sources:
