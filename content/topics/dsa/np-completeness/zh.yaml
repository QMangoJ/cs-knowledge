level: 进阶
minutes: 34
prereq:
- dsa/dynamic-programming
- dsa/greedy
objectives:
- 用多项式与指数的增长账判断一个暴力算法在给定规模下是否可行
- 把旅行商、背包等优化问题改写成判定问题，并说清一个问题属于 NP 的验证条件
- 用归约的方向判断哪个问题更难，并说清 NP 完全的一荣俱荣结构
- 认出 NP 完全问题后能列出近似、启发式、特例结构、参数化与求解器五种应对路线
aiLink: 大模型解题时同样撞在这堵墙上，组合优化与规划类任务里模型靠启发式搜索与调用 SAT、规划求解器兜底，而不是真有多项式精确算法；看懂 NP 完全，就看懂了为什么智能系统要把难题外包给求解器、又为什么只能承诺足够好而非最优。
design:
- mechanism: 判定问题作统一货币，所有问题先改写成只答是或否的是非题，答案统一成一比特，难度才可比较、验证才有统一定义、归约才有统一接口
  problem: 优化题答案长得五花八门——排课是一张大表、最短路是一个里程数、图染色是一份配色单。输出形状都不同，根本没法放在同一个台子上比谁更难，也定不出统一的验算规则。
  choice: 给所有优化题加一道及格线门槛（如里程不超过 K、价值不低于 V），硬改写成只回答「是」或「否」的是非题。靠二分法改变门槛，是非版和原版在多项式尺度下难易相当，总比直接在五花八门的输出形态上硬套理论、把接口拆得支离破碎要划算得多。
  tradeoff: 改成是非题丢掉了「最优值具体是多少」这个直接输出，真想找出最值还得套着二分来回问几十遍；但换来的是全理论共用一套 1 比特通用货币，所有验证定义和问题归约都能平滑接轨。
  root: 跨领域比难度必须先统一度量衡——把千差万别的答案压窄成最小单位「是或否」之后，所有题目的花哨外壳被剥光，剩下的全部难度只能老老实实显现在「怎么找到答案」上。
- mechanism: 归约证相对难度，绕开绝对下界，把 A 翻译成 B 并借 B 的解法器解 A，用 B 至少和 A 一样难的相对结论织成一张难度传递网
  problem: 想正面直接证明某道自然题「全宇宙绝不可能存在快算法」，是数学界几十年都没捅破的绝顶难题——至今除了极少数玩具模型，几乎证不出任何一道实际问题的绝对下界。
  choice: 改证「相对谁不输谁」：只要构造出一条多项式时间的翻译通道，让公认的难题 A 能套壳靠 B 的解法器算出来，就能立下「B 至少和 A 一样难」的相对铁律，总比对着每道新题正面硬撞那堵千年证明之墙强得多。
  tradeoff: 相对结论永远带着前提条件——它只说「B 解开则 A 必解开」，并不能一锤定音说 A 绝对无解，整张网依然悬在 P 对 NP 是否相等的那颗总开关上。
  root: 构造出一个具体的题目翻译程序（正面举例）比否定一切可能存在的未知算法（反面穷尽）容易得多——这种「构造容易、否定极难」的不对称，正是归约能一统复杂性理论的全部理由。
- mechanism: NP 完全的一荣俱荣结构，这批最难的问题彼此可互相归约，任何一个被多项式解开，全部 NP 问题随之一起被解开，反之谁也不能单独变简单
  problem: 要是成千上万道组合难题各难各的、互不搭界，科学家就只能分成一万个孤岛分别熬白头发，工程师碰上新需求也根本无法判断到底值不值得死磕优化。
  choice: 通过 Cook–Levin 定理先把全部 NP 题收拢到 SAT 这第一颗锚点上，再顺着归约链把旅行商、背包、染色等难题全部串成一个互通的等价俱乐部，替代各自为战的孤立研究。
  tradeoff: 连环船的风险是全员共担：今天现代加密学和工程优化界都把筹码押在「这批题攻不破」上，万一未来某天有人从链上最不起眼的一环撬开缺口，整排技术基石会同时承受冲击。
  root: 归约天然具有传递性，让「难度」变成了像水流一样会打通连通器的物理量——一旦所有顶尖难题互通之后，整个家族就共享同一个水位，要涨一起涨、要垮一起垮。
quiz:
- q: n 等于 100 时，n 的三次方与 2 的 100 次方大约相差多少？
  options:
  - 约 100 倍
  - 约 10 的 6 次方倍
  - 约 10 的 24 次方倍
  - 基本一样大
  answer: 2
  explain: n 的三次方是 10 的 6 次方，2 的 100 次方约 1.27 乘 10 的 30 次方，相差约 10 的 24 次方倍，每秒 10 的 9 次方次运算也要约 4 乘 10 的 13 次方年。
- q: 一个判定问题属于 NP 的条件是？
  options:
  - 已经有多项式时间算法能解出它
  - 是的答案附带一份不长的证据，拿到后能在多项式时间内验证
  - 它的候选答案数量是指数级的
  - 它能被归约到 SAT
  answer: 1
  explain: NP 的直觉定义就是好验，证据长度与验证时间都是多项式级；能快速解出是 P 的条件，比 NP 更强。
- q: 已知问题 A 可以多项式时间归约到问题 B，正确的结论是？
  options:
  - A 至少和 B 一样难
  - B 至少和 A 一样难
  - A 与 B 一样简单
  - 两者难度无关
  answer: 1
  explain: 归约把 A 的实例翻译成 B 的实例并借 B 的解法器解 A，说明 A 的难度不超过 B，B 至少和 A 一样难，方向反了结论全反。
- q: 关于大数分解与背包的 DP，下列哪句是对的？
  options:
  - 大数分解是 NP 完全问题，密码学押在它身上
  - 背包的 O(nW) 是多项式算法，所以背包不在 NP 完全之列
  - 大数分解在 NP 里但未被证明 NP 完全，背包的 O(nW) 是对数值而非位数多项式的伪多项式
  - 两者都已经被证明属于 P
  answer: 2
  explain: 分解好验、在 NP 里，但未证 NP 完全；背包 DP 的运行时间随 W 的数值增长，而输入只占约 log W 位，所以是伪多项式，不推翻其 NP 完全性。
