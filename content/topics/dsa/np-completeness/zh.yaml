- id: practice
  title: 实用降维三招：工程撞上 NP 难问题时的正确换轨姿势
  tldr: 在工作里认出 [[NP]] 难问题不是举白旗投降，而是立刻换掉「死磕绝对最优解」的思路，用「算个足够好的解、借真实数据里的特殊结构、或直接外包给工业求解器」来降维破局。
  body: |-
    在实际工程里认出自己面对的是 NP 完全或 NP 难问题，千万别再熬夜调循环指望写出多项式精确算法，立刻换上「实用降维三招」：第一招，用「足够好」换「绝对最优」。如果不非要拿 100 分，很多难题拿 95 分反而是多项式时间！比如[[顶点覆盖]]只要挑一条没盖住的边把两端点全选上，就能在极短时间内保证用的监控点绝不超过理论最优的两倍（近似算法）；而像外卖派单和车辆调度这种大盘子，业界普遍上[[模拟退火]]、[[遗传算法]]或局部搜索等启发式方法，秒级算出一条够省油的路线就够交差了。

    第二招，把指数爆炸关进小参数或特殊结构里（[[参数化]]与特例简化）。一般图难算，但要是你的业务数据刚好是一棵树、或者扁平没有交叉的平面图，原本爆炸的算法往往当场塌缩回线性；或者哪怕总数据上万，如果决定复杂度的那个关键约束指标 k 很小（比如一共只允许撞车不超过 5 处），就能把指数代价死死锁死在 2 的 k 次方上，其余规模照样跑成线性。第三招，中小型工业约束直接交给成熟求解器。别自己从头造轮子，把排班和配置翻译成逻辑公式丢给现成的 [[SAT]] 或整数规划求解器。奇怪吗？明明理论说 SAT 最坏不可解，可求解器跑上百万个变量的现实芯片验证或排班照样嗖嗖快——因为 NP 完全只吓唬「人为构造的最坏黑心数据」，而真实世界的业务数据天生带满规律和剪枝线索。

    至此，整个数据结构与算法科收官。把这句工程急救口诀带走：「一认指纹防死磕，二拆结构降规模，三换近似保交付」——看见组合数量爆炸而验证一眼看穿，立刻别再追求完美最优解：能拆小规模或特例就精确解，中等带规律扔给约束求解器，规模大了直接上近似和启发式。知道何时该用力把算法榨到极致，更知道撞上哪堵墙时该体面绕开，才是一名成熟工程师的底气。
