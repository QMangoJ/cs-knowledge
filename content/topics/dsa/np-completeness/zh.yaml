- id: np-complete
  title: "[[NP]] 完全：NP 宇宙里站在天花板顶点的那一批难题"
  tldr: 所谓 NP 完全，就是身在 NP 内部、同时又能靠翻译兜住 NP 圈子里所有其他题目的「最硬一批」——因为彼此都能互相翻译，只要谁把其中任何一道攻克成多项式时间，整个 NP 家族会瞬间一起塌缩进 P。
  body: |-
    有了归约这把尺子，NP 里面就分出高低了。在所有「答案好验」的问题里，有一小批最硬的硬骨头同时满足两条死条件：第一，它自己就在 NP 里（好验）；第二，NP 家族里的每一个问题都能在[[多项式时间]]内归约翻译到它身上。同时踩中这两条线，就叫 NP 完全（NP-Complete，常简写为 NPC）。意思就是它把整个 NP 的全部难度都吸进了自己身上，已经是这片领地天花板级别的顶点。

    这立刻导出了计算机科学里最震撼的一幕：一荣俱荣，一损俱损。假设今天某位天才给任何一道 NP 完全问题找到了多项式时间的快解法，那全世界的任意 NP 问题都能先翻译成它、再调用这个快解法一并秒杀，于是 P = NP 当场成立！反过来说，因为任意两道 NP 完全问题彼此之间也能互相翻译，只要其中一道至今无人攻破，其他成员就一个也别想单独变简单——它们像拴在同一根铁索上的连环船，动一个全动。

    可怎么证明世上真存在能兜住「全部 NP 问题」的怪物呢？不可能拿全宇宙的题一道道去翻译吧。1971 年，[[Cook 与 Levin|Cook–Levin 定理]]各自独立打下了第一颗定海神针——布尔可满足性问题 [[SAT]]。SAT 问的是「给你一长串由与、或、非组成的逻辑公式，能不能给里面每个开关赋值真或假让整个公式输出为真」。他俩证明：任何 NP 问题的「快速验证过程」，本质上都可以拆解成一堆计算机电路里的逻辑开关门，最后压成一条布尔公式交给 SAT！有了 SAT 这第一块多米诺骨牌，后人想证明某个新问题也是 NP 完全，再也不用对着全人类所有问题硬证了，只需要把 SAT（或者后继已知的 NPC 问题）归约翻译进新问题这一环就够了。
  derivation: original
  sources:
  - ref: sipser
    locator: Chapter 7.4 The Cook-Levin Theorem（定理 7.37，SAT 是 NP 完全的）
