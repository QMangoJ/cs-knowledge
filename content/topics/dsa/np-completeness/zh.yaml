- id: p-vs-np
  title: P 对 [[NP]]：悬赏一百万美元的那堵墙
  tldr: 「P 是否等于 NP」至今悬而未决——若相等，全世界的加密锁将瞬间崩塌；主流学界用半个世纪的集体经验赌它们不等，但没人能给出数学证明，这道题至今挂着一百万美元悬赏。
  body: |-
    把整堂课压成一句话，就是那道悬了半个世纪的终极拷问：P 等于 NP 吗？翻译成大白话：凡是拿一份答案能飞快验出对错的问题，难道老天爷真在暗中藏了一条同样飞快的捷径让我们自己找出来吗？如果有一天有人证出 P = NP，那前面几步立起来的高墙瞬间轰然倒塌，包括排课、旅行商、SAT 在内的所有 NP 完全难题全会拿到多项式快算法；如果证出 P ≠ NP，就等于立下铁案，承认宇宙中真的存在「验得快却绝不可能找得快」的绝对鸿沟。从 1971 年正式发榜至今，两个方向都没人证得出来。

    [[Clay 数学研究所]]在 2000 年把「P 对 NP」列为七大[[千禧年大奖问题]]之一，谁能给出完整无误的证明，直接领走 100 万美元奖金——二十多年过去，七题只攻克了一题，P 对 NP 的赏金至今无人能领。绝大多数一线理论学家凭直觉都赌 P 不等于 NP，因为这么多绝顶聪明的人折腾了五十年依然颗粒无收；但在数学证明真正拍板前，工程界只能先默认这堵墙是真的，老老实实绕路走。

    这绝不是书斋里的闲扯，因为今天网上银行转账和所有网站加密，全靠这层「正算极快、反推绝望」的不对称撑着：拿两个几百位的大素数相乘只要一瞬间，反过来把乘积拆回那两个素数却难如登天（如果 P = NP，几乎所有密码防线当场裸奔）。不过这里顺手纠正一个广泛流传的错误说法：刚才说的「大整数素因数分解」虽然也在 NP 里（拿两个因数一乘立刻验真），但学界并不认为它是 NP 完全问题，它大概率只待在 NP 内部那片不上不下的空地上——复杂性版图的地形比口号精细得多。
