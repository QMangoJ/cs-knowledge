- id: np-hard
  title: P、NP、NP 完全、[[NP]] 难：四兄弟的包含关系一次理清
  tldr: NP 难只卡「至少和所有 NP 一样难」这一条底线，压根不管自己好不好验；只有同时满足「难到顶」又「身在 NP 里好验」的交集地带，才是 NP 完全。
  body: |-
    还剩最后最容易混的词：NP 难（NP-Hard）。前面刚定过规矩，想进 NP 完全必须考过两门科目：第一，本身在 NP 里（答案好验）；第二，所有 NP 问题都能归约到它头上（够硬）。如果你把第一条要求撕掉，只保留第二条——只要能兜住整个 NP 家族、至少和它们一样难，不管它自己好不好验、甚至管不管它是不是是非题——那它就归进了 NP 难的大圈子里。

    两个现成例子帮你划清边界。先看原版的优化[[旅行商|旅行商问题]]：「请直接算出一套最短路线本身（而不只是答是或否）」。因为它根本不是是非题，甚至递给你一条号称最短的路线时，你光看它自身也没法 1 秒验出「世上再没比它更短的了」，所以它不在 NP 里；但只要解出最短路线就能立刻回答及格线 ≤ K 的问题，所以 NP 完全问题能归约给它——它是如假包换的 NP 难，但不是 NP 完全。更夸张的是[[停机问题]]（给一段任意程序，判断它会不会陷入死循环永远停不下来）：这题连算法都不存在（不可判定），更别提快速验算，可所有 NP 问题都能翻译进它里面，照样妥妥属于 NP 难。可见 NP 难只标出「下限有多硬」，上不封顶。

    现在把四个名词装进同一张圆圈地图：最里层最小的绿圈是 P（自己找起来快、验起来也快）；外面套着大一点的圈是 NP（好验的问题都在这，P 稳稳包含在 NP 里面）；另一边有个横跨圈外的大黑圈叫 NP 难（只管极难，不问好不好验，一路溢出到 NP 外面去了）；而 NP 圈子和 NP 难圈子撞在一起重叠的那块核心交集，正是 NP 完全。至于 P 和 NP 完全中间到底有没有空隙，就看下一步的世纪大悬念了。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 34.3 NP-completeness and reducibility（NP 难与 NP 完全的定义区分）
    claim: NP 难只要求所有 NP 问题可归约到它而不要求自身在 NP 里，NP 完全是两者的交集
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
