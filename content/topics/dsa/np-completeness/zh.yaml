    - label: 猜测画面
      cells:
      - v: 每步直接猜对
        mark: found
      - v: 剩下只有验证
  log:
  - mode: 猜测
    event: 非确定性等于免费猜对一次，难度全落在验证上
- id: reduction
  title: 归约：把新问题翻译成老问题
  tldr: 归约就是做一次多项式时间的翻译，借老问题的解法器解新问题，方向写反结论就全反。
  body: >-
    现在引入全课的核心工具，归约。先用生活话说清：你遇到一道不会做的中文题，但你手里有一台只会解英文题的机器。只要你能把中文题逐句翻译成英文题、再把英文答案翻回来，你就等于会解中文题了。这里的翻译就叫归约，英文题是老问题，中文题是新问题，那台机器是老问题的解法器。翻译本身必须足够快，要求是多项式时间，否则翻译比解题还贵，这笔买卖就不成立。


    把记号钉死。把问题 A 归约到问题 B，意思是给出一个多项式时间的翻译，能把 A 的每个实例变成 B 的一个实例，且翻译前后的答案同为是或同为否。于是只要有 B 的解法器，套上翻译就能解 A，流程是先翻译、再调用、后照单收下答案。一句话，A 的难度不会超过 B 加上翻译的开销。反过来读就是关键结论，B 至少和 A 一样难，因为连 A 都能寄生在 B 身上解决。


    方向是这里唯一的易错点，也是面试与考试最爱挖的坑。A 归约到 B，难的是 B，不是 A；翻译的方向是把 A 变成 B，难度的结论方向是 B 不低于 A。记忆法只用一句，要证明新问题难，就拿一个已知的难题归约到它身上，让难题寄生进来；要是反着把新问题归约到难题上，只能说明新问题不比难题更难，什么硬度都证明不了。后面判定谁是 NP 完全，靠的全是这个方向感。
  derivation: original
  sources:
  - ref: sipser
    locator: Chapter 7.4 NP-completeness（多项式时间归约的定义与传递性）
    claim: A 多项式时间归约到 B 时，B 可解则 A 可解，故 B 至少与 A 一样难
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
