steps:
- id: why
  title: 撞墙现场：不是你菜，是题本身算不动
  tldr: 有些组合问题规模只要稍微涨一丁点，候选方案就会瞬间炸成天文数字——跑不完不是机器慢或代码菜，而是这类题人类几十年来就没找到过捷径。
  body: |-
    开学前教务老师要排课表：几十门课、十几位老师、几十间教室，还要满足一堆死规矩——同一位老师不能同时上两门课、同一间教室不能撞车、大一高数不能跟线性代数叠在一起。如果写个程序把所有排法穷举试一遍，你会亲眼看到一堵隐形墙：课程才二十几门，程序跑一整天连万分之一都试不完；咬牙换了顶级服务器、找来金牌算法工程师重构代码，也不过把极限从二十门挪到二十五门，再加几门立刻原地卡死。

    [[旅行商|旅行商问题]]把这堵墙画得更直观：一位推销员要走遍若干座城市、每座只去一次再回到起点，怎么挑路线总里程最短？题目小学生都能听懂，难的不是规则复杂，而是可能的走法数量会爆炸：5 座城市时总共才一打走法，拿笔都能列全；10 座城市涨到约 18 万条路线；才刚加到 20 座城市，暴力枚举要查的路线数就已经飙到约 6.08 乘 10 的 16 次方条——就算一秒钟查十亿条，也得跑快两年。

    前面十课很容易给你一种错觉：排序能从平方级压到 n log n，动态规划能把递归指数炸弹变成查表，好像只要再动动脑筋，天下就没有变不快的问题。这一课要敲醒的第一个警钟恰恰相反：有一类问题，全世界的数学家和计算机科学家认真钻研了半个多世纪，至今没找到任何[[多项式时间]]的精确快算法。撞上这种题，第一反应不是怀疑自己写错了循环，而是先拿尺子认出这堵墙，再想办法绕着走。
  derivation: original
