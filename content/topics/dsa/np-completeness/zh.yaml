- id: practice
  title: 工程师的应对纪律与全科收官
  tldr: 认出 NP 完全不是投降，是换打法的信号，近似、启发式、特例、参数化与求解器各有一席之地。
  body: >-
    最后一节落回工程。认出一道题是 NP 完全，正确的动作不是继续熬夜找精确多项式算法，而是立刻换打法。第一档是近似算法，放弃最优、保证不差太多，比如顶点覆盖有一个简单的两倍近似，挑一条边的两端全选，最多用最优解两倍的点。第二档是启发式与元启发，模拟退火、遗传算法、局部搜索都不保证最优，却常在真实数据上给出足够好的解，排班与路径规划的线上系统大多靠它们。第三档是利用特例结构，问题在树上、平面图上或某个参数很小时，往往重新变得可解，参数化算法就是把指数爆炸关进小参数的笼子里。


    还有一个悖论要点破。SAT 是 NP 完全的塔尖，可现实里的 SAT 求解器处理百万变量的工业实例常常很快，因为真实实例带有大量结构，远不是最坏情形。NP 完全说的是最坏情形无捷径，不是对每个实例宣判死刑。所以工程纪律的完整版是，先认指纹，再看规模与结构，小规模直接精确求解，中规模交给成熟求解器，大规模上近似与启发式，并把最坏情形的预期写进方案，而不是假装它不存在。


    全科到此收官。从哈希与二分开始，这十课一路在学怎样把问题算得更快，最后一课学的是认清哪些问题快不了，以及快不了时怎样体面地绕行。会优化是本事，知道何时停止优化、把精力花在近似质量与问题建模上，是更贵的本事。墙不会因为你无视它而消失，看清它，恰恰是这门课留给你的最后一件工具。
  derivation: original
  sources:
  - ref: garey-johnson
    locator: 第 6 章 Coping with NP-complete Problems（应对策略总览）
    claim: 面对 NP 完全问题的标准应对包括近似算法、利用子问题结构与启发式方法
    status: verified
    checkedBy: Muse 核查
