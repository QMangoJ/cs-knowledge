title: NP 完全性：有些问题不是慢，是全人类都算不动
summary: 前十课一直在把算法越算越快，这最后一课要看清速度的尽头在哪。全课用「多项式对指数」划出可行的边界，先把各类最值题统一成答「是或否」的判定题，再用「好找」和「好验」分清 P 与 NP；接着用「归约」把难题连成一张网，看清解开一个 NP 完全问题为什么就等于解开全部，最后给出一套工程师撞墙后的实用绕行清单。
premise: 排课表或排班表时，几十门课、几十个冲突约束一叠在一起，电脑穷举一晚上都排不出一套合法方案；可要是有同事直接递给你一张排好的课表，你顺着表格扫一遍，几秒钟就能查出有没有老师分身或教室撞车。为什么「找一份答案」难如登天，「验一份答案」却快到飞起？这节课就顺着排课撞墙、[[旅行商|旅行商问题]]的路线爆炸和[[子集和]]凑数这几个日常算术账，把「算不动」的边界、问题之间怎么互相比难易、以及工程里撞上这堵墙该怎么绕开讲清楚。
position: 前面十课教了各种把程序算快的方法，这一课开启数据结构与算法科的最后一个板块「算不动的问题：复杂度的天花板」，直接接在字符串匹配把扫描压到线性之后，反过来给优化划出天然红线。学完这一课，你能凭输入规模的增长算账看出暴力算法什么时候会爆、用「验起来快不快」把问题分进 P 或 NP 家族、搞懂怎么用问题翻译去比较谁更难，并在工程需求里认出这堵硬墙后立刻切换打法，不再白费力气死磕精确最优解。
bridge:
  prev: 前面十课一路从平方级、n log n 压到线性级，仿佛任何问题只要动脑筋就能榨出更快解法；可到头来会发现有一类难题，不是你的电脑性能差，也不是你还没想到妙招，而是几十年来全人类都没有找到过捷径。
overview:
- key: 一句话总结
  value: "[[NP]] 完全问题就像一只难开却好验的密码箱：别人给你一串答案，扫一遍就知道对不对；可让你从头找出正确密码，目前人类没找到比海量试错快多少的捷径——而且它们彼此勾连，解开其中任何一道，整批难题会一起迎刃而解。"
- key: 可行的操作定义
  value: 这里拿[[多项式时间]]当「跑得动」，拿指数时间当「算不动」：输入规模 n 涨到 100 时，n 的 3 次方才一百万步，2 的 100 次方却暴涨到比前者大 10 的 24 次方倍，算到宇宙毁灭都算不完。
- key: 统一货币
  value: 想比较两道难度完全不同的题谁更硬，得先把问题改写成只答「是」或「否」的[[判定问题]]——比如把「最短路线有多短」改成「有没有总长不超过 K 的路线」，答案压成一比特才能放在同一杆秤上称。
- key: 核心工具
  value: "[[归约]]说白了就是「题目翻译」：如果你花小力气就能把老难题 A 翻译成新问题 B，再用 B 的解法器得出答案，那就说明 B 至少和 A 一样难——记住方向别搞反，谁能兜底谁才更硬。"
- key: 工程师纪律
  value: 遇上 NP 完全问题不是认输，而是果断换轨道：小规模直接硬解，中等规模丢给成熟约束求解器，规模大了就靠近似算法、启发式搜索或利用[[参数化]]等数据的特殊结构把复杂度关进笼子。
