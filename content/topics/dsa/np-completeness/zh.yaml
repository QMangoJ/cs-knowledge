- id: poly-vs-exp
  title: 可行与不可行：多项式对指数的增长账
  tldr: 把可行定成多项式时间、不可行定成指数时间，n 等于 100 时账算出来，差距是宇宙年龄级别的。
  body: >-
    要谈算不动，先得把快与慢定成能算账的标准。生活里说快，通常指几秒钟出结果，可这个标准随机器变、随心情变，没法当尺子。理论界用的尺子只看增长形状：运行时间是输入规模 n 的多项式，比如 n、n 平方、n 的三次方，就算可行这一档；运行时间带 2 的 n 次方这类指数项，就算撞墙这一档。机器变快只改常数，改不了形状，所以这把尺子几十年不过时。


    把账算到数字上。取 n 等于 100，多项式一侧取 n 的三次方，等于 100 万，也就是 10 的 6 次方。指数一侧取 2 的 100 次方，约等于 1.27 乘 10 的 30 次方，两者相差约 10 的 24 次方倍。再换算成时间，假设机器每秒能做 10 的 9 次方次基本操作，多项式那边只需约千分之一秒，指数那边要约 1.27 乘 10 的 21 次方秒，折合约 4 乘 10 的 13 次方年，是宇宙年龄 138 亿年的约 2900 倍。


    这笔账解释了为什么小规模测试永远骗人。n 等于 20 时 2 的 n 次方只有约一百万，跑起来毫无压力，于是暴力法在样例上全对、上线遇真实规模才原形毕露。判断一个算法能不能用，别看它在小数据上跑多快，先看它的增长形状站在多项式还是指数那一侧。
  derivation: original
  sources:
  - ref: sipser
    locator: Chapter 7.1 Measuring Complexity 与 7.2 The Class P
    claim: 以多项式时间作为可行计算的操作性界定，指数时间随规模增长迅速变得不可行
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
  canvas:
    kind: datastate
