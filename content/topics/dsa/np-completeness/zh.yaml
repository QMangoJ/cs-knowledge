- id: reduction
  title: "[[归约]]：把 A 翻译成 B，会解 B 就等于会解 A"
  tldr: 如果能在多项式时间内把问题 A 的任何实例翻译成问题 B，借 B 的解法器来解 A，那么 B 至少和 A 一样难——翻译方向和难度高低的箭头恰好相反。
  body: |-
    目前我们有了「P」和「NP」两个框，怎么比较不同题目之间到底谁难谁靠后？这就要请出全课最重要的一把工具——[[归约]]。大白话讲，归约就是「套壳翻译」。假设你碰上一道完全不会的中文算术题 A，但手边有一台专解英文算术题 B 的黑盒神器。如果你能自己花一点小工夫（必须是快速的[[多项式时间]]），把中文题 A 逐句翻译成等价的英文题 B 塞进机器里，机器吐出「是」或「否」，你就直接拿来当作中文题 A 的答案——这就叫把 A 归约到了 B。

    把这笔难度账顺一顺，关键就在方向二字：既然我拿 B 的神器就能顺手把 A 给解了，说明有能力干掉 B 就必然有能力干掉 A（只要翻译开销不比解题贵）。换句话说，问题 A 的难度撑死了也就是 B 的难度加一点小翻译费；反过来念就是铁律——B 至少和 A 一样难！B 站得比 A 高，能兜住 A 的全部问题。

    这个方向是全课唯一最爱绕晕人的坑，考试面试常考反：把 A 归约到 B，翻译的箭头从 A 指向 B，可难度的结论是 B 大于等于 A（更硬的是接盘侠 B，不是被转译出去的 A）。记住一句防反口诀：想证明手头的新问题 X 很难，就得找一个公认极难的老问题 A，想方设法把 A 翻译装进 X 的框里——让老难题「寄生」到新问题身上；要是你反过来把新问题 X 翻译进老难题里，只能证明 X 最多和老难题差不多难，什么下限也立不住。
  derivation: original
  sources:
  - ref: sipser
