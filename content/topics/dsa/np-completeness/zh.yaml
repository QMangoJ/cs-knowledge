- id: decision
  title: 统一语言：先把应用题改写成是非题（[[判定问题]]）
  tldr: 不同题目的答案格式五花八门没法互相比较，把它们统一加个门槛改写成只答「是或否」的是非题，既没有偷懒把题变简单，又让所有难题站在了同一把秤上。
  body: |-
    有了好坏尺子，紧接着会卡在一个尴尬处：排课要输出一张二维表，旅行商要输出最短里程数，怎么比较「找一张表」和「找一个数字」谁更难？就像教务处把计算题、填空题、画图题全部重写成判断题，理论界讨论复杂度时，习惯把一切问题先改写成答案只有「是」或「否」（1 比特）的[[判定问题]]。输出格式彻底齐平之后，后面才谈得上统一定义怎么验答案、怎么把一道题翻译成另一道题。

    改写手法非常直接——给原问题加一道及格线门槛。[[旅行商|旅行商问题]]原本追问「最短的路线究竟有多长」，改成是非题后只问「存不存在一条走遍全部城市、总长不超过 K 的路线？」；[[子集和]]原题可以问能凑出多大的数，改成是非题后问「给定的整数里能不能挑出一把，加起来恰好等于目标 T？」；背包问题原本问「最多能塞出多大价值」，改成是非题后问「能不能装出总重不超标且总价值至少达到 V 的方案？」。这里的 K、T、V 都是提问者提前拍死在桌上的数字。

    等一下，把找最优答案改成只问及格线，不会把难题改简单了吗？并不会。如果你手里真有一台能瞬间回答「存不存在不超过 K 的路线」的是非题机器，那你拿二分查找的思路反复改 K 问它几十次，很快就能把真正的最短长度逼出来。反过来有最短路就更不用问及格线了。所以两边在多项式尺度下难易完全相当，只是为了后面讨论「验证」与「[[归约]]」有个平整地基。
  derivation: original
  sources:
