- id: examples
  title: 认出这批老熟人：五个常见 [[NP]] 完全问题与背包的「假多项式」陷阱
  tldr: 从旅行商、地图染色、顶点覆盖到子集和、背包判定版，它们全长着同一副指纹——答案扫一遍就能验完，搜索却要翻指数级组合；就连背包著名的动态规划解法也是只对「数字数值」而非「输入长度」的多项式。
  body: |-
    从 [[SAT]] 这块锚点一路接力归约下来，成千上万个实际工作里每天碰面的问题都被拉进了同一条连环船。看看这五位老熟人：[[旅行商|旅行商问题]]判定版（核对一条路线总长是不是 ≤ K 只需逐段累加，找最短路线却要翻城市排列）；[[图着色]]（问能不能用 3 种颜色涂满地图让相邻国家异色，验只需顺着边界查一遍，找却要试遍染色组合）；[[顶点覆盖]]（问能不能只选不超过 K 个路口装监控就盯住所有街道，验只需看每条街至少一端有摄像头，找却要穷举选点组合）；加上前面算过的[[子集和]]与 0/1 背包判定版。它们的共同指纹一清二楚：拿现成答案验一次只需线性扫一遍，自己从头找却是指数级大爆炸。

    看到背包问题，敏锐的同学一定会反问一句：等等，动态规划那一课不是刚用存表法给出过 O(nW) 的解法吗，这难道不算多项式时间解决了背包吗？这正是这门课最隐蔽的一个计费陷阱！计算机算时间复杂度时，「输入规模」看的是把输入写进电脑一共占多少个比特位数，而不是数字本身有多大。假设背包限重 W 等于 10 亿（10 的 9 次方），在输入文件里用二进制写下这个数字只需要约 30 个比特位（也就是 log W 级别）；可你的 DP 表格却要老老实实开出 10 亿列！时间随着数字数值 W 线性增长，对着只占 30 位的输入长度来说，其实就是按 2 的 30 次方（位数指数级）狂飙。这种靠数字大小伪装出来的快算法叫[[伪多项式]]，W 稍微一大表格照样爆内存，所以背包依然稳稳待在 NP 完全家族里。

    记住这副指纹比硬背名单管用得多：以后接需求时只要听见排班调度、装箱拼单、选址覆盖、冲突配色，客户还拍着胸脯要「绝对最优解」，脑袋里立刻要响警报——先别一口答应两天做完，大概率撞进 NP 完全区了。
  derivation: original
  sources:
