  log:
  - mode: 验证
    event: P 和 NP 分清楚了：P 是自己找得快，NP 是别人递来答案验得快，重点在好验而不是非多项式。
- id: guess
  title: 为什么叫 NP：它最初指一台「分叉口全猜对」的思想实验机器
  tldr: "[[NP]] 全称是「非确定性[[多项式时间]]」——等价于设想一台在每个选择岔路口都能直接蒙对路线的神算机，省掉搜索之后，它唯一要干的活依然只有那几步验证。"
  body: |-
    上一步说 NP 的核心是「好验」，那为什么名字偏偏叫 NP（非确定性[[多项式时间]]，Nondeterministic Polynomial time）？这来自计算机理论早期发明的另一个等价画面。设想有一台现实里造不出来的作弊机器，每次面对「选还是不选」的岔路口时，它不用逐条尝试，而是像开了挂一样分身全试，或者永远运气爆棚、每次精准挑中通向正确结果的那一侧。拿它算刚才的 {3, 7, 1, 8} 凑 11，它不用翻 16 个子集，面对 4 个数字直接一口气猜完「要 3、不要 7、不要 1、要 8」，接下来唯一剩下的工作就是做一次加法验证 3+8 等于 11。

    「非确定性」听着唬人，翻译成人话其实就这么简单：在岔路口不用乖乖按唯一路线硬走，允许机器凭空猜一条对的路去验证。千万别把它当成现实中的多核 CPU 甚至量子计算机——它纯粹是个用来衡量问题难度的思想实验工具。

    仔细比比这两种说法，其实完全是一枚硬币的两面：「运气机器一口气猜出方案再花几步验完」里省掉的那一下神仙猜谜，在现实世界里不就是「不知道哪位高手替你写好递过来的一份证据」吗？猜的动作换了个人来做，后面在多项式步数内验算的功夫一模一样。以后一提 NP，你直接记「答案好验」就行。
  derivation: original
  sources:
