    event: 完全等于难加上好验，少一条就只是难
- id: p-vs-np
  title: P 对 NP：悬赏一百万美元的那堵墙
  tldr: 验得快是否必然找得快，至今无人能证；现代密码学的安全感，正押在这堵墙不倒上。
  body: >-
    把全课收束成一个问题，P 等于 NP 吗？翻成人话就是，凡是答案能被快速验证的问题，是不是也都能被快速找到答案？如果相等，本课讲的整堵墙瞬间消失，每个 NP 完全问题都会获得多项式算法；如果不等，墙被数学证明为真实存在，那片验易找难的地带就是宇宙的固有结构。自 1971 年问题被正式提出以来，两个方向都没人证出来，它是计算机科学最著名的未解问题。


    它的分量有官方标价。Clay 数学研究所在 2000 年把 P 对 NP 列为七个千禧年大奖问题之一，第一个给出完整正确解答的人可得 100 万美元，七题至今只解出一题，P 对 NP 不在其中。主流学界普遍猜测 P 不等于 NP，也就是墙是真的，理由很朴素，这么多聪明人找了半个世纪的捷径一无所获；但猜测不是证明，在证明落地之前，工程师只能把墙当真的来安排工作。


    为什么普通人也该在意这堵墙？因为现代密码学的安全感就押在验易找难上。把两个大素数乘起来是一瞬间的事，验乘积只需一次乘法；把乘积反过来拆回素数，却没有已知的快速办法，网上银行与加密通信借的正是这段不对称。这里必须讲准，大数分解的问题在 NP 里、答案好验，但它并不被认为是 NP 完全，甚至未必永远算不动，它只是恰好站在墙边的一块空地上。把分解说成 NP 完全是常见的以讹传讹，本课特意纠正，墙的形状比口号精细得多。
  derivation: original
  sources:
  - ref: clay-p-vs-np
    locator: Millennium Prize Problems 总览与 P versus NP 问题页（Cook 撰写的官方陈述）
    claim: P 对 NP 是 Clay 研究所 2000 年公布的千禧年大奖问题之一，悬赏 100 万美元，至今未解
