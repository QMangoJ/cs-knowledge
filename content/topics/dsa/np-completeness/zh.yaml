    structure: array
    caption: 墙的两面，一边是密码学借用的不对称，一边是未决的证明
    rows:
    - label: 若 P 等于 NP
      cells:
      - v: 塔尖问题全部可解
        mark: active
      - v: 许多密码假设崩塌
        mark: active
