- id: external-sort
  title: 引子：内存装不下时，外部排序接棒
  tldr: 先分块排成有序顺串，再多路归并；磁盘怕随机读，顺序归并正好避开它。
  body: |-
    数据大到内存装不下，归并还能续命，这就是外部排序：把大文件切成内存装得下的块，每块排好写回磁盘，得到一批有序顺串；再像合并有序段那样多路归并，一趟趟并长，直到只剩一个完整有序文件。

    小账：100 GB 日志、可用内存 10 GB，先切 10 块各排好得到 10 个顺串，再做一轮 10 路归并，整体读两遍写两遍。归并阶段每个顺串只需一小块缓冲顺序读，随机访问被压到最低。

    数据库与大数据系统至今仍在用它：大批量排序、建索引、分布式洗牌，骨架都是分块排序加多路归并。两路合并只是路数等于 2 的特例，把两个指针推广到多个指针（再用堆选最小），就是完整的多路归并。
  derivation: original
  sources:
  - ref: mit-6006
    locator: 归并排序相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
