title: 归并排序与快速排序：分而治之
summary: 两种最常用的 O(n log n) 排序，都是把大问题拆小，但拆法不同、特点也不同。
premise: 以对 [5, 2, 8, 1, 9, 3] 排序为例。
overview:
- key: 一句话总结
  value: 归并：先拆后合，稳定、总是 O(n log n)；快排：先分区后递归，平均最快但最坏 O(n²)
- key: 稳定性
  value: 相等元素排序后保持原来的先后顺序；归并稳定，快排通常不稳定
- key: 额外空间
  value: 归并需要 O(n) 辅助空间；快排只需要递归栈
- key: 工程里
  value: V8 自 7.0（2018 年）起 Array.prototype.sort 用 TimSort，一种稳定的归并变体
- key: 为什么不用冒泡
  value: 冒泡、插入排序是 O(n²)，数据大了慢得多
- key: 复杂度
  value: 归并：最好/平均/最坏都 O(n log n)；快排：平均 O(n log n)，最坏 O(n²)
- key: 原地
  value: 快排原地（只用递归栈）；数组归并需要 O(n) 额外空间
- key: 下限
  value: 比较排序最坏至少约 n log n 次比较；计数、基数排序不靠比较
- key: 小数组
  value: 标准库在小区间常切换到插入排序
