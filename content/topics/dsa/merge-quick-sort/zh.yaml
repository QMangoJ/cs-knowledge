        mergeComparisons: 17
        quickComparisons: 14
  log:
  - mode: 实验
    event: "对照实验做完了：同一输入下两种排序的比较次数差距，本质是递归层数的差距。"
level: 基础
minutes: 30
prereq: []
objectives:
- 说清归并的合并步骤与快排的分区步骤
- 解释快排最坏 O(n²) 的成因与随机 pivot 的作用
- 对比稳定性与额外空间
aiLink: 排序无处不在：向量检索的 top-k、日志按时间归并、训练数据 shuffle 前的预处理。理解分治与最坏情况，才能在系统设计里选对排序策略、避开被构造输入打爆的快排。
design:
- mechanism: 标准库全都做混合：快排主跑、插入收尾、深了换堆
  problem: 纯血快排有两个坑：小段只剩十几个元素时，递归压栈开销比插入排序还贵；基准选歪时直接跌回 O(n²)，碰上已排序请求就能卡爆服务。
  choice: 主体跑快排吃满缓存红利，基准用随机或三数取中；切到十几个元素就换插入排序收尾；暗中盯着递归深度，太深立刻切堆排序兜底（内省排序）；要稳定就走归并系的 [[TimSort]]。
  tradeoff: 代码路径变多、切换阈值还得按硬件和数据类型实测；换来的是平时极快、最坏不崩、小段不慢三头全占，这笔账在标准库层面稳赚不赔。
  root: 大 O 只画增长曲线，不管小规模常数，也不保每次输入都友好——工程排序必须按规模分段、按风险兜底，再用实测把切换点钉死。
- mechanism: 归并宁可多花 O(n) 临时空间，换稳定和一趟线性合并
  problem: 两段有序数组紧挨着躺在原数组里，要是直接原地合并，前面写进来的结果会立刻覆盖掉左段还没读到的数，腾挪起来慢得不划算。
  choice: 干脆开一块临时数组接住合并输出（链表改指针可原地），再定一条「相等先取左段」的小规矩，顺手就把多关键字排序急需的[[稳定性]]买下来了。
  tradeoff: 内存紧张时得重新算账：数据大到装不下内存就转磁盘顺串做[[外部排序]]，或者干脆放弃稳定用堆排序换原地。
  root: 这是数据流向决定的物理约束：两条输入流要交错拧成一条输出流，只要写会盖掉未读完的输入，就必须有第三方缓冲区接着。
- mechanism: 靠随机选基准或三路划分，封死被构造输入打爆的后门
  problem: 固定选首元素或末元素当基准时，谁摸清规矩就能造一组有序或全重复的输入，让快排退化成平方级——跟哈希洪水攻击同一种套路。
  choice: 改用随机挑基准（或三数取中）让切分不再听输入摆布，遇到重复值扎堆就切三路划分一趟落位相等段，再配深度阈值切堆排序兜底。
  tradeoff: 引入随机性后同一输入两次跑的耗时会有轻微波动，三路划分在无重复数据上也略多几步指针移动；但最坏退化从必然变成极小概率并被彻底封顶。
  root: 只要算法策略固定不变，输入就能反过来针对它；加入随机性等于让算法出牌不透明，彻底打破「最坏输入可被构造」的死角。
quiz:
- q: 快排在已排序数组 + 固定末元素 pivot 时的复杂度？
  options:
  - O(n log n)
  - O(n²)
  - O(n)
  - O(log n)
  answer: 1
  explain: 每次分区只去掉一个元素，递归深度 n，比较约 n²/2——sort-compare 实验里就是 28 次。
- q: 归并排序的额外空间是？
  options:
  - O(1)
  - O(n)
  - O(log n)
  - O(n²)
  answer: 1
  explain: 合并需要与输入等长的临时数组（这是它换稳定与最坏保证的代价）。
- q: 稳定性指什么？
  options:
  - 速度稳定
  - 相等元素的相对次序在排序后保持不变
  - 内存稳定
  - 不崩溃
  answer: 1
  explain: 多关键字排序靠稳定性叠加：先按次关键字排、再按主关键字稳定排序。
