- id: inversions
  title: 顺手计数：归并数逆序对
  tldr: 合并两个有序段时，右段元素被取走的瞬间，就能数清它新增的逆序对。
  body: >-
    归并合并时顺手能数逆序对。逆序对指下标在前、值却更大的一对数，衡量数组离有序有多远。5、2、8、1、9、3 的逆序对：5 大于后面的 2、1、3，2 大于 1，8 大于 1、3，9 大于 3，共 7
    对。逐对枚举是平方级，数据一大就数不动。


    归并法在合并时计数：右段元素被取走时，左段还剩几个没取，它就与几个左段元素构成新的逆序对。最后一次大合并：左段 2、5、8 与右段 1、3、9，取右段的 1 时左段剩 3 个，记 3 对；取 3 时左段剩 2 个（5 与 8），记
    2 对；取 9 时左段已空，记 0 对。再加上小段内部先前数出的 2 对，总计 7 对，与枚举一致。


    复杂度仍是 n log n，计数只是多加一个数。逆序对可用来比较榜单差异、算把名单调整成另一份所需的最少相邻交换次数。计数要用 64 位整数：逆序对最多约为 n 的平方的一半，32 位装不下。
  derivation: original
