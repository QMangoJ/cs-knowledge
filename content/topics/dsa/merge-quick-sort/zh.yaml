title: 归并排序与快速排序：分而治之
summary: 归并排序和快速排序都是分而治之，但做事顺序刚好相反：归并先按位置硬切到单个元素，回来合并时才比较大小，靠「相等时先取左边」保住[[稳定性]]，也靠永远对半切把最坏耗时锁死在 O(n log n)；快排先选一个基准（[[pivot]]）在原数组里把小的扔左边、大的扔右边，再分别递归两侧，省下了临时数组且平时跑得更快，可基准一选歪就会退化到 O(n²)。本课从平方级到底为什么慢算起，先走完归并的拆合与顺手数逆序对，再拆快排的基准分区、三路应对重复键与递归栈控制，最后落到比较排序的理论下限、磁盘外部排序以及标准库为什么全用混合策略。
premise: 要把一串数字从小到大排整齐，在只有 6 个数 [5, 2, 8, 1, 9, 3] 时怎么排都行；可一旦变成 1 万个甚至 100 万个，两两比较交换的冒泡排序会直接卡死。本课就拿这组 [5, 2, 8, 1, 9, 3] 贯穿到底，看两种把大问题拆小的办法怎样把对比次数压下来，又为什么它们在稳不稳定、省不省内存、会不会突然掉链子上走出了两条完全不同的路。
position: 本课是数据结构与算法「分而治之」板块的唯一一课，接在「按名与按序查找」板块的二分查找之后：二分利用有序数组每次排除一半候选，本课把这种「每次减半」的直觉升级成整段数据的排序拆解。它同时也是下一板块「树形结构」的垫脚石——全序排序要付出 n log n 的代价，如果每次只关心最急的那一个，下一课二叉堆就会用只保父子偏序换取更低的成本。
bridge:
  prev: 上一课二分查找靠数组提前有序，每次比对就能扔掉一半候选；这一课回到起点——如果拿到手的是一堆乱序数据，怎样用同样的减半思路，花 O(n log n) 的代价把它整体排好。
  next: 排好整串数据需要付出 O(n log n) 的代价；可工程里经常只关心「现在最急的那一个」，下一课二叉堆会问：如果放弃整体全序、只守住父子大小关系，能把每次插取的成本压到多低。
overview:
- key: 一句话总结
  value: 两种排序都把大数组拆小再解决，但节奏完全相反：归并是「先拆后合」，按位置对半切、合并时才比大小；快排是「先分区后递归」，选一个基准把数组按大小切开，再各自往下排。
- key: 分治分工
  value: 归并按位置中点对半切，左右永远一样长，所以最坏情况也是 O(n log n)；快排按数值大小切，切得均不均匀全看基准选得好不好——每次都选到最大或最小值时，会退化成 O(n²)。
- key: 稳定性
  value: "[[稳定性]]指大小相同的元素在排完序后保持原来的先后次序。比如先按姓名排再按成绩排，归并合并时相等先拿左段，能保住原本的姓名顺序；快排跨距离交换，一般不稳定。"
- key: 额外空间
  value: 归并合并两段有序结果时，需要一块和原数组一样大的 O(n) 临时数组；快排在原数组里[[原地]]交换完成分区，只消耗递归调用栈。
- key: 避坑与工程
  value: 为防快排退化，工程里会用随机选基准或三数取中，遇到大量重复值用三路划分，递归太深就改用堆排序兜底（C++ [[std::sort]] 的[[内省排序]]）；需要稳定时，[[V8]]（7.0 起）和 Python 则走归并系的 [[TimSort]] / [[Powersort]]；小段统一换插入排序。
- key: 理论下限
  value: 只靠两两比较来排序，最坏至少要约 n log n 次比较，没人能突破；只有像[[计数排序]]、[[基数排序]]这样不靠比较、利用数值范围或位数的算法，才能在特定前提下逼近线性。
