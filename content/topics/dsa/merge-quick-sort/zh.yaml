- id: external-sort
  title: 内存装不下怎么办：归并走向磁盘的[[外部排序]]
  tldr: 数据大到内存塞不下时，依赖随机交换的快排会在磁盘上卡死；归并只用顺序读写，靠「分块排成[[顺串]]、再多路合并」就能稳稳把活干完。
  body: |-
    前面都假设 6 个或 100 万个数能整块放进内存；可如果是一份 100 GB 的服务器日志，机器只有 10 GB 内存呢？快排需要到处跳着交换元素，落在磁盘上就是灾难级的随机访问；而归并的合并动作天生只从头到尾顺序读、顺序写，顺理成章升级成[[外部排序]]。

    做法分两步走。先把 100 GB 日志切成内存吃得下的 10 块，每次读 10 GB 进内存排好序写回磁盘——每一块已经排好序的磁盘文件叫一个[[顺串]]。第二步做 10 路归并：在内存里给 10 个顺串各开一个小读缓冲和一个总写缓冲，用前面讲的指针（多路时用小根堆挑最小）把 10 条流合并成一条有序大文件。

    算笔磁盘账：切块写顺串读一遍写一遍，10 路归并再读一遍写一遍，整整 100 GB 数据全程只有两读两写，而且几乎全是磁盘最喜欢的连续顺序读写。数据库大表建索引、Hadoop 与 Spark 做分布式洗牌，底层都是这套「内存排顺串 + 磁盘多路归并」的骨架。
  derivation: original
  sources:
  - ref: mit-6006
    locator: 归并排序相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
