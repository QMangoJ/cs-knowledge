- id: quick
  title: 快速排序：选基准，分两边
  tldr: 选一个基准，小的放左边、大的放右边，再分别对两边递归。
  body: '选 5 为基准，分成 [2, 1, 3]、5、[8, 9]；基准已在最终位置，两边继续同样处理。

    它原地交换，不需要大块辅助空间，实际运行通常很快。

    但如果每次都选到最小或最大的元素当基准（比如对有序数组总选第一个），每次只排除一个，就退化成 O(n²)，所以实践中会随机选基准或取中位数。'
  derivation: original
  sources:
  - ref: mit-6006
    locator: 快速排序相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: 快速排序平均 O(n log n)，最坏 O(n²)，随机化基准可避免最坏情况
    status: unverified
    note: 按 Daniel 决定不核对出处
  canvas:
    kind: datastate
    structure: array
    caption: 选 5 为基准：比它小的放左边，大的放右边；5 已在最终位置
    rows:
    - display: bars
      label: 原数组
      cells:
      - v: 5
        mark: pivot
      - v: 2
      - v: 8
      - v: 1
      - v: 9
      - v: 3
      pointers:
      - at: 0
        label: 基准
    - display: bars
      label: 分区后
      cells:
      - v: 2
      - v: 1
      - v: 3
      - v: 5
        mark: pivot
      - v: 8
      - v: 9
      breaks:
      - 3
      - 4
  log:
  - mode: 分区
    event: 左边都小于 5，右边都大于 5
  code:
    lang: typescript
    code: "// 快排核心：分区把 pivot 放到最终位置，左右递归\nfunction quickSort(a: number[], lo = 0, hi = a.length - 1): void {\n  if (lo >= hi) return;\n  const pv = a[hi]!; let i = lo;\n  for (let j = lo; j < hi; j++) if (a[j]! < pv) { [a[i], a[j]] = [a[j]!, a[i]!]; i++; }\n  [a[i], a[hi]] = [a[hi]!, a[i]!];\n  quickSort(a, lo, i - 1); quickSort(a, i + 1, hi);\n}\n// 归并排序要点：分到单元素后逐层合并两个有序段，需要 O(n) 临时数组"
    note: TypeScript 实现
- id: quick-detail
  title: 快排的细节：分区、基准和递归深度
  tldr: 快排好坏取决于基准选得好不好；递归深度也要控制住。
  body: '分区就是一趟扫描，把比基准小的换到左边、大的换到右边，原地完成。

    随机选基准后，最坏情况仍可能出现，但概率极低，期望复杂度是 O(n log n)；大量重复元素时，用“三路分区”把等于基准的放中间，避免退化。

    每次先递归较短的一边、较长的一边用循环处理，可以把递归栈深度控制在 O(log n)。'
  derivation: original
  sources:
  - ref: mit-6006
    locator: 排序相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: 快排好坏取决于基准选得好不好；递归深度也要控制住。
    status: unverified
    note: 按 Daniel 决定不核对出处
  canvas:
    kind: datastate
    structure: array
    caption: 三路分区：以 3 为基准，一趟扫描分成 < 3、= 3、> 3 三段
    rows:
    - label: 分区前
      cells:
      - v: 3
        mark: pivot
      - v: 5
      - v: 1
      - v: 3
      - v: 8
      - v: 3
      - v: 2
      pointers:
      - at: 0
        label: 基准 3
    - label: 分区后
      cells:
      - v: 2
      - v: 1
      - v: 3
        mark: pivot
      - v: 3
        mark: pivot
      - v: 3
        mark: pivot
      - v: 8
      - v: 5
      breaks:
      - 2
      - 5
    aux:
    - label: 接下来
      items:
      - 中间三个 3 已就位，不再处理
      - 只递归 [2, 1] 和 [8, 5]
      - 先递归短的一边，栈深 O(log n)
  log:
  - mode: 分区
    event: 原地分成三段
- id: lower-bound
  title: 排序的下限：比较排序最快只能 O(n log n)
  tldr: 只靠两两比较来排序，最坏情况下至少要 n log n 量级的比较次数。
  body: 'n 个元素有 n! 种可能的排列，每次比较最多把可能性分成两半，要区分全部排列，至少需要约 log₂(n!) ≈ n log n 次比较。

    所以归并、快排、堆排序在“比较排序”里已经是最优量级了。

    如果不靠比较，而是利用值的范围，比如计数排序、基数排序，可以做到 O(n)，但只适用于整数这类有限范围的键。


    数字例子：n = 100 万时，n log n ≈ 2000 万次比较，n² = 1 万亿次——相差 5 万倍。一次被构造的已排序输入就能让朴素快排从毫秒级掉到分钟级，生产代码都用随机/中位数 pivot 或内省排序兜底。'
  derivation: original
  sources:
  - ref: mit-6006
    locator: 排序相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: 只靠两两比较来排序，最坏情况下至少要 n log n 量级的比较次数。
    status: unverified
    note: 按 Daniel 决定不核对出处
  canvas:
    kind: datastate
    structure: array
    caption: 3 个元素有 3! = 6 种排列；每次比较最多排除一半，至少要 ⌈log₂6⌉ = 3 次
    rows:
