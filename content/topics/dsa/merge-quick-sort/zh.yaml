- id: inversions
  title: 合并顺手办件事：在 O(n log n) 内数清[[逆序对]]
  tldr: 合并两段有序数组时，每次从右段拿走一个元素，看左段还剩几个没取就能一次数出新增的[[逆序对]]，把本来要平方时间的混乱度统计压进 O(n log n)。
  body: |-
    [[逆序对]]就是「下标在前、数值却更大」的数对，专门用来量一份榜单离排好序还差多远。先把 [5, 2, 8, 1, 9, 3] 拿出来硬数一遍：5 大于后面的 2、1、3（3 对），2 大于 1（1 对），8 大于 1、3（2 对），9 大于 3（1 对），总共 7 对。两两枚举要 O(n²)，一百万个数根本数不动。

    归并排序在合并时顺手就能数清，秘诀只有一句：每当取走右段当前元素时，左段剩下的所有元素都比它大，而且下标全在它前面——所以左段还剩几个数，就一次贡献几对逆序对。拿最后大合并 [2, 5, 8] 与 [1, 3, 9] 走一遍：取右段的 1 时，左段 [2, 5, 8] 还有 3 个，记 3 对；取 3 时左段还剩 [5, 8] 2 个，记 2 对；取 9 时左段空了，记 0 对。加上之前小段各自合并时记下的 2 对，总数 3 + 2 + 2 = 7 对，一分不差。

    整套统计只是在合并分支里加一行累加，复杂度还是 O(n log n)。工程上拿它算两份推荐榜单的差异度，或者算只允许相邻交换时最少换几步才能排好。写代码记得把计数器开成 64 位整数：长度为 n 的倒序数组最多有 n × (n − 1) / 2 对逆序对，10 万个数就能达到近 50 亿，32 位整数直接溢出。
