steps:
- id: why
  title: 为什么需要更快的排序
  tldr: 两两比较交换的简单排序是 O(n²)，数据一多就慢得不能用。
  body: '冒泡排序对 1 万个元素要做约 5000 万次比较，数据翻倍耗时翻四倍。

    “分而治之”把大数组拆成小数组分别排好，再组合起来，能做到 O(n log n)。

    1 万个元素只需要十几万次比较左右。'
  derivation: original
  sources:
  - ref: mit-6006
    locator: 排序相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: 归并排序为 O(n log n)，优于 O(n²) 的简单排序
    status: unverified
    note: 按 Daniel 决定不核对出处
