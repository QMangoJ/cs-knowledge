- id: hybrid-insertion
  title: 混合策略：小段为什么换插入排序
  tldr: 渐近复杂度不看常数：小段里分治的固定开销占大头，插入排序反而更快。
  body: >-
    渐近复杂度不看常数，这是教科书算法的共同盲区。插入排序是平方级，但代码短、无递归、顺序访问，对几个到几十个元素的小段，实际耗时常比继续分治还低——分治每切一刀都要付函数调用与边界判断的固定成本，小段里这笔成本占了大头。


    所以生产实现全是混合体：快排递归到小区间（常见阈值在十几个元素量级）就改用插入排序收尾；TimSort 在顺串太短时用插入排序补到最小长度。量级感受：8 个元素的段，插入排序最坏比较 28
    次且全是顺序访问；快排继续分区则要多层递归，实测往往前者更快。


    阈值没有理论最优，只有实测最优，随语言、硬件、元素类型而变。大 O 负责划圈，圈内谁赢要靠测，而不是靠背。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 7 快速排序的改进
