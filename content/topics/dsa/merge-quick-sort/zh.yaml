- id: quick
  title: 快速排序：选基准，分两边
  tldr: 选一个基准，小的放左边、大的放右边，再分别对两边递归。
  body: '选 5 为基准走一趟分区：扫描其余元素，2 小于 5 留左，8 大于 5 去右，1 留左，9 去右，3 留左，分区结果是左段 2、1、3，基准 5，右段 8、9。一趟之后基准 5 已经站在最终位置上，左边都比它小、右边都比它大，两边再各自递归，互不干扰。

    它原地交换，不需要大块辅助空间，顺序访问对缓存友好，实际运行通常很快，平均复杂度 n log n 的常数比归并小。但它的保证是概率性的：若每次都选到最小或最大的元素当基准（如对已排序数组总选第一个），每次只排除一个元素，层数变成 n，总量退化成平方级。

    所以实践中基准不能裸奔：随机选让输入分布无法针对你，三数取中让基准靠近中位数。注意退化与输入有关而与代码写法无关：同一份快排，乱序输入飞快、已排序输入变蜗牛，这种输入敏感性是选型时必须先问清的一课。'
  derivation: original
  sources:
  - ref: mit-6006
    locator: 快速排序相关讲义
