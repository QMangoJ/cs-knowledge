- id: merge-split
  title: 归并的「切」：只管按位置对半砍，层数钉死在 log n
  tldr: 归并排序的前半程只按位置中点硬切、完全不比大小，直到切出单元素段——单元素天然有序，整棵递归树的高度也被铁打地锁死在 log n 层。
  body: |-
    盯着 [5, 2, 8, 1, 9, 3] 走一遍怎么切：第一刀从正中间切开，左边拿 [5, 2, 8]，右边拿 [1, 9, 3]；第二刀继续对半切，拆成 [5]、[2, 8] 和 [1]、[9, 3]；第三刀把剩下来的双元素段再切开，6 个数全部变成独立的单元素段。

    等等，连大小都不比，瞎切一通有什么用？用处在于「单元素数组天然有序」，递归终于有了一个不用动脑子的出口；而且因为每次严格按位置中点对半切，不管原本的数是乱的还是顺的，切出来的左右两半永远差不多长。6 个数只拆 3 层，1024 个数拆 10 层，100 万个数大约 20 层——这就是 O(n log n) 里 log n 的由来。

    反过来看，如果切分的时候看数值大小而不是看位置中点，一旦挑得不巧就可能一边切 1 个、另一边切 n − 1 个，递归层数直接暴涨到 n 层。归并靠「盲切位置」提前把层数封了顶，剩下的工作全部留给合并阶段完成。
