  code:
    lang: typescript
    code: |-
      // 快排核心：分区把 pivot 放到最终位置，左右递归
      function quickSort(a: number[], lo = 0, hi = a.length - 1): void {
        if (lo >= hi) return;
        const pv = a[hi]!; let i = lo;
        for (let j = lo; j < hi; j++) if (a[j]! < pv) { [a[i], a[j]] = [a[j]!, a[i]!]; i++; }
        [a[i], a[hi]] = [a[hi]!, a[i]!];
        quickSort(a, lo, i - 1); quickSort(a, i + 1, hi);
      }
      // 归并排序要点：分到单元素后逐层合并两个有序段，需要 O(n) 临时数组
    note: TypeScript 实现
- id: quick-detail
  title: 快排的分区与栈深：一趟原地扫完，再先递归短的那边
  tldr: 代码里一趟双指针扫描就能完成[[原地]]分区；而为了防止某次切分太偏把调用栈撑爆，递归时必须先走较短的那一侧，把栈深度压在 O(log n)。
  body: |-
    照着代码里的写法选末元素 3 当基准，在 [5, 2, 8, 1, 9, 3] 上走一遍[[原地]]扫描，设一个「小于区边界」指针停在下标 0：5 不小于 3 跳过；2 小于 3，换到下标 0，边界前进到 1；8 跳过；1 小于 3，换到下标 1，边界前进到 2；9 跳过。扫完把末位的 3 换到边界下标 2，数组变成 [2, 1, 3, 5, 9, 8]，3 一次站上最终位置。

    等等，如果遇到很多重复元素怎么办？比如画布里这个带三个 3 的数组 [3, 5, 1, 3, 8, 3, 2]，普通二路分区会把相等的 3 扔进左段或右段继续反复切，白做功；更干脆的做法是三路分区，一趟把小于 3、等于 3、大于 3 分成三块，中间三个 3 直接原地毕业（下一步详看）。

    另外还得管住调用栈深度：如果某次碰巧切得一长一短，先递归较短的一边，较长的一边用循环改写原地接着分。这样就算每次都遇上最偏的切分，短边也绝不超过当前长度的一半，调用栈深度被严格锁死在 O(log n)，绝不会撑爆内存。
  derivation: original
  sources:
  - ref: mit-6006
    locator: 排序相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
