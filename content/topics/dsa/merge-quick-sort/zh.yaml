- id: merge-join
  title: 归并的「并」：双指针合并两段，相等先取左换来稳定性
  tldr: 往回合并时，两边各派一个指针盯着段首、谁小取谁；只要多加一句「相等先取左段」，[[稳定性]]就到手了，代价是要开一块 O(n) 的临时空间。
  body: |-
    小段排好后，来到最顶上那次大合并：左段是排好的 [2, 5, 8]，右段是排好的 [1, 3, 9]。两边各放一个指针指在开头，谁小拿谁并往后挪一格：先比 2 和 1 取 1，再比 2 和 3 取 2，接着比 5 和 3 取 3，然后依次取走 5、8，最后右段剩 9 直接接上，得到 [1, 2, 3, 5, 8, 9]。一共只比较 5 次，因为两段内部本来有序，根本不用回头看。

    每合并一层，所有元素都恰好被搬进结果区一次，工作量正比于 n；总共只有 log n 层，乘起来就是铁打的 O(n log n)，不管输入有多刁钻都一样。而且只要加一条小规矩——左右两头相等时优先取左段的元素——原本排在前面的元素在排序后还是在前面，这就是[[稳定性]]。

    那为什么非得开一块 O(n) 的临时数组，不能直接在原数组里合并吗？因为左段和右段紧挨着躺在原数组里，合并输出一旦原地覆写前面的格子，左段还没读到的元素就会被盖掉；想一边读一边写得顺畅，就得拿一块等大的缓冲区先接住合并结果，再抄回来。
