- id: merge-split
  title: 归并排序：一直对半拆
  tldr: 把数组不断对半拆开，直到每份只剩一个元素。
  body: '[5, 2, 8, 1, 9, 3] 拆成 [5, 2, 8] 和 [1, 9, 3]，再继续拆，直到每份一个元素。

    只有一个元素的数组天然有序。

    拆的层数是 log n，这就是 O(n log n) 里 log n 的来源。'
  derivation: original
