- id: engineering
  title: 真实标准库的选择：没有纯血算法，全是混血工程体
  tldr: 需要[[稳定性]]选归并一系，省内存拼速度选快排一系；但真实标准库从来不用纯血教科书原版，全是按输入特征拼起来的混合算法。
  body: |-
    多关键字排序最能看出[[稳定性]]为什么值钱：一份学生名单先按姓名排好，接着再按成绩排一次。如果排序稳定，同分的同学依然保持着姓名顺序，一次排序顶两次用；不稳定就会把上一轮排好的姓名顺序搅乱。正因如此，Chrome 与 Node.js 背后的 [[V8]] 从 7.0 版（2018 年）起把 Array.prototype.sort 统一换成了 [[TimSort]]（Python 直到 3.11 升级为 [[Powersort]] 前也长期用它）——它们都是稳定的自适应归并变体，会先扫描数组里本来就排好序的自然片段直接合并，处理真实业务数据飞快。

    如果不要求稳定、又想省掉 O(n) 临时内存，就看快排一系的代表 C++ [[std::sort]]，它用的是[[内省排序]]：主力跑快排吃满缓存红利，同时暗中盯着递归深度，一旦发现某次倒霉输入让递归深度超过 2 log n（快要退化了），立刻原地切换成堆排序把最坏情况锁死在 O(n log n)，收尾小段再切插入排序。

    你看，教科书把归并、快排、堆排、插入拆开教，真实标准库却把它们焊在了一起：先问「要不要稳定、能不能付额外内存」，再把最坏兜底、平均加速、小段收尾拼成一套方案。
  derivation: original
  sources:
