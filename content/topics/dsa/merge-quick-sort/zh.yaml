- id: merge-split
  title: 归并排序：一直对半拆
  tldr: 把数组不断对半拆开，直到每份只剩一个元素。
  body: |-
    5、2、8、1、9、3 先拆成左半 5、2、8 与右半 1、9、3，再拆成更小的段，最后拆到六个单元素段。拆分只按位置对半切，不比较元素，所以拆分不产生顺序，顺序全靠合并阶段兑现。

    单元素数组天然有序，这是递归出口。拆的层数是 log n：6 个元素拆 3 层，1024 个拆 10 层，100 万个约 20 层。这就是 n log n 里 log n 的来源——递归树的高度。

    对半拆保证左右均衡，最坏层数钉死在 log n。快排分区若切得一边倒，层数失控到 n 层，平方退化正是从层数失控来的。两种算法的命运，在切分是否均衡这一步就已分岔。
  derivation: original
