- id: three-way
  title: 快排三路划分：把相等的先安置好
  tldr: 一趟切成小于、等于、大于三段，等于段一次全部落位，重复越多省得越多。
  body: '二路分区处理重复元素有个浪费：等于基准的元素被分到两侧，下一轮还要再比一遍。数组里重复越多，浪费越大；极端情况全是同一个数，二路分区每轮只落位一个基准，退化回平方级，可这明明是一眼就有序的输入。

    三路分区一趟把数组切成三段：小于基准、等于基准、大于基准。走例 4、9、4、4、1、9、4 以 4 为基准：维护小于区、待定区、大于区一趟扫完，9 进大于区，1 进小于区，其余四个 4 全部停在中间段，结果是 1、4、4、4、4、9、9，中间四个 4 一次全部落位，只需再递归两侧的一小段。

    代价是一趟里比较与交换的常数略大，无重复时并不比二路快，所以它不是默认选项，而是针对重复密集数据的特化：按状态码排序的日志、取值范围小的成绩这类重复率高的键最受益。CLRS 把它列为快排的标准改进之一，判断标准就一条：等于基准的元素占比高不高。'
  derivation: original
