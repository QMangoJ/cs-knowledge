# 知识优先版草稿（Linux x86-64 为例）。出处仅供参考，按 Daniel 决定不做逐条核对。
id: dsa/merge-quick-sort
subject: dsa
slug: merge-quick-sort
order: 3
status: published
license: CC-BY-4.0
title: 归并排序与快速排序：分而治之
summary: 两种最常用的 O(n log n) 排序，都是把大问题拆小，但拆法不同、特点也不同。
premise: 以对 [5, 2, 8, 1, 9, 3] 排序为例。
overview:
  - key: 一句话总结
    value: 归并：先拆后合，稳定、总是 O(n log n)；快排：先分区后递归，平均最快但最坏 O(n²)
  - key: 稳定性
    value: 相等元素排序后保持原来的先后顺序；归并稳定，快排通常不稳定
  - key: 额外空间
    value: 归并需要 O(n) 辅助空间；快排只需要递归栈
  - key: 工程里
    value: V8 自 7.0（2018 年）起 Array.prototype.sort 用 TimSort，一种稳定的归并变体
  - key: 为什么不用冒泡
    value: 冒泡、插入排序是 O(n²)，数据大了慢得多
visual: datastate
logColumns:
  - key: mode
    label: 当前状态
  - key: event
    label: 发生了什么
steps:
  - id: why
    title: 为什么需要更快的排序
    tldr: 两两比较交换的简单排序是 O(n²)，数据一多就慢得不能用。
    body: |-
      冒泡排序对 1 万个元素要做约 5000 万次比较，数据翻倍耗时翻四倍。
      “分而治之”把大数组拆成小数组分别排好，再组合起来，能做到 O(n log n)。
      1 万个元素只需要十几万次比较左右。
    derivation: original
    sources:
      - ref: mit-6006
        locator: 排序相关讲义
        url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
        claim: 归并排序为 O(n log n)，优于 O(n²) 的简单排序
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: datastate
      structure: array
      caption: 分而治之：拆小、排好、再组合
      rows:
        - label: 待排序
          cells:
            - v: 5
            - v: 2
            - v: 8
            - v: 1
            - v: 9
            - v: 3
      aux:
        - label: 比较次数
          items:
            - 冒泡 ≈ n²/2
            - 分治 ≈ n log n
    log:
      - mode: 未排序
        event: 6 个元素待排序
  - id: merge-split
    title: 归并排序：一直对半拆
    tldr: 把数组不断对半拆开，直到每份只剩一个元素。
    body: |-
      [5, 2, 8, 1, 9, 3] 拆成 [5, 2, 8] 和 [1, 9, 3]，再继续拆，直到每份一个元素。
      只有一个元素的数组天然有序。
      拆的层数是 log n，这就是 O(n log n) 里 log n 的来源。
    derivation: original
    sources:
      - ref: mit-6006
        locator: 归并排序相关讲义
        url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
        claim: 归并排序递归地将数组二分
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: datastate
      structure: array
      caption: 拆 log n 层，直到每份只剩一个元素
      rows:
        - label: 第 0 层
          cells:
            - v: 5
            - v: 2
            - v: 8
            - v: 1
            - v: 9
            - v: 3
        - label: 第 1 层
          cells:
            - v: 5
            - v: 2
            - v: 8
            - v: 1
            - v: 9
            - v: 3
          breaks:
            - 3
        - label: 第 2 层
          cells:
            - v: 5
            - v: 2
            - v: 8
            - v: 1
            - v: 9
            - v: 3
          breaks:
            - 1
            - 3
            - 4
        - label: 第 3 层
          cells:
            - v: 5
              mark: active
            - v: 2
              mark: active
            - v: 8
              mark: active
            - v: 1
              mark: active
            - v: 9
              mark: active
            - v: 3
              mark: active
          breaks:
            - 1
            - 2
            - 3
            - 4
            - 5
    log:
      - mode: 拆分
        event: 拆到每份一个元素
  - id: merge-join
    title: 归并排序：两两合并
    tldr: 把两份有序的小数组合并成一份有序的大数组，一层层合回去。
    body: |-
      合并时两边各拿最前面的，谁小取谁，一趟扫完，每层总共 O(n)。
      遇到相等的元素先取左边的，所以相等元素的先后顺序不变，这叫“稳定”。
      代价是合并时需要一块和原数组一样大的辅助空间。
    derivation: original
    sources:
      - ref: mit-6006
        locator: 归并排序相关讲义
        url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
        claim: 合并两个有序数组为线性时间，归并排序是稳定排序
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: datastate
      structure: array
      caption: 两边各取最前面的，谁小取谁；相等先取左边（稳定）
      rows:
        - label: 单个元素
          cells:
            - v: 5
            - v: 2
            - v: 8
            - v: 1
            - v: 9
            - v: 3
          breaks:
            - 1
            - 2
            - 3
            - 4
            - 5
        - label: 合并一层
          cells:
            - v: 2
              mark: active
            - v: 5
              mark: active
            - v: 8
              mark: active
            - v: 1
              mark: active
            - v: 3
              mark: active
            - v: 9
              mark: active
          breaks:
            - 3
        - label: 合并完成
          cells:
            - v: 1
              mark: done
            - v: 2
              mark: done
            - v: 3
              mark: done
            - v: 5
              mark: done
            - v: 8
              mark: done
            - v: 9
              mark: done
    log:
      - mode: 有序
        event: 合并完成
  - id: quick
    title: 快速排序：选基准，分两边
    tldr: 选一个基准，小的放左边、大的放右边，再分别对两边递归。
    body: |-
      选 5 为基准，分成 [2, 1, 3]、5、[8, 9]；基准已在最终位置，两边继续同样处理。
      它原地交换，不需要大块辅助空间，实际运行通常很快。
      但如果每次都选到最小或最大的元素当基准（比如对有序数组总选第一个），每次只排除一个，就退化成 O(n²)，所以实践中会随机选基准或取中位数。
    derivation: original
    sources:
      - ref: mit-6006
        locator: 快速排序相关讲义
        url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
        claim: 快速排序平均 O(n log n)，最坏 O(n²)，随机化基准可避免最坏情况
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: datastate
      structure: array
      caption: 选 5 为基准：比它小的放左边，大的放右边；5 已在最终位置
      rows:
        - label: 原数组
          cells:
            - v: 5
              mark: pivot
            - v: 2
            - v: 8
            - v: 1
            - v: 9
            - v: 3
          pointers:
            - at: 0
              label: 基准
        - label: 分区后
          cells:
            - v: 2
            - v: 1
            - v: 3
            - v: 5
              mark: pivot
            - v: 8
            - v: 9
          breaks:
            - 3
            - 4
    log:
      - mode: 分区
        event: 左边都小于 5，右边都大于 5
  - id: engineering
    title: 工程里怎么选
    tldr: 需要稳定选归并类，追求原地和速度选快排类；标准库已经帮你选好了。
    body: |-
      V8 从 7.0 版（2018 年）起，Array.prototype.sort 用 TimSort：一种稳定的归并变体，对部分有序的数据特别快。
      稳定性的意义：先按姓名排、再按分数排，同分的人仍保持姓名顺序。
      C++ 的 std::sort 常用的内省排序以快排为主，并在递归过深时改用堆排序，保证最坏 O(n log n)。
    derivation: original
    sources:
      - ref: mit-6006
        locator: 排序相关讲义
        url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
        claim: 排序算法在稳定性、空间与最坏情况上有不同取舍
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: datastate
      structure: array
      caption: 排序结果
      rows:
        - label: 有序
          cells:
            - v: 1
              mark: done
            - v: 2
              mark: done
            - v: 3
              mark: done
            - v: 5
              mark: done
            - v: 8
              mark: done
            - v: 9
              mark: done
      aux:
        - label: V8 ≥ 7.0
          items:
            - TimSort（稳定）
        - label: C++ std::sort
          items:
            - 内省排序
    log:
      - mode: 总结
        event: 按需求选择排序算法
