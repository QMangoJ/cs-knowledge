  code:
    lang: typescript
    code: "// 快排核心：分区把 pivot 放到最终位置，左右递归\nfunction quickSort(a: number[], lo = 0, hi = a.length - 1): void {\n  if (lo >= hi) return;\n  const pv = a[hi]!; let i = lo;\n  for (let j = lo; j < hi; j++) if (a[j]! < pv) { [a[i], a[j]] = [a[j]!, a[i]!]; i++; }\n  [a[i], a[hi]] = [a[hi]!, a[i]!];\n  quickSort(a, lo, i - 1); quickSort(a, i + 1, hi);\n}\n// 归并排序要点：分到单元素后逐层合并两个有序段，需要 O(n) 临时数组"
    note: TypeScript 实现
- id: quick-detail
  title: 快排的细节：分区、基准和递归深度
  tldr: 快排好坏取决于基准选得好不好；递归深度也要控制住。
  body: '分区就是一趟扫描：以末元素为基准，维护一个小元素区的边界，扫描指针从左走到右，遇到比基准小的就换进小区并扩一格，最后把基准换到边界位置。以 5、2、8、1、9、3 且基准为 3 为例：扫过 5 不小于 3 跳过，2 小于 3 换到最前，8 跳过，1 小于 3 换到 2 的后面，9 跳过，扫描结束把 3 换到下标 2，得到 2、1、3、5、9、8，基准落位。

    随机选基准后，最坏情况仍可能出现，但概率极低，期望复杂度是 n log n；大量重复元素时普通二路分区会把等于基准的元素反复卷入递归，用三路分区把等于基准的单独放中间，一趟之后整段相等元素全部落位，不再参与递归，重复越多省得越多（下一节专门走一遍三路）。

    递归深度也要管：每次先递归较短的一边、较长的一边改用循环继续，可以把栈深度控制在 log n 量级；若两边都不管不顾地递归，最坏深度达到 n，不仅慢，还可能把调用栈撑爆。画布里是三路分区处理三个 3 的样子。'
  derivation: original
  sources:
  - ref: mit-6006
    locator: 排序相关讲义
