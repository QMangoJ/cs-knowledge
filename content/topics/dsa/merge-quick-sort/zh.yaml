- id: three-way
  title: 三路快排：遇到大量重复值，相等段一趟全部落位
  tldr: 重复键扎堆时，改用「小于、等于、大于」三路划分，一趟扫过去就把所有和基准相等的数全部聚在中间落位，避免它们在下一轮里白白重复比较。
  body: |-
    前面 6 个数各不相同还看不出破绽，可真实业务里太常碰到大量重复键——比如按状态码、年龄或 0–100 分的成绩排序。极端一点，如果整段都是同一个数，普通二路分区每趟只落位 1 个基准，其余全被扔到同一侧继续递归，硬生生把本来有序的输入排成 O(n²)。

    三路快排把数组拆成三段来治这毛病。拿带四个 4 的 [4, 9, 4, 4, 1, 9, 4] 走一遍，选 4 当基准：维护「小于区」「待定区」「大于区」三个边界一趟扫过去，小的 1 换到最前面，大的 9 换到最后面，剩下的四个 4 全留在中间段，扫完得到 [1, 4, 4, 4, 4, 9, 9]。中间这四个 4 已经彻底就位，下一轮只递归左边的 [1] 和右边的 [9, 9]。

    天上不会掉馅饼：三路划分需要多维护一个指针，遇到互不相同的纯随机数据时，比较和交换次数反而比二路多一点。所以是否切三路看一件事：数据里重复键的比例高不高——就像 [[CLRS]] 指出的，它是针对高重复分布的专门武器。
  derivation: original
