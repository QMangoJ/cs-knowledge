  code:
    lang: typescript
    code: |-
      // 快排核心：分区把 pivot 放到最终位置，左右递归
      function quickSort(a: number[], lo = 0, hi = a.length - 1): void {
        if (lo >= hi) return;
        const pv = a[hi]!; let i = lo;
        for (let j = lo; j < hi; j++) if (a[j]! < pv) { [a[i], a[j]] = [a[j]!, a[i]!]; i++; }
        [a[i], a[hi]] = [a[hi]!, a[i]!];
        quickSort(a, lo, i - 1); quickSort(a, i + 1, hi);
      }
      // 归并排序要点：分到单元素后逐层合并两个有序段，需要 O(n) 临时数组
    note: TypeScript 实现
- id: quick-detail
  title: 快排的细节：分区、基准和递归深度
  tldr: 快排好坏取决于基准选得好不好；递归深度也要控制住。
  body: >-
    分区就是一趟扫描：以末元素为基准，维护小元素区的边界，遇到比基准小的就换进小区并扩一格，最后把基准换到边界。以 5、2、8、1、9、3 且基准为 3 为例：5 不小于 3 跳过，2 小于 3 换到最前，8 跳过，1 小于 3 换到
    2 的后面，9 跳过，结束把 3 换到下标 2，得到 2、1、3、5、9、8，基准落位。


    随机选基准后最坏仍可能出现，但概率极低，期望是 n log n；大量重复元素时二路分区会把等于基准的元素反复卷入递归，三路分区把等于基准的单独放中间，一趟之后整段相等元素全部落位，重复越多省得越多（下一节走三路）。


    递归深度也要管：先递归较短的一边、较长的一边用循环继续，栈深度可控制在 log n 量级；两边都不管地递归，最坏深度达到 n，还可能撑爆调用栈。画布里是三路分区处理三个 3 的样子。
  derivation: original
  sources:
