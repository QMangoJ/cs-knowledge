- id: engineering
  title: 工程里怎么选
  tldr: 需要稳定选归并类，追求原地和速度选快排类；标准库已经帮你选好了。
  body: 'V8 从 7.0 版（2018 年）起，Array.prototype.sort 用 TimSort：一种稳定的归并变体，对部分有序的数据特别快。

    稳定性的意义：先按姓名排、再按分数排，同分的人仍保持姓名顺序。

    C++ 的 std::sort 常用的内省排序以快排为主，并在递归过深时改用堆排序，保证最坏 O(n log n)。'
  derivation: original
  sources:
  - ref: mit-6006
    locator: 排序相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: 排序算法在稳定性、空间与最坏情况上有不同取舍
    status: unverified
    note: 按 Daniel 决定不核对出处
  canvas:
    kind: datastate
    structure: array
    caption: 排序结果
    rows:
