- id: merge-join
  title: 归并排序：两两合并
  tldr: 把两份有序的小数组合并成一份有序的大数组，一层层合回去。
  body: '合并时两边各拿最前面的，谁小取谁，一趟扫完，每层总共 O(n)。

    遇到相等的元素先取左边的，所以相等元素的先后顺序不变，这叫“稳定”。

    代价是合并时需要一块和原数组一样大的辅助空间。'
  derivation: original
  sources:
  - ref: mit-6006
    locator: 归并排序相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: 合并两个有序数组为线性时间，归并排序是稳定排序
    status: unverified
    note: 按 Daniel 决定不核对出处
  canvas:
