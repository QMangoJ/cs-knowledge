steps:
- id: why
  title: 为什么需要更快的排序：平方级在百万数据面前直接卡死
  tldr: 两两比较的简单排序之所以数据一大就瘫痪，是因为比较次数按元素个数的平方暴涨；用分治法把数组拆小再排，能把工作量从 n² 压到 n log n。
  body: |-
    拿咱们这组 [5, 2, 8, 1, 9, 3] 来比一比：才 6 个数，冒泡排序最多也就比较 15 次，眨眼就完。可一旦数据涨到 1 万个，最坏要做 n × (n − 1) / 2 ≈ 5000 万次比较；涨到 100 万个，比较次数直接飙到约 5000 亿次。平方级的脾气就是规模翻 10 倍、耗时翻 100 倍，再好的硬件常数也救不回来。

    换条路子，不让所有元素互相碰面，而是把大数组对半拆成小段分别排好再合起来。6 个数只拆 3 层，1 万个数大约拆 14 层，100 万个数也不过 20 层；每层扫一遍所有元素，总比较量压到 n log n——1 万个元素只用十几万次，比冒泡快几百倍；100 万个元素时差距拉大到上万倍。

    沿着「先拆再解」这条思路，正好分出两种做法相反的算法：归并排序先把数组拆成单元素、回来合并时才排大小；快速排序先在原地挑一个基准把大小分到两边、再分别递归。后面全部差异——稳不稳定、占不占内存、会不会退化——都从这个分工决定。
