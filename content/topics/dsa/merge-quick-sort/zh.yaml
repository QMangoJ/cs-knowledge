- id: lower-bound
  title: 排序的下限：比较排序最快只能 O(n log n)
  tldr: 只靠两两比较来排序，最坏情况下至少要 n log n 量级的比较次数。
  body: |-
    n 个元素有 n! 种排列，每次比较最多把可能性分成两半，要区分全部排列至少需要约 log₂(n!) ≈ n log n 次比较。所以归并、快排、堆排序在“比较排序”里已是最优量级。

    不靠比较、利用值的范围，可以突破下限：计数排序是 O(n+k)（k 为值域大小）、基数排序是 O(d·(n+b))（d 为位数），只在值域/位数受限时才近似线性，且只适用于整数这类有限范围的键。

    数字例子：n = 100 万时，n log n ≈ 2000 万次比较，n² = 1 万亿次——相差 5 万倍。被构造的已排序输入能让朴素快排从毫秒级掉到分钟级，生产代码都用随机/中位数 pivot 或内省排序兜底。
  derivation: original
  sources:
