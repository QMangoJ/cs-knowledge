- id: lab-compare
  title: 动手实验：归并 vs 快排对比
  tldr: 同一组输入同时跑两种排序，比较次数的差距一目了然。
  body: '切换「已排序」预设再单步到底：快排（末元素 pivot）会做出 28 次比较——每次只排好一个元素，这就是 O(n²) 退化；归并仍是 12 次。乱序输入下两者接近，这正是随机 pivot 的价值：让输入分布无法针对你。


    工程注记：JS 的 Array.prototype.sort 在 V8 中是 TimSort（归并变体，稳定）；Python 的 sorted 长期用 TimSort，3.11 起换成它的改进版 Powersort（同为稳定的自适应归并）。业务里多关键字排序先想稳定性，再决定写几次 sort。

    再补两个观察点：第一，把预设换成逆序，快排用末元素作基准同样退化，因为每轮选到的仍是极值，退化与升序还是降序无关，只与基准是不是极值有关；第二，对照两边的递归层数，归并的层数永远是 log n 层，快排退化时层数等于元素个数，比较次数的差距本质上是层数差距。实验结束后把结论反过来用：生产代码里看到排序慢，先怀疑输入分布与基准策略，而不是怀疑语言或机器。'
  derivation: original
  sources: []
  canvas:
    kind: lab
