id: dsa/merge-quick-sort
subject: dsa
slug: merge-quick-sort
order: 3
status: published
license: CC-BY-4.0
title: 归并排序与快速排序：分而治之
summary: 两种最常用的 O(n log n) 排序，都是把大问题拆小，但拆法不同、特点也不同。
premise: 以对 [5, 2, 8, 1, 9, 3] 排序为例。
position: >-
  本课开启「分而治之」板块，它接在二分查找每次排除一半的减半直觉之后，把减半从查找动作升级为拆解整个排序问题的递归结构。学完你能解释快排为何会因 pivot 选歪退化到 O(n²)，并说清归并靠先取左段相等元素这一规则如何换来稳定性。
bridge:
  prev: >-
    上一课二分靠有序前提一轮砍掉一半候选，本课把同样的减半搬到排序上：归并对半拆、快排用 pivot 分区后再递归处理两边。
  next: >-
    排序给出完整全序的代价是 n log n，下一课二叉堆要追问的是：若只关心最急的那一个，能否用只保父子偏序的办法把代价压得更低。
overview:
- key: 一句话总结
  value: 归并：先拆后合，稳定、总是 O(n log n)；快排：先分区后递归，平均最快但最坏 O(n²)
- key: 稳定性
  value: 相等元素排序后保持原来的先后顺序；归并稳定，快排通常不稳定
- key: 额外空间
  value: 归并需要 O(n) 辅助空间；快排只需要递归栈
- key: 工程里
  value: V8 自 7.0（2018 年）起 Array.prototype.sort 用 TimSort，一种稳定的归并变体
- key: 为什么不用冒泡
  value: 冒泡、插入排序是 O(n²)，数据大了慢得多
- key: 复杂度
  value: 归并：最好/平均/最坏都 O(n log n)；快排：平均 O(n log n)，最坏 O(n²)
- key: 原地
  value: 快排原地（只用递归栈）；数组归并需要 O(n) 额外空间
- key: 下限
  value: 比较排序最坏至少约 n log n 次比较；计数、基数排序不靠比较（复杂度含值域/位数项）
- key: 小数组
  value: 标准库在小区间常切换到插入排序
visual: datastate
