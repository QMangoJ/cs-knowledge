- id: merge-split
  title: 归并排序：一直对半拆
  tldr: 把数组不断对半拆开，直到每份只剩一个元素。
  body: '5、2、8、1、9、3 先拆成左半 5、2、8 与右半 1、9、3，再拆成更小的段，最后拆到六个单元素段。拆分只按位置对半切，不比较任何元素，所以拆分本身不产生顺序，顺序全靠合并阶段兑现。

    只有一个元素的数组天然有序，这是递归的出口。拆的层数是 log n：6 个元素拆 3 层，1024 个元素拆 10 层，100 万个约 20 层。这就是 n log n 里 log n 的来源——不是比较次数的巧合，而是递归树的高度。

    一个容易忽略的点：对半拆保证左右规模均衡，最坏层数被钉死在 log n。后面快排的分区若切得一边倒，层数就会失控到 n 层，平方级退化正是从层数失控来的。两种算法的命运，在切分是否均衡这一步就已经分岔。'
  derivation: original
  sources:
