- id: lab-compare
  title: 动手实验与收束：跑出 28 vs 12 次比较，带走排序三问
  tldr: 同一组「已排序」输入下，末元素基准的快排会退化成 28 次比较，归并依然稳守 12 次；差距全在递归层数有没有拉偏——最后把全课判断收成一套三问与口诀。
  body: |-
    打开下面的实验台，先切到「已排序」预设单步跑完：用末元素当 [[pivot]] 的快排每次只挪走最右边那一个，硬生生走了长长一串层数、比了 28 次——这就是 O(n²) 退化现场；旁边的归并排序依旧对半切，稳稳只用了 12 次比较。切回「乱序」预设再跑一轮，快排 14 次反超归并的 17 次，平时它确实更快。最后试试逆序预设，快排照样退化成 28 次，因为退化只看基准是不是每次踩到极值，和升序还是降序没关系。

    线上排序接口忽然变慢时，先查两件事：输入分布是不是刚好撞上了固定基准的死角，以及业务需不需要[[稳定性]]——JS 在 [[V8]] 里的 [[TimSort]]、Python 3.11 起的 [[Powersort]] 靠归并变体保稳又保快，无稳定要求时随机选基准或[[内省排序]]能把 28 次这种长链彻底切掉。

    全课收成随手能用的排序判断三问：① 要不要[[稳定性]]（多关键字排序或保留原先后）？要就走归并系（TimSort），不要才考虑快排系；② 内存装不装得下、允不允许 O(n) 临时空间？内存紧就用快排或内省排序，连内存都装不下就上磁盘多路归并；③ 输入会不会被针对（近有序或大量重复）？防退化靠随机/三数取中加深度兜底，防重复靠三路划分。口诀记一句：「归并盲切合并稳，快排原地看基准；相等靠三路，兜底靠内省，十几个元素换插入。」
  derivation: original
  sources: []
  canvas:
    kind: lab
    lab: sort-compare
    caption: 同一输入、同步步进，对比两种排序的比较次数
