- id: lab-compare
  title: 动手实验：归并 vs 快排对比
  tldr: 同一组输入同时跑两种排序，比较次数的差距一目了然。
  body: >-
    切换「已排序」预设单步到底：快排（末元素 pivot）会做 28 次比较——每次只排好一个元素，这就是 O(n²) 退化；归并仍是 12 次。乱序下两者接近，这正是随机 pivot 的价值：让输入分布无法针对你。


    工程注记：JS 的 Array.prototype.sort 在 V8 中是 TimSort（归并变体，稳定）；Python 的 sorted 长期用 TimSort，3.11 起换成改进版
    Powersort（同为稳定的自适应归并）。多关键字排序先想稳定性，再决定写几次 sort。


    两个观察点：换成逆序预设，快排用末元素作基准同样退化，因为选到的仍是极值，与升序降序无关；对照层数，归并永远 log n
    层，快排退化时层数等于元素个数，比较差距本质是层数差距。生产代码排序慢，先怀疑输入分布与基准策略，而不是语言或机器。
  derivation: original
  sources: []
  canvas:
    kind: lab
    lab: sort-compare
    caption: 同一输入、同步步进，对比两种排序的比较次数
    params:
      preset: mixed
    cases:
    - input:
        preset: sorted
      expect:
        mergeComparisons: 12
        quickComparisons: 28
    - input:
        preset: mixed
      expect:
        mergeComparisons: 17
        quickComparisons: 14
  log:
  - mode: 实验
    event: 在实验室中对比归并与快排
level: 基础
minutes: 30
prereq: []
objectives:
- 说清归并的合并步骤与快排的分区步骤
- 解释快排最坏 O(n²) 的成因与随机 pivot 的作用
- 对比稳定性与额外空间
aiLink: 排序无处不在：向量检索的 top-k、日志按时间归并、训练数据 shuffle 前的预处理。理解分治与最坏情况，才能在系统设计里选对排序策略、避开被构造输入打爆的快排。
design:
- mechanism: 快排平均复杂度常数小且原地顺序访问、缓存友好；插入排序在小段上无递归、分支简单，常数更低；三数取中把基准拉向中位数，降低切歪概率。三种机制各管一段规模与一种风险，拼起来才覆盖全程。
  problem: 纯快排有两个软肋：小区间里分治的固定开销占比过高，慢于直接插入；基准选歪时退化到平方级，已排序输入加固定基准就能触发。生产环境不能把性能押在输入分布碰巧友好上。
  choice: 生产实现做混合：分区递归到阈值（十几个元素量级）切换插入排序，基准用三数取中或随机，再加递归深度监控，过深切堆排序兜底（如内省排序）；需要稳定时则整体换成归并系的 TimSort。
  tradeoff: 混合的代价是实现复杂度与调参成本：阈值要按硬件与元素类型实测，代码路径变多、测试面变大。换来的是平均性能、最坏保证与小规模常数三者同时在线，这笔账在标准库层面非常划算。
  root: 根源是大 O 只描述增长形状，不管常数与输入分布：渐近最优不等于每个规模上最优，也不保证每个输入上不退化。工程排序的本质是按规模与分布分段匹配机制，再逐段实测把参数钉死。
- mechanism: 归并合并时需要把结果写到另一块等大空间，才能一趟顺序读写完成合并；而合并时先取左段的相等元素这一条小规则，直接把稳定性变成合并规则的推论，不需要额外结构维持次序。
  problem: 原地合并两个有序段要反复腾挪，时间常数与实现复杂度都失控；而业务的多关键字排序又实在依赖稳定性：先按次键排、再按主键排，一次排序要能顶两次用，原地与稳定很难兼得。
  choice: 接受线性的辅助空间：数组归并开临时数组，链表归并则靠改指针做到原地，把空间账记在数据结构形态上；TimSort 还先识别已有顺串，并把临时空间控制在不超过输入的一半。
  tradeoff: 内存紧张或数据在磁盘上时，这笔空间账要重算：外部排序把临时空间换成磁盘上的顺串，堆排序则放弃稳定与额外空间换原地。没有免费的最坏保证，只有把代价记在哪本账上的区别。
  root: 根源是合并的信息流向：两个输入流要交错成一个输出流，若输出会覆盖尚未读完的输入，就必须有第三方空间承接。稳定性与线性合并共同要求这块缓冲，它不是实现偷懒，而是流向决定的。
- mechanism: 随机选基准之后，分区是否均衡只取决于随机数，与输入长什么样无关：期望复杂度是对算法自己的随机选择求期望，而不是对输入分布求平均，对手无法再通过构造输入指定最坏情况。
  problem: 确定性基准的快排存在可构造的最坏输入：只要摸清选基准的规则，就能批量生成让它退化到平方级的数组，服务器排序接口甚至会因此被拖慢——这与哈希洪水是同一种攻防结构。
  choice: 用随机基准或三数取中，前者把退化概率压到与输入无关的极低水平，后者针对常见的近有序真实数据；再叠加递归深度兜底，把残存的小概率事件也封顶到 n log n。
  tradeoff: 随机化让性能不可完全复现：同一输入两次运行耗时可以不同，基准测试要多次运行取统计量；三数取中则对刻意构造的陷阱输入仍有残余风险，单靠它不能替代深度兜底。
  root: 根源在博弈关系：当算法与输入互为对手时，任何确定性策略都必有被针对的死角；引入私有随机性，等于让对手在不知道策略的情况下先出牌，最坏情况从必然事件降级为小概率事件。
quiz:
- q: 快排在已排序数组 + 固定末元素 pivot 时的复杂度？
  options:
  - O(n log n)
  - O(n²)
  - O(n)
  - O(log n)
  answer: 1
  explain: 每次分区只去掉一个元素，递归深度 n，比较约 n²/2——sort-compare 实验里就是 28 次。
- q: 归并排序的额外空间是？
  options:
  - O(1)
  - O(n)
  - O(log n)
  - O(n²)
  answer: 1
  explain: 合并需要与输入等长的临时数组（这是它换稳定与最坏保证的代价）。
- q: 稳定性指什么？
  options:
  - 速度稳定
  - 相等元素的相对次序在排序后保持不变
  - 内存稳定
  - 不崩溃
  answer: 1
  explain: 多关键字排序靠稳定性叠加：先按次关键字排、再按主关键字稳定排序。
