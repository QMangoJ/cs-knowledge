    event: 按需求选择排序算法
- id: lab-compare
  title: 动手实验：归并 vs 快排对比
  tldr: 同一组输入同时跑两种排序，比较次数的差距一目了然。
  body: '切换「已排序」预设再单步到底：快排（末元素 pivot）会做出 28 次比较——每次只排好一个元素，这就是 O(n²) 退化；归并仍是 12 次。乱序输入下两者接近，这正是随机 pivot 的价值：让输入分布无法针对你。


    工程注记：JS 的 Array.prototype.sort 在 V8 中是 TimSort（归并变体，稳定）；Python 的 sorted 同样。业务里多关键字排序先想稳定性，再决定写几次 sort。'
  derivation: original
  sources: []
  canvas:
    kind: lab
    lab: sort-compare
    caption: 同一输入、同步步进，对比两种排序的比较次数
    params:
      preset: mixed
    cases:
    - input:
        preset: sorted
      expect:
        mergeComparisons: 12
        quickComparisons: 28
    - input:
        preset: mixed
      expect:
        mergeComparisons: 17
        quickComparisons: 14
  log:
  - mode: 实验
    event: 在实验室中对比归并与快排
level: 基础
minutes: 18
prereq: []
objectives:
- 说清归并的合并步骤与快排的分区步骤
- 解释快排最坏 O(n²) 的成因与随机 pivot 的作用
- 对比稳定性与额外空间
aiLink: 排序无处不在：向量检索的 top-k、日志按时间归并、训练数据 shuffle 前的预处理。理解分治与最坏情况，才能在系统设计里选对排序策略、避开被构造输入打爆的快排。
quiz:
- q: 快排在已排序数组 + 固定末元素 pivot 时的复杂度？
  options:
  - O(n log n)
  - O(n²)
  - O(n)
  - O(log n)
  answer: 1
  explain: 每次分区只去掉一个元素，递归深度 n，比较约 n²/2——sort-compare 实验里就是 28 次。
- q: 归并排序的额外空间是？
  options:
  - O(1)
  - O(n)
  - O(log n)
  - O(n²)
  answer: 1
  explain: 合并需要与输入等长的临时数组（这是它换稳定与最坏保证的代价）。
- q: 稳定性指什么？
  options:
  - 速度稳定
  - 相等元素的相对次序在排序后保持不变
  - 内存稳定
  - 不崩溃
  answer: 1
  explain: 多关键字排序靠稳定性叠加：先按次关键字排、再按主关键字稳定排序。
