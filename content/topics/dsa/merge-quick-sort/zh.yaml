- id: lower-bound
  title: 比较排序的理论天花板：谁也绕不过 O(n log n)
  tldr: 只要靠两两比大小来排，最坏至少要约 n log n 次比较，这是无法突破的理论下限；只有不靠比较、直接吃数值范围红利的计数与基数排序，才能在特定限制下逼近线性。
  body: |-
    3 个不同字母 a、b、c 一共有 3! = 6 种排列。每比一次大小最多把可能的结果对半砍，想把 6 种全区分出来，至少得比 ⌈log₂6⌉ = 3 次。一般地，n 个元素有 n! 种排列，至少需要约 log₂(n!) ≈ n log n 次比较——这叫比较排序的信息下限，归并、快排、堆排都已经撞到天花板了。

    想绕过这条线，唯一的办法是不做两两比较，改用数值本身的信息。比如画布右下角的 [3, 1, 2, 1, 0] 全是 0 到 3 的小整数，[[计数排序]]直接开 4 个桶数出每个数字出现几次再按顺序倒出来，耗时 O(n + k)（k 是值域大小）；[[基数排序]]则按位从低到高分桶，耗时 O(d·(n + b))。只要值域 k 或位数 d 很小，就能跑出近似线性的速度，但它们挑数据类型，通用对象或浮点大范围比较用不了。

    再记一组量级对比：n = 100 万时，n log n 约 2000 万次比较，而退化的 n² 是 1 万亿次——差了 5 万倍。如果服务暴露了排序接口，固定选末元素当基准的快排只要被人构造一组有序请求就会从毫秒卡到分钟；生产里必须用随机化 [[pivot]] 或[[内省排序]]把最坏情况彻底封死。
  derivation: original
  sources:
  - ref: mit-6006
    locator: 排序相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
