- id: hybrid-insertion
  title: 混合策略：小段为什么换插入排序
  tldr: 渐近复杂度不看常数：小段里分治的固定开销占大头，插入排序反而更快。
  body: '教科书算法有个共同盲区：渐近复杂度不看常数。插入排序是平方级，但它代码短、无递归、顺序访问，对几个到几十个元素的小段，实际耗时常常比归并、快排继续分治还低——分治每切一刀都要付函数调用与边界判断的固定成本，小段里这笔固定成本占了大头。

    所以生产实现全是混合体：快排递归到小区间（常见阈值在十几个元素量级）就停手，改用插入排序收尾；TimSort 则在识别出的有序顺串太短时，用插入排序把它补到最小长度。感受一下量级：8 个元素的段，插入排序最坏比较 28 次且全是顺序访问；快排继续分区则要多层递归调用，实测往往前者更快。

    阈值没有理论最优，只有实测最优：它随语言、硬件、元素类型而变，标准库作者用基准测试把阈值钉在具体数字上。这给我们的启示是，算法选型的最后一公里是常数与场景：大 O 负责划圈，圈内谁赢要靠测，而不是靠背。'
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 7 快速排序的改进
