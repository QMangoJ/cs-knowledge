- id: quick
  title: 快排的「先分区」：选基准一次落位，省下临时数组但怕选歪
  tldr: 快排和归并反着干：先挑一个基准（[[pivot]]）在原数组里把小的放左边、大的放右边，让基准一次站到最终位置，再分别递归两头——省下临时数组，代价是基准选歪了会退化成平方级。
  body: |-
    还是 [5, 2, 8, 1, 9, 3]，这次挑首元素 5 当基准做一趟分区：2 比 5 小留在左边，8 比 5 大挪去右边，1 留左，9 去右，3 留左。一趟分完，数组变成左段 [2, 1, 3]、基准 5、右段 [8, 9]。注意 5 已经稳稳站在它排序后的最终位置上，左边全比它小、右边全比它大，之后两边各排各的，再也不用像归并那样合回来。

    因为全程在原数组内部交换，不需要归并那块 O(n) 的临时空间，而且连续扫数组对 CPU 缓存极友好，所以快排平均跑得比归并还快。但这个漂亮效率吃的是「基准尽量居中」的运气：如果输入本来就有序，而你每次固定挑头一个或最后一个当基准，每次分区就会把最小或最大值切到一头，另一边几乎没变小，递归拉成 n 层，耗时从 O(n log n) 掉回 O(n²)。

    所以写快排绝不能裸着固定挑端点当基准：要么随机抽一个元素当基准，让任何刻意构造的顺序都算不准你；要么用「三数取中」（从首、中、尾三个数里挑中间大小那个），让切分尽量靠近一半。
