steps:
- id: why
  title: 为什么需要更快的排序
  tldr: 两两比较交换的简单排序是 O(n²)，数据一多就慢得不能用。
  body: |-
    冒泡排序对 1 万个元素要做约 5000 万次比较（n 乘 n 减 1 再除以 2），对 100 万个就是约 5000 亿次；数据翻倍耗时翻四倍——平方级的脾气是规模一大，再快的常数也救不回来。

    分而治之换一条路：大数组拆成小数组分别排好再组合，拆的层数只有 log n 层，每层处理全部元素，总量 n log n。1 万个元素只需十几万次比较量级，与冒泡相差约 300 倍；涨到 100 万时差距拉大到上万倍。

    本课两种分法方向相反：归并先拆到最小、合并时才做工；快排先做工（分区）把基准放对位置、再拆。这一对镜像是理解稳定性、空间与最坏情况全部差异的钥匙。
  derivation: original
  sources:
  - ref: mit-6006
    locator: 排序相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
