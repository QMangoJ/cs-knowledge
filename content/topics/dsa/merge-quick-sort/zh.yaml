- id: engineering
  title: 工程里怎么选
  tldr: 需要稳定选归并类，追求原地和速度选快排类；标准库已经帮你选好了。
  body: >-
    需要稳定选归并类，追求原地与速度选快排类，标准库已替你选好：V8 自 7.0 版（2018 年）起 Array.prototype.sort 用
    TimSort（稳定的归并变体，先识别已有的有序段再合并，对部分有序的真实数据特别快）；Python 的 sorted 同出此门。


    稳定性走例：一份名单先按姓名排好，再按分数排，若稳定，同分的人仍保持姓名顺序，一次排序顶两次用；若不稳定，就得把两个键拼成复合键重排。多关键字排序是稳定性最常见的兑现场景。


    C++ 的 std::sort 用内省排序：快排为主，监控递归深度，过深切换堆排序兜底最坏 n log n，小区间切插入排序。三种实现没有一种是纯粹的教科书算法，全是按数据特征拼装的混合体——这正是后面混合策略要拆的工程常态。
  derivation: original
  sources:
  - ref: mit-6006
    locator: 排序相关讲义
