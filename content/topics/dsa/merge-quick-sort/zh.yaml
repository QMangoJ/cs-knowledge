- id: merge-join
  title: 归并排序：两两合并
  tldr: 把两份有序的小数组合并成一份有序的大数组，一层层合回去。
  body: >-
    合并两个有序段：两边各放一个指针指向段首，谁小取谁并前进一格。走最后的大合并：左段 2、5、8 与右段 1、3、9，先比 2 与 1 取 1，再比 2 与 3 取 2，再比 5 与 3 取 3，再取 5、8，最后右段剩 9
    接上，得到 1、2、3、5、8、9，全程比较 5 次。


    每层合并把每个元素恰好搬一次，所以每层线性，层数 log n，总量 n log n，且与输入无关。这是归并最坏情况有保证的原因：层数与每层工作量都不受输入分布影响。


    相等元素先取左边的，先后就不变，这叫稳定：左段的 5 与右段的 5 相等时先取左段，左段代表先到的数据，次序就保住了。代价是合并需要一块与原数组等大的辅助空间。
  derivation: original
