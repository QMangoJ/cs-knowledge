- id: hybrid-insertion
  title: 混合策略：小到十几个元素时，插入排序反而跑赢分治
  tldr: 大 O 只看增长趋势不管常数开销：当子数组切到只剩十几个元素时，分治每次切分都要付函数调用和边界判断的开销，反而不如直接跑顺序访问的插入排序来得快。
  body: |-
    大 O 记号故意忽略常数，可真实 CPU 运行时常数决定胜负。分治算法每往下切一刀，都要走一次函数压栈、算中点、判断边界；数据有上万个时这笔固定税微不足道，可切到只剩七八个元素的小段时，函数调用开销反而比比较元素本身还贵。

    拿一段 8 个元素的数组 [5, 2, 8, 1, 9, 3, 7, 4] 算一笔具体账：换成插入排序，最坏也就 8 × 7 / 2 = 28 次比较，没有一句递归调用，所有访问紧贴着连续内存往前走，CPU 缓存行和分支预测吃得舒舒服服；如果硬让快排继续往下切 3 层递归，实际耗时往往反而不如前者。因此无论快排还是 [[TimSort]]，到十几到几十个元素这个区间时都会直接切给插入排序收尾（TimSort 在自然[[顺串]]太短时也会用插入排序先补长）。

    这个切换阈值没有数学公式能算死，随语言虚拟机、CPU 缓存和元素比较代价而变，工程上全靠基准测试跑出来。记住一句话：大 O 帮你划出数量级圈子，圈子里面谁快，拿真实数据跑一遍才知道。
  derivation: original
  sources:
