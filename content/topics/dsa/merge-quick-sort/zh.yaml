steps:
- id: why
  title: 为什么需要更快的排序
  tldr: 两两比较交换的简单排序是 O(n²)，数据一多就慢得不能用。
  body: '冒泡排序对 1 万个元素要做约 5000 万次比较（n 乘 n 减 1 再除以 2），对 100 万个元素就是约 5000 亿次；数据翻倍，耗时翻四倍，这就是平方级增长的脾气：规模一大，再快的常数也救不回来。

    分而治之换一条路：把大数组拆成小数组分别排好，再组合起来。拆的层数只有 log n 层，每层把全部元素处理一遍，总量就是 n log n 量级。1 万个元素只需十几万次比较量级，与冒泡相差约 300 倍；数据涨到 100 万时，差距拉大到上万倍。

    本课两种分法方向相反：归并是先拆到最小、合并时才真正做工；快排是先做工（分区）把基准放对位置、再拆。理解这一对镜像，是理解稳定性、空间与最坏情况全部差异的钥匙，后面每一节都在还这笔账。'
  derivation: original
  sources:
  - ref: mit-6006
    locator: 排序相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: 归并排序为 O(n log n)，优于 O(n²) 的简单排序
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
