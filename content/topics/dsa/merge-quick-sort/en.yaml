- id: merge-join
  title: "Merge sort: merging pairs back together"
  tldr: "Once everything is split down to single elements, the order has to be delivered by merging. This step shows how two sorted runs combine into one with two pointers — take whichever is smaller, and on a tie take the left one first. Walk the final big merge in full, then do the per-level work accounting."
  body: >-
    Merging two sorted runs: put a pointer at the head of each run; take whichever is smaller and advance that pointer by one cell. Walk the final big merge: left run 2, 5, 8 and right run 1, 3, 9. First compare 2 and 1 and take 1; then compare 2 and 3 and take 2; then compare 5 and 3 and take 3; then take 5 and 8; finally the right run's remaining 9 attaches at the end — giving 1, 2, 3, 5, 8, 9, with 5 comparisons in total.


    Each level of merging moves every element exactly once, so each level is linear; with log n levels the total is n log n, and it has nothing to do with the input. That is why merge sort's worst case is guaranteed: neither the number of levels nor the work per level depends on the input distribution.


    When elements are equal, take the left run's first, and their relative order never changes — that is stability: when the left run's 5 and the right run's 5 are equal, take the left run's first; the left run represents data that arrived earlier, so the order is preserved. The price is that merging needs an auxiliary space as large as the original array.
  derivation: original
