subject: dsa
slug: merge-quick-sort
order: 3
status: published
license: CC-BY-4.0
title: "Merge Sort and Quicksort: Divide and Conquer"
summary: The two most widely used O(n log n) sorts — both break a big problem into small ones, but they split differently, and that gives them different characters.
premise: To sort a sequence of numbers from smallest to largest, the naive pairwise compare-and-swap becomes unusably slow once the data grows. This lesson looks at how two sorting methods that break a big problem into small ones bring the speed up, using the same sequence [5, 2, 8, 1, 9, 3] as the running example — walking through merge sort's split-then-merge and quicksort's partition-around-a-pivot once each.
position: This lesson opens the "Divide and Conquer" section. It follows binary search's halving intuition — rule out half the candidates in each round — and upgrades halving from a lookup action into a recursive structure that takes the whole sorting problem apart. After this lesson you will be able to explain why quicksort degenerates to O(n²) when the [[pivot]] is chosen badly, and how merge sort buys
  [[stability|稳定性]] with the single rule of taking the left run's element first when elements are equal.
bridge:
  prev: The previous lesson used a sortedness precondition to cut half the candidates in a single round; this lesson moves the same halving onto sorting — merge sort splits in half, quicksort partitions around a pivot and then recurses on both sides.
  next: "Sorting pays n log n to produce a complete total order. The next lesson, the binary heap, asks: if you only care about the single most urgent item, can a structure that maintains only a parent–child partial order push the cost lower?"
overview:
- key: In one sentence
  value: "Merge sort splits first and merges after — stable, and always O(n log n). Quicksort partitions first and recurses after — fastest on average, but O(n²) in the worst case. The whole difference lies in how they split: merge sort splits by position, in half; quicksort splits by value — so one performs steadily, and the other's performance depends on how well the pivot is chosen."
- key: Stability
  value: "[[Stability|稳定性]] means equal elements keep their original relative order after sorting; merge sort is stable, quicksort usually is not. For example, sort by grade first and then by name, and with an unstable sort the grade order established in the first pass gets scrambled in the second."
- key: Extra space
  value: Merge sort needs O(n) auxiliary space; quicksort needs only the recursion stack. When merge sort merges two runs it needs a temporary array of the same size to receive the result; quicksort partitions by swapping elements inside the original array and pays only the stack space of the recursive calls themselves.
- key: In practice
  value: "Since version 7.0 (2018), [[V8]]'s Array.prototype.sort has used [[TimSort]], a stable merge-sort variant. In other words, the sort you call casually in JS runs on the merge-sort route underneath, with extra optimizations for the locally sorted stretches that are common in real data."
- key: Why not bubble sort
  value: Bubble sort and insertion sort are O(n²), and far slower once the data grows. Ten times the elements means roughly a hundred times the running time for them, while an O(n log n) sort grows only by a factor of a dozen or so — once the scale is large, the gap is dramatic.
- key: Complexity
  value: Merge sort is O(n log n) in the best, average, and worst cases; quicksort is O(n log n) on average and O(n²) in the worst case. Quicksort's worst case appears when the pivot is the maximum or minimum every time — one side of the partition is empty, and the recursion degenerates into peeling off one element per level.
- key: In-place
  value: Quicksort is [[in-place|原地]], using only the recursion stack; merge sort on arrays needs O(n) extra space. Whether a sort is in-place is a real difference when the data is huge and memory is tight — one reason many standard libraries lean toward the quicksort route by default.
- key: The lower bound
  value: Comparison sorts need at least about n log n comparisons in the worst case; [[counting sort|计数排序]] and [[radix sort|基数排序]] do not rely on comparisons, and their complexity carries a value-range or digit-count term instead. In other words, no method that sorts by comparing pairs can be arbitrarily fast — breaking this line requires exploiting properties of the values themselves, such as a bounded range.
- key: Small arrays
  value: Standard libraries often switch to insertion sort on small intervals. With only a dozen or so elements, divide and conquer's splitting and recursion overhead dominates instead; insertion sort has worse asymptotic complexity, but a small constant, and actually runs faster.
