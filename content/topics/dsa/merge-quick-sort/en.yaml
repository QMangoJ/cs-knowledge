- id: quick
  title: "Quicksort: pick a pivot, split in two"
  tldr: "Merge sort splits first and works later; quicksort is exactly the reverse — work first, split later. This step runs one partition with 5 as the pivot and watches the pivot land in its final position in a single pass, with the left and right runs never interfering again; finally it names this splitting method's soft spot — what happens when the pivot is chosen badly."
  body: |-
    Pick 5 as the pivot and run one partition: 2 is less than 5 and stays left, 8 is greater than 5 and goes right, 1 stays left, 9 goes right, 3 stays left — the result is a left run 2, 1, 3, the pivot 5, and a right run 8, 9. After one pass the pivot 5 already stands in its final position, everything on the left is smaller than it and everything on the right is larger, and the two sides recurse independently, never interfering with each other.

    It swaps [[in-place|原地]], needs no large auxiliary space, and its sequential access is cache-friendly; the constant in its average n log n is smaller than merge sort's. But the guarantee is probabilistic: if the smallest or largest element is picked as the pivot every time (for instance, always picking the first element of an already-sorted array), each pass rules out only one element, the number of levels becomes n, and it degenerates to quadratic.

    So the pivot cannot run naked: picking it at random means the input cannot target you, and median-of-three pulls the pivot toward the median. The same quicksort flies on shuffled input and crawls like a snail on sorted input — this input sensitivity is the first thing to ask about when choosing it.
  derivation: original
  sources:
  - ref: mit-6006
    locator: Quicksort lectures
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: Quicksort is O(n log n) on average and O(n²) in the worst case; a randomized pivot avoids the worst case
    status: verified
    checkedBy: Checked by Muse
    checkedAt: 2026-11-07
    note: Verified against the primary source on 2026-11-07; see docs/curriculum-audit.md
