- id: external-sort
  title: "A peek ahead: when memory cannot hold it, [[external sort|外部排序]] takes over"
  tldr: "However well you sort in memory, data too large to fit in memory is a different story. This step shows how merge sort carries on onto disk: first sort block by block into sorted [[runs|顺串]], then merge many ways into longer and longer ones. Run the read/write accounting on 100 GB of logs with 10 GB of memory."
  body: |-
    First, a term: a run is a block of data that has already been sorted and written to disk — the product of block-wise sorting. The multiway merge below merges exactly these runs.

    When data outgrows memory, merge sort can still carry on — that is external sorting: cut the large file into blocks that fit in memory, sort each block and write it back to disk, producing a batch of sorted runs; then merge many ways, the way sorted runs are merged, pass after pass growing longer, until a single complete sorted file remains.

    A small accounting: 100 GB of logs, 10 GB of usable memory. First cut into 10 blocks, sort each, and get 10 runs; then do one round of 10-way merging — overall, read twice and write twice. During the merge stage each run needs only a small buffer, read sequentially, keeping random access to a minimum.

    Databases and big-data systems still use it today: bulk sorting, index building, distributed shuffling — the skeleton is always block sorting plus multiway merging. Two-way merging is just the special case where the number of ways is 2; generalize the two pointers to many pointers (with a heap picking the minimum) and you have the full multiway merge.
  derivation: original
  sources:
  - ref: mit-6006
    locator: Merge sort lectures
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: Merge sort's merging step generalizes to multiway merging, the basic skeleton of external sorting
    status: verified
