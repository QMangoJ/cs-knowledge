- id: lab-compare
  title: "Hands-on: merge sort vs. quicksort"
  tldr: "The rules are covered — now run the controlled experiment yourself: run merge sort and quicksort on the same input at the same time. First use sorted input to watch quicksort degenerate while merge sort holds steady, then switch to reverse-sorted input and verify that the degeneration depends only on the pivot hitting an extreme value, not on ascending versus descending order."
  body: >-
    Switch to the 'sorted' preset and single-step to the end: quicksort (with the last element as [[pivot]]) makes 28 comparisons — each pass puts only one element in place; that is the O(n²) degeneration. Merge sort still makes 12. On shuffled input the two are close — which is exactly the value of a random pivot: the input distribution cannot target you.


    An engineering note: in [[V8]], JavaScript's Array.prototype.sort is [[TimSort]] (a merge-sort variant, stable); Python's sorted used TimSort for a long time and switched in 3.11 to an improved
    [[Powersort]] (also a stable, adaptive merge sort). For multi-key sorting, think about [[stability|稳定性]] first, then decide how many sort calls to write.


    Two observation points: switch to the reverse-sorted preset and quicksort with the last element as pivot degenerates the same way, because what it picks is still an extreme value — unrelated to ascending versus descending. Compare the level counts: merge sort always has log n
    levels; a degenerate quicksort has as many levels as there are elements. The comparison gap is, at root, a level-count gap. When production sorting runs slow, suspect the input distribution and the pivot strategy first — not the language or the machine.
  derivation: original
  sources: []
  canvas:
    kind: lab
    lab: sort-compare
    caption: Same input, stepped in sync — compare the two sorts' comparison counts
    params:
      preset: mixed
    cases:
    - input:
        preset: sorted
      expect:
        mergeComparisons: 12
        quickComparisons: 28
    - input:
        preset: mixed
      expect:
        mergeComparisons: 17
        quickComparisons: 14
  log:
  - mode: Experiment
    event: "The controlled experiment is done: on the same input, the gap between the two sorts' comparison counts is, at root, a gap in recursion levels."
level: 基础
minutes: 30
prereq: []
objectives:
- Explain merge sort's merging step and quicksort's partitioning step
- Explain why quicksort's worst case is O(n²) and what a random pivot does
- Compare stability and extra space
aiLink: Sorting is everywhere — top-k in vector retrieval, merging logs by time, preprocessing before shuffling training data. Understand divide and conquer and worst cases, and you can pick the right sorting strategy in system design and avoid a quicksort that a crafted input blows up.
design:
- mechanism: Quicksort's average-case constant is small, it accesses memory in place and sequentially, and it is cache-friendly; insertion sort on small runs has no recursion and simple branches, with an even lower constant; median-of-three pulls the pivot toward the median, lowering the chance of a lopsided cut. The three mechanisms each cover one range of sizes and one kind of risk; only assembled do they cover the whole course.
  problem: Pure quicksort has two soft spots — in small intervals, divide and conquer's fixed overhead takes too large a share and loses to direct insertion; and when the pivot is chosen badly it degenerates to quadratic, which sorted input plus a fixed pivot is enough to trigger. Production environments cannot stake performance on the input distribution happening to be friendly.
  choice: Production implementations hybridize — partition recursion switches to insertion sort at a threshold (on the order of a dozen elements), the pivot uses median-of-three or randomization, and the recursion depth is monitored, switching to heapsort past a depth limit as a backstop (as in introsort); when stability is required, the whole thing is replaced by the merge family, TimSort.
  tradeoff: The price of hybridizing is implementation complexity and tuning cost — the threshold must be measured against the hardware and the element type, the code paths multiply, and the test surface grows. In exchange, average performance, worst-case guarantees, and small-scale constants are all online at once — a bill that pays off handsomely at the standard-library level.
  root: The root is that Big O describes only the shape of growth, not constants or input distributions — asymptotically optimal does not mean optimal at every size, nor does it guarantee no degeneration on every input. Engineering sorting is, at heart, matching mechanisms to segments by size and distribution, then pinning the parameters down segment by segment with measurements.
- mechanism: Merging needs its result written into another, equally large space so the merge can complete in one pass of sequential reads and writes; and the small rule of taking the left run's element first when elements are equal turns stability directly into a corollary of the merge rule, with no extra structure needed to maintain the order.
  problem: Merging two sorted runs in place means shuffling elements back and forth repeatedly, and both the time constant and the implementation complexity get out of control; meanwhile, business multi-key sorting genuinely depends on stability — sort by the secondary key first, then by the primary key, and one sort has to do the work of two. In-place and stable are hard to have at once.
  choice: Accept linear auxiliary space — array merge sort allocates a temporary array, while merge sort on linked lists rewires pointers to achieve in-place, booking the space bill to the shape of the data structure; TimSort also recognizes existing runs first, and keeps its temporary space to at most half the input.
  tradeoff: When memory is tight or the data lives on disk, this space bill has to be recomputed — external sorting trades the temporary space for runs on disk, while heapsort gives up stability and extra space for in-place. There is no free worst-case guarantee, only a choice of which ledger the cost is booked in.
  root: The root is the direction of information flow in a merge — two input streams must interleave into one output stream, and if the output would overwrite input that has not been read yet, a third space must receive it. Stability and linear merging jointly require this buffer; it is not implementer laziness, but decided by the flow.
- mechanism: After the pivot is chosen at random, whether a partition is balanced depends only on the random numbers, not on what the input looks like — the expected complexity is an expectation over the algorithm's own random choices, not an average over input distributions, so an opponent can no longer designate the worst case by crafting the input.
  problem: Deterministic-pivot quicksort has craftable worst-case inputs — work out the pivot rule and you can mass-produce arrays that degenerate it to quadratic; a server's sorting endpoint can even be slowed down this way. This is the same attack-and-defense structure as hash flooding.
  choice: Use a random pivot or median-of-three — the former presses the degeneration probability down to an extremely low level that has nothing to do with the input, the latter targets the near-sorted real data that is common in practice; then add a recursion-depth backstop, capping even the residual low-probability events at n log n.
  tradeoff: Randomization makes performance not fully reproducible — the same input can take different times on two runs, and benchmarks must run repeatedly and take statistics; median-of-three still carries residual risk against deliberately crafted trap inputs, and on its own cannot replace the depth backstop.
  root: The root lies in the adversarial relationship — when the algorithm and the input are opponents, any deterministic strategy necessarily has a dead angle that can be targeted; introducing private randomness is equivalent to making the opponent play first without knowing your strategy, demoting the worst case from a certainty to a low-probability event.
quiz:
- q: What is quicksort's complexity on a sorted array with a fixed last-element pivot?
  options:
  - O(n log n)
  - O(n²)
  - O(n)
  - O(log n)
  answer: 1
  explain: Each partition removes only one element; the recursion depth is n and the comparisons are about n²/2 — in the sort-compare lab, that is the 28 comparisons.
- q: What is merge sort's extra space?
  options:
  - O(1)
  - O(n)
  - O(log n)
  - O(n²)
  answer: 1
  explain: Merging needs a temporary array as long as the input (that is the price it pays for stability and its worst-case guarantee).
- q: What does stability mean?
  options:
  - Stable speed
  - Equal elements keep their relative order after sorting
  - Stable memory
  - It does not crash
  answer: 1
  explain: Multi-key sorting stacks on stability — sort by the secondary key first, then stably sort by the primary key.
