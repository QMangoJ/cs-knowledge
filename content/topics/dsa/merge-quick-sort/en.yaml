steps:
- id: why
  title: Why do we need faster sorting?
  tldr: "Do the math on the opponent first: simple compare-and-swap sorts need about 50 million comparisons for 10,000 elements. This step runs the quadratic bill up to a million elements, then looks at what road divide and conquer takes instead — split into small pieces, sort each one, and combine them."
  body: |-
    Bubble sort needs about 50 million comparisons for 10,000 elements (n times n minus 1, divided by 2), and about 500 billion for a million elements; double the data and the time quadruples — that is the quadratic temperament: once the scale grows, no constant factor, however fast, can save it.

    Divide and conquer takes another road: split the big array into small arrays, sort each, and combine. There are only log n levels of splitting, and each level processes every element, for a total of n log n. Ten thousand elements need only on the order of a hundred-odd thousand comparisons — roughly 300 times fewer than bubble sort; at a million elements, the gap widens to over ten thousand times.

    This lesson's two splitting directions are mirror images: merge sort splits down to the smallest pieces first and does its work while merging; quicksort does its work first (partitioning), putting the pivot in its right place, and splits afterward. This pair of mirrors is the key to all the differences that follow — [[stability|稳定性]], space, and worst cases.
  derivation: original
  sources:
