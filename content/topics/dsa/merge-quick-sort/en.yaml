    event: "The external-sort bill is settled: merging traveled from memory to disk, with sequential reads and writes throughout — two reads and two writes in total."
- id: engineering
  title: How to choose in practice
  tldr: "Finally, the selection wrap-up: need stability, choose the merge family; want [[in-place|原地]] and speed, choose the quicksort family. This step looks at what two standard libraries actually use — neither is a pure textbook algorithm; both are hybrids assembled around the characteristics of the data."
  body: >-
    Need stability, choose the merge family; want in-place and speed, choose the quicksort family — the standard libraries have already chosen for you: since version 7.0 (2018), [[V8]]'s Array.prototype.sort uses
    [[TimSort]] (a stable merge-sort variant that first recognizes existing sorted runs and then merges them — especially fast on the partially sorted real data that is common in practice); Python's sorted comes from the same school.


    A [[stability|稳定性]] worked example: a roster is first sorted by name, then by score. If the sort is stable, people with the same score still keep their name order — one sort does the work of two; if it is unstable, you have to combine the two keys into a composite key and sort again. Multi-key sorting is stability's most common payoff scene.


    C++'s [[std::sort]] uses [[introsort|内省排序]]: quicksort as the main engine, with the recursion depth monitored; go too deep and it switches to heapsort to backstop the worst case at n log n, and small intervals switch to insertion sort. None of the three implementations is a pure textbook algorithm — all are hybrids assembled around the characteristics of the data, which is exactly the engineering norm that the hybrid strategy below takes apart.
  derivation: original
  sources:
  - ref: mit-6006
    locator: Sorting lectures
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: Sorting algorithms make different trade-offs in stability, space, and worst cases
    status: verified
    checkedBy: Checked by Muse
    checkedAt: 2026-11-07
    note: Verified against the primary source on 2026-11-07; see docs/curriculum-audit.md
  canvas:
