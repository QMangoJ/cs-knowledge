  log:
  - mode: Wrap-up
    event: "The selection conclusion boils down to one line: first ask whether you need stability and whether you can afford auxiliary space, then decide between the merge family and the quicksort family."
- id: hybrid-insertion
  title: "Hybrid strategy: why small runs switch to insertion sort"
  tldr: "The last step said standard libraries are all hybrids; this step takes apart the most common hybrid joint: when recursion reaches a small run of a dozen or so elements, why does switching to quadratic insertion sort end up faster? This bill has to be settled on constants, not on orders of growth."
  body: >-
    Asymptotic complexity ignores constants — the shared blind spot of textbook algorithms. Insertion sort is quadratic, but its code is short, it has no recursion, and it accesses memory sequentially; on small runs of a few to a few dozen elements, its actual running time is often lower than continuing to divide — every cut of divide and conquer pays the fixed cost of a function call and boundary checks, and in a small run that cost is the bulk of the bill.


    So production implementations are all hybrids: quicksort recurses down to a small interval (a common threshold is on the order of a dozen elements) and switches to insertion sort to finish; [[TimSort]] uses insertion sort to pad a [[run|顺串]] that is too short up to a minimum length. A feel for the magnitudes: on a run of 8 elements, insertion sort compares at most 28
    times, all sequential access; quicksort continuing to partition takes several more levels of recursion — in practice, the former is often faster.


    There is no theoretical optimum for the threshold, only a measured one; it varies with language, hardware, and element type. Big O draws the circle; who wins inside the circle is decided by measurement, not by memorization.
  derivation: original
  sources:
  - ref: clrs
    locator: "Chapter 7, improvements to quicksort"
    claim: Switching to insertion sort for small subarrays in quicksort is a standard optimization given by CLRS
    status: verified
