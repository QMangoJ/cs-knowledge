  code:
    lang: typescript
    code: |-
      // Quicksort core: partitioning puts the pivot in its final position; then recurse left and right
      function quickSort(a: number[], lo = 0, hi = a.length - 1): void {
        if (lo >= hi) return;
        const pv = a[hi]!; let i = lo;
        for (let j = lo; j < hi; j++) if (a[j]! < pv) { [a[i], a[j]] = [a[j]!, a[i]!]; i++; }
        [a[i], a[hi]] = [a[hi]!, a[i]!];
        quickSort(a, lo, i - 1); quickSort(a, i + 1, hi);
      }
      // Merge sort essentials: split down to single elements, then merge two sorted runs level by level; needs an O(n) temporary array
    note: TypeScript implementation
- id: quick-detail
  title: "Quicksort details: partitioning, pivots, and recursion depth"
  tldr: "The last step's partition was only a sketch; in a real implementation, partitioning is a single [[in-place|原地]] scan. This step walks that scan cell by cell on an array with pivot 3, then handles two follow-up problems: why two-way partitioning wastes work when there are too many duplicates, and how to press the recursion depth back down to logarithmic."
  body: >-
    Partitioning is a single scan: take the last element as the pivot, maintain the boundary of the small-elements region, and whenever an element smaller than the pivot shows up, swap it into that region and grow the region by one cell; at the end, swap the pivot onto the boundary. Take 5, 2, 8, 1, 9, 3 with pivot 3: 5 is not less than 3, skip; 2 is less than 3, swap it to the very front; 8, skip; 1 is less than 3, swap it in right behind the
    2; 9, skip; finally swap 3 to index 2 — giving 2, 1, 3, 5, 9, 8, with the pivot in place.


    With a randomly chosen pivot the worst case can still occur, but with extremely low probability, and the expectation is n log n; with many duplicate elements, two-way partitioning keeps dragging elements equal to the pivot back into the recursion, while three-way partitioning puts the equals in the middle as their own segment, so after one pass the whole run of equal elements is in place — the more duplicates there are, the more it saves (the next section walks through three-way).


    Recursion depth needs managing too: recurse into the shorter side first and continue on the longer side with a loop, and the stack depth can be kept on the order of log n; recursing into both sides without care lets the worst-case depth reach n and can blow the call stack. The canvas shows three-way partitioning handling three 3s.
  derivation: original
  sources:
