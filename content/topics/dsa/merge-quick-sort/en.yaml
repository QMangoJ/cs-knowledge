- id: inversions
  title: "A free extra: merge sort counts [[inversions|逆序对]]"
  tldr: "The merge action can do one more job on the side: count how many inversions the array contains. This step first pins down the example's 7 pairs one by one, then shows why the moment a right-run element is taken during a merge lets you count the new inversions exactly, all at once."
  body: >-
    While merging, merge sort can count inversions on the side. An inversion is a pair where the earlier index holds the larger value — a measure of how far the array is from being sorted. The inversions of 5, 2, 8, 1, 9, 3: 5 is greater than the later 2, 1, and 3; 2 is greater than 1; 8 is greater than 1 and 3; 9 is greater than 3 — 7
    pairs in total. Enumerating pair by pair is quadratic; once the data is large, you cannot finish counting.


    The merge method counts during the merge: when an element from the right run is taken, however many elements remain untaken in the left run, that is how many new inversions it forms with left-run elements. The final big merge: left run 2, 5, 8 and right run 1, 3, 9. When the right run's 1 is taken, 3 elements remain in the left run — record 3 pairs; when 3 is taken, 2 remain in the left run (5 and 8) — record
    2 pairs; when 9 is taken, the left run is already empty — record 0 pairs. Add the 2 pairs counted earlier inside the small runs, and the total is 7 pairs, matching the enumeration.


    The complexity is still n log n; counting only adds a number. Inversions can be used to compare how two rankings differ, or to compute the minimum number of adjacent swaps needed to turn one list into another. Count with a 64-bit integer: the number of inversions is at most about half of n squared, which does not fit in 32 bits.
  derivation: original
