- id: merge-split
  title: "Merge sort: keep splitting in half"
  tldr: "Divide and conquer, the merge-sort branch first: its first step compares nothing at all — it just splits by position, in half. This step follows the example array down until each piece holds a single element, and shows why the number of splitting levels is exactly logarithmic."
  body: |-
    5, 2, 8, 1, 9, 3 first splits into a left half 5, 2, 8 and a right half 1, 9, 3, then into smaller runs, and finally into six single-element runs. Splitting cuts purely by position and compares no elements, so splitting produces no order — all order is delivered by the merging stage.

    A single-element array is trivially sorted; that is the recursion's exit. The number of splitting levels is log n: 6 elements take 3 levels, 1024 take 10 levels, a million take about 20 levels. That is where the log n in n log n comes from — the height of the recursion tree.

    Splitting in half guarantees the two sides stay balanced, pinning the worst-case number of levels at log n. If a quicksort partition tips all the way to one side, the level count runs away to n levels — and the quadratic degeneration comes precisely from the level count escaping. The two algorithms' fates diverge right here, at whether the split is balanced.
  derivation: original
