- id: lower-bound
  title: "Sorting's lower bound: comparison sorts can be at best O(n log n)"
  tldr: "Both sorts have reached n log n; this step asks: can we go any faster? First compute the comparison-sort lower bound from the number of permutations, then see how [[counting sort|计数排序]] and [[radix sort|基数排序]] get around this line — they do not rely on comparisons, but on the values' own range and digit count."
  body: |-
    n elements have n! permutations. Each comparison can at best split the possibilities in half, so distinguishing all the permutations takes at least about log₂(n!) ≈ n log n comparisons. Merge sort, quicksort, and heapsort are therefore already at the optimal order among "comparison sorts."

    Not relying on comparisons — exploiting the range of the values instead — can break the lower bound: counting sort is O(n+k) (k is the size of the value range) and radix sort is O(d·(n+b)) (d is the number of digits). They are near-linear only when the value range or digit count is bounded, and they apply only to keys from a finite range, such as integers.

    A numeric example: at n = a million, n log n ≈ 20 million comparisons while n² = a trillion — a factor of 50,000 apart. A crafted already-sorted input can drop a naive quicksort from milliseconds to minutes; production code backs it up with a random or median [[pivot]], or with [[introsort|内省排序]].
  derivation: original
  sources:
  - ref: mit-6006
    locator: Sorting lectures
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: Sorting by pairwise comparisons alone needs at least on the order of n log n comparisons in the worst case.
    status: verified
    checkedBy: Checked by Muse
    checkedAt: 2026-11-07
    note: Verified against the primary source on 2026-11-07; see docs/curriculum-audit.md
  canvas:
    kind: datastate
    structure: array
    caption: "3 elements have 3! = 6 permutations; each comparison rules out at most half, so at least ⌈log₂6⌉ = 3 comparisons are needed"
