- id: three-way
  title: "Three-way quicksort: settle the equals first"
  tldr: "The last step called duplicates two-way partitioning's waste; this step treats exactly that: one scan cuts the array into less-than, equal-to, and greater-than segments, and the equal segment lands in place all at once. Walk an array with four 4s through it, then pin down what kind of data makes it worth using."
  body: >-
    Two-way partitioning has a waste with duplicate elements: elements equal to the pivot get split to both sides and compared again in the next round. In the extreme case — every element the same number — two-way lands only one pivot per round and degenerates back to quadratic, on input that is visibly sorted at a glance.


    Three-way partitioning cuts into three segments in one pass: less than, equal to, and greater than the pivot. Worked example, 4, 9, 4, 4, 1, 9, 4 with 4 as the pivot: maintain a less-than region, an undecided region, and a greater-than region through one scan — the 9s go to the greater region, the 1 goes to the less-than region, and the other four 4s stay in the middle segment — giving 1, 4, 4, 4, 4, 9, 9, with the four 4s in the middle
    all in place at once; only the two sides still need recursion.


    The price is a slightly larger constant of comparisons and swaps per pass; with no duplicates it is no faster than two-way. So it is a specialization for duplicate-heavy data: status-code logs, grades drawn from a small range of values — high-duplication keys like these benefit the most. [[CLRS]] lists it as a standard quicksort improvement, and the criterion is a single one: how large a share of the elements equals the pivot.
  derivation: original
  sources:
