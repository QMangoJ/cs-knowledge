  points:
  - 图里有分叉和环，随便乱走会漏掉节点，或者绕圈走不出来。
- id: bfs
  title: "[[BFS]]：一层层往外扩"
  tldr: "备好了待访问列表和已访问标记，紧接着的问题是：这个列表该先进先出，还是先进后出？这一步先看先进先出的走法，跟着队列在小图上完整走一遍，看节点为什么会严格按离起点的距离一层层被访问，以及标记到底该在什么时候打上。"
  body: >-
    从 A 出发走一遍：初始队列只有 A。取出 A，把邻居 B、C 入队，队列变成 B、C。取出 B，把新邻居 D 入队，队列是 C、D。取出 C，把 E、F 入队，队列是 D、E、F。再依次取出
    D、E、F，它们没有新邻居，队列清空，访问顺序是 A、B、C、D、E、F。


    队列先进先出，越早入队越早处理，节点严格按离 A 的距离分层：第 1 层是 A，第 2 层是 B 和 C，第 3 层是
    D、E、F。易写错的细节：已访问标记要在入队时打，而不是出队时打，否则同一节点可能被多个邻居重复入队，队列堆满副本，顺序表也被重复写入。


    性质：无权图中 BFS 第一次到达某点时走过的边数就是最少边数——若存在更短的路，它上面倒数第二个节点离起点更近，会更早出队并把这个点送进来。边一旦带上不同权重，这个论证立刻失效，那是 [[Dijkstra]] 一课要解决的问题。
