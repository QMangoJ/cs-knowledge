- id: representation
  title: 图怎么存：邻接表和邻接矩阵
  tldr: 稀疏图用邻接表，省空间；稠密图或要快速判断“有没有边”时用邻接矩阵。
  body: '邻接表给每个节点存一串邻居，空间是 O(V + E)，大多数真实的图（社交网络、网页）都很稀疏，用它最合适。

    邻接矩阵是一张 V×V 的表，判断两点是否相连只要一步，但空间是 O(V²)。

    前面说的 O(V + E) 是按邻接表算的；用邻接矩阵时，找邻居要扫整行，BFS/DFS 会变成 O(V²)。'
  derivation: original
  sources:
