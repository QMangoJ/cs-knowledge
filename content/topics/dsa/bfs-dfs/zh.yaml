  - mode: 总结
    event: "选型原则收口为一句：先看问题问的是最少步数、依赖顺序还是连通性，再决定用哪种走法。"
level: 基础
minutes: 28
prereq: []
objectives:
- 对比 BFS 用队列、DFS 用栈的访问顺序
- 用 BFS 求无权图最短路径并说清为什么
- 识别需要 DFS 的场景（拓扑排序、连通性、回溯）
aiLink: 图的遍历是 RAG 与智能体系统的地基：知识图谱的扩展检索、依赖图的构建顺序、网页与文档的爬取，本质都是 BFS/DFS。理解队列与栈的顺序差异，就能为检索选对扩展策略。
design:
- mechanism: 待访问容器决定算法性质
  problem: 图里既有分叉又有环，乱走会重复访问、绕圈甚至漏掉整片区域，必须先规定「下一个处理谁」并保证每点只走一次。
  choice: 队列（先进先出）得出按圈扩展的广度优先，栈或递归（后进先出）得出一路深入的深度优先——同一张图同一份标记，换个容器就换了整套能力。
  tradeoff: 队列换来无权最短路的保证，代价是必须把一整层的节点都留在内存里；栈只需存下当前这一条路径，代价是先找到的路未必最短，长链上还要防调用栈溢出。
  root: 容器的进出契约直接投影成了图遍历的性质：先进先出锁定了距起点由近及远的单调序，后进先出天然记下了当前正在生长的根路径。
- mechanism: 发现节点那一刻立刻打标记
  problem: 图里一个点往往连着好几个邻居，如果等到「从队列或栈里取出来」才打已访问标记，同一节点会被不同邻居反复塞进容器，把本该线性的复杂度悄悄撑爆。
  choice: 在首次看到未访问邻居、把它塞进队列或栈的那一刻，当场打上已访问标记并记下前驱，后续再碰到直接跳过。
  tradeoff: 提前标记让每个点最多进容器一次、每条边只扫常数次，守住 O(V + E) 账本；但记住这只在无权遍历时成立，到了带权图里首次发现不等于最终最短，不能和最短路定案混为一谈。
  root: 遍历的线性时间账建立在「每点只进容器一次」上，标记时机不是编码习惯，而是守住复杂度和防死循环的底线。
- mechanism: 三色状态加进出时间戳把局部相遇变成全局判断
  problem: 只记「访问过没有」分不清两种情况：遇到一条早就撤离完的旁支路无害，可撞回当前正走着的祖先却说明绕成了死环，必须在相遇当场就分开。
  choice: 进入节点涂灰并记发现时刻 d，退回离开涂黑并记离开时刻 f；有向图撞见灰点立刻报环，无环时把完成时刻从大到小排列（或完成序倒转）就是拓扑序。
  tradeoff: 额外多维护一个三色状态和全局时钟，换来一趟 DFS 同时做完判环、算祖先关系与排构建顺序三件事；但整套边四分类的完整结论只适用于有向图。
  root: 灰色节点构成的集合正好就是当前递归树上还没收尾的活跃路径，把这条路径状态显式记下来，环和依赖序这类全局结构性质就能在局部碰面时一眼断定。
quiz:
- q: BFS 能保证无权图最短路径，是因为？
  options:
  - 它用了堆
  - 它按距起点由近到远一层层扩展，第一次到达即最短
  - 它速度快
  - 它不访问重复节点
  answer: 1
  explain: 层序扩展让距离单调不减，先到先得的就是最短距离。
- q: DFS 的典型递归实现靠什么保存路径？
  options:
  - 队列
  - 调用栈（或显式栈）
  - 哈希表
  - 堆
  answer: 1
  explain: 递归即隐式栈；图大时要改显式栈防爆栈。
- q: 拓扑排序处理的是？
  options:
  - 无向图的环
  - 有向无环图的依赖顺序（先做被依赖者）
  - 最短路径
  - 最小生成树
  answer: 1
  explain: 构建系统、课程先修、任务编排都是拓扑排序的用武之地。
