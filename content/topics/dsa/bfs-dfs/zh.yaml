    event: "广度优先走完了：节点按离 A 的距离一层层被访问，第一次到达每个节点时走过的边数就是最少边数。"
  code:
    lang: typescript
    code: |-
      // BFS：队列先进先出 → 按层扩展；visited 在入队时标记，避免重复入队
      function bfs(graph: Map<string, string[]>, start: string): string[] {
        const seen = new Set([start]); const q = [start]; const order: string[] = [];
        while (q.length) { const u = q.shift()!; order.push(u);
          for (const v of graph.get(u) ?? []) if (!seen.has(v)) { seen.add(v); q.push(v); } }
        return order;
      }
      // [[DFS]] 把队列换成栈（或递归）即可：一条路走到底再回头
    note: TypeScript 实现
- id: dfs
  title: "[[DFS]]：用栈一条路走到底再回头"
  tldr: 把队列换成栈（后进先出，或者直接用函数递归），搜索会挑一条路一头扎到底、撞墙再回退到最近的分叉换路；它不保证先找到最近的点，但换来了极省内存和天然追踪路径的能力。
  body: |-
    还是那张 6 节点小图，依然从 A 出发，只是容器换成后进先出的栈。用递归（系统调用栈自动替你记住回来路）先挑左边的邻居：从 A 钻进 B，再从 B 一路扎到 D；D 没有未访问的邻居了，撞到死胡同，于是退回 B；B 也没有别的路了，继续退回 A；这时才转头钻进 C，先到 E 走到底退回 C，再去 F。一趟下来顺序是 A、B、D、C、E、F——和刚才 BFS 的 A、B、C、D、E、F 对比，图一条边都没改，顺序全由「刚发现的邻居往哪端放」决定。

    为什么写 [[DFS]] 常用递归，几行代码就写完了？因为函数调用栈本来就是个现成的栈：每深入一个邻居就压入一层栈帧，函数返回时自动弹出并回到上一层的分叉点。但这里有个工程隐患：如果图退化成一条几万个节点连成的单链，递归深度就会跟着飙到几万层，把进程默认几 MB 的调用栈直接撑爆（栈溢出）。在图规模不可控的生产代码里，老老实实自己在堆内存里开一个显式数组当栈用，才不会爆栈。

    顺便破一个常见误解：DFS 的访问顺序并不唯一。画布上我们按字母先探 B 再探 C；要是邻居列表里 C 排在前面，或者用显式栈先把 B、C 压进去、再从栈顶弹出后进来的 C，就会先钻进 C 那一侧。只要守住「优先沿最新发现的节点往下钻」这一条，具体先走哪条岔路都是合法的深度优先。
