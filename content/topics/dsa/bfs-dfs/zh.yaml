- id: topo
  title: DFS 的拿手好戏：环检测与拓扑排序
  tldr: DFS 走到一个“还在当前路径上”的点，说明有环；按完成顺序倒过来，就是依赖顺序。
  body: 'DFS 时给节点三种状态：没访问、正在访问（在当前递归路径上）、已完成。

    如果走到一个“正在访问”的点，就说明有环，比如模块循环依赖。

    在没有环的有向图里，把节点按完成的先后倒过来排，每条边都从前指向后，这就是拓扑排序，npm 安装、构建任务都按它决定先后。'
  derivation: original
  sources:
  - ref: mit-6006
    locator: 图搜索相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: DFS 走到一个“还在当前路径上”的点，说明有环；按完成顺序倒过来，就是依赖顺序。
    status: unverified
    note: 按 Daniel 决定不核对出处
