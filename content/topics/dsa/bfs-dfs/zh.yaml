- id: walk-lab
  title: 动手实验：同一张图，两种走法
  tldr: "规则都讲完了，这一步换你上手：在同一张图上切换两种走法、再换一个起点各走一遍，亲眼确认访问顺序是由容器决定的、不是由图决定的；最后故意把已访问标记改到出队时才打，验证会出什么问题。"
  body: >-
    实验室里是正文用的同一张图。先从 A 用 [[BFS]] 走一遍记下顺序，再切到 [[DFS]] 从 A 出发对比：DFS 会先扎进一条支路，再回头补另一边。换个起点（比如从 G）再各走一遍，验证顺序由数据结构决定，不由图决定。


    观察顺序：固定 BFS 从 A 走，抄下队列每一步的内容，再切 DFS 对照栈的变化，然后换起点 G 重走，会发现 BFS 仍按距离分层，DFS 则先钻进离 G 最近的那条支路。最后想一个反例：若把已访问标记改到出队时才打，BFS
    会不会重复入队，队列长度的变化能直接验证。


    判断标准：出队或出栈的顺序就是访问顺序，能提前说出下一步谁出容器、谁会新入容器，才算真看懂这两种遍历。
