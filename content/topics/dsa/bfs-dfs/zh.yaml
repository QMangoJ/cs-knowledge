- id: iterative-deepening
  title: 迭代加深：给 DFS 设深度上限
  tldr: 一轮轮放宽深度上限重跑 DFS，用接近 BFS 的最浅答案保证，换只与深度成正比的内存。
  body: 'DFS 省内存但不知道离答案还有多远，BFS 能保证先找到浅的答案却吃内存，迭代加深是两者的折中。做法是给 DFS 设一个深度上限，先上限 0 只看起点，再上限 1 重跑，再上限 2，一轮轮放宽，直到找到目标为止，每轮内部仍是普通的深度优先，只是走到上限就回头。

    看似每轮重跑浪费，其实总工作量由最后一轮主导，因为树的节点数随深度指数增长，前面所有轮加起来还不到最后一轮的一个零头，渐近代价与直接 BFS 同阶。回报是内存只和深度成正比，栈里最多装一条路径，这在游戏博弈树与定理证明这类深度可控又分支巨大的搜索里是标准打法。

    它还有个变体叫 IDA 星号，把深度上限换成代价上限，配合启发估计剪枝，是 A 星算法的省内存亲戚。要注意它只适合找最浅或最省的目标，若答案埋得很深且每层分支很少，重跑的浪费比例会上升，这时普通 DFS 或 BFS 反而更干脆，折中方案也有它的适用半径。'
  derivation: original
  sources:
  - ref: mit-6006
    locator: 搜索讲义（迭代加深与深度受限搜索）
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: 迭代加深以逐轮放宽深度上限的方式结合 DFS 的低内存与 BFS 的最浅优先性质，总开销由最深一轮主导
