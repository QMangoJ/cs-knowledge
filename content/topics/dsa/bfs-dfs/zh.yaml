    event: 按距离一层层访问
  code:
    lang: typescript
    code: "// BFS：队列先进先出 → 按层扩展；visited 在入队时标记，避免重复入队\nfunction bfs(graph: Map<string, string[]>, start: string): string[] {\n  const seen = new Set([start]); const q = [start]; const order: string[] = [];\n  while (q.length) { const u = q.shift()!; order.push(u);\n    for (const v of graph.get(u) ?? []) if (!seen.has(v)) { seen.add(v); q.push(v); } }\n  return order;\n}\n// DFS 把队列换成栈（或递归）即可：一条路走到底再回头"
    note: TypeScript 实现
- id: dfs
  title: DFS：一条路走到底，再回头
  tldr: 用栈（或递归），先进后出：沿着一条路一直深入，走不通了才退回上一个分叉。
  body: '从 A 出发用 DFS 走一遍，过程完全不同。先到 A，再选邻居 B，从 B 继续深入到 D，D 没有未访问的邻居，这条路走到底了，于是回退到 B，B 也没有别的邻居，再回退到 A，改走另一条边到 C，从 C 深入 E，E 走到底回退，再走 F。最终顺序是 A、B、D、C、E、F，和 BFS 的 A、B、C、D、E、F 对照，差别只来自容器，图没有变。

    递归写法里系统调用栈替你保存了回退路径，每进入一个邻居就压一层，返回时自动弹层，这也是 DFS 代码短的原因。代价也要说清，若图是一条很长的链，递归深度等于节点数，真实工程里几万层递归就会栈溢出，这时要改成显式栈，自己管理压栈与弹出顺序。

    还有一个常见误解，DFS 的访问顺序并不唯一，邻居的枚举顺序不同，得到的序列就不同，比如先选 C 再选 B 就会先钻进 C 那一支。但深入优先这个结构性质不变，变的是具体序列，做题时不要把某一种顺序当成唯一标准答案。'
  derivation: original
  sources:
