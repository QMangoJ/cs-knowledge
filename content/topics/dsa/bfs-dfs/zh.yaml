- id: iterative-deepening
  title: 迭代加深：给 [[DFS]] 设深度上限
  tldr: "广度优先能保证先找到最浅的答案，却要装下整层节点；深度优先只装一条路径，却不知道答案埋得多深。这一步看一种折中办法：给深度优先一轮轮放宽深度上限重跑，先说清它图什么，再算重跑到底浪费多少。"
  body: >-
    DFS 省内存但不知道离答案还有多远，[[BFS]] 能保证先找到浅的答案却吃内存，迭代加深是两者的折中：给 DFS 设深度上限，先上限 0 只看起点，再上限 1 重跑，再上限
    2，一轮轮放宽，直到找到目标，每轮内部仍是普通的深度优先，走到上限就回头。


    看似重跑浪费，其实总工作量由最后一轮主导：树的节点数随深度指数增长，前面所有轮加起来还不到最后一轮的零头，渐近代价与直接 BFS
    同阶。回报是内存只和深度成正比，栈里最多装一条路径，这在游戏博弈树与定理证明这类深度可控又分支巨大的搜索里是标准打法。


    变体 [[IDA 星号|IDA*]]把深度上限换成代价上限，配合启发估计剪枝，是 A 星算法的省内存亲戚。它只适合找最浅或最省的目标：答案埋得很深且每层分支很少时，重跑的浪费比例上升，普通 DFS 或 BFS 反而更干脆。
  derivation: original
  sources:
  - ref: mit-6006
    locator: 搜索讲义（迭代加深与深度受限搜索）
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: 迭代加深以逐轮放宽深度上限的方式结合 DFS 的低内存与 BFS 的最浅优先性质，总开销由最深一轮主导
