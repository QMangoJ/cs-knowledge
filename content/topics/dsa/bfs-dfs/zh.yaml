- id: complexity
  title: 为什么是 O(V + E)
  tldr: 每个节点只访问一次，每条边只检查常数次。
  body: '有已访问标记，每个节点只处理一次，这是 V 的部分。处理节点时会看它的所有边，所有边加起来就是 E 的部分。无向图里每条边会被两个端点各看一次，常数倍不改变数量级，所以两者的总耗时都和图的大小成正比，区别只在访问顺序。

    再补内存账，时间相同不等于空间相同。BFS 的队列最宽时装的是某一整层的节点，星形图的中心连着大量叶子时，队列峰值就是线性量级；DFS 的栈最深等于当前路径长度，最坏也是线性，但典型图上通常浅得多。选型时只比时间不比空间，是初学者最常漏算的一笔。

    工程注记，网页爬虫与 RAG 的图扩展常用 BFS 控制半径，只扩展 2 跳邻居，因为节点数随跳数指数增长；DFS 则适合依赖解析这种要走到底的场景。选错遍历方式，检索结果要么爆炸要么漏召回，这不是理论洁癖，而是会直接体现在延迟与召回率上的工程账。'
  derivation: original
