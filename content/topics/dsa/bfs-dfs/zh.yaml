steps:
- id: why
  title: 为什么要系统地遍历
  tldr: "先把场面摆好：一张有分叉、还可能有环的图，从 A 出发，要把每个节点恰好访问一次。这一步先不讲具体走法，只说清随便乱走为什么不行——会漏掉整片节点、会在环里绕圈——以及要想走通全图，手边必须先备好哪两样东西。"
  body: >-
    网页链接、社交关系、模块依赖都是图，节点之间用边相连，同一个节点可能被很多条路到达。要访问每个节点恰好一次，需要两样东西：待访问列表，记录接下来该处理谁；已访问标记，防止在环上无限绕圈。


    先记牢本课小图：从 A 出发，A 有 B 和 C 两个邻居，B 通向 D，C 通向 E 和 F，一共 6 个节点 5 条边。不做标记，就会从 A 到 C、再回 A、又到 C
    反复横跳；没有待访问列表，走到分叉时只能凭记忆挑路，漏掉整片区域是迟早的事。


    待访问列表用队列还是栈，决定了访问顺序、能保证的性质，甚至内存占用——这是本课主线。[[BFS]] 的最短路性质和 [[DFS]] 的回溯性质，都是从这两种容器的进出规则里自然长出来的。
