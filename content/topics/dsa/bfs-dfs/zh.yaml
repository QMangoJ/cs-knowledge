- id: iterative-deepening
  title: 迭代加深：借 [[DFS]] 的小内存，跑出 [[BFS]] 的浅层优先
  tldr: 给 DFS 设一个从 0 开始逐轮加 1 的深度上限重跑，既保留了栈只存一条路径的省内存优点，又能像 BFS 一样优先找到最浅的目标；由于树形搜索底层节点占绝大部分，前几轮重跑的开销还不到最后一轮的零头。
  body: |-
    在分支特别多的搜索问题里（比如棋类 AI 走一步有几十种下法），[[BFS]] 会把整层节点全塞进内存、很快耗尽 RAM，而普通 DFS 一条道扎到底，可能先顺着一条废枝摸到第 500 层，白白错过就在第 2 层的答案。迭代加深把两者的好处拧到了一起：第 1 轮只许 DFS 走 0 步，没找到就重来、把上限放宽到 1 步，再没找到就上限 2 步……每一轮内部仍然是省内存的 DFS，只是撞到深度上限就强制回头。

    读者第一反应肯定是：「前面几层被反复重跑这么多遍，岂不是亏大了？」拿个常见分支因子算一下账就不怕了：假设每层分支为 10，目标在第 5 层。第 5 轮大概要摸 10 万个节点，而前面第 0 到第 4 轮全部加起来才 1 + 10 + 100 + 1000 + 10000 = 11111 个节点——还不到最后一轮的零头！因为每一层的节点数呈指数暴涨，总工作量几乎全由最后那一轮兜底，渐近时间和直接跑 BFS 同一个量级，内存却暴降到只存当前路径的深度。

    如果搜索不仅看步数、还带真实代价，把「深度上限」换成「已花代价加启发估计的上限」，就成了 [[IDA 星号|IDA*]]——它是 A* 算法在内存吃紧时的省内存亲戚。不过记住它的适用边界：如果图是一条很少分叉的细长链条，最后一轮罩不住前几轮，每轮重跑就会实打实变成浪费，那种结构还是普通 DFS 或 BFS 更干脆。
  derivation: original
  sources:
  - ref: mit-6006
    locator: 搜索讲义（迭代加深与深度受限搜索）
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: 迭代加深以逐轮放宽深度上限的方式结合 DFS 的低内存与 BFS 的最浅优先性质，总开销由最深一轮主导
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: 上限逐轮加 1，前几轮的重复被最后一轮的数量级盖住
    rows:
    - label: 上限 0
      cells:
      - v: 只看起点
    - label: 上限 1
      cells:
      - v: 重跑到第 1 层
      - v: 未找到
    - label: 上限 2
      cells:
      - v: 重跑到第 2 层
      - v: 找到目标
        mark: found
    - label: 内存
      cells:
      - v: 只存一条路径
        mark: found
      - v: 与深度成正比
  log:
  - mode: 迭代加深
    event: "深度上限逐轮放宽后，前几轮重跑的工作量加起来还不到最后一轮的零头，总量由最后一轮主导。"
- id: walk-lab
  title: 动手实验：同一张图，换容器就换了顺序
  tldr: 切换 BFS 与 DFS 并在同一张 7 节点无向图上更换起点，观察队列和栈的实时进出，你会亲眼确认：图一条边没动，遍历顺序却完全由容器的弹出端决定。
  body: |-
    实验画布在前面的 6 节点图上加了节点 G 和几条交叉边（C-D、D-F、E-F、E-G），做成了一张真正带环的 7 节点无向图。先选 [[BFS]] 从 A 出发跑一遍，看着队列先吐出 A，接着距离 1 的 B、C 依次出队，然后才是距离 2 的 D、E，最后是 F、G，顺序严格按圈层铺开。

    再把模式切到 [[DFS]]、依然从 A 出发。你会发现实验走出来的顺序是 A、C、E、G、F、D、B——「咦，为什么先走了 C 而不是 B？」盯紧栈栏就能看清原因：算法按字母序把 A 的邻居 B 先压入栈底、再把 C 压到栈顶，后进先出自然先把 C 弹出来并一路扎进 E、G。这恰好印证了前面说的：DFS 顺序取决于邻居进出栈的方向，但「只认栈顶最新节点往深处钻」的本质不变。

    试着把起点换成 G 再各自跑一遍，并默念一句检验标准：在点击下一步之前，你能提前说出容器里谁下一个弹出、哪几个未标记邻居会紧跟着进去吗？能口头预测准队列和栈的每一步变化，才算把两种容器的进出契约摸透了。
  derivation: original
  sources: []
  log: []
  canvas:
    kind: lab
    lab: graph-walk
    caption: BFS/DFS 切换 + 任意起点，队列/栈内容实时可见
    cases:
    - input:
        mode: bfs
        start: A
      expect:
        order:
        - A
        - B
        - C
        - D
        - E
        - F
        - G
        visited: 7
    - input:
        mode: dfs
        start: A
      expect:
        order:
        - A
        - C
        - E
        - G
        - F
        - D
        - B
        visited: 7
- id: topo
  title: "[[DFS]] 的拿手好戏：揪出循环依赖与排[[拓扑排序]]"
  tldr: 在没有环的有向图里，把 DFS 离开节点的完成顺序倒过来排，天然就是一份不会缺前置条件的[[拓扑排序]]；而一旦在走的过程中撞回「正在访问」的灰色节点，就证明存在必须报错的循环依赖。
  body: |-
    把视野从无向网页图切到程序员每天都见的模块构建图（画布上有向边 X → Y 表示 X 必须先于 Y 就绪）：utils 同时被 api 和 ui 依赖，而 api 和 ui 又一起支撑最终的 app。执行构建（或者 [[npm]] 装包、课程排先修）时，必须找出一份先后清单，让每条箭头的起点都排在终点前面——这就是[[拓扑排序]]。

    拿 DFS 在画布上从 utils 走一遍，这次盯住「谁先完全处理完（离开时刻）」。utils 进了 api，api 进了 app；app 没有下游依赖，第 1 个离开；退回 api，也没别的支路了，第 2 个离开；回到 utils 换走 ui，ui 发现 app 早就是黑点已完成，于是 ui 第 3 个离开；最后 utils 第 4 个离开。等一下，为什么把完成顺序倒过来就是对的？因为对于任意一条边 X → Y，只要没环，后探完的 Y 一定比先出发的 X 更早离开；把完成顺序 [app, api, ui, utils] 倒过来写成 [utils, ui, api, app]，正好保证所有被依赖的 X 全排在 Y 前面。

    如果画布里加一条反向依赖让 app → utils，那走到 app 时顺着边会一头撞回还在当前递归路径上（灰色）的 utils——谁也无法最先完成，循环依赖报错正是这样被抓出来的。工程里还有另一套基于 BFS 的做法叫 [[Kahn 算法]]：反复把当前[[入度]]为 0（没有任何前置未完成）的节点摘下来放进队列并删掉它的出边，要是最后还有节点摘不掉，同样说明卡在环里了，而且它每轮摘下来的一批节点天然可以并行构建。
  derivation: original
  sources:
  - ref: mit-6006
    locator: 图搜索相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: DFS 走到一个“还在当前路径上”的点，说明有环；按完成顺序倒过来，就是依赖顺序。
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
  canvas:
    kind: datastate
    structure: graph
    caption: 箭头 X → Y 表示 X 要先于 Y。从 utils 做 DFS，完成顺序倒过来就是拓扑序
    graph:
      directed: true
      nodes:
      - id: utils
        x: 10
        y: 50
        mark: done
        note: 第 4 个完成
      - id: api
        x: 50
        y: 15
        mark: done
        note: 第 2 个完成
      - id: ui
        x: 50
        y: 85
        mark: done
        note: 第 3 个完成
      - id: app
        x: 90
        y: 50
        mark: done
        note: 第 1 个完成
      edges:
      - from: utils
        to: api
      - from: utils
        to: ui
