    event: "广度优先走完了：节点按离 A 的距离一层层被访问，第一次到达每个节点时走过的边数就是最少边数。"
  code:
    lang: typescript
    code: |-
      // BFS：队列先进先出 → 按层扩展；visited 在入队时标记，避免重复入队
      function bfs(graph: Map<string, string[]>, start: string): string[] {
        const seen = new Set([start]); const q = [start]; const order: string[] = [];
        while (q.length) { const u = q.shift()!; order.push(u);
          for (const v of graph.get(u) ?? []) if (!seen.has(v)) { seen.add(v); q.push(v); } }
        return order;
      }
      // [[DFS]] 把队列换成栈（或递归）即可：一条路走到底再回头
    note: TypeScript 实现
- id: dfs
  title: "[[DFS]]：一条路走到底，再回头"
  tldr: "队列的走法看完了，还剩另一种容器没有试：栈。这一步换成先进后出，在同一张图上重新走一遍，把访问顺序和上一歩逐项对照，再说清递归写法为什么省事、又会在什么样的图上撑爆。"
  body: >-
    从 A 用 DFS 走一遍：先到 A，再选邻居 B，从 B 深入到 D，D 没有未访问的邻居，走到底了，回退到 B，B 也没有别的邻居，再回退到 A，改走 C，从 C 深入 E，E 走到底回退，再走 F。最终顺序是
    A、B、D、C、E、F，与 [[BFS]] 的 A、B、C、D、E、F 对照，差别只来自容器，图没有变。


    递归写法里系统调用栈替你保存回退路径，每进入一个邻居就压一层，返回自动弹层，这也是 DFS 代码短的原因。代价是：图若是一条很长的链，递归深度等于节点数，真实工程里几万层递归就会栈溢出，这时要改成显式栈，自己管理压栈与弹出。


    注意 DFS 的访问顺序并不唯一：邻居枚举顺序不同，序列就不同，比如先选 C 再选 B 就会先钻进 C 那一支。深入优先的结构性质不变，变的是具体序列，不要把某一种顺序当成唯一标准答案。
