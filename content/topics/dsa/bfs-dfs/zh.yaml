- id: representation
  title: 图怎么存：[[邻接表]]和[[邻接矩阵]]
  tldr: "走法已经讲完，回头补一个一直没有交代的前提：图在内存里到底怎么存。这一步比较邻接表和邻接矩阵两种存法，拿一百万个节点的社交图算一笔空间账，看存法选错会怎样把前面算好的复杂度整个改写。"
  body: >-
    邻接表给每个节点存一串邻居，空间 [[O(V + E)|大 O 记号]]，大多数真实图（社交网络、网页）都很稀疏，用它最合适。邻接矩阵是一张 V×V 的表，判断两点是否相连只要一步，但空间 O(V²)。


    举个数：100 万个节点、平均每个节点 10 条边的社交图，邻接表要存约 1000 万条边记录，量级可控；邻接矩阵要开一万亿个格子，绝大多数是
    0，内存直接爆掉。反过来，要反复问两点之间有没有直达边，邻接表要在邻居串里线性找，邻接矩阵查一个格子就知道，所以稠密图或边查询极频繁时矩阵才划算。


    有向图在邻接表里只存出边方向，查谁指向我就要另建逆邻接表，爬虫统计入链时常备两份。O(V + E) 是按邻接表算的，用矩阵时找邻居要扫整行，[[BFS]] 和 [[DFS]] 会变成 O(V²)——存储选型直接改写复杂度账本。
