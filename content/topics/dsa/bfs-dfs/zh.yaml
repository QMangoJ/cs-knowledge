- id: topo
  title: DFS 的拿手好戏：环检测与拓扑排序
  tldr: DFS 走到一个“还在当前路径上”的点，说明有环；按完成顺序倒过来，就是依赖顺序。
  body: 'DFS 时给节点三种状态，没访问、正在访问（在当前递归路径上）、已完成。如果走到一个正在访问的点，就说明有环，比如模块循环依赖。在没有环的有向图里，把节点按完成的先后倒过来排，每条边都从前指向后，这就是拓扑排序，npm 安装、构建任务都按它决定先后。

    拿画布上的依赖图走一遍，从 utils 出发先到 api，api 的邻居 app 没有后续，先完成 app，再回头完成 api，另一支 ui 同理，最后完成 utils。完成顺序是 app、api、ui、utils，倒过来就是 utils、ui、api、app，构建系统照这个顺序执行就不会缺依赖。

    若图中存在环，比如 app 又反过来依赖 utils，那么谁也无法最先完成，拓扑序不存在，这正是循环依赖必须报错的根本原因，任何排序都不可能同时满足环上每条边的先后要求。除了 DFS 后序倒排，还有 Kahn 算法可选，反复摘掉入度为零的节点，摘不完就说明有环，它天然能给出可并行执行的分层，工程里更常见。'
  derivation: original
  sources:
  - ref: mit-6006
    locator: 图搜索相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
