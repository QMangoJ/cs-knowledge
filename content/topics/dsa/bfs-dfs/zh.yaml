- id: bfs
  title: "[[BFS]]：用队列按距离一圈圈往外扩"
  tldr: 把待访问容器换成队列（先进先出），节点就会严格按离起点的步数一层层被访问；因为先到者步数一定最少，[[BFS]] 天然能求无权图的最短路径。
  body: |-
    拿着画布上这 6 个节点、从 A 出发走一遍。一开始把 A 放进队列并记入已访问：取出 A，把邻居 B 和 C 依次入队，队列变成 [B, C]；轮到队头的 B 出队，把新邻居 D 塞进队尾，队列变成 [C, D]；再取出 C，把 E 和 F 塞进队尾，队列变成 [D, E, F]；最后依次取出 D、E、F，它们没有新邻居，队列清空。整趟顺序是 A、B、C、D、E、F——第 1 圈是距离 0 的 A，第 2 圈是距离 1 步的 B、C，第 3 圈是距离 2 步的 D、E、F。

    写代码时最容易踩的一个坑是：为什么已访问标记必须在「入队那一刻」就打上，而不能等「出队处理时」再打？想象图里多一条边让 B 也连着 E：当 B 出队时，E 已经排进队列了；如果当时没打标记，等 C 出队时还会再看到未标记的 E，又把它塞进队列一次。在稠密图里，同一个点会被几十个邻居重复塞进队列，轻则白跑冤枉路，重则把队列撑爆。

    队列这种先进先出的规矩，免费送了我们一条好性质：在每条边长度都相等的无权图里，BFS 第一次摸到某个点时走过的边数，一定是所有路里最少的。道理很直白——如果有另一条更短的路，那条路上倒数第二个点离起点更近，早就在更靠前的那一圈里出队、先把目标点送进队列了。不过一旦每条路带上不同长度（比如开车看公里数），步数最少就不再等于路程最短，这就要交给下一课的 [[Dijkstra]] 来处理。
