title: BFS（广度优先搜索 Breadth-First Search） 与 DFS（深度优先搜索 Depth-First Search）：两种走遍一张图的方式
summary: 广度优先一层层往外扩，深度优先一条路走到底再回头。
premise: 一张图里有很多分叉，还可能有环，怎样才能不漏掉任何一个节点、也不在环里绕圈子地把整张图走完一遍？本课用一张 6 个节点的小图来回答这个问题，从节点 A 出发，分别用队列和栈走一遍，对比两种走法得到的访问顺序和各自适合解决的问题。
position: 本课开启「图上的行走」板块，它接在二叉堆用下标算术沿父子链上浮下沉之后，把行走的对象从没有环的完全二叉树推广到任意连通的图。学完你能说明已访问标记为何必须在入队时就打上，并用三色标记里灰色节点的含义判断一次 DFS 是否撞上了环。
bridge:
  prev: 上一课堆靠完全二叉树的形状让下标算术替代指针，本课面对的图没有这种规整形状，只能改用[[邻接表]]存边并靠队列或栈决定下一步走向。
  next: 本课 BFS 按边数算出的最短只在无权图成立，下一课 [[Dijkstra]] 要解决的是：边带上长短不同的权重后，步数最少为何不再等于路程最短。
overview:
- key: 一句话总结
  value: "[[BFS]] 用队列，按距离一层层访问；[[DFS]] 用栈（或递归），一路深入再回溯。打个比方，BFS 像涟漪一圈圈往外扩，先到的一定是离起点近的；DFS 像走迷宫时先沿一条路走到底，撞墙了再退回来换一条路。"
- key: 复杂度
  value: 都是 [[O(V + E)|大 O 记号]]，也就是每个节点、每条边大约各看一次。比如图里有 6 个节点和 5 条边，工作量就大致是这两者之和，而不会因为某条路走得绕就反复重算。
- key: BFS 擅长
  value: 无权图的最短路径，也就是最少走几步能到达。因为 BFS 是按距离一层层往外扩的，第一次到达某个节点时，走过的步数一定是最少的，后面再绕过来的路只会更长或一样长。
- key: DFS 擅长
  value: 遍历所有可能、检测环、[[拓扑排序]]。这类问题需要把一条路走到底才能下结论，比如排依赖顺序时，要先确认一个模块依赖的东西都处理完了，才能轮到它自己。
- key: 工程里
  value: React 用深度优先方式遍历组件树；社交网络里说的“几度好友”是 BFS；依赖分析是 DFS。比如查一个组件要先渲染它再渲染它的子组件，天然就是先深后浅；而找二度好友，本质就是从你出发往外扩两层。
- key: 存储
  value: "[[邻接表]]是 O(V + E)，[[邻接矩阵]]是 O(V²)。邻接表只存真实存在的边，图稀疏时很省；邻接矩阵给每一对节点都留一个格子，节点一多就平方膨胀，但查两个节点之间有没有边时看一眼格子就知道。"
- key: DFS 三色
  value: 白表示未访问，灰表示在当前路径上，黑表示已经完成；有向图中遇到灰色节点就说明有环。可以这样理解，灰色就是你正走着的这条路还没走完，如果顺着边又碰回这条路上的节点，说明绕成了一个圈。
- key: 连通分量
  value: 从每个未访问点出发遍历一次，就能数出有几块。因为一次遍历只能走完互相连通的那一片，走完之后还剩下没访问的点，就说明它们和前面那片之间没有路相连，是另一块。
- key: 注意
  value: 递归 DFS 在图很深时可能栈溢出，可以改用显式栈。递归每深入一层就多压一层调用栈，链特别长时栈会被撑爆；自己维护一个栈放在堆内存里，就没有这个上限问题。
