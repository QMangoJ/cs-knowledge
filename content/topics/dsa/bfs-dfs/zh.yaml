- id: bidirectional
  title: 双向 BFS：从两端同时找路
  tldr: 只问一条最短路时，从起点和终点同时分层扩展，相遇处拼出的就是答案，工作量按半径减半后的指数算。
  body: '只问 A 到 F 一条最短路时，普通 BFS 要把以 A 为中心、半径等于答案距离的整个圆都扩完。双向 BFS 换个打法，从起点正向扩一层，再从终点反向沿逆边扩一层，两边交替进行，哪一侧的待扩展集合更小就先扩哪一侧，一旦两边的已访问集合相交，沿前驱把两段拼起来就是最短路。

    算笔账，设分支因子是 10、答案距离是 6，单向要摸约 10 的 6 次方量级的节点，双向每边只扩 3 层，两边合计约 2 乘 10 的 3 次方，差了约 500 倍，这就是它在地图路径与单词变换这类问题里被反复重用的原因。省下的不是常数倍，而是把指数的底数没变、指数减半。

    边界也要清楚，它只适用于无权图或每步代价相同的场景，且反向扩展需要逆邻接表，有向图里没有现成的逆边就退化了。相交判定还要按整层做，若逐节点检查就可能拼出多走一层的次优解，实现时以层为单位交替才稳妥。带权图的两端相遇更不简单，那需要双向 Dijkstra 的专门处理，不在本课范围内。'
  derivation: original
  sources:
