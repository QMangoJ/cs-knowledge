- id: timestamps
  title: "[[DFS]] 时间戳：给每个点记下进出时刻，环就现形了"
  tldr: 在 DFS 进出每个节点时用全局计数器打上「发现时刻 d」和「离开时刻 f」，节点在递归路径上的时间区间就会严格嵌套；有向图里顺着边撞上一个还在路径里（灰色）的祖先，就等于当场抓到了环。
  body: |-
    只会记访问顺序还不够，教材和算法题里常给 DFS 配一本「打卡账」：拿一个从 1 开始递增的计时器，第一次踏进节点记下发现时刻 d，把它的所有后代都探完、准备退回上一层时再记下离开时刻 f。拿画布上这 6 节点图、按 A、B、D、C、E、F 走一遍：A 进门 d=1，钻进 B 记 d=2，钻进 D 记 d=3；D 走到头立刻离开 f=4，退回 B 离开 f=5；随后进 C 记 d=6，探完 E(7, 8) 和 F(9, 10)，最后 C 离开 f=11、A 离开 f=12。

    把这 6 个节点的 [d, f] 区间画在时间轴上，你会发现一个很整齐的规律——这就是[[括号定理]]：任意两个区间要么完全包住（像 B 的 [2, 5] 严严实实包在 A 的 [1, 12] 里面），要么完全错开（像 B 的 [2, 5] 和 C 的 [6, 11]），绝不会交叉重叠。谁被谁包住，谁就是谁的后代。

    这套时刻配合「白（未访问）、灰（还在当前路上，刚打完 d 还没打 f）、黑（已离开，打完 f）」三色，能让有向图里的每条边当场报出身份：指向白点的是开路用的树边；指向灰点的是后向边——你正走着的这条路径绕了一圈指回了自己祖先，这直接等价于图里有环；指向黑点的则是前向边或横叉边。有初学者常会卡住：「撞见黑点为什么不算有环？」因为黑点那条支路早就安全撤离并结束递归了，你只是从另一条岔路汇进一个已经走完的老朋友，并不会绕成死循环，只有撞回还在栈里的灰点才是真正的环。
