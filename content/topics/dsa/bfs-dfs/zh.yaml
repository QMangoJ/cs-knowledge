- id: complexity
  title: 为什么是 [[O(V + E)|大 O 记号]]
  tldr: "存法定下来了，接着把总账算清：为什么两种遍历都只需要 O(V + E)。这一步逐项数节点和边各被处理多少次，再补一笔常被漏掉的内存账——队列和栈在最坏情况下各要占多少。"
  body: |-
    有已访问标记，每个节点只处理一次，这是 V 的部分；处理节点时看它的所有边，加起来就是 E 的部分。无向图里每条边会被两个端点各看一次，常数倍不改变数量级，所以总耗时与图的大小成正比，区别只在访问顺序。

    内存账：[[BFS]] 的队列最宽时装一整层节点，星形图的中心连着大量叶子时，队列峰值就是线性量级；[[DFS]] 的栈最深等于当前路径长度，最坏也是线性，但典型图上通常浅得多。只比时间不比空间，是最常漏算的一笔。

    工程注记：爬虫与 [[RAG]] 的图扩展常用 BFS 只扩展 2 跳邻居，因为节点数随跳数指数增长；DFS 则适合依赖解析这种要走到底的场景。

    放到真实系统里，这笔账决定了遍历能不能全量跑：社交图有 10 亿个用户、平均每人 100 个好友时，光边就是 1000 亿条，全量遍历一次的耗时和内存都要按这个量级预估；估完这笔账，才会明白为什么真实系统必须限制扩展跳数、或者把图分片之后再处理。
  derivation: original
  sources:
