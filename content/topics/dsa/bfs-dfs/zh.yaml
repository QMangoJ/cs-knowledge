level: 基础
minutes: 16
prereq: []
objectives:
- 对比 BFS 用队列、DFS 用栈的访问顺序
- 用 BFS 求无权图最短路径并说清为什么
- 识别需要 DFS 的场景（拓扑排序、连通性、回溯）
aiLink: 图的遍历是 RAG 与智能体系统的地基：知识图谱的扩展检索、依赖图的构建顺序、网页与文档的爬取，本质都是 BFS/DFS。理解队列与栈的顺序差异，就能为检索选对扩展策略。
quiz:
- q: BFS 能保证无权图最短路径，是因为？
  options:
  - 它用了堆
  - 它按距起点由近到远一层层扩展，第一次到达即最短
  - 它速度快
  - 它不访问重复节点
  answer: 1
  explain: 层序扩展让距离单调不减，先到先得的就是最短距离。
- q: DFS 的典型递归实现靠什么保存路径？
  options:
  - 队列
  - 调用栈（或显式栈）
  - 哈希表
  - 堆
  answer: 1
  explain: 递归即隐式栈；图大时要改显式栈防爆栈。
- q: 拓扑排序处理的是？
  options:
  - 无向图的环
  - 有向无环图的依赖顺序（先做被依赖者）
  - 最短路径
  - 最小生成树
  answer: 1
  explain: 构建系统、课程先修、任务编排都是拓扑排序的用武之地。
