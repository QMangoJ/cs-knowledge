- id: bidirectional
  title: 双向 [[BFS]]：起点终点两头夹击，搜索量暴降
  tldr: 如果起点和终点都已知、只求两点间的一条最短路，让两边的 BFS 交替按层往中间扩、谁的当前层更小就先扩谁，两边已访问集合一旦撞见就能拼出最短路，直接把指数级的搜索范围砍掉一半幂次。
  body: |-
    把画布稍微改个问法：已知起点 A 和终点 F（图中 A 经 B、D 到 F，也经 C、E 到 F），现在不想走遍全图，只想找 A 到 F 的最短路。普通单向 BFS 要以 A 为圆心画一个不断变大的圆，一直扩到够着 F 为止；双向 BFS 则让 A 正向往外扩一层、再让 F 反向往里扩一层，每次优先挑待扩展集合更小那一端动一步——就像两头同时修路，在 D 处一碰头就立刻完工，顺着两边的前驱把 A → B → D 和 D → F 接起来就是答案。

    这样能省多少工作量？拿具体数字算笔账：假设每个节点平均连着 10 个新邻居（[[分支因子]]为 10），A 和 F 之间最短距离是 6 步。单向 BFS 扩满 6 层，大约要摸 10 的 6 次方（100 万）个节点；双向 BFS 从两头各扩 3 层就能相遇，每一边只摸 10 的 3 次方（1000）个节点，两边合计约 2000 个——工作量直接差出约 500 倍，省下来的不是常数倍，而是把指数减半。

    动手写双向 BFS 有两条边界不能踩。第一，反向扩展需要知道「谁指向终点」，有向图必须事先建好[[逆邻接表]]，没有逆边就只能退回单向；第二，相遇判定必须把当前这一整层扩展完再检查交集，不能刚发现一个重叠点就草率下班——同一层里可能还有别的路径，中途停下可能拼出多绕一层的次优路线。至于边带不同权重的双向搜索，需要双向 [[Dijkstra]] 并调整终止条件，不在本课范围内。
  derivation: original
  sources:
