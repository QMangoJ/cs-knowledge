level: 基础
minutes: 28
prereq: []
objectives:
- 对比 BFS 用队列、DFS 用栈的访问顺序
- 用 BFS 求无权图最短路径并说清为什么
- 识别需要 DFS 的场景（拓扑排序、连通性、回溯）
aiLink: 图的遍历是 RAG 与智能体系统的地基：知识图谱的扩展检索、依赖图的构建顺序、网页与文档的爬取，本质都是 BFS/DFS。理解队列与栈的顺序差异，就能为检索选对扩展策略。
design:
- mechanism: 待访问容器决定扩展顺序这件事不是随意的，队列先进先出让节点按距离分层被处理，栈后进先出让搜索沿一条路径深入到底，算法的性质直接来自容器的进出契约
  problem: 图里既有分叉又有环，没有纪律地乱走会重复访问同一点、在环上打转，甚至漏掉整片区域，因此遍历必须先回答下一个该处理谁这个问题，并且保证每个节点只被处理一次
  choice: 用队列承载待访问集合得到广度优先，用栈或递归承载得到深度优先，两者共享同一套访问标记与邻接扫描，唯一差别就是取出下一个节点的规则，换容器即换遍历
  tradeoff: 队列换来无权图最短路的保证，代价是某一整层的节点都要留在内存里，栈换来只存一条路径的省内存，代价是先找到的路不保证最短，且深图时要处理回溯与栈溢出
  root: 根本原因在容器自身的顺序契约，先进先出天然保持发现顺序与距离的单调对应，后进先出天然对应路径的嵌套结构，所以说算法性质其实是数据结构性质在图上的一次投影
- mechanism: 已访问标记要在节点入队入栈时就打上，而不是等它被取出处理时才标记，这条小纪律决定了每个节点最多进入容器一次，遍历的复杂度账本才守得住不被重复副本撑爆
  problem: 一个节点若有多个邻居，它可能被不同的邻居反复发现，若发现时不立刻标记，同一节点会以多份副本堆在队列或栈里，轻则浪费内存与重复扫描，重则让本该线性的复杂度悄悄膨胀
  choice: 在节点第一次被发现的那一刻就置为已访问并记录前驱，后续再遇到直接跳过，这样全部节点各入容器一次，每条边只在它的端点被处理时扫描常数次，总量回到 V 加 E
  tradeoff: 提前标记省去了重复处理，代价是必须额外维护前驱信息才能还原路径，且在加权图里发现不等于定版，距离还可能被后续松弛改小，不能把遍历的标记与最短路的定版混为一谈
  root: 遍历的复杂度建立在每点处理一次、每边扫描一次之上，任何让节点重复进入容器的写法都会打破这本账，所以标记时机不是实现习惯，而是正确性与复杂度共同的地基
- mechanism: DFS 用三色标记与发现完成时间戳把一次遍历变成可推理的结构，灰色表示节点还在当前递归路径上，这个中间状态正是环检测、边分类与拓扑排序共同的支点
  problem: 只知道访问没访问过无法区分两种相遇，撞见一个早已处理完的旁支节点是无害的，撞见一个还在当前路径上的祖先节点却意味着图里存在环，这两种情况必须在相遇当场就分开判定
  choice: 节点进入时涂灰、离开时涂黑，并记录发现与完成两个时刻，遇到灰色邻居即判定后向边与环，按完成时刻逆序输出则得到拓扑序，时间戳区间的嵌套关系同时刻画了祖先与后代
  tradeoff: 三色与时间戳让一次 DFS 顺带产出环信息与依赖顺序，代价是要维护全局时钟与状态数组，递归太深时还要改迭代实现，且边四分类的完整结论只对有向图成立，无向图要另行小心
  root: 根本原因是递归路径本身是一棵正在生长的树，灰色集合恰好是这棵树的当前根路径，把路径状态显式记下来，环与顺序这类看似全局的问题就能在局部相遇的那一刻被判定出来
quiz:
- q: BFS 能保证无权图最短路径，是因为？
  options:
  - 它用了堆
  - 它按距起点由近到远一层层扩展，第一次到达即最短
  - 它速度快
  - 它不访问重复节点
  answer: 1
  explain: 层序扩展让距离单调不减，先到先得的就是最短距离。
- q: DFS 的典型递归实现靠什么保存路径？
  options:
  - 队列
  - 调用栈（或显式栈）
  - 哈希表
  - 堆
  answer: 1
  explain: 递归即隐式栈；图大时要改显式栈防爆栈。
- q: 拓扑排序处理的是？
  options:
  - 无向图的环
  - 有向无环图的依赖顺序（先做被依赖者）
  - 最短路径
  - 最小生成树
  answer: 1
  explain: 构建系统、课程先修、任务编排都是拓扑排序的用武之地。
