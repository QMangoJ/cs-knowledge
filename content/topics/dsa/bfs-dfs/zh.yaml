- id: complexity
  title: 为什么是 O(V + E)
  tldr: 每个节点只访问一次，每条边只检查常数次。
  body: '有“已访问”标记，每个节点只处理一次，这是 V 的部分。

    处理节点时会看它的所有边，所有边加起来就是 E 的部分。

    所以两者的总耗时都和图的大小成正比，区别只在访问顺序。


    工程注记：网页爬虫与 RAG 的图扩展常用 BFS 控制半径（只扩展 2 跳邻居），因为节点数随跳数指数增长；DFS 则适合依赖解析这种要走到底的场景。选错遍历方式，检索结果要么爆炸要么漏召回。'
  derivation: original
  sources:
