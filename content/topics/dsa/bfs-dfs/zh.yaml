- id: union-find
  title: 顺带认识并查集：只问「是不是一伙的」
  tldr: 有些问题不关心路径，只关心连通性——并查集用近乎 O(1) 的合并与查询回答它。
  body: '朋友圈分组、网络连通、Kruskal 最小生成树判断加这条边会不会成环，问的都是同一件事，两个点是不是已经连通。并查集（Union-Find）给每个集合选一个代表（树根），find(x) 沿父指针找到 x 的根，union(a, b) 把一棵树挂到另一棵下。两个优化缺一不可，按秩或按大小合并（矮树挂到高树下）加路径压缩（find 时把沿途节点直接挂到根上）。两者合用，单次操作的均摊复杂度是近乎常数的 α(n)（反阿克曼函数，任何实际 n 下都不超过 5）。

    补一个具体走例，初始每个点自成一组，父指针指向自己。执行 union(A,B) 后 B 的根是 A，union(C,D) 后 D 的根是 C，再 union(B,E) 把 E 挂到 A 所在的树上，此后 find(E) 沿 E 到 B 再到 A 得到根 A，同时路径压缩会把沿途节点直接改挂到 A 下，下次再查就是一步。判断 A 与 E 是否连通，只需比两个根是否相同，不需要真的走一遍图上的路径。

    它与 BFS 和 DFS 的分工是，要枚举路径或顺序用遍历，只问连通性、且边还在动态增加时用并查集。也要清楚它的边界，并查集只记得连通性，不记得路径长什么样，更答不出最短路径，那是 BFS 的活，工具之间不是替代关系而是分工关系。'
  derivation: original
  sources:
  - ref: mit-6006
    locator: 图算法讲义：连通性与并查集
    claim: 并查集用路径压缩 + 按秩合并实现近乎常数的均摊操作复杂度
