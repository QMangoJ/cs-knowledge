- id: timestamps
  title: DFS 时间戳与边的四种分类
  tldr: 给每个节点记发现与完成两个时刻，边的类型、环与祖先关系都能从时间戳里读出来。
  body: 'DFS 还有一套教材标配但初学常跳过的簿记，给每个节点记两个时刻，第一次被发现的时刻 d 和处理完全部邻居后离开的时刻 f，时刻用一个全局计数器递增编号。本图按 A、B、D、C、E、F 的顺序走，编号依次是 A 的 d 等于 1，B 是 2，D 是 3，D 先离开 f 等于 4，B 离开 f 等于 5，再到 C 的 d 等于 6，E 是 7 与 8，F 是 9 与 10，最后 C 的 f 等于 11，A 的 f 等于 12。

    这些区间有个漂亮性质，任意两个节点的区间要么嵌套要么不相交，嵌套的正是祖先与后代关系，这叫括号定理。有向图里边按考察时的状态分四类，从白色节点走过去的是树边，指向灰色祖先的是后向边，它的存在等价于有环，指向已完成节点的还有前向边与横叉边，可用两个时刻的大小把它们区分开。

    后面拓扑排序的正确性、强连通分量的算法，全都建立在时间戳这套记账上，所以这不是装饰，而是 DFS 的第二层语言。只会写出访问顺序是第一层，能用时间戳推理结构性质，才算把 DFS 学到了教材要求的深度。'
