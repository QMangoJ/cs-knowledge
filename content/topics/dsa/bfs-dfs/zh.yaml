- id: representation
  title: 图在内存里怎么存：[[邻接表]]省空间，[[邻接矩阵]]查边快
  tldr: "[[邻接表]]只记真实存在的边，占用 [[O(V + E)|大 O 记号]] 空间，是稀疏图和遍历的标配；[[邻接矩阵]]开一张 V×V 的方格表占 O(V²)，查询两点是否直连只需看一眼，但节点一多就会把内存撑爆。"
  body: |-
    遍历算法讲得再快，图首先得装进内存。第一种存法叫[[邻接表]]：给每个节点挂一个名单，只写它直接连着谁。画布上这 6 个点 5 条边，A 的名单写 [B, C]，C 的名单写 [A, E, F]，存的总数只和点数加边数成正比。第二种存法叫[[邻接矩阵]]：建一张 6×6 的二维表格，第 i 行第 j 列写 1 表示相连、写 0 表示不连。

    为什么真实工程（社交网络、网页图、地图路网）几乎一边倒选邻接表？算一笔空间账就明白了：假设一个社交网络有 100 万用户，每人平均关注 10 个好友（共约 1000 万条有向边）。用邻接表只存这 1000 万条记录，内存不过百 MB 级别；要是硬开邻接矩阵，得开出 100万 × 100万 = 1 万亿个格子，里面 99.999% 都是 0，哪怕每个格子只占 1 字节也要 1 TB 内存，直接撑爆机器。

    而且存储选型还会反过来改写遍历的时间账：用邻接表找某个节点的邻居，直接遍历它那一小串名单就行；换成邻接矩阵，哪怕一个点只有 2 个邻居，找邻居时也得把那一行 100 万个格子从头扫到尾，把原本 O(V + E) 的 [[BFS]] 和 [[DFS]] 硬生生拖慢成 O(V²)。矩阵只在图非常稠密（几乎点点相连），或者业务需要高频回答「某两个点之间有没有直达边」时才划算。另外，有向图在邻接表里通常只存出边；要是像爬虫那样需要统计「谁链向了我」，还得额外维护一份方向倒过来的[[逆邻接表]]。
  derivation: original
  sources:
  - ref: mit-6006
    locator: 图搜索相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: 稀疏图用邻接表，省空间；稠密图或要快速判断“有没有边”时用邻接矩阵。
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
