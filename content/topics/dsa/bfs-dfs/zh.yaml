- id: scc-intro
  title: "[[强连通分量]]引子：两次 [[DFS]] 把图拆成团"
  tldr: "[[拓扑排序]]只对没有环的图成立，可真实的有向图里到处是环。这一步先把互相可达的节点圈成一团，看怎样用两次深度优先遍历把图拆成一团一团，再把团与团之间收成一张没有环的骨架图。"
  body: >-
    有向图里若 u 能到 v 且 v 也能到 u，就说它们互相可达，属于同一个强连通分量。网页抓取与依赖分析常先把图按分量缩成无环的骨架图再处理：分量内部先当作一个整体，分量之间则是单向依赖。


    [[Kosaraju|Kosaraju 算法]] 算法只要两次 DFS：第一遍在原图上算出每个节点的完成时刻，第二遍把所有边反向，按完成时刻从大到小的顺序在反图上启动
    DFS，每启动一次走遍的那一团就是一个分量。关键在时间戳：完成时刻最大的节点必然位于某个源头分量，在反图里从它出发恰好走不出这个分量，于是一团一团被摘下来。


    小例子：环 A 到 B 到 C 再回 A，外加 C 指向 D，D 无出边，则 A、B、C 是一个分量，D 自成一个。本课只要求理解两次遍历的分工与反图的作用，完整证明在图算法进阶里展开。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 22.5 Strongly Connected Components
