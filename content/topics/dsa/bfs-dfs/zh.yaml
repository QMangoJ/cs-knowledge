- id: union-find
  title: 顺带认识[[并查集]]：只问「是不是一伙的」
  tldr: "前面所有问题都要真的把图走一遍。可有些问题根本不问路径，只问两个点是不是已经连通。这一步认识一个只管连通性的轻量结构，看它怎样用近乎一步的代价回答这类问题，以及它答不了什么、该把什么问题留给遍历。"
  body: >-
    朋友圈分组、网络连通、Kruskal 最小生成树判断加边会不会成环，问的都是同一件事：两个点是不是已经连通。并查集（Union-Find）给每个集合选一个代表（树根），find(x) 沿父指针找到 x 的根，union(a, b)
    把一棵树挂到另一棵下。两个优化缺一不可：按秩或按大小合并（矮树挂到高树下）加路径压缩（find 时把沿途节点直接挂到根上）。两者合用，单次操作的均摊复杂度是近乎常数的 α(n)（反阿克曼函数，任何实际 n 下都不超过 5）。


    走例：初始每个点自成一组。union(A,B) 后 B 的根是 A，union(C,D) 后 D 的根是 C，再 union(B,E) 把 E 挂到 A 所在的树上，此后 find(E) 沿 E 到 B 再到 A 得到根
    A，路径压缩把沿途节点改挂到 A 下，下次再查就是一步。判断 A 与 E 是否连通，只需比两个根是否相同。


    分工：要枚举路径或顺序用遍历，只问连通性、且边还在动态增加时用并查集。它只记得连通性，不记得路径，更答不出最短路径，那是 [[BFS]] 的活。
  derivation: original
  sources:
  - ref: mit-6006
    locator: 图算法讲义：连通性与并查集
    claim: 并查集用路径压缩 + 按秩合并实现近乎常数的均摊操作复杂度
    status: verified
