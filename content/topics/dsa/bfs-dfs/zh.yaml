        to: B
        mark: found
      - from: B
        to: E
        mark: found
      - from: C
        to: D
        mark: found
  log:
  - mode: 连通性
    event: "判断两个点是否连通，只需比较它们的根：同根就是已连通，不同根就是还没连上。"
- id: engineering
  title: 工程选型与带走清单：一张图摆在面前，怎么挑走法
  tldr: 挑图算法先盯准问题问的是「最短步数、依赖顺序、还是静态/动态连通」；遇到大图扩展时，按度数翻倍的数字账给 BFS 卡死跳数上限，比盲目全量遍历安全得多。
  body: |-
    把各种工程场景归归类，答案一下就清楚了。社交网络查「二度好友」、无权迷宫求最少步数、二叉树按层打印，全靠 [[BFS]] 的按层推进；前端框架（如 React）遍历组件树、构建工具检查循环依赖、用[[拓扑排序]]安排任务先后，是 [[DFS]] 的主场；要数整张无向图拆成几块互不相连的孤岛，从每个未访问的点各启动一次遍历，启动次数就是连通分量数；而如果边在不断新增、只关心两点通不通，直接上[[并查集]]。

    真实工程里还要算一笔跳数膨胀账：假设一张图的节点平均有 10 个邻居，从起点做 BFS，1 跳摸到 10 个点、2 跳 100 个、3 跳 1000 个、4 跳就飙到 1 万个——每多一跳候选集直接翻一个数量级。这就是为什么社交图谱 API 和知识图谱检索几乎都会把扩展深度死死限制在 2 到 3 跳，或者转用双向 BFS 两端夹击。

    课末带走这四问选型口诀：一问图怎么存——边稀疏、要遍历一律用[[邻接表]]，边极密或高频直查两点相连才开[[邻接矩阵]]；二问图有没有权——无权问最少步数用 BFS（终点已知上双向，内存吃紧上迭代加深）；三问要顺序还是抓环——排先后或查循环依赖交给 DFS（记牢进前打标、遇灰点成环、完成序倒排）；四问是不是只判一伙——动态加边只问通不通，请出[[并查集]]一步到位。
  derivation: original
  sources:
  - ref: mit-6006
    locator: 图搜索相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: DFS 可用于拓扑排序与环检测
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
