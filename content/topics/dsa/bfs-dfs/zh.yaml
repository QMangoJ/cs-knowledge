license: CC-BY-4.0
title: BFS（广度优先）与 DFS（深度优先）：两种走遍一张图的方式
summary: 走遍一张图，核心就两件事：手里攥一张已访问名单防绕圈，再挑一个容器决定下一步先看谁。用队列（先进先出）就是 [[BFS]]，像水波纹一圈圈往外扩，第一次摸到某个点时步数一定最少；用栈（后进先出）就是 [[DFS]]，一条路钻到底撞墙再回头，正好用来揪出环、给依赖排先后。后面我们还会算清两种存图方式（[[邻接表]]和[[邻接矩阵]]）对速度与内存的真实影响，最后再认一个只判「是不是一伙的」的超快结构——[[并查集]]。
premise: 假设你要写一个网页爬虫，或者查自己和陌生人隔了几度好友：从首页 A 出发，A 连着 B 和 C，B 通向 D，C 通向 E 和 F，一共 6 个节点、5 条边。真实世界的关系网既有分叉、还可能绕成环，怎样才能既不漏掉任何角落、又不在环里兜圈子地走遍整张图？
position: 本课开启「图上的行走」板块。上一课的二叉堆靠规整的父子层级，用数组下标就能上下移动；从这一课起，节点之间的连接不再局限于没有环的树，而是推广到任意分叉、甚至带环的图。学完这课，你能看懂队列和栈怎样各自决定遍历顺序，能用「入队即标记」避开重复访问的坑，还能靠深度优先的状态变化当场抓出循环依赖。
bridge:
  prev: 上一课的二叉堆借着完全二叉树的规整形状，拿下标算术就能找到父子节点；这一课面对的图没有固定形状，每个点想连几个邻居都行，得先换一种方式把边存下来，再靠队列或栈决定下一步该往哪走。
  next: 这一课的广度优先只数「经过几条边」，可现实里的道路有长有短、网络有快有慢。下一课的 [[Dijkstra]] 就要解决边带上权重之后的问题：为什么步数最少不再等于路程最短，又该怎么挑出真正最近的那条路。
overview:
- key: 一句话总结
  value: "[[BFS]] 用队列，按距离一圈圈往外扩；[[DFS]] 用栈（或递归），挑一条路走到底再回头。一个像水波纹平推，先碰到的离起点最近；一个像走迷宫，撞到死胡同才退回上一个分叉换路。"
- key: 复杂度
  value: 时间都是 [[O(V + E)|大 O 记号]]，每个节点、每条边各看常数次。6 个点 5 条边的小图，工作量就落在点与边之和，不会因为绕路而反复重算。
- key: BFS 擅长
  value: 无权图的最短路径（最少走几步能到）。按距离一层层往外推，第一次摸到目标时步数一定最少。
- key: DFS 擅长
  value: 遍历所有分支、检测环、[[拓扑排序]]。这类问题必须把一条路走到底或把所有下游先收尾，才能下结论。
- key: 工程里
  value: 社交网络找「几度好友」是 BFS；打包工具排依赖顺序、React 遍历组件树是 DFS。
- key: 存储
  value: "[[邻接表]]占 O(V + E)，[[邻接矩阵]]占 O(V²)。稀疏图用邻接表省内存，只有稠密图或频繁查「两点有没有直连」时矩阵才划算。"
- key: DFS 三色
  value: 白表示没去过，灰表示还在当前路径上，黑表示已经走完离开。有向图里撞见灰点，说明绕成了一个环。
- key: 连通分量
  value: 从每个未访问点出发遍历一次，启动几次就有几块互不相连的孤岛；如果边还会动态增加，只问「通不通」换[[并查集]]。
- key: 注意
  value: 递归 DFS 在极深的长链图上会撑爆调用栈，工程里图深不可控时要改成堆上的显式栈。
