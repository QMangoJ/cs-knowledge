- id: scc-intro
  title: "[[强连通分量]]引子：用两次 [[DFS]] 把互相纠缠的环缩成一团"
  tldr: 有向图里只要存在环，拓扑排序就会卡死；[[Kosaraju 算法]]用原图一遍 DFS、边全部反向后再跑一遍 DFS，就能把彼此互相可达的节点打包成一个个[[强连通分量]]，剩下的团之间便成了一张干净的无环图。
  body: |-
    真实世界的有向图（比如网页互相引用、微服务互相调用）往往到处是环，拓扑排序直接用不上。退一步的办法是先把「互相都能走到彼此」的一撮点打包成一个整体，叫做一个[[强连通分量]]。就像画布里 A → B → C → A 这三个点组成了一个死死互咬的小圈，而 C 指向的 D 没有路能回 A；把 {A, B, C} 缩成「分量一」、D 自己算「分量二」后，原本带环的图立刻变成 分量一 → 分量二 这张没有环的骨架图。

    [[Kosaraju 算法]]只靠两次 DFS 就把这些团拆得干干净净。第一遍在原图上正常跑 DFS，唯一目的是记下每个点的离开时刻 f；第二遍把整张图的所有箭头全部反转，按刚才离开时刻从大到小的顺序挑未访问的点启动 DFS，每启动一次走遍的那片区域，正好就是一个独立的强连通分量。

    为什么把箭头反转再按最大完成时刻出发，就能一团一团刚好摘下来？拿画布上的小例子看一眼就懂：原图里 A、B、C 的外围能走到 D，最后离开、完成时刻最大的一定落在源头团 {A, B, C} 里；把箭头全部反向后，D 只接得到来自外部的边、不再有箭头指回 {A, B, C}，于是你在反图里从 {A, B, C} 出发时，恰好被困在这个小圈里出不去，一锅端走整个分量，绝不会误吞 D。本课只要求看清两次遍历的分工与反图的作用，完整证明在进阶图论里展开。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 22.5 Strongly Connected Components
    claim: Kosaraju 算法通过原图 DFS 的完成时间顺序与反图上的第二次 DFS 求出全部强连通分量
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: graph
    caption: 环内三点互达是一个分量，D 自成一个
    graph:
      directed: true
      nodes:
      - id: A
        x: 15
        y: 20
        mark: found
      - id: B
        x: 55
        y: 20
        mark: found
      - id: C
        x: 35
        y: 70
        mark: found
      - id: D
        x: 90
        y: 70
        mark: visited
      edges:
      - from: A
        to: B
        mark: found
      - from: B
        to: C
        mark: found
      - from: C
        to: A
        mark: found
      - from: C
        to: D
    aux:
    - label: 分量一
      items:
      - A, B, C（互达）
    - label: 分量二
      items:
      - D
    - label: 缩点后
      items:
      - 分量一 → 分量二（无环）
  log:
  - mode: 强连通
    event: "强连通分量靠第二遍遍历摘出来：在反图上按完成时刻从大到小依次启动深度优先，每启动一次走遍一团。"
- id: union-find
  title: "[[并查集]]：不走完整张图，用近乎常数代价判「是不是一伙的」"
  tldr: 如果问题不问具体路线，只动态加边并频繁追问「两个点是不是已经连通」，[[并查集]]用代表树根加上「按秩合并」和「路径压缩」，就能把单次查询压到几乎只需一步的近乎常数代价。
  body: |-
    朋友圈分组、网络机房断线重连、[[Kruskal]] 算法判断新加一条边会不会绕成环，每次都重跑一遍 O(V + E) 的图遍历太笨重了。[[并查集]]干脆不存邻居表，只让每个集合推举一个「老大（树根）」，每个点手里只攥一个指向父节点的指针：find(x) 一路往上找直到撞见指向自己的树根；union(a, b) 找到两边的树根，把其中一棵挂到另一棵下面。两个点是不是一伙的？比一下 find(a) 和 find(b) 的树根相不相同就知道了。

    拿画布上的操作顺序看一遍：初始 5 个点各自独立成组。union(A, B) 把 B 挂到 A 下，union(C, D) 把 D 挂到 C 下，再 union(B, E) 沿着 B 找到老大 A，把 E 也挂进 A 这棵树。如果一路这么随意挂下去，树可能长成一条长链导致 find 变慢，所以必须配齐两味优化：按秩合并（或按集合大小合并）规定永远把矮树挂到高树下面，不让树高失控；路径压缩则在每次 find(E) 顺着 E → B → A 摸到树根 A 后，顺手把沿途的 E 和 B 全改写成直接挂在 A 底下——下次再查就是一跳直达。

    这两招合用，能把树压得几乎只有两层扁平，单次操作的均摊时间是极其缓慢的反阿克曼函数 α(n)（哪怕把全宇宙的原子数塞进 n，α(n) 也不超过 5，工程上就是近乎常数）。不过要守住分工边界：并查集只记得「是不是同一拨人」，记不住具体哪条边怎么连过去的，更回答不了最短路径，凡是需要还原路线或算步数的场景，还是得请出 [[BFS]] 或 [[DFS]]。
  derivation: original
  sources:
  - ref: mit-6006
    locator: 图算法讲义：连通性与并查集
    claim: 并查集用路径压缩 + 按秩合并实现近乎常数的均摊操作复杂度
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: graph
    caption: union(A,B)、union(C,D)、union(B,E) 之后只剩两个集合
    graph:
      nodes:
      - id: A
        x: 5
        y: 20
        mark: done
      - id: B
        x: 35
        y: 70
        mark: done
      - id: E
        x: 60
        y: 15
        mark: done
      - id: C
        x: 70
        y: 75
        mark: done
      - id: D
        x: 95
        y: 35
        mark: done
