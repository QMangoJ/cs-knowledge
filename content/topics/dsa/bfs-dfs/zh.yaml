steps:
- id: why
  title: 为什么要系统地遍历
  tldr: 图里有分叉和环，随便乱走会漏掉节点，或者绕圈走不出来。
  body: '网页链接、社交关系、模块依赖都是图，节点之间用边相连，同一个节点可能被很多条路到达。要访问每个节点恰好一次，需要两样东西，一个是待访问列表，记录接下来该处理谁，另一个是已访问标记，防止在环上无限绕圈。

    先把本课的小图记牢，从 A 出发，A 有 B 和 C 两个邻居，B 通向 D，C 通向 E 和 F，一共 6 个节点 5 条边。若不做标记，从 A 到 C、再从 C 回到 A、又到 C，就会反复横跳永远停不下来；若没有待访问列表，走到分叉时就只能凭记忆挑路，漏掉整片区域是迟早的事。

    待访问列表用队列还是栈，看似只是容器选择，却决定了访问顺序、能保证的性质，甚至内存占用方式，这正是本课的主线。后面会看到，BFS 的最短路性质和 DFS 的回溯性质都不是另行设计出来的，而是从这两种容器的进出规则里自然长出来的，先把这张小图的形状记牢，后面每一步都拿它当标本。'
  derivation: original
  sources:
