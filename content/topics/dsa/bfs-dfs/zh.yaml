- id: bidirectional
  title: 双向 [[BFS]]：从两端同时找路
  tldr: "前面的广度优先都是从起点单向往外扩。可如果只问 A 到 F 这一条最短路，终点同样是已知的。这一步让起点和终点同时往中间扩，看两边相遇时为什么能省下数量级的工作量，以及这种走法在什么情况下用不了。"
  body: >-
    只问 A 到 F 一条最短路时，普通 BFS 要把以 A 为中心、半径等于答案距离的整个圆都扩完。双向 BFS
    换打法：从起点正向扩一层，再从终点反向沿逆边扩一层，两边交替，哪一侧的待扩展集合更小就先扩哪一侧；两边的已访问集合一旦相交，沿前驱把两段拼起来就是最短路。


    算账：设[[分支因子]] 10、答案距离 6，单向要摸约 10 的 6 次方量级的节点，双向每边只扩 3 层，两边合计约 2 乘 10 的 3 次方，差了约 500 倍。省下的不是常数倍，而是指数减半。


    边界：它只适用于无权图或每步代价相同的场景，反向扩展需要逆[[邻接表]]，有向图没有现成逆边就退化；相交判定要按整层做，逐节点检查可能拼出多走一层的次优解。带权图的两端相遇需要双向 [[Dijkstra]]，不在本课范围内。
  derivation: original
  sources:
