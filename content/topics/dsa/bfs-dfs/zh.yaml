- id: bfs
  title: BFS：一层层往外扩
  tldr: 用队列，先进先出：先访问所有邻居，再访问邻居的邻居。
  body: '从 A 出发完整走一遍，队列变化是这样的，初始队列只有 A。取出 A 访问，把它的邻居 B、C 按顺序入队，队列变成 B、C。取出 B，把 B 的新邻居 D 入队，队列是 C、D。取出 C，把 E、F 入队，队列是 D、E、F。再依次取出 D、E、F，它们没有新邻居，队列清空，访问顺序就是 A、B、C、D、E、F。

    可以看到队列是先进先出，越早入队的越早处理，于是节点严格按离 A 的距离分层出现，第 1 层是 A，第 2 层是 B 和 C，第 3 层是 D、E、F。这里有个容易写错的细节，已访问标记要在入队时打，而不是出队时打，否则同一个节点可能被多个邻居重复入队，队列里堆满副本，顺序表还会被重复写入。

    最后是性质，无权图中 BFS 第一次到达某点时走过的边数就是最少边数，因为若存在更短的路，它上面倒数第二个节点离起点更近，会更早出队并把这个点送进来。边一旦带上不同的权重，这个论证立刻失效，那是 Dijkstra 一课要解决的问题。'
  derivation: original
  sources:
  - ref: mit-6006
    locator: BFS 相关讲义
