- id: engineering
  title: 工程里怎么选
  tldr: 找最少步数用 BFS；要穷尽、检测环或排依赖顺序用 DFS。
  body: '社交网络里“你和某人隔了几度”，用 BFS。

    打包工具分析模块依赖、检测循环引用、决定构建顺序，用的是 DFS 和拓扑排序。

    React 渲染时按深度优先的顺序遍历组件树：先处理子节点，再处理兄弟节点。


    具体数字：一张平均度数 10 的图，BFS 走 3 跳要摸到约 1000 个节点、4 跳约 1 万——跳数每加 1，候选集翻一个数量级，这就是图检索 API 都限制跳数的原因。'
  derivation: original
  sources:
