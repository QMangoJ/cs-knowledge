steps:
- id: why
  title: 想不漏不重走遍全图，先备好名单和待办箱
  tldr: 只靠眼睛记路，遇到分叉会漏掉整片区域、遇到环会兜圈子停不下来。走遍任何一张图，手边都必须备好两样东西：一份「已访问名单」防绕圈，一个「待访问容器」定先后。
  body: |-
    把图想成你手头那张 6 个页面的小站（也可以看作 6 个人组成的社交小圈子）：从首页 A 出发，A 连着 B 和 C，B 通向 D，C 通向 E 和 F，一共 6 个节点、5 条边。如果网页之间互相链接绕成环（比如 C 又连回 A），顺着链接点进去却不记足迹，就会在 A → C → A → C 之间无限打转。

    光记「去过哪」还不够。站在 A 面前同时看到 B 和 C 两个分叉时，你先钻进了 B 那条路，要是不把还没顾上看的 C 记在待访问列表里，等走到死胡同 D 之后，就再也想不起还有 C 这半片世界。

    所以所有图遍历代码都长着同一副骨架：每看到一个邻居，先查已访问名单，没去过才收进待访问容器。至于这个容器是先进先出的队列，还是先进后出的栈，会直接把访问顺序、能解决的问题和内存开销拆成两条完全不同的路。
