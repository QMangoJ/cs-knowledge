title: BFS 与 DFS：两种走遍一张图的方式
summary: 广度优先一层层往外扩，深度优先一条路走到底再回头。
premise: 以一张 6 个节点的小图，从节点 A 出发为例。
overview:
- key: 一句话总结
  value: BFS 用队列，按距离一层层访问；DFS 用栈（或递归），一路深入再回溯
- key: 复杂度
  value: 都是 O(V + E)：每个节点、每条边大约各看一次
- key: BFS 擅长
  value: 无权图的最短路径（最少几步到达）
- key: DFS 擅长
  value: 遍历所有可能、检测环、拓扑排序
- key: 工程里
  value: React 用深度优先方式遍历组件树；社交网络“几度好友”是 BFS；依赖分析是 DFS
- key: 存储
  value: 邻接表 O(V + E)，邻接矩阵 O(V²)
- key: DFS 三色
  value: 白（未访问）、灰（在路径上，遇到即有环）、黑（完成）
- key: 连通分量
  value: 从每个未访问点出发遍历一次，就能数出有几块
- key: 注意
  value: 递归 DFS 图很深时可能栈溢出，可改用显式栈
