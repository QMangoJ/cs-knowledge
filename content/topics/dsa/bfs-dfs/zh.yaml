- id: representation
  title: 图怎么存：邻接表和邻接矩阵
  tldr: 稀疏图用邻接表，省空间；稠密图或要快速判断“有没有边”时用邻接矩阵。
  body: '邻接表给每个节点存一串邻居，空间是 O(V + E)，大多数真实的图（社交网络、网页）都很稀疏，用它最合适。邻接矩阵是一张 V×V 的表，判断两点是否相连只要一步，但空间是 O(V²)。

    举个数，100 万个节点、平均每个节点 10 条边的社交图，邻接表要存约 1000 万条边记录，量级可控，而邻接矩阵要开一万亿个格子，绝大多数是 0，内存直接爆掉。反过来，若要反复问某两个点之间到底有没有直达边，邻接表要在邻居串里线性找，邻接矩阵查一个格子就知道，所以稠密图或边查询极频繁的场景矩阵才划算。

    还要注意有向图在邻接表里只存出边方向，想查谁指向我就要另建逆邻接表，爬虫统计入链时常备两份。前面说的 O(V + E) 是按邻接表算的，用邻接矩阵时找邻居要扫整行，BFS 和 DFS 会变成 O(V²)，存储选型直接改写了复杂度账本。'
  derivation: original
  sources:
