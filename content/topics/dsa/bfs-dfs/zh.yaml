- id: complexity
  title: "复杂度账本：时间为什么是 [[O(V + E)|大 O 记号]]，内存差在哪"
  tldr: 有了入容器就打标记的规矩，每个节点只进容器一次、每条边只被扫描常数次，时间复杂度严格落在 [[O(V + E)|大 O 记号]]；但空间上 BFS 最坏要兜住整整一层的宽度，DFS 只需兜住一条路径的深度。
  body: |-
    时间账很好算。只要用邻接表存图、且守住「发现时即标记」这条规矩，全图 V 个节点各自最多进一次队列或栈、出容器处理一次，这就是 V 的部分；每处理一个节点就顺着它的名单扫一遍邻边，全图加起来无非把 E 条边各看一遍（无向图一条边被两端各看一次，也就是 2E），常数去掉就是 O(V + E)——无论图里分叉多乱，都不会因为走过弯路而反复重算。

    光比时间容易漏掉内存账。[[BFS]] 的队列必须装下「当前这一圈」所有待扩展的节点：如果是一张星形图，中心点连着 10 万个叶子，第二层刚展开时队列里一下就躺进 10 万个节点；而 [[DFS]] 的栈里永远只保留「从起点到当前点」这一条没走完的线，在分支很多但不太深的图上，空间往往比 BFS 小得多，只有在图退化成一条长链时才会达到线性的 O(V)。

    放到 10 亿用户、每人平均 100 个好友的社交图里，总边数是 1000 亿条，全量跑一遍 O(V + E) 也吃不消，还得把整张图按机器分片。所以工程里做知识图谱检索（比如 [[RAG]] 里的图扩展）或爬虫抓取时，几乎都会用 BFS 卡死最多往外扩 2 跳或 3 跳——看清这本时间与空间账，就知道为什么限制跳数是硬规定。
  derivation: original
  sources:
  - ref: mit-6006
    locator: 图搜索相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
