- id: scc-intro
  title: 强连通分量引子：两次 DFS 把图拆成团
  tldr: 互相可达的节点是一个强连通分量，Kosaraju 用两遍 DFS（原图记完成时刻、反图按时刻倒序）把它们一团团摘出来。
  body: '有向图里若 u 能到 v 且 v 也能到 u，就说它们互相可达，属于同一个强连通分量。网页抓取与依赖分析常先把图按分量缩成一张无环的骨架图再处理，因为分量内部的细节可以先当作一个整体，分量之间则必然是单向的依赖关系。

    Kosaraju 算法只要两次 DFS，第一遍在原图上算出每个节点的完成时刻，第二遍把所有边反向，按完成时刻从大到小的顺序在反图上启动 DFS，每启动一次走遍的那一团就是一个分量。为什么成立，关键在时间戳，完成时刻最大的节点必然位于某个源头分量，在反图里从它出发恰好走不出这个分量，于是一团一团地被摘下来，顺序不会串团。

    走个小例子，环 A 到 B 到 C 再回 A，外加 C 指向 D，D 无出边，则 A、B、C 互达是一个分量，D 自成一个。第一遍完成时刻里环中某点最大，第二遍在反图上从它出发正好圈住三人。本课只要求理解两次遍历的分工与反图的作用，完整证明在图算法进阶里展开。'
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 22.5 Strongly Connected Components
    claim: Kosaraju 算法通过原图 DFS 的完成时间顺序与反图上的第二次 DFS 求出全部强连通分量
