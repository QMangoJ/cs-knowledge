- id: engineering
  title: 工程里怎么选
  tldr: "最后收口到工程选型：同一张图，问题不同，该用的走法完全不同。这一步按问题逐项对号——找最少步数、排依赖顺序、数连通块、动态加边——并用跳数膨胀的数字说清图检索为什么必须限制扩展深度。"
  body: >-
    社交网络里你和某人隔了几度，用 [[BFS]]；打包工具分析模块依赖、检测循环引用、决定构建顺序，用 [[DFS]] 和[[拓扑排序]]；React 渲染时按深度优先遍历组件树，先处理子节点，再处理兄弟节点。


    具体数字：一张平均度数 10 的图，BFS 走 3 跳摸到约 1000 个节点、4 跳约 1 万，跳数每加 1，候选集翻一个数量级，这就是图检索 API 都限制跳数的原因。迷宫与连通块计数用 DFS 加回溯；二叉树按层打印、图的第
    k 跳邻居，本质是 BFS 的分层性质在发力。


    无向图数连通分量时，从每个未访问点各启动一次遍历，启动次数就是分量数；动态加边则用[[并查集]]。
