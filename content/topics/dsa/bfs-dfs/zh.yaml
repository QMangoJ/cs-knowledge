- id: engineering
  title: 工程里怎么选
  tldr: 找最少步数用 BFS；要穷尽、检测环或排依赖顺序用 DFS。
  body: '社交网络里你和某人隔了几度，用 BFS。打包工具分析模块依赖、检测循环引用、决定构建顺序，用的是 DFS 和拓扑排序。React 渲染时按深度优先的顺序遍历组件树，先处理子节点，再处理兄弟节点。

    具体数字，一张平均度数 10 的图，BFS 走 3 跳要摸到约 1000 个节点、4 跳约 1 万，跳数每加 1，候选集翻一个数量级，这就是图检索 API 都限制跳数的原因。再给两个选型细节，迷宫与连通块计数这类要枚举全部可能的问题用 DFS 加回溯，剪枝发生在深入之后、回退之前；层序类需求比如二叉树按层打印、图的第 k 跳邻居，本质就是 BFS 的分层性质在发力。

    还有个常被忽略的点，无向图数连通分量时，从每个未访问点各启动一次遍历，启动次数就是分量数，这比先建并查集再数根更直接，静态图用遍历，动态加边用并查集。把这些场景和容器对应起来，被问为什么这里用队列那里用栈时，就能答到机制层而不只是背结论。'
  derivation: original
  sources:
