- id: bfs
  title: "[[BFS]]: expanding outward, layer by layer"
  tldr: "With the to-visit list and the visited marks ready, the next question is: should this list be first-in, first-out, or first-in, last-out? This step looks at the first-in, first-out walk first, following the queue through a complete walk of the small graph to see why nodes are visited strictly layer by layer by distance from the start — and exactly when the mark has to be set."
  body: >-
    Walk it once from A: the initial queue holds only A. Take out A and enqueue its neighbors B and C; the queue becomes B, C. Take out B and enqueue the new neighbor D; the queue is C, D. Take out C and enqueue E and F; the queue is D, E, F. Then take out
    D, E, and F in turn; they have no new neighbors, the queue empties, and the visit order is A, B, C, D, E, F.


    A queue is first-in, first-out — the earlier a node is enqueued, the earlier it is processed — so nodes are layered strictly by their distance from A: layer 1 is A, layer 2 is B and C, layer 3 is
    D, E, and F. A detail that is easy to get wrong: the visited mark must be set when a node is enqueued, not when it is dequeued. Otherwise the same node can be enqueued repeatedly by several neighbors, the queue fills with copies, and the order list gets written with duplicates too.


    The key property: in an unweighted graph, the number of edges traversed when BFS first reaches a node is the minimum number of edges — if a shorter route existed, the second-to-last node on it would be closer to the start, would be dequeued earlier, and would have delivered this node sooner. The moment edges carry different weights, this argument collapses at once — that is the problem the [[Dijkstra]] lesson has to solve.
  derivation: original
  sources:
