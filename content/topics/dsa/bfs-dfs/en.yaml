- id: bidirectional
  title: "Bidirectional [[BFS]]: searching for a route from both ends at once"
  tldr: "The breadth-first searches so far all expanded in one direction, from the start. But if the question is only about the one shortest route from A to F, the destination is equally well known. This step expands from the start and the destination toward the middle at the same time, and shows why — when the two sides meet — it can save an order of magnitude of work, and in what situations this walk cannot be used."
  body: >-
    When the question is only about one shortest route from A to F, ordinary BFS has to finish expanding the whole circle centered on A whose radius equals the answer's distance. Bidirectional BFS
    changes the play: expand one layer forward from the start, then expand one layer backward from the destination along reverse edges, alternating between the two sides — whichever side's set of nodes waiting to expand is smaller expands first. The moment the two sides' visited sets intersect, splicing the two segments together along the predecessors gives the shortest route.


    The math: with a [[branching factor|分支因子]] of 10 and an answer distance of 6, a one-directional search touches on the order of 10 to the 6th power nodes; the bidirectional search expands only 3 layers on each side, for a combined total of about 2 times 10 to the 3rd power — a difference of about 500 times. What is saved is not a constant factor but half of the exponent.


    The limits: it applies only to unweighted graphs, or scenarios where every step costs the same; expanding backward needs a reverse [[adjacency list|邻接表]], and a directed graph with no ready-made reverse edges makes it degenerate; and the intersection test must be done layer by whole layer — checking node by node can splice together a suboptimal route that takes one layer too many. Meeting in the middle on a weighted graph requires bidirectional [[Dijkstra]], which is outside this lesson's scope.
  derivation: original
  sources:
