- id: representation
  title: "How to store a graph: [[adjacency list|邻接表]] and [[adjacency matrix|邻接矩阵]]"
  tldr: "The walks are covered; now to fill in a premise that was never spelled out: how is a graph actually stored in memory? This step compares the adjacency list and the adjacency matrix, and does the space math on a social graph of a million nodes, to see how choosing the wrong storage rewrites the whole complexity account worked out earlier."
  body: >-
    An adjacency list stores a string of neighbors for each node, taking space [[O(V + E)|大 O 记号]]; most real graphs (social networks, the web) are very sparse, so it suits them best. An adjacency matrix is a V×V table: telling whether two nodes are connected takes a single step, but the space is O(V²).


    A concrete number: for a social graph with a million nodes and an average of 10 edges per node, an adjacency list stores about 10 million edge records — a manageable magnitude. An adjacency matrix would need a trillion cells, the overwhelming majority of them
    0, and memory blows up on the spot. Conversely, if you repeatedly ask whether a direct edge exists between two nodes, the adjacency list has to search linearly through the neighbor string, while the matrix answers from a single cell — so the matrix only pays off for dense graphs, or when edge queries are extremely frequent.


    In an adjacency list, a directed graph stores only the outgoing direction; to look up who points at me you have to build a separate [[reverse adjacency list|逆邻接表]] — crawlers counting inbound links commonly keep both copies. O(V + E) is computed for the adjacency list; with a matrix, finding neighbors means scanning a whole row, so [[BFS]] and [[DFS]] become O(V²) — the storage choice rewrites the complexity ledger directly.
