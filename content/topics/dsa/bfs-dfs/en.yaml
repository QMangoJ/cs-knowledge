  log:
  - mode: Summary
    event: "The selection principle boils down to one line: look first at whether the question asks about fewest steps, dependency order, or connectivity, then decide which walk to use."
level: 基础
minutes: 28
prereq: []
objectives:
- Compare the visit orders of BFS, which uses a queue, and DFS, which uses a stack
- Find shortest paths in unweighted graphs with BFS, and explain why it works
- Recognize the scenarios that need DFS (topological sorting, connectivity, backtracking)
aiLink: "Graph traversal is the foundation of RAG and agent systems: expanding retrieval over a knowledge graph, the build order of a dependency graph, and crawling web pages and documents are all BFS/DFS at bottom. Understand the order difference between a queue and a stack, and you can choose the right expansion strategy for retrieval."
design:
- mechanism: The to-visit container decides the expansion order — a queue's first-in, first-out makes nodes be processed layered by distance, while a stack's last-in, first-out makes the search dive to the end of one path. The algorithm's properties come directly from the container's entry-and-exit contract
  problem: A graph has both forks and cycles; walking without discipline revisits the same node, goes around in circles on a cycle, and even misses whole regions. So a traversal must first answer who should be processed next, and guarantee that each node is processed only once
  choice: Carry the to-visit set in a queue to get breadth-first, or in a stack or recursion to get depth-first. The two share the same visited marks and adjacency scanning; the only difference is the rule for taking out the next node — swap the container and you swap the traversal
  tradeoff: The queue buys the guarantee of shortest paths in unweighted graphs, at the price of keeping a whole layer of nodes in memory; the stack buys memory savings — storing only one path — at the price that the first route found is not guaranteed to be shortest, and that deep graphs require handling backtracking and stack overflow
  root: The root cause lies in the container's own ordering contract — first-in, first-out naturally preserves the monotone correspondence between discovery order and distance, and last-in, first-out naturally corresponds to the nested structure of a path. So an algorithm's properties are really a data structure's properties, projected onto a graph
- mechanism: The visited mark must be set when a node is enqueued or pushed, not when it is taken out and processed. This small piece of discipline decides that each node enters the container at most once, and only then does the traversal's complexity account hold
  problem: If a node has several neighbors, it may be discovered repeatedly by different neighbors. If it is not marked the moment it is discovered, the same node piles up in the queue or stack in multiple copies — wasting memory and rescanning at best, and quietly inflating what should be linear complexity at worst
  choice: Set a node to visited and record its predecessor at the very moment it is first discovered, and skip it outright on any later encounter. That way every node enters the container once, each edge is scanned only a constant number of times — when its endpoint is processed — and the total returns to V plus E
  tradeoff: Marking early saves the repeated processing; the price is having to maintain predecessor information in addition, in order to reconstruct paths — and in a weighted graph, being discovered is not the same as being finalized, because a distance can still be reduced by a later relaxation, so the traversal's marks must not be confused with the shortest path's finalization
  root: The complexity of a traversal rests on processing each node once and scanning each edge once; any writing style that lets a node re-enter the container breaks that account. So the timing of the mark is not an implementation habit but the shared foundation of correctness and complexity
- mechanism: DFS uses three-color marks and discovery/finish timestamps to turn one traversal into a structure you can reason about — gray means the node is still on the current recursive path, and that intermediate state is exactly the pivot shared by cycle detection, edge classification, and topological sorting
  problem: Knowing only visited-or-not cannot distinguish two kinds of encounter — running into a side-branch node that was finished long ago is harmless, while running into an ancestor that is still on the current path means the graph contains a cycle. The two cases must be told apart on the spot, at the moment of the encounter
  choice: Color a node gray on entry and black on exit, and record the discovery and finish moments; meeting a gray neighbor at once judges a back edge and a cycle, and outputting in reverse finish-time order yields a topological order — while the nesting of the timestamp intervals characterizes ancestors and descendants at the same time
  tradeoff: The three colors and the timestamps let one DFS produce cycle information and dependency order along the way; the price is maintaining a global clock and a state array, switching to an iterative implementation when the recursion runs too deep — and the full conclusions of the four-way edge classification hold only for directed graphs
  root: The root cause is that the recursive path is itself a tree in the process of growing, and the gray set is exactly that tree's current root path. Record the path's state explicitly, and seemingly global problems like cycles and order can be judged at the very moment of a local encounter
quiz:
- q: Why can BFS guarantee shortest paths in unweighted graphs?
  options:
  - It uses a heap
  - It expands layer by layer, from near to far by distance from the start, so the first arrival is the shortest
  - It is fast
  - It does not visit nodes repeatedly
  answer: 1
  explain: Layer-order expansion keeps distances monotonically non-decreasing, so whoever arrives first has the shortest distance.
- q: What does the typical recursive implementation of DFS rely on to save the path?
  options:
  - A queue
  - The call stack (or an explicit stack)
  - A hash table
  - A heap
  answer: 1
  explain: Recursion is an implicit stack; on a large graph, switch to an explicit stack to keep it from bursting.
- q: What does topological sorting handle?
  options:
  - Cycles in undirected graphs
  - The dependency order of a directed acyclic graph (do what is depended on first)
  - Shortest paths
  - Minimum spanning trees
  answer: 1
  explain: Build systems, course prerequisites, and task orchestration are all places where topological sorting is used.
