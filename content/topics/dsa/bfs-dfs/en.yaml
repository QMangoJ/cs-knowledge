steps:
- id: why
  title: Why traverse systematically at all?
  tldr: "Set the scene first: a graph with forks and possibly cycles, starting from A, and every node is to be visited exactly once. This step does not cover any specific walk yet — it only explains why wandering at random fails: you miss whole regions of nodes, and you circle around cycles — and which two things you must have at hand before a full walk can work."
  body: >-
    Web links, social relationships, and module dependencies are all graphs — nodes connected by edges, with the same node reachable by many different paths. To visit every node exactly once, you need two things: a to-visit list recording who should be processed next, and a visited mark that keeps you from circling a cycle forever.


    First, fix this lesson's small graph in mind: starting from A, A has two neighbors B and C, B leads to D, and C leads to E and F — 6 nodes and 5 edges in total. With no marks, you would bounce from A to C, back to A, and to C again, over and over; with no to-visit list, reaching a fork means choosing a path from memory, and missing a whole region is only a matter of time.


    Whether the to-visit list is a queue or a stack decides the visit order, the properties you can guarantee, and even the memory usage — that is this lesson's main thread. The shortest-path property of [[BFS]] and the backtracking nature of [[DFS]] both grow naturally out of these two containers' entry and exit rules.
