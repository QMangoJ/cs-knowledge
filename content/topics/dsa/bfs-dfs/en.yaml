- id: iterative-deepening
  title: "Iterative deepening: putting a depth limit on [[DFS]]"
  tldr: "Breadth-first guarantees finding the shallowest answer first, but has to hold an entire layer of nodes; depth-first holds only one path, but does not know how deep the answer is buried. This step looks at a compromise: run depth-first again and again with a depth limit loosened round by round — first what it buys you, then exactly how much the re-running wastes."
  body: >-
    DFS saves memory but does not know how far away the answer is; [[BFS]] guarantees finding a shallow answer first but eats memory. Iterative deepening is the compromise between the two: put a depth limit on DFS — first a limit of 0, looking only at the start, then a limit of 1 and a re-run, then a limit of
    2, loosening round by round until the target is found. Inside each round it is still ordinary depth-first — reach the limit and come back.


    The re-running looks wasteful, but the total work is in fact dominated by the last round: the number of nodes in a tree grows exponentially with depth, so all the earlier rounds added together do not amount to even a fraction of the last round, and the asymptotic cost is of the same order as running BFS directly. The return is memory proportional only to depth — the stack holds at most one path — which is the standard play in searches like game trees and theorem proving, where the depth is controllable and the branching is enormous.


    The variant [[IDA star|IDA*]] replaces the depth limit with a cost limit and prunes with a heuristic estimate; it is A-star's memory-saving relative. It suits only finding the shallowest or cheapest target: when the answer is buried very deep and each layer branches very little, the proportion wasted on re-running rises, and plain DFS or BFS is the more straightforward choice.
  derivation: original
  sources:
  - ref: mit-6006
    locator: Search lectures (iterative deepening and depth-limited search)
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: Iterative deepening combines the low memory of DFS with the shallowest-first property of BFS by loosening the depth limit round by round, and its total overhead is dominated by the deepest round
    status: verified
    checkedBy: Checked by Muse
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: The limit grows by 1 each round; the repetition of the early rounds is covered by the last round's order of magnitude
    rows:
    - label: Limit 0
      cells:
      - v: Look at the start only
    - label: Limit 1
      cells:
      - v: Re-run to layer 1
      - v: Not found
    - label: Limit 2
      cells:
      - v: Re-run to layer 2
      - v: Target found
        mark: found
    - label: Memory
      cells:
      - v: Stores one path only
        mark: found
      - v: Proportional to depth
  log:
  - mode: Iterative deepening
    event: "Once the depth limit is loosened round by round, all the re-run work of the early rounds adds up to less than a fraction of the last round — the total is dominated by the last round."
- id: walk-lab
  title: "Hands-on: the same graph, two walks"
  tldr: "The rules are all covered, and this step hands it over to you: switch between the two walks on the same graph, then change the start and walk each way once more, confirming with your own eyes that the visit order is decided by the container, not by the graph. Finally, deliberately move the visited mark to dequeue time, and check what goes wrong."
  body: >-
    The graph in the lab adds one node, G, and a few edges (C to D, D to F, E to F, E to G) to the graph from the main text, bringing it closer to the connectivity of a real graph. First walk it from A with [[BFS]] and note the order, then switch to [[DFS]] from A and compare: DFS dives into one branch first, then comes back to fill in the other side. Change the start (to G, say) and walk each way once more, verifying that the order is decided by the data structure, not by the graph.


    The observation sequence: fix BFS from A and copy down the queue's contents at each step, then switch to DFS and compare how the stack changes; then re-walk from a new start, G, and you will find that BFS still layers by distance, while DFS dives first into the branch nearest to G. Finally, think of a counterexample: if the visited mark were moved to dequeue time, would BFS
    enqueue nodes repeatedly? The change in the queue's length verifies it directly.


    The criterion for judging: the order in which nodes leave the queue or the stack is the visit order. Being able to say in advance who leaves the container next, and who will newly enter it, is what it means to really understand these two traversals.
  derivation: original
  sources: []
  log: []
  canvas:
    kind: lab
    lab: graph-walk
    caption: "Switch between BFS/DFS + any start; the queue/stack contents are visible in real time"
    cases:
    - input:
        mode: bfs
        start: A
      expect:
        order:
        - A
        - B
        - C
        - D
        - E
        - F
        - G
        visited: 7
    - input:
        mode: dfs
        start: A
      expect:
        order:
        - A
        - C
        - E
        - G
        - F
        - D
        - B
        visited: 7
- id: topo
  title: "[[DFS]]'s specialty: cycle detection and [[topological sorting|拓扑排序]]"
  tldr: "The timestamps and three states of depth-first were laid down earlier; this step looks at their most practical payoff: ordering dependencies. The scene is module building — when the dependency relationships are plain to see, how do you work the build order back out of the nodes' finish order, and why must you raise an error when you run into a cycle?"
  body: >-
    During DFS, give each node one of three states: not visited, currently being visited (on the current recursive path), or finished. Walking into a node that is currently being visited means there is a cycle — circular module dependencies, for example. In a directed graph with no cycles, arrange the nodes in reverse finish order, and every edge points from earlier to later — that is a topological sort, and [[npm]]
    installs and build tasks both decide their order by it.


    Walk the dependency graph on the canvas: starting from utils, go first to api; api's neighbor app has nothing after it, so finish app first, then come back and finish api; the other branch, ui, works the same way, and utils finishes last. The finish order is app, api, ui, utils; reversed, that is
    utils, ui, api, app — a build system executing in this order will never be missing a dependency.


    If app in turn depended on utils, nobody could finish first, and no topological order would exist — which is exactly the root reason circular dependencies must raise an error. There is also [[Kahn's algorithm|Kahn 算法]] to choose from: repeatedly remove nodes whose [[in-degree|入度]] is zero; if you cannot remove them all, there is a cycle. It naturally yields layers that can execute in parallel, and it is the more common choice in engineering.
  derivation: original
  sources:
  - ref: mit-6006
    locator: Graph search lectures
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: "If DFS walks into a node that is 'still on the current path', there is a cycle; reversing the finish order gives the dependency order."
    status: verified
    checkedBy: Checked by Muse
    checkedAt: 2026-11-07
    note: Verified against the primary source on 2026-11-07; see docs/curriculum-audit.md
  canvas:
    kind: datastate
    structure: graph
    caption: "An arrow X → Y means X must come before Y. Run DFS from utils, and the finish order reversed is the topological order"
    graph:
      directed: true
      nodes:
      - id: utils
        x: 10
        y: 50
        mark: done
        note: finishes 4th
      - id: api
        x: 50
        y: 15
        mark: done
        note: finishes 2nd
      - id: ui
        x: 50
        y: 85
        mark: done
        note: finishes 3rd
      - id: app
        x: 90
        y: 50
        mark: done
        note: finishes 1st
      edges:
      - from: utils
        to: api
      - from: utils
        to: ui
      - from: api
        to: app
      - from: ui
        to: app
    aux:
    - label: Finish order
      items:
      - app
      - api
      - ui
      - utils
    - label: Topological order (reversed)
      items:
      - utils
      - ui
      - api
      - app
    - label: Cycle detection
      items:
      - Walk into a node being visited → a cycle
  log:
  - mode: Topological sort
    event: "The topological sort is done: reversing the finish order of depth-first gives a build order that is never missing a dependency."
- id: scc-intro
  title: "A peek at [[strongly connected components|强连通分量]]: two [[DFS]] passes split the graph into clusters"
  tldr: "[[Topological sorting|拓扑排序]] only works on graphs without cycles, but real directed graphs have cycles everywhere. This step first circles mutually reachable nodes into a cluster, and shows how two depth-first traversals split the graph cluster by cluster, then compress the clusters into a cycle-free skeleton graph."
  body: >-
    In a directed graph, if u can reach v and v can also reach u, they are said to be mutually reachable and to belong to the same strongly connected component. Web crawling and dependency analysis often start by compressing the graph by component into a cycle-free skeleton graph before processing it: inside a component, treat it as one whole for now; between components, the dependencies run one way.


    [[Kosaraju|Kosaraju 算法]]'s algorithm needs just two DFS passes: the first pass, on the original graph, computes each node's finish time; the second pass reverses every edge and starts
    DFS on the reversed graph in decreasing order of finish time — each cluster one pass walks through is one component. The key is in the timestamps: the node with the largest finish time necessarily sits in some source component, and starting from it on the reversed graph happens to walk no further than that component, so the components are picked off cluster by cluster.


    A small example: a cycle A to B to C and back to A, plus C pointing to D, and D with no outgoing edges — then A, B, and C are one component, and D is a component of its own. This lesson asks only for an understanding of how the two passes divide the work and what the reversed graph is for; the full proof is developed in the advanced graph-algorithms material.
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 22.5 Strongly Connected Components
    claim: Kosaraju's algorithm finds all strongly connected components through the finish-time order of a DFS on the original graph and a second DFS on the reversed graph
    status: verified
    checkedBy: Checked by Muse
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: graph
    caption: The three nodes in the cycle are mutually reachable — one component; D is a component of its own
    graph:
      directed: true
      nodes:
      - id: A
        x: 15
        y: 20
        mark: found
      - id: B
        x: 55
        y: 20
        mark: found
      - id: C
        x: 35
        y: 70
        mark: found
      - id: D
        x: 90
        y: 70
        mark: visited
      edges:
      - from: A
        to: B
        mark: found
      - from: B
        to: C
        mark: found
      - from: C
        to: A
        mark: found
      - from: C
        to: D
    aux:
    - label: Component one
      items:
      - A, B, C (mutually reachable)
    - label: Component two
      items:
      - D
    - label: After contraction
      items:
      - Component one → component two (no cycles)
  log:
  - mode: Strong connectivity
    event: "Strongly connected components are picked off by the second pass: on the reversed graph, start depth-first in decreasing order of finish time, and each start walks through one whole cluster."
- id: union-find
  title: "Meet [[union-find|并查集]] along the way: only asking 'are they in the same group?'"
  tldr: "Every problem so far required actually walking the graph. But some problems never ask about paths at all — only whether two nodes are already connected. This step introduces a lightweight structure that manages connectivity alone, and shows how it answers such questions at nearly a single step's cost — and what it cannot answer, and which problems should be left to traversal."
  body: >-
    Friend-circle grouping, network connectivity, and Kruskal's minimum spanning tree asking whether adding an edge would form a cycle all ask the same thing: are two nodes already connected? Union-find (disjoint-set union) picks a representative (the tree root) for each set: find(x) follows parent pointers to the root of x, and union(a, b)
    hangs one tree under another. Neither of its two optimizations can be missing: merging by rank or by size (hanging the shorter tree under the taller one) plus path compression (when find runs, re-hanging the nodes along the way directly under the root). Used together, the amortized complexity of a single operation is nearly constant — α(n) (the inverse Ackermann function, which never exceeds 5 for any practical n).


    A worked example: initially every node is a group of its own. After union(A,B), B's root is A; after union(C,D), D's root is C; then union(B,E) hangs E onto the tree A sits in. From then on, find(E) follows E to B and then to A, obtaining the root
    A, and path compression re-hangs the nodes along the way under A, so the next lookup is a single step. To judge whether A and E are connected, just compare whether their two roots are the same.


    The division of labor: use traversal when you need to enumerate paths or orders; use union-find when you only ask about connectivity and edges are still being added dynamically. It remembers connectivity only — not paths — and still less can it answer shortest paths; that is [[BFS]]'s job.
  derivation: original
  sources:
  - ref: mit-6006
    locator: "Graph algorithm lectures: connectivity and union-find"
    claim: Union-find with path compression and union by rank achieves nearly constant amortized operation complexity
    status: verified
    checkedBy: Checked by Muse
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: graph
    caption: After union(A,B), union(C,D), and union(B,E), only two sets remain
    graph:
      nodes:
      - id: A
        x: 5
        y: 20
        mark: done
      - id: B
        x: 35
        y: 70
        mark: done
      - id: E
        x: 60
        y: 15
        mark: done
      - id: C
        x: 70
        y: 75
        mark: done
      - id: D
        x: 95
        y: 35
        mark: done
      edges:
      - from: A
        to: B
        mark: found
      - from: B
        to: E
        mark: found
      - from: C
        to: D
        mark: found
  log:
  - mode: Connectivity
    event: "To judge whether two nodes are connected, just compare their roots: the same root means already connected; different roots mean not yet connected."
- id: engineering
  title: How to choose in engineering
  tldr: "Finally, back to engineering choices: on the same graph, a different question calls for a completely different walk. This step matches each question to its walk — fewest steps, dependency order, counting connected pieces, dynamically adding edges — and uses the hop-count blow-up numbers to explain why graph search must limit its expansion depth."
  body: >-
    For how many degrees separate you from someone in a social network, use [[BFS]]; for a bundler analyzing module dependencies, detecting circular references, and deciding the build order, use [[DFS]] and [[topological sorting|拓扑排序]]; when React renders, it walks the component tree depth-first, processing the child nodes before the siblings.


    Concrete numbers: on a graph with an average degree of 10, BFS at 3 hops touches about 1,000 nodes, and at 4 hops about 10,000 — each additional hop multiplies the candidate set by an order of magnitude, which is why graph search APIs all limit the number of hops. Mazes and connected-component counting use DFS plus backtracking; printing a binary tree level by level and finding a graph's
    k-th-hop neighbors are, at bottom, the layering property of BFS at work.


    When counting connected components in an undirected graph, start one traversal from each unvisited node; the number of starts is the number of components. For dynamically added edges, use [[union-find|并查集]].
  derivation: original
  sources:
  - ref: mit-6006
    locator: Graph search lectures
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: DFS can be used for topological sorting and cycle detection
    status: verified
    checkedBy: Checked by Muse
    checkedAt: 2026-11-07
    note: Verified against the primary source on 2026-11-07; see docs/curriculum-audit.md
  canvas:
