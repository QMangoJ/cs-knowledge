    event: "Breadth-first is done: nodes were visited layer by layer by distance from A, and the number of edges traversed when each node was first reached is the minimum number of edges."
  code:
    lang: typescript
    code: |-
      // BFS: a queue is first-in, first-out → expand layer by layer; mark visited on enqueue to avoid duplicate enqueues
      function bfs(graph: Map<string, string[]>, start: string): string[] {
        const seen = new Set([start]); const q = [start]; const order: string[] = [];
        while (q.length) { const u = q.shift()!; order.push(u);
          for (const v of graph.get(u) ?? []) if (!seen.has(v)) { seen.add(v); q.push(v); } }
        return order;
      }
      // [[DFS]] turns the queue into a stack (or recursion): follow one path to the end, then come back
    note: TypeScript implementation
- id: dfs
  title: "[[DFS]]: follow one path to the end, then come back"
  tldr: "The queue walk is covered, and one container remains untried: the stack. This step switches to first-in, last-out and walks the same graph again, comparing the visit order against the previous step item by item, then explains why the recursive form is so convenient — and on what kind of graph it bursts."
  body: >-
    Walk it from A with DFS: arrive at A first, then choose neighbor B, dive from B down to D; D has no unvisited neighbors, so the path is at its end — retreat to B; B has no other neighbors either, so retreat to A and take C instead; dive from C to E, E reaches its end and retreats, then take F. The final order is
    A, B, D, C, E, F. Set against the [[BFS]] order A, B, C, D, E, F, the only difference comes from the container — the graph has not changed.


    In the recursive form, the system call stack saves the retreat path for you: entering a neighbor pushes one frame, and returning pops it automatically — which is also why DFS code is short. The price: if the graph is one very long chain, the recursion depth equals the number of nodes, and in real engineering a few tens of thousands of levels of recursion will overflow the stack; that is when you switch to an explicit stack and manage pushing and popping yourself.


    Note that the visit order of DFS is not unique: a different order of enumerating neighbors gives a different sequence — choose C before B, for example, and you dive into C's branch first. The structural property of depth-first does not change; what changes is the concrete sequence, so do not treat any one order as the only correct answer.
