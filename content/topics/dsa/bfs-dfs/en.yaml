order: 5
status: published
license: CC-BY-4.0
title: "BFS (Breadth-First Search) and DFS (Depth-First Search): Two Ways to Walk an Entire Graph"
summary: Breadth-first expands outward layer by layer; depth-first follows one path to the end, then comes back.
premise: A graph has many forks and may contain cycles — how do you walk the whole graph without missing any node and without going in circles around a cycle? Using a small graph of 6 nodes, this lesson answers that question — starting from node A, it walks the graph once with a queue and once with a stack, and compares the visit orders the two walks produce and the problems each walk is suited to.
position: This lesson opens the "Walking on Graphs" section. It follows the binary heap, which used index arithmetic to float up and sink down along parent–child chains, and generalizes the thing being walked from a complete binary tree without cycles to an arbitrary connected graph. After this lesson you will be able to explain why the visited mark must be set the moment a node is enqueued, and to use what a gray node means in the three-color marking to judge whether a DFS has run into a cycle.
bridge:
  prev: The previous lesson relied on the shape of a complete binary tree to let index arithmetic replace pointers. The graphs in this lesson have no such regular shape, so edges have to be stored in an [[adjacency list|邻接表]] instead, and a queue or a stack decides which way to go next.
  next: "The shortest path BFS computes by counting edges only holds in unweighted graphs. The next lesson, [[Dijkstra]], tackles what happens once edges carry weights of different lengths: why does the fewest steps no longer mean the shortest route?"
overview:
- key: In one sentence
  value: "[[BFS]] uses a queue and visits by distance, layer by layer; [[DFS]] uses a stack (or recursion), dives deep along one path, then backtracks. As an analogy: BFS is like ripples spreading outward in circles — whatever it reaches first is necessarily close to the start; DFS is like walking a maze by following one path to the end, and only retreating to try another path when you hit a wall."
- key: Complexity
  value: Both are [[O(V + E)|大 O 记号]] — that is, each node and each edge is looked at roughly once. For example, in a graph with 6 nodes and 5 edges, the workload is roughly the sum of the two, and it does not blow up just because some path winds around.
- key: What BFS is good at
  value: Shortest paths in unweighted graphs — the fewest steps needed to get there. Because BFS expands outward by distance, layer by layer, the first time it reaches a node, the number of steps taken is necessarily the smallest; any route that arrives later by detouring can only be longer or equal.
- key: What DFS is good at
  value: Enumerating all possibilities, detecting cycles, and [[topological sorting|拓扑排序]]. These problems require following a path all the way to the end before concluding anything — when ordering dependencies, for instance, you must first confirm that everything a module depends on has been processed before its own turn comes.
- key: In practice
  value: "React walks the component tree depth-first; the 'degrees of connection' people talk about in social networks are BFS; dependency analysis is DFS. For example, rendering a component means rendering it first and then its children — deep before shallow by nature — while finding friends of friends is, at bottom, expanding two layers outward from you."
- key: Storage
  value: "An [[adjacency list|邻接表]] takes O(V + E); an [[adjacency matrix|邻接矩阵]] takes O(V²). The list stores only edges that actually exist, so it is very economical when the graph is sparse; the matrix reserves a cell for every pair of nodes, so it balloons quadratically as nodes multiply — but checking whether an edge exists between two nodes takes a single glance at one cell."
- key: DFS's three colors
  value: White means unvisited, gray means on the current path, black means finished; in a directed graph, meeting a gray node means there is a cycle. Think of it this way — gray is the path you are currently walking and have not finished; if following an edge leads you back onto a node on this very path, you have looped around into a circle.
- key: Connected components
  value: Start a traversal from each unvisited node, and you can count how many pieces there are. One traversal can only walk the one piece whose nodes are mutually connected; if unvisited nodes remain after it finishes, they have no path connecting them to the piece before, so they form another piece.
- key: Watch out
  value: A recursive DFS can overflow the stack on a very deep graph; switch to an explicit stack. Each level of recursion pushes one more call frame, and an especially long chain will burst the stack; keeping your own stack in heap memory removes that ceiling.
