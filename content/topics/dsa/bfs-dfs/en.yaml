- id: complexity
  title: Why it is [[O(V + E)|大 O 记号]]
  tldr: "With the storage settled, settle the total account next: why do both traversals need only O(V + E)? This step counts, item by item, how many times each node and each edge is processed, then adds a memory account that is often missed — how much the queue and the stack each occupy in the worst case."
  body: |-
    With a visited mark, each node is processed only once — that is the V part. Processing a node looks at all of its edges, and added together that is the E part. In an undirected graph each edge is looked at once by each of its two endpoints; a constant factor does not change the order of magnitude, so the total running time is proportional to the size of the graph, and the only difference is the visit order.

    The memory account: at its widest, the [[BFS]] queue holds an entire layer of nodes; when the center of a star graph connects to a great many leaves, the queue's peak is of linear magnitude. The [[DFS]] stack is at its deepest equal to the length of the current path — also linear in the worst case, but on typical graphs usually much shallower. Comparing time but not space is the account most often left out.

    An engineering note: crawlers and [[RAG]] graph expansion commonly use BFS and expand only 2 hops of neighbors, because the node count grows exponentially with the number of hops; DFS, in turn, suits scenarios like dependency resolution that must go all the way to the end.

    Put into a real system, this account decides whether a traversal can be run in full: when a social graph has a billion users with an average of 100 friends each, the edges alone come to 100 billion, and the time and memory of one full traversal must be estimated at that magnitude. Only after doing that math do you understand why real systems must limit the number of expansion hops, or shard the graph before processing it.
