- id: timestamps
  title: "[[DFS]] timestamps and the four kinds of edges"
  tldr: "Both walks work now, but depth-first still holds a set of information that has not been used: the moment each node is discovered and the moment it is finished and left behind. This step records these two moments for every node, and shows how edge types, cycles, and ancestor relationships can be read off the moments — the foundation that [[topological sorting|拓扑排序]] and [[strongly connected components|强连通分量]] will build on later."
  body: >-
    DFS also comes with a standard piece of textbook bookkeeping: record two moments for each node — d, the moment it is first discovered, and f, the moment it leaves after all its neighbors have been processed — numbered by one global counter. Walking this graph in the order A, B, D, C, E, F, the numbering runs: A's d is 1, B's is 2, D's is
    3; D leaves first with f equal to 4, B leaves with f equal to 5; then C's d is 6, E's are 7 and 8, F's are 9 and 10, and finally C's f is 11 and A's f is 12.


    These intervals are either nested or disjoint; the nested ones are exactly the ancestor–descendant relationships — this is the [[parenthesis theorem|括号定理]]. In a directed graph, edges fall into four kinds by the state of the neighbor when the edge is examined: an edge to a white node is a tree edge; one pointing to a gray ancestor is a back edge, and its existence is equivalent to there being a cycle; and there are forward edges and cross edges, which point to finished nodes and can be told apart by comparing the two moments.


    The correctness of topological sorting and strongly connected components both rest on timestamps: being able to write down a visit order is only the first level — being able to reason about structural properties with timestamps is the depth the textbooks ask for.
