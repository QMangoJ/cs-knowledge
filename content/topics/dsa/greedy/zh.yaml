- id: practice
  title: 贪心在工程里的真实位置，与上岗自检三问
  tldr: 工程系统常把贪心当「够用且跑得快」的启发式规则直接上线；可只要场景要求严格最优，写贪心真正的成本不在那几行代码，而在上岗前的对拍与证明验收。
  body: |-
    回到真实的后端和系统工程，贪心规则其实满大街都在跑：操作系统调度里的最短作业优先、缓存淘汰里的 [[LRU]]（优先踢掉最久没用过的块）、网关限流优先放行高优先级请求，本质全是不回头的贪心。系统敢这么用，是因为线上目标本就带着动态噪声、追求的是「规则极简、微秒级决策、真实负载上效果够好」，而不是数学意义上的绝对满分。

    可换到算法题、账务分配、资源编排或路径计费这些要求「严格最优」的场合，贪心就是最危险的一类代码——写出来往往不到十行，看着顺理成章，错的时候却不崩溃不报错，悄悄产出一份格式完美但少赚了钱、多用了资源的假答案。让 AI 帮忙写代码时尤其要留神，模型随手甩出来的「看似有理」的贪心解法，没验过千万别直接信。

    把整课收成一套带得走的「贪心上岗三问清单」：第一问「能切分或等权吗」——能切分（如分数背包）、候选题等权（如无权活动选择）通常稳，一旦遇到整件离散取舍或带了不等权重，警铃先拉响；第二问「小数据对拍能扛住吗」——先花三分钟写暴力程序猛刷几万组小数据，抓出反例直接改用 DP；第三问「第一步能无损交换吗」——对拍过关后再走一遍交换论证，算清把任意最优解的第一步换成我的贪心选择总账不亏。三问全过再拍板，不过就退回 DP 建表保底。
