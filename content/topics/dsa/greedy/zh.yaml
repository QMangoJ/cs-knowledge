- id: huffman
  title: 贪心的正面标本：[[哈夫曼编码]]
  tldr: 每次把频率最低的两个字符绑成一对往上合，算出的编码树总代价 224 就是可证全局最优——因为最低频那两个符号在最优树里必定坐在最深层当兄弟。
  body: |-
    前面连续看了两个翻车案例，现在看一个靠交换论证拿下满分的正面标本：怎么给文件里的字符编一串最短的 01 二进制码？为了解码时不用插分隔符也能一口读出来，编码必须是[[前缀码]]（任意字符的编码都不能是另一个字符编码的开头）。直觉是给高频字符短码、低频字符长码，整份文件的总位数就是每个字符的「频率 × 编码长度」之和。

    [[哈夫曼编码]]的规则是自底向上合并：每次从池子里挑出频率最低的两个符号（或合并后的小组），绑成一对挂到新父节点下，把两者频率加起来当成新节点的权重丢回池子，直到合成一棵总树。拿经典频率跑一遍：f 是 5、e 是 9、c 是 12、b 是 13、d 是 16、a 是 45。第 1 步合最小的两个 5 和 9 得 14；第 2 步池子里最小是 12 和 13，合并得 25；第 3 步合 14 和 16 得 30；第 4 步合 25 和 30 得 55；最后 45 和 55 合成根 100。五次合并出来的节点权重加在一起：14 + 25 + 30 + 55 + 100 = 224——每次合并把底下所有叶子往深推一层，它们的频率就被多算一次，所以这笔总账正好就是整棵树的最优总加权代价 224。

    凭什么保证这么合并不会错过更省的树？还是靠[[交换论证]]：把任意最优树拿来，它最底层必定挂着一对兄弟节点；要是那两个位置坐着的不是频率最低的 f 和 e，直接把 f、e 跟最深层那两个高频家伙对调位置——高频的往上挪省了编码长度、低频的往下搬，总代价只降不升。确认了最低频俩兄弟在最深层（[[贪心选择性]]），合起来之后又变成少了一个字符的同形问题（[[最优子结构]]），归纳一步到底。相比之下，自顶向下把频率表劈两半递归的[[香农-法诺编码]]因为没这步交换担保，只能做到接近但未必最优；如今 [[gzip]] 压缩和 [[JPEG]] 图片编码里藏着的，正是这棵贪心合并出来的哈夫曼树。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 16.3 Huffman Codes
    claim: 反复合并两个最低频率的符号可构造最优前缀码，经典频率例的总成本为 224
    status: verified
