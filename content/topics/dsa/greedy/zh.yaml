- id: dijkstra-greedy
  title: 回看旧课：Dijkstra 本身就是一次贪心
  tldr: 每轮把 dist 最小者定案，靠的是边权非负这张入场券；出现负边，定案即翻车，要换 Bellman-Ford 的 DP 式松弛。
  body: '把图上行走板块的 Dijkstra 拿回贪心的法庭重审一遍。它的每一步是：从未定案的点里挑 dist 最小的那个，宣布它的最短距离就此定死，再也不改。这正是标准的贪心动作——当下最优、当场定案、永不反悔。

    它为什么敢？贪心选择性的担保来自边权非负：被定案的点 dist 最小，任何别的路线想绕到它，都得先经过另一个未定案的点（dist 不比它小），再走一条非负的边，只会更长不会更短。所以「最小者已定」这句话在非负世界里是定理。注意这份担保里里外外都押在非负上——与找零押在币制上、背包押在能切开上，是同一种结构性押注。

    放一条负边进来担保立刻崩。源点 S 到 A 是 2、到 B 是 4，B 到 A 有一条负边负 3，A 到 C 是 2，B 到 C 是 5。Dijkstra 先定案 A 等于 2（在场最小），再由 A 定案 C 等于 4。但真实最短路是 S 到 B 再借负边到 A：4 减 3 等于 1，A 的真实距离是 1 不是 2；C 的真实最优是 1 加 2 等于 3 不是 4。A 被定案的那一秒，通往真相的门已经关上，正是贪心翻车的标准姿势。

    负权场景的正解 Bellman-Ford 换了一个物种：它对所有边做 n 减 1 轮松弛，每轮都在「至多用 k 条边」的最优子问题上递推，这是写在图上的动态规划。同一个最短路问题，非负用贪心、负权用 DP，分界 again 是那道老问题：第一步定死，到底有没有人担保。'
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 24.3 Dijkstra 与 24.1 Bellman-Ford（非负前提的对照）
    claim: Dijkstra 的正确性依赖边权非负，负权下需改用基于松弛递推的 Bellman-Ford
