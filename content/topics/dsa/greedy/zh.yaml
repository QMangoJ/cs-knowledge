- id: interval-family
  title: 区间家族：带上权重，贪心就出局
  tldr: 所有活动等权算个数时，按最早结束贪心稳赢；可一旦每场标上不同收益，短而早结束的活动会堵死高收益长活动（2 分输给 100 分），算法必须整个换回动态规划。
  body: |-
    开头的活动安排问题还有一串亲戚，能不能贪，全看规则里有没有引入不平等的权重。比如「所有活动都得办，最少要租几间会议室」，可以按开始时间排个序、用小顶堆盯着每间会议室什么时候空出来，贪心稳赢；再比如区间覆盖问题，挑从当前覆盖终点往右伸得最远的区间，也能用交换论证保过。它们的共性只有一个：每场活动地位平等，只数个数。

    可只要给每场活动贴上不同的赚钱金额，格局瞬间变质。看画布里三场活动：J1 从 0 到 10 点、收益 100；J2 从 0 到 5 点、收益 1；J3 从 5 到 10 点、收益 1。如果还傻傻按结束时间最早去贪心，先拿 J2 再接 J3，忙活一天只赚 2 分，反而把独霸全场的 J1 永久堵在门外；最优解明显是只办 J1，稳赚 100 分。

    加上权重后，这题就变成了上一课家族里的[[带权区间调度]]：按结束时间排完序，对每场活动算「办它（收益加前面最后一个不冲突活动的最优收益）」和「不办它（沿用前一场的最优收益）」，两条路都算过再挑大的。同样是排日程，等权时贪心满分，多加一列收益数字，[[贪心选择性]]立刻阵亡、必须换回 DP。以后遇到任何区间调度题，第一反应先问一句：「所有区间地位平等吗？」等权才敢试贪心，带权直接写 DP。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 16.1 与 15.2 附近（活动选择与带权变体的对照）
    claim: 等权活动选择可贪心，带权区间调度需要用动态规划按结束时间排序后递推
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
  canvas:
    kind: datastate
    structure: array
    caption: 带权之后：贪心拿 J2 加 J3 共 2 分，最优是单独拿 J1 的 100 分
    rows:
