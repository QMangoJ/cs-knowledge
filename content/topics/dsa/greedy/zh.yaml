design:
- mechanism: 永不反悔的单向决策：每步锁定一个局部最优并剪掉其余分支，把指数级的决策树压成一条链，前提是贪心选择性为每一步担保
  problem: 组合优化的决策空间随规模指数膨胀，逐一比较所有完整方案不可能；动态规划靠存表把重复计算压下来，但状态空间本身也会膨胀，很多问题在结构上其实允许走得更绝：一步都不回头。
  choice: 只在能证明「存在最优解包含这一步选择」时才允许当场定死。替代方案是全量动态规划，通用可靠但要为整张状态表付时间与内存；替代方案之二是无担保的启发式贪心，快则快矣，错误时静默地产出错误答案，连告警都没有。
  tradeoff: 适用面被两道检查卡得很窄：结构不满足时贪心不是慢，而是直接错，且错得毫无征兆。为这份脆弱换来的，是排序级或线性级的复杂度与几行就能写完的实现。
  root: 交换论证揭示了担保的来源：当局部选择与任意最优解之间存在一步可替换的单调关系时，局部与全局便被焊接在一起；拟阵理论进一步证明，独立性加交换公理恰好完备地刻画了这类结构。贪心的对错从来不是手感问题，而是结构定理问题。
- mechanism: 哈夫曼的自底向上合并：每步合并两个最低频率的符号，用「最低频者必在最优树最深层做兄弟」这一结构洞察，把编码树的搜索变成一串被担保的合并
  problem: 前缀码的候选空间是所有二叉树，无法枚举；而编码成本由每个符号的频率乘深度决定，高频与低频符号在树里的位置必须被精确安排，任何凭直觉的摆放都说不清离最优有多远。
  choice: 自底向上合并最低频两者，每合并一次问题规模减一且保持同形。替代的自顶向下路线（按频率劈分符号表再递归）每一步的劈分都没有交换论证撑腰，只能得到近似最优；替代的穷举加 DP 在符号数稍大时就不可行。
  tradeoff: 需要先完整统计频率，是离线算法；数据流式到达、分布未知时要改用自适应哈夫曼并付出更高的实现与维护成本。换来的则是可证最优与极低的运行开销。
  root: 这是贪心选择性与最优子结构同时满格的范例：最低频两符号在最优树最深层做兄弟，可以由一次成本不增的交换严格推出。贪心在这里不是经验法则，而是定理的直接推论——它提醒我们，判断一个贪心是否可信，标准只有一个：交换论证写不写得出来。
- mechanism: 反例优先的验证纪律：新贪心规则先接受小规模暴力对拍的证伪，再接受交换论证的证明，两道都过才算数
  problem: 贪心失效的方式极其阴险：不崩溃、不超时、不告警，只是默默给出一个看起来完全正常的错误答案。凭直觉「看起来对」的贪心（找零、性价比背包）恰好是最容易错的一类，而写下它的人往往最确信它是对的。
  choice: 用不对称的验证顺序对冲这份阴险：先用随机小数据加暴力最优解对拍，全力证伪；证不倒，再坐下来补交换论证。替代做法如只凭直觉与一两个手算样例就上线，等于把正确性外包给运气；如只写证明不对拍，则证明本身的笔误无人复核。
  tradeoff: 对拍只能证伪、永远不能证真，覆盖不到的边角仍可能藏着反例；交换论证再严谨，也可能在某个隐含假设上翻车。两道纪律叠加也只是把漏网概率压低，而不是归零。
  root: 这是证伪不对称性在工程上的投影：一个反例对「规则正确」的否定是完备的，一万个通过的样例对它的肯定仍不完备。所以理性的验证顺序必然是先全力找反例、再寻求证明——顺序反过来，成本最低的那道防线就被浪费了。
level: 进阶
minutes: 30
prereq: [dsa/dynamic-programming]
objectives:
- 用贪心选择性与最优子结构两道检查预判一个问题能否贪心
- 用交换论证证明活动选择、哈夫曼合并与最小生成树的贪心步骤
- 用反例否决任意币制找零与 0/1 背包的性价比贪心
- 说清 Dijkstra 的正确性为何押在边权非负上
aiLink: 贪心在 AI 工程里同样是默认启发式：解码时的贪心搜索（每步取概率最大的 token）就是无担保版贪心，与 beam search 的对照正好是本课「只走一条路对枚举比较」的翻版；理解它何时翻车，才理解为什么长文本生成里贪心解码容易重复与早停。
