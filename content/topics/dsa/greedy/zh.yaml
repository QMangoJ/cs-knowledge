    aux:
    - label: 贪心结果
      items: [a1, a4, a5, 共 3 场]
  log:
  - mode: 规则
    event: 每步挑结束最早且不冲突的一场，选过不再重议
  points:
  - 贪心的两个特征：选择当场定死，全程不存表、不回溯
  - 它是否正确是问题结构的问题，不是算法技巧的问题
- id: activity-proof
  title: 为什么活动选择能贪：交换论证
  tldr: 任取一个最优排法，把它的第一场换成结束最早的 a1，总账只多不少，余下部分与原子问题同形。
  body: '证明贪心正确的通用工具是交换论证，它有固定的三段式。先任取某个最优解（你不知道它长什么样，没关系，它存在即可），看它的第一场活动是谁，记为 x。再执行一次交换：把 x 换成贪心选的 a1（结束最早的那场），论证换完之后的方案仍然可行、场数不变。最后指出：换完之后，剩下要排的是「a1 结束之后开始的活动」这个与原问题完全同形的子问题，于是可以对子问题重复同样的论证，一路换到底，整个最优解就被改造成了贪心解。

    交换这一步为什么总成立？关键只在一条：a1 是所有活动里结束最早的，所以 a1 的结束时间不晚于 x 的结束时间。把 x 换成 a1 后，空出来的时间只多不少，原方案里排在 x 后面的活动原本就不与 x 冲突（它们都开始于 x 结束之后），自然更不会与结束得更早的 a1 冲突。可行性保住，场数一分未减，一次交换完成。

    这种「存在一个最优解包含贪心这一步选择」的性质，叫贪心选择性。它是贪心算法的入场券：没有它，第一步就可能把最优解的大门关死。注意交换论证的着力点永远在第一步，因为后续每一步都是某个子问题的第一步，归纳地滚下去，全程的选择便都被担保了。

    还剩另一半：换掉第一步之后，余下的问题必须与原问题同形且彼此独立，这个性质叫最优子结构，下一课专门把它与贪心选择性并排过堂。'
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 16.1（贪心选择性的交换论证）
    claim: 最优解的首个活动可替换为最早结束的活动而不减少场数，这是活动选择贪心正确性的核心论证
