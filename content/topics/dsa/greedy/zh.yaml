  - 贪心解法的成本主要在验收，不在实现
design:
- mechanism: 永不反悔的单向决策：每步锁定一个局部最优并把其余分支直接剪掉，前提是贪心选择性替这步担保
  problem: 很多优化问题的候选方案会随规模指数爆炸，全比一遍根本算不完；动态规划靠建表把复杂度压下来，可建表也要时间与内存——其实不少问题根本用不着回头算第二条路。
  choice: 只有能证明「至少有一个全局最优解包含眼前这一步」时，才敢当场定死。如果证不出来，要么退回全量 DP 存表保底，要么明确承认它只是「求快不保满分」的启发式。
  tradeoff: 适用面被卡得很窄：结构不满足时贪心不会报错也不会变慢，只会静默地算出一份看起来很正常的错答案；但一旦结构站得住，换来的是排序级或线性级的极速与几行代码。
  root: 交换论证就是这份担保的来源：只要能把任意最优解的第一步无损换成贪心的那一步，局部最优和全局最优就被焊死在了一起；拟阵理论证明独立性加交换公理恰好框住了这一整类结构。
- mechanism: 哈夫曼的自底向上合并：每次把频率最低的两个符号绑成一对，靠「最低频俩兄弟必坐在最优树最深层」把指数级搜索变成几步确定的合并
  problem: 前缀码的候选二叉树多到没法枚举，而且总位数等于每个字符的频率乘深度之和，高频和低频符号摆错一层总成本就差很多，光靠拍脑袋切分说不清离最优差多远。
  choice: 从底层往上每次合并最小两个频率，规模减 1 且保持同形。替代方案是自顶向下把频率表劈成两半递归（香农-法诺编码），每刀切分都没有交换论证撑腰，只能得到接近但未必最优的结果。
  tradeoff: 需要先扫完一遍数据统计完整频率，属于离线做法；要是数据流式到达、分布事前未知，就得改用自适应哈夫曼并付出更高实现成本，换来的是静态场景下可证最优。
  root: 这是贪心两道检查同时满格的样板：把最深层随便两个点换成最低频那两个点总账只省不亏，说明第一步必对；合并后问题减一且同形，归纳一路滚到底。
- mechanism: 反例优先的验证纪律：新想出的贪心规则，先拿小规模暴力程序对拍找反例，抓不出来再写交换论证，两关都过才准上线
  problem: 贪心失效的姿势非常阴险：不崩溃、不超时、不告警，只是默默吐出一个格式完全正确的次优甚至错误答案，而且越是「直觉看着特对」的规则（找 1/3/4 零钱、按性价比装 0/1 背包）越容易中招。
  choice: 先花三分钟写个穷举或小 DP 对拍器猛刷几万组小数据全力证伪，证不倒再坐下写交换论证；如果反过来只凭一两个手算例子直接写证明，证明里的隐含漏洞极容易漏网。
  tradeoff: 对拍只能抓出反例、永远证不了绝对正确，小数据覆盖不到的边界仍可能有雷；证明本身也可能漏掉前提，两道防线叠在一起才能把翻车概率压到最低。
  root: 一个反例就能彻底枪毙一条贪心规则，而一万个通过的样例也证明不了它全对——所以理性的验证顺序必然是先把成本最低的对拍证伪放最前面，防住大部分想当然的坑。
level: 进阶
minutes: 30
prereq:
- dsa/dynamic-programming
objectives:
- 用贪心选择性与最优子结构两道检查预判一个问题能否贪心
- 用交换论证证明活动选择、哈夫曼合并与最小生成树的贪心步骤
- 用反例否决任意币制找零与 0/1 背包的性价比贪心
- 说清 Dijkstra 的正确性为何押在边权非负上
aiLink: 贪心在 AI 工程里同样是默认启发式：解码时的贪心搜索（每步取概率最大的 token）就是无担保版贪心，与 beam search
  的对照正好是本课「只走一条路对枚举比较」的翻版；理解它何时翻车，才理解为什么长文本生成里贪心解码容易重复与早停。
