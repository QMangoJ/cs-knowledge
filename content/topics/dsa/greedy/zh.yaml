  - 工程顺序固定：先对拍找反例，再补交换论证
- id: practice
  title: 贪心在工程里的真实位置
  tldr: 贪心是工程默认的思考起点：规则简单、实现便宜；它的危险也来自这份便宜——成立之前，人人都会先想到它。
  body: '把镜头拉回日常工程，贪心无处不在，而且多数时候是以「合理默认」的身份在跑。操作系统里最短作业优先的思想、HTTP 服务器按某种优先级先处理短请求、缓存按最近最少使用淘汰、限流器先放行高优先级流量——很多都是贪心规则在直接上岗。它们被选中，不是因为谁证明过全局最优，而是因为规则足够简单、决策足够快、效果在真实负载上足够好。

    这种「足够好」与本课较真的「可证最优」是两个层次，不能混为一谈。本课审判的是算法意义上的正确性：题目要求最优解、且错误无提示时，只有通过两道检查的贪心才有资格替代 DP。而在工程系统里，目标函数常是模糊的（延迟、公平、成本混在一起），贪心更多是启发式：先上线一条简单规则，用真实数据量它的账，量出问题了再升级策略。把启发式当定理用，和把定理当启发式用，是同一种糊涂的两个方向。

    今天还有一层新现实：写代码时让 AI 或模板先给出一个贪心解法，速度只要几秒。可本课的结论恰恰说，贪心是最经不起「看起来对」的一类算法——它的错误静默、反例常在手边、正确性全押在问题结构上。所以对贪心解法的验收流程也最该被固定下来：先问两道检查，再跑一轮对拍，最后才讨论复杂度。规则本身几行就能写完，验收才是贪心真正的成本所在。

    收束全课：贪心不是一种算法，而是一种赌注——赌问题结构允许你不回头。本课给你的，是下注之前验牌的完整方法。'
