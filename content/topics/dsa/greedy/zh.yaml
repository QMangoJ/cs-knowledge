- id: two-conditions
  title: 两道检查：[[贪心选择性]]与[[最优子结构]]
  tldr: 贪心和 DP 分道扬镳的分水岭就在这两关：DP 只需「子最优能拼出全局最优」，贪心还必须多过一关「局部眼前最优确实在某个全局最优解里」。
  body: |-
    把刚才活动安排露面的两道检查摆正、并排说清。第一道是「[[最优子结构]]」：定下这一步后，剩下的残局必须是一个独立、同形的小问题，能各自算出最优解再直接拼回来，不能跟前面选过的东西互相纠缠。这是动态规划和贪心共同的地基，地基塌了，连「选完一步再看剩下的」都没法拆。

    第二道是贪心独有的入场券——「[[贪心选择性]]」：必须保证至少有一个全局最优解，它里面真的包含贪心规则眼前挑出的那一步。换句话说，你这一刀切下去，绝不能把所有满分方案都关在门外。

    为什么动态规划不需要这第二道检查？因为 DP 胆子小、账算得全——站在岔路口时，DP 不会瞎猜哪条路最好，而是把每条分支的残局都算一遍存进表里，最后看总账谁大选谁，表会兜底。贪心则站在路口直接把其他分支一刀剪掉、永不回头，敢这么剪的唯一底气，就是贪心选择性替它担保「被剪掉的分支里就算有好方案，也不会比眼前这条更好」。
  derivation: original
