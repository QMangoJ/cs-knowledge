- id: knapsack-boundary
  title: 与 DP 的分界：分数背包能贪，0/1 背包不能
  tldr: 物品能切开时按性价比贪心可证正确；物品只能整拿整放时，同一个规则被一个反例直接击毙。
  body: '背包问题有一个分岔口。容量 50 的背包前有三件物品：A 重 10、值 60，性价比 6；B 重 20、值 100，性价比 5；C 重 30、值 120，性价比 4。若物品可以切开（比如装的是金粉），贪心按性价比从高到低装：A 全装、B 全装，剩 20 容量切 C 的三分之二，总价值 60 加 100 加 80 等于 240。这时贪心是对的，交换论证成立：任何最优装法若在高性价比物品上留了空、却装了低性价比物品，把两者等量互换只赚不亏。

    若物品只能整拿整放（0/1 背包），同一条规则立刻翻车。贪心先拿 A 再拿 B，容量用掉 30、价值 160，剩 20 装不下 C，只能收工。而最优解是扔掉 A，拿 B 加 C：重量正好 50，价值 220。差出 60 的价值，贪心毫无察觉。

    分界的机关在「切开」二字。能切开时，容量永远不会被一件装不下的物品卡死浪费掉，性价比的排序可以被填满到最后一克，交换论证的每一步都严丝合缝。不能切开时，装不下的那部分容量成了结构性浪费，「拿哪件」的取舍变成了真正的组合决策，第一步定死就可能把 220 的组合挤出门外。这正是上一课 DP 大显身手的地方：0/1 背包的状态表（物品数乘容量）就是为了把这种组合决策一格一格算清楚。

    由此得到一条耐用的判据：一个问题越是「连续、能切分」，越可能通过贪心选择性；越是「离散、整件取舍」，越要警惕，默认先按 DP 方向想。'
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 16.2（分数背包与 0/1 背包的对照）
    claim: 分数背包按单位重量价值贪心可证最优，0/1 背包不具备贪心选择性、要用动态规划
    status: verified
