  points:
  - 区间问题的第一问：各候选等权吗
  - 带权区间调度是 DP 的标准形态，不是贪心的改良版
- id: mst
  title: "[[最小生成树]]：[[切割性质]]撑腰的贪心"
  tldr: Kruskal 每次选一条不成环的最便宜光缆就能连出总造价 13 的全网最小生成树，背后站台的是切割性质——跨过任意一刀的最便宜边，交换论证保证它一定属于某棵最优树。
  body: |-
    把场景搬到给六个基站铺光缆：每条候选线路有造价，要求把 6 个点全部连通、总造价最低（也就是铺满 5 条边且不能绕成多余的环——这就是[[最小生成树]]）。[[Kruskal]] 算法的做法极其干脆：把所有候选光缆按造价从低到高排好队，挨个检查，只要这条线连着的是两个还没互通的片区就立刻拍板铺下，要是两边本来就通了（铺上去会绕成环）就跳过，凑够 5 条边收工。配合[[并查集]]记着谁跟谁是一伙的，查一次是否成环几乎是常数时间。

    跟着画布里 6 个点、9 条线的账目实际走一遍：线路按造价排队是 BC 为 1、AC 为 2、DE 为 2、EF 为 3、AB 为 4、BD 为 5、DF 为 6、CD 为 8、CE 为 10。先拿下 BC(1) 和 AC(2)，A、B、C 连成一片；接着拿下 DE(2) 和 EF(3)，D、E、F 连成另一片；轮到造价 4 的 AB 时，并查集一查发现 A 和 B 已经在同一片里了，铺上去纯属成环浪费，果断跳过；最后铺上造价 5 的 BD 把两大片接通，正好 5 条边连通全网，总造价 1 加 2 加 2 加 3 加 5 等于 13，后面 6、8、10 的边看都不用看了。

    为什么每次敢挑最便宜且不成环的那条？底气来自[[切割性质]]：无论你拿一把剪刀把全图任意切成两半，所有跨过刀口的最便宜那条边，必然躺在一棵最小生成树里。证明照样是交换论证：假设有棵最优树没选这条便宜边，把它硬塞进树里必定会形成一个环，环上总有另一条同样跨过刀口的旧边比它贵（或一样贵），把旧边剪掉换成它，全网照样连通，总造价一分不涨！另一条路线 [[Prim]] 从一个点往外慢慢长，每次挑连着树内和树外的最便宜边，本质上是同一条切割性质换了个切法执行而已。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 23 Minimum Spanning Trees（切割性质与 Kruskal）
    claim: 跨越任意切割的最小权边必属于某棵最小生成树，Kruskal 按边权递增且避环地选边得到最优解
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
