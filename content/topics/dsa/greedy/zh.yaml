title: 贪心：每步只取眼前最优，为什么有时就是对的
summary: 贪心不回头、不存表，每步把选择当场定死。它成立与否不取决于直觉，而取决于问题是否同时具备贪心选择性与最优子结构。
premise: 以一天里安排最多场互不冲突的活动、和一台按性价比装货的背包为例。
position: >-
  动态规划那课的结尾留了一个问题：子问题重叠时要存表，可如果每一步的选择根本不必回头，存表就是纯粹的浪费。本课开新板块「贪心：每步只取眼前最优」，用活动选择、找零反例与背包分界，量出贪心这条捷径的适用范围。学完你能用贪心选择性与最优子结构两道检查预判一个问题能不能贪，能亲手用交换论证证明活动选择、也能用一个反例当场否决按性价比装 0/1 背包。
bridge:
  prev: >-
    上一课动态规划靠存表躲开重复子问题，前提是每个子问题都值得先算一遍；本课换个问法：如果某一步的最优选择当场就能定死、之后永不反悔，表还有必要存吗？
  next: >-
    贪心处理的是在候选集合里反复做选择的问题，下一课换一类对象：一整段长文本里找一小段短模式。朴素地逐位比对会把同一个字符反复比上许多遍，那种浪费的形态，和动态规划之前见过的重复子问题惊人地像。
overview:
- key: 一句话总结
  value: 贪心每步定死一个局部最优选择，永不反悔、永不回溯
- key: 成立的两道检查
  value: 贪心选择性（存在最优解包含这步选择）加最优子结构（选完后子问题同形且独立）
- key: 与 DP 的分界
  value: DP 枚举选择并存表比较，贪心只走一条路；分数背包能贪，0/1 背包不能
- key: 证明工具
  value: 交换论证：把任意最优解的第一步换成贪心选择，总账不亏
- key: 否决工具
  value: 一个反例就够：币制 1、3、4 找 6 元，贪心给 3 枚、最优只要 2 枚
- key: 统一框架
  value: 拟阵刻画了贪心正确的全部结构，活动选择与最小生成树都是它的实例
