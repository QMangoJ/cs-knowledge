  log:
  - mode: 门槛
    event: 两道检查是贪心的入场券，缺一不可
  points:
  - 贪心 = 最优子结构（与 DP 共有）+ 贪心选择性（贪心独有）
  - 证不出贪心选择性时，正确做法是退回 DP，不是硬贪
- id: coin-counterexample
  title: 反例登场：找零钱为什么会翻车
  tldr: 币制 1、3、4 找 6 元，贪心给 4+1+1 共三枚，最优是 3+3 两枚。贪心错的时候，不报错、不提示。
  body: '找零钱问题是这样：给定一组硬币面额与目标金额，用最少的硬币凑出金额。贪心规则显而易见：每次先用能用的最大面额。拿它对付美元或人民币这类现实币制，它给出的确实是最优解，收银台几百年来都这么干。

    但把币制换成 1、3、4 三种面额，目标是凑 6 元。贪心先抓最大的 4，剩 2 元只能用两枚 1，总共三枚。而 3 加 3 两枚就够了。贪心在这里不是慢，是直接给出错误答案，而且它不会举手告诉你错了，输出看起来和正确答案一模一样地体面。

    用两道检查复盘这次翻车。最优子结构没问题：凑出最优解后拿走任意一枚，剩下的仍是其子金额的最优凑法。坏在贪心选择性：这一步选最大面额 4，并不存在一个包含 4 的最优解，因为最优解 3+3 根本不用 4。第一步定死 4 的瞬间，最优的大门已经关上，后面再怎么补救也回不来。

    那么现实币制为什么没事？因为美元、人民币这类币制的面额结构恰好通过了贪心选择性——这不是找零问题的天性，而是币制设计的结果，甚至可以说，现实中通行的币制多少都经过了「让贪心成立」的筛选。换币制就换结论，这正是本课反复要敲的警钟：贪心的正确性是对具体问题结构的一次性判决，不存在「贪心一般都对」这种事。'
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 16 Greedy Algorithms（找零问题的币制依赖性讨论）
