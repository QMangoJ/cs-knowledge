- id: huffman
  title: 贪心的正面标本：哈夫曼编码
  tldr: 每次把频率最小的两个符号合并成一个新节点，直到只剩一棵树——这棵树给出的就是最优前缀码。
  body: '前缀码要求任何符号的编码都不是另一个的前缀，这样解码时才不需要分隔符。给高频符号短码、低频符号长码，总成本等于每个符号的频率乘以码长再求和。问题是：面对字符频率表，怎样构造一棵编码树让总成本最小？

    哈夫曼的贪心规则是自底向上的：每次取出频率最小的两个符号（或已合并的组），把它们挂到一个新父节点下，新节点的频率是两者之和，再放回去继续合并，直到只剩一个根。拿一组经典频率演示：f 是 5，e 是 9，c 是 12，b 是 13，d 是 16，a 是 45。先合并 5 与 9 得 14；再合并 12 与 13 得 25；再合并 14 与 16 得 30；再合并 25 与 30 得 55；最后 45 与 55 合并成 100。五次合并的成本相加是 14 加 25 加 30 加 55 加 100 等于 224，这就是这棵树的总加权成本。

    为什么合并最小两者是对的？第一，贪心选择性：频率最低的两个符号，在某棵最优树里必定位于最深层且互为兄弟——若最深层坐着别的符号，把它与低频符号交换，成本只降不升（交换论证的又一次现身）；把这对兄弟合并成一个符号后，问题变成规模减一的同形问题，最优子结构接管。第二，两道检查齐了，归纳便能滚完：哈夫曼的每一步都被担保，最终的树可证最优，不是启发式、不是近似。

    对照自顶向下的香农-法诺编码（按频率把符号表劈成两半再递归），它只能给出接近但未必最优的码。方向之差就是检查之差：自底向上的合并有交换论证撑腰，自顶向下的切分没有。gzip 与 JPEG 里躺着的哈夫曼树，就是这条贪心规则一百多年身价的日常形态。'
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 16.3 Huffman Codes
    claim: 反复合并两个最低频率的符号可构造最优前缀码，经典频率例的总成本为 224
    status: verified
