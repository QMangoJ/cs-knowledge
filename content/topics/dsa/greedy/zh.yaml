- id: dijkstra-greedy
  title: 回看旧课：[[Dijkstra]] 本身就是一次贪心
  tldr: Dijkstra 每轮把距离最小的未定案节点当场锁死，就是标准的贪心动作；它全靠「边权非负」担保绕路只会更长，只要混进一条负权边，锁死的答案当场翻车。
  body: |-
    回过头重审之前图论学过的 [[Dijkstra]] 算法，你会发现它骨子里就是一次标准贪心。每轮从未定案的节点里挑当前 dist 最小的那个点，当众宣布它的最短距离就此锁死、以后再也不改——这就是典型的一步定死、永不反悔。

    它凭什么敢这么早拍板？全押在「所有边的权重都大于等于 0」这一个前提上。既然当前选出的节点 u 是所有未定案节点里离起点最近的，那么其他任何路线想绕道过来，光在半路上经过别的未定案节点就已经不比 dist[u] 短了，接下来还要再走一条非负权重的边，总路程只会越走越长、绝不可能反超变短。

    往图里塞进一条负边，这份担保立刻崩盘。看画布里的 4 个点：S 到 A 是 2、S 到 B 是 4、B 到 A 有一条负边负 3、A 到 C 是 2、B 到 C 是 5。Dijkstra 第一轮看 A(2) 比 B(4) 小，立刻把 A 的最短路锁死成 2，紧接着顺手把 C 算成 2 加 2 等于 4。可真实世界里，从 S 先走 4 到 B 再借负边负 3 拐回 A，总路程只要 4 减 3 等于 1！连带 C 的真实最短路也是 1 加 2 等于 3 而不是 4。一旦存在负权边，就得请出 [[Bellman-Ford]] 换回动态规划思路：老老实实对所有边跑 n 减 1 轮松弛递推，不急着提前封板。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 24.3 Dijkstra 与 24.1 Bellman-Ford（非负前提的对照）
    claim: Dijkstra 的正确性依赖边权非负，负权下需改用基于松弛递推的 Bellman-Ford
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
  canvas:
    kind: datastate
