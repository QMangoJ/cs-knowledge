  - 现实币制能贪，是币制结构通过了检查，不是问题本身的恩赐
  mistake: 拿「现实中找零都这么找」当贪心正确的证据：那只能证明这套币制被设计（或筛选）得能通过贪心选择性。
- id: knapsack-boundary
  title: 与 DP 的分界：分数背包能贪，0/1 背包不能
  tldr: 同一个装包问题，金粉能切开装时按性价比贪心稳拿满分 240；物品必须整件拿放时，贪心拿 A+B 只值 160、输给 B+C 的 220——分水岭就在能不能切开。
  body: |-
    再看动态规划里算过的背包问题，这次把它和贪心放到同一个天平上，分水岭会清清楚楚。背包容量 50 斤，面前三件货：A 重 10 斤值 60 元（性价比 6），B 重 20 斤值 100 元（性价比 5），C 重 30 斤值 120 元（性价比 4）。如果装的是金粉，允许切开散装（分数背包），按性价比从高到低装：先把 A 全装上（10 斤值 60），再把 B 全装上（20 斤值 100），剩下 20 斤正好切走 C 的三分之二（值 80），总价值 240。这回贪心是对的：任何最优装法如果没把高性价比金粉装完、反而背着低性价比金粉，把低性价比金粉倒掉一斤换高性价比金粉，总价值只增不减，[[交换论证]]严丝合缝。

    现在把金粉换成整块金砖，只能整件拿或不拿（0/1 背包），同样的性价比规则立刻翻车。贪心先抢性价比最高的 A（10 斤、60 元）和次高的 B（20 斤、100 元），包里用掉 30 斤、总价 160，剩下 20 斤装不下重 30 斤的 C，只能干瞪眼收工。可最优解是干脆放弃性价比最高的 A，改拿 B 加 C：正好凑满 50 斤，总价值 220，凭空多赚 60 元！

    为什么只差「能不能切开」三个字，命运就完全反过来？能切开时，背包总能被高性价比货物严丝合缝填满到最后一克，不存在装不下的死角；一旦变成整件离散取舍，单件大块头会留下一截塞不进东西的零头空隙，局部性价比最高的 A 反而把容量拆碎了，逼着你必须用上一课的 DP 状态表去权衡组合。以后遇到资源分配题记住一句判据：连续、能拆分的优先试贪心，整件、不可分的先往 DP 想。
  derivation: original
