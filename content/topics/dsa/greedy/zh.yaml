  - 它的正确性同样来自交换论证，与活动选择同源
- id: interval-family
  title: 区间家族：带上权重，贪心就出局
  tldr: 活动选择的变体里，只要给每场活动标上不同的收益，按结束时间贪心立刻失效，必须请回 DP。
  body: '活动选择还有一串亲戚，先把能贪的认全。最少会议室问题（所有活动都要办，最少需要几间会议室）可以按开始时间扫描、用优先队列维护每间会议室的释放时刻，贪心成立；区间划分、给司机排班这类「资源最少化」问题大多同属此类。再如区间覆盖的某些形态，选最少个区间盖满一段路，贪心挑「从当前点出发伸得最远的区间」也可证正确。这些问题的共同点是：所有活动的地位平等，计较的只是数量。

    给每场活动标上收益，局面立刻变质。活动 J1 从 0 到 10、收益 100；J2 从 0 到 5、收益 1；J3 从 5 到 10、收益 1。按结束时间贪心会先拿 J2 再拿 J3，总收益 2，把横跨全程的 J1 永久挡在门外；而最优显然是单独办 J1，收益 100。按结束最早选在这里输得毫无悬念：它平等地对待每场活动，可收益根本不平等，第一步的取舍变成了带权组合决策。

    带权区间调度正是 DP 的标准例题：按结束时间排序后，对每场活动算「办它，则加上它之前最后一个不冲突活动的最优收益」与「不办它，则取前一场的最优收益」两者取大，配一个二分查找找不冲突前驱，整张表填完即得最优。与活动选择只差一个权重，算法却从贪心换成 DP，这是两道检查最生动的一次现场演示：权重一进来，贪心选择性就死了——局部最早结束不再与全局最优相容。

    把这个例子与活动选择并排放好：以后每遇到一个区间问题，第一问永远是「它们等权吗」。等权先试贪心，带权直接 DP，能省下大量在错误方向上的试错。'
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 16.1 与 15.2 附近（活动选择与带权变体的对照）
    claim: 等权活动选择可贪心，带权区间调度需要用动态规划按结束时间排序后递推
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
  canvas:
    kind: datastate
    structure: array
    caption: 带权之后：贪心拿 J2 加 J3 共 2 分，最优是单独拿 J1 的 100 分
    rows:
    - label: 活动（起-止/收益）
      cells:
      - v: J1
        sub: 0-10 / 100
        mark: found
      - v: J2
        sub: 0-5 / 1
      - v: J3
        sub: 5-10 / 1
    - label: 按结束时间贪心
      cells:
      - v: J2 先结束
        mark: active
      - v: J3 接着
        mark: active
      - v: 总收益 2
        sub: J1 被挡死
    - label: 最优
      cells:
      - v: J1 独办
        mark: found
      - v: 总收益 100
        mark: found
    aux:
    - label: 分水岭
      items: [等权则贪, 带权则 DP]
  log:
  - mode: 变体
    event: 只加一个权重维度，算法家族就整个更换
  points:
  - 区间问题的第一问：各候选等权吗
  - 带权区间调度是 DP 的标准形态，不是贪心的改良版
- id: mst
  title: 最小生成树：切割性质撑腰的贪心
  tldr: Kruskal 每次拿下全图最便宜且不构成环的边，它的担保来自切割性质：跨越任何切割的最小边必在某棵最小生成树里。
  body: '把六个站点用光缆连成一张连通网，每条候选线路有造价，目标是总造价最低且全网连通，去掉任何一条都会断网——这就是最小生成树：n 个点、n 减 1 条边、无环、总权最小。

    Kruskal 的规则是教科书级的贪心：把所有边按造价从小到大排队，依次考察，每条边只要连接的还是两个互不连通的片区就拿下（拿下后两片合并），若会形成环就跳过，直到拿满 n 减 1 条。用并查集维护「谁与谁已连通」，每条边的考察几乎是常数时间。用一组小图走一遍：边权从小到大是 BC 为 1、AC 为 2、DE 为 2、EF 为 3、AB 为 4、BD 为 5。依次拿下 BC、AC（此时 A、B、C 连成一片）、DE、EF（D、E、F 连成一片），轮到 AB 时它落在同一片内、会成环，跳过；再拿 BD 把两大片接通，凑满五条边，总造价 13。

    每一步为什么敢定死？担保是切割性质：把全图任意切成两半，跨越这一刀的所有边里最便宜的那条，必然属于某棵最小生成树。证明仍是交换：若某棵最小生成树没选这条边，加上它必然成环，环上必有另一条跨界边，权不小于它，换掉，总账不亏。Kruskal 每拿一条边，都可以看作对某个切割应用这条性质——并查集维护的片区划分，正是这条性质的执行机构。

    另一条路线 Prim 从单个点出发，每次拿下连接「已选集合与外部」的最小边，是同一性质的另一种执行顺序。两种执行都成立，再次说明贪心的对错在问题结构，不在执行细节：结构对了，贪心怎么走都对；结构不对，走得再小心也是错。'
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 23 Minimum Spanning Trees（切割性质与 Kruskal）
    claim: 跨越任意切割的最小权边必属于某棵最小生成树，Kruskal 按边权递增且避环地选边得到最优解
    status: verified
