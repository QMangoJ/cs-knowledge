steps:
- id: idea
  title: 贪心是什么：选了就不反悔
  tldr: 贪心就是只按一条局部规则选眼前最好的一步，选完当场定死、永不建表也不回头；它能跑对，靠的不是运气而是问题本身的结构。
  body: |-
    先用会议室排期把贪心的动作看清楚。一天里同一间会议室收到六场活动申请，各自标好了起止时间：a1 是 1 到 4 点，a2 是 3 到 5 点，a3 是 0 到 6 点，a4 是 5 到 7 点，a5 是 8 到 9 点，a6 是 5 到 9 点。同一时刻只能办一场，你想尽量多办几场。

    按「谁结束得最早就先办谁」的规则来挑：先把 4 点就散场的 a1 定下来，把和它撞期的 a2、a3 直接划掉；剩下里面结束最早的是 7 点散场的 a4，划掉撞期的 a6；最后拿下 8 到 9 点的 a5。一共安排成三场：a1、a4、a5。

    留神这个过程里两件和上一课动态规划截然相反的事：第一，选中 a1 的那一刻就当场锁死，算法后面再也不会问「要是当初不办 a1 改办别的会不会更多」；第二，全程没建任何一张表去比较备选方案的总账。可读者马上会卡住：万一结束最早的那场刚好挡住了两场稍晚才结束的短活动怎么办？这正是下一步要用交换论证替它担保的地方。
