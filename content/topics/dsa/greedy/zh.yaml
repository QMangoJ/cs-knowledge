  points:
  - 交换论证三段式：取最优解、换第一步、归纳到子问题
  - 担保来自一条单调关系：贪心选择的结束时间不晚于任何备选
- id: two-conditions
  title: 两道检查：贪心选择性与最优子结构
  tldr: 最优子结构 DP 与贪心都需要；贪心选择性只有贪心需要。两道都过，才有资格不回头。
  body: '把两个性质并排定义清楚。最优子结构说的是：问题的最优解，可以由子问题的最优解拼出来——选定一步之后，剩下的部分必须独立地按它自己的最优解办，与已选部分互不纠缠。动态规划与贪心都建立在这条性质上，没有它，问题连「选完一步再看余下」都无从谈起。

    贪心选择性说的是：存在一个最优解，它包含贪心规则选出的那一步。换句话说，全局最优不排斥这步局部最优，第一步定死不会堵死通往最优的路。这是贪心独有的强要求，DP 完全不需要它——DP 把每种选择都试一遍存进表里，靠的是穷举加记忆，不靠任何一步的先验担保。

    于是分界清楚了。决策过程好比走一棵决策树：DP 是把整棵树的关键节点都算出来存好，走哪条路由查表决定；贪心是站在每个岔口只凭一条局部规则选定一个方向，然后把其余分支整枝剪掉。剪枝敢剪到这个程度，唯一的合法依据就是贪心选择性。

    实务上的用法是两道检查当门槛：拿到一个优化问题，先问最优子结构在不在（不在，DP 与贪心一起出局，得换思路）；在，再问贪心选择性能否用交换论证证出来（证不出，就老实回去写 DP）。下一课立刻用这套检查去审判两个长得很像的问题：找零钱，以及背包。'
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 16.2 Elements of the Greedy Strategy
    claim: 贪心算法的适用条件是贪心选择性与最优子结构同时成立，前者是贪心区别于动态规划的额外要求
