    event: "前提看穿：边权非负就是 Dijkstra 的[[贪心选择性]]本身，一有负边就失效。"
  points:
  - Dijkstra 的每轮定案就是贪心定案，边权非负是它成立的前提
  - Bellman-Ford 用 DP 式松弛接管负权场景
  mistake: 记住「Dijkstra 不能处理负边」却说不出为什么：不是实现限制，是它的贪心选择性担保被负边抽掉了。
- id: when-works
  title: 贪心何时成立：[[拟阵]]，以及一张工程检查单
  tldr: 理论上满足「遗传性＋交换公理」的拟阵结构都能贪心拿最优；工程里真正防翻车的救命纪律，则是先拿暴力代码小数据对拍找反例，抓不到再坐下补交换论证。
  body: |-
    学到这里不禁要问：活动选择、分数背包、哈夫曼、最小生成树明明长得风马牛不相及，有没有一条统一的数学规律把能贪的题全框住？答案叫[[拟阵]]。先抓直觉：把「不冲突、不成环的合法组合」叫独立集，只要满足两条常识公理就成了拟阵——第一，合法组合删掉一个成员依然合法（比如森林删掉一条边还是森林）；第二，如果大团队比小团队成员多，总能从大团队里挑一个成员塞进小团队，让小团队长一格且依然合法（就像大森林总有一条边能补进小森林而不成环）。数学定理证明：只要问题能写成「在拟阵里挑总权最大的独立集」，按权重从大到小贪心拿就必定全局最优。

    理论框架很漂亮，可真到了写业务代码或刷题时，真正救命的是两条朴素纪律。第一，先拿对拍猛抓反例，再谈写证明：随手写个十行暴力搜索，生成几万组 n 等于 4 到 8 的随机小数据，跟你的贪心程序对比输出。贪心如果错了，绝大部分反例在小数据上几毫秒就原形毕露（像找零的 1、3、4 凑 6 手算就能撞见）。对拍虽然证明不了永远对，但它几乎零成本，能把绝大多数拍脑袋想出来的假贪心直接毙掉。

    第二，对拍抓不死，再回头写[[交换论证]]：盯死贪心每步的局部选择，问自己「假如高手有个满分方案第一步选了别的，我能不能把他的第一步换成我的选择，保证依然合法且总账不亏？」能严丝合缝写出来才算定案；卡在某个地方换不过去，多半说明结构真的缺了担保，老实退回动态规划。
