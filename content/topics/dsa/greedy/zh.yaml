- id: when-works
  title: 贪心何时成立：拟阵，以及一张工程检查单
  tldr: 活动选择与最小生成树背后站着同一个结构——拟阵。写代码时用得上的，是一张更朴素的检查单：先找反例，再试交换。
  body: '为什么活动选择、最小生成树、按性价比装分数背包这些八竿子打不着的问题，贪心都成立？理论给出的统一答案叫拟阵。它由一个集合与一族「独立子集」构成，只要求两条公理：独立集的子集仍独立；两个独立集大小不等时，总能从大者里取一个元素补给小者而保持独立（交换公理）。可以证明：凡是能表述成「在拟阵里求最大权独立集」的问题，按权重从大到小贪心必定最优；而且这几乎是完备的刻画——结构不在拟阵里，贪心就没有普遍担保。最小生成树对应图拟阵（独立集就是森林），活动选择的担保也可归约到类似的交换结构上。

    理论很美，但日常写代码时真正救命的是两条朴素得多的纪律。第一，先找反例再谈证明：把贪心规则写出来后，拿小规模数据写一个暴力求最优的程序，与贪心在随机数据上对拍几万组。贪心若错，错误往往在小数据上就暴露（找零的 1、3、4 凑 6 就是手算都能撞见的反例）。对拍只能证伪不能证真，但它便宜得近乎免费，能拦下绝大多数想当然的贪心。

    第二，对拍找不到反例，再回头补交换论证：盯住贪心的第一步选择，问「任给一个最优解，我能不能把它的第一步换成我的选择而总账不亏」。能证出来，贪心定案；证不出来或者证得磕磕绊绊，多半是结构真的不对，老实回 DP。证明与对拍互为保险：证明可能写错，对拍覆盖有限，两道一起上，漏网的概率才足够低。'
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 16.4 Matroids and Greedy Methods
    claim: 拟阵由独立性与交换公理定义，在拟阵上求最大权独立集的贪心可证最优
