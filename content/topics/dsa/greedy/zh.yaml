steps:
- id: idea
  title: 贪心是什么：选了就不反悔
  tldr: 每一步都做当下看起来最好的选择，做完不回头，全部步走完就是答案。
  body: '先看问题。会议室一天里收到六场活动的申请，每场有起止时间，同一时刻只能办一场，目标是安排的场数最多。直觉的排法有很多：先答应开始最早的？先答应时长最短的？贪心给出的规则是另一条：每次在还没安排的活动里，挑结束最早的那一场答应下来，然后删掉与它冲突的，按同样规则继续，直到挑完为止。

    按结束时间给六场活动排队：a1 是 1 点到 4 点，a2 是 3 点到 5 点，a3 是 0 点到 6 点，a4 是 5 点到 7 点，a5 是 8 点到 9 点，a6 是 5 点到 9 点。贪心第一步挑结束最早的 a1，删掉与它重叠的 a2 与 a3；剩下的里结束最早的是 a4，与它冲突的 a6 删掉；最后挑 a5。总共办成三场：a1、a4、a5。

    注意这个过程的两个鲜明特征。第一，每一步的选择当场定死，选中 a1 之后，算法再也不会回头考虑「如果当初不选 a1 会不会更好」。第二，它从不比较备选方案的整体账目，只执行一条局部规则。这与上一课的动态规划正好相反：DP 要把每种子问题的答案都算出来存好再比较，贪心连表都不建。

    这种莽撞凭什么可能正确？凭问题本身的结构。但在证明之前，先把怀疑留好：同样的「每步取最优」换个问题就会翻车，本课的大半篇幅就是在划这条界线。'
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 16.1 An Activity-Selection Problem
    claim: 活动选择问题按结束时间排序后，每步选最早结束且不冲突的活动即得最优解
    status: verified
