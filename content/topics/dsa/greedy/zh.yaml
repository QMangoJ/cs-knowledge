    event: "两道检查立好：贪心比 DP 多一道贪心选择性，缺了这一道就可能一步错步步错。"
  points:
  - 贪心 = 最优子结构（与 DP 共有）+ 贪心选择性（贪心独有）
  - 证不出贪心选择性时，正确做法是退回 DP，不是硬贪
- id: coin-counterexample
  title: 反例登场：找零钱为什么会翻车
  tldr: 换一套 1、3、4 元硬币凑 6 元，每次抓最大面额的贪心给出 4+1+1 共 3 枚，实际 3+3 只要 2 枚；贪心不仅算错了，而且表面看起来体体面面、不会报任何错。
  body: |-
    拿一个大家最容易凭直觉上当的题来过堂：找零钱。给一组硬币面额和目标金额，要求用最少的硬币数凑出来。直觉规则闭着眼都能喊出来：每次先挑能拿的最大面额。拿这套规则去凑人民币或美元，每次还真都是最优解——于是很多人误以为「找零就是个贪心问题」。

    把硬币面额换成 1 元、3 元、4 元，目标金额定成 6 元，当场打脸给你看。按贪心先抓最大的 4 元，剩下 2 元只能补两枚 1 元，一共 4 加 1 加 1 用了 3 枚硬币；可谁都能看出来，直接拿两枚 3 元（3 加 3）只需要 2 枚！更要命的是，贪心给错的时候程序既不会崩溃也不会警告，返回的也是合法凑出 6 元的方案，错误完全是静默的。

    回到刚才的两道检查诊断病因：[[最优子结构]]其实没坏——任何最优凑法拿走一枚硬币后，剩下的硬币依然是对应剩余金额的最优凑法（DP 照样能稳稳算出 2 枚）。坏掉的是[[贪心选择性]]：6 元的唯一最优解 3+3 里压根不含 4 元，贪心第一步伸手抓走 4 元那一秒，就已经把通往 2 枚最优解的门焊死了。至于现实币制为什么没事，那是货币设计者刻意选过面额比例、凑巧通过了贪心选择性，不是找零问题本身的恩赐。
  derivation: original
  sources:
