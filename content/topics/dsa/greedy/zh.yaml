title: 贪心：每步只取眼前最优，为什么有时就是对的
summary: 贪心每一步把眼前看起来最好的选择当场锁死，不建表、也不回头重算其他分支。这种果断省下了动态规划存表比较的开销，代价是一旦选错就再也没机会补救，所以它靠不靠谱全看问题本身是否同时过关「贪心选择性」和「最优子结构」。全课先拿活动安排演示怎么用交换论证替贪心担保，再用 1/3/4 找 6 元和 0/1 背包对比分数背包当场拆穿盲目贪心的错法，接着盘点哈夫曼编码、带权区间、最小生成树与 Dijkstra 最短路，最后落到拟阵的理论直觉和「先暴力对拍找反例、再补交换论证」的工程纪律。
premise: 这节课从三个看似都能「抢眼前最好」的场景开始：同一间会议室收到六场活动申请，你想一天多办几场；收银台手里有 1、3、4 元硬币，要凑出 6 元零钱；背包限重 50 斤，面前摆着三件货物，想装出最高总价。三个场景都像顺手拿眼前最优的就完事了，结果一个稳稳满分，另外两个却当场算亏。这一课专门拆清：贪心到底凭什么有时能赢，又会在哪一步悄无声息地翻车？
position: 本课在数据结构与算法里开启「贪心：每步只取眼前最优」板块，接在动态规划建表记账之后、字符串模式匹配之前。上一课讲的子问题会反复撞车，必须存表；本课则专门找那些连表都不用存、每个路口当场就能拍板的特例。学完你能一眼辨认贪心和动态规划的分水岭，会用交换论证替可行的贪心规则做担保，也会用最小反例当场否决看似合理却会算错的直觉方案。
bridge:
  prev: 上一课的动态规划为了不错过最优解，把每个子问题的答案都存进表里反复比较；可如果某些问题在每个岔路口，挑眼前最优的那步恰好永远不会挡住全局最优，那张表是不是根本不必建？
  next: 贪心处理的是在候选集合里挑了就不回头的决策；下一课把舞台换到一整段长文本里找一小段短模式，看朴素比对每次失配就把刚刚看过的字符全丢掉有多亏，以及怎么预处理模式让文本只扫一遍。
overview:
- key: 一句话总结
  value: 贪心在每一步挑一个局部最优选择当场定死，既不建表也不回头反悔。它换来极快的速度和几行代码的实现，前提是这一步绝对不能把通往全局最优的路堵死。
- key: 两道检查
  value: 贪心成立必须过两道关：一是[[最优子结构]]（选完一步后，剩下的子问题和原问题同形且独立）；二是[[贪心选择性]]（至少存在一个全局最优解，它的第一步正是贪心挑的那一个）。DP 只需过第一道，贪心两道都要过。
- key: 和 DP 的分界
  value: 动态规划会把所有分支算完存表再挑大，贪心在路口只选一条走到底。比如物品能切开装时按性价比贪心一定拿满分 240；一旦规定只能整件拿放，0/1 背包就会被贪心装成 160、输给最优解 220。
- key: 证明工具
  value: 给贪心做担保靠[[交换论证]]：先假设存在某个全局最优解，把它的第一步强行换成贪心的选择，只要能算清换完依然合法、总账一分不亏，就说明至少有一个最优解是从贪心这一步出发的。
- key: 否决工具
  value: 推翻一条不靠谱的贪心只需要一个反例。比如币制只有 1、3、4 元时凑 6 元，贪心先拿最大面额 4 凑成 4+1+1 共 3 枚，直接拿两枚 3 却只要 2 枚——算一次就当场拆穿。
- key: 理论与工程框架
  value: "[[拟阵]]用「独立集」和「交换公理」统一刻画了哪些结构必能贪心（如[[最小生成树]]）；日常写代码不必先啃抽象定理，守住「先写暴力小数据对拍找反例，抓不到反例再补交换论证」就够救命。"
