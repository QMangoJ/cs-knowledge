- id: activity-proof
  title: 为什么活动选择能贪：[[交换论证]]
  tldr: 把任意最优排法的第一场活动强行换成结束最早的 a1，腾出来的后续时间只多不少、总场数一分未少；只要第一步能无损替换，后面每一步照着归纳就全稳了。
  body: |-
    刚才那个疑虑怎么打消？证明贪心靠谱的标准工具叫[[交换论证]]，思路像极了做账平替：先不管贪心怎么选，假设高手已经排好了一套场数最多的最优日程，看他排在第一场的是谁——比如他挑了 a2（3 到 5 点），后面接着 a4（5 到 7 点）和 a5（8 到 9 点）。

    现在把他的第一场 a2 硬生生撤掉，换成贪心挑出的 a1（1 到 4 点）。为什么这样换一定不会出事？理由只一句话：a1 是全场结束最早的，它 4 点就散场，比 a2 的 5 点还要早！既然原本排在后面的 a4、a5 能接在 5 点之后稳稳开场，那接在更早腾出来的 4 点之后只会更宽裕，绝对不会冲突。这一换，方案依然合法，总场数还是 3 场、一分没少。

    这就拿到了第一重担保：总存在一个最优解，它的第一场正是 a1（也就是[[贪心选择性]]）。那第二步、第三步怎么保证不翻车？因为一旦定死 4 点散场的 a1，剩下要挑的就是「4 点以后开始的活动里最多能排几场」，这跟原问题长得一模一样（即[[最优子结构]]），照样把它的第一场换成剩下里结束最早的即可，一路换到底，整套贪心方案就和最优解一样多了。
