  - A greedy solution's cost lies mainly in acceptance, not in implementation
design:
- mechanism: "One-way decisions that never regret: each step locks in a local optimum and prunes the remaining branches, compressing an exponential decision tree into a single chain — premised on the greedy-choice property guaranteeing every step"
  problem: "The decision space of combinatorial optimization grows exponentially with scale, and comparing every complete plan one by one is impossible. Dynamic programming compresses repeated computation with a table, but the state space itself also swells — and many problems, structurally, actually allow something more drastic: never looking back, not even once."
  choice: "Locking in on the spot is allowed only when it can be proved that some optimal solution contains this step's choice. The alternative is full dynamic programming — general and reliable, but paying time and memory for the entire state table. The other alternative is unguaranteed heuristic greedy — fast, certainly, but when wrong it silently produces wrong answers, with no alarm at all."
  tradeoff: The range of application is fenced in tightly by the two checks — when the structure does not comply, greedy is not slow but directly wrong, and wrong without any sign. What this fragility buys is sorting-level or linear complexity, and an implementation writable in a few lines.
  root: The exchange argument reveals where the guarantee comes from — when a local choice and an arbitrary optimal solution are joined by a one-step replaceable monotonic relation, the local and the global are welded together. Matroid theory goes further and proves that independence plus the exchange axiom characterize exactly this class of structure. Whether greedy is right is never a matter of feel; it is a matter of structural theorems.
- mechanism: "Huffman's bottom-up merging: each step merges the two lowest-frequency symbols, using the structural insight that the lowest-frequency pair must be siblings at the deepest level of an optimal tree, to turn the search over coding trees into a string of guaranteed merges"
  problem: "The candidate space of prefix codes is all binary trees — impossible to enumerate. And the coding cost is decided by each symbol's frequency times its depth, so the positions of high- and low-frequency symbols in the tree must be arranged precisely; any intuitively placed arrangement cannot say how far it sits from optimal."
  choice: "Merge the two lowest frequencies bottom-up; each merge shrinks the problem by one while keeping its shape. The alternative top-down route (split the symbol table by frequency, then recurse) has no exchange argument behind any of its splits and can only reach near-optimal. The alternative of exhaustive search plus DP becomes infeasible once the symbol count grows even slightly."
  tradeoff: The frequencies must be fully counted first — it is an offline algorithm. When data arrives as a stream with an unknown distribution, you switch to adaptive Huffman and pay higher implementation and maintenance costs. What that buys is provable optimality and extremely low running overhead.
  root: "This is the exemplar of the greedy-choice property and optimal substructure both at full marks: that the two lowest-frequency symbols are siblings at the deepest level of an optimal tree follows strictly from a single cost-non-increasing exchange. Greedy here is not a rule of thumb but a direct corollary of a theorem — a reminder that the only standard for judging whether a greedy can be trusted is whether the exchange argument can be written down."
- mechanism: "A counterexample-first verification discipline: a new greedy rule first faces falsification by small-scale brute-force cross-checking, then faces proof by exchange argument — both must pass before it counts"
  problem: "The way greedy fails is especially insidious: no crash, no timeout, no alarm — it quietly hands over a wrong answer that looks completely normal. The greedies that look right by intuition (change-making, density knapsack) are exactly the ones most likely to be wrong, and the person who wrote them is often the most convinced they are right."
  choice: "Hedge that insidiousness with an asymmetric verification order: first cross-check with random small data against a brute-force optimum, doing your utmost to falsify; if it cannot be falsified, sit down and supply the exchange argument. The alternatives — shipping on intuition plus one or two hand-worked examples — outsource correctness to luck; proving without cross-checking leaves the proof's own slips unreviewed by anyone."
  tradeoff: Cross-checking can only falsify, never verify; corners it does not cover may still hide counterexamples. An exchange argument, however rigorous, may still trip on some hidden assumption. Stacking the two disciplines only presses the slip-through probability down, never to zero.
  root: "This is the asymmetry of falsification projected onto engineering: one counterexample's negation of the rule's correctness is complete, while ten thousand passing examples still do not completely affirm it. So the rational verification order is necessarily falsify first with everything you have, then seek proof — reverse the order, and the cheapest line of defense is wasted."
level: 进阶
minutes: 30
prereq:
- dsa/dynamic-programming
objectives:
- Pre-judge whether a problem admits greedy, using the two checks of the greedy-choice property and optimal substructure
- Prove the greedy steps of activity selection, Huffman merging, and minimum spanning trees with exchange arguments
- Reject arbitrary-denomination change-making and the 0/1 knapsack's density greedy with counterexamples
- Explain why Dijkstra's correctness is staked on non-negative edge weights
aiLink: Greedy is likewise the default heuristic in AI engineering — greedy decoding (taking the highest-probability token at each step) is the unguaranteed version of greedy, and its contrast with beam search is exactly this lesson's "walk one road vs. enumerate and compare" replayed. Understand when it crashes, and you understand why greedy decoding in long-text generation tends toward repetition and early stopping.
