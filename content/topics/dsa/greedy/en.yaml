- id: mst
  title: "[[Minimum spanning trees|最小生成树]]: greedy backed by the [[cut property|切割性质]]"
  tldr: "Change battlefields once more: connect a set of sites with optical cable into one network at the lowest total cost, keeping the whole network connected. This step looks at [[Kruskal]]'s rule — queue the edges by cost, take any that does not form a cycle — then works through the guarantee behind it: why the cheapest edge crossing any cut must belong to some minimum spanning tree."
  body: |-
    Connect six sites with optical cable into one connected network; each candidate line has a cost, and the goal is the lowest total cost with the whole network connected — remove any single line and the network breaks. That is a minimum spanning tree: n nodes, n−1 edges, no cycles, minimum total weight.

    Kruskal's rule is textbook greedy: queue all the edges from cheapest to most expensive and examine them in turn; take an edge as long as it connects two still-separate regions (taking it merges the two regions), and skip it if it would form a cycle, until n−1 edges are taken. A [[disjoint-set union|并查集]] maintains "who is already connected to whom", so examining each edge costs almost constant time. Walk a small graph: the edges in increasing weight are BC at 1, AC at 2, DE at 2, EF at 3, AB at 4, BD at 5, with DF at 6, CD at 8, and CE at 10 further back — but the tree fills up before their turn comes. Take BC, then AC (now A, B, C form one region), then DE, then EF (D, E, F form one region); when AB's turn comes, it falls inside a single region and would form a cycle, so skip it; then take BD to join the two big regions — five edges taken in all, at a total cost of 13.

    Why dare to lock each step in? The guarantee is the cut property: cut the whole graph into two halves any way you like, and the cheapest of all the edges crossing that cut necessarily belongs to some minimum spanning tree. The proof is again an exchange: if some minimum spanning tree did not choose that edge, adding it necessarily forms a cycle, the cycle necessarily contains another crossing edge whose weight is no smaller than it, and swapping them leaves the total account no worse. Every edge Kruskal takes can be seen as applying this property to some cut — the region partition maintained by the disjoint-set union is exactly this property's executive machinery.

    The other route, [[Prim]], starts from a single point and each time takes the cheapest edge connecting "the chosen set to the outside" — the same property in a different execution order. Whether greedy is right lives in the problem's structure, not in execution details.
  derivation: original
  sources:
