- id: interval-family
  title: "The interval family: add weights, and greedy is out"
  tldr: "Activity selection has a whole family of relatives. This step first looks at why a few equal-weight variants still admit greedy, then attaches a profit to each activity and watches the situation rot — once weighted, locally-earliest-ending no longer agrees with the global optimum, and the algorithm must switch back wholesale to dynamic programming."
  body: |-
    Activity selection has a family of relatives. The minimum-meeting-rooms problem (every activity must be held; how few rooms suffice) can be solved by scanning in start-time order and keeping each room's release time in a priority queue — greedy holds. Certain forms of interval covering, where greedy picks "the interval that reaches farthest from the current point", are also provably correct. What these problems share: every activity has equal standing, and only the count matters.

    Attach a profit to each activity, and the situation rots at once. Activity J1 runs from 0 to 10 with profit 100; J2 from 0 to 5 with profit 1; J3 from 5 to 10 with profit 1. Greedy by end time takes J2 first, then J3, for a total profit of 2 — permanently blocking J1, which spans the whole stretch, outside the door. The optimum is obviously to hold J1 alone, for a profit of 100. It treats every activity equally, but the profits are anything but equal, and the first step's choice has become a weighted combinatorial decision.

    [[Weighted interval scheduling|带权区间调度]] is a standard DP example: sort by end time, then for each activity compute "hold it — its profit plus the optimal profit of the last non-conflicting activity before it" against "skip it — the previous activity's optimal profit", and take the larger. It differs from activity selection by a single weight, yet the algorithm switches from greedy to DP: the moment weights enter, the [[greedy-choice property|贪心选择性]] dies — locally-earliest-ending no longer agrees with the global optimum.

    Put this example beside activity selection and keep them together: from now on, whenever you meet an interval problem, the first question is always "are they equally weighted?" Equal weights — try greedy first. Weighted — go straight to DP.
  derivation: original
  sources:
