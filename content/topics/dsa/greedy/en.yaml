- id: dijkstra-greedy
  title: "Looking back at an old lesson: [[Dijkstra]] itself is a greedy"
  tldr: "Bring a lesson already learned back for re-examination: shortest paths settle the smallest-distance point each round, which is the standard greedy move. This step looks at what its guarantee is staked on — non-negative edge weights — then inserts a negative edge and watches the settling crash on the spot, and sees which algorithm should replace it."
  body: >-
    Bring Dijkstra back and re-examine it by greedy's standards. Its every step is this: from the unsettled points, pick the one with the smallest dist, declare its shortest distance locked in for good, and never change it again. That is precisely the standard greedy move — best right now, locked in on the spot, never regretted.


    Why does it dare? The guarantee comes from non-negative edge weights: the settled point has the smallest dist, and any other route trying to detour to it must first pass through another unsettled point (whose dist
    is no smaller than its), then travel a non-negative edge — longer only, never shorter. So "the smallest is settled" is a theorem in the non-negative world. This guarantee is staked, inside and out, on non-negativity — the same kind of structural bet as change-making's stake on the coin system and the knapsack's stake on being divisible.


    Insert a negative edge and the guarantee collapses at once. From source S, A is 2 and B is 4; B to A has a negative edge of −3; A to C is 2; B to C is 5. Dijkstra first settles A at 2 (the smallest present), then settles C at
    4 via A. But the true shortest route is S to B, then borrowing the negative edge to A: 4 minus 3 equals 1 — A's true distance is 1, not 2; C's true optimum is 1 plus 2, which is 3, not 4. The very second A was settled, the door to the truth had closed — the standard posture of a greedy crash.


    The correct answer for negative weights, [[Bellman-Ford]], is a different species: it relaxes all the edges for n−1 rounds, each round recursing on the optimal subproblem of "using at most k edges" — dynamic programming written on a graph. One and the same shortest-path problem: non-negative weights use greedy, negative weights use
    DP. The dividing line is still that old question — for locking in the first step, is there anyone to guarantee it?
  derivation: original
