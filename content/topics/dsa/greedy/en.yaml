steps:
- id: idea
  title: "What greedy is: choose, and never regret it"
  tldr: "Set the scene first: six activities apply for the same meeting room in one day, and only one can run at a time; the goal is to hold as many as possible. This step first states the greedy rule — each time pick the activity that ends earliest — walks it through completely, then names its working traits: every step locked in on the spot, and the total accounts of alternative plans never compared."
  body: >-
    Look at the problem first. A meeting room receives applications for six activities in one day; each activity has a start and end time, only one can run at a time, and the goal is to schedule as many as possible. The greedy rule is this: each time, among the activities not yet scheduled, approve the one that ends earliest, then delete those that conflict with it, and continue by the same rule until nothing is left to pick.


    Sort the six activities by end time: a1 runs from 1 to 4, a2 from 3 to 5, a3 from 0 to 6, a4 from 5 to 7, a5 from 8 to 9, a6 from 5 to 9. Greedy's first step picks a1, the earliest to end, and deletes a2 and a3, which overlap it; among what remains, the earliest to end is a4, and a6, which conflicts with it, is deleted; finally it picks a5. Three activities get held in total: a1, a4, and a5.


    Notice two traits of this process. First, each step's choice is locked in on the spot — after a1 is chosen, the algorithm never looks back to consider whether not choosing a1 back then might have been better. Second, it never compares the overall accounts of alternative plans; it only executes a single local rule. This is the exact opposite of the previous lesson's dynamic programming: DP
    computes the answer to every subproblem, stores them all, and only then compares; greedy does not even build a table.


    Why might such recklessness possibly be correct? Because of the problem's own structure. The same "take the best at each step" crashes on a different problem — most of this lesson is spent drawing that line.
  derivation: original
  sources:
