  - Real coin systems admit greedy because their structure passes the check, not by the problem's grace
  mistake: Taking "this is how change is made in real life" as evidence that greedy is correct — that only proves this coin system was designed (or selected) to pass the greedy-choice property.
- id: knapsack-boundary
  title: "The line against DP: the fractional knapsack admits greedy, the 0/1 knapsack does not"
  tldr: "Change-making crashed on the [[greedy-choice property|贪心选择性]]. This step tests the same property once more, on the knapsack problem: one rule — pack by value density — is provably correct when items can be cut, and is killed by a counterexample when items can only be taken whole. The mechanism of the dividing line is exactly those words: can it be cut."
  body: >-
    The knapsack problem has a fork in it. In front of a knapsack of capacity 50 stand three items: A weighs 10 and is worth 60, density 6; B weighs 20 and is worth 100, density 5; C weighs 30 and is worth 120, density 4. If items can be cut apart (packing gold dust, say), greedy packs by density from high to low: all of A,
    all of B, and the remaining 20 of capacity takes two-thirds of C, for a total value of 60 plus 100 plus 80, which is 240. Here greedy is right, and the [[exchange argument|交换论证]] holds: if any optimal packing leaves room on a high-density item while packing a low-density one, swapping equal amounts of the two can only gain, never lose.


    If items can only be taken whole or left whole (the 0/1 knapsack), the same rule crashes at once. Greedy takes A first, then B — 30 of capacity used, value 160 — and the remaining 20 cannot fit C, so it can only stop. The optimal solution drops A and takes B plus C: weight exactly 50, value 220. A full 60
    of value lost, and greedy notices nothing.


    The dividing mechanism is the word "cut". When cutting is allowed, capacity can never be jammed dead by one item that does not fit; the density ordering can be filled to the very last gram, and every step of the exchange argument fits seamlessly. When cutting is not allowed, the unusable part of the capacity becomes structural waste, and "which item to take" becomes a genuine combinatorial decision — locking in the first step can push the
    220 combination out the door. This is exactly where the previous lesson's DP shines.


    That yields a durable criterion: the more a problem is "continuous, divisible", the more likely it passes the greedy-choice property; the more it is "discrete, whole-item choices", the more wary you should be — think in the DP direction first by default.
  derivation: original
