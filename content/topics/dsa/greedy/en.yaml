  log:
  - mode: Proof
    event: "The exchange argument is complete: it only needs to watch the first step — every other step is the first step of some subproblem, and induction takes over."
  points:
  - "The exchange argument in three parts: take an optimal solution, swap the first step, induct down to the subproblem"
  - "The guarantee comes from a single monotonic relation: the greedy choice's end time is no later than any alternative's"
- id: two-conditions
  title: "The two checks: the [[greedy-choice property|贪心选择性]] and [[optimal substructure|最优子结构]]"
  tldr: "The [[exchange argument|交换论证]] guaranteed only the first step. This step defines, side by side, the two properties greedy needs to hold: after one step is chosen, the remaining problem must keep the same shape and stay independent; and some optimal solution must contain that step. It also makes clear that dynamic programming needs only the latter of these, while greedy must pass both."
  body: |-
    Define the two properties clearly, side by side. Optimal substructure says: a problem's optimal solution can be assembled from the optimal solutions of its subproblems — after one step is fixed, the remaining part must be handled independently by its own optimal solution, unentangled with the part already chosen. Dynamic programming and greedy both stand on this property; without it, there is no way to even talk about "choose a step, then look at what remains".

    The greedy-choice property says: some optimal solution contains the step the greedy rule picks. The global optimum does not reject this locally optimal step; locking in the first step does not block the road to the optimum. This is a strong requirement unique to greedy — DP does not need it at all. DP tries every choice and stores them in a table, relying on exhaustive search plus memory, not on any step's prior guarantee.

    The dividing line is now clear: DP computes the key nodes of the decision tree and stores them, deciding which route to take by table lookup; greedy stands at each fork, picks one direction by a single local rule, and prunes every other branch whole. Daring to prune this hard has exactly one legitimate basis: the greedy-choice property.
  derivation: original
