  points:
  - Every round of Dijkstra's settling is a greedy settling; non-negative edge weights are its premise
  - Bellman-Ford takes over the negative-weight world with DP-style relaxation
  mistake: Remembering "Dijkstra cannot handle negative edges" without being able to say why — it is not an implementation limit; its greedy-choice guarantee is what the negative edge pulls away.
- id: when-works
  title: "When greedy holds: [[matroids|拟阵]], and an engineering checklist"
  tldr: "Enough cases have been examined; this step collects the unified framework: any problem that can be stated as a matroid is one where greedy is necessarily optimal. But what actually saves you in everyday coding is two far more naive disciplines — first cross-check against a brute-force solver to hunt for counterexamples, then supply the [[exchange argument|交换论证]]. This step lays the theoretical answer and the engineering answer side by side."
  body: |-
    Why do greedy solutions hold for activity selection, [[minimum spanning trees|最小生成树]], and the fractional knapsack? The unified theoretical answer is called a matroid. It consists of a set and a family of "independent subsets", and requires only two axioms: a subset of an independent set is still independent; and when two independent sets differ in size, an element can always be taken from the larger and given to the smaller while keeping it independent (the exchange axiom). For any problem that can be stated as "find a maximum-weight independent set in a matroid", greedy by weight from large to small is necessarily optimal; if the structure is not in a matroid, greedy has no general guarantee. Minimum spanning trees correspond to the graphic matroid (the independent sets are forests).

    The theory is beautiful, but what actually saves you in everyday coding is two far more naive disciplines. First, hunt for a counterexample before talking about proofs: write a brute-force program that finds the optimum on small data, and cross-check greedy against it on tens of thousands of random cases. If greedy is wrong, the error usually surfaces on small data (the change-making 1, 3, 4 making 6 is a counterexample you can bump into even by hand). Cross-checking can only falsify, never verify — but it is nearly free, and it blocks the great majority of taken-for-granted greedies.

    Second, when cross-checking finds no counterexample, go back and supply the exchange argument: fix on greedy's first choice and ask, "given any optimal solution, can I swap its first step for my choice without making the total account worse?" If you can prove it, greedy is settled; if you cannot, the structure is probably genuinely wrong, and the honest move is back to DP. Proof and cross-checking insure each other; only with both in place is the chance of a slip-through low enough.
  derivation: original
  sources:
  - ref: clrs
