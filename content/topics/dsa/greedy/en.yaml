- id: practice
  title: Greedy's real place in engineering
  tldr: "Finally, back to everyday engineering: scheduling, cache eviction, and rate limiting are full of greedy rules on direct duty. This step separates two levels — when a problem demands a provably optimal answer, only a greedy that passed the two checks qualifies to ship; when greedy is used as an engineering heuristic, the acceptance process is where the real cost lies."
  body: >-
    Pull the camera back to everyday engineering, and greedy is everywhere, usually on duty in the role of "reasonable default": shortest-job-first, evicting the least recently used from a cache, a rate limiter letting high-priority traffic through first — all greedy rules at work directly. They get chosen because the rules are simple, the decisions fast, and the effect on real workloads good enough.


    This "good enough" and this lesson's fastidious "provably optimal" are two different levels: when a problem demands an optimal solution and errors come without warning, only a greedy that passed the two checks qualifies to replace DP. In engineering systems the objective function is often fuzzy, and greedy is more of a heuristic — ship one simple rule first, keep accounts on real data, and upgrade the strategy when the numbers show a problem.


    Having an AI
    or a template produce a greedy solution takes only seconds, but greedy is the class of algorithm least able to withstand "looks right" — errors are silent, counterexamples are often within reach, and correctness is staked entirely on the problem's structure. So the acceptance process is what most needs fixing in place: ask the two checks first, run a round of cross-checking, and only then discuss complexity. Acceptance is where greedy's real cost lies.


    Closing the lesson: whether greedy can be used depends on whether the problem's structure allows each step to be locked in, never to look back. What this lesson gives is the complete method for verifying the problem's structure before reaching for greedy.
