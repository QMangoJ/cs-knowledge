- id: huffman
  title: "Greedy's positive specimen: [[Huffman|哈夫曼编码]] coding"
  tldr: "The last two lessons watched greedy crash; this step looks at a positive specimen: give characters a [[prefix code|前缀码]] while minimizing the total cost. The rule merges the two lowest frequencies into one group each time. First walk one set of frequencies through the merges to the end, then see why its two checks are both complete."
  body: |-
    A [[prefix code|前缀码]] requires that no symbol's code is a prefix of another's, so that decoding needs no separators. Give high-frequency symbols short codes and low-frequency symbols long codes; the total cost is each symbol's frequency times its code length, summed. The question is: given a table of character frequencies, how do you build a coding tree with the minimum total cost?

    Huffman's greedy rule works bottom-up: each time, take the two symbols (or already-merged groups) with the smallest frequencies, hang them under a new parent node whose frequency is the sum of the two, put it back, and keep merging until only one root remains. Run a classic set of frequencies as a demonstration: f is 5, e is 9, c is 12, b is 13, d is 16, a is 45. First merge 5 and 9 to get 14; then merge 12 and 13 to get 25; then merge 14 and 16 to get 30; then merge 25 and 30 to get 55; finally merge 45 and 55 into 100. The five merge costs add up — 14 plus 25 plus 30 plus 55 plus 100 equals 224 — and that is this tree's total weighted cost.

    Why is merging the two smallest right? First, the [[greedy-choice property|贪心选择性]]: the two lowest-frequency symbols, in some optimal tree, necessarily sit at the deepest level as siblings — if the deepest level holds some other symbol, swapping it with a low-frequency symbol only lowers the cost or keeps it (the [[exchange argument|交换论证]] appearing once again); after this pair of siblings is merged into one symbol, the problem becomes a same-shaped problem of size one less, and [[optimal substructure|最优子结构]] takes over. Second, with both checks complete, induction can roll to the end: every Huffman step is guaranteed, and the final tree is provably optimal — not a heuristic, not an approximation.

    Contrast the top-down [[Shannon-Fano|香农-法诺编码]] coding (split the symbol table in half by frequency, then recurse): it yields codes that are close but not necessarily optimal — bottom-up merging has the exchange argument behind it; top-down splitting does not. The Huffman trees lying inside [[gzip]] and [[JPEG]] are this greedy rule in its everyday form.
  derivation: original
