  points:
  - Greedy = optimal substructure (shared with DP) + the greedy-choice property (greedy's alone)
  - When the greedy-choice property cannot be proved, the right move is to fall back to DP, not to greed anyway
- id: coin-counterexample
  title: "A counterexample takes the stage: why making change crashes"
  tldr: "The two checks are in place — put a new problem through the hearing: making change. First see why greedy feels natural on real-world coin systems, then change the denominations to 1, 3, 4 making 6 and watch it crash on the spot; finally use the two checks to locate exactly which one failed."
  body: >-
    The change-making problem goes like this: given a set of coin denominations and a target amount, make the amount with the fewest coins. The greedy rule is obvious — each time, use the largest denomination that fits. Against real coin systems like the US dollar or the RMB, what it gives is indeed the optimal solution.


    But change the coin system to three denominations — 1, 3, and 4 — with the target of making 6. Greedy first grabs the largest, 4; the remaining 2 can only be made with two 1s — three coins in total. But 3 plus 3
    takes only two coins. Greedy here is not slow; it directly returns a wrong answer, and it will not raise a hand to tell you it is wrong — its output looks every bit as respectable as the correct answer.


    Review this crash with the two checks. [[Optimal substructure|最优子结构]] is fine: take any coin out of an optimal making, and what remains is still an optimal making of its sub-amount. What failed is the [[greedy-choice property|贪心选择性]]: this step picks the largest denomination, 4, but there is no optimal solution containing 4 at all, because the optimum, 3+3, never uses 4. The moment the first step locked in 4, the door to the optimum was already shut.


    Why are real coin systems fine? Because the denomination structure of systems like the dollar and the RMB happens to pass the greedy-choice property — not a birthright of the change-making problem, but a result of how the coin system was designed. Greedy's correctness is a one-off verdict on a specific problem's structure; there is no such thing as "greedy is generally right".
  derivation: original
  sources:
