id: dsa/greedy
subject: dsa
slug: greedy
order: 9
status: published
license: CC-BY-4.0
title: "Greedy: taking the best in front of you at every step — why it is sometimes exactly right"
summary: Greedy never looks back and keeps no table; every step locks its choice in on the spot. Whether it holds depends not on intuition, but on whether the problem has both the [[greedy-choice property|贪心选择性]] and [[optimal substructure|最优子结构]].
premise: Sometimes picking the best available choice at every step leads to the best overall result in the end; sometimes it goes wrong. This lesson answers when greedy can be trusted and when it cannot, with two contrasting examples — scheduling the most mutually non-conflicting activities into one day, and loading a knapsack by value density — plus a change-making counterexample that shows it crashing.
position: The dynamic programming lesson ended with a question — when subproblems overlap you keep a table, but if a step's choice never needs revisiting at all, the table is pure waste. This lesson opens a new section, "Greedy — taking the best in front of you at every step", and uses activity selection, a change-making counterexample, and the knapsack dividing line to measure the range of this shortcut. After it, you will be able to pre-judge whether a problem admits greedy using the two checks of the greedy-choice property and optimal substructure, prove activity selection by hand with an [[exchange argument|交换论证]], and kill value-density packing for the 0/1 knapsack on the spot with a counterexample.
bridge:
  prev: The previous lesson's dynamic programming dodged repeated subproblems by keeping a table, on the premise that every subproblem is worth computing once in advance. This lesson asks the opposite question — if one step's optimal choice can be locked in on the spot and never regretted afterward, is the table still necessary?
  next: Greedy handles problems of repeatedly making choices from a candidate set. The next lesson changes the kind of object — finding a short pattern inside one long text. Naively comparing character by character compares the same character over and over many times, and that shape of waste is strikingly similar to the repeated subproblems seen before dynamic programming.
overview:
- key: In one sentence
  value: Greedy locks in one locally optimal choice at each step, never regrets it, never backtracks. It saves the overhead of comparing and tabulating; the price is that once a step is chosen wrong, there is no chance later to make up for it — so before using it, you must first confirm that it holds for this specific problem.
- key: The two checks it must pass
  value: Two checks must pass. One is the [[greedy-choice property|贪心选择性]] — some optimal solution contains this step's choice. The other is [[optimal substructure|最优子结构]] — after the choice is made, the remaining subproblem has the same shape as the original problem and is independent of it. In activity selection, for example, you first fix the activity that ends earliest, and what remains is still the problem of scheduling the most activities into the remaining time.
- key: The line against DP
  value: DP enumerates choices, tabulates them, and compares; greedy walks a single road. The fractional knapsack admits greedy; the 0/1 knapsack does not. When items can be cut apart, packing by value density from high to low is certainly optimal; when an item can only be taken whole or not at all, the highest-density item may be exactly the one that jams the capacity, and you lose instead.
- key: The proof tool
  value: The proof tool is the [[exchange argument|交换论证]] — swap the first step of an arbitrary optimal solution for the greedy choice, without making the total account any worse. Concretely, first assume an optimal solution, then replace its first step with the greedy step and work out clearly that the result does not get worse; that shows at least one optimal solution starts with the greedy choice.
- key: The rejection tool
  value: Rejecting greedy takes only one counterexample — with denominations 1, 3, 4 making 6, greedy gives 3 coins while the optimum needs only 2. Greedy first takes the largest denomination, 4, then adds two 1s, three coins in total; taking two 3s directly needs only two. This single example shows that greedily taking by denomination fails for this coin system.
- key: The unified framework
  value: "[[Matroids|拟阵]] characterize the full structure under which greedy is correct, and activity selection and [[minimum spanning trees|最小生成树]] are both instances of it. In everyday coding there is no need to learn matroids first — the naive checking method suffices: first work hard to find a counterexample, then try an exchange argument, and only when both pass can you use greedy with confidence."
