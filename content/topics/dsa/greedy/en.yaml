  log:
  - mode: The rule
    event: "The rule is set: at each step pick the activity that ends earliest and does not conflict; choices once made are never reopened, until nothing is left to pick."
  points:
  - "Greedy's two traits: choices locked in on the spot, and no table, no backtracking, ever"
  - Whether it is correct is a question about the problem's structure, not about algorithmic cleverness
- id: activity-proof
  title: "Why activity selection admits greedy: the [[exchange argument|交换论证]]"
  tldr: "The last step's rule produced a result — but on what grounds is it optimal? This step answers with an exchange argument: take any optimal schedule, swap its first activity for the one that ends earliest, and work out why the result is still feasible with the count unchanged — securing the guarantee for the first step first."
  body: |-
    The general tool for proving greedy correct is the exchange argument, in three parts. First, take some optimal solution and call its first activity x. Next, swap x for a1, the greedy pick (the activity that ends earliest), and argue that the resulting plan is still feasible, with the number of activities unchanged. Finally, note that what remains to schedule is the same-shaped subproblem — "activities that start after a1 ends" — so the same argument can be repeated on the subproblem, swapping all the way down, until the whole optimal solution has been transformed into the greedy solution.

    Why does the swap always work? It rests on a single fact: a1 ends earliest among all the activities, so a1's end time is no later than x's end time. After swapping x for a1, the freed time is no less than before; the activities that followed x in the original plan did not conflict with x (they all started after x ended), so they certainly do not conflict with a1, which ends even earlier. Feasibility is preserved, the count is not reduced by one, and a single exchange is complete.

    This property — "some optimal solution contains the greedy choice for this step" — is called the [[greedy-choice property|贪心选择性]]. It is greedy's admission ticket: without it, the very first step might shut the door on the optimal solution. The exchange argument always bears on the first step, because every later step is the first step of some subproblem. One half remains: the leftover problem must have the same shape as the original and be independent of it. That property is called [[optimal substructure|最优子结构]], and the next step puts it side by side with the greedy-choice property for a full hearing.
  derivation: original
  sources:
