- id: degeneration
  title: 退化：插入顺序能毁掉一棵树
  tldr: 依次插入 1,2,3,4,5… 普通 BST 不做任何调整，树变成一条向右的链，O(log n) 变回 O(n)。
  body: '把已排序的数据逐个插入 BST，每个新元素都比所有现存节点大，一路右拐到底，最后树是一条链表，查找退化为线性扫描。随机插入顺序时期望高度是 O(log n)，但数据本来就接近有序在工程里太常见了（自增 id、时间戳），不能赌运气。结论是，需要一种机制，在插入与删除后自动把树高摁在 O(log n)，这就是自平衡搜索树存在的理由。

    把退化的账算成数字，n 等于 100 万时，平衡树的高度约 20，查一次约 20 次比较，退化链的高度是 100 万，查一次平均要 50 万次比较，两者差了四五个数量级。而且链越长每次插入还都往最深处走，建树总代价直接变成平方级，这种退化不是慢一点，而是复杂度类别都变了。

    再看一个更贴近工程的例子，按时间戳递增写入的日志键、按自增主键写入的记录，插入顺序天然接近有序，若底层容器是裸 BST，上线第一天它就是一条链，监控里只会看到查询延迟随数据量线性爬升。随机打乱插入顺序能缓解，但治标不治本，删除与业务顺序还会重新制造偏斜，所以平衡必须成为结构自带的属性。'
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 12.4 随机建树与期望高度
    claim: 随机插入的 BST 期望高度为 O(log n)，但最坏情形（有序插入）退化为 O(n)
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
