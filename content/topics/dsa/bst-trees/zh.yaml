steps:
- id: why
  title: 为什么哈希表之外还要树
  tldr: 哈希表查单点 O(1)，但回答不了「大于 X 的最小元素」「X 到 Y 之间全部」这类有序问题。
  body: '很多需求天生有序，排行榜取一段、时间线按范围截取、字典序找前后邻居。哈希表把键打散了，顺序信息全丢；排序数组查询快但插入要搬移一半元素。二叉搜索树（BST）是折中，动态增删的同时保持全局有序，中序遍历输出即排序结果。它还是后面 B+ 树索引、各种有序容器的直系祖先。

    把三种结构的账摆在一起看更清楚，哈希表点查平均 O(1) 但没有顺序，给它一万个键也答不出谁是比 42 大的最小者。排序数组二分查是 O(log n)，前驱后继也现成，可是插入一个新键要把后面一半元素整体搬家，写多读少就亏了。链表插入 O(1) 但查找要从头扫。三者缺的都是同一件事，在动态增删下同时保住顺序与对数级操作，BST 恰好填这个空。

    还要澄清一个误解，BST 的有序是结构性质，不是一次排序的结果。每插入一个键它都落在唯一合法的位置，全局顺序从不被打乱，这也是它能支撑范围查询边查边剪枝的原因。数据库与文件系统最后选了它的多叉版本，道理同源，先把单键版本学透，后面只是把节点放大而已。'
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 12 Binary Search Trees
    claim: 二叉搜索树支持动态有序集合的查找、插入、删除与范围遍历，中序遍历得到有序序列
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
