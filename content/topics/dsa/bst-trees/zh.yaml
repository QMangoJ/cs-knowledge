title: 二叉搜索树与平衡：AVL 与红黑的直觉
summary: 哈希表快但无序；要「有序地存、按范围取」，就用搜索树——再解决它退化成链表的问题。
premise: 以一组整数的插入顺序不同导致树形不同为例。
overview:
- key: 一句话总结
  value: BST 约定左 < 根 < 右，中序遍历即有序；平衡机制保证高度 O(log n)
- key: 三种操作
  value: 查/插/删都是从根向下走一条路，成本正比于树高
- key: 退化
  value: 按有序顺序插入普通 BST 会退化成链表，O(n)
- key: AVL
  value: 每个节点左右高度差 ≤ 1，靠旋转修复，平衡最严
- key: 红黑树
  value: 用颜色规则放宽平衡（最长路 ≤ 2× 最短路），旋转更少，工程最常用
- key: 工程里
  value: Java TreeMap、C++ std::map 是红黑树；数据库索引用它的多叉亲戚 B+ 树
