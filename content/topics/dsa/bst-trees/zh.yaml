- id: search-insert
  title: 查找与插入：只走一条向下的路，成败全看树高
  tldr: 查找和插入沿着完全相同的规则往下走——小往左、大往右，撞到空位就是插入落点；正因为只走一条单程路，一切性能的命脉全系在树有多高上。
  body: |-
    拿画布这棵树走一遍查找 10：站在树根 8 上比大小，10 > 8，左子树整片 [1, 3, 5] 直接扔掉不管，往右走到 12；10 < 12，右子树 14 也不看了，往左一步刚好命中 10，一共只看 3 眼。插入其实跟查找是同一件事：想往树里插一个 7，路线是 8（小，往左）→ 3（大，往右）→ 5（大，往右），发现 5 的右边是个空位，直接把 7 挂上去当右孩子就完事了。再接着查一个不存在的 6，一路走到 7 的左边落空——落空的位置，正好就是将来插入 6 该站的地方。

    你看，查找和插入从不回头，也不横着乱窜，走过的永远只是从树根往下的一条单程路。树如果左右匀称、有 n 个节点，每比一次砍掉大约一半，路长 h ≈ log₂ n；可一旦树长得歪歪扭扭，路长 h 就会拉长。树高 h，就是 BST 全部成本的账单。

    写代码还要提前定好两个边角规矩：一是遇到重复键怎么办，大多数有序容器不插重复节点，命中直接覆盖旧值，如果允许重复就得统一规定「相等一律挂右边」并一直一致，否则删除时会漏掉副本；二是别忘了判空——空树插入时新节点直接变成根，只有一个根时删掉它整棵树要置回 undefined。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 12.2/12.3 查询与插入
    claim: BST 查找与插入都沿唯一一条自根向下的路径进行，时间为 O(h)
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: tree
    caption: 找 10：8 → 12 → 10，三步命中
    tree:
      nodes:
      - v: 8
      - v: 3
      - v: 12
        mark: active
      - v: 1
      - v: 5
      - v: 10
        mark: found
      - v: 14
  log:
  - mode: 查找
    event: "查找走完了：每比较一次就排除一整棵子树，成本只取决于走过的这条路有多长，也就是树高。"
  code:
    lang: typescript
    code: |-
      type Node = { key: number; left?: Node; right?: Node };
      function search(root: Node | undefined, x: number): Node | undefined {
        let cur = root;
        while (cur) {
          if (x === cur.key) return cur;        // 命中
          cur = x < cur.key ? cur.left : cur.right;  // 排除一半
        }
        return undefined;                        // 走到空 = 不存在
      }
    note: 插入 = 一路查到空位后把新节点挂上
    highlight: 5
- id: delete
  title: 删除的难点：有两个孩子时，抄[[中序后继]]的值再删后继
  tldr: 叶子直接拔、独生子直接跨过接走，最棘手的双孩子节点靠「抄[[中序后继]]的值再删后继」化成前两种简单情形，保证中序排列毫发无伤。
  body: |-
    查和插都只要往下挂，删除却要把节点从中间抽走，不能让底下的树枝断掉。按被删节点有几个孩子分三种情况：没有孩子的叶子最省事，比如删掉最左边的 1，直接把 3 的左指针置空就行；只有一个孩子也简单，把父节点的指针跨过被删节点、直接牵住它唯一的孩子，那棵子树原封不动接回来，高度至多降 1。

    真正卡住人的是有两个孩子的情况——比如删掉画布的树根 8，它左边挂着 [3, 1, 5]，右边挂着 [12, 10, 14]，拔掉 8 立刻碎成两半。谁有资格接替 8 站在根上，还继续保证左边都比它小、右边都比它大？答案就在中序序列 1、3、5、8、10、12、14 里紧挨着 8 后面的那个数 10——它叫[[中序后继]]，物理位置就在 8 的右子树里一路往左拐到底的尽头。我们不搬节点，只把 10 抄写到根的位置（8→10），然后转头去删掉原来那个 10 节点。

    等等，删原位置的 10 不会又遇到两个孩子、套娃没完吗？绝不会！因为 10 已经是右子树里「最靠左」的尽头了，它的左边必定是空的，最多只可能挂着一个右孩子（在这个例子里它干脆就是叶子）。于是任何两孩子的删除，都稳稳落回前面最多一个孩子的简单情形。删完核对中序：1、3、5、10、12、14，严丝合缝。顺便提醒：别把后继节点整棵硬搬上来，那样指针满天飞，平衡树统一靠「抄值 + 删后继」把结构改动压到最小，删完再沿删除点往上修复平衡。
  derivation: original
  sources:
