- id: order-statistics
  title: 顺序统计：第 k 小与名次查询
  tldr: 每个节点多存子树大小 size，就能沿一条路径直接定位第 k 小或某键的名次，仍是 O(log n)。
  body: 'BST 稍加武装就能回答顺序统计问题，给每个节点多存一个字段 size，记录以它为根的子树节点总数，插入删除时沿途把 size 加一或减一维护好。查第 k 小时从根出发，设左子树 size 为 L，若 k 等于 L 加 1，根就是答案，若 k 小于等于 L，答案在左子树里继续查，若 k 更大，则去右子树查第 k 减 L 减 1 小，全程只走一条路径。

    走一遍画布的树，根 8 的左子树有 3 个节点，查第 4 小时 k 正好等于 3 加 1，命中根 8，与中序序列 1、3、5、8、10、12、14 的第 4 个对得上。再查第 6 小，k 大于 4，去右子树查第 6 减 4 等于第 2 小，右子树根 12 的左子树只有 10 一个节点，于是命中 12。反过来查某个键排第几是同一套 size 的逆运算，沿途把跳过的左子树与根累加起来即可。

    代价是每个节点多一个整数字段，平衡树的旋转还要顺手修正被转节点的 size，写漏一处名次就会全错。这是它没有普及到每个容器里的原因，需要名次语义时才值得付这笔维护费，排行榜取第 k 名、分页取一段本质都是它，CLRS 把这套扩展叫顺序统计树，属于数据结构扩张的经典一课。'
