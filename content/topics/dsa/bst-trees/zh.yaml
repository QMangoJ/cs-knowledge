      - v: 4（p3）
      - v: —
  log:
  - mode: 随机平衡
    event: "随机平衡成立了：优先级由结构自己随机发放，期望高度不再受输入顺序影响。"
- id: avl
  title: "[[AVL]] 与旋转：不破坏中序大小的前提下把树重心换平"
  tldr: 局部「旋转」能做到只改几根指针就把偏高一侧压平、同时完全不打乱中序大小顺序；[[AVL]] 靠这招把每个节点的左右高差锁在 1 以内，查询步数最短，代价是写入频繁旋转。
  body: |-
    怎么才能把长歪的一边压矮，还不打乱整棵树的「左小右大」？核心动作叫旋转。看画布那三个数 3、5、8：如果 3 在根、5 在右、8 在 5 的右边（高 3），把 5 提起来当新根，原本的根 3 降级成 5 的左孩子，8 留在右边——树高立刻从 3 变成 2，而中序序列依然是 3、5、8，顺序一个字没变！如果 5 原本还带着一个左子树（比 3 大、比 5 小），旋转时顺手把它挂到降下来的 3 的右边当右孩子就行。旋转的本质就是「保序换重心」：改几根指针，把重的那侧抬平。

    最早的自平衡树 [[AVL]] 规矩最严：任何节点的左右子树高度差（平衡因子）只能是 −1、0、1。一旦插完节点沿祖先往上查，发现某个祖先高度差突破到 ±2，就按高出那两步的拐弯方向分四种形态：LL（左孩子的左子树高）和 RR（右孩子的右子树高）是一条直斜线，转 1 次就行；LR 和 RL 拐了个折线弯，得先转下面把折线拉直，再转上面。走两个最小例子：依次插 10、20、30，10 的右边歪成 2 层、平衡因子 −2（RR 形态），对 10 左旋 1 次，20 升成根、10 降到左边，中序仍是 10、20、30；如果是插 30、10、20（LR 拐弯形态），得先把 10 和 20 左旋拉直，再把 30 和 20 右旋压平，两次旋转缺一不可。

    AVL 把平衡盯到极致，整棵树永远紧绷得接近完美高度，所以查找时走过的步数最少；代价是写操作特别爱折腾——每次插入要一路回溯高度，删除一次还可能引发一连串旋转一路传回树根，适合读多写少的查表场景。
  derivation: original
  sources:
  - ref: clrs
    locator: 平衡搜索树相关章节（AVL 见习题与延伸阅读）
    claim: AVL 树维持左右子树高度差至多 1，并用旋转在 O(log n) 内恢复平衡
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: tree
    caption: 旋转只改指针，不改中序顺序（3,5,8 不变）
    tree:
      nodes:
      - v: 5
        mark: found
      - v: 3
      - v: 8
  log:
  - mode: 平衡
    event: "旋转规则定清了：失衡形态决定旋转方式，同一侧高的形态转一次，交叉形态要转两次。"
- id: redblack
  title: "[[红黑树]]：把平衡放宽到两倍高差，用少旋转赢下标准库"
  tldr: 把平衡放宽一格到「最长路不超过最短路的 2 倍」，[[红黑树]]多数插入只要变色、旋转被限制在常数次以内，凭借更低的写代价成了主流语言标准库有序容器的默认底层。
  body: |-
    如果是个写入和删除都很频繁的容器，非要像 [[AVL]] 那样把左右高度差卡死在 1 格以内，每次增删动不动就旋转未免太娇气了。[[红黑树]]想得通透：只要树高还是 O(log n) 数量级，高出那两三层几乎感觉不到，省下旋转才是硬道理！它给节点涂红或黑，守几条颜色规矩：根是黑的；红节点绝不能生红孩子；从任意节点出发往所有叶子走，每条路踩过的黑节点数量必须一模一样（黑高一致）。

    来看画布里这棵树：从黑根 8 到黑叶 1 经过 2 个黑节点（8、1），到黑叶 5 也是 2 个黑（8、5），到 10 和 14 也全是 2 个黑——所有路黑数一模一样。中间夹了红节点 3 和 12 把某些路拉长了一格，但因为红节点不能父子挨着，一条路最多也就「一黑一红」交替着走，所以最长路径绝不会超过全黑最短路径的两倍。[[CLRS]] 给出的树高上界是 2·lg(n + 1)，稳稳锁死在对数级。

    别小看这一格宽容：新节点插进来先涂成红色，只要它爸爸是黑的，黑高没变、红也没相邻，什么都不改直接收工！就算撞上红爸爸触发修复，大多数时候也只是改几个颜色就糊过去了——插入最多只转 2 次，删除最多转 3 次，绝不像 AVL 删除那样一路连环转到根。正因写开销低得惊人，Java 的 [[TreeMap]] 和 C++ 的 [[std::map]] 底层全选了红黑树。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 13 Red-Black Trees
    claim: 红黑树的颜色性质保证树高至多 2lg(n+1)，从而查找/插入/删除均为 O(log n)
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: tree
    caption: 规则管的是「黑高一致」，路径长度差被限制在两倍内
    tree:
      nodes:
      - v: 8（黑）
        mark: found
      - v: 3（红）
      - v: 12（红）
      - v: 1（黑）
      - v: 5（黑）
      - v: 10（黑）
      - v: 14（黑）
  log:
  - mode: 平衡
    event: "红黑树的取舍定清了：平衡放松一格、旋转少得多，这正是它成为标准库默认选择的原因。"
- id: order-statistics
  title: 顺手统计名次：给节点加一个子树 size，O(log n) 查第 k 小
  tldr: 给每个节点多记一个「以我为根一共挂了几个节点」，查排行榜第 k 名或算某人排第几就不用从头中序数一遍，靠左子树 size 导航只走一条对数级路径直达答案。
  body: |-
    回到开头那个积分榜，如果玩家突然问「当前排第 4 名的是谁」「第 6 名又是谁」，普通 BST 只能老老实实从最小那头中序数过去，又要花 O(n)。其实只要做一点小改装（[[CLRS]] 叫顺序统计树）：给每个节点多存一个整数 size，记录它自己加上左右两棵子树一共多少人。从根往下查第 k 小只需要看一眼左子树的 size（记作 L）：如果 k 恰好等于 L + 1，那当前根就是第 k 小；如果 k ≤ L，答案一定在左子树；如果 k > L + 1，直接丢掉左边和根共 L + 1 个人，去右子树查第 k − L − 1 小。

    拿画布上标好 size 的树走两遍：根 8 的总 size 是 7，左子树 3 的 size 是 3。想查第 4 小，正好 4 = 3 + 1，一刀命中树根 8，对照中序 1、3、5、8、10、12、14 果然第 4 个就是 8。再查第 6 小，6 > 3 + 1，果断往右跳，去右子树 12 里找第 6 − 4 = 2 小；而 12 的左孩子 10 只有 s1，2 正好等于 1 + 1，一跳就命中 12。反过来问某个值排第几名，只是顺着查找路径把沿途跳过的左子树 size 全累加起来，同样是 O(log n)。

    代价是每次插入、删除，特别是树做旋转换重心时，所有被挪动的节点都必须重新算一遍 size = 左 size + 右 size + 1，漏掉一处整棵树的名次就全乱。业务真需要实时分页或排行榜名次再上这字段，不需要就别白付这笔维护账。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 14 Augmenting Data Structures（顺序统计树）
    claim: 在红黑树节点上增设子树大小字段后，可在 O(log n) 内求第 k 小元素与元素的名次
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: tree
    caption: 括号内是子树 size，查第 4 小一次命中根
    tree:
      nodes:
      - v: 8（s7）
        mark: found
      - v: 3（s3）
      - v: 12（s3）
      - v: 1（s1）
      - v: 5（s1）
      - v: 10（s1）
      - v: 14（s1）
  log:
  - mode: 顺序统计
    event: "顺序统计走完了：靠每个节点存的子树大小来导航，查第几小不必遍历整棵树。"
- id: engineering
  title: 工程选型与通向 [[B+ 树]]：内存树搬上磁盘为什么非变胖不可
  tldr: 内存有序结构看读写与并发选[[红黑树]]或[[跳表]]；上了磁盘之后，二叉树几十层等于几十次慢速寻道，必须换成一个节点塞满一整页几百个键的 [[B+ 树]]。
  body: |-
    先走完一开始留下的范围查询：在画布那棵树上找 5 到 12 之间的全部键，从根 8 出发，8 在区间里收下；因为 8 ≥ 5，左子树里可能还有数，但走到 3 发现 3 < 5，于是 3 的左子树 1 连看都不看整片剪掉，只去右边的 5；同理右边走到 12 时直接收下并剪掉大于 12 的右子树 14，最后收齐 5、8、10、12。总代价正比于「树高 + 吐出的结果数」，这就是哈希表一辈子学不会的范围本事。内存工程选型也很清楚：只要点查就选哈希表；既要有序又要动态增删，Java/C++ 用红黑树，而 Redis 的有序集合选了实现更简单、没有旋转和颜色的[[跳表]]。

    可是一旦把数据存到磁盘，红黑树和跳表立刻水土不服。原因藏在存储介质的账本里：磁盘每次读写的最小单位是整页（比如 16KB 量级），你只读 1 个键它也得搬一整页回来。二叉树一个节点只装 1 个键，几十层树高意味着几十次[[随机 IO|IO]]，慢到不可用。[[B+ 树]]的解法很直白——既然每次都要读一整页，干脆把一个节点撑胖到装下整页几百个键、分出几百个叉，树高一下子压到 3 到 4 层，查一次只读几页；再把所有叶子串成链表方便范围横扫，数据存储科的数据库索引课就专门讲它。

    最后留三句整课带走判断，选型再也不迷糊：① 为什么用树不用哈希：哈希快但乱序，一旦要范围扫描、找前驱后继或算名次就得请树出场；② 内存平衡怎么挑：怕有序写入退化成链表就得靠「保序旋转」，极度偏读找更矮的 [[AVL]]，读写均衡就跟标准库选旋转极少的[[红黑树]]，追求简单还可以选[[跳表]]；③ 磁盘为什么换 [[B+ 树]]：内存按字节跳、磁盘按整页读，存储介质变了，树就得变胖降层。口诀记一句：「左小右大保有序，有序插入变链表；保序旋转撑树高，严选 AVL 稳红黑，落盘变胖 B+ 树。」
  derivation: original
  sources:
  - ref: cmu-15445
    locator: Lecture 08 Indexes & Filters（B+Tree 与索引选型）
    claim: 磁盘索引需要高扇出的 B+ 树以降低树高与 IO 次数，哈希索引不支持范围查询
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: "同样的数据量，树的形状完全不同：二叉树有几十层，B+ 树只有 3 至 4 层，查一次要读的磁盘页数差了一个量级"
    rows:
    - label: 二叉树
      cells:
      - v: 每节点 1 键
      - v: 高度 ~log2 n
    - label: B+ 树
      cells:
      - v: 每节点数百键
        mark: found
      - v: 高度 3–4
        mark: found
  log:
  - mode: 选型
    event: "选型结论收口为一句：存储介质变了，最优的树形就跟着变，磁盘上要用一个节点装几百个键的 B+ 树。"
level: 进阶
minutes: 34
prereq:
- dsa/binary-search
- dsa/binary-heap
objectives:
- 描述 BST 查找/插入/删除的完整过程（含两孩子删除）
- 解释退化成因与 AVL/红黑两种平衡策略的取舍
- 说清内存搜索树与磁盘 B+ 树的分工
aiLink: 有序结构在 AI 系统里无处不在：向量检索的图索引之外，KV 缓存的块管理、特征存储的有序扫描、调度器的优先队列替代结构都建立在搜索树思想上；理解它才能理解下一课 B+ 树与 LSM 的分工。
design:
- mechanism: 用自平衡机制保住对数树高，不赌输入顺序
  problem: 想让数据既能随时增删又能按范围查，哈希表和排序数组都做不到；可普通 BST 一碰到自增 ID、时间戳这类天然递增的数据，每次全往最右边挂，树高直接塌成 O(n) 单链表。
  choice: 在「左小右大」的规矩之上再叠一层自平衡机制：靠不打乱中序顺序的局部旋转（[[AVL]]、[[红黑树]]）或随机优先级（[[Treap]]），每次增删发现长歪就立刻扳正，把树高死死压在 O(log n)。
  tradeoff: 节点要多存高度、颜色或随机数，每次写入也要多付检查与旋转的成本；换来的是不管数据按什么顺序进来，最坏查询深度都不会崩盘。
  root: 只靠两两比大小把 n 个键区分开，至少需要 log₂ n 层比较深度——平衡不是为了好看，而是让树形贴住这条理论下限、不让已经付出的比较白费。
- mechanism: 红黑树放宽高度换少旋转，拿综合吞吐赢下标准库
  problem: "[[AVL]] 把左右高度差死锁在 1 以内，写多读少时每次增删动不动连环旋转一路传到根，维护平衡的开销反过来拖慢了整体速度。"
  choice: "[[红黑树]]只用颜色规矩保住「黑高一致、红不相邻」，把限制放宽到「最长路不超过最短路两倍」——大部分插入改几个颜色就收工，旋转次数被封顶在常数次（插入最多 2 次、删除最多 3 次）。"
  tradeoff: 树比 AVL 稍微胖了一圈，纯查询时平均多比一两次；但写入和删除的搬动大减，综合吞吐在通用容器里胜出，Java [[TreeMap]] 和 C++ [[std::map]] 全选它。
  root: 工程追求的是读写加起来的总成本最低，而不是树高绝对最矮——只要树高还在对数量级里，省下写旋转的收益远大于省下那一两层比较。
- mechanism: 内存树搬上磁盘，必须变胖成 B+ 树
  problem: 内存里二叉树几十层只是几十次指针跳转，搬到磁盘就变成几十次慢得要命的随机读盘；而且磁盘每次最少读写一整页（16KB 量级），一个节点只放 1 个键等于把整页都浪费掉。
  choice: 把每个节点撑胖到和磁盘页一样大，一页塞几百个键、分出几百个叉，把树高狠压到 3–4 层，再把叶子串成链表方便范围扫描——这就是数据库标配的 [[B+ 树]]。
  tradeoff: 单个节点变胖后，写满分裂或删空合并的逻辑更复杂、还要搬动更多键；换来的是磁盘读盘次数从几十次暴降到三四次。
  root: 数据结构必须长在存储介质的成本账上：内存按字节跳转几乎等速，磁盘按整页读取寻道极贵，介质变了，最优树形就得跟着变胖。
quiz:
- q: BST 中删除一个有两个孩子的节点，标准做法是？
  options:
  - 直接摘掉，让两个子树断开
  - 用中序后继的值填进来，再删除后继节点
  - 把整棵树重建
  - 随机选一个孩子顶替根
  answer: 1
  explain: 后继是右子树最小值，至多一个孩子，删它落回简单情况；值抄过来后有序性保持。
- q: 红黑树为什么能保证高度 O(log n)？
  options:
  - 因为节点都是红色的
  - 颜色规则保证最长路径不超过最短路径的两倍
  - 因为它每年自动重建
  - 因为插入总是完美的
  answer: 1
  explain: 黑高一致 + 红节点不能相邻，推出路径长度被限制在两倍内，于是高度至多 2lg(n+1)。
- q: 把有序数据依次插入普通 BST 会怎样？
  options:
  - 自动变平衡
  - 退化成一条链，操作变成 O(n)
  - 报错
  - 变成堆
  answer: 1
  explain: 每个新元素都更大、一路右拐，树高等于 n——这正是需要自平衡机制的原因。
