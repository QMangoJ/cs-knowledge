- id: redblack
  title: 红黑树：把平衡放松一点，换更少的旋转
  tldr: 用颜色规则保证「最长路径 ≤ 2 倍最短路径」，高度仍是 O(log n)，但插入平均旋转次数远少于 AVL。
  body: '红黑树给每个节点涂红或黑，规则是，根是黑的；红节点的孩子必须是黑的；从任一节点到其所有叶子后代的路径上，黑节点数目相同。由这几条可推出，最长可能路径不超过最短可能路径的两倍，于是高度被摁在 O(log n) 量级（CLRS 给出上界 2·lg(n+1)）。它的平衡比 AVL 松，查找略慢一丁点，但插入与删除的调整平均更省，所以成了语言标准库有序容器的默认选择，Java 的 TreeMap、C++ 的 std::map 都是红黑树。

    用一个数例体会黑高，画布这棵树从根 8 到 1 的路径上黑节点是 8 与 1 共 2 个，到 5 的路径是 8 与 5 也是 2 个，到 14 是 8 与 14 仍是 2 个，每条根到叶路径的黑数都相同，这就是黑高一致。红色节点 3 与 12 的存在让某些路径边数变多，但红节点不能父子相连，最坏情况下红黑交替，边数最多是全黑最短路径的两倍，高度上界由此而来。

    插入修复时多数情况只是变色，新节点先涂红，若父节点是黑的直接结束，父红才触发变色上溯或旋转，插入至多需要常数次旋转，删除同理，与 AVL 删除可能的一路旋转形成对比。工程选它还有个现实原因，变色只是改一个标记位，对缓存与并发读写都更友好，旋转少意味着临界区更短、锁竞争更小。'
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 13 Red-Black Trees
    claim: 红黑树的颜色性质保证树高至多 2lg(n+1)，从而查找/插入/删除均为 O(log n)
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
