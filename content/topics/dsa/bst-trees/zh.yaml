title: 二叉搜索树与平衡：[[AVL]] 与红黑的直觉
summary: 二叉搜索树（BST）的秘密就一条规矩——左子树全比根小、右子树全比根大，于是查找、插入和删除全顺着一条路往下走，代价全看树有多高；可一旦按自增 ID 或时间戳这类近乎有序的顺序往里插，整棵树就会退化成一条 O(n) 的链表，性能瞬间崩盘。想要保住对数级树高，就得靠不打乱中序顺序的局部「旋转」来换重心：[[AVL]] 严防死守左右高度差不超过 1，查得最快但写起来转个不停；[[红黑树]]把规矩放宽到「最长路不超过最短路两倍」，牺牲一丁点高度换来极少旋转，成了标准库最爱；数据一上磁盘，二叉树层数还是太多，就得换成一页塞几百个键的 [[B+ 树]]。
premise: 这节课的场景很具体：你要维护一个不断增删的实时积分榜，既要很快查某个玩家的分数，又要能随时问「5 到 12 分之间有哪些人」「比 9 分大一点的最小分数是谁」。哈希表一碰顺序就瞎，排序数组一插新玩家就得挪半张表；二叉搜索树靠「左小右大」保住了全局顺序，可要是不小心按 1、2、3、4、5 的顺序插进去，树会直接歪成一条单链表。本课拿 [1, 3, 5, 8, 10, 12, 14] 这棵树做主线，看清操作全靠树高撑着、为什么会退化成链表、旋转又怎样在不破坏顺序的前提下把重心换平，最后落地到 AVL、红黑树和磁盘 B+ 树各自该用在哪。
position: 本课回到数据结构与算法的「树形结构」板块，排在「图上的行走」板块 Dijkstra 最短路径之后、下一板块「记住子问题的答案」（动态规划）之前。前面堆用数组只保极值，Dijkstra 也借堆每轮揪出距离最近的点；本课把树的目标从「只拎极值」升级到「保住完整有序与范围查询」，并将树高与均衡直觉一直延伸到数据存储科的 B+ 树磁盘索引。
bridge:
  prev: 上一课 Dijkstra 靠二叉堆在每轮松弛后挑出距离起点最近的点，但堆管不了全体次序，也没法查区间。这一课回到树形结构，看二叉搜索树怎样靠左小右大把整组数据有序地挂起来，又怎样避免歪成一条链。
  next: 搜索树靠每次比较就把一整棵子树彻底剪掉来省力，各个分支彼此互不干系；可下一课动态规划面对的是另一桩麻烦——拆出来的子问题互相重叠、反复重算，如果不存下来就会爆成指数级。
overview:
- key: 一句话总结
  value: BST（二叉搜索树 Binary Search Tree）守着「左小右大」一条铁律：中序遍历天然有序，查、插、删全都顺着一条从根向下的路走，耗时直接等于树高。
- key: 链表退化痛点
  value: 普通 BST 不会自己长平：一旦按 1、2、3、4、5 这种有序数据（比如自增主键、时间戳）依次往里插，每个新数都挂在最右边，整棵树直接退化成 O(n) 单链表，查一次从 20 步跌成几十万步。
- key: 旋转换重心
  value: 平衡树的核心动作是旋转——在不打乱中序大小顺序的前提下，把偏高那一侧的某个节点提上来当新根、旧根退到偏矮那侧，顺手就把树高拍平了。
- key: AVL vs 红黑树
  value: "[[AVL]] 盯着每个节点左右高度差不超过 1，树最矮、查找极快，适合读多写少；[[红黑树]]只用颜色规则压住「最长路不超过最短路 2 倍」，允许一点偏斜换来极少旋转，成了 Java [[TreeMap]] 与 C++ [[std::map]] 的默认选择。"
- key: 工程与 B+ 树
  value: 内存里要有序容器选红黑树或[[跳表]]（Redis 有序集合）；到了磁盘上，二叉树几十层等于几十次随机读盘太慢，必须换成一个节点装满一整页、几百个分叉的 [[B+ 树]]，把树高狠压到 3–4 层。
