- id: degeneration
  title: 痛点爆发：按顺序插进树里，BST 直接退化成单链表
  tldr: 普通 BST 经不起自增 ID、时间戳这类有序数据的连续写入——每个新数只能一路往最右边挂，把几十层的平衡树硬生生拖成百万级的单链表。
  body: |-
    前面说的查找只要走几十步，全建立在「树还算匀称」的美好假设上。现实给你泼第一盆冷水：把 1、2、3、4、5 按从小到大依次插进一棵空 BST。1 当根；2 比 1 大挂右边；3 比 1 和 2 都大再挂右边……一路右拐到底，这棵树压根没长出左枝，变成了一根向右斜拉的单链表，查一次 5 就要比较 5 次。

    把账放到真实规模看有多吓人：同样 100 万条数据，平衡的树高大概 20 层，查一次只需约 20 次比较；一旦退化成链，树高就是 100 万，查一次平均要翻 50 万次，慢了整整两万多倍！而且每插一个新元素都得从头走到链尾，插完 100 万条数据总耗时直接退化成 O(n²)。别心存侥幸以为「现实数据都是随机的」——数据库里的自增主键、日志里的时间戳、按序导入的榜单，全都是天然有序，裸 BST 上线第一天就会变成一条链。

    你总不能要求业务方先把数据打乱再存。要想不管来什么顺序都把树高死死摁在 O(log n)，平衡绝不能赌输入运气，必须变成数据结构自带的肌肉反射——每次插完删完发现歪了，当场扳正。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 12.4 随机建树与期望高度
    claim: 随机插入的 BST 期望高度为 O(log n)，但最坏情形（有序插入）退化为 O(n)
