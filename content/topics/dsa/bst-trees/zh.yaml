  - mode: 有序
    event: 哈希表做不到范围与邻居查询，树可以
- id: search-insert
  title: 查找与插入：一条向下的路
  tldr: 从根开始，比根小往左、比根大往右；找到或走到空位——插入就落在那个空位上。
  body: '查找 target，站在根上比较，小了去左子树、大了去右子树、相等命中。每一步排除一半候选（若树是平衡的），走到空指针说明不存在。插入就是一次失败的查找，新节点必然落在查找终止的那个空位置，成为叶子。所以两者成本都正比于树高 h，平衡时 O(log n)，退化时 O(n)，树高就是 BST 的一切。

    拿画布这棵根为 8 的树走一遍插入 7，先比 8 小去左子树，比 3 大去右子树，比 5 大本应继续往右，那里是空位，7 就挂在 5 的右孩子处，全程只碰了 3 个节点。再查一个不存在的 6，路线是 8 到 3 到 5 到 7，比 7 小往左落空，返回不存在，这条落空路线同时告诉你 6 若要插入该落在哪。

    重复键是常见的约定题，多数实现选择不另存，命中即更新附带的值，也有把相等一律往同一侧放的写法，选哪种要在接口上写明，含糊处理会让删除时删错副本。最后强调边界，空树插入时新节点直接成为根，只剩根时删根后树变空，这些平凡情形最容易在代码里漏掉判空，面试与工程里都常栽在这里。'
  derivation: original
