- id: treap-random
  title: 不靠死规矩也能平：[[Treap]] 用随机优先级把长链截断
  tldr: 既然外部输入可能故意有序，[[Treap]] 干脆给每个节点自己掷骰子发随机优先级，键按 BST 排、优先级按堆排，把一长条链表从中间截成期望 O(log n) 高。
  body: |-
    在学严格的旋转规则之前，先看一条很巧妙的思路：数学证明随机顺序插入 BST 期望树高只有 O(log n)，既然外部输入不随机，那数据结构自己掷骰子不就行了？[[Treap]]（Tree + Heap 的合体）给每个节点塞两个值：键按 BST 左小右大排，再额外发一个随机优先级按最大堆（父比子大）排。

    看看它怎么破掉有序插入的魔咒：哪怕你偏要按 1、2、3、4、5 顺序往里插，只要结构给 3 随机抽到了最大优先级 p9、给 5 抽到 p6、给 1 抽到 p4，每次插完按优先级把大的往上旋——3 就会稳稳坐在树根，把整条原本向右拉扯的链从正中间一刀截断，1 和 2 归左枝，4 和 5 归右枝，树高一下压了下来。

    付出的代价是每个节点要多存一个随机数，而且随机性给的是「期望 O(log n)」，极端倒霉时理论上仍有一丝歪掉的概率。所以 C++、Java 标准库想要铁打的最坏保证时一般不用它，但 Treap 揭示的原理非常值钱——用结构内部造出的随机性抵抗外部恶意输入，这和 Redis 用的[[跳表]]（随机抽层高）是完全同一把钥匙。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 12.4 Randomly Built Binary Search Trees（随机建树与期望高度）
    claim: 随机优先级的 Treap 其期望高度为 O(log n)，随机化可避免最坏插入顺序导致的退化
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
