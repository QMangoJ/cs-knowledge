level: 进阶
minutes: 34
prereq:
- dsa/binary-search
- dsa/binary-heap
objectives:
- 描述 BST 查找/插入/删除的完整过程（含两孩子删除）
- 解释退化成因与 AVL/红黑两种平衡策略的取舍
- 说清内存搜索树与磁盘 B+ 树的分工
aiLink: 有序结构在 AI 系统里无处不在：向量检索的图索引之外，KV 缓存的块管理、特征存储的有序扫描、调度器的优先队列替代结构都建立在搜索树思想上；理解它才能理解下一课 B+ 树与 LSM 的分工。
design:
- mechanism: 红黑树为什么用放松的平衡换更少旋转，它只要求最长路径不超过最短路径的两倍，不追求每棵子树高度几乎相等，却仍能把总高锁在二倍对数量级以内，够用即可
  problem: 若像 AVL 那样把高度差摁在 1 以内，每次增删都要频繁旋转修复，写多读少的负载下维护成本会反超查询收益，容器需要一种平衡够用但调整更懒惰的结构来扛住真实负载
  choice: 用红黑颜色规则代替高度差规则，根到叶路径的黑节点数保持一致且红节点不相邻，由此间接限制路径长度比，插入删除先变色、实在不行才旋转，且旋转次数有常数上界
  tradeoff: 放松平衡让查找路径平均比 AVL 略长，纯查询场景要多付几次比较，换来的是插入删除旋转次数大幅减少，综合吞吐在真实标准库负载下反而更高，这笔交换在写密集时尤其划算
  root: 根本原因是工程目标不是高度最小而是总成本最小，高度只要是对数量级，常数差异就会让位给调整频率，平衡的严苛程度本质上是一笔可以按负载调配的预算而非道德标准
- mechanism: BST 的全部操作成本都正比于树高，因为查找插入删除都只沿一条根到叶的路径前进，路径之外的一切子树在每一步比较后就被整体排除，此后不会再被碰到，树高即账单
  problem: 同一个集合用不同插入顺序建树，形状可以从近乎完全二叉树一路退化成链表，若结构对形状不加约束，最坏情形就会在有序输入这种最常见的工程数据上必然发生而不是偶尔发生
  choice: 先用左小右大的不变量保证中序有序，再叠加一层自平衡机制，无论是 AVL 的高度差规则、红黑的颜色规则还是 Treap 的随机优先级，都在增删之后主动把高度摁回对数量级
  tradeoff: 维持平衡让每次写入多付检查与旋转的常数成本，还要给节点多存高度或颜色或优先级字段，换来的是最坏情形也有保证，不必把系统性能押在输入顺序的运气之上
  root: 根本约束是比较决策的信息下限，n 个键的区分至少需要对数量级的比较深度，平衡不是美学追求，而是让数据结构贴住这条下限的唯一办法，退化等于白白浪费已经付出的比较信息
- mechanism: 到了磁盘上最优树形由扇出决定，一个节点装几百个键让树高降到三四层，因为磁盘按页读取，读满一个节点的成本与读一个键几乎相同，节点装得太稀疏等于整页都被浪费
  problem: 二叉搜索树在内存里每步只读一个节点很自然，可磁盘随机读一页要付出远高于内存访问的延迟，几十层树高意味着几十次随机 IO，内存里的最优结构原样搬到磁盘会慢到不可用
  choice: 把节点放大到与磁盘页同尺寸，键在节点内排序并二分定位，叶子之间再串成链表支撑范围扫描，这就是 B+ 树，多数数据库的索引都建立在它之上而不是二叉树的放大版
  tradeoff: 大扇出让单节点的更新要搬动更多键，分裂与合并的逻辑也更复杂，换来的是树高与 IO 次数的数量级下降，读与写的放大之间如何取舍还要按具体负载再做细分
  root: 根本原因是存储介质的成本模型变了，内存按字节随机访问近似均匀，磁盘按块访问且寻道昂贵，结构设计必须服从介质的成本函数，介质一变最优解就跟着变，没有通吃的树形
quiz:
- q: BST 中删除一个有两个孩子的节点，标准做法是？
  options:
  - 直接摘掉，让两个子树断开
  - 用中序后继的值填进来，再删除后继节点
  - 把整棵树重建
  - 随机选一个孩子顶替根
  answer: 1
  explain: 后继是右子树最小值，至多一个孩子，删它落回简单情况；值抄过来后有序性保持。
- q: 红黑树为什么能保证高度 O(log n)？
  options:
  - 因为节点都是红色的
  - 颜色规则保证最长路径不超过最短路径的两倍
  - 因为它每年自动重建
  - 因为插入总是完美的
  answer: 1
  explain: 黑高一致 + 红节点不能相邻，推出路径长度被限制在两倍内，于是高度至多 2lg(n+1)。
- q: 把有序数据依次插入普通 BST 会怎样？
  options:
  - 自动变平衡
  - 退化成一条链，操作变成 O(n)
  - 报错
  - 变成堆
  answer: 1
  explain: 每个新元素都更大、一路右拐，树高等于 n——这正是需要自平衡机制的原因。
