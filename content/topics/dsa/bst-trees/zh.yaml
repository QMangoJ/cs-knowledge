- id: engineering
  title: 工程选型与通向 B+ 树
  tldr: 内存里用红黑树（或跳表）；到了磁盘，节点内要装几百个键，树变成矮胖的 B+ 树。
  body: '选型，需要有序加增删，用红黑树系容器；只要点查，用哈希表；并发场景里 Redis 的有序集合用了跳表（结构更简单、范围操作友好），它们解决的是同一个有序动态集合问题。但把这套搬到磁盘会翻车，二叉树每个节点只装一个键，查一次跨好几层就是好几次随机 IO。磁盘按页（16KB 量级）读写，于是让一个节点装下整页的几百个键，树高从几十降到 3 至 4，这就是数据存储学科的 B+ 树，建议接着学它。

    再补一个范围查询的走法，在 BST 里找 5 到 12 之间的全部键，从根 8 开始，它在范围内收下，再递归左子树找大于等于 5 的部分、右子树找小于等于 12 的部分，凡是整棵子树都落在范围外的分支直接剪掉，总代价正比于树高加结果个数，这是哈希表永远做不到的遍历方式，也是有序结构不可替代的核心理由。

    跳表值得多说一句，它用多层链表加随机层高达到期望 O(log n)，没有旋转、没有颜色，范围扫描就是底层链表顺着走，Redis 选它部分是因为实现与调试远比红黑树简单。选型时先问三个问题，要不要顺序、写并发高不高、数据在内存还是磁盘，三个答案定了，结构基本就定了，剩下的是在同族实现里挑顺手的那个。'
