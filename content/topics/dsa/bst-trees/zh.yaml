  log:
  - mode: 查找
    event: 每比较一次排除一棵子树
  code:
    lang: typescript
    code: "type Node = { key: number; left?: Node; right?: Node };\nfunction search(root: Node | undefined, x: number): Node | undefined {\n  let cur = root;\n  while (cur) {\n    if (x === cur.key) return cur;        // 命中\n    cur = x < cur.key ? cur.left : cur.right;  // 排除一半\n  }\n  return undefined;                        // 走到空 = 不存在\n}"
    note: 插入 = 一路查到空位后把新节点挂上
    highlight: 5
- id: delete
  title: 删除：三种情况，难在有两个孩子
  tldr: 叶子直接删；一个孩子用孩子顶替；两个孩子用右子树最小值（后继）的值填进来再删后继。
  body: '删除是 BST 最麻烦的操作，按孩子数分三种，没有孩子直接摘掉；只有一个孩子，把父节点的指针绕过它、直连它的孩子；两个孩子都有，不能直接摘（会断成两截），标准做法是找它的中序后继（右子树中最靠左的节点，它至多一个右孩子），把后继的值抄过来，再删后继那个节点（落回前两种情况）。记住这套分工，真正被摘掉的节点永远至多一个孩子。

    把另外两种情形也在同一棵树上走完。删叶子 1，它没有孩子，直接把 3 的左指针置空，树形其余部分纹丝不动。删只有一个孩子的节点，设某节点只有右孩子，就把父指针绕过它直连那个右孩子，被删节点摘除而孩子的整棵子树原样保留，高度最多降一。再回到两孩子情形删根 8，后继是右子树一路往左的尽头 10，把 10 抄到根的位置，原来的 10 是叶子直接摘掉。

    删完核对中序序列，结果是 1、3、5、10、12、14，与删除前只差被删的 8，有序性完好。这里有个易错点，抄的是后继的值而不是把后继节点整棵搬上来，搬节点要处理双向指针与颜色等附加字段，平衡树实现一律用抄值加删后继，就是为了把结构调整收敛到最简单的一种情形。删完之后树高可能变化，平衡树还要从删除点往上逐层检查并修复。'
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 12.3 删除
    claim: BST 删除两孩子节点时以中序后继替代，并将问题归结为删除至多一个孩子的节点
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
