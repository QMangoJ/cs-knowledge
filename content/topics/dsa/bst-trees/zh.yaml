- id: treap-random
  title: 随机化平衡：Treap 与随机性的启示
  tldr: 给每个键随机发一个优先级，键按 BST 排、优先级按堆排，期望高度被随机性本身摁在 O(log n)，与插入顺序无关。
  body: '还有一条不靠旋转规则的平衡路线，给每个键再随机发一个优先级，要求键按 BST 排序、优先级按堆排序，这棵树叫 Treap，是 tree 与 heap 的合体。插入时先按 BST 落位，再按优先级把节点旋转上来，删除则反着转下去。因为优先级是随机发的，树的期望高度被随机性本身摁在 O(log n)，与键的输入顺序无关。

    它的道理与随机插入顺序时期望高度 O(log n) 是同一件事，只不过把随机性从不可控的输入顺序搬进了结构内部，自己掷骰子就不必求输入给面子。有序插入 1 到 5 时，若优先级恰好让 3 最大，3 就是根，左右再按各自最大优先级递归成型，原本的链被随机根从中间截断，这就是它躲开退化的方式。

    代价是每个节点多存一个随机数，且高度只有期望保证没有最坏保证，运气极差时仍可能偏高。标准库要的是确定性保证，所以 Treap 更多出现在算法竞赛与教学里，但它揭示的原理很重要，平衡不一定靠严苛规则，也可以靠随机，这是理解跳表随机层高的同一把钥匙。'
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 12.4 Randomly Built Binary Search Trees（随机建树与期望高度）
    claim: 随机优先级的 Treap 其期望高度为 O(log n)，随机化可避免最坏插入顺序导致的退化
