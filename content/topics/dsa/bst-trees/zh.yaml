- id: avl
  title: AVL：用旋转把高度差摁在 1 以内
  tldr: 每个节点左右子树高度差 ≤ 1；插入后沿路检查，失衡就用单旋/双旋把结构转回来。
  body: 'AVL 树是最早的自平衡 BST，规则最严，任一节点的平衡因子（左高减右高）只能是负 1、0、1。插入新节点后，从它往根回溯，发现第一个失衡的祖先，按四种形态（LL、RR、LR、RL）做一次或两次旋转，旋转是局部的指针调整，保持中序顺序不变、把高的那侧压下来。严平衡的代价是插入与删除时旋转更频繁，回报是查找路径最短，适合读多写少的场景。

    补一个最小旋转走例，依次插入 10、20、30，30 落到 20 的右孩子，10 的左右高度差变成负 2，形态是 RR，对 10 做一次左旋，20 升为根，10 降为左孩子，30 仍是右孩子，中序还是 10、20、30，高度从 3 降回 2。再看 LR 形态，插入 30、10、20，20 落在 10 的右孩子处使 30 失衡，要先对 10 左旋再对 30 右旋，两次旋转缺一不可，只旋一次反而会换个方向失衡。

    旋转的代价是常数次指针改写，但 AVL 插入后可能要沿祖先链逐个检查平衡因子，删除时旋转还可能一路级联到根。把这笔账记住，AVL 的严是拿写操作的维护成本换的，它的高度比红黑树更矮，纯查询负载下这点差距会被放大成实打实的比较次数优势，选型时先看读写比例再下结论。'
  derivation: original
  sources:
  - ref: clrs
    locator: 平衡搜索树相关章节（AVL 见习题与延伸阅读）
