steps:
- id: why
  title: 为什么哈希表之外还要树：有序和范围查，哈希表干不了
  tldr: 哈希表按名点查快到 O(1)，代价是把大小关系打散了；要想在不断增删的同时做区间筛选、找前驱后继，就得用靠「左小右大」把秩序长在结构里的二叉搜索树。
  body: |-
    回到咱们的实时积分榜：玩家分数不停增删，你不仅要查某个分数在不在，更常要问「5 到 12 分之间有哪些人」「比 9 分大一点的最小分数是谁」。哈希表取余一散列，1、3、5、8 被扔进八竿子打不着的桶里，大小顺序丢得干干净净，给它一万个键也答不出比 9 大的最小者；排好序的数组二分查找虽然是 O(log n)，但每新来一个玩家插进去，后面一半元素都要往后挪一格，写多读少直接亏掉。

    二叉搜索树（BST）正好把这两者的短板补齐：它只在结构上定下一条死规矩——任何节点的左子树全比它小，右子树全比它大。看画布里这棵以 8 为根的树，左边 3、1、5 全小于 8，右边 12、10、14 全大于 8；按「左—根—右」的中序走一遍，吐出来的就是排好序的 1、3、5、8、10、12、14。

    关键在于这份顺序是长在树结构里的，不是每次重排凑出来的：每新插一个数它都会停在唯一合乎大小规矩的位置，全局顺序一刻都没乱过。后面不管是单点查找还是范围扫，每比一次都能放心地把整片不可能的分支一刀剪掉。
