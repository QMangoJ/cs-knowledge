steps:
- id: why
  title: 为什么哈希表之外还要树
  tldr: "先把问题摆清：哈希表按名字查一步到位，可它回答不了大于某个数的最小值是谁、某个区间里都有哪些数这类和顺序有关的问题。这一步把哈希表、排序数组、搜索树三本账摆在一起，看搜索树填的是哪个空。"
  body: >-
    很多需求天生有序：排行榜取一段、时间线按范围截取、字典序找前后邻居。哈希表把键打散了，顺序信息全丢；排序数组查询快但插入要搬移一半元素。二叉搜索树（BST）是折中：动态增删的同时保持全局有序，中序遍历输出即排序结果。它还是后面 B+
    树索引、各种有序容器的直系祖先。


    把账摆在一起：哈希表点查平均 O(1) 但没有顺序，给它一万个键也答不出谁是比 42 大的最小者；排序数组二分查是 O(log
    n)，可是插入新键要把后面一半元素整体搬家，写多读少就亏了。三者缺的都是同一件事：在动态增删下同时保住顺序与对数级操作，BST 恰好填这个空。


    BST 的有序是结构性质，不是一次排序的结果：每插入一个键它都落在唯一合法的位置，全局顺序从不被打乱，这也是它能支撑范围查询边查边剪枝的原因。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 12 Binary Search Trees
    claim: 二叉搜索树支持动态有序集合的查找、插入、删除与范围遍历，中序遍历得到有序序列
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: tree
    caption: 左小右大：中序遍历 3, 5, 8, 10, 12 天然有序
    tree:
      nodes:
      - v: 8
        mark: found
      - v: 3
      - v: 12
      - v: 1
      - v: 5
      - v: 10
      - v: 14
  log:
  - mode: 有序
    event: "结论立好了：哈希表做不到范围查询和邻居查询，搜索树靠左小右大的约定把顺序保在结构本身里。"
- id: search-insert
  title: 查找与插入：一条向下的路
  tldr: "约定立好了——左边的键小于根、右边的键大于根——这一步跟着它走一遍查找和插入：从根开始比大小、往一侧走，直到命中或走到空位。看清插入就是一次没有找到的查找之后，再把两种操作的成本账归到树高上。"
  body: >-
    查找 target，站在根上比较：小了去左子树、大了去右子树、相等命中。每一步排除一半候选（若树是平衡的），走到空指针说明不存在。插入就是一次失败的查找，新节点必然落在查找终止的那个空位置，成为叶子。所以两者成本都正比于树高
    h，平衡时 O(log n)，退化时 O(n)——树高就是 BST 的一切。


    拿画布里根为 8 的树走一遍插入 7：比 8 小去左子树，比 3 大去右子树，比 5 大本应继续往右，那里是空位，7 就挂在 5 的右孩子处，全程只碰了 3 个节点。再查一个不存在的 6，路线是 8 到 3 到 5 到 7，比 7
    小往左落空，返回不存在，这条落空路线同时告诉你 6 若要插入该落在哪。


    重复键是常见的约定题：多数实现不另存，命中即更新附带的值，选哪种要在接口上写明，含糊处理会让删除时删错副本。空树插入时新节点直接成为根，只剩根时删根后树变空，这些平凡情形最容易漏掉判空。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 12.2/12.3 查询与插入
    claim: BST 查找与插入都沿唯一一条自根向下的路径进行，时间为 O(h)
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: tree
    caption: 找 10：8 → 12 → 10，三步命中
    tree:
      nodes:
      - v: 8
      - v: 3
      - v: 12
        mark: active
      - v: 1
      - v: 5
      - v: 10
        mark: found
      - v: 14
  log:
  - mode: 查找
    event: "查找走完了：每比较一次就排除一整棵子树，成本只取决于走过的这条路有多长，也就是树高。"
  code:
    lang: typescript
    code: |-
      type Node = { key: number; left?: Node; right?: Node };
      function search(root: Node | undefined, x: number): Node | undefined {
        let cur = root;
        while (cur) {
          if (x === cur.key) return cur;        // 命中
          cur = x < cur.key ? cur.left : cur.right;  // 排除一半
        }
        return undefined;                        // 走到空 = 不存在
      }
    note: 插入 = 一路查到空位后把新节点挂上
    highlight: 5
- id: delete
  title: 删除：三种情况，难在有两个孩子
  tldr: "查找和插入都只沿一条路往下走，删除要麻烦得多。这一步按孩子个数分成三种情况逐个处理，重点看有两个孩子时为什么不能直接摘掉、要先找[[中序后继]]抄它的值再删后继。"
  body: |-
    删除是 BST 最麻烦的操作，按孩子数分三种：没有孩子直接摘掉；只有一个孩子，把父节点的指针绕过它、直连它的孩子；两个孩子都有，不能直接摘（会断成两截），标准做法是找它的中序后继（右子树中最靠左的节点，它至多一个右孩子），把后继的值抄过来，再删后继那个节点（落回前两种情况）。真正被摘掉的节点永远至多一个孩子。

    在同一棵树上走完另外两种：删叶子 1，直接把 3 的左指针置空，其余纹丝不动。删只有一个孩子的节点，就把父指针绕过它直连那个孩子，孩子的整棵子树原样保留，高度最多降一。再回到两孩子情形删根 8，后继是右子树一路往左的尽头 10，把 10 抄到根的位置，原来的 10 是叶子直接摘掉。

    删完核对中序序列：1、3、5、10、12、14，与删除前只差被删的 8，有序性完好。易错点：抄的是后继的值，而不是把后继节点整棵搬上来——平衡树一律用抄值加删后继，把结构调整收敛到最简单的一种情形。删完之后平衡树还要从删除点往上逐层检查并修复。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 12.3 删除
    claim: BST 删除两孩子节点时以中序后继替代，并将问题归结为删除至多一个孩子的节点
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: tree
    caption: 删 8（两孩子）：后继是 10，抄值后改删 10 所在的叶位置
    tree:
      nodes:
      - v: 8→10
        mark: active
      - v: 3
      - v: 12
      - v: 1
      - v: 5
      - v: 10
        mark: found
      - v: 14
  log:
  - mode: 删除
    event: "删除走完了：有两个孩子的情形被转化成抄中序后继的值再删后继，真正摘掉的节点至多只有一个孩子。"
- id: degeneration
  title: 退化：插入顺序能毁掉一棵树
  tldr: "前三步的操作都建立在树还算矮的前提上。这一步看这个前提怎样被插入顺序毁掉：把排好序的数依次插入，树会长成一条链；再拿 100 万个节点算一笔账，看退化到底差了多少个数量级。"
  body: >-
    把已排序的数据逐个插入 BST，每个新元素都比所有现存节点大，一路右拐到底，最后树是一条链表，查找退化为线性扫描。随机插入顺序时期望高度是 O(log n)，但数据本来就接近有序在工程里太常见了（自增
    id、时间戳），不能赌运气。需要一种机制，在增删后自动把树高摁在 O(log n)，这就是自平衡搜索树存在的理由。


    把账算成数字：n 等于 100 万时，平衡树高度约 20，查一次约 20 次比较；退化链高度是 100 万，查一次平均要 50
    万次比较，差了四五个数量级。而且链越长每次插入还都往最深处走，建树总代价变成平方级——这种退化不是慢一点，而是复杂度类别都变了。按时间戳或自增主键写入的记录，插入顺序天然接近有序，裸 BST
    上线第一天就是一条链；随机打乱只能缓解，平衡必须是结构自带的属性。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 12.4 随机建树与期望高度
    claim: 随机插入的 BST 期望高度为 O(log n)，但最坏情形（有序插入）退化为 O(n)
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: 有序插入：每个新最大值都只能挂到最右端
    rows:
    - label: 退化链
      cells:
      - v: "1"
      - v: → 2
      - v: → 3
      - v: → 4
      - v: → 5
        mark: active
    - label: 查找 5
      cells:
      - v: 比较 5 次 = 链表
        mark: muted
  log:
  - mode: 退化
    event: "退化看清了：树高由插入顺序决定，不能赌输入顺序，必须让结构自带平衡机制。"
- id: treap-random
  title: 随机化平衡：[[Treap]] 与随机性的启示
  tldr: "退化逼出了平衡的需求，但平衡不一定靠严苛的规则。这一步看一条随机化路线：给每个键再随机发一个优先级，键按搜索树的规则排、优先级按堆的规则排，看随机性怎样把期望高度摁回对数级。"
  body: >-
    还有一条不靠旋转规则的平衡路线：给每个键再随机发一个优先级，要求键按 BST 排序、优先级按堆排序，这棵树叫 Treap，是 tree 与 heap 的合体。插入时先按 BST
    落位，再按优先级把节点旋转上来，删除则反着转下去。因为优先级是随机发的，树的期望高度被随机性本身摁在 O(log n)，与键的输入顺序无关。


    它的道理与随机插入顺序时期望高度 O(log n) 是同一件事，只不过把随机性从不可控的输入顺序搬进了结构内部，自己掷骰子就不必求输入给面子。有序插入 1 到 5 时，若优先级恰好让 3 最大，3
    就是根，左右再按各自最大优先级递归成型，原本的链被随机根从中间截断，这就是它躲开退化的方式。


    代价是每个节点多存一个随机数，且高度只有期望保证没有最坏保证。标准库要的是确定性保证，所以 Treap 更多出现在算法竞赛与教学里，但它揭示的原理很重要：平衡不一定靠严苛规则，也可以靠随机，这是理解[[跳表]]随机层高的同一把钥匙。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 12.4 Randomly Built Binary Search Trees（随机建树与期望高度）
    claim: 随机优先级的 Treap 其期望高度为 O(log n)，随机化可避免最坏插入顺序导致的退化
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: tree
    caption: 括号内是随机优先级，根是优先级最大者，键序仍满足 BST
    tree:
      nodes:
      - v: 3（p9）
        mark: found
      - v: 1（p4）
      - v: 5（p6）
      - v: —
      - v: 2（p2）
      - v: 4（p3）
      - v: —
  log:
  - mode: 随机平衡
    event: "随机平衡成立了：优先级由结构自己随机发放，期望高度不再受输入顺序影响。"
- id: avl
  title: "[[AVL]]：用旋转把高度差摁在 1 以内"
  tldr: "随机路线看完，再看规则路线里最严的一种。这一步先交代失衡的四种形态记号，再跟着依次插入 10、20、30 的最小例子走一遍旋转，看某个节点左右高度差超过 1 时，结构怎样被转回来。"
  body: |-
    先把四个形态记号说清：每个记号由两个字母组成，第一个字母指失衡节点哪一侧的子树更高，第二个字母指那一侧的孩子又是哪一侧更高。LL 是左孩子的左子树更高，RR 与它相反，LR 是左孩子的右子树更高，RL 与它相反。
    形态决定旋转方式：LL、RR 转一次就够，LR、RL 要转两次。

    AVL 树是最早的自平衡 BST，规则最严：任一节点的平衡因子（左高减右高）只能是负 1、0、1。插入新节点后，从它往根回溯，发现第一个失衡的祖先，按四种形态（LL、RR、LR、RL）做一次或两次旋转——旋转是局部的指针调整，保持中序顺序不变、把高的那侧压下来。严平衡的代价是增删时旋转更频繁，回报是查找路径最短，适合读多写少的场景。

    最小旋转走例：依次插入 10、20、30，30 落到 20 的右孩子，10 的左右高度差变成负 2，形态是 RR，对 10 做一次左旋，20 升为根，10 降为左孩子，30 仍是右孩子，中序还是 10、20、30，高度从 3 降回 2。再看 LR 形态：插入 30、10、20，20 落在 10 的右孩子处使 30 失衡，要先对 10 左旋再对 30 右旋，两次旋转缺一不可。

    AVL 的严是拿写操作的维护成本换的：插入后要沿祖先链逐个检查，删除时旋转还可能级联到根；回报是高度比[[红黑树]]更矮，纯查询负载下会被放大成比较次数优势。
  derivation: original
  sources:
  - ref: clrs
    locator: 平衡搜索树相关章节（AVL 见习题与延伸阅读）
    claim: AVL 树维持左右子树高度差至多 1，并用旋转在 O(log n) 内恢复平衡
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: tree
    caption: 旋转只改指针，不改中序顺序（3,5,8 不变）
    tree:
      nodes:
      - v: 5
        mark: found
      - v: 3
      - v: 8
  log:
  - mode: 平衡
    event: "旋转规则定清了：失衡形态决定旋转方式，同一侧高的形态转一次，交叉形态要转两次。"
- id: redblack
  title: "[[红黑树]]：把平衡放松一点，换更少的旋转"
  tldr: "[[AVL]] 把高度差摁在 1 以内，代价是增删时频繁旋转。这一步看红黑树怎样把平衡放松一格：只用颜色规则保证最长路径不超过最短路径的两倍，换来少得多的旋转，以及标准库为什么偏爱它。"
  body: >-
    红黑树给每个节点涂红或黑，规则是：根是黑的；红节点的孩子必须是黑的；从任一节点到其所有叶子后代的路径上，黑节点数目相同。由此可推出最长可能路径不超过最短可能路径的两倍，高度被摁在 O(log n) 量级（[[CLRS]] 给出上界
    2·lg(n+1)）。它的平衡比 AVL 松，查找略慢一丁点，但增删的调整平均更省，所以成了语言标准库有序容器的默认选择，Java 的 [[TreeMap]]、C++ 的 [[std::map]] 都是红黑树。


    用数例体会黑高：画布这棵树从根 8 到 1 的路径上黑节点是 8 与 1 共 2 个，到 5 的路径是 8 与 5 也是 2 个，到 14 是 8 与 14 仍是 2 个，每条根到叶路径的黑数都相同。红色节点 3 与 12
    让某些路径边数变多，但红节点不能父子相连，最坏情况下红黑交替，边数最多是全黑最短路径的两倍，高度上界由此而来。


    插入修复时多数情况只是变色：新节点先涂红，父节点是黑的直接结束，父红才触发变色上溯或旋转，插入至多需要常数次旋转，删除同理，与 AVL 删除可能的一路旋转形成对比。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 13 Red-Black Trees
    claim: 红黑树的颜色性质保证树高至多 2lg(n+1)，从而查找/插入/删除均为 O(log n)
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: tree
    caption: 规则管的是「黑高一致」，路径长度差被限制在两倍内
    tree:
      nodes:
      - v: 8（黑）
        mark: found
      - v: 3（红）
      - v: 12（红）
      - v: 1（黑）
      - v: 5（黑）
      - v: 10（黑）
      - v: 14（黑）
  log:
  - mode: 平衡
    event: "红黑树的取舍定清了：平衡放松一格、旋转少得多，这正是它成为标准库默认选择的原因。"
- id: order-statistics
  title: 顺序统计：第 k 小与名次查询
  tldr: "搜索树还能多答一类问题：第几小的是谁、某个键排第几。这一步给每个节点多存一个子树大小，看查第 4 小时怎样只沿一条路径就定位到答案，再算清这份能力要付多少维护代价。"
  body: >-
    BST 稍加武装就能回答顺序统计问题：给每个节点多存一个字段 size，记录以它为根的子树节点总数，增删时沿途把 size 加一或减一维护好。查第 k 小时从根出发，设左子树 size 为 L，若 k 等于 L 加
    1，根就是答案；若 k 小于等于 L，答案在左子树里继续查；若 k 更大，则去右子树查第 k 减 L 减 1 小，全程只走一条路径。


    走画布的树：根 8 的左子树有 3 个节点，查第 4 小时 k 正好等于 3 加 1，命中根 8，与中序序列 1、3、5、8、10、12、14 的第 4 个对得上。再查第 6 小，k 大于 4，去右子树查第 6 减 4 等于第 2
    小，右子树根 12 的左子树只有 10 一个节点，于是命中 12。反过来查某个键排第几是同一套 size 的逆运算。


    代价是每个节点多一个整数字段，旋转还要修正被转节点的 size，写漏一处名次就会全错。需要名次语义时才值得付这笔维护费——排行榜取第 k 名、分页取一段本质都是它（[[CLRS]] 称顺序统计树）。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 14 Augmenting Data Structures（顺序统计树）
    claim: 在红黑树节点上增设子树大小字段后，可在 O(log n) 内求第 k 小元素与元素的名次
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: tree
    caption: 括号内是子树 size，查第 4 小一次命中根
    tree:
      nodes:
      - v: 8（s7）
        mark: found
      - v: 3（s3）
      - v: 12（s3）
      - v: 1（s1）
      - v: 5（s1）
      - v: 10（s1）
      - v: 14（s1）
  log:
  - mode: 顺序统计
    event: "顺序统计走完了：靠每个节点存的子树大小来导航，查第几小不必遍历整棵树。"
- id: engineering
  title: 工程选型与通向 [[B+ 树]]
  tldr: "最后收口选型，并把视线从内存挪到磁盘：二叉树搬到磁盘上，会因为层数太多而频繁读盘。这一步看一个节点装几百个键的 B+ 树怎样把高度压到 3 至 4 层，以及范围查询在搜索树上具体怎样剪掉整片不用看的子树。"
  body: >-
    选型：需要有序加增删，用[[红黑树]]系容器；只要点查，用哈希表；并发场景里 Redis
    的有序集合用了[[跳表]]（结构更简单、范围操作友好），它们解决的是同一个有序动态集合问题。但把这套搬到磁盘会翻车：二叉树每个节点只装一个键，查一次跨好几层就是好几次[[随机 IO|IO]]。磁盘按页（16KB
    量级）读写，于是让一个节点装下整页的几百个键，树高从几十降到 3 至 4，这就是数据存储学科的 B+ 树，建议接着学它。


    范围查询走法：在 BST 里找 5 到 12 之间的全部键，从根 8 开始，它在范围内收下，再递归左子树找大于等于 5 的部分、右子树找小于等于 12
    的部分，整棵子树都落在范围外的分支直接剪掉，总代价正比于树高加结果个数。这是哈希表永远做不到的遍历方式，也是有序结构不可替代的核心理由。


    跳表用多层链表加随机层高达到期望 O(log n)，没有旋转、没有颜色，范围扫描就是底层链表顺着走，Redis 选它部分是因为实现与调试远比红黑树简单。
  derivation: original
  sources:
  - ref: cmu-15445
    locator: Lecture 08 Indexes & Filters（B+Tree 与索引选型）
    claim: 磁盘索引需要高扇出的 B+ 树以降低树高与 IO 次数，哈希索引不支持范围查询
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: "同样的数据量，树的形状完全不同：二叉树有几十层，B+ 树只有 3 至 4 层，查一次要读的磁盘页数差了一个量级"
    rows:
    - label: 二叉树
      cells:
      - v: 每节点 1 键
      - v: 高度 ~log2 n
    - label: B+ 树
      cells:
      - v: 每节点数百键
        mark: found
      - v: 高度 3–4
        mark: found
  log:
  - mode: 选型
    event: "选型结论收口为一句：存储介质变了，最优的树形就跟着变，磁盘上要用一个节点装几百个键的 B+ 树。"
level: 进阶
minutes: 34
prereq:
- dsa/binary-search
- dsa/binary-heap
objectives:
- 描述 BST 查找/插入/删除的完整过程（含两孩子删除）
- 解释退化成因与 AVL/红黑两种平衡策略的取舍
- 说清内存搜索树与磁盘 B+ 树的分工
aiLink: 有序结构在 AI 系统里无处不在：向量检索的图索引之外，KV 缓存的块管理、特征存储的有序扫描、调度器的优先队列替代结构都建立在搜索树思想上；理解它才能理解下一课 B+ 树与 LSM 的分工。
design:
- mechanism: 红黑树为什么用放松的平衡换更少旋转，它只要求最长路径不超过最短路径的两倍，不追求每棵子树高度几乎相等，却仍能把总高锁在二倍对数量级以内，够用即可
  problem: 若像 AVL 那样把高度差摁在 1 以内，每次增删都要频繁旋转修复，写多读少的负载下维护成本会反超查询收益，容器需要一种平衡够用但调整更懒惰的结构来扛住真实负载
  choice: 用红黑颜色规则代替高度差规则，根到叶路径的黑节点数保持一致且红节点不相邻，由此间接限制路径长度比，插入删除先变色、实在不行才旋转，且旋转次数有常数上界
  tradeoff: 放松平衡让查找路径平均比 AVL 略长，纯查询场景要多付几次比较，换来的是插入删除旋转次数大幅减少，综合吞吐在真实标准库负载下反而更高，这笔交换在写密集时尤其划算
  root: 根本原因是工程目标不是高度最小而是总成本最小，高度只要是对数量级，常数差异就会让位给调整频率，平衡的严苛程度本质上是一笔可以按负载调配的预算而非道德标准
- mechanism: BST 的全部操作成本都正比于树高，因为查找插入删除都只沿一条根到叶的路径前进，路径之外的一切子树在每一步比较后就被整体排除，此后不会再被碰到，树高即账单
  problem: 同一个集合用不同插入顺序建树，形状可以从近乎完全二叉树一路退化成链表，若结构对形状不加约束，最坏情形就会在有序输入这种最常见的工程数据上必然发生而不是偶尔发生
  choice: 先用左小右大的不变量保证中序有序，再叠加一层自平衡机制，无论是 AVL 的高度差规则、红黑的颜色规则还是 Treap 的随机优先级，都在增删之后主动把高度摁回对数量级
  tradeoff: 维持平衡让每次写入多付检查与旋转的常数成本，还要给节点多存高度或颜色或优先级字段，换来的是最坏情形也有保证，不必把系统性能押在输入顺序的运气之上
  root: 根本约束是比较决策的信息下限，n 个键的区分至少需要对数量级的比较深度，平衡不是美学追求，而是让数据结构贴住这条下限的唯一办法，退化等于白白浪费已经付出的比较信息
- mechanism: 到了磁盘上最优树形由扇出决定，一个节点装几百个键让树高降到三四层，因为磁盘按页读取，读满一个节点的成本与读一个键几乎相同，节点装得太稀疏等于整页都被浪费
  problem: 二叉搜索树在内存里每步只读一个节点很自然，可磁盘随机读一页要付出远高于内存访问的延迟，几十层树高意味着几十次随机 IO，内存里的最优结构原样搬到磁盘会慢到不可用
  choice: 把节点放大到与磁盘页同尺寸，键在节点内排序并二分定位，叶子之间再串成链表支撑范围扫描，这就是 B+ 树，多数数据库的索引都建立在它之上而不是二叉树的放大版
  tradeoff: 大扇出让单节点的更新要搬动更多键，分裂与合并的逻辑也更复杂，换来的是树高与 IO 次数的数量级下降，读与写的放大之间如何取舍还要按具体负载再做细分
  root: 根本原因是存储介质的成本模型变了，内存按字节随机访问近似均匀，磁盘按块访问且寻道昂贵，结构设计必须服从介质的成本函数，介质一变最优解就跟着变，没有通吃的树形
quiz:
- q: BST 中删除一个有两个孩子的节点，标准做法是？
  options:
  - 直接摘掉，让两个子树断开
  - 用中序后继的值填进来，再删除后继节点
  - 把整棵树重建
  - 随机选一个孩子顶替根
  answer: 1
  explain: 后继是右子树最小值，至多一个孩子，删它落回简单情况；值抄过来后有序性保持。
- q: 红黑树为什么能保证高度 O(log n)？
  options:
  - 因为节点都是红色的
  - 颜色规则保证最长路径不超过最短路径的两倍
  - 因为它每年自动重建
  - 因为插入总是完美的
  answer: 1
  explain: 黑高一致 + 红节点不能相邻，推出路径长度被限制在两倍内，于是高度至多 2lg(n+1)。
- q: 把有序数据依次插入普通 BST 会怎样？
  options:
  - 自动变平衡
  - 退化成一条链，操作变成 O(n)
  - 报错
  - 变成堆
  answer: 1
  explain: 每个新元素都更大、一路右拐，树高等于 n——这正是需要自平衡机制的原因。
