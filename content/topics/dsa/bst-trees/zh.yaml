title: 二叉搜索树与平衡：[[AVL]] 与红黑的直觉
summary: 哈希表快但无序；要「有序地存、按范围取」，就用搜索树——再解决它退化成链表的问题。
premise: 哈希表查一个值很快，但它回答不了大于某个数的最小值是多少、某个区间里都有哪些数这类和顺序有关的问题。本课看二叉搜索树怎样把数据有序地存下来，又为什么同一组整数换一个插入顺序，树的形状和高矮会完全不同，最后再看平衡机制怎样防止它退化成一条链。
position: 本课回到「树形结构」板块，它接在 Dijkstra 反复从优先队列里取出 dist 最小者之后，追问有序动态集合除了堆还有什么存法。学完你能走完两孩子节点的删除流程——抄[[中序后继]]的值再删后继，并说清 AVL
  靠旋转把高度差压在 1 以内与[[红黑树]]容忍最长路两倍于最短路的取舍差在哪。
bridge:
  prev: 上一课 Dijkstra 借二叉堆在每轮松弛后迅速锁定 dist 最小点，本课的搜索树与堆同属树形结构，却把目标从只取极值扩展到保住全序与范围。
  next: 搜索树靠比较逐层排除一整棵子树来省查找成本，下一课动态规划要解决的是另一种浪费：同一子问题在递归树里被指数次重复求解该怎样存下来只算一次。
overview:
- key: 一句话总结
  value: BST（二叉搜索树 Binary Search Tree） 约定左边小于根、根小于右边，中序遍历得到的就是有序序列；平衡机制保证高度是 O(log n)。查找时从根开始，比根小就往左走、比根大就往右走，每走一步就排除掉一整棵子树。
- key: 三种操作
  value: 查、插、删都是从根向下走一条路，成本正比于树高。所以树越矮操作越快，树一旦长歪成一条链，这三种操作就都退化成从头找到尾了。
- key: 退化
  value: 按有序顺序插入普通 BST 会退化成链表，复杂度变成 O(n)。比如依次插入 1、2、3、4、5，每个新数都比已有的都大，只能一直往右挂下去，最后树就成了一条向右的链。
- key: AVL
  value: "[[AVL]] 要求每个节点左右高度差不超过 1，靠旋转修复，平衡最严。插入之后如果某处左右差超过 1，就把那一小段结构转一下恢复平衡，代价是插入和删除时调整更频繁。"
- key: 红黑树
  value: "[[红黑树]]用颜色规则放宽平衡，要求最长路径不超过最短路径的 2 倍，旋转更少，工程里最常用。它不追求绝对平衡，只保证树高仍在对数级别，换来的是插入和删除时改动的次数更少。"
- key: 工程里
  value: Java 的 [[TreeMap]]、C++ 的 [[std::map]] 是红黑树；数据库索引用的是它的多叉亲戚 [[B+ 树]]。它们需要的不只是查单点，还要能按顺序遍历和按范围取数，这正是搜索树比哈希表多出来的本事。
