title: "Binary Search Trees and Balance: an intuition for [[AVL]] and red-black trees"
summary: Hash tables are fast but unordered; to store things in order and fetch them by range, use a search tree — then solve its degeneration into a linked list.
premise: A hash table looks up a single value fast, but it cannot answer questions tied to order — what is the smallest value greater than a given number, or which numbers fall inside an interval. This lesson looks at how a binary search tree stores data in order, why the same set of integers inserted in a different order produces a completely different tree shape and height, and finally how balancing mechanisms stop it from degenerating into a chain.
position: This lesson returns to the "Tree Structures" section. It follows Dijkstra repeatedly taking the smallest-dist element out of a priority queue, and asks what other storage a dynamic ordered set has besides a heap. After this lesson you will be able to walk through the deletion flow for a node with two children — copy the [[in-order successor|中序后继]]'s value, then delete the successor — and explain where the trade-off differs between AVL,
  which uses rotations to press height differences within 1, and the [[red-black tree|红黑树]], which tolerates a longest path twice the shortest.
bridge:
  prev: The previous lesson borrowed a binary heap so Dijkstra could quickly lock onto the smallest-dist point after each round of relaxation; this lesson's search tree belongs to the same tree-structure family, but widens the goal from taking only the extreme value to preserving the total order and ranges.
  next: A search tree saves lookup cost by ruling out a whole subtree with each comparison as it descends; the next lesson, dynamic programming, tackles a different waste — how to store the result when the same subproblem is solved exponentially many times in a recursion tree, so it is computed only once.
overview:
- key: In one sentence
  value: A BST (binary search tree) stipulates left smaller than the root, root smaller than the right, and an in-order traversal yields the sorted sequence; balancing mechanisms keep the height at O(log n). A lookup starts at the root — smaller goes left, larger goes right — and each step rules out a whole subtree.
- key: Three operations
  value: Search, insert, and delete all walk one path down from the root, so their cost is proportional to the tree height. The shorter the tree, the faster the operations; once the tree grows crooked into a chain, all three degrade into searching from head to tail.
- key: Degeneration
  value: Inserting into a plain BST in sorted order degenerates it into a linked list, and the complexity becomes O(n). Insert 1, 2, 3, 4, 5 in order, for example — each new number is larger than everything already there, so it can only keep hanging to the right, and in the end the tree is a chain leaning right.
- key: AVL
  value: "[[AVL]] requires every node's left and right heights to differ by at most 1 and repairs with rotations — the strictest balancing. After an insertion, if some place's left-right difference exceeds 1, that small stretch of structure is turned once to restore balance; the price is more frequent adjustments during insertions and deletions."
- key: Red-black tree
  value: "A [[red-black tree|红黑树]] relaxes balancing with color rules, requiring the longest path to be at most 2 times the shortest, with fewer rotations — the most common choice in engineering. It does not chase absolute balance, only guarantees the height stays logarithmic, in exchange for fewer changes during insertions and deletions."
- key: In practice
  value: Java's [[TreeMap]] and C++'s [[std::map]] are red-black trees; database indexes use its multiway relative, the [[B+ tree|B+ 树]]. What they need is not just single-point lookup but also in-order traversal and fetching by range — exactly the extra talent a search tree has over a hash table.
