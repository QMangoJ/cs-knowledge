steps:
- id: why
  title: Why trees, beyond hash tables?
  tldr: "Put the problem plainly first — a hash table fetches by name in one step, but it cannot answer order-tied questions such as who is the smallest value greater than a given number, or which numbers fall inside an interval. This step lays the three ledgers — hash table, sorted array, search tree — side by side and sees which gap the search tree fills."
  body: >-
    Many requirements are ordered by nature — take a slice of a leaderboard, cut a timeline by range, find neighbors in lexicographic order. A hash table scatters its keys and loses all ordering information; a sorted array searches fast but inserting means shifting half the elements. A binary search tree (BST) is the compromise — it keeps the global order while supporting dynamic insertions and deletions, and an in-order traversal outputs the sorted result. It is also the direct ancestor of the B+
    tree indexes and ordered containers that come later.


    Lay the ledgers side by side — a hash table's point lookup averages O(1) but it has no order — give it ten thousand keys and it still cannot say who the smallest one greater than 42 is. A sorted array binary-searches in O(log
    n), but inserting a new key means moving the whole back half of the elements — a loss when writes outnumber reads. What all three lack is the same thing — preserving order and logarithmic operations under dynamic insertions and deletions at once — and the BST fills exactly that gap.


    A BST's order is a structural property, not the result of one sort — every key inserted lands in its unique legal position, and the global order is never disturbed. That is also why it can prune as it searches during a range query.
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 12 Binary Search Trees
    claim: Binary search trees support search, insertion, deletion, and range traversal on a dynamic ordered set, and an in-order traversal yields the sorted sequence
    status: verified
    checkedBy: Checked by Muse
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: tree
    caption: "Left smaller, right larger: the in-order traversal 1, 3, 5, 8, 10, 12, 14 is naturally sorted"
    tree:
      nodes:
      - v: 8
        mark: found
      - v: 3
      - v: 12
      - v: 1
      - v: 5
      - v: 10
      - v: 14
  log:
  - mode: Ordered
    event: "The conclusion stands: a hash table cannot do range queries or neighbor queries; a search tree keeps order inside the structure itself through the left-smaller, right-larger stipulation."
- id: search-insert
  title: "Search and insertion: one path down"
  tldr: "The stipulation is set — keys on the left are smaller than the root, keys on the right are larger. This step walks a search and an insertion along it — start at the root, compare sizes, move to one side, until you hit or reach an empty slot. Once it is clear that an insertion is just a search that failed, it books both operations' costs to the tree height."
  body: >-
    To search for target, stand at the root and compare — smaller goes to the left subtree, larger to the right, equal is a hit. Each step rules out half the candidates (if the tree is balanced); reaching a null pointer means it does not exist. An insertion is a failed search — the new node necessarily lands at the empty position where the search stopped, becoming a leaf. So both costs are proportional to the tree height
    h: O(log n) when balanced, O(n) when degenerated — the height is everything to a BST.


    Walk an insertion of 7 through the canvas's tree, whose root is 8 — smaller than 8, go to the left subtree; larger than 3, go right; larger than 5, it should continue right — that spot is empty, so 7 hangs as 5's right child, touching only 3 nodes in all. Now search for a 6 that does not exist — the route is 8 to 3 to 5 to 7; smaller than 7, it falls empty to the left and returns "does not exist". That same empty-falling route also tells you where 6 would land if inserted.


    Duplicate keys are a common stipulation question — most implementations do not store a second copy; a hit simply updates the attached value. Which choice you make must be written into the interface, because handling it vaguely makes deletion remove the wrong copy. Inserting into an empty tree makes the new node the root directly, and deleting the root when it is the only node leaves the tree empty — these trivial cases are the easiest to miss a null check on.
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 12.2/12.3, query and insertion
    claim: BST search and insertion both proceed along a single root-to-leaf path, in O(h) time
    status: verified
    checkedBy: Checked by Muse
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: tree
    caption: "Finding 10: 8 → 12 → 10, a hit in three steps"
    tree:
      nodes:
      - v: 8
      - v: 3
      - v: 12
        mark: active
      - v: 1
      - v: 5
      - v: 10
        mark: found
      - v: 14
  log:
  - mode: Search
    event: "The search is walked through: each comparison rules out a whole subtree, and the cost depends only on how long the path walked is — the tree height."
  code:
    lang: typescript
    code: |-
      type Node = { key: number; left?: Node; right?: Node };
      function search(root: Node | undefined, x: number): Node | undefined {
        let cur = root;
        while (cur) {
          if (x === cur.key) return cur;        // Hit
          cur = x < cur.key ? cur.left : cur.right;  // Rule out half
        }
        return undefined;                        // Reaching empty = does not exist
      }
    note: Insertion = walk a search to an empty slot, then hang the new node on
    highlight: 5
- id: delete
  title: "Deletion: three cases, and the hard one has two children"
  tldr: "Search and insertion both walk a single path down; deletion is far more troublesome. This step handles the cases one by one by number of children, focusing on why a node with two children cannot simply be plucked off — you first find its [[in-order successor|中序后继]], copy its value, and then delete the successor."
  body: |-
    Deletion is the most troublesome BST operation, split into three cases by number of children: no children — pluck it off directly; exactly one child — swing the parent's pointer past it, straight to its child; both children — it cannot be plucked directly (that would snap the tree into two pieces). The standard approach is to find its in-order successor (the leftmost node of the right subtree, which has at most one right child), copy the successor's value over, and then delete the successor node (which falls back into the first two cases). The node actually plucked off always has at most one child.

    Walk the other two cases on the same tree: delete the leaf 1 — simply set 3's left pointer to null, and everything else stays untouched. Delete a node with exactly one child — swing the parent pointer past it straight to that child; the child's whole subtree is preserved as-is, and the height drops by at most one. Back to the two-children case, deleting the root 8: the successor is 10, the end of walking left through the right subtree. Copy 10 into the root's position; the original 10 is a leaf and is plucked off directly.

    After deleting, check the in-order sequence: 1, 3, 5, 10, 12, 14 — against before the deletion it differs only by the removed 8, and the order is intact. A common mistake: what gets copied is the successor's value, not the successor node moved up wholesale with its subtree — balanced trees uniformly use copy-the-value plus delete-the-successor, converging the structural adjustment to the simplest case. After deletion, a balanced tree still has to check upward from the deletion point, level by level, and repair.
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 12.3, deletion
    claim: When deleting a BST node with two children, the in-order successor replaces it, and the problem reduces to deleting a node with at most one child
    status: verified
    checkedBy: Checked by Muse
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: tree
    caption: "Deleting 8 (two children): the successor is 10 — copy its value, then delete the leaf position where 10 sat"
    tree:
      nodes:
      - v: 8→10
        mark: active
      - v: 3
      - v: 12
      - v: 1
      - v: 5
      - v: 10
        mark: found
      - v: 14
  log:
  - mode: Deletion
    event: "Deletion is walked through: the two-children case is converted into copying the in-order successor's value and deleting the successor — the node actually plucked off has at most one child."
- id: degeneration
  title: "Degeneration: insertion order can ruin a tree"
  tldr: "Every operation in the first three steps stood on the premise that the tree is still fairly short. This step watches that premise get destroyed by insertion order — insert sorted numbers one by one and the tree grows into a chain — then does the math with a million nodes to see how many orders of magnitude degeneration actually costs."
  body: >-
    Insert already-sorted data into a BST one by one and every new element is larger than all existing nodes, turning right all the way to the bottom — in the end the tree is a linked list and search degenerates into a linear scan. With a random insertion order the expected height is O(log n), but data that is already nearly sorted is all too common in engineering (auto-increment
    ids, timestamps), so you cannot gamble on luck. A mechanism is needed that automatically presses the height back to O(log n) after insertions and deletions — that is the reason self-balancing search trees exist.


    Put the bill into numbers — at n = a million, a balanced tree's height is about 20, and one search takes about 20 comparisons; a degenerated chain's height is a million, and one search averages 500,000 comparisons — a gap of four to five orders of magnitude. And the longer the chain, the deeper every insertion still has to walk, so the total cost of building the tree becomes quadratic — this degeneration is not "a bit slower"; the complexity class itself changes. Records written by timestamp or auto-increment primary key arrive in an insertion order that is naturally nearly sorted, so a bare BST
    is a chain from its first day in production. Random shuffling can only mitigate; balance must be a property the structure carries itself.
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 12.4, randomly built trees and expected height
    claim: A randomly inserted BST has expected height O(log n), but the worst case (sorted insertion) degenerates to O(n)
    status: verified
    checkedBy: Checked by Muse
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: "Sorted insertion: every new maximum can only hang at the far right end"
    rows:
    - label: Degenerated chain
      cells:
      - v: "1"
      - v: → 2
      - v: → 3
      - v: → 4
      - v: → 5
        mark: active
    - label: Searching for 5
