    event: "Randomized balancing holds: the priorities are dealt randomly by the structure itself, so the expected height is no longer affected by the input order."
- id: avl
  title: "[[AVL]]: pressing height differences within 1 with rotations"
  tldr: "With the randomized road seen, now the strictest of the rule-based roads. This step first explains the notation for the four imbalance shapes, then walks a rotation through the smallest example — inserting 10, 20, 30 in order — watching how the structure is turned back when some node's left-right height difference exceeds 1."
  body: |-
    First, the four shape notations: each notation has two letters — the first says which side of the unbalanced node's subtree is taller, the second says which side of that side's child is taller again. LL means the left child's left subtree is taller; RR is its mirror; LR means the left child's right subtree is taller; RL is its mirror.
    The shape decides the rotation: LL and RR need one rotation; LR and RL need two.

    The AVL tree is the earliest self-balancing BST, with the strictest rule: every node's balance factor (left height minus right height) may only be −1, 0, or 1. After inserting a new node, trace back from it toward the root; at the first unbalanced ancestor, perform one or two rotations according to the four shapes (LL, RR, LR, RL) — a rotation is a local pointer adjustment that keeps the in-order sequence unchanged and presses the taller side down. The price of strict balance is more frequent rotations during insertions and deletions; the reward is the shortest search paths, suiting read-heavy, write-light workloads.

    The smallest rotation, walked through: insert 10, 20, 30 in order. 30 lands as 20's right child, and 10's left-right height difference becomes −2 — the shape is RR. One left rotation at 10 raises 20 to the root, drops 10 to the left child, and 30 stays the right child; the in-order sequence is still 10, 20, 30, and the height falls from 3 back to 2. Now the LR shape: insert 30, 10, 20 — 20 lands at 10's right child and unbalances 30; you must first rotate left at 10, then rotate right at 30 — neither of the two rotations can be skipped.

    AVL's strictness is bought with write-side maintenance cost: after an insertion, every ancestor on the chain must be checked one by one, and during deletion rotations can cascade all the way to the root. The reward is a height shorter than a [[red-black tree|红黑树]]'s, which pure query workloads amplify into a comparison-count advantage.
  derivation: original
  sources:
  - ref: clrs
    locator: Balanced search tree chapters (AVL — see the exercises and further reading)
    claim: An AVL tree keeps the height difference between left and right subtrees at most 1, and restores balance with rotations in O(log n)
    status: verified
    checkedBy: Checked by Muse
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: tree
    caption: "A rotation changes only pointers, never the in-order sequence (3, 5, 8 unchanged)"
    tree:
      nodes:
      - v: 5
        mark: found
      - v: 3
      - v: 8
  log:
  - mode: Balancing
    event: "The rotation rules are pinned down: the imbalance shape decides the rotation — shapes tall on the same side rotate once; crossed shapes rotate twice."
- id: redblack
  title: "[[red-black tree|红黑树]]: relax the balance a notch, trade for fewer rotations"
  tldr: "[[AVL]] presses height differences within 1, at the price of frequent rotations during insertions and deletions. This step looks at how a red-black tree relaxes the balance by one notch — using only color rules to guarantee the longest path is at most twice the shortest — in exchange for far fewer rotations, and why standard libraries favor it."
  body: >-
    A red-black tree paints each node red or black, with these rules — the root is black; a red node's children must be black; and on the paths from any node down to all its descendant leaves, the number of black nodes is the same. From this it follows that the longest possible path is at most twice the shortest possible path, and the height is pressed to the O(log n) order ([[CLRS]] gives the upper bound
    2·lg(n+1)). Its balance is looser than AVL's and its searches a touch slower, but its insertion and deletion adjustments are cheaper on average — which is why it became the default choice for ordered containers in language standard libraries: Java's [[TreeMap]] and C++'s [[std::map]] are both red-black trees.


    Feel the black height with numbers — in the canvas's tree, the path from the root 8 to 1 passes black nodes 8 and 1 — 2 of them; the path to 5 passes 8 and 5 — also 2; the path to 14 passes 8 and 14 — still 2. Every root-to-leaf path has the same black count. The red nodes 3 and 12
    make some paths longer in edge count, but red nodes cannot be parent and child in a row, so in the worst case red and black alternate and the edge count is at most twice the all-black shortest path — that is where the height bound comes from.


    Most insertion repairs are only recolorings — a new node is painted red first; if its parent is black, it ends right there; only a red parent triggers recoloring upward or a rotation. An insertion needs at most a constant number of rotations, and deletion likewise — a contrast with AVL deletions, where rotations can run all the way up.
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 13 Red-Black Trees
    claim: The color properties of a red-black tree guarantee a height of at most 2lg(n+1), so search / insertion / deletion are all O(log n)
    status: verified
    checkedBy: Checked by Muse
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: tree
    caption: "The rules govern 'equal black height'; path length differences are limited to within a factor of two"
    tree:
      nodes:
      - v: 8 (black)
        mark: found
      - v: 3 (red)
      - v: 12 (red)
      - v: 1 (black)
      - v: 5 (black)
      - v: 10 (black)
      - v: 14 (black)
  log:
  - mode: Balancing
    event: "The red-black tree's trade-off is settled: balance relaxed by one notch, far fewer rotations — exactly why it became the standard library's default choice."
- id: order-statistics
  title: "Order statistics: the k-th smallest and rank queries"
  tldr: "A search tree can answer one more class of question — who is the k-th smallest, and what rank does a given key hold? This step stores one extra subtree size at each node, watches a query for the 4th smallest locate its answer along a single path, and settles how much maintenance that ability costs."
  body: >-
    A BST with a small upgrade answers order-statistics questions — store one extra field, size, at each node, the total number of nodes in the subtree rooted there, and maintain it by adding or subtracting one along the path during insertions and deletions. To find the k-th smallest, start at the root and let the left subtree's size be L — if k equals L + 1, the root is the answer; if k is at most L, keep searching in the left subtree; if k is larger, go to the right subtree for the (k − L − 1)-th smallest. The whole walk follows a single path.


    Walk the canvas's tree — the root 8's left subtree has 3 nodes. For the 4th smallest, k is exactly 3 + 1 — a hit on the root 8, matching the 4th entry of the in-order sequence 1, 3, 5, 8, 10, 12, 14. Now the 6th smallest — k is larger than 4, so go to the right subtree for the (6 − 4) = 2nd smallest; the right subtree's root 12 has only the single node 10 in its left subtree, so it hits 12. Asking which rank a key holds is the inverse operation on the same size fields.


    The price is one extra integer field per node, and rotations must also fix the sizes of the nodes they turn — miss one place and every rank is wrong. The maintenance fee is worth paying only when rank semantics are needed — taking the k-th place on a leaderboard, or fetching a page-sized slice, is essentially this ([[CLRS]] calls it an order-statistic tree).
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 14 Augmenting Data Structures (order-statistic trees)
    claim: With a subtree-size field added to red-black tree nodes, the k-th smallest element and an element's rank can both be found in O(log n)
    status: verified
    checkedBy: Checked by Muse
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: tree
    caption: "The value in parentheses is the subtree size; the 4th smallest hits the root in one go"
    tree:
      nodes:
      - v: 8 (s7)
        mark: found
      - v: 3 (s3)
      - v: 12 (s3)
      - v: 1 (s1)
      - v: 5 (s1)
      - v: 10 (s1)
      - v: 14 (s1)
  log:
  - mode: Order statistics
    event: "Order statistics are walked through: navigation by the subtree size stored at each node finds the k-th smallest without traversing the whole tree."
- id: engineering
  title: "Engineering choices, and the road to the [[B+ tree|B+ 树]]"
  tldr: "Finally, the wrap-up on selection, and a shift of view from memory to disk — moved onto disk, a binary tree reads the disk far too often because it has too many levels. This step looks at how a B+ tree, with one node holding hundreds of keys, presses the height down to 3 to 4 levels, and how a range query on a search tree prunes whole subtrees that never need looking at."
  body: >-
    Selection — when you need order plus insertions and deletions, use a [[red-black tree|红黑树]]-family container; when you need only point lookups, use a hash table. In concurrent scenarios, Redis's sorted sets use a [[skip list|跳表]] (a simpler structure, friendly to range operations) — they all solve the same dynamic ordered set problem. But move this machinery onto disk and it falls over — a binary tree holds one key per node, so one lookup crossing many levels means many rounds of random [[IO]]. Disk is read and written by the page (on the order of 16KB
    ), so let one node hold a whole page's hundreds of keys — the height drops from dozens of levels to 3 to 4. That is the B+ tree of the data storage subject, and it is worth learning next.


    How a range query walks — to find all keys between 5 and 12 in a BST, start at the root 8 — it is inside the range, so take it; then recurse into the left subtree for the part ≥ 5 and into the right subtree for the part ≤ 12. Any branch whose whole subtree falls outside the range is pruned directly. The total cost is proportional to the tree height plus the number of results. This is a traversal a hash table can never do, and the irreplaceable core reason ordered structures exist.


    A skip list reaches expected O(log n) with multiple linked-list levels and random level heights — no rotations, no colors — and a range scan simply walks along the bottom-level list. Redis chose it partly because implementing and debugging it is far simpler than a red-black tree.
  derivation: original
  sources:
  - ref: cmu-15445
    locator: Lecture 08 Indexes & Filters (B+ tree and index selection)
    claim: Disk indexes need high-fan-out B+ trees to lower the height and the number of IO operations; hash indexes do not support range queries
    status: verified
    checkedBy: Checked by Muse
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: "The same data volume, completely different tree shapes: a binary tree has dozens of levels, a B+ tree only 3 to 4 — the number of disk pages one lookup must read differs by an order of magnitude"
    rows:
    - label: Binary tree
      cells:
      - v: 1 key per node
      - v: height ~log2 n
    - label: B+ tree
      cells:
      - v: hundreds of keys per node
        mark: found
      - v: height 3–4
        mark: found
  log:
  - mode: Selection
    event: "The selection conclusion boils down to one line: change the storage medium and the optimal tree shape changes with it — on disk, use a B+ tree whose nodes hold hundreds of keys."
