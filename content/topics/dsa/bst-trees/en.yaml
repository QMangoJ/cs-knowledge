        mark: muted
  log:
  - mode: Degeneration
    event: "Degeneration is clear: the height is decided by the insertion order — you cannot gamble on the input order; the structure must carry its own balancing mechanism."
- id: treap-random
  title: "Randomized balancing: [[Treap]] and what randomness teaches"
  tldr: "Degeneration forced the need for balance, but balance does not have to come from strict rules. This step takes a randomized road — hand each key a random priority as well, order the keys by the search-tree rule and the priorities by the heap rule, and watch randomness press the expected height back to logarithmic."
  body: >-
    There is another balancing road that does not rely on rotation rules — hand each key a random priority as well, requiring keys to be ordered as in a BST and priorities as in a heap. That tree is called a Treap — a blend of tree and heap. On insertion it first lands by the BST
    rule, then rotates up by priority; deletion rotates it back down in reverse. Because the priorities are dealt randomly, the tree's expected height is pressed to O(log n) by randomness itself, independent of the keys' input order.


    Its principle is the same fact as the expected O(log n) height under random insertion order — except the randomness is moved from the uncontrollable input order into the structure itself: roll your own dice and you no longer need the input to do you a favor. When 1 to 5 are inserted in sorted order, if the priorities happen to make 3 the largest, 3
    becomes the root, and the left and right sides form recursively by their own largest priorities — the original chain is cut in the middle by the random root. That is how it dodges degeneration.


    The price is one extra random number stored per node, and a height guaranteed only in expectation, with no worst-case guarantee. Standard libraries want deterministic guarantees, so Treaps appear mostly in algorithm contests and teaching — but the principle it reveals matters — balance does not have to come from strict rules; it can come from randomness. It is the same key that unlocks the [[skip list|跳表]]'s random levels.
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 12.4 Randomly Built Binary Search Trees (randomly built trees and expected height)
    claim: A Treap with random priorities has expected height O(log n); randomization avoids the degeneration caused by worst-case insertion orders
    status: verified
    checkedBy: Checked by Muse
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: tree
    caption: "The value in parentheses is the random priority; the root is the largest priority, and the key order still satisfies the BST"
    tree:
