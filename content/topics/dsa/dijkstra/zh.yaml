- id: zero-one-bfs
  title: "[[0-1 BFS]]：边权只有 0 和 1 时，用双端队列省掉 log"
  tldr: 边权只有 0 和 1 两种时，把最小堆换成[[双端队列]]就能把复杂度降回线性的 O(V + E)：走 0 权边插进队头立刻处理，走 1 权边老实排到队尾。
  body: |-
    堆已经够快了，但遇到「只有免费（0）和收费一次（1）」两种代价的图时（比如网格图里正常走路代价 0、穿墙代价 1，或开关切换状态），连 O(log V) 的堆都能省掉。办法就是 [[0-1 BFS]]：改用一个两头都能进出的[[双端队列]]。当前点 u 松弛邻居时，如果走的是 0 权边，邻居总距离没增加、和 u 一样近，就把它塞进队头；如果走的是 1 权边，邻居总距离加了 1，就把它排到队尾。

    拿画布上的小三角走一遍：A → B 权 0、A → C 权 1、B → C 权 0。从 A(0) 出发，先把距离 0 的 B 塞到队头、距离 1 的 C 排到队尾，队列是 [B(0), C(1)]；下一步从队头拿出 B(0)，沿着 B → C（权 0）把 C 从 1 改写成 0，再塞回队头！于是队列里的元素按距离永远保持在「前段全是一批相等的最小值 d，后段全是一批 d + 1」的夹逼状态，出队顺序天然就是从小到大，连对数排序代价都省了。

    记住这套免费单调性的死穴：它成立的根子，是距离增量只允许出现 0 和 1 这两个差值为 1 的整数。只要地图里突然混进一条权为 2 或者 0.5 的边，队头插入就再也守不住全局有序，结果会静默算错，必须老老实实换回最小堆。
  derivation: original
  sources:
