- id: second-shortest
  title: 备选路线：为什么只记冠军不够，算次短路得留两个位置
  tldr: 标准 Dijkstra 在[[松弛]]时只保留每个点的第一名距离，亚军信息当场被覆盖丢弃；要给导航算出严格更长的备选路线，必须给每个点留出冠军与亚军两个槽位。
  body: |-
    打开任何导航软件，地图总会给你主路线旁边再挂一条备选方案。听起来像是顺手多算一个第二名，可真要从刚才的 [[Dijkstra]] 代码里吐出第二名却行不通——问题出在状态里压根没给亚军留位置。拿画布上 A 到 C 来说：C 最先被 A → C 写成 10，随后被 A → B → C 的 6 直接覆盖；10 这条次优记录一旦覆盖掉就彻底蒸发了，等算完 D = 8 才想找第二路线（比如经直达边 A → C → D 总长 10 + 2 = 12），已经无处可查。

    要把严格次短路（长度严格大于最短路 8 的第二名）算出来，最直接的改法是给每个节点开两个槽位：dist1[u] 存第一名、dist2[u] 存第二名。松弛时拿着新算出的候选距离依次比较：如果比 dist1 小，就把原 dist1 挤到 dist2、自己坐上去；如果严格大于 dist1 且小于 dist2，就改写 dist2。优先队列里会同时推进每个节点的冠军状态和亚军状态，等到某个节点的次短状态弹出堆顶那一刻，它的第二名距离才真正定案。

    动手之前还得先定清一条规则边界：允许重复走同一条边或同一个点吗？如果允许，很多图里「最短路走一半 + 在旁边一条短边上来回折返一次 + 继续走完」数学上就算严格次短，可导航推荐用户在路口原地调头两趟显然没法开，所以工程里通常会明确要求不重复走点或边的简单路径，或者转用更通用的 K 短路径算法。
