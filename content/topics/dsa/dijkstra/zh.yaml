  points:
  - BFS 只数“走几步”，但道路有长有短，步数少不等于路程短。
- id: greedy
  title: 核心赌注：每轮只敢给「当前最近的未定点」定案
  tldr: "[[Dijkstra]] 每轮只做一件事：从还没定案的路口里挑出目前距离最小的那一个当场拍板；只要所有边权都不为负，绕道其他更远未定点的路只会越加越长，绝不可能再反超它。"
  body: |-
    先立两个贯穿全课的记号：dist[x] 表示目前已知从起点 A 到 x 的最短距离估计，在 x 拍板前还可能被更短的路线改小；S 是已经拍板定案的路口名单。起步时，A 到自己距离是 0，其余 B、C、D、E 还没摸到路，先记成无穷大 ∞，名单 S 里只有 A。

    [[Dijkstra]] 的每一步都很干脆：从 S 外面挑一个 dist 最小的路口 u 搬进 S，宣布它的最短距离从此锁死、永不反悔。等一下，凭什么现在排名最靠前的 u，就不会被后面绕一圈拐回来的神秘路线反超？这就是整套算法唯一的底层赌注：剩下所有还没定案的路口，目前的起跑线（dist）都已经不比 u 近了，而地图上每一段新路的长度又都是非负数（≥ 0）。从更远的起跑线再往上面加非负数，总路程只会继续变大或持平，绝无可能压低到 u 下面。

    说到底，非负边权锁死了「越往外走总路程越长」的单调性。只要图里连一条负权边都没有，排在当前第一名出列的未定点就稳坐真值；可一旦图里混进负权边，绕远路后面突然给你倒扣一截路程，这套赌注当场作废。
