subject: dsa
slug: dijkstra
order: 6
status: published
license: CC-BY-4.0
title: Dijkstra 最短路径：路有长短时怎样找最近
summary: 边带上长短不一的权重后，只数步数的 [[BFS]] 会选错路，必须改用能累计距离的算法。[[Dijkstra]] 的办法是每次从「还没敲定」的路口里挑当前估计最近的那一个当场定案，再顺着它的出边去压低邻居的距离（这步叫[[松弛]]）。这个贪心赌注能成立，全靠一条硬前提——所有边权都不为负，这样绕远路才绝不可能反超；一旦混进负权边，赌注就会被当场击穿，必须改用扫全部边的 [[Bellman-Ford]]，而想在工程里把搜索集中到终点方向，则要靠在它之上加估计值的 [[A*]]。
premise: 开车看导航时，经停路口最少的那条路未必最近：画布上这张 5 个路口（A、B、C、D、E）的小地图里，从 A 直达 C 只要一站、却要开 10 公里，绕道 B 走两段路反而是 3 + 3 = 6 公里。当每条路都标着不同的公里数，怎样才能高效算出从 A 出发到所有路口真正最短的路线？
position: 本课是「图上的行走」板块的第二站，也是收官的一课。上一课我们用队列按「经过几条边」一层层摸清无权图，这一课把尺子从「边数」换成「累计路程」，让搜索学会挑路走。学完这一课，你能亲手用优先队列跑完一套最短路流程，能讲透为什么边权不能为负、负边一来这套算法在哪翻车，也能分清什么时候该换成全边更新或启发式寻路。
bridge:
  prev: 上一课的广度优先靠先进先出的队列，保证先摸到的点经过的边最少；可路一旦分出长短，先到不等于最近，我们得把普通队列换成永远先吐出「当前累计距离最小」的优先队列。
  next: 这一课一路靠堆把「当前最近的未定路口」挑出来；下一课我们要回到有序树结构本身，看看除了只管最小值的堆之外，二叉搜索树怎样同时撑起动态集合的查找、排序和按区间取数。
overview:
- key: 一句话总结
  value: 每次挑出目前离起点最近、还没定案的节点当场拍板，再拿它去更新邻居距离。它之所以敢拍板，是因为其他未定点离起点都更远，在边权非负的前提下，绕道它们绝不可能变得更短。
- key: 前提
  value: 所有边权必须大于等于 0。哪怕只有一条负权边，先定案的距离就可能被绕行加负边拉低，必须换 [[Bellman-Ford]] 这类算法。
- key: 复杂度
  value: 配合二叉堆时是 O((V + E) log V)。全图每个点最多定案一次、每条边最多触发一次有效更新，堆把每次找最小点的代价压在对数级别。
- key: 依赖
  value: 依赖优先队列（小顶堆）快速取出当前最近的未定点。若每轮都线性扫全表，点一多复杂度会退化成平方级的 O(V²)。
- key: 工程里
  value: 地图导航、互联网路由（如 [[OSPF]]）、游戏寻路都在用它；[[A*]] 在它的骨架上加一个朝终点的估计，把搜索拽向目标方向。
- key: 路径
  value: 每次成功压低邻居距离时，顺手记下「我是从谁过来的」（前驱），全图算完后从终点顺着前驱倒着走回起点，就是完整路线。
- key: 提前结束
  value: 只关心单一终点时，该终点一旦被取出定案就可以立刻停手，因为定案顺序严格从近到远，它的答案已经锁死。
- key: 负权边
  value: 有负权边换 Bellman-Ford，复杂度 O(V·E)。它不提前拍板，而是把所有边反复[[松弛]] V − 1 轮，多跑一轮还能顺手检出[[负环]]。
- key: 实现细节
  value: 工程上普遍用[[懒删除|惰性删除]]：同一个点被更新出更短距离时，不改堆里旧记录，直接塞新记录进堆，取出时遇到过期的直接扔掉。
