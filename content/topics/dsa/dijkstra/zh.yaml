# 知识优先版草稿（Linux x86-64 为例）。出处仅供参考，按 Daniel 决定不做逐条核对。
id: dsa/dijkstra
subject: dsa
slug: dijkstra
order: 6
status: published
license: CC-BY-4.0
title: Dijkstra 最短路径
summary: 边有长短时，怎样找到从起点到每个地方的最短路线。
premise: 以 5 个地点、道路长度不同的小地图为例，从 A 出发。
overview:
  - key: 一句话总结
    value: 每次确定“目前离起点最近、还没确定”的点，用它去更新邻居
  - key: 前提
    value: 边的权重不能为负
  - key: 复杂度
    value: 配合二叉堆约为 O((V + E) log V)
  - key: 依赖
    value: 用优先队列（堆）快速找出最近的点
  - key: 工程里
    value: 地图导航、网络路由（如 OSPF）、游戏寻路（A* 是它的加速版）
visual: datastate
logColumns:
  - key: mode
    label: 当前状态
  - key: event
    label: 发生了什么
steps:
  - id: why
    title: 为什么 BFS 不够
    tldr: BFS 只数“走几步”，但道路有长有短，步数少不等于路程短。
    body: |-
      从 A 到 C：直走一条 10 公里的路，或者经过 B 绕两段各 3 公里的路。
      BFS 会选一步到达的那条，但实际更远。
      边带权重时，需要一个会“算总长度”的算法。
    derivation: original
    sources:
      - ref: mit-6006
        locator: 最短路径相关讲义
        url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
        claim: 带权图的最短路径不能直接用 BFS 求得
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: datastate
      structure: graph
      caption: A 到 C：直走 10，还是经 B 走 3 + 3 = 6？
      graph:
        nodes:
          - id: A
            x: 3
            y: 60
            mark: active
          - id: B
            x: 35
            y: 6
          - id: C
            x: 58
            y: 70
            mark: active
          - id: D
            x: 97
            y: 92
          - id: E
            x: 82
            y: 6
        edges:
          - from: A
            to: B
            w: 3
            mark: found
          - from: B
            to: C
            w: 3
            mark: found
          - from: A
            to: C
            w: 10
            mark: active
          - from: B
            to: E
            w: 5
          - from: C
            to: D
            w: 2
          - from: E
            to: D
            w: 7
      aux:
        - label: BFS 选
          items:
            - A → C（10）
        - label: 实际最短
          items:
            - A → B → C（6）
    log:
      - mode: 初始
        event: A 距离为 0，其余为无穷大
  - id: greedy
    title: 核心想法：先确定最近的点
    tldr: 每次从还没确定的点里，挑出当前离起点最近的那个，它的距离就是最终答案。
    body: |-
      一开始只有 A 的距离是 0，其他都是“未知（无穷大）”。
      挑出最近的点后，它的距离不可能再变短：因为任何别的路线都要先经过更远的点，再加上非负的路程。
      这个论证依赖“边不为负”，这也是 Dijkstra 的前提。
    derivation: original
    sources:
      - ref: mit-6006
        locator: Dijkstra 相关讲义
        url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
        claim: 在非负权图中，每次取出的最近点其距离已是最终值
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: datastate
      structure: graph
      caption: 一开始只有 A 确定为 0，其他都是 ∞
      graph:
        nodes:
          - id: A
            x: 3
            y: 60
            mark: found
            note: "0"
          - id: B
            x: 35
            y: 6
            note: ∞
          - id: C
            x: 58
            y: 70
            note: ∞
          - id: D
            x: 97
            y: 92
            note: ∞
          - id: E
            x: 82
            y: 6
            note: ∞
        edges:
          - from: A
            to: B
            w: 3
          - from: B
            to: C
            w: 3
          - from: A
            to: C
            w: 10
          - from: B
            to: E
            w: 5
          - from: C
            to: D
            w: 2
          - from: E
            to: D
            w: 7
      aux:
        - label: 距离
          items:
            - A 0
            - B ∞
            - C ∞
            - D ∞
            - E ∞
    log:
      - mode: 确定 A
        event: A 的最短距离确定为 0
  - id: relax
    title: 松弛：用新确定的点更新邻居
    tldr: 看看经过这个点去它的邻居，会不会比已知的路线更短。
    body: |-
      A 到 B 是 3，比“无穷大”短，就把 B 的距离更新成 3；A 到 C 是 10，先记下 10。
      接着确定 B，发现经 B 到 C 只要 3 + 3 = 6，比 10 短，于是把 C 更新成 6。
      这一步叫“松弛”，就是不断用更好的路线替换旧的。
    derivation: original
    sources:
      - ref: mit-6006
        locator: 最短路径相关讲义
        url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
        claim: 松弛操作更新距离估计
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: datastate
      structure: graph
      caption: 确定 B 后，经 B 到 C 只要 3 + 3 = 6 < 10，更新 C
      graph:
        nodes:
          - id: A
            x: 3
            y: 60
            mark: done
            note: "0"
          - id: B
            x: 35
            y: 6
            mark: done
            note: "3"
          - id: C
            x: 58
            y: 70
            mark: active
            note: 10 → 6
          - id: D
            x: 97
            y: 92
            note: ∞
          - id: E
            x: 82
            y: 6
            mark: visited
            note: "8"
        edges:
          - from: A
            to: B
            w: 3
            mark: done
          - from: B
            to: C
            w: 3
            mark: active
          - from: A
            to: C
            w: 10
            mark: muted
          - from: B
            to: E
            w: 5
          - from: C
            to: D
            w: 2
          - from: E
            to: D
            w: 7
      aux:
        - label: 距离
          items:
            - A 0
            - B 3
            - C 6
            - E 8
            - D ∞
    log:
      - mode: 更新中
        event: C 的距离被改进
  - id: heap
    title: 用优先队列加速
    tldr: 每次都要找“最近的未确定点”，用堆可以快速取出。
    body: |-
      如果每次扫一遍所有点找最近的，点多了会很慢。
      把候选点放进最小堆，按当前距离排，取最近的只需要 O(log V)。
      这就是上一个主题“二叉堆”的典型用途，整体约为 O((V + E) log V)。
    derivation: original
    sources:
      - ref: mit-6006
        locator: Dijkstra 相关讲义
        url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
        claim: 使用优先队列实现 Dijkstra 算法
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: datastate
      structure: graph
      caption: 候选点按当前距离放进最小堆，取最近的 O(log V)
      graph:
        nodes:
          - id: A
            x: 3
            y: 60
            mark: done
            note: "0"
          - id: B
            x: 35
            y: 6
            mark: done
            note: "3"
          - id: C
            x: 58
            y: 70
            mark: active
            note: "6"
          - id: D
            x: 97
            y: 92
          - id: E
            x: 82
            y: 6
            mark: visited
            note: "8"
        edges:
          - from: A
            to: B
            w: 3
            mark: done
          - from: B
            to: C
            w: 3
            mark: done
          - from: A
            to: C
            w: 10
          - from: B
            to: E
            w: 5
          - from: C
            to: D
            w: 2
          - from: E
            to: D
            w: 7
      aux:
        - label: 最小堆
          items:
            - C 6
            - E 8
    log:
      - mode: 重复
        event: 直到所有点都确定
  - id: limits
    title: 负权边与工程应用
    tldr: 有负权边时，“先确定的就是最终的”不再成立，要换别的算法。
    body: |-
      如果某条路是负的（比如走过去反而能“赚回”距离），已确定的点可能还有更短的路，Dijkstra 会出错，这时用 Bellman-Ford。
      地图导航、网络路由协议 OSPF 都用到 Dijkstra 的思想。
      游戏寻路常用 A*：在 Dijkstra 的基础上加一个“离终点大概多远”的估计，优先往目标方向搜索。
    derivation: original
    sources:
      - ref: mit-6006
        locator: 最短路径相关讲义
        url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
        claim: 负权边需使用 Bellman-Ford 等算法
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: datastate
      structure: graph
      caption: 最终最短路（粗线）；边必须非负，负权用 Bellman-Ford
      graph:
        nodes:
          - id: A
            x: 3
            y: 60
            mark: done
            note: "0"
          - id: B
            x: 35
            y: 6
            mark: done
            note: "3"
          - id: C
            x: 58
            y: 70
            mark: done
            note: "6"
          - id: D
            x: 97
            y: 92
            mark: done
            note: "8"
          - id: E
            x: 82
            y: 6
            mark: done
            note: "8"
        edges:
          - from: A
            to: B
            w: 3
            mark: found
          - from: B
            to: C
            w: 3
            mark: found
          - from: A
            to: C
            w: 10
          - from: B
            to: E
            w: 5
            mark: found
          - from: C
            to: D
            w: 2
            mark: found
          - from: E
            to: D
            w: 7
      aux:
        - label: 距离
          items:
            - A 0
            - B 3
            - C 6
            - D 8
            - E 8
    log:
      - mode: 完成
        event: 得到从 A 到所有地点的最短距离
