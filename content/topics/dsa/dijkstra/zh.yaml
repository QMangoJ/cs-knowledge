- id: bellman
  title: 负权边怎么办：[[Bellman-Ford]] 的笨办法
  tldr: "前面所有定案都建立在边权非负上。这一步把负权边放进来，先看定案为什么会被击穿，再换一套完全不同的办法：不挑最小者定案，而是把所有边反复[[松弛]]很多轮，最后还顺手能查出图里有没有[[负环]]。"
  body: >-
    [[Dijkstra]] 的正确性靠最小的未定节点不可能再变小，负权边一来这条就不成立。Bellman-Ford 换一条路：对全部边做 V−1 轮松弛，第 k 轮结束后，所有最短路径至多 k 条边的距离都已正确；简单路径最多 V−1
    条边，所以 V−1 轮足够。若第 V 轮还能松弛，说明图里有负权环（绕一圈越走越短，最短路径不存在）。


    两轮走例：图是 A 到 B 权 6、B 到 C 权负 2、A 到 C 权 5。初始只有 A 等于 0，第一轮松弛全部边，A 到 B 把 B 写成 6，B 到 C 把 C 写成 4，A 到 C 的 5
    不更优；第二轮再扫一遍没有任何更新，已收敛。而 Dijkstra 在这里会先在 B 的 6 与 C 的 5 里挑更小的 C、按直达边定版成 5，之后 B 再松弛出 4 也追不回来，错失经 B 的 4，这正是贪心前提被负边击穿的现场。


    代价是每轮扫全部边，总复杂度 O(V·E)。选型口诀：边权非负用 Dijkstra，有负权无负环用 Bellman-Ford，它还能顺手检测负环。慢只是代价，不是错误。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 24 Bellman-Ford 算法
    claim: Bellman-Ford 对全部边松弛 V−1 轮求单源最短路并能检测负权环，复杂度 O(VE)
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
