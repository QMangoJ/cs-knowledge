steps:
- id: why
  title: 为什么 BFS 不够
  tldr: BFS 只数“走几步”，但道路有长有短，步数少不等于路程短。
  body: '从 A 到 C，直走一条 10 公里的路，或者经过 B 绕两段各 3 公里的路。BFS 会选一步到达的那条，但实际更远。边带权重时，需要一个会算总长度的算法。

    把账算细，直达边权 10，经 B 两段合计 6，BFS 按边数选了只有 1 条边的路线，却输在总长上，说明边数和总长是两个不同的度量。只要边权不全相等，按边数排序就没有理由等于按总长排序，这个反例虽小，却一次性否定了把 BFS 直接搬到带权图的想法。

    更隐蔽的情形是，边数多的路线反而更短在真实路网里随处可见，绕城高速分三段走，总长常短于穿城的一段小路。所以带权图需要新的不变量，维护每个点当前已知的最短距离估计，并在有把握时逐个把估计变成定论，这就是下一节贪心的出发点。还要记住，无权是带权的特例，全部边权都等于 1 时 Dijkstra 就退化成 BFS，两者是同一族思想在不同度量下的样子。'
  derivation: original
  sources:
