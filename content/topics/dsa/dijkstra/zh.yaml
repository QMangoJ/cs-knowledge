- id: relax
  title: "[[松弛]]：用刚定案的点去压低邻居的距离"
  tldr: 新点 u 一旦定案，就拿 dist[u] 加边权去试试能不能把邻居改小——这就是全算法唯一的更新动作「[[松弛]]」；被改写估计值和最终定案是两码事，一个点可能先被写小好几次才轮到自己拍板。
  body: |-
    拿着这张 5 路口地图从头走到尾。起步 A 定案为 0，拿 A 的两条出边做[[松弛]]：A → B 长 3，比 ∞ 短，把 B 改成 3（前驱记 A）；A → C 长 10，把 C 改成 10（前驱记 A）。下一轮在未定的 B(3) 和 C(10) 里挑小的 B(3) 定案，立刻拿 B 去松弛它的邻居：经 B 到 C 只要 3 + 3 = 6，比旧账 10 更短！于是把 C 的距离从 10 改写成 6、前驱也从 A 改写成 B；同时经 B 到 E 是 3 + 5 = 8，把 E 改成 8（前驱 B）。

    接着在剩下的 C(6)、E(8)、D(∞) 里挑最小者 C(6) 定案。拿 C 松弛它的出边 C → D（权 2），算出 6 + 2 = 8，把 D 从 ∞ 改写成 8（前驱 C）。现在未定点里 E = 8 和 D = 8 并列第一，先挑谁都一样：假设先定案 E(8)，拿 E → D（权 7）一试，8 + 7 = 15，比 D 现有的 8 还大，松弛失败、保持原样；最后定案 D(8)，全图结束，最终距离是 A=0、B=3、C=6、E=8、D=8。

    盯住 C 的变化过程：C 先被写过一次 10，后来又被改写成 6，直到第三轮才真正轮到它盖章定案。把「估计被改写」和「最终定案」分清，看后面的最小堆才不会迷糊。另外代码里松弛判断用的是严格小于（<）：万一新路线算出来和旧距离相等，保持先到先得、不换前驱。
