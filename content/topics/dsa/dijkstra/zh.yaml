- id: limits
  title: 负权边与工程应用
  tldr: 有负权边时，“先确定的就是最终的”不再成立，要换别的算法。
  body: '如果某条路是负的（比如走过去反而能“赚回”距离），已确定的点可能还有更短的路，Dijkstra 会出错，这时用 Bellman-Ford。

    地图导航、网络路由协议 OSPF 都用到 Dijkstra 的思想。

    游戏寻路常用 A*：在 Dijkstra 的基础上加一个“离终点大概多远”的估计，优先往目标方向搜索。'
  derivation: original
