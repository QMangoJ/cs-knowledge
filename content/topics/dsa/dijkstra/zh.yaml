- id: zero-one-bfs
  title: 0-1 BFS 引子：边权只有 0 和 1 时不用堆
  tldr: 松弛走 0 权边就把节点放队头、走 1 权边放队尾，双端队列天然保持出队距离不减，复杂度降到线性。
  body: '若所有边权只有 0 和 1，优先队列可以换成一个双端队列，得到线性的 O(V + E)。松弛时若走的是 0 权边，新距离与当前点相同，把目标放进队头，若走的是 1 权边，新距离大 1，放进队尾。这样队内距离始终保持非递减且最多相差 1，出队顺序天然就是 Dijkstra 需要的从小到大，不必再付 log 的代价。

    走个小例子，A 到 B 权 0、A 到 C 权 1、B 到 C 权 0。处理 A 后 B 入队头、C 入队尾，先取 B，用 0 权边把 C 改写成 0 并挪到队头，最终 C 的最短距离是 0，与 Dijkstra 的结果一致。它成立的根子是距离增量只有两种且差距为 1，队内元素的距离被卡在两个相邻整数之间，单调性因此免费成立。

    一旦出现权 2 或权 0.5，这个夹逼就失效，必须老实回堆，认错结构硬套只会静默算错。网格图里穿墙的代价、开关状态的切换这类问题常正好是 0 与 1，认出这个结构就能把 log 砍掉，它是 Dial 算法思想在等步长情形下的最简形态。'
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 24 习题（Dial 算法与小整数权重的优化）
