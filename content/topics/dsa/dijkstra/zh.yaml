- id: greedy
  title: 核心想法：先确定最近的点
  tldr: 每次从还没确定的点里，挑出当前离起点最近的那个，它的距离就是最终答案。
  body: '一开始只有 A 的距离是 0，其他都是未知（无穷大）。挑出最近的点后，它的距离不可能再变短，因为任何别的路线都要先经过更远的点，再加上非负的路程。这个论证依赖边不为负，这也是 Dijkstra 的前提。

    把论证说完整，设 u 是未定点里 dist 最小的那个，假设还存在一条更短的路通向 u，它必然要先离开已定集合，经过某个未定点 x 再到 u。这条路从起点到 x 的一段，长度至少是 x 当前的 dist，而 x 的 dist 不小于 u 的 dist，后面再接非负边权，总长不可能小于 u 的 dist，矛盾，所以假设不成立。

    这个论证里非负是唯一被用到的边权性质，一旦有负边，从 x 绕行那段可能把总长拉低，整条推理链就断了，后面的 Bellman-Ford 一节会给出具体的翻车数字。已定集合也叫 S，算法全程维护的不变量是，S 内每个点的 dist 都等于真实最短距离，S 外每个点的 dist 等于只经过 S 内点作中间站时的最优值，每轮把一个点搬进 S 并恢复不变量，直到 S 装下全部点。'
  derivation: original
