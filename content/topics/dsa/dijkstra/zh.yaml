- id: playground
  title: 动手实验：换个源点再跑一遍
  tldr: "规则讲完了，换你换源点重跑：依次选不同的点当起点，看定案顺序和距离表怎样完全变样。再盯住[[松弛]]发生的时刻，把每个点被改写的次数和触发它的那条边对上号。"
  body: >-
    在实验室里依次选 A 与 F 当源点：从 A 出发先定版 C（距离 2），从 F 出发先定版 E（距离 1），贪心的每一步都只看当前 dist
    表，没有全局视角。松弛更新发生时留意那一行：更短的新距离总是先写进表、等它成为未定最小值时才定版。


    对比两次结果看三件事。一是定版顺序完全由源点决定：同一个 D 从 A 出发排在后面，从 F 出发却很靠前，因为距离是相对源点定义的。二是松弛的时刻：某个点的 dist
    可能被改写多次才定版，把每次改写和触发它的那条边对上，松弛就从公式变成了账本。三是并列距离：两个点 dist 相等时先定版谁都不影响最终距离，但会影响前驱与路径的长相。


    做完后试着预测：从 B 出发时谁最先定版、D 的前驱会是谁，再跑一遍验证。
