objectives:
- 复述松弛操作与贪心的正确性直觉
- 解释为什么负边会让 Dijkstra 失效
- 用堆把复杂度降到 O((V+E) log V)
aiLink: 最短路径思想在 AI 系统里变形出现：路由与 CDN 调度找最低延迟节点、束搜索保留最优候选、多跳检索的代价估计。理解贪心 + 松弛 + 优先队列这组组合拳，就掌握了一类优化问题的通用骨架。
quiz:
- q: 松弛（relax）操作做的是什么？
  options:
  - 删边
  - 若经 u 到 v 更短，就更新 v 的距离与前驱
  - 把边权改小
  - 访问标记
  answer: 1
  explain: 全部算法就是反复松弛；区别只在以什么顺序挑边。
- q: Dijkstra 为什么不允许负边？
  options:
  - 代码写不了
  - 贪心假设已确定的最短距离不会被后来更短的路推翻，负边会打破它
  - 负边不存在于现实
  - 堆不支持负数
  answer: 1
  explain: 负边可能让已结算节点出现更短路径，贪心前提崩塌，需改用 Bellman-Ford。
- q: 用二叉堆优化后，每次取最近未定节点与更新邻居的代价是？
  options:
  - O(1)
  - O(log V)
  - O(V)
  - O(E)
  answer: 1
  explain: 堆的取顶与更新都是 O(log V)，总复杂度 O((V+E) log V)。
