- id: second-shortest
  title: 次短路径的边界：第二名为什么难求
  tldr: 贪心定版只保留每个点的冠军，次短路要给每个点多维护一个亚军距离，且先要把次短的定义问清楚。
  body: '求最短只要一条，但工程里常问严格次短，也就是长度大于最短、按约定不重复用边的备选路线，导航给出的第二方案就是它。难点在于贪心定版只保留每个点的冠军，亚军信息在松弛时被直接丢弃，等发现冠军路线不可用时已经无从恢复，这不是实现粗心，而是原算法的状态里根本没给第二名留位置。

    常见做法是给每个点同时维护最短与次短两个距离，松弛时把候选按大小分别塞进两个位置，候选若与最短相等要跳过、继续找严格更大的，优先队列里因此会出现同一节点的两种状态，弹出次短状态的那一刻才是它的定版时刻。整体框架还是 Dijkstra，只是每个点的状态从一个数变成了一对数。

    还要划清边界，若允许重复走点和边，次短路可能只是绕一个小环多走一圈，数学上成立却没有实用价值，所以题目通常会写明简单路径或不重复用边，读题时先确认是哪一种定义。K 短路径是它的推广，代价随 K 增长很快，生产系统一般只算前两三条就收手，多算的边际价值迅速递减。'
  derivation: original
  sources:
  - ref: mit-6006
    locator: 最短路径讲义进阶讨论（K 短路径与次优解）
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
