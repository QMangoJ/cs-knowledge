- id: limits
  title: 负权边与工程应用
  tldr: 有负权边时，“先确定的就是最终的”不再成立，要换别的算法。
  body: '如果某条路是负的（比如走过去反而能赚回距离），已确定的点可能还有更短的路，Dijkstra 会出错，这时用 Bellman-Ford。地图导航、网络路由协议 OSPF 都用到 Dijkstra 的思想。游戏寻路常用 A*，在 Dijkstra 的基础上加一个离终点大概多远的估计，优先往目标方向搜索；只要这个估计不高估真实距离（admissible），A* 仍保证最短路径。

    工程注记，A* 是 Dijkstra 骨架的直接推广，把已付代价加启发估计塞进优先队列，取的永远是当前估计总代价最小的候选。束搜索不同，它只保留固定宽度的候选、丢弃其余，是贪心截断，不保证最优，只是借用了保留最有希望的候选这个思想。再补两个细节，OSPF 里每台路由器各自以自己为源跑一遍 Dijkstra，前提是全网先同步出同一张带权图，图不一致时各自算出的最短路会互相矛盾。

    A* 的启发值若高估了真实剩余距离，比如把直线距离乘一个大于 1 的系数换速度，就可能错过最优路，这时它退化成一种加权贪心，工程上常用这种牺牲最优性换速度的做法，但必须明确知道自己放弃了保证，不能既高估又宣称最短。把这三件事分清，导航、路由与生成解码里的最短代价问题就都有了对应的工具与边界。'
  derivation: original
  sources:
