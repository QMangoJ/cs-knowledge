id: dsa/dijkstra
subject: dsa
slug: dijkstra
order: 6
status: published
license: CC-BY-4.0
title: Dijkstra 最短路径
summary: 边有长短时，怎样找到从起点到每个地方的最短路线。
premise: 地图上从一个地点到其他地点，路有长有短，走的步数最少不等于总路程最短，怎样才能算出真正的最短路线？本课用一张小地图来走一遍这个算法，地图上有 5 个地点，道路长度各不相同，从 A 出发，逐个确定每个地点离 A 的最短距离。
position: 本课仍在「图上的行走」板块内，它紧接 BFS 用队列按距离分层推进的思路之后，把分层依据从边数换成累计边权。学完你能亲手执行[[松弛]]这唯一的更新动作，并用边权非负这一前提解释为何未定点中 dist 最小者一旦被选出就不可能再被绕行反超。
bridge:
  prev: 上一课 BFS 靠先进先出保证先到者边数最少，本课保留先处理最近者的骨架，却必须把普通队列换成按 dist 取最小的优先队列才能应对带权边。
  next: Dijkstra 每轮都要从未定集合里快速取出 dist 最小者，下一课二叉搜索树要回答的是：除了堆之外，怎样用一棵有序的树同样支撑动态集合的最小值与范围查询。
overview:
- key: 一句话总结
  value: 每次确定目前离起点最近、还没确定的那个点，再用它去更新邻居。这个点之所以能当场定案，是因为其他还没确定的点离起点都更远，绕道它们再回来只会更长，不可能再改进它。
- key: 前提
  value: 边的权重不能为负。一旦有负权边，先定案的距离就可能被后面一条负边拉得更短，前面说的定案理由就不成立了，这时要换 [[Bellman-Ford]] 这类算法。
- key: 复杂度
  value: 配合二叉堆时约为 O((V + E) log V)。图里的每个点最多被取出定案一次，每条边最多被用来更新一次，堆让每次挑最近点的代价保持在对数级别。
- key: 依赖
  value: 它依赖优先队列，也就是堆，来快速找出最近的点。每轮都要在还没定案的点里挑距离最小的，如果每次都线性扫一遍，整体就会慢一个量级。
- key: 工程里
  value: 地图导航、网络路由（比如 [[OSPF]]）、游戏寻路都在用它，[[A*]] 是它的加速版。A* 在 [[Dijkstra]] 的基础上多了一个朝目标方向的估计，让搜索少绕远路，但骨架还是同一套。
- key: 路径
  value: 记录前驱，最后回溯就能得到完整路径。每当发现经过某个点去邻居更短时，就记下这个邻居是从哪个点过来的，全部算完后从终点顺着记录倒着走回起点，就是最短路线本身。
- key: 提前结束
  value: 只要一个终点时，终点被确定就可以停。因为定案顺序是按距离从近到远的，终点一旦被定案，它的距离就已经是最终答案，后面更远的点不用再算了。
- key: 负权边
  value: 有负权边时用 Bellman-Ford，复杂度是 O(V·E)，还能发现[[负环]]。它不靠一次定案，而是把所有边反复[[松弛]]很多轮，让负边的影响慢慢传开，慢一些但适用范围更广。
- key: 实现细节
  value: 常用懒删除的做法，同一点可以多次入堆，取出时跳过过期的记录。同一个点发现更短的路时不去堆里改旧记录，而是直接再入堆一份新的，取出时发现这份记录比已知距离大就直接扔掉，实现简单很多。
