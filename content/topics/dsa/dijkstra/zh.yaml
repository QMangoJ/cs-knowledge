- id: why
  title: 为什么 BFS 不够
  tldr: BFS 只数“走几步”，但道路有长有短，步数少不等于路程短。
  body: '从 A 到 C：直走一条 10 公里的路，或者经过 B 绕两段各 3 公里的路。

    BFS 会选一步到达的那条，但实际更远。

    边带权重时，需要一个会“算总长度”的算法。'
