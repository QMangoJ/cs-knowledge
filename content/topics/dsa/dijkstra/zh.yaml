title: Dijkstra 最短路径
summary: 边有长短时，怎样找到从起点到每个地方的最短路线。
premise: 以 5 个地点、道路长度不同的小地图为例，从 A 出发。
position: >-
  本课仍在「图上的行走」板块内，它紧接 BFS 用队列按距离分层推进的思路之后，把分层依据从边数换成累计边权。学完你能亲手执行松弛这唯一的更新动作，并用边权非负这一前提解释为何未定点中 dist 最小者一旦被选出就不可能再被绕行反超。
bridge:
  prev: >-
    上一课 BFS 靠先进先出保证先到者边数最少，本课保留先处理最近者的骨架，却必须把普通队列换成按 dist 取最小的优先队列才能应对带权边。
  next: >-
    Dijkstra 每轮都要从未定集合里快速取出 dist 最小者，下一课二叉搜索树要回答的是：除了堆之外，怎样用一棵有序的树同样支撑动态集合的最小值与范围查询。
overview:
- key: 一句话总结
  value: 每次确定“目前离起点最近、还没确定”的点，用它去更新邻居
- key: 前提
  value: 边的权重不能为负
- key: 复杂度
  value: 配合二叉堆约为 O((V + E) log V)
- key: 依赖
  value: 用优先队列（堆）快速找出最近的点
- key: 工程里
  value: 地图导航、网络路由（如 OSPF）、游戏寻路（A* 是它的加速版）
- key: 路径
  value: 记录前驱，最后回溯
- key: 提前结束
  value: 只要一个终点时，终点确定即可停
- key: 负权边
  value: 用 Bellman-Ford，O(V·E)，还能发现负环
- key: 实现细节
  value: 常用“懒删除”：同一点可多次入堆，取出时跳过过期的
