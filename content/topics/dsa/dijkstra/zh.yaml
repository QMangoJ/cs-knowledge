prereq:
- dsa/bfs-dfs
- dsa/binary-heap
objectives:
- 复述松弛操作与贪心的正确性直觉
- 解释为什么负边会让 Dijkstra 失效
- 用堆把复杂度降到 O((V+E) log V)
aiLink: 最短路径思想在 AI 系统里变形出现：路由与 CDN 调度找最低延迟节点、束搜索保留最优候选、多跳检索的代价估计。理解贪心 + 松弛 + 优先队列这组组合拳，就掌握了一类优化问题的通用骨架。
design:
- mechanism: 每轮只给未定点里 dist 最小的那个拍板定案
  problem: 算法每轮都要宣布一个距离变成永久答案，一旦宣布太早、后来冒出一条更短的绕行路就得推翻重算，逐个定案的框架会直接散架。
  choice: 每轮从未定集合挑出当前 dist 最小的点放进已定集合 S 并从此锁死，其余未定点只通过松弛单调变小，直到它自己轮到第一名才拍板。
  tradeoff: 换来全图每个点只拍板一次的高效率；代价是死死绑住了「所有边权必须非负」的前提，且定案顺序完全按距离锁死。
  root: 非负边权保证了越往外加路程只会越长——任何绕过 S 外更远节点的路线，踏出 S 第一步就已经落后，不可能再靠后续非负边追回来；一旦允许负边，这条数学地基当场塌陷。
- mechanism: 用「只塞新条目 + 取出时跳过过期值」的懒删除替代堆内改键
  problem: 松弛频繁把某个点的距离改小，可普通二叉堆不支持按节点名瞬间定位到旧记录去修改键值，强行原地改堆得额外维护一套反向索引。
  choice: 估计变小时不动堆里旧记录，直接塞一份新记录进堆；等记录弹出堆顶时，比对一下它带着的距离和全局最新 dist 对不对得上，对不上就当过期票扔掉。
  tradeoff: 堆里最多积压和边数同量级的条目，多占一点空间并多弹出几次废票；换来的是代码极其短小稳健，且渐近复杂度依然落在 O((V + E) log V)。
  root: 二叉堆天生擅长「插入」和「取最小」，却不擅长「按名字定位并改键」；懒删除顺着堆的脾气设计流程，把难做的改键转化成堆最擅长的插入。
- mechanism: 最短路算法按边权前提分层选型
  problem: 如果不管三七二十一全用最通用的 Bellman-Ford，十万个路口的地图每次都要跑 V 乘 E 次松弛，比堆优化慢出好几个数量级，线上系统根本扛不住。
  choice: 先核对边权条件再挑工具：全非负用堆优化 Dijkstra，只有 0 和 1 用双端队列把 log 也砍掉，有负权才退回多轮全边松弛并顺手查负环，单一终点加保守启发上 A*。
  tradeoff: 越专用的算法跑得越快，代价是前提一旦漏检就会静默算错——往 Dijkstra 里塞一条负权边不会报错崩溃，只会悄悄吐出假的最短路。
  root: 每一次提速都是在拿问题本身的额外约束换性能：非负换来了贪心定案，0/1 权重换来了队列夹逼；前提成立就是免费午餐，前提错了就是定时炸弹。
quiz:
- q: 松弛（relax）操作做的是什么？
  options:
  - 删边
  - 若经 u 到 v 更短，就更新 v 的距离与前驱
  - 把边权改小
  - 访问标记
  answer: 1
  explain: 全部算法就是反复松弛；区别只在以什么顺序挑边。
- q: Dijkstra 为什么不允许负边？
  options:
  - 代码写不了
  - 贪心假设已确定的最短距离不会被后来更短的路推翻，负边会打破它
  - 负边不存在于现实
  - 堆不支持负数
  answer: 1
  explain: 负边可能让已结算节点出现更短路径，贪心前提崩塌，需改用 Bellman-Ford。
- q: 用二叉堆优化后，每次取最近未定节点与更新邻居的代价是？
  options:
  - O(1)
  - O(log V)
  - O(V)
  - O(E)
  answer: 1
  explain: 堆的取顶与更新都是 O(log V)，总复杂度 O((V+E) log V)。
