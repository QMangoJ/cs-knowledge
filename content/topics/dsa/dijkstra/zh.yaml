- id: proof
  title: 证明底层赌注：为什么绕出已定名单不可能更短
  tldr: 在 S 已定下 A=0、B=3 且未定集合里 C=6 最小、E=8 次之时，任何绕开 S 去 C 的路踏出 S 那一步就已经至少花掉 8，加上非负后续绝无可能比 6 更短。
  body: |-
    把刚才的直觉收成经得起检验的证明，靠一条[[循环不变式]]：每轮开始时，已定集合 S 里每个点的 dist 都已经等于它的全局真实最短路；而 S 外面每个点的 dist，等于「只允许借道 S 里面中转」时的最优距离。初始 S 只有起点 A、dist[A] = 0，这条规矩显然成立。

    现在把画布停在关键一轮：假设 S 里已经定案了 A(0) 和 B(3)，S 外面当前只看见 C = 6（经 B）和 E = 8（经 B）。算法准备把未定点里最小的 C(6) 定案。假如有条唱反调的神秘路线声称也能从 A 到 C、而且总长比 6 更短——那起点 A 在 S 里、终点 C 在 S 外，这条路半途总得有第一次踏出 S 的那一脚，落到某个 S 外的节点 x 上（在画布里，这个出口就是 E）。

    算一算他踏到 x 那一刻已经花了多少：走到 x 之前所有中间站全在 S 内，按不变式，这前半段就已经不可能短于 dist[x]（x = E 时至少花掉 8）；而算法挑了 C 当未定点里的最小值，正说明每个未定点 x 都满足 dist[x] ≥ dist[C]（8 ≥ 6）。从 x 再往后怎么绕回 C，只要边权非负，后半段就只会 ≥ 0，整条路的总长至少也是 8 + 非负数 ≥ 8 > 6，当场矛盾！整段证明从头到尾只有「后半段 ≥ 0」这一处用到了非负——记住这一刀，后面会看到负边是怎么精准砍断它的。
