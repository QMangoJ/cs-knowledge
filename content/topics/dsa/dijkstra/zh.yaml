steps:
- id: why
  title: 带权图里，步数最少不等于路程最短
  tldr: 道路有长短时，经过路口最少绝不等于总路程最近；只按边数推进的 [[BFS]] 会选错路，必须改成维护累计距离的算法。
  body: |-
    拿画布上这张 5 个路口的小地图直接对账：从 A 出发去 C，有两条走法。第一条直达，只走 1 条边，但路长 10 公里；第二条先去 B 再拐去 C，要走 2 条边，可两段各只有 3 公里，加起来才 3 + 3 = 6 公里。

    如果硬把上一课的 [[BFS]] 搬过来，队列第一圈就把和 A 相邻的 B、C 全放进去并当场认为 C 只要 1 步就到了——它会选那条 10 公里的直达路，直接错过只要 6 公里的绕行路。日常导航里这种情况天天见：穿城小路可能 10 公里堵到天黑，上环城高速绕两段反而只要 6 公里。

    根本原因在于：边一旦带上长短不一的权重，「边数少」和「总路程短」就分家了。我们不能再按「先摸到谁」定终生，必须给每个路口记一张动态更新的距离估计表，在真正有把握时再逐个盖章定案。（顺便一提：若所有边权都等于 1，下面要学的 Dijkstra 就会原样退化成 BFS。）
