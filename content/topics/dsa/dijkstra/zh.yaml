- id: limits
  title: 负权边与工程应用
  tldr: "负权边的处理办法有了，这一步收口工程应用：地图导航、网络路由、游戏寻路分别站在哪套算法上。重点看 [[A*]] 怎样在 [[Dijkstra]] 的骨架上加一个朝向目标的估计，以及估计一旦高估真实距离，会丢掉什么保证。"
  body: >-
    如果某条路是负的（比如走过去反而能赚回距离），已确定的点可能还有更短的路，Dijkstra 会出错，这时用 [[Bellman-Ford]]。地图导航、网络路由协议 [[OSPF]] 都用到 Dijkstra 的思想。游戏寻路常用 A*，在
    Dijkstra 的基础上加一个离终点大概多远的估计，优先往目标方向搜索；只要估计不高估真实距离（admissible），A* 仍保证最短路径。


    A* 是 Dijkstra 骨架的直接推广：把已付代价加启发估计塞进优先队列，取的永远是当前估计总代价最小的候选。它的启发值若高估真实剩余距离，比如把直线距离乘一个大于 1
    的系数换速度，就可能错过最优路，退化成一种加权贪心。工程上常用这种牺牲最优性换速度的做法，但必须明确知道自己放弃了保证，不能既高估又宣称最短。
