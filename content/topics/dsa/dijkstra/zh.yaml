  code:
    lang: typescript
    code: "// Dijkstra 骨架：优先队列取当前最近点，松弛它的所有出边\nfunction dijkstra(graph: Map<string, [string, number][]>, src: string) {\n  const dist = new Map<string, number>([[src, 0]]);\n  const pq: [number, string][] = [[0, src]]; // 实际工程用二叉堆，这里示意排序取最小\n  while (pq.length) { pq.sort((a, b) => a[0] - b[0]); const [d, u] = pq.shift()!;\n    if (d !== dist.get(u)) continue;\n    for (const [v, w] of graph.get(u) ?? []) { const nd = d + w;\n      if (nd < (dist.get(v) ?? Infinity)) { dist.set(v, nd); pq.push([nd, v]); } } }\n  return dist;\n}"
    note: TypeScript 实现（堆见二叉堆主题）
- id: heap
  title: 用优先队列加速
  tldr: 每次都要找“最近的未确定点”，用堆可以快速取出。
  body: '如果每次扫一遍所有点找最近的，点多了会很慢。把候选点放进最小堆，按当前距离排，取最近的只需要 O(log V)。这就是上一个主题二叉堆的典型用途，整体约为 O((V + E) log V)。

    数字对比，10 万个节点的图，朴素 O(V²) 是 100 亿次量级；堆优化 O((V+E) log V) 在稀疏图（E 是 V 的常数倍）下约数百万次量级，地图与调度系统只能选后者。堆里还有个实现抉择，dist 变小时是修改堆里旧条目的键值，还是直接塞一个新条目进去。前者叫 decrease-key，需要知道条目在堆里的位置，二叉堆原生不支持定位，要额外维护索引，后者叫懒删除，新条目入堆，旧条目留着等取出时发现与当前 dist 对不上就跳过。

    懒删除会让堆里最多有 E 条记录，空间稍大，但代码简单且渐近复杂度不变，工程实现几乎一边倒选它。还要提醒，堆里比较的是 dist 而不是节点编号，两个点距离相同取谁都对正确性无影响，但会影响前驱的长相，复现实验结果时要留意这种由并列引起的不确定性。'
  derivation: original
