- id: path
  title: 记录路径，而不只是距离
  tldr: "距离表算完只回答了有多远，导航还要回答怎么走。这一步在每次[[松弛]]成功时顺手记下前驱，最后从终点倒着走回起点拼出完整路线；顺带看所有前驱边合起来构成的那棵[[最短路径树]]。"
  body: >-
    导航不只要知道多远，还要知道怎么走。更新 C 的距离时，同时记下 C 的前驱是 B，最后从终点沿前驱一路回溯到起点，反过来就是最短路径。如果只关心到某一个终点的距离，终点被确定时就可以提前结束，不必算完所有点。


    以前驱表把 A 到 D 的路拼出来：从 D 查前驱是 C，C 的前驱是 B，B 的前驱是 A，得到逆序链 D、C、B、A，反转后就是 A、B、C、D，总长 3 加 3 加 2 等于
    8，与距离表对得上。所有前驱边合在一起构成一棵以起点为根的树，叫最短路径树，树上任意点到根的路径都是它的一条最短路。


    若两条路等长，先被松弛成功的那条会占住前驱位置，后来的相等候选不会替换，所以返回哪条取决于松弛顺序，这不是错误，只是并列时的任意选择。若业务要求等长时按次级标准择优，就要在松弛比较里把次级标准也写进去。
  derivation: original
