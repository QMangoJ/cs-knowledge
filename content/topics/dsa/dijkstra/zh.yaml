- id: path
  title: 记录路径，而不只是距离
  tldr: 每次松弛成功时，记下“我是从谁过来的”，最后倒着走就是完整路线。
  body: '导航不只要知道多远，还要知道怎么走。

    更新 C 的距离时，同时记下 C 的前驱是 B；最后从终点沿着前驱一路回溯到起点，反过来就是最短路径。

    如果只关心到某一个终点的距离，终点被确定时就可以提前结束，不必算完所有点。'
  derivation: original
  sources:
