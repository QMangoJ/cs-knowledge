- id: proof
  title: 正确性证明骨架：不变式加归纳
  tldr: 证明只需三步，立不变式、验初始、证每轮把最小者并入已定集合后不变式仍成立，非负只在一处被用到。
  body: '把贪心的直觉收成可检验的证明，只需要三步。先立不变式，每轮开始时，已定集合 S 里每个点的 dist 都等于它到起点的真实最短距离，且 S 外每个点的 dist 等于所有中间点都落在 S 内的路径里的最优值。归纳基础是 S 只有起点时显然成立，距离 0 没有争议。

    归纳步骤看本轮选出的 u，它是 S 外 dist 最小者。假设它还有一条更短的路，这条路第一次离开 S 的地方必然经过某个 S 外点 x，路在 x 之前的部分给出 x 的 dist 的一个候选，于是这条路总长不小于 x 的 dist，而 x 的 dist 不小于 u 的 dist，再加上后面非负的边，总长不小于 u 的 dist，与更短矛盾，所以 u 的 dist 就是真值，把它并入 S。

    再看 S 外其余点的 dist，经 u 松弛后恰好恢复成新集合口径下的最优值，不变式在下一轮继续成立。整段证明只在一处用到非负，即离开 S 之后的那段路不能把总长拉低，这精确地指出了负边翻车的位置。会复述这个骨架，比背结论更能应对面试里为什么不能有负边的追问。'
  derivation: original
