- id: bellman
  title: 负权反例击穿赌注：换 [[Bellman-Ford]] 全边多轮松弛
  tldr: 只要图里出现一条负权边，Dijkstra 先挑最小定案的赌注就会被当场击穿；[[Bellman-Ford]] 放弃提前拍板，改用对全部边反复[[松弛]] V − 1 轮稳步逼近真值，多跑第 V 轮还能抓出[[负环]]。
  body: |-
    拿画布上这个 3 个节点的极简反例，现场看 [[Dijkstra]] 的赌注是怎么破产的：从 A 出发，A → B 权 6，A → C 权 5，而 B → C 的权是 −2（好比走这段路给你倒贴 2 块钱补贴）。A 起步松弛完邻居，表上写着 B = 6、C = 5。接着 Dijkstra 挑未定点里最小的 C = 5 当场盖章定案，放进 S 锁死；等下一轮它再去处理 B = 6 并顺着 B → C(−2) 算出 6 + (−2) = 4 时，因为 C 早就定案出局了，直接跳过不再更新，眼睁睁把最短路 4 错算成 5！

    既然无法靠「挑最小」提前拍板，Bellman-Ford 干脆换个彻底稳妥的慢办法：对图里的每一条边统一做 V − 1 轮松弛。拿这个 3 点图走两轮：第 1 轮扫全部 3 条边，A → B 把 B 写成 6，B → C 把 C 写成 6 + (−2) = 4，A → C 的 5 不如 4 短所以忽略；第 2 轮再扫一遍，没有任何数字能再改小，已经收敛到 A=0、B=6、C=4。为什么最多只要 V − 1 轮？因为一条不兜圈的简单路径最多只经过 V − 1 条边，第 k 轮结束时所有最多 k 条边的最短路一定都传到位了。

    这套办法还免费附带一个绝活——检测[[负环]]。如果在做完 V − 1 轮后多跑第 V 轮，发现居然还有某条边能继续把距离改小，那就证明图里藏着一个总权值为负的圈：每绕一圈路程就变得更短，最短路根本不存在（压根没下限），比如货币汇兑里的无风险套利循环。代价也很明显：每轮全扫所有边，总复杂度是 O(V·E)，比带堆的 Dijkstra 慢上一大截。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 24 Bellman-Ford 算法
    claim: Bellman-Ford 对全部边松弛 V−1 轮求单源最短路并能检测负权环，复杂度 O(VE)
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
