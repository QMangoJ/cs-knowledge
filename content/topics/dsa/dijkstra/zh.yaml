  points:
  - BFS 只数“走几步”，但道路有长有短，步数少不等于路程短。
- id: greedy
  title: 核心想法：先确定最近的点
  tldr: "上一歩定下了要维护每个点的最短距离估计。这一步看算法的核心动作：每轮从还没确定的点里挑估计最小的那个当场定案。先把定案的理由说清，再把已定集合和估计的含义立成一条不变式，留给下一歩证明。"
  body: >-
    先把记号交代清：dist[x] 表示目前已知的、从起点到 x 的最短距离估计，它会被[[松弛]]不断改小，直到 x 被定案才固定下来；S 是已经定案的点的集合。后面的每一轮，都按这两个记号走。

    一开始只有 A 的距离是 0，其他都是未知（无穷大）。挑出最近的点后，它的距离不可能再变短，因为任何别的路线都要先经过更远的点，再加上非负的路程。这个论证依赖边不为负，这也是 [[Dijkstra]] 的前提。


    为什么成立，一句话骨架是：设 u 是未定点里 dist 最小的那个，任何通向 u 的其他路都要先经过某个未定点 x，而 x 的 dist 不小于 u 的 dist，后面再接非负边权，总长不可能更小（下一节给出完整证明）。已定集合也叫
    S，算法维护的不变量是：S 内每个点的 dist 都等于真实最短距离，S 外每个点的 dist 等于只经过 S 内点作中间站时的最优值，每轮把一个点搬进 S 并恢复不变量，直到 S 装下全部点。


    非负是唯一被用到的边权性质：一旦有负边，绕行那段可能把总长拉低，推理链就断了，后面的 [[Bellman-Ford]] 一节会给出翻车数字。
