- id: relax
  title: 松弛：用新确定的点更新邻居
  tldr: 看看经过这个点去它的邻居，会不会比已知的路线更短。
  body: 'A 到 B 是 3，比无穷大短，就把 B 的距离更新成 3；A 到 C 是 10，先记下 10。接着确定 B，发现经 B 到 C 只要 3 加 3 等于 6，比 10 短，于是把 C 更新成 6。这一步叫松弛，就是不断用更好的路线替换旧的。

    把剩下的轮次补完。此时未定点是 C 等于 6、E 等于 8、D 还是无穷。取最小的 C 定版，松弛 C 的出边，C 到 D 权 2，于是 D 更新为 6 加 2 等于 8。再看未定点，E 等于 8 与 D 等于 8 并列，先取谁都可以，假设先取 E，松弛 E 到 D 权 7，得到 8 加 7 等于 15，不小于已有的 8，不更新。最后取 D 定版，全图结束，最终距离是 A 为 0、B 为 3、C 为 6、E 为 8、D 为 8。

    这张表还藏着一个观察，dist 值被写小的次数多于定版次数，C 先被写成 10 再改成 6，估计值单调递减而定版只发生一次。分清写入与定版，是读懂后面懒删除的关键。再注意松弛的判断只看严格小于，相等时不更新，前驱也就保持先到先得的那条，等长路径的取舍规则在路径一节还会回来。'
  derivation: original
