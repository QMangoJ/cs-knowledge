  code:
    lang: typescript
    code: |-
      // Dijkstra 骨架：优先队列取当前最近点，松弛它的所有出边
      function dijkstra(graph: Map<string, [string, number][]>, src: string) {
        const dist = new Map<string, number>([[src, 0]]);
        const pq: [number, string][] = [[0, src]]; // 实际工程用二叉堆，这里示意排序取最小
        while (pq.length) { pq.sort((a, b) => a[0] - b[0]); const [d, u] = pq.shift()!;
          if (d !== dist.get(u)) continue;
          for (const [v, w] of graph.get(u) ?? []) { const nd = d + w;
            if (nd < (dist.get(v) ?? Infinity)) { dist.set(v, nd); pq.push([nd, v]); } } }
        return dist;
      }
    note: TypeScript 实现（堆见二叉堆主题）
- id: heap
  title: "优先队列加[[懒删除|惰性删除]]：把找最近从 O(V²) 压到 O((V + E) log V)"
  tldr: 把未定节点丢进最小堆，能把每次挑最近路口的代价从扫全表的 O(V) 压到 O(log V)；遇到同一路口距离被改小，直接往堆里塞新记录并在取出时扔掉过期旧值（[[懒删除|惰性删除]]），比原地修改堆更简单。
  body: |-
    如果地图扩大到 10 万个路口、约 30 万条道路，每轮都要把剩下的几万个路口扫一遍挑最小的，总共要扫 O(V²) ≈ 100 亿次，导航软件根本转不动。把候选点按当前距离丢进上一课学的最小堆（优先队列），每次取堆顶和塞进新候选都只要 O(log V)；全图每个点定案一次、每条边松弛一次，总账降到 O((V + E) log V)——在 10 万路口上变成几百万次操作，快出几个数量级。

    不过用最小堆马上会撞上一个实操卡点：刚才 C 的距离从 10 被改小成 6，可 [10, C] 这条旧记录已经躺在堆里面了，普通二叉堆既不支持按名字 C 瞬间定位它在数组第几位，更不方便原地把它的键值改小（[[decrease-key]]）。于是工程代码几乎一边倒采用[[懒删除|惰性删除]]：不去动旧记录，直接把新记录 [6, C] 再塞一份进堆。

    等一下，堆里同时躺着 [6, C] 和 [10, C]，后面取出 [10, C] 岂不是会把 C 错算成 10？不会，解法只需上方代码里的一行校验：因为 [6, C] 更小，一定比 [10, C] 先弹出堆顶并把 C 定案成 6；等后面轮到 [10, C] 终于冒出堆顶时，对照一眼全局表 dist[C] = 6，立刻发现 10 ≠ 6，当场认出它是张作废的过期旧票，直接跳过扔掉完事。多花一点点堆空间（最多存 E 条记录），省掉复杂的堆内索引维护，划算极了。
  derivation: original
