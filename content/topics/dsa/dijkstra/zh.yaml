- id: limits
  title: 工程里怎么落地：从导航到 [[OSPF]]，再到带方向的 [[A*]]
  tldr: 工程里的无负权最短路主要沿着两条路用：网络路由 [[OSPF]] 用来算全网最低延迟转发树，地图和游戏寻路则升级成带方向感的 [[A*]]；但启发估计绝不能高估真实剩余路程，否则会丢掉最优保证。
  body: |-
    把视野放回真实系统：[[Dijkstra]] 不是只写在教材里的玩具。互联网内部路由器跑的 [[OSPF]] 协议，就是让每台路由器收集全网链路的延时权重，各自跑一遍 Dijkstra 算出到达每个网段的最低代价转发路径；在路程与耗时都非负的地图导航引擎里，也是同款最短路骨架在打底。

    不过现实路网动辄上千万个路口，只问「从东三环去机场」，纯正的 Dijkstra 会像水波一样向四面八方（包括完全反方向的西边郊区）均匀铺开，白搜一大圈反方向的路口。于是游戏寻路与地图服务普遍升级成 [[A*]]：放进优先队列排序的值不再只是「已经走了多远 g(u)」，而是改成 g(u) + h(u)，其中 h(u) 是从 u 到终点的保守估计（比如两点间的直线距离）。这么一加，搜索重心立刻被狠狠拽向终点方向，大幅砍掉南辕北辙的无效探索。

    这里最容易踩错一条数学红线：如果为了跑得更快，故意把估计 h(u) 放大（高估了真实剩余距离），会怎么样？比如把直线距离乘以 2，A* 会一头扎进看起来离终点特别近的某条岔路并提前定案终点，可能错过另一条起步略绕但总路程其实更短的正解——一旦 h(u) 允许高估真实距离，最优性保证就丢了，A* 会退化成更快但未必最短的加权启发式搜索。
  derivation: original
  sources:
