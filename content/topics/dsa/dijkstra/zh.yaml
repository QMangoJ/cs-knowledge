- id: playground
  title: 动手实验与带走清单：换源点跑完，记住三问选型
  tldr: 在 6 路口实验地图上分别从 A 和 F 出发跑一遍，亲眼看同一个点的距离被多次改写后才轮到它定案，最后带走全课的最短路选型三问。
  body: |-
    实验画布给了 6 个点 A–F 的无向带权小图。先选 A 当起点跑一遍：起步松弛出 B=4、C=2；下一轮挑最小的 C=2 定案，立刻顺着 C–B(1) 把 B 从 4 改写成 3！紧接着 B=3 定案，E 先被写成 10，等 D=7 定案后又把 E 从 10 改写成 9。接着切到 F 当起点重跑：这回先定案的是 E=1、D=3，刚才从 A 出发排老二的 C 这回靠后到第 5 个才定案（距离 8）——定案顺序和中间改写全跟着起点走，没有固定不变的排名。

    试着先在脑子里预测一下「以 B 为起点时谁第一个定案、D 的距离会被改写几次」，再点运行核对自己的判断。盯紧每一次「旧数被新数顶掉」的瞬间，你就真正把松弛、懒删除和最终定案三件事串成了一条线。

    最后带走最短路选型三问：一问边有没有不同权重？全等用 [[BFS]]（O(V+E)），只有 0 和 1 上[[0-1 BFS]]；二问边权里有没有负数？全非负放心用最小堆加[[懒删除|惰性删除]]的 [[Dijkstra]]（O((V+E) log V)），一旦出现哪怕一条负权边立刻换 [[Bellman-Ford]] 并多跑第 V 轮查[[负环]]；三问是不是只找单一终点且有方向感？加一个不高估剩余距离的启发函数上 [[A*]]，把水波搜索拽成直奔目标的聚光灯。
