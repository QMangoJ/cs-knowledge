level: 进阶
minutes: 30
prereq:
- dsa/bfs-dfs
- dsa/binary-heap
objectives:
- 复述松弛操作与贪心的正确性直觉
- 解释为什么负边会让 Dijkstra 失效
- 用堆把复杂度降到 O((V+E) log V)
aiLink: 最短路径思想在 AI 系统里变形出现：路由与 CDN 调度找最低延迟节点、束搜索保留最优候选、多跳检索的代价估计。理解贪心 + 松弛 + 优先队列这组组合拳，就掌握了一类优化问题的通用骨架。
design:
- mechanism: 贪心为什么成立，未定节点中 dist 最小者不可能被其他未定路径反超，因为边权非负，任何绕行都要先经过 dist 不小于它的节点再加上非负边长，总长只会更大不会更小
  problem: 算法每轮都要把一个估计值宣布为最终答案，若宣布得太早，后来发现更短的路就得推翻重算，整个逐个定版的框架便失去意义，所以必须先保证宣布定版的时机在数学上是对的
  choice: 每轮只定版未定集合里 dist 最小的那个点，并用不变式维持已定点的距离永不回改，其余点的估计只通过松弛单调变小，直到轮到它成为最小者时才被定版，顺序不容打乱
  tradeoff: 换来的是一遍扫描就定版全部点的效率，代价是算法对边权非负有硬性依赖，且定版顺序被距离完全锁死，无法像 Bellman-Ford 那样容忍负边把信息慢慢传播开来
  root: 根本原因是非负边权让距离具有单调性，离开已定集合后的任何路都只会更长，这个单调性是贪心敢于提前下结论的数学地基，把它抽掉，不变式归纳在关键一步立刻断裂
- mechanism: 松弛是全算法唯一的更新动作，候选距离等于出发点的距离加边权，只有严格更小时才改写估计与前驱，所有最短路算法之间的区别，本质上只在以什么顺序执行松弛
  problem: 估计值是逐步逼近真值的，先发现的路常常不是最短的，若更新机制不允许改写，或者改写之后优先队列里的旧记录继续生效，算法就会拿着过期数字做后续决策并把错误传播下去
  choice: 估计变小时不去修改优先队列里的旧条目，而是把新条目直接入堆，取出时比较条目距离与当前估计，不一致就跳过，这就是懒删除，用少量冗余条目换实现的简单与可靠
  tradeoff: 懒删除让堆里最多堆积与边数同量级的条目，空间略增且要多跳过一些过期项，换来的是不必实现带索引的 decrease-key，代码更短，边界情况更少，出错面随之缩小
  root: 根本原因是二叉堆擅长插入与取最小，却不擅长按身份定位并改键，懒删除顺着堆的长处设计流程，把改键需求转化成它最擅长的插入操作，是顺势而为而不是与工具硬扛
- mechanism: 最短路算法按边权条件分工，非负用带堆的 Dijkstra，含负边用 Bellman-Ford，只有 0 与 1 两种权重时还能用双端队列把 log 因子也去掉，每种加速都对应一份前提
  problem: 若用最通用的 Bellman-Ford 处理一切图，非负图也要付出 V 乘 E 的代价，在十万级节点的路网上比堆优化慢几个数量级，通用性换来的账单大到生产系统无法接受
  choice: 先看边权结构再选算法，非负就启用贪心定版加优先队列，步长只有 0 与 1 就启用双端队列，有负边才退回全边多轮松弛并顺带检测负环，前提核对写在选型动作之前
  tradeoff: 专用化让每一类图都跑在接近其下限的复杂度上，代价是实现者必须先验证前提，边权里混入一条负边而误用 Dijkstra，结果会静默算错而不是报错，风险要靠流程挡住
  root: 根本原因是每种加速都建立在一份额外假设之上，贪心靠非负、双端队列靠增量被夹在相邻整数之间，假设越强速度越快，算法选型的本质就是拿问题的真实约束去换性能
quiz:
- q: 松弛（relax）操作做的是什么？
  options:
  - 删边
  - 若经 u 到 v 更短，就更新 v 的距离与前驱
  - 把边权改小
  - 访问标记
  answer: 1
  explain: 全部算法就是反复松弛；区别只在以什么顺序挑边。
- q: Dijkstra 为什么不允许负边？
  options:
  - 代码写不了
  - 贪心假设已确定的最短距离不会被后来更短的路推翻，负边会打破它
  - 负边不存在于现实
  - 堆不支持负数
  answer: 1
  explain: 负边可能让已结算节点出现更短路径，贪心前提崩塌，需改用 Bellman-Ford。
- q: 用二叉堆优化后，每次取最近未定节点与更新邻居的代价是？
  options:
  - O(1)
  - O(log V)
  - O(V)
  - O(E)
  answer: 1
  explain: 堆的取顶与更新都是 O(log V)，总复杂度 O((V+E) log V)。
