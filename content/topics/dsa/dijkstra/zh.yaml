- id: path
  title: 还原路线：记下「从哪来」，顺藤摸瓜回到起点
  tldr: 每次[[松弛]]成功顺手记下「我是从谁过来的」，算完所有前驱边自然长成一棵[[最短路径树]]；从终点沿前驱倒着追回起点，就还原出完整导航路线。
  body: |-
    导航软件不能只跟你说「去 D 路口一共 8 公里」，它还得告诉你每个路口往哪拐。做法一点不额外花时间：每当某条边 u → v 把 dist[v] 改小成功，就在一张前驱表里顺手记下一句「v 是从 u 过来的」。另外，如果你本来就只关心 A 到 D 这一个目的地，那一旦 D 从最小堆里弹出定案，它的答案就已经锁死，可以直接提前结束，不用再算后面更远的点。

    用画布上的结果从终点 D 倒着查一遍账：D 的前驱记着 C，C 的前驱记着 B（最初是 A，被 3 + 3 = 6 那次松弛改成了 B），B 的前驱记着 A。连起来得到逆序链 D ← C ← B ← A，翻个面就是真实导航路线 A → B → C → D，总长 3 + 3 + 2 = 8 公里，分毫不差。把全图每个点的前驱边画出来，合在一起恰好是一棵以 A 为根、绝无环路的[[最短路径树]]。

    要注意如果地图上有两条路并列一样短（比如另一条路走到 D 也是 8），先被处理到的那条会占住前驱位置，后来的相等距离不会覆盖它——返回的只是其中一条最短路。若业务上希望距离相同时优先选转弯更少或经过路口更少的那条，只需把这套次级规则写进松弛的比较条件里。
