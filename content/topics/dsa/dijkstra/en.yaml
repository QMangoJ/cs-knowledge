- id: playground
  title: "Hands-on: switch the source and run it again"
  tldr: "The rules are covered — now switch the source and rerun it yourself: pick different points as the start in turn, and watch the settling order and the distance table change completely. Keep your eyes on the moments when [[relaxation|松弛]] fires, and match each point's rewrite count to the edge that triggered it."
  body: >-
    In the lab, pick A and then F as the source: starting from A, C is settled first (distance 2); starting from F, E is settled first (distance 1). Every greedy step looks only at the current dist
    table — there is no global view. When a relaxation update happens, watch that row: a shorter new distance is always written into the table first, and it is settled only when it becomes the smallest unsettled value.


    Compare the two runs on three things. First, the settling order is entirely decided by the source: the same D sits near the back when starting from A, but very near the front when starting from F, because distances are defined relative to the source. Second, the moments of relaxation: a point's dist
    may be rewritten several times before it is settled — match each rewrite to the edge that triggered it, and relaxation turns from a formula into a ledger. Third, tied distances: when two points have equal dist, settling either one first does not affect the final distances, but it does affect the predecessors and what the path looks like.


    When you are done, try predicting: starting from B, who gets settled first, and who will D's predecessor be? Then run it once and check.
