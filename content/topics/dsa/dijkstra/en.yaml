- id: second-shortest
  title: "The boundary of second-shortest paths: why second place is hard to find"
  tldr: "The shortest route is in hand, but engineering often wants a backup as well. This step first gets the definition of second-shortest straight — may edges be reused, must it be strictly longer than the shortest — then looks at why the original state leaves no room for second place at all, and what extra bookkeeping computing it takes."
  body: |-
    Finding the shortest takes one route, but engineering often asks for the strictly second-shortest: a backup route longer than the shortest that, by convention, does not reuse edges — the second option a navigation app offers is exactly that. The difficulty is that greedy settling keeps only each point's champion; runner-up information is thrown away during [[relaxation|松弛]], and by the time the champion route turns out to be unusable, there is nothing left to recover from — the original algorithm's state simply has no slot for second place.

    The common approach is to maintain two distances for each point, the shortest and the second-shortest. During relaxation, candidates are slotted into the two positions by size; a candidate equal to the shortest is skipped, and the search continues for a strictly larger one. The priority queue therefore holds two kinds of state for the same node, and the moment a second-shortest state is popped is its settling moment. The overall framework is still [[Dijkstra]] — only each point's state has grown from one number into a pair of numbers.

    The boundary: if revisiting points and edges is allowed, a second-shortest route might just loop around a small cycle once more — mathematically valid but practically worthless — so problems usually specify a simple path, or no repeated edges. K shortest paths generalize this, and the cost grows fast with K; production systems generally compute only the first two or three and stop.
  derivation: original
  sources:
