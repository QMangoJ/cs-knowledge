- id: greedy
  title: "The core idea: settle the nearest point first"
  tldr: "The last step set up the job of maintaining each point's shortest-distance estimate. This step looks at the algorithm's core move: each round, pick the unsettled point with the smallest estimate and settle it on the spot. First the reason settling is safe is stated clearly, then the settled set and the meaning of the estimates are pinned down as an invariant, ready for the next step's proof."
  body: >-
    Notation first: dist[x] is the currently known best estimate of the shortest distance from the start to x; it keeps being shrunk by [[relaxation|松弛]] until x is settled, when it becomes fixed. S is the set of points already settled. Every round from here on is described in these two terms.

    At the start, only A's distance is 0; everything else is unknown (infinity). Once the nearest point is picked out, its distance cannot become any shorter, because any other route must first pass through a farther point and then add a non-negative stretch of road. This argument depends on edges not being negative — which is also [[Dijkstra]]'s premise.


    Why it holds, in one skeletal sentence: let u be the unsettled point with the smallest dist. Any other route to u must first pass through some unsettled point x, and x's dist is no smaller than u's dist; add the non-negative edge weights after that, and the total cannot be smaller (the next section gives the full proof). The settled set is also called
    S, and the invariant the algorithm maintains is: for every point inside S, dist equals the true shortest distance; for every point outside S, dist equals the best value over paths whose intermediate points all lie inside S. Each round moves one point into S and restores the invariant, until S holds all the points.


    Non-negativity is the only property of edge weights that gets used: once a negative edge exists, the detour segment might pull the total length down, the chain of reasoning breaks, and the [[Bellman-Ford]] section further on shows the numbers of that crash.
