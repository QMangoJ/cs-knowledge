- id: proof
  title: "The correctness proof, in skeleton: invariant plus induction"
  tldr: "The last step's reason for settling was still intuition; this step tightens it into a checkable proof — state an invariant, verify it holds initially, then prove it still holds after each round moves the smallest point into the settled set. The proof uses non-negative edge weights in exactly one place, and that place is exactly where a negative edge causes the crash."
  body: >-
    Tightening the greedy intuition into a checkable proof takes just three steps. First, state the invariant: at the start of each round, every point in the settled set S has dist equal to its true shortest distance from the start, and every point outside S has dist equal to the best value among paths whose intermediate points all lie inside S. The induction base — S
    containing only the start — obviously holds; a distance of 0 is beyond dispute.


    For the induction step, look at this round's pick, u, the point outside S with the smallest dist. Suppose it had a shorter route. Where that route first leaves S, it must pass through some point x outside S, and the part of the route before x yields one candidate for x's dist — so the route's total length is no less than x's
    dist, and x's dist is no less than u's dist; add the non-negative edges after that, and the total is no less than u's dist, contradicting "shorter". So u's dist is the true value, and u joins S. After [[relaxation|松弛]] through u, the dist of the remaining points outside S
    is restored to exactly the best value under the new set, and the invariant holds again for the next round. The whole proof uses non-negativity in exactly one place — the segment after leaving S must not be able to pull the total length down — and that pinpoints exactly where a negative edge breaks the settling.
