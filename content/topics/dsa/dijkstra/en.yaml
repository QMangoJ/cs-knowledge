subject: dsa
slug: dijkstra
order: 6
status: published
license: CC-BY-4.0
title: "Dijkstra: Shortest Paths"
summary: When edges have different lengths, how do you find the shortest route from the starting point to every other place?
premise: On a map, going from one place to all the others, the roads come in different lengths — the route with the fewest steps is not necessarily the shortest in total distance, so how do you compute the true shortest routes? This lesson walks through the algorithm on a small map with 5 places and roads of different lengths, starting from A and settling, one by one, each place's shortest distance from A.
position: This lesson stays inside the "Walking on Graphs" section, right after BFS advancing layer by layer with a queue, and swaps the layering criterion from edge count to accumulated edge weight. After it, you will be able to carry out [[relaxation|松弛]] — the single update action — by hand, and use the non-negative edge weight premise to explain why, once the unsettled point with the smallest dist is selected, no detour can ever overtake it.
bridge:
  prev: The previous lesson's BFS relied on first-in-first-out to guarantee that whoever arrives first used the fewest edges. This lesson keeps the skeleton of processing the nearest first, but the plain queue must be replaced by a priority queue that takes the minimum by dist before it can cope with weighted edges.
  next: Every round of Dijkstra has to pull the point with the smallest dist out of the unsettled set quickly. The next lesson, binary search trees, answers a related question — besides a heap, how can an ordered tree support a dynamic set's minimum and range queries just as well?
overview:
- key: In one sentence
  value: Each time, settle the point that is currently nearest to the start and not yet settled, then use it to update its neighbors. That point can be settled on the spot because every other unsettled point is farther from the start — detouring through them and coming back would only be longer, so it can never be improved.
- key: The premise
  value: Edge weights cannot be negative. Once a negative-weight edge exists, a distance already settled might be pulled shorter by a negative edge that appears later, and the settling argument above no longer holds — that is when you switch to an algorithm such as [[Bellman-Ford]].
- key: Complexity
  value: With a binary heap, about O((V + E) log V). Each point in the graph is extracted and settled at most once, and each edge is used for an update at most once; the heap keeps the cost of each pick of the nearest point at logarithmic level.
- key: What it leans on
  value: It leans on a priority queue — a heap — to find the nearest point fast. Every round must pick the smallest-distance point among those not yet settled; scanning linearly every time would make the whole thing slower by an order of magnitude.
- key: In practice
  value: Map navigation, network routing (such as [[OSPF]]), and game pathfinding all use it, and [[A*]] is its accelerated version. A* adds an estimate toward the target direction on top of [[Dijkstra]], so the search wastes less effort on detours, but the skeleton is the same.
- key: The path itself
  value: Record predecessors, and a final backtrack yields the complete route. Whenever going through some point to a neighbor turns out to be shorter, note down which point that neighbor was reached from; once everything is computed, walk backward from the destination along the records to the start, and that is the shortest route itself.
- key: Early exit
  value: With only one destination, you can stop the moment the destination is settled. Because settling proceeds in order of distance, from near to far, once the destination is settled its distance is already the final answer, and the farther points after it never need computing.
- key: Negative edges
  value: With negative-weight edges, use Bellman-Ford, whose complexity is O(V·E) and which can also detect a [[negative cycle|负环]]. Instead of settling in one pass, it [[relaxes|松弛]] all the edges over and over for many rounds, letting the influence of negative edges spread slowly — slower, but with a wider range of application.
- key: Implementation detail
  value: The common approach is lazy deletion — the same point may be pushed into the heap several times, and stale records are skipped when extracted. When a shorter route to a point is found, instead of hunting down and editing the old record inside the heap, you simply push a fresh copy in; when a record is extracted and turns out to be larger than the currently known distance, you throw it away. Much simpler to implement.
