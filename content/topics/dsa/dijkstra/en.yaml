- id: path
  title: Recording the path, not just the distance
  tldr: "A finished distance table answers only how far; navigation also needs to answer how to get there. This step records the predecessor whenever a [[relaxation|松弛]] succeeds, then walks backward from the destination to the start to assemble the complete route — and glances at the [[shortest-path tree|最短路径树]] that all the predecessor edges form together."
  body: >-
    Navigation needs more than how far — it needs how to get there. When C's distance is updated, also record that C's predecessor is B; at the end, backtrack from the destination along the predecessors all the way to the start, and reversed, that is the shortest path. If you only care about the distance to one particular destination, you can stop early the moment that destination is settled, without computing every point.


    Assemble the route from A to D out of the predecessor table: from D, its predecessor is C; C's predecessor is B; B's predecessor is A — giving the reversed chain D, C, B, A, which reversed is A, B, C, D, with total length 3 plus 3 plus 2 equal to
    8, matching the distance table. All the predecessor edges together form a tree rooted at the start, called a shortest-path tree; on it, the path from any point to the root is one of its shortest routes.


    If two routes are equally long, the one whose relaxation succeeded first keeps the predecessor slot; a later, equal candidate does not replace it. So which route gets returned depends on the relaxation order — not an error, just an arbitrary choice among ties. If the business requires a secondary criterion to break ties among equal lengths, that criterion has to be written into the relaxation comparison as well.
  derivation: original
  sources:
