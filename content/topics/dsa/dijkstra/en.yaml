    locator: Shortest-path lectures
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: Whenever a relaxation succeeds, record "which point I came from", and walking backward at the end gives the complete route
    status: verified
