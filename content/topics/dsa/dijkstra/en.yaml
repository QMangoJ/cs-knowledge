- id: limits
  title: Negative edges and engineering applications
  tldr: "The handling of negative edges is in place; this step wraps up with engineering applications — which algorithm map navigation, network routing, and game pathfinding each stand on. The focus is [[A*]]: how it adds a target-directed estimate onto [[Dijkstra]]'s skeleton, and what guarantee is lost once that estimate overestimates the true distance."
  body: >-
    If some road is negative (say, traveling it somehow earns distance back), a point already settled might still have a shorter route, Dijkstra goes wrong, and that is when you use [[Bellman-Ford]]. Map navigation and the network routing protocol [[OSPF]] both build on Dijkstra's idea. Game pathfinding commonly uses A*, which adds to
    Dijkstra an estimate of roughly how far the destination still is, and searches preferentially toward the target; as long as the estimate never overestimates the true distance (admissible), A* still guarantees a shortest path.


    A* is a direct generalization of the Dijkstra skeleton: put the cost already paid plus the heuristic estimate into the priority queue, and always take the candidate with the smallest estimated total cost. If its heuristic value overestimates the true remaining distance — say, multiplying the straight-line distance by a coefficient greater than 1
    to buy speed — it may miss the optimal route and degenerate into a kind of weighted greedy. Engineering often makes exactly this trade of optimality for speed, but you must know clearly that you have given the guarantee up — you cannot overestimate and still claim shortest.
  derivation: original
