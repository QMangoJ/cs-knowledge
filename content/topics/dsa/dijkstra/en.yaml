  code:
    lang: typescript
    code: |-
      // Dijkstra skeleton: the priority queue takes the currently nearest point and relaxes all its outgoing edges
      function dijkstra(graph: Map<string, [string, number][]>, src: string) {
        const dist = new Map<string, number>([[src, 0]]);
        const pq: [number, string][] = [[0, src]]; // in real engineering a binary heap is used; here sorting stands in for taking the minimum
        while (pq.length) { pq.sort((a, b) => a[0] - b[0]); const [d, u] = pq.shift()!;
          if (d !== dist.get(u)) continue;
          for (const [v, w] of graph.get(u) ?? []) { const nd = d + w;
            if (nd < (dist.get(v) ?? Infinity)) { dist.set(v, nd); pq.push([nd, v]); } } }
        return dist;
      }
    note: TypeScript implementation (for the heap, see the binary heap lesson)
- id: heap
  title: Speeding it up with a priority queue
  tldr: "Every round must pick the smallest among the unsettled points, and scanning them all one by one is too slow. This step puts the candidates into a min-heap — first the math on how much the total changes with and without the heap, then an implementation choice: when a distance shrinks, do you edit the old entry inside the heap, or simply push a new one in?"
  body: >-
    If you scan all the points every time to find the nearest, things get slow once there are many points. Put the candidate points into a min-heap, ordered by current distance, and taking the nearest costs only O(log V). This is the typical use of the binary heap from the previous topic, and the total comes to about O((V + E) log V).


    A numeric comparison: for a graph with 100,000 nodes, the naive O(V²) is on the order of ten billion operations; the heap-optimized O((V+E) log V), on a sparse graph (E a constant multiple of V), is on the order of a few million — maps and scheduling systems can only choose the latter. The implementation choice: when dist
    shrinks, do you modify the key of the old entry in the heap ([[decrease-key]], which a binary heap does not natively support locating, so an extra index must be maintained), or push a brand-new entry (lazy deletion — old entries are skipped when extracted, once they are found not to match the current dist)?


    Lazy deletion lets the heap hold at most E records — slightly more space — but the code is simple and the asymptotic complexity is unchanged, so engineering implementations choose it almost unanimously. What the heap compares is dist, not node numbers; when distances tie, taking either one has no effect on correctness, though it does affect what the predecessors look like.
