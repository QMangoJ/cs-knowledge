steps:
- id: why
  title: Why BFS is not enough
  tldr: "Set the scene first: a map with lengths on it. From A to C you can take one long road directly, or detour through B over two short segments. This step first settles why step count and total length are two different accounts, and why the unweighted way of advancing by step count picks the wrong route here."
  body: |-
    From A to C: one direct road of 10 kilometers, or two segments of 3 kilometers each via B. BFS would pick the route that arrives in one step, but it is actually longer. When edges carry weights, you need an algorithm that adds up total length.

    Do the math in detail: the direct edge weighs 10, the two segments via B total 6. BFS chose the route with only 1 edge by edge count, yet lost on total length — proof that edge count and total length are two different measures. As long as the edge weights are not all equal, ordering by edge count has no reason to match ordering by total length, and this single counterexample disposes of the idea of carrying BFS over to weighted graphs unchanged.

    Routes with more edges being shorter are everywhere in real road networks: a ring expressway traveled in three segments is often shorter in total than one small road cutting through the city. So weighted graphs need a new invariant: maintain, for each point, the currently known best estimate of its shortest distance, and turn estimates into conclusions one by one whenever there are solid grounds. That is the starting point of the greedy idea in the next section. The unweighted case is a special case of the weighted one: when every edge weight equals 1, Dijkstra (the shortest-path algorithm named after its proposer, Edsger W. [[Dijkstra]]) degenerates into BFS.
