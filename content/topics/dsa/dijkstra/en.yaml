- id: bellman
  title: "What to do with negative edges: [[Bellman-Ford]]'s blunt method"
  tldr: "Every settling so far rested on non-negative edge weights. This step brings negative edges in — first watch the settling get punctured, then switch to a completely different method: instead of picking the smallest and settling it, [[relax|松弛]] all the edges over and over for many rounds — and at the end it can even tell you whether the graph contains a [[negative cycle|负环]]."
  body: >-
    [[Dijkstra]]'s correctness rests on the smallest unsettled node being unable to shrink any further, and a negative edge breaks exactly that. Bellman-Ford takes another road: run V−1 rounds of relaxation over all the edges. After round k, the distances of all shortest paths using at most k edges are correct; a simple path has at most V−1
    edges, so V−1 rounds suffice. If round V can still relax something, the graph contains a negative-weight cycle (going around it keeps getting shorter, so no shortest path exists).


    A two-round worked example: the graph is A to B with weight 6, B to C with weight −2, A to C with weight 5. Initially only A is 0. In the first round, relax all the edges: A to B writes B as 6, B to C writes C as 4, and A to C's 5
    is no better. The second round scans once more and updates nothing — already converged. Dijkstra, on this graph, would first pick the smaller of B's 6 and C's 5 — C — and settle it at 5 by the direct edge; when B later relaxes out a 4, it can no longer catch up, and the 4 via B is missed. That is exactly the scene of the greedy premise being punctured by a negative edge.


    The price is scanning all the edges every round, for a total complexity of O(V·E). The selection rule of thumb: non-negative weights, use Dijkstra; negative weights but no negative cycle, use Bellman-Ford, which also detects negative cycles as a bonus. Slowness is a price, not an error.
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 24, the Bellman-Ford algorithm
    claim: Bellman-Ford relaxes all edges for V−1 rounds to find single-source shortest paths and can detect negative-weight cycles, with complexity O(VE)
    status: verified
    checkedBy: Checked by Muse
    checkedAt: 2026-11-07
