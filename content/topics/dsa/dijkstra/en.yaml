prereq:
- dsa/bfs-dfs
- dsa/binary-heap
objectives:
- Restate the relaxation operation and the intuition behind the greedy correctness argument
- Explain why negative edges make Dijkstra fail
- Use a heap to bring the complexity down to O((V+E) log V)
aiLink: The shortest-path idea reappears in AI systems in altered forms — routing and CDN scheduling hunting for the lowest-latency node, beam search keeping the best candidates, cost estimates for multi-hop retrieval. Understand the combination of greedy + relaxation + priority queue, and you hold the general skeleton of a whole class of optimization problems.
design:
- mechanism: "Why the greedy works — the unsettled node with the smallest dist cannot be overtaken by any other unsettled path, because edge weights are non-negative: any detour must first pass through a node whose dist is no smaller, then add a non-negative edge length, so the total can only be larger, never smaller"
  problem: Every round, the algorithm must declare one estimate to be the final answer. If it declares too early and a shorter route is discovered later, everything has to be overturned and recomputed, and the whole settle-one-by-one framework loses its meaning — so the timing of each settling declaration must first be guaranteed mathematically right
  choice: Each round settles only the point with the smallest dist in the unsettled set, and an invariant keeps settled points' distances from ever changing back; every other point's estimate only shrinks monotonically through relaxation, until its turn comes to be the smallest and it is settled. The order admits no shuffling
  tradeoff: What this buys is the efficiency of settling all the points in a single pass. The price is a hard dependence on non-negative edge weights, and a settling order completely locked by distance — it cannot, like Bellman-Ford, tolerate negative edges letting information spread slowly
  root: "The root cause is that non-negative edge weights give distances their monotonicity: any route after leaving the settled set only gets longer. That monotonicity is the mathematical foundation the greedy stands on when it dares to conclude early — pull it away, and the invariant induction breaks at the critical step at once"
- mechanism: "Relaxation is the algorithm's only update action: a candidate distance equals the departure point's distance plus the edge weight, and the estimate and predecessor are rewritten only when it is strictly smaller. The differences between all shortest-path algorithms are, in essence, only about the order in which relaxation is executed"
  problem: Estimates approach the true values gradually, and the route discovered first is often not the shortest. If the update mechanism did not allow rewriting, or if stale records in the priority queue kept taking effect after a rewrite, the algorithm would make later decisions with expired numbers and propagate the error onward
  choice: When an estimate shrinks, do not modify the old entry in the priority queue; push the new entry straight in, and when extracting, compare the entry's distance against the current estimate and skip it if they disagree. That is lazy deletion — a few redundant entries buy a simple, reliable implementation
  tradeoff: "Lazy deletion lets the heap accumulate entries on the same order of magnitude as the edge count — slightly more space, and a few more stale entries to skip — in exchange for not having to implement an indexed decrease-key: shorter code, fewer edge cases, and a smaller surface for errors"
  root: The root cause is that a binary heap is good at insertion and at taking the minimum, but bad at locating an entry by identity and changing its key. Lazy deletion designs the flow around the heap's strengths, converting key-change needs into the insertion operation it does best — going with the tool's grain instead of fighting it
- mechanism: "Shortest-path algorithms divide the work by edge-weight conditions: non-negative weights use Dijkstra with a heap, graphs containing negative edges use Bellman-Ford, and when the only weights are 0 and 1 a deque can remove the log factor as well. Every speedup corresponds to one premise"
  problem: If the most general Bellman-Ford handled every graph, non-negative graphs would also pay the price of V times E — on road networks with hundreds of thousands of nodes that is several orders of magnitude slower than the heap-optimized version, a bill too large for production systems to accept in exchange for generality
  choice: "Look at the edge-weight structure first, then choose the algorithm: non-negative, enable greedy settling plus a priority queue; steps of only 0 and 1, enable the deque; negative edges, fall back to full-edge multi-round relaxation and detect negative cycles on the side. The premise check is written before the selection action"
  tradeoff: "Specialization lets each class of graph run near its own complexity floor. The price is that the implementer must verify the premises first: mix a single negative edge into the weights and misuse Dijkstra, and the result is silently wrong rather than an error — the risk has to be blocked by process"
  root: The root cause is that every speedup stands on an extra assumption — the greedy on non-negativity, the deque on increments clamped between adjacent integers. The stronger the assumption, the faster the speed; algorithm selection is, in essence, trading the problem's real constraints for performance
quiz:
- q: What does the relaxation operation do?
  options:
  - Delete an edge
  - If going through u to v is shorter, update v's distance and predecessor
  - Shrink an edge weight
  - A visited marker
  answer: 1
  explain: The whole algorithm is relaxation repeated; the only difference is the order in which edges get picked.
- q: Why does Dijkstra not allow negative edges?
  options:
  - The code cannot be written
  - The greedy assumes a settled shortest distance will never be overturned by a shorter route found later, and a negative edge breaks that
  - Negative edges do not exist in reality
  - Heaps do not support negative numbers
  answer: 1
  explain: A negative edge can give an already-settled node a shorter path; the greedy premise collapses, and Bellman-Ford is needed instead.
- q: With binary-heap optimization, what is the cost of each extraction of the nearest unsettled node and each neighbor update?
  options:
  - O(1)
  - O(log V)
  - O(V)
  - O(E)
  answer: 1
  explain: Both heap extraction and updates are O(log V), for a total complexity of O((V+E) log V).
