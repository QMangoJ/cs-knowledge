- id: relax
  title: "[[Relaxation|松弛]]: updating neighbors with the newly settled point"
  tldr: "Once a point is settled, what pushes things forward? The single update action of this step — relaxation: take the newly settled point, try it against its neighbors, and wherever going through it is shorter, rewrite the neighbor's estimate. This step walks the remaining rounds of the whole graph to the end, and separates two things along the way: an estimate being rewritten, and a point being settled."
  body: >-
    A to B is 3, shorter than infinity, so B's distance is updated to 3; A to C is 10, so record 10 for now. Next settle B, and discover that reaching C via B takes only 3 plus 3, which is 6 — shorter than 10 — so C is updated to
    6. This step is called relaxation: continually replacing old routes with better ones.


    Fill in the remaining rounds. The unsettled points are now C at 6, E at 8, and D still at infinity. Take the smallest, C, and settle it; relax C's outgoing edge — C to D weighs 2 — so D is updated to 6 plus 2, which is 8. Look at the unsettled points again: E at 8 and D at 8
    are tied, and either may be taken first; suppose E goes first. Relaxing E to D, weight 7, gives 8 plus 7, which is 15 — not smaller than the existing 8, so no update. Finally take D and settle it; the whole graph is done. The final distances are A at 0, B at 3, C at 6, E at 8, D at 8.


    Observe: dist is written smaller more times than points get settled — C was first written as 10 and then changed to 6. Estimates decrease monotonically, while settling happens exactly once. Keeping "written" and "settled" apart is the key to understanding lazy deletion later. Relaxation only fires on strictly smaller; on a tie there is no update, and the predecessor stays with the route that arrived first.
