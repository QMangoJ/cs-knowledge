- id: zero-one-bfs
  title: "A peek at [[0-1 BFS]]: when edge weights are only 0 and 1, no heap is needed"
  tldr: "The heap is fast enough — but when edge weights are only 0 and 1, one more layer can be saved. This step swaps the priority queue for a deque: traverse a 0-weight edge and enter at the front; traverse a 1-weight edge and enter at the back. First a small worked example, then why this monotonicity comes for free, and why it fails at once the moment the weights change shape."
  body: >-
    If every edge weight is only 0 or 1, the priority queue can be replaced by a [[deque|双端队列]], giving linear O(V + E). During [[relaxation|松弛]], if the edge traversed weighs 0, the new distance equals the current point's, so the target goes in at the front of the deque; if the edge weighs 1, the new distance is 1 larger, so it goes in at the back. That way the distances inside the deque are always non-decreasing and differ by at most
    1, and the extraction order is naturally the increasing order [[Dijkstra]] needs — no log factor to pay.


    A small worked example: A to B weighs 0, A to C weighs 1, B to C weighs 0. After processing A, B enters at the front and C at the back. Take B first, and use the 0-weight edge to rewrite C to 0 and move it to the front; C's final shortest distance is 0, matching Dijkstra's result. The root of why this works is that distance increments come in only two kinds, differing by 1: the distances of the elements in the deque are clamped between two adjacent integers, so monotonicity comes for free.


    The moment a weight of 2 or 0.5 appears, this clamp fails and you must honestly go back to the heap — forcing a mismatched structure onto a problem only produces silently wrong answers. Problems like the cost of passing through walls in a grid, or toggling a switch's state, are often exactly 0 and 1; recognize that structure and you can cut the log factor away.
  derivation: original
  sources:
