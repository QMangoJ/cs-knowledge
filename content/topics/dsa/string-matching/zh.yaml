- id: lps-table
  title: 动手算 π：模式 ABABCABAB 的前缀函数
  tldr: 逐字延长前缀，能接上就加一、接不上就沿着已算出的 π 回退再试——算 π 本身就是一次拿模式比模式的 KMP。
  body: '前缀函数 π 的下标从 1 开始：π[q] 是模式前 q 个字符里，最长的「真前缀等于真后缀」的长度。单字符没有任何真前缀，π[1] 恒为 0。下面对模式 ABABCABAB（下标 0 到 8）逐个算，写 π 值时按下标记在对应字符下方。

    前四个字符 ABAB：A 是 0；AB 无重合是 0；ABA 的首尾都是 A，得 1；ABAB 的首尾都是 AB，得 2。第五个字符 C 到来，前缀变成 ABABC：尝试在 ABAB 的重合 2 后面接 C，前缀第三个字符是 A 而非 C，接不上；沿 π 回退，重合长度依次试 0，在空重合后接 C 仍不是前缀首字符 A，最终 π 归 0。这个 0 很关键，它宣告 C 把此前的全部重合清零——C 在模式里是个「断点」。

    后半段 ABAB 再次成形：ABABCA 的首尾都是 A，得 1；ABABCAB 的首尾都是 AB，得 2；八个字符时首尾 ABA，得 3；九个字符时首尾 ABAB，得 4。最终 π 依次是 0、0、1、2、0、1、2、3、4。

    计算过程藏着两个要点。第一，算 π[q] 时永远先尝试延长 π[q−1]，延长失败就按 π 链回退着试更短的重合，直到接上或归零——这与扫描时的失配跳转是同一套动作，所以说算 π 就是拿模式和它自己跑一遍 KMP。第二，π 的每个值都不超过前一个值加一：延长一次最多多对齐一个字符。这个增幅上限会出现在下一课的复杂度证明里。'
