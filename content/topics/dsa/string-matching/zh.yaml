- id: kmp-complexity
  title: 为什么稳稳是线性时间：模式指针的回退总额，永远超不过前进总额
  tldr: 虽然单次失配可能让模式指针连跳好几下，但每次回退都在花之前对齐攒下的「存款」——总回退次数永远超不过总上涨次数 n，整趟扫描加建表稳稳停在 Θ(n+m)。
  body: |-
    刚看完扫描过程的人常会卡在一个疑问上：在文本下标 4 和 8 那里，文本指针没动，模式指针 j 却一连往下跳了好几次；如果模式很长，难道不会在某个文本位置上狂退几百次、把时间拖回平方级吗？不会。账本秘密全在 j 的一涨一跌之间：j 只在字符比对成功时加 1，而每次比对成功，文本指针 i 必定同步前进一格。整趟扫描文本指针 i 从头到尾只走 n 步，这意味着 j 一辈子加起来的「总上涨量」最多只有 n。

    现在看另一侧：j 每次失配跳转至少往下跌 1，但 j 从 0 出发且永远不能变成负数。就像钱包里没办透支卡，你一共往里存过最多 n 块钱，一辈子取出来的总额绝不可能超过 n 块！因此 j 在所有失配位置加起来的「总回退量」同样被 n 封死。无论是匹配成功的比较、还是失配跳转前的比较，两笔账合起来都不超过 2n 次，扫描总时间稳稳是 Θ(n)。用同一套存款封顶逻辑算预处理：建 π 表时那位向后走的指针也是最多涨 m 次，所以建表时间是 Θ(m)，额外只占一张长 m 的 π 表空间，两笔账相加就是 Θ(n+m)。

    这种把「当下攒下的势能，拿来垫付未来集中爆发的高昂操作」的记账法，叫[[摊还分析]]（这里的模式长度 j 就是整个算法的[[势能]]）。反观朴素法为什么摊不出线性？因为它每次失配就把 j 攒的进度直接清零、连文本指针都往回退，存款白白蒸发还要倒贴路费，当然算不出总上限。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 32.4（KMP 的摊还分析）
    claim: KMP 扫描的总运行时间为 Θ(n)，依据是模式索引的下降总量被其上升总量封顶的摊还论证
    status: verified
