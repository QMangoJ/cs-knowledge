    event: 选型账算清了：死磕最坏保证用 KMP，大字符集提速用 BM，万词同查上 AC 自动机，流式输入必须文本不回头。
  points:
  - 选型的第一性原理：总账等于预处理加扫描乘以次数
  - AC 自动机是 π 思想的多模式推广
- id: practice
  title: 工程现实：标准库里跑的都是些什么
  tldr: 工业标准库几乎不用纯粹的教科书四强：C 标准库用只占 O(1) 空间的 Two-Way 算法保底，短模式上硬件向量化的朴素暴力法靠常数反杀，因为复杂度只筛掉数量级错误，同数量级里决定胜负的是缓存与指令宽度。
  body: |-
    打开常见语言的标准库源码一看，教科书四强居然很少独挑大梁。比如 Linux 常用的 [[glibc]] 里，[[strstr]] 和 [[memmem]] 用的叫 [[Two-Way|Two-Way 算法]]：它用[[临界分解]]把模式切成左右两段、先右后左比对，既死守住最坏 Θ(n+m) 的线性下限，又神奇地连 π 表那份 Θ(m) 内存都省了，只用 O(1) 额外空间。而 Go、Rust 等语言的标准库更是看菜下碟，在代码里把几种算法拼在一起，根据模式长短、字符分布动态切换路线。

    更反直觉的是短模式下的朴素法复仇。现代 CPU 一条 [[SIMD]] 向量指令就能一口气同时比对 16 到 32 个字节。先用硬件指令极速扫出首字符出现的位置（像 [[memchr]] 那样），再对少数候选位置逐字核对，全程没有乱跳的分支预测失败，实测跑得常常比到处查 π 表跳转的 [[KMP]] 还要快。渐进复杂度只管数量级对不对，不管每一步吃几个 CPU 周期、缓存命不命中；模式短且只有几十字时，硬件宽度和内存局部性才是老大哥。

    整课带走三问自检清单，以后写字符串搜索或处理任何重复计算都不再抓瞎：①「这份工作里，我有没有刚刚比对过、转手又扔掉的现成信息？」（KMP 用 π 表留住已对上的前缀）；②「失配露出来的字符，能不能直接排除一大片起点？」（BM 靠右起比对跳过未看字符）；③「手里是一次性短查询、怕爆尾延迟的单模式，还是成千上万个词一起查？」——短查用标准库自带，单模式防抖用 KMP/Two-Way，多模式一网打尽用 AC 自动机。
