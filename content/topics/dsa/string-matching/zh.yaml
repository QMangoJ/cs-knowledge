  - 朴素法摊不平，因为它的进度失配即清零
- id: bm-idea
  title: Boyer-Moore：从右往左比，让一次失配换来一大步
  tldr: 对齐后从模式末尾往前比，失配处看到的文本字符决定跳多远；最好情况下大量文本字符根本不必看。
  body: 'Boyer 与 Moore 在 1977 年给出了一个思路完全不同的算法。它把模式贴到文本上对齐后，不从左端、而从模式的末尾开始往前比。理由很实际：若末尾第一个字符就失配，我们一次性知道了文本在该位置的字符是什么，这个字符能告诉我们模式该跳多远。

    跳步由坏字符规则给出：设失配时文本露出的字符是 c。若 c 在模式里压根没出现过，那么任何把模式只挪一两格、还让 c 落在模式覆盖范围内的对齐都不可能命中，模式可以整段跳过 c 所在位置——一次失配最多换来 m 步前进。若 c 在模式里出现过，就把模式右移、让 c 与它在模式中最后一次出现的位置对齐，再接着比。还有一条好后缀规则处理「后缀已对上一截才失配」的情形，取与已对上后缀相容的最大右移；实际实现多取两条规则给出跳步的较大者。

    效果在英文文本这类大字母表上极其夸张：模式越长、字母表越大，失配字符不在模式中的概率越高，跳步越接近整段模式长度，最好情况下字符比较次数只有约 n 除以 m 的量级——也就是说，绝大部分文本字符从头到尾根本没有被看过。这与 KMP 的线性保证形成鲜明对照：KMP 是每个字符至多被常数次比较，BM 是最好情况下大量字符零比较。

    代价也要说清。只用坏字符规则时，构造得当的重复文本能让 BM 退化到 Θ(nm)（比如在全 a 文本里找全 a 模式，每次都比满才挪一格）；补上好后缀规则与 Galil 规则后最坏可回到线性，但实现复杂度显著上升。工程界更常用的 Horspool 简化版只保留坏字符思想（统一按窗口末字符查表跳步），拿最坏保证换实现简单与实测速度，grep 一类工具的经典实现多出于这一系。'
  derivation: original
  sources:
