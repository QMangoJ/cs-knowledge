- id: rk-automaton
  title: 另外两条路：滚动哈希与有限自动机
  tldr: Rabin-Karp 把窗口压成可滑动更新的指纹，多模式与并行占优；有限自动机把每种处境的下一步预先算死，π 其实是它的压缩版。
  body: '第三种编码信息的方式是换比较的粒度。Rabin-Karp 不再逐字比对，而是先把模式算成一个数（指纹），再维护文本每个长度为 m 的窗口的指纹，两个指纹不等，窗口必不可能命中；指纹相等时才逐字验证一次兜底。关键在指纹要能滚动更新：窗口右移一格时，扔掉最高位的旧字符、把其余位左移、添上新字符，用多项式哈希可以在 O(1) 内完成，于是整趟扫描的期望成本是 Θ(n+m)。

    它的账目带着概率：指纹碰撞会带来无谓的逐字验证，哈希取得好时期望极低，但对手可以构造数据让它退化到 Θ(nm)——这与哈希表在哈希洪水攻击下的退化同源。换来的好处是结构性的：多个模式可以同时算指纹并行匹配，指纹还能直接拿去做查重与指纹去重，这套思想在抄袭检测、文件去重与 git 的对象识别里到处都是。

    第四种是理论上最规整的：有限自动机法。预先为模式建一台状态机，状态 q 表示「已对齐模式前 q 个字符」，对每个状态与每个可能输入的字符，预先算好转移。扫描时文本只过一遍、每字符查一次表，稳稳的 Θ(n)；代价是转移表大小为 m 乘字母表大小，预处理又贵又占地方。

    把它与 KMP 并排看会发现一件美事：KMP 的 π 函数，本质上正是这台自动机转移表的压缩编码——π 只存下「失配时回到哪个状态」这一列关键信息，把整张表的空间从 m 乘字母表压到 m。两种算法是同一个思想的两种存储格式：一个把知识摊开存全，一个只存下用得上的那部分。知道知识长什么样之后，存全还是存压缩版，是工程上再熟悉不过的取舍。'
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 32.2 Rabin-Karp 与 32.3 Finite-Automaton Matching
    claim: Rabin-Karp 用可滚动更新的指纹获得期望 Θ(n+m)，有限自动机法以 Θ(m·|Σ|) 的预处理换取 Θ(n) 扫描
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
