    caption: j 的一生：上涨总量不超过 n，下降总量不超过上涨总量
    rows:
    - label: j 的运动
      cells:
      - v: 对齐加一
        sub: 总量 ≤ n
        mark: found
      - v: 按 π 回退
        sub: 总量 ≤ 上涨量
        mark: active
      - v: 永不为负
        sub: 账本下界是 0
    aux:
    - label: 结论
