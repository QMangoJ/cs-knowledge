- id: rk-automaton
  title: 换个视角看匹配：滚动数字指纹，与把跳转彻底展开的自动机
  tldr: 除了直接比字符，还能把窗口算成 O(1) 滚动更新的数字指纹（[[Rabin-Karp]]）一次性并行比对多个模式，或者把每种状态下遇上每个字符的跳转全摊成一张[[有限自动机]]表——而 KMP 的 π 表正是这张大表的压缩版。
  body: |-
    如果不逐字对比呢？[[Rabin-Karp]] 换了个粗一点的粒度：先把模式 P 算成一个整数「指纹」（哈希值），再盯着文本上和模式等长的窗口算指纹。只要两个数不相等，不用看具体字母就知道窗口绝不可能命中；只有指纹撞上了，才老老实实逐字复核一遍防撞车。窗口每次右移一格，不需要把整个窗口重新算一遍：把最左边移出去那位的权重减掉，剩下的数整体左移一位乘以基数，再加上新进来的尾巴字符——用多项式哈希在 O(1) 时间内就能算出新窗口指纹，整趟扫描期望时间是 Θ(n+m)。

    这笔交易的弱点在于「指纹可能会撞车」。虽然好哈希函数撞车的概率极低，但如果对手故意构造大量同指纹的假窗口，每次都要逐字复核，最坏账单就会退化回 Θ(nm)（和哈希表遇到哈希洪水攻击是一个毛病）。不过它有个独门绝活：因为对比的是数值指纹，手里哪怕有一千个等长模式，文本也只需算一次窗口指纹去查哈希集合，非常适合多模式并行排查，以及文件去重、抄袭比对和版本控制里的内容切片识别。

    另一条理论极简的路线是建一台[[有限自动机]]：把「当前已经匹配模式前 q 个字符」看成状态 q，提前算死在每个状态碰到字符表里每个字母该跳去哪个状态。扫描时文本从头过一遍，每读一个字查一次表就完事，稳稳 Θ(n)；缺点是这张状态转移表大小是模式长度 m 乘以字符表大小，字母一多（比如 Unicode）表就大到建不动。把它跟 [[KMP]] 摆一起看就豁然开朗了：KMP 的 [[π|π 函数]] 根本不是另一套魔法，它其实就是把那张庞大的二维自动机转移表压缩成一维数组——不提前存下每个字母的去向，只在失配时顺着 π 链按需找回该去的那个状态，把空间从 m 乘字符表大小压回了 m。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 32.2 Rabin-Karp 与 32.3 Finite-Automaton Matching
    claim: Rabin-Karp 用可滚动更新的指纹获得期望 Θ(n+m)，有限自动机法以 Θ(m·|Σ|) 的预处理换取 Θ(n) 扫描
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
  canvas:
    kind: datastate
    structure: array
    caption: 滚动哈希：窗口右移一格，指纹靠删头、左移、添尾在 O(1) 内更新
    rows:
    - label: 当前窗口
      cells:
      - v: 3
        sub: 将被删掉
        mark: muted
      - v: 1
      - v: 4
      - v: 1
    - label: 右移一格后
      cells:
      - v: 1
      - v: 4
      - v: 1
      - v: 5
