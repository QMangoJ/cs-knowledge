  points:
  - 最坏输入毫不刁钻：重复文本加近重复模式即可
  - 浪费的本质是重复劳动：同一文本字符被反复比较
  mistake: 以为 Θ(nm) 只是理论最坏、实际不会遇到：重复段落在日志、二进制与基因数据里是常态，不是构造出来的极端。
- id: waste
  title: 浪费的根源：失配前对上的前缀，能免费帮你跳过必败起点
  tldr: 失配前对上的那一截模式前缀，其实把文本对应的那一截内容锁死了——只要看清这段文本里哪些开头根本接不上，模式就能一次向右滑过好几格，文本指针一步也不用回退。
  body: |-
    把偏移 0 那次失配拿放大镜看清楚。模式的前四个字符 ABAB 已经对上了，直到第五位 C 对 D 才停下。等一下——既然前四位全对上了，那文本下标 0 到 3 写着什么还需要重新读吗？不用了，它百分之百就是 ABAB。既然文本前四位已经钉死是 ABAB，为什么偏移 1（从文本第 2 个字符 B 开始）绝不可能匹配模式的开头 A？因为一个字符如果是 B，不用比就知道它不可能是 A。

    再看偏移 2 为什么不仅不用从头比，还能直接跳级。已验证的文本尾巴上是 AB（下标 2、3），而模式自己的开头正好也是 AB（前两个字符）——前头对上的结尾跟模式自己的开头咬合上了！所以模式把开头的 AB 滑过来贴在文本的 AB 上，不仅安全越过了必败的偏移 1，连新对齐后的前两位 A 和 B 都省得再比，直接拿模式第三个字符继续往下对就行。

    所有高效的字符串匹配算法，干的都是「别浪费已知信息」这一件事：[[KMP]] 和 [[Boyer-Moore]] 预先分析模式内部的重叠和字符位置，把能跳的步数算成表；[[Rabin-Karp]] 则把滑窗里的字符压成可增量更新的数字指纹。这些预处理统一做在模式这一侧，因为模式短小、提前已知，花小钱就能换长文本一路不回头；当然，如果文本只有几十个字还只搜一次，预处理的本钱收不回来，反而是朴素法最合算。
