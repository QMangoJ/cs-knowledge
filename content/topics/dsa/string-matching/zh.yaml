- id: kmp-scan
  title: KMP 扫描实跑：文本指针一步未退，在下标 10 整段命中
  tldr: 用刚才算出的 π 表扫一遍文本，文本指针 i 从 0 走到 18 全程不后退；每逢失配只缩模式指针 j 去对齐已知后缀，一路在下标 10 稳稳命中。
  body: |-
    表算好了，直接拿它扫一遍文本 T（ABABDABACDABABCABAB）。盯住两个指针：i 指着当前要考的文本字符，j 记录模式前面已经连对了几位。开局从 i=0 起步，A、B、A、B 连对 4 个，j 涨到 4；下一位文本 i=4 是 D，模式第 5 位却是 C，失配了！换作朴素法这时就把 i 退回 1；而 KMP 把 i 钉死在 4 不动，直接查表让 j 跳到 π[4] 等于 2——等于直接拿模式第 3 位的 A 来接文本下标 4 的 D，结果还是不合；继续退到 π[2] 等于 0，拿模式第 1 位 A 去比 D 还是不对。j 已经退无可退归零了，i 这才老实往前走一格来到 5。刚才连跳两下跳过的起点（偏移 1、2、3），全被 π 证明绝无可能。

    接下来从 i=5 重新攒进度：文本 5 到 7 位的 A、B、A 顺顺当当对上，j 涨到 3；在文本 i=8 处遇到 C，可模式第 4 位期待的是 B，又失配了。文本指针继续站死在 8，j 从 3 退到 π[3] 等于 1（拿模式第 2 位 B 去对 C，不行），再退到 π[1] 等于 0（拿首位 A 对 C，还是不行），j 归零后 i 才挪到下标 9 的 D，同样第 1 位就不合，于是来到关键起点 i=10。

    从下标 10 起，A、B、A、B、C、A、B、A、B 九个字符一口气全对上，j 涨满 9！此时算出命中起点 i−9+1，正好落在下标 10，跟肉眼答案一分不差。等一下，如果文本后面还有字、想把所有可能重叠的出现都找全怎么办？别把 j 清零，只要令 j 跳回 π[9] 等于 4，把刚对上的末尾 ABAB 直接当成下一轮的开头接着往下扫，哪怕两个命中首尾重叠也一个漏不掉。
  derivation: original
  sources:
