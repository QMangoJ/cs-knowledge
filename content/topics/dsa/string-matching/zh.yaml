- id: naive
  title: 朴素法：每个偏移都从头比，最坏账单是乘积
  tldr: 逐个偏移逐字比较，失配就整体右移一格；最坏 Θ((n−m+1)m)，而且最坏输入一点都不刁钻。
  body: '朴素法（也叫 BF，Brute Force）的规则没有任何花样：从偏移 0 开始，把模式与文本的对应段逐字比较，全对上就报告这个偏移；只要有一个字符失配，或者报告完一个命中，就把模式整体右移一格，从新偏移的第一个字符重新比起。

    它的账单分两种情况算。运气好时（文本与模式毫不相干），每个偏移比一两个字符就失配收场，总比较约 n 次，快得很。运气坏时就完全不同：构造文本为 n 个连续的 a，模式为 m 减 1 个 a 加一个 b。每个偏移处，前 m 减 1 个字符全部对上、最后一个字符才失配，于是每个偏移都要付出 m 次比较，总账是 (n−m+1) 乘 m，也就是 Θ(nm) 量级。全 a 文本在现实里并不罕见：想想日志里成片的空格与零、二进制文件里的大段填充、DNA 序列里的长重复段。

    回到贯穿例子上，朴素法在偏移 0 处比对 ABAB 后撞上 D 与 C 失配，白比了四次；右移一格从 B 开始，第一字就失配；如此一路挪到偏移 10 才命中。它总共做的比较远多于文本长度，超出的部分全是「同一个文本字符被反复比」的重复劳动。

    把浪费看清楚：偏移 0 处失配时，我们其实已经亲手验证过「文本前四个字符是 ABAB」这条信息，可朴素法右移之后把这条信息忘得干干净净。下一课要论证的，就是全部改进空间都藏在这种健忘里。'
