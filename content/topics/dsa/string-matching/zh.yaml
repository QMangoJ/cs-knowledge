- id: waste
  title: 浪费的病理：失配时扔掉的信息，其实是现成的知识
  tldr: 失配前已匹配的那段前缀，等于告诉了你文本的一段内容；谁能把这份知识编码下来，谁就不用回退。
  body: '把偏移 0 处的失配放大看。模式 ABABC 的前四个字符与文本对上了，第五个字符失配。这一刻我们手里其实握着一条确凿的知识：文本从下标 0 开始的四个字符就是 ABAB。朴素法右移到偏移 1 后，又从模式第一个字符开始比，等于假装这条知识不存在。

    可这条知识明明能用。如果事先知道模式自身的结构——比如知道 ABAB 这个前缀里，「AB」既是它的前缀又是它的后缀——那么右移时就不必只挪一格：偏移 1 处文本是 B 开头绝无可能（我们已知那是 A），偏移 2 处文本以已知的第三个字符 A 开头、且前面已对齐了 AB，完全可以直接从模式的第三个字符接着比。跳过的偏移与跳过的比较，全是从这条知识里兑现出来的。

    这就引出本课的中心思想：字符串匹配的优化，本质是把「比较过程中免费得到的信息」编码下来反复使用。编码的对象有两种选择。对模式做自我分析（它哪些前缀与后缀重合、每个字符出现在哪），得到的是 KMP 与 Boyer-Moore；对文本窗口做可增量维护的摘要（哈希指纹），得到的是 Rabin-Karp。注意预处理几乎总是加在模式一侧，因为模式短小且由我们选定，文本则长、且常在运行时才到来。

    还有一条边界要先划清：预处理不是白拿的，它要花掉与模式长度成正比的时间与空间。文本若只有几十个字符、只查一次，朴素法反而总账最低。所有「更快的算法」都是相对某个使用场景而言的，本课最后一课会把选型账算全。'
