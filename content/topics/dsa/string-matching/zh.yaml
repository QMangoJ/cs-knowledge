- id: kmp-complexity
  title: 复杂度的来源：摊还账——回退的总量被前进的总量封顶
  tldr: j 每涨一次最多加一，整趟最多涨 n 次，所以它一生的回退总量也以 n 为界，扫描总成本 Θ(n)。
  body: 'KMP 的 Θ(n+m) 不是数出来的直觉，而是可以一分钱一分钱算清的摊还账。先看模式指针 j。它有两种运动：比对成功时加一，失配时按 π 跳回一个更小的值。j 的取值被夹在 0 与 m 之间，关键性质是：j 每向上涨一次，至少对应着文本指针 i 向前走了一步（或者一次真实的字符对齐），i 整趟最多走 n 步，所以 j 的总上涨量不超过 n。

    回退一侧的账由上涨一侧封顶。j 的值整趟从 0 开始、始终非负，它的全部下降量不可能超过它的全部上升量（否则就会跌破 0）。于是失配跳转的总次数同样以 n 为界。扫描里真正发生的字符比较，一部分对应 j 上涨，一部分对应 j 回退，两部分各被 n 封顶，总量是 Θ(n)。同理，算 π 时对模式自身做同样的账，总量 Θ(m)。两笔账相加，就是 KMP 的 Θ(n+m)，额外空间只有 π 表本身的 Θ(m)。

    这套「用势能的涨落给操作封顶」的记账法叫摊还分析，它在本站还会反复出现：动态数组扩容时单次插入像是要拷贝全表，但把扩容成本摊到此前的每次插入上是常数；哈希表、并查集的账也都是这么算的。看见一个「单次很贵、总体便宜」的结构，先问它的势能是什么、涨落如何对冲，多半就找到了证明入口。

    还要补一句对照：朴素法为什么摊不出这个界？因为它没有 j 这种「攒下来的进度」——每次失配把进度清零重来，文本指针还要回退重比，下降量根本不受上升量约束，账自然爆到乘积级。KMP 的全部功夫，就是给进度找了一个不会凭空蒸发的存法。'
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 32.4（KMP 的摊还分析）
    claim: KMP 扫描的总运行时间为 Θ(n)，依据是模式索引的下降总量被其上升总量封顶的摊还论证
