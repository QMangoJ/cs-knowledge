  points:
  - 摊还的关键是找势能：j 就是 KMP 的势能
  - 朴素法摊不平，因为它的进度失配即清零
- id: bm-idea
  title: "[[Boyer-Moore]]：从右往左比，让一次失配换来一大步"
  tldr: "[[Boyer-Moore]] 反过来从模式的尾巴往左比：一旦尾巴就失配，看一眼文本露出来的那个字符，如果它压根没在模式里出现过，模式直接整段跨过去，很多文本字符连看都不用看。"
  body: |-
    [[KMP]] 再快也要把文本每个字符至少摸一遍，1977 年 Boyer 和 Moore 问了一句更狠的话：能不能连大部分文本字符都跳过不看？做法恰好反着来——把模式贴到文本上，不从左边第一格比起，而是从模式最右端那个字符开始往左倒着比。理由一想就透：如果最末尾第一下就对不上，文本在那个位置露出的字符 c 就直接暴露了，手里立刻握着一把筛子。

    怎么用这个露出的「坏字符」c 来跳步？靠的是[[坏字符规则]]：如果 c 在整个模式里从没出现过，那只要模式还压在 c 上面，不管向右挪 1 格还是 2 格都绝不可能对上，不如直接把模式整个开头拉到 c 的右边一格——一次失配瞬间跨越 m 个字符！要是 c 在模式里出现过，就把模式向右拉，让模式里最后一次出现 c 的位置正好对准文本的这个 c。万一从右往左已经连续对上了一小截后缀才失配（文本窗口里已经有一截跟模式末尾重合的「好后缀」），还有配套的[[好后缀规则]]来算出兼容的最远右移，实际算法取两条规则里跳得更远的那一个。

    在英文文档这类字符种类繁多的文本里，长模式的末尾字符多半撞不上，一次跳个十来格是家常便饭，最好情况下总共只需约 n 除以 m 次比较，绝大多数文本字节连读都没读过——这也让常驻编辑器的查找功能和 [[grep]] 这类工具长期偏爱它的简化版 [[Horspool]] 算法（只留坏字符规则，写起来简单、实测飞快）。不过代价也要交代清：在 [[DNA]] 这类只有四个字母的小字符表里，坏字符大概率都在模式里出现过，跳步立刻缩水；而且如果只用坏字符规则，遇上特定构造的重复文本，算法依然会退化到 Θ(nm)，必须补上好后缀规则和 [[Galil 规则]]才能在最坏情况下抢回线性保证。
  derivation: original
  sources:
  - ref: boyer-moore-1977
    locator: A Fast String Searching Algorithm（坏字符移位与跳步思想）
    claim: 从模式右端开始比较、按失配处文本字符在模式中的最后出现位置决定移位，可实现大幅跳步与亚线性最好情况
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已核对该文出处（CACM 20(10):762-772，DOI 10.1145/359842.359859），记录见 docs/curriculum-audit.md
