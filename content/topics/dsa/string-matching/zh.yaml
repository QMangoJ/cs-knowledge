        mark: active
    aux:
    - label: 跳步规则
      items:
      - 失配字符不在模式中
      - 整段跳过该位置
  log:
  - mode: BM
    event: Boyer-Moore 路线立好了：从模式右端倒着比，靠失配露出的坏字符实现大跨步跳读。
  points:
  - BM 的速度来自跳过未看的字符，而非把看过的用足
  - 字母表越小（如 [[DNA]] 的四字符），BM 的跳步收益越薄
