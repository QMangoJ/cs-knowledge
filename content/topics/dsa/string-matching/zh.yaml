  - π 是自动机转移表的压缩存储，不是另一种魔法
- id: choose
  title: 选型：四种算法各自的领地
  tldr: 要最坏保证用 KMP，要平均速度用 BM 变体，多模式用 AC 自动机，指纹场景用 Rabin-Karp；文本短小则朴素法总账最低。
  body: '把选型账按场景算一遍。第一维是保证的硬度：数据由对手构造、或系统对尾部延迟有硬要求（入侵检测、流式过滤）时，最坏 Θ(nm) 是不可接受的风险，KMP 的 Θ(n+m) 保证就是为此而买的。第二维是字母表与模式长度：英文文本、长模式的组合下 BM 的跳步收益最大，编辑器与 grep 类工具的实测冠军长期是 BM 的变体；反过来在 DNA 这类四字符字母表里，坏字符几乎总在模式中出现，BM 跳不动，KMP 或位并行算法更稳。

    第三维是模式的数量。要同时找一万个关键词（敏感词过滤、病毒特征库），逐个跑 KMP 是一万遍扫描；AC 自动机把所有模式编进一棵带失配跳转的字典树，文本只过一遍就报出全部命中——它正是 KMP 的 π 思想在多模式上的推广，本课的 π 在这里第二次显形。第四维是文本的到达方式：文本以流的形式逐块到来、无法回读时，只有指针单调向前的 KMP 系与自动机系能在线处理，BM 的从右往左比对需要随机访问窗口，不适合纯流。

    最后别忘了朴素法的领地：文本只有几十到几百字符、只查一次时，任何预处理都收不回成本，朴素法总账最低；模式极短（如两三个字符）时，各算法的差距被常数淹没，标准库的实现经常干脆用朴素法或朴素法的向量化版本。选型的第一性原理始终是：优化的总账等于预处理加扫描乘以使用次数，先把账算清，再谈算法优劣。

    还要给近似匹配留一句：允许 k 处不同的模糊查找（拼写纠错、测序比对）是另一个问题家族，工具换成编辑距离与位并行动规，不要拿精确匹配的算法硬套。'
