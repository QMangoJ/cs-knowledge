  points:
  - Two-Way 是保证、空间与实现三方妥协的产物
  - 带走的问题：哪些已付代价的信息正在被我扔掉
design:
- mechanism: KMP 把模式的自我重叠预编译成前缀函数 π：扫描时文本指针只进不退，失配的跳转全部由这张与文本无关的表决定
  problem: 朴素法慢在太健忘：每次对比失配，前面刚刚验证完的一截文本信息全被扔掉，文本指针退回去重新再读。只要文本指针还在来回倒退，遇到大量重复字符时总比较次数就会被拖死在乘积级。
  choice: 把算力预支在短小且提前已知的模式身上，不碰庞大的文本：先拿模式自己跟自己算一张 π 表，记录每个前缀里「既是开头又是结尾」的最长重合，扫描时就能在失配后直接复用这段已验证的尾巴，保证绝不漏掉合法起点。备选做法是给文本建后缀索引，适合文本不变、反复搜不同词，但面对只读一遍的网络数据流根本派不上用场。
  tradeoff: π 表跟单个模式死绑，换个关键词就得重算，同时查一批词必须升级成 AC 自动机；而且手写 π 表的回退循环很容易写错边界。换来的是不管文本怎么刁钻，最坏时间都能死守线性 Θ(n+m)，还支持流式单遍扫完。
  root: 本质是一笔信息账：比对过的字符已经付过算力成本，不能平白丢弃。π 表把「模式自我重叠」的规律提前压成一维数组，让文本指针的单调向前成为这份知识的直接变现。
- mechanism: Boyer-Moore 的坏字符跳步：从右端比起，失配时用文本露出的字符在模式中的最后出现位置决定移位量，让一次失配也能换来多步前进
  problem: KMP 虽然做到线性，可文本里哪怕 99% 的字符都和模式毫无关系，它还是得逐字看过一遍。面对几十个字的长模式和几十个字母的大字符表，一个字一个字摸过去本身就是浪费。
  choice: 把比较方向彻底掉头，从模式尾巴往左比：失配瞬间文本露出来的那个字符，只要在模式里压根找不到，模式就可以整段跨过它；若在模式里出现过，就对齐它最后一次出现的位置。对照 KMP 稳妥但逐字不落，以及向量化朴素法靠硬件一次比十几字节但长模式仍有最坏乘积风险，BM 把重点押在了大跨步跳过不读。
  tradeoff: 只用坏字符一条规则时，遇到恶意重复文本照样会退化回 Θ(nm)，非要补上好后缀与 Galil 规则才能保住线性底线，代码一下子复杂很多；在 DNA 这类只有 4 个字符的窄字母表上几乎跳不动。换来的是大字母表下约 n/m 次比较的亚线性爆发力。
  root: 它打破了「算法至少要把输入全看一遍」的错觉：只要对模式结构足够了解，看到一个不相关的字符就能担保前面一整片对齐都不可能成功，于是连没读到的文本都能合法跳过。
- mechanism: Rabin-Karp 的滚动指纹：把每个文本窗口压成一个可增量更新的数值，先比指纹再比字符，并允许同时对多个模式做指纹匹配
  problem: 逐字比对没法把多个关键词的比对动作合并，也很难直接拆成批量算术操作；手里同时有几千个等长词要查，逐个跑单模式算法成本成倍翻番。
  choice: 改用算术指纹先做一轮海选：给模式和文本窗口都算多项式哈希值，窗口右移一格只需在 O(1) 时间内减去最左旧字、乘基数再加上最右新字；指纹对不上直接放行，指纹碰上了再逐字复核。逐个跑 KMP 虽然没碰撞烦恼，但多模式成本线性膨胀，做不了这种一次扫码查全表的复用。
  tradeoff: 用低概率误报换取结构简洁：指纹一旦撞车就要花精力回退逐字核对，遇到恶意构造的碰撞数据会退化成 Θ(nm)；单找一个短词时算哈希的常数未必划算，真正威力只在多模式查表与内容去重时显现。
  root: 这和哈希表、布隆过滤器是同一笔交易：直接比较原物太贵或不好批量复用，于是先拿一个便宜的紧凑摘要挡掉绝大部分必败项，把昂贵的精准核对留给万分之一的疑似命中。
level: 进阶
minutes: 32
prereq:
- dsa/greedy
objectives:
- 手算模式 ABABCABAB 的前缀函数 π，并用它完成一次 KMP 扫描
- 构造朴素法的最坏输入，并用摊还账解释 KMP 为何是 Θ(n+m)
- 说清 BM 坏字符规则的跳步原理与它的最坏退化
- 按保证硬度、字母表与模式数量为具体场景选定算法
aiLink: 字符串匹配是文本类 AI 管线的地基：分词前的词表匹配、敏感词过滤用的 AC 自动机、检索增强里在语料中定位引用原文，都还是本课这套算法在服役；连分词器内部的词典最长匹配，也可以看作多模式匹配的一个变体。
