- id: naive
  title: 朴素法：每次失配都傻退回去，把刚验过的信息全扔掉
  tldr: 朴素法一遇失配就把文本指针退回下一个起点重新比起，最坏时间会掉进 Θ((n−m+1)m) 的乘积坑——全因它把刚验过的字符信息忘得一干二净。
  body: |-
    朴素匹配（也叫 [[BF]] 暴力法）的动作特别死板：把模式 P 贴在文本 T 开头（偏移 0）逐字对比，只要碰上一个对不上的字符，不管前面已经连续对上了多少位，立刻把文本指针退回起点右边那一格（偏移 1），模式也从头再来。

    回到贯穿例子看看这有多亏。在偏移 0 处，模式 ABABCABAB 的前四个字符 ABAB 刚刚在文本里一一验证通过，到第五位才撞上文本的 D 和模式的 C 不符。这一刻我们明明已经亲手摸清「文本 0 到 3 号位就是 ABAB」，可朴素法二话不说把文本指针退回下标 1（字符 B），模式重头拿 A 来比，第一下就撞墙，一路挨个试到偏移 10 才终于对齐。

    运气好时文本和模式风马牛不相及，每个起点比一两下就退出，总共约比 n 次；可一旦碰到「大段重复文本配近重复模式」，账单立马爆炸。比方说文本是一串 n 个连续的 a，模式是 m 减 1 个 a 结尾挂一个 b：在每一个偏移起点，前 m 减 1 个 a 全部稳稳对上，偏偏到最后一个字符 b 才发现是 a 失配。于是每个偏移都白白做满 m 次比较，总比较次数达到 (n−m+1) 乘 m，也就是 Θ(nm)。现实里全空格的对齐日志、二进制零填充和长重复 [[DNA]] 片段，随手就能撞上这种最坏情况。
