    claim: 仅坏字符规则的 BM 变体最坏可退化到 Θ(nm)，需好后缀等规则补强
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
  canvas:
    kind: datastate
    structure: array
    caption: 坏字符不在模式里：模式整段跳过它，一次失配换来 m 步
    rows:
    - label: 文本窗口
      cells:
      - v: t
      - v: e
      - v: x
