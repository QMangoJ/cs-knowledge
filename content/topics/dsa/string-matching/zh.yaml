- id: practice
  title: 工程现实：标准库里跑的都是些什么
  tldr: glibc 的 memmem 用 Two-Way 算法拿 O(1) 空间的线性保证；短模式下向量化的朴素法靠常数取胜，渐进最优经常只是账面冠军。
  body: '打开标准库看一眼，会发现教科书四强一个都不在主位上。glibc 的 strstr 与 memmem 用的是 Two-Way 算法：把模式切成左右两段、先比右段再比左段，用临界分解的性质保证 Θ(n+m) 时间且只用 O(1) 额外空间——它不要 π 表那一份内存，又保住了最坏线性的底线，是「保证硬度、空间、实现复杂度」三方妥协后的产物。Rust 与 Go 等语言的标准库则在实现里组合了多个策略，按模式与文本的规模在朴素、BM 系与哈希系之间切换。

    另一个反直觉的事实是短模式下朴素法的强势。现代 CPU 可以用一条向量指令并行比对 16 到 32 个字节，朴素法只要先用向量指令找「首字符出现的位置」（如 memchr），再对少数候选做逐字验证，实际速度常常压过分支多、常数大的 KMP。渐进复杂度只算操作的数量级，不管每步的真实成本与缓存行为；当 n 不大、模式又短时，常数与向量化说了算。这并不推翻本课的分析，而是提醒：复杂度是用来筛掉数量级错误的，不是用来给同数量级的实现排座次的。

    把本课与全站收个尾。字符串匹配的全部进步来自一件事：不浪费已经知道的东西。哈希表用预计算换查询、二分用有序换比较次数、B+ 树用索引换扫描、DP 用存表换重复计算——它们与 KMP 把模式的自重合存成 π，是同一种交易在不同货架上的样子。真正要带走的不是某个算法，而是一句提问：这份工作里，哪些信息是我已经付出代价得到、却正在随手扔掉的？'
