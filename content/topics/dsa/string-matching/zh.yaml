title: 字符串匹配：把模式学透，让文本只过一遍
summary: 在长文本里找短模式。朴素法把比过的信息全扔掉；KMP 把模式的自我重叠预编译成 π 数组，Boyer-Moore 干脆让文本都不必逐字读完。
premise: 以在文本 ABABDABACDABABCABAB 里找模式 ABABCABAB 为贯穿例子。
position: >-
  贪心那课处理的是在候选集合里做不可反悔的选择，本课把目光移到一段固定文本的内部：模式很短、文本很长，任务是找出模式出现的全部位置。它自成新板块「字符串里的模式」，也是数据结构与算法这一科的最后一站。学完你能手算一个模式的前缀函数 π、说清朴素法最坏复杂度是怎样被构造出来的，并能按字母表大小与最坏保证的要求在 KMP 与 Boyer-Moore 之间做出选择。
bridge:
  prev: >-
    上一课贪心靠每步定死、永不回头，省掉了动态规划的表；本课的朴素匹配恰好站在反面：每失配一次，就把刚刚比过的信息整段丢掉、从下一个位置重头再来。先看清这份浪费长什么样，才知道预处理到底要买什么。
overview:
- key: 一句话总结
  value: 匹配的全部进步，都来自动一件事：把已经比较过的信息留下来用
- key: 朴素法的账
  value: 最坏 Θ((n−m+1)m)，且最坏输入随手就能构造：全 a 的文本配 a…ab 的模式
- key: KMP 的办法
  value: 预处理模式的自我重叠为前缀函数 π，文本指针只进不退，总 Θ(n+m)
- key: BM 的办法
  value: 从右往左比、用失配字符决定跳步，最好情况只需约 n/m 次比较
- key: 哈希的办法
  value: Rabin-Karp 把窗口变成可滚动更新的指纹，多模式与并行场景占优
- key: 选型
  value: 要最坏保证选 KMP，要平均速度选 BM 变体，多模式选 AC 自动机
