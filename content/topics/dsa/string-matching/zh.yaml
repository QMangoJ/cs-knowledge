steps:
- id: problem
  title: 问题边界：长文本里找全所有匹配起点
  tldr: 在长文本里找短模式，要的是所有对齐起点的下标；衡量算法好坏要同时盯住两笔账——预先整理模式花多少工夫，正式扫描时比对多少次字符。
  body: |-
    先把记号立住：手头有一段长度为 n 的只读文本 T，和一小段长度为 m 的模式 P（通常 m 远小于 n）。我们要找的不是「有没有」，而是找出所有起始下标 s（从 0 开始数），让文本从 s 往后的 m 个字符和模式 P 一字不差。平时在代码编辑器里按 Ctrl+F 高亮所有命中词，或者在几十万行日志里 [[grep]] 出错码，底层都在解同一道题。

    全课固定用同一组例子往下走账：文本 T 是 ABABDABACDABABCABAB（共 19 个字符），模式 P 是 ABABCABAB（共 9 个字符）。用眼睛从头对齐一遍就能确认，整段文本里只有下标 10 这一处能把 9 个字符严丝合缝对上（从下标 10 到 18 正好是 ABABCABAB），其他偏移全都会在某个位置撞墙。

    怎么算两种做法谁更快？不能只看正式扫描那一下，得算总账：第一笔账是扫描时一共做了多少次字符比较；第二笔账是开扫之前有没有花时间预处理模式（建辅助表）。朴素法懒得做任何预处理，结果把全副代价都摊在了反复重扫的比较次数上。
