        mark: found
    aux:
    - label: 指纹不等
      items:
      - 窗口必不命中
      - 直接跳过
  log:
  - mode: 哈希路线
    event: 另外两条路跑通了：[[滚动哈希]]用数字海选切入多模式，自动机把所有跳转摊开，而 π 表正是它的省空间压缩版。
  points:
  - Rabin-Karp 的期望快、尾巴差；KMP 的保证硬、常数实
  - π 是自动机转移表的压缩存储，不是另一种魔法
- id: choose
  title: 工程选型：看清手里的数据，四类场景各归其位
  tldr: 没有绝对第一的匹配算法：死磕最坏线性用 KMP，大字符集离线猛搜用 BM 系，一次找成千上万个关键词上 AC 自动机，流式到达的数据不能回头只能选单调向前走的算法。
  body: |-
    选型先问自己前两个问题：怕不怕最坏情况，以及字母表有多大？如果文本由外部用户输入甚至攻击者构造，或者像入侵检测、在线风控那样死守尾部延迟上限，任何可能退化到 Θ(nm) 的做法都要被一票否决，必须选最坏时间写死在 Θ(n+m) 的 [[KMP]] 系。反过来，如果是在本地英文源码或自然语言长文本里找一个长词，字母表大、模式长，[[BM|Boyer-Moore]] 的跳步收益极为惊人，长期霸占编辑器查找与命令行搜索工具的实测第一名；但在只有 4 个字母的 [[DNA]] 序列里，坏字符十有八九都在模式内，BM 跳不动，这时还是 KMP 或[[位并行]]算法更稳当。

    再问后两个问题：手里有几个模式，以及文本是不是一整块都在内存里？假如你要同时做一万个敏感词过滤或病毒特征扫描，拿 KMP 挨个模式把文本扫一万遍肯定崩盘；正确的升级叫 [[AC 自动机]]——它相当于把所有关键词先织成一棵[[字典树]]，再把 KMP 的「失配往回跳」推广到整棵树上，最终文本依然只需从头到尾过一遍，全部关键词的命中同时报出来。至于文本是一边从网络流过来、读过就扔没法跳回去随机取数的纯流式场景，必须从左往右倒着比的 BM 就用不了，只能交给文本指针永不回头的 KMP 或自动机系。
