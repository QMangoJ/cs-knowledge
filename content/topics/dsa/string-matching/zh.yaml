- id: kmp-scan
  title: 扫描走例：文本指针一路向前，命中下标 10
  tldr: 拿 π 扫贯穿例子的文本，j 在失配时按 π 跳转、i 从不回退，最终在偏移 10 处整段命中。
  body: '现在拿算好的 π 去扫文本 ABABDABACDABABCABAB。维护 i 指向文本、j 表示已对齐的模式长度。开局从文本下标 0 起，A、B、A、B 连对四次，j 涨到 4；文本下标 4 是 D，模式第五个字符是 C，失配。按规矩不回退 i，令 j 跳到 π[4] 等于 2——意思是已验证的 ABAB 里，后缀 AB 与前缀 AB 重合，直接拿模式第三个字符 A 与文本下标 4 的 D 比，仍失配；再跳到 π[2] 等于 0，拿模式首字符 A 比 D，还是失配，j 归零，i 才前进一位。这一连串跳转全在同一个文本位置上完成，跳过的偏移都被 π 证明过不可能。

    此后扫描在文本上一路推进：从下标 5 的 A 重新起步对齐 AB 后，在下标 7 的 A 处又失配一次并靠 π 跳转回收部分对齐，陆续推进到下标 10。此后 A、B、A、B、C、A、B、A、B 九个字符连对到底，j 涨满 9，报告偏移等于 i 减 9 加 1，也就是下标 10，与肉眼答案一致。命中之后若想继续找下一个，只需令 j 跳到 π[9] 等于 4 再向前扫，连重叠命中都不会漏。

    数一数这趟扫描的比较次数：i 从 0 走到 18 一步未退，j 的每次回退都伴随着此前真实对齐的增长，整趟比较是文本长度的常数倍而不是乘积倍。朴素法在同一份文本上要做的比较明显更多，差距全在那些被 π 跳过的偏移里。下一课把这笔账严格化：为什么 j 回退的总次数不可能超过它上涨的总次数。'
  derivation: original
