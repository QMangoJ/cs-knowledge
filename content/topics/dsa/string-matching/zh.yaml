steps:
- id: problem
  title: 问题：文本很长，模式很短，位置要找全
  tldr: 给文本 T 与模式 P，找出 P 在 T 中出现的全部起始位置——编辑器查找、日志检索与序列比对都是它。
  body: '先把问题钉死。文本 T 是一串长度为 n 的字符，模式 P 是长度为 m 的字符，通常 m 远小于 n。任务是找出所有偏移 s，使得 T 从 s 开始的 m 个字符与 P 逐字相同。偏移从 0 开始数，本课统一用这个约定。

    这个问题就是你每天都在用的那些功能的内核：在编辑器里按 Ctrl+F 找一个词，在一亿行日志里 grep 一个错误码，在杀毒软件里匹配一段特征字节，在基因组里定位一段碱基序列。它们的共同形态是：一份巨大的、只读的文本，一份小小的、要反复拿去比对的模式，以及「位置」这个输出。

    先给一个贯穿全课的例子。文本是 ABABDABACDABABCABAB（长 19），模式是 ABABCABAB（长 9）。肉眼扫一遍可以发现，模式完整出现在下标 10 处：从那里开始的九个字符正好是 ABABCABAB。除此之外没有别的位置能对上。算法要做的，就是把「肉眼扫一遍」这件事变快、变可靠。

    衡量这类算法要同时看两笔账：比较了多少次字符（决定扫描成本），以及为此预先付出了多少预处理（决定启动成本）。后面每种算法都是在这两笔账之间做不同的交易，而第一种算法——朴素法——选择两笔账都不优化。'
