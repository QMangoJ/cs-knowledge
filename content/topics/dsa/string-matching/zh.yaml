- id: kmp-idea
  title: "[[KMP]] 的核心：失配往回退几步，只取决于模式自己的重叠"
  tldr: KMP 让文本指针只进不退的秘密，是把「失配后模式还能利用几格已匹配前缀」提前算成一张表——因为失配前对上的内容本就和模式前缀一模一样，跟长文本长啥样毫无关系。
  body: |-
    1977 年 Knuth、Morris 与 Pratt 提出的 KMP 算法，把上一节那套跳转变成了一句极干脆的规矩：失配发生时，文本指针 i 原地站稳不许后退，只让模式指针 j 往回缩一截，接住刚才已经验证过的后缀。等一下，为什么往回退多少步不需要看文本？因为失配之前已经连着对上了前 k 个字符，那就说明文本刚刚扫过的那 k 个字符和模式的前 k 个字符一模一样——既然手头已经有一份完整拷贝，直接拿模式自己来算能接上多少就够了。

    把画面摆正：假设模式前 k 个字符刚刚对齐，第 k 加 1 位卡壳了。想让模式右移之后还接得上这段文本的尾巴，就得在模式这 k 个字符里找一个「既是真前缀、又是真后缀」的最长片段，记它的长度为 L（不能算整个长度为 k 的自身，否则模式一动不动就死循环了）。找到这个最大的 L 后，模式向右滑 k 减 L 格，前 L 个字符就已经自动贴在刚刚验证过的文本后缀上了，模式指针 j 直接退到 L，接着拿模式第 L 加 1 位去比当前卡壳的文本字符就行。而且绝不会漏掉任何命中：如果中间存在一个移动步数更小的合法起点，那段重叠就会比 L 更长，与「L 是最大重叠」矛盾。

    把每个长度 q（从 1 到 m）算出的这个最大重叠 L 记成一张一维数组，就是[[前缀函数|π 函数]]。说白了，π[q] 就是一份失配备忘录：当模式前 q 位刚对上却在第 q 加 1 位失配时，模式指针 j 不必归零，往回退到 π[q] 就能保住已经对上的最长前缀，继续往前拼。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 32.4 The Knuth-Morris-Pratt Algorithm（前缀函数定义）
    claim: 前缀函数 π 刻画模式各前缀的真前缀与真后缀的最大重合，失配时按 π 跳转可保证不漏检且文本指针不回退
