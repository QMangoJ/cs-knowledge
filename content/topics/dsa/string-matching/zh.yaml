title: 字符串匹配：把模式学透，让文本只过一遍
summary: 字符串匹配的提速全部来自同一件事：别把刚验过的字符信息扔掉。朴素做法一遇失配就把文本指针退回去重头比，把最坏账单拖成文本长乘以模式长；KMP 把模式自己的前缀和后缀重合提前编成一张 [[π|π 函数]] 表，让文本指针只进不退；[[Boyer-Moore]] 则反过来从模式末尾往前比，靠失配露出的字符直接跳掉一大段；最后看滚动哈希和工程标准库里怎么在最坏保证与实测速度之间选型。
premise: 在日志文件或长文章里按 Ctrl+F 搜一个关键词，或者在一整段文字 ABABDABACDABABCABAB 里找出模式 ABABCABAB 出现在哪个位置——从头挨个位置硬对齐，短文本还行，一旦文本变成几百兆日志，为什么会突然慢下来？这节课就沿着这一组文本和模式一路跑完，看懂怎么把刚比过的字符信息留下来，让长文本尽量只从头到尾过一遍。
position: 上一课讲的是贪心，处理在一堆候选项里做不可反悔的选择；这一课开启「字符串里的模式」板块，也是数据结构与算法这一科在复杂性收官前的倒数第二站，把视角转到一段只读长文本内部查找短模式。学完这一课，你能手算出任意模式失配时的跳转表、看清朴素方法最坏情况下为什么会被拖慢，并能按最坏保证、字符集大小和关键词数量在几种主流匹配策略之间做工程选型。
bridge:
  prev: 上一课的贪心靠每步当场定死、永不回头省掉了动态规划的表格；这一课先看朴素的字符串匹配怎么站在反面——每次对比失败，它就把刚刚费劲验过的那几个字符忘个精光，退回下一个起点重头再来。先看清这笔重复劳动的账，后面的提速手段才接得上。
  next: 前面十课一直在帮问题找更快的算法，从平方压到线性；下一课是全科的收官之战，要反过来问一个让人意外的问题：像排课表、旅行商路线这一类难题，为什么几十年来全人类都找不到快算法？
overview:
- key: 一句话总结
  value: 匹配提速全靠一件事：把已经比过的信息存下来复用。朴素做法一失配就清零重来；更聪明的算法把模式自身规律或窗口摘要提前编成规则，失配时直接跳过必败的起点。
- key: 朴素法的账
  value: 最坏复杂度是 Θ((n−m+1)m)，拿一长串全 a 的文本配 a…ab 的模式就能轻易触发。每个起点都要比到模式最后一位才失败，几乎每一格都被重复比对 m 次。
- key: KMP 的办法
  value: "[[KMP]] 先把模式自己跟自己重叠的部分算成一张[[前缀函数|π 函数]]表，扫描时文本指针只往前走不回头，总时间压到 Θ(n+m)。失配时查表就能知道模式该往前滑几格，刚验过的前缀直接接着用。"
- key: BM 的办法
  value: "[[BM|Boyer-Moore]] 对齐后从模式最右边往左比，一旦失配，看一眼露出来的文本字符就能决定向右跳多远，最好情况下只需约 n/m 次比较，大部分文本字符根本不用读。"
- key: 哈希的办法
  value: "[[Rabin-Karp]] 把模式和当前文本窗口各自算成一个数字指纹，窗口右移时只需去掉头上的旧字、补上尾巴的新字就能 O(1) 更新，指纹对上了再逐字核对，适合多关键词并行筛选。"
- key: 选型
  value: 死守最坏线性保证选 KMP，英文等大字符集追求平均极速选 BM 变体，同时找成千上万个关键词用 [[AC 自动机]]；短文本只查一次，硬件加速的朴素查找反而最快。
