  points:
  - π 是把「模式与自己重合多少」这份知识的完整编码
  - 文本指针不回退，是 KMP 全部效率的来源
- id: lps-table
  title: 动手算 π：模式 ABABCABAB 的[[前缀函数|π 函数]]
  tldr: 算 [[π|π 函数]] 表其实就是拿模式和它自己匹配：新来一个字符能接上前面的最长重合就加 1，接不上就顺着已经算好的 π 值往回找次长重合再接。
  body: |-
    我们亲手把贯穿例子 ABABCABAB（共 9 个字符，下标 0 到 8）的[[前缀函数|π 函数]]算一遍。约定 π[q] 表示模式前 q 个字符里最长的「真前缀等于真后缀」长度，q 从 1 数起。单字符没有比自己更短的真前缀，所以 π[1] 永远是 0。

    从左往右一步步接：前 2 个字符 AB，开头 A 和结尾 B 对不上，π[2] 等于 0；前 3 个字符 ABA，开头和结尾都是 A，π[3] 等于 1；前 4 个字符 ABAB，开头 AB 和结尾 AB 吻合，π[4] 等于 2。第 5 个字符 C 上场时有意思了：前面 ABAB 的最大重合是 2（也就是 AB），先看模式第 3 位是不是 C——结果是 A，接不上！按规则沿着已算好的 π 链往回退：长度 2 的自身重合 π[2] 等于 0，再拿空串后面的第 1 位 A 跟 C 比还是不搭，于是 π[5] 归 0。这个 0 像一个断点，把前头攒起的重合清了零。

    跨过断点继续往后算，后面的 ABAB 再次把重合接起来：ABABCA 首尾都是 A，得 π[6] 等于 1；ABABCAB 首尾都是 AB，得 π[7] 等于 2；到第 8 位 ABABCABA，首尾连对 ABA，π[8] 等于 3；第 9 位 ABABCABAB 首尾连对 ABAB，π[9] 等于 4。整张表算完依次是 0、0、1、2、0、1、2、3、4。仔细看这个动作：每算一位，要么顺着上一步的重合直接加 1，要么沿 π 链回退一截重新接——这和扫描时拿模式去比文本的动作一模一样。而且因为每次最多接上 1 个新字符，π 值相邻两项的跨度永远不会超过加 1，这一点正是下一步证明线性复杂度的伏笔。
  derivation: original
  sources:
