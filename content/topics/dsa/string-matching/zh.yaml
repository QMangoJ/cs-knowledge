- id: kmp-idea
  title: KMP 的想法：模式右移多少，只看模式自己
  tldr: 失配时该移多远，取决于已匹配前缀的最长真前缀后缀重合；把这张表预先算好，文本指针永不回头。
  body: 'KMP 由 Knuth、Morris 与 Pratt 在 1977 年给出，它的想法可以压缩成一句话：失配发生时，模式应该右移多少，只取决于模式自身的重叠结构，与文本无关，所以可以预先一次算清。

    设失配时已经对上了模式的前 k 个字符（这 k 个字符同时就是文本对应段的内容）。下一次尝试想对齐，必须让模式的某个前缀与这 k 个字符的某个后缀重合——因为文本那一段已经定死是这 k 个字符了。若模式前 k 个字符的最长「真前缀同时是真后缀」的长度是 L，那么把模式右移 k 减 L 位，前 L 个字符天然对齐，可以直接从第 L 加 1 个字符接着比。右移量由此完全确定，而且保证不会跳过任何可能的命中点：任何更小的右移都意味着要求一个更长的重合存在，与 L 的最大性矛盾。

    把每个 k 对应的 L 预先算成一张表，就是前缀函数 π：π[q] 表示模式前 q 个字符的最长真前缀后缀长度（q 从 1 数起）。扫描时维护两个指针：文本指针 i 只向前走，模式指针 j 表示当前已对齐的长度；字符相同就双双前进，失配时不回退 i，而是令 j 跳到 π[j] 继续比，直到 j 归零或比中。j 的每一次跳跃都对应着跳过一批已证明不可能的偏移。

    于是 KMP 的骨架是：拿模式和它自己先「匹配」一遍算出 π，再拿模式和文本正式匹配一遍。下一课先把 π 的计算在贯穿例子上完整走一遍，它是全课最需要动手的地方。'
