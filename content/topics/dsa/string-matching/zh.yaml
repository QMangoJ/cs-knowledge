design:
- mechanism: KMP 把模式的自我重叠预编译成前缀函数 π：扫描时文本指针只进不退，失配的跳转全部由这张与文本无关的表决定
  problem: 朴素法的浪费是信息性的：每次失配，我们其实已经亲手验证了文本的一段内容，却没有任何机制把这份验证结果留下来，下一次尝试只能从零开始。只要文本指针还会回退重比，最坏复杂度就被锁死在乘积级，与写代码的人多小心无关。
  choice: 预处理的对象选模式而非文本：模式短、由我们掌控、可以反复使用；π 把模式每个前缀的自重合程度完整编码，失配时按 π 跳转到的新对齐被数学地保证不会漏掉任何命中。替代方案如预处理文本建成后缀结构，适合文本固定、反复查不同模式的场景（如基因组数据库），但对一次性的流式文本无从谈起；如不预处理，则只能回到朴素法。
  tradeoff: π 只对单个模式有效，模式一变就要重算，多模式场景必须升级到 AC 自动机；且 π 的递推与回退链是出了名的易写错，边界用例需要专门测试。换来的是 Θ(n+m) 的硬保证与在线流式处理的能力。
  root: 这是信息守恒式的洞察：比较过的信息不会消失，只看它有没有被编码下来。π 是「模式自我重叠」这份知识的最小完整编码，文本指针的单调性是这份知识的直接兑现——与 DP 把子问题答案存表是同一笔交易：凡是会被重复索取的知识，都值得先付一次存储的账。
- mechanism: Boyer-Moore 的坏字符跳步：从右端比起，失配时用文本露出的字符在模式中的最后出现位置决定移位量，让一次失配也能换来多步前进
  problem: KMP 虽然保证了线性，仍然要逐字看过文本的每一个字符。但对长模式、大字母表的场景，大部分字符其实与模式毫无关系，逐字看完它们本身就是浪费；与此同时，失配那一瞬间看到的文本字符，携带了比「不相等」多得多的信息。
  choice: 反转比较方向、并让失配字符定价跳步：字符不在模式里就整段跳过，在模式里就对齐它最后出现的位置。替代方案 KMP 逐字推进，保证强但常数大、且永远省不掉逐字这一环；替代的向量化朴素法靠硬件宽度硬吃常数，在短模式上极强，遇到长模式与重复文本就回到乘积级风险。
  tradeoff: 只用坏字符规则时最坏退化到 Θ(nm)，要好后缀与 Galil 规则补强才换回线性，实现复杂度随之上升；字母表越小跳步越短，在 DNA 这类四字符场景里优势大幅缩水。换来的是最好情况约 n 除以 m 次比较的亚线性表现与编辑器级工具的实测速度。
  root: 它改写了我们对输入规模的看法：运行时间不必与输入长度成正比，算法完全可以跳过从未看过的输入还给出正确结论，前提是它对模式的结构知识足以担保被跳过的部分不可能命中。KMP 用足了已看过的信息，BM 则连未看的信息也用模式知识替代了——两种省法，源于对「知识代替检查」这件事的两种定价。
- mechanism: Rabin-Karp 的滚动指纹：把每个文本窗口压成一个可增量更新的数值，先比指纹再比字符，并允许同时对多个模式做指纹匹配
  problem: 逐字比较的成本来自字符这个粒度本身；当模式不止一个、或者文本要被并行切开处理时，逐字这件事无法复用、无法并行，比较的总量随模式数线性膨胀。
  choice: 用多项式滚动哈希把窗口映射为指纹：窗口滑动时指纹在 O(1) 内删头添尾，指纹不等即剪掉整个窗口，指纹相等才逐字验证。替代方案是逐模式各跑一遍 KMP 或 BM，保证硬但总成本随模式数成倍增长，且没有可复用的中间表示。
  tradeoff: 正确性从必然降级为高概率：碰撞带来额外验证，对手构造数据时可退化到 Θ(nm)，与哈希表在洪水攻击下的退化同源；多模式与可并行的好处，则要等模式成规模时才真正显形。
  root: 这是随机化交易的又一次现身：用一份可计算的摘要替代昂贵的原物比较，用小概率的误差换结构上的简洁与并行度。哈希表、布隆过滤器、Rabin-Karp 排成一列，问的都是同一个问题——当验证的代价必须摊薄时，我们愿意为「可能看错」付出多少保费。
