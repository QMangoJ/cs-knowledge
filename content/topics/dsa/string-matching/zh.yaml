prereq: [dsa/greedy]
objectives:
- 手算模式 ABABCABAB 的前缀函数 π，并用它完成一次 KMP 扫描
- 构造朴素法的最坏输入，并用摊还账解释 KMP 为何是 Θ(n+m)
- 说清 BM 坏字符规则的跳步原理与它的最坏退化
- 按保证硬度、字母表与模式数量为具体场景选定算法
aiLink: 字符串匹配是文本类 AI 管线的地基：分词前的词表匹配、敏感词过滤用的 AC 自动机、检索增强里在语料中定位引用原文，都还是本课这套算法在服役；连分词器内部的词典最长匹配，也可以看作多模式匹配的一个变体。
