  log:
  - mode: Naive method
    event: "The naive method is done: a mismatch slides it one cell to the right, all the character information already verified is voided, and all the repeated labor comes from exactly this."
  points:
  - The worst-case input is not contrived at all — repetitive text plus a near-repetitive pattern is enough
  - The essence of the waste is repeated labor — the same text character compared again and again
  mistake: "Thinking Θ(nm) is only a theoretical worst case that never shows up in practice: repeated stretches are the norm in logs, binary data, and genetic data, not an extreme constructed for the occasion."
- id: waste
  title: "The pathology of the waste: the information thrown away at a mismatch is, in fact, ready-made knowledge"
  tldr: "The naive method's bill is expensive because of repeated labor. This step zooms in on one mismatch: the stretch of prefix that matched before the mismatch has, in fact, already told us a stretch of the text's content. See clearly what this thrown-away knowledge can be cashed in for, and the starting points of the algorithms that follow all fall into place."
  body: >-
    Zoom in on the mismatch at shift 0. The first four characters of the pattern ABABC matched the text, and the fifth character mismatched. At this moment we actually hold a piece of certain knowledge in our hands: the four characters of the text starting at index 0 are exactly ABAB. After the naive method slides right to shift 1,
    it starts comparing again from the pattern's first character — acting as if this knowledge did not exist.

    Yet this knowledge plainly can be used. If we knew the pattern's own structure in advance — for example, that in the prefix ABAB, "AB" is both its prefix and its suffix — then sliding right would not have to mean moving only one cell: at shift 1 the text starts with B, which is impossible (we already know it is A); at shift 2
    the text starts with the already-known third character A, and AB is already aligned before it, so we can pick up comparing directly from the pattern's third character. Every skipped shift and every skipped comparison is cashed in out of this one piece of knowledge.

    This leads to the central idea of this lesson: optimizing string matching is, at bottom, encoding "the information obtained for free in the course of comparing" and using it repeatedly. Analyzing the pattern itself (which prefixes coincide with which suffixes, where each character occurs) yields [[KMP]] and
    [[Boyer-Moore]]; maintaining an incrementally updatable summary of the text window (a hash fingerprint) yields [[Rabin-Karp]]. The preprocessing is almost always added on the pattern side, because the pattern is short and chosen by us, while the text is long and often only arrives at run time.

    One more boundary to draw in advance: preprocessing costs time and space proportional to the length of the pattern. If the text is only a few dozen characters and is searched just once, the naive method has the lowest total bill after all. Every "faster algorithm" is faster relative to some usage scenario; the last step of this lesson will do the full choosing account.
