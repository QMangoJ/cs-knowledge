  - mode: Engineering
    event: "Engineering reality boils down to one line: complexity is responsible for screening out errors of order of magnitude, and the ranking of implementations of the same order of magnitude is decided by constants and cache behavior."
  points:
  - Two-Way is the product of a three-way compromise among guarantee, space, and implementation
  - "The question to take away: what information, already paid for, am I throwing away?"
design:
- mechanism: KMP precompiles the pattern's self-overlap into the prefix function π — during the scan the text pointer only moves forward, never back, and every mismatch jump is decided by this table, which has nothing to do with the text
  problem: "The naive method's waste is informational: at every mismatch, we have in fact verified a stretch of the text's content with our own hands, yet there is no mechanism to keep that verification result, so the next attempt can only start from zero. As long as the text pointer still retreats to compare again, the worst-case complexity is locked at product scale."
  choice: "The object of preprocessing is the pattern, not the text: the pattern is short, under our control, and reusable again and again; π encodes the degree of self-overlap of every prefix of the pattern in full, and the new alignment that a mismatch jumps to by π is mathematically guaranteed to miss no hit. An alternative such as preprocessing the text into a suffix structure suits scenarios where the text is fixed and many different patterns are searched against it, but it is out of the question for one-off streaming text."
  tradeoff: π is valid for a single pattern only — change the pattern and it must be recomputed, and multi-pattern scenarios must upgrade to the Aho–Corasick automaton; and π's recursion and fallback chain are notoriously easy to write wrong, with boundary cases needing dedicated tests. What it buys in return is the hard Θ(n+m) guarantee and the ability to process a stream online.
  root: "This is an insight in the style of conservation of information: information that has been compared does not disappear — the only question is whether it has been encoded. π is the smallest complete encoding of the knowledge 'the pattern's self-overlap', and the monotonicity of the text pointer is that knowledge cashed in directly — the same trade as DP storing the answers to subproblems in a table."
- mechanism: Boyer-Moore's bad-character jump — compare from the right end, and on a mismatch use the last occurrence, in the pattern, of the text character revealed to decide the shift amount, so that even one mismatch buys several steps forward
  problem: KMP guarantees linearity, yet it still has to look at every character of the text one by one. But in scenarios with long patterns and a large alphabet, most characters have nothing to do with the pattern at all, and looking at every one of them is itself the waste; the text character seen at the very moment of a mismatch carries far more information than just "not equal".
  choice: "Reverse the direction of comparison, and let the mismatching character price the jump: if the character is not in the pattern, jump the whole length past it; if it is in the pattern, align it with its last occurrence. The alternative, KMP, advances character by character — a strong guarantee but large constants; the alternative vectorized naive method eats constants with hardware width and is extremely strong on short patterns, but falls back to product-scale risk on long patterns and repetitive text."
  tradeoff: "With only the bad-character rule, the worst case degenerates to Θ(nm); shoring it up with the good-suffix and Galil rules buys linearity back, at a marked rise in implementation complexity; and the smaller the alphabet, the shorter the jumps — in four-character scenarios like DNA, the advantage shrinks drastically. What it buys in return is a sublinear performance of about n divided by m
    comparisons in the best case, and the measured speed of editor-grade tools."
  root: It rewrites how we think about the size of the input — the running time need not be proportional to the length of the input, and an algorithm can skip input it has never looked at and still reach a correct conclusion, provided its structural knowledge of the pattern is enough to guarantee that the skipped parts cannot possibly hit. KMP makes full use of the information already seen; BM replaces even the unseen information with knowledge of the pattern.
- mechanism: Rabin-Karp's rolling fingerprint — compress every text window into a numerical value that can be updated incrementally, compare fingerprints before characters, and allow fingerprint matching against several patterns at the same time
  problem: The cost of character-by-character comparison comes from the granularity of the character itself; when there is more than one pattern, or the text must be split up and processed in parallel, comparing character by character can be neither reused nor parallelized, and the total amount of comparison inflates linearly with the number of patterns.
  choice: Map the window to a fingerprint with a polynomial rolling hash — as the window slides, the fingerprint drops its head and adds its tail in O(1); differing fingerprints prune the whole window at once, and only equal fingerprints are verified character by character. The alternative is running KMP or BM once per pattern — hard guarantees, but a total cost that multiplies with the number of patterns, and no reusable intermediate representation.
  tradeoff: Correctness is downgraded from certain to highly probable — collisions bring extra verifications, and opponent-constructed data can make it degenerate to Θ(nm), of the same origin as a hash table's degeneration under a flooding attack; the benefits for many patterns and parallelism only truly show themselves once the patterns reach scale.
  root: "This is the randomized trade appearing once more: replace the expensive comparison of originals with a computable summary, and trade a small probability of error for structural simplicity and parallelism. Hash tables, Bloom filters, and Rabin-Karp
    line up in a row, all asking the same question — when the cost of verification must be spread thin, how much of a premium are we willing to pay for 'possibly seeing it wrong'?"
level: 进阶
minutes: 32
prereq:
- dsa/greedy
objectives:
- Compute the prefix function π of the pattern ABABCABAB by hand, and use it to complete one KMP scan
- Construct the naive method's worst-case input, and explain with the amortized account why KMP is Θ(n+m)
- Explain the jump principle of BM's bad-character rule and its worst-case degeneration
- Choose an algorithm for a concrete scenario by hardness of guarantee, alphabet, and number of patterns
aiLink: String matching is the foundation of text-oriented AI pipelines — vocabulary matching before tokenization, the Aho–Corasick automaton used in sensitive-word filtering, and locating quoted original text in a corpus for retrieval augmentation are all still served by this lesson's family of algorithms; even the dictionary longest-match inside a tokenizer can be seen as a variant of multi-pattern matching.
