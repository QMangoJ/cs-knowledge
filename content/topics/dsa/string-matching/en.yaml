  - The Aho–Corasick automaton is the multi-pattern generalization of the π idea
- id: practice
  title: "Engineering reality: what is actually running inside the standard libraries"
  tldr: "Finally, open a standard library and look at reality: none of the textbook's four algorithms holds the main seat. This step looks at the combined strategies two standard libraries actually use, then does the account of how, for short patterns, a vectorized naive method wins on constants — complexity screens out errors of order of magnitude, and among the same order of magnitude, constants decide the ranking."
  body: >-
    Open a standard library and look, and you will find that none of the textbook's big four holds the main seat. [[glibc]]'s [[strstr]] and [[memmem]] use the [[Two-Way|Two-Way 算法]] algorithm: it cuts the pattern into a left and a right segment, compares the right segment first and then the left, and uses the properties of the [[critical factorization|临界分解]] to guarantee Θ(n+m) time with only O(1)
    extra space — the product of a three-way compromise among "hardness of guarantee, space, and implementation complexity". The standard libraries of languages like Rust and Go combine several strategies in their implementations, switching among the naive method, the [[BM|Boyer-Moore]] family, and the hash family according to the scale of the pattern and the text.

    Another counterintuitive fact is the naive method's strength on short patterns. A modern CPU can compare 16 to 32 bytes in parallel with a single vector instruction; the naive method only has to find "the positions where the first character occurs" with a vector instruction first (such as [[memchr]]), then verify the few candidates character by character, and its actual speed often beats a [[KMP]] with many branches and large constants.
    Asymptotic complexity counts only the order of magnitude of the number of operations, not the real cost of each step or the cache behavior; when n is not large and the pattern is short, constants and vectorization call the shots. This does not overturn this lesson's analysis — it is a reminder: complexity is for screening out errors of order of magnitude, not for ranking implementations of the same order of magnitude.

    Wrap this lesson up. All progress in string matching comes from one thing: not wasting what you already know. Hash tables trade precomputation for queries, binary search trades sortedness for comparison counts, DP trades a stored table for repeated computation — and they, like KMP storing the pattern's self-overlap as
    [[π|π 函数]], are one and the same trade. What you should really take away is not any one algorithm but a question: in this piece of work, what information have I already paid to obtain — and am throwing away as I go?
  derivation: original
  sources:
