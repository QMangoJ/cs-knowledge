- id: bm-idea
  title: "[[Boyer-Moore]]: compare from right to left, and let one mismatch buy a big step"
  tldr: "[[KMP]] makes each character be compared at most a constant number of times; this step takes a completely opposite route: after aligning, compare from the end of the pattern forward, and let the text character revealed at a mismatch decide how far to jump. First, how the [[bad-character rule|坏字符规则]] lets one mismatch buy a big step; then, where the worst case degenerates to if you rely on it alone."
  body: >-
    In 1977, Boyer and Moore
    gave an algorithm whose thinking is completely different. After pasting the pattern onto the text in alignment, it compares not from the left end but from the end of the pattern, working forward. The reason is very practical: if the very first character at the end already mismatches, we learn in one go what the text's character at that position is, and that character can tell us how far the pattern should jump.

    The jump is given by the bad-character rule: suppose the text character revealed at the mismatch is c. If c does not occur in the pattern at all, then no alignment that shifts the pattern by only a cell or two while still letting c fall inside the pattern's span can possibly hit, so the pattern can jump its whole length past the position of c — one mismatch buys at most m steps forward. If c
    does occur in the pattern, slide the pattern right so that c aligns with its last occurrence in the pattern, and compare on from there. There is also a [[good-suffix rule|好后缀规则]], which handles the case of "a suffix matched for a stretch before mismatching" and takes the largest shift compatible with the suffix already matched; real implementations mostly take the larger of the jumps the two rules give.

    The effect is extreme on large-alphabet material like English text: the longer the pattern and the larger the alphabet, the higher the probability that the mismatching character is not in the pattern, and the closer the jump gets to the pattern's whole length — in the best case, the number of character comparisons is only of the order of n divided by m, and the great majority of text characters are never looked at at all. This is in sharp contrast with KMP: KMP compares each character at most a constant number of times, while [[BM|Boyer-Moore]] gives a great many characters zero comparisons in the best case.

    The price must be stated clearly too. With only the bad-character rule, suitably constructed repetitive text can make BM degenerate to Θ(nm); adding the good-suffix rule and the [[Galil rule|Galil 规则]] brings the worst case back to linear, but the implementation complexity rises markedly. The [[Horspool]]
    simplification more commonly used in engineering keeps only the bad-character idea, trading the worst-case guarantee for implementation simplicity and measured speed; the classic implementations of tools like [[grep]] mostly come from this family.
  derivation: original
  sources:
