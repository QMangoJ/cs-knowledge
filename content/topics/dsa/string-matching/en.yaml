  log:
  - mode: Computing π
    event: "The prefix function is computed: extension first, fallback on failure — computing the table and scanning share the same set of jump moves."
  points:
  - π[q] is decided by the pattern alone — compute it once, use it for the whole scan
  - When an extension fails, fall back along the π chain instead of trying hard from scratch
  mistake: "Understanding π as a table to memorize by rote: it is the result of the pattern matching itself — when computing it by hand, keep your eyes on just one thing, 'can the current longest overlap be extended?'"
- id: kmp-scan
  title: "A worked scan: the text pointer walks straight ahead, and hits at index 10"
  tldr: "The table is computed; now use it to scan the running example's text for real. This step watches the two pointers: the text pointer walks only forward, and the pattern pointer jumps by the table on a mismatch. Follow the whole trip through, and see how the hit is reported — and what to do after a hit if you want to keep looking for the next one."
  body: >-
    Now take the computed [[π|π 函数]] and scan the text ABABDABACDABABCABAB. Maintain i pointing at the text and j giving the aligned length of the pattern. Starting at text index 0, A, B, A, B match four times in a row and j rises to 4; text index 4 is D, and the pattern's fifth character is
    C — a mismatch. By the rules, do not retreat i; let j jump to π[4], which is 2 — meaning that in the verified ABAB, the suffix AB coincides with the prefix AB, so compare the pattern's third character A directly against the D at text index 4: still a mismatch. Jump again to π[2], which is 0, and compare the pattern's first character A
    against D: still a mismatch, j returns to zero, and only then does i advance by one. This whole chain of jumps completes at one and the same text position, and every shift skipped was proved impossible by π.

    From there the scan advances along the text: starting afresh from the A at index 5, A, B, A match three in a row; the C at index 8 mismatches the pattern's fourth character B, and j falls back by π from 3 to 1, then to 0; only when this position is exhausted does i advance. The D at index 9 again does not match the pattern's first character, and only at index 10 does it line up again. From there, A, B, A, B, C, A, B, A, B — nine characters match in a row to the end, j fills up to
    9, and the reported shift is i minus 9 plus 1 — that is, index 10, agreeing with the answer found by eye. After a hit, if you want to keep looking for the next one, just let j jump to π[9], which is 4, and scan onward — even overlapping hits will not be missed.

    Count the comparisons on this trip: i walked from 0 to 18 without a single step back, and every fallback of j was accompanied by real alignment growth before it, so the whole trip's comparisons are a constant multiple of the text length rather than a product. The entire difference lies in those shifts skipped by π. The next step makes this account rigorous: why the total number of j's fallbacks cannot exceed the total number of its rises.
