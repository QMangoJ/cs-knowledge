- id: kmp-idea
  title: "[[KMP]]'s idea: how far the pattern slides right depends only on the pattern itself"
  tldr: "For knowledge to be kept and used, you first have to know the pattern's own structure. This step sets up KMP's core idea: how far the pattern should slide right at a mismatch depends only on the already-matched prefix's own overlap structure and has nothing to do with the text, so it can be computed in advance into a table. First the reasoning behind the slide amount; the next step computes the table by hand."
  body: >-
    KMP was given by Knuth, Morris, and Pratt in 1977, and its idea compresses into one sentence: when a mismatch occurs, how far the pattern should slide right depends only on the pattern's own overlap structure and has nothing to do with the text, so it can all be computed once, in advance.

    Suppose that when the mismatch occurs, the first k characters of the pattern have already matched (these k characters are, at the same time, the content of the corresponding stretch of text). For the next attempt to line up, some prefix of the pattern must coincide with some suffix of these k characters — because that stretch of text is already fixed as exactly these k characters. If the longest "proper prefix that is also a proper suffix" of the pattern's first k
    characters has length L, then sliding the pattern right by k minus L aligns the first L characters naturally, and comparing can resume directly from the L plus 1-th
    character. The slide amount is thereby completely determined, and it is guaranteed not to skip any possible hit: any smaller slide would mean requiring a longer overlap to exist, contradicting the maximality of L.

    Computing each k's corresponding L in advance into a table is the [[prefix function|π 函数]] π: π[q] gives the length of the longest proper prefix–suffix match of the pattern's first q characters (q counted from 1). The scan maintains two pointers: the text pointer i only walks forward, and the pattern pointer j
    gives the length currently aligned; when characters are equal, both advance together; on a mismatch, i does not retreat — instead j jumps to [[π|π 函数]][j] and comparing continues, until j falls to zero or a character matches.

    So KMP's skeleton is: first "match" the pattern against itself to compute π, then match the pattern against the text for real. The next step walks the computation of π through in full on the running example.
