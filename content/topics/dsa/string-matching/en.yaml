steps:
- id: problem
  title: "The problem: the text is long, the pattern is short, and every position must be found"
  tldr: "Pin the problem down first: the text is long, the pattern is short, and we want every starting position where the pattern occurs in the text. This step fixes the notation for text, pattern, and shift, then gives the example that runs through the whole lesson — every algorithm that follows runs on the same text and pattern, so their accounts are comparable."
  body: >-
    Pin the problem down first. The text T is a string of characters of length n, and the pattern P is a string of length m, with m usually far smaller than n. The task is to find every shift s such that the m characters of T starting at s are character-for-character identical to P. Shifts are counted from 0 — the convention this lesson uses throughout.

    This problem is the kernel of functions you use every day: finding a word in an editor, [[grep]]-ing an error code in a log, locating a base sequence in a genome. Their common shape: one enormous, read-only text; one small pattern to be compared against it again and again; and "position" as the output.

    Here is the example that runs through the whole lesson. The text is ABABDABACDABABCABAB (length 19), and the pattern is ABABCABAB (length 9). The pattern occurs in full at index 10: the nine characters starting there are exactly
    ABABCABAB. No other position lines up. What an algorithm has to do is make this "scan it once by eye" business fast and reliable.

    Measuring algorithms of this kind means watching two accounts at once: how many character comparisons are made (which decides the scanning cost), and how much preprocessing is paid up front for that (which decides the startup cost). Every algorithm that follows makes a different trade between these two accounts, and the naive method chooses to optimize neither.
