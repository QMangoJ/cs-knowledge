- id: rk-automaton
  title: "Two other routes: [[rolling hash|滚动哈希]] and [[finite automata|有限自动机]]"
  tldr: "Besides comparing character by character, there are two routes that change the granularity. This step looks first at the rolling hash: compress the window into a fingerprint that updates as it slides — compare fingerprints first, then verify against the original text. Then the finite automaton: precompute the next step for every situation, dead and fixed — and note that the [[prefix function|π 函数]] is, in fact, a compressed version of that transition table."
  body: >-
    The third way of encoding information is to change the granularity of comparison. [[Rabin-Karp]] no longer compares character by character; instead it first computes the pattern into a number (a fingerprint), then maintains the fingerprint of every length-m
    window of the text. If two fingerprints differ, the window cannot possibly hit; only when the fingerprints are equal does it verify character by character, as a fallback. The key is that the fingerprint must update in a rolling fashion: when the window slides one cell right, drop the old character in the highest place, shift the remaining places left, and add the new character — with a polynomial hash this completes in O(1), so the expected cost of the whole scan is
    Θ(n+m).

    Its account carries probability: fingerprint collisions bring pointless character-by-character verifications; with a well-chosen hash the expectation is extremely low, but an opponent can construct data that makes it degenerate to
    Θ(nm) — the same origin as a hash table's degeneration under a hash flooding attack. What it buys in return is structural: several patterns can have their fingerprints computed at once and be matched in parallel, and fingerprints can be taken directly to duplicate checking and fingerprint deduplication. This line of thinking is everywhere — in plagiarism detection, file deduplication, and git's object identification.

    The fourth is the theoretically tidiest method, the finite automaton: build a state machine for the pattern in advance, where state q means "the first q characters of the pattern are already aligned", and precompute the transition for every state and every possible input character. The scan then passes the text once, looking up the table once per character, for a steady Θ(n); the price is a transition table of size m
    times the alphabet size, and preprocessing that is both expensive and space-hungry.

    Put it side by side with [[KMP]]: KMP's [[π|π 函数]] function is, at bottom, exactly a compressed encoding of this automaton's transition table — π stores only the one key column of information, "which state to return to on a mismatch", compressing the whole table's space from m times the alphabet size to
    m. The two algorithms are two storage formats for one and the same idea: one spreads the knowledge out and stores it all; the other stores only the part that gets used.
  derivation: original
  sources:
