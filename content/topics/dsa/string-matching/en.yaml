- id: kmp-complexity
  title: "Where the complexity comes from: the amortized account — total fallbacks are capped by total advances"
  tldr: "The scan is walked through; this step makes the total account rigorous: every rise of the pattern pointer corresponds to the text pointer advancing one step, so the total of its fallbacks over its whole life is capped by the total of its rises. First settle this amortized account, then look back at why the naive method cannot amortize its way to this bound."
  body: >-
    [[KMP]]'s Θ(n+m) is not an intuition you count your way to — it is an amortized account that can be settled precisely. Look first at the pattern pointer j. It moves in two ways: it adds one on a successful comparison, and on a mismatch it jumps back by [[π|π 函数]] to a smaller value. The key property: every time j rises by one, it corresponds to the text pointer i having walked at least one step forward; i walks at most n
    steps on the whole trip, so the total rise of j does not exceed n.

    The fallback side's account is capped by the rise side. Over the whole trip, j's value starts at 0 and is always non-negative, so the total of all its decreases cannot exceed the total of all its increases (otherwise it would fall below 0). The total number of mismatch jumps is therefore also bounded by n. The character comparisons that actually happen in the scan split into two parts — one part corresponding to j rising, the other to j falling back — and each part is capped by n, for a total of Θ(n). By the same reasoning, computing π totals Θ(m). Adding the two accounts gives KMP's Θ(n+m), and the extra space is only the π table itself, Θ(m).

    This bookkeeping method — "using the rise and fall of a [[potential|势能]] to cap operations" — is called [[amortized analysis|摊还分析]], and it will keep appearing across this site: the accounts of dynamic-array resizing, hash tables, and union-find are all settled the same way. When you see a structure that is "expensive once, cheap overall", ask first what its potential is and how its rises and falls offset each other, and you will usually have found the entrance to the proof.

    Why can the naive method not amortize its way to this bound? Because it has no "saved-up progress" like j — at every mismatch it zeroes the progress out and starts over, the text pointer even retreats to compare again, and the decreases are simply not constrained by the increases, so the account naturally blows up to product scale. All of KMP's work goes into finding progress a way of being stored that does not evaporate into thin air.
  derivation: original
