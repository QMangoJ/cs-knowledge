- id: naive
  title: "The naive method: compare from scratch at every shift, and the worst-case bill is a product"
  tldr: "Look at the most naive approach first: compare character by character, shift by shift, and on a mismatch move the whole pattern one cell to the right. This step does its account in two cases — good luck and bad luck — then constructs a worst-case input and shows why every shift has to be compared up to the pattern's last character before the mismatch shows."
  body: >-
    The naive method (also called [[BF]], Brute Force) has no tricks in its rules at all: starting at shift 0, compare the pattern character by character against the corresponding stretch of text; if everything matches, report that shift; as soon as one character mismatches — or once a hit has been reported — slide the whole pattern one cell to the right and start comparing again from the new shift's first character.

    Its bill is computed in two cases. With good luck (the text and the pattern have nothing to do with each other), each shift mismatches after one or two characters and is done, for about n comparisons in total. With bad luck it is completely different: construct the text as n consecutive a's, and the pattern as m minus 1 a's plus one b. At every shift, the first m minus 1
    characters all match and only the last character mismatches, so every shift pays m comparisons, and the total bill is (n−m+1) times m — of the order Θ(nm). An all-a text is not at all rare in reality: the long runs of spaces and zeros in logs, the large stretches of padding in binary files, and the long repeated segments in [[DNA]]
    sequences are all like this.

    Back on the running example, the naive method at shift 0 compares ABAB and then runs into D mismatching C — four comparisons wasted; slide one cell to the right and start from B, and the very first character mismatches; and so it inches along until shift 10
    before it hits. The total comparisons it makes are far more than the length of the text, and the excess is all repeated labor — "the same text character compared again and again".

    See the waste clearly: when it mismatches at shift 0, we have actually verified with our own hands the piece of information "the first four characters of the text are ABAB" — yet after sliding, the naive method forgets this information completely. All the room for improvement is hidden in this forgetfulness.
