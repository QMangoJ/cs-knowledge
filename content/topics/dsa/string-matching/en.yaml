id: dsa/string-matching
subject: dsa
slug: string-matching
order: 10
status: published
license: CC-BY-4.0
title: "String Matching: Learn the Pattern Through and Through, and Let the Text Pass Only Once"
summary: Find a short pattern in a long text. The naive method throws away everything it has already compared; KMP (the Knuth–Morris–Pratt algorithm) precompiles the pattern's self-overlap into the [[π|π 函数]] array, and [[Boyer-Moore]] manages to not even read the text character by character.
premise: Searching for a word in an editor, or for a keyword in a log — at bottom, both are finding where a small piece of pattern occurs in a long stretch of text. Comparing position by position by brute force does find it, but it gets very slow once the text is long. This lesson looks at how to keep the information already compared and put it to use, so the text passes only once as far as possible. The running example is finding the pattern ABABCABAB in the text ABABDABACDABABCABAB.
position: The greedy lesson dealt with making irrevocable choices within a set of candidates; this lesson turns its gaze inside one fixed text — the pattern is short, the text is long, and the task is to find every position where the pattern occurs. It forms a new section of its own, "Patterns in Strings", and it is also the final stop of the data structures and algorithms subject. After this lesson you will be able to compute a pattern's [[prefix function|π 函数]]
  π by hand, explain how the naive method's worst-case complexity is constructed, and choose between KMP and Boyer-Moore according to the alphabet size and the worst-case guarantee you need.
bridge:
  prev: The previous lesson's greedy approach fixed each step for good and never looked back, saving the dynamic-programming table; the naive matching in this lesson stands exactly on the opposite side — at every mismatch, it throws away the whole stretch of information it just compared and starts over from the next position. See clearly what this waste looks like first, and you will know what the preprocessing has to buy.
  next: Each of the previous ten lessons ground out a fast solution for its problem; the closing lesson changes the question — for problems like the traveling salesman and course scheduling, why might there be no fast algorithm at all?
overview:
- key: In one sentence
  value: All progress in matching comes from one and the same thing — keeping the information already compared and putting it to use. The naive approach throws away all previous comparison results at every mismatch and starts over; better algorithms encode that known information into a table or a rule, and on a mismatch jump straight to the next possible position.
- key: The naive method's account
  value: The naive method's worst case is Θ((n−m+1)m), and a worst-case input is easy to construct on the spot — for example, a text of all a's paired with a pattern of a…ab. On such an input, every position has to be compared up to the pattern's last character before the mismatch shows, and almost no comparison is ever saved.
- key: KMP's approach
  value: "[[KMP]]'s approach is to preprocess the pattern's self-overlap to obtain the [[prefix function|π 函数]] π; the text pointer only moves forward, never back, and the total complexity is Θ(n+m). On a mismatch there is no going back to the original place to compare again — look up the π table and you know how far the pattern should slide forward, and the part already matched is used directly from where it left off."
- key: BM's approach
  value: "[[BM|Boyer-Moore]]'s approach is to compare from right to left and let the mismatching character decide the jump; in the best case it needs only about n/m comparisons. Because the comparison starts at the end, the text character revealed by a mismatch can often rule out a whole stretch of alignments at once, and the pattern can jump several cells in one go."
- key: The hashing approach
  value: "[[Rabin-Karp]] turns the window into a fingerprint that can be updated in a rolling fashion, and it has the edge in multi-pattern and parallel scenarios. It compares fingerprints first and verifies against the original text only after that; when the window slides, the fingerprint only needs the first character removed and the new character added to update — there is no recomputing the whole stretch at every step."
- key: Choosing
  value: For a worst-case guarantee, choose KMP; for average speed, choose a BM variant; for many patterns, choose the [[Aho–Corasick automaton|AC 自动机]]. When choosing, look first at what you are afraid of — if you fear being occasionally very slow, pick the one with a worst-case guarantee; if you hold a whole batch of patterns to find at once, do not scan the text once per pattern.
