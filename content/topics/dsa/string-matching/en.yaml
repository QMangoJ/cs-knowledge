  log:
  - mode: KMP idea
    event: "KMP's idea is set up: the slide amount is decided by the pattern's self-overlap alone and has nothing to do with the text, so it can be computed in advance."
  points:
  - π is the complete encoding of the knowledge "how much the pattern overlaps itself"
  - The text pointer never retreats — the source of all of KMP's efficiency
- id: lps-table
  title: "Computing π by hand: the [[prefix function|π 函数]] of the pattern ABABCABAB"
  tldr: "The last step said the slide amounts can be computed in advance into a table; this step computes that prefix-function table character by character for the running example's pattern: extend by one when it connects, and when it does not, fall back along the values already computed and try again. When you are done, note the character that zeroes out the overlap — it is the key to understanding the scan's jumps later."
  body: >-
    The subscripts of the prefix function [[π|π 函数]] start at 1: π[q] is the length of the longest "proper prefix equal to a proper suffix" among the pattern's first q characters. A single character has no proper prefix at all, so π[1] is always 0. Compute it below, one by one, for the pattern ABABCABAB (indices 0 to 8).

    The first four characters, ABAB: A is 0; AB has no overlap, 0; ABA has A at both head and tail, giving 1; ABAB has AB at both head and tail, giving 2. The fifth character, C, arrives and the prefix becomes ABABC: try attaching C after the overlap of 2 in ABAB — the pattern's third character is A
    rather than C, so it does not connect; fall back along π, trying overlap lengths of 0 in turn — attaching C after the empty overlap still does not give the prefix's first character A, and in the end π returns to 0. This 0 matters a great deal: it declares that C zeroes out all the overlap accumulated so far — in the pattern, C is a "break point".

    In the second half, ABAB takes shape again: ABABCA has A at both head and tail, giving 1; ABABCAB has AB at both, giving 2; at eight characters the head and tail are ABA, giving 3; at nine characters the head and tail are ABAB, giving 4. In the end, π runs 0, 0, 1, 2, 0, 1, 2, 3, 4.

    The key points of the computation: when computing π[q], always try first to extend π[q−1]; when extending fails, fall back along the π chain and try shorter overlaps, until one connects or it reaches zero — this is the very same set of moves as the mismatch jump during scanning, which is why computing π is said to be running [[KMP]] with the pattern against itself. Also, no value of π
    exceeds the previous value plus one — that cap on growth will appear in the next step's complexity proof.
  derivation: original
