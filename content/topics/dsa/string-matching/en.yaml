  - π is a compressed storage of the automaton's transition table, not a different kind of magic
- id: choose
  title: "Choosing: the territory of each of the four algorithms"
  tldr: "All four algorithms have been seen; this step does the choosing account by scenario: do you fear the worst case, how big is the alphabet, is there one pattern or ten thousand, and does the text arrive in one whole piece or as a stream? Go through the four dimensions one by one, and each algorithm's territory is drawn clearly."
  body: >-
    Do the choosing account by scenario. The first dimension is the hardness of the guarantee: when the data is constructed by an opponent, or the system has a hard requirement on tail latency (intrusion detection, streaming filtering), a worst case of Θ(nm) is unacceptable, and [[KMP]]'s Θ(n+m) guarantee is exactly what you are buying it for. The second dimension is the alphabet and the pattern length: on English text with a long pattern, [[BM|Boyer-Moore]]'s
    jump gains are the largest, and the measured champions among editor and [[grep]]-like tools have long been BM variants; conversely, in a four-character alphabet like [[DNA]]'s, the bad character almost always occurs in the pattern, BM cannot jump, and KMP or [[bit-parallel|位并行]] algorithms are steadier.

    The third dimension is the number of patterns. To find ten thousand keywords at once (sensitive-word filtering, virus signature databases), running KMP pattern by pattern means ten thousand scans; the [[Aho–Corasick automaton|AC 自动机]] compiles all the patterns into one [[trie|字典树]] with mismatch jumps, and the text passes once to report every hit — it is exactly the generalization of KMP's [[π|π 函数]]
    idea to many patterns. The fourth dimension is how the text arrives: when the text arrives block by block as a stream and cannot be read back, only the KMP family and the automaton family — whose pointers move monotonically forward — can process it online; BM's right-to-left comparison needs random access to the window and does not suit a pure stream.
