      - "Insert one by one: saves memory, more comparisons"
      - "Concatenate + heapify: fewer comparisons, needs a new array"
      - "Frequent merging: switch to a mergeable heap"
  log:
  - mode: Trade-off
    event: "The merging bill is settled: a binary heap reserves no structural interface for merging, and scenarios with frequent merging should switch to a mergeable heap."
- id: engineering
  title: Priority queues in practice
  tldr: "Finally, the engineering floor: schedulers, timers, and picking the ten largest out of a flood of data all run on the same heap underneath. This step matches each use to its place, then names what a heap cannot do — look up an arbitrary element by value, delete a middle element, traverse in full order — so you do not reach for it for a job it should not do."
  body: >-
    React's scheduler manages tasks by expiry time in a min-heap. To find the 10 largest out of a flood of data, keep a min-heap of size 10 (the heap top is the smallest of those 10; replace it only when a new element is larger than it) — no need to sort everything. Walk this once with numbers: the stream brings 42, 7, 19, 88, 3, 56, 24, 71, 9, 31, 60, 15 in turn. The first ten all go into the heap; at that point the heap top is 3, the smallest of the ten. The eleventh, 60, is larger than 3 — pop the 3, put in the 60, and the heap still holds the ten largest seen so far. The twelfth, 15, is larger than the heap top at that point, 7 — replace the same way. From then on, any number smaller than the heap top is skipped outright and never enters the heap. However long the stream runs, the heap's size stays constant at 10 — which is why it dares to handle a flood of data. JS has no built-in heap, so you write one yourself or use a library; Java has
    [[PriorityQueue]] and Python has [[heapq]]. Timer wheels, request priorities, and [[Top-K|Top K]] retention are all direct heap applications: retaining the largest K elements uses a min-heap of size K, with memory constant at K.


    The selection boundary: a heap does not support looking up an arbitrary element by value (only a linear scan), nor efficient deletion of a middle element; it suits only scenarios where elements enter and leave at the heap top. When rankings must be changed at any time, key changes or lazy deletion fill in (previous section); when a full-order traversal is needed, switch to a balanced tree.
  derivation: original
  sources:
