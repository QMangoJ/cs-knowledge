level: 进阶
minutes: 28
prereq:
- dsa/merge-quick-sort
objectives:
- Compute parent/child positions from a complete binary tree's array indexes
- Describe how sift-up and sift-down restore heap order
- Explain why building a heap is O(n) rather than O(n log n)
aiLink: A priority queue is the scheduler's heart — inference services' request priority queues, timers, and event loops all rely on heaps to take the extreme value in O(log n); beam search keeps its top-k candidates at every step, often with the help of a heap or partial sorting. Understand heaps, and you understand how these systems queue.
design:
- mechanism: A complete binary tree's level order and its array indexes correspond one to one — a parent's and its children's positions can all be computed on the spot with arithmetic like 2i plus 1, 2i plus 2, and (i minus 1) divided by 2. The tree structure is encoded into the indexes themselves, with no extra storage needed.
  problem: Store the tree with pointer nodes instead, and every node carries extra pointers for its left and right children (often its parent as well) — memory swells, the nodes scatter across the heap, and walking a sift-up or sift-down path becomes one cache miss after another.
  choice: Force the tree to keep a complete binary shape (new elements may only fill the end; deletions may only touch the end), trading shape discipline for index arithmetic — finding a relative is a constant-time computation, all elements crowd into one contiguous array, and a sift-up or sift-down path mostly hits the same batch of cache lines along the way.
  tradeoff: The price is that the shape cannot grow freely — you cannot add nodes on one side only, the way an ordinary binary search tree does, nor merge two heaps efficiently; when those operations are needed you must switch to a mergeable heap, and hand back the array storage and cache-friendliness dividends along with it.
  root: The root is that information can be stored in position — when the structural rules are regular enough, position itself is the index, and storage and computation can be exchanged for each other. The heap uses the most regular tree shape to trade pointer overhead for arithmetic overhead, buying cache-friendliness along the way — the underlying reason it is cheap.
- mechanism: Heap order constrains parent–child pairs only, so the whole tree forms just a partial order — the path from the root to any node is monotone, but no order is established between different subtrees. The structure maintains far less information than a complete sort, so an update has far fewer constraints to repair.
  problem: A scheduling scenario needs only one extreme value each time; maintaining a total order means paying continuously for ordering information that is never used — every insertion must find its exact position in the total order and maintain all the neighboring relations, and the cost cannot be pressed down. Pure waste.
  choice: Pin down only the heap top — insertions and deletions repair the partial order along a single root-to-leaf path and touch no other node. When the k-th largest or the median is needed, do not force it on the heap; pair structures instead — for example, maintain the median with two heaps facing each other.
  tradeoff: The price of giving up the total order is incomplete capability — lookup by value, deleting an arbitrary element, and ordered traversal all degenerate to linear or cannot be done at all, so a heap can serve only as a priority queue and cannot pose as an ordered container; the operation inventory must be confirmed before choosing it.
  root: The root is the exchange rate between information and cost — the stronger the information a data structure maintains, the more constraints every update must repair. The heap trims its information down to just the extreme value being reachable, which is what presses the update cost down — the same principle by which every specialized structure beats a general one.
- mechanism: Bottom-up heap building settles its total work by height — about half the nodes are leaves, at zero cost; each additional level of height halves the node count while at most doubling a single sift-down's cost, so the levels' totals are pressed by a geometric series to a constant multiple of the element count.
  problem: Building by inserting one by one costs n log n — when bulk-importing initial data (such as a scheduler cold-starting with its backlog of tasks) you pay a whole logarithmic factor for nothing; and the insertion order affects the intermediate shapes and comparison counts, so the result drifts with the input order.
  choice: Treat the whole set of data as a complete binary tree as-is, and sift down in reverse order starting from the last non-leaf node — when a node's turn comes, both its subtrees are already legal heaps, so one sift-down makes its whole subtree legal; the induction holds and the total bill is linear.
  tradeoff: The price is that building cannot be incremental — all the data must be present before you can start, and elements arriving midway can only be inserted one by one afterward; and the bottom-up order is counterintuitive — write it backwards, top-down, and the total degenerates back to the n log n order at once.
  root: The root lies in the tree's node distribution — the vast majority of nodes crowd into the bottom levels, at near-zero cost, while the expensive high-level nodes are extremely few. Linear does not come from every node being cheap, but from expensive nodes being rare — the same distribution law also explains why top-down must lose.
quiz:
- q: With array index i (0-based), what is the left child's index?
  options:
  - i + 1
  - 2i + 1
  - 2i
  - i * i
  answer: 1
  explain: 0-based — left 2i+1, right 2i+2, parent floor((i-1)/2).
- q: What is the heap-top element?
  options:
  - The median
  - The extreme value — the minimum (min-heap) or the maximum (max-heap)
  - The last one inserted
  - A random one
  answer: 1
  explain: A heap guarantees only the extreme value at the top; inside it is a partial order, not a total order.
- q: What are the complexities of building by inserting one by one, and of bottom-up heapify?
  options:
  - Both O(n)
  - O(n log n) and O(n)
  - O(n) and O(n log n)
  - Both O(n²)
  answer: 1
  explain: Heapify exploits the fact that most nodes sit at the bottom levels, so its total work converges to O(n).
