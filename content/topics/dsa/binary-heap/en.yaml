title: Binary Heaps and Priority Queues
summary: Always able to hand over "the most urgent one" immediately — insertion and removal both take only [[O(log n)|大 O 记号]].
premise: Tasks keep arriving, and each time the most urgent one has to be handled first; if you re-sorted all the tasks every time, the cost would be far too high. This lesson looks at how a data structure that watches only the most urgent task achieves this. The sample is a min-heap managing prioritized tasks, where a smaller priority number means more urgent.
position: This lesson is the first stop of the "Tree Structures" section. It follows merge sort and quicksort paying n log n to buy a complete total order, and proposes a cheaper structure that maintains only a partial order. After this lesson you will be able to compute any node's children on the spot with 2i+1 and 2i+2,
  and describe how sift-up on insertion and sift-down on removal each repair the one broken stretch of heap order.
bridge:
  prev: In the previous lesson, one quicksort partition pinned a single element's final position; this lesson does the opposite — a heap never pins down its internal order, and only repairs the parent–child chain leading to the root during sift-up and sift-down.
  next: A heap hands tasks out one by one in priority order without caring how the nodes connect to each other. The next lesson, BFS and DFS, tackles this — when nodes are linked by edges into a graph, how do you visit every node exactly once, with none missed and none repeated?
overview:
- key: In one sentence
  value: The heap top is always the smallest (or largest) element; insertion sifts up, removal sifts down. In other words, open the heap top at any moment and you get the most urgent task, and after an insertion or removal the heap pushes the new most urgent task to the top by itself.
- key: Complexity
  value: Peeking at the heap top is [[O(1)|大 O 记号]], insertion and removal are [[O(log n)|大 O 记号]], and building a heap in one pass is O(n). Peeking is just a look at the root node, hence the fastest; insertion and removal travel at most one tree height, and the tree height is logarithmic, hence logarithmic time as well.
- key: Storage
  value: A complete binary tree is stored directly in an array — no pointers needed. Because a complete binary tree's shape is so regular, the indexes of a parent and its children can be computed directly by formula, so there is no need to store left and right pointers on every node the way an ordinary tree does.
- key: In practice
  value: "Task schedulers, timers, [[Top K]], [[Dijkstra]]'s shortest paths, the task queue in React's scheduler — heaps show up in all of them. What they share is the same pattern: new tasks keep arriving, and the most urgent one always has to be taken first."
- key: Versus sorting
  value: A heap guarantees only who is smallest, not a fully sorted order — so it is cheaper. For example, if you only want to know the highest score in the class, there is no need to sort everyone's grades completely from high to low; a heap maintains exactly this good-enough order.
- key: Heap sort
  value: "Building the heap is O(n); then taking the elements out one by one totals O(n log n) — in place, and not stable. The method: first arrange the array into a heap, then repeatedly take the heap top and move it to the end; when done, the whole array is sorted."
- key: Not supported
  value: Looking up an arbitrary element by value is O(n); changing an element's priority requires knowing its index in the array first, and a heap cannot locate by value quickly, so an extra key-to-index record has to be maintained
- key: Max-heap
  value: Just flip the comparisons — a min-heap requires each parent to be no greater than its children; flip it to require each parent to be no less than its children, and the heap top becomes the maximum
