- id: d-ary-heap
  title: "d-ary heaps: more children, a shorter tree — how does the bill change?"
  tldr: "A binary heap gives every node just two children. Enlarge the child count to d and the tree gets shorter — but the sift-up and sift-down bills have to be redone. This step lays the two bills side by side and looks at how large the child count should be, and what decides it."
  body: >-
    Enlarge each node's child count from 2 to d and you get a d-ary heap: the tree gets shorter, the children sit between d times i plus 1 and d times i plus d, and the parent is (i minus 1) divided by d, rounded down. The height drops from a logarithm base 2 to a logarithm base d, and the number of sift-down steps drops with it.


    But each sift-down step must pick the smallest among d children, so the comparisons per level rise from 1 to d minus 1; sift-up compares against a single parent per step, so fewer steps there is pure profit. The total bill depends on the operation mix: in insertion-heavy, removal-light scenarios (such as scheduling queues), d = 4
    or even larger is often faster; when removals are dense, the sift-down cost eats the height dividend back.


    The hardware bill: one node's children sit consecutively in the array, so a single [[cache line|缓存行]] holds several of them; at d = 4, one sift-down level most likely costs very little extra access. [[CLRS]] sets the d-ary heap as an exercise for readers to derive themselves — the conclusion is always: look at the operation mix first, then fix d.
  derivation: original
  sources:
  - ref: clrs
    locator: "Chapter 6, exercise: d-ary heaps"
    claim: A d-ary heap's height is a logarithm base d, and the complexity of insertion and extraction varies with d and the operation mix
    status: verified
    checkedBy: Checked by Muse
    checkedAt: 2026-11-07
