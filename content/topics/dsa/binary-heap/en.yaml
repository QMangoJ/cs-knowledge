steps:
- id: why
  title: Why do we need a priority queue?
  tldr: "Set the scene first: tasks keep arriving, and each time the most urgent one has to be handled first. This step does two accounts — how expensive it is to scan a plain array for the most urgent task every time, and where fully re-sorting after every insertion wastes its effort. Once the waste is clear, we pin down what a priority queue promises — and why it can be cheap."
  body: |-
    Tasks keep arriving, and each time the most urgent one has to be handled first. Store them in a plain array and every search for the most urgent one scans all the tasks — that is linear; with 10,000 tasks, just finding it takes 10,000 looks, and the time spent actually handling tasks becomes the rounding error.

    Fully sorting all the tasks after every insertion costs even more, and most of the order you paid for is never used — you only care who is most urgent; the relative order of the remaining tasks does not matter at all. Paying for information you will never use is the most typical waste in this kind of scenario.

    A priority queue promises exactly one thing: see the most urgent task in one step at any time, and remove it or insert a new task at logarithmic cost. The heap is the classic structure implementing it: it maintains a partial order, pinning down only parent–child size relations and building no total order — which is why it is a notch cheaper than sorting. Every operation later in this lesson repairs the small piece of this partial order that an insertion or removal broke.
