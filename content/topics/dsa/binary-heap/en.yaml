    event: "The key change is done: the node whose key was decreased has sifted up to its new position, and heap order holds again."
- id: merge-heaps
  title: "Merging two heaps: the binary heap's soft spot"
  tldr: "This step picks on the binary heap's soft spot: when two heaps must become one, it has no ready-made way to merge. First do the bills for the two detours — insert one by one, and concatenate then heapify the whole thing — then pin down when you should simply switch to a different kind of heap."
  body: >-
    Merging two heaps into one is not cheap: a binary heap reserves no structural interface for merging. You can only insert the small heap's elements into the large heap one by one — m elements each take a sift-up, and the cost grows as m times log n — or concatenate the two arrays and heapify the whole thing, at linear cost. The latter is actually faster, but it is already this route's floor order of magnitude.


    A numeric comparison: merging two heaps of 1,000 elements each, inserting one by one takes about 1,000 times about 11 steps — on the order of ten-odd thousand comparisons in total; concatenating plus heapify is on the order of 4,000. The memory bill is the reverse: concatenation needs a freshly allocated array, while inserting one by one in place needs zero extra space — speed and memory saving stand in direct opposition, the same bill merge sort pays in space for speed.


    If the business merges frequently (such as merging sub-queues in parallel scheduling), the binary heap is the wrong tool: mergeable heaps such as the [[binomial heap|二项堆]] press merging down to logarithmic cost, at the price of abandoning array storage and returning to a pointer structure, with a larger constant per single operation. When choosing, list the operation inventory first: whether merging is frequent decides the structure.
  derivation: original
  sources:
  - ref: clrs
    locator: "Chapter 6, building heaps and merging heaps"
