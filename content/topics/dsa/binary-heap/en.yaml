    event: "The selection conclusion boils down to one line: if you only ever need the most urgent one, use a heap; if you need lookup by value or a full-order traversal, switch to another data structure."
- id: playground
  title: "Hands-on: build a heap by hand, then take it apart"
  tldr: "The rules are covered — now it is your turn: first build a heap from a 'reverse-sorted' array and watch the sift-up paths, then remove the heap top one by one and verify the output is naturally increasing; finally run build-by-insertion and one-pass heapify side by side, compare the swap counts, and verify that bottom-up building is cheaper."
  body: >-
    First build a heap from the 'reverse-sorted' array: every new element is smaller than its parent and floats up close to the heap top; then build from a 'nearly sorted' array — the last-inserted 2 floats from the end of the array all the way up to around index 1
    . Once built, keep single-stepping removals: each time the heap top is taken and the last element fills in and sifts down — the removed sequence is strictly increasing; that is heap sort's second half. You can also enter a set of numbers of your own (at most 10) to verify.


    Then the comparison: run build-by-insertion and one-pass heapify on the same set of numbers, compare the total swap counts, and verify that bottom-up is cheaper. A self-check question: if the removed sequence is not increasing, the fault is certainly some sift-down that did not swap with the smaller child — go back to that step and replay it single-step to locate it.
