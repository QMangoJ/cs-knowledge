  code:
    lang: typescript
    code: |-
      class MinHeap {
        a: number[] = [];
        push(x: number) { const a = this.a; a.push(x); let i = a.length - 1;
          while (i > 0) { const p = (i - 1) >> 1; if (a[p]! <= a[i]!) break; [a[p], a[i]] = [a[i]!, a[p]!]; i = p; } }
        pop(): number | undefined { const a = this.a, top = a[0]; const last = a.pop();
          if (a.length && last !== undefined) { a[0] = last; let i = 0;
            for (;;) { const l = 2 * i + 1, r = l + 1; let m = i;
              if (l < a.length && a[l]! < a[m]!) m = l; if (r < a.length && a[r]! < a[m]!) m = r;
              if (m === i) break; [a[m], a[i]] = [a[i]!, a[m]!]; i = m; } }
          return top; }
      }
    note: TypeScript implementation of sift-up / sift-down
- id: pop
  title: "Removing the top: fill in from the end, then sift down"
  tldr: "Insertion is learned; removal is its dual action: once the heap top is taken away, the root's place stands empty. This step watches the last element fill in at the root and then swap its way down with the smaller child step by step, and explains why it must swap with the smaller of the two children."
  body: >-
    Removing the heap top takes three steps: first take the root, 1, away; then move the array's last element, 3, up to the root in its place (the array's length drops by one and the shape stays unbroken); at this moment the only possible violation is at the root: 3 and its children 4 and 2 need a fresh ruling.


    Sifting down swaps with the smaller child: 3's children are 4 and 2; the smaller is 2, and 3 is greater than 2, so swap — 3 lands at index 2. Then look at the new position's children: index 2's children are at indexes 5 and 6, but the array now reaches only index 5, which holds 8; 3 is smaller than 8, so stop. The final heap is
    2, 4, 3, 7, 5, 8, and the new root 2 is the most urgent of the remaining tasks.


    Why must it swap with the smaller child? If the larger one, 4, were swapped up to the root instead, 4 would still be greater than the 2 left below — the violation would merely have moved house. Swapping with the smaller guarantees the node moved up is no greater than both children, repairing one level in one step. The step count is at most the tree height — a dozen or so steps suffice for 10,000 tasks.
  derivation: original
  sources:
