- id: decrease-key
  title: "The heap's other half: decreasing a key (decrease-key)"
  tldr: "In and out are learned; one action is still missing: a task is already in the heap, and its priority has been made smaller. This step shows why sifting up alone repairs things after a decrease, then explains what engineering practice uses to work around it when most languages' heaps do not offer this operation."
  body: >-
    First, a term: relaxation is the formal action of the shortest-path lesson later on — it means that after a shorter route is discovered, a node's known distance is decreased. Borrow that action here to look at the heap's problem: a task already in the heap has been made more urgent; how should the heap move it to the right place?

    A priority queue is not only in and out: when [[Dijkstra]] relaxes, a node that just got a shorter distance is often already in the heap, and its key needs to be decreased. The operation is plain: change the value directly, then sift up from that position (sift-up) — the key only got smaller, so only the upward direction needs repair.


    Many languages' priority queues (hand-written in JS, Python's [[heapq]]) do not offer decrease-key, so the standard workaround is to push another copy with the new distance, and when the old entry is popped, notice it is stale and skip it ([[lazy deletion|惰性删除]]): the heap may hold several copies of the same node, identified against the dist
    array. The extra entries number at most one per edge, and the asymptotic complexity does not change.


    The dual operation, increase-key (making a key larger), changes the value and then sifts down; together the two let a heap support scheduling scenarios with updates.
  derivation: original
  sources:
