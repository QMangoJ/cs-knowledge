- id: index-proof
  title: "Where the index formulas come from: a counting proof"
  tldr: "The last step said children's positions can be computed by formula — but formulas are not decreed. This step counts out the index scheme of left child 2i+1 and right child 2i+2: starting from the first node, count exactly which stretch of indexes the children of all the preceding nodes fill, and the formula lands on its own; finally, reckon what this arithmetic saves over pointer storage."
  body: >-
    The index formulas can be counted out: lay the nodes in level order in a line, and the children of the first several nodes occupy exactly one consecutive stretch behind them. Node 0's children occupy indexes 1 and 2; the children of nodes 0 and 1 together occupy indexes 1 through 4; inductively, the children of nodes 0 through i fill exactly indexes 1 through 2i plus
    2.


    So node i's two children are the last two of that stretch: 2i plus 1 and 2i plus 2. Solve backward for the parent: merging the two cases, the parent index equals (child index minus 1) divided by 2, rounded down. A worked example: the parent of index 6 is 5 divided by 2, rounded down to 2; the children of index 2 are 5 and
    6 — matching the tree in the canvas.


    This arithmetic is the foundation of the heap's efficiency: finding a parent or a child is constant time, with no pointers stored. With a pointer tree instead, every node would carry three extra pointers — left child, right child, and parent — multiplying memory use and scattering the nodes across the heap, wrecking the cache. The formulas' precondition is the complete-binary-tree shape constraint: it is the shape that lets arithmetic replace storage.
  derivation: original
  sources:
