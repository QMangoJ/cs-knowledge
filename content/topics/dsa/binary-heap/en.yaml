- id: shape
  title: "The heap's shape: every parent is smaller than its children"
  tldr: "The last step settled on maintaining only parent–child size relations; this step looks at what that relation actually looks like: a heap is a complete binary tree, with every parent no greater than its children. First, why the 'complete' shape matters — it is what lets the whole tree be stored directly in an array — then what it means that heap order governs parents and children only, not siblings."
  body: >-
    A heap is a complete binary tree: every level except the last is full, and the last level fills from left to right. The complete shape is not aesthetics — it is what lets the tree be stored directly in an array: number the nodes level by level, and node number i (0-based) has its left child at 2i plus 1, its right child at 2i plus 2, and its parent at (i minus 1) divided by 2,
    rounded down — not one cell wasted.


    Heap order governs parents and children only: every parent is no greater than its children (in a min-heap); which sibling is larger does not matter, and uncles and nephews are never compared directly. In the canvas the root is 2, its left child is 4 and its right child is 3 — 3 being smaller than 4 is perfectly legal, because the rules never required left-to-right order.


    From the parent–child chains it follows that the root must be the minimum: walking up the parent chain from any node, the values only decrease, never increase. So a heap is not a sorted array — read in array order it gives 2, 4, 3, 7, 5, 8, which is not monotone — but the root's identity carries an iron guarantee. A heap guarantees the extreme value, not the order.
  derivation: original
  sources:
