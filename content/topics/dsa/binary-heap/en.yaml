- id: push
  title: "Insertion: put it at the end, then sift up"
  tldr: "Shape and indexes are ready — time to act: where does a new task go? This step follows a new task with priority 1 from the end of the array, swapping with its parent level by level as it floats up, and shows why repairing a single chain is enough — and how many steps it takes at most."
  body: >-
    A new task with priority 1 arrives: put it at the end of the array first (index 6), keeping the complete binary tree's shape; at this moment only its relation with its parent can be violated: the parent sits at index 2 and is 3; 1 is smaller than 3, so the parent–child order is flipped.


    Sifting up repairs along the parent chain, cell by cell: 1 swaps with 3 into index 2; then compare with the new parent at index 0, which is 2 — 1 is smaller than 2, so swap again, up to the root; stop at the root. The two swaps walked the path from index 6 to 2 to 0 — exactly the tree height. Each level up roughly halves the index, so the step count is at most logarithmic: about
    14 steps cap it for 10,000 tasks.


    Sifting up repairs a single chain: every other parent–child pair was already legal, and the only relations that need re-checking are the ones on this chain. If every insertion re-checked the whole tree, the heap would degenerate into repeated sorting.
