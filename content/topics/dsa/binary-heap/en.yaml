- id: heapify
  title: "Building a heap in one pass: why it is O(n)"
  tldr: "Building by inserting one by one costs n log n, but when you already hold a whole unordered array there is a cheaper way. This step sifts down one by one starting from the last node that has children and working forward, first settling why the total bill is linear, then naming the one ordering that is easiest to write backwards."
  body: >-
    Building by inserting one by one costs O(n log n); the better way is to view the array as a tree first, start from the last node that has children, and sift each node down in turn, working forward. Half the nodes in the tree are leaves and need no work; the higher nodes are fewer, and although they sift deeper, the total work adds up to only
    O(n). Once the heap is built, repeatedly removing the heap top is heap sort: O(n log n), in place, but not stable.


    Concrete numbers: building a heap of a million elements by inserting one by one is on the order of 20 million comparisons (n log n), while heapify bottom-up is on the order of 2 million (O(n), with a constant of about 2n) — a whole order of magnitude apart, which is also why Python's heapify
    and schedulers building heaps in bulk choose it.


    Linear does not come from every node moving only a constant number of times; it comes from the total converging — the greater the height, the fewer the nodes: as the per-node price doubles, the count more than halves. Write the order backwards — sift down top-down starting from the root — and the upper nodes get stirred again and again, and the total degenerates at once. This is the one order that must not be written backwards.
  derivation: original
  sources:
