- id: shape
  title: 堆的样子：父节点总比孩子小
  tldr: "上一歩定下了只维护父子大小关系的路线，这一步看这份关系具体长什么样：堆是一棵完全二叉树，父节点不大于孩子。先交代完全这个形状为什么重要——它让整棵树能直接存进数组，再说清堆序只管父子、不管兄弟意味着什么。"
  body: >-
    堆是一棵完全二叉树：除最后一层外每层填满，最后一层从左往右填。完全这个形状不是审美，而是为了能直接存进数组：按层编号，第 i 个节点（0 起）的左孩子必在 2i 加 1、右孩子在 2i 加 2、父亲在 (i 减 1) 除以 2
    向下取整的位置，一格不浪费。


    堆序只管父子：每个父节点都不大于它的孩子（小顶堆），兄弟谁大谁小无所谓，叔侄也不直接比较。画布里树根是 2，左孩子 4、右孩子 3，3 比 4 小完全合法，因为规则从没要求过左右有序。


    由父子链可推出根一定最小：任何节点沿父链上溯，值只减不增。所以堆不是排好序的数组——按数组顺序读出来是 2、4、3、7、5、8，并不单调——但根的身份有铁保证。堆只保极值，不保次序。
