  code:
    lang: typescript
    code: "class MinHeap {\n  a: number[] = [];\n  push(x: number) { const a = this.a; a.push(x); let i = a.length - 1;\n    while (i > 0) { const p = (i - 1) >> 1; if (a[p]! <= a[i]!) break; [a[p], a[i]] = [a[i]!, a[p]!]; i = p; } }\n  pop(): number | undefined { const a = this.a, top = a[0]; const last = a.pop();\n    if (a.length && last !== undefined) { a[0] = last; let i = 0;\n      for (;;) { const l = 2 * i + 1, r = l + 1; let m = i;\n        if (l < a.length && a[l]! < a[m]!) m = l; if (r < a.length && a[r]! < a[m]!) m = r;\n        if (m === i) break; [a[m], a[i]] = [a[i]!, a[m]!]; i = m; } }\n    return top; }\n}"
    note: 上浮/下沉的 TypeScript 实现
- id: pop
  title: 取出堆顶：末尾补上，再下沉
  tldr: 拿走根之后，把最后一个元素放到根，再和较小的孩子交换，一路往下。
  body: '取出堆顶分三步：先把根 1 拿走交付使用；再把数组末尾元素 3 挪到根上顶替（顺手把数组长度减一，完全二叉树的形状不破）；此时全树唯一可能违规的又是根这一处：3 与它的两个孩子 4 和 2 都需要重新裁定。

    下沉的规则是与较小的孩子交换：3 的两个孩子是 4 与 2，较小的是 2，3 比 2 大，交换，3 落到下标 2；再看新位置的孩子，下标 2 的孩子在下标 5 与 6，数组里只剩到下标 5 的 8，3 比 8 小，停。最终堆为 2、4、3、7、5、8，新根 2 是剩余任务里最急的。

    为什么必须与较小的孩子换，而不是随便挑一个：换上来的孩子要同时压住它的兄弟，若把较大的 4 换到根，4 又比留在下面的 2 大，违规只是搬了个位置，并没有修好。与较小者交换能保证换上去的节点不大于两个孩子，一步修好一层。步数同样最多是树高，1 万个任务十几步足够。'
  derivation: original
  sources:
