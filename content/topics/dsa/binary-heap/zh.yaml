steps:
- id: why
  title: 为什么不直接排好序：只管最急，不为用不上的次序付费
  tldr: 每次只挑最急的任务，用数组硬扫是 O(n)、每次全排一遍是 O(n log n)，都是在为用不上的名次买单；优先队列靠只保「父比子急」的偏序，把插取一起压进 O(log n)。
  body: |-
    拿咱们调度器里这 6 个任务 [2, 4, 3, 7, 5, 8] 放大到 1 万个来算账：数字越小代表越急。如果直接用普通数组随便一塞，每次找最急的都得从头扫到尾看 1 万眼，真正干活前光挑任务就花了 O(n)；要是每次新任务进来就拿上一课的排序全排一遍，插一次就要 O(n log n)，CPU 全耗在排先后上了。

    仔细想想，这笔钱花得太冤：你现在只想把最急的 2 拎出来跑，后面第 4 名和第 5 名谁排在前面，等会再说甚至永远用不上——因为它们在被取出前可能还有新任务插队。把全部任务的相对名次排得清清楚楚，等于在为用不上的信息买单。

    优先队列只做一件实事：让你永远一眼看到最急的（O(1)），取出它或塞进新任务后花 O(log n) 重整一下就行。二叉堆就是实现它最经典的结构——它只要求父节点不大于孩子，不排兄弟、不排整队，用「够用就好」的偏序省下了一大截成本。
