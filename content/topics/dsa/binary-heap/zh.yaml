- id: heapify
  title: 一次性建堆：为什么是 O(n)
  tldr: "逐个插入建堆要付 n log n，可手里已经有一整个无序数组时，还有更便宜的办法。这一步从最后一个有孩子的节点开始往前逐个下沉，先算清总账为什么是线性的，再点名最容易写反的一处顺序。"
  body: >-
    逐个插入建堆要 O(n log n)；更好的办法是先把数组看成一棵树，从最后一个有孩子的节点开始，往前依次对每个节点做下沉。树里一半的节点是叶子，不用动；越靠上的节点越少，虽然下沉得深，加起来总工作量只是
    O(n)。建好堆后反复取出堆顶，就是堆排序：O(n log n)、原地，但不稳定。


    具体数字：100 万个元素逐个插入建堆约 2000 万次比较量级（n log n），heapify 自底向上约 200 万次量级（O(n)，常数约 2n）——差一个数量级，这也是 Python heapify
    与调度器批量建堆的选择。


    线性不是因为每个节点都只动常数次，而是总账收敛——高度越大的节点越少，单价翻倍的同时数量减半还不止。若顺序写反、从根开始自顶向下下沉，上层节点会被反复搅动，总量立刻退化。这个顺序最不能写反。
