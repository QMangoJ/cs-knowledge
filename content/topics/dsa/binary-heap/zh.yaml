- id: index-proof
  title: 下标公式哪里来：一次计数证明
  tldr: 孩子在 2i+1 与 2i+2 不是约定，是数出来的：前面所有节点的孩子正好占满一段连续下标。
  body: '下标公式不是背下来的约定，可以数出来：把节点按层序排成一队，队列最前面若干个节点的孩子，恰好连续地排在后面一段里。节点 0 的孩子占下标 1、2；节点 0 与 1 的孩子合计占下标 1 到 4；归纳下去，节点 0 到 i 的孩子正好占满下标 1 到 2i 加 2，一格不多、一格不少。

    于是节点 i 的两个孩子就是这段的最后两个：2i 加 1 与 2i 加 2。反解父亲：孩子下标为奇数时父亲是它减 1 再除以 2，为偶数时是它除以 2 再减 1，两种情况合并成一句话——父亲下标等于 (孩子下标减 1) 除以 2 向下取整。走例验算：下标 6 的父亲是 5 除以 2 取整得 2，下标 2 的孩子是 5 与 6，与画布的树逐一对得上。

    这套算术是堆全部效率的地基：找父亲、找孩子都是常数时间的加减乘除，不用存任何指针。若改用指针树，每个节点要多存左右孩子与父亲三个指针，内存成倍增加且节点散落各处、缓存全毁——公式成立的前提是完全二叉树这个形状约束：是形状，让算术替代了存储。'
  derivation: original
