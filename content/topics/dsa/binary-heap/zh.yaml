- id: d-ary-heap
  title: d 叉堆：孩子变多，树变矮，账怎么算
  tldr: 树高降到以 d 为底的对数，上浮变便宜，下沉每层却要在 d 个孩子里挑最小。
  body: '把每个节点的孩子数从 2 放大到 d，得到 d 叉堆：树变矮了，下标公式随之改变，孩子位于 d 乘 i 加 1 到 d 乘 i 加 d 之间，父亲是 (i 减 1) 除以 d 向下取整。高度从以 2 为底的对数降到以 d 为底的对数，取出时的下沉步数随之减少。

    但天下没有白矮的树：下沉每一步要在 d 个孩子里挑最小的，单层比较从 1 次涨到 d 减 1 次；上浮则相反，每步只比一个父亲，步数变少是纯赚。总账要看操作配比：插入多、取出少的场景（如不断汇入的调度队列），d 取 4 甚至更大常常更快；取出密集时，下沉挑最小的成本会把高度红利吃回去。

    还有一层硬件账：同一个节点的孩子在数组里连续存放，一次缓存行就能装下好几个孩子，d 等于 4 时下沉一层大概率只多花很少的额外访问。这类取舍没有闭式答案，CLRS 把 d 叉堆列为习题让读者自己推导各操作的复杂度——结论永远是先看操作配比，再定 d。'
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 6 习题：d 叉堆
    claim: d 叉堆高度为以 d 为底的对数，插入与取出的复杂度随 d 与操作配比变化
