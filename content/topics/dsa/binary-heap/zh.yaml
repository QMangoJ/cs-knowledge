- id: decrease-key
  title: 堆的另一半：改小一个键（decrease-key）
  tldr: "进和出都会了，还差一种动作：一个任务已经在堆里，它的优先级被改小了。这一步看改小之后为什么只需要上浮就能修好，再说清多数语言的堆不提供这个操作时，工程上用什么办法绕过去。"
  body: >-
    先补一个词：松弛是后面最短路径一课的正式动作，指发现一条更短的路之后，把某个点已知的距离改小。这里先借这个动作看堆的问题——一个已经在堆里的任务被改得更急了，堆该怎样把它挪到合适的位置。

    优先队列不只有进和出：[[Dijkstra]] 松弛时，新发现更短距离的节点往往已经在堆里，需要把它的键改小。操作很直白：直接改值，然后从该位置上浮（sift-up）——键只变小，只需要往上修。


    很多语言的优先队列（JS 自写、Python [[heapq]]）并不提供 decrease-key，于是通行做法是「再 push 一份新距离，取出时发现是旧条目就跳过」（惰性删除）：堆里允许同一节点有多份，靠 dist
    数组比对认人。多出的条目不超过一条边一份，复杂度渐近不变。


    对偶操作 increase-key（改大）是改值后下沉；两者合起来才让堆支撑得起带更新的调度场景。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 6 优先队列：DECREASE-KEY
    claim: decrease-key 改小键后沿父链上浮是二叉堆支持优先队列更新的标准操作
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: tree
    caption: 已入堆的 9 被降成 1：从原位置一路向上浮到堆顶
    tree:
      nodes:
      - v: 1
        mark: found
      - v: 4
      - v: 3
      - v: 7
      - v: 5
      - v: 8
    aux:
    - label: 改键规则
      items:
      - 改小 → 上浮
      - 改大 → 下沉
      - 无此 API → 惰性删除
  log:
  - mode: 更新
    event: "改键完成了：键被改小的节点已经上浮到新位置，堆序恢复成立。"
- id: merge-heaps
  title: 合并两个堆：二叉堆的软肋
  tldr: "这一步专挑二叉堆的软肋：两个堆要合成一个时，它没有现成的合并办法。先把两条绕行路线——逐个插入、拼起来整体建堆——各自的账算清，再说清什么场景下应该干脆换一种堆。"
  body: >-
    把两个堆合成一个并不便宜：二叉堆没有为合并留结构接口，只能把小堆的元素逐个插入大堆，m 个元素各走一次上浮，代价随 m 与 log n 相乘增长；或者把两个数组拼起来整体建堆，代价是线性的。后者反而更快，但已是这条路线的下限量级。


    数字对比：两个各含 1000 个元素的堆合并，逐个插入约 1000 次乘以约 11 步，合计上万次比较量级；拼接加建堆约 4000
    次量级。内存账则相反：拼接需要新开一块数组，原地逐个插入零额外空间——快与省内存直接对立，和归并排序付空间买速度是同一笔账。


    若业务高频合并（如并行调度里归并子队列），二叉堆不是对的工具：[[二项堆]]等可合并堆把合并压到对数级，代价是放弃数组存储、回到指针结构，单次操作的常数更大。选型先列操作清单，合并是不是高频，答案不同，结构就不同。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 6 建堆与堆的合并
    claim: 两个数组拼接后自底向上建堆可在线性时间内得到一个堆
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
