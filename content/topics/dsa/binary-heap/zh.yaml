steps:
- id: why
  title: 为什么需要优先队列
  tldr: 任务不断加入，每次都要处理最急的一个；每次都全部排序太浪费。
  body: '如果用普通数组，每次找最急的要扫一遍，O(n)。

    如果每次插入后都完整排序，代价也很大。

    优先队列只关心一件事：随时拿到最急的那个，堆就是为此设计的。'
  derivation: original
