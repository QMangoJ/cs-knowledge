title: 二叉堆与优先队列
summary: 既然只关心谁最急，就用不着花 O(n log n) 把所有人从头排到尾——二叉堆只守住一条铁律：每个父节点都比自己的孩子更急（小顶堆里父不大于子），这样最急的任务就永远站在堆顶。更妙的是它要求树必须是「从左到右一层层填满」的完全二叉树，这让整棵树根本不用存左右指针，单靠 2i+1、2i+2 就能直接铺进连续数组里。本课先从普通数组和全排序的浪费算起，讲清数组下标公式怎么数出来、插入上浮与取顶下沉怎样各修一条链，再拆解为什么一次性自底向上建堆只要 O(n)、d 叉堆与减键/合并怎么取舍，最后落到为什么海量数据求最大 Top-K 反而要用小根堆。
premise: 这节课的场景很具体：你写了一个后台任务调度器，任务会源源不断插进来，每个任务带一个优先级数字（数字越小越急），工人每次空下来都要立刻抓出最急的那个去跑。手里如果只用普通数组存着不管，找一次最急的就要从头翻到尾；每次新任务进来就把整队重排一遍，又实在太冤。本课拿一组 6 个任务 [2, 4, 3, 7, 5, 8] 贯穿全程，看二叉堆怎样用数组装下一棵树、又只管父子大小不管全局顺序，把插和取都压到 O(log n)。
position: 本课是数据结构与算法「树形结构」板块的第一站，接在「分而治之」的归并与快排之后：上一课付 O(n log n) 换回一整排全序，本课问的是——如果每次只需要最急的一个，能不能只维护父子偏序来省钱。它立住的树高、偏序与下标寻址概念，紧接着就会用在下一板块「图上的行走」（BFS/DFS 与 Dijkstra 优先队列），并在同板块的二叉搜索树里与全序树正面对比。
bridge:
  prev: 上一课快排靠基准一趟就把元素钉死在全局位置，可很多调度场景压根不需要全队排好。这一课换个思路：放弃整体有序，只守住父子大小关系，看怎么用极低代价永远拎出最急的那一个。
  next: 堆能随时吐出当前最急的任务，却不记录任务之间谁连着谁、怎么走过去。下一课 BFS 与 DFS 离开只能从根看极值的树，走进由节点和边织成的任意图里，学两种不重不漏走遍全图的路线。
overview:
- key: 一句话总结
  value: 堆顶永远是最急的那个极值；它靠「完全二叉树 + 父子偏序」两条规矩，把插一个和取一个的代价都压进 O(log n)，而且整棵树直接躺在一维数组里。
- key: 为什么不用指针
  value: 完全二叉树按层从左往右紧挨着填，中间不留空洞，所以每个节点的位置只跟排在前面的总数有关——下标 i 的左孩子必在 2i+1、右孩子在 2i+2，根本不用额外指针字段。
- key: 复杂度
  value: 偷看堆顶是 [[O(1)|大 O 记号]]；插入（放末尾再上浮）和取出堆顶（末尾补根再下沉）只修一条从根到叶的链，都是 [[O(log n)|大 O 记号]]；把现成数组一次性整理成堆（heapify）只要 O(n)。
- key: 建堆为什么是 O(n)
  value: 逐个插进堆里是 O(n log n)，但自底向上建堆时，树里一半以上的叶子根本不用下沉，越靠近树顶需要深沉的节点越少，总账收拢成线性的约 2n 次操作。
- key: Top-K 怎么用堆
  value: 要在几百万条数据里留出最大的 K 个，偏偏要建大小为 K 的「小顶堆」：堆顶守门的是当前第 K 大（门里最小那个），新数只有比守门员大才配踢掉它进门。
- key: 堆排序与短板
  value: 建好堆再把堆顶一个个拔出来放到数组末尾，就是[[原地]]但不稳定的堆排序，共 O(n log n)；但堆只认极值不认全局位置，按值找任意元素是 O(n)，也不支持快速合并两个堆。
- key: 谁在用
  value: React 调度器按过期时间管任务、定时器轮、[[Dijkstra]] 最短路径挑最近点、Python [[heapq]] 与 Java [[PriorityQueue]]，底层都是这套结构。
