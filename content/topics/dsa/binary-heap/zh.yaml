- id: heapify
  title: 一次性建堆为什么是 O(n)：一半节点不用动，贵的节点极少
  tldr: 手里已经有整组现成数据时，从最后一个非叶子节点倒着往前逐个下沉，总工作量只要 O(n)——因为一半节点是叶子不用动，越贵的上层节点越稀少。
  body: |-
    手里一次拿到 6 个初始任务 [7, 5, 8, 2, 4, 3] 时，没必要从头一个个 push。更好的办法叫自底向上 [[heapify]]：直接把这 6 个数原地看成一棵树，下标 3、4、5（值 2、4、3）根本没有孩子，已经是合法的单节点小堆，全部跳过！从最后一个有孩子的下标 2 倒着往前逐个下沉：下标 2 的 8 比孩子 3 大，换成 3；下标 1 的 5 比孩子 2 大，换成 2；最后下标 0 的 7 比孩子 2 大、换下去后又比孩子 4 大、再换一格，整数组原地变成 [2, 4, 3, 5, 7, 8]。

    为什么算总账变成了 O(n)？想象一棵 100 万个节点的堆：最底层约 50 万个叶子沉 0 步，上一层约 25 万个节点最多沉 1 步，再上一层 12.5 万个最多沉 2 步……越往上走每层能沉的步数虽然加 1，但节点数量却直接腰斩，把它们全加起来的级数极限约等于 2n。拿数字对比：100 万个数逐个插入约 2000 万次比较量级（n log n），一次性 heapify 只要约 200 万次量级（O(n)），足足省出一个数量级。顺便一提，建好堆后反复取顶放到数组尾部，就是原地但不稳定的堆排序（O(n log n)）。

    切记千万别把循环顺序写反！如果你图省事从根（下标 0）开始顺着往下沉，根沉下去一次后，底下的子树还是乱的，刚才挑上来的根根本不是全局最小，不仅堆是错的，强行多趟修补还会退回 O(n log n)。只有倒着走，才能保证轮到某个父亲下沉时，它左右两棵子树早已经是合法堆了。
  derivation: original
  sources:
  - ref: mit-6006
    locator: 二叉堆相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: 已有 n 个元素时，从最后一个非叶子节点往前逐个下沉，总共只要 O(n)。
