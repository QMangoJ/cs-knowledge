level: 进阶
minutes: 28
prereq:
- dsa/merge-quick-sort
objectives:
- 用完全二叉树的数组下标算父/子位置
- 描述上浮与下沉如何恢复堆序
- 说清建堆为什么是 O(n) 而非 O(n log n)
aiLink: 优先队列是调度器的心脏：推理服务的请求优先级队列、定时器与事件循环靠堆在 O(log n) 内取最值；束搜索（beam search）每步要保留 top-k 候选，也常借助堆或部分排序来做。理解堆，就理解这些系统如何排队。
design:
- mechanism: 完全二叉树拿形状纪律换数组算术，省掉全部指针
  problem: 普通树每个节点都要存左右孩子甚至父亲指针，内存多背一截不说，节点散落在堆内存各处，顺着父子路径每跳一步就缓存未命中。
  choice: 死守完全二叉树纪律——插入只许追加末尾、删除只许拿末尾补根——让下标 0 起的父子关系直接靠 2i+1、2i+2 与 (i−1)/2 向下取整算出来，整棵树挤进连续数组。
  tradeoff: 形状不能自由朝一侧拉长，也做不到像链表那样直接拼合两个堆；真需要高频合并时，只能放弃数组与缓存红利，改用指针结构的可合并堆。
  root: 只要结构足够规整、中间不留空洞，位置本身就是索引——存储开销可以被直接兑换成算术开销，还顺带赚到了连续内存的缓存友好。
- mechanism: 堆序只管父子偏序，不为用不上的全序付费
  problem: 任务调度器每次只关心最急的那个极值，如果为了找它把整队排成全序，每次插队都要算出每个人的精确名次，代价太冤。
  choice: 只立「父不大于子」一条父子偏序规矩，放任兄弟之间谁先谁后，于是插入和取顶都只修从根到叶那一条链（O(log n)）。
  tradeoff: 能力刻意残缺：不能按值快速找某个任务（只能 O(n) 扫），不能高效删中间节点，也无法直接顺序遍历；需要这些就得换平衡树。
  root: 数据结构维护的规矩越强，每次改动要修补的地方就越多；把秩序削到只剩极值可达，更新成本才压得住。
- mechanism: 自底向上建堆靠底层节点多、高层节点少把总账压到 O(n)
  problem: 批量灌入一整个数组建堆时，若傻傻一个一个 push 上浮，总账是 O(n log n)，而且还会随输入顺序晃动。
  choice: 先把现成数组当成一棵树，从最后一个非叶子节点起倒着往前逐个下沉（heapify）：树里超过一半的叶子一步不动，轮到谁时它的两棵子树早已经是合法堆了。
  tradeoff: 必须等整批数据到齐才能一次性建堆，没法边流式来边用它增量建；而且循环顺序绝不能写成从根顺着往下，写反立刻退回 O(n log n)。
  root: 树形结构绝大部分节点都挤在最底层、下沉 0 到 1 步就完事，昂贵的高层节点呈指数级稀少——线性时间不是因为每个点便宜，而是因为贵点极少。
quiz:
- q: 数组下标 i（0 起）的左孩子下标是？
  options:
  - i + 1
  - 2i + 1
  - 2i
  - i * i
  answer: 1
  explain: 0 起：左 2i+1、右 2i+2、父 floor((i-1)/2)。
- q: 堆顶元素是？
  options:
  - 中位数
  - 最小（最小堆）或最大（最大堆）的那个极值
  - 最后一个插入的
  - 随机的
  answer: 1
  explain: 堆只保证堆顶极值，内部只是偏序，不是全序。
- q: 逐个插入建堆与自底向上 heapify 的复杂度分别是？
  options:
  - 都是 O(n)
  - O(n log n) 与 O(n)
  - O(n) 与 O(n log n)
  - 都是 O(n²)
  answer: 1
  explain: heapify 利用多数节点在底层的事实，总工作量收敛到 O(n)。
