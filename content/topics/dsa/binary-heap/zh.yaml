- id: shape
  title: 堆长什么样：完全二叉树装进数组，只管父子不管兄弟
  tldr: 二叉堆是一棵没有空洞的完全二叉树，所以能一格不剩地铺进数组；它的规矩只有「父不大于子」，不管左右兄弟谁大谁小，照样能锁死树根永远最小。
  body: |-
    把 [2, 4, 3, 7, 5, 8] 按从上到下、从左到右一层层摆成树：2 当根，第二层是 4 和 3，第三层靠左摆着 7、5、8。这种「上面全满、最底层严格从左往右挨着填、绝不在中间留缺口」的树叫完全二叉树。正是因为没有任何空洞，它才能原封不动压成连续数组 [2, 4, 3, 7, 5, 8]，一格不浪费。

    等等，你看第二层左边的 4 明明比右边的 3 大，这难道没违背顺序吗？完全合法！堆序只管「直系父子」——小顶堆里每个父亲都不能比自己的孩子大（2 ≤ 4 且 2 ≤ 3；4 ≤ 7 且 4 ≤ 5；3 ≤ 8），至于亲兄弟 4 和 3 谁大谁小、堂兄弟 7 和 8 谁大谁小，规则一概不管。所以把堆数组直接打印出来是 2、4、3、7、5、8，并不是递增的。

    那不管兄弟，凭什么保证堆顶 2 一定是全队最小的？从树里随便挑一个节点（比如 8）一路往上找爸爸：8 ≥ 3 ≥ 2，沿任何一条父链往根走数值只会越来越小（或相等），所以所有节点绕一圈最后都比不过最顶上的根。只保极值、不保全序，这就是堆便宜的秘密。
