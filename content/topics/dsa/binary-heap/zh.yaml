- id: heapify
  title: 一次性建堆：为什么是 O(n)
  tldr: 已有 n 个元素时，从最后一个非叶子节点往前逐个下沉，总共只要 O(n)。
  body: '逐个插入建堆要 O(n log n)；更好的办法是先把数组看成一棵树，从最后一个有孩子的节点开始，往前依次对每个节点做下沉。

    树里一半的节点是叶子，根本不用动；越靠上的节点越少，虽然下沉得深，但加起来总工作量只是 O(n)。

    建好堆后反复取出堆顶，就是堆排序：O(n log n)、原地，但不稳定。


    具体数字：100 万个元素逐个插入建堆约 2000 万次比较量级（n log n），heapify 自底向上约 200 万次量级（O(n)，常数约 2n）——差一个数量级，这也是 Python heapify 与调度器批量建堆的选择。

    再点破一个直觉误区：线性不是因为每个节点都只动常数次，而是总账算下来收敛——高度越大的节点越少，单价翻倍的同时数量减半还不止。若把顺序写反、从根开始自顶向下逐个下沉，上层节点会被反复搅动，总量立刻退化。这个先后顺序，是本节最不能写反的一行。'
  derivation: original
