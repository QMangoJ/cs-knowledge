- id: push
  title: 插入：放到末尾，再上浮
  tldr: "形状和下标都备好了，开始动手：新任务进来该放在哪里。这一步跟着一个优先级为 1 的新任务，从数组末尾一路和父节点交换往上浮，看它为什么只修一条链就够、最多要走多少步。"
  body: >-
    新来优先级为 1 的任务，先放到数组末尾（下标 6），保持完全二叉树的形状；此时只有它与父亲的关系可能违规：父亲在下标 2，是 3，1 比 3 小，父子次序反了。


    上浮就是沿父链逐格修复：1 与 3 交换到下标 2；再与新父亲下标 0 的 2 比较，1 比 2 小，再交换到根；到根停。两次交换走了下标 6 到 2 到 0 的路径，恰好是树高。每上一层下标大致减半，最多对数级步数，1 万个任务约
    14 步封顶。


    上浮只修一条链：其他父子对原本就合法，需要重新检查的也只有链上的父子关系。若每插一个都要全树检查，堆就退化成反复排序了。
  derivation: original
  sources:
  - ref: mit-6006
    locator: 二叉堆相关讲义
