- id: d-ary-heap
  title: d 叉堆：多生几个孩子让树变矮，但下沉每层得多挑几个
  tldr: 每个节点改生 d 个孩子，树高能压成 log_d(n) 让上浮变快，可下沉每步得多比 d−1 个孩子；到底是赚是赔，全看插入多还是取出多。
  body: |-
    在二叉堆里，100 万个元素树高大约 20 层；如果放开规矩，允许每个父亲生 d 个孩子（比如 d = 4 的四叉堆），100 万个元素树高瞬间腰斩到约 10 层，八叉堆只剩约 7 层。下标公式依然是小学生算术：位置 i 的 d 个孩子连续排在 d·i + 1 到 d·i + d，父亲则是 (i − 1) / d 向下取整。

    等等，树变矮这么多，是不是 d 越大越无敌？并没有这么好的事。插入上浮时，每爬一层只跟唯一那个父亲比 1 次，树高砍半等于比较次数直接砍半，这是纯赚；可取顶下沉时，每降一层都要在 d 个孩子里比较 d − 1 次才能挑出最小的那个！所以当业务里插入极多、取出很少时，用四叉堆常常更快；反过来取出极密集时，下沉多出来的比较会把树高的红利吃回去。

    真实 CPU 上还有一个隐藏加分项：同一父亲的 d 个孩子在数组里是紧挨着排在一起的，取一个孩子时顺便把旁边的兄弟全都捎进同一条[[缓存行]]里了。因此四叉堆多挑那 3 个兄弟几乎不额外产生内存等待，工程里常常把 d = 4 当成比二叉堆还快的甜点选择——就像 [[CLRS]] 习题指出的，先看操作配比和硬件缓存，再定 d。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 6 习题：d 叉堆
    claim: d 叉堆高度为以 d 为底的对数，插入与取出的复杂度随 d 与操作配比变化
    status: verified
