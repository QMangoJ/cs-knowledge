title: 二叉堆与优先队列
summary: 总能立刻拿到“最急的那个”，插入和取出都只要 O(log n)。
premise: 以一个小顶堆管理带优先级的任务为例，优先级数字越小越急。
overview:
- key: 一句话总结
  value: 堆顶永远是最小（或最大）的元素；插入上浮、取出下沉
- key: 复杂度
  value: 查看堆顶 O(1)，插入和取出 O(log n)，一次性建堆 O(n)
- key: 存储
  value: 完全二叉树，直接存在数组里，不需要指针
- key: 工程里
  value: 任务调度器、定时器、Top K、Dijkstra 最短路径、React 调度器的任务队列
- key: 和排序的区别
  value: 堆只保证“谁最小”，不保证整体有序，所以更便宜
- key: 堆排序
  value: 建堆 O(n) + n 次取出，共 O(n log n)，原地、不稳定
- key: 不支持
  value: 按值查找任意元素是 O(n)；改优先级需要额外记下标
- key: 最大堆
  value: 把比较反过来即可
