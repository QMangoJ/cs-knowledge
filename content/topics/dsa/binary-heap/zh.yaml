- id: push
  title: 插入新任务：先塞数组末尾保形状，再一路上浮修一条链
  tldr: 新任务先挂到数组最末尾才不会撑破完全二叉树的形状，随后只要比父亲急就一路交换上浮，最多走树高 O(log n) 步。
  body: |-
    现在突然插进来一个火急任务，优先级是 1。为了保住完全二叉树「靠左挨着填」的队形，千万别直接动堆顶，先把它追加到数组最末尾——下标 6 的位置，在树里恰好成为下标 2（数值 3）的右孩子。这样一来全树只有一对关系出了问题：新来的 1 比父亲 3 还小。

    接下来只做一件事——上浮：1 和父亲 3 交换，挪到下标 2；还没完，再拿它跟新父亲下标 0 的 2 比一比，1 还是比 2 小，继续交换到下标 0。到了树根停手，新任务 1 稳稳当上堆顶。每往上一层下标就差不多砍掉一半，所以即使堆里挤了 1 万个任务，最多也就交换 14 次封顶。

    等等，把 3 换下来之后，3 会不会比它旁边的左孩子 8 还大、把底下搞乱？不会，因为原本的堆里 2 和 3 本身就比底下的孩子小，上浮换下来的都是原本就在上层的更小值（先换下 3 ≤ 8，再换下 2 ≤ 4、2 ≤ 3）。所以上浮只沿着一条直达树根的链修补，全树其余角落安然无恙。
