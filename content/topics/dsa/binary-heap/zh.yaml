  points:
  - 任务不断加入，每次都要处理最急的一个；每次都全部排序太浪费。
- id: shape
  title: 堆的样子：父节点总比孩子小
  tldr: 堆是一棵完全二叉树，每个父节点都不大于它的孩子，所以根就是最小值。
  body: '完全二叉树一层层从左往右填满，可以直接存在数组里：位置 i 的孩子在 2i+1 和 2i+2。

    规则只管父子之间，兄弟之间谁大谁小无所谓。

    所以它不是排好序的数组，但根一定最小。'
  derivation: original
  sources:
  - ref: mit-6006
    locator: 二叉堆相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
