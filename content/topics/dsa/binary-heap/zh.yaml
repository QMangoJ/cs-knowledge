    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
  canvas:
    kind: datastate
    structure: tree
    caption: 随时 O(1) 看到最急的，O(log n) 取出或插入
    tree:
      nodes:
      - v: 2
        mark: found
      - v: 4
      - v: 3
      - v: 7
      - v: 5
      - v: 8
    aux:
    - label: 用途
      items:
      - React 调度器
      - Top 10
      - PriorityQueue / heapq
  log:
  - mode: 总结
    event: 需要“随时取最急的”就用堆
- id: playground
  title: 动手实验：亲手建堆再逐个取出
  tldr: 换不同数组建堆，看上浮路径；再把最小值一个个取出，验证输出天然有序。
  body: '先用「逆序」数组建堆：每个新元素都比父节点小，一路浮到接近堆顶，上浮最频繁；再用「近乎有序」建堆，最后插入的 2 会从数组尾部一路浮到下标 1 附近。建完继续单步取出：每次取走堆顶、末尾补位下沉——取出的序列严格递增，这就是堆排序的后半程。也可以输入自己的一组数（最多 10 个）验证。

    再做一组对照：同一组数逐个插入建堆与一次性建堆各跑一遍，比较交换总次数，亲眼验证自底向上更省；然后故意输入一个已满足堆序的数组，观察建堆几乎不动、但逐个取出仍要一步步下沉，理解建堆便宜与排序不便宜并不矛盾。最后留一个自查问题：取出的序列若不是递增，错的一定不是比较规则，而是某次下沉没有与较小的孩子交换，回到那一步单步重放就能定位。建议把每次上浮与下沉的路径先写下来，再与单步结果对照。'
  derivation: original
  sources: []
  log: []
  canvas:
    kind: lab
    lab: heap-lab
    caption: 预置/自定义数组，插入上浮 + 取顶下沉全程可视
    cases:
    - input:
        values: [9, 4, 7, 1]
      expect:
        heapAfterBuild: [1, 4, 7, 9]
        sorted: [1, 4, 7, 9]
    - input:
        values: [5, 2, 8, 2]
      expect:
        heapAfterBuild: [2, 2, 8, 5]
        sorted: [2, 2, 5, 8]

level: 进阶
minutes: 28
prereq:
- dsa/merge-quick-sort
objectives:
- 用完全二叉树的数组下标算父/子位置
- 描述上浮与下沉如何恢复堆序
- 说清建堆为什么是 O(n) 而非 O(n log n)
aiLink: 优先队列是调度器的心脏：推理服务的请求优先级队列、定时器与事件循环靠堆在 O(log n) 内取最值；束搜索（beam search）每步要保留 top-k 候选，也常借助堆或部分排序来做。理解堆，就理解这些系统如何排队。
design:
- mechanism: '完全二叉树的层序与数组下标之间存在一一对应：父亲与孩子的位置都能用 2i 加 1、2i 加 2 与 (i 减 1) 除以 2 这类算术当场算出，树结构被编码进下标本身，不需要任何额外存储来表达谁连着谁。'
  problem: '若用指针节点存树，每个节点要额外背左右孩子（常常还要背父亲）指针，内存膨胀且节点在堆上四散分布，沿上浮下沉的路径访问就是接连的缓存未命中，对数级步数每一步都可能在等一次内存。'
  choice: '强制树保持完全二叉形（新元素只许填末尾、删除只许动末尾），用形状纪律换下标算术：找亲属是常数时间的计算，所有元素挤在一个连续数组里，上浮下沉沿途大多命中同一批缓存行。'
  tradeoff: '代价是形状不能自由生长：不能像普通二叉搜索树那样只在一侧加节点，也无法高效合并两个堆；需要这些操作时只能换可合并堆，并把数组存储与缓存友好的红利一并交还回去。'
  root: '根源是信息可以存进位置：当结构规则足够规整时，位置本身就是索引，存储与计算可以互相兑换。堆用最规整的树形，把指针开销兑换成算术开销，顺带买到了缓存友好，这是它便宜的底层原因。'
- mechanism: '堆序只约束父子对，全树只形成偏序：从根到任意节点的路径单调，但不同子树之间不建立任何次序。整个结构维护的信息量远小于一份完整排序，更新时需要修复的约束因此也少得多。'
  problem: '调度场景每次只需要极值一个，维护全序等于为永远用不上的次序信息持续付费：每次插入都要找到它在全序中的确切位置并维持所有相邻关系，代价与常数都压不下来，纯属浪费。'
  choice: '只钉住堆顶：插入与删除只沿一条根到叶的路径修复偏序，其余节点一概不动。需要第 k 大或中位数时不在堆上硬做，而是另配结构分工，例如用两个堆对顶维护中位数。'
  tradeoff: '放弃全序的代价是能力残缺：按值查找、删除任意元素、顺序遍历全部退化到线性或根本做不到，堆因此只能当优先队列用，不能冒充有序容器，选型时必须先确认操作清单。'
  root: '根源是信息与代价的对价：一个数据结构维护的信息越强，每次更新要修复的约束就越多。堆把信息削到只剩极值可达，更新代价才压得住——这是所有专用结构压过通用结构的同一条原理。'
- mechanism: '自底向上建堆的总工作量按高度分层结算：约一半节点是叶子、代价为零，高度每加一层，节点数减半而单个下沉代价至多翻倍，各层总量被几何级数压成元素个数的常数倍。'
  problem: '逐个插入建堆要付 n log n，批量导入初始数据（如调度器冷启动灌入存量任务）时白白多付一个对数因子；而且插入顺序会影响中间形态与比较次数，结果还随输入次序漂移。'
  choice: '把整组数据先原样看成完全二叉树，从最后一个非叶子节点起逆序逐个下沉：轮到某节点时它的两棵子树都已是合法堆，一次下沉即让整棵子树合法，归纳成立且总账线性。'
  tradeoff: '代价是建堆不可增量：数据必须全部到齐才能开始，中途新来的元素只能事后逐个插入；且自底向上的顺序反直觉，一旦写反成自顶向下，总量立刻退化回 n log n 量级。'
  root: '根源在树的节点分布：绝大多数节点挤在底层、代价趋零，昂贵的高层节点又极少。线性不是来自每个节点都便宜，而是来自贵节点稀少——同一条分布规律，也解释了为什么自顶向下必亏。'
quiz:
- q: 数组下标 i（0 起）的左孩子下标是？
  options:
  - i + 1
  - 2i + 1
  - 2i
  - i * i
  answer: 1
  explain: 0 起：左 2i+1、右 2i+2、父 floor((i-1)/2)。
- q: 堆顶元素是？
  options:
  - 中位数
  - 最小（最小堆）或最大（最大堆）的那个极值
  - 最后一个插入的
  - 随机的
  answer: 1
  explain: 堆只保证堆顶极值，内部只是偏序，不是全序。
- q: 逐个插入建堆与自底向上 heapify 的复杂度分别是？
  options:
  - 都是 O(n)
  - O(n log n) 与 O(n)
  - O(n) 与 O(n log n)
  - 都是 O(n²)
  answer: 1
  explain: heapify 利用多数节点在底层的事实，总工作量收敛到 O(n)。
