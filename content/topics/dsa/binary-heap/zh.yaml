- id: engineering
  title: 工程选型与 Top-K：找最大前 10 名偏要用小顶堆
  tldr: 从海量数据流里拎最大的 10 个数，偏要建大小为 10 的小顶堆让「第 10 名」守在堆顶当门槛；同时牢记堆只认极值、不能按值查找，别拿它干搜索树的活。
  body: |-
    先破解面试最爱考的反直觉题：从上亿条点击流水里留出最大的 10 个，为什么用「小顶堆」而不用「大顶堆」？拿这一串 12 个数实地走一遍：42、7、19、88、3、56、24、71、9、31、60、15。先把前 10 个塞满大小为 10 的小顶堆，此时站在堆顶的是这 10 个里最小的 3——它就像前 10 强门槛的守门员。第 11 个数 60 来了，60 > 3，比守门员大说明它稳进前 10，立刻弹出 3、塞入 60，新守门员变成 7；第 12 个数 15 > 7，同样踢掉 7 进门。之后哪怕再来一亿个数，凡是不比当前堆顶大的直接跳过。内存永远恒定只占 K = 10 个位置；要是反过来建大顶堆，最大值堵在门顶，谁才是该被淘汰的第 10 名根本摸不到。

    回到开头的调度器：React 的任务调度器按过期时间管任务、定时器轮、Java [[PriorityQueue]] 和 Python [[heapq]]（JS 没内置得自己写或引库），干的都是同一件事——随时拎出最急的那个（[[Top-K|Top K]] 保留只是它最常见的变体）。

    但一定要守住堆的能力边界：堆只认堆顶，想按值找中间某个任务只能 O(n) 扫全数组，想顺着从小到大逐个遍历也做不到（取一次就删掉了）。需要按名次、按范围查全序，就得交给下一课的二叉搜索树。
  derivation: original
  sources:
  - ref: mit-6006
    locator: 二叉堆相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
