    event: "选型结论收口为一句：只要随时取最急的就用堆，需要按值查找或全序遍历就换别的数据结构。"
- id: playground
  title: 动手实验：亲手建堆再逐个取出
  tldr: "规则讲完了，换你上手：先用逆序数组建堆看上浮路径，再把堆顶一个个取出，验证输出天然递增；最后把逐个插入建堆和一次性建堆各跑一遍，对照交换次数，验证自底向上建堆更省。"
  body: >-
    先用「逆序」数组建堆：每个新元素都比父节点小，一路浮到接近堆顶；再用「近乎有序」建堆，最后插入的 2 会从数组尾部一路浮到下标 1
    附近。建完继续单步取出：每次取走堆顶、末尾补位下沉——取出的序列严格递增，这就是堆排序的后半程。也可以输入自己的一组数（最多 10 个）验证。


    再做对照：同一组数逐个插入建堆与一次性建堆各跑一遍，比较交换总次数，验证自底向上更省。自查问题：取出的序列若不是递增，错的一定是某次下沉没有与较小的孩子交换，回到那一步单步重放就能定位。
