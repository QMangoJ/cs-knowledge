      items:
      - 改小 → 上浮
      - 改大 → 下沉
      - 无此 API → 惰性删除
  log:
  - mode: 更新
    event: "改键完成了：键被改小的节点已经上浮到新位置，堆序恢复成立。"
- id: merge-heaps
  title: 合并两个堆：二叉堆的天然软肋，高频合并得换结构
  tldr: 两个紧凑数组没法靠改两根指针就接在一起，这是二叉堆的天生软肋——只能挨个插入（省内存但慢）或拼起来重跑 O(n) 建堆（快但要新空间）；高频合并必须换可合并堆。
  body: |-
    假如两台机器各攒了一个堆要并成一队，二叉堆在这里就露怯了：它把整棵树焊死在连续数组里，两个数组没法直接拿指针接在一起。摆在面前的只有两条笨办法：要么把小堆里的元素一个个拔出来 push 进大堆，要么干脆把两个数组首尾拼一块，重新跑一遍自底向上的 [[heapify]]。

    拿两个各装 1000 个任务的堆来算笔对比账：如果挨个插入，1000 个元素各自上浮最多约 11 步，合计要上万次比较量级；如果首尾拼成 2000 元素的数组做一次 O(n) 建堆，只要约 4000 次比较量级，速度快不少。但内存账刚好反过来——原地逐个插入不用重开整块新数组，拼接建堆却要再申请 2000 格新空间，又是时间和空间的对立。

    如果是几万次调度才合并一次，拼接建堆完全顶得住；可如果业务天生就是高频把一堆小优先队列拼来并去（比如并行任务互相偷队列合并），硬扛二叉堆就不划算了。这时该换上[[二项堆]]这类可合并堆，它们用按 2 的幂次组织的指针树把合并压到 O(log n)，代价则是交回连续数组和缓存友好的红利。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 6 建堆与堆的合并
    claim: 两个数组拼接后自底向上建堆可在线性时间内得到一个堆
