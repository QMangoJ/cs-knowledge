title: 二叉堆与优先队列
summary: 总能立刻拿到“最急的那个”，插入和取出都只要 [[O(log n)|大 O 记号]]。
premise: 任务会不断加进来，每次又都要先处理最急的那一个，如果每次都把全部任务重新排一遍序，代价太高。本课就看一种只盯住最急任务的数据结构怎样做到这一点，样本是一个小顶堆，用它管理带优先级的任务，优先级数字越小表示越急。
position: 本课是「树形结构」板块的第一站，它接在归并与快排付出 n log n 换取完整全序之后，提出只维护偏序的更便宜结构。学完你能用 2i+1 与 2i+2
  当场算出任意节点的孩子位置，并描述插入时上浮、取顶时下沉如何各自修复被打破的那一段堆序。
bridge:
  prev: 上一课快排靠 pivot 一次分区钉住一个元素的最终位置，本课反其道而行：堆从不钉死内部次序，只在上浮下沉时修好通往根的那条父子链。
  next: 堆把任务按优先级逐个吐出却不关心节点间如何相连，下一课 BFS 与 DFS 要解决的是：当节点由边连成图时，怎样不重不漏地走遍每一个节点。
overview:
- key: 一句话总结
  value: 堆顶永远是最小（或最大）的元素；插入时上浮、取出时下沉。也就是说，你随时打开堆顶就能拿到最急的那个，插入和取出之后，堆会自己把新的最急任务顶到最上面。
- key: 复杂度
  value: 查看堆顶是 [[O(1)|大 O 记号]]，插入和取出是 [[O(log n)|大 O 记号]]，一次性建堆是 O(n)。查看只是看一眼根节点，所以最快；插入和取出最多沿着树高走一趟，树高是对数级，所以也是对数时间。
- key: 存储
  value: 完全二叉树直接存在数组里，不需要指针。因为完全二叉树的形状很规整，父节点和孩子节点的下标能直接用公式算出来，所以不用像普通树那样给每个节点存左右指针。
- key: 工程里
  value: 任务调度器、定时器、[[Top K]]、[[Dijkstra]] 最短路径、React 调度器的任务队列里都有堆的身影。它们的共同点都是一样的，就是不断有新任务进来，又总要先拿最优先的那个处理。
- key: 和排序的区别
  value: 堆只保证谁最小，不保证整体有序，所以更便宜。比如你只想知道全班最高分，没必要把所有人的成绩从高到低完整排一遍，堆维护的就是这种够用就好的秩序。
- key: 堆排序
  value: 建堆是 O(n)，再把元素一个个取出共 O(n log n)，原地进行、不稳定。做法是先把数组整理成堆，然后反复拿走堆顶放到末尾，排完之后整个数组就有序了。
- key: 不支持
  value: 按值查找任意元素是 O(n)；改某个元素的优先级，要先知道它在数组里的下标，而堆没法按值快速定位，所以需要额外维护一份键到下标的记录
- key: 最大堆
  value: 把比较反过来即可：小顶堆要求父节点不大于孩子，反过来要求父节点不小于孩子，堆顶就变成最大值
