title: 二叉堆与优先队列
summary: 总能立刻拿到“最急的那个”，插入和取出都只要 O(log n)。
premise: 以一个小顶堆管理带优先级的任务为例，优先级数字越小越急。
overview:
- key: 一句话总结
  value: 堆顶永远是最小（或最大）的元素；插入上浮、取出下沉
- key: 复杂度
  value: 查看堆顶 O(1)，插入和取出 O(log n)，一次性建堆 O(n)
- key: 存储
  value: 完全二叉树，直接存在数组里，不需要指针
- key: 工程里
  value: 任务调度器、定时器、Top K、Dijkstra 最短路径、React 调度器的任务队列
- key: 和排序的区别
  value: 堆只保证“谁最小”，不保证整体有序，所以更便宜
- key: 堆排序
  value: 建堆 O(n) + n 次取出，共 O(n log n)，原地、不稳定
- key: 不支持
  value: 按值查找任意元素是 O(n)；改优先级需要额外记下标
- key: 最大堆
  value: 把比较反过来即可
visual: datastate
logColumns:
- key: mode
  label: 当前状态
- key: event
  label: 发生了什么
steps:
- id: why
  title: 为什么需要优先队列
  tldr: 任务不断加入，每次都要处理最急的一个；每次都全部排序太浪费。
  body: '任务不断加入，每次都要先处理最急的一个。若用普通数组存，每次找最急的要把全部任务扫一遍，是线性的；任务有 1 万个时，光找就要看 1 万眼，真正处理任务的时间反而成了零头，调度器把力气全花在了找任务上。

    若每次插入后都把全部任务完整排序，代价更大，而且排好的大部分次序根本用不上——你只关心谁最急，其余任务的相对次序完全无所谓。为用不上的信息付费，是这类场景最典型的浪费。

    优先队列就是只承诺一件事的数据结构：随时一步看到最急的，用对数级代价取出它或插入新任务。堆是实现它的经典结构：它维护的是一种偏序，只钉住父子大小关系，不建立全序，所以比排序便宜一截。本课后面所有操作，都是在修补这份偏序被插入与删除弄坏的那一小块。'
  derivation: original
  sources:
