- id: engineering
  title: 工程里的优先队列
  tldr: "最后收口到工程现场：调度器、定时器、从海量数据里取最大的十个，背后都是同一个堆。这一步逐项对号入座，再把堆做不到的事点名——按值查找任意元素、删除中间元素、全序遍历——免得拿它去干不该干的活。"
  body: >-
    React 的调度器用最小堆按过期时间管理任务。要从海量数据里找最大的 10 名，维护一个大小为 10 的最小堆即可（堆顶就是这 10 个里最小的，新元素比它大才替换），不用全部排序。JS 没有内置堆，需要自己写或用库；Java 有
    [[PriorityQueue]]，Python 有 [[heapq]]。定时器轮、请求优先级、[[Top-K|Top K]] 保留都是堆的直接应用：保留最大的 K 个元素用大小为 K 的最小堆，内存恒定 K。


    选型边界：堆不支持按值查找任意元素（只能线性扫描），也不支持高效删除中间元素，只适合元素从堆顶进出的场景；需要随时改名次时靠改键或惰性删除补位（上一节），需要全序遍历就该换平衡树。
  derivation: original
  sources:
