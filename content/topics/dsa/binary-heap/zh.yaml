steps:
- id: why
  title: 为什么需要优先队列
  tldr: "先把场面摆好：任务不断加进来，每次又都要先处理最急的那一个。这一步先算两笔账——用普通数组每次扫一遍找最急的有多贵、每次插入后全部重排又浪费在哪里——看清浪费之后，再说优先队列只承诺什么、凭什么能便宜。"
  body: |-
    任务不断加入，每次都要先处理最急的一个。用普通数组存，每次找最急的要扫一遍全部任务，是线性的；任务有 1 万个时，光找就要看 1 万眼，真正处理任务的时间反而成了零头。

    若每次插入后都把全部任务完整排序，代价更大，而且排好的大部分次序根本用不上——你只关心谁最急，其余任务的相对次序完全无所谓。为用不上的信息付费，是这类场景最典型的浪费。

    优先队列只承诺一件事：随时一步看到最急的，用对数级代价取出它或插入新任务。堆是实现它的经典结构：它维护的是一种偏序，只钉住父子大小关系，不建立全序，所以比排序便宜一截。本课后面所有操作，都是在修补这份偏序被插入与删除弄坏的那一小块。
