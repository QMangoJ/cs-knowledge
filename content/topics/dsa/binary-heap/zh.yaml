- id: decrease-key
  title: 堆的另一半：改小一个键（decrease-key）
  tldr: Dijkstra 里「发现更短的路」就是给已入堆的节点降值——降了之后让它上浮即可。
  body: '优先队列不只有进和出：Dijkstra 松弛时，新发现更短距离的那个节点往往已经在堆里了，需要把它的键改小。操作很直白：直接改值，然后从该位置上浮（sift-up）——键只变小，只需要往上修，不需要下沉。

    这也是「用堆优化 Dijkstra」的真正实现细节：很多语言的优先队列（JS 自写、Python heapq）并不提供 decrease-key，于是通行做法是「再 push 一份新距离，取出时发现是旧条目就跳过」（惰性删除）——堆里允许同一节点有多份，靠 dist 数组比对认人。复杂度上多出的条目不超过一条边一份，渐近不变。

    对偶操作 increase-key（改大）则是改值后下沉；两者合起来才让堆支撑得起带更新的调度场景。'
  derivation: original
  sources:
