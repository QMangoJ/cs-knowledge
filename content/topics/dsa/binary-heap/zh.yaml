      - v: 7
      - v: 5
      - v: 8
    aux:
    - label: 用途
      items:
      - React 调度器
      - Top 10
      - PriorityQueue / heapq
  log:
  - mode: 总结
    event: "选型结论收口为一句：只要随时取最急的就用堆，需要按值查找或全序遍历就换别的数据结构。"
- id: playground
  title: 动手实验与收束：亲手建堆再取顶，带走三条自检清单
  tldr: 亲手跑完逆序建堆与逐个取顶，验证输出严格递增，再对比逐个插入和自底向上两种建堆的交换次数，最后收齐整课的三条判断清单。
  body: |-
    先用「逆序」数组点建堆，盯着新元素怎样一步步比父亲小、一路上浮抢占堆顶；再换「近乎有序」看末尾那个 2 怎样从数组尾巴一格格爬到下标 1 附近。建完之后点单步取出：每次拿走堆顶、末尾补上来下沉，你会看见弹出来的序列严格递增——这就是堆排序的后半段。你也可以自己填一组数（最多 10 个）来试。

    接着做一组关键对照：拿同一组数分别跑一遍「逐个插入建堆」和「一次性自底向上建堆」，对比屏幕上的总交换次数，亲眼验证 O(n) 为什么省得多。如果某次实验弹出序列乱了顺序，不用猜，十有八九是某一步下沉时挑错了较大的孩子交换，单步倒回那一步就能定位。

    最后留一张全课带走清单，碰到优先队列场景对照这三条即可：① 形状换算术：完全二叉树无空洞，下标 0 起的父子关系直接靠 2i+1、2i+2 与 (i−1)/2 取整算，不用存指针；② 建堆与更新：批量建堆务必从最后一个非叶子倒着下沉（O(n)），改小键靠上浮（无接口就用[[惰性删除]]）；③ Top-K 与选型边界：留最大 K 个反而用小顶堆守门槛，要按值查找、删中间项或遍历全序就别勉强用堆，交给搜索树。口诀记一句：「完全二叉数组装，2i 加一二算父子；插尾上浮取顶沉，建堆倒着只要 n，Top-K 反用堆来守门。」
