- id: push
  title: 插入：放到末尾，再上浮
  tldr: 新任务先放在最后，如果比父节点小，就和父节点交换，一路往上。
  body: '新来一个优先级为 1 的任务，先无条件放到数组末尾（下标 6），保持完全二叉树的形状；此时只有它与父亲的关系可能违规：它在下标 6，父亲在下标 2，是 3，1 比 3 小，父子次序反了。

    上浮就是沿父链逐格修复：1 与 3 交换，1 到下标 2；再与新父亲下标 0 的 2 比较，1 比 2 小，再交换，1 到根；到根没有父亲，停。两次交换走了下标 6 到 2 到 0 的路径，恰好是树高。每上一层下标大致减半，所以最多对数级步数，1 万个任务约 14 步封顶。

    注意上浮只修一条链：其他父子对原本就合法，被换下的节点落入新位置后，需要重新检查的也只有链上的父子关系——这正是堆操作便宜的原因：一次插入只弄坏一条链，也只修一条链。若每插一个都要全树检查，堆就退化成反复排序了。'
  derivation: original
  sources:
  - ref: mit-6006
    locator: 二叉堆相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: 插入通过上浮恢复堆序，O(log n)
