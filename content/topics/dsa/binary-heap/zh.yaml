- id: shape
  title: 堆的样子：父节点总比孩子小
  tldr: 堆是一棵完全二叉树，每个父节点都不大于它的孩子，所以根就是最小值。
  body: '堆是一棵完全二叉树：除最后一层外每层填满，最后一层从左往右填。完全这个形状要求不是审美，而是为了能直接存进数组：按层编号，第 i 个节点（0 起）的左孩子必在 2i 加 1、右孩子在 2i 加 2、父亲在 (i 减 1) 除以 2 向下取整的位置，一格不空、一格不浪费。

    堆序规则只管父子：每个父节点都不大于它的孩子（小顶堆），兄弟之间谁大谁小无所谓，叔侄之间也不直接比较。画布里的树根是 2，左孩子 4、右孩子 3，3 比 4 小完全合法，因为规则从没要求过左右有序。

    由父子链可以推出根一定最小：任何节点沿父链上溯，值只减不增，走到根就是全树最小。所以堆不是排好序的数组——把堆按数组顺序读出来是 2、4、3、7、5、8，并不单调——但根的身份有铁保证。把堆误当有序数组用，是初学堆最常见的误解：堆只保极值，不保次序。'
  derivation: original
  sources:
