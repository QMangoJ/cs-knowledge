level: 进阶
minutes: 16
prereq:
- dsa/merge-quick-sort
objectives:
- 用完全二叉树的数组下标算父/子位置
- 描述上浮与下沉如何恢复堆序
- 说清建堆为什么是 O(n) 而非 O(n log n)
aiLink: 优先队列是调度器的心脏：推理服务的请求优先级队列、定时器与事件循环靠堆在 O(log n) 内取最值；束搜索（beam search）每步要保留 top-k 候选，也常借助堆或部分排序来做。理解堆，就理解这些系统如何排队。
quiz:
- q: 数组下标 i（0 起）的左孩子下标是？
  options:
  - i + 1
  - 2i + 1
  - 2i
  - i * i
  answer: 1
  explain: 0 起：左 2i+1、右 2i+2、父 floor((i-1)/2)。
- q: 堆顶元素是？
  options:
  - 中位数
  - 最小（最小堆）或最大（最大堆）的那个极值
  - 最后一个插入的
  - 随机的
  answer: 1
  explain: 堆只保证堆顶极值，内部只是偏序，不是全序。
- q: 逐个插入建堆与自底向上 heapify 的复杂度分别是？
  options:
  - 都是 O(n)
  - O(n log n) 与 O(n)
  - O(n) 与 O(n log n)
  - 都是 O(n²)
  answer: 1
  explain: heapify 利用多数节点在底层的事实，总工作量收敛到 O(n)。
