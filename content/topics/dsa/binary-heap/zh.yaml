    event: "账算清了：孩子数取多大由插入和取出的比例决定，没有脱离操作配比的最优值。"
- id: decrease-key
  title: 改急一个已进堆的任务：改小只管上浮，没有接口就[[惰性删除]]
  tldr: 已经躺进堆里的任务突然变急（键被改小）时，只要从当前位置沿着父链往上浮就够了；如果手头语言库没提供改键接口，直接再塞一条新记录进去、弹出时扔掉旧的更省事。
  body: |-
    在后面会学到的 [[Dijkstra]] 最短路径里，[[松弛]]操作发现一条更近的路时，就要把队列里某个点已知的距离改小（相当于某件在排队的任务突然变急了）。此时堆该怎么修？其实特别简单：既然它的值只变小没变大，它绝不会比原本就比它大的孩子大，唯一可能得罪的只有头上的父亲——直接就地改值，然后往上浮就修好了（相反如果把优先级调慢变大，就往下沉）。

    可你打开 Python [[heapq]] 或自己写一个轻量堆时，往往找不到 decrease-key 这个方法。为什么标准库懒得给？因为堆不记录「某个任务 ID 现在躺在数组几号格子」，想原地改它得先扫一遍数组（O(n)）或者再绑一张哈希表追踪下标，麻烦极了。工程上的懒人妙招叫[[惰性删除]]：直接把更急的新优先级再 push 一份进堆，等以后它浮到堆顶被 pop 出来时，顺手对照一下 dist 记录，发现手里这份已经是过期的旧记录就直接跳过扔掉。

    虽然堆里临时多留了几份过期条目，但总条数顶多不超过边数 E，对数高度几乎不变，代码却能少写一半还不用维护下标映射——这是实战写调度器和图算法最常用的做法。
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 6 优先队列：DECREASE-KEY
    claim: decrease-key 改小键后沿父链上浮是二叉堆支持优先队列更新的标准操作
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: tree
    caption: 某个键被改小之后，从它原来的位置一路向上浮，新的最小值来到堆顶
    tree:
      nodes:
      - v: 1
        mark: found
      - v: 4
      - v: 3
      - v: 7
      - v: 5
