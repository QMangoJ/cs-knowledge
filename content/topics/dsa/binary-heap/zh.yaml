- id: index-proof
  title: 不用指针怎么找父子：完全二叉树让位置直接变成下标算术
  tldr: 正因为完全二叉树前面每一层都填得严丝合缝，节点 i 的左右孩子下标必定是 2i+1 和 2i+2，父亲必定是 (i−1)/2 向下取整——三句算术直接省掉全部指针和缓存跳转。
  body: |-
    普通二叉树非得存 left、right 指针不可，是因为中间可能留空洞，你算不准下一层到底偏移了几格；可完全二叉树把所有空洞都挤没了，每个人的孩子站哪几号格子完全由「排在前面一共有多少人」决定。从 0 开始数一遍：下标 0（树根 2）生 2 个孩子，占掉紧接着的下标 1 和 2；下标 0 和 1 两人合计生 4 个孩子，严严实实占满下标 1 到 4；归纳下去，下标 0 到 i 一共 i + 1 个人，合计生出 2(i + 1) = 2i + 2 个孩子，刚好填满下标 1 到 2i + 2。

    既然前 i + 1 个人的孩子把 1 到 2i + 2 全占满了，排在最后的节点 i 的两个孩子就只能是最后两格：左孩子 2i + 1、右孩子 2i + 2。反过来，不管是左孩子 2i + 1 还是右孩子 2i + 2，套进 (孩子下标 − 1) / 2 向下取整，算出来的全都是 i！拿画布里刚挂上的下标 6（数值 9）验算：(6 − 1) / 2 向下取整等于 2，它父亲果然是下标 2（数值 3）；下标 2 的两个孩子就是 2×2+1 = 5（8）和 2×2+2 = 6（9），分毫不差。

    别小看这三句小学算术，它是堆跑得飞快的地基。如果改用指针树，每个节点光是存左孩子、右孩子、父亲三个指针就要多背一截内存，节点还会零散落在内存各处，跳一步就缓存未命中一次；压成连续数组后，不仅零指针开销，相邻父子还常常躺在同一个[[缓存行]]里。
