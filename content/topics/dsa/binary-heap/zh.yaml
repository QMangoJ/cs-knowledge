  code:
    lang: typescript
    code: |-
      class MinHeap {
        a: number[] = [];
        push(x: number) { const a = this.a; a.push(x); let i = a.length - 1;
          while (i > 0) { const p = (i - 1) >> 1; if (a[p]! <= a[i]!) break; [a[p], a[i]] = [a[i]!, a[p]!]; i = p; } }
        pop(): number | undefined { const a = this.a, top = a[0]; const last = a.pop();
          if (a.length && last !== undefined) { a[0] = last; let i = 0;
            for (;;) { const l = 2 * i + 1, r = l + 1; let m = i;
              if (l < a.length && a[l]! < a[m]!) m = l; if (r < a.length && a[r]! < a[m]!) m = r;
              if (m === i) break; [a[m], a[i]] = [a[i]!, a[m]!]; i = m; } }
          return top; }
      }
    note: 上浮/下沉的 TypeScript 实现
- id: pop
  title: 取出最急任务：拿末尾补到根上，再挑较小孩子下沉
  tldr: 拿走堆顶后必须把数组最后一个元素补到根上，再让它一路跟两个孩子里更急的那个交换下沉——只有挑较小的孩子换上去，才不会在旁边留下一颗更大违规雷。
  body: |-
    最急的 1 被工人拎走处理后，下标 0 空了出来。如果直接让左孩子 4 或右孩子 2 挪上去，底下立刻留出一个大洞，完全二叉树就散架了。标准做法极其干脆：把数组最末尾（下标 6）的 3 直接拆下来放到根上，数组长度减 1，形状立刻完整。代价只是现在根上的 3 比底下的孩子 4 和 2 大，临时破了堆序。

    于是从根开始下沉：看看 3 的两个孩子 4（下标 1）和 2（下标 2），挑出更小的 2 和 3 交换，3 落到下标 2，新的根变成 2。继续往下看，下标 2 的孩子在下标 5 和 6，现在数组一共只剩 0 到 5 这 6 个元素，所以只有一个左孩子 8（下标 5）。3 比 8 小，合乎规矩，当场停下，堆又恢复成 [2, 4, 3, 7, 5, 8]。

    这里藏着一个新手最容易写错的卡点：为什么下沉一定要挑「较小」的那个孩子交换？试想如果刚才把较大的 4 换上根，4 坐到顶上却比留在一旁的兄弟 2 还大，根立刻又违规了！挑较小的 2 换上去，既能压住 3，也一定压得住 4（因为 2 ≤ 4），一步就能把这一层彻底修干净。
