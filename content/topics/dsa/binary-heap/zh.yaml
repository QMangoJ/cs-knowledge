      - v: 2
      - v: 8
      - v: …
        sub: 2000 个
    aux:
    - label: 两条路线
      items:
      - 逐个插入：省内存，比较多
      - 拼接建堆：比较少，要新数组
      - 高频合并：换可合并堆
