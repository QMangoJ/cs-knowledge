  code:
    lang: typescript
    code: |-
      class MinHeap {
        a: number[] = [];
        push(x: number) { const a = this.a; a.push(x); let i = a.length - 1;
          while (i > 0) { const p = (i - 1) >> 1; if (a[p]! <= a[i]!) break; [a[p], a[i]] = [a[i]!, a[p]!]; i = p; } }
        pop(): number | undefined { const a = this.a, top = a[0]; const last = a.pop();
          if (a.length && last !== undefined) { a[0] = last; let i = 0;
            for (;;) { const l = 2 * i + 1, r = l + 1; let m = i;
              if (l < a.length && a[l]! < a[m]!) m = l; if (r < a.length && a[r]! < a[m]!) m = r;
              if (m === i) break; [a[m], a[i]] = [a[i]!, a[m]!]; i = m; } }
          return top; }
      }
    note: 上浮/下沉的 TypeScript 实现
- id: pop
  title: 取出堆顶：末尾补上，再下沉
  tldr: "插入会了，取出是对偶的动作：堆顶被拿走之后，根的位置空了出来。这一步看末尾元素怎样补到根上、再一步步和较小的孩子交换沉下去，并说清为什么必须挑较小的那个孩子交换。"
  body: >-
    取出堆顶分三步：先把根 1 拿走；再把数组末尾元素 3 挪到根上顶替（数组长度减一，形状不破）；此时唯一可能违规的是根：3 与孩子 4 和 2 需要重新裁定。


    下沉与较小的孩子交换：3 的孩子是 4 与 2，较小的是 2，3 比 2 大，交换，3 落到下标 2；再看新位置的孩子，下标 2 的孩子在下标 5 与 6，数组里只剩到下标 5 的 8，3 比 8 小，停。最终堆为
    2、4、3、7、5、8，新根 2 是剩余任务里最急的。


    为什么必须与较小的孩子换：若把较大的 4 换到根，4 又比留在下面的 2 大，违规只是搬了个位置。与较小者交换能保证换上去的节点不大于两个孩子，一步修好一层。步数最多是树高，1 万个任务十几步足够。
  derivation: original
