- id: push
  title: 插入：放到末尾，再上浮
  tldr: 新任务先放在最后，如果比父节点小，就和父节点交换，一路往上。
  body: '新来一个优先级为 1 的任务，放到数组末尾。

    它比父节点小，就交换，直到父节点比它小或者到了根。

    最多走树的高度，也就是 log n 步。'
  derivation: original
  sources:
  - ref: mit-6006
    locator: 二叉堆相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: 插入通过上浮恢复堆序，O(log n)
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
  canvas:
    kind: datastate
    structure: tree
    caption: 1 放到末尾（位置 6），比父节点小就交换：6 → 2 → 0
    tree:
      nodes:
      - v: 1
        mark: new
      - v: 4
      - v: 2
        mark: active
      - v: 7
      - v: 5
      - v: 8
      - v: 3
