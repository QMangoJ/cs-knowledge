- id: index-proof
  title: 下标公式哪里来：一次计数证明
  tldr: "上一歩说孩子的位置能用公式算出来，可公式不是约定出来的。这一步把左孩子 2i+1、右孩子 2i+2 这套下标数出来：从第一个节点开始，数清前面所有节点的孩子正好占满哪一段下标，公式自然落地；最后再算这套算术替指针存储省下了什么。"
  body: >-
    下标公式可以数出来：节点按层序排成一队，前面若干个节点的孩子恰好连续地排在后面一段里。节点 0 的孩子占下标 1、2；节点 0 与 1 的孩子合计占下标 1 到 4；归纳下去，节点 0 到 i 的孩子正好占满下标 1 到 2i 加
    2。


    于是节点 i 的两个孩子就是这段的最后两个：2i 加 1 与 2i 加 2。反解父亲：合并两种情况，父亲下标等于 (孩子下标减 1) 除以 2 向下取整。走例：下标 6 的父亲是 5 除以 2 取整得 2，下标 2 的孩子是 5 与
    6，与画布的树对得上。


    这套算术是堆效率的地基：找父亲、找孩子都是常数时间，不用存指针。若改用指针树，每个节点要多存左右孩子与父亲三个指针，内存成倍增加且节点散落、缓存全毁。公式成立的前提是完全二叉树这个形状约束：是形状，让算术替代了存储。
  derivation: original
