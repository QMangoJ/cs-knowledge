      items:
      - 改小 → 上浮
      - 改大 → 下沉
      - 无此 API → 惰性删除
  log:
  - mode: 更新
    event: decrease-key 后节点上浮到新位置

- id: merge-heaps
  title: 合并两个堆：二叉堆的软肋
  tldr: 没有合并接口：逐个插入是 m log n，拼起来整体建堆是线性，后者更快但要新数组。
  body: '把两个堆合成一个，朴素做法并不便宜：二叉堆没有为合并留任何结构接口，只能把小堆的元素逐个插入大堆，m 个元素各走一次上浮，代价随 m 与 log n 相乘增长；或者把两个数组拼起来整体建堆，代价是线性的。后者反而更快，但这已是这条路线能到的下限量级。

    走个数字对比：两个各含 1000 个元素的堆合并，逐个插入约 1000 次乘以约 11 步，合计上万次比较量级；拼接加建堆约 4000 次量级。更重要的是内存账：拼接需要新开一块容纳全部元素的数组，原地逐个插入则零额外空间——快与省内存在这里直接对立，和归并排序付空间买速度是同一笔账。

    若业务真的高频合并（如并行调度里不断归并子队列），二叉堆就不是对的工具：二项堆等可合并堆把合并压到对数级，代价是放弃数组存储、回到指针结构，单次插入与取出的常数更大。选型顺序永远是先列操作清单：合并是不是高频操作，答案不同，数据结构就不同。'
  derivation: original
  sources:
  - ref: clrs
    locator: Chapter 6 建堆与堆的合并
    claim: 两个数组拼接后自底向上建堆可在线性时间内得到一个堆
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: 两个 1000 元堆合并：逐个插入约上万次比较，拼接建堆约 4000 次量级，但要新开整块数组
    rows:
    - label: 堆 A
      cells:
      - v: 2
      - v: 5
      - v: 9
      - v: '…'
        sub: 1000 个
    - label: 堆 B
      cells:
      - v: 1
      - v: 6
      - v: 8
      - v: '…'
        sub: 1000 个
    - label: 拼接建堆后
      cells:
      - v: 1
        mark: found
      - v: 2
      - v: 8
      - v: '…'
        sub: 2000 个
    aux:
    - label: 两条路线
      items:
      - 逐个插入：省内存，比较多
      - 拼接建堆：比较少，要新数组
      - 高频合并：换可合并堆
  log:
  - mode: 取舍
    event: 合并暴露二叉堆的边界
- id: engineering
  title: 工程里的优先队列
  tldr: 调度器、定时器、Top K 问题，背后常常是一个堆。
  body: 'React 的调度器用最小堆按过期时间管理任务，先处理最急的更新。

    要从海量数据里找最大的 10 名，可以维护一个大小为 10 的最小堆（堆顶就是这 10 个里最小的，新元素比它大才替换），不用全部排序。

    JS 没有内置堆，需要自己写或用库；Java 有 PriorityQueue，Python 有 heapq。


    工程注记：定时器轮、请求优先级、Top-K 保留都是堆的直接应用：保留最大的 K 个元素用大小为 K 的最小堆，流式数据来多少处理多少，内存恒定 K。

    选型边界也要划清：堆不支持按值查找任意元素（只能线性扫描），也不支持高效删除中间元素，所以它只适合元素从堆顶进出的场景；需要按优先级随时改名次时，靠改键或惰性删除补位（上一节），需要全序遍历就该换平衡树。把堆当万能队列用，最后都会在这些缺口上付账。'
  derivation: original
  sources:
  - ref: mit-6006
    locator: 二叉堆相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: 堆用于实现优先队列
