id: dsa/binary-search
subject: dsa
slug: binary-search
order: 2
status: published
license: CC-BY-4.0
title: 二分查找：每次排除一半
summary: 二分查找靠的其实就一句话：只要数据具备「左边全不够、右边全够」的单调性，每次只看一眼正中间就能直接砍掉一半候选，10 亿个数最多也只要比 30 次。思路一句话就能听懂，真正写错的全在细节——右端点算不算在区间里、取中点怎么防整数溢出、遇到重复数怎么找最左边界。全课先用直观的对半砍立住「不错杀、每轮必缩」两条铁律，再打通下界定位、答案域二分、旋转数组和数据库 B+ 树里的页内查找。
premise: 面对一排已经按从小到大排好的数字 [2, 5, 8, 12, 16, 23, 38, 56]，想找 23 在哪。从头一个个翻过去太慢，既然数字已经排好队，能不能每次只瞄一眼正中间那个数，就直接把一半候选划掉？这一课就拿这 8 个数一路跑到尾，顺便把最容易把人写死循环的边界写法一次理清。
position: 本课仍在「按名与按序查找」板块内，紧接在哈希表之后。上一课把键打散换来了按名直达，代价是丢光了大小顺序；这一课把顺序捡回来，靠数组已经排好队的特性换取每次砍掉一半候选的本事，同时也为下一课怎么把乱序数组排好序做好铺垫。学完后你不仅能用不变量把闭区间和半开区间一次写对，还能在没有数组只有单调规律时照样用上二分。
bridge:
  prev: 上一课哈希表把键打散塞进桶里，换来了按名直达却丢光了顺序；这一课反过来守住「已经排好序」这个前提，靠一次比较就直接砍掉一半候选。
  next: 二分跑得飞快，但前提是手里的数组已经排好序。面对乱序数组，下一课归并排序与快速排序就专门解决这件事：怎样用 O(n log n) 的代价把整排数字排整齐。
overview:
- key: 一句话总结
  value: 前提是有序且能按下标直达；每次拿正中间元素比一次，就把候选范围砍掉一半。比如在 8 个数里找 23，先看中间的 12，比它大就只留下右半边，两步就命中答案。
- key: 复杂度
  value: 最多比较次数是 [[O(log n)|大 O 记号]]，100 万个元素最多约 20 次比较。每比一次候选减半，100 万砍到只剩 1 个只需要大约 20 刀，所以数据量暴涨时查找耗时几乎感觉不到变化。
- key: 前提
  value: 数据必须有序（或具备单调性），而且能按下标一步跳到中间。没有顺序，比一次根本判不出目标在哪半边；换作链表不能一步跳到中点，每轮光走去中点就要花线性时间，二分立刻失效。
- key: 工程里
  value: "[[lodash]] 的 [[sortedIndex]]、数据库 [[B+ 树]]在每一页内部定位键、[[git bisect]] 追查哪次提交引入 bug，底下跑的都是这套对半砍思路。git bisect 就是把提交历史当成排好序的序列，每次测中间那次提交来缩半范围。"
- key: 易错点
  value: 最容易翻车的是边界条件——区间到底包不包含右端点，混写一位就会漏判或死循环；另外直接写 (lo + hi) / 2 在大数组时会整数溢出。动手写代码前先把区间开闭说死，能挡掉九成 bug。
- key: 变体
  value: 常见变体有 [[lower_bound]] 和 [[upper_bound]]，专门在有重复元素时卡出第一个大于等于或大于目标的位置；还可以直接在答案本身上二分——只要「某值行不行」随数值单调切一刀，就能二分找分界线。
- key: 不变式
  value: 核心不变式只有一句：只要目标还存在，它就一定留在当前区间里。每轮只扔掉确定不含目标的那一半，守住这一条，最后区间缩到空时就能百分之百断定目标不存在，绝不错杀。
