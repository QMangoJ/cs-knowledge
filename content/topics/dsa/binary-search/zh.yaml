- id: complexity
  title: 为什么是 O(log n)
  tldr: 每次减半，n 个元素最多减半 log₂n 次就只剩一个。
  body: '8 个元素最多比 4 次，100 万个元素最多约 20 次，10 亿个也只要约 30 次。

    数据量翻倍，只多比较一次，这就是对数增长。

    数据库索引能瞬间定位主要靠 B+ 树的低深度（详见数据存储科），二分是它在每个节点内部查找键的那一环。'
  derivation: original
