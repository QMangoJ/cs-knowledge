level: 基础
minutes: 20
prereq:
- dsa/hash-table
objectives:
- 在闭区间/半开区间两种写法下都写对二分
- 实现 lower_bound 并处理重复元素
- 识别可在答案上二分的单调性问题
aiLink: 二分在 AI 工程里以「阈值搜索」的样子反复出现：当指标随参数单调变化时，可在代价曲线上二分找最优的置信度阈值、批大小、量化档位（不单调时不适用，要先验证单调性）。另作类比：向量检索的图索引（HNSW）同样逐层缩小候选范围，但机制是图上的贪心游走，不是二分。掌握不变式写法，这类搜索就不会写出边界 bug。
quiz:
- q: 左闭右开 [lo, hi) 写法里，循环条件与收缩正确的是？
  options:
  - lo <= hi，hi = mid
  - lo < hi，a[mid] < x 时 lo = mid + 1，否则 hi = mid
  - lo < hi，hi = mid - 1
  - lo <= hi，lo = mid
  answer: 1
  explain: 半开区间为空的条件是 lo == hi；保留 mid 可能是答案的一侧用 hi = mid。
- q: mid = lo + (hi - lo) / 2 而不是 (lo + hi) / 2，是为了？
  options:
  - 写起来好看
  - 避免 lo + hi 超出固定位数整数上限而溢出
  - 让结果更大
  - 兼容链表
  answer: 1
  explain: Java 标准库这个溢出 bug 存在多年（Bloch 2006 年博文）；JS 数字是双精度浮点，整数在 ±(2^53−1) 内可精确表示，但思想要懂。
- q: 数组 [5,12,23,23,23,38] 中 23 出现几次，用什么算？
  options:
  - lower_bound 一次
  - upper_bound − lower_bound = 5 − 2 = 3
  - 找到一个后数邻居最坏 O(n) 不可取
  - 哈希计数
  answer: 1
  explain: 两个边界之差即出现次数，全程 O(log n)。
- q: 「在答案上二分」的前提是？
  options:
  - 数组必须有序
  - 可行性随答案单调：小于某值都不可行、大于等于都可行（或反之）
  - 答案是整数
  - 数据量很大
  answer: 1
  explain: 单调性才是本质前提，数组有序只是最常见的单调来源。
