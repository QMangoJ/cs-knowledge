- id: middle
  title: 看正中间一刀砍一半：不错杀，也不原地踏步
  tldr: 每次拿区间正中间的数比一次，就能连带中点一起毙掉一整半候选。整个算法能不能跑对全看两句话：目标如果存在就绝不被踢出区间，且每轮过后区间必须严格变小。
  body: |-
    开局把全部 8 个数 `[2, 5, 8, 12, 16, 23, 38, 56]` 框进来，左端下标 `lo = 0`，右端下标 `hi = 7`。正中间下标是 `(0 + 7) ÷ 2` 向下取整得 `3`，格子里的数是 `12`。拿目标 `23` 和 `12` 一比，`23 > 12`，按从小到大排列，`12` 连同它左边的 `2、5、8` 全都没戏了。

    等一下，为什么一定要看「正中间」而不是 1/4 处？因为比较之前你根本不知道目标会落在哪半边：如果挑 1/4 的位置，万一目标落在占 3/4 的那一边，你这一轮只排除了 25%；唯有挑正中间，不管目标偏向哪头，最坏都能稳稳砍掉一半。这一刀下去，下标 0 到 3 共 4 个数整片变灰，候选一下缩成右边 `[16, 23, 38, 56]`（下标 4 到 7）。

    没直接命中 23 也一点不亏——一次比较买到了 4 个元素的出局判决。把动作收成两句铁律：第一，目标只要存在，就一定还留在当前区间里（这就是[[循环不变式]]），保证绝不错杀；第二，每一轮候选区间都要严格变小，保证早晚能停下来。后面所有边界写法和死循环 bug，全都能拿这两句照出来。
