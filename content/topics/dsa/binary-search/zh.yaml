  tldr: 逐个比对是 O(n)；如果数据已经排好序，就能利用顺序大幅减少比较。
  body: '在 8 个数里找 23，从头看最多要看 8 次。

    但数组有序时，看一个数就能知道目标在它左边还是右边。

    就像翻字典，不会从第一页翻起，而是直接翻到中间附近。'
