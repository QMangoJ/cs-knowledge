level: 基础
minutes: 34
prereq:
- dsa/hash-table
objectives:
- 在闭区间/半开区间两种写法下都写对二分
- 实现 lower_bound 并处理重复元素
- 识别可在答案上二分的单调性问题
aiLink: 二分在 AI
  工程里以「阈值搜索」的样子反复出现：当指标随参数单调变化时，可在代价曲线上二分找最优的置信度阈值、批大小、量化档位（不单调时不适用，要先验证单调性）。另作类比：向量检索的图索引（HNSW）同样逐层缩小候选范围，但机制是图上的贪心游走，不是二分。掌握不变式写法，这类搜索就不会写出边界
  bug。
design:
- mechanism: 中点写成 lo 加 (hi 减 lo) 除以 2 时，先算出的区间长度不超过区间本身，中间量永远落在合法下标内；写成 (lo 加 hi) 除以 2 时加法先行，中间和可达下标上限的两倍，先溢出再除法也救不回来。
  problem: 在固定位数整数里（如上限约 21 亿的 int），lo 与 hi 各自合法、互不溢出，但两者之和可以越界变负，后续除法与下标访问随之全错；且它只在大数组时触发，小规模测试永远撞不见。
  choice: 统一写 lo 加 (hi 减 lo) 除以 2，或用语言提供的安全中点写法，把防溢出写进模板而不是靠临场记忆；JS 数字虽是双精度浮点、安全整数范围内精确，这个习惯仍保留，换到任何语言都不翻车。
  tradeoff: 代价几乎为零：多一次减法。真正要付的是纪律成本——每一处二分都要同一种写法，任何一处图省事写回加法平均，bug 就从那一处原样回来，且依然只在大数据量时发作。
  root: 根源是有限位宽算术不满足数学整数的封闭性：加法可以溢出，同量减法的结果仍在区间内。Bloch 在 2006 年指出该 bug 在 JDK 的二分与归并实现里潜伏约九年，教训是正确性要在表示范围内证明，不能只在数学整数上证明。
- mechanism: 二分的正确性可完全写成一条循环不变式（目标若存在必在当前区间内）加一条终止性（区间每轮严格变小）；区间语义一旦选定，循环条件与两种收缩写法就被这两条唯一决定，没有自由发挥的余地。
  problem: 二分公认是最难写对的简单算法：边界差一、收缩差一格，症状不是立刻报错，而是偶尔死循环、偶尔漏掉边界元素，且小数据上常常碰巧全对，问题拖到生产才暴露。
  choice: 先定区间语义再写代码：半开区间配 lo 小于 hi 与 hi 等于 mid，闭区间配 lo 小于等于 hi 与 mid 加减一；写完后用空区间、单元素、目标在两端三组最小用例逐条分支验算，再上线。
  tradeoff: 半开区间与长度、插入点天然对齐，写边界搜索更顺手；闭区间更贴近口头直觉，初学更易上手。两者没有优劣，只有全程一致才有意义，混写的代价就是上面那类隐形 bug。
  root: 根源在于二分的对错是归纳证明问题，而不是经验问题：不变式是归纳假设，每轮收缩是归纳步。先写证明骨架再落代码，边界就不再靠试错碰运气，这是它与普通循环最本质的区别。
- mechanism: 二分真正依赖的不是数组有序这个表象，而是谓词沿搜索方向单调：比较一次能稳定宣判一整半候选的生死。数组有序、答案可行性单调、旋转数组的半侧有序，都是这条单调性的不同来源。
  problem: 许多问题表面上没有现成的有序数组：参数调优要找最小可行值、日志定位要找第一个坏版本、旋转数组整体无序。若把二分等同于在数组里找数，这些问题都会被误判为与二分无关。
  choice: 先构造并验证单调谓词，再套用不变式模板：答案域问题先写可行性检查并验证其单调，旋转数组每轮先判哪半有序。验证通过，模板原样复用；不通过，立刻放弃二分另寻算法。
  tradeoff: 代价是每道题都要先付单调性的证明与测试成本，且谓词检查本身若是线性扫描，总复杂度要乘上检查成本；换来的是同一套已验模板覆盖一大类问题，不必每题重新发明搜索。
  root: 根源在信息论：一次比较至多排除一半候选，要求被排除的那一半有统一的判死理由，只有全序或单调结构能持续提供这种理由。没有单调性，比较就排除不了恒定比例，二分在原理上无从成立。
quiz:
- q: 左闭右开 [lo, hi) 写法里，循环条件与收缩正确的是？
  options:
  - lo <= hi，hi = mid
  - lo < hi，a[mid] < x 时 lo = mid + 1，否则 hi = mid
  - lo < hi，hi = mid - 1
  - lo <= hi，lo = mid
  answer: 1
  explain: 半开区间为空的条件是 lo == hi；保留 mid 可能是答案的一侧用 hi = mid。
- q: mid = lo + (hi - lo) / 2 而不是 (lo + hi) / 2，是为了？
  options:
  - 写起来好看
  - 避免 lo + hi 超出固定位数整数上限而溢出
  - 让结果更大
  - 兼容链表
  answer: 1
  explain: Java 标准库这个溢出 bug 存在多年（Bloch 2006 年博文）；JS 数字是双精度浮点，整数在 ±(2^53−1) 内可精确表示，但思想要懂。
- q: 数组 [5,12,23,23,23,38] 中 23 出现几次，用什么算？
  options:
  - lower_bound 一次
  - upper_bound − lower_bound = 5 − 2 = 3
  - 找到一个后数邻居最坏 O(n) 不可取
  - 哈希计数
  answer: 1
  explain: 两个边界之差即出现次数，全程 O(log n)。
- q: 「在答案上二分」的前提是？
  options:
  - 数组必须有序
  - 可行性随答案单调：小于某值都不可行、大于等于都可行（或反之）
  - 答案是整数
  - 数据量很大
  answer: 1
  explain: 单调性才是本质前提，数组有序只是最常见的单调来源。
