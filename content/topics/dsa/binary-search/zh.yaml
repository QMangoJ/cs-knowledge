steps:
- id: why
  title: 为什么不一个个找
  tldr: "先看最笨的办法有多慢：在排好序的 8 个数里找 23，一个个比过去要比到第 6 个才命中。这一步先把逐个查找的账算清，再点出有序这个前提里藏着一份没用上的信息——看中任意一个数，就能知道目标只可能在哪一边。"
  body: >-
    在 8 个数里找 23，从头比对 2、5、8、12、16，到第 6 个才命中；找不存在的 7，要看完 8 个才能下结论。数组有 100 万个元素时，最坏 100 万次比对，这就是线性查找的 O(n)。


    但数组有序时，看一个数就知道目标在哪边：看到 12 就知道 23
    只可能在右边，左边再不用看。有序等于每比较一次排除一片，而不是只排除一个——这是二分成立的全部信息来源。前提是数据有序：无序时中间数对目标位置毫无提示，二分立刻失效。写二分的第一反应应是先确认有序，而不是先写循环。

    这个差距放到真实系统里更刺眼：一张 1 亿行的表如果逐行比对，一次查找就要扫上亿次；而同样的查找落到有序索引上，只需要约 27 次比较。本课后面讲的 [[B+ 树]]节点内二分，用的正是这套每次排除一半的动作。
