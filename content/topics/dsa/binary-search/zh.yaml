id: dsa/binary-search
subject: dsa
slug: binary-search
order: 2
status: published
license: CC-BY-4.0
title: 二分查找：每次排除一半
summary: 在有序数组里找东西，每次看中间，排除一半，很快就能找到。
premise: 以在 [2, 5, 8, 12, 16, 23, 38, 56] 中找 23 为例。
position: >-
  本课仍在「按名与按序查找」板块内，它接在哈希表把键打散、顺序信息全丢之后，换一条路：利用数组本身的有序性来查找。学完你能用循环不变式检查闭区间与半开区间两种写法是否写对，并说清 lower_bound 如何在重复元素里定位第一个不小于目标的位置。
bridge:
  prev: >-
    上一课哈希表用取余把键塞进桶里换来平均一步到达，本课则放弃打散，转而守住有序数组这个前提来换取每次排除一半的判定力。
  next: >-
    二分的前提是数组先要有序，下一课归并与快排要解决的正是：怎样把无序数组以 O(n log n) 的代价整体排好序。
overview:
- key: 一句话总结
  value: 前提是有序；每次比较中间元素，范围减半
- key: 复杂度
  value: O(log n)：100 万个元素最多约 20 次比较
- key: 前提
  value: 数据必须有序，且能按下标直接访问
- key: 工程里
  value: lodash 的 sortedIndex、数据库 B+ 树在节点内对键二分、git bisect 找出引入 bug 的提交
- key: 易错点
  value: 边界条件（左闭右开还是闭区间）、取中间时整数溢出
- key: 变体
  value: lower_bound / upper_bound、在单调的答案上二分
- key: 不变式
  value: 目标若存在，一定在当前区间内
visual: datastate
logColumns:
- key: mode
  label: 当前状态
- key: event
  label: 发生了什么
steps:
- id: why
  title: 为什么不一个个找
  tldr: 逐个比对是 O(n)；如果数据已经排好序，就能利用顺序大幅减少比较。
  body: '在 8 个数里找 23，从头看要依次比对 2、5、8、12、16，到第 6 个才命中；找一个不存在的数如 7，则要把 8 个全看完才能下结论。数组有 100 万个元素时，最坏就是 100 万次比对，这就是线性查找的 O(n)。

    但数组有序时，看一个数就能知道目标在它左边还是右边：看到 12 就知道 23 只可能在右边，左边的数再也不用看。有序等于每比较一次都能排除一片，而不是只排除一个，这是二分能成立的全部信息来源。

    就像翻字典，不会从第一页翻起，而是直接翻到中间附近。注意前提缺一不可：数据无序时，看中间的数对目标位置毫无提示，二分立刻失效；这也是为什么写二分的第一反应应该是先确认有序，而不是先写循环。'
  derivation: original
  sources:
