  code:
    lang: typescript
    code: "// lower_bound（半开区间 [lo, hi)）：第一个 >= x 的位置；重复元素时落在最左那个\nfunction lowerBound(a: number[], x: number): number {\n  let lo = 0, hi = a.length;\n  while (lo < hi) {\n    const mid = lo + ((hi - lo) >> 1);\n    if (a[mid]! < x) lo = mid + 1; else hi = mid;\n  }\n  return lo; // upper_bound 把条件换成 <= ，两者相减 = x 出现次数\n}"
    note: 处理重复元素的关键工具
    highlight: 6
- id: answer-domain
  title: 答案域二分走例：最小可行速度
  tldr: 被二分的不是数组，而是单调的可行性谓词：找第一个可行的 k。
  body: '把变体落到一个完整走例。四个工单的工作量是 3、6、7、11，必须在总计 8 小时内做完，处理速度为每小时 k 件，k 越大越轻松。问最小的 k。可行性检查是确定的：给定 k，每个工单耗时是工作量除以 k 向上取整，求和后与 8 比较即可。

    逐个验算分界两侧：k 等于 3 时四单耗时 1、2、3、4，合计 10 小时，超时，不可行；k 等于 4 时是 1、2、2、3，合计 8 小时，刚好可行；k 等于 5 时 1、2、2、3 合计 8，可行；k 等于 6 时 1、1、2、2 合计 6，可行。可以看到可行性在 k 等于 4 处由假翻真，之后恒为真，单调分界清晰。

    于是在 k 的范围 1 到 11 上二分找第一个可行值：中点 6 可行，上界收到 6；中点 3 不可行，下界升到 4；中点 5 可行，上界收到 5；中点 4 可行，上界收到 4，上下界相遇，答案 k 等于 4。全程检查 4 次，每次检查要扫一遍工单，总复杂度是检查次数乘工单数，比从 k 等于 1 逐个试快得多。注意：被二分的根本不是数组，而是单调谓词。'
  derivation: original
  sources:
  - ref: mit-6006
    locator: 二分查找与单调谓词相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: 只要可行性随答案单调变化，就可以在答案域上二分找最小可行值
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
