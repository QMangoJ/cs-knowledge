- id: repeat
  title: 重复，直到找到或范围为空
  tldr: 在剩下的范围里继续取中间、比较、减半。
  body: '在剩下的 16、23、38、56 里继续：下标范围 4 到 7，中间是 (4 加 7) 除以 2 取整等于 5，对应元素正好是 23，命中，返回下标 5。总共只比 2 次，线性查找找同一个数要比 6 次。

    如果目标不存在，比如找 20：第一轮排除左半，第二轮中间 23 比 20 大，排除包含 23 的右半，第三轮只剩 16，16 比 20 小也排除，区间变空，循环结束返回未找到。区间为空是唯一可靠的缺席证明，因为不变式保证目标从没被错杀过。

    很多实现不只返回有或没有，还返回它应该插在哪里（插入点），lodash 的 sortedIndex 返回的就是这个位置：插入点左侧都小于目标、右侧都不小于目标，这个信息在维护有序数组时可以直接拿来用。'
