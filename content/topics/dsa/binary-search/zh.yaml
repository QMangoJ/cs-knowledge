- id: engineering
  title: 前提和陷阱
  tldr: "最后收口：二分再快，前提不满足也不能用。这一步逐条点名不适合的场景——数据无序、链表存法、频繁增删——并讲一个在 Java 标准库里潜伏了约 9 年的取中点溢出 bug，说明那条老规矩为什么换到任何语言都要保留。"
  body: >-
    数据经常变化时每次重新排序不划算，哈希表或平衡树更合适；链表不能跳到中间，也不能高效二分；二分不只用于数组——[[git bisect]] 在提交历史里二分，找出哪次提交引入了 bug。


    溢出故事：(lo + hi) / 2 的 bug 在 Java 的 Arrays.binarySearch 里潜伏约 9 年才被公开——索引接近 2^30 时 lo + hi 会超过 int 上限变负数。JS
    数字是双精度浮点、整数在 ±(2^53−1) 内可精确表示（MAX_SAFE_INTEGER），不会真溢出，但 lo + (hi - lo) / 2 的习惯要保留，换到任何语言都安全。


    常被忽略的前提是随机访问：二分每步都要跳到中点，数组按下标一步跳达，链表只能从头走，跳一次中点就是 O(n)，优势归零。频繁增删同理：维持有序数组的插入删除是 O(n) 搬移，查得再快也会被写操作吃掉，这时该换平衡树或哈希表。
