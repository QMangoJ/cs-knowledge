- id: rotated-array
  title: 旋转数组：在半有序里二分
  tldr: 整体不单调，但任意中点切开至少有一半有序；先判哪半有序，再判目标在不在它的值域里。
  body: '旋转数组是把有序数组从某处切一刀、两段互换：2、5、8、12、16、23、38、56 从 16 处切开，变成 16、23、38、56、2、5、8、12。整体不再单调，普通二分失效，但它保留了局部单调：任意中点切开，左右两半至少有一半是完整有序的。

    找 5 的完整走例：第一轮区间下标 0 到 7，中点下标 3 是 56。比较左端 16 与 56，左端不大于中点，说明左半 16、23、38、56 有序；5 不在 16 到 56 之间，所以目标只可能在右半，下界升到 4。第二轮区间 4 到 7，中点下标 5 正是 5，命中。两轮收工，与普通二分同为 O(log n)。

    每轮的判据只有一句：先定哪半有序，再看目标落不落在那半的值域内，落在就去那半，不落就去另一半。易错点在有重复元素时：若左端、中点、右端三值相等，就分不清哪半有序，只能把两端各缩一格，最坏退化到 O(n)——这是重复元素给旋转二分开的唯一后门。'
  derivation: original
