- id: engineering
  title: 前提和陷阱
  tldr: 必须有序且能随机访问；边界条件最容易写错。
  body: '如果数据经常变化，每次都重新排序就不划算，这时哈希表或平衡树更合适。

    链表不能直接跳到中间，所以不能高效二分。

    二分的思想也不只用于数组：git bisect 在提交历史里二分，找出是哪次提交引入了 bug。


    溢出的真实故事：(lo + hi) / 2 的溢出 bug 在 Java 的 Arrays.binarySearch 里潜伏了约 9 年才被公开指出——当数组索引接近 2^30 时 lo + hi 会超过 int 上限变负数。JS 里数字是双精度浮点、整数在 ±(2^53−1) 内可精确表示（MAX_SAFE_INTEGER），所以不会真溢出，但写 lo + (hi - lo) / 2 的习惯要保留，换到任何语言都安全。

    还有一个前提常被忽略：随机访问。二分每一步都要直接跳到区间中点，数组按下标一步跳达，链表却只能从头走过去，跳一次中点就是 O(n)，二分优势当场归零。数据频繁增删同理：维持有序数组的插入删除是 O(n) 搬移，查得再快也会被写操作吃掉，这时该换平衡树或哈希表，而不是硬撑二分。'
  derivation: original
  sources:
  - ref: mit-6006
    locator: 二分查找相关讲义
