- id: boundary
  title: "写对边界不死循环：[[循环不变式]]定死区间包不包含右端"
  tldr: 二分十次写错九次，全因「右端点算不算在范围里」写着写着改了口。闭区间 [lo, hi] 配 lo <= hi 且两边跨过 mid 加减 1；左闭右开 [lo, hi) 找下界时配 lo < hi 且右边只收到 mid——两种写法各自严丝合缝，取中点则一律写 lo + ((hi - lo) >> 1) 防溢出。
  body: |-
    先立记号：`lo` 是左端下标，`hi` 是右端下标，`mid` 是中点。写错边界几乎全因半路忘了 `hi` 算不算在范围里。先把**闭区间 `[lo, hi]`**（右侧代码框写法）的规矩定死：`lo` 和 `hi` 两个格子都算候选。要等到 `lo > hi` 区间才空（`lo === hi` 时里面还剩 1 个数呢！），所以循环条件必须是 `while (lo <= hi)`；又因为 `a[mid]` 没命中就已经被排除，两侧收缩必须跨过它写成 `lo = mid + 1` 或 `hi = mid - 1`。最后只剩 1 个数 `[5, 5]` 时，不管走哪条分支都会变成 `[6, 5]` 或 `[5, 4]` 立刻退出。

    再看**左闭右开 `[lo, hi)`**（画布用来找「第一个 ≥ 23 的位置」）：`lo` 算在里面、`hi` 站在范围外不算（开局 `[0, 8)` 刚好覆盖 0 到 7）。当 `lo === hi`（如 `[5, 5)`）区间就空了，所以条件是 `while (lo < hi)`；遇到 `a[mid] >= 23` 时，`mid` 本身可能就是答案、不能丢，右边只能收到 `hi = mid`，左边确定没戏时写成 `lo = mid + 1`。

    **等一下：`hi = mid` 没减 1，剩一两个数时不会死循环吗？** 拿数字验一下就透了：只剩 1 个数时（比如 `[5, 6)`，`lo = 5, hi = 6, mid = 5`），不管走 `lo = mid + 1` 变成 `[6, 6)` 还是走 `hi = mid` 变成 `[5, 5)`，两端都会当场相遇退出；哪怕还剩 2 个数 `[5, 7)`，因为 `mid = 5` 向下取整偏向 `lo`，走 `hi = mid` 直接收成 `[5, 5)` 结束，走 `lo = mid + 1` 缩成 `[6, 7)` 长度也减了 1，绝不会卡死。按画布跑完找第一个 ≥ 23：`[0, 8)` 中点 4 是 16（< 23），`lo = 5`；`[5, 8)` 中点 6 是 38（≥ 23），`hi = 6`；`[5, 6)` 中点 5 是 23（≥ 23），`hi = 5`；`lo = hi = 5` 停下，答案 5。

    最后看防溢出写法 `lo + ((hi - lo) >> 1)`（等价于 `lo + Math.floor((hi - lo) / 2)`，右移一位就是非负整数除以 2 向下取整）。为什么不写 `(lo + hi) >> 1`？用直觉想：假设整数上限只有 100，`lo = 60`、`hi = 80`，两个数各自都没超限，一相加变成 `140` 当场爆掉！改成先算跨度 `hi - lo = 20`、折半得 `10` 再加回 `lo = 60`，全程每一步数值都没超过 `hi` 本身，从根上堵死溢出。
