- id: btree-echo
  title: 呼应：B+ 树每一页内部的二分定位
  tldr: 二分不止跑在普通数组里：数据库 [[B+ 树]]每个节点页里装了几十到上百个有序键，每走一层都要先在页内二分找出子指针，再跳进下一层继续页内二分，100 万行数据一共只读 3 到 4 个磁盘页。
  body: |-
    把镜头拉远到数据库索引：一棵 [[B+ 树]]的一个节点（磁盘页）里塞着几十到几百个排好序的键。按画布里找 `23` 的路走一遍：先在根页 `[10, 30, 50, 70]` 内做一次二分，确定 `23` 夹在 10 到 30 之间，顺着子指针跳到下一层叶页 `[12, 18, 23, 27]`，再做一次页内二分稳稳命中 `23`。整棵树的查询就是「页内二分 → 跳层 → 页内二分」交替跑完的。

    拿数字看它怎么省成本：假设每页放约 100 个键，100 万行数据整棵 B+ 树只有约 3 到 4 层；每层页内二分比约 7 次，全程总比较约二三十次，而真正昂贵的磁盘读取只发生了 3 到 4 次！读一次磁盘比内存里比两个数慢几个数量级，所以 B+ 树靠大扇出拼命把层数压低，二分则把每页读进内存后的定位成本压成对数级。

    反过来也留个工程直觉：为什么不在每个页里从头扫描？因为每一层都扫会把常数浪费乘到所有层上；但反过来说，如果数据本身全在内存里而且只有十几个元素，顺序从头扫因为极度贴合 CPU 缓存与分支预测，反而往往跑得比跳来跳去的二分更快——下一课排序讲到小数组混合策略时还会再碰见这笔硬件账。
  derivation: original
  sources:
