level: 基础
minutes: 34
prereq:
- dsa/hash-table
objectives:
- 在闭区间/半开区间两种写法下都写对二分
- 实现 lower_bound 并处理重复元素
- 识别可在答案上二分的单调性问题
aiLink: 二分在 AI
  工程里以「阈值搜索」的样子反复出现：当指标随参数单调变化时，可在代价曲线上二分找最优的置信度阈值、批大小、量化档位（不单调时不适用，要先验证单调性）。另作类比：向量检索的图索引（HNSW）同样逐层缩小候选范围，但机制是图上的贪心游走，不是二分。掌握不变式写法，这类搜索就不会写出边界
  bug。
design:
- mechanism: 取中点写 lo + ((hi - lo) >> 1)（或 lo + (hi - lo) / 2），不直接写 (lo + hi) / 2
  problem: 固定位宽的整数（如上限约 21 亿的 32 位 int）里，lo 和 hi 各自都合法，先相加却可能冲破上限变成负数，小数组测试永远撞不出来，一旦上亿级数据才突然崩溃。
  choice: 一律先算区间跨度 (hi - lo)、折半后再加回起点 lo；虽然 JS 在安全整数范围内不会真的溢出，这个模板仍然统一写死，换到任何强类型语言都安全。
  tradeoff: 多花了一次几乎可以忽略的减法，换来全程中间值绝不超过 hi；唯一代价是要全团队遵守习惯，只要有一处偷懒写回加法平均，大数组漏洞就从那一行溜回来。
  root: 计算机里的整数不是数学上无限大的整数：加法可能冲出位宽天花板，同一区间内的减法却绝不会越界——Bloch 在 2006 年披露 JDK 二分潜伏约 9 年的溢出 bug，教训就是算式必须在机器表示范围内也成立。
- mechanism: 先把区间开闭（闭区间 [lo, hi] 还是左闭右开 [lo, hi)）定死，再推导出循环条件和收缩语句
  problem: 二分号称最容易写错的简单算法：右端点多包一位或少收一格，症状不是立刻报错，而是遇到特定奇偶长度或目标在两端时悄无声息死循环或漏判。
  choice: 选定「目标若存在必在当前区间内」这句不变式，再二选一：闭区间配 lo <= hi 和两边 mid ± 1，半开区间配 lo < hi 和 hi = mid；写完必拿空区间、1 个元素、2 个元素各验一遍。
  tradeoff: 半开区间算长度和找左边界最顺手，闭区间直观好上手；两者本身没有高低，真正要付出的是不许混写的纪律——混着抄两段模板就会当场翻车。
  root: 二分的对错本质上是归纳推理：不变式保证每步都不错杀，严格缩区间保证一定停下来。先把这两条规矩定死再写代码，边界就能靠推理推出来，不用靠跑用例碰运气。
- mechanism: 二分抓的不是「数组有序」这个壳子，而是「比较一次能把半边候选判死」的单调性
  problem: 如果只把二分理解成在排好序的数组里找数，遇到「找最小可行速度」「git bisect 抓坏提交」「旋转数组」这类手里没现成有序数组的题，就会完全想不到能用二分。
  choice: 先动手检查「判定函数在搜索方向上是不是一刀切成假和真」，确认单调后直接套用同一个二分模板；不单调就立刻放弃二分，绝不硬套。
  tradeoff: 每次得先确认单调性是否真的成立，而且若判定一次要 O(n) 扫描，总时间就是 O(n log 范围)；但换来的是同一套模板通吃一大片工程寻优题。
  root: 一次比较想砍掉一半候选，前提是被砍掉的那半都有统一的淘汰理由——只有全序或单调规律能稳定提供这种理由，没有单调性，二分就失去了砍半的依据。
quiz:
- q: 左闭右开 [lo, hi) 写法里，循环条件与收缩正确的是？
  options:
  - lo <= hi，hi = mid
  - lo < hi，a[mid] < x 时 lo = mid + 1，否则 hi = mid
  - lo < hi，hi = mid - 1
  - lo <= hi，lo = mid
  answer: 1
  explain: 半开区间为空的条件是 lo == hi；保留 mid 可能是答案的一侧用 hi = mid。
- q: mid = lo + (hi - lo) / 2 而不是 (lo + hi) / 2，是为了？
  options:
  - 写起来好看
  - 避免 lo + hi 超出固定位数整数上限而溢出
  - 让结果更大
  - 兼容链表
  answer: 1
  explain: Java 标准库这个溢出 bug 存在多年（Bloch 2006 年博文）；JS 数字是双精度浮点，整数在 ±(2^53−1) 内可精确表示，但思想要懂。
- q: 数组 [5,12,23,23,23,38] 中 23 出现几次，用什么算？
  options:
  - lower_bound 一次
  - upper_bound − lower_bound = 5 − 2 = 3
  - 找到一个后数邻居最坏 O(n) 不可取
  - 哈希计数
  answer: 1
  explain: 两个边界之差即出现次数，全程 O(log n)。
- q: 「在答案上二分」的前提是？
  options:
  - 数组必须有序
  - 可行性随答案单调：小于某值都不可行、大于等于都可行（或反之）
  - 答案是整数
  - 数据量很大
  answer: 1
  explain: 单调性才是本质前提，数组有序只是最常见的单调来源。
