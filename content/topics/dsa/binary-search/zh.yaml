  code:
    lang: typescript
    code: |-
      // lower_bound（半开区间 [lo, hi)）：第一个 >= x 的位置；重复元素时落在最左那个
      function lowerBound(a: number[], x: number): number {
        let lo = 0, hi = a.length;
        while (lo < hi) {
          const mid = lo + ((hi - lo) >> 1);
          if (a[mid]! < x) lo = mid + 1; else hi = mid;
        }
        return lo; // upper_bound 把条件换成 <= ，两者相减 = x 出现次数
      }
    note: 处理重复元素的关键工具
    highlight: 6
- id: answer-domain
  title: 答案域二分实例：4 个工单要在 8 小时做完，最小可行速度是多少
  tldr: 因为速度 k 越快总耗时只会越短，哪怕没有现成数组，也能直接在速度范围 [1, 11] 上二分找最小可行速度。用 4 个工单和 8 小时期限验算一遍，只需试 4 次就能精准卡出 k = 4 这个「3 超时、4 刚好」的分界点。
  body: |-
    把刚才的思路落到一道具体算术题：手头有 4 个工单，工作量分别是 `3、6、7、11`，必须在总计 `8` 小时内做完；机器每小时处理 `k` 件，每个工单耗时就是 `工作量 ÷ k` 向上取整，问最小的可行速度 `k` 是多少。明显 `k` 越大越省时间，符合单调性。

    先挑分界点两边验算手感：`k = 3` 时四单各自耗时 `1、2、3、4` 小时，加起来 `10` 小时超时（不可行）；`k = 4` 时耗时 `1、2、2、3` 小时，总计刚好 `8` 小时（可行）；`k = 5` 时也是 `1、2、2、3 = 8` 小时（可行）；`k = 6` 时降到 `1、1、2、2 = 6` 小时（可行）。一条「1 到 3 全不行、4 以上全行」的清晰分界线就立在了 `k = 4`。

    现在把速度区间 `[1, 11]` 丢进左闭右开（或闭区间记录最优）的二分，每次只挑中点去扫一遍这 4 个工单：第 1 次试中点 `6` 可行，说明 6 以上不用看了、上界收到 `6`；第 2 次试 `(1 + 6) ÷ 2 = 3` 不可行，下界抬到 `4`；第 3 次试 `(4 + 6) ÷ 2 = 5` 可行，上界收到 `5`；第 4 次试 `(4 + 5) ÷ 2 = 4` 可行，上界收到 `4`，锁定答案 `k = 4`。全程只查了 4 次，比从 `k = 1` 往上硬试快得多，而被二分的从头到尾都不是数组，而是随 `k` 单调变化的可行性判断。
  derivation: original
  sources:
