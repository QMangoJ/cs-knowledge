  code:
    lang: typescript
    code: |-
      // lower_bound（半开区间 [lo, hi)）：第一个 >= x 的位置；重复元素时落在最左那个
      function lowerBound(a: number[], x: number): number {
        let lo = 0, hi = a.length;
        while (lo < hi) {
          const mid = lo + ((hi - lo) >> 1);
          if (a[mid]! < x) lo = mid + 1; else hi = mid;
        }
        return lo; // upper_bound 把条件换成 <= ，两者相减 = x 出现次数
      }
    note: 处理重复元素的关键工具
    highlight: 6
