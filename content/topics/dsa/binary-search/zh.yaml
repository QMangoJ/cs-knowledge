- id: repeat
  title: 重复对半砍：第 2 轮命中 23，找不到的唯一铁证是区间缩成空
  tldr: 照着同一套动作在剩下的右半边继续取中点，第 2 次比较就命中 23（下标 5），比线性查找少看 4 次；要是目标压根不在数组里，必须一路砍到区间完全变空才能宣布未找到，此时停下的位置还顺带送你一个现成的插入点。
  body: |-
    接着在剩下的 `[16, 23, 38, 56]`（下标 4 到 7）里再砍一刀：中点是 `(4 + 7) ÷ 2` 向下取整得 `5`，看一眼下标 5——正好就是 `23`！直接返回下标 5，总共只比了 2 次（线性查找找同一个 23 要看 6 次）。

    那如果找一个不在表里的数，比如 `20`，流程会怎么收场？第 1 轮（0 到 7）中点 12 小于 20，砍掉左半留下 4 到 7；第 2 轮（4 到 7）中点 23 大于 20，砍掉 23 和右半边，只剩 4 到 4（元素 16）；第 3 轮（4 到 4）中点还是 16，仍然小于 20，把最后这个 16 也踢掉，左端越过右端变成空区间，这才返回「未找到」。

    为什么剩 1 个数时还不能提前收工，非得等到区间变空？因为在 `4 到 4` 里躺着的那个数万一刚好是 20 呢！只有当候选范围真的缩到 0 个元素，又因为不变式保证从没错杀过谁，此时才敢百分之百断定 20 不存在。更巧的是，循环停下时 `lo` 刚好指在下标 5（紧挨着 23 前面）：它左边全小于 20、右边全不小于 20，[[lodash]] 的 [[sortedIndex]] 顺手返回的就是这个插入位置。
