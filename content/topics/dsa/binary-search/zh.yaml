    再做两组对照实验：第一，把目标换成不存在的 100，观察区间如何一路向右缩到空，理解未命中时比较次数反而常常最多；第二，盯着 lo 与 hi 的移动，验证每一轮区间长度确实减半而不是只少一个。若某一步区间没有减半，多半是把闭区间与半开区间的收缩规则混用了，回到上一课的不变式逐条对照，这比盲目改代码快得多。'
