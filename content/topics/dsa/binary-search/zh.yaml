- id: lab-play
  title: 动手实验：二分查找实验室
  tldr: 自己在实验室里单步跑一遍：盯住 lo、mid、hi 怎样每轮把灰色排除区成片推走——命中 23 只需 2 次比较，换查不存在的 7 或 100 时则要看着区间一路缩成空才能停下来。
  body: |-
    先用预置目标在 `[2, 5, 8, 12, 16, 23, 38, 56]` 里跑一遍：找 `23` 只比 2 次就停（线性要 6 次）；找不在表里的 `7` 比 3 次缩成空区间（线性要 8 次）；两头的极值 `2` 和 `56` 也都在 3 到 4 次收尾。n = 8 时二分最多 4 次对线性最坏 8 次，拉到 100 万时差距直接变成 20 次对 100 万次。

    接着做个对照实验：自己输入不存在的 `100`，看着区间一轮轮向右压扁直到空掉，体会为什么「没找到」往往比「刚巧命中」花掉最多次比较。单步时死盯 `lo` 和 `hi`：每点一次范围必须真的减半；只要哪一轮没缩下去，八成就是闭区间和半开区间的收缩语句混写了，退回第 4 步对照不变式比瞎调 `+1/-1` 快得多。
