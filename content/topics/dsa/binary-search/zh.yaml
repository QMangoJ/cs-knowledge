- id: btree-echo
  title: 呼应：B 树节点内的二分
  tldr: "二分不只活在数组里。这一步把视线放大到数据库索引：一棵 [[B+ 树]]的每一层节点内部找键用的正是二分，整棵树就是二分、跳到下一层、二分、再跳层交替进行；顺带算清索引为什么拼命压的是层数，而不是比较次数。"
  body: |-
    放大视线：数据库 B+ 树的一个节点存几十到几百个有序键，定位时先在节点内二分找到子指针，再顺指针下到下一层——整棵树就是二分、跳层交替，本课的每次比较在那里对应一次页内定位。

    算账：每个节点约 100 个键，100 万行数据的 B+ 树深度只有约 3 到 4 层，每层页内二分约 7 次比较，总比较约二三十次，却只需读 3 到 4 个磁盘页。磁盘读一次比内存比较贵几个数量级，所以 B 树拼命压层数（靠大扇出），而不是压比较次数；二分负责把每层页内成本压到对数级。节点内不用线性扫描，是因为每层都扫会把常数放大到所有层。反过来，数据全在内存且规模很小时，线性扫描因缓存与分支预测反而可能更快——对数级是渐近结论，工程选择还要看常数与硬件，排序课讲混合策略时还会再遇到。
  derivation: original
  sources:
