- id: complexity
  title: "为什么是 [[O(log n)|大 O 记号]]：1024 个数最多也只要 11 次"
  tldr: 每比一次就把候选砍成一半，n 个数砍到只剩 1 个最多也就 log₂ n 刀：8 个最多 4 次，1024 个最多 11 次，100 万个约 20 次，10 亿个约 30 次——数据规模翻一倍，二分只多花 1 次比较。
  body: |-
    把减半这笔账算实：8 个数每次对半砍（8 → 4 → 2 → 1），加上最后确认剩下的那 1 个，最多也就比 4 次。换算成一般公式，就是问 n 要连着除以几个 2 才会跌破 1——答案正是 log₂ n：1024 个最多 11 次，100 万个约 20 次（2²⁰ ≈ 100 万），10 亿个约 30 次（2³⁰ ≈ 10 亿）。

    感受一下这条曲线有多温和：数据量翻倍，二分只多花 1 次比较；数据量暴涨 1000 倍，也不过多比约 10 次。这就是对数级和线性级的分水岭，也是有序数据涨一千倍你几乎感觉不到变慢的原因（注意别把 O(log n) 误解成固定次数：它还是随 n 涨，只是涨得极慢）。下一节去看数据库索引怎么借着这招和 B+ 树打配合。
