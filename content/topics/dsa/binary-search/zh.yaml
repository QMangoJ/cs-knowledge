- key: 一句话总结
  value: 前提是有序；每次比较中间元素，范围减半
- key: 复杂度
  value: O(log n)：100 万个元素最多约 20 次比较
- key: 前提
  value: 数据必须有序，且能按下标直接访问
- key: 工程里
  value: lodash 的 sortedIndex、数据库 B+ 树在节点内对键二分、git bisect 找出引入 bug 的提交
- key: 易错点
  value: 边界条件（左闭右开还是闭区间）、取中间时整数溢出
- key: 变体
  value: lower_bound / upper_bound、在单调的答案上二分
- key: 不变式
  value: 目标若存在，一定在当前区间内
