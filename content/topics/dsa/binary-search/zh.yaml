- id: repeat
  title: 重复，直到找到或范围为空
  tldr: "排除一半只是第一轮。这一步在剩下的右半边里继续取中间、继续比较，直到命中，或者范围缩到空、能断定目标不存在为止；顺带说清目标不存在时，为什么区间变空是唯一可靠的缺席证明。"
  body: >-
    在剩下的 16、23、38、56 里继续：下标 4 到 7，中间 (4 加 7) 除以 2 取整等于 5，正好是 23，命中返回下标 5。总共比 2 次，线性查找同一个数要比 6 次。


    目标不存在如找 20：第一轮排除左半，第二轮中间 23 比 20 大，排除含 23 的右半，第三轮只剩 16，16 比 20
    小也排除，区间变空返回未找到。区间为空是唯一可靠的缺席证明，因为不变式保证目标从没被错杀。实现还常返回插入点（如 [[lodash]] 的 [[sortedIndex]]）：左侧都小于目标、右侧都不小于目标，维护有序数组时可直接用。
