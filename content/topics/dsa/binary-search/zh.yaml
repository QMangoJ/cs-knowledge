  tldr: "上一歩说可以对答案本身二分，这一步拿四个工单和 8 小时的期限完整跑一遍：先逐个验算处理速度取 3 为什么不行、取 4 为什么刚好，再看二分怎样在速度范围里只检查四次就找到这个分界点。"
