- id: middle
  title: 看中间，排除一半
  tldr: "上一歩说看一个数能排除一片，这一步就把这句话兑现：取中间的数比一次，看左半边 4 个数怎样被一次判定全部排除；同时把支撑整个算法的两句话立好——目标若存在就一定还在当前区间里，区间每一轮都严格变小。"
  body: |-
    初始区间是全部 8 个数，下标 0 到 7，中间位置是 (0 加 7) 除以 2 向下取整等于 3，对应元素 12。23 比 12 大，按升序，23 不可能在 12 及它左边。

    于是下标 0 到 3 共 4 个元素一次排除，剩下 16、23、38、56。一次比较排除一半——核心正在于此：比较的产出不是找到没有，而是一半范围的生死判定，没命中也买到了四个元素的排除结论。抽象出来，每轮维持两句：目标若存在，一定还在当前区间里（[[循环不变式]]）；区间严格变小。前者保证不错杀，后者保证会结束，后面所有变体与 bug 都可回到这两句检查。
