- id: complexity
  title: 为什么是 [[O(log n)|大 O 记号]]
  tldr: "走了这么多轮，这一步把总账收清：为什么最多比较次数是对数级。先用 8 个数减半到只剩 1 个的过程把账算出来，再看数据涨到 100 万个、10 亿个时，比较次数只涨到约 20 次、约 30 次。"
  body: >-
    为什么是 O(log n)：每比较一次候选范围减半，n 个元素最多减半 log 以 2 为底 n 的对数次就只剩一个。8 个最多 4 次，1024 个最多 10 次，100 万个约 20 次，10 亿个约 30 次——2 的 20
    次方约 100 万，2 的 30 次方约 10 亿。


    这条曲线的脾气是：数据量翻倍只多一次，涨 1000 倍也只多约 10 次。这是对数与线性的分水岭，也是有序查找几乎感觉不到数据变大的原因。数据库索引能瞬间定位主要靠 B+
    树的低深度（详见数据存储科），二分是它在每个节点内部查找键的那一环（下一节展开）。常见误解是把 O(log n) 说成比较次数固定：它随 n 增长，只是极慢。
