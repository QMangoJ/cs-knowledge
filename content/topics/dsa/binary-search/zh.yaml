    验算分界两侧：k 等于 3 时四单耗时 1、2、3、4，合计 10 小时，不可行；k 等于 4 时 1、2、2、3，合计 8 小时，刚好可行；k 等于 5 时 1、2、2、3 合计 8，可行；k 等于 6 时 1、1、2、2 合计
