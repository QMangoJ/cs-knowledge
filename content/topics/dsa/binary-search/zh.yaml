- id: boundary
  title: 写对边界：[[循环不变式]]
  tldr: "流程已经走通，真正的坑在写法上：区间到底是两边都包含端点、还是左含右不含，混写一位就会找错甚至死循环。这一步选定左闭右开这一种写法逐轮验算，并把取中间位置防整数溢出的老规矩交代清楚。"
  body: >-
    先把这一步要用的记号交代清：lo 是当前查找范围的左端下标，hi 是右端下标，mid 是中间下标；写法 [lo, hi) 读作左闭右开，意思是左端那个位置算在范围内、右端那个位置不算。后文所有收缩动作都按这套记号写，
    记号含糊正是二分写错的头号来源。

    选一种区间写法并坚持到底：左闭右开 [lo, hi) 时循环条件是 lo 小于 hi，中间值小于目标时 lo 等于 mid 加 1，否则 hi 等于 mid；闭区间 [lo, hi] 时条件是 lo 小于等于 hi，收缩用 mid
    加一或减一。两种都对，混写必错。


    画布里是左闭右开找第一个不小于 23 的位置：[0, 8) 中点 4 是 16，小于 23，lo 跳到 5；[5, 8) 中点 6 是 38，不小于 23，hi 收到 6；[5, 6) 中点 5 是 23，hi 收到 5，lo 与
    hi 相遇，答案 5。每轮区间严格变小，答案从未被排出。


    取中间用 lo 加 (hi 减 lo) 除以 2，避免 lo 加 hi 溢出——这个 bug 曾在 Java 标准库潜伏多年（见 design 与最后一节）。mid 算出后若某条分支 lo、hi
    都不动，就是死循环，写完先逐条分支验算。
