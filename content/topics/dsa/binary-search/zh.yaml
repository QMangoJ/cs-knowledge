steps:
- id: why
  title: 有序数组还一个个从头找，等于把排好的顺序白白扔掉
  tldr: 从头挨个比对找 23 要看 6 次，查 100 万个数最坏要扫 100 万次。数组既然已经从小到大排好队，瞄一眼 12 就该知道 23 绝不可能在它左边——二分靠的就是把这份顺序信息吃干榨净。
  body: |-
    先看从头找有多吃亏：在 `[2, 5, 8, 12, 16, 23, 38, 56]` 里找 23，一路核对 2、5、8、12、16，直到第 6 个才命中；如果找一个压根不在里面的 7，更是得把全部 8 个数老老实实看完才敢收手。把数组放大到 100 万个数，线性查找 O(n) 最坏就是实打实的 100 万次比对。

    可数组明明已经排好序了！当你盯住中间的 12 一看，得到的不只是「12 不是 23」这一条消息——由于左边都比 12 更小，2、5、8、12 这一整片当场全被宣判出局，23 只可能躲在 12 右边。反过来如果数字乱序摆放，看一眼 12 对 23 在左还是在右毫无提示，二分立刻失效。所以动笔写二分的第一反应不是写 while 循环，而是先问一句：数据真的有序吗？

    把规模拉到真实系统，差距更吓人：一张 1 亿行的数据库表如果逐行扫一遍要看 1 亿次；而落到排好序的索引上找同一条记录，总共只需要约 27 次比较。后面会看到，[[B+ 树]]每一页内部找键靠的正是这一刀。
