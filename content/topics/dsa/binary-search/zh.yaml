  code:
    lang: typescript
    code: |-
      // 标准二分（闭区间写法）：在有序数组里找 target 的下标，不存在返回 -1
      function binarySearch(a: number[], target: number): number {
        let lo = 0, hi = a.length - 1;          // 不变式：若 target 存在，一定在 [lo, hi] 内
        while (lo <= hi) {
          const mid = lo + ((hi - lo) >> 1);    // 防溢出地取中点
          if (a[mid] === target) return mid;
          if (a[mid]! < target) lo = mid + 1;   // mid 已排除
          else hi = mid - 1;
        }
        return -1;                               // 区间为空 = 不存在
      }
    note: 闭区间 [lo, hi] 版本
    highlight: 6
  points:
  - 先定区间语义（闭/半开），循环条件与收缩跟着语义走，不要混写
  - 每轮区间必须严格变小，否则死循环
  - 不变式：目标若存在，一定还在当前区间内
  mistake: 把闭区间的 hi = mid - 1 和半开区间的 hi = mid 混着写——这是二分 bug 的头号来源，选定一种写法就全程一致。
- id: variants
  title: 二分的变体：找边界、在答案上二分
  tldr: "基本款只回答目标在不在。可数组里有重复元素时，更常问的是第一个不小于目标的位置在哪里。这一步看两个边界查找怎样用同一套减半动作定位，再把二分从数组推广到没有数组、只有单调可行性的答案本身上。"
  body: >-
    数组里有多个 23 时，“第一个不小于 23 的位置”（[[lower_bound]]）与“第一个大于 23 的位置”（[[upper_bound]]）相减，就得到 23 出现的次数。


    更广的用法是在答案上二分：只要“答案为 k 时是否可行”随 k 单调变化，就能找最小可行的 k，比如最小的带宽让任务按时完成。[[git bisect]] 也是这个思路（在线性历史上：提交按时间有序，“有没有这个
    bug”在某个提交前后改变；实际实现是在提交图上按祖先关系收窄）。


    例子：把请求分给服务器，每台每秒处理 k 个才不超时。可行性随 k 单调，于是对 k 二分：检查 k 是否可行只需 O(n) 模拟，总复杂度 O(n log
    范围)，同理可二分最小批大小、最低置信度阈值。判据只有一条：不看数据结构，只看可行性是否单调——若是不可行、不可行、可行、可行这样一刀切的分界就能二分；若可行与不可行交替出现，二分无从下手。下一节用完整走例跑通这条判据。
  derivation: original
  sources:
