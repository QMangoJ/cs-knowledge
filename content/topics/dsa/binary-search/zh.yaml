- id: boundary
  title: 写对边界：循环不变式
  tldr: 二分最容易错的是边界，先想清楚“目标一定在哪个范围里”。
  body: '选一种区间写法并坚持到底：比如左闭右开 [lo, hi)，循环条件就是 lo < hi，缩小时 hi = mid 或 lo = mid + 1。

    每一轮都要保证“如果目标存在，一定还在区间里”，这叫循环不变式；每轮区间都严格变小，循环才一定会结束。

    取中间用 lo + (hi - lo) / 2，避免 lo + hi 在固定位数整数里溢出，这个 bug 曾在 Java 标准库里存在多年。'
  derivation: original
