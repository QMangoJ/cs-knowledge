  code:
    lang: typescript
    code: |-
      // 标准二分（闭区间写法）：在有序数组里找 target 的下标，不存在返回 -1
      function binarySearch(a: number[], target: number): number {
        let lo = 0, hi = a.length - 1;          // 不变式：若 target 存在，一定在 [lo, hi] 内
        while (lo <= hi) {
          const mid = lo + ((hi - lo) >> 1);    // 防溢出地取中点
          if (a[mid] === target) return mid;
          if (a[mid]! < target) lo = mid + 1;   // mid 已排除
          else hi = mid - 1;
        }
        return -1;                               // 区间为空 = 不存在
      }
    note: 闭区间 [lo, hi] 版本
    highlight: 6
  points:
  - 先定区间语义（闭/半开），循环条件与收缩跟着语义走，不要混写
  - 每轮区间必须严格变小，否则死循环
  - 不变式：目标若存在，一定还在当前区间内
  mistake: 把闭区间的 hi = mid - 1 和半开区间的 hi = mid 混着写——这是二分 bug 的头号来源，选定一种写法就全程一致。
- id: variants
  title: 二分的变体：卡出重复元素的边界，以及在答案本身上二分
  tldr: 遇到多个重复的 23 时，用左闭右开先后卡出「第一个 ≥ 23」和「第一个 > 23」的位置，两者一减就是 23 的个数。把视野再放大一圈，其实手里连数组都不用有——只要「答案 k 行不行」随 k 单调切一刀，就能直接对答案 k 做二分。
  body: |-
    当有序数组里塞着不止一个 23 时，例如画布第一行的 `[5, 12, 23, 23, 23, 38, 56, 70]`，普通二分随便命中其中一个就停了。想数清 23 出现了几次又不想顺着左右一个个傻数，直接复用上一步的左闭右开模板（右侧代码）：`[[lower_bound]]` 卡出第一个 `≥ 23` 的下标 `2`，把条件从 `<` 改成 `<=` 就得到 `[[upper_bound]]`（第一个 `> 23` 的下标 `5`）。两者相减 `5 − 2 = 3`，全程 `O(log n)` 算出 23 有 3 个。

    再往前推一步：**二分其实不挑数据结构，连数组都不一定需要。** 比如排查线上故障用的 `[[git bisect]]`，代码仓库里并没有排好序的数字数组，但提交按时间排成一列，且「这个 bug 存不存在」在引入它的那次提交前后由无翻有——这照样能二分！

    工程里调参数也是同理：假设要把请求分给服务器，问每台每秒至少处理 `k` 个才不会超时。给定任意一个 `k`，花 `O(n)` 模拟一遍就知道行不行，而且只要 `k` 够用，更大的 `k` 肯定也够用——可行性在某个临界值处干净地从「不可行」翻成「可行」。于是不用 `k = 1, 2, 3...` 瞎试，直接对 `k` 本身二分（求最小批大小、最低置信度阈值全用这招），总耗时只有 `O(n log 范围)`。判定能不能二分只有一条死规矩：只看「行不行」是不是一刀切成两半，如果可行与不可行反复横跳，二分就抓不住任何把柄。下一节用具体数字跑一遍这个套路。
  derivation: original
  sources:
