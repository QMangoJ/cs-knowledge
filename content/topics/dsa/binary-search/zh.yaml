- id: rotated-array
  title: 旋转数组：切一刀对调之后，至少有一半还排着队
  tldr: 把主例的有序数组从中间切开对调两段，整体先升后跌不再单调，但随便挑个中点切下去，左右两半里必定至少有一半还保持完整有序。每轮先认出有序那一半、再查目标落没落在它的值域里，照样只要 O(log n)。
  body: |-
    把开课那排数 `[2, 5, 8, 12, 16, 23, 38, 56]` 从 16 前面切一刀、左右两段互换，得到旋转数组 `[16, 23, 38, 56, 2, 5, 8, 12]`。整体先爬坡到 56 再陡降到 2，普通二分会看晕；可只要想明白「整排数组里只有一个断崖」，随便拿中点一劈，断崖只能躲在其中一边，另一半必然完完整整有序！

    在里面找 `5` 跑两轮看看：第 1 轮下标 0 到 7，中点下标 3 是 `56`。拿左端 `16` 和中点 `56` 一比，`16 ≤ 56`，断崖不在左边——左半 `[16, 23, 38, 56]` 完整有序。紧接着看目标 `5` 在不在 `16 到 56` 这段值域里：不在！那 `5` 只可能藏在右半边，下界直接跳到 `4`。第 2 轮范围 `4 到 7`（`[2, 5, 8, 12]`），中点下标 5 正好就是 `5`，两轮命中，照样是 [[O(log n)|大 O 记号]]。

    总结成一句话判据：先拿端点和中点比大小认出哪一半有序，再看目标是不是落进那一半的数值区间里——在就钻进去，不在就去另一半。唯一要防的后门是数组里有重复值时：万一碰上左端、中点、右端三个数全相等，断崖躲在哪边根本分不清，只能两端各往里缩一格，最坏会退化成 O(n)。
  derivation: original
  sources:
