- id: complexity
  title: 为什么是 O(log n)
  tldr: 每次减半，n 个元素最多减半 log₂n 次就只剩一个。
  body: '为什么是 O(log n)：每比较一次，候选范围减半，n 个元素最多减半 log 以 2 为底 n 的对数次就只剩一个。8 个元素最多 4 次，1024 个最多 10 次，100 万个最多约 20 次，10 亿个也只要约 30 次——因为 2 的 20 次方约 100 万，2 的 30 次方约 10 亿。

    换个角度看这条曲线的脾气：数据量翻倍，只多比较一次；数据量涨 1000 倍，也只多约 10 次。这就是对数增长与线性增长的分水岭，也是为什么有序数据上的查找几乎永远感觉不到数据变大。

    数据库索引能瞬间定位，主要靠 B+ 树的低深度（详见数据存储科），而二分是它在每个节点内部查找键的那一环：先在节点内二分定位到子指针，再跳到下一层，下一节专门展开这个呼应。另一个常见误解是把 O(log n) 说成比较次数固定：它随 n 增长，只是增长得极慢。'
  derivation: original
  sources:
  - ref: mit-6006
    locator: 渐近分析相关讲义
