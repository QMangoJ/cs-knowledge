- id: rotated-array
  title: 旋转数组：在半有序里二分
  tldr: "前面所有二分都建立在整个数组有序上。这一步把有序数组从中间切一刀、两段互换位置，整体不再单调，看还剩下什么结构可以利用——任意取一个中点切开，左右两半里至少有一半仍然完整有序——以及重复元素时这条路在哪里失效。"
  body: >-
    旋转数组是把有序数组从某处切一刀、两段互换：2、5、8、12、16、23、38、56 从 16 处切开，变成
    16、23、38、56、2、5、8、12。整体不再单调，普通二分失效，但它保留局部单调：任意中点切开，左右两半至少有一半完整有序。


    找 5 走例：第一轮下标 0 到 7，中点下标 3 是 56。左端 16 不大于 56，说明左半 16、23、38、56 有序；5 不在 16 到 56 之间，只可能在右半，下界升到 4。第二轮区间 4 到 7，中点下标 5 正是
    5，命中。两轮收工，同为 [[O(log n)|大 O 记号]]。


    判据只有一句：先定哪半有序，再看目标在不在那半的值域内，在就去那半，不在去另一半。重复元素时若左端、中点、右端三值相等，就分不清哪半有序，只能两端各缩一格，最坏退化到 O(n)——这是重复元素开的唯一后门。
