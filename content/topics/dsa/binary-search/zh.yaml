- id: boundary
  title: 写对边界：循环不变式
  tldr: 二分最容易错的是边界，先想清楚“目标一定在哪个范围里”。
  body: '选一种区间写法并坚持到底：左闭右开 [lo, hi) 时循环条件是 lo 小于 hi，中间值小于目标时 lo 等于 mid 加 1，否则 hi 等于 mid；闭区间 [lo, hi] 时条件是 lo 小于等于 hi，收缩用 mid 加一或减一。两种写法都对，混写必错。

    画布里是左闭右开找第一个不小于 23 的位置的完整三轮：[0, 8) 中点 4 是 16，小于 23，lo 跳到 5；[5, 8) 中点 6 是 38，不小于 23，hi 收到 6；[5, 6) 中点 5 是 23，hi 收到 5，lo 与 hi 相遇，答案就是 5。每一轮区间都严格变小，且答案从未被排出区间。

    取中间用 lo 加 (hi 减 lo) 除以 2，避免 lo 加 hi 在固定位数整数里溢出，这个 bug 曾在 Java 标准库里潜伏多年（见本课 design 与最后一节）。再提醒一句：mid 算出后若某条分支里 lo、hi 都不动，区间不缩小，就是死循环，写完先逐条分支验算一遍。'
  derivation: original
  sources:
