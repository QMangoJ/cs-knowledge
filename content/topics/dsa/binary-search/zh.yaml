      - 100 万行约 3–4 层
      - 只读 3–4 个页
  log:
  - mode: 呼应
    event: "呼应成立了：二分是 B+ 树每个节点内部定位键的那一环，整棵树靠它把磁盘读取压到个位数层。"
- id: engineering
  title: 前提、经典溢出坑与收尾三问：别拿二分去套链表和乱序数据
  tldr: 二分再快也有两条死线：数据必须有序，而且能按下标一步跳到中点——所以链表和频繁增删的数据都用不上它。写代码时切记躲开曾在 Java 标准库潜伏约 9 年的 (lo + hi) / 2 溢出坑，带走末尾三问就能次次写对。
  body: |-
    先避开最常见的两个错用场景。第一是**频繁改动的数据**：有序数组每次插一个或删一个元素都要 O(n) 挪动整片内存，查得再快也会被修改成本吃光，这时该换哈希表或平衡树（红黑树 / B+ 树）。第二是**链表**：很多人记得「有序」，却忘了二分每轮都要直接跳去中点——链表没法按下标直达，光走去中点就要 O(n)，二分优势直接归零。反过来，只要具备「单调可切 + 能跳着查」，哪怕不是数组（比如用 [[git bisect]] 在提交历史里抓 bug）一样能用。

    再听一个真实事故：第 4 步讲的 `(lo + hi) / 2` 溢出 bug，真真切切在 Java 标准库的 `Arrays.binarySearch` 里潜伏了约 9 年，直到 2006 年才被 Joshua Bloch 公开——数组长度接近 `2³⁰`（约 10 亿）时，`lo + hi` 会冲破 32 位有符号整数上限变成负数，当场越界崩溃。JS 数值虽然是双精度浮点、在 `±(2⁵³−1)`（`MAX_SAFE_INTEGER`）范围内都不会溢出，但 `lo + ((hi - lo) >> 1)` 这手习惯必须保留，换到 C++、Java、Go 才不会翻车。

    临走前留这套二分**三问自检**：① **单调吗、能跳达吗？**（有单调性且能 O(1) 访问中点才上二分，链表或频繁改写的数据换结构）② **右端点包不包？**（闭区间 `[lo, hi]` 配 `lo <= hi`、两边 `mid ± 1`；左闭右开 `[lo, hi)` 配 `lo < hi`、右侧 `hi = mid`，死守一套绝不混用）③ **中点防溢出了吗、每轮真缩了吗？**（中点写 `lo + ((hi - lo) >> 1)`，拿空数组、1 个数、2 个数代入分支确认绝不原地踏步）。
  derivation: original
  sources:
  - ref: mit-6006
    locator: 二分查找相关讲义
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: 二分查找要求有序与随机访问
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
  - ref: joshua-bloch
    locator: 全文（2006-06-02）
    claim: (low+high)/2 溢出 bug 在 JDK 的 Arrays.binarySearch 里潜伏约九年，数组长度达 2^30 时触发
    status: verified
