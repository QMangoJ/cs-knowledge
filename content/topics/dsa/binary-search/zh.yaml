id: dsa/binary-search
subject: dsa
slug: binary-search
order: 2
status: published
license: CC-BY-4.0
title: 二分查找：每次排除一半
summary: 在有序数组里找东西，每次看中间，排除一半，很快就能找到。
premise: 在一堆已经排好序的数里找一个数，逐个看过去太慢，能不能每次看一眼就排除掉一半？本课用一个具体例子把这件事走一遍，在有序数组 [2, 5, 8, 12, 16, 23, 38, 56] 中找 23，看每次比较之后查找范围怎样缩小。
position: 本课仍在「按名与按序查找」板块内，它接在哈希表把键打散、顺序信息全丢之后，换一条路：利用数组本身的有序性来查找。学完你能用[[循环不变式]]检查闭区间与半开区间两种写法是否写对，并说清 [[lower_bound]]
  如何在重复元素里定位第一个不小于目标的位置。
bridge:
  prev: 上一课哈希表用取余把键塞进桶里换来平均一步到达，本课则放弃打散，转而守住有序数组这个前提来换取每次排除一半的判定力。
  next: 二分的前提是数组先要有序，下一课归并与快排要解决的正是：怎样把无序数组以 O(n log n) 的代价整体排好序。
overview:
- key: 一句话总结
  value: 前提是有序；每次比较中间元素，范围就减半。比如找 23 时先看中间的数，比它大就只留下右半边，比它小就只留下左半边，几步之后范围就缩到只剩答案。
- key: 复杂度
  value: 复杂度是 [[O(log n)|大 O 记号]]，100 万个元素最多约 20 次比较。因为每比较一次范围就减半，100 万减半到只剩 1 个只需要大约 20 次，所以数据量涨很多，比较次数也涨得很慢。
- key: 前提
  value: 数据必须有序，且能按下标直接访问。没有顺序就没法靠一次比较判断目标在哪半边；不能按下标直接跳到中间位置的话，每次走到中间本身就要花线性时间，二分就省不下来了。
- key: 工程里
  value: "[[lodash]] 的 [[sortedIndex]]、数据库 [[B+ 树]]在节点内对键做二分、[[git bisect]] 找出引入 bug 的提交，都用的是同一个思路。git bisect 就是把提交历史看成排好序的序列，每次测中间那个提交，就能判断 bug 出现在前半段还是后半段。"
- key: 易错点
  value: 最容易错的是边界条件，比如区间到底是左闭右开还是两边都闭；另外取中间位置时直接把两端相加可能整数溢出。边界定错一位，结果往往不是慢一点，而是直接找错或死循环，所以写之前要先把区间含义说清楚。
- key: 变体
  value: 常见变体有 [[lower_bound]] 和 [[upper_bound]]，也就是找第一个不小于或第一个大于目标的位置；还有在单调的答案上二分。只要一个问题的是与否随数值单调变化，比如容量够不够随容量变大由不够变成够，就可以对答案本身做二分。
- key: 不变式
  value: 不变式是目标若存在，就一定在当前区间内。每一步缩小范围时只能扔掉确定不含目标的那一半，守住这句话，循环结束时区间为空就能断定目标不存在，不会误杀。
