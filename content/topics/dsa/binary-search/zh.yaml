- id: btree-echo
  title: 呼应：B 树节点内的二分
  tldr: 数据库索引是二分、跳层、二分、跳层交替：一棵矮树把磁盘读压到个位数层，页内靠二分定位。
  body: '把视线放大：数据库 B+ 树的一个节点里存着几十到几百个有序键，定位时先在节点内做二分，找到该去的子指针，再顺着指针下到下一层。整棵树的查找就是二分、跳层、二分、跳层交替进行，本课的每一次比较，在那里对应一次页内定位。

    算一笔数字账：设每个节点容纳约 100 个键，100 万行数据的 B+ 树深度只有约 3 到 4 层，每层页内二分约 7 次比较，总比较约二三十次，却只需读 3 到 4 个磁盘页。磁盘读一次比内存比较贵几个数量级，所以 B 树拼命压层数（靠大扇出），而不是压比较次数；二分在其中负责把每层的页内成本压到对数级。

    这也解释了为什么节点内不用线性扫描：页内键数虽小，但每层都扫一遍，会把常数放大到所有层。反过来，若数据全在内存且规模很小，线性扫描因缓存与分支预测反而可能更快——对数级是渐近结论，工程选择还要看常数与硬件，这一点在排序课讲混合策略时还会再遇到。'
  derivation: original
  sources:
