- id: middle
  title: 看中间，排除一半
  tldr: 比较中间元素和目标，目标更大就只看右半边。
  body: '初始区间是全部 8 个数，下标 0 到 7，中间位置是 (0 加 7) 除以 2 向下取整等于 3，对应元素 12。23 比 12 大，按升序排列，23 不可能出现在 12 以及它左边的任何位置。

    于是下标 0 到 3 一共 4 个元素一次全部排除，剩下 16、23、38、56 四个候选。一次比较排除一半，这就是二分的核心：比较的产出不是找到没有，而是一半范围的生死判定：这一次比较没有命中，却买到了四个元素的排除结论，信息量一点不比命中少。

    把这一步抽象出来：每轮都要维持一句话——目标若存在，一定还在当前区间里（循环不变式）；同时让区间严格变小。前者保证不错杀，后者保证会结束。后面所有二分变体与 bug，都可以回到这两句话上检查。'
  derivation: original
