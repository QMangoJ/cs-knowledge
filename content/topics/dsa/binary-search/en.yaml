- id: engineering
  title: Preconditions and traps
  tldr: "Finally, the wrap-up — fast as binary search is, it cannot be used when its preconditions fail. This step names the unsuitable scenarios one by one — unsorted data, linked-list storage, frequent insertions and deletions — and tells the story of a midpoint-overflow bug that lay hidden in the Java standard library for about 9 years, to show why that old rule must be kept in any language."
  body: >-
    When the data changes often, re-sorting every time is not worth it — a hash table or a balanced tree fits better. A linked list cannot jump to the middle, so it cannot binary search efficiently either. And binary search is not only for arrays — [[git bisect]] binary searches the commit history to find which commit introduced a bug.


    The overflow story — the (lo + hi) / 2 bug lay hidden in Java's Arrays.binarySearch for about 9 years before it was made public — when indexes approach 2^30, lo + hi exceeds the int ceiling and turns negative. JavaScript
    numbers are double-precision floats, and integers within ±(2^53−1) are represented exactly (MAX_SAFE_INTEGER), so they never truly overflow — but the habit of lo + (hi - lo) / 2 is worth keeping; it is safe in any language you switch to.


    A precondition that is often overlooked is random access — every step of binary search jumps to the midpoint. An array jumps there in one step by index, while a linked list can only walk from the head, so one jump to the middle is already O(n) and the advantage is gone. Frequent insertions and deletions are the same — maintaining a sorted array costs O(n) of shifting per insertion or deletion, and however fast the lookup is, the writes eat it. That is when to switch to a balanced tree or a hash table.
  derivation: original
  sources:
  - ref: mit-6006
    locator: Binary search lectures
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: Binary search requires sortedness and random access
    status: verified
    checkedBy: Checked by Muse
    checkedAt: 2026-11-07
    note: Verified against the primary source on 2026-11-07; see docs/curriculum-audit.md
  - ref: joshua-bloch
    locator: Full text (2006-06-02)
    claim: The (low+high)/2 overflow bug lay hidden in the JDK's Arrays.binarySearch for about nine years, triggered when the array length reaches 2^30
    status: verified
    checkedBy: Checked by Muse
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: "Preconditions: sorted, and able to jump straight to the middle by index"
