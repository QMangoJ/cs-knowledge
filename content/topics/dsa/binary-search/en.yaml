- id: boundary
  title: "Getting the boundaries right: the [[loop invariant|循环不变式]]"
  tldr: "The flow works; the real trap is in how you write it — whether the interval includes both endpoints or includes the left and excludes the right, mixing the two by one position produces wrong answers or even an infinite loop. This step picks the left-closed, right-open writing, verifies it round by round, and settles the old rule for computing the middle without integer overflow."
  body: >-
    First, the notation this step uses — lo is the index of the left end of the current search range, hi is the index of the right end, and mid is the middle index. The writing [lo, hi) reads as left-closed, right-open — the position at the left end counts as inside the range, the position at the right end does not. Every shrinking move below follows this notation,
    and vague notation is the number-one source of binary search bugs.

    Pick one interval writing and stick to it to the end — with left-closed, right-open [lo, hi), the loop condition is lo < hi; when the middle value is smaller than the target, lo = mid + 1, otherwise hi = mid. With the closed interval [lo, hi], the condition is lo <= hi, and shrinking uses mid
    + 1 or mid − 1. Both are correct; mixing them is always wrong.


    The canvas shows the left-closed, right-open search for the first position not less than 23 — in [0, 8) the midpoint 4 holds 16, which is smaller than 23, so lo jumps to 5; in [5, 8) the midpoint 6 holds 38, not less than 23, so hi pulls back to 6; in [5, 6) the midpoint 5 holds 23, so hi pulls back to 5; lo and
    hi meet, and the answer is 5. Every round the interval strictly shrinks, and the answer is never thrown out.


    Compute the middle as lo + (hi − lo) / 2 to avoid lo + hi overflowing — that bug lay hidden in the Java standard library for years (see the design section and the last section). Once mid is computed, if some branch moves neither lo nor hi,
    that is an infinite loop; after writing the code, verify each branch one by one first.
