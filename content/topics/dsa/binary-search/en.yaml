      - git bisect
  log:
  - mode: Summary
    event: "The selection conclusion boils down to one line: first confirm the data is sorted, supports direct access by index, and does not change often — then use binary search."
level: 基础
minutes: 34
prereq:
- dsa/hash-table
objectives:
- Write binary search correctly in both the closed-interval and half-open-interval forms
- Implement lower_bound and handle duplicate elements
- Recognize monotone problems that can be binary searched on the answer
aiLink: Binary search keeps reappearing in AI
  engineering in the shape of "threshold search" — when a metric varies monotonically with a parameter, you can binary search the cost curve for the optimal confidence threshold, batch size, or quantization tier (when it is not monotone this does not apply — verify monotonicity first). As an analogy — the graph indexes of vector retrieval (HNSW) also narrow the candidate range layer by layer, but the mechanism is a greedy walk on a graph, not binary search. Master the invariant-based writing, and searches like these will not ship boundary
  bugs.
design:
- mechanism: When the midpoint is written as lo + (hi − lo) / 2, the interval length computed first never exceeds the interval itself, and every intermediate value stays inside the legal index range; written as (lo + hi) / 2, the addition goes first, the intermediate sum can reach twice the index ceiling, and once it has overflowed, the division afterwards cannot save it.
  problem: In fixed-width integers (an int tops out at about 2.1 billion, for instance), lo and hi are each legal and neither overflows on its own, but their sum can cross the boundary and turn negative, and every division and index access after that is wrong; and it only triggers on large arrays, so small-scale tests never run into it.
  choice: Write it uniformly as lo + (hi − lo) / 2, or use a safe-midpoint form the language provides, baking the overflow guard into the template instead of relying on remembering it in the moment. JavaScript numbers are double-precision floats and exact within the safe-integer range, but the habit is kept anyway — it cannot go wrong in any language you switch to.
  tradeoff: The cost is almost zero — one extra subtraction. The real price is discipline — every binary search must use the same writing; wherever one place takes the shortcut back to averaging by addition, the bug returns from exactly that place, and still only fires at large data volumes.
  root: The root is that fixed-width arithmetic does not enjoy the closure of mathematical integers — addition can overflow, while the result of subtracting quantities of the same scale stays inside the interval. Bloch pointed out in 2006 that this bug had lain hidden in the JDK's binary search and merge sort implementations for about nine years. The lesson — correctness must be proved within the representable range, not only over mathematical integers.
- mechanism: Binary search's correctness can be written entirely as one loop invariant (if the target exists, it is definitely inside the current interval) plus one termination property (the interval strictly shrinks every round). Once the interval semantics are chosen, these two uniquely determine the loop condition and both shrinking writings — there is no room left for improvisation.
  problem: Binary search is widely considered the simplest algorithm that is hardest to write correctly — off by one on a boundary, off by one cell on a shrink, and the symptom is not an immediate error but an occasional infinite loop or an occasionally missed boundary element — and on small data it often happens to be all correct, so the problem drags on until production exposes it.
  choice: Fix the interval semantics before writing code — half-open pairs with lo < hi and hi = mid; closed pairs with lo <= hi and mid + 1 or mid − 1. After writing, verify branch by branch with the three minimal cases — empty interval, single element, target at both ends — and only then ship it.
  tradeoff: The half-open interval aligns naturally with lengths and insertion points, which makes boundary searches smoother to write; the closed interval sits closer to spoken intuition and is easier for beginners. Neither is better — only whole-course consistency means anything, and the price of mixing them is exactly the class of invisible bugs above.
  root: The root is that binary search's correctness is an induction proof, not an empirical matter — the invariant is the induction hypothesis and each round's shrink is the induction step. Write the proof skeleton first and then land the code, and the boundaries stop depending on trial and error — that is its most essential difference from an ordinary loop.
- mechanism: What binary search truly relies on is not the surface fact that the array is sorted, but a predicate that is monotone along the search direction — one comparison can reliably pronounce a death sentence on a whole half of the candidates. A sorted array, monotone answer feasibility, and the sorted half of a rotated array are all different sources of this same monotonicity.
  problem: Many problems have no ready-made sorted array on the surface — tuning wants the smallest feasible value, log hunting wants the first bad version, a rotated array is unsorted as a whole. If binary search is equated with finding a number in an array, all of these get misjudged as unrelated to binary search.
  choice: Construct and verify the monotone predicate first, then apply the invariant template unchanged — for answer-domain problems, write the feasibility check and verify its monotonicity first; for rotated arrays, judge which half is sorted each round. If the verification passes, reuse the template as-is; if it fails, abandon binary search at once and look for another algorithm.
  tradeoff: The price is that every problem first pays the cost of proving and testing monotonicity, and if the predicate check itself is a linear scan, the total complexity multiplies by the check's cost. In exchange, one verified template covers a large class of problems, with no need to reinvent the search for each.
  root: The root is information-theoretic — one comparison can rule out at most half the candidates, which requires the ruled-out half to share a uniform reason for being dead — only a total order or a monotone structure can keep supplying that reason. Without monotonicity, comparisons cannot rule out a constant proportion, and binary search cannot stand in principle.
quiz:
- q: "In the left-closed, right-open [lo, hi) writing, which loop condition and shrinking are correct?"
  options:
  - lo <= hi, hi = mid
  - lo < hi; when a[mid] < x, lo = mid + 1, otherwise hi = mid
  - lo < hi, hi = mid - 1
  - lo <= hi, lo = mid
  answer: 1
  explain: A half-open interval is empty exactly when lo == hi; the side that keeps mid as a possible answer uses hi = mid.
- q: Why mid = lo + (hi - lo) / 2 instead of (lo + hi) / 2?
  options:
  - It looks better
  - To avoid lo + hi exceeding the fixed-width integer ceiling and overflowing
  - To make the result larger
  - For linked-list compatibility
  answer: 1
  explain: This overflow bug existed in the Java standard library for years (Bloch's 2006 blog post); JavaScript numbers are double-precision floats, with integers represented exactly within ±(2^53−1), but the idea is worth understanding.
- q: "How many times does 23 occur in the array [5,12,23,23,23,38], and how do you compute it?"
  options:
  - One lower_bound
  - upper_bound − lower_bound = 5 − 2 = 3
  - Find one and count its neighbors — O(n) in the worst case, not acceptable
  - Hash counting
  answer: 1
  explain: The difference of the two boundaries is the occurrence count, in O(log n) throughout.
- q: What is the precondition for "binary search on the answer"?
  options:
  - The array must be sorted
  - "Feasibility is monotone in the answer: below some value all infeasible, at and above it all feasible (or the reverse)"
  - The answer is an integer
  - The data volume is large
  answer: 1
  explain: Monotonicity is the essential precondition; a sorted array is only its most common source.
