- id: repeat
  title: Repeat, until found or the range is empty
  tldr: "Ruling out half was only the first round. This step continues inside what remains of the right half — take the middle, compare again — until it hits, or until the range shrinks to empty and you can conclude the target does not exist. Along the way it explains why, when the target is absent, an empty interval is the only reliable proof of absence."
  body: >-
    Continue inside the remaining 16, 23, 38, 56 — indexes 4 to 7, the middle is (4 + 7) / 2 rounded down, which is 5, exactly 23. Hit; return index 5. Two comparisons in total, where linear search needs 6 for the same number.


    When the target does not exist, say you are looking for 20 — the first round rules out the left half; in the second round the middle, 23, is larger than 20, so the right half containing 23 is ruled out; in the third round only 16
    remains, and 16 is smaller than 20, so it is ruled out too — the interval becomes empty and the search returns "not found". An empty interval is the only reliable proof of absence, because the invariant guarantees the target was never killed by mistake. Implementations also often return the insertion point (like [[lodash]]'s [[sortedIndex]]) — everything to the left is smaller than the target and everything to the right is not smaller, so it can be used directly when maintaining a sorted array.
