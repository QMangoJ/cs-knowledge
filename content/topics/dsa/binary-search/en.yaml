  code:
    lang: typescript
    code: |-
      // Standard binary search (closed-interval version): find the index of target in a sorted array, return -1 if absent
      function binarySearch(a: number[], target: number): number {
        let lo = 0, hi = a.length - 1;          // Invariant: if target exists, it is definitely inside [lo, hi]
        while (lo <= hi) {
          const mid = lo + ((hi - lo) >> 1);    // Compute the midpoint overflow-safely
          if (a[mid] === target) return mid;
          if (a[mid]! < target) lo = mid + 1;   // mid is ruled out
          else hi = mid - 1;
        }
        return -1;                               // Empty interval = does not exist
      }
    note: Closed-interval [lo, hi] version
    highlight: 6
  points:
  - Fix the interval semantics first (closed / half-open); the loop condition and the shrinking follow the semantics — never mix writings
  - The interval must strictly shrink every round, or it is an infinite loop
  - "The invariant: if the target exists, it is definitely still inside the current interval"
  mistake: Mixing the closed interval's hi = mid - 1 with the half-open interval's hi = mid — the number-one source of binary search bugs. Pick one writing and stay consistent throughout.
- id: variants
  title: "Binary search variants: finding boundaries, searching on the answer"
  tldr: "The basic version only answers whether the target exists. But when the array holds duplicates, the more common question is where the first position not less than the target is. This step shows how the two boundary searches locate it with the same halving move, then generalizes binary search from arrays to the answer itself, where there is no array — only monotone feasibility."
  body: >-
    When the array holds several 23s, the difference between "the first position not less than 23" ([[lower_bound]]) and "the first position greater than 23" ([[upper_bound]]) is exactly the number of times 23 occurs.


    The broader use is binary searching on the answer — as long as "is the answer k feasible?" varies monotonically with k, you can find the smallest feasible k, the smallest bandwidth that lets a task finish on time, for example. [[git bisect]] is the same idea (on a linear history — commits are ordered by time, and "does this bug exist?" flips at one commit; the real implementation narrows by ancestry on the commit graph).


    An example — split requests across servers, each processing k requests per second without timing out. Feasibility is monotone in k, so binary search on k — checking whether k is feasible takes one O(n) simulation, for a total complexity of O(n log
    range). The same approach binary-searches the smallest batch size or the lowest confidence threshold. There is only one test — do not look at the data structure, look at whether feasibility is monotone. If it splits cleanly into infeasible, infeasible, feasible, feasible, you can binary search; if feasible and infeasible alternate, binary search has nothing to grip. The next section runs this test through a complete worked example.
