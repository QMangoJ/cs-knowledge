steps:
- id: why
  title: Why not just scan one by one?
  tldr: "Look at how slow the dumbest method is first — finding 23 among 8 sorted numbers by comparing one by one takes until the 6th element to hit. This step first does the math on scanning, then points out the information hidden unused inside the sortedness precondition — look at any one number and you know which side the target can only be on."
  body: >-
    Finding 23 among 8 numbers by comparing from the start — 2, 5, 8, 12, 16 — hits only at the 6th element; looking for a 7 that does not exist means reading all 8 before you may conclude anything. With a million elements in the array, the worst case is a million comparisons — that is linear search's O(n).


    But when the array is sorted, looking at one number tells you which side the target is on — see 12 and you know 23
    can only be to its right, and the left side never needs looking at again. Sortedness means each comparison rules out a whole stretch rather than a single element — that is the entire source of information binary search runs on. The precondition is sorted data — with no order, the middle number says nothing about where the target is, and binary search fails at once. The first reflex when writing a binary search should be to confirm sortedness, not to write the loop.

    The gap is starker in a real system — if a table with a hundred million rows were compared row by row, one lookup would scan a hundred million entries, while the same lookup landing on a sorted index needs only about 27 comparisons. The in-node binary search of the [[B+ tree|B+ 树]] covered later in this lesson uses exactly this rule-out-half-each-time move.
