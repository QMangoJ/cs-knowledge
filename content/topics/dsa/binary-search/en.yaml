  code:
    lang: typescript
    code: |-
      // lower_bound (half-open interval [lo, hi)): the first position >= x; with duplicates it lands on the leftmost one
      function lowerBound(a: number[], x: number): number {
        let lo = 0, hi = a.length;
        while (lo < hi) {
          const mid = lo + ((hi - lo) >> 1);
          if (a[mid]! < x) lo = mid + 1; else hi = mid;
        }
        return lo; // For upper_bound, change the condition to <= ; the difference of the two = the number of occurrences of x
      }
    note: The key tool for handling duplicate elements
    highlight: 6
- id: answer-domain
  title: "Worked example: binary search on the answer domain — the smallest feasible speed"
  tldr: "The last step said you can binary search on the answer itself; this step runs it in full with four work orders and an 8-hour deadline — first verify by hand why a processing speed of 3 does not work and 4 is exactly enough, then watch binary search find that dividing point in the speed range with only four checks."
  body: >-
    Put the variant into a worked example. Four work orders with workloads 3, 6, 7, 11 must all be finished within a total of 8 hours; the processing speed is k items per hour — the larger k is, the easier it gets. The question is the smallest k. Given k, each order takes its workload divided by k, rounded up; sum them and compare against 8 to judge feasibility.


    Verify both sides of the dividing point — at k = 3 the four orders take 1, 2, 3, 4 hours, totaling 10 hours — infeasible; at k = 4 they take 1, 2, 2, 3, totaling 8 hours — exactly feasible; at k = 5, 1, 2, 2, 3 totaling 8 — feasible; at k = 6, 1, 1, 2, 2 totaling
    6 — feasible. Feasibility flips from false to true at k = 4 and stays true afterwards.


    So binary search over the range of k from 1 to 11 for the first feasible value — the midpoint 6 is feasible, so the upper bound pulls back to 6; the midpoint 3 is infeasible, so the lower bound rises to 4; the midpoint 5 is feasible, so the upper bound pulls back to 5; the midpoint 4 is feasible, so the upper bound pulls back to 4 — the answer is k = 4. Four checks in all, each scanning the work orders once, so the total complexity is checks times orders — far faster than trying every k starting from 1. Note — what is being binary searched is not an array, but a monotone predicate.
