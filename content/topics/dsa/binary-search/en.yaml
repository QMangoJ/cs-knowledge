- id: complexity
  title: Why it is [[O(log n)|大 O 记号]]
  tldr: "After all these rounds, this step settles the total bill — why the maximum number of comparisons is logarithmic. First do the math on halving 8 numbers down to 1, then watch the data grow to a million and to a billion while the comparison count only rises to about 20 and about 30."
  body: >-
    Why O(log n) — each comparison halves the candidate range, so n elements can be halved at most log base 2 of n times before one remains. 8 takes at most 4, 1024 takes at most 11, a million about 20, a billion about 30 — 2 to the power of 20 is about a million, and 2 to the power of 30 is about a billion.


    This curve's temperament — doubling the data adds one comparison; growing it a thousandfold adds only about 10. That is the watershed between logarithmic and linear, and the reason sorted lookups barely feel the data growing. A database index locates rows instantly mainly thanks to the B+
    tree's low depth (see the data storage subject); binary search is the ring of it that searches for a key inside each node (the next section expands on this). A common misunderstanding is to call O(log n) a fixed number of comparisons — it does grow with n, just extremely slowly.
  derivation: original
  sources:
  - ref: mit-6006
    locator: Lectures on asymptotic analysis
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: The number of comparisons in binary search is logarithmic
    status: verified
    checkedBy: Checked by Muse
    checkedAt: 2026-11-07
    note: Verified against the primary source on 2026-11-07; see docs/curriculum-audit.md
  canvas:
    kind: datastate
    structure: array
    caption: Each comparison halves the range
    rows:
    - label: Remaining range
      cells:
      - v: 8
        mark: active
        sub: 1st
      - v: 4
        sub: 2nd
      - v: 2
        sub: 3rd
      - v: 1
        mark: found
        sub: 4th
    aux:
    - label: Scale → max comparisons
      items:
      - 8 → 4
      - 1 million → about 20
      - 1 billion → about 30
  log:
  - mode: Analysis
    event: "The bill is settled: doubling the data adds just one comparison — that is the watershed between logarithmic and linear."
- id: btree-echo
  title: "Echo: binary search inside B-tree nodes"
  tldr: "Binary search does not live only in arrays. This step zooms out to database indexes — inside every level's node of a [[B+ tree|B+ 树]], keys are found with exactly this binary search; the whole tree is binary search, drop a level, binary search, drop another level, alternating. Along the way it settles why indexes fight so hard over the number of levels rather than the number of comparisons."
  body: |-
    Zoom out: one node of a database B+ tree stores dozens to hundreds of sorted keys. Locating a key means first binary searching inside the node to find the child pointer, then following the pointer down to the next level — the whole tree is binary search and level-hopping alternating, and each comparison in this lesson corresponds to one in-page positioning there.

    The math: with about 100 keys per node, the B+ tree over a million rows is only about 3 to 4 levels deep; each level's in-page binary search takes about 7 comparisons, for a total of roughly twenty to thirty comparisons — yet only 3 to 4 disk pages need reading. One disk read costs orders of magnitude more than an in-memory comparison, so B-trees fight to crush the level count (via large fan-out), not the comparison count; binary search's job is pressing each level's in-page cost down to logarithmic. Nodes are not scanned linearly because scanning at every level would multiply the constant across all levels. Conversely, when the data is entirely in memory and small, a linear scan can actually be faster thanks to the cache and branch prediction — logarithmic is an asymptotic conclusion, and engineering choices still depend on constants and hardware; the sorting lesson will meet this again when it covers hybrid strategies.
  derivation: original
  sources:
  - ref: mit-6006
    locator: Binary search lectures
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    claim: Binary search positioning over a set of sorted keys is the basic operation for searching inside the nodes of a multiway search tree
    status: verified
    checkedBy: Checked by Muse
    checkedAt: 2026-11-07
    note: Verified against the primary source on 2026-11-07; see docs/curriculum-audit.md
  canvas:
