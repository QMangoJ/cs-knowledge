- id: lab-play
  title: "Hands-on: the binary search lab"
  tldr: "The rules are covered — now single-step it yourself. Pick a target value and watch how the three indexes lo, mid, hi move and how ruled-out cells turn gray; then switch to a target that does not exist and verify how the interval shrinks step by step to empty. Wherever a step fails to halve, that is where the problem is."
  body: >-
    Try different targets in the lab — hitting 23 takes only 2 comparisons; the missing 7 takes 3, after which the interval is empty; the minimum 2 and the maximum 56 both finish within 3 to 4. Ruled-out cells turn gray — with n = 8 it takes at most 4, where linear search takes up to 8 in the worst case; change n to a million and the gap becomes 20 against a million.


    Then a contrast — switch the target to a nonexistent 100 and watch the interval shrink to the right until it is empty, and understand why a miss often costs the most comparisons of all. Keep your eyes on lo and
    hi and verify that each round's interval length really does halve. If some step does not halve, you have most likely mixed the shrinking rules of the closed and half-open intervals — go back to the invariant and compare; that is faster than blindly changing code.
