title: "Binary Search: Rule Out Half Every Time"
summary: Searching a sorted array — check the middle each time, rule out half, and you find it fast.
premise: In a pile of numbers that are already sorted, looking for one number by scanning one by one is too slow — can each glance rule out half of them? This lesson walks through one concrete example, finding 23 in the sorted array [2, 5, 8, 12, 16, 23, 38, 56], and watches how the search range shrinks after each comparison.
position: This lesson stays in the "Lookup by Name and by Order" section. It follows the hash table, which scatters its keys and throws all ordering information away, and takes the opposite road — exploiting the array's own sortedness to search. After this lesson you will be able to use the
  [[loop invariant|循环不变式]] to check whether both writings of binary search — closed interval and half-open interval — are correct, and to explain how [[lower_bound]]
  locates the first position that is not less than the target among duplicate elements.
bridge:
  prev: The previous lesson used the modulo operation to stuff keys into buckets in exchange for arriving in one step on average; this lesson gives up scattering and instead holds on to the precondition of a sorted array, in exchange for the power to rule out half the candidates with each comparison.
  next: Binary search's precondition is that the array is sorted first. The next lesson, merge sort and quicksort, tackles exactly that — how to sort an unsorted array wholesale at a cost of O(n log n).
overview:
- key: In one sentence
  value: The precondition is sortedness; each comparison against the middle element halves the range. When looking for 23, for example, you first check the middle number — if the target is larger, only the right half stays; if smaller, only the left half — and after a few steps the range shrinks to just the answer.
- key: Complexity
  value: The complexity is [[O(log n)|大 O 记号]] — a million elements take at most about 20 comparisons. Because each comparison halves the range, halving a million down to a single element takes only about 20 steps, so the data can grow a lot while the comparison count grows very slowly.
- key: Precondition
  value: The data must be sorted, and it must support direct access by index. With no order, one comparison cannot tell you which half the target is in; and if you cannot jump straight to the middle position by index, just walking to the middle costs linear time each round, and binary search saves nothing.
- key: In practice
  value: "[[lodash]]'s [[sortedIndex]], the binary search over keys inside a node of a database [[B+ tree|B+ 树]], and [[git bisect]] hunting down the commit that introduced a bug all use the same idea. git bisect treats the commit history as a sorted sequence — test the middle commit each time, and you can tell whether the bug appeared in the first half or the second half."
- key: Common mistakes
  value: The easiest place to go wrong is the boundary conditions — whether the interval is closed on the left and open on the right, or closed on both ends, for instance — and computing the middle position by adding the two ends directly can overflow the integer. Get a boundary wrong by one and the result is usually not slightly slower but outright wrong answers or an infinite loop, so pin down what the interval means before you write anything.
- key: Variants
  value: Common variants are [[lower_bound]] and [[upper_bound]] — finding the first position not less than, or the first position greater than, the target — and binary searching on a monotone answer. Whenever a problem's yes-or-no flips monotonically with a value — capacity being enough, for instance, flips from not enough to enough as capacity grows — you can binary search on the answer itself.
- key: The invariant
  value: The invariant is — if the target exists, it is definitely inside the current interval. Each time you shrink the range you may only throw away the half that definitely does not contain the target. Hold that line, and when the loop ends with an empty interval you can conclude the target does not exist, with no false kills.
