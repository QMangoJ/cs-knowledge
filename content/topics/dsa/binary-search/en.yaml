- id: middle
  title: Look at the middle, rule out half
  tldr: "The last step said that looking at one number can rule out a whole stretch; this step cashes that in — take the middle number, compare once, and watch the 4 numbers of the left half get ruled out by a single verdict. At the same time it pins down the two sentences the whole algorithm stands on — if the target exists it is still inside the current interval, and the interval strictly shrinks every round."
  body: |-
    The initial interval is all 8 numbers, indexes 0 to 7; the middle position is (0 + 7) / 2 rounded down, which is 3, and the element there is 12. 23 is larger than 12, and the order is ascending, so 23 cannot be at 12 or anywhere to its left.

    So indexes 0 to 3 — 4 elements — are ruled out at once, leaving 16, 23, 38, 56. One comparison rules out half: that is the core. The product of a comparison is not "found it or not" but a life-or-death verdict on half the range — even a miss buys you the exclusion of four elements. Abstracted, every round maintains two sentences: if the target exists, it is definitely still inside the current interval (the [[loop invariant|循环不变式]]); and the interval strictly shrinks. The first guarantees no false kills, the second guarantees termination — every variant and every bug later in this lesson can be checked against these two sentences.
