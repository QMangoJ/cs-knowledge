- id: rotated-array
  title: "Rotated arrays: binary search in a half-sorted array"
  tldr: "Every binary search so far stood on the whole array being sorted. This step cuts a sorted array in the middle and swaps the two halves, so the whole is no longer monotone, and looks at what structure remains usable — cut at any midpoint, at least one of the two halves is still fully sorted — and where this road fails when there are duplicates."
  body: >-
    A rotated array is a sorted array cut at some point with the two halves swapped — 2, 5, 8, 12, 16, 23, 38, 56 cut at 16 becomes
    16, 23, 38, 56, 2, 5, 8, 12. The whole is no longer monotone and plain binary search fails, but local monotonicity survives — cut at any midpoint, at least one of the two halves is fully sorted.


    Worked example, finding 5 — in the first round the interval is indexes 0 to 7 and the midpoint, index 3, is 56. The left end 16 is not greater than 56, which shows the left half 16, 23, 38, 56 is sorted; 5 is not between 16 and 56, so it can only be in the right half, and the lower bound rises to 4. In the second round the interval is 4 to 7 and the midpoint, index 5, is exactly
    5 — hit. Two rounds and done, still [[O(log n)|大 O 记号]].


    The test is a single sentence — first decide which half is sorted, then check whether the target lies inside that half's value range; if it does, go there; if not, go to the other half. With duplicates, if the left end, the midpoint, and the right end are all equal, you cannot tell which half is sorted and can only shrink both ends by one cell each, degrading to O(n) in the worst case — the one back door duplicates open.
  derivation: original
