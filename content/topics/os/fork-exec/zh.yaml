      actors:
        - lane: parent
          id: sh
          label: bash（父进程）
          highlight: true
        - lane: kernel
          id: k
          label: 内核
        - lane: child
          id: c
          label: 子进程
      messages:
        - id: m-wait
          from: sh
          to: k
          label: wait：等它结束
