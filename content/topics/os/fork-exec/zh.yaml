- id: wait
  title: wait：父进程等孩子结束
  tldr: bash 调用 wait 暂停自己，直到 ls 运行完。
  body: '如果 bash 不等，ls 的输出就会和下一个提示符混在一起。

    wait 让父进程睡眠，内核在子进程结束时把它唤醒。

    这像前端 await 一个 Promise：不占着 CPU 空转，结果来了再继续；在命令末尾加 & 就是不等它。


    细节上 wait 是一族：waitpid 可以等指定的子进程，加 WNOHANG 就变成非阻塞的问一下、没结束先干别的，事件驱动的父进程靠它加 SIGCHLD 信号避免僵死。子进程的结束信息被编码在一个状态字里：正常退出时用 WEXITSTATUS 取出退出码（只保留低 8 位，所以 exit（300）实际记录的是 44），被信号杀死时则要用 WIFSIGNALED 与 WTERMSIG 判断。把状态字直接当退出码读，是 shell 脚本里经典的误判来源。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: wait(2)
    url: https://man7.org/linux/man-pages/man2/wait.2.html
    claim: wait 让父进程等待子进程状态改变
    status: verified
