- id: fork
  title: fork：复制出一个自己
  tldr: 内核把 bash 复制一份，得到一个几乎一样的子进程。
  body: 'bash 调用 fork（在 Linux 上底层是 clone 系统调用），内核复制出子进程。

    fork 返回两次：父进程拿到子进程的 PID，子进程拿到 0，靠这个区分“我是谁”。

    Linux 用“写时复制”，有人改内存时才真正复制，所以 fork 并不慢。


    写时复制的数字感：fork 一个占 10 GB 的进程，瞬间只复制页表（叶级页表约 20 MB 量级），物理页全部共享、只读标记；谁写谁才复制那一页。所以 Redis 的 RDB 持久化敢用 fork；注意 Python 这类带引用计数的运行时会频繁写对象头、触发大量 COW 复制，用 fork 时要算这笔账。


    再补两个容易踩的边界：第一，fork 只复制调用它的那个线程，父进程里其他线程在子进程中直接消失，正被它们握着的锁可能永远没人释放，所以多线程程序 fork 后，子进程在 exec 之前只能调用异步信号安全的函数。第二，fork 也会失败：进程数或内存超限时返回 -1 并设 errno 为 EAGAIN 或 ENOMEM，健壮的父进程必须检查这个返回值，不能假设复制总会成功。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: fork(2)
    url: https://man7.org/linux/man-pages/man2/fork.2.html
    claim: fork 创建子进程，父子获得不同返回值，内存采用写时复制
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
