    event: 子进程变成了 ls
- id: wait
  title: wait：父进程等孩子结束
  tldr: bash 调用 wait 暂停自己，直到 ls 运行完。
  body: '如果 bash 不等，ls 的输出就会和下一个提示符混在一起。

    wait 让父进程睡眠，内核在子进程结束时把它唤醒。

    这像前端 await 一个 Promise：不占着 CPU 空转，结果来了再继续；在命令末尾加 & 就是不等它。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: wait(2)
    url: https://man7.org/linux/man-pages/man2/wait.2.html
    claim: wait 让父进程等待子进程状态改变
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
  canvas:
    kind: swimlane
    actors:
    - lane: parent
