    code:
      lang: c
      code: |-
        pid_t pid = fork();
        if (pid == 0) { /* 子进程 */ execlp("ls", "ls", NULL); _exit(127); }
        /* 父进程 */ int st; waitpid(pid, &st, 0);
      note: fork + [[exec]] + wait 的最小骨架
  - id: between-fork-exec
    title: fork 和 exec 之间的黄金空档：重定向就在这里动手脚
    tldr: 子进程刚生出来时跑的还是 bash 的代码、还没变成目标程序，shell 正是趁着这几微秒的空档调整好它的文件描述符，所以每个程序不用自己写代码就能免费支持重定向。
    body: |-
      把「生孩子」和「换程序」拆成两步，最大的妙处就在这中间多出来的一段窗口期。假设你刚才敲的不是单纯的 ls，而是 ls > out.txt，想把结果写进文件而不是打在屏幕上，会发生什么？

      fork 完的一瞬间，子进程虽然和父亲分家了，但肚子里装的还是 bash 的代码，正听从 bash 的指挥。在变身之前，子进程先打开 out.txt 拿到一个文件编号（比如 3 号），接着调用 [[dup2]] 系统调用，把 3 号强行复制盖到 1 号（标准输出）的位置上，再关掉多余的 3 号，做完这一切才动身变成 ls。

      等 ls 真正跑起来时，它只管像平时一样往 1 号标准输出打印文件名，根本不知道自己的 1 号早被偷梁换柱成了 out.txt。正因为重定向、切换工作目录、改环境变量全都在变身前由 shell 用普通系统调用布置妥当，ls、cat、grep 成千上万个命令才全都不必自己操心文件重定向，天然就能通用。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: dup2(2)
        url: https://man7.org/linux/man-pages/man2/dup2.2.html
        claim: dup2 把文件描述符复制到指定编号，是重定向的实现机制
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: parent
          id: sh
          label: bash（父进程）
        - lane: kernel
          id: k
          label: 内核
        - lane: child
          id: c
          label: 子进程
          highlight: true
      messages:
        - id: m-between-fork-exec
          from: c
          to: k
