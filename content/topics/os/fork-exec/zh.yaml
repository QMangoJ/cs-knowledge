- id: exit-reap
  title: exit 与回收：进程的结束
  tldr: 子进程退出后留下退出码，被父进程 wait 取走才算彻底消失。
  body: 'ls 运行完退出，内核释放它的大部分资源，只保留退出码等父进程来读；在 bash 里 echo $? 就能看到它。

    父进程取走退出码后，子进程才彻底消失。

    如果父进程一直不 wait，子进程就成了“僵尸”，在 ps 里显示为状态 Z。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: wait(2) NOTES 部分
    url: https://man7.org/linux/man-pages/man2/wait.2.html
    claim: 未被等待的已终止子进程成为僵尸进程
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
  canvas:
