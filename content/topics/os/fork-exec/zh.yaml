  - id: orphan-signal
    title: 孤儿进程与信号
    tldr: 父进程先走了，孩子由别的进程收养；进程之间还能用信号打招呼。
    body: |-
      如果父进程先退出，子进程就成了「孤儿」：内核把它过继给 PID 1（或登记过的 subreaper 收养者），由收养者负责 wait 回收——回收协议因此永远有兜底，僵尸不会因为父进程死了就无人处理。

      进程之间还能用信号打招呼：Ctrl+C 是终端发来的 SIGINT，kill 命令默认发 SIGTERM，子进程结束时父进程会收到 SIGCHLD。信号的名字有误导性：kill 只是「发信号」，杀不杀取决于目标对这个信号的处置——多数信号可以被捕获处理或忽略；只有 SIGKILL 与 SIGSTOP 不可捕获、不可忽略，所以再卡死的进程也总能被停住或杀掉。
    derivation: original
    sources:
      - ref: ostep
        locator: Processes 一章
        claim: 父进程先走了，孩子由别的进程收养；进程之间还能用信号打招呼。
