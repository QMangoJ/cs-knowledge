- id: orphan-signal
  title: 孤儿进程与信号
  tldr: 父进程先走了，孩子由别的进程收养；进程之间还能用信号打招呼。
  body: '如果父进程先退出，子进程就成了“孤儿”，内核把它过继给所在 PID namespace 的 PID 1（宿主机上通常是 systemd）或注册过的 subreaper「收养者」，由它负责 wait 回收。

    进程之间可以发信号：Ctrl+C 发 SIGINT，kill 默认发 SIGTERM，子进程结束时父进程会收到 SIGCHLD。

    进程可以自己处理大多数信号，但 SIGKILL 无法捕获，一定会被杀掉。


    具体数字：fork 一个 RSS 10 GB 的推理进程，复制页表的代价远小于复制数据本身；真正被复制的是之后被写脏的页。所以 worker 数 × 每 worker 写脏量，才是多进程部署的真实内存账。'
  derivation: original
  sources:
  - ref: ostep
    locator: Processes 一章
    claim: 父进程先走了，孩子由别的进程收养；进程之间还能用信号打招呼。
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
  canvas:
    kind: swimlane
    actors:
