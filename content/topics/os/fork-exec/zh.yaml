  - id: ipc
    title: 隔离之后怎么传话：进程间通信（[[IPC]]）工具箱
    tldr: 进程之间内存彼此看不见，要合作只能借道内核：小步串流用管道，结构化消息走 Unix 域套接字或消息队列，追求极致零拷贝传大块数据才上共享内存配锁。
    body: |-
      进程天生互相隔离，fork 出来的父子刚一写各自的内存就立刻分道扬镳，真要合作只能走内核架设的跨进程通道（[[IPC]]）。刚才走过的管道是最轻量的一种：适合有亲缘关系的父子进程单向流式传字节（默认 64 KB 缓冲），写端全关才触发结束；如果想让毫无亲缘关系的两个独立服务对话，管道就不够顺手了。

      按传输需求挑剩下的几种工具：本机上两个独立程序（比如 Docker 客户端和后台守护进程）互传结构化请求，首选 Unix 域套接字——写起来和网络 Socket 几乎一样，但不走网卡协议栈、纯在内核内存里搬运，安全又快，消息队列也适合按条收发任务；如果数据大到按百 MB、GB 算，拷贝进出内核太慢，就得请出共享内存：内核让两个进程把同一块物理内存页映射进各自的账本，一方写完另一方直接看见，零拷贝极快。

      不过共享内存省掉拷贝的同时也丢掉了保护：内核只管把地皮划给你们俩，谁先写、写完没有、别把正在读的数据改乱，全得你自己配锁或信号量来同步——管道是「自带红绿灯的单行道」，共享内存是「没有红绿灯的高速广场」，越快越要自己管秩序。真要跨出这台机器连到另一台电脑，就只剩网络套接字一条路了。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: pipe(2)/shm_overview(7) 手册
        claim: 管道是单向字节流通道，共享内存需配合信号量等同步原语使用
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
