id: os/fork-exec
subject: os
slug: fork-exec
order: 2
status: published
license: CC-BY-4.0
title: 进程的诞生：fork + exec + wait
summary: 在终端敲下一个命令，bash 是怎样把它变成一个新运行的程序的。
premise: 以在 Linux 的 bash 里输入 ls 为例。
overview:
- key: 一句话总结
  value: fork 复制自己，exec 换成新程序，wait 等它结束
- key: 什么是进程
  value: 正在运行的程序：代码 + 内存 + 打开的文件 + 运行状态
- key: 为什么分两步
  value: fork 和 exec 之间，可以先布置子进程（如重定向输出）
- key: 常见用法
  value: shell 运行命令、管道 a | b、Node.js 的 child_process
- key: 收尾
  value: 父进程不 wait，子进程会变成僵尸进程
- key: 进程状态
  value: 运行（R）、睡眠（S/D）、停止（T）、僵尸（Z）
- key: 进程 vs 线程
  value: Linux 上都用 clone 创建：线程共享地址空间，进程各有一份
- key: posix_spawn / vfork
  value: 不需要在中间布置时，可一步创建并执行，开销更小
- key: 在终端里看一看
  value: pstree -p $$　看当前 shell 和它的子进程；ps -eo pid,ppid,stat,cmd | grep Z　找僵尸进程（状态 Z）
visual: swimlane
lanes:
- id: parent
  label: 父进程
- id: kernel
  label: 内核
- id: child
  label: 子进程
logColumns:
