- id: pipeline-walkthrough
  title: 完整走例：一条管道命令的创建全过程
  tldr: ls 管道到 wc，需要两次 fork、两边 dup2、四处 close，父进程最后 wait 两次。
  body: '把管道命令完整走一遍，以 ls | wc -l 为例：bash 先用 pipe 造出一对描述符（读端 r、写端 w），再 fork 两次。子进程一用 dup2 把 w 复制到 1 号后关掉 r 与 w，exec 成 ls；子进程二用 dup2 把 r 复制到 0 号后关掉 r 与 w，exec 成 wc。父进程自己也必须关掉 r 与 w，然后 wait 两次收两个退出码，整条命令的退出状态取最后一个进程（wc）的。

    这张图里藏着两个高频考点：一是四处 close 缺一不可，任一处漏关写端，wc 就收不到 EOF 会一直等；二是 ls 与 wc 是并发跑的，管道只有 64KB 缓冲，ls 写满时自动阻塞、wc 读走后又被自动唤醒，生产与消费靠内核的阻塞与唤醒天然同步，不需要任何轮询。数据再大也不会先落盘等 ls 写完，这正是管道与临时文件方案的根本差别。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: pipe(2)
    url: https://man7.org/linux/man-pages/man2/pipe.2.html
    claim: pipe 创建单向字节流通道，容量有限，写满时阻塞
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
