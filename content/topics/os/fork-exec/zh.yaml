id: os/fork-exec
subject: os
slug: fork-exec
order: 2
status: published
license: CC-BY-4.0
title: 进程的诞生：fork + exec + wait
summary: 在终端敲下一个命令，bash 是怎样把它变成一个新运行的程序的。
premise: 以在 Linux 的 bash 里输入 ls 为例。
position: >-
  紧接调用号这条线索的是进程管理板块：bash 启动 ls，用的正是 fork、execve 这组系统调用背后的机制。这里拆开 fork 返回两次的约定、写时复制如何只拷页表，以及不 wait 就会留下僵尸的回收协议。读完便可复述敲下一条命令后进程树如何多出一个节点，也能分辨 exec 换映像与再造进程的差别。
bridge:
  prev: >-
    系统调用课把入口定格在 syscall 指令与寄存器传参上，本课直接穿过这扇门，用 fork 的双返回值在父子之间分岔出两条执行流。
  next: >-
    子进程被 exec 换上新映像后便想独占 CPU 狂奔，可核心只有一个，内核凭什么在它陷入死循环时仍能把 CPU 夺回来分给别人？
overview:
- key: 一句话总结
  value: fork 复制自己，exec 换成新程序，wait 等它结束
- key: 什么是进程
  value: 正在运行的程序：代码 + 内存 + 打开的文件 + 运行状态
- key: 为什么分两步
  value: fork 和 exec 之间，可以先布置子进程（如重定向输出）
- key: 常见用法
  value: shell 运行命令、管道 a | b、Node.js 的 child_process
- key: 收尾
  value: 父进程不 wait，子进程会变成僵尸进程
- key: 进程状态
  value: 运行（R）、睡眠（S/D）、停止（T）、僵尸（Z）
- key: 进程 vs 线程
  value: Linux 上都用 clone 创建：线程共享地址空间，进程各有一份
- key: posix_spawn / vfork
  value: 不需要在中间布置时，可一步创建并执行，开销更小
- key: 在终端里看一看
  value: pstree -p $$　看当前 shell 和它的子进程；ps -eo pid,ppid,stat,cmd | grep Z　找僵尸进程（状态 Z）
