steps:
- id: why-process
  title: 为什么需要“进程”
  tldr: 进程让每个程序以为自己独占机器，彼此互不干扰。
  body: '电脑上同时跑着浏览器、编辑器、终端，它们各自需要内存、文件和 CPU 时间。

    操作系统把“一个正在运行的程序”包装成进程，给它独立的内存和资源账本，用一个进程号（PID）标识。

    就像 Chrome 给标签页单独开进程：一个页面崩了，其他页面不受影响。


    把账本说具体：一个进程在内核里对应一个 task_struct，里面记着打开的文件表、内存映射、信号处理方式、父子关系和资源用量，PID 只是这本账的编号。走例：在终端跑 ps -o pid,ppid,stat,cmd，能看到 bash 的 PPID 是登录会话的进程、自己跑的 sleep 又挂在 bash 下面，整台机器的进程就是这样一棵以 PID 1 为根的树。边界：PID 是有限循环复用的（上限由 pid_max 控制），所以 PID 相同不等于同一个进程，长期运行的系统辨认进程还要结合启动时间等信息。'
  derivation: original
  sources:
  - ref: ostep
    locator: Processes 一章
    claim: 进程是操作系统对运行中程序的抽象
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
  canvas:
