- id: exit-reap
  title: exit 与回收：进程的结束
  tldr: 子进程退出后留下退出码，被父进程 wait 取走才算彻底消失。
  body: 'ls 运行完退出，内核释放它的大部分资源，只保留退出码等父进程来读；在 bash 里 echo $? 就能看到它。

    父进程取走退出码后，子进程才彻底消失。

    如果父进程一直不 wait，子进程就成了“僵尸”，在 ps 里显示为状态 Z。


    僵尸到底占什么？它不占内存映像、不占 CPU，只剩内核里一条进程表记录和退出状态，所以单个僵尸几乎无害；但它的 PID 不能被复用，海量僵尸会耗尽 PID 并让新进程无法创建，ps 里满屏 Z 就是父进程长期不回收的证据，处理办法是让父进程去 wait，或者结束父进程让 PID 1 接管回收。工程上守护进程常用二次 fork 正是借这条规则：让中间子进程退出、工作进程被 PID 1 收养，从此与终端和原父进程彻底脱钩。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: wait(2) NOTES 部分
    url: https://man7.org/linux/man-pages/man2/wait.2.html
    claim: 未被等待的已终止子进程成为僵尸进程
    status: verified
