# 知识优先版草稿（Linux x86-64 为例）。出处仅供参考，按 Daniel 决定不做逐条核对。
id: os/fork-exec
subject: os
slug: fork-exec
order: 2
status: published
license: CC-BY-4.0
title: 进程的诞生：fork + exec + wait
summary: 在终端敲下一个命令，bash 是怎样把它变成一个新运行的程序的。
premise: 以在 Linux 的 bash 里输入 ls 为例。
overview:
  - key: 一句话总结
    value: fork 复制自己，exec 换成新程序，wait 等它结束
  - key: 什么是进程
    value: 正在运行的程序：代码 + 内存 + 打开的文件 + 运行状态
  - key: 为什么分两步
    value: fork 和 exec 之间，可以先布置子进程（如重定向输出）
  - key: 常见用法
    value: shell 运行命令、管道 a | b、Node.js 的 child_process
  - key: 收尾
    value: 父进程不 wait，子进程会变成僵尸进程
  - key: 在终端里看一看
    value: pstree -p $$　看当前 shell 和它的子进程；ps -eo pid,ppid,stat,cmd | grep Z　找僵尸进程（状态 Z）
visual: swimlane
lanes:
  - id: parent
    label: 父进程
  - id: kernel
    label: 内核
  - id: child
    label: 子进程
logColumns:
  - key: mode
    label: 当前状态
  - key: event
    label: 发生了什么
steps:
  - id: why-process
    title: 为什么需要“进程”
    tldr: 进程让每个程序以为自己独占机器，彼此互不干扰。
    body: |-
      电脑上同时跑着浏览器、编辑器、终端，它们各自需要内存、文件和 CPU 时间。
      操作系统把“一个正在运行的程序”包装成进程，给它独立的内存和资源账本，用一个进程号（PID）标识。
      就像 Chrome 给标签页单独开进程：一个页面崩了，其他页面不受影响。
    derivation: original
    sources:
      - ref: ostep
        locator: Processes 一章
        claim: 进程是操作系统对运行中程序的抽象
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: swimlane
      actors:
        - lane: parent
          id: sh
          label: bash（父进程）
          highlight: true
        - lane: kernel
          id: k
          label: 内核
        - lane: child
          id: c
          label: 子进程
      messages: []
    log:
      - mode: bash 运行中
        event: 用户输入 ls，bash 需要启动一个新程序
  - id: fork
    title: fork：复制出一个自己
    tldr: 内核把 bash 复制一份，得到一个几乎一样的子进程。
    body: |-
      bash 调用 fork（在 Linux 上底层是 clone 系统调用），内核复制出子进程。
      fork 返回两次：父进程拿到子进程的 PID，子进程拿到 0，靠这个区分“我是谁”。
      Linux 用“写时复制”，有人改内存时才真正复制，所以 fork 并不慢。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: fork(2)
        url: https://man7.org/linux/man-pages/man2/fork.2.html
        claim: fork 创建子进程，父子获得不同返回值，内存采用写时复制
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: swimlane
      actors:
        - lane: parent
          id: sh
          label: bash（父进程）
        - lane: kernel
          id: k
          label: 内核
          highlight: true
        - lane: child
          id: c
          label: 子进程
      messages:
        - id: m-fork
          from: sh
          to: c
          label: fork：复制一份
          active: true
    log:
      - mode: 父子两个进程
        event: 内核复制出子进程
  - id: exec
    title: exec：换上新程序
    tldr: 子进程调用 execve，把自己整个换成 ls。
    body: |-
      exec 不创建新进程，而是把当前进程的代码和内存替换成另一个程序，从头运行。
      PID 和打开的文件保留下来，所以 bash 可以在 exec 之前先把输出重定向到文件。
      这就是拆成两步的好处：中间留出了“布置环境”的机会。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: execve(2)
        url: https://man7.org/linux/man-pages/man2/execve.2.html
        claim: execve 用新程序替换当前进程映像，PID 与多数文件描述符保留
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: swimlane
      actors:
        - lane: parent
          id: sh
          label: bash（父进程）
        - lane: kernel
          id: k
          label: 内核
        - lane: child
          id: c
          label: 子进程
          highlight: true
      messages:
        - id: m-exec
          from: c
          to: k
          label: execve：换成 ls
          active: true
    log:
      - mode: 子进程运行 ls
        event: 子进程变成了 ls
  - id: wait
    title: wait：父进程等孩子结束
    tldr: bash 调用 wait 暂停自己，直到 ls 运行完。
    body: |-
      如果 bash 不等，ls 的输出就会和下一个提示符混在一起。
      wait 让父进程睡眠，内核在子进程结束时把它唤醒。
      这像前端 await 一个 Promise：不占着 CPU 空转，结果来了再继续；在命令末尾加 & 就是不等它。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: wait(2)
        url: https://man7.org/linux/man-pages/man2/wait.2.html
        claim: wait 让父进程等待子进程状态改变
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: swimlane
      actors:
        - lane: parent
          id: sh
          label: bash（父进程）
          highlight: true
        - lane: kernel
          id: k
          label: 内核
        - lane: child
          id: c
          label: 子进程
      messages:
        - id: m-wait
          from: sh
          to: k
          label: wait：等它结束
          active: true
    log:
      - mode: bash 等待中
        event: 父进程睡眠，等待子进程
  - id: exit-reap
    title: exit 与回收：进程的结束
    tldr: 子进程退出后留下退出码，被父进程 wait 取走才算彻底消失。
    body: |-
      ls 运行完退出，内核释放它的大部分资源，只保留退出码等父进程来读；在 bash 里 echo $? 就能看到它。
      父进程取走退出码后，子进程才彻底消失。
      如果父进程一直不 wait，子进程就成了“僵尸”，在 ps 里显示为状态 Z。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: wait(2) NOTES 部分
        url: https://man7.org/linux/man-pages/man2/wait.2.html
        claim: 未被等待的已终止子进程成为僵尸进程
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: swimlane
      actors:
        - lane: parent
          id: sh
          label: bash（父进程）
          highlight: true
        - lane: kernel
          id: k
          label: 内核
        - lane: child
          id: c
          label: 子进程
      messages:
        - id: m-exit-reap
          from: c
          to: sh
          label: 退出码交给父进程
          active: true
    log:
      - mode: bash 继续运行
        event: 子进程被回收，显示下一个提示符
