- id: posix-spawn
  title: 不需要中间布置时：posix_spawn 与 vfork
  tldr: posix_spawn 一步创建并执行新程序，跳过中间窗口，更快也更安全；vfork 更极端，只适合受限场景。
  body: '既然中间布置这么有用，为什么还要 posix_spawn 与 vfork？因为 fork 加 exec 有两笔隐性账：第一，fork 要复制页表并把父进程的页全部改成只读的写时复制，大进程（比如占几 GB 的 JVM 或浏览器）fork 瞬间也要付页表与标记的成本，还可能因为地址空间预留策略被误判为内存不足而失败；第二，多线程进程 fork 后子进程能安全调用的函数极少，写错一步就死锁。

    posix_spawn 让实现内部用 clone 加标志位直接完成创建加 exec，不给中间代码执行的机会，只允许通过参数声明要布置的文件动作与属性，常见的直接启动新程序因此更快也更安全。vfork 更极端：子进程借用父进程的地址空间、父进程挂起直到 exec 或退出，省到极致但子进程改任何变量都会污染父进程，只适合老式或嵌入式场景。取舍口诀：要布置就 fork 加 exec，要直达就 posix_spawn。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: posix_spawn(3) 与 vfork(2)
    url: https://man7.org/linux/man-pages/man3/posix_spawn.3.html
