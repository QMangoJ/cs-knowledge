  label: 发生了什么
steps:
- id: why-process
  title: 为什么需要“进程”
  tldr: 进程让每个程序以为自己独占机器，彼此互不干扰。
  body: '电脑上同时跑着浏览器、编辑器、终端，它们各自需要内存、文件和 CPU 时间。

    操作系统把“一个正在运行的程序”包装成进程，给它独立的内存和资源账本，用一个进程号（PID）标识。

    就像 Chrome 给标签页单独开进程：一个页面崩了，其他页面不受影响。'
  derivation: original
  sources:
  - ref: ostep
    locator: Processes 一章
    claim: 进程是操作系统对运行中程序的抽象
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
  canvas:
    kind: swimlane
    actors:
    - lane: parent
      id: sh
      label: bash（父进程）
      highlight: true
    - lane: kernel
      id: k
      label: 内核
    - lane: child
      id: c
      label: 子进程
    messages: []
  log:
  - mode: bash 运行中
    event: 用户输入 ls，bash 需要启动一个新程序
  points:
  - 进程让每个程序以为自己独占机器，彼此互不干扰。
- id: fork
  title: fork：复制出一个自己
  tldr: 内核把 bash 复制一份，得到一个几乎一样的子进程。
  body: 'bash 调用 fork（在 Linux 上底层是 clone 系统调用），内核复制出子进程。

    fork 返回两次：父进程拿到子进程的 PID，子进程拿到 0，靠这个区分“我是谁”。

    Linux 用“写时复制”，有人改内存时才真正复制，所以 fork 并不慢。


    写时复制的数字感：fork 一个占 10 GB 的进程，瞬间只复制页表（叶级页表约 20 MB 量级），物理页全部共享、只读标记；谁写谁才复制那一页。所以 Redis 的 RDB 持久化敢用 fork；注意 Python 这类带引用计数的运行时会频繁写对象头、触发大量 COW 复制，用 fork 时要算这笔账。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: fork(2)
    url: https://man7.org/linux/man-pages/man2/fork.2.html
    claim: fork 创建子进程，父子获得不同返回值，内存采用写时复制
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
  canvas:
    kind: swimlane
    actors:
    - lane: parent
      id: sh
      label: bash（父进程）
    - lane: kernel
      id: k
      label: 内核
      highlight: true
    - lane: child
      id: c
      label: 子进程
    messages:
    - id: m-fork
      from: sh
      to: c
      label: fork：复制一份
      active: true
  log:
  - mode: 父子两个进程
    event: 内核复制出子进程
  code:
    lang: c
    code: 'pid_t pid = fork();

      if (pid == 0) { /* 子进程 */ execlp("ls", "ls", NULL); _exit(127); }

      /* 父进程 */ int st; waitpid(pid, &st, 0);'
    note: fork + exec + wait 的最小骨架
- id: exec
  title: exec：换上新程序
  tldr: 子进程调用 execve，把自己整个换成 ls。
  body: 'exec 不创建新进程，而是把当前进程的代码和内存替换成另一个程序，从头运行。

    PID 和打开的文件保留下来（未设 close-on-exec 的那些），所以 bash 可以在 exec 之前先把输出重定向到文件。

    这就是拆成两步的好处：中间留出了“布置环境”的机会。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: execve(2)
    url: https://man7.org/linux/man-pages/man2/execve.2.html
    claim: execve 用新程序替换当前进程映像，PID 与多数文件描述符保留
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
  canvas:
    kind: swimlane
    actors:
    - lane: parent
      id: sh
      label: bash（父进程）
    - lane: kernel
      id: k
      label: 内核
    - lane: child
      id: c
      label: 子进程
