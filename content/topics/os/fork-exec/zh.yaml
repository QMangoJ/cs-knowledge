level: 基础
minutes: 18
prereq:
  - os/syscall
objectives:
  - 区分 fork（复制进程）与 exec（换程序映像）
  - 解释写时复制为什么让 fork 很便宜
  - 说清僵尸进程与孤儿进程的成因
aiLink: 容器与推理服务的进程模型全建立在 fork/exec 之上：Python multiprocessing、vLLM 的多 worker、数据加载子进程都靠 fork 复用已加载的模型与解释器状态；理解写时复制，就理解为什么 fork 出 8 个 worker、只要写脏的页不多，就不会立刻吃掉 8 倍内存（只读页全共享）。
design:
  - mechanism: 把启动拆成 fork 和 exec 两步：中间留一段可编程窗口，靠组合小调用白捡重定向与管道
    problem: 新程序启动前要做的环境布置五花八门：改标准输出、接管道、换工作目录、降权限、关多余文件。如果设计一个「一步创建新程序」的大接口，要么参数列表塞得像百科全书，要么明天冒出个新需求就彻底支持不了。
    choice: 把「复制进程」和「换成新程序」劈成 fork 与 exec 两个正交的小接口，中间留出一段能随便跑普通用户代码（如 dup2、chdir）的窗口。对比 Windows 那种大而全的 CreateProcess 接口，简单调一次也得填一大堆结构体参数，没写进结构体的布置方式依然做不到。
    tradeoff: 代价是每次起新程序都得先过两次门、子进程还先顶着父进程的旧壳子跑几微秒再扔掉，全靠写时复制压低成本才划算；同时这也逼着程序员得小心别在多线程环境里的中间窗口干不安全的事。
    root: 把「提供基础积木」和「怎么拼积木」彻底分开：内核只管给最小原子能力，新程序上场前怎么打扮完全交给 shell 自由组合，小积木组合出的能力比写死的大接口丰富几个量级。
  - mechanism: 写时复制（COW）：fork 时只抄页表、共用物理页，真有人要改才按页复制
    problem: 语义上要求父子拥有互不干扰的独立内存，可动辄几 GB 的进程如果创建瞬间全量搬家，时间慢、内存也瞬间翻倍；更冤的是绝大多数 fork 下一微秒就要调 exec 把旧内存全扔掉，搬了等于白搬。
    choice: fork 当下只把几 MB 的页表抄一遍，所有物理内存页都先标成「只读」让父子合用；哪天谁真往某一页写东西，触发硬件缺页异常再单独复制那一页。全量硬拷贝太慢，完全不隔离又会互相改乱，按需复制是唯一兼顾速度与隔离的解法。
    tradeoff: 第一次写入共享页时要额外吃一次缺页异常和 4 KB 复制的延迟；另外有些语言运行时会悄悄修改对象头部的引用计数，把本来没改业务数据的共享页也逐页写脏——运维估算多进程内存占用时，得按「写脏了多少页」来算账。
    root: 靠两条客观规律撑腰：一是统计上进程 fork 后写少读多甚至马上丢弃，二是 MMU 硬件本来就能以 4 KB 页为单位拦住第一次写入——把「急着提前干」改成「拖到真动手时再懒处理」，有硬件异常托底才敢这么省。
  - mechanism: 僵尸态与 wait 回收协议：内核替死去的子进程留条最小遗言，谁生的谁负责收回
    problem: 子进程随时可能比父进程先一步结束，它的退出码必须交到父进程手里，不能随内存一起蒸发；但进程已经死了，内存文件必须立刻释放，同时整机的 PID 数量又有限，遗言不能无限期挂在内存里。
    choice: 内核把死了的进程剥得只剩一条几字节的退出状态（僵尸态），等父进程调 wait 领走才删掉，父进程先死了再让 PID 1 兜底代收。如果子进程一退出就灰飞烟灭，父进程压根拿不到退出码，shell 脚本靠 $? 判断前一步成败的整套逻辑就全没着落了。
    tradeoff: 只要父进程疏忽忘了调 wait，系统里就会攒出一堆吃掉 PID 的僵尸——内核故意把清理责任钉死在父进程身上，只提供最终兜底，不替懒惰的应用程序无限擦屁股。
    root: 异步执行的两个进程在结束时间上没有天然交汇点，消费者（父进程）来拿退出码时生产者（子进程）早就散场了，就必须由第三方可信中转站（内核）暂存这份遗言，直到被签收为止——这和消息队列先存后取是同一个道理。
quiz:
  - q: fork 之后父子进程的区别首先体现在？
    options:
      - 代码完全不同
      - fork 在子进程返回 0、父进程返回子进程 PID
      - 内存立刻完全独立复制
      - 子进程没有 PID
    answer: 1
    explain: 靠返回值分流是 fork 编程的固定套路；内存靠写时复制按需分离。
  - q: exec 成功后会发生什么？
    options:
      - 在原程序上叠加新代码
      - 当前进程映像被新程序替换，PID 不变，exec 之后的代码不再执行
      - 新建一个进程
      - 把父进程杀掉
    answer: 1
    explain: exec 是替换而非创建，所以 shell 是 fork 出子进程再在子进程里 exec。
  - q: 僵尸进程是怎么产生的？
    options:
      - 子进程死循环
      - 子进程已退出但父进程还没 wait 读取退出状态
      - 父进程先退出
      - 信号被屏蔽
    answer: 1
    explain: 退出状态留在进程表里等父进程回收；父进程不管，条目就一直占着。
