steps:
  - id: why-process
    title: 进程就是一份「独立账本」：把正在跑的程序彼此隔开
    tldr: 进程不只是代码本身，而是操作系统替一个正在运行的程序单独记的一整套资源账本——内存、打开的文件和运行状态各归各的，互不串门。
    body: |-
      回到终端窗口：在你的电脑上，浏览器、编辑器和刚刚敲下 ls 的 bash 同时都在跑，它们各用各的内存、各读写各的文件，谁也不能随便改掉隔壁程序的数据。操作系统把「一个正在运行中的程序」包成进程，发给它一张唯一的编号——进程号（[[PID]]），就像 Chrome 浏览器给每个标签页单独开进程一样：就算某一个网页崩掉，关掉它就行，整个浏览器和其他页面稳稳当当。

      在 Linux 内核的视角里，一个进程其实对应着一份叫 task_struct 的「总账本」：里面记着这程序分到了哪些虚拟内存、打开了哪些文件、收到信号该怎么处理，以及它的父亲是谁、生了哪些孩子。全机所有进程顺着父子关系连成一棵大树，树根永远是开机启动的 PID 1 号进程——bash 生出 ls，ls 就是这棵树上新长出来的一片叶子。
    derivation: original
    sources:
      - ref: ostep
        locator: Processes 一章
        claim: 进程是操作系统对运行中程序的抽象
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: parent
          id: sh
          label: bash（父进程）
          highlight: true
        - lane: kernel
          id: k
          label: 内核
        - lane: child
          id: c
          label: 子进程
      messages: []
    log:
      - mode: bash 运行中
        event: 用户输入 ls，bash 需要启动一个新程序
    points:
      - 进程让每个程序以为自己独占机器，彼此互不干扰。
  - id: fork
    title: fork：一次调用返回两次，靠写时复制几乎零拷贝
    tldr: fork 复制出一个几乎一模一样的子进程，靠返回值的不同（父进程拿子进程号、子进程拿 0）让两兄弟立刻分道扬镳；而且只拷贝页表不拷贝数据，写时复制让它起步极快。
    body: |-
      你在终端按回车后，bash 的第一步是调用 fork（在 Linux 底层对应 clone 系统调用）。内核当场克隆出一个子进程：代码、变量、当前打开的文件和执行位置全和 bash 一样。神奇的地方在于，fork 这一个函数调用会返回两次——在原来的 bash（父进程）里，它返回新孩子的 [[PID]]（比如 4215）；在新克隆出来的子进程里，它返回 0。父子靠这一个 if 判断，就从同一份代码分叉成了两条路：bash 记下孩子编号准备等它，子进程则准备去变身成 ls。

      很多人刚听说这里会立刻卡住：要是一个数据库或后端进程占了 10 GB 内存，fork 一下岂不是要把 10 GB 全搬一遍，电脑不得卡死？放心，内核用了一招叫写时复制（[[COW]]）的懒办法：fork 的瞬间只复制一份轻飘飘的内存目录（页表，对于 10 GB 进程也就 20 MB 左右），真正的物理内存一页都不动，父子暂时共用，同时全标成「只读」。

      直到后面父进程或子进程真的往某一页内存里写新数据时，CPU 硬件触发一次缺页异常，内核才急忙把那一页（通常 4 KB）复制出一份新的交给写的人。正因为起步成本这么低，像 [[Redis]] 做数据快照存盘时才敢直接 fork 出子进程干活；当然这笔账只是推迟而不是免单——多进程程序真正消耗的额外内存，取决于各自写脏了多少页，而不是「进程数乘以单进程大小」。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: fork(2)
        url: https://man7.org/linux/man-pages/man2/fork.2.html
        claim: fork 创建子进程，父子获得不同返回值，内存采用写时复制
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: parent
          id: sh
          label: bash（父进程）
        - lane: kernel
          id: k
          label: 内核
          highlight: true
        - lane: child
          id: c
