  - id: pipeline-walkthrough
    title: 管道实战：ls | wc -l 怎么边写边读还不卡死
    tldr: 执行 ls | wc -l 时，bash 先建一条内核管道、再 fork 两次分别接上管道的写端和读端，让两个程序同时并发跑起来；只有所有进程都关掉多余的写端，读端才能等来结束信号。
    body: |-
      把刚才的套路升级一下，假如你想数一数当前目录有多少个文件，敲了 ls | wc -l。bash 不会傻等 ls 把全部输出写进临时文件再开 wc，它先调用 pipe 向内核要来一对连通的文件描述符——读端 r 和写端 w，然后再连着 fork 出两个子进程。

      子进程一变身成 ls 前，用 [[dup2]] 把自己的 1 号标准输出接到管道写端 w，然后立刻关掉手里原有的 r 和 w；子进程二变身成 wc 前，把自己的 0 号标准输入接到管道读端 r，同样关掉手里原有的 r 和 w；就连不参与干活的 bash 父进程自己，也必须老老实实把手里攥着的 r 和 w 全部关掉，接着同时 wait 两个孩子（整条命令的 $? 取最后一个进程 wc 的状态）。

      整条管道里最容易漏掉的坑就是这「四处 close」：只有系统里所有进程手里持有的写端 w 全部关掉，内核才会给管道另一头的读端发 [[EOF]]（文件结束符，read 返回 0）。万一 bash 忘了关掉自己手里那份写端 w，哪怕 ls 早跑完了，wc 还是会以为「外面还有人可能继续写」，死等在那里永远不退出！至于容量问题也不用担心：Linux 管道在内核里自带约 64 KB 缓冲区，ls 写满 64 KB 就自动睡下等 wc 读走，读空了再自动叫醒 ls，天然同步，再大的数据也不用先落盘。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: pipe(2)
        url: https://man7.org/linux/man-pages/man2/pipe.2.html
        claim: pipe 创建单向字节流通道，容量有限，写满时阻塞
        status: verified
