    log:
      - mode: bash 等待中
        event: 父进程睡眠，等待子进程
  - id: exit-reap
    title: exit 与僵尸进程：死后不收尸就会占光进程号
    tldr: 子进程退出后内核会释放它的内存和文件，但必须留下一条存着退出码的最小记录等父进程来取；要是父进程一直不调 wait，这条记录就变成占住 PID 不放的僵尸进程。
    body: |-
      当 ls 打完字调用 exit 结束时，内核其实很勤快，当场就把它占用的全部内存、打开的文件描述符通通收回去了——唯一不敢删的，是进程表里那条写着「谁、以什么状态退出」的几字节小记录。因为父进程可能过两秒才来调 wait 查 $?，内核不敢擅自把遗言烧掉。

      正常情况下 bash 一觉醒来调 wait 取走退出码，这条记录立刻注销，4215 号进程才算彻底消失。可如果父进程写出了 bug，生完孩子一直不调 wait 也不退出，子进程就会永远卡在「僵尸态」（用 ps 命令看状态栏是个 Z）。

      僵尸进程已经死了，不吃 CPU 也不占业务内存，真正的麻烦在于它死死占着一个 [[PID]] 编号不放——而一台机器能发出去的 PID 总数是有限的（默认上限通常是几万到几百万）。僵尸越积越多把号码池耗尽时，整台机器就再也起不来任何新进程了，连 ssh 登录都登不上去。治僵尸不能靠发信号去「杀」（它本来就死了），唯一的办法是让父进程乖乖调 wait 收尸，或者干脆把失职的父进程杀掉，让内核派总管家去接手收尾。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: wait(2) NOTES 部分
        url: https://man7.org/linux/man-pages/man2/wait.2.html
        claim: 未被等待的已终止子进程成为僵尸进程
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
