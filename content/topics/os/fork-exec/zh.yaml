        event: 标准输出已被指向 out.txt
  - id: exec
    title: exec：进程号不变，把肚里的程序整个换掉
    tldr: exec 不新建进程，而是保持原进程号和前面布置好的文件不变，直接把当前进程的代码、堆栈和地址空间彻底清空，加载进 ls 的程序重新开跑。
    body: |-
      前戏布置好了，子进程调用 [[exec]]（Linux 上实际的系统调用叫 execve）完成变身。内核按它传入的路径找到 /usr/bin/ls 这个 [[ELF]] 可执行文件，把刚才从 bash 复制来的旧代码段、旧堆、旧栈连根拔掉，腾出全新的虚拟地址空间映射 ls 的代码和数据，再把命令行参数（"ls"）和环境变量压进新栈顶，从 ls 的入口函数第一行重新开始执行——就像一辆车在原地换了整套外壳和发动机，但车牌号（[[PID]]）始终没变（还是刚才那个 4215）。

      变身时，旧账本里哪些东西能留下来、哪些必须清零，规则就一条：看「新程序还认不认得它」。前面刚调好的打开文件（0、1、2 号描述符）和当前工作目录都原封不动留着，否则上一步费劲布置的 out.txt 重定向就白干了。

      相反，原先向内核登记过的自定义信号处理函数必须全部重置回默认动作——因为旧代码已经被清空了，函数地址早成了野指针，留着必崩；至于原本设成「忽略」的信号，则不需要跑什么代码，所以继续保持忽略。如果 exec 调用成功，它永远不会返回，子进程后面的旧 bash 代码也再没有机会执行。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: execve(2)
        url: https://man7.org/linux/man-pages/man2/execve.2.html
        claim: execve 用新程序替换当前进程映像，PID 与多数文件描述符保留
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
