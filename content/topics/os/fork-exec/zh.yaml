  code:
    lang: c
    code: 'pid_t pid = fork();

      if (pid == 0) { /* 子进程 */ execlp("ls", "ls", NULL); _exit(127); }

      /* 父进程 */ int st; waitpid(pid, &st, 0);'
    note: fork + exec + wait 的最小骨架
- id: between-fork-exec
  title: fork 与 exec 之间：布置子进程的舞台
  tldr: 子进程在变成新程序之前，还是父进程的代码，可以自由重定向、改目录、关文件。
  body: '这一段是 fork 与 exec 拆开后白赚的舞台，走一个完整走例：bash 执行 ls 重定向到 out.txt。fork 之后子进程还跑着 bash 的代码，它先 open 打开 out.txt 拿到比如 3 号描述符，再用 dup2 把 3 号复制到 1 号标准输出，关掉 3 号，然后才 exec 成 ls。

    ls 对此一无所知，它照常往 1 号写，数据却进了文件——重定向不需要 ls 提供任何参数支持。同一个舞台还能做很多布置：chdir 换工作目录、改环境变量、umask 设权限掩码、把不需要的文件描述符逐个关掉、给自己改进程组。关键洞察：这些布置用的全是影响进程状态的普通系统调用，不需要 exec 提供一长串参数，更不需要每个程序自己实现重定向逻辑——shell 布置一次，世上所有程序都自动支持重定向。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: dup2(2)
    url: https://man7.org/linux/man-pages/man2/dup2.2.html
    claim: dup2 把文件描述符复制到指定编号，是重定向的实现机制
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
  canvas:
    kind: swimlane
