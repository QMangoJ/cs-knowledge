        event: 数据在管道中边写边读
  - id: posix-spawn
    title: 不需要中间布置时：用 [[posix_spawn]] 一步到位
    tldr: 如果只是单纯拉起一个新程序、不需要在中间写代码布置环境，直接用 posix_spawn 把配置当参数传进去一步启动，既避开了大进程 fork 的开销，也躲过了多线程 fork 死锁的暗坑。
    body: |-
      既然 fork + [[exec]] 的黄金空档这么好用，为什么标准库还专门造了个一步到位的 posix_spawn？因为分两步走有两笔隐性账。第一笔是体量账：假如父进程本身是个占了几 GB 内存的 Java 虚拟机或大型服务，fork 瞬间光是复制页表、把所有页改成写时复制标记就不便宜，甚至还可能被系统的内存保守超售检查误判为「内存不够翻倍」而直接拒绝创建。

      第二笔账更隐蔽，专门坑多线程程序：假设父进程里有 8 个线程，其中线程 2 正拿着内存分配器的全局锁；就在这一刻线程 1 调了 fork，按照规则，子进程里只剩下调 fork 的那一个线程活下来，线程 2 凭空消失了——那把锁却还留在内存里处于「已加锁」状态，永远不会有人去解！此时子进程如果在 exec 前不小心调了带锁的函数，当场就会永久死锁。

      posix_spawn 的解法很干脆：把「要改哪几个文件描述符、改哪个目录」做成一份配置清单作为参数传进去，让内部实现一步搞定创建和换装，不再给用户代码留任何中途执行的机会。当然，在老系统或极度抠资源的嵌入式环境里还会见到更激进的 [[vfork]]——它干脆连页表都不复制，直接让子进程借用父进程的内存直到 exec，风险太高，现代代码能用 posix_spawn 就别碰它。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: posix_spawn(3) 与 vfork(2)
        url: https://man7.org/linux/man-pages/man3/posix_spawn.3.html
        claim: posix_spawn 高效创建子进程执行新程序；vfork 共享地址空间直至 exec
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: parent
          id: sh
          label: 父进程
          highlight: true
        - lane: kernel
          id: k
          label: 内核
        - lane: child
          id: c
          label: 子进程
