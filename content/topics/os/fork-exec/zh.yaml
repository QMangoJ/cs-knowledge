        event: 0、1、2 号描述符照常可用
  - id: wait
    title: wait：父进程等孩子结束
    tldr: bash 调用 wait 暂停自己，直到 ls 运行完。
    body: |-
      如果 bash 不等，ls 的输出就会和下一个提示符混在一起。所以 bash 调用 wait 让自己睡下，子进程结束时内核再把它唤醒——像前端 await 一个 Promise：不占着 CPU 空转，结果来了再继续。在命令末尾加 &，就是不等它。

      wait 取回的不只是「结束了」：子进程的退出码（就是 shell 里 $? 的来源）也在这时交给父进程，命令成功还是失败、要不要继续下一步，全靠它判断。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: wait(2)
        url: https://man7.org/linux/man-pages/man2/wait.2.html
        claim: wait 让父进程等待子进程状态改变
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: parent
          id: sh
          label: bash（父进程）
          highlight: true
        - lane: kernel
          id: k
          label: 内核
        - lane: child
          id: c
          label: 子进程
      messages:
        - id: m-wait
          from: sh
          to: k
          label: wait：等它结束
          active: true
    log:
      - mode: bash 等待中
        event: 父进程睡眠，等待子进程
  - id: exit-reap
    title: exit 与回收：进程的结束
    tldr: 子进程退出后留下退出码，被父进程 wait 取走才算彻底消失。
    body: |-
      ls 退出时，内核释放它的大部分资源，只保留一条最小记录：退出状态，等父进程 wait 来取。取走之后，子进程才彻底消失。

      父进程一直不取，这条记录就一直占着——子进程成了「僵尸」（ps 里状态 Z）。僵尸不占内存、不占 CPU，只占一个 PID；但 PID 是有限的，海量僵尸耗尽 PID 后，新进程就创建不了。所以处理办法只有一个方向：让父进程去 wait；或者父进程退出，子进程被 PID 1 收养后由它回收。守护进程常用二次 fork，正是借这条规则让工作进程被 PID 1 收养、与终端彻底脱钩。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: wait(2) NOTES 部分
        url: https://man7.org/linux/man-pages/man2/wait.2.html
        claim: 未被等待的已终止子进程成为僵尸进程
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: parent
          id: sh
          label: bash（父进程）
          highlight: true
        - lane: kernel
          id: k
          label: 内核
        - lane: child
          id: c
          label: 子进程
      messages:
        - id: m-exit-reap
          from: c
          to: sh
          label: 退出码交给父进程
          active: true
    log:
      - mode: bash 继续运行
        event: 子进程被回收，显示下一个提示符
  - id: pipeline-walkthrough
    title: 完整走例：一条管道命令的创建全过程
    tldr: ls 管道到 wc，需要两次 fork、两边 dup2、四处 close，父进程最后 wait 两次。
    body: |-
      把管道命令完整走一遍，以 ls | wc -l 为例：bash 先用 pipe 造出一对描述符（读端 r、写端 w），再 fork 两次。子进程一用 dup2 把 w 复制到 1 号、关掉 r 与 w，exec 成 ls；子进程二用 dup2 把 r 复制到 0 号、关掉 r 与 w，exec 成 wc。父进程自己也关掉 r 与 w，最后 wait 两次，整条命令的退出状态取最后一个进程（wc）的。

      四处 close 缺一不可，关键在 EOF：只有所有持有写端的进程都关掉写端，读端的 read 才返回 0 表示结束；任一处漏关，wc 就永远等不到 EOF。另一个要点是并发：ls 与 wc 同时跑，管道只有 64KB 缓冲，ls 写满时自动阻塞、wc 读走后又被唤醒，生产与消费靠内核的阻塞与唤醒天然同步——数据再大也不先落盘，这正是管道与临时文件的根本差别。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: pipe(2)
        url: https://man7.org/linux/man-pages/man2/pipe.2.html
        claim: pipe 创建单向字节流通道，容量有限，写满时阻塞
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: parent
          id: sh
          label: bash（父进程）
        - lane: kernel
          id: k
          label: 内核（管道）
          highlight: true
        - lane: child
          id: c
          label: 子进程 ls 与 wc
      messages:
        - id: m-pipeline-walkthrough
          from: c
          to: k
          label: ls 写管道，wc 读管道
          active: true
    log:
      - mode: 两个子进程并发
        event: 数据在管道中边写边读
  - id: posix-spawn
    title: 不需要中间布置时：posix_spawn 与 vfork
    tldr: posix_spawn 一步创建并执行新程序，跳过中间窗口，更快也更安全；vfork 更极端，只适合受限场景。
    body: |-
      既然中间布置这么有用，为什么还要一步到位的 posix_spawn？因为 fork + exec 有两笔隐性账。第一笔是成本：fork 要复制页表、把父进程的页全标成写时复制，大进程（几 GB 的 JVM、浏览器）fork 的瞬间也不便宜，还可能被内存预留策略误判为内存不足而失败。第二笔是安全：多线程进程 fork 后，子进程里其他线程凭空消失、正握着的锁可能永远没人放，所以在 exec 之前只能调用极少数「异步信号安全」的函数，写错一步就死锁。

      posix_spawn 把布置改成声明式：要改的描述符、属性用参数列给实现，由它内部一步完成创建与执行，不给中间代码留执行机会，常见的「直接启动一个新程序」因此更快也更安全。要布置就 fork + exec，要直达就 posix_spawn；vfork 借用父进程地址空间、更极端，只剩老式与嵌入式场景在用。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: posix_spawn(3) 与 vfork(2)
        url: https://man7.org/linux/man-pages/man3/posix_spawn.3.html
        claim: posix_spawn 高效创建子进程执行新程序；vfork 共享地址空间直至 exec
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: parent
          id: sh
          label: 父进程
          highlight: true
        - lane: kernel
          id: k
          label: 内核
        - lane: child
          id: c
          label: 子进程
      messages:
        - id: m-posix-spawn
          from: sh
          to: c
          label: posix_spawn：一步到位
          active: true
    log:
      - mode: 子进程运行新程序
        event: 没有中间布置窗口
  - id: ipc
    title: 进程之间怎么说话：IPC 一览
    tldr: 进程内存互相隔离，合作靠内核提供的通道：管道、共享内存、消息队列、套接字。
    body: |-
      进程的内存互相隔离，fork 出来的亲缘进程要合作，只能靠内核提供的通道。最简单的是管道（pipe）：fork 前建好，写端写、读端读，字节流、单向、容量有限（Linux 默认 64KB），写满就阻塞——shell 的 a | b 就是它，上一节的 EOF 规则在这里同样成立：所有写端都关，读端才读到结束。

      其余通道按场景选：传结构化消息、要跨非亲缘进程，用消息队列或 Unix 域套接字（本机服务间通信多走它，如 Docker 与守护进程）；传大块数据追求速度，用共享内存——数据不经内核拷贝，但谁先写谁后读的同步要自己用锁或信号量解决，所以它总和同步原语成套出现；跨机器则只剩网络套接字。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: pipe(2)/shm_overview(7) 手册
        claim: 管道是单向字节流通道，共享内存需配合信号量等同步原语使用
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
    canvas:
      kind: swimlane
      actors:
        - lane: parent
          id: sh
          label: 父进程
        - lane: kernel
          id: k
          label: 内核（管道）
          highlight: true
        - lane: child
