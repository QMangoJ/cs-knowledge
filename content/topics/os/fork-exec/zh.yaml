id: os/fork-exec
subject: os
slug: fork-exec
order: 2
status: published
license: CC-BY-4.0
title: 进程的诞生：fork + [[exec]] + wait
summary: |-
  Linux 启动一个新程序不是「一步新建」，而是拆成先复制、再变身、最后等收尾三步：fork 先克隆出一个和父进程几乎一样的副本，[[exec]] 再把副本的代码和内存整体替换成目标程序，wait 则让父进程睡着等它结束并收回退出码。把「生孩子」和「换节目」拆成两步看似绕弯，却正好在中间多出一段能改输出重定向、接管道的黄金空档。全课顺着这三个动作拆解写时复制为什么让复制几乎白送、文件描述符怎么继承、僵尸进程是怎么攒出来的，最后再串成一条管道命令，并交代直接一步启动的替代方案。
premise: 这节课的场景再日常不过：你在 Linux 终端的 bash 提示符后敲下 ls 并按回车，一眨眼屏幕上就列出了当前目录的文件，接着 bash 又老老实实等在下一行。这一课要解的困惑就是：bash 本身是一个一直在跑的程序，它是怎样凭空变出 ls 这个新程序、把输出接进文件或管道、又在 ls 跑完后把自己接回来的？
position: 本课是操作系统「进程管理」板块的第一课，紧接上一课的系统调用入口继续往前走：程序已经知道怎么敲门找内核办事了，第一件大事就是请内核生出新进程。学完这里讲的复制与替换机制、写时复制省内存的原理，以及父进程回收退出的规矩，下一课就可以接着看：当电脑里一下子多出几十上百个进程，单个处理器核心到底怎么靠时钟中断让它们轮流上场。
bridge:
  prev: 上一课看清了程序怎样靠 syscall 指令敲开内核的大门，这一课直接穿过这扇门，看终端怎么用系统调用把一条指令变成独立运行的新进程。
  next: 子进程成功变身之后就会一直往下跑，可电脑上的程序动辄几百个，处理器核心却只有几个——下一课来看内核怎样靠时钟中断强制换人，让所有进程轮流上场。
overview:
  - key: 一句话总结
    value: 在 Linux 里创建并运行一个新程序，通常要走「复制自己（fork）→ 布置环境 → 替换程序（[[exec]]）→ 等待回收（wait）」这条链；把复制和替换拆开，正是 shell 重定向和管道能成立的原因。
  - key: 什么是进程
    value: 进程就是一个正在运行的程序，它包括代码、内存、打开的文件和当前的运行状态。同样一个程序开两个窗口，就是两个进程，各跑各的互不干扰。
  - key: 为什么分两步
    value: fork 和 exec 分成两步，中间这段时间可以先布置子进程，比如把它的输出重定向到文件。shell 的重定向和管道，都是在这个空档里安排好的。
  - key: 常见用法
    value: shell 运行命令、管道 a | b 都是这套动作；Node.js 里启动子进程跑外部命令的 child_process，底层走的也是同一套
  - key: 收尾
    value: 父进程如果不调用 wait 来收尾，子进程结束后会变成僵尸进程。它已经不干活了，只剩一条退出记录占着位置，等父进程来取走。
  - key: 进程状态
    value: 运行（R）：正在跑或排队等 CPU；睡眠（S/D）：睡下等事件或磁盘，D 连信号都叫不醒；停止（T）：被信号暂停（如调试时）；僵尸（Z）：已退出、只等父进程来收退出码
  - key: 进程 vs 线程
    value: Linux 上进程和线程都用 clone 创建，区别在于共享多少东西。线程共享同一片地址空间，进程则各有一份，clone 时的标志决定了到底共享哪些。
  - key: posix_spawn / [[vfork]]
    value: 如果不需要在中间布置子进程，可以用 [[posix_spawn]] 一步把创建和执行做完，开销更小。vfork 是更早的省法，只适合很受限的场景，现在一般优先用 posix_spawn。
