- id: fd-inherit
  title: 文件描述符的继承与 close-on-exec 例外
  tldr: exec 换掉代码与内存，却保留文件描述符表；标了 O_CLOEXEC 的描述符会在 exec 时被自动关掉。
  body: '为什么 exec 后文件还开着？因为文件描述符表是进程状态的一部分，exec 只换代码与内存映射，不动这张表。走例：bash 的 0、1、2 分别连着终端的输入、输出与错误输出，子进程 exec 成 ls 后原样继承，所以 ls 一出生就知道往哪读、往哪写。

    例外是标了 close-on-exec 的描述符（打开时带 O_CLOEXEC），exec 时会被自动关掉：服务器监听的套接字、库内部自用的文件都应该这么标，否则子进程会莫名其妙攥着父进程的端口与文件，出现端口明明在父进程手里、新程序却说地址被占用这类灵异故障。对比着记：内存是 exec 时全换的，描述符表是全留的（除 CLOEXEC），信号处置是部分重置的——exec 的继承规则不是一刀切，而是按新程序是否还认得这份状态逐类决定的。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: execve(2) 与 fcntl(2) 的 FD_CLOEXEC
    url: https://man7.org/linux/man-pages/man2/execve.2.html
    claim: exec 保留未设 close-on-exec 的文件描述符，设了的在 exec 时关闭
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
