level: 基础
minutes: 27
prereq:
- os/syscall
objectives:
- 区分 fork（复制进程）与 exec（换程序映像）
- 解释写时复制为什么让 fork 很便宜
- 说清僵尸进程与孤儿进程的成因
aiLink: 容器与推理服务的进程模型全建立在 fork/exec 之上：Python multiprocessing、vLLM 的多 worker、数据加载子进程都靠 fork 复用已加载的模型与解释器状态；理解写时复制，就理解为什么 fork 出 8 个 worker、只要写脏的页不多，就不会立刻吃掉 8 倍内存（只读页全共享）。
design:
- mechanism: fork 与 exec 拆成两个调用：中间留一段可任意布置的窗口，让重定向与管道靠组合已有系统调用免费得到，而不是靠大接口预先列全参数
  problem: 根本约束是布置新程序运行环境的需求组合无穷多：重定向、管道、改目录、改权限、关文件，任何一个大而全的创建接口都要预先列全参数，可新需求永远会冒出来，接口注定永远缺一项；同时复制进程与加载新程序又是两个正交的动作，本没有理由绑在一起。
  choice: 拆成 fork 与 exec 两个小调用，中间留一段任意代码可执行的窗口，布置需求由调用者用已有系统调用自由组合。替代方案如 Windows 式的一个 CreateProcess 大调用，要把重定向等常见布置写成结构体字段，遇到没预想到的布置就无能为力，还让简单场景也被迫填十几个参数。
  tradeoff: 换来极强的组合性，代价是每次启动要两次系统调用、子进程先背着父进程的整份状态再扔掉，看起来浪费；这笔账靠写时复制把复制成本压到接近零才成立。承担者是大进程的启动延迟与写代码的人的心智成本：三段式套路必须人人都会写。
  root: 根源是机制与策略分离：内核只提供复制进程与替换映像两块最小机制，把新程序该长什么样这份策略完全留给用户态组合。小机制的组合数随机制数指数增长，大接口的参数组合却只能线性添加，缺的那一项永远补不上——这是组合数学决定的，不是工程努力能弥补的。
- mechanism: 写时复制：fork 只复制页表并把双方页面标为只读共享，真正写入时才由缺页异常复制那一页，把复制成本推迟到真正分叉的那一刻
  problem: fork 的语义要求父子各有一份独立内存，可进程动辄占几 GB，创建瞬间全量复制在时间与空间上都不可接受；而实际上多数 fork 之后紧接着 exec，复制的数据立刻被扔掉，全量复制几乎是纯浪费，成本与真正需要的东西完全脱钩。
  choice: fork 时只复制页表，把双方页面都标为只读共享，真正写入时由缺页异常触发单页复制。替代方案如 fork 时全量复制，简单直接但大进程启动慢且内存翻倍；如完全共享永不复制，则父子互相污染，进程隔离荡然无存。写时复制是唯一让成本跟随实际分叉程度的方案。
  tradeoff: 换来 fork 成本只与页表大小相关，牺牲的是第一次写每页时要付一次缺页加复制的延迟，且引用计数式的运行时会频繁改对象头，不经意间把共享页逐页写脏；部署多进程服务时要按写脏量而不是进程数算内存账，这份隐蔽的账单由运维与容量规划承担。
  root: 根源是写少读多的经验规律加上硬件的页级保护：MMU 能以页为粒度拦截第一次写，异常机制让逻辑上已复制、物理上未复制成为可能，本质是把复制从急切求值改成懒求值，只为真正分叉的那部分付费——懒惰由硬件异常兜底才敢做。
- mechanism: 僵尸进程与 wait 回收协议：内核替已退出的子进程暂存一份最小的退出状态记录，等父进程来取，谁创建谁回收，PID 1 只做最后兜底
  problem: 子进程先于父进程结束时，它的退出码是父进程可能需要的信息，不能随进程一起销毁；可进程本身已经死了，资源必须释放。退出码这份遗言由谁保管、保管多久，还受到 PID 不能被无限占用这一资源约束：记录留得越久，能创建的新进程就越少。
  choice: 内核保留一条最小记录（僵尸状态）只存退出状态，等父进程 wait 取走后才彻底删除，父进程先死则由 PID 1 代为回收。替代方案如子进程结束立刻彻底消失，父进程就永远读不到退出码，shell 的退出状态判断与条件执行全都无从谈起，异步协作会缺一块地基。
  tradeoff: 换来可靠的状态传递协议，代价是父进程若长期不 wait 就会积压僵尸占住 PID，责任被明确压在父进程身上——这是有意的：谁创建谁回收，内核只做最后兜底，避免内核替应用的疏忽无限买单，疏忽的成本必须回到疏忽者账上。
  root: 根源是异步并发下信息不能先于其消费者销毁：生产者（退出的子进程）与消费者（wait 的父进程）之间没有时间上的会合点，只能由第三方（内核）暂存这份信息，本质与消息队列、期货的暂存逻辑同构——凡是没有会合点的交接，都需要一个可信的暂存者。
quiz:
- q: fork 之后父子进程的区别首先体现在？
  options:
  - 代码完全不同
  - fork 在子进程返回 0、父进程返回子进程 PID
  - 内存立刻完全独立复制
  - 子进程没有 PID
  answer: 1
  explain: 靠返回值分流是 fork 编程的固定套路；内存靠写时复制按需分离。
- q: exec 成功后会发生什么？
  options:
  - 在原程序上叠加新代码
  - 当前进程映像被新程序替换，PID 不变，exec 之后的代码不再执行
  - 新建一个进程
  - 把父进程杀掉
  answer: 1
  explain: exec 是替换而非创建，所以 shell 是 fork 出子进程再在子进程里 exec。
- q: 僵尸进程是怎么产生的？
  options:
  - 子进程死循环
  - 子进程已退出但父进程还没 wait 读取退出状态
  - 父进程先退出
  - 信号被屏蔽
  answer: 1
  explain: 退出状态留在进程表里等父进程回收；父进程不管，条目就一直占着。
