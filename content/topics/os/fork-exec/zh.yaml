  - id: orphan-signal
    title: 孤儿兜底与信号机制：进程生死的最后两块拼图
    tldr: 父进程先死时，内核会把孤儿进程过继给 PID 1（或登记过的收养者）负责回收，不让僵尸失控；最后记住一套三问口诀，就能把进程诞生到退出的整条链路串起来。
    body: |-
      前面提到僵尸进程的克星是父进程调 wait，那如果父进程自己先挂了，留下的孩子难道就永远没人管了吗？不会：父进程一死，还活着的子进程就成了「孤儿」，内核会立刻把它的父亲改成 [[PID]] 1（现代系统如 systemd，或者容器里事先向内核登记过的专门收养进程 subreaper）。以后这个孩子跑完了，就由 PID 1 自动替它调 wait 收尸，保证整棵进程树永远有兜底。后台守护进程常故意 fork 两次再让中间那个父进程主动退出，就是借这条规则让真正干活的子进程被 PID 1 收养、彻底脱离原先的终端控制。

      除了等结束，进程之间还能靠发信号来打招呼：在终端按 Ctrl+C 就是给前台进程发 [[SIGINT]] 请求中断，敲 kill 命令默认发的是请它自行收拾退出的 [[SIGTERM]]，而孩子退出时内核会自动给父亲发 [[SIGCHLD]] 提醒「该收尸了」。注意别被 kill 的名字骗了：它只是「送信号」而不是「必杀技」，绝大多数信号进程都能写代码拦截处理甚至忽略，只有 [[SIGKILL]]（kill -9）和负责暂停的 [[SIGSTOP]] 铁面无私——内核直接接管处理，进程既拦不住也忽略不了，再死锁的程序也能一键停掉。

      收个尾，送你一套「三问口诀」带走整课——遇事看「生、等、收」：生的时候看用不用改环境（要重定向和接管道走 fork + exec，直起直落走 posix_spawn）；等的时候看父子怎么传数据、怎么防死锁（写端关干净才有 EOF，继承端口记得打 O_CLOEXEC）；收的时候看谁在负责 wait（查 $? 分清自退还是被杀，见了成堆 Z 状态优先查父进程为什么没回收）。
    derivation: original
    sources:
      - ref: ostep
        locator: Processes 一章
        claim: 父进程先走了，孩子由别的进程收养；进程之间还能用信号打招呼。
