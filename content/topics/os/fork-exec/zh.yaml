  - id: fd-inherit
    title: 文件描述符的继承：哪些会留给新程序，哪些该关掉
    tldr: 默认情况下所有已打开的文件都会跟着进程跨过 exec 变身，正因如此 ls 一出生就能读写终端；而只属于父进程私有的监听端口或内部文件，必须打上 [[O_CLOEXEC]] 标记让内核在变身瞬间自动关掉。
    body: |-
      前面刚用过这个特性：0 号标准输入、1 号标准输出、2 号标准错误输出都记在进程的文件描述符表里，exec 只替换内存映像、不动这张表，所以子进程变成 ls 后一抬手就能把目录打印到终端（或者打印到被掉包的 out.txt）。

      可如果父进程不是 bash，而是一个正在监听 8080 端口的 Web 服务器，情况就危险了。假设这个服务器半路 fork + exec 启动了一个小工具脚本，而 8080 端口对应的套接字描述符忘了做隔离——子进程就会默默继承并一直攥着这个端口！等哪天你想重启 Web 服务器时，新进程会突然报错「8080 端口已被占用」，查半天发现凶手竟是那个还在后台跑着的小脚本。

      堵住这个漏风口的办法，就是在打开文件或创建套接字时顺手加上 close-on-exec 标志（在 open 时传入 [[O_CLOEXEC]]）。贴上这张标签的描述符就像门禁卡上的「离场作废」章：在自己进程里照常使用，一旦调用 exec 换上新程序，内核就在变身那一刻自动替你把它关干净，既不泄漏给子进程，也省去了在 fork 和 exec 之间手动挨个关的麻烦。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: execve(2) 与 fcntl(2) 的 FD_CLOEXEC
        url: https://man7.org/linux/man-pages/man2/execve.2.html
        claim: exec 保留未设 close-on-exec 的文件描述符，设了的在 exec 时关闭
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
