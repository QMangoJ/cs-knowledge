    event: 标准输出已被指向 out.txt
- id: exec
  title: exec：换上新程序
  tldr: 子进程调用 execve，把自己整个换成 ls。
  body: 'exec 不创建新进程，而是把当前进程的代码和内存替换成另一个程序，从头运行。

    PID 和打开的文件保留下来（未设 close-on-exec 的那些），所以 bash 可以在 exec 之前先把输出重定向到文件。

    这就是拆成两步的好处：中间留出了“布置环境”的机会。


    execve（path, argv, envp）的内部走一遍：内核打开目标文件、按它的 ELF 头把代码段与数据段映射进全新的地址空间、建好新栈并把 argv 与 envp 压进去，然后从程序入口开始执行。继承与重置的边界要分清：PID、打开的文件（除标了 close-on-exec 的）、当前工作目录会保留；被捕获的信号处理函数被重置为默认，因为新程序里根本不存在旧处理函数的代码，被忽略的则保持忽略。这也解释了 setuid 程序为什么靠 exec 完成提权：换程序的那一刻，就是换权限的时刻。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: execve(2)
    url: https://man7.org/linux/man-pages/man2/execve.2.html
    claim: execve 用新程序替换当前进程映像，PID 与多数文件描述符保留
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
