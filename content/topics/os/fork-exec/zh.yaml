        event: 0、1、2 号描述符照常可用
  - id: wait
    title: wait：父进程睡下等结果，顺手收回退出码
    tldr: bash 调 wait 把自己挂起，让出 CPU 等 ls 跑完，顺带取回代表成败的退出码；如果是被外部信号杀死的，退出码还会变成 128 加上信号编号。
    body: |-
      子进程跑去执行 ls 的同一时间，原来的 bash 进程（父进程）没闲着，也没傻转圈占着 CPU——它立刻调用 wait（常用的是 waitpid）把自己睡下，等内核在子进程结束时再把自己叫醒。这就好比前端写 async/await 等一个异步请求：挂起期间不空耗算力，要是你在命令末尾加了个 & 让它后台跑，bash 就干脆不调 wait，直接切回提示符接你的下一条命令。

      等 ls 跑完，wait 顺便从内核拿回一个整数退出码，这正是你在终端敲 echo $? 看到的数字。走几个真实的退出数字：ls 正常列完目录调用 exit(0)，bash 拿到的退出码就是 0，脚本里看到 0 就知道成功了；要是你让 ls 去查一个根本不存在的目录，它自己报错并以退出码 2 结束，$? 就会显示 2；普通程序自己在代码里调用 exit(42)，父进程解出来的就是 42。

      万一子进程不是自己退的，而是运行到一半被人从外面发信号打断杀死的，shell 会把数字记成「128 + 信号编号」以示区别。比如被 15 号信号（SIGTERM）请退时 $? 是 143（128 + 15），被 9 号强杀（SIGKILL）时则是 137（128 + 9）——看一眼退出码，就能分清程序是自己报了错，还是半路被人从外面拧掉了电源。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: wait(2)
        url: https://man7.org/linux/man-pages/man2/wait.2.html
        claim: wait 让父进程等待子进程状态改变
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
