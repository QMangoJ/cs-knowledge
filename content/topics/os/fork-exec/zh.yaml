steps:
  - id: why-process
    title: 为什么需要“进程”
    tldr: 进程让每个程序以为自己独占机器，彼此互不干扰。
    body: |-
      电脑上同时跑着浏览器、编辑器、终端，它们各自需要内存、文件和 CPU 时间。操作系统把「一个正在运行的程序」包装成进程：独立的内存、独立的资源账本，用一个进程号（PID）标识。就像 Chrome 给标签页单独开进程：一个页面崩了，其他页面不受影响。

      账本在内核里是一个 task_struct：打开的文件、内存映射、信号处理方式、父子关系、资源用量都记在上面，PID 只是这本账的编号。全机进程按父子关系长成一棵以 PID 1 为根的树——谁创建了谁、谁负责收尾，靠这棵树说清。
    derivation: original
    sources:
      - ref: ostep
        locator: Processes 一章
        claim: 进程是操作系统对运行中程序的抽象
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: parent
          id: sh
          label: bash（父进程）
          highlight: true
        - lane: kernel
          id: k
          label: 内核
        - lane: child
          id: c
          label: 子进程
      messages: []
    log:
      - mode: bash 运行中
        event: 用户输入 ls，bash 需要启动一个新程序
    points:
      - 进程让每个程序以为自己独占机器，彼此互不干扰。
  - id: fork
    title: fork：复制出一个自己
    tldr: 内核把 bash 复制一份，得到一个几乎一样的子进程。
    body: |-
      bash 调用 fork（Linux 上底层是 clone 系统调用），内核复制出一个子进程。fork 返回两次：父进程拿到子进程的 PID，子进程拿到 0，靠这个返回值区分「我是谁」。

      复制听起来很贵，其实靠写时复制（COW）：fork 只复制页表，物理页先全部共享并标为只读，谁真要写哪一页，才复制哪一页。所以 fork 一个占 10 GB 的进程，瞬间只付出页表量级的成本（约 20 MB 量级），正文一页未动。Redis 的 RDB 持久化敢 fork 子进程存盘，靠的正是这一点。要算的账在后面：子进程写得越多，复制得越多——多进程部署的真实内存是「写脏量」而不是「进程数 × 进程大小」。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: fork(2)
        url: https://man7.org/linux/man-pages/man2/fork.2.html
        claim: fork 创建子进程，父子获得不同返回值，内存采用写时复制
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: parent
          id: sh
          label: bash（父进程）
        - lane: kernel
          id: k
          label: 内核
          highlight: true
        - lane: child
          id: c
          label: 子进程
      messages:
        - id: m-fork
          from: sh
          to: c
          label: fork：复制一份
          active: true
    log:
      - mode: 父子两个进程
        event: 内核复制出子进程
    code:
      lang: c
      code: |-
        pid_t pid = fork();
        if (pid == 0) { /* 子进程 */ execlp("ls", "ls", NULL); _exit(127); }
        /* 父进程 */ int st; waitpid(pid, &st, 0);
      note: fork + exec + wait 的最小骨架
  - id: between-fork-exec
    title: fork 与 exec 之间：布置子进程的舞台
    tldr: 子进程在变成新程序之前，还是父进程的代码，可以自由重定向、改目录、关文件。
    body: |-
      这一段窗口是 fork 与 exec 拆开后白赚的。走一遍 bash 执行 ls > out.txt：fork 之后子进程还跑着 bash 的代码，它先 open 打开 out.txt，再用 dup2 把这个描述符复制到 1 号（标准输出），然后才 exec 成 ls。ls 对此一无所知，照常往 1 号写，数据却进了文件。

      关键就在这里：重定向不需要 ls 提供任何参数，也不需要每个程序自己实现——布置用的全是普通系统调用，由 shell 在 exec 之前做一次，之后所有程序自动受益。同理，这个窗口里还能改工作目录、环境变量等其他进程状态。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: dup2(2)
        url: https://man7.org/linux/man-pages/man2/dup2.2.html
        claim: dup2 把文件描述符复制到指定编号，是重定向的实现机制
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: parent
          id: sh
          label: bash（父进程）
        - lane: kernel
          id: k
          label: 内核
        - lane: child
          id: c
          label: 子进程
          highlight: true
      messages:
        - id: m-between-fork-exec
          from: c
          to: k
          label: dup2 把输出改到文件
          active: true
    log:
      - mode: 子进程布置中
        event: 标准输出已被指向 out.txt
  - id: exec
    title: exec：换上新程序
    tldr: 子进程调用 execve，把自己整个换成 ls。
    body: |-
      exec 不创建新进程，而是把当前进程整个换掉：内核打开目标文件，按它的 ELF 格式把代码与数据映射进全新的地址空间，建好新栈、压入参数与环境变量，从程序入口重新开始执行。PID 不变。

      什么留、什么重置，按「新程序还认不认得这份状态」划分：打开的文件（除标了 close-on-exec 的）、工作目录保留——所以 exec 之前的重定向布置才有效；被捕获的信号处理函数重置为默认，因为新程序里根本不存在旧处理函数的代码，被忽略的信号则保持忽略。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: execve(2)
        url: https://man7.org/linux/man-pages/man2/execve.2.html
        claim: execve 用新程序替换当前进程映像，PID 与多数文件描述符保留
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: parent
          id: sh
          label: bash（父进程）
        - lane: kernel
          id: k
          label: 内核
        - lane: child
          id: c
          label: 子进程
          highlight: true
      messages:
        - id: m-exec
          from: c
          to: k
          label: execve：换成 ls
          active: true
    log:
      - mode: 子进程运行 ls
        event: 子进程变成了 ls
  - id: fd-inherit
    title: 文件描述符的继承与 close-on-exec 例外
    tldr: exec 换掉代码与内存，却保留文件描述符表；标了 O_CLOEXEC 的描述符会在 exec 时被自动关掉。
    body: |-
      为什么 exec 后文件还开着？文件描述符表是进程状态的一部分，exec 只换代码与内存映射，不动这张表。bash 的 0、1、2 分别连着终端的输入、输出、错误输出，子进程 exec 成 ls 后原样继承，所以 ls 一出生就知道往哪读、往哪写。

      例外是标了 close-on-exec 的描述符（打开时带 O_CLOEXEC），exec 时自动关掉。服务器的监听套接字、库内部自用的文件都该这么标：否则 exec 出去的子进程会莫名攥着父进程的端口与文件，出现「端口明明在父进程手里、新程序却报地址被占用」这类故障。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: execve(2) 与 fcntl(2) 的 FD_CLOEXEC
        url: https://man7.org/linux/man-pages/man2/execve.2.html
        claim: exec 保留未设 close-on-exec 的文件描述符，设了的在 exec 时关闭
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: parent
          id: sh
          label: bash（父进程）
        - lane: kernel
          id: k
          label: 内核
          highlight: true
        - lane: child
          id: c
          label: 子进程
      messages:
        - id: m-fd-inherit
          from: k
          to: c
          label: 描述符表保留，CLOEXEC 的关掉
          active: true
    log:
