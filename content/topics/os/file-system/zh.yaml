steps:
  - id: why
    title: 为什么需要文件系统：磁盘只认第几块，不认文件名
    tldr: 磁盘和 [[SSD]] 的硬件接口只有「读写第 N 个固定大小的块」，根本不懂文件或目录；文件系统就是架在裸块之上的管家，负责变出名字、能长大的字节流、速度和断电安全。
    body: |-
      把磁盘或 [[SSD]] 的盖子掀开看，它对外提供的原生接口极其原始，只有「读第 N 块」和「写第 N 块」（常见每块 4 KB），既不知道哪串字节叫 `/home/daniel/notes.md`，也不知道哪块归谁、哪些块还是空的。编辑器之所以能按路径直接读写、随手往 `notes.md` 末尾多添两行字，全靠操作系统在块设备上面架起来的这层「文件系统」。

      它还要同时扛下两笔现实账。第一笔是速度：内存读写一次只要大约 100 纳秒，现行 NVMe SSD 读一次要 35 到 55 微秒（慢上几百倍），老式机械硬盘更是到 10 毫秒量级（慢十万倍）。如果编辑器每敲一个字都直接碰磁盘，电脑根本没法用，所以读写中间必须横着一层内存页缓存。第二笔是可靠性：保存一次文件往往要同时改动好几个磁盘块，万一写到一半断电，绝不能留下前后矛盾的残局。

      说到底，文件系统就是跑在内核里、专门整理磁盘块的微型数据库：目录和 [[inode]] 充当索引表，页缓存负责提速，预写日志负责断电兜底。
    derivation: original
    sources:
