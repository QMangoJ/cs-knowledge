- id: inode
  title: inode：元数据与数据块指针
  tldr: inode 存大小、权限、时间戳与数据块的位置，唯独不存文件名。
  body: '每个文件（包括目录、符号链接）有一个 inode：里面是元数据（类型、权限、所有者、大小、时间戳、链接计数）和数据块指针——小文件直接指向数据块，大文件用间接块（指针的指针）逐级放大可寻址范围。

    因为文件名不在 inode 里，同一 inode 可以被多个目录项指向，这就是硬链接：ln a b 之后 a、b 是同一个文件的两个名字，链接计数变 2；删掉一个名字只是计数减 1，计数归 0 才真正回收。符号链接（软链接）则是另一种文件，内容是目标路径字符串，删了目标它就会悬空。'
  derivation: original
  sources:
  - ref: ostep
    locator: File System Implementation 一章（inode 与多级索引）
    claim: inode 保存文件元数据与数据块指针（直接 + 间接），文件名只存在于目录项中
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
