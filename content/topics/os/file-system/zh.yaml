  - id: link-boundaries
    title: 硬链接与软链接的边界清单，再带走存储三问
    tldr: 硬链接是直指同一个 [[inode]] 的平权别名，绝不悬空但不能跨盘、不指目录；软链接是存着路径字符串的独立小文件，跨盘指目录都行，但原文件一删就断链、成环就报 [[ELOOP]]。
    body: |-
      最后把最容易混淆的两种链接边界一次列齐。`ln notes.md notes-bak.md` 建的是硬链接，本质是在目录表里给同一串 [[inode]] 编号再加一个名字。因为它是平权别名，所以有三条硬边界：第一，不能跨文件系统（inode 编号只在当前这一张分区里唯一，跨到另一块硬盘就对不上号）；第二，普通用户不能给目录建硬链接（否则目录树一绕成环，遍历备份和统计大小就会死循环）；第三，删掉原来的 `notes.md` 它绝不悬空，只要链接计数还没降到 0，通过 `notes-bak.md` 照样能把全篇笔记完整读出来。

      `ln -s /home/daniel/notes.md notes-link.md` 建的软链接（符号链接）则完全是另一个东西：它自己是个独立的小文件，有自己的 inode，里面只写着目标路径那串字符。正因它只认字符串路径，所以能轻松跨磁盘、跨分区，也能指向目录；代价是一旦把原文件删掉或挪走，这根指针立刻悬空成断链（打不开报找不到文件），要是两个软链接不小心互相指成闭环，内核顺着追了几十跳还没着落，就会直接拦下报错 [[ELOOP]]。顺手记住删除规矩：对软链接敲 `rm` 删掉的是快捷方式本身，绝对不会伤到原文件。

      学完这一整套「路径 → 目录 → inode → 页缓存 → 日志/fsync」，看任何本地或分布式存储系统都只用带走**三问自检清单**：**① 名字怎么落到编号**（目录线性扫还是哈希树、硬链接还是独立对象键）；**② 写返回到底承诺了哪一层**（只是进了内存页缓存，还是靠 fsync 真正刷穿磁盘）；**③ 半路断电靠什么恢复**（全盘扫描 fsck，还是日志 WAL / 写时拷贝）。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: link(2)、symlink(2) 与 symlink(7) 手册
        claim: 硬链接要求同一文件系统且通常不能指向目录，符号链接是保存目标路径的独立文件，解析环路会返回 ELOOP
