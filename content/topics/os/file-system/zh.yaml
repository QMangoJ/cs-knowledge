- id: pagecache
  title: 页缓存：读写为什么「看起来」很快
  tldr: 读命中缓存就不碰磁盘；写是先写进缓存就返回，脏页由内核稍后批量刷盘。
  body: '所有文件读写都经过页缓存（page cache）：读时先查缓存，命中直接复制给进程；未命中才读盘并把整页留缓存。写时 write() 把数据拷进缓存页、标脏就返回成功，内核的回写线程稍后把脏页批量刷到磁盘。

    这解释了很多现象：刚写完的文件立刻读很快；大批量小写被合并成少量顺序刷盘效率很高；free 命令里 buff/cache 占了很多内存不是浪费——那是随时可回收的缓存。'
  derivation: original
  sources:
  - ref: linux-kernel-docs
    locator: 内核文档：页缓存与回写（mm/page cache）
    claim: 文件读写经页缓存，脏页由回写机制异步刷到存储设备
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
