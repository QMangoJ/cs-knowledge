  title: 打开文件表：三层结构各管一段
  tldr: 进程 fd 表、系统级打开文件表、inode 表分工不同，文件偏移量到底存在哪一层决定了 dup 与 fork 的共享行为。
  body: 'open 成功后拿到的文件描述符（fd）只是第一层：每个进程有一张 fd 表，表项指向第二层。系统级只有一张打开文件表（open file table），每个表项（打开文件描述）存着当前文件偏移量、打开模式等“这一次打开”的状态，并指向第三层的 inode 表项（内存中的 inode，代表文件本身）。为什么要分三层？因为共享关系不一样：dup 复制 fd、或 fork 出子进程时，复制的是第一层指针，父子与两个 fd 共享同一个打开文件描述，于是共享偏移量——父进程读了 100 字节，子进程接着读会从 101 开始。反过来，同一个文件被独立 open 两次，会得到两个打开文件描述，偏移量各走各的。很多“我明明写进去了、读出来却是旧位置”的诡异 bug，根子就在没分清偏移量属于“打开”而不是属于“文件”或“fd 本身”。关闭 fd 也只是摘掉第一层引用，引用都清零后第二层表项才回收，inode 则要等链接计数与打开计数都归零才真正释放空间。'
  derivation: original
  sources:
  - ref: ostep
    locator: Files and Directories 一章（文件描述符与打开文件）
    claim: 文件描述符经打开文件状态关联到 inode，偏移量属于打开状态
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
