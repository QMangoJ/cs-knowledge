- id: fsck-vs-journal
  title: 崩溃一致性两条路线：事后全盘修 vs 事前留日志
  tldr: fsck 崩溃后把整盘扫一遍找矛盾，慢且只能修结构；日志只重放最近事务，快且语义完整。
  body: '日志出现之前，崩溃一致性靠的是 fsck 这类事后检查工具：重启时把整个文件系统的元数据扫一遍，核对 inode、位图、目录与链接计数之间是否自洽，发现矛盾就按规则修补（比如把找不到归属的数据块标回已用、把断裂的目录项清掉）。它的问题很实际：一是慢，扫描时间随磁盘容量增长，大盘修复可能要很久，服务就停摆多久；二是只能修“结构自洽”，修不回“业务上到底写到哪一步”——它不知道刚才那次更新本应包含哪几步。日志路线把功夫下在事前：每次更新先把完整事务写进日志并提交，崩溃后只需扫描一小段日志区、重放已提交事务，恢复时间与最近写入量相关而与盘的总容量无关，且能保证每次更新整体生效或整体不生效。如今主流文件系统都用日志做日常恢复，fsck 退居二线，只在日志也救不回的严重损坏时才上场做全盘抢救。还要强调日志的保证范围：它保的是文件系统结构与已提交事务的一致性，不保“应用写了但还没 fsync 的数据一定不丢”——页缓存里那段没落盘的路程，仍然要应用自己用 fsync 来收口，两个机制管的是两层不同的契约。'
  derivation: original
  sources:
  - ref: ostep
    locator: Crash Consistency / Journaling 与 FSCK 章节
    claim: fsck 通过全盘扫描修复不一致，日志文件系统则通过重放已提交事务快速恢复
