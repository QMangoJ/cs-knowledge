steps:
- id: why
  title: 为什么需要文件系统
  tldr: 磁盘只认扇区号，程序要的是「按名字找到一串可增长的字节」——中间这层就是文件系统。
  body: '磁盘/SSD 的原生接口是「读写第 N 个块」，没有名字、没有大小增长、没有权限，也不知道哪些块是空的。文件系统在这层之上提供文件（有名字、可增长的字节序列）、目录（名字的组织）与元数据（大小、权限、时间戳），还要自己记账：哪些块已分配、哪些空闲、每个文件占了哪些块。

    还要解决两个现实问题。速度：磁盘比内存慢几个数量级，每次读写都真碰盘会慢得没法用，靠页缓存把热点数据留在内存里顶着。可靠性：一次逻辑更新往往要改好几个块，写一半断电不能让文件系统结构自相矛盾，靠日志保证事务要么全成、要么全不成。

    可以说文件系统就是块设备之上的一个专用数据库：它管理的“表”是目录与 inode，它要的同样是索引、缓存与崩溃恢复这三件套，后面几步正是逐件拆开看。还有个常被忽略的职责是并发与权限的仲裁：多个进程同时写同一个文件时，文件系统至少要保证自己的元数据结构不被并发更新弄坏，至于应用数据层面的冲突，则要靠锁与上层协议另行解决，这条边界后面讲打开文件表时还会再碰到。'
  derivation: original
