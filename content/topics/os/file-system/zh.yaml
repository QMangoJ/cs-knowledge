    log:
      - mode: 抽象
        event: 程序说「打开 notes.md」，磁盘只听得懂块号
  - id: path
    title: 路径解析：顺着目录把 /home/daniel/notes.md 翻译成编号
    tldr: 打开 /home/daniel/notes.md 时，内核不是拿整串路径去盘里搜，而是从根目录出发逐级查「名字 → [[inode]] 号」的对照表，一路换出目标文件的真正编号。
    body: |-
      你在编辑器里触发 `open("/home/daniel/notes.md")` 时，内核从已知固定编号的根目录出发：先翻开根目录的数据块，在列表里找到 `home` 对应的 [[inode]] 号；读出 `home` 目录后，再在里面查 `daniel` 对应的 inode 号；最后读出 `daniel` 目录，终于查到 `notes.md` 对应的 inode 号。每一级目录都会现场验一次权限——哪怕 `notes.md` 本身权限全开，只要中间的 `daniel` 目录没给你执行（进入目录搜索）权限，这次打开照样当场失败。

      等一下，目录听着像文件夹，在硬盘上到底长什么样？目录其实也是一种文件，只不过普通文件里存的是你写的笔记，目录文件里存的是一张「文件名 → inode 号」的映射小表。如果打开的是相对路径 `notes.md`，规则完全一样，只是起点从根目录换成当前工作目录的 inode；要是路径中间拐进了一个软链接，内核就当场把字符串展开成新路径接着往下追。

      正因为路径解析每打开一次文件都要逐级翻查好几张表，为了不每次都去碰磁盘，Linux 会把刚翻译过的「名字对应哪个 inode 号」留在内存的目录项缓存（dentry cache）里。重复打开热文件几乎零开销；反过来，一旦路径层级极深、缓存又是冷的，程序刚启动时 `open` 的大半耗时就花在这趟逐级找人上。
    derivation: original
    sources:
      - ref: ostep
        locator: Files and Directories 一章
        claim: 目录把文件名映射到 inode 号，路径解析逐级查找目录项
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
