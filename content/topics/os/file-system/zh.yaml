title: 文件系统：名字、inode 与日志
summary: 文件不是一团字节：目录管名字，inode 管元数据，页缓存管速度，日志管崩溃后的一致性。
premise: 以在 Linux 上保存一个文件、然后断电重启为例。
overview:
- key: 一句话总结
  value: 目录把名字映射到 inode 号，inode 指向数据块；写先走页缓存，落盘靠 fsync 与日志
- key: 文件名在哪
  value: 不在 inode 里——在目录项里；所以一个 inode 可以有多个名字（硬链接）
- key: 读写的加速
  value: 页缓存：读过的文件页留在内存，写也是先写进缓存再刷盘
- key: 崩溃一致性
  value: 日志（journaling）：先把要改什么写进日志区并提交，再改正式位置
- key: 持久化契约
  value: write() 成功 ≠ 已落盘；fsync 才是「写进稳定存储」的承诺点
- key: 常见文件系统
  value: ext4、XFS、APFS、NTFS，思想相通（inode/日志/写时拷贝各有取舍）
