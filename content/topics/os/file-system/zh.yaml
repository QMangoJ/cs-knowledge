  - id: inode
    title: "[[inode]] 内部：元数据、多级块指针与「不存文件名」"
    tldr: 拿到编号后翻开这个 [[inode]]，里面记着大小、权限、时间戳和数据块指针，唯独不写文件名——正因名字和本体分开，同一个文件才能同时挂出多个硬链接。
    body: |-
      每个文件在磁盘上都对应唯一一个 [[inode]]（索引节点），里面整齐记着两类东西：一是文件的元数据（类型、读写权限、所有者、文件大小、时间戳、有多少个名字指向它的链接计数），二是数据块指针，指明 `notes.md` 的内容究竟散落在磁盘哪几个块上。小文件只用 inode 里自带的直接指针就能指完；大文件放不下，就让间接指针指向专门的「指针块」，用指针套指针把可寻址范围滚雪球般放大。

      拿教材经典的多级索引走一遍具体数字：假设每块 4 KB、每个块号占 4 字节，那么一个块刚好能塞进 4096 ÷ 4 = 1024 个块号。如果 inode 里自带 12 个直接指针，一步到位就能覆盖 12 × 4 KB = 48 KB（大部分小笔记和配置文件到这就齐了）；加上 1 个一级间接指针，再管 1024 × 4 KB = 4 MB；加上二级间接，就能管 1024 × 1024 × 4 KB = 4 GB；三级间接直接冲到 4 TB 量级。代价也很明白：读文件开头一步直达，读到深处就要多绕一两层盘才能找到块号。所以现代 [[ext4]] 改用区段（extent，直接记「从第 X 块起连续占了 Y 块」），用极少的元数据就能罩住超大连续文件。

      等一下，为什么设计文件系统的人死活不肯把 `notes.md` 这个文件名也塞进 inode 里？因为名字和本体拆开后，一个文件就能同时拥有多个平等的名字——运行 `ln /home/daniel/notes.md /home/daniel/notes-bak.md` 创建硬链接，只是在目录表里多加一行指向同一个 inode 号，并把 inode 里的链接计数加到 2（用 `stat` 命令能亲眼看到两个文件共享同一串 inode 号）。删掉其中一个名字，只是把链接计数减 1，只有计数归零且没人打开它时，磁盘块才会真正回收。
    derivation: original
    sources:
      - ref: ostep
        locator: File System Implementation 一章（inode 与多级索引）
