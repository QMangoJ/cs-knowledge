- id: fsync
  title: fsync：write 成功 ≠ 数据安全
  tldr: 要保证断电不丢，必须在关键点 fsync 文件；新建/改名还要 fsync 所在目录。
  body: '既然写只是进了页缓存，write() 返回后断电，数据可能全没。数据库、钱包类应用的契约是：关键记录写完后调 fsync(fd)（或开 O_DSYNC），它把脏页与必要元数据真正刷到稳定存储才返回——慢，但这是持久化的唯一承诺点。

    还有一个常被漏的细节：新建文件或 rename 之后，要对所在目录也 fsync 一次，目录项本身才算落盘。只 fsync 文件就关机，重启后可能连文件名都找不到。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: fsync(2) 手册
    claim: fsync 将文件脏数据与元数据刷到稳定存储；write 返回不提供持久性保证
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
