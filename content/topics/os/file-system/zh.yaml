  - id: open-tables
    title: 打开文件表：进程、系统、[[inode]] 三层各记各的账
    tldr: 进程拿到的数字句柄 fd 并不直连磁盘 [[inode]]，中间隔着一层系统级「打开文件描述」来存当前读写位置——这才决定了 fork 和 dup 共享进度，而两次独立 open 各走各的。
    body: |-
      进程打开 `notes.md` 拿回一个整数文件描述符 `fd`（比如 `fd = 3`），很多人以为这个数字直接连着文件的 [[inode]]，其实中间隔了三层表。第一层是每个进程自己私有的 `fd` 表；它指向第二层，全系统共用的「打开文件表」里的一条记录，上面记着「这一次打开」的专属状态——打开模式（只读还是追加）和当前读写偏移量（游标停在第几字节）；第二层再指向第三层，内存中代表文件本身的 inode 对象。

      等一下，为什么非要多此一举在中间插一层「打开文件表」，直接把当前读写偏移量放在 `fd` 里或 `inode` 里不行吗？试想两个场景就明白了：如果两个不相关的进程各自独立 `open("/home/daniel/notes.md")`，它们显然不能共用同一个读写位置，否则 A 读到第 100 字节、B 突然从第 101 字节接着读就全乱套了——所以偏移量不能放在第三层 inode 上。反过来，如果父进程打开日志文件后 `fork` 出子进程，或者用 [[dup2]] 把输出重定向，父子手里有两个不同的 `fd`，却需要轮流往文件里顺着往下写而不互相踩踏——它们的两张 `fd` 表项恰好指着第二层同一条记录，天然共享同一个读写位置！

      理解三层引用也能顺手解释文件删除的经典现象：你用 `rm` 删掉了 `notes.md` 的目录项、把链接计数扣成 0，只要编辑器还没调 `close()` 把 `fd` 关掉，第三层内存 inode 的打开计数就还不为零，磁盘上的数据块就不会立刻抹掉——甚至还能照常往里面读写（这正是日志轮转删错文件时磁盘空间迟迟不释放的元凶）。
    derivation: original
    sources:
      - ref: ostep
        locator: Files and Directories 一章（文件描述符与打开文件）
        claim: 文件描述符经打开文件状态关联到 inode，偏移量属于打开状态
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
