- id: inode
  title: inode：元数据与数据块指针
  tldr: inode 存大小、权限、时间戳与数据块的位置，唯独不存文件名。
  body: '每个文件（包括目录、符号链接）有一个 inode：里面是元数据（类型、权限、所有者、大小、时间戳、链接计数）和数据块指针——小文件直接指向数据块，大文件用间接块（指针的指针）逐级放大可寻址范围。

    因为文件名不在 inode 里，同一 inode 可以被多个目录项指向，这就是硬链接：ln a b 之后 a、b 是同一个文件的两个名字，链接计数变 2；删掉一个名字只是计数减 1，计数归 0 才真正回收。符号链接（软链接）则是另一种文件，内容是目标路径字符串，删了目标它就会悬空。还有个数字感：块指针分级决定了单个文件的大小上限与访问成本——文件开头的数据靠直接指针一步到位，深处的数据要多绕一两层间接块才能找到块号，所以“小文件快、大文件略多一跳”不是实现偷懒，而是用指针层级换寻址范围的结果。实践中看 inode 最顺手的工具是 stat：它打印的大小、链接数、inode 号都是本步说的字段真身；两个文件名 stat 出同一个 inode 号，就是硬链接的实锤证据，比任何解释都直接。'
  derivation: original
  sources:
