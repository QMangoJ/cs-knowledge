steps:
- id: why
  title: 为什么需要文件系统
  tldr: 磁盘只认扇区号，程序要的是「按名字找到一串可增长的字节」——中间这层就是文件系统。
  body: '磁盘/SSD 的原生接口是「读写第 N 个块」，没有名字、没有大小增长、没有权限。文件系统在这层之上提供文件（有名字、可增长的字节序列）、目录（名字的组织）与元数据（大小、权限、时间戳）。

    还要解决两个现实问题：速度——磁盘比内存慢几个数量级，靠页缓存把热点数据留在内存；可靠性——写一半断电，不能让文件系统结构自相矛盾，靠日志。'
  derivation: original
  sources:
