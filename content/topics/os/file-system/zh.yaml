- id: pagecache
  title: 页缓存：读写为什么「看起来」很快
  tldr: 读命中缓存就不碰磁盘；写是先写进缓存就返回，脏页由内核稍后批量刷盘。
  body: '所有文件读写都经过页缓存（page cache）：读时先查缓存，命中直接复制给进程，连磁盘都不碰；未命中才读盘，并把读到的整页留在缓存里等下次。写时 write() 把数据拷进缓存页、标脏就返回成功，内核的回写线程稍后把脏页批量刷到磁盘，刷的时机与批量大小由回写策略控制，而不是由每次 write 决定。

    这解释了很多现象：刚写完的文件立刻读很快，因为读的就是刚写进缓存的那份；大批量小写被合并成少量顺序刷盘，效率远高于一次次真写盘；free 命令里 buff/cache 占了很多内存不是浪费，那是随时可回收的缓存，内存一紧张就先让它们。

    硬币的另一面是：进程眼里的“写成功”只是进了内存，离真正落盘还隔着回写这一段异步路程——这段路程正是下一课 fsync 要收紧的口子，也是“刚存的文件断电就没了”这类事故的源头。一个实用的观察法：同一文件第一次读明显慢、立刻再读飞快，差的就是第一遍读盘、第二遍命中缓存；压测时若不先清缓存或换冷数据，量到的往往是缓存速度而不是磁盘速度，这是文件类基准测试最常见的自欺。'
  derivation: original
  sources:
