  - id: engineering
    title: 工程映射：从本地文件系统到对象存储的取舍
    tldr: 吃透本地文件系统的「名字、[[inode]]、缓存、日志」后，上层存储系统的设计就不再神秘——数据库 [[WAL]]、模型 [[mmap]] 懒加载、甚至 [[S3]] 砍掉原地修改，全是从这四件套演化来的。
    body: |-
      把前面几步拆过的原语连成一张网，你会发现几乎所有存储工程都在反复用同一套积木。比如编辑器想做到「保存 `notes.md` 绝不坏一半」，靠的就是写临时文件 → `fsync` 文件 → `rename` 原子改名 → `fsync` 目录这四个动作拼成的迷你事务；数据库自己建的 [[WAL]]，就是把文件系统里 [[jbd2]] 的思想搬到应用层重写一遍；大模型推理启动时用 [[mmap]] 映射几十 GB 权重文件而不卡死，靠的就是页缓存和按页按需加载；容器镜像的分层叠加与写时拷贝，更是直接继承了 inode 引用计数和只读共享块指针的思路。

      到了多台机器组成的分布式时代，像 Amazon [[S3]] 这样的对象存储反其道而行之，干脆砍掉了「文件夹层级」和「原地改写文件中间几字节」这两项本地语义，只允许上传不可变的整块对象、靠独立的元数据表把键映射到对象。每砍掉一项本地文件系统习惯，都是为了甩掉跨机器维护路径锁和部分修改一致性的沉重包袱——懂了本地这四件套各自解决什么问题、付什么代价，再去看任何新存储系统，一眼就能看透它保留了什么、又故意放弃了什么。
    derivation: original
    sources:
      - ref: ostep
        locator: Distributed Systems / 文件系统相关章节
