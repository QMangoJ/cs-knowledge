- id: fsync
  title: fsync：write 成功 ≠ 数据安全
  tldr: 要保证断电不丢，必须在关键点 fsync 文件；新建/改名还要 fsync 所在目录。
  body: '既然写只是进了页缓存，write() 返回后断电，数据可能全没。数据库、钱包类应用的契约是：关键记录写完后调 fsync(fd)（或开 O_DSYNC），它把该文件的脏页与必要元数据真正刷到稳定存储才返回——慢，但这是持久化的唯一承诺点。慢到什么程度取决于存储设备：一块要等设备确认落盘的同步写，比走缓存的写贵几个数量级，所以数据库才要把多次提交攒成一批一起刷（组提交），而不是每条记录都单独付一次全价。

    还有一个常被漏的细节：新建文件或 rename 之后，要对所在目录也 fsync 一次，目录项本身才算落盘。只 fsync 文件就关机，重启后可能连文件名都找不到，文件内容再完整也等于不存在。

    顺带澄清一个误解：fsync 贵不等于平时能省就省。正确做法是先想清每类数据的丢失容忍度，只给真正丢不起的那批付这个价，而不是全省或全付两个极端。'
  derivation: original
