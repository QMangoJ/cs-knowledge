- id: engineering
  title: 工程视角：从文件系统到对象存储
  tldr: 本地文件系统的语义是很多系统设计的原点：日志思想变成数据库 WAL，页缓存思想变成各种缓存层。
  body: '把这几课串起来看：数据库的预写日志（WAL）就是文件系统日志思想在应用层的重演；mmap 加载模型权重靠的是页缓存 + 缺页；容器镜像的分层与写时拷贝，源头是 inode/链接与快照思想。很多应用层的“原子保存”套路——先写临时文件、fsync、再 rename 覆盖、再 fsync 目录——本质上是把文件系统提供的原语拼成一个迷你事务，不懂本课的语义就只能照抄还抄漏。

    到了分布式时代，对象存储（如 S3）放弃了「原地修改」与目录语义，换成不可变对象 + 元数据服务——正是为了绕开分布式下文件系统一致性的难题。理解本地文件系统的每个设计点，才看得懂这些取舍：每一个被放弃的语义，都是在为跨机器的一致性与扩展性让路。所以读新存储系统的文档时，不妨先问三个问题：它的名字到对象的映射放在哪、写成功到底承诺了哪一层持久性、崩溃或断电后靠什么恢复——能在本课框架里一一对上号，说明你已经抓住了它的设计骨架。'
  derivation: original
  sources:
  - ref: ostep
    locator: Distributed Systems / 文件系统相关章节
    claim: 分布式存储在一致性与语义上对本地文件系统作出不同取舍
