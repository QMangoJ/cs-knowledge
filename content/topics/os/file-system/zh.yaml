- id: dir-impl
  title: 目录实现：线性表为什么撑不住大目录
  tldr: 小目录线性扫描足够；文件数上万后查找变线性噩梦，哈希树让查找回到近似对数级。
  body: '目录的内容就是一串目录项，最直白的实现是线性表：查找一个名字就从头逐项比对，插入就追加，删除就留个空洞等复用。文件只有几个到几十个时这完全够用，实现也简单。但目录里文件数涨到成千上万后，每次 open 都要先在目录里线性扫一遍找名字，查找成本随文件数线性增长；更糟的是这类大目录很常见——日志目录、缓存目录、对象存储的本地落盘层都喜欢把海量小文件平铺在一个目录里。现代文件系统（如 ext4）对大目录改用哈希树：把文件名的哈希值组织成树形索引，查找先算哈希再定位到对应的叶子块，只在小范围内线性比对，成本回到与目录总大小近似对数相关的量级。代价是小目录也要维护索引结构、删除与改名要同步更新哈希树，所以实现上常是“小目录先用线性、长大后自动转哈希”的混合策略。自己做压测可以直观看到分界：文件数在几百以内时两种实现几乎没差别，上万以后线性目录的单次打开耗时会肉眼可见地往上爬，而哈希目录基本持平——目录组织方式是大文件量服务绕不开的一道坎。'
  derivation: original
