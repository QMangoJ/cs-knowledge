  - id: fsync
    title: "[[fsync]]：write 成功不保命，要落盘得叫这一声"
    tldr: 日志只保文件系统结构不烂，不保页缓存里没提交的字节不丢；真正要断电不丢数据，必须在 write 后补调 [[fsync]] 强迫刷盘，新建或改名后连所在目录也要 fsync。
    body: |-
      看清了页缓存和日志的分工，一个常见的误区就解开了：有人以为「我用了带日志的 ext4，只要 `write()` 返回成功，断电就不会丢刚写的内容」。其实只要数据还飘在内存页缓存里没进磁盘，日志系统压根还没接到这笔改动。想让 `notes.md` 里的关键改动（或者数据库里一笔刚扣款的记录）真正铁板钉钉落进闪存颗粒，代码里必须显式调用 `fsync(fd)`（或打开文件时带上 [[O_DSYNC]] 标记），逼着内核把脏页连同 inode 元数据一起写穿到持久化存储并拿到设备确认，才肯返回。

      还要注意一个老手都会漏的暗坑：当你新建 `notes.md`，或者遵循「先写临时文件 `notes.tmp`，再 `rename` 覆盖 `notes.md`」的原子保存套路时，哪怕你对文件句柄老老实实调了 `fsync(fd)`，如果忘了对所在的父目录 `/home/daniel` 也打开句柄调一次 `fsync(dirfd)`，断电重启后磁盘上可能找得到数据块，目录里却偏偏找不到 `notes.md` 这个文件名——因为目录本身也是文件，改名和新增的目录项同样飘在页缓存里。

      既然 [[fsync]] 是真正的落盘承诺点，代价也实打实摆在桌上：等一次设备落盘比写进页缓存慢几个数量级。所以像 MySQL 这类数据库绝不会每写一条小记录就傻傻单独刷一次盘，而是把并发来的十几笔提交攒到一块调一次 fsync（组提交），把那笔昂贵的刷盘延迟摊薄到大家头上。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: fsync(2) 手册
        claim: fsync 将文件脏数据与元数据刷到稳定存储；write 返回不提供持久性保证
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
