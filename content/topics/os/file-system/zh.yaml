level: 进阶
minutes: 34
prereq:
- os/page-fault
objectives:
- 说清目录、inode、硬链接/软链接的分工
- 解释 write 成功不等于落盘，以及 fsync 的完整用法
- 复述日志文件系统的崩溃恢复过程
aiLink: AI 系统天天和文件系统打交道：数据集与 checkpoint 的落盘契约（fsync/原子改名）、mmap 懒加载权重、对象存储与本地缓存的分工，全是这一课语义的延伸。训练任务「checkpoint 写一半断电」会不会坏，就取决于你是否懂日志与 fsync。
design:
- mechanism: 为什么日志先行（预写日志 WAL），而不是直接改正式位置再补救
  problem: 根本约束是一次逻辑更新要同时改数据块、inode 与空闲位图等多个磁盘位置，而磁盘写入不是原子的，断电可能发生在任意两步之间，直接改会留下无法自洽的中间状态。
  choice: 选择先把完整事务写进日志区并确认提交，再慢慢写回正式位置。替代方案直接改加事后 fsck 的失败模式是：恢复要全盘扫描且只能修结构自洽，修不回这次更新到底完成了几步，业务语义已经丢了。
  tradeoff: 代价是每次更新要写两遍（日志一遍、正式位置一遍）并占用一段日志空间，承担者是写密集型负载的吞吐；换来的是恢复时间只与最近事务量有关，且每次更新全生效或全不生效。
  root: 底层原理是先行记录意图：只要“打算做什么”被原子地持久化下来，后面的执行就可以被安全地重做或放弃，事务的原子性由此从多点写入问题降维成单点提交问题。
- mechanism: inode 为什么不存文件名，名字只放在目录项里
  problem: 根本约束是一个文件天然需要多个名字：改名不应搬动数据，硬链接要求多个目录项指向同一文件，若每个名字都持有一份元数据副本，多份副本之间的一致性根本无法维护。
  choice: 选择元数据只存一份在 inode 中、目录项只存名字到 inode 号的映射。替代方案把文件名放进 inode 的失败模式是：硬链接无从实现，改名要回头改文件本体，同一文件在不同目录下改了元数据还会互相打架。
  tradeoff: 代价是仅拿到 inode 无法反查它有哪些名字，删除文件时还要靠链接计数间接判断何时能回收，承担者是需要按文件反查路径的工具（如备份与审计程序），只能全盘扫目录来重建映射。
  root: 底层原理是身份与命名的分离：inode 号是文件在文件系统内的稳定身份，路径只是某一时刻指向这个身份的可变标签，身份一份、标签多份是这类指代系统的通用解法。
quiz:
- q: 文件名存在哪里？
  options:
  - inode 里
  - 目录项里（名字 → inode 号）
  - 数据块里
  - 页缓存里
  answer: 1
  explain: inode 只存元数据与块指针；名字到 inode 号的映射在目录中，所以同一 inode 可以有多个名字（硬链接）。
- q: write() 返回成功后立刻断电，数据一定还在吗？
  options:
  - 一定在，write 是同步落盘的
  - 不一定：可能只进了页缓存；要保证持久化需 fsync
  - 一定不在
  - 取决于文件名长度
  answer: 1
  explain: 写路径只保证数据进了页缓存；fsync（以及对目录的 fsync）才是持久化承诺点。
- q: 日志文件系统崩溃后如何恢复一致性？
  options:
  - 把所有文件重新下载一遍
  - 扫描日志：重放已提交事务，未提交的丢弃
  - 忽略日志直接挂载
  - 把脏页全部写回原处
  answer: 1
  explain: 预写日志保证每个事务全生效或全不生效；重启时重放已提交事务即可恢复到一致状态。
