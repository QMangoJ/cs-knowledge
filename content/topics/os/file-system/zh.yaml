  - id: fsck-vs-journal
    title: 崩溃修复两条路：事后全盘体检 [[fsck]] vs 事前记账
    tldr: 没有日志时，断电重启只能靠 [[fsck]] 把整张磁盘扫一遍找矛盾，盘越大停机越久；有了预写日志后，重启只需重放一小段日志区，几秒恢复且耗时跟盘容量无关。
    body: |-
      日志机制出现之前，操作系统对付断电烂账只有一招：重启时拉起 [[fsck]]（文件系统检查工具）做全盘大扫除。它像审计员一样把磁盘上每一张位图、每一个 [[inode]] 和每一级目录从头翻到底，发现「某个 inode 说自己占了第 88 块、位图却写着 88 号空闲」这种结构矛盾时，就按规则硬补一致——比如把第 88 块标回已用，或者把找不到归属的孤儿数据块丢进 `lost+found`。硬伤非常致命：磁盘容量越涨越大，从几百 MB 涨到几十 TB，全盘扫一遍动辄几十分钟甚至几小时，业务只能干停在原地等；更要命的是 `fsck` 只管「结构不矛盾」，早就丢了「当时保存 `notes.md` 原本打算干哪几步」的意图。

      换上日志路线后，崩溃修复的时间公式彻底变了：重启不需要看全盘 10 TB 数据，只盯住几百 MB 的日志区末尾那一小撮还没刷完的记录，把已经写了提交标记的事务重放一遍即可，耗时跟磁盘总容量彻底脱钩，几秒内就能挂载上线。`fsck` 并没有消失，只是退居二线当急救箱：只有硬件故障或极端情况把日志区自己都写坏了，才需要它出马做全盘抢救。不过还是那句边界提醒：日志救回的是磁盘结构与已进入日志的元数据，没调 [[fsync]] 还在内存页缓存里的用户字节，日志照样救不回。
    derivation: original
    sources:
      - ref: ostep
        locator: Crash Consistency / Journaling 与 FSCK 章节
        claim: fsck 通过全盘扫描修复不一致，日志文件系统则通过重放已提交事务快速恢复
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
