title: 文件系统：名字、[[inode]] 与日志
summary: 磁盘本身只认识第几号数据块，根本不懂什么是文件；Linux 文件系统靠三样东西把它变成能按名保存的文档：目录只记「名字对应哪个编号」，[[inode]] 存文件属性和块位置，页缓存扛起读写加速。因为刚写完的内容先留在内存页缓存里，真正保住磁盘结构不坏靠预写日志（[[WAL]]），保住这批新数据断电不丢则要靠 [[fsync]] 强行刷盘。全课顺着保存 notes.md 的这一趟路径，依次拆开目录查找、[[inode]] 索引、页缓存与日志恢复，最后补齐目录内部组织、打开文件表与软硬链接的常见边界坑。
premise: 你在编辑器里改完 /home/daniel/notes.md 点下保存，程序一眨眼就提示「已保存」，可文件里的字节到底被塞进了磁盘的哪几个扇区？更揪心的是，万一保存写到一半电源突然断了，重启之后 notes.md 究竟是完好无损、干脆消失，还是只剩半截乱码？
position: 本课在操作系统板块里独自承担「文件系统」这一段，接在「并发与同步」之后：前面几课讲的全是数据在内存里怎么分配、怎么加锁，可一旦断电内存就会清零，数据必须交给持久存储接手。本课把文件名怎样落到磁盘块、断电怎么靠日志恢复一致性讲透后，最后一课「I/O 与设备」就会接着解决程序在读写磁盘与网络这类慢设备时怎样不傻等。
bridge:
  prev: 上一课靠锁护住了内存里正在被争抢的变量，可一旦断电内存照样清零；要把这份数据写成 /home/daniel/notes.md 长期留存，目录项与 inode 怎么接手接下来的保管？
  next: 文件就算进了磁盘，每次真正读写仍要跟磁盘或网络这类慢设备打交道；下一课来看当上万条连接一起等数据时，服务器为什么不能让每个连接占着一个线程干等。
overview:
  - key: 一句话总结
    value: 目录把文件名翻译成 [[inode]] 编号，inode 再指向真正装数据的磁盘块；读写平时都在内存页缓存里加速，断电防结构损毁靠日志，防刚写的数据丢失靠 [[fsync]]。
  - key: 名字和本体分离
    value: 文件名根本不在 inode 里，而是记在目录项里，所以同一个 inode 可以挂好几个名字（硬链接），删掉一个名字只要计数没归零，数据还在。
  - key: 为什么写得飞快
    value: 所有读写先过内存里的页缓存：读过留在内存下次直接拿，写进缓存标脏就返回成功，内核稍后才批量往磁盘刷。
  - key: 断电不坏的秘密
    value: "[[ext4]] 这类日志文件系统先把「打算改哪些块」记进日志区并提交，再改正式位置；半路断电，重启把已提交日志重放一遍就能恢复一致。"
  - key: 落盘的唯一承诺
    value: write() 返回成功只代表字节进了内存缓存；关键数据必须调 [[fsync]]（新建或改名还要顺带 fsync 目录），返回才算真正落盘。
  - key: 常见文件系统
    value: "[[ext4]]、XFS 等靠预写日志先记账再改原位；APFS 等靠写时拷贝把新数据写到空块再切换指针，从不覆写旧数据，各有性能与碎片取舍。"
