  - id: dir-impl
    title: 目录内部怎么存：文件上万后线性表就垮了
    tldr: 小目录用一张清单从头扫到尾就够快；一旦同一个目录下塞进上万个文件，每次打开都线性翻全表会把服务拖垮，[[ext4]] 会自动把它升级成按名字算哈希的树形索引。
    body: |-
      回到查 `/home/daniel/notes.md` 的动作：如果 `/home/daniel` 里一共只放了二十几个文件，目录文件内部最省事的摆法就是一张线性清单——找 `notes.md` 就从第一项挨个比对名字，新建就往末尾追加，删掉就留个空位。几十项以内一次内存比对几微秒不到，结构简单到极致。

      但线上服务最容易踩到一个坑：把几十万张用户上传图或日志切片全平铺塞进同一个目录里。到了几万、几十万个文件，线性清单的查找成本随文件数直线攀升，每次 `open` 都要翻半天目录块，删改也要挪动或搜遍全表。现代文件系统（如 [[ext4]]）的对策是「小的时候偷懒、长大了自动换装」：文件数少时继续用紧凑的线性列表，一旦目录撑过门槛，就自动在目录内部建起一棵按文件名算哈希的索引树（HTree）。查找时先算一次文件名的哈希值，直接跳到对应的那一个叶子块里做小范围比对，无论目录下躺着五百个还是五十万个文件，开门耗时几乎保持平坦。
    derivation: original
    sources:
      - ref: ostep
        locator: File System Implementation 一章（目录组织）
        claim: 目录可以用线性列表组织，查找需要在目录项中搜索目标名字
        status: verified
