- id: path
  title: 路径解析：名字 → inode 号
  tldr: 逐级查目录：每个目录就是一张「名字 → inode 号」的表，解析完拿到目标的 inode。
  body: '打开 /home/daniel/notes.md 时，内核从根目录开始逐级查：根目录里查 home 得到它的 inode，读进来再查 daniel，再查 notes.md，最后拿到目标文件的 inode 号。每查一级都要验一次权限：对路径上每个目录没有执行（搜索）权限，解析当场失败——这就是有时文件本身权限没问题、却仍然打不开的原因，卡点在中间某级目录上。

    目录本身也是文件，只是内容是目录项（名字 + inode 号）。相对路径只是起点不同（从当前工作目录对应的 inode 开始），解析规则完全一样；路径里的符号链接会在解析途中被展开成目标路径继续走，这也是软链接能“透明跳转”的原因。

    路径解析的结果会被缓存（dentry 缓存），所以重复打开同一路径很快；反过来说，解析是一条热路径，深层路径加冷缓存时，一次 open 的开销主要就花在这趟逐级查找上。'
  derivation: original
