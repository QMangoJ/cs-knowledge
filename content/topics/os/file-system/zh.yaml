level: 进阶
minutes: 28
prereq:
  - os/page-fault
objectives:
  - 说清目录、inode、硬链接/软链接的分工
  - 解释 write 成功不等于落盘，以及 fsync 的完整用法
  - 复述日志文件系统的崩溃恢复过程
aiLink: AI 系统天天和文件系统打交道：数据集与 checkpoint 的落盘契约（fsync/原子改名）、mmap 懒加载权重、对象存储与本地缓存的分工，全是这一课语义的延伸。训练任务「checkpoint 写一半断电」会不会坏，就取决于你是否懂日志与 fsync。
design:
  - mechanism: 为什么先记预写日志（[[WAL]]），而不是直接覆写正式位置、坏了再跑 [[fsck]]
    problem: 保存一次文件往往要同时改动数据块、inode 和空闲位图好几个位置，但磁盘不保证这几笔写入一起生效；如果直接覆写正式位置，半路断电就会留下一半改完、一半没改的残破结构。
    choice: 先把这次修改要动的所有内容记进专门的日志区并打上提交标记，确认日志落稳后再慢慢刷回正式位置。直接覆写配合事后 fsck 扫全盘虽然平时省了一遍写，但盘越大停机修复越久，而且只能把结构修成不矛盾，找不回这笔操作原来的意图。
    tradeoff: 每笔修改等于写两遍（先写日志、再写正式位置），还要划出一块专门的日志空间，写极密集的服务吞吐会受影响；换来的是断电重启只需几秒扫日志区就能恢复一致。
    root: 把「多点同时成功」降维成「单点提交」：只要「我打算做什么」已经完整安全地写进日志，之后不管断电几次，重放或丢弃都能回到干净状态。
  - mechanism: 为什么 [[inode]] 里不放文件名，名字只记在目录里
    problem: 一个文件在现实里常要改名、移动目录，甚至需要多个路径入口同时指向同一份数据（硬链接）；要是把文件名塞进文件自己的元数据里，每多一个别名就要多复制一份元数据，改权限或改大小时两边立刻打架。
    choice: 把文件的稳定身份和属性（权限、大小、块指针）收在唯一的 inode 里，目录只存「名字 → inode 号」这张轻便的映射表。如果把文件名塞进 inode，改名或移目录都要回头动文件本体，硬链接多名字共享同一份数据更是没法实现。
    tradeoff: 只拿着一个 inode 号没法一步反查出它挂在哪个路径下，删除文件也必须等链接计数和进程打开计数全归零才能回收；查反路径的工具（如备份或审计）只能遍历目录树去重建对应关系。
    root: 身份与标签分离：inode 号是文件在系统里唯一的身份证，文件名只是贴在门口的门牌——门牌可以挂好几块、随时换，身份证自始至终只有一张。
quiz:
  - q: 文件名存在哪里？
    options:
      - inode 里
      - 目录项里（名字 → inode 号）
      - 数据块里
      - 页缓存里
    answer: 1
    explain: inode 只存元数据与块指针；名字到 inode 号的映射在目录中，所以同一 inode 可以有多个名字（硬链接）。
  - q: write() 返回成功后立刻断电，数据一定还在吗？
    options:
      - 一定在，write 是同步落盘的
      - 不一定：可能只进了页缓存；要保证持久化需 fsync
      - 一定不在
      - 取决于文件名长度
    answer: 1
    explain: 写路径只保证数据进了页缓存；fsync（以及对目录的 fsync）才是持久化承诺点。
  - q: 日志文件系统崩溃后如何恢复一致性？
    options:
      - 把所有文件重新下载一遍
      - 扫描日志：重放已提交事务，未提交的丢弃
      - 忽略日志直接挂载
      - 把脏页全部写回原处
    answer: 1
    explain: 预写日志保证每个事务全生效或全不生效；重启时重放已提交事务即可恢复到一致状态。
