  - id: pagecache
    title: 页缓存：write 毫秒返回，其实数据还在内存里
    tldr: 编辑器点完保存立刻提示成功、刚写完重读也丝滑不卡，不是磁盘变快了，而是内核在中间垫了一层页缓存——读命中不碰盘，写进内存标成脏页就先返回。
    body: |-
      当你往 `notes.md` 写入新修改调用 `write()` 时，内核根本不会傻等几十微秒或十毫秒把数据刷到磁盘才放你走。它先从内存里拨出对应的 4 KB 缓存页（合起来叫页缓存），把新字节拷进去，再给这页贴上一张「[[脏页]]（已修改但还没落盘）」的标签，随后立刻对编辑器返回「写入成功」。真正干苦力的内核回写线程会在几秒到几十秒后，把积攒的脏页挑个顺手的时机批量顺序刷到磁盘上。

      读文件也走同一条路：再次打开 `notes.md` 时，内核先查页缓存，撞中了就直接从内存拷给程序，连磁盘门都不敲；没撞中才读盘，顺手把整页留在缓存里备下次用。这就是为什么 Linux 上用 `free` 命令常看到 `buff/cache` 吃掉了大半内存——那不是内存泄露，而是内核顺手拿空闲内存当高速缓冲区，一旦程序真缺内存，这些缓存页会第一时间被清退腾位。

      硬币的背面也很刺眼：程序听到的「`write` 成功」只是说数据安全交给了操作系统内存，离真正躺进稳定磁盘还有好几秒的异步空窗期。万一刚好在这几秒里踢掉了电源线，刚才提示已保存的那段文字就会跟着内存一起蒸发（做磁盘测速时如果忘了先清缓存，测出来的往往也是内存速度而不是磁盘速度）。
    derivation: original
    sources:
