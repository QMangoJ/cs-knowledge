- id: link-boundaries
  title: 硬链接与符号链接的边界清单
  tldr: 硬链接不能跨文件系统、一般不能指向目录；软链接什么都能指，但会悬空、会成环、每次解析都要多走一趟。
  body: '两种链接的边界值得单独列清。硬链接是在目录里多写一个指向同一 inode 的名字，所以它有三条硬边界：不能跨文件系统（inode 号只在单个文件系统内有意义，跨盘就找不到对象）；一般不允许指向目录（否则目录结构会出现环，遍历与删除都会乱套，目录的层级关系只由系统在创建与移动目录时内部维护）；目标被删时不悬空，因为每个名字都是平等的入口，链接计数归零才回收。符号链接是内容为路径字符串的独立文件，边界完全不同：可以跨文件系统、可以指向目录，但目标被删或改名后它会悬空成“断链”；链接套链接、甚至指回自己时会形成环，内核在路径解析时对跳转次数设了上限，超了就报 ELOOP 错误让你知道绕圈了。还有个行为差异：大多数命令默认跟随软链接操作目标，但删除软链接本身删的是链接不是目标——把 rm 用在软链接上很安全，用在硬链接的某个名字上也只是少一个名字，数据都还在。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: link(2)、symlink(2) 与 symlink(7) 手册
    claim: 硬链接要求同一文件系统且通常不能指向目录，符号链接是保存目标路径的独立文件，解析环路会返回 ELOOP
    status: verified
