- id: journal
  title: 日志：断电后为什么不会结构损坏
  tldr: 先把「我要改 A、B、C」写进日志区并落盘提交，再改正式位置；崩溃后重放日志即可。
  body: '更新一个文件常要同时改数据块、inode 与空闲位图。写到一半断电，结构就会不一致（比如 inode 指向一个被标记空闲的块）。

    日志型文件系统（如 ext4 的 jbd2）的做法是预写日志（write-ahead logging）：先把这次事务的全部修改写到磁盘上专门的日志区，等日志落盘（提交）后再慢慢写回正式位置。崩溃重启后扫描日志：已提交的事务重放一遍，未提交的当没发生过——每个事务要么全生效、要么全不生效。

    ext4 默认的 ordered 模式还保证数据块先于引用它的元数据提交，进一步避免 inode 指向垃圾数据。'
  derivation: original
  sources:
  - ref: ostep
    locator: Crash Consistency / Journaling 章节
    claim: 日志文件系统先将事务写入日志并提交，再写回正式位置，崩溃后通过重放恢复一致性
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
