  - id: journal
    title: 日志（WAL）：写一半突然断电，结构为什么不会坏
    tldr: 改一次文件要同时动数据块、[[inode]] 和空闲位图好几个位置；[[ext4]] 靠预写日志先把完整修改账单写进日志区并提交，断电重启只重放已提交的账单，绝不留半截烂账。
    body: |-
      继续刚才断电那一幕：哪怕回写线程已经开始把 `notes.md` 往磁盘上刷，新问题又来了。保存文件变长了 1 块，磁盘上起码要改三处位置：把新数据写进空闲块、把空闲位图里的那一位标成已用、再把块号记进 `notes.md` 的 [[inode]] 里。磁盘每次只保证单个扇区或命令落盘，绝不保证这三处同时生效——万一刚改完 inode 还没来得及改位图就断了电，重启后同一块磁盘就被两个地方同时认领或标记为空闲，整张文件系统直接错乱。

      为了堵死这种半成品状态，[[ext4]] 的日志引擎（[[jbd2]]）借用了数据库经典的预写日志（[[WAL]]）做法：先把「这次一共要改哪几个块」当成一笔事务，完整写进磁盘上划好的一块日志区，末尾再写一条「提交完成」标记；只有日志区确认落稳了，内核才慢慢去覆写正式位置的数据块和元数据。要是在写正式位置的半路断了电，重启时只要扫描日志区：见到「已提交」标记的事务就重新做一遍，没见到提交标记的就当没发生过直接丢掉。

      [[ext4]] 默认的 ordered 日志模式还会多守一道防线：先把 `notes.md` 真正的数据块写进盘，再提交引用它的元数据日志，防止重启恢复后 inode 指到一块刚分配、里面还残存别人旧数据的垃圾块。天下没有免费的安全：同样一份修改等于先记日志再写正主，写入量变多、日志区还要占空间，这就是用一笔额外写入换回断电不用瘫痪。
    derivation: original
    sources:
      - ref: ostep
        locator: Crash Consistency / Journaling 章节
        claim: 日志文件系统先将事务写入日志并提交，再写回正式位置，崩溃后通过重放恢复一致性
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
    canvas:
