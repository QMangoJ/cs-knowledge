- id: path
  title: 路径解析：名字 → inode 号
  tldr: 逐级查目录：每个目录就是一张「名字 → inode 号」的表，解析完拿到目标的 inode。
  body: '打开 /home/daniel/notes.md 时，内核从根目录开始逐级查：根目录里查 home 得到它的 inode，读进来再查 daniel，再查 notes.md，最后拿到目标文件的 inode 号。

    目录本身也是文件，只是内容是目录项（名字 + inode 号）。路径解析的结果会被缓存（dentry 缓存），所以重复打开同一路径很快。'
  derivation: original
  sources:
