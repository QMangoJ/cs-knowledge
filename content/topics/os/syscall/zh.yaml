- id: strace-lab
  title: strace 实操：把系统调用看出来
  tldr: strace 打印每次系统调用的参数与返回值；-c 给出按次数与耗时排序的统计表。
  body: '把前面的机制落到一条命令上：strace -e trace=write echo hi，最后会出现 write（1, hi 加换行, 3）等于 3 这一行——1 是标准输出的文件描述符，3 是实际写出的字节数，等号后面是返回值。再跑 strace -f -c ls：-f 跟踪子进程，-c 不打印明细，只给统计表，按总耗时和调用次数排序，常能看到 openat、read、newfstatat 占了大头。

    读 strace 的三个要点：一看返回值，等于 -1 的行后面会跟上错误名如 ENOENT；二看次数，同一个小文件被反复 openat 往往是程序在做无谓的重复工作；三看对照，把输出重定向到文件再跑一次，对比 write 出现的时机，就能亲眼看到 stdio 全缓冲的影响。注意 strace 本身会让被跟踪程序明显变慢（每次系统调用都要停下来报告），数字只能看相对量级，不能当真实性能数据。'
