        event: 带着结果返回，程序继续执行
  - id: vdso
    title: 不进内核的“系统调用”：vDSO
    tldr: 有些只读的小请求，内核干脆把答案放到用户态，省掉一趟切换。
    body: |-
      有些请求每次都过门纯属浪费，典型是「现在几点」：频率极高，又不需要鉴权。Linux 的办法是把这段服务留在用户态：内核把一页自己持续更新的时间数据和一小段核准过的代码映射进每个进程（vDSO），glibc 的 clock_gettime 直接读这页数据、配合 CPU 的时间戳计数器算出当前时间，全程不陷入——像前端把不常变的数据放本地缓存，不必每次请求后端。

      这条旁路成立的条件很苛刻：数据必须人人可读、读取无副作用、无需鉴权——时间恰好三条全占。凡涉及写操作或权限判断的请求，永远走不了这条路，只能老实过门。
    derivation: original
    sources:
      - ref: ostep
        locator: Limited Direct Execution 一章
        claim: 有些只读的小请求，内核干脆把答案放到用户态，省掉一趟切换。
