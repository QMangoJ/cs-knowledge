steps:
- id: need-kernel
  title: 程序想做一件只有内核能做的事
  tldr: 程序不能直接操作硬件，这是为了保护整台机器。
  body: '程序想在终端上打印一行字，但它没有权限直接操作屏幕、磁盘或网卡。

    如果谁都能直接碰硬件，一个出错的程序就可能写坏磁盘，或者偷看别的程序的数据。

    这就像网页里的 JavaScript 不能随便读你电脑上的文件，只能通过浏览器提供的接口。'
  derivation: original
  sources:
  - ref: ostep
    locator: Limited Direct Execution 一章
    claim: 用户程序不能直接执行 I/O 等受限操作
    status: unverified
    note: 按 Daniel 决定不核对出处
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: p
      label: 程序
      highlight: true
    - lane: kernel
      id: k
      label: 内核
    - lane: hw
      id: h
      label: 硬件（终端）
    messages:
    - id: m-need-kernel
      from: p
      to: h
      label: 直接访问？不允许
      active: true
  log:
  - mode: 用户态
    event: 程序想打印文字，但无权直接操作硬件
  points:
  - 程序不能直接操作硬件，这是为了保护整台机器。
- id: syscall-door
  title: 发起系统调用：敲响内核的门
  tldr: 系统调用是程序进入内核的唯一受控入口。
  body: '程序调用 printf，最终由 C 库（glibc）执行 x86-64 的 syscall 指令，并带上“我要哪种服务”的编号。

    这条指令触发“陷入”，把控制权交给内核。

    程序只能说“我要什么”，跳到内核的哪段代码由内核事先定好；用 strace 就能看到一个程序发出的全部系统调用。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: syscall(2)、strace(1)
    url: https://man7.org/linux/man-pages/man2/syscall.2.html
    claim: x86-64 Linux 通过 syscall 指令进入内核；strace 可跟踪系统调用
    status: unverified
    note: 按 Daniel 决定不核对出处
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: p
      label: 程序
      highlight: true
    - lane: kernel
      id: k
      label: 内核
    - lane: hw
      id: h
      label: 硬件（终端）
    messages:
    - id: m-syscall-door
      from: p
      to: k
      label: 系统调用：请帮我写终端
      active: true
  log:
  - mode: 用户态
    event: 程序发起 write 系统调用
  code:
    lang: c
    code: '// glibc 把系统调用号放进 rax，参数放进 rdi/rsi/rdx…，执行 syscall 指令陷入内核

      ssize_t n = read(fd, buf, sizeof buf);  // __NR_read = 0 (x86-64)'
    note: x86-64 Linux 的约定
- id: mode-switch
  title: 切到内核态
  tldr: CPU 有两种模式，陷入时从用户态切到内核态。
  body: 'CPU 自己记着当前是“用户态”还是“内核态”，用户态里很多操作会被硬件直接拦下。

    陷入发生时，CPU 记下程序停在哪里，切换到内核态，从内核指定的入口开始执行。

    这种切换由硬件保证，程序没法自己把自己变成内核态。'
  derivation: original
  sources:
  - ref: ostep
    locator: Limited Direct Execution 一章，用户模式与内核模式
    claim: 处理器区分用户模式和内核模式，trap 时切换到内核模式
    status: unverified
    note: 按 Daniel 决定不核对出处
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: p
      label: 程序
    - lane: kernel
      id: k
      label: 内核
      highlight: true
    - lane: hw
      id: h
      label: 硬件（终端）
    messages:
    - id: m-mode-switch
      from: p
      to: k
      label: 切换到内核态
      active: true
  log:
  - mode: 用户态 → 内核态
    event: CPU 切换模式，内核接手
- id: check-and-do
  title: 内核检查参数，然后代办
  tldr: 内核不信任程序传来的任何东西，先检查再干活。
  body: '内核先确认请求合理：这个文件描述符你打开过吗？你给的内存地址真的属于你吗？

    不合法就返回错误（比如 EBADF、EFAULT），而不是让整个系统崩溃，这和后端从不信任前端参数是同一个道理。

    检查通过后，内核才通过驱动把文字交给终端。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: write(2) 的 ERRORS 部分
    url: https://man7.org/linux/man-pages/man2/write.2.html
    claim: write 对非法文件描述符或地址返回 EBADF、EFAULT 等错误
    status: unverified
    note: 按 Daniel 决定不核对出处
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: p
