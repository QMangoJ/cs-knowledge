prereq: []
objectives:
  - 说清用户态/内核态为什么要隔离
  - 跟踪一次 read 系统调用的完整路径
  - 解释系统调用为什么比普通函数调用贵
aiLink: LLM 应用里每次读模型文件、收发网络请求、写日志都经系统调用进入内核；推理服务调优常看 strace 与 syscall 次数，批量与异步 I/O 的价值之一就是减少陷入内核的次数——看懂 syscall 才看得懂这些开销从哪来。
design:
  - mechanism: 受控陷入：进入内核态只有内核预先登记的这一道门，特权级切换由硬件把守，程序既绕不过去，也伪造不了。
    problem: 硬件特权近乎二值：能直接碰硬件的代码就能绕过一切检查，而出错或恶意的程序不会遵守任何约定；CPU 又必须全速跑用户代码，不可能每条指令都软件审查一遍。
    choice: 只留 syscall 这类预登记入口，硬件保证用户态只能从这里进。让程序直接调用内核函数地址，入口校验无从下手；把每条 I/O 指令用软件模拟，性能不可接受。受控陷入是唯一同时满足隔离与速度的形状。
    tradeoff: 代价是每次请求都要付模式切换、保存现场与参数校验的固定开销，按次由所有调用者承担；内核只好再把批量、异步、vDSO 这些摊薄手段做成生态——这份复杂度是隔离的长期账单。
    root: 隔离的根基只能是硬件的强制力：权限检查由 CPU 在执行指令、访问内存时强制执行，不看被检查者的脸色。软件无法凭空制造自己不具备的强制力。
  - mechanism: 调用号加寄存器传参：一份由整数编号与硬件寄存器构成的极简契约，几十年只追加不修改，撑起全部二进制兼容。
    problem: 内核与无数独立编译的程序需要一份几十年稳定的契约：程序不知道内核函数的地址，内核不信任程序给的指针与栈，而契约必须在一次陷入中完整传完，没有第二次握手。
    choice: 整数调用号是稳定的名字，寄存器内容由硬件在陷入瞬间原样保留。按字符串名查找既慢又引入解析攻击面；参数放用户栈上，栈指针本身不可信，内核取参第一步就可能踩恶意地址。寄存器把可信面压到最小。
    tradeoff: 参数个数被寄存器封顶（x86-64 为 6 个），复杂参数只能传指针再由内核拷贝校验；已发布的调用号永不回收，是为兼容性付的永久税。换来的是契约极简、老二进制在新内核上照常运行。
    root: 二进制兼容不可逆：已发布的二进制无法召回重编，ABI 一旦被依赖就近乎物理定律。而陷入时寄存器不经过内存地被完整保留，是当时唯一既可信又免费的参数通道。
  - mechanism: vDSO：把读时钟这类无副作用、无需鉴权的只读请求整段留在用户态执行，用一页共享只读数据换掉整趟陷入与校验。
    problem: 读时间频率极高、数据又人人可读，每次付完整陷入成本纯属浪费；但直接把数据交给程序读，又必须保证它时刻准确，且不能让程序借这条通道摸到任何其他内核数据。
    choice: 内核只映射一页自己维护的只读数据加一小段核准过的代码。开放读硬件时钟的特权指令会破坏隔离且各机器语义不一；让程序本地缓存时间，精度与单调性都保证不了。把通道收窄到一页只读数据，是唯一过关的折中。
    tradeoff: 只能服务极少数无副作用、无需鉴权的只读请求；内核还要长期维护这页数据与真实时钟严格同步，硬件时钟不可靠时能回退到真系统调用。
    root: 这类信息不依赖调用者身份、不改变系统状态、公开也不减损安全——三条全占时，隔离的收益为零，再付隔离的成本就是纯粹的浪费，绕行才在原理上成立。
quiz:
  - q: 程序为什么不能直接读文件、非要请内核帮忙？
    options:
      - 省电
      - 因为硬件与资源必须由内核统一仲裁，直接访问会互相破坏
      - 为了让代码更短
      - 因为 CPU 不会执行读文件指令
    answer: 1
    explain: 文件、设备被所有进程共享，内核做权限检查与调度，避免互相踩踏。
  - q: 系统调用比普通函数调用贵的主要原因？
    options:
      - 要查一张更大的表
      - 要切换特权级、保存/恢复现场并做参数校验
      - 因为它用汇编写的
      - 因为要等磁盘
    answer: 1
    explain: 模式切换与校验带来固定开销，所以工程上要批量、异步地减少调用次数。
  - q: read() 返回 -1 时，错误原因放在哪里？
    options:
      - 返回值里直接给原因
      - 线程本地变量 errno
      - 函数参数里
      - 内核日志里
    answer: 1
    explain: C 库把内核返回的错误码写进线程本地的 errno，perror/strerror 据此打印。
