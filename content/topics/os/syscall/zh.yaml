  log:
  - mode: 内核态
    event: 请求不合法，返回错误码
- id: return-and-cost
  title: 返回用户态，以及这一趟的代价
  tldr: 内核带着结果切回用户态；但每次进出内核都不便宜。
  body: '内核做完后切回用户态，程序从停下的地方继续，并拿到结果（写了几个字节）。

    进出内核比普通函数调用慢得多，所以 printf 会先把文字攒在缓冲区，攒够了再调用一次 write，就像前端把多个请求合并成一次。

    用 strace 对比一下“逐字写”和“缓冲后写”，系统调用次数差别很明显。


    具体数字：一 次普通函数调用约几纳秒，一次系统调用约几百纳秒到 1 微秒量级（视 CPU 与缓解措施而定）。推理服务每秒要处理成千上万个 token，日志若每 token 都 write 一次，光系统调用开销就能吃掉可观的吞吐。'
  derivation: original
  sources:
  - ref: ostep
    locator: Limited Direct Execution 一章
    claim: 系统调用有切换开销
    status: unverified
    note: 按 Daniel 决定不核对出处
  - ref: linux-man-pages
    locator: setvbuf(3)
    url: https://man7.org/linux/man-pages/man3/setvbuf.3.html
    claim: stdio 对输出进行缓冲
    status: unverified
    note: 按 Daniel 决定不核对出处
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: p
      label: 程序
      highlight: true
    - lane: kernel
      id: k
      label: 内核
    - lane: hw
      id: h
