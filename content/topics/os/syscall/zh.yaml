- id: return-and-cost
  title: 返回用户态，以及这一趟的代价
  tldr: 内核带着结果切回用户态；但每次进出内核都不便宜。
  body: '内核做完后切回用户态，程序从停下的地方继续，并拿到结果（写了几个字节）。

    进出内核比普通函数调用慢得多，所以 printf 会先把文字攒在缓冲区，攒够了再调用一次 write，就像前端把多个请求合并成一次。

    用 strace 对比一下“逐字写”和“缓冲后写”，系统调用次数差别很明显。


    具体数字（量级示意，随机器差异可达数倍）：一次普通函数调用约几纳秒，一次系统调用约几百纳秒到 1 微秒量级（视 CPU 与漏洞缓解措施而定）。推理服务每秒要处理成千上万个 token，日志若每 token 都 write 一次，光系统调用开销就能吃掉可观的吞吐。


    把这一趟的账拆开：陷入与返回的硬件动作、保存和恢复寄存器、参数校验与数据拷贝、调度与锁的竞争，每一项都不大，叠起来就比函数调用贵上一到两个数量级。工程上的应对都是同一个思路——摊薄固定成本：一次 write 写 8KB 而不是逐字节写、用 writev 把多段缓冲一次提交、把多次提交合并成批处理，其本质和前端合并请求、数据库批量插入没有区别：贵的不是活本身，是过门的次数。'
