- id: vdso
  title: 不进内核的“系统调用”：vDSO
  tldr: 有些只读的小请求，内核干脆把答案放到用户态，省掉一趟切换。
  body: '像“现在几点”这种调用非常频繁，每次都陷入内核太亏。

    Linux 把一小段内核提供的代码和数据映射进每个进程（叫 vDSO），clock_gettime、gettimeofday 通常直接在用户态读出结果。

    这就像前端把不常变的数据放在本地缓存，不必每次都请求后端。


    工程注记：用 strace -c 看一个真实程序，常会发现 read/write 之外还有大量 mmap 与 futex；从经验看，程序启动慢常常不是算得慢，而是成千上万次小文件 openat/read 累积出来的（可用 strace -c 自己验证）。


    vDSO 的机制值得看清：内核把一页不断更新的时间数据（由时钟子系统维护）和一小段只读代码映射进进程，glibc 通过启动时传入的辅助向量找到它，clock_gettime 就在用户态读这页数据、配合 CPU 的时间戳计数器算出当前时间，全程不陷入。边界：如果硬件时钟不可靠，vDSO 函数内部会自己回退成真正的系统调用。代价是这页数据对所有进程可见，所以只能放这类人人可读的只读信息，写操作和需要鉴权的操作永远走不了这条路。'
