  - id: mode-switch
    title: 切到内核态
    tldr: 陷入指令把处理器权限从受限的用户态抬进拥有全权的内核态，并跳去内核登记好的入口；这一跳不换内存页表，变的只是权限高低。
    body: |-
      处理器用「特权级」来区分谁能碰硬件：普通程序待在 Ring 3（用户态），碰特权指令会被硬件直接拦下；内核跑在 Ring 0（内核态），拥有全部权限。从 Ring 3 升到 Ring 0 不能靠软件自己改个标记就算数，必须由硬件在执行 syscall 时亲自完成，程序没有任何办法给自己提权。

      具体到硬件动作，x86-64 的 syscall 做得极省事：把下一条用户指令地址存进 rcx、处理器标志存进 r11、把特权级切到 Ring 0，再从 [[MSR]]（模型专用寄存器，内核开机时早就写好入口地址的专用硬件寄存器）读出入口跳进去。正因为只动这几项，它比早期用 int 0x80 软中断进内核快得多——老做法要经过中断门，硬件自动压栈和恢复的东西多出好几倍。

      这里很容易冒出一个误会：切到内核态是不是也要跟着切换整张内存页表？其实不用。在每个进程的虚拟地址空间里，内核的代码和数据本来就固定映射在高半区，只是用户态时页表里的权限位把门锁住了；特权级一升到 Ring 0，同一张页表上的高半区瞬间解锁可读可执行，省下了整趟切换地址空间的开销。
