  - id: return-and-cost
    title: 返回用户态，以及这一趟的代价
    tldr: 内核带着结果切回用户态；但每次进出内核都不便宜。
    body: |-
      内核带结果切回用户态，程序从断点继续。这一趟不便宜：普通函数调用约几纳秒，一次系统调用约几百纳秒到 1 微秒（随 CPU 与漏洞缓解而变），贵上一到两个数量级。

      账花在哪：陷入与返回的硬件动作、保存恢复寄存器、参数校验与数据拷贝——每一项都不大，叠起来就贵。所以工程上的应对只有一个思路：摊薄过门的固定成本。printf 先把文字攒在缓冲区、攒够才 write 一次；writev 把多段缓冲一次提交；数据库批量插入、前端合并请求，本质都是同一件事：贵的不是活，是过门的次数。
    derivation: original
    sources:
      - ref: ostep
        locator: Limited Direct Execution 一章
        claim: 系统调用有切换开销
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
