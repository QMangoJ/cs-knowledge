  - id: return-and-cost
    title: 返回用户态，以及过这一趟门的开销账
    tldr: 一次系统调用来回要花几百纳秒到 1 微秒，比几纳秒的普通函数调用贵出一到两个数量级；高并发和标准库优化的核心思路只有四个字：攒批少敲门。
    body: |-
      内核从存档里把用户寄存器装回硬件，执行 sysret 返回指令把特权级降回 Ring 3，你的 C 程序就从 printf 后面那一行接着往下走。不过，这一趟进出绝不是免费的：普通函数调用就在自己进程里跳来跳去，只要几纳秒；而一次系统调用要花几百纳秒到 1 微秒左右（在开启了硬件漏洞隔离补丁的现代处理器上会更慢），整整贵出了一到两个数量级。

      这笔钱到底花在哪儿了？不是第 6 步那次查表，而是三项叠加起来的固定手续费：处理器切换特权级并刷新部分流水线、进门出门来回保存恢复寄存器和内核栈、以及内核必须把参数和内存指针挨个查一遍再拷贝。单看每一项都不起眼，合起来却成了高频 I/O 场景的大头开销。

      明白账单在哪，优化思路就只剩一个字：攒。你写十行 printf("hello\n")，[[glibc]] 的 stdio 缓冲区并不会傻傻敲十次内核的门，它会先攒在用户态内存里，等凑满一行（遇到换行符 \n 且连着终端时）或攒满缓冲区（比如 4 KB）才集中调一次 write；写多段零散数据时用的 writev、数据库批量写入、乃至前端合并网络请求，底层算的都是同一笔账：干活不贵，过门次数贵。
