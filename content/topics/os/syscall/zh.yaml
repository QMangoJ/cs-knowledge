- id: check-and-do
  title: 内核检查参数，然后代办
  tldr: 内核不信任程序传来的任何东西，先检查再干活。
  body: '内核先确认请求合理：这个文件描述符你打开过吗？你给的内存地址真的属于你吗？

    不合法就返回错误（比如 EBADF、EFAULT），而不是让整个系统崩溃，这和后端从不信任前端参数是同一个道理。

    检查通过后，内核才通过驱动把文字交给终端。


    检查具体查什么？以 write（fd, buf, n）为例：先用 fd 查当前进程的文件描述符表，确认它指向一个已打开且可写的文件；再确认 buf 指向的用户内存确实属于这个进程且可读，内核用专门的 copy_from_user 路径拷贝，地址非法时得到 EFAULT 而不是让内核崩溃。边界情况：写到一半被磁盘满或信号打断时，write 可能只写成功一部分并返回那个较小的字节数，这叫部分写，调用者必须循环补写剩余部分——把返回值当成要么全成功要么全失败，是常见的误解。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: write(2) 的 ERRORS 部分
    url: https://man7.org/linux/man-pages/man2/write.2.html
    claim: write 对非法文件描述符或地址返回 EBADF、EFAULT 等错误
