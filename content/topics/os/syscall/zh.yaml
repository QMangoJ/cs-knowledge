level: 基础
minutes: 16
prereq: []
objectives:
  - 说清用户态/内核态为什么要隔离
  - 跟踪一次 read 系统调用的完整路径
  - 解释系统调用为什么比普通函数调用贵
aiLink: LLM 应用里每次读模型文件、收发网络请求、写日志都经系统调用进入内核；推理服务调优常看 strace 与 syscall 次数，批量与异步 I/O 的价值之一就是减少陷入内核的次数——看懂 syscall 才看得懂这些开销从哪来。
design:
  - mechanism: 受控陷入：硬件把门锁死，只准从预先登记的 syscall 入口进内核
    problem: 用户程序跑起来之后，CPU 不可能每执行一条指令就请软件审查一遍（太慢）；可如果不设防，程序写错指针或故意乱来就能直接毁掉磁盘和别的进程。
    choice: 把「谁能碰硬件」交由 CPU 硬件分两档锁死，平时只给程序用户态，想干特权活必须执行 syscall 跳进内核预先写死在寄存器里的入口。让程序随便跳内核函数地址没法拦截检查，用软件逐条模拟指令又慢到不能用，受控陷入是唯一兼顾速度和安全的路。
    tradeoff: 每次敲门都要付切换特权级、存寄存器和核验参数的固定手续费，大约几百纳秒到 1 微秒；遇到高频调用，就只能靠缓冲区攒批、异步 I/O 等手段去摊薄过门次数。
    root: 靠被管的人自己守规矩是没用的，强制隔离必须由硬件来兜底：CPU 在执行指令和访存时当场拦截越权动作，软件才站得住。
  - mechanism: 调用号加寄存器传参：用整数编号和 6 个寄存器做接口契约，几十年只追加不改号
    problem: 应用程序事先不知道内核函数在内存哪个地址，陷入内核那一刻用户栈也不可信，而且请求必须在一次陷入里带齐所有信息，没法来回商量。
    choice: 用固定整数调用号代替函数名或地址，用硬件原样保留下来的寄存器（rax 和 rdi 等 6 个）传参。查字符串名既慢又容易被畸形字符钻空子，去用户栈摸参数第一步就可能踩到非法地址，所以只能靠寄存器和编号。
    tradeoff: 参数个数被寄存器数目卡死在 6 个以内，再多的数据只能传地址让内核慢慢拷贝校验；而且调用号一旦发布成了 ABI 契约就再也不能改或回收，旧号哪怕废弃也得永久占着位置。
    root: 已编译发出去的老程序没办法全网召回重编译，接口稳定压倒一切；而陷入瞬间只有寄存器不经过内存就被硬件稳稳托住，是当时唯一安全免费的传话筒。
  - mechanism: vDSO：把查时间这类只读、无害、高频请求直接留在用户态算
    problem: 查时间每秒可能发生几百万次，数据人人都能看、读一遍也不会改坏系统，每次都老老实实过门付几百纳秒的手续费，纯属白花钱。
    choice: 内核干脆把一页自己持续刷新的只读时间数据和一小段核准代码直接映射进每个进程，让程序自己就地算出来。直接放开读取硬件时钟的特权指令会破坏隔离，让程序自己缓存又对不准时刻，只开放一页只读数据是最稳妥的折中。
    tradeoff: 只能服务极少数既不写数据、又不看权限的只读调用；而且内核得一直负责同步那页时间数据，遇到硬件时钟不稳的机器还得能退回真正的系统调用。
    root: 当一个操作不挑调用者是谁、不改系统状态、内容公开也毫无风险时，过门安检带来的保护收益就是零——收益为零时还付安检成本就是纯浪费，走旁路才站得住脚。
quiz:
  - q: 程序为什么不能直接读文件、非要请内核帮忙？
    options:
      - 省电
      - 因为硬件与资源必须由内核统一仲裁，直接访问会互相破坏
      - 为了让代码更短
      - 因为 CPU 不会执行读文件指令
    answer: 1
    explain: 文件、设备被所有进程共享，内核做权限检查与调度，避免互相踩踏。
  - q: 系统调用比普通函数调用贵的主要原因？
    options:
      - 要查一张更大的表
      - 要切换特权级、保存/恢复现场并做参数校验
      - 因为它用汇编写的
      - 因为要等磁盘
    answer: 1
    explain: 模式切换与校验带来固定开销，所以工程上要批量、异步地减少调用次数。
  - q: read() 返回 -1 时，错误原因放在哪里？
    options:
      - 返回值里直接给原因
      - 线程本地变量 errno
      - 函数参数里
      - 内核日志里
    answer: 1
    explain: C 库把内核返回的错误码写进线程本地的 errno，perror/strerror 据此打印。
