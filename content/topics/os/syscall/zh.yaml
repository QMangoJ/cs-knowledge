  - id: syscall-door
    title: 敲响内核的门：用 syscall 指令报上服务编号
    tldr: 程序请求内核时不能直接调用内核函数地址，只能由 C 库包装函数报上编号、再执行一条陷入指令「敲门」，落到内核事先登记好的唯一入口。
    body: |-
      回到这行 printf("hello\n")：C 语言标准库 [[glibc]] 先把字符攒在用户态缓冲区，真正过门干活的是它底下的 write 包装函数。包装函数做的事很克制：把 write 对应的服务编号 1 放进指定寄存器，再执行一条 x86-64 的 syscall 机器指令。

      这条指令会立刻触发一次「陷入」（trap）：处理器暂停用户代码，顺着内核预先登记的入口跳进内核。注意，程序只能说清楚「我要哪项服务、参数是什么」，绝不能自己挑一个内核函数地址跳过去——大门开在哪、由谁来接待，全由内核开机时写死在硬件寄存器里。

      用终端工具 strace 跑一遍这个程序，就能亲眼看见这一次敲门：输出里会出现 write(1, "hello\n", 6) = 6。括号里三个数分别是往哪个文件描述符写（1 代表标准输出终端）、写哪段内容、写几个字节，等号右边的 6 是内核实际写出的字节数。配套代码里也放了最常见的读操作 read（编号 0）作对照：无论读还是写，过门走的都是同一套敲门指令。
    derivation: original
    sources:
