- id: errno
  title: 返回值与 errno：失败怎么告诉程序
  tldr: 系统调用失败时返回 -1，具体原因放在 errno 里。
  body: '内核把结果当返回值交回：成功时是有意义的数（比如写了几个字节），失败时 C 库包装函数返回 -1。

    具体原因记在线程本地变量 errno 里，比如 ENOENT 表示文件不存在、EACCES 表示没权限，用 perror 或 strerror 能变成人读的话。

    所以写系统级代码要养成习惯：每次调用都检查返回值，就像前端每次 fetch 都要看 response.ok。


    再补一层机制：内核内部其实直接把负的错误码当返回值，例如 -2 表示 ENOENT。glibc 的包装函数发现返回值落在 -4095 到 -1 之间时，才把它取负写进 errno 并统一返回 -1。两个常见坑：第一，errno 是线程本地变量，多线程各自一份，不会互相覆盖；第二，成功的调用不会清零 errno，所以只能在确认返回 -1（或函数文档约定的失败标志）之后读它，拿残留值判断成败会误报。被信号打断的调用则返回 EINTR，上层通常要重试。'
  derivation: original
  sources:
