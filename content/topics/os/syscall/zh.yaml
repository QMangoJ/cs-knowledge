        event: 调用号 1，分发到 sys_write
  - id: check-and-do
    title: 内核检查参数，然后代办
    tldr: 内核不信任程序传来的任何东西，先检查再干活。
    body: |-
      内核不信任程序传来的任何东西，先检查再干活——和后端从不信任前端参数是同一个道理。以 write(fd, buf, n) 为例：先用 fd 查进程的文件描述符表，确认它指向一个已打开、可写的文件；再确认 buf 那段用户内存确实属于这个进程且可读，拷贝时走专门路径，地址非法就返回 EFAULT，而不是让内核崩溃。

      检查通过，内核才通过驱动把文字交给终端，中途还会把真实结果如实报回：写到一半被打断或磁盘满，write 只写成功一部分并返回那个较小的字节数，剩下的要调用者自己补——返回值不是「全成功或全失败」这么简单。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: write(2) 的 ERRORS 部分
        url: https://man7.org/linux/man-pages/man2/write.2.html
        claim: write 对非法文件描述符或地址返回 EBADF、EFAULT 等错误
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
