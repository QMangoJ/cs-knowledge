      note: x86-64 Linux 的约定
  - id: trap-args
    title: 传话规矩：为什么参数放寄存器而不放栈上
    tldr: 陷入内核那一刻用户栈还完全不可信，所以系统调用号和参数不能压栈，只能按约定塞进硬件原样保留的寄存器里（最多 6 个）；返回值也靠寄存器带回。
    body: |-
      接着刚才 strace 抓到的 write(1, "hello\n", 6) 往里看：[[glibc]] 包装函数在执行 syscall 前，先按 x86-64 的约定把数字摆进四个寄存器——调用号 1 放进 rax，三个参数依次放进 rdi（1，代表标准输出）、rsi（"hello\n" 这段字符串的首地址）、rdx（6，字节长度）。如果换成演示图里画的读操作 read(fd, buf, 4096)，套路完全一样，只是 rax 换成 0，rdi、rsi、rdx 分别放文件描述符 fd、接收缓冲区地址 buf 和长度 4096。

      这套寄存器约定最多传 6 个参数，顺序是 rdi、rsi、rdx、r10、r8、r9。眼尖的读者会立刻卡住：普通函数调用第 4 个参数不是用 rcx 吗，这里怎么换成了 r10？原因很直白：syscall 指令一执行，CPU 硬件自己要征用 rcx 来保存「等会儿返回用户态继续跑哪条指令」的返回地址，原来的值会被盖掉，所以第 4 个参数只能避开它、改放 r10。

      更根本的问题是：为什么非要挤在 6 个寄存器里，不能像普通函数那样顺手压在用户栈上？因为陷入内核的瞬间，用户程序给的栈指针完全不可信——一个出错或恶意的程序完全可以把栈指针指到非法地址。内核如果傻傻地按栈地址去摸参数，刚进门就会踩中非法内存。硬件原样保留下来的寄存器是当时唯一既现成又安全的通道；至于返回值也走 rax：非负代表实际处理了多少字节，负数代表出了什么错（第 8 步细看）。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: syscall(2) 的 Architecture calling conventions 部分
