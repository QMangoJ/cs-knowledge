  - id: syscall-door
    title: 发起系统调用：敲响内核的门
    tldr: 管住归管住，活总得有人干。这一步看程序怎样正式向内核开口：C 库里的包装函数执行一条专门的陷入指令，带上想要哪种服务的编号，处理器停下用户程序、把控制权交给内核。这一步要分清，程序只能说清自己要什么，进门之后跳到哪段代码由内核事先定好，不由程序决定。
    body: |-
      本课的例子是一个 C 程序：它调用 C 库函数 printf 想打印一行字。printf 本身不进内核，真正过门的是 C 库（[[glibc]]）里的 write 包装函数：它执行 x86-64 的 syscall 指令，并带上「我要哪种服务」的编号（write 是 1 号）。

      这条指令触发「陷入」：CPU 停下用户程序、把控制权交给内核。程序只能说清「我要什么」，跳到内核的哪段代码由内核事先定好——这道门开在哪、怎么开，不由程序决定。

      这一趟可以用 strace 亲眼看到：跟踪上面这个程序，输出里会出现一行 write(1, "hello\n", 6) = 6，左边括号里依次是写到哪个描述符、写什么、写多少字节，等号右边的 6 是内核返回的实际写出字节数。后面几步讲的寄存器传参、查表分发和返回结果，就是这一行字背后依次发生的事。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: syscall(2)、strace(1)
        url: https://man7.org/linux/man-pages/man2/syscall.2.html
        claim: x86-64 Linux 通过 syscall 指令进入内核；strace 可跟踪系统调用
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
