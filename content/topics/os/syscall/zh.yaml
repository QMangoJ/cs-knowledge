  - id: errno
    title: 返回值与 [[errno]]：失败怎么告诉程序
    tldr: 前一步的检查没通过时，结果怎样告诉程序？这一步看失败的通报方式：包装函数统一返回 -1，具体原因另放在一个变量里，比如文件不存在、没有权限分别对应不同的值。这一步还要说清一个最容易误判的点——只有先确认返回值是 -1，这个原因变量才有意义，成功之后留下的旧值不能拿来判断。
    body: |-
      结果通过返回值交回：成功时是有意义的数（read 读到几个字节、write 写了几个），失败时 C 库包装函数统一返回 -1，具体原因另放在线程本地变量 errno 里——[[ENOENT]] 是文件不存在，[[EACCES]] 是没权限，用 perror 能把它翻成人话。

      机制上多看一层：内核内部直接用负数当错误码返回，比如 -2 就是 ENOENT；[[glibc]] 发现返回值落在 -4095 到 -1 之间，才把它取负写进 errno、再回 -1。所以 errno 只在调用已返回 -1（确认失败）之后才有意义，成功调用不会清它，拿残留值判断成败会误报。写系统级代码的习惯因此很明确：每次调用先查返回值，确认失败之后才去读 errno。
    derivation: original
    sources:
      - ref: ostep
        locator: Limited Direct Execution 一章
        claim: 系统调用失败时返回 -1，具体原因放在 errno 里。
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
