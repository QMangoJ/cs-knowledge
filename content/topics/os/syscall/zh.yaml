  - id: mode-switch
    title: 切到内核态
    tldr: CPU 有两种模式，陷入时从用户态切到内核态。
    body: |-
      CPU 用特权级记着当前是用户态还是内核态：用户态是 Ring 3，很多操作被硬件直接拦下；内核态是 Ring 0，无所不能。陷入就是把特权级从 Ring 3 升到 Ring 0 并跳进内核——这一步只能由硬件完成，程序没法把自己提权。

      x86-64 的 syscall 指令做的硬件动作很少：把返回地址存进 RCX、标志存进 R11、从 MSR 寄存器取出预先登记的内核入口跳过去。动作少，所以它比老式 int 0x80 快。注意模式切换不换地址空间：页表不动，内核代码本就映射在每个进程地址空间的高半区，只是用户态时被权限位挡住。
    derivation: original
    sources:
      - ref: ostep
        locator: Limited Direct Execution 一章，用户模式与内核模式
        claim: 处理器区分用户模式和内核模式，trap 时切换到内核模式
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: app
          id: p
          label: 程序
        - lane: kernel
          id: k
          label: 内核
          highlight: true
        - lane: hw
          id: h
          label: 硬件（终端）
      messages:
        - id: m-mode-switch
          from: p
          to: k
          label: 切换到内核态
          active: true
    log:
      - mode: 用户态 → 内核态
        event: CPU 切换模式，内核接手
  - id: kernel-entry
    title: 内核入口：先保存现场，再分头处理
    tldr: 每个进程有一块独立的内核栈，入口先把用户寄存器存好，请求才变成一次普通的内核函数调用。
    body: |-
      跳进内核后先不干活，先保存现场：入口代码切到这个进程专属的内核栈，把用户寄存器和返回地址存成一个结构体，之后的 C 代码就把这次请求当成一次普通函数调用来处理，出问题时也靠这份存档恢复。

      为什么每个进程要一张独立的内核栈？多个进程可能同时陷在内核里，中断也可能在内核执行中途到达——现场分开存放，各自的调用链才不会互相污染。用户栈是进程自己的、内容不可信；内核栈只放内核数据，两者隔离是内核不被用户数据带偏的基本盘。
    derivation: original
    sources:
      - ref: ostep
        locator: Limited Direct Execution 一章，trap handler
        claim: 陷入时硬件与内核协作保存用户状态，返回时恢复
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
      - ref: xv6-book
        locator: Traps 一章
        claim: 进入内核时保存用户寄存器到 trapframe，使用独立的内核栈
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
