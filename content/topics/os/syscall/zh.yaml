id: os/syscall
subject: os
slug: syscall
order: 1
status: published
license: CC-BY-4.0
title: 系统调用：程序怎样请内核帮忙
summary: 程序不能直接碰硬件，想读写文件、上网、打印，都得通过“系统调用”这扇门请内核代办。
premise: 以 Linux（x86-64）为例：一个 C 程序调用 printf，想往终端打印一行字，本课追踪这次请求进出内核的全程。
position: 本站从系统调用接口板块开场，因为 printf 最终要靠 syscall 指令和调用号才能请内核代办，任何程序都绕不开这道受控陷入的门。追踪一次 write 从 glibc 包装函数进内核再返回，你便能说清它为何比普通函数调用贵、出错时 errno 又该怎么读。
bridge:
  next: 当 write 这类请求已能经调用号递进内核，下一个问题便落在 bash 身上：它靠哪些调用把敲下的 ls 变成一个独立运行的新进程？
overview:
  - key: 一句话总结
    value: 系统调用是程序主动请求内核服务的唯一受控入口
  - key: 为什么需要
    value: 保护硬件和其他程序，不让一个程序为所欲为
  - key: 两种模式
    value: 用户态（权限受限）和内核态（完全权限）
  - key: 常见系统调用
    value: read、write、openat、clone、execve、mmap
  - key: 代价
    value: 每次进出内核都有开销，所以要尽量批量处理
  - key: 出错时
    value: 返回 -1，原因在 errno（如 ENOENT、EACCES）
  - key: vDSO
    value: clock_gettime 等调用通常不进内核
  - key: 系统调用表
    value: 内核按调用号查表，找到对应的处理函数；调用号是 ABI 的一部分，不随便改
