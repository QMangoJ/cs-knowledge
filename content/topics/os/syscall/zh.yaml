    note: x86-64 Linux 的约定
- id: trap-args
  title: 系统调用号与参数怎么传：寄存器约定
  tldr: 调用号放 rax，参数依次放 rdi、rsi、rdx、r10、r8、r9，最多 6 个。
  body: '还是以 read（fd, buf, 4096）为完整走例：glibc 包装函数把调用号 0 放进 rax，把 fd 放进 rdi、buf 地址放进 rsi、4096 放进 rdx，然后执行 syscall。x86-64 Linux 约定最多传 6 个参数，依次用 rdi、rsi、rdx、r10、r8、r9——注意第 4 个参数用 r10 而不是普通函数调用约定的 rcx，因为 syscall 指令本身要占用 rcx 保存返回地址，这是硬件动作留下的直接后果。

    参数主要是整数和指针：内核不会顺着用户给的长字符串或复杂结构体一直解析，凡是指针指向的数据都要显式拷贝进内核并逐项校验。返回值也走 rax：非负数表示成功，负数表示错误码。为什么用寄存器而不是栈？因为陷入瞬间用户栈不可信——它可能故意指向非法地址，内核若按栈取参数，第一步就可能被带偏；寄存器约定则完全由硬件与 ABI 固定，没有这个攻击面。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: syscall(2) 的 Architecture calling conventions 部分
    url: https://man7.org/linux/man-pages/man2/syscall.2.html
    claim: x86-64 用 rax 传调用号、rdi/rsi/rdx/r10/r8/r9 传参数
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
