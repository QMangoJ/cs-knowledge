prereq: []
objectives:
- 说清用户态/内核态为什么要隔离
- 跟踪一次 read 系统调用的完整路径
- 解释系统调用为什么比普通函数调用贵
aiLink: LLM 应用里每次读模型文件、收发网络请求、写日志都经系统调用进入内核；推理服务调优常看 strace 与 syscall 次数，批量与异步 I/O 的价值之一就是减少陷入内核的次数——看懂 syscall 才看得懂这些开销从哪来。
design:
- mechanism: 受控陷入：用户态只有从内核预先登记的唯一入口才能进入内核态，特权级切换完全由硬件把守，任何程序既无路可绕、也无从伪造这道门
  problem: 根本约束是硬件特权近乎二值：能直接碰硬件的代码就能绕过一切检查，操作系统无法靠约定让用户程序自律，因为出错或恶意的程序根本不会遵守约定；同时 CPU 又必须全速执行用户代码，不可能每条指令都由软件审查一遍。
  choice: 只保留 syscall 这类预先登记的入口：硬件保证用户态只能从内核指定的入口进入，跳到别处会被拦下。替代方案如让程序直接调用内核函数的地址，会让入口处的校验无从下手；如把每条 I/O 指令都用软件模拟，性能又完全不可接受。受控陷入是唯一同时满足隔离与速度的形状。
  tradeoff: 换来强隔离，代价是每次请求都要付模式切换、保存现场与参数校验的固定开销，由所有调用者按次承担；内核因此必须把批量、异步与 vDSO 这些摊薄手段做成生态，否则高频小请求会被固定成本压垮，生态的复杂度是这份隔离的长期账单。
  root: 底层是特权级与地址翻译的硬件强制性：权限检查由 CPU 在执行指令与访问内存时强制执行，不依赖被检查者的配合。软件策略可以千变万化，但隔离的根基只能建在硬件不讲情面的这一点上——软件无法凭空制造出它自己不具备的强制力。
- mechanism: 系统调用号加寄存器传参：一份由整数编号与硬件寄存器构成的极简契约，几十年只准追加、不准修改，撑起全部二进制兼容
  problem: 内核与无数独立编译的程序之间需要一份几十年稳定的契约：程序不知道内核内部函数的地址，内核也不信任程序给的任何指针与栈内容，而且这份契约必须小到能在一次硬件陷入中完整传递，没有第二次握手的机会。
  choice: 用整数调用号加寄存器参数：号是稳定的名字，寄存器内容由硬件在陷入瞬间原样保留。替代方案如按字符串名字查找既慢又引入解析攻击面；如把参数放在用户栈上，栈指针本身不可信，内核取参数的第一步就可能在恶意地址上出错。寄存器约定把可信面压到了最小。
  tradeoff: 代价是参数个数被寄存器数量封顶（x86-64 为 6 个），复杂参数只能传指针再由内核拷贝校验，编程也更别扭；换来的是契约极简且老二进制在新内核上照常运行。另一面是为兼容性付的永久税：已发布的调用号永远不能修改或回收。
  root: 根源是二进制兼容的不可逆性：已经发布的二进制无法召回重编，ABI 一旦被依赖就近乎一条物理定律，只能追加不能修订。寄存器传参则利用了一个硬件事实：陷入时寄存器不经过内存地被完整保留，它是当时唯一既可信又免费的参数通道。
- mechanism: vDSO：把读时钟这类无副作用、无需鉴权的只读请求整段留在用户态执行，用一页共享只读数据换掉整趟陷入与校验的成本
  problem: 读当前时间这类请求频率极高、数据又人人可读，每次都付完整的陷入与校验成本纯属浪费；但把时间数据直接交给程序读，又必须保证它时刻准确，且不能让程序借这条通道摸到任何其他内核数据，通道的宽度必须恰好等于数据本身。
  choice: 内核只映射一页自己维护的只读数据加一小段核准过的代码进每个进程，用户态读它并配合 CPU 时间戳算出结果。替代方案如开放读硬件时钟的特权指令，不同机器时钟语义不一且破坏隔离；如让程序本地缓存时间，精度与单调性又都保证不了。vDSO 是把通道收窄到一页只读数据的折中。
  tradeoff: 换来零陷入的读取速度，牺牲的是这条路只能服务极少数无副作用、无需鉴权的只读请求，且内核多了一份必须与真实时钟严格同步的数据要维护，硬件时钟不可靠时还要能回退到真系统调用，这份同步与回退逻辑由内核长期承担。
  root: 根源在于这类信息的特殊性质：它不依赖调用者身份、不改变任何系统状态、公开给所有人也不减损安全性。凡是同时满足这三条的请求，隔离带来的收益为零，此时再付隔离的成本就成了纯粹的浪费，绕行才在原理上成立。
quiz:
- q: 程序为什么不能直接读文件、非要请内核帮忙？
  options:
  - 省电
  - 因为硬件与资源必须由内核统一仲裁，直接访问会互相破坏
  - 为了让代码更短
  - 因为 CPU 不会执行读文件指令
  answer: 1
  explain: 文件、设备被所有进程共享，内核做权限检查与调度，避免互相踩踏。
- q: 系统调用比普通函数调用贵的主要原因？
  options:
  - 要查一张更大的表
  - 要切换特权级、保存/恢复现场并做参数校验
  - 因为它用汇编写的
  - 因为要等磁盘
  answer: 1
  explain: 模式切换与校验带来固定开销，所以工程上要批量、异步地减少调用次数。
- q: read() 返回 -1 时，错误原因放在哪里？
  options:
  - 返回值里直接给原因
  - 线程本地变量 errno
  - 函数参数里
  - 内核日志里
  answer: 1
  explain: C 库把内核返回的错误码写进线程本地的 errno，perror/strerror 据此打印。
