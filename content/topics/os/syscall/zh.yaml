  - id: check-and-do
    title: 内核不信任何参数：先查权限再动手打印
    tldr: 内核把用户传来的描述符和内存指针一律视为不可信输入，必须验明权限和地址范围才驱动硬件输出；另外写到一半被打断时，write 会返回实际写成的字节数。
    body: |-
      回到 sys_write 拿到的三个参数：1、"hello\n" 的地址、6。内核对它们的态度，和后端服务对待前端发来的请求一模一样——默认全不可信，先验再干活。

      第一步查号：用 1 去查当前进程的文件描述符表，确认 1 号确实对应一个已经打开、并且允许写入的终端或文件；要是程序瞎传一个根本没打开的编号（比如 99），立刻打回错误，不让它碰任何设备。第二步查地址：确认 "hello\n" 所在的这段内存真的属于这个进程且有可读权限；万一程序传了个空指针或别人家的内核地址，专门的拷贝函数会安全拦下并返回 [[EFAULT]]（非法内存地址），不会把整个内核带崩。

      两道安检全过，内核才通过终端驱动把这 6 个字节真正写出去。要注意 write 的返回值并不是只有「全成功」和「全失败」两种：假如你要一口气写 4096 字节，写到第 1500 字节时磁盘满了或被信号打断，内核会把已经成功写出的 1500 如实作为返回值交回，剩下的 2596 字节需要调用者自己接着补写。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: write(2) 的 ERRORS 部分
        url: https://man7.org/linux/man-pages/man2/write.2.html
