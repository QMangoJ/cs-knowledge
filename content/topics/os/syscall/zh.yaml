id: os/syscall
subject: os
slug: syscall
order: 1
status: published
license: CC-BY-4.0
title: 系统调用：程序怎样请内核帮忙
summary: 程序不能直接碰硬件，想读写文件、上网、打印，都得通过“系统调用”这扇门请内核代办。
premise: 以 Linux（x86-64）上一个程序往终端打印一行字为例。
overview:
- key: 一句话总结
  value: 系统调用是程序主动请求内核服务的唯一受控入口（缺页、中断等也会进内核，但不是程序主动请求的）
- key: 为什么需要
  value: 保护硬件和其他程序，不让一个程序为所欲为
- key: 两种模式
  value: 用户态（权限受限）和内核态（完全权限）
- key: 常见系统调用
  value: read、write、openat、clone、execve、mmap
- key: 代价
  value: 每次进出内核都有开销，所以要尽量批量处理
- key: 出错时
  value: 返回 -1，原因在 errno（如 ENOENT、EACCES）
- key: vDSO
  value: clock_gettime 等调用通常不进内核
- key: 系统调用表
  value: 内核按调用号查表，找到对应的处理函数；调用号是 ABI 的一部分，不随便改
- key: 在终端里看一看
  value: strace -e trace=write echo hi　看到 echo 发出的 write 调用；strace -c ls　统计 ls 用了哪些系统调用
visual: swimlane
lanes:
- id: app
  label: 程序
- id: kernel
  label: 内核
- id: hw
  label: 硬件
logColumns:
- key: mode
  label: 当前状态
- key: event
  label: 发生了什么
steps:
- id: need-kernel
  title: 程序想做一件只有内核能做的事
  tldr: 程序不能直接操作硬件，这是为了保护整台机器。
  body: '程序想在终端上打印一行字，但它没有权限直接操作屏幕、磁盘或网卡。

    如果谁都能直接碰硬件，一个出错的程序就可能写坏磁盘，或者偷看别的程序的数据。

    这就像网页里的 JavaScript 不能随便读你电脑上的文件，只能通过浏览器提供的接口。


    走一个具体的例子：两个程序同时往同一个日志文件末尾写数据。如果它们各自直接操作磁盘、各自记住文件现在多长，就会算出同一个写入位置，后写的那份把先写的覆盖掉。内核介入后，带 O_APPEND 的 write 会在内核里串行地完成定位到末尾再写入，两个程序不会互相踩。硬件层面还有一层保证：x86 把权限分成 Ring 0 到 Ring 3，用户程序在 Ring 3 执行碰硬件的特权指令时，CPU 会直接触发异常把控制权交给内核——不是内核比较勤快，是程序在硬件上根本做不到。'
  derivation: original
  sources:
  - ref: ostep
    locator: Limited Direct Execution 一章
    claim: 用户程序不能直接执行 I/O 等受限操作
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
