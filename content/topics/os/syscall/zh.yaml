  - id: syscall-table
    title: 按号查表分发：调用号是一辈子不能改的契约
    tldr: 内核拿调用号当下标查函数指针表就能分发到位，但调用号是写死在老程序机器码里的 ABI 契约——一经发布只能表尾追加，永不改号、永不复用。
    body: |-
      入口汇编把现场存好后，内核检查 rax 里的调用号没有越界，就拿它当下标去查一张函数指针数组 sys_call_table，直接跳过去执行——在 x86-64 Linux 上，0 号指向 sys_read，1 号指向 sys_write（正是打印 hello 要走的这一格），257 号指向打开文件的 sys_openat。如果程序传了一个表里根本没有的编号，内核就返回 [[ENOSYS]]（表示「该系统调用未实现」），程序据此也能探测新内核到底支不支持某个新功能。

      真正值得记住的规矩在表的稳定性上：每个调用号都是操作系统对应用程序签下的 [[ABI]]（二进制接口契约）。几十年前编译好的老程序早就把数字 1 写死在机器码里了，今天换上新内核，1 号就必须还是 write；哪怕某个老调用以后没人用、被废弃了，那个编号也只能空着留作纪念，新调用只能往表尾加新号。

      顺便破除一个常见误会：系统调用比普通函数慢，绝不是因为「查这张表很慢」。按整数下标读一次函数指针数组不过几纳秒，真正把账拉高的另有其人（第 9 步我们一笔笔算）。
