- id: kernel-entry
  title: 内核入口：先保存现场，再分头处理
  tldr: 每个进程有一块独立的内核栈，入口先把用户寄存器存好，请求才变成一次普通的内核函数调用。
  body: '跳进内核后第一件事不是干活，而是把现场收好。入口代码切换到当前进程的内核栈（每个进程在内核里都有一块独立的栈，与用户栈分开），把用户态的寄存器、返回地址等保存成一个结构体，之后 C 代码处理时就把这次请求当成一次普通的内核函数调用。

    出问题也靠这份存档兜底：如果拷贝用户数据时地址非法，内核能借事先登记的修复表把错误转成 EFAULT 返回，而不是当场崩溃。为什么每个进程要一张独立的内核栈？因为多个进程可能同时陷在内核里，各自的调用链互不干扰；同时中断也可能在内核执行中途到达，现场必须分开存放才能层层恢复。和用户态对比着记：用户栈是进程自己的、内容不可信；内核栈是内核自己的、只存内核数据，两个栈物理隔离，是内核不被用户数据污染的基本盘。'
  derivation: original
  sources:
  - ref: ostep
    locator: Limited Direct Execution 一章，trap handler
    claim: 陷入时硬件与内核协作保存用户状态，返回时恢复
    status: verified
