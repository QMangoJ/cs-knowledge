- id: syscall-table
  title: 系统调用表：按号查表分发
  tldr: 内核以调用号为下标查函数指针表；调用号一旦发布就是 ABI，永不修改、永不复用。
  body: '内核入口拿到 rax 里的调用号后，做的事情出奇地朴素：先检查它没有越界，再以它为下标去查一张函数指针表 sys_call_table，跳到对应的处理函数，比如 0 号对应 sys_read、1 号对应 sys_write、257 号对应 sys_openat。

    走例：strace 里看到 openat 返回 3，就是 257 号处理函数执行后把新文件描述符交回来。两个设计后果：第一，调用号一旦发布就是 ABI 的一部分，永远不能改也不能复用，否则老二进制会当场失效，所以新调用只往表尾加；第二，表里没有的号直接返回 ENOSYS（错误码 38），程序可以据此探测内核是否支持某个新调用并做兼容回退。误解澄清：查表本身只是数组下标访问，几乎不花时间，系统调用的开销不在查表，而在切换与校验，这一点在前面的实测量级里能对上。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: syscalls(2)
    url: https://man7.org/linux/man-pages/man2/syscalls.2.html
    claim: Linux 系统调用列表与调用号约定，调用号属于稳定的 ABI
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
