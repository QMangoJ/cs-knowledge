level: 基础
minutes: 15
prereq: []
objectives:
- 说清用户态/内核态为什么要隔离
- 跟踪一次 read 系统调用的完整路径
- 解释系统调用为什么比普通函数调用贵
aiLink: LLM 应用里每次读模型文件、收发网络请求、写日志都经系统调用进入内核；推理服务调优常看 strace 与 syscall 次数，vLLM 等框架用批量与异步 I/O 减少陷入内核的次数——看懂 syscall 才看得懂这些开销从哪来。
quiz:
- q: 程序为什么不能直接读文件、非要请内核帮忙？
  options:
  - 省电
  - 因为硬件与资源必须由内核统一仲裁，直接访问会互相破坏
  - 为了让代码更短
  - 因为 CPU 不会执行读文件指令
  answer: 1
  explain: 文件、设备被所有进程共享，内核做权限检查与调度，避免互相踩踏。
- q: 系统调用比普通函数调用贵的主要原因？
  options:
  - 要查一张更大的表
  - 要切换特权级、保存/恢复现场并做参数校验
  - 因为它用汇编写的
  - 因为要等磁盘
  answer: 1
  explain: 模式切换与校验带来固定开销，所以工程上要批量、异步地减少调用次数。
- q: read() 返回 -1 时，错误原因放在哪里？
  options:
  - 返回值里直接给原因
  - 全局变量 errno
  - 函数参数里
  - 内核日志里
  answer: 1
  explain: C 库把内核返回的错误码写进线程本地的 errno，perror/strerror 据此打印。
