  - id: mode-switch
    title: 切到内核态
    tldr: 话传好了，这一步看门槛本身：处理器有两种运行模式，普通程序在权限受限的用户态，只有内核代码能在权限完整的内核态。这一步看陷入时特权级怎样由硬件从低升到高，并澄清一个常见误会——切模式并不换地址空间，页表不动，变的只是权限。
    body: |-
      CPU 用特权级记着当前是用户态还是内核态：用户态是 Ring 3，很多操作被硬件直接拦下；内核态是 Ring 0，无所不能。陷入就是把特权级从 Ring 3 升到 Ring 0 并跳进内核——这一步只能由硬件完成，程序没法把自己提权。

      x86-64 的 syscall 指令做的硬件动作很少：把返回地址存进 RCX、标志存进 R11、从 [[MSR]] 寄存器取出预先登记的内核入口跳过去。动作少，所以它比老式做法快：老式做法是执行 int 0x80 指令、经中断门进内核，要保存和恢复的内容更多。注意模式切换不换地址空间：页表不动，内核代码本就映射在每个进程地址空间的高半区，只是用户态时被权限位挡住。
    derivation: original
    sources:
      - ref: ostep
        locator: Limited Direct Execution 一章，用户模式与内核模式
        claim: 处理器区分用户模式和内核模式，trap 时切换到内核模式
