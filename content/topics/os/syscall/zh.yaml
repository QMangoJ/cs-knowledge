  - id: syscall-table
    title: 系统调用表：按号查表分发
    tldr: 内核以调用号为下标查函数指针表；调用号一旦发布就是 ABI，永不修改、永不复用。
    body: |-
      入口拿到 rax 里的调用号，做的事情很朴素：检查没越界，就以它为下标查函数指针表 sys_call_table，跳到对应处理函数——0 号是 sys_read，1 号是 sys_write，257 号是 sys_openat。

      这张表定下了一条铁律：调用号一旦发布就是 ABI，永不修改、永不复用，只能往表尾追加，否则已编译的老程序会当场失效。表里没有的号返回 ENOSYS，程序可以据此探测新调用是否被支持。另外记住：查表只是数组下标访问，几乎不花时间——系统调用的贵不在这儿（第 9 步算账）。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: syscalls(2)
        url: https://man7.org/linux/man-pages/man2/syscalls.2.html
        claim: Linux 系统调用列表与调用号约定，调用号属于稳定的 ABI
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
