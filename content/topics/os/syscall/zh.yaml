id: os/syscall
subject: os
slug: syscall
order: 1
status: published
license: CC-BY-4.0
title: 系统调用：程序怎样请内核帮忙
summary: |-
  程序在普通模式下碰不到硬件，想读文件、打印文字或发网络包，必须通过「系统调用」这道唯一受控的入口向内核申请。全课从为什么必须把权限切开讲起，拆解一次请求怎样靠专用指令和寄存器传话、让处理器切进内核态并存好现场，再顺着调用号查表找到处理函数、核验参数并干完活。最后还会算清这一来一回比普通函数调用贵在哪里、出错时去哪查原因，以及为什么连查时间这类高频只读动作都干脆绕开这趟进门。
premise: 这节课的场景很具体：你在 Linux 上运行自己写的一个 C 程序，代码里只有一行 printf("hello\n")，想在终端屏幕上印出六个字母。就是这句再普通不过的打印，程序自己却干不了——屏幕、磁盘、网卡这些硬件全归内核管。这一课就跟着这声「敲门」，把这次请求从用户程序递进内核、办完再返回的全程走一遍。
position: 本课是操作系统板块「系统调用接口」的开篇第一课。无论后面要学的创建进程、读写文件还是网络收发，程序每次向内核要资源，都要先经过这道受控的门。学完这一趟进出内核的完整路径，就能看懂系统调用为什么比普通函数调用贵出两个数量级、失败时去哪看错误原因，为下一课在终端里拉起新进程打好底子。
bridge:
  next: 弄明白单个请求怎么敲门进内核之后，下一个自然的问题就落到终端身上：你在 bash 里敲下一个 ls，它是靠哪几个系统调用，把这个命令变成一个独立跑起来的新程序的？
overview:
  - key: 一句话总结
    value: 想让内核代办一件只有它有权限干的活（写屏幕、读磁盘、建进程），程序必须按规定把调用号和参数放进寄存器，执行陷入指令从唯一入口进去，办完带着结果或错误码返回。
  - key: 为什么需要
    value: 系统调用存在是为了保护硬件和其他程序，不让任何一个程序为所欲为。比如磁盘上存着所有人的文件，如果程序能直接操作磁盘，一个写错地址就可能毁掉别人的数据。
  - key: 两种模式
    value: CPU 有两种运行模式，用户态权限受限，普通程序平时就跑在这一态。内核态有完全权限，只有内核代码能跑在这一态，两种模式的切换只能通过规定的入口。
  - key: 常见系统调用
    value: 常见的系统调用有 read、write、openat、clone、execve、mmap，分别管读写、打开文件、建进程、换程序和映射内存。你写的每一行文件读写代码，底层最后都会落到这几个调用上。
  - key: 代价
    value: 每次进出内核都要切换模式、保存和恢复现场，是有开销的。所以高性能代码会尽量批量处理，比如一次读一大块，而不是一个字节调用一次。
  - key: 出错时
    value: 系统调用失败时返回 -1，具体原因放在 [[errno]] 里，比如 [[ENOENT]] 表示文件不存在，[[EACCES]] 表示没有权限。查问题时先看 errno，就能知道到底卡在哪一步。
  - key: vDSO
    value: 有些调用太频繁又只读，比如 clock_gettime 查时间，内核干脆把一小段代码和数据映射到用户态，这就是 [[vDSO]]。这类调用通常根本不进内核，在用户态直接算出结果就返回了。
  - key: 系统调用表
    value: 内核按调用号查系统调用表，找到对应的处理函数来执行。调用号是 [[ABI]] 的一部分，一旦定下来就不能随便改，老程序才不会因为换了新内核就跑不了。
