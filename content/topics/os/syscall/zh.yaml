steps:
  - id: need-kernel
    title: 程序想做一件只有内核能做的事
    tldr: 程序不能直接操作硬件，这是为了保护整台机器。
    body: |-
      程序想在终端上打印一行字，但它没有权限直接操作屏幕、磁盘或网卡。如果谁都能直接碰硬件，一个出错的程序就可能写坏磁盘，或者偷看别的程序的数据——这就像网页里的 JavaScript 不能随便读你电脑上的文件，只能通过浏览器提供的接口。

      还不只是防破坏：两个程序同时往同一个日志文件末尾写，各自直接操作磁盘就会算出同一个写入位置，后写的覆盖先写的；由内核代办，带 O_APPEND 的 write 会在内核里串行完成，不会互相踩。硬件上也堵死了绕路：用户程序在 Ring 3 执行碰硬件的特权指令，CPU 会直接触发异常把控制权交给内核——不是程序自觉，是它根本做不到。
    derivation: original
    sources:
      - ref: ostep
        locator: Limited Direct Execution 一章
        claim: 用户程序不能直接执行 I/O 等受限操作
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: app
          id: p
          label: 程序
          highlight: true
        - lane: kernel
          id: k
          label: 内核
        - lane: hw
          id: h
          label: 硬件（终端）
      messages:
        - id: m-need-kernel
          from: p
          to: h
          label: 直接访问？不允许
          active: true
    log:
      - mode: 用户态
        event: 程序想打印文字，但无权直接操作硬件
    points:
      - 程序不能直接操作硬件，这是为了保护整台机器。
  - id: syscall-door
    title: 发起系统调用：敲响内核的门
    tldr: 系统调用是程序主动请求内核服务的唯一受控入口。
    body: |-
      本课的例子是一个 C 程序：它调用 C 库函数 printf 想打印一行字。printf 本身不进内核，真正过门的是 C 库（glibc）里的 write 包装函数：它执行 x86-64 的 syscall 指令，并带上「我要哪种服务」的编号（write 是 1 号）。

      这条指令触发「陷入」：CPU 停下用户程序、把控制权交给内核。程序只能说清「我要什么」，跳到内核的哪段代码由内核事先定好——这道门开在哪、怎么开，不由程序决定。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: syscall(2)、strace(1)
        url: https://man7.org/linux/man-pages/man2/syscall.2.html
        claim: x86-64 Linux 通过 syscall 指令进入内核；strace 可跟踪系统调用
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: app
          id: p
          label: 程序
          highlight: true
        - lane: kernel
          id: k
          label: 内核
        - lane: hw
          id: h
          label: 硬件（终端）
      messages:
        - id: m-syscall-door
          from: p
          to: k
          label: 系统调用：请帮我写终端
          active: true
    log:
      - mode: 用户态
        event: 程序发起 write 系统调用
    code:
      lang: c
      code: |-
        // glibc 把系统调用号放进 rax，参数放进 rdi/rsi/rdx…，执行 syscall 指令陷入内核
        ssize_t n = read(fd, buf, sizeof buf);  // __NR_read = 0 (x86-64)
      note: x86-64 Linux 的约定
  - id: trap-args
    title: 系统调用号与参数怎么传：寄存器约定
    tldr: 调用号放 rax，参数依次放 rdi、rsi、rdx、r10、r8、r9，最多 6 个。
    body: |-
      还是以 read(fd, buf, 4096) 为例：glibc 包装函数把调用号 0 放进 rax，三个参数依次放进 rdi、rsi、rdx，执行 syscall。x86-64 约定最多传 6 个参数（rdi、rsi、rdx、r10、r8、r9）——第 4 个用 r10 而不是普通函数调用约定的 rcx，因为 syscall 指令要拿 rcx 保存返回地址，这是硬件动作的直接后果。

      为什么用寄存器而不是栈上传参数？陷入的瞬间，用户栈完全不可信：它可能故意指向非法地址，内核若按栈取参数，第一步就被带偏。寄存器由硬件在陷入时原样保留，是当时唯一既可信又现成的通道。返回值也走 rax：非负是结果，负数是错误码（第 8 步细说）。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: syscall(2) 的 Architecture calling conventions 部分
        url: https://man7.org/linux/man-pages/man2/syscall.2.html
        claim: x86-64 用 rax 传调用号、rdi/rsi/rdx/r10/r8/r9 传参数
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
