  - id: kernel-entry
    title: 进门先存档：切到内核栈保存用户现场
    tldr: 只有把现场另存到进程独立的内核栈上，后续处理才敢像普通 C 函数一样运行，也不怕被其他进程或中断冲乱。
    body: |-
      刚从用户态跳进内核时，寄存器里还装满刚才程序算到一半的数值，栈指针也还指着不可信的用户栈。所以入口汇编代码先不急着去打印 hello，第一件事是把栈指针切到这个进程专属的内核栈，再把所有用户寄存器、返回地址和标志位打包存成一份结构体（比如教学内核 xv6 里就叫 trapframe）。

      现场存稳之后，后面的工作就和写普通 C 函数一样了——函数调用链全压在干净的内核栈上，办完事或者半路出岔子时，只要把这份存档原样装回寄存器，程序就能从断点接着跑，丝毫察觉不到中间进出过一趟内核。

      等一下，为什么内核不能大家共用一张内核栈，非要每个进程各发一张？因为可能同时有好几个进程陷在内核里——比如进程 A 调 read 等磁盘睡着了，内核切换到进程 B，B 这时也调 write 进内核；再加上外设中断随时可能半路插队。如果大家共用一张栈，调用记录立刻互相覆盖；同时把内核栈和用户栈彻底分开，也保证内核不会受用户栈里恶意数据的影响。
