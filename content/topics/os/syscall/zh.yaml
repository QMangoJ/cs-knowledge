    messages:
    - id: m-return-and-cost
      from: k
      to: p
      label: 返回结果，切回用户态
      active: true
  log:
  - mode: 内核态 → 用户态
    event: 带着结果返回，程序继续执行
- id: vdso
  title: 不进内核的“系统调用”：vDSO
  tldr: 有些只读的小请求，内核干脆把答案放到用户态，省掉一趟切换。
  body: '像“现在几点”这种调用非常频繁，每次都陷入内核太亏。

    Linux 把一小段内核提供的代码和数据映射进每个进程（叫 vDSO），clock_gettime、gettimeofday 通常直接在用户态读出结果。

    这就像前端把不常变的数据放在本地缓存，不必每次都请求后端。'
  derivation: original
  sources:
  - ref: ostep
    locator: Limited Direct Execution 一章
    claim: 有些只读的小请求，内核干脆把答案放到用户态，省掉一趟切换。
    status: unverified
    note: 按 Daniel 决定不核对出处
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: p
      label: 程序
      highlight: true
