  - id: vdso
    title: 不进内核的「系统调用」：用 [[vDSO]] 省掉过门费
    tldr: 对于查时间这种极高频、人人可读又毫无副作用的动作，Linux 直接把只读时间页和核准代码映射进每个进程（vDSO），在用户态就地算完，一趟内核都不进。
    body: |-
      既然过门这么贵，遇到一个既高频又只读的请求，比如程序打日志时频繁调 clock_gettime 问「现在几点」，能不能干脆别进内核？Linux 给的答案就是 [[vDSO]]（虚拟动态共享对象）：内核启动或创建进程时，干脆把一页自己持续更新的时间数据，连同一小段经过核准的代码，直接以只读方式映射进每个进程的地址空间里。

      程序调用 clock_gettime 时，[[glibc]] 会直接跳去执行进程自己地址空间里的这段 vDSO 代码：读取那页实时更新的基准时间，再结合处理器的时间戳计数器算出精确时刻，全程停在 Ring 3 用户态，连一次 syscall 陷入都省了——就好像前端把全局只读配置放在本地内存，不用每毫秒都找后端发接口。

      最后送你一套判断任何系统调用的「三问口诀」——一问「有没有必要过门」（高频、无副作用、不鉴权才可能走 vDSO 旁路，凡涉及写文件或改状态必须老实过门）；二问「这趟花了多少次」（能不能用缓冲攒批把次数压下来）；三问「出错先看谁」（先验返回值是不是 -1，再去读 errno）。把这三问记牢，系统调用这一关就通透了。
    derivation: original
    sources:
