- id: syscall-door
  title: 发起系统调用：敲响内核的门
  tldr: 系统调用是程序主动请求内核服务的唯一受控入口。
  body: '程序调用 printf，最终由 C 库（glibc）执行 x86-64 的 syscall 指令，并带上“我要哪种服务”的编号。

    这条指令触发“陷入”，把控制权交给内核。

    程序只能说“我要什么”，跳到内核的哪段代码由内核事先定好；用 strace 就能看到一个程序发出的全部系统调用。


    这里要分清三层：你写的 printf 是 C 库函数，它先把数据放进 stdio 缓冲区，攒够或遇到换行（输出到终端时）才调用 write 包装函数，包装函数再执行 syscall 指令。误解澄清：用 strace 看不到 write，不等于程序没输出——数据可能还躺在用户态缓冲区里，直到 fflush 或程序退出才真正发出系统调用。把输出重定向到文件时 stdio 变成全缓冲，strace 里 write 出现的位置会明显靠后，就是这个原因。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: syscall(2)、strace(1)
    url: https://man7.org/linux/man-pages/man2/syscall.2.html
    claim: x86-64 Linux 通过 syscall 指令进入内核；strace 可跟踪系统调用
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
