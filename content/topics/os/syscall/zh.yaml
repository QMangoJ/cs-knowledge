  - id: kernel-entry
    title: 内核入口：先保存现场，再分头处理
    tldr: 进了内核，第一件事不是干活，而是先把现场存好。这一步看入口代码怎样切到这个进程专属的内核栈、把用户寄存器存成一份记录，之后的处理才能像普通函数调用一样进行；并说清为什么每个进程都要有一张独立的内核栈，不能大家共用一张。
    body: |-
      跳进内核后先不干活，先保存现场：入口代码切到这个进程专属的内核栈，把用户寄存器和返回地址存成一个结构体，之后的 C 代码就把这次请求当成一次普通函数调用来处理，出问题时也靠这份存档恢复。

      为什么每个进程要一张独立的内核栈？多个进程可能同时陷在内核里，中断也可能在内核执行中途到达——现场分开存放，各自的调用链才不会互相污染。用户栈是进程自己的、内容不可信；内核栈只放内核数据，两者分开存放，内核才不会被用户给的数据带偏。
    derivation: original
    sources:
      - ref: ostep
        locator: Limited Direct Execution 一章，trap handler
        claim: 陷入时硬件与内核协作保存用户状态，返回时恢复
