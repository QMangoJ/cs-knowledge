steps:
  - id: need-kernel
    title: 程序想做一件只有内核能做的事
    tldr: 先摆一个每个程序每天都在做的动作：往终端打印一行字。程序自己没有权限直接碰终端、磁盘或网卡，这一步先说清为什么必须这样管——如果谁都能直接操作硬件，一个写错地址的程序就能毁掉别人的数据，两个程序同时写一个文件还会互相覆盖。后面那扇受控的门，就是为这个场面设的。
    body: |-
      程序想在终端上打印一行字，但它没有权限直接操作屏幕、磁盘或网卡。如果谁都能直接碰硬件，一个出错的程序就可能写坏磁盘，或者偷看别的程序的数据——网页里的脚本同样读不到用户电脑上的任意文件，只能调用浏览器开放的接口，道理相同：能力必须经一个受控入口发放。

      这道门不是一开始就有的。早期的计算机一次只跑一个程序，程序直接操作硬件不会影响到别人，也就不需要这层管制。后来一台机器开始同时跑多个程序、给多个用户分时使用，一个程序写错地址就可能连累所有人，硬件这才分出用户态与内核态两种权限：硬件只归内核管，普通程序想用硬件只能经系统调用这道门提出申请。系统调用解决的就是多程序共用一台机器之后新出现的问题：怎样让程序还能用上硬件，又不能绕过内核直接碰硬件。

      还不只是防破坏：两个程序同时往同一个日志文件末尾写，各自直接操作磁盘就会算出同一个写入位置，后写的覆盖先写的；由内核代办，带 [[O_APPEND]]（打开文件时声明每次写都自动追加到文件末尾）的 write 会在内核里串行完成，不会互相踩。硬件上也堵死了绕路：用户程序在 Ring 3 执行碰硬件的特权指令，CPU 会直接触发异常把控制权交给内核——不是程序自觉，是它根本做不到。
    derivation: original
    sources:
      - ref: ostep
        locator: Limited Direct Execution 一章
        claim: 用户程序不能直接执行 I/O 等受限操作
