steps:
  - id: need-kernel
    title: 程序想往屏幕打字，硬件却不归它管
    tldr: 终端屏幕、磁盘和网卡都由所有程序共用，谁都能直接操作就会互相踩坏数据；所以硬件只归内核管，普通程序想往终端打印一行字，只能走系统调用这道唯一的门请内核代办。
    body: |-
      回到我们的 C 程序：它只是想在屏幕上印出 hello 这几个字，为什么不能自己把字符直接送到显卡或终端设备？设想一台电脑上同时跑着浏览器、编辑器和你的终端程序，如果任何程序都能绕开管理直接写磁盘扇区或显存，只要程序里一个指针算错了地址，就能把别人的文件覆盖掉，甚至顺手读走隔壁进程的内存密码——就像浏览器里的网页脚本不能随便读你硬盘上的文件，只能调用浏览器开放的接口，能力必须收口发放。

      这层隔离是从多任务时代长出来的。早期机器一次只跑一个程序，程序直接操作硬件不会撞到谁；等一台机器同时伺候多个程序后，硬件才把执行权限拆成两档：受限的用户态（x86 架构里叫 Ring 3）和拥有全部权限的内核态（Ring 0）。普通程序平时老实待在用户态，如果硬在代码里写一条直接访问硬件的特权指令，处理器硬件会当场拉响异常、把控制权收归内核——不是程序讲礼貌，是硬件压根不让它碰。

      收归内核统一代办还有另一层好处：排队不打架。假如两个程序同时往同一个日志文件末尾写数据，各自直接写磁盘就会算出相同的末尾偏移量，后写的把先写的盖掉；交给内核串行处理，打开文件时带上 [[O_APPEND]]（声明每次写入都自动接在文件末尾），内核就能把两次写稳稳接成先后两段。既然硬闯被硬件堵死、各自写又会撞车，程序就只能老老实实敲内核那扇门。
