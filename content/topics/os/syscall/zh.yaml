- id: mode-switch
  title: 切到内核态
  tldr: CPU 有两种模式，陷入时从用户态切到内核态。
  body: 'CPU 自己记着当前是“用户态”还是“内核态”，用户态里很多操作会被硬件直接拦下。

    陷入发生时，CPU 记下程序停在哪里，切换到内核态，从内核指定的入口开始执行。

    这种切换由硬件保证，程序没法自己把自己变成内核态。


    把机制拆开看：x86-64 的 syscall 指令本身不查表、不压栈，它只做几件硬件动作——把返回地址存进 RCX、把标志寄存器存进 R11、从 MSR 里取出预先登记的内核入口地址跳过去，并把特权级升到 Ring 0；内核入口代码随即切换到该进程的内核栈，再把用户寄存器逐个保存下来。这也是它比老式 int 0x80 快的原因：硬件动作被压到最少，剩下的保存工作由内核代码按需完成。注意切换模式不等于切换地址空间：这次陷入通常不换页表，内核代码本就映射在每个进程地址空间的高半区，只是用户态时受权限位保护碰不到。'
  derivation: original
  sources:
  - ref: ostep
    locator: Limited Direct Execution 一章，用户模式与内核模式
    claim: 处理器区分用户模式和内核模式，trap 时切换到内核模式
    status: verified
