      highlight: true
    messages:
    - id: m-check-and-do
      from: k
      to: h
      label: 输出文字
      active: true
  log:
  - mode: 内核态
    event: 检查参数，通过后驱动硬件完成输出
- id: errno
  title: 返回值与 errno：失败怎么告诉程序
  tldr: 系统调用失败时返回 -1，具体原因放在 errno 里。
  body: '内核把结果当返回值交回：成功时是有意义的数（比如写了几个字节），失败时 C 库包装函数返回 -1。

    具体原因记在全局变量 errno 里，比如 ENOENT 表示文件不存在、EACCES 表示没权限，用 perror 或 strerror 能变成人读的话。

    所以写系统级代码要养成习惯：每次调用都检查返回值，就像前端每次 fetch 都要看 response.ok。'
  derivation: original
  sources:
  - ref: ostep
    locator: Limited Direct Execution 一章
    claim: 系统调用失败时返回 -1，具体原因放在 errno 里。
    status: unverified
    note: 按 Daniel 决定不核对出处
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: p
      label: 程序
      highlight: true
    - lane: kernel
      id: k
      label: 内核
    - lane: hw
      id: h
      label: 硬件（终端）
    messages:
    - id: m-errno
      from: k
      to: p
      label: 返回 -1，errno = ENOENT
