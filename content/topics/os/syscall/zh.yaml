  - id: errno
    title: 失败怎么报信：返回值 -1 与 [[errno]]
    tldr: 内核出错时在寄存器里返回小负数错误码，C 库收到后转存进线程私有的 errno 再统一返回 -1；读错因前务必先确认返回值确是 -1，以免读到上一次残留的旧值。
    body: |-
      干活顺利的话，sys_write 把实际写出的 6 字节塞回 rax 就完事了；但如果半路卡住——比如打开文件时文件根本不存在、或者程序没有写权限——内核得把「为什么失败」传出来。它在内部约定用小负数代表错误：当返回值为 -4095 到 -1 之间时，说明出错了，比如 -2 代表文件不存在，-13 代表没权限。

      [[glibc]] 包装函数拿到这个负数后，会干两件事：先把负号去掉（-2 变成正数 2，也就是 [[ENOENT]]；-13 变成 [[EACCES]]），填进当前线程私有的全局变量 errno 里，然后再把函数返回值统一改成 -1 交给你的代码。平时用 perror 打印出错原因时，它就是靠读这个 errno 把数字 2 翻成人话「No such file or directory」的。

      这里藏着系统编程最容易踩的坑：成功的系统调用绝对不会顺手把 errno 清零。假设上一次打开文件失败把 errno 设成了 2，紧接着这次 write(1, "hello\n", 6) 明明成功返回了 6，errno 里躺着的却还是 2！所以永远记住铁律：先拿返回值判断成败，只有确认返回值等于 -1 时，才去读 errno 找原因。
    derivation: original
    sources:
