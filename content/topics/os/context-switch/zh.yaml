- id: timer
  title: 时钟中断：把控制权拿回来
  tldr: 硬件定时器定期发出中断，强制让内核接手。
  body: '程序在跑时，内核并没有在执行，没法“主动”把 CPU 抢回来。

    所以内核事先设好硬件定时器，时间一到就产生中断，CPU 自动陷入内核。

    这样即使程序写了死循环，也霸占不了整台机器。


    机制再深一层：时钟中断属于外部中断，CPU 完成当前指令后自动保存最基本的返回现场、跳到内核预先登记的中断处理入口，全程不由正在运行的程序配合——它连中断发生了都不知道。频率上有个权衡：中断太频繁，光处理中断本身就吃掉可观 CPU；太稀疏，抢占就不及时。另一个要点是分工：时钟中断只负责把门敲开，进门后要不要真的换人、换谁，由调度器根据时间片与优先级再决定，很多次中断只是检查一下又返回原进程继续跑。


    顺带分清一对近亲：中断来自 CPU 外部的事件（时钟、网卡、磁盘），异常来自当前指令自身（除零、缺页、陷入指令）。时钟中断是中断而不是异常，它可以在任何指令边界打断任何程序，与程序自己写了什么无关——这正是抢占能成立的物理基础；异常则只会由正在执行的那条指令引发。'
  derivation: original
  sources:
