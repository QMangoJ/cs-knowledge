      to: k
      label: 时钟中断：时间到
      active: true
  log:
  - mode: 进入内核态
    event: 时钟到点，CPU 陷入内核
- id: save
  title: 保存现场
  tldr: 内核把程序 A 停下时的运行现场保存起来。
  body: '“现场”（上下文）就是程序运行到哪一步、手头的中间结果是什么。

    内核把它存进 A 自己的记录里，就像游戏存档。

    存档完整，A 以后就能原样接着跑，察觉不到自己被打断过。'
  derivation: original
  sources:
  - ref: ostep
    locator: Limited Direct Execution 一章，上下文切换
    claim: 切换时内核保存当前进程的上下文
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
  canvas:
    kind: swimlane
    actors:
    - lane: procs
      id: a
      label: 程序 A
    - lane: procs
      id: b
      label: 程序 B
    - lane: kernel
      id: k
      label: 内核（调度器）
      highlight: true
    - lane: hw
      id: t
