- id: process-states
  title: 进程状态机：运行、就绪、阻塞之间怎么转
  tldr: 只有运行与就绪在争 CPU；阻塞细分 S 与 D，D 长驻不退往往是存储出了问题。
  body: '把状态机走一遍：新进程从就绪态排队，被调度器选中进入运行态；运行中发起 read 等磁盘，它主动让出 CPU 进入阻塞态，数据到达后被中断处理程序改回就绪态、重新排队；运行中时间片耗尽则被抢占回就绪态。

    三个要点：第一，只有运行态与就绪态的进程在争 CPU，阻塞态进程等再久也不耗 CPU，判断机器忙不忙要看就绪队列长度而不是进程总数。第二，Linux 把阻塞细分出可中断睡眠 S 与不可中断睡眠 D：D 多出现在等待磁盘等硬件完成的短窗口，信号都叫不醒，长期 D 往往意味着存储或网络文件系统出了问题。第三，top 里的 load average 数的是运行加不可中断睡眠的进程数，所以 load 高不一定 CPU 忙，也可能是磁盘在堵车，排查时要先分清是哪一种。'
  derivation: original
  sources:
  - ref: ostep
    locator: Processes 一章，进程状态
    claim: 进程在运行、就绪与阻塞三态之间转换，I/O 完成时由阻塞回就绪
