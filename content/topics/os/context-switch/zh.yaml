  - id: restore
    title: 恢复现场，把直接开销和隐性缓存账一起算清
    tldr: 恢复程序 B 跑起来只需要几微秒的寄存器搬运，但真正的天价账单在后面——它上来后发现处理器缓存和地址翻译表里全是程序 A 的旧货，接下来大批内存读取全都大幅变慢。
    body: |-
      挑出程序 B 之后，动作和刚才保存正好反过来：内核先换上 B 的内核栈，必要时切好 B 的页表，把 B 上次停下时存好的通用寄存器、栈指针和程序计数器装回硬件，再执行返回指令跳回用户态，B 就从上次被掐断的那一行指令毫无察觉地接着往下跑。

      现在把换一次人的「总账单」一笔笔摊开。第一笔是明面上的直接开销：进出内核、存旧寄存器、装新寄存器、跑调度器选人，现代处理器上加起来大约次微秒到几微秒。假设每次算 2 微秒，一个核心每秒切换 1 万次，光换人动作本身就花掉 20,000 微秒（0.02 秒），占掉单核 2% 的时间；要是每秒狂切 10 万次，光换人就直接烧掉 20% 算力。

      第二笔是常被忽视、却往往更贵的隐性开销：缓存变冷。A 跑了好几毫秒，L1/L2 高速缓存和快表（[[TLB]]，专门缓存虚拟地址到物理地址翻译结果的小高速表）里早塞满了 A 的热数据和地址映射。B 一上来，L1 缓存里的热数据对它没用、TLB 映射也对不上号，接下来 B 读的头几百上千个数据都得穿过几层缓存、甚至走 100 纳秒量级的主内存去慢吞吞重查页表，直到慢慢把缓存重新捂热。顺带一提，Linux 把切换分成「主动切换」（自己等 [[I/O]] 或等锁让出）和「被动切换」（时间片用完或被抢占）：被动飙高多半是核不够用，主动飙高则多半是程序锁竞争激烈或 I/O 拆得太碎，治病方向截然相反。
    derivation: original
    sources:
