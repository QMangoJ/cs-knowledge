- id: save
  title: 保存现场
  tldr: 内核把程序 A 停下时的运行现场保存起来。
  body: '“现场”（上下文）就是程序运行到哪一步、手头的中间结果是什么。

    内核把它存进 A 自己的记录里，就像游戏存档。

    存档完整，A 以后就能原样接着跑，察觉不到自己被打断过。


    现场具体包括什么？通用寄存器、程序计数器、栈指针、浮点与向量寄存器状态，还有内核为这个进程记着的页表根地址等控制信息。走例算笔账：光通用寄存器就有十几个、每个 8 字节，向量寄存器若全保存又是几百字节，保存加恢复本身是纯搬运。容易漏掉的是浮点与向量状态：它体积大又不是每个进程都用，内核常采用懒保存——谁真用了浮点单元，切换时才保存谁的，没用的进程切换就便宜些，这也是直接成本随机器与工作集变化的原因之一。


    还有个常被忽略的现场：进程可能是在系统调用中途（比如正等着磁盘数据）被换下的，它的内核调用链也要原样冻住，等数据到达再从内核里接着走。所以上下文不只是用户态那组寄存器，而是用户现场加内核现场两层存档，缺任何一层都无法真正续跑，这也是理解阻塞与唤醒机制的前提。'
  derivation: original
  sources:
