- id: schedule
  title: 调度：选下一个上场的程序
  tldr: 调度器从“准备好运行”的程序里挑一个。
  body: '在等键盘、等网络的程序先跳过，只看准备好运行的。

    Linux 的 CFS 会挑“目前用 CPU 最少”的那个，力求公平；6.6 版起换成 EEVDF，在公平之外更照顾需要快速响应的任务。

    用 nice 调整优先级，就是在影响这个选择。


    把 CFS 的公平算一遍：每个任务记一个虚拟运行时间 vruntime，实际运行 1 毫秒会按权重折算，权重越低折算涨得越快，于是低优先级任务的 vruntime 很快排到后面；调度器用红黑树按 vruntime 排序，每次挑最小的那个上场。走例：两个同权重任务轮流跑，vruntime 交替领先，谁落后谁先上，长期看各占一半 CPU；一个权重为另一个四分之一的任务，大约只能分到五分之一的时间。EEVDF 在此之上引入截止时间的意识：睡眠后刚醒来、有交互截止需求的任务会被适当提前，兼顾公平与响应。'
