  - id: policy
    title: 调度要权衡什么
    tldr: 调度器要在吞吐、响应速度和公平之间取舍，没有一种策略全都最好。
    body: |-
      调度器要在三件事之间取舍：后台批处理希望少被打断、整体做得快（吞吐）；交互程序希望一按键就有反应（响应）；所有程序还希望分得公平。时间片是直接的旋钮：切得短，响应快但切换次数多；切得长，切换开销小但交互会卡。

      这笔账可以量化感觉一下：若每个任务一次连跑约毫秒量级、每次切换约 1 微秒，切换开销只占千分之一量级；但任务数上到成千上万，切换与缓存抖动就会明显吃掉吞吐——这也是服务要控制并发线程数的原因。至于先来先服务、短作业优先、多级反馈队列各自的取舍，在「线程与调度」一课里细算，本课的结论只有一句：不存在全都最好的策略，只有对场景的取舍。
