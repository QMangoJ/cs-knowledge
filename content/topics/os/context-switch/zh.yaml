- id: policy
  title: 调度要权衡什么
  tldr: 调度器要在吞吐、响应速度和公平之间取舍，没有一种策略全都最好。
  body: '后台批处理任务希望少被打断、整体做得快（吞吐）；交互程序希望一按键就有反应（响应时间）。

    时间片短，响应快但切换多；时间片长，切换少但交互会卡。

    教科书里的先来先服务、短作业优先、轮转、多级反馈队列，都是在这几者之间做不同的取舍；Linux 的 CFS/EEVDF 按“谁用得少谁先上”来兼顾。


    数字例子：Linux 的 CFS 给每个可运行任务按权重分配虚拟运行时间。8 个同权重任务在 1 个核上轮转，每个任务一次能连续跑约毫秒量级——按每次切换约 1 μs 估算，开销占比约千分之一量级；但若任务数上千，切换与缓存抖动就会明显吃掉吞吐，这也是推理服务要控制并发线程数的原因。'
  derivation: original
  sources:
  - ref: ostep
    locator: CPU 虚拟化 / Limited Direct Execution 一章
    claim: 调度器要在吞吐、响应速度和公平之间取舍，没有一种策略全都最好。
    status: verified
