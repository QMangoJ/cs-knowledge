- id: restore
  title: 恢复另一个程序，以及切换的代价
  tldr: 内核载入 B 的存档并回到用户态；但切换并不免费。
  body: '内核恢复 B 的现场并返回用户态，B 接着跑，直到下一次被打断或自己去等待。

    每次切换都要存档、读档，还会让 CPU 缓存“变冷”。

    切换分两种：程序自己去等 I/O 是“主动”的，时间片用完被换下是“被动”的，/proc 里能分别看到。


    恢复与保存是对称的：把 B 的寄存器与栈指针装回去、必要时换上 B 的页表根，执行返回用户态的指令，B 就从上次被打断的那条指令继续。两种切换的观测方法：grep 当前进程 status 里的 voluntary 与 involuntary 两行，前者是自己去等 I/O 或锁的主动让出，后者是时间片用完或被更高优先级抢走的被动切换；一个服务被动切换暴涨通常说明核不够用，主动切换暴涨多半是锁竞争或小粒度 I/O 太碎。线程切换便宜的原因也在这里：同进程线程共享页表，恢复时不用换页表根，TLB 也不必大批失效。'
  derivation: original
  sources:
