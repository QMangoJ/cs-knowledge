  log:
  - mode: 内核态
    event: 保存程序 A 的上下文
  code:
    lang: text
    code: '保存现场 ≈ 把寄存器组、PC、栈指针存进进程的上下文记录（概念上称 PCB；Linux 实际存在内核栈与 task_struct 里）

      恢复现场 ≈ 从另一个 PCB 读回寄存器并跳过去执行

      直接成本：现代机器上约次微秒到数微秒（随机器与工作集变化）；缓存/TLB 冷启动的间接成本常常更高'
    note: 伪代码
- id: schedule
  title: 调度：选下一个上场的程序
  tldr: 调度器从“准备好运行”的程序里挑一个。
  body: '在等键盘、等网络的程序先跳过，只看准备好运行的。

    Linux 的 CFS 会挑“目前用 CPU 最少”的那个，力求公平；6.6 版起换成 EEVDF，在公平之外更照顾需要快速响应的任务。

    用 nice 调整优先级，就是在影响这个选择。'
  derivation: original
  sources:
  - ref: linux-kernel-docs
    locator: scheduler/sched-design-CFS、sched-eevdf
    url: https://docs.kernel.org/scheduler/sched-eevdf.html
    claim: CFS 按虚拟运行时间公平调度；EEVDF 在 6.6 中取代 CFS
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
