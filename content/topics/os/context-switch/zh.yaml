  - id: multicore
    title: 多核：每个核心各自轮转
    tldr: 有多个核心时，每个核心有自己的运行队列，调度器还要在核心之间搬任务。
    body: |-
      多核上，几个程序是真的同时在跑，但每个核心内部仍然在分时轮换。Linux 给每个核心一条运行队列，各核心先用自己的队列，忙闲不均时再由负载均衡把任务搬给闲的核心。

      搬家有代价：任务刚在原核心把数据读进该核缓存，搬到别的核心后这些缓存全部作废、要重新从内存取。所以调度器倾向让任务留在原核心（亲和性），数据库等服务还会用绑核把关键线程钉在固定核心上。绑核是双刃剑：绑得太死，某个核过载而邻核空闲时，调度器也救不了。
    derivation: original
    sources:
      - ref: ostep
        locator: CPU 虚拟化 / Limited Direct Execution 一章
        claim: 有多个核心时，每个核心有自己的运行队列，调度器还要在核心之间搬任务。
