- id: multicore
  title: 多核：每个核心各自轮转
  tldr: 有多个核心时，每个核心有自己的运行队列，调度器还要在核心之间搬任务。
  body: '多核上，几个程序是真的同时在跑，但每个核心内部仍然在分时轮换。

    Linux 给每个核心一条运行队列，忙的核心会把任务“分”给闲的核心（负载均衡）。

    但任务搬到别的核心后，原来缓存里的数据用不上了，所以调度器倾向让任务留在原核心（亲和性），taskset 可以手动指定。


    工程注记：vmstat 的 cs 列（每秒上下文切换次数）是现成的观测点：空载也常有上千次；从经验看，若推理服务的 cs 冲得很高且吞吐不动，多半是线程开太多在互相抢核。'
  derivation: original
  sources:
  - ref: ostep
    locator: CPU 虚拟化 / Limited Direct Execution 一章
    claim: 有多个核心时，每个核心有自己的运行队列，调度器还要在核心之间搬任务。
    status: verified
