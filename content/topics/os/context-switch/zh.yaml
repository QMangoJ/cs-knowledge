steps:
- id: illusion
  title: 问题：一个 CPU 怎么跑多个程序
  tldr: “同时运行”其实是轮流运行得足够快。
  body: '电脑上有几百个进程，CPU 核心却只有几个。

    操作系统让它们轮流使用 CPU，每次只用一小段时间，快到人感觉不出来。

    这叫“分时”：把 CPU 时间切成小片分给大家。'
  derivation: original
  sources:
  - ref: ostep
    locator: CPU 虚拟化 / Limited Direct Execution 一章
    claim: 操作系统通过分时共享制造多个 CPU 的假象
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
  canvas:
    kind: swimlane
    actors:
    - lane: procs
      id: a
      label: 程序 A
      highlight: true
    - lane: procs
      id: b
      label: 程序 B
    - lane: kernel
      id: k
      label: 内核（调度器）
    - lane: hw
      id: t
      label: CPU 与时钟
    messages: []
  log:
  - mode: A 运行中
    event: 程序 A 正在使用 CPU
  points:
  - “同时运行”其实是轮流运行得足够快。
- id: timer
  title: 时钟中断：把控制权拿回来
  tldr: 硬件定时器定期发出中断，强制让内核接手。
  body: '程序在跑时，内核并没有在执行，没法“主动”把 CPU 抢回来。

    所以内核事先设好硬件定时器，时间一到就产生中断，CPU 自动陷入内核。

    这样即使程序写了死循环，也霸占不了整台机器。'
  derivation: original
  sources:
  - ref: ostep
    locator: Limited Direct Execution 一章，时钟中断
    claim: 时钟中断让操作系统重新获得 CPU 控制权
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
  canvas:
    kind: swimlane
    actors:
    - lane: procs
