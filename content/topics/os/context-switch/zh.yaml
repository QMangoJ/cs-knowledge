  - id: schedule
    title: 调度选人：用虚拟运行时间当账本挑下一个
    tldr: 等磁盘或等键盘的进程根本不进候选池，调度器只从就绪队列挑人；Linux 靠按权重折算的「虚拟运行时间」记账，每次直接点账面最小的那个人上场。
    body: |-
      A 的现场封存妥当，调度器就从「所有已经准备好、只差一个 CPU 就能跑」的就绪队列里挑人——那些还在等磁盘读完或等用户敲键盘的进程，给它核心也干不了活，直接跳过。

      该按什么规矩挑？Linux 长期使用的 [[CFS]]（完全公平调度器）办法非常直觉：给每个任务记一本账，叫做虚拟运行时间（vruntime）。举个数字例子：假设标准权重下跑 1 毫秒账本加 1 毫秒；程序 A 跑了 10 毫秒，账本记 10；刚醒来的程序 B 之前只跑了 4 毫秒，账本记 4。下次时钟一到，调度器拿红黑树一瞄，直接把账本最小的 B（4 < 10）叫上场，直到 B 追上或反超。平时用 nice 命令调进程优先级，改的就是这个折算权重——高优先级任务跑 1 毫秒，账本只涨 0.5 毫秒，自然就能多分到一倍真实 [[CPU]] 时间。

      不过只看过去账本也有小短板：交互程序偶尔醒来想立刻回个按键，未必等得了慢吞吞的公平排队。所以 Linux 从 6.6 内核起把默认调度器换成了 [[EEVDF]]，在保证长期公平的基础上，给刚醒来、需要快响应的任务补了一条虚拟截止期限，挑人的手艺更精细了。至于多种经典调度算法的全面对比，下一课「线程与调度」再展开算。
