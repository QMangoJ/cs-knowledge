level: 基础
minutes: 20
prereq:
  - os/syscall
objectives:
  - 描述时钟中断如何抢占正在运行的进程
  - 列出上下文切换要保存/恢复的状态
  - 区分自愿与非自愿上下文切换并估算成本
aiLink: LLM 推理是典型的 CPU/GPU 协同流水线：Python 线程被 GIL 与上下文切换卡住时 GPU 就在等数据。理解切换成本与调度策略，才明白为什么推理框架用异步事件循环、单独的数据加载进程和 CPU 绑核来压榨吞吐。
design:
  - mechanism: 时钟中断抢占：把闹钟装在硬件里，强制拿回 CPU 控制权
    problem: 程序跑起来的时候内核根本没在运行，软件没法在自己不被执行的时候插手抢回处理器；要是等程序写代码自觉让位，一个死循环或者恶意代码就能让整台机器彻底卡死。
    choice: 利用可编程硬件定时器每隔几毫秒发出一次由内核控制的时钟中断，时间一到 CPU 自动停下手头指令跳进内核。早年试过让程序自觉让步的协作式调度，结果任何小 bug 都全机瘫痪；指望系统调用顺手换人也靠不住，因为纯算数学的程序可以好几秒一次系统调用都不调。
    tradeoff: 即使只有一个程序在跑也得承担定期被打断的中断开销，调得越密响应越灵敏、耗在中断上的比例也越高；而且内核只能在中断或系统调用的离散瞬间做调度决策，没法做到完美连续优化。
    root: 能管住执行者的力量必须来自执行者之外：只有硬件级异步信号能在不配合的前提下强行打断指令流，先有硬件的强制抢占权，软件层面的任何公平调度算法才立得住脚。
  - mechanism: 虚拟运行时间记账（vruntime）：把权重和消耗折成同一个分数，挑最小的上
    problem: 到底什么叫「公平」很难一碗水端平：按进程人头平分会被开一堆线程的程序占便宜，按未来还要跑多久来算又根本没法预知未来；调度器只能用已经跑过的历史数据来做决定，还要求挑人快到微秒以内。
    choice: 把过去用掉的 CPU 时间按优先级权重折算成一个一维数字（vruntime），存进红黑树里，每次闭着眼挑树上最小的那个人上场。靠固定优先级加固定时间片容易把低优先级活活饿死、还得打一堆老化补丁；靠抽签随机选则在短时间里抖动太大、体验不稳。
    tradeoff: 换来了长期可严格验证的比例公平和清晰的代码结构，牺牲的是对单次唤醒延迟的精确控制——公平不代表按键回显快，所以 Linux 6.6 的 EEVDF 又补上了截止时间维度；另外每次维护红黑树排序本身也有少量开销。
    root: 调度本质是在瞬间从一堆候选里做一次「谁第一」的排序比较，必须先造出一个能互相比较的标量；把权重和时间折进同一把尺子，挑人规则就成了简单的一句「选最小」——选什么尺子，就决定了调度器偏向谁。
  - mechanism: 上下文懒保存：必存的小寄存器当场存，大块头的向量寄存器谁真用再存
    problem: 想让程序下次毫无察觉地续跑，所有寄存器都得原样保全；可现代 CPU 的浮点和向量寄存器动辄上千字节，而大量系统进程只做整型和指针运算根本碰不到它们——每次换人都硬搬上千字节太冤枉。
    choice: 把通用的整数寄存器、程序计数器和栈指针当场打包存进上下文，而把浮点和向量单元设为「延时保存」：换人时不拷贝它、先关掉硬件开关，直到真有程序去碰浮点指令触发异常时才把上一任的状态落盘。全都急切存会让轻量程序白掏过路费，干脆不存又会算错数，懒保存正好把账算在真正用到的头上去。
    tradeoff: 常见整型路径上的切换变轻变快了，代价是内核得额外盯紧「这份向量状态现在归谁、脏没脏」，第一次碰它的那个任务会多吃一次异常落盘的毛刺延迟。
    root: 跟虚拟内存的按需分页、fork 的写时复制完全同宗同源：现实里大部分工作集远小于理论最大状态——先乐观假设这次用不上，真用上了再请硬件异常补齐，把成本精确转嫁给真正的消费者。
quiz:
  - q: 没有时钟中断，抢占式调度会怎样？
    options:
      - 照常工作
      - 一个死循环进程就能永久霸占 CPU，抢占无从发生
      - 只是变慢一点
      - 只能运行一个进程
    answer: 1
    explain: 抢占的依据就是周期性中断把控制权交还内核。
  - q: 上下文切换的直接成本之外，还有哪项隐性成本？
    options:
      - 电费
      - 新进程冷缓存/TLB，接下来一段时间访存变慢
      - 磁盘磨损
      - 网卡重启
    answer: 1
    explain: 寄存器与 PCB 切换本身是微秒级，缓存与 TLB 失效造成的后续变慢往往更大。
  - q: top 里进程状态 R/S/D 中，D 一般指？
    options:
      - 已死亡
      - 不可中断睡眠，多在等 I/O
      - 正在计算
      - 被调试
    answer: 1
    explain: D 状态多见于磁盘/NFS I/O 等待，kill 也打不断。
