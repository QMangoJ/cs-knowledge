subject: os
slug: context-switch
order: 3
status: published
license: CC-BY-4.0
title: 时钟中断与上下文切换：多个程序为什么能“同时”运行
summary: |-
  所谓「同时运行」，本质上是内核靠硬件定时器每隔几毫秒打断一次当前程序，迅速把它的现场存进内存、挑出下一个就绪任务再恢复运行，切换快到人类感官察觉不到。因为正在跑的程序不会主动让出 [[CPU]]，抢占控制权必须依赖外来的时钟中断；而每次换人除了保存恢复寄存器的几微秒直接耗时，更贵的账单在于新程序换上来后缓存和地址翻译表全变冷。全课从分时错觉与时钟中断讲起，顺着保存现场、调度选人、进程状态流转走到恢复现场，最后算清进程切换比线程切换多付了哪些账，以及多核迁移时的缓存损失。
premise: 这节课盯着一个具体画面：你的电脑后台明明挂着音乐播放器、编辑器和浏览器几百个任务，拆开来看，单个 CPU 核心在任何一瞬间却只能执行一条指令流，只跑得动一个程序。这一课就死磕一个单核，看程序 A 和程序 B 是怎样靠几毫秒一次的强制接力轮流上场的——怎么叫停正在狂奔的程序、怎么把半路现场打包存稳、怎么挑出下一个，以及为什么换一次人比想象中贵。
position: 本课留在「进程管理」板块的中段：上一课解决了新进程怎么在系统里诞生，这一课接着解决诞生出来的几十上百个进程怎么共用少数几个处理器核心。这里拆开一次完整切换要搬动的寄存器和页表成本、三种运行状态的流转，以及同进程内线程切换为什么更轻省；理顺了「怎么换人」，下一课就能专心算「到底按什么公平规矩去挑人」。
bridge:
  prev: 上一课讲完怎么用 fork 和 exec 生出新进程，现在终端里的 bash 和刚启动的 ls 都想往下跑，这一课来看内核怎么用时钟中断让它们排好队轮流用核心。
  next: 换人时的存档和开销账已经算清，但一个问题只点了个开头：每次把谁挑上场才既公平又响应快？另外，同住一个进程里的界面线程和下载线程又要怎么管？下一课专门把线程模型和调度算法一起讲透。
overview:
  - key: 一句话总结
    value: 处理器靠硬件定时器的时钟中断强制拿回控制权，把当前任务的寄存器和栈存成现场，再挑出下一个就绪任务装回去接着跑，快到让人以为所有程序都在并发。
  - key: 为什么需要时钟
    value: 程序一旦跑起来，不会自愿把 [[CPU]] 让出来，必须有外力把控制权拿回内核。时钟就是这个外力，它每隔一小段时间发出一次中断，提醒内核回来重新分配 CPU。
  - key: Linux 调度器
    value: Linux 长期使用 [[CFS]]（完全公平调度），尽量让每个任务分到差不多多的处理器时间；从 6.6 版起升级成 [[EEVDF]]，在保证公平的同时更照顾需要快速响应的交互任务。
  - key: 代价
    value: 每次切换都要花时间保存和恢复现场，换上来的程序还会发现 CPU 缓存里留的不是自己的数据，要重新慢慢热起来。所以切换太频繁时，时间会白白耗在换人本身上。
  - key: 类比
    value: JS 事件循环靠任务主动让出：一个任务不跑完，下一个就轮不到，写出死循环页面就冻住；操作系统是强制轮换：程序再不情愿，时钟中断一到也被夺走 CPU
  - key: 进程状态
    value: 进程在运行、就绪（等 CPU）、阻塞（等 [[I/O]]）三种状态之间转换。只有运行和就绪的进程在争 CPU，阻塞的进程是在等外设或数据，轮不到它上场。
  - key: 抢占
    value: 当一个程序的时间片用完，或者有更高优先级的任务准备好了，内核会强制把它换下来，这叫抢占。比如一个后台计算正跑着，用户按了键，处理输入的程序优先级更高，就能先被安排上场。
  - key: 线程切换
    value: 同一进程的线程切换不用换页表，所以比进程切换便宜。因为它们共用同一片内存空间，内核只要换寄存器和栈，地址翻译那一套都不用动。
