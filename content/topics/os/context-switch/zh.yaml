steps:
  - id: illusion
    title: 分时错觉：几百个程序怎么在一个核上「同时」跑
    tldr: 「同时运行」本质上是单个核心每隔几毫秒就把程序轮换一次，一秒切上几百轮，快到人眼和手感都分辨不出停顿。
    body: |-
      打开系统监视器，电脑里动辄躺着两三百个进程，可 [[CPU]] 核心明明只有几个。以一个单核为例，操作系统把时间切成只有几毫秒的小片，让程序 A 跑 4 毫秒、换程序 B 跑 4 毫秒，一秒钟就能来回轮上两百多次。在人的感官里，音乐照放、文字照打，就好像所有程序真的一齐在跑——这套手法叫「分时复用」。

      看这幅图时先抹掉两个常见误会。第一，多核上的任务真能同时算：假如只有 3 个计算任务而电脑有 8 个核心，一人占一个核并行跑就行，根本不用轮流换；只有就绪的任务多过核心数时，才需要靠分时来挤。第二，列表里挂着的几百个进程，绝大多数时间都在「睡觉」等鼠标、等网卡、等定时器，真正排着队争核心的往往就那么几个。

      正因为内核在背后把换人的速度拉到人类感觉不到的量级，平时写代码时你才能放心地按从头到尾的顺序思路写逻辑，完全不用操心「我跑到一半别人怎么插进来」——并发轮换的复杂度全被操作系统吞进了底下。
    derivation: original
    sources:
      - ref: ostep
