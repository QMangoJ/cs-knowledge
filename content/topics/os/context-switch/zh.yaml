          label: 内核（调度器）
        - lane: hw
          id: t
          label: CPU 与时钟
      messages: []
    log:
      - mode: A 运行中
        event: 程序 A 正在使用 CPU
    points:
      - “同时运行”其实是轮流运行得足够快。
  - id: timer
    title: 时钟中断：把控制权拿回来
    tldr: 硬件定时器定期发出中断，强制让内核接手。
    body: |-
      程序在跑时，内核并没有在执行，没法「主动」把 CPU 抢回来。所以内核事先设好硬件定时器，时间一到就产生中断：CPU 做完当前指令便自动保存最基本的返回现场、跳到内核预先登记的中断入口，全程不需要正在运行的程序配合——它连中断发生了都不知道。这样即使程序写了死循环，也霸占不了整台机器。

      分清分工：时钟中断只负责把门敲开，进门后要不要真的换人、换谁，由调度器根据时间片与优先级再决定，很多次中断只是检查一下又返回原进程。另外注意中断与异常的区别：中断来自 CPU 外部事件（时钟、网卡、磁盘），可以在任何指令边界打断任何程序；异常来自当前指令自身（除零、缺页）。抢占能成立，靠的正是中断的这种「与程序写了什么无关」。
    derivation: original
    sources:
      - ref: ostep
        locator: Limited Direct Execution 一章，时钟中断
        claim: 时钟中断让操作系统重新获得 CPU 控制权
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
