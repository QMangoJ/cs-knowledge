  - id: timer
    title: 时钟中断：程序不自觉让位，靠硬件定时抢回控制权
    tldr: 程序自己在跑时内核压根没在运行，不可能靠软件主动抢回控制权；只能提前上好硬件定时器发条，时间一到触发时钟中断，硬件无条件把执行权交回内核。
    body: |-
      想一想就会发现一个死结：当程序 A 正霸占着 [[CPU]] 核心全速执行用户指令时，操作系统内核自己并没有在跑，哪来的机会「主动出手」把 A 拉下来？要是干脆指望程序 A 跑两步自觉喊一句「我用够了，换下一个」，万一 A 写了个 while(1) 死循环或者干脆恶意耍赖，整台电脑当场就冻死了——早期协作式调度正是死在这儿，就像浏览器 JS 事件循环里只要写个死循环，整个页面就再也点不动一样。

      解法只能把门锁交给程序之外的硬件：内核交出 CPU 前，先给主板上的硬件定时器设好闹钟（比如每隔几毫秒响一次）。程序 A 跑着跑着闹钟一响，就会立刻触发一次「时钟中断」：CPU 硬件不等 A 同意，自动执行完当前那条正进行的机器指令，把最基本的返回位置压起来，直接跳去执行内核预先登记好的中断入口代码。整个过程 A 连自己被打断过都察觉不到，哪怕代码写死了循环也霸占不住机器。

      顺手分清一对容易混的词：上面这种由外部硬件闹钟、网卡或磁盘按点敲门的事件叫「中断」，它跟当前代码写了什么无关，任何指令边界都能插进来；而像除零出错、访问未分配内存触发缺页，这类由当前指令自己惹出来的麻烦叫「异常」。还要记住：时钟中断只负责把门敲开让内核回到舞台，至于这次到底要不要换人、让谁上，还得由接下来的调度器查账再定。
    derivation: original
