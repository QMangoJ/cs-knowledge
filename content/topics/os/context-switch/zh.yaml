- id: measure-cost
  title: 自己动手量：切换次数到底多少才算病
  tldr: vmstat 看全机 cs，pidstat -w 看单进程；先分清主动与被动，再谈优化方向。
  body: '自己动手量一量：vmstat 1 连看几秒，cs 列是全机每秒上下文切换总次数，空载系统通常也有上千量级（大量是定时醒来的守护进程）；pidstat -w 1 可以落到单个进程，看它的主动与被动切换分别是多少。再做对照实验：起一个纯计算的死循环（被动切换为主）和一个每毫秒睡一次的程序（主动切换为主），两者的构成完全不同。

    解读数字的原则：切换次数本身不是病，病是切换占比——若每秒切换十万次、每次直接成本按约 1 微秒估，就是十分之一的核被切换吃掉，还没算缓存变冷的账；反之一个 I/O 密集服务切换频繁但 CPU 利用率低，说明瓶颈在等待不在切换，优化方向完全不同。先分清主动与被动，再谈优化，是这组数字的正确读法。'
  derivation: original
  sources:
