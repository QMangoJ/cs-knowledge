  - id: restore
    title: 恢复另一个程序，以及切换的代价
    tldr: 内核载入 B 的存档并回到用户态；但切换并不免费。
    body: |-
      恢复与保存对称：内核把 B 的寄存器与栈指针装回去、必要时换上 B 的页表根，执行返回用户态的指令，B 就从上次被打断的那条指令继续，直到下一次被打断或自己去等待。

      切换分两种，成因完全不同：程序自己去等 I/O 或等锁而让出，叫主动切换；时间片用完或被更高优先级任务抢走，叫被动切换。被动切换暴涨通常说明核不够用，主动切换暴涨多半是锁竞争或 I/O 太碎——同一个「切换多」的表象，药方相反，先分清是哪一种。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: proc(5)，/proc/pid/status 中 voluntary_ctxt_switches
        url: https://man7.org/linux/man-pages/man5/proc.5.html
        claim: Linux 分别统计主动与被动上下文切换次数
        status: verified
