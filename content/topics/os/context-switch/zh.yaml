prereq:
- os/syscall
objectives:
- 描述时钟中断如何抢占正在运行的进程
- 列出上下文切换要保存/恢复的状态
- 区分自愿与非自愿上下文切换并估算成本
aiLink: LLM 推理是典型的 CPU/GPU 协同流水线：Python 线程被 GIL 与上下文切换卡住时 GPU 就在等数据。理解切换成本与调度策略，才明白为什么推理框架用异步事件循环、单独的数据加载进程和 CPU 绑核来压榨吞吐。
design:
- mechanism: 时钟中断抢占：用硬件定时器周期性地无条件夺回 CPU 控制权，让内核重新决定谁上场，抢占能力不依赖任何正在运行程序的配合与自觉
  problem: 根本约束是 CPU 执行用户代码时内核根本不在场：没有任何软件能在自己不运行的情况下夺回控制权，而用户程序可能死循环、可能恶意拒绝让出。若夺回控制权这件事依赖被夺回者的配合，整个分时系统在逻辑上就不成立，这是先有鸡还是先有蛋式的硬约束。
  choice: 把夺回动作交给硬件定时器：周期性中断无条件地把 CPU 切进内核预登记的入口。替代方案如协作式让出（程序自觉定期调用 yield），在早期系统上试过，任何一个不自觉或有 bug 的程序都能拖垮全机；如靠程序执行系统调用时顺便调度，则纯计算程序永远不进内核，照样霸占机器。
  tradeoff: 换来无条件的抢占能力，代价是中断本身的固定开销与响应粒度的下限：中断频率越高抢占越及时、开销也越大，这笔账由全机所有进程共同承担；同时调度决策只能在中断与系统调用这些离散时点做，天生只能是近似最优，而非连续时间上的全局最优。
  root: 根源是控制权必须来自执行者之外：与系统调用靠陷入指令同理，只有硬件层面的异步事件能打断指令流。这也是所有抢占式系统都建立在可编程中断控制器之上的原因——先有硬件提供的强制性，才谈得上软件层面的调度策略，顺序不可颠倒。
- mechanism: 虚拟运行时间记账：把每个任务已消耗的、按权重折算过的 CPU 时间记成同一个标量，每次调度挑账本最小者，用一维可比量实现比例公平
  problem: 公平没有天然定义：按进程数均分会让开很多线程的程序占便宜，按线程均分又惩罚正经的并行；同时作业未来的时长根本不可知，任何声称按剩余时间调度的最优策略在信息上都不可实现，调度器只能用已经发生的历史做决定，还要让这个决定足够便宜。
  choice: 用 vruntime 把已消耗的、按权重折算过的 CPU 作为统一账本，每次挑账本最小者，并以红黑树维护排序。替代方案如固定优先级加固定时间片，会出现优先级反转与饥饿，需要再叠一层老化补丁；如抽签式随机调度，公平只是概率意义上的，短时间尺度上抖动很大，用户体感不可控。
  tradeoff: 换来长期可验证的比例公平与实现上的简洁，牺牲的是对延迟的直接控制：公平不等于响应快，交互任务要靠 EEVDF 的截止时间概念再补一维；记账与维护排序树的开销则由每次调度决策分摊给全机，是为公平付的持续小额税。
  root: 根源是把多维诉求压缩成一维可比标量：调度本质是在每个瞬间做一次全序选择，必须先定义可比的量。vruntime 把权重与历史消耗都折进一个数，使选最小成为完备规则——选什么标量，就是选什么价值观，调度算法之争先是记账口径之争。
- mechanism: 上下文的懒保存：必存的小状态在切换时立即保存，大而稀疏的向量寄存器状态谁真正用到谁才保存，让切换成本与实际用到的状态对齐
  problem: 切换要求被换下的进程未来能无感续跑，它的全部执行状态必须一字不差地保存；可状态总量很大（向量寄存器可达上千字节量级），且多数进程多数时候只用其中一小部分，无条件全量保存会让每次切换的固定成本高到吞噬分时本身的收益，小进程被迫替大进程买单。
  choice: 必存的小状态（通用寄存器、栈指针、程序计数器）立即保存，大而稀疏的状态（浮点与向量寄存器）做懒保存：切换时先不存，谁真正使用谁再触发保存。替代方案如全量急切保存，逻辑简单但让轻量进程替重型进程买单；如完全不保存向量状态，则用到浮点的程序计算正确性无从保证。
  tradeoff: 换来常见路径上的低切换成本，代价是机制复杂度：内核要跟踪每份懒状态的归属与脏标记，第一次使用该状态的进程会吃到一次异常加保存的延迟，成本被有意转嫁给真正使用该状态的进程——让付费者与受益者对齐，是这份复杂度换来的公平。
  root: 根源是状态的稀疏性与局部性：执行状态的工作集远小于其总量，这与虚拟内存的按需分页、写时复制是同一个思想——先假设用不到，被现实打脸时再由异常机制补齐。懒惰在这里不是偷工减料，而是由硬件异常撑腰的、有兜底的策略。
quiz:
- q: 没有时钟中断，抢占式调度会怎样？
  options:
  - 照常工作
  - 一个死循环进程就能永久霸占 CPU，抢占无从发生
  - 只是变慢一点
  - 只能运行一个进程
  answer: 1
  explain: 抢占的依据就是周期性中断把控制权交还内核。
- q: 上下文切换的直接成本之外，还有哪项隐性成本？
  options:
  - 电费
  - 新进程冷缓存/TLB，接下来一段时间访存变慢
  - 磁盘磨损
  - 网卡重启
  answer: 1
  explain: 寄存器与 PCB 切换本身是微秒级，缓存与 TLB 失效造成的后续变慢往往更大。
- q: top 里进程状态 R/S/D 中，D 一般指？
  options:
  - 已死亡
  - 不可中断睡眠，多在等 I/O
  - 正在计算
  - 被调试
  answer: 1
  explain: D 状态多见于磁盘/NFS I/O 等待，kill 也打不断。
