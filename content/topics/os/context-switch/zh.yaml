steps:
- id: illusion
  title: 问题：一个 CPU 怎么跑多个程序
  tldr: “同时运行”其实是轮流运行得足够快。
  body: '电脑上有几百个进程，CPU 核心却只有几个。

    操作系统让它们轮流使用 CPU，每次只用一小段时间，快到人感觉不出来。

    这叫“分时”：把 CPU 时间切成小片分给大家。


    给个量级感：假设每个进程每次分到约几毫秒，一秒钟内一个核心就能轮换几百次，显示器刷新率不过每秒 60 到 120 次，人眼根本追不上这种切换。注意分时的前提是进程数多于核心数：8 个核心同时只跑 3 个计算任务时，它们是真并行，不需要轮换；排队只发生在想跑的进程比核心多的时候。误解澄清：任务管理器里几百个进程正在运行，绝大多数其实在睡眠等事件，真正在核心上跑的永远不超过核心数。


    再想一层：正因为切换足够快、每个进程都以为自己在连续运行，程序员才能用最朴素的顺序思维写程序——阻塞调用可以写成同步的样子，变量也不会无缘无故变掉。分时系统把并发的复杂度藏进了内核，只把一个独占 CPU 的幻觉交给每个进程，这个幻觉本身就是最重要的抽象产出。'
  derivation: original
  sources:
  - ref: ostep
    locator: CPU 虚拟化 / Limited Direct Execution 一章
