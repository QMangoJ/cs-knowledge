  - id: save
    title: 保存现场：把半路状态打包存好，甚至分两步懒保存
    tldr: 为了程序 A 以后回来能从被打断的那一微秒无缝接着跑，内核必须把寄存器、程序计数器和内核调用链打包存档；大块头的浮点向量寄存器则用懒保存策略，谁真用了才存谁的。
    body: |-
      钟声把控制权交回内核后，如果决定要把程序 A 换下场，第一件事就是给 A 拍一张完整的「断点快照」，行话叫保存上下文。要存进 A 专属存档（概念上叫进程控制块 [[PCB]]，Linux 里具体落在内核栈和 task_struct 结构体里）的东西包括：装满中间结果的通用寄存器、记住「下一条该执行哪行代码」的程序计数器（[[PC]]）、栈指针，以及页表根地址等控制信息。

      这里藏着两处很多人没注意到的门道。第一，算一笔大小账：现代 CPU 的浮点和向量寄存器（比如 [[SSE]] / AVX）动辄上千字节，要是每次切换不管三七二十一全搬进内存再搬出来，光存这些空寄存器就太亏了。于是内核做了「懒保存」：切换时先只把硬件向量单元关掉、根本不去拷贝这上千字节；等以后哪个程序真用到浮点计算时触发一次异常，内核才急忙把上一位用过它的人的旧数据存盘——谁用才谁买单，普通整型程序切换就轻便多了。

      第二，很多程序并不是在用户态纯计算时被抢下来的，而是自己调了 read 进内核等磁盘数据时主动睡着的。这时光存用户态的寄存器还不够，它陷在内核栈里的半截函数调用链也必须原样冻住——所以完整「现场」其实是用户现场加上内核现场两层档案，缺一角，下次恢复时都接不上。
