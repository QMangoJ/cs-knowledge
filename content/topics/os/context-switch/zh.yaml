          to: k
          label: 保存 A 的现场
          active: true
    log:
      - mode: 内核态
        event: 保存程序 A 的上下文
    code:
      lang: text
      code: |-
        保存现场 ≈ 把寄存器组、PC、栈指针存进进程的上下文记录（概念上称 PCB；Linux 实际存在内核栈与 task_struct 里）
        恢复现场 ≈ 从另一个 PCB 读回寄存器并跳过去执行
        直接成本：现代机器上约次微秒到数微秒（随机器与工作集变化）；缓存/TLB 冷启动的间接成本常常更高
      note: 伪代码
  - id: schedule
    title: 调度：选下一个上场的程序
    tldr: 调度器从“准备好运行”的程序里挑一个。
    body: |-
      在等键盘、等网络的程序先跳过，调度器只从「准备好运行」的程序里挑。Linux 长期用 CFS（完全公平调度）：每个任务记一个按权重折算的虚拟运行时间 vruntime，调度器每次挑 vruntime 最小的上场——谁用得少谁先上，长期看各任务按权重比例分 CPU。用 nice 调整优先级，就是在改这个折算权重。6.6 版起换成 EEVDF，在公平之外更照顾刚醒来、有响应截止需求的任务。

      调度策略本身（短作业优先、多级反馈队列这些）是「线程与调度」一课的主题，本课只关心一件事：挑人的动作发生在时钟中断打开的门里。
    derivation: original
    sources:
      - ref: linux-kernel-docs
        locator: scheduler/sched-design-CFS、sched-eevdf
        url: https://docs.kernel.org/scheduler/sched-eevdf.html
        claim: CFS 按虚拟运行时间公平调度；EEVDF 在 6.6 中取代 CFS
