steps:
  - id: illusion
    title: 问题：一个 CPU 怎么跑多个程序
    tldr: “同时运行”其实是轮流运行得足够快。
    body: |-
      电脑上有几百个进程，CPU 核心却只有几个。操作系统让它们轮流使用 CPU，每次只用一小段时间（约几毫秒量级），一秒内一个核心就能轮换几百次，快到人感觉不出来。这叫「分时」：把 CPU 时间切成小片分给大家。

      两个澄清能帮你看准这幅图：第一，进程数多于核心数时是轮流，3 个计算任务跑在 8 个核心上则是真并行，不需要轮换；第二，任务管理器里几百个「正在运行」的进程，绝大多数其实在睡眠等事件，真正在核心上跑的永远不超过核心数。正因为切换足够快、每个进程都以为自己在连续运行，程序员才能用最朴素的顺序思维写程序——分时把并发的复杂度藏进了内核，只把一个「独占 CPU」的幻觉交给每个进程。
    derivation: original
    sources:
      - ref: ostep
        locator: CPU 虚拟化 / Limited Direct Execution 一章
        claim: 操作系统通过分时共享制造多个 CPU 的假象
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
