id: os/context-switch
subject: os
slug: context-switch
order: 3
status: published
license: CC-BY-4.0
title: 时钟中断与上下文切换：多个程序为什么能“同时”运行
summary: 一个 CPU 核心同一时刻只能跑一个程序，Linux 靠快速轮换制造“同时运行”的效果。
premise: 以一个 CPU 核心上轮流运行两个程序为例。
position: fork 造出的进程再多，单核同一时刻也只能跑一个，本课仍在进程管理板块内，专治众多进程争抢核心的秩序，靠时钟中断这只外力夺回控制权。切换时要存的寄存器与栈指针、虚拟运行时间如何挑出下一个任务，都会逐项摊开。最后你能区分自愿与非自愿切换的触发源，并估算切换本身加上缓存变冷的隐性代价。
bridge:
  prev: fork 与 exec 只解决了进程如何出生，出生后的 ls 与 bash 同时想跑时，本课用周期性时钟中断把排队秩序交给调度器裁定。
  next: 换人的动作已经拆到寄存器一级，但每次挑中的到底是谁、凭什么挑他，本课还没回答；更麻烦的是，界面线程与下载线程同住一个进程时，换人的单位好像也不止进程一种，下课先把单位与挑选规则一起算清。
overview:
  - key: 一句话总结
    value: 时钟定期打断程序，内核保存现场、换另一个程序上场
  - key: 为什么需要时钟
    value: 程序不会自愿让出 CPU，必须有外力把控制权拿回内核
  - key: Linux 调度器
    value: 长期用 CFS（完全公平调度），6.6 版起换成 EEVDF
  - key: 代价
    value: 切换要花时间，还会让 CPU 缓存变冷
  - key: 类比
    value: JS 事件循环靠任务主动让出；操作系统是强制轮换
  - key: 进程状态
    value: 运行、就绪（等 CPU）、阻塞（等 I/O）三态之间转换
  - key: 抢占
    value: 时间片用完或更高优先级任务就绪时，内核强制换人
  - key: 线程切换
    value: 同一进程的线程切换不用换页表，比进程切换便宜
