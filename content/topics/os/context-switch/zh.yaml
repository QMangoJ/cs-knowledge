# 知识优先版草稿。出处仅供参考，按 Daniel 决定不做逐条核对。
id: os/context-switch
subject: os
slug: context-switch
order: 3
status: published
license: CC-BY-4.0
title: 时钟中断与上下文切换：多个程序为什么能“同时”运行
summary: 一个 CPU 核心同一时刻只能跑一个程序，操作系统靠快速轮换制造“同时运行”的效果。
premise: 以一个 CPU 核心上轮流运行两个程序为例。
overview:
  - key: 一句话总结
    value: 时钟定期打断程序，内核保存现场、换另一个程序上场
  - key: 为什么需要时钟
    value: 程序不会自愿让出 CPU，必须有外力把控制权拿回内核
  - key: 上下文
    value: 程序停下时的运行现场，保存好就能原样接着跑
  - key: 代价
    value: 切换本身要花时间，切得太频繁会浪费 CPU
  - key: 类比
    value: JS 事件循环是任务主动让出；操作系统是强制轮换
visual: swimlane
lanes:
  - id: procs
    label: 程序
  - id: kernel
    label: 内核
  - id: hw
    label: 硬件
logColumns:
  - key: mode
    label: 当前状态
  - key: event
    label: 发生了什么
steps:
  - id: illusion
    title: 问题：一个 CPU 怎么跑多个程序
    tldr: CPU 一次只能执行一个程序，“同时运行”其实是轮流运行得足够快。
    body: |-
      你的电脑同时开着几十个程序，但 CPU 核心远没有那么多。
      操作系统让每个程序轮流用一小段时间，切换快到人感觉不出来。
      这叫“分时”：把 CPU 时间切成小片，分给大家。
    derivation: original
    sources:
      - ref: ostep
        locator: CPU 虚拟化 / Limited Direct Execution 一章
        claim: 操作系统通过分时共享制造多个 CPU 的假象
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: swimlane
      actors:
        - lane: procs
          id: a
          label: 程序 A
          highlight: true
        - lane: procs
          id: b
          label: 程序 B
        - lane: kernel
          id: k
          label: 内核（调度器）
        - lane: hw
          id: t
          label: CPU 与时钟
      messages: []
    log:
      - mode: A 运行中
        event: 程序 A 正在使用 CPU
  - id: timer
    title: 时钟中断：把控制权拿回来
    tldr: 硬件时钟每隔一小段时间发出中断，强制让内核接手。
    body: |-
      程序正在运行时，内核根本没在执行，它没办法“主动”把 CPU 抢回来。
      所以要靠硬件：内核事先设好一个定时器，时间一到就触发中断，CPU 自动陷入内核。
      这样即使程序写了死循环，也霸占不了整台机器。
    derivation: original
    sources:
      - ref: ostep
        locator: Limited Direct Execution 一章，时钟中断
        claim: 时钟中断让操作系统重新获得 CPU 控制权
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: swimlane
      actors:
        - lane: procs
          id: a
          label: 程序 A
        - lane: procs
          id: b
          label: 程序 B
        - lane: kernel
          id: k
          label: 内核（调度器）
        - lane: hw
          id: t
          label: CPU 与时钟
          highlight: true
      messages:
        - id: m-timer
          from: t
          to: k
          label: 时钟中断：时间到
          active: true
    log:
      - mode: 进入内核态
        event: 时钟到点，CPU 陷入内核
  - id: save
    title: 保存现场
    tldr: 内核把程序 A 停下时的运行现场保存起来。
    body: |-
      所谓“现场”（上下文），就是程序运行到哪一步、手头的中间结果是什么。
      内核把这些保存到 A 自己的记录里，就像游戏存档。
      只要存档完整，A 以后可以从同一位置继续，完全察觉不到自己被打断过。
    derivation: original
    sources:
      - ref: xv6-book
        locator: 调度章节，上下文切换
        claim: 切换时内核保存当前进程的寄存器等上下文
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: swimlane
      actors:
        - lane: procs
          id: a
          label: 程序 A
        - lane: procs
          id: b
          label: 程序 B
        - lane: kernel
          id: k
          label: 内核（调度器）
          highlight: true
        - lane: hw
          id: t
          label: CPU 与时钟
      messages:
        - id: m-save
          from: a
          to: k
          label: 保存 A 的现场
          active: true
    log:
      - mode: 内核态
        event: 保存程序 A 的上下文
  - id: schedule
    title: 调度：选下一个上场的程序
    tldr: 调度器从“准备好运行”的程序里挑一个。
    body: |-
      不是所有程序都在等 CPU：有的在等键盘输入，有的在等网络，这些先跳过。
      调度器从就绪的程序中选一个，最简单的做法是大家排队轮流。
      更复杂的策略会照顾交互程序，让你打字、点鼠标时反应更快。
    derivation: original
    sources:
      - ref: ostep
        locator: 调度相关章节（如 MLFQ）
        claim: 调度器决定下一个运行的进程，策略影响响应时间与公平性
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: swimlane
      actors:
        - lane: procs
          id: a
          label: 程序 A
        - lane: procs
          id: b
          label: 程序 B
        - lane: kernel
          id: k
          label: 内核（调度器）
          highlight: true
        - lane: hw
          id: t
          label: CPU 与时钟
      messages: []
    log:
      - mode: 内核态
        event: 调度器选中程序 B
  - id: restore
    title: 恢复另一个程序，以及切换的代价
    tldr: 内核载入 B 的存档，回到用户态，B 从上次停下的地方继续。
    body: |-
      内核恢复 B 的现场并返回用户态，B 接着跑，直到下一次时钟中断。
      每次切换都要存档、读档，还会让 CPU 缓存“变冷”，所以并不免费。
      时间片太短浪费在切换上，太长又让程序反应迟钝，这是一种权衡。
    derivation: original
    sources:
      - ref: ostep
        locator: Limited Direct Execution 一章，上下文切换
        claim: 上下文切换恢复另一进程的状态并返回用户态，有性能开销
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: swimlane
      actors:
        - lane: procs
          id: a
          label: 程序 A
        - lane: procs
          id: b
          label: 程序 B
          highlight: true
        - lane: kernel
          id: k
          label: 内核（调度器）
        - lane: hw
          id: t
          label: CPU 与时钟
      messages:
        - id: m-restore
          from: k
          to: b
          label: 恢复 B 的现场
          active: true
    log:
      - mode: B 运行中
        event: 切回用户态，程序 B 继续运行
