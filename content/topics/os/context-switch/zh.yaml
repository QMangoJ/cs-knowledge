  - id: thread-vs-process
    title: 为什么进程切换比线程贵：差在页表和 TLB 冷启动
    tldr: 同进程内的两个线程共享同一份内存地址空间，切换时不用动页表寄存器 [[CR3]]，快表 TLB 里的地址映射大半都能保住；跨进程切换必须换掉整套地址地图，后续访存慢上好一阵。
    body: |-
      先接住一个常见困惑：在 Linux 内核眼里，进程和线程都是一个个独立的调度任务，切换时一样都要存通用寄存器、一样都要换栈指针、一样都要进内核走调度器——那凭什么大家都说「线程切换比进程切换便宜得多」？

      真正的分水岭在地址空间和页表上。如果是进程 A 切换到进程 B，两家各自有一套独立的虚拟内存地图，内核必须改写处理器的页表基址寄存器（x86-64 上就是 [[CR3]]），把地图换成 B 的。这一换可不得了：处理器快表 [[TLB]] 里原本缓存的「虚拟地址 → 物理地址」快捷通道，因为换了地图几乎全部失效（即便现代 CPU 支持带进程标签 [[ASID]] 留住一部分，进程 B 自己的新条目仍得重新填），接下来 B 每摸一次内存都可能被迫多走好几趟慢速页表查找，而且私人数据缓存也基本大换血。

      反观同一个进程里的线程 1 切到线程 2，大家同住一套地址空间，页表根本不用换、CR3 一动不动，TLB 里的热翻译条目几乎原封不动继续有效，L1/L2 缓存里也往往还留着共享数据——省下的正是这笔最贵的「重查页表与冷启动」账单。不过便宜也不能滥用：要是两个线程天天抢同一把互斥锁，切得再快也只是空转；跨进程虽然切换贵，换来的却是一个崩了不拖垮另一个的内存隔离。工程里常用的黄金组合就是「少量进程扛隔离 × 每进程适量线程跑并发」。
    derivation: original
    sources:
      - ref: ostep
        locator: Limited Direct Execution 一章，上下文切换
        claim: 进程切换包含更换地址空间，线程切换共享地址空间因而更便宜
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
