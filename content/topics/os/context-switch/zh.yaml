  - id: thread-vs-process
    title: 线程切换为什么比进程切换便宜，差在哪几笔账
    tldr: 线程共享页表，切换不动 TLB 与地址空间；进程切换贵在换页表与随之而来的翻译冷启动。
    body: |-
      同一进程的两个线程切换，与两个进程切换，差在哪几笔账？进程切换要换页表根（CR3）：新进程的地址翻译在 TLB 里基本没有存货，接下来一段时间要频繁走页表；还要换内核栈、换一整套硬件上下文。线程切换共享地址空间，页表不动、TLB 大体保住，只换寄存器与栈，账小得多。

      所以差距主要不在寄存器搬运（两边都要搬），而在页表切换与 TLB 冷启动的后续效应。但便宜别推过头：两个线程若在抢同一把锁，切换再便宜也是空转；跨进程切换虽贵，换来的是内存与故障隔离。常见的排布因此是少量进程（要隔离）乘每进程适量线程（要便宜的并发），两个极端都会被某一笔账打回来。
    derivation: original
    sources:
      - ref: ostep
        locator: Limited Direct Execution 一章，上下文切换
        claim: 进程切换包含更换地址空间，线程切换共享地址空间因而更便宜
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
