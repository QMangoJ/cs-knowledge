  - id: save
    title: 保存现场
    tldr: 内核把程序 A 停下时的运行现场保存起来。
    body: |-
      「现场」（上下文）就是程序运行到哪一步、手头的中间结果是什么：通用寄存器、程序计数器、栈指针、浮点与向量寄存器状态，以及页表根地址这类控制信息。内核把它存进 A 自己的记录里，就像游戏存档；存档完整，A 以后就能原样接着跑，察觉不到自己被打断过。

      两处不直观：第一，浮点与向量状态体积大又不是每个进程都用，内核常做懒保存——谁真用了浮点单元，切换时才保存谁的，没用的进程切换就便宜些（第 3 条设计细说）。第二，进程可能是在系统调用中途（正等着磁盘数据）被换下的，它的内核调用链也要原样冻住。所以上下文是用户现场加内核现场两层存档，缺任何一层都无法真正续跑。
    derivation: original
    sources:
      - ref: ostep
        locator: Limited Direct Execution 一章，上下文切换
        claim: 切换时内核保存当前进程的上下文
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
