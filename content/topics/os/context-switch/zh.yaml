  - id: process-states
    title: 三态流转：运行、就绪与阻塞（还有叫不醒的 D 状态）
    tldr: 进程在运行、就绪、阻塞三态之间流转，只有前两态真正在抢处理器；排查系统卡顿时看清「不可中断睡眠 D」格外关键，因为系统负载高有时不是算力不够，而是磁盘在堵车。
    body: |-
      把一个任务的完整状态路线跑一遍：刚准备好的新进程先在「就绪态」排队；被调度器挑中后跨进「运行态」占住核心；如果运行到一半自己调 read 去等磁盘，它主动交出核心跌进「阻塞态」，等磁盘把数据送到了，内核才把它标回就绪态重新排队；要是运行中没等外设却用完了时间片，就被时钟强制踢回就绪态。

      看懂这张状态图，线上排查立刻清醒三件事。第一，阻塞态的进程挂着再多也不抢一丁点 CPU，想判断服务器算力忙不忙，应该盯「就绪队列里排着多少个 R」，而不是数总进程数。

      第二，Linux 把阻塞拆成了可中断睡眠 S 和不可中断睡眠 D：平时等键盘、等网络多是 S，发个 kill 信号随时叫醒清理；而进程和磁盘控制器等硬件直接交接的短瞬间会进 D 状态，这时连 kill -9 都暂时动不了它（必须等驱动响应完才能处理信号）。如果 top 里长期挂着一堆 D 状态进程，八成是本地磁盘快坏了或者远程存储断连了。第三，Linux 的系统负载值（[[load]] average）统计的是「正在跑或排队的 + 不可中断睡眠 D」的总数——所以负载飙高别急着断定是 CPU 算不动了，先看看是不是 I/O 堵出了一堆 D。
    derivation: original
