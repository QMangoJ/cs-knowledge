  - id: policy
    title: 调度的拉锯：吞吐、响应和公平不可能全拉满
    tldr: 缩短时间片能让按键响应飞快，却把大量时间白耗在换人上；拉长时间片能提高后台计算吞吐，前台却会卡顿——调度策略永远是在吞吐、响应与公平之间走钢丝。
    body: |-
      调度器手里没有魔法，不管怎么挑人，都要在三个相互打架的目标里做取舍：后台批量转码希望一口气跑完少被打断（吞吐量高）；前台编辑器希望你一敲键盘一毫秒内立刻回显（响应快）；同时所有进程还不能被饿死（公平）。

      时间片长短就是最直观的那颗旋钮，拿数字估一遍就明白。假设每个任务一次只跑几毫秒（比如 2 毫秒 = 2000 微秒），而每次上下文切换耗时大约 2 微秒，切换占的直接开销还只有千分之一，看起来不算大；可一旦你把时间片猛砍到 20 微秒去追求极限响应，或者机器上同时硬塞了一万个活跃线程来回倒腾，光是切人加上后面反复弄冷缓存，就能白白吃掉大半个 CPU 的算力——这也是线上服务严控并发线程池大小的原因。

      具体怎么在先来先服务、短作业优先、多级反馈队列之间选型，我们在下一课专门算细账；这一课先把核心结论钉牢：没有哪一套算法能同时把三项指标都拉到满分，全看当前跑的是算力批处理还是交互应用。
    derivation: original
    sources:
      - ref: ostep
        locator: CPU 虚拟化 / Limited Direct Execution 一章
