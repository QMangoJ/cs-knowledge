- id: thread-vs-process
  title: 线程切换为什么比进程切换便宜，差在哪几笔账
  tldr: 线程共享页表，切换不动 TLB 与地址空间；进程切换贵在换页表与随之而来的翻译冷启动。
  body: '同一进程的两个线程切换，与两个进程切换，差在哪几笔账？进程切换要换页表根（CR3），新进程的地址翻译在 TLB 里基本没有存货，接下来一段时间要频繁走页表；还要换内核栈、换一整套硬件上下文。线程切换共享地址空间，页表不动、TLB 大体保住，只换寄存器与栈，账小得多。

    但别把便宜推过头：两个线程若恰好在抢同一把锁，切换再便宜也是在空转；跨进程切换虽贵，却换来了内存隔离与故障隔离。所以推理服务常见的排布是少量进程（隔离与绕开 GIL）乘每进程适量线程（便宜的并发），而不是单进程开几百个线程或每请求一个进程，两个极端都会被某一笔账打回来。


    数字感上再补一笔：同进程线程切换的直接成本通常明显低于跨进程切换，差距主要来自页表切换与 TLB 失效的后续效应，而不是寄存器搬运本身——寄存器两边都要搬。观测上可以用乒乓实验验证：两个线程用管道来回传一个字节，与两个进程做同样的事，测每秒往返次数，差距就是地址空间切换的真实价格（具体数字随机器而异，方法比数字重要）。'
  derivation: original
  sources:
  - ref: ostep
    locator: Limited Direct Execution 一章，上下文切换
    claim: 进程切换包含更换地址空间，线程切换共享地址空间因而更便宜
