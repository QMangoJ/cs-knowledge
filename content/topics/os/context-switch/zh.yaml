  - id: multicore
    title: 多核下的队列与迁移：为什么线程尽量不搬家
    tldr: 多核处理器上每个核各自管一条就绪队列，只有忙闲不均时调度器才会把任务从忙核搬去闲核；但搬走之后原核私有缓存全白费，因此调度器天生偏向让任务「就地留守」。
    body: |-
      把视角从单核拉到多核电脑上：几颗核心虽然能真正同时并跑不同任务，但每个核心自己手里还是照样分着一条独立的就绪队列，各自搞自己的分时轮转。平时大家都优先从自家队列拿任务跑，只有当 0 号核排了十几个任务忙到冒烟、1 号核却闲着晒太阳时，内核的负载均衡器才会出手把任务从 0 号核「搬家」到 1 号核。

      可为什么调度器不到万不得已不爱搬家？算一笔缓存账就懂：假设一个任务反复读写一块 1 MB 的热数据，在 0 号核跑了一会儿后，这 1 MB 早已经稳稳装进了 0 号核专属的 L1/L2 私有高速缓存里，读一次只需 1 到 4 纳秒；一旦把它搬去 1 号核，1 号核的私有缓存里空空如也，头一批访存全得退回到共享的 L3 缓存甚至约 100 纳秒的物理内存里重新拉，刚搬过去那阵速度直接慢上一个数量级以上。因此调度器讲究「缓存亲和性」，高性能数据库甚至会手动绑核，把关键线程死死钉在固定核心上；不过绑太死也会反咬一口——哪怕旁边的核完全空着，被钉死的线程也没法过去帮忙。

      最后留一套「上下文切换三问自检」，遇到性能抖动拿出来对一遍：一问「切的是进程还是线程」（要不要换 CR3 页表、会不会冲掉 TLB）；二问「是主动切还是被动切」（主动高查锁争用与碎 I/O，被动高查是不是并发任务远远多过 CPU 核数）；三问「切完冷了多少」（跨核搬家或大工作集切换后，缓存失效往往比那几微秒寄存器搬运更伤）。
    derivation: original
    sources:
      - ref: ostep
        locator: CPU 虚拟化 / Limited Direct Execution 一章
        claim: 有多个核心时，每个核心有自己的运行队列，调度器还要在核心之间搬任务。
