subject: os
slug: lock
order: 7
status: published
license: CC-BY-4.0
title: 两个线程抢一把锁：竞态与互斥
summary: 两个线程同时改一个变量会丢更新，根源在于「加 1」在机器眼里其实是读、改、写三步，调度器随时会把它们交错拆开。互斥锁靠 CPU 提供的原子指令把「看一眼锁空没空」和「把锁抢到手」压成不可拆开的一步；抢不到时，Linux 上的 [[pthread_mutex]] 会通过 [[futex]] 请内核让线程睡一觉，绝不在原地空转烧 CPU。加了锁也不等于万事大吉：两把锁顺序反着拿会当场卡死成[[死锁]]，临界区包太大或等法不对照样拖垮并发。全课从一次丢掉的 counter++ 走起，顺次拆解交错与锁的实现、死锁四条件与破环、以及原子操作、自旋与条件变量各自该什么时候出场。
premise: 两个线程 T1 和 T2 同时给同一个初值为 0 的共享计数器执行 counter++，按理说结果应该变成 2；可实际跑起来大部分时候是对的，偶尔偏偏只算出 1。多出来的那一次加法到底丢在了哪？要是再把代码套上两把锁，程序有时干脆一动不动卡死在原地，这又是怎么回事？
position: 本课在操作系统板块里独自撑起「并发与同步」这一段，接在「内存管理」和「进程管理」之后：前面两段讲清楚了多个线程怎么共用同一份地址空间、又怎么被时钟中断轮流换上处理器，这一课专门算清「共享」的代价——多个执行流同时改同一块内存时怎么守住秩序。后面的「文件系统」会接着看数据怎么安全落到磁盘，而数据库里的事务锁与后端服务里的并发限流，用的也都是这一课立下的规矩。
bridge:
  prev: 前面讲进程与线程时说过，同一个进程里的线程共用同一份页表与堆内存，切换起来轻快；这份共享的账单到这里到期了——当两个线程真的同时动手改同一个变量，执行步骤随时会被交错撕开，这节课就来把竞态关进笼子。
  next: 锁帮我们护住了内存里正在被争抢的变量，可机器一断电，内存里的计数器照样清零；要把数据按名字长期存进磁盘、断电还不坏，下一课来看文件系统怎样靠目录、inode 和日志接手这份保管。
overview:
  - key: 一句话总结
    value: 多个线程抢着改同一份数据时要加锁，锁本身靠 CPU 原子指令把「查空」和「占位」合成一步；Linux 上常用的 [[pthread_mutex]] 在没人抢时留在用户态秒过，抢不到才靠 [[futex]] 进内核睡着等。
  - key: 竞态条件
    value: 程序对错竟然看线程谁跑得快：比如两个线程同时读到计数器是 0，各自加 1 后写回，最终只得到 1 而不是 2，平时测不出、上线偶尔炸。
  - key: 临界区与锁
    value: 访问共享数据的那几行代码叫临界区，互斥锁保证同一时刻只放一个线程进去；锁护的是数据不是代码，拿放必须成对，范围越小越好。
  - key: 原子指令与 CAS
    value: CPU 用一条不可打断的指令（如比较并交换 CAS）同时完成「检查锁空着」和「把它改成已占用」，没人抢锁时根本不用惊动内核。
  - key: 自旋与睡等
    value: 等几微秒以内的极短操作，原地重试（自旋）省下切换开销；等久了还空转就是白烧 CPU，所以用户态互斥锁等不到就转进内核睡眠。
  - key: 死锁四条件
    value: 互斥、拿着不放又去等、不能硬抢、等待成环——四个条件全齐才会卡死；让所有线程按同一顺序拿锁，直接拆掉环形等待，零额外成本。
  - key: 其他同步工具
    value: 单个计数器直接用原子加减；读多写少用读写锁；等某个条件成立（如队列非空）用条件变量；控制并发名额上限（如 10 个连接）用信号量。
  - key: 谁在用
    value: Linux 内核和 [[glibc]] 的线程库把这套分层用到极致：内核极短路径用自旋锁和排队锁，用户态默认互斥锁靠「原子指令 + futex」按需睡眠；前端虽是单线程，但多个 await 交错写同一份状态时犯的是同一类病。
