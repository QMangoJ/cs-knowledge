- id: fairness-queue
  title: 公平性：为什么需要排队锁
  tldr: 普通自旋锁下谁先抢到看运气，后来者能插队、先来者可能饿死；排队锁按到达顺序发号。
  body: '最简单的自旋锁有个隐蔽问题：解锁后所有等待者在各自的核心上同时重试，谁先成功纯看运气与缓存延迟，刚放锁的那个核心甚至因为缓存还热而容易再次抢到——结果是有的线程连续进出、有的线程等很久甚至饿死，尾延迟完全不可控。排队锁就是来修公平性的：票据锁（ticket lock）给每个等待者发一个递增号码，锁里记着当前服务的号码，轮到谁谁进，像银行叫号；更进一步的队列锁让每个等待者只自旋在自己本地的一个标志上，前任走时只通知队首，既公平又避免所有核心盯同一块缓存行来回弹跳。代价是加锁路径变长、元数据变多，所以用户态普通互斥锁并不都追求严格公平：吞吐优先的场景允许插队，公平只在尾延迟敏感或等待者会被饿死的场景才值得买。判断标准还是那句话：先量出问题在吞吐还是在尾延迟，再决定要不要为公平付费。观察生产系统时，若平均延迟很好但长尾延迟异常高、而且线程数越多越明显，就值得怀疑是等待公平性出了问题，而不是临界区本身变慢了——这两种病的药完全不同，开错了只会越治越慢。'
  derivation: original
  sources:
  - ref: ostep
    locator: Locks 一章（排队与公平性相关讨论）
    claim: 简单自旋锁不保证等待者按到达顺序获得锁，排队式设计可以改善公平性
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
