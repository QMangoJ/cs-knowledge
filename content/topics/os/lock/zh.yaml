  - id: beyond-mutex
    title: 锁之外的工具：按「到底在等什么」去挑
    tldr: 互斥锁能保安全却往往最重：只改一个计数器用原子指令压根不用锁，读多写少用读写锁放行并发读，要等某个条件成立再用条件变量。
    body: |-
      回到开头的 `counter++` 场景：如果整段临界区真就只是给这一个整数加 1，连互斥锁都显得太重——直接用语言或运行库提供的原子自增操作（比如 [[atomic_fetch_add]]），一条硬件指令干净搞定，谁都不用睡谁都不用等。只有需要同时保护好几个关联变量或一段复杂逻辑时，才请互斥锁出马。

      如果是「十个线程查配置、偶尔才有一个线程改配置」这种读多写少的场合，互斥锁把两个读者也互相挡在门外就太亏了。读写锁允许多个读者同时进门、读取吞吐量随核心数线性上涨，只等写者进来时才独占清场。但它藏着两个容易踩的坑：一是「写者饥饿」，只要读者源源不断进来，活跃读者计数就总归不了零，写者可能永远排不上队（所以不少实现改成写者优先）；二是「原地升级死锁」，两个都拿着读锁的线程同时想就地升成写锁，谁都不肯先松开读锁，直接互锁死——因此大多数读写锁干脆禁止原地升级，必须先放读锁再重新抢写锁。

      遇到「线程要等队列里有任务再取」这种语义，光靠互斥锁不停加锁查队列、为空再解锁重查，只会把 CPU 烧光，这就得靠条件变量接手。挑工具顺着一个梯子往下走：能一条原子变量解决的就不上锁；确定读写比例极悬殊再试读写锁（先跑压测，写多时它的记账开销反而比普通互斥锁还贵）；只有「等某件事发生」才请条件变量。如果加完锁发现 CPU 跑不满、线程全堵在锁门口，第一反应应该把大锁拆细、缩窄临界区，而不是忙着换花哨的锁实现。
    derivation: original
    sources:
      - ref: ostep
        locator: "Concurrency: An Introduction 一章"
        claim: 不同场景有更合适的同步方式：条件变量、读写锁、原子变量。
        status: verified
