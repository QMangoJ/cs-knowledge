# 知识优先版草稿。出处仅供参考，按 Daniel 决定不做逐条核对。
id: os/lock
subject: os
slug: lock
order: 6
status: published
license: CC-BY-4.0
title: 两个线程抢一把锁：竞态与互斥
summary: 多个线程同时修改同一份数据会出错，锁保证同一时刻只有一个线程在改。
premise: 以两个线程同时给一个计数器加 1 为例。
overview:
  - key: 一句话总结
    value: 共享数据要加锁，而锁本身要靠硬件的原子指令实现
  - key: 竞态
    value: 结果取决于谁先谁后，偶尔出错，很难复现
  - key: 临界区
    value: 访问共享数据的那一小段代码，同一时刻只允许一个线程进
  - key: 原子指令
    value: “检查并设置”一步完成，中间不会被打断
  - key: 代价
    value: 锁会让线程排队等待，锁住的范围越小越好
visual: swimlane
lanes:
  - id: threads
    label: 线程
  - id: shared
    label: 共享数据
logColumns:
  - key: mode
    label: 当前状态
  - key: event
    label: 发生了什么
steps:
  - id: race
    title: 问题：加 1 竟然会丢
    tldr: 两个线程同时给计数器加 1，结果可能只加了 1 次。
    body: |-
      “加 1”看起来是一步，其实是三步：读出旧值、算出新值、写回去。
      如果两个线程都先读到同一个旧值，各自加 1 再写回，一次更新就丢了。
      这种结果取决于执行先后的错误叫“竞态”，平时测不出，上线后偶尔出现。
    derivation: original
    sources:
      - ref: ostep
        locator: "Concurrency: An Introduction 一章"
        claim: 对共享变量的非原子更新会产生竞态
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: swimlane
      actors:
        - lane: threads
          id: t1
          label: 线程 1
        - lane: threads
          id: t2
          label: 线程 2
        - lane: shared
          id: c
          label: 共享计数器 / 锁
          highlight: true
      messages:
        - id: m-race
          from: t1
          to: c
          label: 读到旧值
          active: true
    log:
      - mode: 两个线程同时运行
        event: 两个线程读到了同一个旧值
  - id: interleave
    title: 为什么会交错执行
    tldr: 线程随时可能被切换，或者在另一个核心上真正同时运行。
    body: |-
      单核上，时钟中断可能恰好在“读出”和“写回”之间把线程换下去。
      多核上，两个线程干脆就在同时执行。
      前端的 JS 是单线程，一段同步代码不会被打断，所以很少遇到这个问题；但两个异步请求先后返回覆盖同一个状态，就是同类问题。
    derivation: original
    sources:
      - ref: ostep
        locator: "Concurrency: An Introduction 一章"
        claim: 调度的不确定性使线程指令交错执行
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: swimlane
      actors:
        - lane: threads
          id: t1
          label: 线程 1
        - lane: threads
          id: t2
          label: 线程 2
          highlight: true
        - lane: shared
          id: c
          label: 共享计数器 / 锁
      messages:
        - id: m-interleave
          from: t2
          to: c
          label: 也读到旧值
          active: true
    log:
      - mode: 交错执行
        event: 更新丢失，计数器只加了 1
  - id: mutex
    title: 互斥：同一时刻只让一个线程进
    tldr: 用一把锁把“加 1”这段代码包起来，进去前先拿锁。
    body: |-
      访问共享数据的那段代码叫“临界区”。
      线程进入前先加锁，出来后解锁；锁被别人拿着时，只能等。
      这样“读、算、写”三步就不会被另一个线程插进来。
    derivation: original
    sources:
      - ref: ostep
        locator: Locks 一章
        claim: 锁保证临界区的互斥执行
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: swimlane
      actors:
        - lane: threads
          id: t1
          label: 线程 1
          highlight: true
        - lane: threads
          id: t2
          label: 线程 2
        - lane: shared
          id: c
          label: 共享计数器 / 锁
      messages:
        - id: m-mutex
          from: t1
          to: c
          label: 加锁成功，进入临界区
          active: true
    log:
      - mode: 线程 1 持有锁
        event: 线程 1 独占临界区
  - id: atomic
    title: 锁本身怎么做：需要原子指令
    tldr: 用普通代码写“看锁空不空，空就拿走”，自己也会有竞态。
    body: |-
      如果先读“锁是空的”，再写“锁归我”，两个线程可能同时看到空，然后都以为自己拿到了。
      所以 CPU 提供原子指令，把“检查并设置”合成一步，中间不会被打断，也不会被别的核心插进来。
      锁就建立在这样的硬件保证之上。
    derivation: original
    sources:
      - ref: ostep
        locator: Locks 一章，test-and-set
        claim: 锁的实现依赖硬件原子指令（如 test-and-set）
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: swimlane
      actors:
        - lane: threads
          id: t1
          label: 线程 1
        - lane: threads
          id: t2
          label: 线程 2
        - lane: shared
          id: c
          label: 共享计数器 / 锁
          highlight: true
      messages:
        - id: m-atomic
          from: t2
          to: c
          label: 原子地尝试拿锁：失败
          active: true
    log:
      - mode: 线程 1 持有锁
        event: 线程 2 拿锁失败
  - id: wait-release
    title: 等待与释放
    tldr: 没拿到锁的线程等待，持锁线程解锁后，它再进去。
    body: |-
      等待有两种方式：不停地重试（自旋），或者让内核把自己挂起、解锁时再唤醒。
      锁很快就会释放时自旋更划算，要等很久时挂起更省 CPU。
      无论哪种，锁都让线程排队，所以临界区要尽量短。
    derivation: original
    sources:
      - ref: ostep
        locator: Locks 一章，自旋与睡眠
        claim: 等待锁可以自旋或睡眠，各有取舍
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: swimlane
      actors:
        - lane: threads
          id: t1
          label: 线程 1
        - lane: threads
          id: t2
          label: 线程 2
          highlight: true
        - lane: shared
          id: c
          label: 共享计数器 / 锁
      messages:
        - id: m-wait-release
          from: c
          to: t2
          label: 锁已释放，线程 2 进入
          active: true
    log:
      - mode: 线程 2 持有锁
        event: 两次加 1 都生效，结果正确
