- id: futex
  title: 抢不到怎么办：futex 让线程睡一会
  tldr: 抢不到锁时，线程通过 futex 系统调用请内核让自己睡眠，锁释放后再被唤醒。
  body: '一直空转重试（自旋）浪费 CPU，所以 Linux 的 pthread_mutex 抢不到时会调用 futex，让内核把线程挂起。

    线程 1 解锁时，如果发现有人在等，就再调用 futex 唤醒一个。

    这种“没人抢走快路、有人抢才进内核”的设计，让锁在常见情况下几乎没有开销。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: futex(2)
    url: https://man7.org/linux/man-pages/man2/futex.2.html
    claim: futex 提供等待与唤醒操作
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
  canvas:
