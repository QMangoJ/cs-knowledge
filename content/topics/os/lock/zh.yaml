        event: 线程 1 独占临界区
    code:
      lang: c
      code: |-
        // 临界区只包住真正共享的那几行，锁的粒度越小并发越好
        pthread_mutex_lock(&mu);
        counter++;              // 读-改-写在锁内不可被交错
        pthread_mutex_unlock(&mu);
      note: POSIX 互斥锁
  - id: atomic
    title: 锁自己怎么造：靠 CPU 的原子指令 CAS
    tldr: 用普通读写去实现锁会两个线程同时看到「锁空着」而一起冲进去；CPU 必须提供不可分割的原子指令（如 CAS），把「查锁空没空」和「把锁抢过来」合成一步。
    body: |-
      刚学锁的人很快会撞上一个先有鸡还是先有蛋的疑问：锁本身不也是一个内存里的变量（0 表示空、1 表示被拿走）吗？谁来保护「改锁变量」这件事不发生竞态？如果用普通代码写「先读 `lock == 0`，再写 `lock = 1`」，T1 和 T2 照样能同时读到 0，然后双双以为自己抢到了锁，锁自己先漏风了。

      要破这个循环，软件再怎么绕都绕不出去，必须请硬件出手。现代处理器都提供专门的原子指令，最经典的是「比较并交换」（CAS，在 x86-64 上对应 `lock cmpxchg`）：硬件保证这条指令执行时排他锁住所在[[缓存行]]，一口气把「看看是不是 0、是就改成 1、不是就原样返回失败」合成绝对不可拆开的一步，别的核心插不进半根针。没人抢锁的时候，线程在用户态跑一条 CAS 把 0 改成 1 就直接进门，连内核都不用进。

      等一下，既然 CAS 这么神，是不是代码里只要每一步都用原子指令，整段逻辑就自动安全了？千万别踩这个坑：原子只保证「那一条指令本身」不可分割，不负责跨多条指令的一致性。比如你先原子地读出 `counter`，算完新值再原子地写回去，中间照样能插进别的线程；真要保护多步复合逻辑，还得老老实实上锁。另外，高频抢同一个原子变量也不是免费的——多个核疯狂争抢同一块[[缓存行]]，数据在核间缓存来回弹跳，单次操作能慢上一到两个数量级，这也是高并发服务宁愿每个核各记各的数（per-core counter）、汇总时再相加的原因。
    derivation: original
    sources:
