- id: atomic
  title: 锁本身怎么做：需要原子指令
  tldr: “看锁空不空，空就拿走”必须一步完成，这要靠 CPU 的原子指令。
  body: '如果先读“锁是空的”，再写“锁归我”，两个线程可能同时看到空，都以为自己拿到了。

    所以 CPU 提供原子指令（x86-64 上如 lock cmpxchg），把“检查并设置”合成一步，别的核心插不进来。

    没人抢锁时，加锁只是一条原子指令，完全不用进内核，很快。


    数字例子（量级示意）：无锁原子自增在无竞争时很快；一旦两个核高频抢同一计数器，缓存行在核间来回弹跳（cache line ping-pong），单次操作能慢一两个数量级——这就是计数器分片（per-core counter）在高并发服务里流行的原因。还要注意原子指令保证的只是这一步不可分割，它不自动保证多步操作的整体一致性：先原子地读、再原子地写，中间仍然可以被别人插进来，所以复合操作该加锁还得加锁，别把“每步都原子”误当成“整段都安全”。'
  derivation: original
  sources:
