- id: beyond-mutex
  title: 锁之外的工具
  tldr: 不同场景有更合适的同步方式：条件变量、读写锁、原子变量。
  body: '一个线程要等“队列不空”这样的条件时，用条件变量：没条件就睡，有人改了条件再叫醒它，不用反复检查。

    读多写少的数据用读写锁，多个读者可以同时进。

    只是一个计数器时，直接用原子操作（如 atomic_fetch_add）就够了，不必加锁。


    工程注记：排障时先分清锁竞争还是锁等待——perf lock 等工具能看出线程是否睡在 futex 上；睡得多但 CPU 不满，问题在锁粒度或临界区里做了慢操作（如在锁内打日志）。

    选型的粗略顺序是：能只用原子操作表达的就别上锁（计数器、标志位、引用计数）；读多写少再考虑读写锁；只有“等条件成立”这类语义才需要条件变量。反过来，把什么都塞进一把大锁虽然不易错，却会把本该并行的部分串行化，锁就从保护数据的工具变成了限速器——判断标准很朴素：如果加锁后 CPU 用不满而线程都在等锁，先怀疑粒度，而不是先换更快的锁。'
  derivation: original
  sources:
  - ref: ostep
    locator: 'Concurrency: An Introduction 一章'
    claim: 不同场景有更合适的同步方式：条件变量、读写锁、原子变量。
