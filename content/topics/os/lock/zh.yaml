  - id: spin-vs-sleep
    title: 自旋还是睡等：原地死磕与进内核睡一觉的盈亏线
    tldr: 原地自旋省下切换门票却一路烧处理器，进内核睡等省了处理器却要付两次上下文切换；门里只干几十纳秒自旋划算，干重活久等必须睡。
    body: |-
      再回头算清楚抢不到锁的 T2 到底该怎么等：原地循环重试（自旋），还是进内核睡下等唤醒？把线程挂起睡着、锁放开后再唤醒，来回要付两次上下文切换加内核调度的代价，大概在几微秒量级。如果持锁的 T1 真的只是把 `counter` 加 1、再跑几十条指令（几十纳秒）就出门放锁，让 T2 在原地空转几圈就拿到锁，比折腾进内核睡一觉划算得多——这就是为什么内核里保护极短数据结构时大量使用纯自旋锁。

      反过来，要是 T1 在锁里干了重活，比如查磁盘、发网络包或者跑大循环，T2 在原地自旋就成了灾难：整个等待期间的 CPU 算力白白烧光不说，如果倒霉的是单核机器，自旋着的 T2 还会死死占住唯一的 CPU 核心不放，反过来把真正干活的 T1 拖着没机会运行放锁，自己等自己陷入僵局。

      所以现实里的用户态线程库（比如 [[glibc]] 的自适应互斥锁）常把两条路拼起来用：抢不到锁时先赌一把，短暂自旋一小段，赌对方马上放锁；一旦超过阈值还没拿到，说明门里这人干的不是短活，立刻认输调 `futex` 进内核睡下。多核机器上只要临界区够短、阈值设得对，这种先转几圈再睡的策略能同时赚到低延迟和低功耗。
    derivation: original
    sources:
