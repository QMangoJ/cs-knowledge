- id: mutex
  title: 互斥：同一时刻只让一个线程进
  tldr: 用一把锁把“加 1”包起来，进去前先拿锁。
  body: '访问共享数据的那段代码叫“临界区”。互斥锁（mutex）的约定很简单：线程进入临界区前先 pthread_mutex_lock，出区后 pthread_mutex_unlock；锁已经被别人拿着时，后来者只能等，不能闯进去。

    这样“读、算、写”三步被包成一个对外不可分割的整体：另一个线程要么在你进之前完整做完，要么等你出来后才开始，不存在插到中间看到半成品状态的可能。

    用锁时有三条纪律值得提前立好。第一，锁保护的是数据不是代码：同一份数据被多处访问时，所有入口必须用同一把锁，漏一处等于没锁。第二，临界区只包真正共享的那几行，锁里做 I/O 或调慢函数会把所有等待者一起拖住。第三，拿锁和放锁必须成对出现在同一线程，异常路径上漏掉 unlock，后面所有线程会一起永久等下去。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: pthread_mutex_lock(3p)
    url: https://man7.org/linux/man-pages/man3/pthread_mutex_lock.3p.html
    claim: 互斥锁保证同一时刻只有一个线程持有
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
