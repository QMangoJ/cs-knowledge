id: os/lock
subject: os
slug: lock
order: 6
status: published
license: CC-BY-4.0
title: 两个线程抢一把锁：竞态与互斥
summary: 多个线程同时改同一份数据会出错，锁保证同一时刻只有一个线程在改。
premise: 以 Linux 上两个线程同时给计数器加 1、用 pthread_mutex 保护为例。
position: >-
  缺页处理让同一物理页能被多方共享，而线程本就同住一个地址空间，计数器读—改—写三步随时会被交错打断，本课因此划入并发与同步板块。拆解会对比自旋等待与 futex 睡眠两条路径，并拿等待图去对照死锁四条件。一段共享访问该用互斥锁还是原子操作、锁粒度变粗时排队代价涨在哪里，学完都要能当场判断。
bridge:
  prev: >-
    缺页那课里各进程靠隔离少有纠缠，可线程共享页表与同一计数器后，本课要直面它们真正同时动手改数据时的交错现场。
  next: >-
    线程靠锁护住了内存里的共享变量，可数据一旦要以文件形式长期留存，名字、inode 与落盘时机便成了另一套要守的规矩。
overview:
- key: 一句话总结
  value: 共享数据要加锁，锁靠原子指令实现；futex 型互斥锁抢不到时靠内核让线程睡眠
- key: 竞态
  value: 结果取决于谁先谁后，偶尔出错，很难复现
- key: 临界区
  value: 访问共享数据的那段代码，同一时刻只允许一个线程进
- key: Linux 的锁
  value: pthread_mutex 基于 futex：没人抢时不进内核，抢不到才请内核让自己睡
- key: 代价
  value: 锁让线程排队，锁住的范围越小越好
- key: 死锁
  value: 四个条件同时成立才会发生；固定加锁顺序是最常用的预防
- key: 自旋锁
  value: 等待时间极短时空转比睡眠更划算，内核里常用
- key: 其他同步
  value: 条件变量、读写锁、信号量、原子变量
- key: 在终端里看一看
  value: strace -f -e trace=futex <程序>　看线程何时因抢锁进入内核
