    log:
      - mode: 两个线程同时读
        event: T1、T2 都读到 0，写回后只剩 1
    points:
      - 两个线程同时给计数器加 1，结果却可能只变成 1。
  - id: interleave
    title: 为什么躲不开：调度器随时切走，多核真正并行
    tldr: 读和写之间的缝隙根本躲不开：单核上时钟中断随时能把刚读完旧值的线程换下去，多核上两个线程干脆在不同核心上真正同时动手。
    body: |-
      有人会想：「那段读改写一共才三条指令，哪有那么巧正好撞在中间？」偏偏就是这么巧。在单核 CPU 上，内核的时钟中断随时可能响起——只要刚好卡在 T1 读完 0、还没写回 1 的那一纳秒把它换下去，T2 接班上来就能稳稳读到还没改动的 0。到了多核 CPU 就更不用等中断了，T1 跑在 0 号核、T2 跑在 1 号核，两条指令本来就是同一时刻并发往下走。

      根本原因在于，操作系统里的[[调度器]]只保证每个线程迟早都能分到时间片，从来不承诺「谁的哪几条指令之间不会插进别人」。把程序正确性押在「一般不会恰好撞上」，就等于把定时炸弹写进代码里。审查并发代码有一条铁律：默认任意两次访问共享内存之间，随时都会插进另一个线程的任意操作；按这个最坏交错推演还能对，代码才算过关。

      前端和 Node.js 同学经常觉得「JS 是单线程就不会有竞态」，其实只是交错点搬了家。同步代码确实不会被抢占，但只要两个异步函数里写了 `const cur = await getCount(); await saveCount(cur + 1);`，等待网络返回的那段时间就相当于「读和写之间的缝隙」，两个请求同时读到 0 再先后写回 1，丢的还是同一次更新。
    derivation: original
    sources:
      - ref: ostep
        locator: "Concurrency: An Introduction 一章"
        claim: 调度不确定性使线程指令交错执行
        status: verified
