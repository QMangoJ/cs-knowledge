steps:
- id: race
  title: 问题：加 1 竟然会丢
  tldr: 两个线程同时给计数器加 1，结果可能只加了一次。
  body: '“加 1”看起来是一步，其实在机器层面是三步：把计数器从内存读进寄存器、在寄存器里算出新值、再把新值写回内存。

    两个线程如果都先读到同一个旧值（比如都是 41），各自加 1 得到 42 再写回，那么两次加 1 之后计数器只从 41 变到 42，丢了一次更新。用数字走一遍就很清楚：期望结果 43，实际 42，差的那 1 不是算错了，而是被后写的那个线程用旧值覆盖了。

    这种结果取决于线程先后顺序的错误叫“竞态条件”。它最阴险的地方是概率性：绝大多数交错顺序下结果都对，只有“两个读都发生在两个写之前”这一类顺序才出错，所以平时测不出、上线后偶尔出现，而且现场还很难复现。排查这类 bug 的第一反应应该是给计数路径加锁或换成原子操作，而不是加延时或加重试：延时只是把撞上的概率改小，竞态本身还藏在代码里等下一次。'
  derivation: original
  sources:
  - ref: ostep
    locator: 'Concurrency: An Introduction 一章'
    claim: 对共享变量的非原子更新会产生竞态
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
