      params:
        mode: wait-for-graph
        threads: 2
        locks:
          - A
          - B
        acquireOrder:
          T1:
            - A
            - B
          T2:
            - B
            - A
      cases:
        - input:
            T1:
              - A
              - B
            T2:
              - B
              - A
          expect:
            deadlock: true
            cycle:
              - T1
              - B
              - T2
              - A
        - input:
