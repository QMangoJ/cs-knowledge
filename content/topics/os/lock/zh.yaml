- id: deadlock
  title: 死锁：互相等对方的锁
  tldr: 两个线程各拿一把锁、又等对方那把，谁都走不动了。
  body: '线程 1 拿着锁 A 等锁 B，线程 2 拿着锁 B 等锁 A，谁都不肯先放手，就永远卡住，这叫死锁。程序不会报错、不会退出，就是彻底不动了，CPU 占用还往往是零，看起来像“安静地死了”。

    它需要四个条件同时成立：互斥（锁只能一人持有）、持有并等待（拿着一把还要下一把）、不可抢占（不能强行夺走别人的锁）、循环等待（等待关系形成环）。四个条件缺一个，死锁就不可能发生，所以所有预防方法本质上都是在拆其中一条。

    最实用的办法是规定全局加锁顺序（比如任何代码都必须先 A 后 B），直接让循环等待无法形成。其他拆法各有代价：一次性拿齐所有锁（拆持有并等待）会降低并发；trylock 失败就放手重试（拆不可抢占）要小心活锁；超时与死锁检测则是事后补救。工程上先立顺序，是因为它零运行时成本。'
  derivation: original
  sources:
  - ref: ostep
    locator: 'Concurrency: An Introduction 一章'
    claim: 两个线程各拿一把锁、又等对方那把，谁都走不动了。
