  - id: fairness-queue
    title: 公平性与排队锁：平均很快、长尾突然飙高怎么查
    tldr: 普通锁为了保吞吐允许后来者插队，刚放锁的核靠缓存热容易反复抢赢；对长尾延迟敏感时，要靠按号依次放行的排队锁守住先来后到。
    body: |-
      高并发下还会冒出一种让人摸不着头脑的症状：整个服务的平均加锁耗时非常好看，可 p99 长尾延迟却偶尔飙得离谱，而且线程数越多越明显。打开代码查临界区，里面的操作又明明快得很。问题往往出在「不公平」上：普通锁一放开，门外等着的线程和刚跑过来的新线程一哄而上同时用 CAS 抢，甚至刚刚放锁的 T1 自己因为 L1 缓存还热着、下一轮一伸手又抢赢了。结果 T1 连续跑了十几轮，早就醒过来排在门口的 T2 却接连被插队、险些饿死。

      要堵死插队，思路跟银行叫号一模一样——排队锁（如 Linux 内核常用的票据锁 ticket lock）。每个想拿锁的线程先原子地领一个递增的号牌，锁里同时记着「当前轮到几号服务」；你的号牌没叫到，哪怕门现在空着也不能往前挤，只能老老实实盯着叫号牌。更精细的队列锁（如 MCS 锁）干脆让每个等待者各自盯着自己本地缓存里的一个私有开关，前任出门时只拍一下下一任的开关，连「所有核反复盯同一块共享[[缓存行]]互相打架」的开销也省掉了。

      天下没有白拿的公平：严格排队意味着哪怕前任刚出门、下一任还在半路慢吞吞切回 CPU，新来的线程就算准备好了也得干等着不能先跑，总体吞吐量反而可能往下掉。所以用户态普通互斥锁默认允许一定程度插队保吞吐；只有确认系统栽在尾延迟飙高或饥饿问题上时，才值得花元数据与路径代价去买严格公平。
    derivation: original
    sources:
      - ref: ostep
        locator: Locks 一章（排队与公平性相关讨论）
        claim: 简单自旋锁不保证等待者按到达顺序获得锁，排队式设计可以改善公平性
        status: verified
