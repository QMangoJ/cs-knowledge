  - id: futex
    title: "抢不到锁怎么办：[[futex]] 让线程先睡一觉"
    tldr: 没抢到锁时原地死循环重试会白白烧干处理器；Linux 互斥锁靠 [[futex]] 把快慢路径劈开，没人抢只在用户态搞定，真抢不到才请内核把线程挂起睡着。
    body: |-
      T1 已经用 CAS 抢到锁进了门，正在里面办事；此时 T2 也调 CAS 尝试拿锁，返回失败。接下来 T2 该干嘛？如果让 T2 写个死循环不停调 CAS 硬磕，在 T1 干完之前，T2 占着的那个 CPU 核心就会被 100% 烧在毫无产出的空转上。所以 Linux 下的 [[pthread_mutex]] 选择了快慢路径分离的 [[futex]]（快速用户空间互斥机制）：没人抢时绝不进内核，真抢不到了才通过 `futex` 系统调用请内核把 T2 挂起睡眠，等 T1 解锁时再顺手发消息叫醒它。

      为了不漏掉任何一次唤醒，futex 在内存里只用一个整数就管住了三种状态：`0` 表示锁空着，`1` 表示有人拿着但没人排队，`2` 表示有人拿着而且门外已经有人睡着等了。加锁时，线程先用 CAS 试着把 `0` 改成 `1`，成功直接进门——这是占绝大多数的无争用快路径。改不动时，线程先把状态标成 `2`，再带着期望值 `2` 调 `futex` 进内核睡眠。

      等一下，内核为什么在让 T2 睡下之前，还要再复查一遍那个整数是不是真的等于 `2`？想一想那个极端缝隙：T2 刚准备进内核去睡，T1 恰好在这一微秒解锁把值改回 `0` 并试图唤醒——可 T2 还没睡下去，这次唤醒直接打空了，之后 T2 才真正睡死，就再也没人叫它起床了。内核把「复查还是 `2`」和「放进睡眠队列」做成一个原子动作，正好堵死了这个丢唤醒的漏洞。还要记住：被叫醒只代表「锁可能空了，出来再抢一次」，万一刚巧被新来的 T3 插队抢先，T2 还得继续睡一轮。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: futex(2)
        url: https://man7.org/linux/man-pages/man2/futex.2.html
        claim: futex 提供等待与唤醒操作
