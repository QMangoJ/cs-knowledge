  - id: race-lab
    title: 动手实验：自己排一次交错，亲眼看它丢更新
    tldr: 只要两个「读」都抢在两个「写」之前发生，两次加 1 就一定会丢一次；一旦打开锁把读改写关成一整块，任何调度顺序都能稳稳算出 2。
    body: |-
      右边的实验台把两个线程拆成了可以手动调顺序的积木：`counter` 初值是 0，每个线程各做三步——读（把内存里的 `counter` 读进自己的寄存器）、加（寄存器加 1）、写（写回内存）。现在试着按默认顺序点一遍：`T1 读` → `T2 读` → `T1 写` → `T2 写`。你会看到两个线程的寄存器里都清清楚楚写着 `0 → 1`，可最后 `counter` 停在了 1。

      等一下，一定要两个线程「同一时刻」执行才会出错吗？把顺序拉长一点想：哪怕 T1 读完 0 之后停顿了整整一秒，只要在它写回之前 T2 顺手读走了那个 0，最后照样丢更新。反过来，试着把顺序排成 `T1 读 → T1 写 → T2 读 → T2 写`：哪怕不加锁，结果也是正确的 2——这正好解释了为什么竞态在本地测不出来，因为大部分时候顺序恰好没撞上。

      现在打开「使用锁」开关，再跑一遍刚才出错的顺序。T1 先拿锁后，T2 在读之前必须等 T1 写完并放锁才能进来，所有交错都被挡在门外，结果每次都是 2。
    derivation: original
    sources:
      - ref: ostep
        locator: "Concurrency: An Introduction 一章"
        claim: 非原子的读-改-写交错会丢失更新
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
