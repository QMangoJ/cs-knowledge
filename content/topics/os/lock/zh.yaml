      kind: swimlane
      actors:
        - lane: threads
          id: t1
          label: 线程 1
        - lane: threads
          id: t2
          label: 线程 2
        - lane: shared
          id: c
          label: 共享计数器 / 锁
          highlight: true
        - lane: kernel
