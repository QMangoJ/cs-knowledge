- id: spin-vs-sleep
  title: 自旋还是睡眠：等待策略的阈值在哪
  tldr: 临界区只有几十条指令时睡下去再醒来比等一会还贵；等久了还自旋就是纯烧 CPU。
  body: '抢不到锁有两种等法：在用户态循环重试（自旋），或进内核睡下等唤醒。哪种划算取决于临界区有多长。让线程睡眠再唤醒要付两次上下文切换的代价，量级在微秒级；如果持锁者只再执行几十条指令就放锁，自旋几十圈的成本远小于睡一觉，所以内核里保护极短临界区的锁干脆纯自旋。反过来，临界区里有 I/O 或长计算时，自旋就等于把整个等待期的 CPU 白白烧掉，还会和持锁者抢同一个核，反而拖慢它放锁。实用的折中是自适应策略：先自旋一小段（赌对方马上放），超过阈值再睡——glibc 的普通互斥锁与许多运行时都是这个思路。注意阈值没有普适最优值：单核机器上自旋几乎总是亏的，因为持锁者没机会运行；核多的机器上短自旋才谈得上划算。实际调优时可以看争用下的 CPU 占用做判断：线程明明在等锁却把核跑满，多半是自旋过了头；反过来临界区极短、上下文切换次数却暴涨，则可能是睡得太勤，两头都是等错了方式。'
  derivation: original
  sources:
  - ref: ostep
    locator: Locks 一章（自旋锁与等待策略）
    claim: 自旋适合临界区极短的场景，长时间等待应让出 CPU 睡眠等待
    status: verified
