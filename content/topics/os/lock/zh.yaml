  - id: mutex
    title: 互斥锁：把读改写锁成关门的一整块
    tldr: 互斥锁把访问共享数据的那几行代码围成单间（临界区），进门先拿锁、出门再放锁；只要大家都守规矩，读改写三步对外就是不可插队的整体。
    body: |-
      实验里那个开关背后的机制，在 POSIX 线程库里就是互斥锁（[[pthread_mutex]]）。把会碰共享变量 `counter` 的那几行代码划出来，叫做「临界区」。规矩极简：进门前先调用 `pthread_mutex_lock(&mu)` 拿锁，做完立刻调用 `pthread_mutex_unlock(&mu)` 放锁；锁要是已经在 T1 手里，T2 在门口调用 lock 时就只能等，直到 T1 出门放锁。这样一来，T2 要么赶在 T1 进门之前把活干完，要么等 T1 彻底写回 1 之后再读到 1 写成 2，绝对插不进「读完还没写」的半成品状态。

      用锁必须死守三条纪律，错一条都会翻车。第一，锁护的是数据，不是某一段代码：如果 `counter` 在加 1 的函数里加了锁 `mu`，而在另一个统计函数或清零函数里偷懒没加同一把锁 `mu`，那两条路径照样会交错覆盖。第二，临界区越小越好：只把真正读写 `counter` 的那几行关进去，千万别把打日志、查数据库或网络请求塞在锁里，否则所有等待线程都得陪着一起干等。

      第三，拿锁和放锁必须在同一线程严格成对。写 C/C++ 时若中途提前 `return` 或抛异常漏了 `unlock`，这把锁就永远没人放了，后面来的所有线程全死在门口（这也是 C++ 习惯用 RAII 守卫对象靠作用域自动放锁的原因）。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: pthread_mutex_lock(3p)
        url: https://man7.org/linux/man-pages/man3/pthread_mutex_lock.3p.html
        claim: 互斥锁保证同一时刻只有一个线程持有
