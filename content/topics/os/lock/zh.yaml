          id: t1
          label: 线程 1
          highlight: true
        - lane: threads
          id: t2
          label: 线程 2
        - lane: shared
          id: c
          label: 共享计数器 / 锁
        - lane: kernel
          id: k
          label: 内核
      messages:
        - id: m-mutex
          from: t1
          to: c
          label: 加锁成功，进入临界区
          active: true
    log:
