- id: futex-detail
  title: futex 的快慢路径分工：一个整数怎么协调用户态与内核
  tldr: 锁字的值同时是用户态的状态机与内核的校验依据，无争用时内核根本不在场。
  body: '把 futex 的分工说细。锁就是用户内存里的一个整数，约定：0 表示没人拿，1 表示有人拿且没人等，2 表示有人拿且有人在等。加锁时先用原子指令试着把 0 改成 1：成功就直接进临界区，全程不进内核，这是快路径，也是无争用时的全部故事。改不动说明锁被占：线程把值标成 2，再调用 futex 的等待操作并把期望值一并交给内核；内核先复查这个值确实还是 2 才让线程睡——这一步复查至关重要，它堵住了“刚决定要睡、锁恰好被释放”的竞态，否则唤醒信号会在睡眠之前发出并永久丢失。解锁时把值原子地减回去，若原值是 2 说明有等待者，再调用 futex 的唤醒操作叫醒一个。分工的精髓在于：内核只保管等待队列这件用户态做不了的事，状态判断与快路径决策全部留在用户态。这个协议还有个附带好处：锁对象只需要一个对齐的整数，不依赖任何预先在内核里创建的对象，所以互斥锁可以放进共享内存跨进程使用，内核只在真的有人睡下时才临时为它建队列，用完即弃。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: futex(2) 与 futex(7) 手册
    url: https://man7.org/linux/man-pages/man2/futex.2.html
    claim: futex 等待操作会先比较用户内存字的值，值已变化则不睡眠直接返回，避免丢失唤醒
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
