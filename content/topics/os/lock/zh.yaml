  - id: condvar-spurious
    title: 条件变量与虚假唤醒：醒来先复查，再带走三句口诀
    tldr: 条件变量等待必须写成 while 循环而不是 if——既可能没人发通知自己醒来，也可能抢回锁的瞬间条件早被别的线程消费掉了。
    body: |-
      当消费者线程发现任务队列为空时，正确的等法不是自己解锁、加锁循环偷看，而是拿着互斥锁调用条件变量等待：系统会在把它挂起睡眠的同一瞬间原子地放开互斥锁，等生产者往队列塞进任务并发出通知后，再替它把锁重新拿回来。之所以非要把「放锁」和「睡下」压成原子动作，是因为如果先放锁再去睡，生产者恰好插在中间把任务放进来并发了通知，这次唤醒就彻底丢在空中了。

      最容易写错的一行代码在唤醒之后：千万不能用 `if (queue.empty()) wait();`，必须写成 `while (queue.empty()) wait();`。原因有二：其一，系统规范允许存在「虚假唤醒」，也就是哪怕没有任何生产者发过通知，等在条件变量上的线程也可能偶尔自己醒来一次；其二，就算通知货真价实，从内核把你叫醒到你重新抢回互斥锁之间还有一段缝隙，另一个手快的消费者可能已经先一步钻进来把队列里唯一那个任务取走了——等你拿稳锁时，队列早又空了，用 `if` 不复查直接去取就会当场取空崩溃。同样，生产者侧也得守一条铁律：先在锁内把队列改好，再发通知。

      把整课收成三句能直接带走的判断口诀：**① 看交错**——只改一个数直接用原子，护一串操作用互斥锁（锁护数据不护代码、范围越小越好）；**② 挑等法**——几十纳秒短等靠自旋，长等必靠 futex 睡，等事件发生用「互斥锁 + while 条件变量」；**③ 防卡死**——多把锁全局统一加锁顺序，[[等待图]]里画不出闭环就绝不会死锁。
