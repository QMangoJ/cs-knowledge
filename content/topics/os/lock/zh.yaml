  - id: deadlock-lab
    title: "动手实验：在[[等待图]]里抓出死锁的环"
    tldr: 把「线程在等哪把锁、锁在谁手里」画成箭头图，只要箭头绕成首尾相接的环就一定死锁；把两个线程的拿锁顺序调成一样，环就再也画不出来。
    body: |-
      把刚才那套两把锁反序的场景放进右边的实验台里亲手跑一遍。图里用一种专查死锁的画法——[[等待图]]：线程发出箭头指向它正在等的锁，锁发出箭头指向现在拿着它的线程。先按默认配置 `T1: [A, B]`、`T2: [B, A]` 单步运行：T1 先把 A 揽进手里，T2 先把 B 揽进手里；紧接着 T1 伸手要 B（发现 B 指着 T2），T2 伸手要 A（发现 A 指着 T1）。画面上立刻闭合出一个环：`T1 → B → T2 → A → T1`。环一闭合，两个线程永远走不动了。

      等一下，为什么代码里顺序是反的，线上有时跑好几天才卡死一次？自己排成另一个交错试试：让 T1 一口气先拿到 A、再拿到 B、干完活全放掉，之后才轮到 T2 上场——明明反序的隐患一直埋在代码里，这一次却顺顺当当跑完了。这就是死锁比普通 bug 难抓的原因：只有调度器恰巧切出「一人拿一半」的窗口，它才会暴露。

      现在把右边 T2 的加锁顺序也改成 `[A, B]` 再跑一遍。两个线程一上来都会先抢 A；没抢到 A 的那个线程直接在门口等 A，连碰 B 的机会都没有，等待图里压根长不出环。这就是「统一加锁顺序」能彻底根治死锁的直观证明。
    derivation: original
    sources:
      - ref: ostep
        locator: Common Concurrency Problems 一章
        claim: 循环等待是死锁条件之一，固定加锁顺序可预防
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
