steps:
- id: race
  title: 问题：加 1 竟然会丢
  tldr: 两个线程同时给计数器加 1，结果可能只加了一次。
  body: '“加 1”看起来是一步，其实是三步：读出旧值、算出新值、写回去。

    两个线程如果都先读到同一个旧值，各自加 1 再写回，一次更新就丢了。

    这种取决于先后顺序的错误叫“竞态”，平时测不出，上线后偶尔出现。'
  derivation: original
  sources:
  - ref: ostep
    locator: 'Concurrency: An Introduction 一章'
    claim: 对共享变量的非原子更新会产生竞态
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
  canvas:
    kind: swimlane
    actors:
    - lane: threads
      id: t1
      label: 线程 1
    - lane: threads
      id: t2
      label: 线程 2
    - lane: shared
      id: c
      label: 共享计数器 / 锁
      highlight: true
    - lane: kernel
      id: k
      label: 内核
    messages:
    - id: m-race
      from: t1
      to: c
      label: 读到旧值
      active: true
  log:
  - mode: 两个线程同时运行
    event: 两个线程读到同一个旧值，更新丢失
  points:
  - 两个线程同时给计数器加 1，结果可能只加了一次。
- id: interleave
  title: 为什么会交错执行
  tldr: 线程随时可能被换下，或者在另一个核心上真正同时运行。
  body: '单核上，时钟中断可能恰好在“读出”和“写回”之间把线程换下去；多核上两个线程干脆同时在跑。

    前端的 JS 是单线程，一段同步代码不会被打断，所以少见这个问题。

    但两个异步请求先后返回、覆盖同一个状态，就是同一类问题。'
  derivation: original
  sources:
  - ref: ostep
    locator: 'Concurrency: An Introduction 一章'
    claim: 调度不确定性使线程指令交错执行
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
  canvas:
    kind: swimlane
    actors:
    - lane: threads
      id: t1
      label: 线程 1
    - lane: threads
      id: t2
      label: 线程 2
      highlight: true
    - lane: shared
      id: c
      label: 共享计数器 / 锁
    - lane: kernel
      id: k
      label: 内核
    messages:
    - id: m-interleave
      from: t2
      to: c
      label: 也读到旧值
      active: true
  log:
  - mode: 交错执行
    event: 执行顺序不可预测
- id: race-lab
  title: 动手：亲手排一次交错，让更新丢掉
  tldr: 计数器从 0 开始，按“T1 读、T2 读、T1 写、T2 写”执行，两次加 1 后结果是 1；加锁后一定是 2。
  body: '右边每个线程有三个操作：读（把计数器读进自己的寄存器）、加（寄存器 + 1）、写（写回计数器）。你可以拖动它们决定执行顺序。

    计数器初值 0。试这个顺序：T1 读到 0，T2 也读到 0；T1 加 1 写回 1；T2 也加 1 写回 1。两个线程各加了一次，结果却是 1，丢了一次更新。

    注意关键不在“同时”，而在 T2 读的时刻 T1 还没写回。只要两个“读”都落在两个“写”之前，就会丢。

    再把“使用锁”打开：T1 拿锁后，T2 的读必须等 T1 写完、放锁才能开始，任何顺序最后都是 2。

    可以试试：把顺序改成 T1 读、T1 写、T2 读、T2 写，不加锁也是 2。这就是竞态难复现的原因：大多数时候恰好没撞上。'
  derivation: original
  sources:
  - ref: ostep
    locator: 'Concurrency: An Introduction 一章'
    claim: 非原子的读-改-写交错会丢失更新
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
  canvas:
    kind: lab
    lab: interleave
    caption: 拖动操作排出执行顺序，看计数器最后是几
    params:
      threads: 2
      opsPerThread:
      - read
      - add
      - write
      initial: 0
      useLock: false
      schedule:
      - T1r
      - T2r
      - T1w
      - T2w
    cases:
    - input:
        schedule:
        - T1r
        - T2r
        - T1w
        - T2w
        useLock: false
      expect:
        counter: 1
    - input:
        schedule:
        - T1r
        - T2r
        - T1w
        - T2w
        useLock: true
      expect:
        counter: 2
    - input:
        schedule:
        - T1r
        - T1w
        - T2r
        - T2w
        useLock: false
      expect:
        counter: 2
    registers:
    - name: 计数器
      value: '1'
      changed: true
    - name: T1 寄存器
      value: 0 → 1
    - name: T2 寄存器
      value: 0 → 1
  log:
  - mode: 动手实验
    event: 两个读都在写之前，丢一次更新
- id: mutex
  title: 互斥：同一时刻只让一个线程进
  tldr: 用一把锁把“加 1”包起来，进去前先拿锁。
  body: '访问共享数据的那段代码叫“临界区”。

    线程进入前先 pthread_mutex_lock，出来后 unlock；锁被别人拿着时只能等。

    这样“读、算、写”三步就不会被另一个线程插进来。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: pthread_mutex_lock(3p)
    url: https://man7.org/linux/man-pages/man3/pthread_mutex_lock.3p.html
    claim: 互斥锁保证同一时刻只有一个线程持有
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
  canvas:
    kind: swimlane
    actors:
    - lane: threads
      id: t1
      label: 线程 1
      highlight: true
    - lane: threads
      id: t2
      label: 线程 2
    - lane: shared
      id: c
      label: 共享计数器 / 锁
    - lane: kernel
      id: k
      label: 内核
    messages:
    - id: m-mutex
      from: t1
      to: c
      label: 加锁成功，进入临界区
      active: true
  log:
  - mode: 线程 1 持有锁
    event: 线程 1 独占临界区
  code:
    lang: c
    code: '// 临界区只包住真正共享的那几行，锁的粒度越小并发越好

      pthread_mutex_lock(&mu);

      counter++;              // 读-改-写在锁内不可被交错

      pthread_mutex_unlock(&mu);'
    note: POSIX 互斥锁
- id: atomic
  title: 锁本身怎么做：需要原子指令
  tldr: “看锁空不空，空就拿走”必须一步完成，这要靠 CPU 的原子指令。
  body: '如果先读“锁是空的”，再写“锁归我”，两个线程可能同时看到空，都以为自己拿到了。

    所以 CPU 提供原子指令（x86-64 上如 lock cmpxchg），把“检查并设置”合成一步，别的核心插不进来。

    没人抢锁时，加锁只是一条原子指令，完全不用进内核，很快。


    数字例子（量级示意）：无锁原子自增在无竞争时很快；一旦两个核高频抢同一计数器，缓存行在核间来回弹跳（cache line ping-pong），单次操作能慢一两个数量级——这就是计数器分片（per-core counter）在高并发服务里流行的原因。'
  derivation: original
  sources:
  - ref: ostep
    locator: Locks 一章，硬件原语
    claim: 锁的实现依赖原子指令
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
  - ref: linux-man-pages
    locator: futex(7)
    url: https://man7.org/linux/man-pages/man7/futex.7.html
    claim: futex 在无竞争时完全在用户态完成
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
  canvas:
