# 知识优先版草稿（Linux x86-64 为例）。出处仅供参考，按 Daniel 决定不做逐条核对。
id: os/lock
subject: os
slug: lock
order: 6
status: published
license: CC-BY-4.0
title: 两个线程抢一把锁：竞态与互斥
summary: 多个线程同时改同一份数据会出错，锁保证同一时刻只有一个线程在改。
premise: 以 Linux 上两个线程同时给计数器加 1、用 pthread_mutex 保护为例。
overview:
  - key: 一句话总结
    value: 共享数据要加锁，锁靠原子指令实现，抢不到时靠内核让线程睡眠
  - key: 竞态
    value: 结果取决于谁先谁后，偶尔出错，很难复现
  - key: 临界区
    value: 访问共享数据的那段代码，同一时刻只允许一个线程进
  - key: Linux 的锁
    value: pthread_mutex 基于 futex：没人抢时不进内核，抢不到才请内核让自己睡
  - key: 代价
    value: 锁让线程排队，锁住的范围越小越好
  - key: 死锁
    value: 四个条件同时成立才会发生；固定加锁顺序是最常用的预防
  - key: 自旋锁
    value: 等待时间极短时空转比睡眠更划算，内核里常用
  - key: 其他同步
    value: 条件变量、读写锁、信号量、原子变量
  - key: 在终端里看一看
    value: strace -f -e trace=futex <程序>　看线程何时因抢锁进入内核
visual: swimlane
lanes:
  - id: threads
    label: 线程
  - id: shared
    label: 共享数据
  - id: kernel
    label: 内核
logColumns:
  - key: mode
    label: 当前状态
  - key: event
    label: 发生了什么
steps:
  - id: race
    title: 问题：加 1 竟然会丢
    tldr: 两个线程同时给计数器加 1，结果可能只加了一次。
    body: |-
      “加 1”看起来是一步，其实是三步：读出旧值、算出新值、写回去。
      两个线程如果都先读到同一个旧值，各自加 1 再写回，一次更新就丢了。
      这种取决于先后顺序的错误叫“竞态”，平时测不出，上线后偶尔出现。
    derivation: original
    sources:
      - ref: ostep
        locator: "Concurrency: An Introduction 一章"
        claim: 对共享变量的非原子更新会产生竞态
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: swimlane
      actors:
        - lane: threads
          id: t1
          label: 线程 1
        - lane: threads
          id: t2
          label: 线程 2
        - lane: shared
          id: c
          label: 共享计数器 / 锁
          highlight: true
        - lane: kernel
          id: k
          label: 内核
      messages:
        - id: m-race
          from: t1
          to: c
          label: 读到旧值
          active: true
    log:
      - mode: 两个线程同时运行
        event: 两个线程读到同一个旧值，更新丢失
  - id: interleave
    title: 为什么会交错执行
    tldr: 线程随时可能被换下，或者在另一个核心上真正同时运行。
    body: |-
      单核上，时钟中断可能恰好在“读出”和“写回”之间把线程换下去；多核上两个线程干脆同时在跑。
      前端的 JS 是单线程，一段同步代码不会被打断，所以少见这个问题。
      但两个异步请求先后返回、覆盖同一个状态，就是同一类问题。
    derivation: original
    sources:
      - ref: ostep
        locator: "Concurrency: An Introduction 一章"
        claim: 调度不确定性使线程指令交错执行
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: swimlane
      actors:
        - lane: threads
          id: t1
          label: 线程 1
        - lane: threads
          id: t2
          label: 线程 2
          highlight: true
        - lane: shared
          id: c
          label: 共享计数器 / 锁
        - lane: kernel
          id: k
          label: 内核
      messages:
        - id: m-interleave
          from: t2
          to: c
          label: 也读到旧值
          active: true
    log:
      - mode: 交错执行
        event: 执行顺序不可预测
  - id: mutex
    title: 互斥：同一时刻只让一个线程进
    tldr: 用一把锁把“加 1”包起来，进去前先拿锁。
    body: |-
      访问共享数据的那段代码叫“临界区”。
      线程进入前先 pthread_mutex_lock，出来后 unlock；锁被别人拿着时只能等。
      这样“读、算、写”三步就不会被另一个线程插进来。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: pthread_mutex_lock(3p)
        url: https://man7.org/linux/man-pages/man3/pthread_mutex_lock.3p.html
        claim: 互斥锁保证同一时刻只有一个线程持有
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: swimlane
      actors:
        - lane: threads
          id: t1
          label: 线程 1
          highlight: true
        - lane: threads
          id: t2
          label: 线程 2
        - lane: shared
          id: c
          label: 共享计数器 / 锁
        - lane: kernel
          id: k
          label: 内核
      messages:
        - id: m-mutex
          from: t1
          to: c
          label: 加锁成功，进入临界区
          active: true
    log:
      - mode: 线程 1 持有锁
        event: 线程 1 独占临界区
  - id: atomic
    title: 锁本身怎么做：需要原子指令
    tldr: “看锁空不空，空就拿走”必须一步完成，这要靠 CPU 的原子指令。
    body: |-
      如果先读“锁是空的”，再写“锁归我”，两个线程可能同时看到空，都以为自己拿到了。
      所以 CPU 提供原子指令（x86-64 上如 lock cmpxchg），把“检查并设置”合成一步，别的核心插不进来。
      没人抢锁时，加锁只是一条原子指令，完全不用进内核，很快。
    derivation: original
    sources:
      - ref: ostep
        locator: Locks 一章，硬件原语
        claim: 锁的实现依赖原子指令
        status: unverified
        note: 按 Daniel 决定不核对出处
      - ref: linux-man-pages
        locator: futex(7)
        url: https://man7.org/linux/man-pages/man7/futex.7.html
        claim: futex 在无竞争时完全在用户态完成
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: swimlane
      actors:
        - lane: threads
          id: t1
          label: 线程 1
        - lane: threads
          id: t2
          label: 线程 2
        - lane: shared
          id: c
          label: 共享计数器 / 锁
          highlight: true
        - lane: kernel
          id: k
          label: 内核
      messages:
        - id: m-atomic
          from: t2
          to: c
          label: 原子地尝试拿锁：失败
          active: true
    log:
      - mode: 线程 1 持有锁
        event: 线程 2 拿锁失败
  - id: futex
    title: 抢不到怎么办：futex 让线程睡一会
    tldr: 抢不到锁时，线程通过 futex 系统调用请内核让自己睡眠，锁释放后再被唤醒。
    body: |-
      一直空转重试（自旋）浪费 CPU，所以 Linux 的 pthread_mutex 抢不到时会调用 futex，让内核把线程挂起。
      线程 1 解锁时，如果发现有人在等，就再调用 futex 唤醒一个。
      这种“没人抢走快路、有人抢才进内核”的设计，让锁在常见情况下几乎没有开销。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: futex(2)
        url: https://man7.org/linux/man-pages/man2/futex.2.html
        claim: futex 提供等待与唤醒操作
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: swimlane
      actors:
        - lane: threads
          id: t1
          label: 线程 1
        - lane: threads
          id: t2
          label: 线程 2
        - lane: shared
          id: c
          label: 共享计数器 / 锁
        - lane: kernel
          id: k
          label: 内核
          highlight: true
      messages:
        - id: m-futex
          from: t2
          to: k
          label: futex：让我睡，锁放了叫我
          active: true
    log:
      - mode: 线程 2 睡眠 → 被唤醒
        event: 线程 2 拿到锁，两次加 1 都生效
  - id: deadlock
    title: 死锁：互相等对方的锁
    tldr: 两个线程各拿一把锁、又等对方那把，谁都走不动了。
    body: |-
      线程 1 拿着锁 A 等锁 B，线程 2 拿着锁 B 等锁 A，就永远卡住，这叫死锁。
      它需要四个条件同时成立：互斥、拿着不放还要更多、不能抢、形成循环等待。
      最实用的预防办法是规定全局加锁顺序（比如总是先 A 后 B），打破循环等待。
    derivation: original
    sources:
      - ref: ostep
        locator: "Concurrency: An Introduction 一章"
        claim: 两个线程各拿一把锁、又等对方那把，谁都走不动了。
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: swimlane
      actors:
        - lane: threads
          id: t1
          label: 线程 1
        - lane: threads
          id: t2
          label: 线程 2
        - lane: shared
          id: c
          label: 共享计数器 / 锁
          highlight: true
        - lane: kernel
          id: k
          label: 内核
      messages:
        - id: m-deadlock
          from: t1
          to: c
          label: 拿着 A，等 B
          active: true
    log:
      - mode: 死锁
        event: 两个线程都在等
  - id: beyond-mutex
    title: 锁之外的工具
    tldr: 不同场景有更合适的同步方式：条件变量、读写锁、原子变量。
    body: |-
      一个线程要等“队列不空”这样的条件时，用条件变量：没条件就睡，有人改了条件再叫醒它，不用反复检查。
      读多写少的数据用读写锁，多个读者可以同时进。
      只是一个计数器时，直接用原子操作（如 atomic_fetch_add）就够了，不必加锁。
    derivation: original
    sources:
      - ref: ostep
        locator: "Concurrency: An Introduction 一章"
        claim: 不同场景有更合适的同步方式：条件变量、读写锁、原子变量。
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: swimlane
      actors:
        - lane: threads
          id: t1
          label: 线程 1
        - lane: threads
          id: t2
          label: 线程 2
        - lane: shared
          id: c
          label: 共享计数器 / 锁
          highlight: true
        - lane: kernel
          id: k
          label: 内核
      messages:
        - id: m-beyond-mutex
          from: t2
          to: c
          label: atomic 加 1，无需加锁
          active: true
    log:
      - mode: 同步
        event: 选择合适的工具
