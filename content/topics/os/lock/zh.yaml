  - id: deadlock
    title: 死锁：两把锁反着拿，程序安静卡死
    tldr: 同时用到两把锁时，只要两个线程加锁顺序相反，就会各自抱着手里的锁死等对方放手——四个必要条件凑齐，程序不报错也不退出、CPU 占零彻底僵死。
    body: |-
      前面只护一个 `counter`，一把锁 `mu` 就够；可业务稍微复杂一点，比如要把余额从账户 A 转到账户 B，就需要同时锁住 A 和 B。只要代码写岔了顺序，更致命的故障就来了：T1 先锁住 A，接着去申请 B；几乎同一时刻，T2 先锁住了 B，接着去申请 A。于是 T1 抱着 A 死等 B，T2 抱着 B 死等 A，谁都不肯先松手。此时程序不会崩溃、不会抛异常，甚至 CPU 占用率直接掉成 0%，像断了气一样悄无声息地卡在那里——这就是[[死锁]]。

      死锁看着玄乎，其实必须四个条件同时成立才能转起来：第一，互斥（锁同时只能一人持有）；第二，持有并等待（手里攥着 A 不放，还要伸手拿 B）；第三，不可抢占（别人手里拿着的锁不能硬夺过来）；第四，循环等待（T1 等 T2，T2 又等 T1，等待关系绕成闭环）。只要能拆掉其中任意一条，死锁就绝对不可能发生。

      在工程里最省心、且运行时零额外开销的拆法，就是直接破掉第四条「循环等待」：给全系统的锁排一个全局顺序（比如按锁的内存地址或编号大小，永远先锁编号小的再锁编号大的）。这样所有人都只能先拿 A 再拿 B，不可能出现「拿 B 等 A」的反向边，环自然就长不出来。至于一次抢齐所有锁、`trylock` 拿不到就退回重来、或者事后靠看门狗超时检测，要么限制太多、要么容易变成两个线程不停让路的「活锁」，只适合拿来兜底。
    derivation: original
    sources:
      - ref: ostep
        locator: "Concurrency: An Introduction 一章"
        claim: 两个线程各拿一把锁、又等对方那把，谁都走不动了。
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
