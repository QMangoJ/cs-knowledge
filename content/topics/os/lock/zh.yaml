- id: interleave
  title: 为什么会交错执行
  tldr: 线程随时可能被换下，或者在另一个核心上真正同时运行。
  body: '交错为什么躲不开？单核上，时钟中断可能恰好在“读出”和“写回”之间把线程换下去，另一个线程趁这段时间读到还没更新的旧值；多核上更直接，两个线程干脆在两个核心上真正同时执行，连等待中断都不需要。

    换句话说，问题不在“运气不好”，而在于线程的执行顺序本来就没有任何保证：调度器只保证最终都会跑，不保证谁的哪一步先发生。把正确性押在“一般不会恰好撞上”，就是把竞态写进了设计里。

    前端的 JS 是单线程，一段同步代码不会被打断，所以少见这个问题。但两个异步请求先后返回、按返回顺序覆盖同一个状态，就是同一类问题换了个舞台：交错点从指令之间变成了 await 之间。所以审查并发代码时，要默认任意两次共享访问之间都可能插入别的线程的操作；按这个最坏假设推演后还能成立的代码，才算真的安全，只在“我试过几次没出错”上成立的不算。'
  derivation: original
  sources:
  - ref: ostep
    locator: 'Concurrency: An Introduction 一章'
    claim: 调度不确定性使线程指令交错执行
    status: verified
