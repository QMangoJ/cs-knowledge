- id: rwlock-detail
  title: 读写锁深挖：读者并行，写者可能饿死
  tldr: 读读不互斥让读多写少场景快很多，但源源不断的读者能把写者无限期推迟。
  body: '读写锁把访问分成两类：多个读者可以同时持有读锁，写者则必须独占，且读写互斥。它适合“读极多、写极少”的数据，比如配置表、路由表：若用普通互斥锁，所有读都被迫排队，吞吐被一把锁封顶；换读写锁后读吞吐能随核数一起涨。但它有自己的坑。第一是写者饥饿：只要不断有新读者进来，活跃读者数永远不归零，写者就一直等不到独占机会，所以不少实现改成写者优先或读写公平排队，代价是读并行度下降。第二是升级死锁：一个线程拿着读锁时想升级成写锁，而另一个读者也在做同样的事，两边都等对方先放读锁——所以多数读写锁干脆禁止原地升级，必须先放读再抢写，放与抢之间还要防数据已被别人改掉。结论是读写锁不是互斥锁的免费升级版：写比例一旦不低，它的记账开销反而比普通锁更贵，先测读写比再选。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: pthread_rwlock_rdlock(3p) 等读写锁手册
