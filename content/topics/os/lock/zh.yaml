steps:
  - id: race
    title: 丢更新：一次 counter++ 其实是三步
    tldr: 两个线程各跑一次 counter++，结果有时只有 1 而不是 2——丢掉的那次不是算错了，而是两个线程交错读写把新结果盖没了。
    body: |-
      拿一段最普通的计数代码来看现场：`counter` 初值是 0，线程 T1 和线程 T2 各跑一次 `counter++`。CPU 执行这句代码得拆开走：先从内存把 `counter` 读进自己的寄存器，在寄存器里算出新值，最后把结果写回内存。

      只要时间线稍稍错位，结果就少了一半：T1 先读到 0 放进自己的寄存器，还没来得及写回，T2 也去内存读了一把，拿到的同样是 0。接着 T1 算出 1 写回内存，紧接着 T2 也把自己算出的 1 写回同一块地址。两条加法指令老老实实跑完了，内存里的 `counter` 却只从 0 变成 1——丢掉的那 1 不是算错了，而是被后写回去的旧结果硬生生盖掉了。

      这种「运行结果看线程谁先谁后撞运气」的毛病叫竞态条件（race condition）。它最麻烦的地方在于概率性：平时开发机上跑一万次都凑不出「两个读都压在两个写前面」，测试全绿；一到线上高并发才偶尔冒头，日志还重现不出来。遇到它千万别靠加延时或加重试掩盖——延时只是改小撞车概率，竞态的洞还在原地。
    derivation: original
    sources:
      - ref: ostep
        locator: "Concurrency: An Introduction 一章"
        claim: 对共享变量的非原子更新会产生竞态
        status: verified
        checkedBy: Muse 核查
