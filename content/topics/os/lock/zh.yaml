level: 进阶
minutes: 26
prereq:
  - os/context-switch
objectives:
  - 用交错执行解释竞态条件如何丢更新
  - 区分互斥锁、原子操作与 futex 的适用场景
  - 用等待图判断死锁的四个必要条件
aiLink: 多线程推理服务、异步网关、并行数据加载都在和竞态打交道：计数器、队列、连接池的并发 bug 几乎都是本课的交错图。理解锁与原子，才写得出正确的并发限流与线程安全的缓存。
design:
  - mechanism: "[[futex]] 把「没人抢」留在用户态，只在「真要睡」时才找内核"
    problem: 实际程序里十次加锁有九次根本没人抢，但进一次内核做系统调用外加线程切换，比执行一条原子指令慢上好几个数量级；如果每次加锁都进内核排队，最常见的正常路径反而成了最慢的瓶颈。
    choice: 让线程先在用户态用一条 CAS 原子指令试着抢锁，抢成功直接进门，零系统调用；只有在状态显示已经被占用时，才调 futex 进内核排睡眠队列。如果每次加锁都走内核，高频短临界区程序会被系统调用拖慢几十倍。
    tradeoff: 用户态和内核态要共同维护同一个状态字（0、1、2），还得小心堵住「刚要睡、锁正好放开」的唤醒丢失漏洞，把协议复杂度和调试难度全留给了基础库实现者。
    root: 快慢路径分离：把占绝大多数的顺利场景零成本留在用户态自己消化，只有必须跨线程挂起与叫醒的苦活，才交给唯一管得住调度队列的内核。
  - mechanism: 等锁为什么分成自旋与睡等两派，没法一招通吃
    problem: 临界区长度从几十纳秒到几十毫秒差了一百万倍；而且在多核机器上，「关中断」只能冻住当前这一颗核，完全挡不住别的核上的线程同时改共享数据，根本起不到互斥作用。
    choice: 按等的时间长短分层：内核里极短临界区直接原地自旋几圈，用户态可能等很久就进内核睡等（或先转几圈再睡）。只靠关中断会多核失效还丢外部响应，一味纯自旋则会把等长任务时的 CPU 白白烧光、甚至把持锁者挤到没核可跑。
    tradeoff: 程序员或线程库必须多一层选型判断，临界区估算错了就会翻车——长任务配了纯自旋会飙满 CPU，极短锁每次直接睡眠又会把切换开销放大。
    root: 两笔账的曲线必然相交：自旋花的是线性上涨的等待时间，睡眠花的是固定的上下文切换门票；门票便宜过等待时睡着值，门票贵过等待时转几圈更值。
quiz:
  - q: counter++ 在两个线程下丢更新，根本原因？
    options:
      - CPU 太快
      - 读-改-写不是原子操作，两条交错路径覆盖了对方结果
      - 内存坏了
      - 编译器优化错了
    answer: 1
    explain: 三步操作可被交错插入，必须用锁或原子指令保护临界区。
  - q: futex 相比纯自旋锁的优势？
    options:
      - 永远不阻塞
      - 无竞争时用户态原子操作搞定，有竞争时才进内核睡下，不空转烧 CPU
      - 不需要内核支持
      - 能跨机器使用
    answer: 1
    explain: futex = fast userspace mutex，快路径在用户态，慢路径才系统调用。
  - q: 死锁的四个必要条件不包括？
    options:
      - 互斥
      - 持有并等待
      - 可抢占
      - 循环等待
    answer: 2
    explain: 四条件是互斥、持有并等待、不可抢占、循环等待；破坏任意一条即可防死锁。
