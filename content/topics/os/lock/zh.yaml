- id: condvar-spurious
  title: 条件变量与虚假唤醒：为什么醒来必须再查一遍条件
  tldr: 被叫醒不等于条件成立：可能虚假唤醒，也可能条件已被别人消费，所以等待永远写成循环。
  body: '条件变量解决的是“等某件事发生”，比如队列空时消费者睡下，生产者放进元素后通知它。正确写法有个反直觉的细节：等待必须写成循环——醒来之后重新检查条件，不成立就继续睡。原因有两层。第一，存在虚假唤醒（spurious wakeup）：实现允许线程在没人通知时也醒来一次，接口规范明确不保证“醒来必有事”。第二，就算通知是真的，被叫醒到重新拿到锁之间还有一段时间，另一个消费者可能抢先把那唯一的元素取走；等你拿到锁时条件又不成立了，若代码用单次判断而不是循环，就会去取一个根本不存在的元素。还有对称的丢失唤醒问题：检查条件与进入睡眠必须是原子的，所以条件变量的等待操作要求调用者先持有互斥锁，并在睡眠的同时原子地放锁、醒来再自动拿回——这套“锁加条件变量”的组合拳，本质是把检查加睡眠这对危险的复合动作做成不可分割的一步。生产者一侧同理：修改条件必须在锁内完成、然后再发通知；若先发通知再改条件，或改条件时不拿锁，消费者完全可能刚检查完、正要睡下，通知先到一步被错过，又绕回丢失唤醒。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: pthread_cond_wait(3p) 手册
    claim: 条件等待应在循环中重新检查谓词，以应对虚假唤醒与条件被其他线程改变的情况
