level: 进阶
minutes: 38
prereq:
- os/context-switch
objectives:
- 用交错执行解释竞态条件如何丢更新
- 区分互斥锁、原子操作与 futex 的适用场景
- 用等待图判断死锁的四个必要条件
aiLink: 多线程推理服务、异步网关、并行数据加载都在和竞态打交道：计数器、队列、连接池的并发 bug 几乎都是本课的交错图。理解锁与原子，才写得出正确的并发限流与线程安全的缓存。
design:
- mechanism: futex 为什么把快路径放在用户态，内核只管等待队列
  problem: 根本约束是锁的绝大多数加锁发生在无争用状态，而一次系统调用加上下文切换的成本比一条原子指令高几个数量级；若每次加锁都进内核，最常见的路径反而最贵。
  choice: 选择用户态用原子指令直接决定无争用加锁、只有需要睡眠时才请内核排队。替代方案每次都进内核的失败模式是：无争用时也要付陷入与调度成本，高频短临界区的程序会被系统调用开销整体拖慢。
  tradeoff: 代价是协议变复杂：锁字的值要同时充当用户态状态机与内核复查的依据，glibc 这类实现必须小心处理 0、1、2 三种状态与唤醒竞态，承担者是运行库的实现者与调试者。
  root: 底层原理是快慢路径分离：把统计上占绝大多数的简单情形留在零成本的用户态，只把真正需要跨线程协调状态（谁睡了、醒时叫谁）交给唯一有资格管理睡眠队列的内核。
- mechanism: 互斥为什么不能用关中断或纯自旋通吃所有场景
  problem: 根本约束是临界区长度千差万别，从几条指令到包含慢操作都有；而多处理器上关中断只能管住本核，管不住在其他核上同时运行的线程，互斥范围根本对不上。
  choice: 选择按临界区长度分层：内核极短临界区用自旋，用户态长等待用 futex 睡眠。关中断方案的失败模式是多核下无效且长时间关中断会丢中断、伤实时性；纯自旋的失败模式是长临界区下烧光 CPU 还拖慢持锁者。
  tradeoff: 代价是同步原语变成一个家族而不是一把万能钥匙，选错就会在正确性（关中断）或性能（纯自旋）上翻车，承担者是做选型的工程师，必须先估计临界区长度与争用程度。
  root: 底层原理是等待的成本结构：自旋的成本随等待时长线性增长，睡眠的成本主要是固定的切换开销，两条成本曲线必有一个交点，任何单一策略都不可能在所有时长上都最优。
quiz:
- q: counter++ 在两个线程下丢更新，根本原因？
  options:
  - CPU 太快
  - 读-改-写不是原子操作，两条交错路径覆盖了对方结果
  - 内存坏了
  - 编译器优化错了
  answer: 1
  explain: 三步操作可被交错插入，必须用锁或原子指令保护临界区。
- q: futex 相比纯自旋锁的优势？
  options:
  - 永远不阻塞
  - 无竞争时用户态原子操作搞定，有竞争时才进内核睡下，不空转烧 CPU
  - 不需要内核支持
  - 能跨机器使用
  answer: 1
  explain: futex = fast userspace mutex，快路径在用户态，慢路径才系统调用。
- q: 死锁的四个必要条件不包括？
  options:
  - 互斥
  - 持有并等待
  - 可抢占
  - 循环等待
  answer: 2
  explain: 四条件是互斥、持有并等待、不可抢占、循环等待；破坏任意一条即可防死锁。
