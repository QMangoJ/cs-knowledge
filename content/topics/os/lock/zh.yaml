- id: futex
  title: 抢不到怎么办：futex 让线程睡一会
  tldr: 抢不到锁时，线程通过 futex 系统调用请内核让自己睡眠，锁释放后再被唤醒。
  body: '一直空转重试（自旋）浪费 CPU，所以 Linux 的 pthread_mutex 抢不到时会调用 futex，让内核把线程挂起。

    线程 1 解锁时，如果发现有人在等，就再调用 futex 唤醒一个。

    这种“没人抢走快路、有人抢才进内核”的设计，让锁在常见情况下几乎没有开销。

    再补一个容易误解的点：睡眠不是把线程“冻住丢掉”，醒来后它还要重新竞争一次锁——被唤醒只说明“锁可能空了，来试试”，不保证试就一定成功；若又有新线程抢先拿走，它可能还要再睡一轮。这也是高争用下会出现个别线程反复被后来者插队、等得格外久的原因之一，后面讲公平性时会回到这一点。用 strace 跟踪一个有锁争用的程序，能直接看到 futex 的等待与唤醒成对出现；若程序卡住时线程栈都停在 futex 上，排障的第一嫌疑就是锁的争用或死锁，而不是业务逻辑本身。'
  derivation: original
  sources:
