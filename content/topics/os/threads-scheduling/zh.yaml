  - id: stcf-rr
    title: 放宽假设：STCF 抢占短作业，轮转保响应
    tldr: 给 SJF 加上抢占得到 STCF，它在已知剩余时间时仍可证最优；而轮转调度牺牲周转，把响应做到最好。
    body: |-
      先修 SJF 的第一个假设。作业陆续到达时，只要允许抢占，问题就有解：新作业到达时，比较所有在场作业的剩余时间，谁剩余最少就让谁跑，这叫最短完成时间优先（STCF）。还是 A 先到跑 100 秒、B 与 C 在第 10 秒到达各需 10 秒：STCF 在 B、C 到达时立刻抢占 A，先让 B、C 跑完（完成时刻 20、30），再回头让 A 跑完剩余 90 秒（完成时刻 120），平均周转是 (120+10+20)/3 = 50 秒，与同批到达时的最优一致。可以证明，只要剩余时间已知，STCF 对平均周转是最优的。

      但 STCF 的响应很差：长作业可能很久都轮不到第一次运行。分时系统里用户盯着屏幕，响应才是命门。轮转调度（RR）反其道而行：每个作业轮流跑一个时间片（如 10 毫秒），到点就换下一个。三个各需 30 毫秒的作业用 5 毫秒时间片轮转，每个作业在第一个轮次内就被调度到，平均响应只有几毫秒；而 STCF 式排法里排在最后的作业要干等 60 毫秒才第一次动。代价写在周转上：轮转让所有作业挤在最后一起完成，平均周转明显变差；时间片越短，切换次数越多，那笔固定切换税吃掉的 CPU 比例越高（时间片 10 毫秒、切换 10 微秒时税率 0.1%，压到 100 微秒时涨到 10%）。

      走到这里，图景已经清楚：FCFS 输在护航，SJF 与 STCF 赢在对长度的利用、输在对长度的无知与响应，RR 赢在响应、输在周转与切换税。真实调度器必须同时回答两个问题：长度不知道怎么办，响应与周转怎么兼得。下一节先直面「不知道」这三个字。
    derivation: original
    sources:
      - ref: ostep
        locator: Ch.7.5 STCF 与 7.6-7.7 响应时间与 Round Robin
        claim: STCF 是抢占式 SJF，在已知剩余时间时对平均周转可证最优；RR 以时间片轮转换取低响应，时间片越短切换开销占比越高
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照 OSTEP Ch.7 原文（PDF）核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: app
          id: ja
          label: 作业 A
          state: 已跑 10 秒 · 被抢占
        - lane: app
          id: jb
          label: 作业 B
          state: 刚到达 · 剩余 10 秒
          highlight: true
        - lane: kernel
          id: sched
          label: 调度器（STCF）
          state: 比较剩余时间挑最小者
        - lane: hw
