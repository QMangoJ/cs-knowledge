          label: A 挂起，等短作业清完再回来
    log:
      - mode: 抢占
        event: 新作业到达触发重新比较，剩余最少者上场
    points:
      - STCF = SJF + 抢占，最优的前提仍是剩余时间已知
      - RR 用时间片买响应，时间片下限被切换税卡住
  - id: unknown-length
    title: 核心困境：作业要跑多久，原则上没人知道
    tldr: SJF 家族的最优都押在「已知未来」上；真实系统只能拿作业的历史行为去猜它的下一次表现。
    body: |-
      把 SJF 与 STCF 的前提再盯住看一眼：它们要的不是当前的任何状态，而是每个作业未来的总时长。这份信息在原理上就不存在——对任意程序预先算出它要运行多久，与停机问题同源，无法由任何机械过程普遍给出；退一步说，程序自己也从不申报时长，编译产物里没有「本程序将运行 47 秒」这种字段。

      调度器手里真正有的，只有已经发生的历史：这个作业过去几次 CPU burst（连续使用 CPU 的段落）各有多长、它多久发起一次 I/O、它已经活了多久。经典教材给过一条用历史猜未来的公式：下一次 burst 的预测值取指数加权平均，让预测对行为变化既有记忆又能跟上——但它猜的是单次 burst 而不是作业总长，而且程序的行为有相位性（先交互一阵、再埋头计算一阵），用上一相位的表现预测下一相位会系统性地错。调度器面对的其实是一个在线学习问题：决策必须现在做，答案只能事后揭晓，而且被调度对象还会针对规则改变自己的行为。

      想通这一层，下一个主角就呼之欲出了：既然无法预知长度，那就让每个作业先以「短作业」的身份上场，用它真实消耗 CPU 的方式自我暴露——跑得短的自然早早结束，跑得长的会被一层层下放。用历史猜未来、让行为给作业分类，这正是多级反馈队列的全部思想。
    derivation: original
    sources:
      - ref: ostep
        locator: Ch.8 The Multi-Level Feedback Queue（章首的问题陈述）
        claim: MLFQ 要解决的核心难题是调度器一般并不知道作业要跑多久，只能从运行历史中学习作业特征
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照 OSTEP Ch.8 原文（PDF）核查，记录见 docs/curriculum-audit.md
    canvas:
