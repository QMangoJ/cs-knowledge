  - id: kernel-tasks
    title: 内核的视角：没有进程与线程之分，只有任务
    tldr: Linux 用 clone 时的一组标志决定新任务与父任务共享多少，调度器面对的从来都是任务队列。
    body: |-
      到了 Linux 内核这一层，进程与线程的二分法干脆消失了。创建新执行流的系统调用是 clone，它带一组标志位：CLONE_VM 表示共享地址空间，CLONE_FILES 表示共享文件描述符表，CLONE_SIGHAND 表示共享信号处理。fork 其实就是 clone 不带任何共享标志的特例，pthread_create 则是 clone 带上全套共享标志的特例——两端之间是连续谱，而不是两个物种。

      于是内核里只有一种被调度的对象：任务（task_struct）。每个任务有自己的内核栈与寄存器保存区，它指向的地址空间、文件表则可以与别的任务共用同一份。你平时说的进程，在内核里对应一组共享了地址空间的任务，其中带头那个的 ID 被叫做进程号（getpid 返回的其实是线程组号，每个线程另有自己的任务号）。

      推论很漂亮：调度器不需要为进程与线程写两套逻辑，挑任务就是挑任务；上下文切换的机制对两者一字不差地适用，差别只在切换时地址空间指针要不要换。代价是任务数可以轻松上万，调度器的数据结构与每次决策的成本都必须按这个量级设计——这正是后面每个调度算法都极其在意常数开销的原因。对照另一条路线：纯用户级线程（早期绿色线程）由语言运行时在一条内核任务上模拟多条流，内核看不见它们，一个线程发起阻塞系统调用，整个进程的所有流一起停摆，也用不上多核——现代运行时向内核线程靠拢，原因正在这里。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: clone(2) 的 CLONE_VM / CLONE_FILES 等标志说明
        claim: clone 用标志位决定新任务与父任务共享地址空间、文件表等的程度
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
      - ref: linux-kernel-docs
        locator: 内核调度文档（Scheduler）总览
        claim: Linux 的调度单位是 task，进程与线程在内核里是共享程度不同的任务
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
