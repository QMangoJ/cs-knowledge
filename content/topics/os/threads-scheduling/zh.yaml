      kind: swimlane
      actors:
        - lane: app
          id: jb
          label: 交互作业 B
          state: 跑 1 毫秒就等键盘：留守顶层
          highlight: true
        - lane: app
          id: ja
          label: 长作业 A
          state: 用满两层配额：已下沉底层
        - lane: kernel
