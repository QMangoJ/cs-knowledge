  - id: fcfs-sjf
    title: FCFS 的护航效应，与 SJF 的最优和它的两个谎言
    tldr: 先来先服务会被一个长作业拖住全体；最短作业优先可证平均周转最优，前提是同时到达且长度已知。
    body: |-
      最朴素的策略是先来先服务（FCFS）：队列怎么排就怎么跑，不抢占。拿三个同批到达的作业算账：A 要跑 100 秒，B 与 C 各 10 秒，A 恰好排在最前。于是 A 在 100 秒完成，B 等到 110 秒，C 等到 120 秒，平均周转是 (100+110+120)/3 = 110 秒。B 与 C 明明十秒就能走人，却被一辆「重卡」堵在单车道上，这叫护航效应。

      换成最短作业优先（SJF），顺序变成 B、C、A：完成时刻是 10、20、120，平均周转 (10+20+120)/3 = 50 秒，不到 FCFS 的一半。而且在「同批到达、不可抢占」的条件下可以证明 SJF 的平均周转就是最优的：任何把长作业往前挪的交换，都只会让更多作业的完成时刻推后。超市里专设十件以下快速通道，用的正是这条原理。

      但 SJF 的最优证明藏着两个现实中不存在的假设。第一，它假设所有作业同时到达：一旦作业陆续到达，正在跑的长作业不会为刚到的短作业让路，非抢占的 SJF 会把护航效应原样带回来。第二，它假设调度器知道每个作业要跑多久——程序还没跑，你怎么知道它要跑 10 秒还是 100 秒？没有这份知识，SJF 连排队依据都不存在。所以 SJF 的正确读法不是一个可落地的算法，而是一把标尺：它告诉我们信息完备时最优长什么样，后面所有真实算法都是在信息缺失的条件下向它逼近。
    derivation: original
    sources:
      - ref: ostep
        locator: Ch.7.3 FIFO 与 7.4 Shortest Job First（护航效应与数值例）
        claim: A=100、B=C=10 且 A 先行时 FCFS 平均周转 110 秒，SJF 排成 B、C、A 后为 50 秒，且同批到达时 SJF 可证最优
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照 OSTEP Ch.7 原文（PDF）核查，记录见 docs/curriculum-audit.md
