      - mode: 成本
        event: 线程切换跳过换页表与翻译失效，进程切换跳不过
    points:
      - 切换成本 = 直接开销（微秒级）+ 间接开销（缓存与 TLB 变冷）
      - 时间片越短，固定切换税占比越高：时间片的下限由此而来
    mistake: 认为线程切换不要钱所以随便切：开销虽小但固定存在，时间片切到与切换同量级时 CPU 就全花在换人上了。
  - id: goals-metrics
    title: 调度的目标：总时间快和响应快天生打架
    tldr: 选谁上场之前先立量尺：周转时间看「一件事办完要多久」，响应时间看「点下去多久才动」；这两个指标天生拉扯，没有哪个算法能两边同时拿满分。
    body: |-
      内核队伍里排满了一条条待命的任务，现在问题从「换谁」变成「挑谁」。挑人看似简单，背后其实是两本互相打架的账。第一本叫周转时间（完成时刻减去到达时刻），关心的是「任务从进门到彻底做完花了多久」，后台编译和批处理最看重这本账。

      第二本叫响应时间（首次上场减去到达时刻），关心的是「任务来了之后多久才有人开始理它」。你在浏览器里敲回车或点菜单，哪怕渲染总耗时一样，只要前 10 毫秒就开始动、边算边回显，体感就丝滑；干等半秒没动静就觉得卡死了。除此之外还要盯吞吐量（单位时间办完几件事）和公平性。

      为什么两本账天生打架？为了压低平均周转，理应把短任务全部插到最前面跑完，长任务一直靠边站——可长任务的响应和公平立刻跌穿；为了保证人人都有响应，就得切成短时间片轮流上，可这一轮轮切下来，不仅切换税涨了，平均周转也变差了。下面先用教材最经典的简化条件（纯用 CPU、不碰 I/O）把策略一步步推出来，看看真实调度器是怎么拆招的。
    derivation: original
    sources:
      - ref: ostep
        locator: Ch.7 Scheduling Introduction（调度指标一节）
        claim: 周转时间定义为完成时刻减到达时刻，响应时间定义为首次被调度减到达时刻，两者与公平常互相冲突
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照 OSTEP Ch.7 原文（PDF）核查，记录见 docs/curriculum-audit.md
