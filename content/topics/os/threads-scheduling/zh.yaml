    log:
      - mode: 反转
        event: H 的命运被与它无关的 M 决定，阻塞时长失去上界
    points:
      - 有界倒置不可怕：持锁者不被打断时，阻塞最长就是一个临界区
      - 优先级继承让阻塞关系反向传播优先级，把无界压回有界
    mistake: 把优先级反转当成死锁：死锁是循环等待、永远不解；反转里锁终究会释放，只是释放时刻被无关任务无限推迟。
design:
  - mechanism: 调度单位与资源容器正交：内核只调度任务，地址空间与文件表是任务可以共享的资源指针，进程只是共享了全套资源的一组任务
    problem: 程序内部的多个执行流天然要共享数据，把它们拆成进程会被隔离的成本反噬（IPC 拷贝、对象膨胀），合成一条流又无法重叠等待与计算；把「执行」与「资源归属」捆成一个概念，注定在某类负载下别扭。
    choice: 把两个维度拆开：task 是可运行实体的唯一形态，共享程度由 clone 的标志位连续调节，fork 与建线程是同一机制的两端。纯用户级线程，内核看不见执行流，一次阻塞拖住全体也用不上多核；全用多进程加共享内存，编程模型与内核对象成本都失控。
    tradeoff: 任务数量轻松上万，调度器的数据结构与决策成本必须按这个规模设计；共享换来的通信便利，则把竞态的正确性账单转嫁给了程序员与锁机制。
    root: 抽象的正交分解律：调度只关心谁能运行，资源共享是实体之间的引用关系，两者本是独立的轴。捆死一根轴的设计（传统进程观）在另一根轴的需求面前必然露馅，拆开之后进程与线程之争自动消解为参数选择。
  - mechanism: MLFQ 用行为反馈定层级：先假设每个作业都是短作业，用满配额者逐级下放，定期全体提升回顶，以在线学习近似离线最优的 SJF
    problem: SJF 与 STCF 的最优性建立在一份不存在的信息上：作业未来要跑多久原理上不可预知。任何想直接实现最优的调度器都缺了输入，可调度决策又必须在每个时间片结束时当场作出，一刻不能等。
    choice: 用可观测的过去替代不可知的未来：作业是否用满配额是它自己暴露的类型信号，频繁让出者按交互型对待，长跑者按批处理型对待。由用户静态指定优先级，信息来自人的猜测、易错且人人自报最高；纯轮转，则彻底放弃对周转的优化。
    tradeoff: 规则会被被调度者针对性利用（在配额边缘伪造 I/O），要靠累计记账补防；队列层数、配额与提升周期全是负载相关的手调参数，调坏时响应与周转可以同时输掉。
    root: 在线算法的宿命与章法：未来不可知而决策不可免时，最优的提法本身要让位于「用反馈逼近」——MLFQ 用行为近似 SJF、LRU 用访问历史近似 Belady 最优、TCP 用丢包反馈猜可用带宽，是同构的三件事。凡决策系统缺了未来的输入，最后都会长成一个带历史记忆的反馈回路。
  - mechanism: 优先级继承：被高优先级任务阻塞的锁持有者临时继承对方的优先级，让优先级沿阻塞链反向传播，使阻塞时间重新有界
    problem: 优先级与锁是两套各自正确的机制：优先级说 H 最急，锁的持有关系却让一个与 H 毫无关系的 M 决定 H 何时能推进。两个局部正确的规则组合出全局荒谬，且故障只在特定时序窗口出现、概率低，测试极难撞见——Pathfinder 是在火星上才暴露的。
    choice: 让依赖关系改写优先级：H 阻塞在 L 的锁上时，L 临时按 H 的优先级运行，直到放锁。优先级天花板需要预先静态知道每把锁的全部使用者，通用性差；持锁期间禁止抢占，简单却把临界区长度直接变成所有人的响应延迟；不用固定优先级，则等于放弃实时保证本身。
    tradeoff: 继承要沿阻塞链逐级传递、与嵌套锁组合时实现并不简单，且它只治反转、不治死锁；天花板协议防得更全，代价是静态分析与更高的日常优先级膨胀。
    root: 组合性的一条普遍教训：系统中只要同时存在「顺序」（优先级）与「依赖」（锁），顺序就必须沿依赖边传播，否则顺序是假的。单机制的最优与正确从不保证组合后的性质，接口处的语义合成才是系统设计真正难的地方。
level: 进阶
minutes: 26
prereq:
  - os/context-switch
objectives:
  - 说清线程与进程共享与独享的清单，并解释 Linux 为何只认任务
  - 用周转与响应两把尺子算 FCFS、SJF、STCF 在同一组作业上的账
  - 复述 MLFQ 五条规则，并解释它为何能在不知道时长时近似 SJF
  - 画出优先级反转的三方时序，并说清优先级继承如何把阻塞压回有界
aiLink: LLM 推理服务同样是调度问题：请求长短未知、交互延迟敏感，vLLM 等引擎的连续批处理与抢占策略本质是在 GPU 上重演 SJF 与时间片之争；多线程推理后端的线程池与锁竞争，也逃不开本课的共享清单与优先级反转。
