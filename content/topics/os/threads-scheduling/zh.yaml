      messages:
        - id: m1
          from: sched
          to: ja
          label: A 先上场，一口气跑满 100 秒
          active: true
    log:
      - mode: 护航效应
        event: 短作业排在长作业后面，平均周转被整体拖高
    points:
      - 护航效应：一个长作业堵住后面所有短作业
      - SJF 的最优只在同批到达加长度已知时成立
    keyFields:
      - key: FCFS 平均周转
        value: (100+110+120)/3 = 110 秒
      - key: SJF 平均周转
        value: (10+20+120)/3 = 50 秒
  - id: stcf-rr
    title: 允许抢占的 [[STCF]] 保周转，轮转 [[RR]] 保响应
    tldr: 允许半路抢占就能在任务陆续到达时守住 50 秒的最优周转（STCF），但它还是会让排队的任务迟迟动不了；轮转调度（RR）用时间片把响应打下来，代价是周转变差和切换税。
    body: |-
      先拆掉 [[SJF]] 的第一个假前提：任务陆续到达怎么办？只要允许抢占，每次新任务进队时把在场所有人的「剩余时长」比一比，谁剩得最少就换谁上，这就是最短完成时间优先（STCF）。还是刚才的数字：大任务 A 在 t=0 到达（需 100 秒），跑到第 10 秒时还剩 90 秒；此时 B 和 C 到达（各需 10 秒）。10 秒远小于 90 秒，STCF 立刻把 A 压下去，先放 B 在第 20 秒跑完、C 在第 30 秒跑完，再请回 A 跑完剩下的 90 秒（第 120 秒完工）。算周转：A 花 120 秒，B 花 20 − 10 = 10 秒，C 花 30 − 10 = 20 秒，平均周转 (120 + 10 + 20) / 3 = 50 秒，照样贴着理论最优走！

      可用户对着屏幕根本等不了 STCF。假设现在有三个各需 30 毫秒的普通任务排队，按 STCF 风格的「跑完一个再换下一个」，排第三的那个任务整整前 60 毫秒连第一行代码都跑不上，屏幕看着就像卡死了。桌面和交互系统需要的是轮转调度（[[RR]]）：切一个短时间片（比如 5 毫秒），大家轮流跑一小段，不到 10 毫秒每个人都已经亮过相，平均响应瞬间降下来。

      这笔交易的账单同样清楚：轮转把大家拖到最后几乎一起结束，平均周转明显变坏；而且时间片切得越碎，第 4 步算过的固定切换税占比越高（10 毫秒片配 10 微秒切换只损 0.1%，压到 100 微秒就损掉 10%）。走到这里，真正的难题露底了：既要尽量像 STCF 那样让短活先走，又要像 RR 那样让交互任务快响应，偏偏我们又不知道每个任务要跑多久。
    derivation: original
    sources:
      - ref: ostep
        locator: Ch.7.5 STCF 与 7.6-7.7 响应时间与 Round Robin
        claim: STCF 是抢占式 SJF，在已知剩余时间时对平均周转可证最优；RR 以时间片轮转换取低响应，时间片越短切换开销占比越高
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照 OSTEP Ch.7 原文（PDF）核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: app
          id: ja
          label: 作业 A
          state: 已跑 10 秒 · 被抢占
        - lane: app
          id: jb
          label: 作业 B
          state: 刚到达 · 剩余 10 秒
          highlight: true
        - lane: kernel
          id: sched
          label: 调度器（STCF）
          state: 比较剩余时间挑最小者
        - lane: hw
          id: cpu
          label: CPU 核心
      messages:
        - id: m1
          from: sched
          to: jb
          label: B 剩余最少：抢占 A，先跑 B
          active: true
        - id: m2
          from: sched
          to: ja
          label: A 挂起，等短作业清完再回来
    log:
      - mode: 抢占
        event: 新作业到达触发重新比较，剩余最少者上场
    points:
      - STCF = SJF + 抢占，最优的前提仍是剩余时间已知
      - RR 用时间片买响应，时间片下限被切换税卡住
  - id: unknown-length
    title: 核心困境：作业要跑多久，原则上没人知道
    tldr: 调度器手里根本拿不到任务的未来总耗时——这不是测不准，而是和停机问题同源的不存在信息；手头能翻的只有它过去跑了多久这本历史账。
    body: |-
      回看一眼 [[SJF]] 和 [[STCF]] 的要求：它们要的不是任务现在占了多少内存，而是「这个任务未来总共还会用掉多少秒 CPU」。这份信息在原理上就不存在——编译器不可能在可执行文件头里印上一行「本程序将运行 47 秒」，从理论上讲，预先算出任意程序何时停下来本身就和停机问题等价。

      调度器手里真正握着的，只有已经发生过的历史：这个任务前几次连续占用 CPU（CPU burst）各跑了几毫秒、它多频繁地自己停下来等网络或键盘、它一共已经活了多久。早年教材给过一个用过去猜下一段 burst 的指数加权平均公式，可实际程序往往分阶段变脸——浏览器先是几毫秒一停地响应用户滚动，紧接着一口气导出几兆数据埋头算好几秒。拿上一阶段的行为去套下一阶段，预测会系统性地猜反。

      既然没法事先问出长度，不如反过来让程序自己跑着暴露身份：每个新任务一进门都先当成「短小灵活的交互任务」放高优先级试跑几毫秒，跑着跑着真停下来等点击的就一直留高层，一口气跑满配额不肯撒手的就自己证明自己是长任务，乖乖往下层挪。用历史行为代替未来先知，正是多级反馈队列的全部起点。
    derivation: original
    sources:
      - ref: ostep
        locator: Ch.8 The Multi-Level Feedback Queue（章首的问题陈述）
        claim: MLFQ 要解决的核心难题是调度器一般并不知道作业要跑多久，只能从运行历史中学习作业特征
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照 OSTEP Ch.8 原文（PDF）核查，记录见 docs/curriculum-audit.md
    canvas:
