    log:
      - mode: 成本
        event: 线程切换跳过换页表与翻译失效，进程切换跳不过
    points:
      - 切换成本 = 直接开销（微秒级）+ 间接开销（缓存与 TLB 变冷）
      - 时间片越短，固定切换税占比越高：时间片的下限由此而来
    mistake: 认为线程切换不要钱所以随便切：开销虽小但固定存在，时间片切到与切换同量级时 CPU 就全花在换人上了。
  - id: goals-metrics
    title: 调度的目标：先有量尺，才有算法
    tldr: 周转时间、响应时间、公平与吞吐互相拉扯；没有量尺，任何调度策略之争都是空谈。
    body: |-
      调度器每次要在就绪队列里挑一个任务，看似只是挑人，实际是在多个互相冲突的目标之间下注。先把量尺立起来。周转时间是一个作业从到达系统到完成的总时长（完成时刻减去到达时刻），度量「把事情办完要等多久」，批处理系统最在乎它。

      响应时间是作业从到达到第一次被调度运行的时长，度量「多久才有人开始理我」。用户敲下回车后界面多久有反应，看的是响应而不是周转：一个作业哪怕总共要跑一分钟，只要它一瞬间就开始动、持续给反馈，体感就是流畅的。另外两把尺是吞吐（单位时间完成的作业数）与公平（每个任务拿到的 CPU 份额是否与其权重相称）。

      这些量尺天生互相拉扯。想压周转，就应该让短作业先跑完、长作业后面排队，可长作业的响应与公平立刻受损；想保响应，就得频繁轮换让每个人都先动起来，可轮换的切换开销又拖累吞吐与周转。任何调度算法都是在这组矛盾里选了一个立场，而不是找到了全能的解——后面每一种策略，都可以翻译成一句话：它优先保哪把量尺、牺牲哪把。先说清一个贯穿全课的简化：以下经典策略大多假设作业只用 CPU、不做 I/O，而且同批到达；放宽这些假设的过程，就是调度算法一路变复杂的全过程。
    derivation: original
    sources:
      - ref: ostep
        locator: Ch.7 Scheduling Introduction（调度指标一节）
        claim: 周转时间定义为完成时刻减到达时刻，响应时间定义为首次被调度减到达时刻，两者与公平常互相冲突
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照 OSTEP Ch.7 原文（PDF）核查，记录见 docs/curriculum-audit.md
