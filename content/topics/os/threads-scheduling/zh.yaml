      - 调度器只认任务：挑谁、换谁的逻辑对进程线程一视同仁
  - id: switch-cost
    title: 切换的成本账：线程切换到底省了哪一笔
    tldr: 同进程切线程不仅少搬几条状态，更省掉了整张页表作废、[[TLB]] 变冷的重填代价；但每次切换仍有微秒级的固定税，把时间片下限死死卡住。
    body: |-
      把进程切换和线程切换摆在一起对账。换一个进程跑，意味着地址空间整体换人，硬件必须把页表基址换掉，原本缓存在 [[TLB]] 里的旧地址翻译全数作废，CPU 缓存里留着的也是上一个进程的数据。新进程上场后，前一阵子几乎每次访存都要重新查表、重新把数据从主存搬进缓存——这笔让缓存变冷的间接开销才是进程切换贵的大头。

      在浏览器进程内部从下载线程切到界面线程，页表基址一动不动，TLB 里的翻译和缓存里的图片数据大概率还是热的，唯一要换的只有寄存器和栈指针，直接和间接成本双双大降。

      不过便宜不等于免费，每次切换依然有几微秒的纯管理开销，不产生任何用户产出。算笔比例账：如果时间片是 10 毫秒、切换花 10 微秒，切换税只占千分之一，完全无感；可要是为了追求极致响应把时间片压到 100 微秒，同样 10 微秒立刻吃掉整整 10% 的 CPU！时间片下限就是被这笔固定税顶住的。另外每个线程还得背一份用户栈和内核栈，早期「一个连接开一条线程」的老式服务器连接一暴涨就先内存告急，账就记在这里。
    derivation: original
    sources:
      - ref: ostep
        locator: Ch.6 Limited Direct Execution（上下文切换成本讨论）
        claim: 上下文切换有直接开销，进程切换还会因 TLB 与缓存变冷产生间接开销
