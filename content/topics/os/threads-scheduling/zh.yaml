    points:
      - 进程是资源容器，线程是执行流，调度轮换的是执行流
      - 线程的全部价值来自共享：通信不需要拷贝与协议
    mistake: 把多开进程当成多线程的平替：隔离粒度不同，进程间共享数据要走 IPC，成本与编程模型完全是两回事。
  - id: shared-private
    title: 共享与独享清单：两条线程到底什么不共有
    tldr: 同进程的线程共用代码、堆、全局变量和文件，只各自留着寄存器、栈和线程本地存储；切人时只换那一小撮独享状态，这正是线程切换便宜的根源。
    body: |-
      把浏览器进程的全部家当摊开，判断归谁其实只有一条标准：这项东西描述的是「程序正在处理的共同数据」，还是「某一条执行流走到哪一步了」。代码段、堆内存、全局和静态变量、打开的文件、当前工作目录，全由同一进程的所有线程共用一份——本来就是同一个工作现场。

      每条线程各有一份的，是寄存器全套（包含当前指令地址 PC 和栈指针）、自己的函数调用栈、线程 ID、调度优先级，以及线程本地存储（[[TLS|TLS（线程本地存储）]]）。等一下，为什么栈和寄存器非分开不可？你想，如果界面线程和下载线程共用同一个指令地址寄存器，两伙人就只能执行同一行代码，退化成一条流；要是共用同一个栈，刚压进去的函数返回地址立刻被另一边踩烂。C 语言里的错误码 errno 也得做成线程本地，才不会两条线程同时出错时互相覆盖。

      这张清单直接划出了两件大事。第一，切换同进程的线程时，真正必须保存和恢复的只有寄存器和栈指针这一小撮独享状态，庞大的内存空间原封不动，切起来自然轻巧；第二，所有竞态 bug 都从清单的共享那一侧长出来——两条线程同时给同一个全局计数器加一，读、改、写三步交错就丢更新。
    derivation: original
    sources:
