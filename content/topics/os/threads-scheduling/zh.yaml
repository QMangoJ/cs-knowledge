      - 优先级继承让阻塞关系反向传播优先级，把无界压回有界
    mistake: 把优先级反转当成死锁：死锁是循环等待、永远不解；反转里锁终究会释放，只是释放时刻被无关任务无限推迟。
design:
  - mechanism: 把「执行流」和「资源容器」拆开：内核只调度任务，进程只是共用同一套资源的任务组
    problem: 同一程序里的界面、渲染、下载天然要频繁共用一块内存；硬拆成独立进程，每次传数据都要复制和走协议，可只留一条流又没法边等网络边刷界面。
    choice: 让内核调度器只认「任务」一种对象，用 [[clone]] 的标志位自由组合到底共享多少（从完全隔离的进程到全共享的线程）；不走纯用户级线程，因为内核看不见它们，一阻塞就拖死整个进程。
    tradeoff: 轻量之后任务数量容易上万，调度数据结构必须足够快；同时大家共用一块内存的便利，立刻把线程安全和数据竞争的账单交给了锁。
    root: 「谁能上 CPU」和「能看到哪些内存文件」本来就是两根独立的轴，绑死在一起迟早别扭，拆开后进程和线程只剩参数差别。
  - mechanism: 用行为反馈逼近最优：先让新任务进顶层，用满配额就降级，再定期全部提回顶层
    problem: "[[SJF]] 和 [[STCF]] 虽能把平均周转压到理论最低，但它们需要知道每个任务未来要跑多久——这份信息在现实里根本不存在，调度器却必须在每个时间片结束时当场挑人。"
    choice: 既然未来查不到，就看可观测的过去：把用满配额当成长任务的自首信号往下贬，把主动让出等数据的当成交互任务留高层，再拿周期提升防饿死；比人工填静态优先级靠谱，也比纯轮转更能兼顾总耗时。
    tradeoff: 规则一公开就会被人钻 99% 假装让出的空子，得靠累计记账堵死；而且层数、配额和提升周期都要靠经验调，调歪了响应和周转会一起变差。
    root: 只要决策缺了未来信息又必须当下拍板，最优解就会变成「带记忆的反馈回路」——MLFQ 用配额猜短作业、页面置换用访问位猜热页、TCP 用丢包猜带宽，全是一个套路。
  - mechanism: 优先级继承：持锁的低优先级任务临时借用等待者的优先级，防止被无关的中间任务抢占
    problem: 固定优先级说「H 最急」，互斥锁却说「L 没放锁谁都别想拿」——两套各自正确的规矩拼在一起，让一个毫不相干的中优先级 M 间接拖死了 H，且这种时序极难在测试里撞见。
    choice: 让阻塞链条反向传递优先级：H 等 L 的锁时，L 临时按 H 的优先级跑到放锁为止；这比静态天花板协议灵活（不用提前报备每把锁的全部使用者），也比持锁禁抢占伤及无辜面小。
    tradeoff: 嵌套多层锁时继承关系会顺着依赖链传递，实现并不简单，而且它只能防止被别人无限插队，依然治不了两把锁互相等待的 [[死锁]]。
    root: 系统里同时出现「紧急程度」和「前后依赖」时，紧急程度必须顺着依赖关系往回传，不然最急的人早晚会被最不急的链条末端卡住。
