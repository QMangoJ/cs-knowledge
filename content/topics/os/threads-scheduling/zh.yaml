        event: 最优策略需要的未来信息不存在，只能退而用历史预测
    points:
      - 作业时长不可预知：不是测不准，而是原理上没有这份信息
      - 调度本质是在线决策：先行动，答案后揭晓
    mistake: 以为给 SJF 配一个「更准的时长预测」就能落地：预测的只是单次 burst，且作业行为有相位变化，押注全局时长注定系统性出错。
  - id: mlfq-rules
    title: 多级反馈队列：先假设人人都是短作业
    tldr: 新作业一律进最高层，用满配额就降一级，频繁让出者留原地，定期全体提升回顶层。
    body: |-
      多级反馈队列（MLFQ）把队列排成若干层，每层一个优先级，高层先跑，同层内部轮转。它用五条规则运转。规则一与二定选人：高优先级队列里的作业先于低层运行，同层作业之间用轮转。规则三定入场：新作业一律放进最高层，先按短作业对待。规则四定升降：作业在某层累计用满该层的配额（allotment）就降一级；若它在用满前主动让出 CPU 去等 I/O，就留在原层。规则五定兜底：每过一段时间 S，把所有作业统统提回最高层。

      重放前面的场景：一个长作业独自运行，在顶层用满配额被降到中层，再用满又降到底层，此后以大时间片慢慢跑；一个短小的交互作业中途到达，进顶层，跑一两毫秒就去等键盘，规则四让它留守顶层，每次醒来都能立刻被调度，响应极佳。调度器从没问过任何作业的时长，却达到了近似 SJF 的效果——短作业在高层迅速完结，长作业自己证明自己是长作业，然后被请到下层。

      关键在规则四：用满配额是作业亲手写下的自我证词，比任何预测都可靠；交互作业频繁因 I/O 让出 CPU，永远攒不满配额，于是被行为本身钉在高层。这正是「让历史决定未来」的具体长相：不是估一个数，而是看一类行为模式。规则五的定期提升同时治两个病：低层长作业不被源源不断的交互作业永久饿死；作业的行为从计算型转成交互型时，有一次重新做人的机会。S 多大需要权衡：太小则长作业频繁回顶挤占交互作业，太大则低层饿得太久。
    derivation: original
    sources:
      - ref: ostep
        locator: Ch.8.1-8.3 MLFQ 五条基本规则与优先级提升
        claim: MLFQ 规则 1-5：高层优先、同层轮转、新作业入顶层、用满配额降级、提前让出留原层、周期 S 全体提升；其目标是近似 SJF
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照 OSTEP Ch.8 原文（PDF）核查，记录见 docs/curriculum-audit.md
