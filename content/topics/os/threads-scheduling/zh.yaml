          label: A 定期被提回顶层，不至饿死
    log:
      - mode: MLFQ
        event: 行为决定层级：短作业自证其短，长作业自证其长
    points:
      - 五条规则的核心是规则四：用满配额才降级，提前让出不惩罚
      - MLFQ 近似 SJF 的方式不是预测时长，而是让作业用行为自证
    keyFields:
      - key: 配额（allotment）
        value: 作业在某层累计可用的 CPU 量，用满即降一级
      - key: 提升周期 S
        value: 全体回顶层的间隔，太小挤交互、太大饿长作业
  - id: mlfq-flaws
    title: MLFQ 的软肋：饿死、钻空子，与 Linux 的另一条路
    tldr: 交互作业太多时低层会被饿死，聪明的程序还能伪造 I/O 骗保层级；修法是记账方式与参数，而 Linux 干脆换了记账本。
    body: |-
      先看规则四的一个著名漏洞。若「提前让出就留原层」的判定只看单次让出，一个作业可以在配额快用满时（比如用到 99%）主动发起一次微不足道的 I/O，骗得进度清零、层级保留，如此循环就能几乎独占高层。修法是把记账改成累计口径：无论中间让出多少次，作业在这一层用掉的 CPU 总量只增不减，攒满配额必降级，让伪装的成本高于收益。这条修正说明了一件更普遍的事：调度规则一旦公布，被调度者就会针对规则优化自己的行为——调度器设计本质上包含机制设计。

      饿死与参数是另外两笔账。没有规则五，交互作业足够多就能让低层作业无限期停摆；有了规则五，S 与每层的配额、时间片配比又全是需要针对负载手调的参数，调坏了的 MLFQ 可以同时输掉响应与周转。历史上多个商用系统的调度器都是 MLFQ 的变体，它们的调参经验很大程度上是手艺而非科学。

      Linux 主线最终没有走 MLFQ，而是走了账本路线：CFS 用虚拟运行时间做统一记账，天然免疫这种伪造 I/O 的把戏（账只按实际消耗增长，与让出次数无关），6.6 起的 EEVDF 又在公平账本上补回对响应时间的直接刻画。两条路线对照着看很有意思：MLFQ 用分层与规则逼近「短作业优先 + 响应」，Linux 用一本连续账直接定义「公平 + 截止期」，前者像经验规章，后者像会计准则。
    derivation: original
    sources:
      - ref: ostep
        locator: Ch.8.2-8.4 MLFQ 的问题：饿死、被钻空子与更好的记账
        claim: 按单次让出清零配额会被在 99% 处伪造 I/O 的作业钻空子，改按累计用量记账可堵漏；MLFQ 另有饿死与参数难调的问题
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照 OSTEP Ch.8 原文（PDF）核查，记录见 docs/curriculum-audit.md
