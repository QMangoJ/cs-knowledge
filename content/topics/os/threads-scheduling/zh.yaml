    points:
      - 周转时间 = 完成 − 到达；响应时间 = 首次运行 − 到达
      - 调度算法之争本质是量尺优先级之争
  - id: fcfs-sjf
    title: FCFS 的护航效应，与 [[SJF]] 最优背后的两个谎言
    tldr: 先来先服务遇到排头的长任务，会把后面的短任务全堵死（平均周转 110 秒）；换成最短作业优先能砍半到 50 秒，但它靠「同时到」和「预知时长」两个现实里不存在的前提才成立。
    body: |-
      最直觉的规矩是先来先服务（[[FCFS]]）：谁先排队谁先跑完，中途不抢占。拿三个同时到达的纯计算任务算笔账：大任务 A（好比后台视频转码）要跑 100 秒，两个小任务 B 和 C 各只要 10 秒，凑巧 A 排在队头。结果 A 在第 100 秒完工，B 干等到第 110 秒才完成，C 等到第 120 秒。三个任务的平均周转时间是 (100 + 110 + 120) / 3 = 110 秒！两个 10 秒钟的小跑腿生生被 100 秒的大卡车堵在单行道后头，这就是「护航效应」。

      把顺序反过来，让最短的先上——最短作业优先（SJF）。先跑 B（10 秒完工），再跑 C（20 秒完工），最后跑 A（120 秒完工）。现在平均周转时间变成 (10 + 20 + 120) / 3 = 50 秒，不到刚才的一半！只要所有任务同时到达且不允许中途抢占，数学上可以证明 SJF 就是平均周转的最优解：任何把长任务往前挪的调换，都会让后面更多人跟着推迟完工。

      可为什么现实操作系统里看不到纯 SJF？因为这个「最优」藏着两个谎言。第一，现实任务不是整整齐齐同时到达的——要是大任务 A 早到 1 秒钟先占上跑道，非抢占的 SJF 不会打断它，后到的 B 和 C 照样被堵成 100 多秒，护航效应原封不动回来。第二，程序还没跑，调度器上哪知道它要跑 10 秒还是 100 秒？没有这根未来水晶球，SJF 连排队的依据都拿不到。所以 SJF 不是能直接上线的算法，而是挂在墙上的理论标尺。
    derivation: original
    sources:
      - ref: ostep
        locator: Ch.7.3 FIFO 与 7.4 Shortest Job First（护航效应与数值例）
        claim: A=100、B=C=10 且 A 先行时 FCFS 平均周转 110 秒，SJF 排成 B、C、A 后为 50 秒，且同批到达时 SJF 可证最优
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照 OSTEP Ch.7 原文（PDF）核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: app
          id: ja
          label: 作业 A
          state: 100 秒 · FCFS 里排第一
        - lane: app
          id: jb
          label: 作业 B
          state: 10 秒 · 被 A 堵住
        - lane: app
          id: jc
          label: 作业 C
          state: 10 秒 · 被 A 堵住
        - lane: kernel
          id: sched
          label: 调度器
          state: FCFS 按到达顺序
