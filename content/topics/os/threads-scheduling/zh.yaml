        locator: 内核调度文档（CFS 与 EEVDF 说明）
        claim: Linux 以 vruntime 记账实现比例公平，EEVDF 在其上引入截止时间处理延迟敏感任务
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: app
          id: gamer
          label: 钻空子作业
          state: 用到 99% 就伪造一次 I/O
        - lane: kernel
          id: acct
          label: 累计记账
          state: 本层用量只增不减
          highlight: true
        - lane: hw
          id: cpu
          label: CPU 核心
      messages:
        - id: m1
          from: acct
          to: gamer
          label: 让出不清零：攒满配额照样降级
          active: true
    log:
      - mode: 攻防
        event: 规则一公布就会被针对，记账口径决定防伪能力
    points:
      - MLFQ 的防钻空子靠累计记账，与 CFS 的账本思想在此汇合
      - 调度器设计包含机制设计：要假设被调度者会针对规则行事
  - id: priority-inversion
    title: 优先级反转：当优先级遇上锁，顺序会被依赖关系改写
    tldr: 高优先级任务等一把被低优先级任务握着的锁，中优先级任务再横插一脚，拖延可以无限长——火星探路者为此反复重启。
    body: |-
      固定优先级调度有个隐含假设：优先级高的先跑。但锁会把任务绑成依赖链。设低优先级任务 L 先拿到了某把锁，高优先级任务 H 随后也要这把锁，只能阻塞等待 L 释放——这已经是一段倒置，但时长以 L 的临界区为界，还算有数。真正的灾难在第三个任务登场时：中优先级任务 M 既不碰这把锁、优先级又高于 L，它一到达就把 L 抢占下去自己长跑。于是 H 等 L、L 等 M，H 的实际待遇被一个与它毫无关系的 M 决定，拖延不再有任何上界，这就是无界优先级反转。

      1997 年，登陆火星的探路者号给这条理论配上了真实注脚：它的低优先级气象任务向信息总线写数据时要先拿一把互斥锁，高优先级的总线管理任务撞上就会被阻塞；平时临界区短暂、相安无事，但偶尔一个长跑的中优先级通信任务会在这个窗口里把气象任务抢占下去，总线任务随之错过截止时间，看门狗判定系统失联、触发整机重启，登陆后数日里反复发作。工程师在地面的复刻机上重现了现场，确认是优先级反转，修法是从地球上传补丁，把这把锁的优先级继承开关打开。

      优先级继承的协议很直白：当 H 被 L 持有的锁阻塞时，L 临时继承 H 的优先级，直到释放锁为止。这样 M 抢占不了正在替 H「赶工」的 L，H 的阻塞时间被压回临界区的量级，倒置从无界变回有界。另一种协议是优先级天花板：任务一拿锁就升到所有可能用锁者的最高优先级，防得更彻底，但需要预先知道每把锁的全部使用者。通用操作系统大多不用固定优先级，也就绕开了这个坑；但在实时与嵌入式系统里优先级是主旋律，反转与继承就是必修课。
    derivation: original
    sources:
      - ref: mars-pathfinder
        locator: 第 1.1 节优先级反转的形式化描述与第 2 章 Pathfinder 故障经过
