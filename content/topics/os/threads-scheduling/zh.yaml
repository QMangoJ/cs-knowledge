steps:
  - id: why-thread
    title: 进程太重：为什么还要再切出线程
    tldr: 进程是装资源的房子，线程才是屋里干活的执行流；当界面、渲染和下载天然要读写同一份页面数据时，硬拆成多个进程只会把共享变成负担。
    body: |-
      打开浏览器看网页时，三件事必须同时推进：界面要立刻响应点击，渲染要在后台排版画图，下载要盯着网络收图片。它们之间还得高频交接成果——图片刚收完就得交给渲染，渲染好就得刷上屏幕。

      如果硬把这三件事拆成三个独立进程，麻烦立刻就来了：进程之间的内存默认互相隔离，下载进程拿到一块图片数据，没法直接递给渲染进程，只能走管道复制或者折腾共享内存；而且每多开一个进程，内核就得多维护一整套页表和文件表，纯属多余开销。

      于是需要把「正在执行的指令流」从进程里单独拆出来，这就是线程：同属一个进程的几条线程共用同一片地址空间和打开的文件，各有各的执行进度。下载线程把图片写进堆里的缓冲区，渲染线程拿过指针直接就能读，零拷贝、也不用额外通信协议。记住这个分工：进程是资源容器，线程才是真正被轮换的执行流；至于大家共用同一块内存会不会互相写乱，那笔账留到并发与锁那一课来算。
    derivation: original
    sources:
      - ref: ostep
        locator: Ch.26 Concurrency 绪论（线程与地址空间）
        claim: 线程是同一地址空间内的多个执行流，共享代码与堆、各有栈
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
      - ref: csapp
        locator: Chapter 12 Concurrent Programming（进程与线程的对比）
        claim: 同进程线程共享代码与全局数据，进程间通信则要走显式 IPC
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
