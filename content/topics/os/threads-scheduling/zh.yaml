  - id: kernel-tasks
    title: 内核的视角：没有进程与线程之分，只有任务
    tldr: 在 Linux 内核里进程和线程不是两个物种，创建执行流用的是同一个系统调用 [[clone]]；调度器只管「任务」，所谓进程只是一组共用同一套地址空间的任务。
    body: |-
      用户程序习惯把进程和线程当成两回事，可到了 Linux 内核这一层，二分法干脆消失了。创建新执行流的底层调用叫 [[clone]]，调用时传一组共享开关：带上 [[CLONE_VM]] 就共用地址空间，带上 CLONE_FILES 就共用文件表，带上 CLONE_SIGHAND 就共用信号处理。平时创建进程的 fork 只是开关全关的特例，创建线程的 pthread_create 则是开关全开的特例——两端之间是一条连续滑杆，不是两个物种。

      因此在内核调度器眼里，队列里只有一种对象叫任务（task_struct）。每个任务有自己的内核栈和寄存器保存区，再拿指针指向一份地址空间和文件表——这份指针既可以独占，也可以和同组任务指到同一份。平时说的进程号（getpid 返回的值），在内核里其实是这组共享任务的带头大哥 ID，而每个线程另有自己独立的任务号。

      这带来一个很漂亮的推论：调度器不用写两套挑人代码，挑进程和挑线程是一模一样的逻辑，差别只在切过去之后要不要顺手换地址空间指针。这也反衬出早期纯用户级线程（绿色线程）为什么逐渐退场：语言运行时自己在一条内核任务里模拟多条流，内核根本看不见它们，一旦某条流卡在读文件的阻塞调用上，整个进程的所有流一起停摆，也用不上多核。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: clone(2) 的 CLONE_VM / CLONE_FILES 等标志说明
        claim: clone 用标志位决定新任务与父任务共享地址空间、文件表等的程度
