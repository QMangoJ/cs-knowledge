  - id: priority-inversion
    title: 优先级反转：当固定优先级撞上互斥锁
    tldr: 固定优先级最怕撞上互斥锁：高优先级任务等低优先级手里那把锁时，一个无关的中优先级任务能把持锁者挤下 CPU，让高优先级任务无限干等；解法是让持锁者临时继承等待者的优先级。
    body: |-
      如果把场景换到火星探测器、汽车控制器这类用「固定优先级」的实时系统里，当优先级规则撞上互斥锁，会炸出一个极隐蔽的大坑。假设有三个任务：高优先级 H、中优先级 M、低优先级 L。L 先抢到一把互斥锁干活，紧接着 H 醒来也要同一把锁，只能停下等 L 放锁——到这儿还算有界延迟，毕竟 L 很快就能干完放锁。真正的灾难是这时半路杀出一个 M：M 既不用这把锁、干的也是不相关的话，偏偏 M 的优先级比 L 高，一上来就把 L 抢占挤下了 CPU！结果变成 H 等 L、L 等 M，最要命的 H 反而被一个毫不相干的 M 无限拖住，这叫无界优先级反转。

      1997 年登陆火星的探路者号就实打实撞上了这个 bug：负责气象的低优先级任务 L 往信息总线写数据时握着一把互斥锁，高优先级的总线管理任务 H 撞上后卡住等锁；平时没出事，可偶尔一个长跑的中优先级通信任务 M 在这毫秒级的窗口里插进来抢占了 L，导致 H 迟迟收不到信号错过截止期，看门狗判定死机直接重启整台探测器，着陆后连着重启了好几天。地面工程师在复制机上复现后，从地球上传补丁把那把锁的「优先级继承」开关打开，故障立刻消失。

      优先级继承的逻辑一句话就能懂：只要高优先级 H 卡在了低优先级 L 拿着的锁上，L 就临时披上 H 的优先级马甲全力赶工，直到放锁那一刻再脱下来。这样一来，中优先级 M 再也抢占不了正在替 H 跑腿的 L，等待时间重新被锁回临界区本身的长度（另一种优先级天花板协议则是拿锁时直接升到所有用锁者里的最高级，防得更死但必须事先知道谁会碰这把锁）。

      把全课收成三句可带走的排查口诀：**问单位**——同进程靠线程省切换，共享那半边早晚要加锁；**问挑人**——未知时长靠行为反馈或累计记账，响应和周转天生只能权衡；**问带锁**——固定优先级遇到互斥锁，一定确认开了优先级继承，别让无关的「中间人」把头号任务拖死。
    derivation: original
    sources:
