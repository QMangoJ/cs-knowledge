title: 线程与调度：内核到底在轮换谁、又凭什么挑人
summary: 调度的单位不是进程而是线程；挑谁上场则是一道没有先验信息的决策题，从 FCFS 一路演进到多级反馈队列。
premise: 以一个浏览器进程里的界面、渲染、下载线程，和三个同时到达的作业为例。
position: 时钟中断解决了怎样把 CPU 夺回来，进程管理板块还剩两问悬着：被轮换的单位到底是什么，每次又凭什么挑中某一个。本课先拆单位：线程同住一个地址空间、只独享栈与寄存器，于是内核眼里只有任务，进程不过是共享了全套资源的任务组。再拆挑选：从 FCFS 的护航效应推到多级反馈队列，看调度器如何在不知道作业长度的情况下用历史猜未来。学完你能估算一组作业的平均周转与响应、说清优先级反转如何让火星探测器反复重启，并判断一个卡顿现场该去查调度还是查锁。
bridge:
  prev: 上下文切换那课把换人的动作拆到了寄存器一级，却默认了被换下的单位是进程；本课先追问单位本身：浏览器的界面、渲染与下载同住一个地址空间时，为什么还要在进程内部再切出线程这种更轻的执行流？
  next: 线程切换省下的正是页表基址的更替：同进程的线程共用一套页表，换人时连翻译规则都不必换。于是问题下沉一层：这套被共享的页表究竟长什么样，一个虚拟地址要过几道关才落到物理页框？
overview:
  - key: 一句话总结
    value: 内核调度的单位是任务（线程）；进程只是共享了整套资源的一组任务
  - key: 线程共享什么
    value: 代码、堆、全局变量、打开的文件与地址空间；独享的只有寄存器、栈与线程本地存储
  - key: 调度的两本账
    value: 周转时间看完成得快不快，响应时间看第一次被理睬得快不快，两者经常打架
  - key: 最优为何是空中楼阁
    value: SJF 与 STCF 可证最优，但都要求预先知道作业还要跑多久——这份信息不存在
  - key: MLFQ 的答案
    value: 先假设人人都是短作业，用满配额就降级，定期全体提升，用历史行为近似 SJF
  - key: 优先级反转
    value: 高优先级任务被低优先级任务握着的锁间接拖住，中优先级任务还能让拖延无限延长
