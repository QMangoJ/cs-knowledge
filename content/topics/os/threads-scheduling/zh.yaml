        event: 最优策略需要的未来信息不存在，只能退而用历史预测
    points:
      - 作业时长不可预知：不是测不准，而是原理上没有这份信息
      - 调度本质是在线决策：先行动，答案后揭晓
    mistake: 以为给 SJF 配一个「更准的时长预测」就能落地：预测的只是单次 burst，且作业行为有相位变化，押注全局时长注定系统性出错。
  - id: mlfq-rules
    title: 多级反馈队列：先假设人人都是短作业
    tldr: 多级反馈队列（MLFQ）先假设每个新任务都是短作业，再拿「是否用满配额」当筛子把长任务逐级下放、把频繁等外设的交互任务留在顶层，从而在不预知时长的情况下逼近最短作业优先。
    body: |-
      多级反馈队列（MLFQ）把就绪队列排成从高到低好几层，只靠五条规矩运转。规矩 1 和 2 定框架：高优先级层永远先跑，同一层内部按时间片轮转。规矩 3 定入场：任何新任务刚来一律进最高层，先当短作业对待。规矩 4 定升降：任务在本层累计用满配额（allotment）还没结束，就降一级；要是配额没用满就主动让出 CPU 去等键盘、鼠标或磁盘，就留在原层不惩罚。规矩 5 定兜底：每隔一段时间 S，把所有层的任务统统提回最高层。

      拿开篇的浏览器重跑一遍这套规矩。后台视频转码刚启动时也进最高层，可它从头到尾不碰用户交互，眨眼就把顶层配额吃满，直接降到中层；在中层又吃满，再降到底层，从此用大时间片慢慢算。这时你点了一下网页按钮，浏览器界面线程醒来进了顶层，只跑 1 毫秒画完反馈就又睡下去等下一次点击——规矩 4 把它稳稳留守在顶层，下回一点鼠标照样秒响应！调度器从始至终没问过谁要跑多久，却自动把短交互任务和重计算任务拆了层。

      等一下，为什么还要多此一举加一条「每隔 S 全体提回顶层」的规矩 5？因为没有它，只要源源不断地有新网页打开、有鼠标点击，底层那个重计算长任务就永远抢不到 CPU，直接被饿死；另外，万一某个任务前半段算了半天、后半段切回交互模式，规矩 5 也给了它一次回顶层的机会。当然周期 S 很难捏准：调得太短，长任务隔三差五回顶层挤占界面响应；调得太长，底层任务又要挨饿。
    derivation: original
    sources:
      - ref: ostep
        locator: Ch.8.1-8.3 MLFQ 五条基本规则与优先级提升
        claim: MLFQ 规则 1-5：高层优先、同层轮转、新作业入顶层、用满配额降级、提前让出留原层、周期 S 全体提升；其目标是近似 SJF
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照 OSTEP Ch.8 原文（PDF）核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: app
          id: jb
          label: 交互作业 B
          state: 跑 1 毫秒就等键盘：留守顶层
          highlight: true
        - lane: app
          id: ja
          label: 长作业 A
          state: 用满两层配额：已下沉底层
        - lane: kernel
          id: sched
          label: MLFQ 调度器
          state: 按层挑人、记配额
        - lane: kernel
          id: boost
          label: 定期提升
          state: 每过 S 把全体提回顶层
        - lane: hw
          id: cpu
          label: CPU 核心
      messages:
        - id: m1
          from: sched
          to: jb
          label: B 在顶层，醒来即可运行
          active: true
        - id: m2
          from: boost
          to: ja
          label: A 定期被提回顶层，不至饿死
    log:
      - mode: MLFQ
        event: 行为决定层级：短作业自证其短，长作业自证其长
    points:
      - 五条规则的核心是规则四：用满配额才降级，提前让出不惩罚
      - MLFQ 近似 SJF 的方式不是预测时长，而是让作业用行为自证
    keyFields:
      - key: 配额（allotment）
        value: 作业在某层累计可用的 CPU 量，用满即降一级
      - key: 提升周期 S
        value: 全体回顶层的间隔，太小挤交互、太大饿长作业
  - id: mlfq-flaws
    title: MLFQ 的软肋：钻空子、调参，与 Linux 的另一条路
    tldr: 只看单次让出就留原层，会被程序在 99% 配额处假装读写一下的把戏赖在顶层；改成累计记账就能堵漏，而 Linux 干脆甩开多层队列，用一本连续的时间账本解决公平和延迟。
    body: |-
      规矩一旦摊在明面上，聪明程序就会顺着规矩钻空子。在最初版规矩 4 里，只要单次配额没用满就让出去做输入输出，本层计时就会清零。于是写一个坏程序很容易：每次在顶层跑到 99% 配额快耗尽前，顺手发一个毫无意义的 1 字节磁盘读写让出 CPU，计时清零、继续稳坐最高层，几乎把整个 CPU 独占了！

      堵漏的办法很直白——把规矩 4 改成「本层累计记账」：不管中途自己让出过多少回、等过多少次外设，只要你在这一层吃掉的 CPU 总时间攒够了配额，照样降级。这么一改，耍小聪明再也占不到便宜。不过即便堵住了漏洞，MLFQ 依然留下一串靠经验拍脑袋的参数：分几层、每层配额多少、提升周期 S 定几百毫秒？参数调偏了，周转和响应可以一起崩。

      Linux 主线调度器没有采用 MLFQ 这套多层经验规章，而是走了一条会计账本路线：[[CFS]] 给每个任务记一笔「虚拟运行时间」，谁欠得多谁先跑——由于账本只按实际消耗的 CPU 累加，根本不怕你频繁假装让出；从 Linux 6.6 起登场的 [[EEVDF]] 又在这本公平账上补上了「虚拟截止期」，把浏览器点击这类对响应敏感的任务直接往前拎。一边是分层赏罚，一边是精准记账，殊途同归都在回答「未知长度下怎么兼顾快和稳」。
