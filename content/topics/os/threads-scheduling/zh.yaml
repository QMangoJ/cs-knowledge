    points:
      - 进程是资源容器，线程是执行流，调度轮换的是执行流
      - 线程的全部价值来自共享：通信不需要拷贝与协议
    mistake: 把多开进程当成多线程的平替：隔离粒度不同，进程间共享数据要走 IPC，成本与编程模型完全是两回事。
  - id: shared-private
    title: 共享与独享的清单：线程之间到底什么不共有
    tldr: 堆、全局变量、打开的文件都共享；寄存器、栈、程序计数器与线程本地存储各归各。
    body: |-
      把一个进程的家当清单摊开，逐项判断线程之间是共用一份还是各有一份。共用一份的：代码段、堆、全局与静态变量、打开的文件、信号处理方式、当前工作目录。这些描述的是「这个程序在处理什么数据」，本来就是全体线程共同的工作现场。

      各有一份的：寄存器全套（包括程序计数器与栈指针）、自己的栈、线程 ID、调度优先级、信号掩码，以及线程本地存储（TLS）。这些描述的是「这条执行流走到哪一步了」，混在一起程序就没办法分别推进：两个线程若共用程序计数器，就只能执行同一条指令，等于退化成一条流。C 里 errno 必须做成线程本地，就是怕两个线程同时出错时互相覆盖错误码。

      这份清单同时划出了线程切换要保存的最小集合：真正非存不可的，就是寄存器与栈指针这一小撮独享状态；庞大的地址空间原封不动，因为下场的线程用的还是同一套——这正是同进程线程切换比进程切换便宜的根源。而清单的共享侧就是竞态的温床：两个线程对同一个全局计数器加一，读、改、写三步完全可能交错。
    derivation: original
    sources:
      - ref: csapp
        locator: Chapter 12.3 Posix Threads 与 12.4（线程共享的变量）
        claim: 线程共享进程的代码、堆与全局变量，各有自己的栈与寄存器上下文
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
