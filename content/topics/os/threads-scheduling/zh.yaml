subject: os
slug: threads-scheduling
order: 4
status: published
license: CC-BY-4.0
title: 线程与调度：内核到底在轮换谁、又凭什么挑人
summary: 内核真正轮换的单位不是进程，而是线程；同一进程里的线程共用地址空间和文件，只各自留着栈和寄存器，所以切换便宜得多。至于每次挑谁上场，由于调度器永远无法预知程序还要跑多久，算法一路从先来先服务、最短作业优先演进到靠历史行为打分的多级反馈队列。最后还要防一个暗坑：一旦固定优先级撞上互斥锁，低优先级任务手里的锁可能被无关的中间任务拖到天荒地老，必须靠优先级继承兜底。
premise: 你打开浏览器看网页时，界面线程要响应鼠标点击、渲染线程在排版画图、下载线程正往内存里收图片，这三件事挤在同一个程序里；同一时刻，电脑后台还开着代码编译这类重活。CPU 核心只有几个，内核到底在轮换什么单位、又凭什么决定先让谁跑、怎么保证点一下鼠标立刻有反应？
position: 前一课靠时钟中断解决了怎样把 CPU 控制权夺回来，进程管理板块还剩下两个问题：被轮换的对象到底是什么，调度器每次又凭什么挑中某一个。本课先把「装资源的进程」和「真正跑指令的线程」拆开，再用经典调度算例推演响应时间与周转时间的拉扯，一路走到靠运行历史给任务分层的真实调度思路，最后拆解火星探测器在真实任务里踩过的锁与优先级冲突。学完后你能算清一组任务的平均等待、分清几类调度规则各自偏袒谁，并在服务卡顿时判断该去查调度还是查锁。
bridge:
  prev: 上一课把上下文切换拆到了保存和恢复寄存器那一步，当时默认被换上换下的都是完整进程；这一课先往前追一问：浏览器的界面、渲染和下载住在同一份内存里时，为什么还要在进程里拆出更轻的线程？
  next: 同一个进程的线程之所以切换便宜，关键在于它们共用一套页表，换人时连地址翻译规则都不用换；下一课就钻进这套共享页表本身，看虚拟地址是怎么一层层落到物理内存条上的。
overview:
  - key: 一句话总结
    value: 内核调度队列里排着的不是进程，而是一条条线程（内核统称任务）。同进程线程共用地址空间等全套家当，只独享执行位置；挑谁上场则靠历史行为猜未来。
  - key: 线程共享什么
    value: 同一进程的线程共用代码、堆、全局变量、打开的文件和整个地址空间；各自独享的只有寄存器、自己的栈和线程本地存储。切换时大头不动，这正是它比进程切换便宜的原因。
  - key: 调度的两本账
    value: 评价调度看两本账：周转时间算「从进门到办完总共多久」，响应时间算「多久才开始理我」。想让长任务先跑完还是让大家轮流快点动，这两本账经常打架。
  - key: 最优为何用不上
    value: 最短作业优先（[[SJF]]）和抢占版 [[STCF]] 能把平均周转压到理论最低，但前提是提前知道每个任务要跑多久。未来时长在现实里根本拿不到，所以它们只能当参照标尺。
  - key: 多级反馈队列
    value: 先给每个新任务发一张「短作业体验卡」放进顶层，把配额用完还没结束的往下贬一级，提前让出 CPU 等数据的留在原层，再定期全体提回顶层——用过去表现逼近最优。
  - key: 优先级反转
    value: 高优先级任务等低优先级手里的锁时，一个不碰锁的中优先级任务半路杀出把持锁者挤下 CPU，导致高优先级无限干等。让持锁者临时继承等待者的优先级，才能把延迟关回笼子。
