      - 调度器只认任务：挑谁、换谁的逻辑对进程线程一视同仁
  - id: switch-cost
    title: 切换的成本账：线程切换为什么比进程切换便宜
    tldr: 便宜在跳过了页表更换与翻译缓存失效；但切换本身永远不是零成本，这笔账决定时间片不能切太碎。
    body: |-
      把两种切换并排拆解。进程切换要换页表基址，此后虚拟地址的翻译规则整体更换：TLB 里缓存的旧翻译全部作废，新进程要把自己的翻译一条条重新填回来，内存访问在一段时间内全是慢动作——这笔间接成本的大头在上下文切换那一课算过细账。同进程的线程切换跳过这一整段：地址空间不变，页表不动，TLB 与缓存里的数据大概率正是新线程要用的（它们本来就在处理同一批数据），剩下只有寄存器与栈指针的保存恢复。所以线程切换的直接成本更低，间接成本更是低得多。

      但便宜不是免费：每次切换的直接开销在微秒量级，它不产生任何用户价值。假设时间片是 10 毫秒、每次切换花 10 微秒，浪费只有千分之一；若把时间片压到 100 微秒去追极致响应，同样 10 微秒就吃掉十分之一的 CPU。时间片长度的下限，就是被这笔固定税卡出来的——这是后面讲轮转调度时绕不开的约束。另一笔隐性账是栈：每个线程都要占一份用户栈与一份内核栈，线程开到上万个时光栈内存就很可观，这也是「一个连接一个线程」的老式服务器在连接数暴涨时先倒在内存上的原因之一。
    derivation: original
    sources:
      - ref: ostep
        locator: Ch.6 Limited Direct Execution（上下文切换成本讨论）
        claim: 上下文切换有直接开销，进程切换还会因 TLB 与缓存变冷产生间接开销
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
      - ref: xv6-book
        locator: Chapter 7 Scheduling（swtch 与调度器）
        claim: 切换时保存与恢复的是寄存器上下文，地址空间切换是额外一步
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: kernel
          id: sched
          label: 调度器
          state: 挑中同一进程的另一个线程
          highlight: true
        - lane: hw
