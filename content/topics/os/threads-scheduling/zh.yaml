steps:
  - id: why-thread
    title: 进程太重：为什么还要再切出线程
    tldr: 一个程序内部常有好几件事要同时推进，它们共享数据，用进程隔离反而碍事。
    body: |-
      浏览器要同时做很多件事：界面要响应点击，渲染要在后台排版，下载要在网络上收数据。它们之间还要高频地交换成果，下好的图片要立刻交给渲染，渲染好的页面要立刻显示。

      如果把这三件事拆成三个进程，进程之间地址空间互相隔离，交换一块图片数据就得走管道或共享内存，先拷贝再同步，机制笨重；而且每多一个进程，就多一整套页表、文件描述符表与内核记账，只为了推进同一件产品里的三个侧面，代价不成比例。

      线程就是把「执行流」从进程里单独拆出来的单位：同一个进程可以有多条线程，每条线程有自己正在执行的指令位置，却共用进程的地址空间与打开的文件。下载线程把图片写进堆里的缓冲区，渲染线程直接读指针就能用，零拷贝、零协议。这就是线程存在的根本理由：当多个执行流天然属于同一份数据时，隔离不是保护，而是障碍。先记住定位：进程是资源容器，线程是执行流，调度器真正轮换的是执行流。共享的代价是竞态，锁那一课会结账。
    derivation: original
    sources:
      - ref: ostep
        locator: Ch.26 Concurrency 绪论（线程与地址空间）
        claim: 线程是同一地址空间内的多个执行流，共享代码与堆、各有栈
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
      - ref: csapp
        locator: Chapter 12 Concurrent Programming（进程与线程的对比）
        claim: 同进程线程共享代码与全局数据，进程间通信则要走显式 IPC
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
