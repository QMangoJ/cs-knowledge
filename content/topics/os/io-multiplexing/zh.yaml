  - id: epoll
    title: "[[epoll]] 的演化：[[红黑树]]长期登记 + 回调塞进就绪链表"
    tldr: "[[epoll]] 在内核里摆了一棵[[红黑树]]长期记着 10 万条连接，再给每条挂上回调；数据一到，回调自动把它推进就绪链表，epoll_wait 只取走有动静的那几个。"
    body: |-
      [[epoll]] 彻底改写了「每次带着全员名单去问」的笨办法，把事情拆成三步（见代码）：第一步 `epoll_create1` 在内核里开一个事件中心；第二步用 `epoll_ctl` 把那 10 万条连接一条条登记进去——这棵登记簿底层是一棵[[红黑树]]，增删改查只花对数时间，关键是**只登记一次、长期留给内核保管**；第三步调 `epoll_wait` 睡着等消息。

      等一下，`epoll_wait` 醒来时，内核难道不会悄悄在背后扫一遍那 10 万条连接吗？完全不会——这就是它和 `select`/`poll` 的分水岭。当你在第二步调用 `epoll_ctl` 登记某条连接时，内核顺手在它的 socket 上挂了一个回调函数。等到远端真发来一个字节、网卡中断一路送进协议栈接收缓冲时，那个回调函数自动触发，顺手就把这条连接拎出来链进专门的「就绪链表」，同时叫醒睡在 `epoll_wait` 上的应用线程。线程醒来后，内核直接把就绪链表里的这几个节点原样递到用户态，不管挂着 1 万条还是 10 万条闲连接，只要只有 3 条来了数据，`epoll_wait` 就只看这 3 条（等待开销只跟就绪数 k 有关，几乎跟总连接数 n 无关）。

      拿一句话把四步演化串起来：**阻塞 read** 是 10 万人各自傻等；**非阻塞轮询** 是 1 个人疯跑着挨个敲 10 万扇门；**select / poll** 是每次拿着 10 万人的花名册进内核请老师点名；**epoll** 是花名册只交一次挂在墙上，谁收到快递自己走上讲台来报到。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: epoll(7)/epoll_wait(2) 手册
        claim: epoll 通过注册兴趣列表与就绪列表，使等待开销只取决于就绪事件数
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
    canvas:
      kind: swimlane
      actors:
        - lane: app
          id: a
          label: 应用线程
        - lane: kernel
          id: k
          label: 内核（epoll）
          highlight: true
        - lane: net
