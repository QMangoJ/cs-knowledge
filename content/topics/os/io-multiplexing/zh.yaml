- id: partial-write
  title: 非阻塞写与 EPOLLOUT：没写完的那一半去哪等
  tldr: 非阻塞 write 经常只写进一部分；剩余数据要挂到 EPOLLOUT 上等可写通知，而不是在循环里硬重试。
  body: '读的一侧讲了很多，写的一侧同样有状态机。下行数据比对端接收速度快时，非阻塞 write 会在发送缓冲满时只写进一部分就返回，比如要发 100 KB 只进了 30 KB，剩下 70 KB 必须由应用先存进该连接自己的待发缓冲，并给这个 fd 追加注册 EPOLLOUT（可写事件）；等对端慢慢消费、发送缓冲腾出空间，epoll 通知可写，再接着把剩下的写出去，写干后立刻取消对 EPOLLOUT 的关注。为什么不能图省事一直注册着 EPOLLOUT？因为只要缓冲不满它就一直处于就绪状态，水平触发下 epoll_wait 会不停地返回这个 fd，事件循环被一个根本没数据要写的连接占满，这叫可写事件风暴。同理还有个背压问题：若上游生产数据的速度长期超过对端消费速度，待发缓冲会无界膨胀直到吃光内存，成熟的网关都要给单连接待发缓冲设上限，超限就断开或暂停读上游——非阻塞写教会你的不只是怎么写完，而是整个流控链条都要自己负责。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: epoll(7) 手册与 write(2) 手册（非阻塞写与 EPOLLOUT）
    claim: 非阻塞写可能只完成部分写入，应在发送缓冲有空间时由可写就绪通知驱动继续写入
    status: verified
