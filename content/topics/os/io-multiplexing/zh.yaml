- id: reactor
  title: 事件循环与 Reactor 模式
  tldr: 单线程「等事件 → 分发 → 处理回调」的循环，就是 Node.js、Nginx、Redis 的共同骨架。
  body: '把上面的零件组装起来：一个主循环反复 epoll_wait，拿到就绪 fd 后按注册的回调分发（可读就读、可写就写、定时器到点就触发），处理完回到等待。这就是 Reactor 模式。

    Node.js 的 libuv、Nginx 的 worker、Redis 的单线程快，都建立在它之上。单线程事件循环没有锁竞争，代价是回调里绝不能阻塞——一个慢查询堵住循环，成千上万个连接一起停摆（这正是 Node 里「不要阻塞事件循环」的由来）。多核扩展靠多进程/多实例（每个进程一个循环），而不是在循环里加锁。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: epoll(7) 手册（典型用法一节）
    claim: epoll 的典型用法是单线程事件循环：等待就绪事件并分发处理
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: a
      label: 事件循环
      highlight: true
    - lane: kernel
      id: k
      label: 内核（epoll）
    - lane: net
      id: n
      label: 对端
    messages:
    - id: m-re
      from: a
      to: k
      label: epoll_wait → 分发回调 → 再等
      active: true
  log:
  - mode: 循环
    event: 回调必须快：阻塞循环 = 阻塞所有连接
- id: engineering
  title: 工程选型：什么时候用哪套
  tldr: 连接少用线程池 + 阻塞 IO 也很好；长连接多、单请求便宜，才是 epoll 事件驱动的主场。
  body: '别把事件驱动当银弹：阻塞 IO + 线程池代码直白、调试容易，几百连接毫无压力；Go 的 goroutine 更是把「一连接一轻量线程」做回主流（运行时内部帮你用 epoll）。

    真正需要手写事件驱动的场景：连接数以万计且大多空闲（推送、网关、流式 API 中继），或延迟对尾部极敏感。LLM 网关的流式转发就是典型：上万个 SSE 连接同时挂着，每个连接只是偶尔来一个 token chunk—— epoll + 非阻塞读写几乎是唯一合理的姿势。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: epoll(7) 手册
    claim: epoll 面向大量 fd 且就绪比例低的场景优化
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
