  - id: blocking
    title: 阻塞与非阻塞：光把 read 改成不睡觉还不够
    tldr: 把 socket 设成非阻塞后，没数据时 read 立刻返回 [[EAGAIN]] 而不睡死；但没人发通知时，自己用循环反复去问只会把处理器空转烧满。
    body: |-
      要改等待姿势，得先认识系统调用 `read` 的两种脾气。默认情况下 socket 是阻塞的：对端还没发来数据，调 `read` 的线程就被内核挂起睡着，直到数据进来或连接断开才醒——好处是代码按顺序往下写就行，缺点就是上面算过的一个线程被一条闲连接钉死。一旦给文件描述符加上 `O_NONBLOCK` 标志切换成非阻塞模式，无论是 `accept`、`read` 还是 `write`，脾气全都变成「能干多少干多少，干不了立刻返回」：缓冲区没数据时，`read` 当场返回 `-1` 并把错误码设成 [[EAGAIN]]，意思是「现在没有，待会儿再来试」。

      等一下，既然非阻塞模式不会让线程睡死，那只用一个线程挨个去非阻塞 `read` 那 10 万条连接不就行了吗？千万别这么干——这就叫「忙轮询」（busy polling）。假设 10 万条连接里只有 2 条有数据，线程在一个死循环里疯狂往内核发 10 万次无效系统调用，换回 99,998 次 `EAGAIN`，CPU 核心照样瞬间飙到 100% 空转，而且不会让网络包早到哪怕一微秒。想让 CPU 没事时安心睡大觉、有事时一秒不错过，缺的是一套「等通知」的机制。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: accept(2)/read(2) 与 fcntl(2)（O_NONBLOCK）手册
        claim: 非阻塞模式下无数据可读时返回 EAGAIN 而不是挂起调用者
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
    canvas:
