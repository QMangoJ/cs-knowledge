level: 进阶
minutes: 34
prereq:
- os/syscall
- os/context-switch
objectives:
- 解释每连接一线程模型在 C10K 下的瓶颈
- 对比 select/poll 与 epoll 的成本结构
- 说清 LT 与 ET 的编程纪律差异
aiLink: 推理网关与流式 API 中继的并发模型就是这一课：上万个 SSE/WebSocket 长连接同时在线、每个只是间歇来数据，epoll 事件循环是标准解法。Node.js 服务「事件循环被堵住」类事故，根源也在这里。
design:
- mechanism: epoll 为什么把 fd 注册一次留给内核，而不是像 select 那样每次调用都全量传入
  problem: 根本约束是连接数可以很大而每次真正就绪的只有极少数，若每次等待都要搬运并扫描全量 fd 集合，等待的成本会被总连接数绑架，与就绪事件数完全脱钩。
  choice: 选择状态留在内核：注册时把兴趣列表交上去，内核在事件发生时增量维护就绪列表。替代方案每次全量传入的失败模式是 select 与 poll 的老问题：拷贝加线性扫描随连接数线性涨，且进程醒来后还要再扫一遍才知道是谁就绪。
  tradeoff: 代价是状态从无状态调用变成了有状态对象：注册、修改、注销都要显式管理，fd 被关闭或复用时还要小心残留注册，承担者是框架与应用的连接生命周期管理代码。
  root: 底层原理是增量维护代替重复全量计算：就绪状态的变化只发生在数据到达等事件点上，把更新推到事件发生的那一刻做，查询时自然只需付出与结果大小相当的成本。
- mechanism: 为什么默认用水平触发，而不是把边缘触发设为默认
  problem: 根本约束是通知语义必须对一般的程序员安全：边缘触发要求一次通知就把数据读干，漏读不会报错、只会让连接静默饿死，这种失败模式对默认选项来说太隐蔽、太昂贵。
  choice: 选择水平触发为默认：只要缓冲区还有数据就反复报告，把正确性建立在状态查询而不是事件记忆上。替代方案默认边缘触发的失败模式是：大量本可工作的程序会在读一半的情况下偶发假死，且极难从日志里定位到原因。
  tradeoff: 代价是水平触发会多出一些重复唤醒与 epoll_wait 返回，明明能一次读干也要再被提醒，承担者是追求极限吞吐的高性能服务，它们需要时再显式打开边缘触发并自担纪律成本。
  root: 底层区别在于电平与边沿两种信号语义：水平触发描述的是当下状态，随时采样都成立；边缘触发描述的是变化瞬间，错过就不再有，默认选项应当选那种错过一次也不会永久丢信息的语义。
quiz:
- q: epoll 比 select 快的根本原因是什么？
  options:
  - epoll 用了更快的 CPU 指令
  - fd 只需注册一次，epoll_wait 只返回就绪列表，不必每次全量传递并扫描
  - epoll 不经过内核
  - epoll 会自动多线程
  answer: 1
  explain: select/poll 每次调用的成本随连接数线性增长；epoll 的等待成本只与就绪事件数有关。
- q: 边缘触发（ET）下收到可读通知后，正确的做法是？
  options:
  - 读一次就停，下次通知再读
  - 循环读直到返回 EAGAIN，把数据读干
  - 等对端再发一次
  - 关闭再重开连接
  answer: 1
  explain: ET 只在状态变化时通知一次；不读干，剩余数据不会再触发通知，连接会被饿死。
- q: 单线程事件循环里最忌讳什么？
  options:
  - 回调函数太短
  - 在回调里执行阻塞/耗时的操作，堵住所有连接的处理
  - 连接数太多
  - 使用非阻塞 socket
  answer: 1
  explain: 循环是所有连接共用的传送带；一个回调卡住，后面所有事件都得排队等待。
