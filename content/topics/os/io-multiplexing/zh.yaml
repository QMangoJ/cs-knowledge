- id: reactor
  title: 事件循环与 Reactor 模式
  tldr: 单线程「等事件 → 分发 → 处理回调」的循环，就是 Node.js、Nginx、Redis 的共同骨架。
  body: '把上面的零件组装起来：一个主循环反复 epoll_wait，拿到就绪 fd 后按注册的回调分发（可读就读、可写就写、定时器到点就触发），处理完回到等待。这就是 Reactor 模式。

    Node.js 的 libuv、Nginx 的 worker、Redis 的单线程快，都建立在它之上。单线程事件循环没有锁竞争，代价是回调里绝不能阻塞——一个慢查询堵住循环，成千上万个连接一起停摆（这正是 Node 里「不要阻塞事件循环」的由来）。多核扩展靠多进程/多实例（每个进程一个循环），而不是在循环里加锁。这里再补一个实践细节：回调里不能阻塞，但现实业务总要查数据库、调下游，标准解法是把这类慢活丢给工作线程池，完成后把结果投递回事件循环再写回连接——循环本身只做等待、分发与读写这类快事。分清“循环线程”与“干活线程”的职责，是事件驱动服务能同时保住并发与吞吐的关键结构。'
  derivation: original
  sources:
