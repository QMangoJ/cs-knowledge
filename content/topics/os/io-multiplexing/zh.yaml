steps:
  - id: why
    title: 每连接一线程为什么扛不住 10 万条闲连接
    tldr: 为 10 万条大多闲着的连接配 10 万个阻塞线程，先压垮机器的不是算力，而是每个线程白占的栈内存和调度管理开销——等待不该按连接数线性消耗线程。
    body: |-
      做网络服务最直觉的写法是：来一条连接就开一个线程，线程里直接调阻塞的 `read()` 等对端发消息。只有几十几百条连接时这样写清爽得很；可放到开头那台挂着 10 万条流式长连接的网关上，账当场就算爆了。哪怕每条连接一分钟才收几个字、99.9% 的时间都在发呆，Linux 每个线程默认都要预留 MB 级的栈空间，10 万个线程光是栈与内核调度结构就要吃掉海量内存，万一几千个用户同时来消息集体醒来，光上下文切换就能把 CPU 吃干净——所有人都没在算业务，全在忙着起床睡觉。

      早在二十多年前业界讨论单机扛 1 万并发的「[[C10K]] 问题」时，大家就看清了本质：先撞碎天花板的不是处理器算不动，而是这种「让线程去陪连接一起干等」的姿势太奢侈。真正的解药只有一条路：把「等数据」从应用线程身上剥离出来，交给内核统一帮我们盯着，少数几个线程专门处理真正有数据送上门的那几百条活跃连接。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: epoll(7) 手册开头的问题陈述
        claim: 传统每连接一线程/进程模型在大量连接下扩展性差，epoll 为此而设计
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
    canvas:
