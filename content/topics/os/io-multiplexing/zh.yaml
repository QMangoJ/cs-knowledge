  - id: select-poll
    title: "第一代多路复用：[[select]] 和 [[poll]] 为什么在 10 万连接前卡壳"
    tldr: "[[select]] 和 [[poll]] 能交出一份连接名单让内核帮着等，但每次都要把全员名单拷进内核从头点名扫一遍，连接一上万性能就直线垮掉。"
    body: |-
      第一代「等通知」方案是 [[select]]。它的用法很直白：应用线程把关心的文件描述符（fd）塞进一张位图，一股脑交给内核去睡等；只要里面哪怕有一个连接来数据了（或超时了），`select` 就返回。但这套接口有两块硬伤。第一，位图大小在编译期写死，受 [[FD_SETSIZE]]（Linux 默认通常只有 1024）限制，别说 10 万条连接，第 1025 条连接直接就塞不进去了。

      第二块硬伤更致命：每一次调用 `select`，应用都得把整张名单重新拷贝进内核，内核在里面线性扫描全部连接看谁有数据；等终于醒来返回时，它只告诉你「有 3 个就绪了」，却不直接说是哪 3 个——应用线程还得自己再把整张名单从头扫一遍揪出那 3 个。后来出来的 [[poll]] 把固定位图换成了动态数组，拆掉了 1024 数量的上限，可「每次全员拷进内核 + 每次线性挨个点名」的成本公式一丝没改，面对 10 万条连接，每唤醒一次处理 3 条消息就要平白扫描 10 万次，时间复杂度是写死的 O(n)。

      话虽如此，并不是说 `select` 和 `poll` 一无是处。如果手头是个只挂几十上百个连接的小工具或跨平台组件，几百次扫描几乎不花时间，而且几乎所有系统都支持它们，照用不误。真正把它们逼退的不是代码写得差，而是连接数从一百跨到十万时，全员点名这笔账彻底付不起了。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: select(2)/poll(2) 手册
        claim: select 受 FD_SETSIZE 限制且每次调用需传入完整 fd 集合，内核线性检查就绪状态
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
