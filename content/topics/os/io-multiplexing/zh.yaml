id: os/io-multiplexing
subject: os
slug: io-multiplexing
order: 9
status: published
license: CC-BY-4.0
title: IO 多路复用：从阻塞到 [[epoll]]
summary: 高并发网络服务先垮掉的往往不是算力，而是「一个连接押一个线程睡死在 read 上」的等待姿势：10 万个闲线程光栈内存和调度开销就先把机器拖垮。解决思路是把等待集中交给内核：早期 [[select]] 和 [[poll]] 每次都要把全员名单拷进内核挨个点名，连接一多照样慢；Linux 的 [[epoll]] 改用[[红黑树]]长期登记连接，再靠事件回调把真有数据的连接直接塞进就绪链表，应用线程只收这一小撮就绪通知就行。围绕 10 万条大多闲着的长连接，全课从阻塞、非阻塞忙轮询走到事件循环与 Reactor 骨架，再补齐水平与边缘触发、多进程惊群、非阻塞半写流控，以及从 [[C10K]] 到 [[io_uring]] 的演化脉络。
premise: 一台大模型流式网关同时挂着 10 万条长连接，可同一毫秒里真正在发字、收数据的连接通常只有几百条，剩下九万多条全在安静地发呆。总不能真的为这 10 万条闲着的连接配 10 万个线程睡在原地吧？那一个线程到底怎样靠自己同时盯住这 10 万条连接？
position: 本课是操作系统学科「I/O 与设备」板块的唯一一课，也是整门操作系统的收官站：上一课「文件系统」讲完了数据怎样落到磁盘，而无论读写磁盘还是收发网络，程序都躲不过等待慢设备这件事。这一课把「一个线程怎么靠内核通知同时照看成千上万条外部连接」算清，正是后面计算机网络课里高并发网关、以及后端与 Go 语言里协程调度器之所以能轻装上阵的底层依托。
bridge:
  prev: 上一课讲到往磁盘写文件时，内核靠页缓存把程序从「原地傻等落盘」里解放了出来；这一课把同样的「别干等慢设备」思路搬到网络上——看服务器怎样靠 epoll 一次守住 10 万条大多闲着的长连接。
overview:
  - key: 一句话总结
    value: 别让 10 万条闲连接押着 10 万个线程睡觉；把等待集中外包给内核，用 [[epoll]] 登记连接、只挑出真来数据的那几个通知你，一个线程就能轻松扛住全场。
  - key: 每连接一线程
    value: 最直觉的阻塞写法是一条连接配一个线程死等 read，连接一上万，线程栈内存与上下文切换就会先于 CPU 把服务器拖垮。
  - key: select 与 poll
    value: 第一代多路复用把连接名单每次整体交给内核从头扫描一遍；每次等待成本跟总连接数成正比，在 10 万条连接里找 3 个有数据的实在太亏。
  - key: epoll 两件套
    value: 底层用[[红黑树]]长期登记关心的连接，再给每个文件描述符挂上回调；数据一到网卡，回调自动把它链进就绪链表，epoll_wait 只取走这一小撮。
  - key: LT 与 ET 触发
    value: 水平触发（LT）只要缓冲区没读完就反复提醒，写起来不容易漏；边缘触发（ET）只在新数据刚到时喊一声，必须循环读到返回 [[EAGAIN]]，少读半截就会假死饿死。
  - key: 事件循环与 Reactor
    value: 主循环反复 epoll_wait 并按就绪事件分发回调，是 [[Nginx]]、[[Redis]] 与 Node.js 单线程高并发的共同骨架；回调里绝不能跑慢阻塞操作。
  - key: 前端对应物
    value: 浏览器里的 JS 主线程同样靠事件循环运作——它把网络请求、定时器、点击事件统统外包给浏览器底层去等，主线程只顺着任务队列逐个执行回调，堵住主线程页面照样整页卡死。
