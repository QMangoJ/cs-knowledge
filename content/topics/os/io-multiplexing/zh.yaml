- id: thundering-herd
  title: 惊群问题：一个连接到达，为什么别把所有进程都吵醒
  tldr: 多个进程等在同一个监听 socket 上，一个新连接可能把它们全唤醒，最后只有一个能接走，其余白跑一趟。
  body: '惊群（thundering herd）是多进程服务器的经典坑：多个 worker 进程同时阻塞在同一个监听 socket 上等新连接，一个连接到达时，内核可能把等待的进程全部唤醒，但 accept 只有一个能成功，其余的醒来发现没活可干、又睡回去——连接越密集，这种无效唤醒与上下文切换的浪费越明显，CPU 花在了“起床”而不是“干活”上。epoll 场景下同理：多个进程把同一个监听 fd 注册进各自的 epoll 实例，一个事件可能同时出现在多个就绪列表里。内核给的解法是给 epoll 注册加排他标志（EPOLLEXCLUSIVE）：同一个 fd 被多个 epoll 实例排他注册时，一次事件只唤醒其中一个等待者。另一个更常用的架构解法是让内核先做分发：多个进程用 SO_REUSEPORT 各自监听同一端口，内核按连接把新请求分到不同监听队列，从源头上就没有共享监听 socket 这回事。两条路线分别适用于“老架构最小改动”与“新服务直接按分发设计”，选哪条先看你能不能改部署结构。'
  derivation: original
  sources:
