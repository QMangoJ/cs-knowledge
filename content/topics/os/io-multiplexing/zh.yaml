      to: a
      label: epoll_wait 返回就绪的那批
  log:
  - mode: 就绪
    event: 一万个连接里只有 3 个有数据，就只返回 3 个
  code:
    lang: c
    code: "int ep = epoll_create1(0);\nstruct epoll_event ev = { .events = EPOLLIN, .data.fd = fd };\nepoll_ctl(ep, EPOLL_CTL_ADD, fd, &ev);      // 注册一次\nstruct epoll_event out[64];\nint n = epoll_wait(ep, out, 64, -1);        // 睡等：只返回就绪的\nfor (int i = 0; i < n; i++) handle(out[i].data.fd);"
    note: epoll 三件套的最小骨架
    highlight: 5
- id: lt-et
  title: 水平触发 vs 边缘触发
  tldr: LT：缓冲区还有数据就一直通知你；ET：只在「新数据到达」时通知一次，必须一口气读到 EAGAIN。
  body: 'epoll 有两种触发语义。水平触发（LT，默认）：只要 fd 还就绪（接收缓冲区里还有没读完的数据），每次 epoll_wait 都会带上它——编程简单，漏读了下次还有机会。

    边缘触发（ET，用 EPOLLET 开启）：只在状态变化的那一刻通知一次。收到通知后必须循环 read 直到返回 EAGAIN，把数据读干；读一半就停，剩下的再也不会有通知，连接就此饿死。ET 换来的是更少的重复唤醒，代价是编程纪律必须严格。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: epoll(7) 手册（level-triggered 与 edge-triggered 一节）
    claim: 边缘触发要求在通知后持续读/写直到返回 EAGAIN，否则可能不再收到通知
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
