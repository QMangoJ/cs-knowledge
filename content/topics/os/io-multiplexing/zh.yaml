id: os/io-multiplexing
subject: os
slug: io-multiplexing
order: 9
status: published
license: CC-BY-4.0
title: IO 多路复用：从阻塞到 epoll
summary: 一个线程盯一万个连接的办法：别让每个连接占一个线程睡觉，用 epoll 让内核告诉你谁就绪了。
premise: 以一个要同时服务上万个长连接的推理网关为例。
position: >-
  文件读写要等慢设备，线程却睡在 read 上把 CPU 与栈内存白白押住，最后一课的 I/O 与设备板块专治这种等待的姿势。解法是 epoll 注册一次、就绪才返回，用一份就绪列表改写等待成本。把 select 每次全量扫描与 epoll 只报就绪 fd 的账本算清，再说清边缘触发为何必须读到 EAGAIN 才算读完，本课便算过关。
bridge:
  prev: >-
    文件系统课里 write 经页缓存异步刷盘已显出等待不必同步硬扛的思路，本课把同一思路推到网络：用 epoll_wait 一次守住上万 socket 的就绪消息。
overview:
- key: 一句话总结
  value: 阻塞 IO 让线程睡觉等数据；多路复用让一个线程等「任意一个连接就绪」的通知
- key: select / poll
  value: 每次调用把全部 fd 传给内核并线性扫描，连接多了开销随之线性涨
- key: epoll
  value: fd 先注册进内核，内核维护就绪列表，epoll_wait 只返回就绪的那批
- key: LT 与 ET
  value: 水平触发：没读完会反复通知；边缘触发：只通知一次，必须读到 EAGAIN
- key: 事件循环
  value: Reactor 模式：单线程 epoll + 回调，Node.js/Nginx/Redis 的共同骨架
- key: 非阻塞的代价
  value: 读写变成「可能只完成一半」的状态机编程，代码复杂度上升
