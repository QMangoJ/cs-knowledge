    code:
      lang: c
      code: |-
        int ep = epoll_create1(0);
        struct epoll_event ev = { .events = EPOLLIN, .data.fd = fd };
        epoll_ctl(ep, EPOLL_CTL_ADD, fd, &ev);      // 注册一次
        struct epoll_event out[64];
        int n = epoll_wait(ep, out, 64, -1);        // 睡等：只返回就绪的
        for (int i = 0; i < n; i++) handle(out[i].data.fd);
      note: epoll 三件套的最小骨架
      highlight: 5
  - id: lt-et
    title: 水平触发 vs 边缘触发：为什么 ET 少读半截会饿死
    tldr: 水平触发（LT）只要缓冲区还剩数据就每次都提醒，写错了顶多慢一点；边缘触发（ET）只在新数据刚到时喊一声，必须循环读到 [[EAGAIN]]，少读半截就会静默卡死。
    body: |-
      接上 `epoll_wait` 拿回事件之后，还有两种通知脾气要选。默认用的是水平触发（LT，Level-Triggered）：只要这条连接的接收缓冲区里还有哪怕 1 个字节没读干净，下一次调 `epoll_wait` 时内核就会继续把它塞进就绪链表提醒你。这种模式极其宽容，哪怕这回只来得及读一半，下次循环照样叫你接着读，绝不会把数据弄丢。

      另一派是开启 `EPOLLET` 的边缘触发（ET，Edge-Triggered）：内核只在状态「从空变成有数据」的那一瞬间通知你一次。拿个具体数字走一遍对比：假设对端一次发来 8 KB 数据，而你的缓冲每次只读 2 KB。在 LT 模式下，你读完头 2 KB 离开，剩下 6 KB 还在，接下来三次 `epoll_wait` 都会乖乖再报这条连接可读，顺顺利利读完 8 KB；可到了 ET 模式下，通知只给第一次！如果你读了 2 KB 就停手回去等下一次通知，只要对端不再继续发新包过来，剩下的 6 KB 就会永远躺在内核缓冲区里，不报错、不崩溃，这条连接就这么悄无声息地假死饿死了。

      正因为 ET 只通知变化那一瞬，想用好它必须死守三件套纪律：fd 设非阻塞、收到可读就写 `while` 循环一路读到返回 [[EAGAIN]] 彻底抽干、写不完再挂 [[EPOLLOUT]]。它换回的好处是减少不必要的重复唤醒、省系统调用；但在实际工程里，先把默认的 LT 跑稳、真用压测证明重复唤醒成了瓶颈后再切到 ET 才稳妥，别一上来就给自己挖坑。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: epoll(7) 手册（level-triggered 与 edge-triggered 一节）
        claim: 边缘触发要求在通知后持续读/写直到返回 EAGAIN，否则可能不再收到通知
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
