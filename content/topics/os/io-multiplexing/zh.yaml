- id: select-poll
  title: 第一代方案：select / poll
  tldr: 把一堆 fd 一次交给内核等，但每次调用都要全量传递并线性扫描，连接越多越贵。
  body: 'select 让进程把关心的 fd 集合交给内核，内核等到任一 fd 就绪（或超时）才返回，返回后进程还要自己再扫一遍集合，才知道到底是谁就绪。它的问题有两层：其一，fd 集合用位图表达，fd 上限受 FD_SETSIZE（通常 1024）限制，连接一多直接装不下；其二，每次调用都要把整个集合拷进内核、由内核线性扫一遍确认状态，连接数 n 大时，每次等待的成本是 O(n)，而真正就绪的可能只有一两个——为一个就绪事件付全场扫描的钱，连接越多越亏。

    poll 把位图换成数组，去掉了数量上限，接口也干净了些，但全量传递加线性扫描的本质没变，成本结构一模一样。

    所以结论不是它们“差劲”：连接数在几百以内时，O(n) 的 n 本来就小，它们足够好且可移植，这也是它们至今仍在用的原因。问题只出在规模变了、成本公式的常数项没变而 n 变了。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: select(2)/poll(2) 手册
    claim: select 受 FD_SETSIZE 限制且每次调用需传入完整 fd 集合，内核线性检查就绪状态
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
