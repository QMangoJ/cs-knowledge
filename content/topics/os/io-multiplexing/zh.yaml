  - id: partial-write
    title: "非阻塞写与 [[EPOLLOUT]]：100 KB 只写进 30 KB 怎么办"
    tldr: 非阻塞 write 碰上对端接收慢时经常只写出一半，剩下的要存进连接自己的待发缓冲区并临时挂载 [[EPOLLOUT]]；写干净后必须立刻摘掉，否则事件循环会被可写事件风暴占满。
    body: |-
      读的一边遇到没数据会返回 `EAGAIN`，写的一边在非阻塞模式下同样经常只完成一半。假如网关正往客户端推送一条 100 KB 的大模型回复，偏偏对方网络慢，内核发送缓冲区只剩 30 KB 空位——非阻塞 `write()` 把这 30 KB 塞进去之后就会立刻返回 `30720`，绝不会卡在那里等对方腾空。剩下那 70 KB 决不能丢掉，应用必须自己维护一个属于这条连接的「待发缓冲队列」，把这 70 KB 暂存起来，然后调 `epoll_ctl` 给这个连接临时加上 [[EPOLLOUT]]（可写事件）关注。

      等对端慢慢收完包、内核发送缓冲区再次腾出空位时，`epoll_wait` 就会报这个连接「可写了」，你的回调再从待发队列里抓起剩下的 70 KB 接着往外写。最关键的一个好习惯是：**一旦待发队列写空了，必须第一时间把 `EPOLLOUT` 取消关注！** 等一下，为什么不能图省事一直挂着 `EPOLLOUT` 不摘掉？因为对一条正常连接来说，内核发送缓冲区在 99.9% 的空闲时间里都是空的（也就是「永远处于可写状态」）。在默认的水平触发模式下，你一直挂着它，每一次 `epoll_wait` 都会狂吼着返回「这条连接可写」，哪怕你手里压根没数据要发，事件循环照样被空转成 100%——这就是著名的可写事件风暴。

      顺带也看清了流控（背压）的必要性：万一上游生成数据飞快，下游客户端却拔了网线或卡死，这个待发缓冲队列就会像吹气球一样无限涨大，最后把网关自己的内存吃爆。所以真正在线上跑的服务，必须给每条连接的待发缓冲设上限，堆超了要么暂停读上游数据，要么果断断开慢连接保全局。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: epoll(7) 手册与 write(2) 手册（非阻塞写与 EPOLLOUT）
        claim: 非阻塞写可能只完成部分写入，应在发送缓冲有空间时由可写就绪通知驱动继续写入
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
