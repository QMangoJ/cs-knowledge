- id: blocking
  title: 阻塞与非阻塞：read 的两种脾气
  tldr: 阻塞 read 没数据就睡；非阻塞 read 没数据立刻返回 EAGAIN，代价是你要自己重试与拼数据。
  body: 'socket 默认阻塞：read 没数据时线程被挂起，直到数据到达或连接出错才返回，好处是代码可以按「调用必有结果」的直线性子写。把 fd 设为 O_NONBLOCK 后，read/write/accept 全都变成「能做多少做多少」：没数据可读时立刻返回 -1 且 errno=EAGAIN；写的时候对方接收缓冲满了，就只写进去一部分便返回实际写出的字节数，剩下的要你自己记住写到哪了、何时接着写。

    还有个容易踩的细节：EAGAIN 与它的别名 EWOULDBLOCK 在 Linux 上是同一个值，判断时不要把两者写成互斥分支；另外非阻塞 accept 在连接已被对端取消时也可能返回 EAGAIN，事件循环里要能平静地忽略它、回到等待，而不是把它当故障退出。

    非阻塞是事件驱动的前提，但单独用非阻塞只会得到忙轮询：线程疯狂重试、CPU 空转满格，数据却不会因此早到一微秒。必须再配一个「等通知」的机制，CPU 才能在没事时真正睡下——这正是下一代方案要解决的问题。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: accept(2)/read(2) 与 fcntl(2)（O_NONBLOCK）手册
    claim: 非阻塞模式下无数据可读时返回 EAGAIN 而不是挂起调用者
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
