  - id: thundering-herd
    title: 多进程惊群：来一个新连接，别把所有 worker 全吵醒
    tldr: 多个进程盯着同一个监听端口时，一个新连接到达可能把所有睡着的进程全叫醒、结果只有一个抢得到；用 EPOLLEXCLUSIVE 或 [[SO_REUSEPORT]] 就能把无效起床砍掉。
    body: |-
      前面为了利用多核起多个事件循环进程，很快会撞上一个老问题——「惊群」（thundering herd）。机器上有 8 个 worker 进程，大家都在各自的循环里把同一个监听 `80` 端口的 `listen_fd` 登记进了自己的 `epoll`。这时外面正好连进来 1 个新用户，如果内核不做节制，会把正在等待这个事件的 8 个进程全部叫醒；结果 8 个人同时冲过去调 `accept()`，只有手最快的那 1 个接走了连接，另外 7 个扑了个空拿着 `EAGAIN` 又灰溜溜睡回去。如果每秒新建几万条短连接，CPU 光忙着让这群进程反复空起床、白切换，就把大量算力浪掷在空气里了。

      现代 Linux 对此给出了两条干脆的解药。第一种是在调用 `epoll_ctl` 注册监听 fd 时附加上 `EPOLLEXCLUSIVE` 标志，明确跟内核说「这事件来的时候只挑睡在队列里的某一个进程叫醒就行，别喊全班同学」，适合老架构做最小改动。第二种是在架构上直接从源头分流：让 8 个进程开启 [[SO_REUSEPORT]] 各自独立绑定同一个端口，内核收到新连接时直接按五元组哈希分派到其中一个进程的专属队列里，连共享同一个监听 socket 都不需要了，各干各的互不吵闹（这正是高并发 [[Nginx]] 的经典配置）。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: epoll_ctl(2) 手册（EPOLLEXCLUSIVE）与 socket(7)（SO_REUSEPORT）
        claim: EPOLLEXCLUSIVE 可避免同一事件唤醒多个等待的 epoll 实例，SO_REUSEPORT 允许多个监听者分担同一端口
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
