        event: 交活给内核异步执行，不再是能读了自己读
level: 进阶
minutes: 28
prereq:
  - os/syscall
  - os/context-switch
objectives:
  - 解释每连接一线程模型在 C10K 下的瓶颈
  - 对比 select/poll 与 epoll 的成本结构
  - 说清 LT 与 ET 的编程纪律差异
aiLink: 推理网关与流式 API 中继的并发模型就是这一课：上万个 SSE/WebSocket 长连接同时在线、每个只是间歇来数据，epoll 事件循环是标准解法。Node.js 服务「事件循环被堵住」类事故，根源也在这里。
design:
  - mechanism: 为什么 [[epoll]] 把连接名单登记一次留在内核，而不像 [[select]] 每次重新传入
    problem: 网关上往往同时挂着几万到十万条长连接，可同一毫秒里真正来数据的通常只有几个。如果每次等通知都要把完整名单搬进内核再从头扫一遍，等待开销就被总连接数死死拖住。
    choice: 让应用只通过 epoll_ctl 把关心的连接登记一次进内核的[[红黑树]]，同时给每个连接挂好回调，数据到了就增量推进就绪链表；放弃每次全量传名单的 select/poll，因为它们每次调用都要付出全员拷贝和 O(n) 扫描的冤枉账，返回后应用还得自己再扫一遍名单。
    tradeoff: 接口从无状态的单次询问变成有状态的内核对象：连接的增删改都要显式通知 epoll 实例维护，如果不小心忘了注销已关闭或被复用的 fd，就会留下一堆残留幽灵事件，这笔生命周期管理账由框架和应用来扛。
    root: 增量维护代替每次重算：连接名单和就绪状态的变化都只发生在建连、断连和数据到达的那一刻，把登记和入队推到事情发生当场顺手做掉，等待查询自然就只花与结果数量成正比的成本。
  - mechanism: 为什么 [[epoll]] 默认用水平触发（LT），而不是直接默认边缘触发（ET）
    problem: 通知机制的默认模式必须对普通写法够宽容：边缘触发只在数据刚到的那一刻喊一声，少读半截不会报错，只会让这条连接彻底没了下文、静默饿死，这种隐蔽故障作为默认选项代价比收益还大。
    choice: 把水平触发设成默认行为——只要接收缓冲区里还剩数据，下一次等待就还会报就绪，把正确性绑在当下状态而不是「记不记得刚才通没通知过」；如果默认用边缘触发，大量只读定长包或读一半停下的常规代码会偶发假死，排查极其痛苦。
    tradeoff: 水平触发会多产生一些重复唤醒和等待返回（比如分两次读就多提醒一回），高吞吐极致服务嫌啰嗦时，可以主动开启 EPOLLET 并自己兜住非阻塞循环到 EAGAIN 的全部编码纪律。
    root: 状态与变化瞬间两种信号语义的区别：水平触发报的是「现在缓冲区有货」，随时检查都成立，天然不怕漏；边缘触发报的是「刚才水位线动了一下」，错过那一瞬就再也等不来第二声。
quiz:
  - q: epoll 比 select 快的根本原因是什么？
    options:
      - epoll 用了更快的 CPU 指令
      - fd 只需注册一次，epoll_wait 只返回就绪列表，不必每次全量传递并扫描
      - epoll 不经过内核
      - epoll 会自动多线程
    answer: 1
    explain: select/poll 每次调用的成本随连接数线性增长；epoll 的等待成本只与就绪事件数有关。
  - q: 边缘触发（ET）下收到可读通知后，正确的做法是？
    options:
      - 读一次就停，下次通知再读
      - 循环读直到返回 EAGAIN，把数据读干
      - 等对端再发一次
      - 关闭再重开连接
    answer: 1
    explain: ET 只在状态变化时通知一次；不读干，剩余数据不会再触发通知，连接会被饿死。
  - q: 单线程事件循环里最忌讳什么？
    options:
      - 回调函数太短
      - 在回调里执行阻塞/耗时的操作，堵住所有连接的处理
      - 连接数太多
      - 使用非阻塞 socket
    answer: 1
    explain: 循环是所有连接共用的传送带；一个回调卡住，后面所有事件都得排队等待。
