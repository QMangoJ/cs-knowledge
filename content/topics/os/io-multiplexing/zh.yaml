  - id: io-uring
    title: "[[io_uring]] 的定位与全课口诀：从「能读了叫我」到「帮我读完叫我」"
    tldr: "[[epoll]] 问的是「现在能读了吗」（就绪通知），读写还得自己发系统调用；[[io_uring]] 直接把读写清单放进共享队列让内核异步干完再通报（完成通知）。"
    body: |-
      最后看一眼正在 Linux 上快速普及的新一代接口 [[io_uring]]。前面整课讲的 `select`、`poll`、`epoll` 全属于同一种「就绪通知」模型：内核只负责告诉你「这个连接现在来数据了，去读不会阻塞」，但真正把数据从内核拷进应用缓冲区的 `read()` 系统调用，还是得你自己在循环里一遍遍发；遇到大量小包或者高速磁盘文件 I/O（普通磁盘文件其实一直无法有效用 `epoll` 监控就绪），系统调用本身的进入退出开销就变得非常扎眼。

      [[io_uring]] 换了一种沟通契约，叫「完成通知」：内核和应用程序共用两块环形内存队列（提交队列与完成队列），应用直接把「帮我从 fd 读 4 KB 写进这块缓冲」「帮我把这批数据发出去」等一连串请求批量写进提交队列就走；内核在背后默默替你把整个读/写做完，做完再把结果扔进完成队列通知你来领。不过选型不必盲目求新：[[io_uring]] 的缓冲区生命周期管理与取消语义比 `epoll` 复杂得多；绝大多数网络服务先把 `epoll` 事件循环写对，只有实测系统调用本身成了瓶颈、或者要统一做高性能异步磁盘文件读写时，再考虑请它上场。

      把整课收进三句能直接带走的判断：**① 演化账**——阻塞 1 线程押 1 连接 → 非阻塞忙轮询烧核 → select/poll 全员点名 O(n) → epoll [[红黑树]]登记 + 就绪链表 O(k) → io_uring 批交批收完成通知；**② 写对事件循环三纪律**——fd 全设非阻塞、ET 模式必循环读写到 `EAGAIN`、回调绝不阻塞且 `EPOLLOUT` 写干即摘；**③ 选型一问**——连接「多而闲」走事件驱动（或协程包裹的 epoll），「少而忙」老老实实用线程池。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: io_uring(7) 手册
