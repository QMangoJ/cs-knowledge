  - id: engineering
    title: 工程选型：什么时候手写事件循环，什么时候用线程或协程
    tldr: 不是所有服务都该硬上原生 [[epoll]] 状态机——连接「少而忙」用线程池更直白好调，业务复杂又要高并发用带协程的语言；只有「多而闲」的网关与底层组件才最值当手写。
    body: |-
      讲了这么多 [[epoll]] 的威力，工程上千万别陷入「凡是服务器都该手写事件循环」的教条。如果你写的是一套只接几百个内部调用、但每次请求要连查好几张表还要算半天业务的常规接口服务，用「阻塞 [[IO]] + 线程池」不仅逻辑一眼从头读到尾、调试堆栈清清楚楚，而且几百个线程的内存和切换根本不是瓶颈。

      甚至到了上万并发的今天，大多数业务团队也不需要自己手搓 `epoll` 状态机——像 Go 语言里的 [[goroutine]]（以及 Rust/Java 的异步运行时），表面上允许你像阻塞代码一样一行接一行写 `read` 和 `write`，底层运行时其实悄悄替你把所有协程全挂在一张 `epoll`（或同类多路复用器）的事件循环上，遇到 `EAGAIN` 自动切走跑别的协程、数据到了自动切回来接着跑，既拿到了高并发，又保住了直来直去的可读性。

      真正值得直面原生 `epoll` 状态机复杂度的，是两类典型的系统：一是网关、长连接推送、大模型 [[SSE]] 流式代理这类「连接极多且绝大多数时间在闲着」的中继层（10 万条长连接每条只偶尔冒出一个 token chunk，自己管内存和事件循环最省资源）；二是 [[Nginx]]、[[Redis]] 这种追求极致单核吞吐的底层中间件。选型前先问自己一句：**这批连接是「多而闲」还是「少而忙」？** 答案直接决定你该站哪一边。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: epoll(7) 手册
        claim: epoll 面向大量 fd 且就绪比例低的场景优化
