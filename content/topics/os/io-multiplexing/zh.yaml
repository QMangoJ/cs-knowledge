  - id: c10k-c10m
    title: 从 [[C10K]] 到 C10M：连接数每涨两个数量级，瓶颈换一层
    tldr: 一万连接时瓶颈卡在等待姿势（用 [[epoll]] 解决），涨到千万连接（C10M）时内核协议栈、中断分配和包拷贝本身就会堵死——永远先量出卡在哪一层再下手。
    body: |-
      把规模尺子再往远拉一拉。当连接数在 1 万到 10 万级别（[[C10K]] 阶段）时，瓶颈死死卡在「用什么姿势等」上——把一连接一线程换成 `epoll` 事件驱动，问题迎刃而解，十几万闲连接对现代 Linux 只是小菜一碟。可一旦单机并发冲到千万连接（C10M）或极高小包吞吐量，就算应用层的 `epoll_wait` 循环写得天衣无缝，整台机器依然会喘不上气。

      这时候瓶颈换了层：数据包每次进来都要触发网卡中断、走完庞大复杂的内核协议栈、再在内核和用户空间之间拷贝内存——光是内核每包处理费与跨核锁争抢就先耗干了 CPU。到了这个量级，优化手段就得再往底层走：多队列网卡把中断均匀绑到不同核心、批量收发包、甚至像 DPDK 那样彻底绕过内核协议栈在用户态自己收包。但永远记住一条排查纪律：绝大多数服务卡顿，十有八九还是事件循环里混进了慢阻塞调用，别连剖析工具都没看就急着拆内核协议栈——瓶颈在哪层，钱和精力就花在哪层。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: epoll(7) 手册开头的问题陈述
        claim: epoll 为大量并发连接的扩展性问题而设计，是 C10K 类问题的内核侧答案之一
        status: verified
