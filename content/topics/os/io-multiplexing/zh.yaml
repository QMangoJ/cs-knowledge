- id: c10k-c10m
  title: 从 C10K 到 C10M：问题是怎么一步步变形的
  tldr: 连接数每涨一个量级，瓶颈就换一层：先是线程模型，然后是内核协议栈与内存带宽，最后是整个软件架构。
  body: '把视角拉长看这条演进线。C10K 阶段的问题是等待姿势：一连接一线程撑不住，解法是 epoll 事件驱动，本课讲的正是这一层。连接数继续涨到百万量级（常被概括为 C10M 问题）时，瓶颈换了地方：内核协议栈的每包处理成本、中断与软中断的分布、连接状态占用的内存、网卡队列与 CPU 的亲和关系，都会先于应用代码成为上限，这时优化手段变成多队列网卡、中断绑核、批量收发包这类系统级调优，甚至绕过内核协议栈。注意这不是说应用层不用管了，而是每一层都有自己的天花板，撞到哪层就治哪层：十万连接的服务若卡住，先查的往往还是事件循环里有没有混进阻塞调用，而不是急着换更底层的网络栈。一个好用的判断习惯是先定位瓶颈所在的层：线程数、系统调用次数、单核软中断占用、还是内存总量——数字会告诉你现在处在演进的哪一段，下一步的钱该花在哪。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: epoll(7) 手册开头的问题陈述
    claim: epoll 为大量并发连接的扩展性问题而设计，是 C10K 类问题的内核侧答案之一
    status: verified
