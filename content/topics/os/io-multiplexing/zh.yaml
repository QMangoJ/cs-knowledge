- id: lt-et
  title: 水平触发 vs 边缘触发
  tldr: LT：缓冲区还有数据就一直通知你；ET：只在「新数据到达」时通知一次，必须一口气读到 EAGAIN。
  body: 'epoll 有两种触发语义。水平触发（LT，默认）：只要 fd 还就绪（接收缓冲区里还有没读完的数据），每次 epoll_wait 都会带上它——编程简单，漏读了下次还有机会。

    边缘触发（ET，用 EPOLLET 开启）：只在状态变化的那一刻通知一次。收到通知后必须循环 read 直到返回 EAGAIN，把数据读干；读一半就停，缓冲区里剩下的那截再也不会触发新通知，连接就此饿死，而且表面上不报错、只是“再也不来数据了”，是事件驱动代码里最难查的一类假死。用一个具体场景对比：对端一次发来 8 KB，你每次只读 2 KB——LT 下后面三次 epoll_wait 还会继续报这个 fd 就绪，慢慢读完没事；ET 下只报第一次，剩下 6 KB 若没人再发新数据，就永远躺在缓冲区里。

    ET 换来的是更少的重复唤醒与更少的无谓 wait 返回，代价是编程纪律必须严格：非阻塞 fd、循环读写到 EAGAIN、写不完时再挂 EPOLLOUT，三件套缺一件都不成立。所以默认选 LT，把 ET 当成压测证明唤醒次数是瓶颈之后才上的优化，而不是一开始就给自己上难度。'
  derivation: original
  sources:
