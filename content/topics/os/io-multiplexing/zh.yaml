steps:
- id: why
  title: 问题：一个连接一个线程为什么撑不住
  tldr: 连接大多时间在等数据，线程却被占着——一万个连接就是一万个睡着的线程。
  body: '最直觉的服务器写法：accept 一个连接就开一个线程，线程里 read 阻塞等数据。连接数少时没问题；到了上万长连接（聊天、推送、LLM 流式响应），账就算不过来了：每个线程都要占一份栈内存（默认量级在 MB 级，乘上一万就是几十 GB 的虚拟空间与可观的实际开销），内核还要维护上万个线程的调度结构，偶尔一起醒来时光上下文切换就是一笔大开销，而它们绝大部分时间只是在睡觉等数据，根本没在算东西。

    这就是著名的 C10K 问题：单机同时服务一万个连接时先撑不住的不是 CPU 算力，而是「等待的姿势」——等待本身不该按连接数线性地消耗线程这种昂贵资源。

    解决方向也就明确了：让等待不占线程——少数几个线程同时盯住很多连接，谁有数据就处理谁，等通知这件事交给内核集中去做。后面几代方案的区别，只在于这个「盯」到底有多贵。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: epoll(7) 手册开头的问题陈述
    claim: 传统每连接一线程/进程模型在大量连接下扩展性差，epoll 为此而设计
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
