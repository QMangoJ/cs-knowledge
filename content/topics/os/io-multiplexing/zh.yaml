- id: engineering
  title: 工程选型：什么时候用哪套
  tldr: 连接少用线程池 + 阻塞 IO 也很好；长连接多、单请求便宜，才是 epoll 事件驱动的主场。
  body: '别把事件驱动当银弹：阻塞 IO + 线程池代码直白、调试容易，几百连接毫无压力；Go 的 goroutine 更是把「一连接一轻量线程」做回主流（运行时内部帮你用 epoll）。

    真正需要手写事件驱动的场景：连接数以万计且大多空闲（推送、网关、流式 API 中继），或延迟对尾部极敏感。LLM 网关的流式转发就是典型：上万个 SSE 连接同时挂着，每个连接只是偶尔来一个 token chunk—— epoll + 非阻塞读写几乎是唯一合理的姿势。

    选型时还有个常被忽略的变量：团队对状态机式代码的维护能力。事件驱动把一个连接的生命周期拆散在多个回调里，日志与调试都要跨回调拼图；若业务逻辑本身很复杂（多步事务、长流程），把并发留给运行时（如带 epoll 内核的协程运行时）、自己按直线性子写代码，往往是总成本更低的选择。技术选型的账要算全周期，而不是只算压测数字。最后一个自检问题可以帮你在面试与设计评审里快速定调：这个服务的连接是“多而闲”还是“少而忙”——多而闲选事件驱动，少而忙先试线程池，答案不同，后面的整套结构都会不同。'
  derivation: original
  sources:
