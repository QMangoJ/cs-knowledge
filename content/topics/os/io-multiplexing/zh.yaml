steps:
- id: why
  title: 问题：一个连接一个线程为什么撑不住
  tldr: 连接大多时间在等数据，线程却被占着——一万个连接就是一万个睡着的线程。
  body: '最直觉的服务器写法：accept 一个连接就开一个线程，线程里 read 阻塞等数据。连接数少时没问题；到了上万长连接（聊天、推送、LLM 流式响应），每个线程光栈内存就是一笔账，线程切换与调度开销也随之而来，而它们 99% 的时间在睡觉等数据。

    这就是著名的 C10K 问题：瓶颈不在 CPU，而在「等待的姿势」。解决方向：让等待不占线程——一个线程同时盯住很多连接，谁有数据处理谁。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: epoll(7) 手册开头的问题陈述
    claim: 传统每连接一线程/进程模型在大量连接下扩展性差，epoll 为此而设计
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: a
      label: 10000 个线程
      highlight: true
    - lane: kernel
      id: k
      label: 内核
    - lane: net
      id: n
      label: 10000 个连接
    messages: []
  log:
  - mode: 瓶颈
    event: 线程都在阻塞等待，内存与切换先于 CPU 耗尽
- id: blocking
  title: 阻塞与非阻塞：read 的两种脾气
  tldr: 阻塞 read 没数据就睡；非阻塞 read 没数据立刻返回 EAGAIN，代价是你要自己重试与拼数据。
  body: 'socket 默认阻塞：read 没数据时线程被挂起，直到数据到达。把 fd 设为 O_NONBLOCK 后，read/write/accept 都变成「能做多少做多少」：没数据返回 -1 且 errno=EAGAIN；写缓冲区满时只写进一部分就返回，你得记住写到哪了。

    非阻塞是事件驱动的前提，但单独用非阻塞只会得到忙轮询（CPU 空转）。必须配一个「等通知」的机制，CPU 才能在没事时真正睡下。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: accept(2)/read(2) 与 fcntl(2)（O_NONBLOCK）手册
    claim: 非阻塞模式下无数据可读时返回 EAGAIN 而不是挂起调用者
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: a
      label: 应用线程
      highlight: true
    - lane: kernel
      id: k
      label: 内核
    - lane: net
      id: n
      label: 对端
    messages:
    - id: m-blk
      from: a
      to: k
      label: 非阻塞 read → 立刻 EAGAIN（没数据）
      active: true
  log:
  - mode: 非阻塞
    event: 没有数据就立刻返回，线程不睡但也没事可做
- id: select-poll
  title: 第一代方案：select / poll
  tldr: 把一堆 fd 一次交给内核等，但每次调用都要全量传递并线性扫描，连接越多越贵。
  body: 'select 让进程把关心的 fd 集合交给内核，内核等到任一 fd 就绪（或超时）才返回。它的问题：fd 上限受 FD_SETSIZE（通常 1024）限制；且每次调用都要把整个集合拷进内核、线性扫一遍确认谁就绪——连接数 n 大时，每次等待的成本是 O(n)。

    poll 去掉了数量上限（用数组传 fd），但全量传递 + 线性扫描的本质没变。连接少时它们足够好，这也是它们至今仍在用的原因。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: select(2)/poll(2) 手册
    claim: select 受 FD_SETSIZE 限制且每次调用需传入完整 fd 集合，内核线性检查就绪状态
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: a
      label: 应用线程
    - lane: kernel
      id: k
      label: 内核
      highlight: true
    - lane: net
      id: n
      label: 对端
    messages:
    - id: m-sel
      from: a
      to: k
      label: 每次把全部 fd 交给内核扫描
      active: true
  log:
  - mode: 扫描
    event: 就绪的可能只有 1 个，扫描的却是全部 n 个
- id: epoll
  title: epoll：注册一次，只报就绪
  tldr: fd 先用 epoll_ctl 注册进内核的兴趣列表；数据到达时内核把 fd 放进就绪列表，epoll_wait 只拿这批。
  body: 'epoll 把「等」拆成两步：epoll_create 建一个 epoll 实例；epoll_ctl 把 fd 注册进去（一次注册、长期有效）；epoll_wait 睡等，内核在某个注册 fd 就绪时把它加入就绪列表，wait 返回这批就绪 fd。

    成本结构完全变了：注册是偶尔做的事，wait 的开销只与「就绪了几个」相关，与总连接数基本无关。这就是它能撑十万级连接的原理——不是更快地扫，而是根本不扫。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: epoll(7)/epoll_wait(2) 手册
    claim: epoll 通过注册兴趣列表与就绪列表，使等待开销只取决于就绪事件数
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: a
      label: 应用线程
    - lane: kernel
      id: k
      label: 内核（epoll）
      highlight: true
    - lane: net
      id: n
      label: 对端
