- id: io-uring
  title: io_uring 的定位：从「就绪通知」到「完成通知」
  tldr: epoll 回答「现在能读了吗」，io_uring 直接把读写动作交给内核异步做完再报告完成，顺带把系统调用次数压下去。
  body: 'epoll 家族的语义是就绪（readiness）：内核只告诉你“现在读不会阻塞”，真正的 read 还是应用自己发系统调用去做。连接与请求量再上一个台阶后，系统调用本身与数据拷贝的次数成了显眼的成本，io_uring 换了个模型：应用把要做的操作（读、写、accept 等）写成请求放进提交队列，内核异步执行，再把结果写进完成队列通知应用——交的是“要做什么”，等的是“做完了”，这叫完成（completion）语义。它顺带批量化了提交与回收，理想情况下一串 I/O 只需要极少的系统调用。定位要分清：io_uring 不是 epoll 的简单加速版，它改变了编程模型（缓冲区生命周期、错误处理、取消语义都要重学），且不止管网络、文件 I/O 也一并覆盖；而 epoll 加非阻塞读写在绝大多数服务里仍然足够且更成熟。选型顺序建议是：先把 epoll 事件循环写对、量出系统调用确实是大头，再考虑 io_uring，而不是反过来为新而新。'
  derivation: original
  sources:
