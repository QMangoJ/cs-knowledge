        event: LT 宽容、ET 高效但漏读即饿死
  - id: reactor
    title: 事件循环与 Reactor 模式：单线程扛起全场的核心骨架
    tldr: 把非阻塞读写、[[epoll]] 等待和事件回调拧成一个死循环，就是支撑 [[Nginx]]、[[Redis]] 与 Node.js 的 Reactor 模式；这条共用传送带最怕回调里堵死，慢活必须扔进工作线程池。
    body: |-
      把前面几步的零件装到一台机器上，就长出了高并发服务最经典的主骨架——Reactor（反应器）模式：整个进程就靠一条事件循环（event loop）不断转圈——调 `epoll_wait` 等就绪名单、拿回那几个有动静的连接、按事前绑定的回调函数分头处理（可读就读包解析、可写就吐出响应、定时器到点就跑超时清理），全部快刀斩乱麻处理完，再回头进下一轮 `epoll_wait`。

      [[Nginx]] 的每个 worker 进程、[[Redis]] 的单线程命令引擎、Node.js 底层的 libuv，骨子里全跑着这一套循环。在 10 万条闲连接的大场面下，单线程事件循环赚到了两笔大便宜：既不用背 10 万个线程的栈内存，也彻底免掉了多线程抢共享数据时加锁解锁的复杂与内耗；想吃满多核 CPU，只要起跟核数一样多的独立进程，各跑各的事件循环就行。

      但这条共用传送带有一条绝对不能碰的红线：任何回调函数本身都必须快如闪电，绝不允许在循环线程里跑阻塞睡眠或重计算（这正是 Node.js 常喊「别阻塞事件循环」的根本原因）。试想 10 万条连接共用这一个转盘，其中一条连接的回调里写了同步查慢数据库或者算了一秒钟加密，剩下 99,999 条连接全都得站在原地陪它干瞪眼。现实工程的标配解法是「主循环只管网络收发和快分发，查库、调大模型、做重算全扔给后端工作线程池，干完再投递回主循环写回连接」。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: epoll(7) 手册（典型用法一节）
        claim: epoll 的典型用法是单线程事件循环：等待就绪事件并分发处理
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
