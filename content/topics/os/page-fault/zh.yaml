- id: exact-lru-cost
  title: 精确 LRU 为什么太贵：实现代价
  tldr: 真 LRU 要在每次访问时更新全局顺序，成本压过访问本身；系统只用已访问位做近似采样。
  body: '精确 LRU 要求每访问一页，就把它的名次更新为“最新使用”，实现上等于每次内存访问都要维护一条按最近使用排序的链表：命中一页，要把它从链表中间摘下再插到头部。问题在于访问发生在每条指令的尺度上，硬件页表只提供一个已访问位，并不记录访问顺序；若让软件在每次访问时都去更新链表，维护成本会压过访问本身，多核下这条全局链表还会成为所有核心争抢的热点，缓存一致性流量先把系统拖垮。现实系统只保留近似：硬件负责置已访问位，内核周期性扫描并清零，用“最近一个周期内有没有被访问过”代替精确名次。Clock 算法、较新的多队列分代回收（如 MGLRU）都是在这条近似路线上把精度逐步往上推。结论是：在置换问题里 LRU 首先是个成本问题，其次才是算法问题——策略必须便宜到能放在缺页这条热路径上。'
  derivation: original
  sources:
  - ref: ostep
    locator: 'Beyond Physical Memory: Policies（页置换策略）'
