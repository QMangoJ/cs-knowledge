- id: cow-mmap
  title: 缺页的其他用途：写时复制和文件映射
  tldr: 缺页不只用来按需分配，内核还靠它实现写时复制和按需读文件。
  body: 'fork 之后父子共享只读页，子进程一写就触发缺页，内核复制出一份私有页，再让它重做写入。

    mmap 映射一个文件，也不是立刻读进来，而是访问到哪一页才从磁盘读哪一页；程序本身的代码也是这样按需加载的。

    所以“缺页”是内核偷懒和省内存的通用开关，不是错误。


    工程注记（数字为量级示意）：用 mmap 加载 70B 模型权重（约 140 GB，FP16）时，多个推理进程可以共享同一批文件页（页缓存只有一份）；若用 read 全量读入，文件页在页缓存里仍只有一份，但每个进程还要再占一份用户态缓冲区的拷贝；mmap 省的正是这份拷贝，还能让多个进程直接共享同一批页。vLLM 与 llama.cpp 的 mmap 模式省的正是这笔账。还要注意共享的另一面：多个进程映射同一文件时，改的是页缓存里的同一批页，一个进程写入的内容其他进程立刻能看到——进程间共享内存通信本质上就是这个机制换了个接口。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: malloc(3) NOTES、mmap(2)
    url: https://man7.org/linux/man-pages/man3/malloc.3.html
    claim: 缺页不只用来按需分配，内核还靠它实现写时复制和按需读文件。
    status: verified
