- id: mmap-readahead
  title: mmap 文件缺页与预读：顺序读为什么不一页一页等磁盘
  tldr: 文件缺页先查页缓存；顺序访问时内核预读相邻页，后面的缺页大多只补映射不等盘。
  body: 'mmap 一个大文件后顺序读，缺页并不是一页一页孤立发生的。第一次访问触发缺页时，内核判断这是文件页：先查页缓存，命中就直接建立映射，连磁盘都不碰；未命中才发起读盘。读盘时内核还会顺带预读（readahead）：既然程序在顺序访问，就把后面相邻的一串页一起读进页缓存，赌它们马上会被用到。这样顺序读大文件时，真正等磁盘的缺页只占少数，后面的大多变成命中缓存的次要缺页。反过来，随机访问会让预读基本落空，还白白占用页缓存并挤走别的热点页，所以以随机读为主的负载常调小甚至关掉预读。还要澄清一个误解：mmap 读文件不等于把文件拷进进程私有内存，页缓存全系统只有一份，多个进程映射同一文件共享同一批页，这正是它省内存的原因。工程上判断 mmap 是否适合，关键就看访问模式：顺序或近似顺序、能吃预读红利时它很出色；完全随机且记录很小时，普通 read 加用户态缓冲往往更可控。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: mmap(2) 与 readahead(2) 手册
