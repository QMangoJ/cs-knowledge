steps:
  - id: why-lazy
    title: 为什么不在 malloc 时一次分配好
    tldr: 调用 [[malloc]] 拿到指针，只是在内核账本上划出一段虚拟地址归你，物理内存条上一张页都还没分；只有真写到哪一页，系统才发那一页。
    body: |-
      很多程序一启动就习惯先向系统多要一大块内存「备着」：比如调用 [[malloc]] 一口气要了 1 GB 缓冲区，实际上从头到尾只往开头十几 MB 里写过数据。如果当时就老老实实把 1 GB 物理页全绑死给它，剩下将近 1 GB 内存就被一个用不上的承诺白白锁住，别的程序只能被迫去挤页缓存或者滚到慢吞吞的交换区。

      所以 Linux 在你申请时几乎什么实体都不给，只在进程的虚拟内存区域账本（[[VMA]]）上划一笔「这段虚拟地址已经批给这个程序了」，连一张物理页都不配。直到程序真正读写到其中某一页时，才临时拨一页过来，不摸到的页面永远零开销。请一定记住这个常被搞反的事实：malloc 返回非空指针不代表物理内存已经到手，它只是拿到一张待兑现的额度券。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: malloc(3) NOTES、mmap(2)
        url: https://man7.org/linux/man-pages/man3/malloc.3.html
        claim: 大块分配通过 mmap 建立映射，物理页在访问时才分配
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
