  - id: cow-mmap
    title: 缺页的其他用途：写时复制和文件映射
    tldr: 缺页不只用来按需分配，内核还靠它实现写时复制和按需读文件。
    body: |-
      fork 之后父子共享只读页，子进程一写就触发缺页，内核复制出一份私有页，再让它重做写入。mmap 映射一个文件，也不是立刻读进来，而是访问到哪一页才从磁盘读哪一页；程序本身的代码也是这样按需加载的。所以「缺页」是内核偷懒和省内存的通用开关，不是错误。

      文件映射还有一层共享红利：页缓存全系统只有一份，多个进程映射同一文件时共享同一批页，一个进程写入的内容其他进程立刻能看到——进程间共享内存本质上就是这个机制换了个接口。相比之下，用 read 把文件读进每个进程自己的缓冲区，就要多占一份拷贝。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: malloc(3) NOTES、mmap(2)
        url: https://man7.org/linux/man-pages/man3/malloc.3.html
        claim: 缺页不只用来按需分配，内核还靠它实现写时复制和按需读文件。
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
