  - id: thrashing-numbers
    title: 抖动的定量例子：工作集只超一点点也会悬崖
    tldr: 三个进程工作集合计只比内存多 1 GB，吞吐不是慢一点，而是整体塌陷。
    body: |-
      用一个定量例子看抖动怎么发生。设物理内存 8 GB，三个进程各有约 3 GB 的工作集，合计 9 GB，只超了 1 GB。装不下的那部分页会被反复换出又换入：进程 A 刚把一页换进来，内存压力下又把 B 马上要用的页挤了出去；B 缺页调入时再挤掉 A 的页。此时主要缺页从偶尔出现变成持续不断，磁盘被换页流量占满，CPU 大量时间在等 I/O，三个进程的吞吐一起塌陷，而不是每个只慢三分之一——抖动是非线性的悬崖，不是线性变慢。

      解法不在置换算法里：要么加内存，要么减少并发（让一个进程先跑完、工作集完整驻留再放下一个），要么给关键进程保住其工作集的内存下限。只要把同时活跃的工作集之和压回物理内存以内，缺页率就会自己掉回正常水平。
    derivation: original
    sources:
      - ref: ostep
        locator: "Beyond Physical Memory: Policies（工作集与抖动）"
        claim: 当所有进程工作集之和超过物理内存时发生抖动，减少并发或增加内存是根本解法
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
