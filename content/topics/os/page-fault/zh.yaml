  - id: fault
    title: 第一次写入：硬件按下暂停键、触发缺页异常
    tldr: 往新申请的缓冲区写第一个字节时，[[MMU]] 发现页表项还是空的，会立刻在写入生效前冻住这条指令，把出错地址塞进 [[CR2]] 交给内核——缺页不是程序报错，而是硬件发出的「请补页」暗号。
    body: |-
      拿到 1 GB 指针后，程序顺手往里面写第一个字节。CPU 里的 [[MMU]] 拿着这个虚拟地址去查页表，结果发现对应的页表项还是空空如也。硬件既不懂怎么挑空闲物理页，也不能贸然把正常程序杀掉，它干的动作非常干净：在写入生效之前立刻冻住当前指令、保存寄存器现场、切入内核态，同时把出事的虚拟地址塞进专用寄存器 [[CR2]]，再附上一串错误码告诉内核「刚才是在读还是在写、是压根没页还是权限不够」。

      等一下，缺页为什么叫「异常」听着像出错，实际上却是内核最顺手的工具？因为这个硬件暂停把「页面还没到位」变成了一个可以插进软件代码的钩子：懒分配、栈自动长高、[[mmap]] 懒读文件、写时复制，全靠这道信号才撑得起来。而且因为硬件把指令拦在了动手改写内存之前，整条指令没有任何副作用，等内核忙完补页，放回来就能接着从头再跑一遍。
    derivation: original
    sources:
      - ref: ostep
        locator: "Beyond Physical Memory: Mechanisms 一章"
        claim: 访问未在内存中的页触发缺页异常
