        event: OOM killer 选中并终止进程
  - id: mmap-readahead
    title: mmap 顺序读与预读：为什么不一页一页傻等磁盘
    tldr: 用 [[mmap]] 从头到尾顺序扫一个大文件时，第一次缺页读盘会顺手把后面一串相邻页一起「预读」进页缓存；后面紧接着的访问大多直接命中缓存变成次要缺页，但随机乱跳读会把这招打空。
    body: |-
      拿 [[mmap]] 映射一个几个 GB 的大模型权重文件后从头往后读，缺页并不是 4 KB 一页页孤零零去等磁盘的。第一次缺页时，内核先看一眼页缓存：要是缓存里已经有了就直接填页表（不碰盘）；没命中才发起磁盘读盘，并且一旦察觉你在连续往后读，就会顺手触发预读（readahead）——干脆把紧跟着的那一串相邻页一口气捎带进页缓存。结果就是后面几页紧接着被读到时，数据早就躺在内存里了，统统变成几乎不用等盘的次要缺页。

      反过来，如果业务是满文件随机跳着读几十字节的小记录，预读捎带回来的周围页面全都用不上，反而白占页缓存、把真正的热数据挤走。所以挑不挑 mmap 要看访问花样：大块顺序扫描（像加载权重、扫日志文件）能吃满预读红利，特别划算；纯粹细碎随机读，老老实实配合普通 read 加应用层缓冲往往更可控。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: mmap(2) 与 readahead(2) 手册
        claim: 文件映射页经缺页从页缓存调入，顺序访问时内核可预读后续页面
        status: verified
