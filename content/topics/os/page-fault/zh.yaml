        event: OOM killer 选中并终止进程
  - id: mmap-readahead
    title: mmap 文件缺页与预读：顺序读为什么不一页一页等磁盘
    tldr: 文件缺页先查页缓存；顺序访问时内核预读相邻页，后面的缺页大多只补映射不等盘。
    body: |-
      mmap 一个大文件后顺序读，缺页并不是一页一页孤立发生的。第一次访问触发缺页时，内核先查页缓存：命中就直接建立映射，连磁盘都不碰；未命中才发起读盘。读盘时内核还会顺带预读（readahead）：既然程序在顺序访问，就把后面相邻的一串页一起读进页缓存，赌它们马上会被用到。这样顺序读大文件时，真正等磁盘的缺页只占少数，后面的大多变成命中缓存的次要缺页。

      反过来，随机访问会让预读基本落空，还白白占用页缓存、挤走别的热点页——所以访问模式决定 mmap 是否合适：顺序或近似顺序、能吃预读红利时它很出色；完全随机且记录很小时，普通 read 加用户态缓冲往往更可控。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: mmap(2) 与 readahead(2) 手册
        claim: 文件映射页经缺页从页缓存调入，顺序访问时内核可预读后续页面
        status: verified
