  - id: overcommit
    title: 超卖的代价：[[OOM]] killer
    tldr: Linux 默认允许大家申请比物理内存更多的总量（超额承诺）；万一大家真在同一时间写爆了物理内存加交换区，实在没地方可换了，内核只能派 OOM killer 杀掉一个占内存大户保命。
    body: |-
      想象同一台 8 GB 内存的机器上同时跑了四个服务，每个都顺手 malloc 了 3 GB 准备当缓存，合计 12 GB，刚申请时全都返回成功——这就是 Linux 敢开的「超额机票」（overcommit）。大多数时候，四个服务各自只往里面写了四五百 MB 就停下了，加起来不到 2 GB，整台机器稳稳当当。万一某天流量暴涨，四个服务偏偏在同一分钟里把各自的 3 GB 缓存全写满，物理内存加 [[swap]] 瞬间塞爆、半页空位都挤不出来，缺页处理就只能拉响最终警报：派出 OOM killer，按内存占用分数（oom_score）挑一个进程直接强杀，把整片页面回收给全机续命。线上服务半夜「突然消失得无影无踪」，头一个就该去 dmesg 里翻 OOM 记录。

      顺手对一遍代价尺度：不用碰磁盘的次要缺页只要微秒级，去 NVMe SSD 读盘的主要缺页约几十微秒（老式 SATA 约百微秒、机械盘毫秒级）。而在生产环境里，不能听任内核按默认分数随便挑人来杀，正确的做法是用 [[cgroup]] 把单个服务的内存上限死死圈住，再给数据库等关键进程调低 oom_score_adj（OOM 评分调整值，分数越低越不容易被选中），确保真爆了也先杀可重启的边角工人。
    derivation: original
    sources:
      - ref: linux-kernel-docs
        locator: mm/overcommit-accounting
        url: https://docs.kernel.org/mm/overcommit-accounting.html
        claim: Linux 的内存超额承诺策略
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
