  - id: cow-mmap
    title: 一钩多用：写时复制和文件映射也靠这一下
    tldr: 同一套「先拦住、补完再重跑」的缺页钩子，不仅撑起了 malloc 的懒分配，还顺手扛起了 fork 的写时复制和 [[mmap]] 的文件按需加载。
    body: |-
      走通一次「冻住指令 → 补页 → 重跑」的流程后，内核顺手把这把好用的瑞士军刀借去干另外两件大事。第一件是 fork 写时复制（[[COW]]）：创建子进程时父子先共用同一批物理页且统统标成只读；只要有一方先往里写数据，写权限对不上立刻触发缺页异常，内核趁机复制一页私有副本并改成可写，再放回去重跑那条写指令，剩下没改过的页依然稳稳共享。

      第二件是 [[mmap]] 映射文件：把一个几十 GB 的大文件 mmap 进地址空间，同样一字节都还没读盘，等代码真正读到哪一页才触发一次主要缺页从磁盘搬进页缓存——程序自身的可执行代码就是这么边跑边读进来的。而且页缓存全系统只有一份，如果两个进程同时映射同一个文件，两份页表可以直接指向页缓存里同一批物理页，省下整份重复拷贝（对比用普通 read 读进各自缓冲区就得多占一份内存）。
    derivation: original
    sources:
