prereq:
  - os/virtual-memory
objectives:
  - 按顺序说出缺页处理流程
  - 区分文件页、匿名页与写时复制缺页
  - 解释 overcommit 为什么敢承诺超过物理内存
aiLink: 大模型权重常用 mmap 加载：进程启动瞬间并不把几十 GB 权重全读进内存，而是靠缺页按需调入——服务冷启动快、内存峰值可控。看懂缺页与 mmap，就看懂了 safetensors 懒加载、按需分页与内存超卖的底层机制。
design:
  - mechanism: 为什么按需分页，而不是在申请时预先全装入
    problem: 物理内存总量有限，且远小于所有进程地址空间之和；程序申请的内存又有很大比例从头到尾根本不会被访问到。
    choice: 第一次真正访问时才经缺页分配物理页。预先全装入的失败模式是：未用承诺长期占用页框，内存利用率被虚假申请绑架，系统更早陷入回收与换页。
    tradeoff: 代价是第一次访问要多付一次异常处理、甚至一次读盘的延迟，承担者是第一次碰到冷页的那个请求；换来的是整机内存利用率与更高的进程并发度。
    root: 虚拟内存的间接性：虚拟地址与物理页的绑定本来就可以推迟到访问那一刻由页表完成，而硬件缺页异常正好提供了在绑定缺失时转交软件处理的入口。
  - mechanism: 页置换为什么用 LRU 近似，而不是实现真正的 LRU
    problem: 置换决策位于缺页热路径上必须极便宜，而且硬件只提供已访问位，并不记录每次访问的精确先后顺序，信息本身就是残缺的。
    choice: 用 Clock、多队列分代等近似算法，以周期采样代替精确排序。真 LRU 的失败模式是每次访问都要维护一条全局有序链表，维护成本压过访问本身，多核下还会成为争抢热点。
    tradeoff: 代价是近似会偶尔换错页、让个别进程多付几次主要缺页，承担者是被误判为冷页的页面主人；换来的是回收路径足够便宜、能在内存压力下持续运转。
    root: 程序的时间局部性：近期被访问过的页在近未来大概率还会再被访问，所以哪怕只是粗糙采样「最近用没用过」，也能抓住绝大部分可预测性。
  - mechanism: 为什么允许内存超额承诺（overcommit），而不是申请时就预留足额
    problem: 若按申请量足额预留，内存利用率会被从未兑现的承诺锁死：大量进程都按峰值申请、按低谷使用，足额预留等于让整机长期空转着一半内存。
    choice: 只记账不预留、真用时再分配。严格预留的失败模式是：申请本身频繁失败，程序被迫自己做内存池与假承诺，系统级利用率反而更差。
    tradeoff: 代价是极端情况下承诺无法兑现，只能由 OOM killer 杀进程收场，承担者是被选中的大内存进程；换来的是日常状态下高得多的内存利用率与更少的无谓申请失败。
    root: 大数意义上的使用率统计：独立进程同时把承诺全部兑现的概率很低，超卖是把这种统计规律变成机制，与航空超售、带宽超售同构。
quiz:
  - q: 缺页异常一定是程序出错吗？
    options:
      - 是的，立刻段错误
      - 不是，按需调页、COW、栈增长都靠缺页正常完成
      - 只有写代码时才会
      - 是内核 bug
    answer: 1
    explain: 缺页是机制而非错误；只有地址确实非法时才发 SIGSEGV。
  - q: mmap 一个 40 GB 权重文件后立刻能运行，靠的是？
    options:
      - 文件已全读进内存
      - 只建映射，真正读盘由第一次访问时的缺页触发
      - 权重被压缩了
      - GPU 直接读文件
    answer: 1
    explain: 映射 ≠ 加载，缺页时按页从文件调入页缓存。
  - q: overcommit 的风险是什么？
    options:
      - 没有风险
      - 真用超了物理内存+交换区时 OOM Killer 会杀掉进程
      - 程序变慢
      - 文件损坏
    answer: 1
    explain: 承诺时不预留，真超限就由 OOM Killer 按策略回收进程。
