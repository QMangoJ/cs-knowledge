id: os/page-fault
subject: os
slug: page-fault
order: 6
status: published
license: CC-BY-4.0
title: 缺页异常：用到时才分配
summary: Linux 不会提前把内存给足，等程序真正用到时再补上，内存紧张时还可能“超卖”。
premise: 以程序 malloc 一大块内存、之后第一次写入为例。
position: 地址已许诺、物理页却未到场的缺口，专由内存管理板块的这一课收尾，全靠缺页异常这个钩子来补。流程会分清次要缺页、需读盘的主要缺页与写时复制缺页各自的补法。malloc 成功为何不等于内存到手、overcommit 敢超卖的底气在哪里、OOM killer 又怎样兜底，这三问学完都要能答上来。
bridge:
  prev: 虚拟内存课只登记了映射关系却未备齐实体页，本课便守在 MMU 翻译失败的那一刻，看 CR2 里的出错地址如何指引内核补页并重演指令。
  next: 缺页补页要在并发访问下改页表与分配页框，一旦两个线程同时动手改同一个计数器，竞态与丢更新又该拿什么挡住？
overview:
  - key: 一句话总结
    value: 访问还没准备好的页 → 陷入内核 → 内核补上 → 重新执行那条指令
  - key: 核心思想
    value: 按需分配：不用就不花
  - key: 超额承诺
    value: Linux 默认允许申请超过实际可用的内存
  - key: OOM killer
    value: 内存真的不够时，内核挑一个进程杀掉
  - key: 类比
    value: 前端的图片懒加载、路由按需加载代码
  - key: 三种结果
    value: 次要缺页（补一页）、主要缺页（读磁盘）、非法访问（段错误）
  - key: 其他用途
    value: 写时复制、文件映射 mmap、换出页读回
