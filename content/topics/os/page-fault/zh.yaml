  - id: fill
    title: 补上这一页，并让刚才的指令重跑一遍
    tldr: 验身通过后，内核按页的身世补页（匿名页配清零新页、文件页从缓存或磁盘读），填好页表就让刚才那条写指令原样重跑一遍——不用读盘的「次要缺页」和要读盘的「主要缺页」速度差出几个数量级。
    body: |-
      确认刚才的写入完全合法，内核接着按这页的身世拿页面。像 1 GB malloc 这种没有对应磁盘文件的匿名内存，内核从空闲链表拿出一页物理页框，先整页刷成全零再填进页表——等一下，为什么非要多此一举清零不可？因为上一任用完这页内存的进程可能刚在里面放过密码或密钥，如果不擦干净直接交出去，安全防线就彻底漏风了。如果这页背后挂着文件（比如代码或 [[mmap]]），就从页缓存或磁盘把对应 4 KB 读进来；若是先前被踢去交换区的，就从 [[swap]] 读回。

      页表项填妥后，内核切回用户态，把控制权交还刚才那个进程。此时程序计数器稳稳指着半路被冻住的那同一条写指令，CPU 重新跑它一遍——这一回 [[MMU]] 在页表里顺顺利利查到了新鲜出炉的物理页号，那个字节稳稳写进内存，程序自始至终不知道自己刚刚进了一趟内核兜了一圈。

      按要不要等磁盘，缺页分成截然不同的两档：只改映射、配张零页、做 [[COW]] 复制或者数据早就在页缓存里的，全算「次要缺页」（微秒级），进程冷启动头一回碰堆内存几乎全是它，属于正常开销；非得去磁盘或交换区读数据的才叫「主要缺页」（NVMe SSD 几十微秒、机械盘毫秒级），如果一个长期运行的服务主要缺页一直飙高，就说明它的热数据正被挤出内存。
    derivation: original
    sources:
