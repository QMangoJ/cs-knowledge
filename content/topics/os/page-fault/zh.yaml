id: os/page-fault
subject: os
slug: page-fault
order: 5
status: published
license: CC-BY-4.0
title: 缺页异常：用到时才分配
summary: Linux 不会提前把内存给足，等程序真正用到时再补上，内存紧张时还可能“超卖”。
premise: 以程序 malloc 一大块内存、之后第一次写入为例。
overview:
- key: 一句话总结
  value: 访问还没准备好的页 → 陷入内核 → 内核补上 → 重新执行那条指令
- key: 核心思想
  value: 按需分配：不用就不花
- key: 超额承诺
  value: Linux 默认允许申请超过实际可用的内存
- key: OOM killer
  value: 内存真的不够时，内核挑一个进程杀掉
- key: 类比
  value: 前端的图片懒加载、路由按需加载代码
- key: 三种结果
  value: 次要缺页（补一页）、主要缺页（读磁盘）、非法访问（段错误）
- key: 其他用途
  value: 写时复制、文件映射 mmap、换出页读回
- key: 在终端里看一看
  value: /usr/bin/time -v ls　看 Minor/Major page faults；dmesg | grep -i oom　看 OOM killer 记录（可能需要 sudo）
visual: swimlane
lanes:
- id: procs
  label: 程序
- id: kernel
  label: 内核
- id: mem
  label: 物理内存
logColumns:
- key: mode
  label: 当前状态
- key: event
  label: 发生了什么
steps:
- id: why-lazy
  title: 为什么不一次分配好
  tldr: 程序申请的内存，很多根本用不到，提前分配是浪费。
  body: '程序常常 malloc 一大块“备用”，实际只用一小部分。举个走例：程序 malloc 了 1 GB，最后真正写入的只有开头十几 MB；若申请时就把 1 GB 物理页全给它，剩下近 1 GB 会被一个还没兑现的承诺长期占住，其他进程只能去挤页缓存甚至用交换区。

    Linux 于是只在账本（虚拟内存区域 VMA）上记下“这段地址归你了”，暂时不给真实内存，第一次真正访问时再经缺页补上。

    这和前端图片懒加载一样：滚动到了再加载，看不到的就不花流量。代价是第一次访问要多付一次缺页处理，但省下的是整段未用内存的机会成本——对“申请多、使用少”的常见模式非常划算。常见误解是以为 malloc 成功就等于内存已经到手，其实它只拿到了一段地址空间的使用权，物理页一张都还没有。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: malloc(3) NOTES、mmap(2)
    url: https://man7.org/linux/man-pages/man3/malloc.3.html
    claim: 大块分配通过 mmap 建立映射，物理页在访问时才分配
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
