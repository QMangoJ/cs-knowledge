    event: OOM killer 选中并终止进程
level: 进阶
minutes: 16
prereq:
- os/virtual-memory
objectives:
- 按顺序说出缺页处理流程
- 区分文件页、匿名页与写时复制缺页
- 解释 overcommit 为什么敢承诺超过物理内存
aiLink: 大模型权重常用 mmap 加载：进程启动瞬间并不把几十 GB 权重全读进内存，而是靠缺页按需调入——服务冷启动快、内存峰值可控。看懂缺页与 mmap，就看懂了 safetensors 懒加载、按需分页与内存超卖的底层机制。
quiz:
- q: 缺页异常一定是程序出错吗？
  options:
  - 是的，立刻段错误
  - 不是，按需调页、COW、栈增长都靠缺页正常完成
  - 只有写代码时才会
  - 是内核 bug
  answer: 1
  explain: 缺页是机制而非错误；只有地址确实非法时才发 SIGSEGV。
- q: mmap 一个 40 GB 权重文件后立刻能运行，靠的是？
  options:
  - 文件已全读进内存
  - 只建映射，真正读盘由第一次访问时的缺页触发
  - 权重被压缩了
  - GPU 直接读文件
  answer: 1
  explain: 映射 ≠ 加载，缺页时按页从文件调入页缓存。
- q: overcommit 的风险是什么？
  options:
  - 没有风险
  - 真用超了物理内存+交换区时 OOM Killer 会杀掉进程
  - 程序变慢
  - 文件损坏
  answer: 1
  explain: 承诺时不预留，真超限就由 OOM Killer 按策略回收进程。
