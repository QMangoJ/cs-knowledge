    log:
      - mode: 进入内核态
        event: 访问未映射的页，陷入内核
    code:
      lang: text
      code: |-
        缺页处理（内核视角）：
        1. 查 [[VMA]]：地址不合法 → [[SIGSEGV]]
        2. 文件页 → 从页缓存/磁盘读入该页
        3. 匿名页 → 读时映射共享零页，写时才分配清零的私有页
        4. [[COW]] 页 → 复制一份再写
        填好页表后重新执行出错的那条指令
      note: 流程伪代码
  - id: decide
    title: 内核验身：是合法懒分配，还是程序写越界
    tldr: 内核接到缺页后不急着分配内存，第一步先拿 [[CR2]] 去查 [[VMA]] 账本：地址在已批范围且权限对得上才往下补页；真越界或往只读区写，当场发 [[SIGSEGV]] 杀进程。
    body: |-
      刚被叫进内核的缺页处理程序手里握着两样东西：出事的地址和「正在写入」的错误码。它做的第一件事绝不是直接划一页新内存，而是先翻进程的 [[VMA]] 账本对质：这个地址落进了哪一段登记过的区间、这段区间允许写吗？在刚才 1 GB malloc 的例子里，地址正落在可读写堆区内，只是页表项还没来得及填，内核立刻放行进入下一步「补页」。反过来，如果这是个野指针指向未登记区域，或者往只读代码段硬写，内核就会当场下达 [[SIGSEGV]] 终止进程——这就是大家常撞见的「段错误」。

      还有一种巧妙的中间分支：如果地址正好贴在栈顶下方一点点、符合栈往下生长的规矩，内核也会判定这是函数调用把栈撑长了，自动扩大栈范围并补一页。同一种缺页信号进来，就在这半秒的验身环节分出五条去路：补新页、扩栈、从盘读回、写时复制，或者直接杀进程。所以线上排查段错误时，核心就是分清它到底真踩到了未授权区域，还是某个映射漏了权限。
    derivation: original
    sources:
