    log:
      - mode: 进入内核态
        event: 访问未映射的页，陷入内核
    code:
      lang: text
      code: |-
        缺页处理（内核视角）：
        1. 查 VMA：地址不合法 → SIGSEGV
        2. 文件页 → 从页缓存/磁盘读入该页
        3. 匿名页 → 读时映射共享零页，写时才分配清零的私有页
        4. COW 页 → 复制一份再写
        填好页表后重新执行出错的那条指令
      note: 流程伪代码
  - id: decide
    title: 内核判断：合法还是越界
    tldr: 内核查账本，看这个地址是不是程序有权使用的。
    body: |-
      内核拿到出错地址后，第一件事不是分配，而是查账本：这个地址落在哪个 VMA 里、该 VMA 允许读还是写、这次访问的方式是否合规。地址在程序申请过的范围内、权限也允许，说明只是还没分配，内核继续往下补页。地址根本不属于任何 VMA，或对只读映射做了写操作，那才是真错误，内核发 SIGSEGV 终止它，也就是常见的「段错误」（Segmentation fault）。

      还有一种中间情形：地址紧挨着栈的边缘且落在栈的生长方向上，内核会判定为栈在扩展，补一页让栈长高，而不是杀进程。同一种异常，内核根据账本与权限给出完全不同的处理——补页、扩栈、换入、复制或终止，分岔点全在这一步。所以调试段错误时先要分清：它到底是真越界，还是某个本该合法的映射没有按预期建立。
    derivation: original
    sources:
      - ref: ostep
        locator: "Beyond Physical Memory: Mechanisms 一章"
        claim: 操作系统区分合法缺页与非法访问
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
