- id: swap-anon-reclaim
  title: 交换区与匿名页：回收为什么不对称
  tldr: 干净文件页丢了能重读，匿名页无处可丢、只能先写交换区——回收顺序由此决定。
  body: '内存紧张时内核回收页面，但文件页与匿名页的命运不同。干净的文件页背后有磁盘上的原文件，直接丢弃即可，下次用到再读回来，回收成本几乎为零；脏文件页要先写回原文件再丢。匿名页背后没有任何文件，无处可丢，想回收只能先把内容写进交换区（swap），下次访问再以主要缺页的形式读回来。所以没有交换区时，匿名页基本不可回收，内核只能反复去挤文件页缓存，常表现为内存明明很满、页缓存却被压得只剩很小一块，文件读性能跟着变差。这也解释了为什么关掉交换区并不总是更快：留一点交换给冷匿名页一条退路，反而能让页缓存保住热点文件页。回收时内核按页的活跃程度分队列管理，原则是先动冷页、保住各进程的工作集，而不是按进程平均主义地乱挤。'
  derivation: original
  sources:
  - ref: linux-kernel-docs
