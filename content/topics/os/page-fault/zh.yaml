subject: os
slug: page-fault
order: 6
status: published
license: CC-BY-4.0
title: 缺页异常：用到时才分配
summary: 程序调用 malloc 或 mmap 要了一大片内存时，Linux 其实只记了笔虚拟账，一张真实物理页都没发；直到你第一次往里写数据，硬件发现页表空着、拦下这条指令交给内核现补。内核核对权限合法后，按来源补上一张清零新页或从磁盘读回数据，要是内存条早已被占满，还得先用 Clock 这类近似置换算法请出一页冷页腾地方，然后让刚才卡住的写指令重跑一遍。整套机制靠「用到才给」省下大把闲置内存，还顺带撑起了写时复制与内存超额承诺，真把内存和交换区一起撑爆时再由 OOM killer 兜底杀进程。
premise: 程序调用 [[malloc]] 申请了 1 GB 内存，函数一眨眼就返回了；可真正往里面写第一个字节时，程序却突然卡了一下被内核接管。明明函数已经返回成功了，为什么写数据时还要被内核打断，这中间到底在忙什么？
position: 上一课把页表怎么翻译地址讲完了，可当表项还是空的时候缺口就留给了内存管理板块的这最后一课，专门用缺页异常把这一环补齐。本课顺着一次 malloc 后的写入，把不需要碰磁盘的次要缺页、必须读盘的主要缺页、写时复制，以及内存装满时怎样踢出冷页串成一条完整链路。学完你能答清为什么申请内存成功不等于物理页到手、Linux 敢超卖内存的底气在哪，以及内存耗尽杀手怎么挑人兜底。
bridge:
  prev: 上一课的虚拟内存只替程序在页表里登记了地址范围，真正的数据页大多还没进内存条；这一课就守在硬件翻译卡壳的那一刻，看内核怎么接住出错地址把页补齐，再让原指令重跑一遍。
  next: 缺页补页时内核得小心维护共用的页表，等到多个线程直接在共享内存里抢着改同一个计数器，读写交错随时把结果算丢——下一课进入并发与同步，看锁是怎么把争抢关进笼子的。
overview:
  - key: 一句话总结
    value: 程序摸到一页还没备好物理页框的内存时，硬件会拦住这条指令交给内核，内核补齐页面（不够位子就先换出一页冷页）并填好页表，再让同一条指令原样重跑一遍，程序自己毫无感觉。
  - key: 核心思想
    value: 核心思想是用到哪页才真给哪页。程序伸手要了 1 GB 却只写了开头十几 MB，系统就只给那十几 MB 物理内存，剩下的先记账欠着。
  - key: 超额承诺
    value: 正因为只记账不现发，Linux 默认允许大家申请的总量超过机器实际插的内存条容量。赌的是大家不会在同一时间把各自要的额度全写满。
  - key: OOM killer
    value: 万一大家真的同时写爆了物理内存加交换区，实在腾不出半页空位时，内核只能挑一个占内存大又相对不那么核心的进程直接杀掉腾地方，这就是 [[OOM]] killer。
  - key: 类比
    value: 和前端的图片懒加载、路由按需分包一模一样，都是先占好位置、真滑到那一屏才去拉内容；差别只在这里发生在内存页这一层，程序完全感觉不到卡顿背后的切换。
  - key: 三种结果
    value: 缺页会分出三条岔路：不碰磁盘直接配清零页或写时复制叫次要缺页，极快；要从磁盘或交换区读数据叫主要缺页，慢几个数量级；根本不属于自己的地址则是真越界，直接吃段错误退出。
  - key: 一钩多用
    value: 同一套缺页机制还同时撑起了另外几件大事：fork 的写时复制、[[mmap]] 映射文件按页懒加载，以及冷页被踢进交换区后再访问时的读回。
