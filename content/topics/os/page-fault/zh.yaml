  - id: replace
    title: 页框不够时换谁出去：置换算法
    tldr: major fault 要腾位子，挑哪一页换出决定了之后还会缺多少次页。
    body: |-
      新页要装入而没有空闲页框时，内核必须挑一页「牺牲者」：干净的文件页直接丢弃，脏页或匿名页要先写回交换区或文件。挑错了，刚换出的页马上又被访问，缺页率会雪崩——这就是抖动（thrashing）。

      理论上最优的是换掉「最久以后才再用到」的那页（Belady 最优），但它需要预知未来，只能当标尺。实用算法都是近似：LRU 换掉最久没被访问的页，可精确维护 LRU 要在每次访问时更新全局顺序，成本压过访问本身、多核下还会成为争抢热点——所以在置换问题里，LRU 首先是个成本问题，其次才是算法问题。现实系统用硬件的已访问位做周期采样：Clock 算法给每页一个引用位，指针转圈时引用位为 1 的先给一次「第二次机会」并清零，为 0 的就是牺牲者；新版 Linux 用多级队列（如 MGLRU）把这种近似做得更细。
    derivation: original
    sources:
      - ref: ostep
        locator: "Beyond Physical Memory: Policies（页置换策略）"
        claim: LRU 与 Clock（二次机会）是主流页置换近似算法，抖动源于工作集总和超过物理内存
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
    canvas:
