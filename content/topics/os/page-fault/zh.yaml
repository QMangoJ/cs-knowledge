- id: fault-timeline
  title: 完整时序：一次缺页从硬件到返回
  tldr: 按时间顺序走完一次次要缺页：停指令、查 VMA、取页框、填页表、重执行。
  body: '把一次匿名页次要缺页按时间顺序走完。第一步，CPU 执行写指令，MMU 查 TLB 未命中、再查页表，发现页表项为空，于是触发缺页异常：出错地址写入 CR2，返回现场被保存，控制权转给内核。第二步，内核进入缺页处理：按地址找到所属 VMA，确认这是合法的匿名映射且允许写。第三步，从空闲页链表取一个页框，清零后把物理页号填进页表项，并设置可写等标志。第四步，内核退出异常处理，CPU 回到刚才那条写指令重新执行，这次 TLB 与页表都命中，写入完成。整个过程对程序透明，唯一可观测的痕迹是这条指令花的时间比平时长，次要缺页通常在微秒量级。若第三步发现没有空闲页框，流程会岔向页面回收与置换，时延立刻被放大；若要读盘，则还要加上等 I/O 的时间，变成主要缺页。'
  derivation: original
  sources:
