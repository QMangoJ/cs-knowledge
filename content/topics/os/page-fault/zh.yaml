  - id: swap-anon-reclaim
    title: 交换区与匿名页：为什么内存回收天然不对称
    tldr: 内存紧张需要腾空间时，干净的文件页背后有原文件可以直接扔掉，而 malloc 来的匿名页背后无处可去、必须先写进 [[swap]] 才能回收；彻底关掉 swap 反而会把内核逼去狂挤文件页缓存。
    body: |-
      内存快装满、Clock 表针开始四处踢页时，两类页面的待遇完全不对称。第一类是干净的文件页：它本来就是从磁盘某个文件读进来的，原盘上稳稳留着一模一样的备份，真要腾位置直接一把丢掉即可，回收成本几乎为零（要是被改脏了，先写回原文件再丢）。第二类是像前面 1 GB malloc 产生的匿名页：它背后没有任何磁盘文件撑腰，直接扔掉数据就永久丢了，要想收回它的物理页框，内核只能先把数据写进磁盘 [[swap]] 区存起来，等下次用到再以主要缺页的形式读回。

      等一下，明白了这笔不对称账，也就解开了为什么「彻底关掉 swap 反而可能把机器拖慢」：没有 swap 区，所有匿名页就彻底失去了退路、一根手指也挪不出去；内存一紧，内核没别的东西可回收，只能反复把本来用来加速读文件的页缓存砍掉，最后表现为内存看着没满透，读文件的磁盘请求却成倍飙升。留一点适度的 swap 让常年睡着不用的冷匿名页挪出去，反而能让热腾腾的文件缓存和工作集踏实留在内存里。

      把整课穿成一句口诀：**先记账（VMA）→ 写入触发缺页（CR2）→ 验身补零页或读盘（满就靠 Clock 踢冷页）→ 原指令重跑**。排查线上内存异常记住三问：**一看缺页账**——次要缺页多只是冷启动，主要缺页飙高才是工作集被踢出了内存；**二看回收平衡**——有没有关死 swap 导致页缓存被挤烂；**三看保护线**——有没有用 cgroup 圈住工作集上限，别等内存撑爆才由 OOM killer 随机挑人。
    derivation: original
    sources:
      - ref: linux-kernel-docs
        locator: 内核文档 mm（页面回收与交换相关文档）
        claim: 匿名页回收需要交换区，文件页可通过丢弃或写回回收，内核按活跃程度组织回收队列
