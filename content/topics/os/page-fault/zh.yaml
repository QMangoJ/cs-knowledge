- id: overcommit
  title: 超卖的代价：OOM killer
  tldr: 因为是按需分配，Linux 敢“超卖”内存；真不够时只能杀进程。
  body: '既然大部分申请的内存用不到，Linux 默认允许大家申请的总量超过实际内存，这叫超额承诺（overcommit）。

    万一大家真的都来用，缺页时找不到空闲内存，内核就启动 OOM killer，按 oom_score（主要看内存占用，可用 oom_score_adj 调整）挑一个进程杀掉。

    所以服务“莫名其妙被杀”，常常要去 dmesg 里找 OOM 记录。


    具体数字：minor fault（页已在内存、只补映射）约微秒级，major fault（要去 SSD 读）约几十到上百微秒、去机械盘是毫秒级。/proc/vmstat 的 pgmajfault 持续增长，就是服务在被内存压力拖慢的信号。oom_score 大致与内存占用成正比，所以常驻大内存的进程更容易先被挑中；生产环境常用 cgroup 内存上限或给关键进程调低 oom_score_adj，把“真不够时杀谁”从内核默认策略改成业务自己定的策略，免得被杀的恰好是最重要的那个服务。'
  derivation: original
  sources:
