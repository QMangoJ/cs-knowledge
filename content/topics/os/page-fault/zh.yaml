  - id: thrashing-numbers
    title: 抖动的定量例子：工作集只超 1 GB 也会跌落悬崖
    tldr: 8 GB 内存跑三个各需 3 GB 热数据的进程（合计 9 GB），总需求只超了 1 GB，吞吐却不是各慢一点，而是页面互相踢出引发连环主要缺页、整台机器集体崩塌——这种非线性悬崖就是抖动。
    body: |-
      拿具体数字把抖动算实：设机器共有 8 GB 物理内存，同时跑着三个服务，每个服务眼下真正反复读写的「工作集」各占 3 GB，三家加起来 9 GB——看着只超了区区 1 GB。可就因为装不下这 1 GB，灾难立刻打成死结：进程 A 触发缺页换入一页时，Clock 算法正好踢掉进程 B 下一毫秒要用的页；轮到 B 跑时立刻主要缺页，反手把 C 的热页踢出去；C 接着缺页再踢走 A。主要缺页从偶尔一两次变成连绵不断，磁盘 I/O 跑成 100%，CPU 却干等磁盘啥也算不出来，三家吞吐一起跌成零头，绝不是温柔地「各慢九分之一」。

      碰到这种非线性悬崖，换什么聪明的置换算法都救不回来了——9 升水怎么挑顺序也装不进 8 升桶。真正的解法只有三条：直接加内存；减少并发度（先放两个跑完释放内存再跑第三个）；或者用 cgroup 给关键服务保住 3 GB 工作集下限，先把总活跃需求压回 8 GB 以内，主要缺页率自然瞬间归零。
    derivation: original
    sources:
      - ref: ostep
        locator: "Beyond Physical Memory: Policies（工作集与抖动）"
        claim: 当所有进程工作集之和超过物理内存时发生抖动，减少并发或增加内存是根本解法
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: procs
          id: p
          label: 三个进程
