  - id: replace
    title: 页框满时换谁出去：从 [[LRU]] 到 [[Clock]] 二次机会
    tldr: 补页时物理内存早已住满，内核得先挑一页冷页请出去腾空；精确 LRU 每次访存都要改链表太贵，现实靠硬件顺手标的访问位配合 Clock 表针转圈，就能低成本把热页留下来。
    body: |-
      回到刚才 malloc 的写入现场：万一内核打算给你找一页空闲页框清零时，翻遍链表发现物理内存已经住满了，就必须先挑一页「牺牲者」请出去腾位子。如果挑中的是一页没被改过的干净文件页，直接丢掉就行（原盘上本来就有）；要是被改脏了或者属于匿名内存，就得先写回原文件或写进 [[swap]] 才能挪走。挑错了人很致命——刚踢走一页，下一微秒另一个程序立刻又要读它，来来回回互相踢，机器就陷入了抖动。

      理论上最完美的算法是 [[Belady 最优]]：永远换掉「往后最长时间才会被再次访问」的那一页——可这需要预知未来，只能拿来当考卷标准答案。退一步用历史猜未来就是 [[LRU]]（淘汰最久没碰过的那一页）。等一下，既然大家都知道 LRU 好，为什么 Linux 不给每页搞个精确 LRU 链表？因为精确 LRU 要求程序每读或写一次内存，就要把那一页挪到链表头部，一次正常内存读写才 100 纳秒，去抢全局链表锁调整顺序比访存本身慢得多，多核下立刻卡死。

      现实内核用硬件配合的近似法把成本打下来：每当程序摸过某一页，硬件顺手在页表项把 1 比特「访问位」置成 1，全程不进内核、也不抢锁。[[Clock]]（二次机会）算法把所有页排成一个圆圈，表针扫过去：如果这一页的访问位是 1，说明最近刚被用过，就把它清成 0、饶它这一轮；如果扫到哪一页访问位已经是 0（整整转了一圈都没人碰过），就选中它换出腾位！新版 Linux 的多代 LRU（[[MGLRU]]）也是顺着这个低成本定期扫描的路子做得更细。
    derivation: original
    sources:
      - ref: ostep
        locator: "Beyond Physical Memory: Policies（页置换策略）"
        claim: LRU 与 Clock（二次机会）是主流页置换近似算法，抖动源于工作集总和超过物理内存
        status: verified
