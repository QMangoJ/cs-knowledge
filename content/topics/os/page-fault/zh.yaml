level: 进阶
minutes: 19
prereq:
  - os/virtual-memory
objectives:
  - 按顺序说出缺页处理流程
  - 区分文件页、匿名页与写时复制缺页
  - 解释 overcommit 为什么敢承诺超过物理内存
aiLink: 大模型权重常用 mmap 加载：进程启动瞬间并不把几十 GB 权重全读进内存，而是靠缺页按需调入——服务冷启动快、内存峰值可控。看懂缺页与 mmap，就看懂了 safetensors 懒加载、按需分页与内存超卖的底层机制。
design:
  - mechanism: 按需分页：先在账本画范围，第一次真正摸到那一页才发物理页
    problem: 物理内存条比所有程序宣称想用的总空间小得多，而且程序顺手申请的大块缓冲区常常大半辈子都没人碰。
    choice: malloc 和 mmap 时只写 [[VMA]] 账本不给真内存，等第一次读写触发缺页异常才现场补页；不走申请时全额装入，因为那样会让从没兑现的空头支票锁死大把宝贵内存。
    tradeoff: 第一次碰到冷页时要多挨一下缺页处理甚至读盘延迟，由第一个触碰冷页的请求买单；换回来的是整台机器的内存利用率和更高的进程并发量。
    root: 虚拟地址和物理页本来就是靠页表临时挂钩的，既然硬件能在没挂钩时精确拦下指令转交内核，把真实分配推迟到「真要用那一刻」就水到渠成。
  - mechanism: 页置换靠 [[Clock]] 近似而不是真 [[LRU]]：用硬件顺手标的访问位加表针转圈，代替高成本全局排序
    problem: 踢谁出去的判断卡在缺页热路径上，必须快到可以忽略；况且硬件只顺手在页表项记了一位「最近碰没碰过」，根本没有每次访存的时间戳。
    choice: 采用 Clock 或多代 LRU 这类定期扫一圈的近似算法，访问位为 1 就清零饶一次、为 0 就淘汰；放弃精确 LRU，因为每次读写内存都去改一条全局链表，维护成本和锁争抢早把访存本身拖垮了。
    tradeoff: 近似法偶尔会看走眼踢掉很快又要用的页，让进程多付几次主要缺页；但换来的是日常读写内存零额外开销、置换路径在高负载下也跑得动。
    root: 程序的时间局部性摆在那里——刚摸过的页马上还会再摸，只要粗略筛出「这一圈没人碰」的页就够用了，没必要花大代价排精确名次。
  - mechanism: 允许内存超额承诺（overcommit）：先答应大家多要，真不够再用 [[OOM]] killer 兜底
    problem: 绝大多数进程习惯按峰值预留、平时只用零头；如果申请时必须按真实物理内存足额扣死，半台机器的内存都要空转在「备着但永远不写」的状态里。
    choice: 平时只记账不扣实体，真到全机一起写爆时才由 OOM killer 杀进程救场；不做严格预留，因为严格预留会逼得申请频频失败，程序只好自己囤大内存池，全机利用率反而更糟。
    tradeoff: 代价是一旦超卖过头、兑现撞车，就必须挑一个大户进程当场杀掉保命；所以生产服务一定要拿 [[cgroup]] 设死内存上限，别把兜底权完全交给随机打分。
    root: 和航司超售机票、运营商超卖带宽完全是一个算术逻辑：所有独立客户在同一刻把所有承诺额度写满的概率极低，统计规律让系统平时能多塞进好几倍业务。
quiz:
  - q: 缺页异常一定是程序出错吗？
    options:
      - 是的，立刻段错误
      - 不是，按需调页、COW、栈增长都靠缺页正常完成
      - 只有写代码时才会
      - 是内核 bug
    answer: 1
    explain: 缺页是机制而非错误；只有地址确实非法时才发 SIGSEGV。
  - q: mmap 一个 40 GB 权重文件后立刻能运行，靠的是？
    options:
      - 文件已全读进内存
      - 只建映射，真正读盘由第一次访问时的缺页触发
      - 权重被压缩了
      - GPU 直接读文件
    answer: 1
    explain: 映射 ≠ 加载，缺页时按页从文件调入页缓存。
  - q: overcommit 的风险是什么？
    options:
      - 没有风险
      - 真用超了物理内存+交换区时 OOM Killer 会杀掉进程
      - 程序变慢
      - 文件损坏
    answer: 1
    explain: 承诺时不预留，真超限就由 OOM Killer 按策略回收进程。
