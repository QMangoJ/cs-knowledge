          label: 程序
        - lane: kernel
          id: k
          label: 内核
          highlight: true
        - lane: mem
          id: r
          label: 物理内存
      messages: []
    log:
      - mode: 内核态
        event: 确认地址合法，只是尚未分配
  - id: fill
    title: 补上这一页，并重新执行
    tldr: 内核分一页内存填进页表，程序重新执行刚才那条指令。
    body: |-
      判定合法后，内核按页面类型补页：匿名页就拿一页空闲内存清零后映射过去（清零是安全要求，不能把别的进程用过的数据漏给新主人）；文件页就从页缓存或磁盘把那一页读进来；被换出的页则从交换区读回。补好页表项之后，内核返回用户态，CPU 重新执行刚才出错的那条指令，这次翻译成功，程序完全不知道中间发生了什么。

      按代价分两类：无需磁盘 I/O 就能解决的（补映射、分配清零页、COW 复制、页已在页缓存里）叫次要缺页（minor fault）；必须去磁盘或交换区读的叫主要缺页（major fault）。两者差几个数量级，所以分析性能时要分开看：刚启动的进程第一次碰堆内存，产生的几乎全是次要缺页，这是正常冷启动成本；一个跑了很久的服务主要缺页持续上涨，才说明它的工作集已经被挤出了内存。
    derivation: original
    sources:
      - ref: ostep
        locator: Beyond Physical Memory 相关章节
        claim: 缺页处理分配或读回页面后重新执行指令
        status: verified
