steps:
  - id: why-lazy
    title: 为什么不一次分配好
    tldr: 程序申请的内存，很多根本用不到，提前分配是浪费。
    body: |-
      程序常常 malloc 一大块「备用」，实际只用一小部分。走个例子：程序 malloc 了 1 GB，最后真正写入的只有开头十几 MB；若申请时就把 1 GB 物理页全给它，剩下近 1 GB 会被一个还没兑现的承诺长期占住，其他进程只能去挤页缓存甚至用交换区。

      Linux 于是只在账本（虚拟内存区域 VMA）上记下「这段地址归你了」，暂时不给真实内存，第一次真正访问时再经缺页补上——和前端图片懒加载一样：滚动到了再加载，看不到的就不花流量。代价是第一次访问要多付一次缺页处理，省下的是整段未用内存的机会成本。要纠正一个常见误解：malloc 成功不等于内存到手，它只拿到了一段地址空间的使用权，物理页一张都还没有。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: malloc(3) NOTES、mmap(2)
        url: https://man7.org/linux/man-pages/man3/malloc.3.html
        claim: 大块分配通过 mmap 建立映射，物理页在访问时才分配
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: procs
          id: p
          label: 程序
          highlight: true
        - lane: kernel
          id: k
          label: 内核
        - lane: mem
          id: r
          label: 物理内存
      messages:
        - id: m-why-lazy
          from: p
          to: k
          label: malloc 一大块内存
          active: true
    log:
      - mode: 用户态
        event: 内核只记账，不分配真实内存
    points:
      - 程序申请的内存，很多根本用不到，提前分配是浪费。
  - id: fault
    title: 第一次访问：触发缺页异常
    tldr: 程序第一次写这块内存，发现这一页还没映射，硬件陷入内核。
    body: |-
      程序第一次读写这块内存时，地址翻译（查 TLB 与页表）发现这一页还没有对应的物理页框，页表项是空的。硬件（MMU）不会自己去分配内存，也不会直接把程序杀掉，而是立刻停住当前这条指令、保存现场并陷入内核，同时把出错的虚拟地址放进专门的寄存器（x86-64 上是 CR2），错误码里还写明这次访问是读还是写、地址是根本不存在还是权限不对。内核的缺页处理入口由此拿到全部线索，再决定怎么补救。

      这次异常不代表程序有错，它是内核和硬件约好的信号：异常把「页面还没准备好」变成了软件可编程的钩子——懒分配、写时复制、文件映射、栈增长全都挂在这个钩子上，没有它，任何按需机制都无从谈起。还有一个前提：出错的指令要么整体重来、要么整体没发生，程序看到的内存状态始终自洽，内核才敢在异常里做复杂处理。
    derivation: original
    sources:
      - ref: ostep
        locator: "Beyond Physical Memory: Mechanisms 一章"
        claim: 访问未在内存中的页触发缺页异常
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: procs
          id: p
          label: 程序
        - lane: kernel
          id: k
          label: 内核
          highlight: true
        - lane: mem
          id: r
          label: 物理内存
      messages:
        - id: m-fault
          from: p
          to: k
          label: 缺页！陷入内核
