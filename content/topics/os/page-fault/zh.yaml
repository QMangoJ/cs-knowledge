steps:
- id: why-lazy
  title: 为什么不一次分配好
  tldr: 程序申请的内存，很多根本用不到，提前分配是浪费。
  body: '程序常常 malloc 一大块“备用”，实际只用一小部分。

    Linux 于是只在账本上记下“这段地址归你了”，暂时不给真实内存。

    这和前端图片懒加载一样：滚动到了再加载，看不到的就不花流量。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: malloc(3) NOTES、mmap(2)
    url: https://man7.org/linux/man-pages/man3/malloc.3.html
    claim: 大块分配通过 mmap 建立映射，物理页在访问时才分配
    status: unverified
    note: 按 Daniel 决定不核对出处
  canvas:
    kind: swimlane
    actors:
    - lane: procs
      id: p
      label: 程序
      highlight: true
    - lane: kernel
      id: k
      label: 内核
    - lane: mem
      id: r
      label: 物理内存
    messages:
    - id: m-why-lazy
      from: p
      to: k
      label: malloc 一大块内存
      active: true
  log:
  - mode: 用户态
    event: 内核只记账，不分配真实内存
  points:
  - 程序申请的内存，很多根本用不到，提前分配是浪费。
- id: fault
  title: 第一次访问：触发缺页异常
  tldr: 程序第一次写这块内存，发现这一页还没映射，硬件陷入内核。
  body: '地址翻译时发现这一页还没有对应的物理内存。

    硬件不会直接报错，而是陷入内核，告诉它哪个地址出了问题。

    这次异常不代表程序有错，它是内核和硬件约好的信号。'
  derivation: original
  sources:
  - ref: ostep
    locator: 'Beyond Physical Memory: Mechanisms 一章'
    claim: 访问未在内存中的页触发缺页异常
    status: unverified
    note: 按 Daniel 决定不核对出处
  canvas:
    kind: swimlane
    actors:
    - lane: procs
      id: p
      label: 程序
    - lane: kernel
      id: k
      label: 内核
      highlight: true
    - lane: mem
      id: r
      label: 物理内存
    messages:
    - id: m-fault
      from: p
      to: k
      label: 缺页！陷入内核
      active: true
  log:
  - mode: 进入内核态
    event: 访问未映射的页，陷入内核
  code:
    lang: text
    code: '缺页处理（内核视角）：

      1. 查 VMA：地址不合法 → SIGSEGV

      2. 文件页 → 从页缓存/磁盘读入该页

      3. 匿名页 → 分配零页

      4. COW 页 → 复制一份再写

      填好页表后重新执行出错的那条指令'
    note: 流程伪代码
- id: decide
  title: 内核判断：合法还是越界
  tldr: 内核查账本，看这个地址是不是程序有权使用的。
  body: '地址在程序申请过的范围内，说明只是还没分配，内核来补上。

    地址根本不属于程序，那才是真错误，内核发信号终止它，也就是常见的“段错误”（Segmentation fault）。

    同一种异常，内核根据账本给出完全不同的处理。'
  derivation: original
  sources:
  - ref: ostep
    locator: 'Beyond Physical Memory: Mechanisms 一章'
    claim: 操作系统区分合法缺页与非法访问
    status: unverified
    note: 按 Daniel 决定不核对出处
  canvas:
    kind: swimlane
    actors:
    - lane: procs
      id: p
      label: 程序
    - lane: kernel
      id: k
      label: 内核
      highlight: true
    - lane: mem
      id: r
      label: 物理内存
    messages: []
  log:
  - mode: 内核态
    event: 确认地址合法，只是尚未分配
- id: fill
  title: 补上这一页，并重新执行
  tldr: 内核分一页内存填进页表，程序重新执行刚才那条指令。
  body: '内核拿一页空闲内存清零后映射过去；如果内容要从磁盘读（比如程序文件或被换出的页），就会慢很多。

    只改页表、不读磁盘的叫“次要缺页”，要读磁盘的叫“主要缺页”。

    内核返回后，程序重做那次访问，这次成功，完全不知道中间发生了什么。'
  derivation: original
  sources:
  - ref: ostep
    locator: Beyond Physical Memory 相关章节
    claim: 缺页处理分配或读回页面后重新执行指令
    status: unverified
    note: 按 Daniel 决定不核对出处
  canvas:
    kind: swimlane
    actors:
    - lane: procs
      id: p
      label: 程序
    - lane: kernel
      id: k
      label: 内核
    - lane: mem
      id: r
      label: 物理内存
      highlight: true
    messages:
    - id: m-fill
      from: k
      to: r
      label: 分配一页并映射
      active: true
  log:
  - mode: 内核态 → 用户态
    event: 新页映射进页表，重试成功
- id: cow-mmap
  title: 缺页的其他用途：写时复制和文件映射
  tldr: 缺页不只用来按需分配，内核还靠它实现写时复制和按需读文件。
  body: 'fork 之后父子共享只读页，子进程一写就触发缺页，内核复制出一份私有页，再让它重做写入。

    mmap 映射一个文件，也不是立刻读进来，而是访问到哪一页才从磁盘读哪一页；程序本身的代码也是这样按需加载的。

    所以“缺页”是内核偷懒和省内存的通用开关，不是错误。


    工程注记：用 mmap 加载 70B 模型权重（约 140 GB，FP16）时，多个推理进程可以共享同一批文件页（页缓存只有一份）；若用 read 全量读入，每个进程各占一份私有内存。vLLM 与 llama.cpp 的 mmap 模式省的正是这笔账。'
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: malloc(3) NOTES、mmap(2)
    url: https://man7.org/linux/man-pages/man3/malloc.3.html
    claim: 缺页不只用来按需分配，内核还靠它实现写时复制和按需读文件。
    status: unverified
    note: 按 Daniel 决定不核对出处
  canvas:
    kind: swimlane
    actors:
    - lane: procs
      id: p
      label: 程序
    - lane: kernel
      id: k
      label: 内核
      highlight: true
    - lane: mem
      id: r
      label: 物理内存
    messages:
    - id: m-cow-mmap
      from: k
      to: r
      label: 复制出私有页 / 从文件读入
