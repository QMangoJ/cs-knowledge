  - id: overcommit
    title: 超卖的代价：OOM killer
    tldr: 因为是按需分配，Linux 敢“超卖”内存；真不够时只能杀进程。
    body: |-
      既然大部分申请的内存用不到，Linux 默认允许大家申请的总量超过实际内存，这叫超额承诺（overcommit）。万一大家真的都来用，缺页时找不到空闲内存，内核就启动 OOM killer，按 oom_score（主要看内存占用）挑一个进程杀掉。所以服务「莫名其妙被杀」，常常要去 dmesg 里找 OOM 记录。

      代价的量级感：次要缺页约微秒级，主要缺页去 SSD 读约几十到上百微秒、去机械盘是毫秒级。生产上的应对是把「真不够时杀谁」变成业务自己定的策略：用 cgroup 内存上限圈住单个服务，或给关键进程调低 oom_score_adj，免得被杀的恰好是最重要的那个。
    derivation: original
    sources:
      - ref: linux-kernel-docs
        locator: mm/overcommit-accounting
        url: https://docs.kernel.org/mm/overcommit-accounting.html
        claim: Linux 的内存超额承诺策略
        status: verified
