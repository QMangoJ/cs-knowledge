  log:
  - mode: 用户态
    event: 内核只记账，不分配真实内存
  points:
  - 程序申请的内存，很多根本用不到，提前分配是浪费。
- id: fault
  title: 第一次访问：触发缺页异常
  tldr: 程序第一次写这块内存，发现这一页还没映射，硬件陷入内核。
  body: '程序第一次读写这块内存时，地址翻译（查 TLB 与页表）发现这一页还没有对应的物理页框，页表项是空的。

    硬件（MMU）不会自己去分配内存，也不会直接把程序杀掉，而是立刻停住当前这条指令、保存现场并陷入内核，同时把出错的虚拟地址放进专门的寄存器（x86-64 上是 CR2），错误码里还写明这次访问是读还是写、地址是根本不存在还是权限不对。内核的缺页处理入口由此拿到全部线索，再决定怎么补救。

    这次异常不代表程序有错，它是内核和硬件约好的信号：异常把“页面还没准备好”变成了软件可编程的钩子，懒分配、写时复制、文件映射、栈增长全都挂在这个钩子上。没有这个钩子，任何按需机制都无从谈起。还要注意：这次陷入不会让指令执行一半就跑掉，出错的指令要么整体重来、要么整体没发生，程序看到的内存状态始终是自洽的，这也是内核敢在异常里做复杂处理的前提。'
  derivation: original
  sources:
  - ref: ostep
    locator: 'Beyond Physical Memory: Mechanisms 一章'
    claim: 访问未在内存中的页触发缺页异常
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
