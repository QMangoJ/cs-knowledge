- id: page-fault
  title: 缺页的完整一生：从出错地址到指令重执行
  tldr: 硬件把出错地址放进 CR2，内核查合法性、找来源、装页填表，最后让那条指令原样再跑一次。
  body: '把一次缺页处理完整走一遍：CPU 访问一个不在内存的页，硬件保存出错地址（x86 放在 CR2 寄存器）与错误码（区分这次是读还是写、地址不存在还是权限问题），陷入内核的缺页处理函数。内核先查这个地址是否落在进程的合法映射区域内：不合法，直接发 SIGSEGV；合法，再看页该从哪来——文件映射去读文件、匿名页被换出过就去 swap 读回、从没用过的匿名页直接给一张零页。页装好、页表填上（若是写触发的写时复制则复制一份），处理结束，CPU 重新执行那条出错的指令，这次顺利通过，整个过程对程序完全透明，只表现为这次访存慢了些。

    统计口径上要分清主缺页与次缺页：次缺页是页其实还在内存里（比如在页缓存中）只需补一个映射，便宜；主缺页要真正读磁盘，贵几个数量级。ps 里的 majflt 一栏看的就是主缺页：程序启动时它涨是冷加载，稳态还持续涨，就是内存不够的信号。'
  derivation: original
  sources:
