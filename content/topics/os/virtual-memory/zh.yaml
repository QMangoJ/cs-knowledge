  - id: working-set
    title: 工作集与抖动：全机一起慢死是怎么发生的
    tldr: 最后把全机的账合起来看：单个进程需要多少内存，不看它申请了多少，要看它一段时间内反复用到的那组页有多大。这一步看当所有进程的这组页加起来超过物理内存时，换进换出怎样互相挤兑、磁盘满载而处理器空等，以及为什么最后的兜底只能是牺牲一个进程、保住全机。
    body: |-
      最后一块拼图是工作集与抖动：一个进程在一段时间内实际反复触碰的页集合叫工作集，它才是这个进程真正需要的内存。当所有活跃进程的工作集之和超过物理内存，内核刚把 A 的页换出、A 立刻缺页要换回，换回时又把 B 的页挤出去，全机陷入抖动：磁盘满载、CPU 却大多在等页，吞吐崩塌而利用率数字还很好看。

      内核的缓解是按工作集做全局调控，实在无解时由 OOM killer 选一个进程杀掉换取全机存活——这是有意的取舍：牺牲一个，好过全部一起慢死。云服务器上内存超卖、容器内存上限设得太小，本质都是把工作集之和推过了物理上限，症状与解法和单机完全一致。
    derivation: original
    sources:
