  - id: result
    title: 拿到数据，以及翻译失败时
    tldr: 前面所有访问都默认翻译能成功，这一步看成功时程序的实际感受：它什么都察觉不到，只觉得这次访问有快有慢。这一步把三档延迟摆在一起——命中缓存、走一遍页表、缺页去读磁盘，差的是几个数量级——提醒写性能敏感代码时不能把每次访存当成同样的成本。
    body: |-
      翻译完成后，CPU 按物理地址读出变量，程序毫无察觉。如果页表说这一页还没有、或者没有权限，硬件触发「缺页异常」，陷入内核处理——下一节先看它的大致流程，缺页一课再走完整一生。

      程序对这一切的感知只有时间。拿同一个变量的三次访问把阶梯走一遍：第一次访问时页还没装入，触发缺页从现行 NVMe SSD 读回这一页，约 35–55 微秒（老式 SATA 约 100 微秒，机械盘则要 10 毫秒量级）；页装好后第二次访问，翻译还没进 TLB，要走一遍 4 级页表，最坏多出 4 次访存，在内存本身约 100 纳秒一次的基础上多花几百纳秒；第三次访问时翻译已经缓存在 TLB 里，直接命中，这次访存就按内存本身的速度完成，约 100 纳秒量级。同一个变量，三次访问的延迟可以差几百倍。写性能敏感代码时，这种阶梯要心里有数，不能假设每次访存都是同样的成本。
