  - id: swap
    title: 内存不够时：把冷页换出到磁盘
    tldr: 物理内存装不下时，内核把好久不用的冷页写到磁盘 [[swap]] 区（或丢掉可重读的文件页）腾地方；swap 里有数据不代表内存告急，关掉它也不会加速，只会让内存耗尽时直接杀进程。
    body: |-
      虚拟内存让「所有程序以为自己拥有的内存」远远大于机器插着的内存条。快装满时，内核挑最近用得最少的那批冷页写到磁盘交换区（[[swap]]）——如果是干净的文件页干脆直接扔掉，等下回用到再从原文件读——然后在页表里打个「不在内存」的记号。拿介质把延迟账算清：内存访存约 100 纳秒；现行 NVMe SSD 随机读一页中位数约 35–55 微秒，约是内存的 350–550 倍（约 2.5 个数量级；老式 SATA SSD 约 100 微秒，接近 1000 倍）；机械硬盘读一页更是 10 毫秒量级，约慢十万倍。只要换页稍微频繁一点，机器立刻变得卡顿不堪。

      这里顺手拆掉两个常见误会。第一，看到 swap 用了几个 GB 不等于系统快爆了：内核本来就会悄悄把长期睡着的冷页挪去 swap，把宝贵内存让给热文件缓存，这是健康的腾挪；真正要紧盯的是每秒换入换出次数是不是持续飙高。第二，彻底关掉 swap 并不会让机器变快，只会抽走最后一层缓冲垫——内存一旦真撑满，无路可退的内核只能直接派出 [[OOM]] killer 杀进程保命。
    derivation: original
    sources:
