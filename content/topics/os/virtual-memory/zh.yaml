  - id: share-cow
    title: 共享与写时复制：多个页表指到同一块物理页
    tldr: 只要让不同进程的页表项指到同一块物理页，一份代码或数据就能多方共用；再顺手标成只读、等谁真写入才现复制一页，这就是 fork 飞快的写时复制（[[COW]]）。
    body: |-
      每个进程都要用标准库 libc，要是跑一百个进程就在内存条里存一百份相同的代码，太浪费了。有了页表这层中间人，内存条里只放一份只读的 libc 物理页，一百个进程的页表把各自对应的虚拟页号统统指过去就行。两个进程之间做共享内存通信也是一个路数：两边页表指到同一组物理页，这边改了那边立即可见。

      fork 创建子进程之所以飞快，玩的也是这招的变体——写时复制（[[COW]]）。fork 那一瞬间内核一页都不复制，只让父子进程的页表指向同一批物理页，顺手把可写页全标成只读；一旦父进程或子进程往哪一页写数据，硬件按只读权限触发异常，内核这才把被写的那 1 页复制出一份私有副本给写方，剩下的上千页继续安安静静共用。

      共享和不共享的界限划得很死：共享库代码页只读共享、谁都改不动；各自的数据段、堆和栈永远互不干扰。用 mmap 映射同一个文件时，传 [[MAP_SHARED]] 表示大家改了互相看见且会写回文件，传 [[MAP_PRIVATE]] 则是各自领一套写时复制快照——改了只自己看见，不碰原文件，一个标志位之差行为完全两样。
    derivation: original
    sources:
