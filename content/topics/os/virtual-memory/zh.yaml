- id: working-set
  title: 工作集与抖动：全机一起慢死是怎么发生的
  tldr: 各进程工作集之和超过物理内存时，换入换出互相挤兑，磁盘满载而 CPU 在等页。
  body: '最后一块拼图是工作集与抖动：一个进程在一段时间窗口内实际反复触碰的页集合叫工作集，它才是这个进程真正需要的内存。当所有活跃进程的工作集之和超过物理内存，内核刚把 A 的页换出、A 立刻缺页要换回，换回时又把 B 的页挤出去，全机就陷入抖动：磁盘满载、CPU 却大多在等页，吞吐崩塌而利用率数字还很好看。

    判定走例：vmstat 里 si 与 so（换入换出速率）持续非零、主缺页持续增长、而 CPU 的用户态占比很低，这组合就是抖动而不是程序在努力计算。内核的缓解手段是按工作集做全局调控，实在无解时由 OOM killer 选一个进程杀掉换取全机存活——这是有意的取舍：牺牲一个，好过全部一起慢死。云服务器上内存超卖、容器内存上限设得太小，本质都是把工作集之和推过了物理上限，症状与解法与单机完全一致。'
  derivation: original
  sources:
  - ref: ostep
