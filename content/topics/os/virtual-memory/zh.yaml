subject: os
slug: virtual-memory
order: 5
status: published
license: CC-BY-4.0
title: 虚拟内存：程序看到的地址是怎么翻译的
summary: 每个程序都以为自己独占从零开始的一大片连续内存，其实它手里拿的只是虚拟门牌号，每次读写都要由硬件照着页表翻译成内存条上的真实位置。页表如果直接铺成一张大数组会吃掉 512 GB，所以现实里改成 4 级树状结构、用到哪段才建哪段；代价是每次访存查 4 级表太慢，必须靠硬件里的翻译缓存把常用映射拦在门口。这套翻译层还顺手把进程隔离、权限检查、共享库和写时复制一并扛了下来。
premise: 程序里读一个变量时，用到的地址往往像 0x7ffd1234abcd 这样一串十六进制数，哪怕两个同时运行的程序出现了完全相同的地址，读出来的却各是各的数据，内存条上甚至根本没有这么大的编号。这串「门牌号」到底是怎么对应到内存条真实位置的，中间又是谁在翻译和拦住越界访问？
position: 前面进程管理板块让多个程序轮流上场，每个程序还都以为自己独享整片内存，这份错觉正是由内存管理板块的这一课兑现的。本课跟着程序的一次变量读取，把虚拟地址怎样按页切开、怎样避开 512 GB 大数组改成四级索引，以及翻译缓存为什么是分页能用起来的前提一步步讲透。学完后你能对着 /proc/self/maps 说清代码、堆和栈怎么摆放，也能解释为什么两个程序用着相同的地址数字却互不干扰。
bridge:
  prev: 上一课提到同进程的线程共用同一套页表，切人时连地址翻译规则都不必换；这一课就把这套共享的页表拆开来看，弄清一个虚拟地址究竟要过几道关才能落到物理页框上。
  next: 如果查到页表最后发现那一项还是空的，翻译就会停在这里；程序刚申请到一大块内存、第一次往里写数据时，内核怎样接住这个信号把缺失的页补上，下一课接着讲。
overview:
  - key: 一句话总结
    value: 程序里写的全都是虚拟地址，硬件在每次读写时照着页表把它翻译成内存条上的物理地址。程序以为自己独占连续大内存，真实住在哪几个散落的格子全由内核安排。
  - key: 好处
    value: 隔离（A 程序指针写歪也碰不到 B 的数据）、布局统一（每个程序都按同一张地图摆代码、堆、栈）、物理可零散（虚拟地址连成一片，背后可以分散在各处物理页框里）。
  - key: 页
    value: 内存被切成固定大小的格子叫页，Linux 在 x86-64 上通常一页 4KB。翻译和权限管理都以页为单位；另外还有 2MB 大页，一格罩住更大一片内存，少占缓存位子。
  - key: 页表
    value: 页表记录哪一页虚拟内存对应哪一页物理内存，每个进程各有一套、由内核掌管。切换进程必须换页表，这也是进程切换比线程切换贵的原因之一。
  - key: TLB
    value: 专门缓存最近用过的翻译结果的小硬件。查一次 4 级页表最坏要多读 4 次内存，靠 TLB 拦住绝大多数查询，分页才不至于把电脑拖慢五倍。
  - key: 权限位
    value: 页表里顺手记着每页能不能读、能不能写、能不能当代码执行。程序一旦往只读页里写入，硬件当场触发异常，内核直接把程序拦停。
  - key: 多级页表
    value: x86-64 通常用 4 级树状页表。如果铺成一张大数组光表本身就要 512 GB，改成 4 级后没用到的地址空间连下级表都不建，一个小进程只要几十 KB。
  - key: 写时复制
    value: fork 创建子进程时，父子先共用同一批标为只读的物理页，一页都不用急着拷贝；等谁先往里写那一刻，内核才把被改的那一页复制一份给它。
  - key: swap
    value: 物理内存紧张时，内核把好久没用的冷页挪到磁盘 [[swap]] 区腾位置。如果换进换出太频繁，程序全在等磁盘，就叫抖动，整台机器会卡成幻灯片。
