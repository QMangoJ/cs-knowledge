steps:
  - id: why-vm
    title: 为什么不让程序直接用真实地址
    tldr: 让程序直接用内存条上的真实地址，一个野指针就能改坏别的程序甚至内核；虚拟内存给每个进程发一套独立门牌号，靠硬件在每次访问时当场翻译并把关。
    body: |-
      想象两个程序同时跑在电脑上：进程 A 和进程 B 的代码里偏偏都出现了同一个地址 0x401000。如果程序直接拿物理内存条的编号来读写，两边不仅会抢同一块地方、互相踩烂对方的数据，只要一个程序写出越界指针，就能顺手改掉内核代码，整台机器毫无安全性可言。

      虚拟内存的办法是给每个进程发一本专属的「假地址手册」（虚拟地址空间），每次读写都经由硬件里的内存管理单元（[[MMU]]）照着进程自己的页表翻译成物理页。进程 A 的 0x401000 翻出来落到物理页 X，存的是 A 的代码；进程 B 的 0x401000 经由 B 的页表落到物理页 Y，存的是 B 的东西，谁也摸不到谁的屋子。等一下，为什么不能靠编程规范或编译器检查防越界？因为 C 语言一个野指针就能指到天边去，没有硬件在每次访存时当场翻译核查，任何软件约定都会被一个 bug 击穿。

      这层假地址还白捡了一个大便宜：每个程序都能假定自己按同一张标准地图摆放——代码从低位固定地址起步、堆往上长、栈从顶部往下长。编译器和链接器不用操心内存条上此刻哪块有空位，哪怕物理页散落在内存条各处，在程序眼里依然连成一条整齐的大道。
    derivation: original
    sources:
      - ref: ostep
        locator: Address Spaces 一章
        claim: 地址空间为每个进程提供隔离的内存视图
        status: verified
