  - id: share-cow
    title: 共享与写时复制
    tldr: 同一块物理内存可以映射给多个进程，省内存，也让 fork 变快。
    body: |-
      每个进程都用 libc，但内存里只需要一份它的代码：各进程的页表都指向同一组物理页即可。进程间共享内存（mmap 共享映射）也是同一个机制——两个页表指向同一组物理页，一边写另一边能看见。

      fork 的写时复制（COW）是它的变体：父子先共享所有页并标为只读，谁先写就触发缺页异常，内核这时才复制那一页给写方，其余页继续共享。共享的边界要划清：共享库的代码页只读共享、谁都不能改；每个进程的数据段、堆、栈永远私有。mmap 同一个文件时，MAP_SHARED 是互相可见的共享，MAP_PRIVATE 则是私有快照——改了不回写文件、别人也看不见；一个标志之差，语义完全不同。
    derivation: original
    sources:
