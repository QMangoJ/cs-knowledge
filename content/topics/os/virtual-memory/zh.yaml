  - id: result
    title: 拿到数据，以及三次读取差出几百倍延迟
    tldr: 程序读同一个变量时表面上风平浪静，底层耗时却能差出好几百倍——从冷缺页读 SSD（35–55 微秒），到漏掉 [[TLB]] 走 4 级表（几百纳秒），再到命中 TLB（约 100 纳秒）。
    body: |-
      只要页表里写着物理页号、权限又对得上，CPU 就按翻译出的物理地址把变量读进寄存器，程序完全察觉不到中间拐了这么一道弯。要是一查页表发现这一页还没装进来或者权限不够，硬件立刻拉响「[[缺页异常]]」把现场交给内核（下一步先看轮廓，下一课拆全流程）。

      程序对这套底层机关唯一的体感，就是耗时忽快忽慢。连续三次读取同一个变量，把延迟阶梯走一遍：第一次访问时这一页还没进内存，触发缺页从现行 NVMe SSD 读盘，耗掉约 35–55 微秒（老式 SATA SSD 约 100 微秒，机械硬盘更是 10 毫秒量级）；第二次访问时页已经在内存了，但翻译还没进 TLB，MMU 得跑完 4 级页表，在内存本身的约 100 纳秒上再多耗几百纳秒；第三次访问直接命中 TLB，整次读取只按内存本色跑完，约 100 纳秒。同样一行读变量的代码，三次速度差出几百倍，写高性能程序绝对不能把每次内存访问当成等成本。
