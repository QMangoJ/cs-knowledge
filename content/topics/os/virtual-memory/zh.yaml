title: 虚拟内存：程序看到的地址是怎么翻译的
summary: 每个程序都以为自己独占一大片内存，其实背后有一层翻译。
premise: 以 Linux 上一个程序读取自己内存中的一个变量为例，只讲概念。
position: 轮换上场的每个进程都宣称独占一大片地址空间，这份幻觉要靠页表翻译兑现，故事由此转入内存管理板块。本课把虚拟地址拆成多级索引与页内偏移，并讲透 TLB 命中为何是分页能用的前提。对着 /proc/self/maps 逐行指出代码、堆与栈，并解释两进程同址却存着不同数据，便是本课的验收方式。
bridge:
  prev: 线程与调度那课里，同进程的线程切换时连页表都不必更换，因为它们共用同一套翻译规则；本课便钻进这套规则本身：CPU 拿着虚拟地址时，究竟查了哪几级表才落到物理页框？
  next: 页表项若还是空的，翻译便当场卡住，程序第一次触碰 malloc 来的大块内存时，内核要靠哪种异常把缺失的页补上？
overview:
  - key: 一句话总结
    value: 程序用虚拟地址，硬件按页表翻译成物理地址
  - key: 好处
    value: 隔离、布局统一、物理内存可以不连续
  - key: 页
    value: Linux 在 x86-64 上通常以 4KB 为一页；大页（如 2MB）用来减少翻译开销
  - key: 页表
    value: 每个进程一套，由内核维护
  - key: TLB
    value: 最近翻译结果的缓存
  - key: 权限位
    value: 每页记着可读、可写、可执行、用户可访问，违反即触发异常
  - key: 多级页表
    value: x86-64 通常 4 级，只为用到的区域建表
  - key: 写时复制
    value: fork 后共享只读页，写时才复制
  - key: swap
    value: 不常用的页换到磁盘；频繁换页叫抖动
