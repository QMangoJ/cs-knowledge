  - id: addr-lab
    title: 动手：把一个虚拟地址拆成 4 级索引
    tldr: 48 位地址 0x7ffd1234abcd 从左到右一刀切开，正好对应四段 9 位页表下标 [255, 500, 145, 330] 和最后 12 位的页内偏移 0xbcd；在实验台点开其他用例，能一眼看出相邻字节和跨页地址哪几位在跳变。
    body: |-
      拿前面刚推出来的切法（12 + 9 × 4 = 48 位），直接在实验台拆一个真实程序里常见的栈地址 0x7ffd1234abcd。为什么偏偏是 12 位和 9 位？页大小 4 KB = 2^12 字节决定了低 12 位是页内偏移，翻译前后原封不动；每张表正好塞满一页（4096 ÷ 8 字节 = 512 项 = 2^9），所以每一级都用 9 位当下标。

      按比特位切开就是：第 47–39 位 = 255，查第 1 级（[[PML4]]）；第 38–30 位 = 500，查第 2 级；第 29–21 位 = 145，查第 3 级；第 20–12 位 = 330，查第 4 级并拿到物理页框号；最低 12 位 = 0xbcd，当页内偏移。翻译开始时，MMU 先去读 [[CR3]] 寄存器拿到当前进程第 1 级根表的物理地址，再顺着这 4 个下标走完 4 级表，把物理页号和 0xbcd 拼在一起就是最终地址。你还可以切到右边实验台的其他几个地址对比看看：把末尾加 1 变成 0x7ffd1234abce，四级下标纹丝不动；把地址加一页变成 0x7ffd1234bbcd，只有第 4 级下标从 330 跳到 331。
    derivation: original
    sources:
