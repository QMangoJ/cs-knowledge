  - id: page-table
    title: 按页查页表：把虚拟页号换成物理页框号
    tldr: 翻译不是按字节登记，而是以 4 KB 的「页」为单位：虚拟地址低 12 位的页内偏移原样照抄，高位虚拟页号拿去查页表换出物理页号，权限不对也在同一步当场拦下。
    body: |-
      如果给每个字节都建一条翻译记录，页表会比内存本身还大好几倍。所以硬件和内核把内存统一切成固定大小的方块——在 x86-64 上通常是 4 KB（4096 字节）一页。页表只记「第几号虚拟页住进第几号物理页框」，至于数据在这一页里面的具体偏距（页内偏移），翻译前后一个比特都不用改。每个进程各自背一套页表，由内核全权管理，普通程序连改一个字节的权力都没有；切换进程时，操作系统只要把页表根地址换掉就行。

      拿一个具体地址把翻译走一遍：假设程序要读虚拟地址 0x7f3a2b405123。因为 4 KB = 2^12 字节，低 12 位 0x123 就是页内偏移，直接原样留着；高位的 0x7f3a2b405 是虚拟页号，MMU 拿着它去查当前进程的页表，假如查出这一页住在物理页号 0x582a1，把两者一拼，物理地址就是 0x582a1123。

      别忘了权限和状态位就挤在同一条页表项里：翻译的同时，硬件顺眼瞄一下读、写、执行和用户态权限位，要是往只读页里写数据，当场拒绝并拉响异常，压根不会摸到物理内存条。表项里还藏着两位由硬件顺手打钩的情报——「最近访问过」和「被改写过」，后面缺页置换挑谁淘汰、脏页要不要写回磁盘，靠的正是这两位。
    derivation: original
    sources:
