  - id: huge-pages
    title: 大页的细账：覆盖涨 512 倍，为什么不能全开
    tldr: 把 4 KB 页换成 2 MB 大页，同样多的 [[TLB]] 条目能罩住的内存暴涨 512 倍（6 MB 变 3 GB）；但它必须找到整块连续物理内存，写时复制也要整块搬 2 MB，只适合大块、只读为主的数据。
    body: |-
      算一笔覆盖上限的细账：假设一块 CPU 的 [[TLB]] 有 1536 条缓存（量级示意）。用标准 4 KB 页时，全部条目加起来最多罩住 1536 × 4 KB ≈ 6 MB；可大模型权重、数据库缓冲池动辄几十 GB，6 MB 一瞬间就溢出，TLB 命中率直线往下掉。只要把页换成 2 MB 大页，同样 1536 条缓存能罩住的范围立刻暴涨 512 倍，变成约 3 GB——这就是这类大内存服务拼命开启大页的原因。

      等一下，既然大页覆盖涨了 512 倍，干嘛不默认全部打开、取消 4 KB 小页？因为大页背后有三笔实打实的代价。第一，分给大页的物理内存必须是整段连续的 2 MB，服务器跑久了内存七零八落时经常凑不出来；第二，内核的回收、换出和写时复制都按整页算，改其中 1 个字节就得复制整整 2 MB，写密集型服务开了反而会被拖垮；第三，透明大页由内核在后台自动合并拆开，搬动数据时会抖出延迟毛刺，所以低延迟服务常常关掉自动合并、只给明确的大块只读区手动预留。
    derivation: original
    sources:
      - ref: linux-kernel-docs
        locator: admin-guide/mm/transhuge
