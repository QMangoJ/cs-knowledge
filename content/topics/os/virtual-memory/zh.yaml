  - id: huge-pages
    title: 大页的细账：覆盖涨 512 倍，为什么不能全开
    tldr: 覆盖范围不够时，一个办法是把页做大。这一步细算大页的账：2MB 大页把单条缓存的覆盖从 4KB 提到 2MB，同样多的缓存条目能覆盖的范围是原来的 512 倍；但大页要求整段连续的物理内存、回收和复制都按整页算。这一步看清它适合哪类数据，就不会把「全局打开大页」当成免费优化。
    body: |-
      大页的账要算细：假设 [[TLB]] 有 1536 项（量级示意），用 4KB 页覆盖上限约 6MB，用 2MB 页则约 3GB，差 512 倍——这就是大模型权重、数据库缓冲池这类大块连续访问拼命要大页的原因。

      但大页不是免费的：第一，分配要求物理内存里有整段连续的 2MB，系统跑久了碎片化严重时可能凑不出来；第二，内核的回收、换出与写时复制都以整页为粒度，写 1 字节可能复制整整 2MB，写密集场景会反噬；第三，透明大页由内核自动合并与拆分，合并本身要搬数据，某些延迟敏感的服务反而关掉它、改用显式预留。所以大页的正确用法是给大块、只读为主、长期驻留的数据用，而不是全局打开图省事。
    derivation: original
