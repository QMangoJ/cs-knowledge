- id: swap
  title: 内存不够时：换出到磁盘
  tldr: 物理内存不够时，内核可以把不常用的页写到磁盘，腾出空间。
  body: '虚拟内存让“程序以为有的内存”可以大于物理内存。

    内核挑最近不常用的页写到交换区（swap）或丢掉可重新读取的文件页，并在页表里标记“不在内存”；再访问时触发缺页，再读回来。

    换页介质比内存慢约三个数量级（SSD）到五个数量级（机械盘），所以频繁换进换出（抖动）时整台机器会变得非常卡。


    工程注记：一个 48 位虚拟地址空间是 256 TB，单个进程怎么映射都够用；真正稀缺的是物理内存与 TLB 覆盖范围——大页把单条 TLB 覆盖从 4 KB 提到 2 MB，正是给大模型这种大块连续访问准备的。


    再澄清 swap 的两个误解：第一，有 swap 被使用不等于内存不够——内核会主动把几乎不用的冷页提前换出，给文件缓存腾地方，这时 swap 里有数据反而是健康状态。第二，关掉 swap 不会让程序更快，只会让内存耗尽时无路可退、直接由 OOM killer 杀掉进程；抖动真正的解法是减小工作集或加内存，swap 只是把立刻死换成慢慢熬的缓冲垫。


    观测入口很直接：free 命令的 swap 行看用量，vmstat 的 si 与 so 两列看换入换出的速率——用量不为零不值得紧张，速率长期不为零才是警报。'
  derivation: original
  sources:
