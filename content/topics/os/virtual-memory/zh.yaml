- id: multilevel
  title: 多级页表：省下页表本身的空间
  tldr: 地址空间很大但大部分没用，所以页表分层，只为用到的部分建表。
  body: '如果给整个 64 位地址空间建一张平铺的大表，光页表就要占海量内存。

    x86-64 Linux 通常用 4 级页表（新 CPU 可用 5 级）：像目录树一样一级级往下查，没用到的分支整片不建。

    代价是一次翻译要查好几层，这正是下一步 TLB 要解决的问题。


    把省空间算成数字：若用单级页表覆盖 48 位地址空间，共有 2 的 36 次方个页，每项 8 字节，页表要占 512GB——比多数机器的内存还大，显然荒谬。多级结构下，一个只用了几 MB 内存的进程只需根表一页、沿途几张中间表和少量末级表，总共几十 KB 量级，因为没用到的分支在上级表里只是一个不存在的空项。代价也明确：最坏情况每次 TLB 未命中要多走 4 次访存，所以多级页表在逻辑上必须与 TLB 成套出现，单看任何一个都说不通。


    层级为什么恰好是 4 级而不是 2 级或 8 级？级数由地址位数与每级位数相除决定：48 位地址减去 12 位偏移，剩下的 36 位按每级 9 位正好分 4 级。级数太少则单张表太大、装不进一页，级数太多则每次查表要多走几步，4 级是被页大小与地址宽度联立解出来的。'
  derivation: original
  sources:
