steps:
  - id: why-vm
    title: 为什么不让程序直接用真实地址
    tldr: 直接用物理地址，程序之间就能互相读写内存。
    body: |-
      如果程序直接访问物理内存，一个写错的地址就可能破坏别的程序，甚至内核。虚拟内存给每个进程一套自己的地址空间，它只看得见自己那份——就像每个网站有独立的 localStorage，看不到别的网站的数据。

      走个对照例：进程 A 与进程 B 里都出现地址 0x401000，这毫不冲突——A 的这个地址经 A 的页表落到物理页 X，存着 A 的代码；B 的同名地址经 B 的页表落到完全不同的物理页 Y。虚拟地址只是本进程内的门牌号。隔离也不能只靠约定：C 语言一个野指针就能写到任意地址，没有硬件在每次访存时翻译并检查，任何「请勿越界」都会被一个 bug 击穿。

      隔离还附带一个好处：每个进程的地址布局可以完全统一——代码从固定地址开始、栈在顶部、堆向上生长，编译器与链接器按同一张地图生成程序，不必关心它将被装进物理内存的哪个角落。
    derivation: original
    sources:
      - ref: ostep
        locator: Address Spaces 一章
        claim: 地址空间为每个进程提供隔离的内存视图
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
