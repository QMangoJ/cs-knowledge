# 知识优先版草稿。出处仅供参考，按 Daniel 决定不做逐条核对。
id: os/virtual-memory
subject: os
slug: virtual-memory
order: 4
status: published
license: CC-BY-4.0
title: 虚拟内存：程序看到的地址是怎么翻译的
summary: 每个程序都以为自己独占一大片连续内存，其实背后有一层翻译。
premise: 以一个程序读取自己内存中的一个变量为例，只讲概念，不讲具体位数和格式。
overview:
  - key: 一句话总结
    value: 程序用的是虚拟地址，硬件按页表把它翻译成物理地址
  - key: 好处
    value: 隔离（互相看不到）、方便（每个程序地址都从同样的布局开始）、灵活（内存可以不连续）
  - key: 页
    value: 内存按固定大小的块管理，翻译以页为单位
  - key: 页表
    value: 每个进程一张，记录“虚拟页 → 物理页”
  - key: TLB
    value: 最近翻译结果的缓存，让翻译几乎不花时间
visual: swimlane
lanes:
  - id: procs
    label: 程序
  - id: mmu
    label: 地址翻译
  - id: mem
    label: 物理内存
logColumns:
  - key: mode
    label: 当前状态
  - key: event
    label: 发生了什么
steps:
  - id: why-vm
    title: 为什么不让程序直接用真实地址
    tldr: 如果程序直接用物理地址，就能互相读写对方的内存。
    body: |-
      早期系统里，程序直接访问物理内存，一个程序写错地址就可能破坏另一个程序，甚至内核。
      虚拟内存给每个程序一套自己的“假地址”，它只能看见自己的那份。
      就像每个网站有自己独立的 localStorage，看不到别的网站的数据。
    derivation: original
    sources:
      - ref: ostep
        locator: Address Spaces 一章
        claim: 地址空间为每个进程提供隔离的内存视图
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: swimlane
      actors:
        - lane: procs
          id: p
          label: 程序
          highlight: true
        - lane: mmu
          id: m
          label: 地址翻译（MMU）
        - lane: mem
          id: r
          label: 物理内存
      messages: []
    log:
      - mode: 用户态
        event: 程序想读取一个变量
  - id: pages
    title: 按页管理
    tldr: 内存被切成固定大小的“页”，翻译以页为单位进行。
    body: |-
      如果逐个字节记录对应关系，表会大得放不下。
      所以把内存切成一样大小的块（常见是 4KB），只记录“第几页对应哪一页”。
      页内的位置保持不变，翻译时只换掉“哪一页”这部分。
    derivation: original
    sources:
      - ref: ostep
        locator: Paging 一章
        claim: 分页将地址空间切成固定大小的页，以页为单位映射
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: swimlane
      actors:
        - lane: procs
          id: p
          label: 程序
        - lane: mmu
          id: m
          label: 地址翻译（MMU）
          highlight: true
        - lane: mem
          id: r
          label: 物理内存
      messages:
        - id: m-pages
          from: p
          to: m
          label: 虚拟地址：第几页 + 页内位置
          active: true
    log:
      - mode: 用户态
        event: 地址被拆成“页号 + 页内位置”
  - id: page-table
    title: 查页表
    tldr: 硬件按当前进程的页表，把虚拟页换成物理页。
    body: |-
      每个进程有自己的页表，由内核建立和维护，程序自己改不了。
      切换进程时，内核让硬件改用另一张页表，所以同一个虚拟地址在不同进程里指向不同地方。
      页表里还记着权限，比如这一页能不能写，违反就会触发异常。
    derivation: original
    sources:
      - ref: xv6-book
        locator: 页表章节
        claim: 每个进程有自己的页表，硬件据此翻译地址并检查权限
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: swimlane
      actors:
        - lane: procs
          id: p
          label: 程序
        - lane: mmu
          id: m
          label: 地址翻译（MMU）
          highlight: true
        - lane: mem
          id: r
          label: 物理内存
      messages:
        - id: m-page-table
          from: m
          to: r
          label: 按页表找到物理页
          active: true
    log:
      - mode: 用户态
        event: 查页表，得到物理地址
  - id: tlb
    title: TLB：翻译结果的缓存
    tldr: 硬件把最近的翻译结果存进 TLB，下次直接命中。
    body: |-
      页表放在内存里，每次访问内存都先查一遍页表，会让速度慢好几倍。
      TLB 是 CPU 里的一个小缓存，记住最近用过的翻译结果。
      程序访问内存往往集中在附近区域，所以绝大多数翻译都能直接命中，就像浏览器缓存让重复请求不用再走网络。
    derivation: original
    sources:
      - ref: ostep
        locator: TLB 一章
        claim: TLB 缓存地址翻译结果，利用局部性加速
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: swimlane
      actors:
        - lane: procs
          id: p
          label: 程序
        - lane: mmu
          id: m
          label: 地址翻译（MMU）
          highlight: true
        - lane: mem
          id: r
          label: 物理内存
      messages:
        - id: m-tlb
          from: p
          to: m
          label: 先查 TLB，命中就直接用
          active: true
    log:
      - mode: 用户态
        event: TLB 命中，翻译几乎零开销
  - id: result
    title: 拿到数据，以及翻译失败时
    tldr: 翻译成功就读到数据；页不存在或没权限，就交给内核处理。
    body: |-
      翻译完成后，CPU 按物理地址读出变量，整个过程程序毫无察觉。
      如果页表说这一页不存在或不允许访问，硬件会触发“缺页异常”，陷入内核。
      内核可以借这个机会做很多聪明的事，下一个主题会讲。
    derivation: original
    sources:
      - ref: ostep
        locator: Paging / Beyond Physical Memory 相关章节
        claim: 地址翻译失败时触发异常交由操作系统处理
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: swimlane
      actors:
        - lane: procs
          id: p
          label: 程序
        - lane: mmu
          id: m
          label: 地址翻译（MMU）
        - lane: mem
          id: r
          label: 物理内存
          highlight: true
      messages:
        - id: m-result
          from: r
          to: p
          label: 返回数据
          active: true
    log:
      - mode: 用户态
        event: 程序读到了变量的值
