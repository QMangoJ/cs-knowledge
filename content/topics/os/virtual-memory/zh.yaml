id: os/virtual-memory
subject: os
slug: virtual-memory
order: 5
status: published
license: CC-BY-4.0
title: 虚拟内存：程序看到的地址是怎么翻译的
summary: 每个程序都以为自己独占一大片内存，其实背后有一层翻译。
premise: 程序里读一个变量，用的是它自己地址空间里的一个地址，这个地址和内存条上真实的位置并不是一回事，中间是谁在翻译？本课以 Linux 上一个程序读取自己内存中的一个变量为例，只讲概念，把这条翻译链走一遍。
position: 轮换上场的每个进程都宣称独占一大片地址空间，这份幻觉要靠页表翻译兑现，故事由此转入内存管理板块。本课把虚拟地址拆成多级索引与页内偏移，并讲透 [[TLB]] 命中为何是分页能用的前提。对着 /proc/self/maps 逐行指出代码、堆与栈，并解释两进程同址却存着不同数据，便是本课的验收方式。
bridge:
  prev: 线程与调度那课里，同进程的线程切换时连页表都不必更换，因为它们共用同一套翻译规则；本课便钻进这套规则本身：CPU 拿着虚拟地址时，究竟查了哪几级表才落到物理页框？
  next: 页表项若还是空的，翻译便当场卡住，程序第一次触碰 malloc 来的大块内存时，内核要靠哪种异常把缺失的页补上？
overview:
  - key: 一句话总结
    value: 程序里用的都是虚拟地址，硬件在每次访问时按页表把它翻译成物理地址。程序以为自己独占一大片连续内存，实际住在哪儿由内核安排。
  - key: 好处
    value: 隔离（A 进程写错地址也碰不到 B 的内存）、布局统一（每个进程都按同一张地图摆放代码、堆、栈）、物理内存可以不连续（虚拟地址连成一片，背后可以是散落在各处的物理页，靠页表逐页对应）
  - key: 页
    value: 内存被切成固定大小的页，Linux 在 x86-64 上通常以 4KB 为一页。地址翻译以页为单位进行，另外还有 2MB 这样的大页，一次翻译能覆盖更大范围，减少翻译开销。
  - key: 页表
    value: 页表记录虚拟页到物理页的对应关系，每个进程一套，由内核维护。切换进程时要换页表，这也是进程切换比线程切换贵的原因之一。
  - key: TLB
    value: TLB 是最近翻译结果的缓存，查页表要走好几级，很慢。有了它，常访问的地址直接命中缓存里的翻译结果，不用每次都从头查。
  - key: 权限位
    value: 每一页都记着权限，可读、可写、可执行、用户能不能访问。程序一旦越权，比如往只读页里写，硬件当场就会触发异常，内核随后把程序终止掉。
  - key: 多级页表
    value: 页表本身也要占内存，所以 x86-64 通常用 4 级页表分层组织。只有真正用到的地址区域才建下级表，没用到的地方连表都不建，省下大量空间。
  - key: 写时复制
    value: fork 之后父子进程先共享同一批只读页，谁都不用复制。等到有一方要写某一页时，才把那一页复制一份给它改，这就是写时复制。
  - key: swap
    value: 内存不够时，不常用的页会被换到磁盘上的 [[swap]] 区腾地方。如果换页太频繁，程序大部分时间都在等磁盘换入换出，这就叫抖动，机器会慢得几乎没法用。
