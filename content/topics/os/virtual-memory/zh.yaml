  - id: tlb
    title: TLB：没有翻译缓存，多级分页根本没法用
    tldr: 没有 [[TLB]] 缓存翻译结果，4 级页表会把每一次内存读写放大成 5 次访存、直接把机器拖慢好几倍；正是靠程序反复读写附近几页的局部性，TLB 才让多级分页真正能用起来。
    body: |-
      刚算完 4 级页表的空间账，回头看速度账会倒吸一口凉气：程序几乎每条指令取指、每次读写变量都要先翻译地址。如果每次都老老实实顺着 [[CR3]] 走完 4 级页表，本来只需要去内存拿 1 次的变量，变成了先查 4 趟页表再拿 1 次数据——一共 5 次内存访问，整个程序直接慢到原速的五分之一！这就是为什么说 TLB 不是「有了更好」的锦上添花，而是多级分页能成立的前提。

      于是芯片设计师在 MMU 里塞了一块高速小缓存叫 [[TLB]]（转译后备缓冲器），专门记下最近刚刚翻译过的「虚拟页号 → 物理页框号」对照。程序在一段时间里往往只盯着附近十几页转悠（局部性），绝大多数访问一查 TLB 当场命中，几乎零额外等待就拿到物理地址；只有漏掉了才去走 4 级页表（多花几百纳秒），要是页表里根本没有还得去现行 NVMe SSD 读盘（约 35–55 微秒，比内存慢几百倍；机械盘更慢约十万倍）。

      但 TLB 放得下的条目数是有限的：条目数乘以页大小就是它能罩住的内存上限。一旦程序热使用的内存超过了这个天花板，命中率就会陡降，变成 TLB 抖动——后面大页正是为拉高这个上限而生的。还有个切进程的细节：带地址空间标识（[[ASID]]，x86 上叫 PCID）的 CPU 能给每条 TLB 贴上进程标签，换进程不用全清；老式芯片没有标签，切一次进程就把 TLB 清空一次，这也是进程切换让缓存变冷的原因之一。
    derivation: original
    sources:
      - ref: ostep
        locator: TLB 一章
        claim: TLB 缓存地址翻译，利用局部性加速
        status: verified
        checkedBy: Muse 核查
