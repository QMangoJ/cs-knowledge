- id: layout
  title: 每个进程的地址空间
  tldr: 内核为进程划好区域：代码、堆、栈、共享库各在各的位置。
  body: '进程的地址空间不是一整块乱用，而是分成几个区域，各有用途和权限，比如代码区只读可执行。

    在 Linux 上，/proc/<pid>/maps 会把这些区域一行行列出来。

    地址看起来很大很连续，但大部分并没有对应真实内存，用到才有。


    把 maps 读一遍：一个进程的 maps 里通常能看到 r-xp 的代码段、rw-p 的数据与堆、标为 stack 的栈、若干 r-xp 的共享库映射和标为 vdso 的特殊页。每行的权限列就是页表权限的应用层投影：代码段没有 w，意味着往代码地址写数据会当场触发段错误，这正是可写与可执行不可兼得这条防线落地的样子。地址空洞也不是浪费：地址空间大半辈子都是空的，空洞不占物理内存，只占一个没有映射的语义。


    还有一个安全细节：栈与堆之间留着大片未映射的空洞，栈向下生长、堆向上生长，各自吃空洞，谁先越界谁先撞上未映射区域被拦下；现代系统还会在栈底放一张不可访问的保护页，递归失控时第一时间触发段错误，而不是悄悄踩进堆里。'
  derivation: original
  sources:
