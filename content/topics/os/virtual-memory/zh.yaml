  - id: demand-paging
    title: 按需分页：程序启动时其实什么都没加载
    tldr: 程序刚启动时，内核只在账本里登记地址地图，一张真正的数据页都还没搬进内存；CPU 去读第一条指令就触发缺页，用到哪页才临时补哪页。
    body: |-
      敲下命令启动一个几百 MB 的大程序，为什么眨眼就能跑起来？看看内核在 exec 那一刻实际干了什么：它只照着 [[ELF]] 可执行文件的头部信息在账本里登记好范围——哪段虚拟地址对应代码文件、哪段对应数据、栈放哪儿——真正的数据页一张都还没搬进内存条。CPU 从入口第一条指令起步，刚去取指就发现页表空着、触发缺页，内核这才顺手从文件里读进第一页代码；往后读全局变量、往下压栈，全照这个路数用到再读。

      这种做法叫按需分页。好处显而易见：启动瞬间不用等几百 MB 全部搬完，程序真正运行到了哪几页才付那几页的读取成本；编辑器打开大文件也是靠它做到「滑到哪一屏读哪一屏」。代价则记在第一次访问上：每页头一回被摸到时要多付一次缺页延迟，这就是为什么服务冷启动第一波请求偏慢、热了以后快得多。至于缺页时这一页从哪儿补出来（文件、[[swap]] 还是清零新页），下一课缺页异常专门拆开走一遍。
    derivation: original
    sources:
