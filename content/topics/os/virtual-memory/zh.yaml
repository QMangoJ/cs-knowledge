  - id: swap
    title: 内存不够时：换出到磁盘
    tldr: 内存不够时还有一条退路：把不常用的页先写到磁盘上腾地方。这一步看交换区的工作方式，并澄清两个常见误解——里面有数据不等于内存已经不够了，关掉它也不会让程序更快，只会让内存耗尽时直接走到杀进程那一步。
    body: |-
      虚拟内存让「程序以为有的内存」可以大于物理内存。内核挑最近不常用的页写到交换区（[[swap]]），或直接丢掉可重新读取的文件页，并在页表里标记「不在内存」；再访问时触发缺页，再读回来。把这笔延迟账按介质算清：内存一次访问约 100 纳秒；老式 SATA SSD 读一页约 100 微秒，约是内存的一千倍（三个数量级）；现行 NVMe SSD 的 4K 随机读实测中位数约 35–55 微秒，约是内存的 350–550 倍（约 2.5 个数量级）——本课后面凡是按 SSD 估算换页代价，都按现行 NVMe 的几百倍算，不再用老式 SATA 的一千倍；机械盘读一页在 10 毫秒量级，约是内存的十万倍（五个数量级）。所以频繁换进换出（抖动）时整台机器会非常卡。

      两个常见误解要澄清：第一，swap 里有数据不等于内存不够——内核会主动把几乎不用的冷页提前换出、给文件缓存腾地方，这时用着 swap 反而是健康状态；真正报警的是换入换出的速率长期不为零。第二，关掉 swap 不会让程序更快，只会让内存耗尽时无路可退、直接由 OOM killer 杀进程。抖动的解法是减小工作集或加内存，swap 只是把「立刻死」换成「慢慢熬」的缓冲垫。
    derivation: original
    sources:
