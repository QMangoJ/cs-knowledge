  - id: addr-lab
    title: 动手：把一个虚拟地址拆成 4 级索引
    tldr: 48 位虚拟地址 = 4 段 9 位索引 + 12 位页内偏移；0x7ffd1234abcd 拆出来是 255、500、145、330 和 0xbcd。
    body: |-
      把上一节的拆分动手做一遍。为什么是 9 和 12：页大小 4KB = 2^12 字节，最低 12 位是页内偏移，翻译时原样保留；每张页表本身正好占一页，4096 字节 ÷ 每项 8 字节 = 512 项 = 2^9，所以每一级用 9 位当下标。12 + 9 × 4 = 48。

      拿地址 0x7ffd1234abcd（典型的栈地址）拆：第 47–39 位 = 255，是第 1 级（PML4）的下标；第 38–30 位 = 500，第 2 级；第 29–21 位 = 145，第 3 级；第 20–12 位 = 330，第 4 级，这一项里存着物理页号；最低 12 位 = 0xbcd，是页内偏移。MMU 从 CR3 寄存器拿到第 1 级表的物理地址，依次用这四个下标往下走，最后把物理页号与偏移拼起来，就是物理地址。
    derivation: original
    sources:
      - ref: ostep
        locator: "Paging: Smaller Tables 一章"
        claim: 多级页表按地址位段逐级索引
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
