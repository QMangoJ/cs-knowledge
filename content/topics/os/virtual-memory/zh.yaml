  - id: working-set
    title: 工作集与抖动：全机一起慢死是怎么发生的
    tldr: 决定内存够不够的不是总共申请了多少，而是程序眼下反复摸到的「工作集」总和；工作集一超过物理内存，各进程互相挤出页面，全机立刻陷入抖动悬崖。
    body: |-
      设想一台 8 GB 内存的机器上同时跑了三个服务，每个服务眼下反复读写的热数据（工作集）各占 3 GB，合计 9 GB——看着只超了一点，可这多出的 1 GB 足以让整台机器跌进悬崖：内核刚把 A 的冷页换出，A 下一毫秒偏偏要用到它，触发缺页又把 B 刚热起来的页挤出去；紧接着 B 缺页再踢走 A。磁盘被换入换出流量跑满，CPU 却大把时间干等磁盘，吞吐像跳崖一样塌下去，这就是抖动。

      实在压不住时，内核只能派出 [[OOM]] killer 挑一个进程杀掉换取全机存活——宁可牺牲一个，也好过大家一起等死。云服务器上内存超卖、或者给容器把内存上限设得比实际工作集还小，踩到的正是同一道悬崖。

      全课收成排查内存问题的三问清单：**一问地图**——/proc/self/maps 里这片地址归谁、权限对不对；**二问加速**——热访问区间有没有撑爆 TLB 覆盖（该不该上大页）；**三问容量**——当前活跃工作集总和有没有逼近物理内存上限（是不是已经开始持续换页抖动）。
