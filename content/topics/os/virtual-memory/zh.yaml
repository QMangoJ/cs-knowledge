  - id: page-fault
    title: 翻译失败时：从 [[CR2]] 出错地址到指令重跑
    tldr: 查页表卡住时，硬件把出错地址塞进 [[CR2]] 寄存器交给内核；地址合法就补齐页面再让那条指令原样重跑一遍，真越界或违规写入才发 [[SIGSEGV]] 杀进程。
    body: |-
      这里先走一遍翻译卡住时的大致轮廓（完整细节留到下一课缺页异常）：CPU 访问了一个不在内存里或权限不对的页，硬件当场停住这条指令，把出错虚拟地址写进 [[CR2]] 寄存器、再附上错误码（说明是读还是写、是没有页还是权限不够），随后切进内核。内核先翻进程的内存映射账本核对：如果这片地址根本不属于当前进程，或者往只读页硬写，当即发送 [[SIGSEGV]] 终止它（也就是常说的段错误）。

      如果地址和权限都合法，说明这一页只是还没装进来，内核按来路补齐：文件映射去读文件、被换出过就去 [[swap]] 读回、头一回用的匿名内存就给一张全零新页。页框备好、页表填妥后，CPU 回到刚才停住的地方重新执行那条指令，这一回翻译畅通无阻——整个补页过程对程序完全透明，靠的是出错指令被硬件拦在产生任何副作用之前，所以可以原样重跑。
    derivation: original
    sources:
