  - id: layout
    title: 每个进程的地址空间：代码、堆、栈与中间的缓冲空洞
    tldr: 进程的地址空间按用途和权限切成几块——代码只读可执行、堆与数据可读可写、栈从顶部往下长——中间大片空白根本不占真实内存，还正好充当防越界护城河。
    body: |-
      拿到一本 48 位的虚拟地址空间后，程序并不是一整块乱用，而是按分工排好几块地盘：底层是只读可执行的程序代码，紧接着是可读可写的全局变量和往上生长的堆（动态申请的内存），顶部则是往下生长的函数调用栈，中间夹着映射进来的共享库。在 Linux 上读一下 /proc/<pid>/maps，就能亲眼看到这几行分区和权限。

      每行标着的权限就是页表权限的投影：代码区去掉了写权限，万一程序失控往自己代码地址里写东西，硬件当场拦截报出段错误——「能写的不能执行、能执行的不能写」这道安全防线正是靠它撑住的。

      地址空间看着有上百 TB 那么吓人，其实大部分是空洞：没映射的空白区间一片物理内存也不占，只在真正用到时才向内核领。堆和栈之间故意隔开大片空白还有一个妙用：堆往上冲、栈往下掉，谁先越界就会一头撞进未映射的空白区当场报错，免得悄无声息地把另一边的数据踩坏。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: proc(5)，/proc/pid/maps
        url: https://man7.org/linux/man-pages/man5/proc.5.html
