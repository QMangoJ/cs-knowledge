      lab: addr-split
      caption: 输入一个虚拟地址，看它被拆成哪几段
      params:
        vaBits: 48
        pageSize: 4096
        levels: 4
        bitsPerLevel: 9
        address: "0x7ffd1234abcd"
      cases:
