  - id: page-table
    title: 按页查页表
    tldr: 硬件以页为单位，按当前进程的页表把虚拟页换成物理页。
    body: |-
      内存被切成固定大小的页（x86-64 上通常 4KB），页表只记录「哪个虚拟页对应哪个物理页」，页内位置不变。每个进程有自己的页表，由内核建立，程序自己改不了；切换进程时就换一套页表。页表还记着权限，违反就会触发异常。

      完整走一个数字例子：虚拟地址 0x7f3a2b405123，页大小 4KB 时低 12 位是页内偏移 0x123，翻译前后不变；高位是虚拟页号，MMU 拿它查当前进程的页表，得到物理页号（设为 0x582a1），拼上偏移得到物理地址 0x582a1123。权限检查与翻译是同一步：页表项里的读、写、执行与用户位不满足当前访问，硬件当场拒绝并触发异常，根本不会真的摸到物理内存。页表项里还有两位状态情报——被访问位与被写入位由硬件自动置上，后面的页面置换与写回决策靠的就是它们。
    derivation: original
    sources:
      - ref: ostep
        locator: Paging 一章
