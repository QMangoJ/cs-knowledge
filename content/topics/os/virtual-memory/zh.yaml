  - id: multilevel
    title: 多级页表：为什么不直接放一张大数组
    tldr: 把页表铺成一张连续大数组，每个进程光表自己就要吃掉 512 GB 内存；切成 4 级树状页表后，没用到的空白区间连下级表都不建，一个小进程只要几十 KB。
    body: |-
      刚讲页表记录「虚拟页号 → 物理页号」，最直觉的想法就是建一张一维大数组：拿着虚拟页号当下标，一步查出物理页号。可真按这个直觉算一笔账，结果会吓人一跳：x86-64 常用的 48 位虚拟地址，去掉 12 位页内偏移还剩 36 位页号，一共有 2^36 个（约 687 亿个）可能用到的页；每条表项占 8 字节，这一张平铺大数组光自己就要占掉 512 GB 内存！一个只打印 Hello World 的小程序还没运行，先要 512 GB 装页表，这根本没法落地。

      等一下，一个小程序明明只用得上几 MB 地址，中间那上百 TB 全是空的，凭什么为不存在的空洞印整本电话簿？于是 x86-64 Linux 把一维大数组砍成了 4 级树状目录：第 1 级表只管整块大区间，某个大区间压根没映射，对应那一项就留空，底下的第 2、3、4 级子表统统不用分配内存！这样一来，只用几 MB 的小进程只需要根表 1 页、沿途几张中间表和少量末级表，总体积从 512 GB 直接压到几十 KB。

      顺手把级数和位数为什么长那样也对上账：4 KB 一页刚好能装下 4096 ÷ 8 = 512 = 2^9 条记录，于是每张页表正好占一整页、用 9 位当下标；48 位地址减去 12 位偏移剩 36 位，每级 9 位不多不少正好分 4 级（9 × 4 + 12 = 48）。当然天下没有白省的空间：把一次查数组拆成四级顺藤摸瓜，最坏情况每读一个变量要多跑 4 趟内存——所以多级页表必须和下一步的 [[TLB]] 成套捆绑，单拎出来跑根本慢得没法用。
