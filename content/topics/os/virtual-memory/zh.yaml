title: 虚拟内存：程序看到的地址是怎么翻译的
summary: 每个程序都以为自己独占一大片内存，其实背后有一层翻译。
premise: 以 Linux 上一个程序读取自己内存中的一个变量为例，只讲概念。
overview:
- key: 一句话总结
  value: 程序用虚拟地址，硬件按页表翻译成物理地址
- key: 好处
  value: 隔离、布局统一、物理内存可以不连续
- key: 页
  value: Linux 在 x86-64 上通常以 4KB 为一页；大页（如 2MB）用来减少翻译开销
- key: 页表
  value: 每个进程一套，由内核维护
- key: TLB
  value: 最近翻译结果的缓存
- key: 权限位
  value: 每页记着可读、可写、可执行、用户可访问，违反即触发异常
- key: 多级页表
  value: x86-64 通常 4 级，只为用到的区域建表
- key: 写时复制
  value: fork 后共享只读页，写时才复制
- key: swap
  value: 不常用的页换到磁盘；频繁换页叫抖动
- key: 在终端里看一看
  value: cat /proc/self/maps　看一个进程的内存布局（代码、堆、栈、共享库）；grep Huge /proc/meminfo　看大页使用情况
visual: swimlane
lanes:
- id: procs
  label: 程序
- id: mmu
  label: 地址翻译
- id: mem
  label: 物理内存
logColumns:
- key: mode
  label: 当前状态
- key: event
  label: 发生了什么
steps:
- id: why-vm
  title: 为什么不让程序直接用真实地址
  tldr: 直接用物理地址，程序之间就能互相读写内存。
  body: '如果程序直接访问物理内存，一个写错的地址就可能破坏别的程序，甚至内核。

    虚拟内存给每个进程一套自己的地址空间，它只看得见自己那份。

    就像每个网站有独立的 localStorage，看不到别的网站的数据。


    走个对照例：进程 A 与进程 B 里都出现地址 0x401000，这毫不冲突——A 的这个地址经 A 的页表落到物理页 X，存着 A 的代码；B 的同名地址经 B 的页表落到物理页 Y，存着 B 的数据。地址相同、所指完全不同，正是因为虚拟地址只是本进程内的门牌号。反过来想，隔离为什么不能只靠约定：C 语言一个野指针就能写到任意地址，没有硬件在每次访存时翻译并检查，任何请勿越界的约定都会被一个 bug 击穿。


    隔离还带来一个附带的好处：每个进程的地址布局可以完全统一——代码从固定地址开始、栈在顶部、堆向上生长，编译器与链接器可以放心地按同一张地图生成程序，不必关心它将被装进物理内存的哪个角落。'
  derivation: original
  sources:
