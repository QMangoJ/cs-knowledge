- id: share-cow
  title: 共享与写时复制
  tldr: 同一块物理内存可以映射给多个进程，省内存，也让 fork 变快。
  body: '每个进程都用 libc，但内存里只需要一份它的代码，各进程的页表都指向同一组物理页。

    fork 时父子进程先共享所有页，并都标成只读；谁先写，就触发异常，内核这时才复制那一页，这叫写时复制（COW）。

    进程间共享内存（mmap 共享映射）也是同一个机制：两个页表指向同一组物理页。


    共享的边界要划清：共享库的代码页是只读共享的，谁都不能改；但每个进程的数据段、堆、栈永远私有，共享的只是被显式映射为共享的那些页。mmap 用 MAP_SHARED 打开文件时，两个进程写同一页能互相看见，可用于进程间通信；用 MAP_PRIVATE 则是私有的写时复制视图，改了不回写文件、别人也看不见——同一个系统调用，一个标志之差，语义从共享内存变成私有快照，实操里极爱在这里设陷阱。


    写时复制的触发瞬间值得放慢看：写方执行写指令、MMU 查到该页只读且被共享，触发写保护缺页，内核分配新页、拷走整页内容、把写方的页表改指新页并恢复可写，然后让写指令重新执行——整个过程只复制被写的那一页，其余页继续共享。'
  derivation: original
  sources:
