- id: tlb
  title: TLB 与大页：让翻译变快
  tldr: TLB 缓存最近的翻译结果；大页让一次翻译覆盖更多内存。
  body: '每次访问内存都去查页表会很慢，所以 CPU 里有个小缓存 TLB，记住最近的翻译。

    程序访问往往集中在附近，绝大多数翻译都能直接命中，就像浏览器缓存让重复请求不用走网络。

    对数据库这类大内存程序，Linux 支持大页（如 2MB），同样大小的 TLB 能覆盖更多内存。


    数字感：TLB 命中是流水线里的一次快速查找；未命中最坏要走 4 级页表约 4 次访存（有页表行走缓存时通常少于 4 次内存访问），缺页去 SSD 读则要数万到数十万个周期量级（随介质而定）。三级代价差着数量级，这也是大模型推理用大页（huge page）减少 TLB 未命中的原因。


    TLB 的组织再补两点：它按虚拟页号做内容寻址（类似 CPU 缓存的查法），容量通常只有几十到几千项，所以它的覆盖范围（项数乘页大小）是硬顶——工作集超过覆盖范围，未命中率会陡升，这叫 TLB 抖动，与缓存抖动同理。进程切换时 TLB 怎么办？带地址空间标识（ASID 或 PCID）的 CPU 可以让不同进程的翻译共存于 TLB，切换不必全清；没有标识的老办法是切换即清空，新进程要把自己的热翻译重新挣回来，这也是进程切换间接成本的一部分。'
  derivation: original
  sources:
