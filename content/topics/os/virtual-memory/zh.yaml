  - id: demand-paging
    title: 按需分页：程序启动时其实什么都没加载
    tldr: exec 只登记映射关系，第一条指令就缺页，页用到哪才从文件读到哪。
    body: |-
      程序启动时到底加载了什么？走一遍 exec 之后的状态：内核只按 ELF 的段信息登记好映射关系——代码段对应文件哪一段、数据段在哪、堆与栈的范围——一张实际的数据页都还没搬。CPU 从入口第一条指令开始跑，第一次取指就缺页，内核这才从可执行文件里读入第一页代码；变量第一次被访问、栈第一次向下生长，都重复这个套路。

      这叫按需分页（demand paging）。直接收益是启动快：一个几百 MB 的程序，启动只读它真正走到的那几页；编辑器打开大文件同理，滚动到哪读到哪。代价是第一次访问每页都要付一次缺页的钱，所以「冷启动慢、跑起来变快」是这类系统的固有体感，而不是 bug。缺页时页的来源无非三种：文件、swap、或者一张全新的零页（详见缺页一课）。
    derivation: original
    sources:
      - ref: ostep
        locator: Beyond Physical Memory 一章，按需分页
        claim: 操作系统按需装入页面，首次访问触发缺页后才读入
