  - id: swap
    title: 内存不够时：换出到磁盘
    tldr: 物理内存不够时，内核可以把不常用的页写到磁盘，腾出空间。
    body: |-
      虚拟内存让「程序以为有的内存」可以大于物理内存。内核挑最近不常用的页写到交换区（swap），或直接丢掉可重新读取的文件页，并在页表里标记「不在内存」；再访问时触发缺页，再读回来。换页介质比内存慢约三个数量级（SSD）到五个数量级（机械盘），所以频繁换进换出（抖动）时整台机器会非常卡。

      两个常见误解要澄清：第一，swap 里有数据不等于内存不够——内核会主动把几乎不用的冷页提前换出、给文件缓存腾地方，这时用着 swap 反而是健康状态；真正报警的是换入换出的速率长期不为零。第二，关掉 swap 不会让程序更快，只会让内存耗尽时无路可退、直接由 OOM killer 杀进程。抖动的解法是减小工作集或加内存，swap 只是把「立刻死」换成「慢慢熬」的缓冲垫。
    derivation: original
    sources:
