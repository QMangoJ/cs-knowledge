prereq:
  - os/syscall
objectives:
  - 把虚拟地址按多级页表拆成索引与页内偏移
  - 解释 TLB 的作用与未命中代价
  - 说清共享页与写时复制如何省内存
aiLink: 这是全站与 AI 工程连接最紧的一课：vLLM 的 PagedAttention 直接借用了虚拟内存的分页思想管理 KV Cache——把 KV 切成固定大小的块、按需映射，于是显存碎片几乎消失；论文里同一请求内的并行采样等场景还能共享块，后来的 vLLM 又在此基础上做了跨请求的前缀缓存。懂页表，就懂它为什么成立。
design:
  - mechanism: 页大小定在 4 KB 量级：刚好让一页装下 512 条页表项，同时在浪费和表体积之间找准折中点
    problem: 页大小是个两头扯的难题：页设太大，程序只用几百字节也得整页装入，浪费的碎空间和无效读盘跟着暴涨；页设太小，页表条目瞬间爆炸，光页表本身和缓存覆盖都兜不住。
    choice: 业界最终停在 4 KB：刚好配得上磁盘块和文件缓存的常见大小，单页平均浪费约 2 KB 还能接受，而且一页 4096 字节除以 8 字节表项正好 512 条，对应每级 9 位下标严丝合缝。512 B 小页会让页表胀大 8 倍，1 MB 大页又让小进程浪费太狠。
    tradeoff: 代价转嫁到了 [[TLB]] 身上：4 KB 一页罩不住多少内存，跑大模型或大数据库时还得另叠一套 2 MB 大页来补救，系统要同时维护大小两套粒度。
    root: 一边是随页变大而增多的内部浪费，另一边是随页变小而暴涨的页表体积，两条反向曲线正好在几 KB 处相交；再加上数据页和页表页一样大，内核连管理页表自己都不用另起炉灶。
  - mechanism: TLB 缓存地址翻译：没有 TLB 的多级分页在速度上根本站不住脚，两者是同一设计的一体两面
    problem: 4 级页表虽然省下了几百 GB 表空间，却让最坏一次访存变成「4 次查表 + 1 次取数」；程序几乎每条命令都在读写内存，直接按这个成本跑等于把电脑拖慢四五倍。
    choice: 在 CPU 芯片里放进一小块高速关联缓存 TLB，专门记住最近翻译过的页号对照；不选一维大数组，是因为 512 GB 装不下；也不把整套进程页表放片上缓存，因为几十上百个进程根本塞不下。
    tradeoff: 翻译平时几乎零等待，代价是 TLB 容量成了稀缺资源——工作集超限就会命中率骤降，且进程切换和修改页表时还要处理失效甚至多核广播同步。
    root: 程序在短时间内总是反复读写同一小撮页，只要把这几十上百条热门翻译拦在芯片门口，99% 以上的访存就不用回头翻 4 级内存页表。
  - mechanism: 按需分页加缺页重跑：先记映射账、用到再配页，靠指令可无副作用重演让延迟加载对程序透明
    problem: 程序和文件的大部分内容运行一遍根本碰不到，启动全搬进内存既慢又浪费；可真到指令去取数时内存里又没有这页，CPU 总不能停在半条指令里等磁盘读完——必须有一种「先暂停、补完再原样重来」的机制才能跑通按需加载。
    choice: 页表先登记映射不发物理页，第一次摸到时触发缺页交给内核补页，补好再让 CPU 重新执行那条出错指令；对比启动全加载（太慢浪费），也对比让应用自己做预读（每个程序都要重复造轮子，还互相不知内存压力）。
    tradeoff: 换来了秒级冷启动和内存超卖能力，代价是跑着跑着随时可能撞上一次几微秒到几毫秒的缺页尾延迟；对延迟极端敏感的服务，还得在上线前主动预热并锁住热点页。
    root: 缺页发生在访存检查那一刻、指令还没修改寄存器或内存，硬件保留的现场足以让整条指令从头再走一遍，于是异常从「程序报错」变成了「无感知的懒加载开关」。
quiz:
  - q: 48 位虚拟地址、4 KB 页、每级 9 位时，页内偏移占几位？
    options:
      - 9 位
      - 12 位
      - 16 位
      - 36 位
    answer: 1
    explain: 4 KB = 2^12，偏移 12 位；剩下 36 位正好 4 级 × 9 位。
  - q: TLB 未命中意味着什么？
    options:
      - 进程崩溃
      - 要走一遍多级页表把翻译找出来（可达 4 次访存）
      - 从磁盘换页
      - 地址非法
    answer: 1
    explain: TLB 是翻译缓存；未命中走页表，仍找不到条目才触发缺页。
  - q: 两个进程能把同一物理页映射进各自地址空间，这带来什么好处？
    options:
      - 没好处
      - 共享库只装一份、fork 写时复制、共享内存通信
      - 地址变得更长
      - TLB 更大
    answer: 1
    explain: 共享映射是共享库、COW 与 mmap 共享内存的共同基础。
