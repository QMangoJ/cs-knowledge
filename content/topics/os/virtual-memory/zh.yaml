              - 255
              - 500
              - 145
              - 330
            offset: "0xbcd"
        - input:
            address: "0x7ffd1234abce"
          expect:
            indices:
              - 255
              - 500
              - 145
              - 330
            offset: "0xbce"
        - input:
            address: "0x7ffd1234bbcd"
          expect:
            indices:
              - 255
              - 500
              - 145
              - 331
            offset: "0xbcd"
        - input:
            address: "0x400000"
          expect:
            indices:
              - 0
              - 0
              - 2
              - 0
            offset: "0x0"
      registers:
        - name: PML4 下标（47–39）
          value: "255"
        - name: PDPT 下标（38–30）
          value: "500"
        - name: PD 下标（29–21）
          value: "145"
