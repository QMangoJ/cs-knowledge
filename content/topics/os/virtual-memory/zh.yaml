  - id: tlb
    title: TLB 与大页：让翻译变快
    tldr: TLB 缓存最近的翻译结果；大页让一次翻译覆盖更多内存。
    body: |-
      多级页表省了空间，却让每次翻译最坏要走 4 次访存——程序几乎每条数据访问都要先翻译，这个账付不起。所以 CPU 里有个小缓存 TLB，记住最近的翻译结果；程序访问往往集中在附近，绝大多数翻译直接命中，就像浏览器缓存让重复请求不用走网络。代价阶梯要心里有数：TLB 命中几乎免费，未命中走页表慢一个小量级，缺页去磁盘读则慢几个数量级。

      TLB 的覆盖范围是硬顶：项数乘以页大小就是它能罩住的内存，工作集超过这个范围，未命中率会陡升（TLB 抖动，与缓存抖动同理）。这正是大页的用武之地：2MB 的大页让同样多的 TLB 项覆盖 512 倍内存。还有一个切换时的细节：带地址空间标识（ASID/PCID）的 CPU 能让不同进程的翻译在 TLB 里共存，切换不必全清；没有标识的老办法是切换即清空，新进程得把热翻译重新挣回来——这是进程切换间接成本的一部分。
    derivation: original
    sources:
