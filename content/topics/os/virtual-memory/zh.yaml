  - id: page-fault
    title: 缺页的完整一生：从出错地址到指令重执行
    tldr: 翻译失败不是一种情况，这一步把一次缺页的完整一生走一遍：硬件把出错地址放进 [[CR2]]、附上是读是写的信息，内核先查这个地址合不合法，再决定页从文件、交换区还是新分配来。这一步是概览，完整的处理细节留给下一课，这里先把分岔点看清。
    body: |-
      把一次缺页处理的大致流程先走一遍（完整一生在缺页一课）：CPU 访问一个不在内存的页，硬件把出错地址放进 CR2 寄存器、附上错误码（区分读还是写、不存在还是权限问题），陷入内核。内核先查这个地址是否落在进程的合法映射区域内：不合法，直接发 [[SIGSEGV]]；合法，再看页该从哪来——文件映射去读文件、被换出过的页去 [[swap]] 读回、从没用过的匿名页直接给一张零页。

      页装好、页表填上，CPU 重新执行那条出错的指令，这次顺利通过。整个过程对程序完全透明，只表现为这次访存慢了些——能做到透明，靠的是出错指令尚未产生副作用、可以原样重演（第 3 条设计细说）。
    derivation: original
    sources:
