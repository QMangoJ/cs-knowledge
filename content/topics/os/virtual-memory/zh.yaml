  - id: multilevel
    title: 多级页表：省下页表本身的空间
    tldr: 地址空间很大但大部分没用，所以页表分层，只为用到的部分建表。
    body: |-
      如果给整个地址空间建一张平铺的大表，光页表就要占海量内存。算笔账：48 位地址空间共有 2^36 个页，每项 8 字节，单级页表要占 512GB——比多数机器的内存还大，显然荒谬。

      x86-64 Linux 通常用 4 级页表：像目录树一样一级级往下查，没用到的分支整片不建。一个只用了几 MB 的进程，只需要根表一页、沿途几张中间表和少量末级表，总共几十 KB 量级，因为没用到的分支在上级表里只是一个不存在的空项。级数也是被联立解出来的：48 位减去 12 位偏移，剩下的 36 位按每级 9 位（每张表恰好一页、512 项）正好分 4 级。代价明确：最坏情况每次翻译要多走 4 次访存——所以多级页表必须与下一步的 TLB 成套出现，单看任何一个都说不通。
    derivation: original
    sources:
      - ref: ostep
        locator: Address Spaces 一章
        claim: 地址空间很大但大部分没用，所以页表分层，只为用到的部分建表。
