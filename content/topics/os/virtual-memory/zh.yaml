  - id: layout
    title: 每个进程的地址空间
    tldr: 内核为进程划好区域：代码、堆、栈、共享库各在各的位置。
    body: |-
      进程的地址空间不是一整块乱用，而是分成几个区域，各有用途和权限：代码区只读可执行，数据与堆可读可写，栈在顶部向下生长，中间还映射着共享库。在 Linux 上，/proc/<pid>/maps 会把这些区域一行行列出来，每行的权限就是页表权限在应用层的投影：代码段没有写权限，往代码地址写数据会当场触发段错误——「可写与可执行不可兼得」这条防线就是这么落地的。

      地址看起来很大很连续，但大部分并没有对应真实内存：空洞不占物理内存，只是一个「没有映射」的语义，用到才有。栈与堆之间留的大片空洞还是缓冲带：两边相向生长，谁先越界谁先撞上未映射区域被拦下。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: proc(5)，/proc/pid/maps
        url: https://man7.org/linux/man-pages/man5/proc.5.html
        claim: /proc/pid/maps 列出进程的内存映射区域及权限
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
