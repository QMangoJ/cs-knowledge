- id: result
  title: 拿到数据，以及翻译失败时
  tldr: 翻译成功就读到数据；失败就交给内核。
  body: '翻译完成后，CPU 按物理地址读出变量，程序毫无察觉。

    如果页表说这一页还没有、或者没有权限，硬件触发“缺页异常”，陷入内核。

    内核会借这个机会做很多聪明的事，下一个主题会讲。


    翻译失败先分清三种，处置完全不同：一是页表项为空但地址合法（页还没装入），这是正常缺页，内核装好页后让指令重新执行，程序无感；二是地址根本不在任何合法区域（如解引用空指针附近），这是真错误，内核给进程发 SIGSEGV；三是有页但权限不符（往只读页写），若是写时复制页则走复制路径，否则同样是 SIGSEGV。所以段错误不是一种病，而是一类症状的出口：同一个信号背后可能是野指针，也可能是栈溢出撞上了保护页。判断时看出错地址：接近 0 的多半是空指针，落在栈边界附近的多半是递归失控。


    程序对这一切的感知只有时间：命中 TLB 时访存几乎按缓存速度完成，走页表时慢一个小量级，缺页装入时慢几个数量级。同一个变量三次访问可能有三种延迟，写性能敏感代码时这种阶梯要心里有数，不能假设访存是恒定成本。'
  derivation: original
  sources:
