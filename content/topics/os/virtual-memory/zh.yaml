  - id: result
    title: 拿到数据，以及翻译失败时
    tldr: 翻译成功就读到数据；失败就交给内核。
    body: |-
      翻译完成后，CPU 按物理地址读出变量，程序毫无察觉。如果页表说这一页还没有、或者没有权限，硬件触发「缺页异常」，陷入内核处理——下一节先看它的大致流程，缺页一课再走完整一生。

      程序对这一切的感知只有时间：命中 TLB 时访存几乎按缓存速度完成，走页表时慢一个小量级，缺页装入时慢几个数量级。同一个变量三次访问可能有三种延迟，写性能敏感代码时，这种阶梯要心里有数，不能假设访存是恒定成本。
