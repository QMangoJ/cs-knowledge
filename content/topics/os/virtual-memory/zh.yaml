level: 进阶
minutes: 24
prereq:
  - os/syscall
objectives:
  - 把虚拟地址按多级页表拆成索引与页内偏移
  - 解释 TLB 的作用与未命中代价
  - 说清共享页与写时复制如何省内存
aiLink: 这是全站与 AI 工程连接最紧的一课：vLLM 的 PagedAttention 直接借用了虚拟内存的分页思想管理 KV Cache——把 KV 切成固定大小的块、按需映射，于是显存碎片几乎消失；论文里同一请求内的并行采样等场景还能共享块，后来的 vLLM 又在此基础上做了跨请求的前缀缓存。懂页表，就懂它为什么成立。
design:
  - mechanism: 页大小定在 4KB 量级：一张页表页恰好装下 512 个表项，内部碎片的浪费与页表自身的体积在这条对数尺度曲线上相交于 KB 量级。
    problem: 页大小要在两个相反的成本之间落点：页太大，进程用不满的部分被整页装入，内部碎片与无效 I/O 涨；页太小，页表项数量爆炸，页表本身与 TLB 覆盖都撑不住。碎片率与表体积随页大小反向变化，两头都不能要，必须找到交叉区域。
    choice: 历史上收敛到 4KB 量级：它与磁盘和文件缓存的常见粒度相配，单页浪费平均半页（2KB 量级）可以接受，一张页表页又恰好装 512 个 8 字节表项，与多级索引的 9 位划分严丝合缝。512B 小页会让页表体积涨 8 倍；1MB 起步的大页，碎片与换入成本让小进程用不起。
    tradeoff: 代价由 TLB 承担：4KB 的覆盖范围有限，大内存程序要靠额外的大页机制补救，系统同时维护大小两套粒度，复杂度明显上升。粒度一旦由指令集定死几十年改不动，后来的所有软件都要在这个粒度上想办法。
    root: 对数尺度上的平衡点：碎片浪费随页大小线性涨，页表开销随页大小反比降，两条曲线相交的区域就在 KB 量级。再加上页表页与数据页同尺寸带来的自洽（表本身也是一页、也能被分页管理），4KB 成了整个系统自举最省事的落点。
  - mechanism: TLB 缓存地址翻译：没有 TLB 的多级分页在性能上根本不成立，页表省下的空间会被每次访存多走几级查表的成本吃光，两者是同一个设计的两半。
    problem: 多级页表把每次访存的翻译变成最多 4 次额外访存，而程序几乎每条数据访问都要先翻译；若无缓存，等于把全部访存成本乘上约 4 到 5 倍。这是算术问题：分页省空间的代价若按原价在每次访问时支付，分页本身就不可行。
    choice: 在 CPU 里放一个按页号内容寻址的小缓存 TLB，缓存最近的翻译，利用访存的时间与空间局部性让绝大多数翻译一次命中。只用一级页表，体积又回到不可接受；把页表放进片上存储，容量与成本撑不起进程级的全量表。
    tradeoff: 换来翻译近乎免费，代价是 TLB 成为新的稀缺资源：容量有限带来覆盖上限，进程切换与页表修改时还要处理失效与多核一致性（跨核广播失效通知），这份复杂度由硬件与内核共同承担。
    root: 局部性原理：程序在任一时段只反复使用一小撮页，翻译结果因此高度可复用，缓存才有效。与其说 TLB 加速了页表，不如说没有 TLB 的多级分页根本不成立——两者是同一个设计的两半。
  - mechanism: 按需分页加缺页重执行：页表先只登记映射关系，第一次访问才把页装入内存，靠指令可以无副作用重演这一硬件事实，让延迟装入对程序完全透明。
    problem: 程序与文件的绝大部分内容在一次运行中根本不会被触碰，启动时全量装入会让启动延迟与实际工作量脱钩；可数据不在内存时，CPU 又不可能把一条指令暂停一会儿再执行——除非有机制能把一次访存暂停并在事后原样重来，否则按需装入无从谈起。
    choice: 页表先只登记映射关系，第一次访问触发缺页异常，内核装好页后让出错指令重新执行。启动时全量加载简单但大程序启动慢且浪费内存；靠程序自己显式预读，等于把内存管理推给每个应用重复实现，且应用不知道全机当下的内存压力，预读决策只会互相打架。
    tradeoff: 换来启动快与内存的超额承诺（overcommit），代价是运行中随时可能被一次磁盘 I/O 的延迟打断，尾延迟不可控；超额承诺过头时只能靠 OOM killer 事后收拾。延迟敏感服务常以预热与锁定页面，把这份不确定性再花钱买回来。
    root: 指令级的可重入性：缺页发生在访存阶段、指令尚未产生任何副作用，硬件保存的现场足以让整条指令从头重演，异常因此能被做成透明的延迟装入而不是错误。这仍然是懒求值——只为真正被触碰的数据付 I/O 的钱，兜底的是指令可以重来。
quiz:
  - q: 48 位虚拟地址、4 KB 页、每级 9 位时，页内偏移占几位？
    options:
      - 9 位
      - 12 位
      - 16 位
      - 36 位
    answer: 1
    explain: 4 KB = 2^12，偏移 12 位；剩下 36 位正好 4 级 × 9 位。
  - q: TLB 未命中意味着什么？
    options:
      - 进程崩溃
      - 要走一遍多级页表把翻译找出来（可达 4 次访存）
      - 从磁盘换页
      - 地址非法
    answer: 1
    explain: TLB 是翻译缓存；未命中走页表，仍找不到条目才触发缺页。
  - q: 两个进程能把同一物理页映射进各自地址空间，这带来什么好处？
    options:
      - 没好处
      - 共享库只装一份、fork 写时复制、共享内存通信
      - 地址变得更长
      - TLB 更大
    answer: 1
    explain: 共享映射是共享库、COW 与 mmap 共享内存的共同基础。
