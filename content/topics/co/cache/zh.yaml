- id: replace-write
  title: 满了淘汰谁，写了怎么办
  tldr: 组满了要淘汰一行，通常淘汰最久没用的；写数据时还要决定何时写回内存。
  body: '淘汰策略常用 LRU（最近最少使用）或它的近似：最久没碰过的，最可能以后也不用。

    写数据时，写直达是同时写缓存和内存，简单但慢；写回是只改缓存、标记为“脏”，被淘汰时才写回内存，现代 CPU 一般用写回。

    未命中可以分三类：第一次访问（冷）、容量不够、位置冲突，改进方向各不相同。'
  derivation: original
  sources:
  - ref: csapp
    locator: 第 6 章
    url: http://csapp.cs.cmu.edu/
    claim: 组满了要淘汰一行，通常淘汰最久没用的；写数据时还要决定何时写回内存。
    status: verified
