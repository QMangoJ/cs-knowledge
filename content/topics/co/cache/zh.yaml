  - id: write-alloc
    title: 写未命中：先整行搬进来再改，还是绕过缓存直接写
    tldr: 要写的地址压根不在缓存里时，现代 L1 默认采用「写分配」——先把整行读进缓存再改那几个字节；可如果是一次性大块写出且短时间不再读，绕过缓存直写内存才不至于污染热行。
    body: |-
      前面聊了写进已经在缓存里的数据，可要是程序刚要写 `b[0][0] = 1` 时发现它并不在缓存里（写未命中），硬件怎么办？这里分两条路。一条叫写分配：先把 `b[0][0]` 所在的 64 字节整行从内存读进缓存，再修改其中 4 个字节并标成脏行；之后写 `b[0][1]` 到 `b[0][15]` 时就全都命中了。现代通用 [[CPU]] 的 [[L1]] 大多把「写回」和「写分配」配成一对。另一条叫不按写分配：不在缓存里分配格子，直接把这几个字节往外层写出去，缓存里原封不动。

      怎么选只看一件事：这块数据写完之后，紧接着还会不会读或继续写同一行？如果是按行给结果矩阵赋值，写分配付一次读入门票后面连续 15 次全命中，稳赚；可如果是往几十 MB 的视频帧或日志大缓冲做一次性批量清零、写完再也不回头看，走写分配不仅凭空多出一趟整行内存读取，还会把留在 L1 里的真正热数据全挤跑——这时用专门绕过缓存的直写指令反而快得多。顺带一提，硬件还常在外面挂一个写缓冲小队列：CPU 把待写字节往队列里一丢就继续执行下条指令，只有队列塞满时才会真正停下来等。
    derivation: original
    sources:
