  - id: hit
    title: 命中：之后的访问
    tldr: 接下来访问相邻元素，数据已经在缓存里，几乎不用等。
    body: 下一个数组元素就落在刚搬回来的那一行里，这叫命中。命中时硬件先用地址的组索引定位到组，再并行比较组内每一行的标记，匹配且有效位为 1 就直接把行内偏移选出的字节送回寄存器，L1 命中通常只要约 4 个周期。对比一下，L1 未命中去 L2 约十几个周期，去 L3 约几十个周期，去主存则要上百个周期，相邻层级差数倍。顺序遍历长度为 N 的 int 数组，理想情况下每 16 个元素才有 1 次未命中，未命中率约 6%，其余 94% 都是廉价命中。反过来，如果步长是 64 字节，每个元素都落在不同行里，未命中率会直接变成 100%，同样的循环慢数倍，差别全在访问模式，不在指令条数。还有一个常被忽略的细节，命中路径上标记比较是并行做的，组内所有行的标记同时和地址高位比对，所以组相联的路数增加主要贵在比较器和多路选择器上，而不是比较次数上，这也是路数通常停在 4 到 16 之间、不再往上堆的硬件原因。
    derivation: original
    sources:
