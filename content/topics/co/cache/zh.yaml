  - id: mapping
    title: 数据放在缓存的哪里
    tldr: 命中和未命中都见过了，一个更基本的问题还没有回答：一个内存地址，到底能放进缓存的哪个位置？这一步看这条规定——地址被切成三段来定位，能放的位置先被算死，查找才可能在一个周期量级内完成。
    body: |-
      先交代一个前提，免得后面的切法显得突然：缓存的容量比内存小得多，内存里的数据不可能想放哪就放哪，必须有一条能当场算出来的规定，地址一来就知道该去哪一组找。没有这条规定，每次查找就得把整个缓存翻一遍，缓存就白建了。
      缓存不能把数据随便放，因为查找必须在一个周期量级内完成，所以每个内存地址能放的位置被地址位直接算死。地址被切成三段：低位是块内偏移，中间位是组索引，高位是标记。直接映射时组内只有 1 个位置，查得最快，但两个高频地址只要组索引相同就反复互相驱逐，这就是冲突未命中。全相联时组只有 1 个、位置任意，冲突最少，但每次要并行比较全部标记，比较器面积和功耗随容量爆炸，只适合很小的结构。实际 [[CPU]] 用组相联折中，例如 32 KB、64 字节行、8 路组相联，就有 64 组，查找只并行比 8 个标记。走例，地址的组索引是 5，它只能进第 5 组，组内 8 个位置任选空位，满了才按替换策略赶走一行。再把三段的位数算一遍：总行数 512 行、组数 64 组，组索引占 6 位，块内偏移占 6 位，剩下的高位全是标记——任何地址进来先看中间 6 位定组、再看低 6 位选字节。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 6 章
        url: http://csapp.cs.cmu.edu/
        claim: 每个内存地址只能放进缓存里固定的几个位置，这叫组相联。
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
