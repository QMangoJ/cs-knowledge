  - id: replace-write
    title: 满了淘汰谁，写了怎么办
    tldr: 位置的规定清楚了，还有两个日常问题：缓存装满了又来新数据，淘汰谁？写数据的时候，什么时候才写回内存？这一步把替换和写策略放在一起看，它们决定了缓存满了以后和数据改了以后的行为。
    body: |-
      组满了又来了新行，必须赶走一行腾位置。理想策略是赶走未来最晚才用的行，但硬件预知不了未来，只能用过去猜未来，常用 [[LRU]] 或其近似，比如用几个引用位做[[时钟算法|Clock]]。写策略分两条路线，写直达是改缓存的同时同步写内存，数据永远一致但每次写都吃内存带宽；写回是只改缓存并把脏位标成 1，等这一行被驱逐时才一次性写回，多次改写合并成一次回写，现代 [[CPU]] 的 [[L1]] 数据缓存普遍用写回。未命中按成因分三类，第一次访问的冷未命中靠预取缓解，工作集超过容量的容量未命中靠加大缓存或分块缓解，映射撞车的冲突未命中靠提高相联度缓解，三类对症下药，不能混为一谈。评估替换策略好坏要看一段真实访问序列上的总未命中率：LRU 在顺序扫描加重复访问的混合负载里表现稳定，但在纯循环扫描且工作集略大于缓存时会被一次次整轮驱逐，这类负载反而是最简单的随机替换更抗造——策略没有绝对高下，只有和访问模式的匹配。
      这里补一个正文一带而过、但经常被问的概念：什么叫脏行。写回策略下，数据先只改缓存里的副本，这时缓存里的新值和内存里的旧值不一样了，这一行的就被标记为「脏」，意思是它比内存新、淘汰时必须先写回内存，不能直接扔掉。写直达没有脏行，因为每次写都同时改了内存。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 6 章
        url: http://csapp.cs.cmu.edu/
        claim: 组满了要淘汰一行，通常淘汰最久没用的；写数据时还要决定何时写回内存。
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: cpu
          id: c
          label: CPU
        - lane: cache
          id: k
          label: 缓存
        - lane: mem
          id: m
          label: 内存
          highlight: true
      messages:
        - id: m-replace-write
          from: k
          to: m
          label: 淘汰脏行 → 写回内存
          active: true
    log:
      - mode: 淘汰
        event: 写回被替换的脏行
  - id: locality
    title: 局部性：缓存为什么有效
    tldr: 前面几步一直在说命中率高，可高命中率凭什么成立，还没有交代。这一步补上缓存全部的赌注：程序访问数据有两条规律，刚用过的很快还会再用，用了某个数据、它附近的也很快会被用。这两条规律成立，前面整行搬运才不亏。
    body: 循环里反复用的累加变量和循环计数器，体现的是时间局部性，刚访问过的数据短时间内还会再访问；顺序扫数组、顺序执行指令，体现的是空间局部性，用了某个地址，附近地址很快也会被用到。缓存的全部赌注就押在这两条经验规律上，而编译器和程序员写出的绝大多数程序都满足它们，所以实际命中率常在
      95% 以上。数字例子最有说服力，一个 2048 乘 2048 的 int 矩阵占 16 MB，远超 [[L2]]，按行求和时每行连续命中，按列求和时每走一步跳 8
      KB，不但每步都是新行，还会反复冲掉同一组，耗时可达数倍到一个数量级，具体倍数随机器实测。矩阵乘法做分块也是同理：把子块切到能整块留在缓存里反复用，未命中次数随之大降，这正是高性能库普遍分块的根本原因。再走一个能直接算的例子：一个求和循环顺序读一遍 100 万个 int，按前面算过的账，每 16 个元素才付 1 次未命中，未命中约 6 万次，其余约 94 万次访问都是廉价命中；循环里反复用的累加变量则每次都命中。命中率不是凭感觉来的，是访问模式算出来的。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 6 章
        url: http://csapp.cs.cmu.edu/
        claim: 局部性原理：时间局部性与空间局部性
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: cpu
          id: c
          label: "[[CPU]]"
        - lane: cache
          id: k
          label: 缓存
          highlight: true
        - lane: mem
          id: m
          label: 内存
      messages: []
    log:
      - mode: 命中率高
        event: 局部性让大部分访问命中
    code:
      lang: c
      code: |-
        // 行遍历：顺序命中缓存行；列遍历：每步跳一行，未命中多得多
        for (int i = 0; i < N; i++)
          for (int j = 0; j < N; j++) sum += a[i][j];   // 快
        for (int j = 0; j < N; j++)
          for (int i = 0; i < N; i++) sum += a[i][j];   // 慢（大 N 时可达数倍）
      note: 遍历顺序与局部性
  - id: lesson
    title: 对写代码的启示
    tldr: 规律讲完了，这一步落到写代码的人手里：同样的计算，换一个访问顺序，速度能差好几倍。这一步把前面几步的道理收成几条能直接用的纪律，比如数据尽量连续存放、循环顺序顺着内存的排布走。
    body: 对写代码的人，这一课的启示可以落成几条纪律。第一，数据结构优先选连续数组而不是指针串起来的链表，链表节点散落在堆上，每跳一次大概率一次未命中。第二，循环的嵌套顺序要顺着内存的存储顺序走，C
      语言里二维数组按行连续，就该让最内层循环走列下标。第三，热数据要尽量挤进更小的字节数，比如把只用到的字段拆成单独数组，让一行 64
      字节装下更多有用元素，而不是装一堆冷字段。反例也要记住，如果访问模式本身就是随机的，比如哈希表探查，缓存帮不上多少忙，这时该优化的是减少访问次数，而不是指望调整遍历顺序。结构体数组与数组结构体之争是同一件事：把每个对象的全部字段捆在一起存放，遍历时只用其中一个字段也要把整行搬进来，等于为冷字段付了带宽；把同一字段拆成独立数组存放，遍历该字段时每行装的全是有用数据——前者叫
      [[AoS]]、后者叫 [[SoA]]，游戏引擎和列式存储都在用，选哪个先看访问是整对象用还是单字段扫。
    derivation: original
