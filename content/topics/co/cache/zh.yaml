steps:
  - id: why
    title: 为什么需要缓存：算一次只要 1 周期，取一次要等三百周期
    tldr: 3 GHz 的 CPU 做一次加法只要约 0.33 ns，可去主存拿一个数要等 60 到 100 ns，相当于白白空转两三百个周期；缓存就是塞在两者之间的高速副本区，把常见取数拉回到几个周期。
    body: |-
      拿开头那段矩阵求和循环来算一笔硬件时间账。一颗 3 GHz 主频的 [[CPU]]，一个时钟周期大约只有 0.33 ns，把两个寄存器里的数加起来只要 1 个周期。可如果元素还躺在主内存里，电信号跑出去寻址、从电容里读出来再送回核心，往往要花 60 到 100 ns，折算下来足足是 180 到 300 个时钟周期。算力再猛、乱序执行铺得再宽，只要每次取数都直接找内存，CPU 九成以上的时间都在干瞪眼等数据。

      等一下，既然主存这么慢，为什么不干脆把几十 GB 内存全换成最快的那种芯片？账算在晶体管和物理尺寸上：跑得飞快的 [[SRAM]] 每个比特需要 6 颗晶体管，既贵又占芯片面积，真做大了之后连线变长、信号传过去一样变慢；便宜大容量的 [[DRAM]] 每个比特只需要 1 颗晶体管配 1 颗电容，能轻松做出几十 GB，代价就是读写迟缓。于是硬件折中出几层小而快的缓存——[[L1]]、[[L2]]、[[L3]]，像手边草稿纸、桌边书架和地下仓库一样逐级变大也逐级变慢。

      这和浏览器本地存静态资源、网站靠 [[CDN]] 把热门网页放到离用户最近的节点，或者 React 用 useMemo 留住派生计算结果，本质上是同一个买卖。只是要记住一条底层区分：缓存里放的永远是内存数据的副本，不是搬家——主存里的原件一直都在，副本改过之后怎么跟原件、跟别的核对账，后面几步会接着拆。
