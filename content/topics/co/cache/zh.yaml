  - id: hit
    title: 命中与延迟阶梯：L1 只要 4 周期，主存差出近百倍
    tldr: 紧接着读 a[0][1] 时数据已经躺在刚才搬回来的缓存行里，L1 命中只要约 4 个周期；从 L1、L2、L3 到主存，每一级漏下去延迟就跳升一个档位。
    body: |-
      循环立刻走到下一个元素 `a[0][1]`，它正躺在同一条 64 字节缓存行里。硬件先用地址中间的组索引选中那一组，再让组内每一行的标记（[[tag]]）同时跟地址高位比对——只要匹配且有效位为 1，就按偏移量抽出第 4 到第 7 字节塞回寄存器，这叫命中。在 [[L1]] 数据缓存上，整个过程只要约 4 个周期。

      等一下，组里有好几条缓存行，一条条查标记不会变慢吗？答案是组内所有行的标记比对在电路上完全并行同时发生，不靠逐条遍历。但也正因为比较器和多路选择器跟着路数成倍变胖，功耗和面积顶不住，CPU 的组相联路数通常停在 4 到 16 路之间。如果 L1 没中，请求就往外逐级漏下去：[[L2]] 命中约十几个周期，[[L3]] 约几十个周期，全漏光才掉进两三百周期的主存。回到矩阵扫描：每 16 个 `int` 只漏 1 次、其余 15 次全在 L1 命中，未命中率只有约 6%；若改成每步跳 64 字节跨行取数，每步都踩进新行，未命中率直奔 100%，指令条数没变，跑起来却慢出几倍。

      还要留一个心眼：命中仅仅表示「这一层缓存里有这个地址的格子」，不代表随便就能用旧副本。多核机器上如果另一颗核心刚改过 `a[0][0]`，本核这一行可能早已被标为失效，那就得先通过一致性协议拿回新值——这笔多核账放在后面几步算清。
