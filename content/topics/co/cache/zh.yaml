  - id: coherence
    title: 多核：缓存一致性
    tldr: 每个核心有自己的缓存，一个核心改了数据，其他核心的旧副本必须作废。
    body: 多核机器上，每个核心都有私有的 L1 和 L2，L3 则由所有核心共享，于是同一份数据可能在多个核心的私有缓存里各存一份副本。一致性协议要保证的是，任何核心读到的都不能是别人已经改掉的旧值。MESI 是经典实现，每行有四种状态，M 是已修改且独占，E 是未修改且独占，S 是多核共享只读，I 是无效。走例，核心 0 写一行时要先发出请求让其他核心把该行置为 I，自己转成 M 才能写；之后核心 1 再读这一行，核心 0 必须把最新值转给它并一起降为 S。副作用是伪共享，两个线程改的是同一行里的两个不同变量，语义上毫无关系，但协议以行为粒度工作，这一行会在两核之间反复易主，每次都要走一致性流量，性能大降，解法是把两个变量填充到不同行。数量级上记住延迟阶梯即可，L1 约 1 ns 量级，往外逐级变慢，SSD 约 10 到 100 微秒量级，从 L1 到 SSD 累计约五个数量级。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 6 章
        url: http://csapp.cs.cmu.edu/
        claim: 每个核心有自己的缓存，一个核心改了数据，其他核心的旧副本必须作废。
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
