  - id: mapping
    title: 地址怎么定位置：标记、组索引与块内偏移
    tldr: 缓存要在几个周期内找完数据，就不能让内存块随便乱放；地址会被直接切成三段，先用中间几位算死它只能住进哪一组，再用高位标记验明正身。
    body: |-
      缓存容量比内存小成千上万倍，如果内存数据可以随便塞进缓存的任意格子，那每次读 `a[0][0]` 时硬件就得把几百上千行全搜一遍，等搜完几百个周期早耗光了。所以必须定一条铁规矩：一个内存地址进来，不用查目录，光看地址本身的二进制位就能当场算出它只可能待在哪几个格子。

      怎么规定落脚点有三条路线。最死板的是直接映射：每个地址全缓存里只能住 1 个固定格子，查得最快，可一旦两个高频地址恰好算出同一个格子，就会你挤走我、我挤走你，造成本可以不发生的冲突未命中。最自由的是全相联：全缓存只有 1 组、哪都能放，绝不撞车，但每次要同时比对全部几百个标记，电路面积和耗电直接炸掉。现代 [[CPU]] 选的是折中的组相联：拿常见的 32 KB、64 字节行、8 路组相联 L1 来算，一共有 `32768 / 64 = 512` 行，每 8 行编成 1 组，共有 `512 / 8 = 64` 组。

      于是任何内存地址都会被从低到高切成三段。最低 6 位（`2⁶ = 64`）是块内偏移，负责挑 64 字节里的哪几个字节；中间 6 位（`2⁶ = 64`）是组索引，用来锁定第 0 到第 63 组里的哪一组；剩下所有高位全当标记（[[tag]]），用来辨认这个位置住的是哪个内存块。比如 `a[0][0]` 地址中间 6 位算出来是 5，那它就只能进第 5 组，在组里 8 个位置任选空位住下，硬件只需并行对比这 8 个标记——既省了比较器，又大幅压低了撞车。
    derivation: original
    sources:
