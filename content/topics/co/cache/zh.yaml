- id: lesson
  title: 对写代码的启示
  tldr: 同样的计算，访问顺序不同，速度可能差好几倍。
  body: '按行遍历二维数组（顺着内存顺序）通常比按列遍历快得多。

    数组比链表更“缓存友好”，这也是很多高性能代码偏爱连续数组的原因。

    缓存满了就要淘汰旧数据，缓存不够大时，热数据也会被挤出去。'
  derivation: original
