- id: sim-lab
  title: 动手实验：缓存模拟器
  tldr: 换不同的访问模式跑一遍，看命中率如何从 75% 掉到 0%——局部性不是口号，是数字。
  body: '实验室是一个 8 行 × 16B 块的直接映射缓存。先跑「按行扫一行」：16 次访问只有每块的第一次未命中，命中率 75%；再跑「按列扫一列」：地址每次跳 64B，不但每步都是新块，还反复挤占同一行，命中率 0%。最后「小数组重复两遍」展示时间局部性：第二遍全部命中。这就是正文里循环交换、tiling 能提速的全部秘密——亲手把数字跑出来，比看十遍结论都牢。'
  derivation: original
  sources: []
  log: []
  canvas:
    kind: lab
    lab: cache-sim
    caption: 三种访问模式 × 直接映射缓存，命中/未命中实时统计
    params:
      lines: 8
      block: 16
    cases:
    - input:
        addrs: [0, 4, 8, 12, 16, 20, 24, 28, 32, 36, 40, 44, 48, 52, 56, 60]
      expect:
        hits: 12
        misses: 4
    - input:
        addrs: [0, 64, 128, 192]
      expect:
        hits: 0
        misses: 4
- id: coherence
  title: 多核：缓存一致性
  tldr: 每个核心有自己的缓存，一个核心改了数据，其他核心的旧副本必须作废。
  body: 'L1、L2 通常每个核心私有，L3 多核共享。

    硬件用一致性协议（如 MESI）保证：一个核心写某行时，其他核心缓存里的这一行会被作废，下次读要重新取。

    副作用是“伪共享”：两个线程改的是不同变量，但它们在同一缓存行里，这一行会在核心之间来回搬，性能大降。


    具体数字：典型延迟阶梯 L1 约 1 ns、L2 约 3–4 ns、L3 约 10–20 ns、主存约 60–100 ns、SSD 则 SATA 约 100 μs、NVMe 约 10–70 μs。相邻层级差数倍，从 L1 到 SSD 累计差约五个数量级，所以推理优化先量内存带宽利用率，再谈算力。'
  derivation: original
  sources:
  - ref: csapp
    locator: 第 6 章
    url: http://csapp.cs.cmu.edu/
    claim: 每个核心有自己的缓存，一个核心改了数据，其他核心的旧副本必须作废。
    status: verified
