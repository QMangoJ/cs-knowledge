  - id: replace-write
    title: 满了淘汰谁，写了怎么办
    tldr: 组满了要淘汰一行，通常淘汰最久没用的；写数据时还要决定何时写回内存。
    body: 组满了又来了新行，必须赶走一行腾位置。理想策略是赶走未来最晚才用的行，但硬件预知不了未来，只能用过去猜未来，常用 LRU 或其近似，比如用几个引用位做时钟算法。写策略分两条路线，写直达是改缓存的同时同步写内存，数据永远一致但每次写都吃内存带宽；写回是只改缓存并把脏位标成 1，等这一行被驱逐时才一次性写回，多次改写合并成一次回写，现代 CPU 的 L1 数据缓存普遍用写回。还有一个细节是写未命中怎么办，后面的步骤会专门讲。未命中按成因分三类，第一次访问的冷未命中靠预取缓解，工作集超过容量的容量未命中靠加大缓存或分块缓解，映射撞车的冲突未命中靠提高相联度缓解，三类对症下药，不能混为一谈。补一个判断口径，评估替换策略好坏不能只看某一次驱逐选得对不对，要看一段真实访问序列上的总未命中率，LRU 在顺序扫描加重复访问的混合负载里表现稳定，但在纯循环扫描且工作集略大于缓存时会被一次次整轮驱逐，这类负载反而是最简单的随机替换更抗造，策略没有绝对高下只有和访问模式的匹配。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 6 章
        url: http://csapp.cs.cmu.edu/
        claim: 组满了要淘汰一行，通常淘汰最久没用的；写数据时还要决定何时写回内存。
        status: verified
