steps:
  - id: why
    title: 为什么需要缓存
    tldr: 先看一个最普通的场面：程序在算东西，需要的数据却躺在内存里，取一次要等两三百个周期。这一步先把这笔时间账算清楚——[[CPU]] 一次加法只要 1
      个周期，取一个数却要等几百个周期——看清落差有多大，才明白为什么要在中间塞进缓存。
    body: >-
      如果每次都去内存拿数据，CPU 大部分时间都在等待。走一组数字：一颗 3 GHz 的 CPU 一个周期约 0.33 ns，一次主存访问约 60 到 100 ns，相当于 180 到 300 个周期白白空转。也就是说，CPU 算 1 次加法只要 1 个周期，取 1 个操作数却要等几百个周期，算力再强也会被访存饿死。于是在 CPU 和内存之间塞进几层小而快的 [[SRAM]]
      缓存，存放最近用过的数据副本，命中时几个周期就能返回。这和网站用 [[CDN]] 把热门内容推到边缘节点是同一个思路，区别只是这里的距离用纳秒计、副本一致性由硬件协议兜底。缓存不是锦上添花，而是现代 CPU
      能跑满主频的前提，没有它，多发射和乱序执行攒下的并行度都会被访存延迟吃光。

      补一句这里没有展开、但后面会一直用到的区分：缓存里存的是内存数据的副本，不是搬家。内存里的原件一直都在，缓存只是把副本放在手边；副本和原件不一致怎么办，是本课最后讲多核一致性时要回答的问题。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 6 章
        url: http://csapp.cs.cmu.edu/
        claim: 存储层次结构中越靠近 CPU 越快越小
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: cpu
          id: c
          label: CPU
          highlight: true
        - lane: cache
          id: k
          label: 缓存
        - lane: mem
          id: m
          label: 内存
      messages:
        - id: m-why
          from: c
          to: m
          label: 去内存取数据：很慢
          active: true
    log:
      - mode: 等待
        event: CPU 等待内存
    points:
      - CPU 算得极快，但从内存取一次数据要等两三百个周期。
  - id: miss
    title: 未命中：第一次访问
    tldr: 落差看清了，接着看缓存第一次被用到的样子。程序第一次访问数组开头，缓存里什么都没有，这一步看这次未命中是怎么处理的：不是只取用到的那几个字节，而是把一整行相邻数据一起搬回来，后面的访问能不能占到便宜，就看这一步。
    body: 第一次访问数组开头，缓存里没有这块数据，这叫未命中，也叫冷未命中。[[CPU]] 只能向内存发出请求，但它不会只取用到的那 4 个字节，而是把该地址所在的整个缓存行一起搬回来，x86-64 上通常是 64
      字节，也就是连续 16 个 int。原因是总线和内存颗粒本来就适合成批连续传数据，一次搬一整行的成本并不比只搬几个字节高多少，而且程序大概率马上要用邻居。代价是这一次访问要付完整的内存延迟，约两三百个周期；收益是后面 15
      个相邻元素的访问全部变成命中。判断一段代码快不快，先数它触发多少次这种整行搬运，再看搬回来之后到底用上了多少：未命中次数乘以行大小就是实际从内存搬运的字节数。再补一个可检验的推论：把数组元素从 4 字节的
      int 换成 64 字节的结构体后，每行只装得下 1 个元素，顺序遍历的未命中率会从约十六分之一恶化到接近
      100%——元素大小和行大小的比值直接决定空间局部性能兑现多少分，是设计热点数据结构时最该先算的一笔账。
    derivation: original
    sources:
      - ref: cs61c
        locator: Caches 相关讲义
        url: https://cs61c.org/
        claim: 未命中时以缓存块为单位从下层读入
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: cpu
          id: c
          label: CPU
        - lane: cache
          id: k
          label: 缓存
        - lane: mem
          id: m
          label: 内存
          highlight: true
      messages:
