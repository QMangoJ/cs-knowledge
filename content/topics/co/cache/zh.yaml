objectives:
  - 按地址拆出标记/组索引/块内偏移
  - 用时间与空间局部性解释命中率
  - 解释为什么按行遍历比按列遍历快几倍
aiLink: 单请求或小批量解码时，推理性能的第一瓶颈往往是内存带宽而不是算力：权重以几十 GB 流过缓存与 HBM，KV Cache 的布局、算子的分块（tiling）本质都是在伺候缓存局部性。这一课是读懂所有推理性能分析的钥匙。
quiz:
  - q: 缓存行（cache line）64 字节意味着？
    options:
      - 每次只能读 64 个数
      - 取 1 字节会把所在 64 字节整行搬进缓存，空间局部性由此而来
      - 缓存总共 64 字节
      - 地址是 64 位
    answer: 1
    explain: 整行搬运让顺序访问几乎免费命中、随机访问的未命中率则大增。
  - q: 按列遍历大矩阵比按行慢，主要是？
    options:
      - 编译器问题
      - 相邻元素跨了很多缓存行，空间局部性差、未命中暴增
      - CPU 不支持按列
      - 内存损坏
    answer: 1
    explain: 行优先存储下同行元素连续；按列每走一步跳一整行。
  - q: 直接映射缓存的冲突未命中来自？
    options:
      - 容量不够
      - 多个地址映射到同一个位置，只能互相挤掉
      - 程序写错
      - TLB 未命中
    answer: 1
    explain: 提高相联度就是给同一组多几个位置，代价是硬件更复杂。
design:
  - mechanism: 缓存以 64 字节缓存行为最小搬运与命中判定单位，而不是按单个字节从主存零散取数。
    problem: 每次找主存拿数都有几十纳秒的固定启动延迟，只搬用到的 4 字节既白费大部分总线周期，又丢掉了紧挨着马上要用的相邻元素，后面次次都要重新交门票。
    choice: 宁可多搬一点，顺手把整个 64 字节缓存行拉进缓存，让顺序扫描每 16 个 int 只需交 1 次未命中门票，未命中率摊薄到约十六分之一。
    tradeoff: 行越大摊薄越狠，可一旦遇到随机跳转，搬回来的大半字节全用不上，既占内存带宽又把有用的热行挤出去——因此行大小卡在几十字节左右，不会做到几 KB。
    root: 根源在于程序天然具备空间局部性，叠加上 DRAM 突发传输的物理特性，整行搬运的期望收益远大于浪费，且超过百字节后边际收益开始转负。
  - mechanism: 存储层级从寄存器、L1、L2、L3 到主存逐级变大也逐级变慢，每一级都在替上一级兜底。
    problem: 物理上造不出一块既能几个周期返回、又能装下几十 MB 的单级缓存：SRAM 面积一做大，连线拉长加上并排比较器变重，读取延迟自己就拖慢了。
    choice: 按容量和速度分成三级台阶，用几十 KB、4 周期返回的 L1 挡住八九成访问，漏网的一小撮再依次交给更大的 L2 和 L3 接住，让平均访存延迟牢牢贴近 L1。
    tradeoff: 层数一多，副本就到处都有，硬件必须额外操心包含策略、淘汰联动以及多核下的 MESI 一致性状态机，芯片设计和验证复杂度大涨。
    root: 根源是芯片面积与连线延迟的物理约束，加上程序访问的高度局部性——只有用小缓存接住高频访问、大缓存兜底低频访问，平均时间才能同时享受到快和便宜。
  - mechanism: 缓存对软件透明，硬件全自动负责搬运、替换和一致性，程序员只能通过数据排布与访问顺序间接影响它。
    problem: 如果逼着每段业务代码显式管理「哪个数组放 L1 哪一行」，代码没法写，换台缓存大小不同的电脑也直接跑不通。
    choice: 把管理权收归硬件自动运转，软件只需要尽量写出连续紧凑的局部性访问：访问越规律硬件越给力，随机跳转则自动退化成接近主存的慢速。
    tradeoff: 透明让人看不到成本，同样算矩阵求和，换个循环顺序就能慢出几倍，程序员必须心里有缓存行和伪共享这本账，才排查得清这种性能悬崖。
    root: 根源是抽象层与物理延迟的张力：软件抽象藏起了硬件缓存细节，却藏不住 L1 与主存差近百倍的延迟鸿沟，顺着物理规律排数据因此成为必修课。
