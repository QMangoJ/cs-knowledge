  - id: write-alloc
    title: 写未命中：写分配还是不按写分配
    tldr: 前面讲的写策略管的是写命中时怎么办，还漏了一种情况：要写的数据根本不在缓存里。这一步补上它——先把整行搬进来再改，还是绕过缓存直接写内存，两种做法各有适合的场面，判断只看这块数据接下来还用不用。
    body: 写操作也会未命中，[[CPU]]
      写一个地址时发现它不在缓存里，这时有两条路线。写分配是先把该行从内存整行读进来再改其中几个字节，好处是后续对同一行的读写都能命中，适合写完马上还要读、或者总是成片写的场景，现代通用 CPU 的 [[L1]]
      大多采用写分配。不按写分配则绕过缓存直接写内存，缓存里不留副本，适合流式写出再也不回头看的数据，比如一次性写出大块结果，把它灌进缓存只会把热数据挤走。要注意写分配的代价，那次整行读入本身就是一次未命中的内存往返，如果程序只写其中
      4 字节就再也不碰，这笔搬运纯属浪费。还有一个配套机制是写缓冲：CPU
      把待写数据先丢进一个小队列就继续执行，队列满了才会真正停顿。判断写未命中先问这块数据接下来还用不用：用就写分配划算，不用就直达绕过更划算。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 6 章
        url: http://csapp.cs.cmu.edu/
        claim: 写未命中时的写分配与不按写分配策略
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
