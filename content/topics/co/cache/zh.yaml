level: 进阶
minutes: 30
prereq:
  - co/instruction-cycle
objectives:
  - 按地址拆出标记/组索引/块内偏移
  - 用时间与空间局部性解释命中率
  - 解释为什么按行遍历比按列遍历快几倍
aiLink: 单请求或小批量解码时，推理性能的第一瓶颈往往是内存带宽而不是算力：权重以几十 GB 流过缓存与 HBM，KV Cache 的布局、算子的分块（tiling）本质都是在伺候缓存局部性。这一课是读懂所有推理性能分析的钥匙。
quiz:
  - q: 缓存行（cache line）64 字节意味着？
    options:
      - 每次只能读 64 个数
      - 取 1 字节会把所在 64 字节整行搬进缓存，空间局部性由此而来
      - 缓存总共 64 字节
      - 地址是 64 位
    answer: 1
    explain: 整行搬运让顺序访问几乎免费命中、随机访问的未命中率则大增。
  - q: 按列遍历大矩阵比按行慢，主要是？
    options:
      - 编译器问题
      - 相邻元素跨了很多缓存行，空间局部性差、未命中暴增
      - CPU 不支持按列
      - 内存损坏
    answer: 1
    explain: 行优先存储下同行元素连续；按列每走一步跳一整行。
  - q: 直接映射缓存的冲突未命中来自？
    options:
      - 容量不够
      - 多个地址映射到同一个位置，只能互相挤掉
      - 程序写错
      - TLB 未命中
    answer: 1
    explain: 提高相联度就是给同一组多几个位置，代价是硬件更复杂。
design:
  - mechanism: 缓存行以几十字节为单位整行搬运，x86-64 上通常 64 字节，命中判断也以行为粒度而不是字节。
    problem: 总线每次传输都有固定开销，只传用到的 4 字节既浪费带宽，又放弃了相邻数据马上会被用到的空间局部性，白白多付后续未命中。
    choice: 宁可多传，把整个 64 字节行一次搬齐，让顺序访问里每 16 个 int 只付 1 次未命中，未命中率被行大小直接摊薄到约十六分之一
    tradeoff: 行越大摊薄越狠，但随机访问时搬回的大部分字节永远用不上，污染缓存又耗带宽，所以行大小停在几十字节这个量级而不是几 KB。
    root: 根源是程序访问的空间局部性统计规律加上 DRAM 突发传输的物理特性，两者共同决定了整行搬运的期望收益为正且边际收益递减。
  - mechanism: 存储层次分多级，寄存器、L1、L2、L3 到主存逐级变大变慢，每一级都是上一级的缓存。
    problem: 单级缓存无法同时满足又快又大，SRAM 单元面积大，做大后连线变长、比较器变多，查找延迟随容量上升，一级大缓存会慢到失去意义
    choice: 分级妥协，L1 小到能在一个周期量级返回，靠极高命中率兜底，漏下的少量访问再由更大的 L2 和 L3 接住，平均延迟仍接近 L1
    tradeoff: 分级带来数据重复存放、包含策略和一致性协议的复杂度，多核下还要维护 MESI 这类状态机，硬件面积和验证成本都显著上升。
    root: 根源是物理账，SRAM 延迟随容量和连线长度增长而内存便宜但慢，只有按命中率把访问量逐级过滤，才能让平均访存时间逼近最快一级
  - mechanism: 缓存对软件基本透明，硬件自动搬运、淘汰和维护一致性，程序员只能通过数据布局间接影响它。
    problem: 如果让软件显式管理每一块数据的存放位置，编程模型会复杂到不可用，而且不同机器容量不同，写死的布局无法移植。
    choice: 硬件全自动管理，软件侧只提供局部性这个输入，访问模式越规律硬件越能发挥，随机访问则自动退化为接近内存的速度。
    tradeoff: 透明的代价是性能不可控，同样的算法换个遍历顺序能差数倍，程序员必须理解缓存才能解释和消除这类非直观的性能悬崖。
    root: 根源是抽象与性能的经典张力，透明抽象隐藏了硬件细节，却隐藏不了延迟差五个数量级这个物理事实，局部性因此成为必修课。
