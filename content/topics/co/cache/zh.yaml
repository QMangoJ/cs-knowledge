  - id: lesson
    title: 对写代码的启示
    tldr: 同样的计算，访问顺序不同，速度可能差好几倍。
    body: 对写代码的人，这一课的启示可以落成几条可执行纪律。第一，数据结构优先选连续数组而不是指针串起来的链表，链表节点散落在堆上，每跳一次大概率一次未命中。第二，循环的嵌套顺序要顺着内存的存储顺序走，C 语言里二维数组按行连续，就该让最内层循环走列下标。第三，热数据要尽量挤进更小的字节数，比如把只用到的字段拆成单独数组，让一行 64 字节装下更多有用元素，而不是装一堆冷字段。第四，工作集超过缓存时用分块把问题切小，让每一块在被换出前被反复使用。反例也要记住，如果访问模式本身就是随机的，比如哈希表探查，缓存帮不上多少忙，这时该优化的是减少访问次数，而不是指望调整遍历顺序。还有一个立竿见影的例子是结构体数组与数组结构体之争，把每个对象的全部字段捆在一起存放，遍历时只用其中一个字段也要把整行搬进来，等于为冷字段付了带宽，把同一字段拆成独立数组存放，遍历该字段时每行装的全是有用数据，游戏引擎和列式存储都在用这招，前者叫 AoS、后者叫 SoA，选哪个先看访问是整对象用还是单字段扫。
    derivation: original
