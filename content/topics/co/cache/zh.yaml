  - id: multilevel
    title: 多级缓存与包含策略：L1、L2、L3 怎么配合
    tldr: 单个缓存既做不到 L1 那么快又做不到 L3 那么大，于是叠出三级结构；L3 常充当包含层或目录，帮多核挡住不必要的跨核询问，免得每次都去敲每颗核私有的 L1。
    body: |-
      学到这里很容易冒出一个直觉反问：既然 [[L1]] 只要 4 个周期，干脆花钱把 L1 直接做成 32 MB 不就全解决了吗？物理规律不允许：[[SRAM]] 容量一大，芯片连线变长、组内多路选择变沉，信号跑一个来回的延迟立刻从 4 个周期飙到几十个周期，超大 L1 本身就成了慢缓存。唯一办法就是分级配合：几十 KB、4 周期直达的 L1 挡在最前头；漏下的少量请求交给几百 KB 到几 MB 的 [[L2]]；再漏下的由多核共享、几十 MB 的 [[L3]] 接住，最后才去主存。整体平均延迟因此牢牢贴近最快的那一级。

      这三层谁包着谁，有两种流派。包含策略要求下层装着上层的全部行（比如 L3 包含 L1 和 L2 的所有行）：好处是当核心 1 在总线上打听「`x` 在不在别人手里」时，只要查一下共享的 L3 就能过滤掉无关核心，不必打扰每颗核的私有 L1；而且 L3 要淘汰某行时，可以顺手通知 L1 一起作废，一致性管得最顺。排斥策略则让每份数据只待在其中一层，腾出更大等效容量，但追踪行踪更费劲。现实处理器多取折中：让 L3 尽量保持包含或挂一张目录表追踪每行被哪些核缓存，L2 和 L1 之间则相对宽松，既保住容量又控住了多核通信开销。
    derivation: original
    sources:
