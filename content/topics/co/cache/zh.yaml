- id: mapping
  title: 数据放在缓存的哪里
  tldr: 每个内存地址只能放进缓存里固定的几个位置，这叫组相联。
  body: '最简单的是直接映射：每个地址只有一个固定位置，查得快，但两个常用地址撞到同一位置就会互相挤掉（冲突未命中）。

    全相联可以放任意位置，冲突最少，但查找要比较所有位置，硬件太贵。

    实际 CPU 折中用“组相联”：地址先决定放哪一组，组内若干个位置任选，查找时只比这一组。'
  derivation: original
  sources:
  - ref: csapp
    locator: 第 6 章
    url: http://csapp.cs.cmu.edu/
    claim: 每个内存地址只能放进缓存里固定的几个位置，这叫组相联。
    status: verified
