  - id: mesi-states
    title: MESI 状态机：多核改同一行时怎么彼此传话
    tldr: 多颗核心各自私有一份 L1 缓存时，MESI 给每一行贴上 M、E、S、I 四种状态；任何核心想修改共享行，都必须先发广播让其他核心的旧副本作废。
    body: |-
      前面聊的都是单核，现在把矩阵求和拆给两颗核心一起算。每颗核都有自己私有的 [[L1]]，同一个变量 `x` 可能同时被两颗核各自缓存一份。核心 0 要是悄悄把 `x` 改成了 10，怎么保证核心 1 不会一直蒙在鼓里继续读旧值 0？硬件靠一套 [[MESI]] 状态机管这件事，给每条缓存行贴四个字母标签：M（Modified，我独享且改脏了，比内存新）、E（Exclusive，只我有这一份，和内存一样干净）、S（Shared，大家手里都有，只读别乱改）、I（Invalid，我手里这份已经作废了）。

      跟着变量 `x` 的一次生命周期走一遍状态流转最直观。起初只有核心 0 读了 `x`，全芯片别处都没有，核心 0 这一行处于 E（独占干净）。接着核心 1 也来读 `x`：总线广播读请求，核心 0 听到后把自己的状态降成 S（共享），两核各拿一份只读副本，状态都是 S。现在核心 1 要执行 `x = 10` 写入了——等一下，为什么它不能直接改自己手里的 S？因为要是直接改，核心 0 那个 S 还是旧值 0，两核对同一份内存看到了不同结果！所以核心 1 必须先在总线上发一条作废通知，等核心 0 把它的副本标成 I（无效）之后，核心 1 才把自己的行升成 M（独占脏）并写下 10，此时内存里依然还是旧值。此后核心 0 再想读 `x` 发现自己是 I，只好重新请求，核心 1 把最新的 10 转交过去，两边又回到 S。

      盯死这个状态转换里最烧通信的一步：只要从 S 往 M 写一次，就必定付一趟让别人标成 I 的跨核通告代价。反过来，只读不写的常量数据人人安安静静待在 S 状态，零通信流量——这也直接埋下了后面要讲的多核伪共享陷阱。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 6 章、第 12 章
