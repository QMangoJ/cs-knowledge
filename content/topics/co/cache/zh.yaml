  - id: sim-lab
    title: 动手实验：缓存模拟器
    tldr: 道理都讲完，这一步动手验证：实验室里是一个小缓存，换三种访问模式各跑一遍，看命中率怎么从 75% 掉到 0%。局部性到底是不是真的，看数字比听结论可靠。
    body: 实验室是一个 8 行、每块 16 字节的直接映射缓存，三个预置用例把局部性变成了可数的数字。先跑按行扫一行：16 次访问里只有每块的第一次未命中，命中率 75%，因为一块 16 字节正好装 4 个
      int，空间局部性把后面 3 次都救成了命中。再跑按列扫一列，地址每次跳 64 字节，不但每一步都是新块，而且这些地址的组索引反复落在同一行上互相驱逐，命中率直接掉到
      0%，这就是冲突未命中和空间局部性缺失叠加的最坏情况。最后跑小数组重复两遍，第一遍是冷未命中，第二遍全部命中，展示时间局部性。可以自己改地址序列验证两个预测，把步长从 4 字节改成 16 字节，命中率应从
      75% 掉到 0%，因为每个元素独占一块；再把块大小的直觉换成真实机器的 64 字节，就能估算真实循环的未命中率。这就是循环交换和分块能提速的全部秘密。
    derivation: original
    sources: []
    log: []
    canvas:
      kind: lab
      lab: cache-sim
      caption: 三种访问模式 × 直接映射缓存，命中/未命中实时统计
      params:
        lines: 8
        block: 16
      cases:
