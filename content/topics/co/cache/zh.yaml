steps:
- id: why
  title: 为什么需要缓存
  tldr: CPU 算得极快，但从内存取一次数据要等上百个周期。
  body: '如果每次都去内存拿数据，CPU 大部分时间都在等待。

    于是在 CPU 和内存之间放了几层小而快的缓存，存放最近用过的数据。

    这和网站用 CDN 的思路一样：把常用内容放得离用户近一点。'
  derivation: original
  sources:
  - ref: csapp
    locator: 第 6 章
    url: http://csapp.cs.cmu.edu/
    claim: 存储层次结构中越靠近 CPU 越快越小
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
