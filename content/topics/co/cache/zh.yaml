id: co/cache
subject: co
slug: cache
order: 4
status: published
license: CC-BY-4.0
title: 缓存：命中、未命中与局部性
summary: 内存比 CPU 慢太多，CPU 用小而快的缓存记住最近用过的数据。
premise: 以一个程序遍历数组为例。
position: >-
  它单独撑起「存储层次与缓存」板块，接在流水线访存级动不动就停等的现实后面：寄存器再快，也得等主存把数组元素送到嘴边。学完你能按地址切开标记、组索引与块内偏移，也能讲明白按行遍历数组为何比按列快几倍——答案藏在 64 字节缓存行的整行搬运里。
bridge:
  prev: >-
    上一课流水线的访存级最怕等数据，本课便追到它等的那一端，拆解 L1 到主存这条逐级变大变慢的存储层次。
  next: >-
    数据从缓存取回终究要被函数使用，下一课就翻开一次 main 调用 add 的栈帧，看参数、返回地址与局部变量在栈上如何排布。
overview:
  - key: 一句话总结
    value: 常用的数据放离 CPU 近的地方；局部性让这招非常有效
  - key: 层级
    value: 寄存器 → L1 → L2 → L3 → 内存，越往外越大越慢
  - key: 缓存行
    value: 每次搬一小块相邻数据（x86-64 上通常 64 字节），而不是一个字节
  - key: 局部性
    value: 时间局部性（刚用过的还会用）、空间局部性（用了这个，附近的也会用）
  - key: 类比
    value: 浏览器 HTTP 缓存、CDN、React 的 useMemo
  - key: 映射方式
    value: 直接映射、组相联（最常用）、全相联
  - key: 替换
    value: LRU 或其近似
  - key: 写策略
    value: 写回（标记脏行）与写直达
  - key: 未命中三类
    value: 冷未命中、容量未命中、冲突未命中
  - key: 一致性
    value: 多核用 MESI 类协议；注意伪共享
  - key: 在终端里看一看
    value: lscpu | grep -i cache　看本机各级缓存大小
