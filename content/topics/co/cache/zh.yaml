  - id: mesi-states
    title: 一致性协议的状态机怎么转
    tldr: 前面讲的都是一颗核心自己的缓存，多核还没有登场。这一步先把多核一致性协议 [[MESI]]
      当成一台状态机走一遍例子：一个变量所在的行在两个核心之间怎么变状态。走完这遍例子，下一歩讲多核为什么会莫名变慢才有依据。
    body: >-
      先把场面和前提摆好：现在有两颗核心，各有自己的 [[L1]] 缓存，同一个变量可以同时被两颗核心缓存。问题是，一颗核心改了它，另一颗手里那份怎么办？MESI
      给每一行缓存定了四种状态，用状态的变化来回答这个问题，这一步就跟着一个变量走一遍状态怎么变。

      把 MESI 当成一台状态机来走例最清楚：设变量 x 所在的行起初只在核心 0 的缓存里且未被改过，状态是 E 独占干净。核心 1 读 x，总线广播读请求，核心 0 把状态降为
      S，两核各持一份只读副本。接着核心 1 要写 x，它必须先发出升级请求，让核心 0 的副本变 I，自己升为 M 独占脏，写完内存里仍是旧值，只有核心 1 的副本是新值。此后核心 0 再读 x，核心 1
      要把行转交过去，两边回到 S，必要时把脏数据刷回下层。关键点是任何从 S 到 M 的写都要付一次让别人失效的通信代价，这正是伪共享贵的根源：两个变量同行时每次写都触发这套流程。对比之下，只读共享的数据人人都是
      S，零额外流量，所以把频繁写的变量各自独占一行、把只读数据放心共享。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 6 章、第 12 章
        url: http://csapp.cs.cmu.edu/
        claim: MESI 协议的状态与状态迁移
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: cpu
          id: c
          label: "[[CPU]]"
          highlight: true
        - lane: cache
          id: k
          label: 缓存
        - lane: mem
          id: m
          label: 内存
      messages:
        - id: m-mesi
          from: c
          to: k
          label: 写共享行 → 他核置 I，自升 M
          active: true
    log:
      - mode: 状态迁移
        event: S 经失效升为 M
  - id: multilevel
    title: 多级缓存与包含策略
    tldr: 状态机走过了，再看层级之间的一件事：[[L1]]、[[L2]]、[[L3]] 不是各存各的，它们之间要约定谁包含谁。这一步看这个约定怎么定查找的路径——一层没有再查下一层——以及下层淘汰一行时上层怎么办。
    body: 多级缓存之间有个包含关系的约定。包含策略要求下层装着上层的全部行，比如 L2 包含 L1 的所有行，好处是别的核心来问某行在不在时，只查 L3 或 L2 就能过滤，不必打扰每个核心的
      L1，而且下层驱逐一行时可以顺带让上层失效，一致性好维护；代价是同一份数据在多层重复存放，浪费了有效容量。排斥策略则让各层尽量不重复，同一行只存在于其中一层，等效容量更大，但管理和失效逻辑更复杂。现实里常见混合做法，L3 做成包含或近似包含，兼当一份记录每个缓存行被哪些核心缓存着的目录，L2 与 L1 之间则相对宽松。查找就是 L1 未命中查 L2、L2 未命中查 L3、L3 再未命中才去内存，平均访存时间是各级命中率和延迟的加权和。设计题里问为什么不把
      L1 直接做大，答案也在这里：单级大缓存的查找延迟会被连线和比较器拖长，分级是用命中率换延迟的唯一现实解。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 6 章
        url: http://csapp.cs.cmu.edu/
        claim: 多级缓存的包含与排斥策略
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
