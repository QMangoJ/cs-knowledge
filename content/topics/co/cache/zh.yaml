  - id: replace-write
    title: 满了淘汰谁，写了何时回内存
    tldr: 一组 8 个位置全占满时，硬件通常用近似 LRU 赶走最久没用的那一行；写数据时 L1 普遍采用写回——先只改缓存并标成脏行，等被赶走时才一次性刷回内存。
    body: |-
      第 5 组的 8 个位置都住满了，第 9 个同组地址又挤进来时，必须踢走一行腾地方。最理想的做法是踢走「未来最晚才会再用到」的那一行，但硬件不会算命，只能用过去猜未来——踢走最久没被访问的那一行，也就是 [[LRU]]。真在硬件里给 8 路精确排先后顺序代价不小，CPU 往往改用近似算法，比如给每行挂几个引用位轮转的[[时钟算法|Clock]]。有意思的是 LRU 也有失灵的时候：如果循环反复扫一个刚好比缓存大一丁点的数组，每趟末尾都会把下一趟开头马上要用的旧行整轮挤光，命中率跌成 0，反而是最简单的随机替换偶尔能留下几行。

      如果程序不只读数组，还要顺手写一句 `a[0][0] = 42` 呢？写命中分两条路。写直达每次改缓存时同步写穿到内存，两头永远一样，简单但次次写都吃内存带宽。写回则只改缓存里的这 64 字节，再把该行的「脏位」翻成 1。所谓脏行，就是缓存里的副本已经比内存里的新了，踢走它之前必须先把这一整行写回内存，不能直接丢掉。现代 [[CPU]] 的 [[L1]] 数据缓存几乎清一色采用写回，这样循环里对着同一个变量或同一行连改十几次，最后只需回写内存一次。

      顺便把所有的未命中收成一张三栏故障单：第一次访问必交的门票叫冷未命中，靠预取来遮；工作集实在大于缓存容量叫容量未命中，靠放大缓存或把计算分块来解；容量明明绰绰有余、偏偏几个地址全挤到同一组互相踢出叫冲突未命中，靠提高相联度或避开整齐的 2 的幂跨步来解。
    derivation: original
    sources:
