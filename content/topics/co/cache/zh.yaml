      code: |-
        // 行遍历：顺序命中缓存行；列遍历：每步跳一行，未命中多得多
        for (int i = 0; i < N; i++)
          for (int j = 0; j < N; j++) sum += a[i][j];   // 快
        for (int j = 0; j < N; j++)
          for (int i = 0; i < N; i++) sum += a[i][j];   // 慢（大 N 时可达数倍）
      note: 遍历顺序与局部性
  - id: lesson
    title: 缓存友好编码：数据结构紧凑、热字段成组存放
    tldr: 同样算一遍数据，连续数组天然吊打东一块西一块的链表；只扫个别热点字段时，把同一字段拆成独立数组（SoA）能让一条 64 字节行全装满有效数据。
    body: |-
      把局部性原理翻译成写代码的三条实用纪律。第一，数据结构优先选连续数组，慎用满堆指针串起来的链表或松散对象图。链表节点分散在内存各处，顺着指针每跳一步大概率就要交一次两三百周期的未命中，而数组一口气就把 16 个整数塞进了同一条缓存行。第二，多层循环的内层下标永远顺着内存连续排布的那一维跑。

      第三条是高手最常优化的布局账：把冷热字段拆开，别让不用的字段蹭带宽。假设你要遍历十万个粒子只更新坐标 `x`：若写成结构体数组（[[AoS]]），每个粒子 64 字节里混着名字、颜色、状态等一堆这趟根本不看的冷字段，搬回来一整行却只算了 4 字节的 `x`，剩下 60 字节全白搬；若把所有 `x` 单独抽成一条连续数组（[[SoA]]），同样搬一次 64 字节，里面装的全是紧挨着的 16 个 `x`，有效内存带宽直接翻十几倍——游戏引擎和列式存储库快的秘密就在这里。

      当然也有缓存帮不上忙的边界：如果工作本身就是随机跳着查——比如大哈希表查随机键、或者大图的随机节点跳转——怎么调顺序也没法把邻居变成顺路。这时别再幻想调整循环，真正该做的是减少总访问次数、批量预取，或把节点体积压小让更多热点留在 [[L3]] 里。
    derivation: original
    sources:
