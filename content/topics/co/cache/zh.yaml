  - id: hit
    title: 命中：之后的访问
    tldr: 整行搬回来了，下一步自然要看占便宜的样子：接着访问相邻的元素，数据已经躺在缓存里。这一步把命中的过程走一遍，并把每一层缓存的等待时间排在一起比，好看清顺序遍历为什么快。
    body: |-
      下一个数组元素就落在刚搬回来的那一行里，这叫命中。命中时硬件先用地址的组索引定位到组，再并行比较组内每一行的标记，匹配且有效位为 1 就直接把行内偏移选出的字节送回寄存器，[[L1]] 命中通常只要约 4 个周期。对比一下：L1 未命中去 [[L2]] 约十几个周期，去 [[L3]] 约几十个周期，去主存则要两三百个周期，相邻层级差数倍。顺序遍历长度为 N 的 int 数组，理想情况下每 16 个元素才有 1 次未命中，未命中率约 6%，其余 94% 都是廉价命中。反过来，如果步长是 64 字节，每个元素都落在不同行里，未命中率会直接变成 100%，同样的循环慢数倍，差别全在访问模式，不在指令条数。注意，命中路径上标记比较是并行做的：组内所有行的标记同时和地址高位比对，所以路数增加主要贵在比较器和多路选择器上，而不是比较次数上——这也是路数通常停在 4 到 16 之间、不再往上堆的硬件原因。
      再补一个容易混的点：命中说的只是「数据在这一层找到了」，不是「数据是对的」。多核下别的核心刚改过同一份数据时，本核这一行可能已经作废，那不算命中，要按协议先去拿新值——那是本课最后一致性那一步的事，这里先只管单核的快慢。
    derivation: original
    sources:
      - ref: cs61c
        locator: Caches 相关讲义
        url: https://cs61c.org/
        claim: 命中时直接从缓存返回数据
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
