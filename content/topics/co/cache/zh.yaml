  - id: locality
    title: 局部性揭晓答案：按行求和为什么比按列快几倍
    tldr: 缓存命中率常在 95% 以上，靠的不是硬件会预测，而是程序自带时间与空间局部性；2048×2048 矩阵按行访问连续吃满 64 字节行，按列访问每次跳 8 KB 几乎步步未命中。
    body: |-
      前面一直在看缓存怎么省时间，可要是代码每次访问的地址全像抽盲盒一样满天飞，整行搬运纯属白忙。缓存敢把身家性命全押上去，靠的是两条几乎所有正常程序都遵守的局部性规律。第一条叫时间局部性：刚用过的数据短时间内还会再用，比如矩阵求和循环里反复读写的累加器 `sum` 和下标 `i`、`j`，几乎永远留在寄存器或 L1 里。第二条叫空间局部性：用了某个地址，它紧挨着的邻居马上会被用到，比如顺序扫描一行连续数组。

      现在把开头那个 `N = 2048` 的 `int` 矩阵 `a[i][j]` 的账算透。整张矩阵占 `2048 × 2048 × 4 = 16 MB`，远超常见的几百 KB [[L2]] 缓存，不可能全塞进去。C 语言二维数组按行挨着存放：按行遍历（内层循环走 `j`）时，`a[i][0]` 付一次冷未命中搬回 64 字节，紧接着 `a[i][1]` 到 `a[i][15]` 全在 L1 命中；算完一百万个 `int`，大约只付 6 万多次未命中、剩下 94 万次全是命中。换成按列遍历（内层循环走 `i`）后，从 `a[0][0]` 跳到 `a[1][0]` 一下子跨过 `2048 × 4 = 8192` 字节（8 KB），每一次加法都踩进全新的缓存行；更糟的是 8 KB 刚好是 2 的幂，很多地址的低位组索引全部撞进同一组里互相驱逐，于是几乎次次等内存，耗时轻松慢出数倍甚至一个数量级。

      哪怕有些运算（比如矩阵乘法）没法两张表都同时按行扫，高性能库也有对策：把大矩阵切成一个个能整块放进 L1 或 L2 的小方块（分块，tiling），先把手里这小块反复算透再换下一块，同样能把未命中次数压低好几倍。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 6 章
        url: http://csapp.cs.cmu.edu/
        claim: 局部性原理：时间局部性与空间局部性
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
