  - id: sim-lab
    title: 动手实验：亲眼看命中率从 75% 掉到 0%
    tldr: 右侧是一个 8 行、每块 16 字节的直接映射缓存；跑完步长 4 字节和步长 64 字节两组地址序列，就能看见空间局部性和冲突未命中怎样把命中率从 75% 直接打成 0%。
    body: |-
      实验室里是一台缩微版直接映射缓存：一共 8 行，每行只装 16 字节（恰好装下 4 个 4 字节的 `int`），总容量 128 字节。先跑第一组预置用例，对应按行顺序扫描 16 个整数（`0, 4, 8, ..., 60`）：访问地址 `0` 时发生冷未命中，硬件把 `0..15` 这一整块搬进第 0 行；紧接着读 `4、8、12` 全部直接命中；读 `16` 时再搬第 1 块 `16..31`。16 次访问下来一共只有 4 次未命中、12 次命中，命中率稳稳停在 75%。

      再切到第二组用例，对应按列跨步跳着读（`0, 64, 128, 192`）：每块 16 字节装 1 个元素后，步长 64 字节每次都踩进新块，一次空间局部性都沾不到；更惨的是这里只有 8 行（`8 × 16 = 128` 字节一圈），地址 `0` 和 `128`、`64` 和 `192` 还会撞回同一行反复踢出对方。最终 4 次访问 0 次命中，命中率摔成 0%。自己动手把步长从 4 改成 16，验证命中率是不是同样跌到 0%；或者把 `[0, 4, 8, 12]` 连跑两遍，看第二遍怎样靠时间局部性拿满 100% 命中。
