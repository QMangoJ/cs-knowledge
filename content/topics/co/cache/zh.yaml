  - id: coherence
    title: 多核一致性收尾：提防伪共享，并记住存储延迟全景
    tldr: MESI 绝不允许两颗核看到不一致的旧值，但协议以 64 字节整行为粒度干活——两个无关计数器若挤在同一条缓存行里各自高频写入，也会把两颗核拖入反复失效的死循环。
    body: |-
      多核场景的最后一块拼图，是把前面走的 [[MESI]] 状态机收成一个工程警报。两颗核各自帮 2048×2048 矩阵算左半边和右半边的和，核心 0 只改 `sum_left`，核心 1 只改 `sum_right`，代码上井水不犯河水。可要是这两个 4 字节变量声明挨在一起，凑巧挤进了同一条 64 字节缓存行，灾难就来了：核心 0 改完 `sum_left` 把整行升成 M 并把核心 1 标成 I；下一拍核心 1 写 `sum_right`，又把核心 0 标成 I。没有任何业务共享，两颗核却像抢同一支笔一样反复把整行转来转去，跑得比单核还慢——这就是伪共享。解法很干脆：用填充字节或对齐指令把高频写的共享邻变量隔开，让它们各自独占一条 64 字节行；只读数据则放心拼在一起共享。

      顺手把整个存储阶梯的真实延迟尺度记牢：[[L1]] 命中大约 1 ns 量级，主存 DRAM 约 60 到 100 ns；再往下落到磁盘一侧的 [[SSD]]，早期 SATA 时代（经典 Jeff Dean 延迟数字表流传的那一版口径）读一次大约 100 到 150 微秒，如今主流 NVMe 盘 4K 随机读实测中位数已经降到约 35 到 55 微秒，快了约两三倍。从 L1 到 SSD，速度落差累计四到五个数量级。

      最后带走排查缓存性能的三问自检，写热点循环前先对着问一遍：第一问「搬进一行到底用上几个字节」——数据结构够不够紧凑、循环下标有没有顺着连续内存扫；第二问「有没有整齐撞进同一组」——跨步是不是正好落在 2 的大次幂（比如按列跳 8 KB）引起冲突未命中；第三问「多线程写没写同一条 64 字节行」——高并发累加器有没有紧挨着住一起触发伪共享。答清这三问，缓存这关你就摸透了。
