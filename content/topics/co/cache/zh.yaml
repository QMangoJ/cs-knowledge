- id: hit
  title: 命中：之后的访问
  tldr: 接下来访问相邻元素，数据已经在缓存里，几乎不用等。
  body: '下一个数组元素就在刚搬来的那块里，这叫“命中”。

    命中只需要几个周期，比去内存快几十倍。

    顺序遍历数组时，绝大部分访问都能命中。'
  derivation: original
