        event: CPU 等待内存
    points:
      - CPU 算得极快，但从内存取一次数据要等上百个周期。
  - id: miss
    title: 未命中：第一次访问
    tldr: 数据不在缓存里，只能去内存取，顺便把一整块搬进缓存。
    body: 第一次访问数组开头，缓存里没有这块数据，这叫未命中，也叫冷未命中，因为这块数据从未被装进来过。CPU 只能向内存发出请求，但它不会只取用到的那 4 个字节，而是把该地址所在的整个缓存行一起搬回来，x86-64 上通常是 64 字节，也就是连续 16 个 int。原因是总线和内存颗粒本来就以突发方式成批传数据更划算，而且程序大概率马上要用邻居。代价是这一次访问要付完整的内存延迟，约上百个周期；收益是后面 15 个相邻元素的访问全部变成命中。判断一段代码快不快，先数它触发多少次这种整行搬运，再看搬回来之后到底用上了多少，这正是空间局部性的量化方式，未命中次数乘以行大小就是实际从内存搬运的字节数。再补一个可检验的推论，把数组元素从 4 字节的 int 换成 64 字节的结构体后，每行只装得下 1 个元素，顺序遍历的未命中率会从约十六分之一恶化到接近 100%，元素大小和行大小的比值直接决定空间局部性能兑现多少分，这个比值是设计热点数据结构时最该先算的一笔账。
    derivation: original
    sources:
      - ref: cs61c
        locator: Caches 相关讲义
        url: https://cs61c.org/
        claim: 未命中时以缓存块为单位从下层读入
        status: verified
