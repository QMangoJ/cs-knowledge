- id: miss
  title: 未命中：第一次访问
  tldr: 数据不在缓存里，只能去内存取，顺便把一整块搬进缓存。
  body: '第一次访问数组开头，缓存里没有，这叫“未命中”。

    CPU 去内存取数据，但不是只拿一个元素，而是把相邻的一整块（缓存行）一起搬回来。

    这次很慢，但为后面的访问铺好了路。'
  derivation: original
  sources:
  - ref: cs61c
    locator: Caches 相关讲义
    url: https://cs61c.org/
