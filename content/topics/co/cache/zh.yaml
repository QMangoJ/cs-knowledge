- id: locality
  title: 局部性：缓存为什么有效
  tldr: 程序访问数据有规律：刚用过的还会再用，用了这个附近的也会用。
  body: '循环里反复用的变量体现了“时间局部性”，顺序访问数组体现了“空间局部性”。

    缓存正是赌这两点，而大多数程序都满足，所以命中率通常很高。

    反过来，在内存里到处乱跳的访问（比如很长的链表），会让缓存频繁失效。


    数字例子：大矩阵按行求和与按列求和的差距可达数倍到一个数量级（具体倍数随矩阵大小与机器实测，没有固定值）。矩阵乘法做 tiling（分块让子块留在片上存储层级里）同理，这是包括 cuBLAS 在内的分块策略存在的原因之一。'
  derivation: original
  sources:
  - ref: csapp
    locator: 第 6 章
    url: http://csapp.cs.cmu.edu/
    claim: 局部性原理：时间局部性与空间局部性
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
