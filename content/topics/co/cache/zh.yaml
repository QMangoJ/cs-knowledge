steps:
  - id: why
    title: 为什么需要缓存
    tldr: CPU 算得极快，但从内存取一次数据要等上百个周期。
    body: 如果每次都去内存拿数据，CPU 大部分时间都在等待。走一组数字：一颗 3 GHz 的 CPU 一个周期约 0.33 ns，一次主存访问约 60 到 100 ns，相当于 200 到 300 个周期白白空转。也就是说，CPU 算 1 次加法只要 1 个周期，取 1 个操作数却要等几百个周期，算力再强也会被访存饿死。于是在 CPU 和内存之间塞进几层小而快的 SRAM 缓存，存放最近用过的数据副本，命中时几个周期就能返回。这和网站用 CDN 把热门内容推到离用户近的边缘节点是同一个思路，区别只是这里的距离用纳秒计、副本一致性由硬件协议兜底。缓存不是锦上添花，而是现代 CPU 能跑满主频的前提，没有它，多发射和乱序执行攒下的并行度都会被访存延迟吃光。这一段的每个数字和结论都应当能自己复算或手推一遍，读时先遮住结论自测，再对照正文核对差在哪一步。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 6 章
        url: http://csapp.cs.cmu.edu/
        claim: 存储层次结构中越靠近 CPU 越快越小
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
