id: co/cache
subject: co
slug: cache
order: 4
status: published
license: CC-BY-4.0
title: 缓存：命中、未命中与局部性
summary: 内存比 [[CPU]] 慢太多，CPU 用小而快的缓存记住最近用过的数据。
premise: CPU 算得飞快，可去内存取一次数据要等两三百个周期，照这个速度，再强的 CPU 也会被内存拖住。缓存就是为了解决这个落差，本课以一个程序遍历数组为例，看数据怎样被提前搬到离 CPU 近的地方。
position: 它单独撑起「存储层次与缓存」板块，接在流水线访存级动不动就停等的现实后面：寄存器再快，也得等主存把数组元素送到嘴边。学完你能按地址切开标记、组索引与块内偏移，也能讲明白按行遍历数组为何比按列快几倍——答案藏在
  64 字节缓存行的整行搬运里。
bridge:
  prev: 上一课流水线的访存级最怕等数据，本课便追到它等的那一端，拆解 L1 到主存这条逐级变大变慢的存储层次。
  next: 数据从缓存取回终究要被函数使用，下一课就翻开一次 main 调用 add 的栈帧，看参数、返回地址与局部变量在栈上如何排布。
overview:
  - key: 一句话总结
    value: 缓存的办法是把常用的数据放在离 [[CPU]] 近的地方，寄存器、[[L1]]、[[L2]]、[[L3]] 一层比一层大也一层比一层慢。它能有效，全靠程序访问数据的局部性，刚用过的和它附近的数据马上还会再用。
  - key: 层级
    value: 存储层级从近到远是寄存器、L1、L2、L3 再到内存，越往外容量越大、速度越慢。找数据时先查最近的一层，没有再往外一层层找，找到内存就是最慢的一档了。
  - key: 缓存行
    value: 缓存每次搬运的是一小块相邻数据，叫缓存行，x86-64 上通常是 64 字节，而不是一个字节一个字节地搬。这样你访问数组的一个元素时，它后面一串元素顺带就被搬进来了。
  - key: 局部性
    value: 局部性有两种，时间局部性是刚用过的数据很快还会再用，空间局部性是用了某个数据，它附近的数据也会被用。循环里反复读同一个变量是前者，顺序遍历数组是后者。
  - key: 类比
    value: 浏览器把下过的资源存本地、下次直接用（[[HTTP]] 缓存），网站把热门内容推到离用户近的节点（[[CDN]]），React
      把算过的结果存下来复用（useMemo）——都是把常用结果放在手边，免得每次重取重算
  - key: 映射方式
    value: 一个内存地址能放进缓存的哪些位置，有三种规定，直接映射只能放一个固定位置，组相联可以放一组里的任意一行，全相联哪儿都能放。组相联在成本和冲突之间最均衡，所以最常用。
  - key: 替换
    value: 缓存组满了又要装新数据时，通常淘汰最久没被用过的那一行，这就是 [[LRU]] 或它的近似算法。
  - key: 写策略
    value: 写数据时有两种策略，写回是先只改缓存里的副本并标记为脏行，等这一行被淘汰时再写回内存。写直达是每次写都同时写进内存，简单可靠但慢一些。
  - key: 未命中三类
    value: 未命中分三类，冷未命中是第一次访问必然出现，容量未命中是缓存实在装不下，冲突未命中是数据互相挤占了同一组位置。分析程序为什么慢时，先分清是哪一类，才能对症下药。
  - key: 一致性
    value: 多核下每个核心有自己的缓存，同一个数据的多个副本要保持一致，靠的是 [[MESI]] 这类协议。还要小心伪共享，两个变量明明无关，只因为同住一个缓存行，也会让两个核心互相拖累。
  - key: 在终端里看一看
    value: lscpu | grep -i cache　看本机各级缓存大小
