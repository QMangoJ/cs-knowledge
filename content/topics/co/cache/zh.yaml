  - id: prefetch
    title: 预取：把未命中藏起来
    tldr: 与其等未命中发生，不如提前把马上要用的行搬进来，让延迟和计算重叠。
    body: 预取的思路是预测，既然顺序访问时下一个行地址几乎必然是当前行加 64，那就趁 CPU 还在算这一行时，提前把下一行甚至下两行从内存搬进来。硬件预取器会观察未命中的地址序列，发现固定步长就自动沿着步长往前跑，步长为 0 的重复访问、步长为 64 的顺序扫、甚至跨页的固定步长都能识别。预取不改变命中和未命中的计数口径，它改变的是代价，未命中如果提前几百个周期就发起了，等指令真正用到数据时行已经到了，停顿被计算盖住。预取也有翻车的时候，预测错了会白白占用内存带宽，还可能把真正有用的行挤出缓存，所以硬件预取通常只往空位或低优先级位置放。软件预取指令则把判断交给程序员或编译器，在循环里提前若干次迭代发出预取。边界情况是随机访问，比如图遍历的邻居表，地址毫无规律，预取器无从下手，这时只能靠减少访问次数或改数据布局，预取不是万能药。
    derivation: original
    sources:
      - ref: cs61c
        locator: Caches 相关讲义
        url: https://cs61c.org/
        claim: 硬件预取利用固定步长提前装入缓存行
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
