  - id: miss
    title: 冷未命中：只取一个 int，为什么搬回一整行 64 字节
    tldr: 第一次读矩阵开头 a[0][0] 时缓存里空空如也，必须花两三百个周期去内存拿，这叫冷未命中；但硬件不会只搬你要的 4 字节，而是顺手把相邻的 64 字节整行拉回来。
    body: |-
      程序刚开始跑求和循环，第一下伸手要 `a[0][0]`，缓存里还没见过这块内存，扑了个空，这叫未命中，更准确地说是冷未命中（第一次访问，谁来都躲不过）。[[CPU]] 只能付一笔两三百周期的延迟去主存拿数。但主存发快递不按字节零卖，而是按固定块打包，在 [[x86-64]] 机器上这一整块通常是 64 字节，叫做一条[[缓存行]]。

      为什么要多此一举一次搬 64 字节，难道不怕占地方？因为内存颗粒和总线天生擅长成批突发传输，一次搬 64 字节只比单拿 4 字节多一点点尾款，大头全耗在最初的寻址启动上；而且程序十有八九马上就要用到隔壁的数据。一个 `int` 占 4 字节，一条 64 字节的缓存行正好塞进连续 16 个 `int`（`a[0][0]` 到 `a[0][15]`）。第一下硬扛完冷未命中，后面连续 15 个元素就全躺在缓存里白捡便宜了。

      顺手就能算出一条衡量循环效率的硬账：把数组元素从 4 字节的 `int` 换成 64 字节的大结构体后，一条缓存行只能装下 1 个元素，顺序遍历的未命中率会立刻从约十六分之一（6%）恶化到接近 100%。未命中次数乘以 64 字节，才是程序真正从内存总线拖回来的总流量。
