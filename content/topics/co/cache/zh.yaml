            misses: 4
  - id: coherence
    title: 多核：缓存一致性
    tldr: 实验里是单颗核心，最后一步回到多核的完整图景：每个核心都有自己的缓存，同一份数据可能同时躺在好几个核心手里。这一步收尾看一致性协议要保证什么，以及一个容易踩的坑——两个不相干的变量只因为同住一行，也会让两个核心互相拖累。
    body: |-
      先说清这一步和前面 [[MESI]] 那一步的分工：那一步是把状态迁移走例，这一步是把多核一致性这件事整体收尾——协议到底保证什么、保证不到什么、以及伪共享这个副作用是从哪来的。场面还是两颗核心同时缓存同一份数据。
      多核机器上，每个核心都有私有的 [[L1]] 和 [[L2]]，[[L3]] 则由所有核心共享，于是同一份数据可能在多个核心的私有缓存里各存一份副本。一致性协议要保证的是，任何核心读到的都不能是别人已经改掉的旧值。MESI 是经典实现，每行有四种状态，M 是已修改且独占，E 是未修改且独占，S 是多核共享只读，I 是无效。走例，核心 0 写一行时要先发出请求让其他核心把该行置为 I，自己转成 M 才能写；之后核心 1 再读这一行，核心 0 必须把最新值转给它并一起降为 S。副作用是伪共享：两个线程改的是同一行里的两个不同变量，语义上毫无关系，但协议以行为粒度工作，这一行会在两核之间反复易主，每次都要走一致性流量，性能大降，解法是把两个变量填充到不同行。数量级上记住延迟阶梯即可：L1 约 1 ns 量级；[[SSD]] 的读延迟有两个版本的数，老版本是 SATA 时代的约 100 微秒，经典的 Jeff Dean 延迟数字表用的就是它（流传版本写 100 到 150 微秒），现行版本是主流 NVMe 盘 4K 随机读实测中位数约 35 到 55 微秒——接口从 SATA 换成 NVMe、闪存也换了代，快了约两到三倍，平时按现行数算。从 L1 到 SSD，累计差了约一万到十万倍。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 6 章
        url: http://csapp.cs.cmu.edu/
        claim: 每个核心有自己的缓存，一个核心改了数据，其他核心的旧副本必须作废。
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
