          label: CPU
        - lane: cache
          id: k
          label: 缓存
        - lane: mem
          id: m
          label: 内存
          highlight: true
      messages:
        - id: m-prefetch
          from: m
          to: k
          label: 提前搬入下一行
          active: true
    log:
      - mode: 预取
        event: 下一行提前进入缓存
  - id: mesi-states
    title: 一致性协议的状态机怎么转
    tldr: 把 MESI 的状态迁移走一遍例子，才算真懂多核为什么有时会莫名变慢。
    body: 把 MESI 当成一台状态机来走例最清楚。设变量 x 所在的行起初只在核心 0 的缓存里且未被改过，状态是 E 独占干净。核心 1 读 x，总线广播读请求，核心 0 把状态降为 S，两核各持一份只读副本。接着核心 1 要写 x，它必须先发出升级请求，让核心 0 的副本变 I，自己升为 M 独占脏，写完内存里仍是旧值，只有核心 1 的副本是新值。此后核心 0 再读 x，核心 1 要把行转交过去，两边回到 S，必要时把脏数据刷回下层。关键点是任何从 S 到 M 的写都要付一次让别人失效的通信代价，这正是伪共享贵的根源，两个变量同行时每次写都触发这套流程。对比之下，只读共享的数据人人都是 S，零额外流量，所以把频繁写的变量各自独占一行、把只读数据放心共享，是多线程调优里最基础的一对动作。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 6 章、第 12 章
        url: http://csapp.cs.cmu.edu/
        claim: MESI 协议的状态与状态迁移
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: cpu
          id: c
          label: CPU
          highlight: true
        - lane: cache
          id: k
          label: 缓存
        - lane: mem
          id: m
          label: 内存
      messages:
        - id: m-mesi
          from: c
          to: k
          label: 写共享行 → 他核置 I，自升 M
          active: true
    log:
      - mode: 状态迁移
        event: S 经失效升为 M
  - id: multilevel
    title: 多级缓存与包含策略
    tldr: L1、L2、L3 之间还要约定谁包含谁，这决定了查找和失效的路径。
    body: 多级缓存之间有个包含关系的约定。包含策略要求下层装着上层的全部行，比如 L2 包含 L1 的所有行，好处是别的核心来问某行在不在时，只查 L3 或 L2 就能过滤，不必打扰每个核心的 L1，而且下层驱逐一行时可以顺带让上层失效，保证一致性好维护，代价是同一份数据在多层重复存放，浪费了有效容量。排斥策略则让各层尽量不重复，同一行只存在于其中一层，等效容量更大，但管理和失效逻辑更复杂。现实里常见混合做法，L3 做成包含或近似包含兼当一致性目录，L2 与 L1 之间则相对宽松。走一个查找例子，L1 未命中查 L2，L2 未命中查 L3，L3 再未命中才去内存，每多查一级多付那一级的延迟，所以平均访存时间是各级命中率和延迟的加权和。设计题里问为什么不把 L1 直接做大，答案也在这里，单级大缓存的查找延迟会被连线和比较器拖长，分级是用命中率换延迟的唯一现实解。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 6 章
        url: http://csapp.cs.cmu.edu/
        claim: 多级缓存的包含与排斥策略
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: cpu
          id: c
          label: CPU
        - lane: cache
          id: k
          label: 缓存
          highlight: true
        - lane: mem
          id: m
          label: 内存
      messages:
        - id: m-multilevel
          from: k
          to: m
          label: 逐级查找 L1 → L2 → L3 → 内存
          active: true
    log:
      - mode: 多级查找
        event: 逐级未命中才到内存
  - id: sim-lab
    title: 动手实验：缓存模拟器
    tldr: 换不同的访问模式跑一遍，看命中率如何从 75% 掉到 0%——局部性不是口号，是数字。
    body: 实验室是一个 8 行、每块 16 字节的直接映射缓存，三个预置用例把局部性变成了可数的数字。先跑按行扫一行，16 次访问里只有每块的第一次未命中，命中率 75%，因为一块 16 字节正好装 4 个 int，空间局部性把后面 3 次都救成了命中。再跑按列扫一列，地址每次跳 64 字节，不但每一步都是新块，而且这些地址的组索引反复落在同一行上互相驱逐，命中率直接掉到 0%，这就是冲突未命中和空间局部性缺失叠加的最坏情况。最后跑小数组重复两遍，第一遍是冷未命中，第二遍全部命中，展示时间局部性。可以自己改地址序列验证两个预测，把步长从 4 字节改成 16 字节，命中率应从 75% 掉到 0%，因为每个元素独占一块；再把块大小的直觉换成真实机器的 64 字节，就能估算真实循环的未命中率。这就是正文里循环交换和分块能提速的全部秘密，把数字亲手跑出来，比背十遍结论都牢。
    derivation: original
    sources: []
    log: []
    canvas:
      kind: lab
      lab: cache-sim
      caption: 三种访问模式 × 直接映射缓存，命中/未命中实时统计
      params:
        lines: 8
