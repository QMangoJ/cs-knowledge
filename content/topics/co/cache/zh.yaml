  - id: locality
    title: 局部性：缓存为什么有效
    tldr: 程序访问数据有规律：刚用过的还会再用，用了这个附近的也会用。
    body: 循环里反复用的累加变量和循环计数器，体现的是时间局部性，刚访问过的数据短时间内还会再访问；顺序扫数组、顺序执行指令，体现的是空间局部性，用了某个地址，附近地址很快也会被用到。缓存的全部赌注就押在这两条经验规律上，而编译器和程序员写出的绝大多数程序都满足它们，所以实际命中率常在 95% 以上。数字例子最有说服力，一个 2048 乘 2048 的 int 矩阵占 16 MB，远超 L2，按行求和时每行连续命中，按列求和时每走一步跳 8 KB，不但每步都是新行，还会反复冲掉同一组，耗时可达数倍到一个数量级，具体倍数随机器实测。矩阵乘法做分块也是同理，把子块切到能整块留在缓存里反复用，未命中次数随之大降，这正是高性能库普遍分块的根本原因。这一段的每个数字和结论都应当能自己复算或手推一遍，读时先遮住结论自测，再对照正文核对差在哪一步。
    derivation: original
    sources:
