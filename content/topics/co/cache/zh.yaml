id: co/cache
subject: co
slug: cache
order: 4
status: published
license: CC-BY-4.0
title: 缓存：命中、未命中与局部性
summary: 算力快、内存慢是硬件绕不开的落差，CPU 靠中间几层小而快的缓存把常用数据留到近处，才不至于大部分时间白等。缓存能扛住九成以上的访问，押的是两条经验规律——刚用过的数据和它挨着的邻居马上还会再用。全课从时间差算账出发，走完地址切段定位、组满淘汰与写回、局部性算例、写未命中与预取，再落到多核 MESI 一致性与伪共享。
premise: 你写了两段逻辑完全一样的 C 代码，都在给一个 2048×2048 的整数矩阵求和：按行从左往右加跑得飞快，按列从上往下加却慢出好几倍。指令条数明明分毫不差，按列算到底把时间等在了哪里？这一课就拿这个矩阵求和当标本，追清数据怎样被整行拉到 CPU 手边，又在什么时候帮不上忙。
position: 本课独自撑起「存储层次与缓存」板块，紧接在指令流水线后面：上一课流水线一碰到取数就容易卡壳，这一课便追到它苦等的另一端，拆开从 [[L1]] 缓存到主存这一级级变大也变慢的存储阶梯。只有先看懂数据是怎么成行搬进 CPU 的，下一课讲函数调用在栈上落位、局部变量为什么跑得快，才算把硬件底账对上。
bridge:
  prev: 上一课里，指令流水线在访存这一级最怕等数据卡住；这一课就顺着这条等待往外看，拆解数据怎么从慢吞吞的主存一路搬到寄存器手边。
  next: 数据成行搬进缓存后，终究要交给具体的函数来用；下一课就翻开一次函数调用，看看参数、返回地址和局部变量在栈上是怎么一块块摆开的。
overview:
  - key: 一句话总结
    value: 缓存把常用数据副本留在离 [[CPU]] 更近的地方，寄存器、[[L1]]、[[L2]]、[[L3]] 一层比一层大，也一层比一层慢。它之所以管用，全靠程序访问的局部性——刚用过的数据，以及挨着它的数据，马上还会再用到。
  - key: 层级
    value: 存储层级从近到远是寄存器、L1、L2、L3 再到内存，越往外容量越大、延迟越高。取数时先查最近的一层，没找到再逐级往外问，一直漏到内存就是最慢的一档。
  - key: 缓存行
    value: 缓存搬运数据不是一个字节一个字节零售，而是一次拉一整块相邻字节，叫缓存行（x86-64 上通常是 64 字节）。访问数组第一个元素时，后面顺带的 15 个 int 也跟着进了缓存。
  - key: 局部性
    value: 局部性分时间与空间两种：循环里反复读同一个累加变量，是时间局部性；顺序扫描一整行数组，是空间局部性。绝大多数业务代码都天然带着这两条规律。
  - key: 类比
    value: 浏览器把下过的静态资源存本地（[[HTTP]] 缓存）、网站把热门内容推到边缘节点（[[CDN]]）、React 用 useMemo 记下算过的结果——思路和硬件缓存完全一样，都是把热点留到顺手的位置。
  - key: 映射方式
    value: 内存地址能放进缓存的哪几个格子，有直接映射（只能放 1 个固定格子）、全相联（哪都能放）和组相联（先算定组号，组内任意挑空位）三种规矩。组相联在速度和少冲突之间最划算，是现代 CPU 的标准做法。
  - key: 替换
    value: 一组位置全占满又来了新数据时，通常淘汰组里最久没被用过的那一行，即 [[LRU]] 或接近它的硬件近似算法。
  - key: 写策略
    value: 写命中分两条路：写回只先改缓存里的副本并标成脏行，等这一行被淘汰时再统一写回内存；写直达每次写都同步改内存，省事但吃带宽。
  - key: 未命中三类
    value: 未命中按成因分三类：第一次访问必付的冷未命中、缓存实在装不下工作集的容量未命中、以及几个地址老撞进同一组互相挤掉的冲突未命中。定位性能问题要先分清是哪一类。
  - key: 一致性
    value: 多核下每颗核心有自己的私有 L1/L2，同一行数据可能躺着多份副本，靠 [[MESI]] 这类协议保证大家总能看到最新值。还要提防伪共享：两个变量业务上毫无关系，只因凑巧挤进同一条 64 字节缓存行，也会让两颗核互相拖慢。
  - key: 在终端里看一看
    value: lscpu | grep -i cache　看本机各级缓存大小
