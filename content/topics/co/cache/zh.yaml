  - id: prefetch
    title: 预取：趁 CPU 算这一行，提前把下一行搬进来
    tldr: 只要访问模式有固定步长，硬件预取器就会趁 CPU 还在算当前这一行时提前向内存要下一行，把两三百个周期的等待藏进计算时间里，但遇到随机跳跃就彻底无能为力。
    body: |-
      回到按行求和循环：虽然每 16 个整数只有 1 次冷未命中，但那一次毕竟还要等两三百周期，能不能连这 1 次也别等？这就是预取干的活。硬件预取器像一个站在缓存门口观察规律的小助理，一旦嗅到你连续几次未命中的地址稳稳地按 `+64` 往前走（哪怕是固定大跨步，甚至跨越内存页边界），不等程序真的读到下一行，它就已经提前向内存发出请求，把下两行甚至下四行悄悄拉回来了。

      这里有个常被误解的地方：预取并没有减少「原本不在缓存里」的次数，它偷走的是等待时间——因为读请求提前两三百周期就发了出去，等循环真的走到 `a[i][16]` 时，那一行刚好已经落地，CPU 不用傻等，停顿完全被前面的算术掩盖掉了。当然预取器也有猜错的时候：要是循环突然结束或分叉，提前搬回来的行会白吃内存带宽，还可能顶掉有用的热行，所以硬件往往只敢把预取数据先塞进低优先级缓冲。软件层面也能插预取指令，让程序员在链表跳跃前提前几步提醒硬件去取下一跳；但如果是图遍历那种完全无规律的随机地址，预取器根本猜不出下一步去哪，只能老实减访问次数。
    derivation: original
    sources:
