  - id: data
    title: 数据冒险：要用的结果还没算出来
    tldr: 后一条指令需要前一条的结果，可那条还没写回。
    body: 数据冒险源于结果还没就绪就被要用。按读写先后分三类，真依赖是先写后读即 RAW，前一条算出 x 后一条要用 x，是程序语义决定的真链条，只能转发或等；先读后写 WAR 和先写后写 WAW 是名字复用造成的假依赖，顺序流水线里不会出问题，乱序执行里靠寄存器重命名把假依赖消除，只留下真依赖这条关键链。转发是主力解法，前一条在执行级一算出结果，就通过旁路网络直接送到后一条执行级的输入，不必等写回再读寄存器，大部分 RAW 停顿由此消掉。走时空图，add 算出 x3 后紧跟的 sub 要用它，无转发要等 add 走到写回拍，有转发在 add 的执行级结束就能接上，一拍不差。唯独 load-use 救不了，load 的数据要访存级结束才出现，而下一条的执行级紧挨着，只差半拍也来不及，必须插入一个气泡停一拍。所以编译器会刻意把 load 和使用它的指令拉开距离，中间塞独立指令填坑，这叫指令调度，是 -O2 里实打实的优化手段。
    derivation: original
    sources:
