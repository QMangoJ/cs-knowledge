- id: superscalar
  title: 现代 CPU：多发射与乱序执行
  tldr: 现代 CPU 每个周期能发射多条指令，还会打乱顺序先做已经准备好的。
  body: '超标量：CPU 有好几套运算单元，一个周期可以同时开始几条互不相干的指令。

    乱序执行：前面一条在等内存时，后面不依赖它的指令先做，最后再按原顺序“提交”结果，所以程序看到的效果和顺序执行一样。

    能并行多少，取决于指令之间的依赖：一长串彼此依赖的计算，再强的 CPU 也只能一步步来。


    工程注记：想亲眼看停顿，可以用 perf stat 比较同一程序在分支可预测/不可预测输入下的 cycles 与 branch-misses；不可预测版本慢出的部分主要来自预测失败的冲刷（结合 branch-misses 计数一起看，别把缓存等因素的账也算进来）。'
  derivation: original
  sources:
