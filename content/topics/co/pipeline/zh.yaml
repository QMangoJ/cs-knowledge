  - id: forwarding-paths
    title: 转发细节：看产生级和消费级相差几拍
    tldr: 判断两条有依赖的指令到底停不停、停几拍，不用死背组合——只需比对结果在哪个阶段末产生、下一条在哪个阶段初要用：没晚于使用拍就零停顿，晚一拍就停一拍。
    body: |-
      转发网络本质是在流水级之间多拉几根旁路线，并按结果产生和消费的时间差决定要不要插气泡。第一条主力旁路是 [[EX]] 到 EX：前一条加法在执行级末尾算出结果，通过多路选择器直接送进紧邻下一条的执行级输入端，下个时钟沿正好接上，停顿 0 拍。第二条旁路是 [[MEM]] 到 EX：前面提过的 lw 要到访存级末尾才拿到数，虽然硬件也拉了回接执行级的线，但下一条指令在时间上早了整整一拍，所以紧挨着的 [[load-use]] 必须插 1 个气泡退后一拍才接得住（隔一条以上的指令就能零停顿直接用）。

      再看一条不用额外拉线的配合：如果前一条在第 5 拍写回（[[WB]]）、后面第 4 条指令恰好在同一拍译码读寄存器（[[ID]]），靠寄存器堆「前半拍写、后半拍读」的时序约定就能无缝交接，同样 0 停顿。唯独碰上多周期运算（如除法、开方），在第一个 EX 拍里结果根本还没算完，任何旁路电线都变不出还没存在的值，只能靠调度别的独立指令来填空白。
    derivation: original
    sources:
      - ref: cs61c
        locator: 流水线冒险相关讲义
        url: https://cs61c.org/
        claim: 转发路径按结果产生级与使用级的时序决定停顿
        status: verified
