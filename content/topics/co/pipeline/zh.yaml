  - id: pipe-lab
    title: 动手实验：画时空图数气泡，验证转发省下几拍
    tldr: 拿开篇的三条 RISC-V 指令做实测：无依赖理想情况 7 拍跑完，关闭转发要 11 拍（插 4 个气泡），打开转发只需 8 拍——剩下的 1 个气泡就是躲不掉的 load-use 停顿。
    body: |-
      右边的时空图实验室里，每一行对应一条指令（lw x1, 0(x2)、add x3, x1, x4、sub x5, x3, x6），每一列是一个时钟周期，格子里标出指令当前处在 [[IF]]、[[ID]]、[[EX]]、[[MEM]]、[[WB]] 哪一拍，空格子就是停顿气泡。理想无依赖时第 1 条第 5 拍完成，后面每拍接 1 条，共 5 + 2 = 7 拍；可现实里三条指令首尾相接，先把转发关掉，add 必须等 lw 在第 5 拍写回才能读到 x1（停 2 拍），sub 又得等 add 写回 x3（再停 2 拍），总耗时膨胀到 11 拍、整整停了 4 拍。

      现在点开实验里的转发开关，观察气泡去留：add 算出的 x3 通过 EX→EX 旁路直接喂给 sub，sub 那 2 个气泡当场清零；但 lw 的 x1 要到第 4 拍 MEM 末才出来，add 最早第 5 拍才能进 EX，这 1 个 [[load-use]] 气泡在原理上消不掉，于是总共 8 拍。你也可以想象在 lw 和 add 之间插进一条无关指令：那 1 拍空白立刻被填满——编译器开优化后做指令调度、甚至把循环展开让多轮迭代交错排班，干的就是这件事。
    derivation: original
    sources:
      - ref: cs61c
        locator: Pipelining / Hazards 讲义
