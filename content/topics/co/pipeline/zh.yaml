- id: structural
  title: 结构冒险：抢同一个硬件
  tldr: 两条指令同一时刻要用同一块电路，就得有一条等。
  body: '比如取指和访存都要访问内存，同时发生就会冲突。

    解决办法是多准备一份硬件，例如把指令缓存和数据缓存分开。

    这和前端限制并发请求数类似：资源不够时就得排队。'
  derivation: original
  sources:
  - ref: cs61c
    locator: 流水线冒险相关讲义
    url: https://cs61c.org/
    claim: 结构冒险由硬件资源冲突引起
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
  canvas:
    kind: swimlane
    actors:
    - lane: pipe
      id: p
      label: 流水线
    - lane: ctl
      id: c
      label: 冒险检测
      highlight: true
    - lane: mem
      id: m
      label: 寄存器与内存
    messages:
    - id: m-structural
      from: c
      to: p
      label: 资源冲突：一条指令等待
