  - id: data
    title: 数据冒险：用转发绕过写回，唯独 load-use 还要停一拍
    tldr: 后一条指令急着要用前一条刚算出的结果，不必傻等写回寄存器，直接拉一条旁路电线「转发」过来即可；唯独 [[load-use]] 差了一整拍，有转发也得停一拍。
    body: |-
      先说清为什么能「不写回就直接用」：假如有两条紧挨着的算术指令，add x3, x1, x4 刚在执行级（[[EX]]）算完 x3，下一条 sub x5, x3, x6 下一拍进 EX 就要读它。其实 x3 的新值在 add 的 EX 末尾就已经存在硬件输出锁存器里了，两拍之后的写回（[[WB]]）只是把它归档进寄存器堆而已。[[CPU]] 拉一条旁路把刚算好的结果直接送到下一条 EX 的输入端，这就是转发——本来要干等两拍的真依赖（先写后读 [[RAW]]），瞬间变成零停顿。

      可换成本课开头右边代码框里的组合，转发就救不全了：lw x1, 0(x2) 要到访存级（[[MEM]]）结束才从数据缓存拿到 x1，而紧跟其后的 add x3, x1, x4 这时已经走到 EX 了，结果不可能倒流回过去，这就是 [[load-use]] 冒险。即便打开转发，add 也必须插入 1 个气泡停顿一拍，等 lw 走出 MEM 再接住数据。编译器开 -O2 时会做「指令调度」，刻意往 lw 和 add 中间塞一条无关指令填掉这个气泡；至于名字复用造成的假依赖（[[WAR]]、[[WAW]]），下一步把三类依赖拆开比对。
    derivation: original
    sources:
      - ref: cs61c
        locator: 流水线冒险相关讲义
        url: https://cs61c.org/
        claim: 数据冒险可通过转发或暂停解决
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
