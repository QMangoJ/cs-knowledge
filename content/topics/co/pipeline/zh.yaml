title: 流水线和冒险：让 CPU 同时处理多条指令
summary: 把指令执行拆成几个阶段并叠起来做，速度大增，但也带来“冒险”。
premise: 沿用五阶段模型，看几条指令在流水线里怎样前后衔接。
overview:
  - key: 一句话总结
    value: 流水线提高吞吐量，冒险会打断它，CPU 用转发、暂停、分支预测来应对
  - key: 三类冒险
    value: 结构冒险（抢硬件）、数据冒险（等结果）、控制冒险（不知道往哪跳）
  - key: 分支预测
    value: 猜下一步往哪走，猜错就作废重来
  - key: 对写代码的启发
    value: 可预测的分支跑得更快
  - key: 理想加速
    value: n 级流水线理想情况下吞吐提高约 n 倍，实际受冒险、各级不均衡限制
  - key: 转发
    value: 结果算出后直接送给后面的指令
  - key: 现代 CPU
    value: 超标量、多发射、乱序执行、推测执行
  - key: 在终端里看一看
    value: perf stat -e branches,branch-misses ls　看分支预测失败率（需安装 perf）
visual: swimlane
lanes:
  - id: pipe
    label: 流水线
  - id: ctl
    label: 控制
  - id: mem
    label: 存储
logColumns:
  - key: mode
    label: 当前状态
  - key: event
    label: 发生了什么
steps:
  - id: why
    title: 为什么要流水线
    tldr: 一条指令要走五个阶段，如果做完一条再做下一条，大部分电路都在闲着。
    body: 每条指令的五个阶段用的是不同硬件，取指用指令缓存和 PC 逻辑，译码用译码器和寄存器堆，执行用 ALU，访存用数据缓存，写回用寄存器写口。如果严格做完一条再做下一条，任一时刻五套硬件里有四套在闲置，利用率只有五分之一。流水线的做法是把指令像传送带上的工件一样排开，第一条进执行级时第二条在译码、第三条在取指，各级同时忙不同的指令。必须分清两个概念，单条指令的延迟并没有变短，它走完五级还是五拍，变的是吞吐，稳态下每拍都有一条指令完成，理想 CPI 从 5 降到接近 1。走数字，100 条指令顺序执行要 500 拍，流水线只要 5 加 99 等于 104 拍，接近 5 倍，这就是 n 级流水理想加速约 n 倍的来历。代价是级与级之间要加流水寄存器保存中间结果，还要处理指令挤在一起产生的新问题，也就是后面三类冒险。工厂流水线提高的是单位时间产量而不是单个产品工时，CPU 这里分毫不差，先把这个区分立住，后面所有关于停顿的计算才不会算错账。
    derivation: original
    sources:
      - ref: cs61c
        locator: 流水线相关讲义
        url: https://cs61c.org/
        claim: 流水线通过阶段重叠提高吞吐量
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
