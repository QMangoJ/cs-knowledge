- id: data
  title: 数据冒险：要用的结果还没算出来
  tldr: 后一条指令需要前一条的结果，可那条还没写回。
  body: '比如第一条算出 x，第二条马上要用 x。

    CPU 会“转发”：结果一算出来就直接送给下一条，不必等写回。

    实在来不及（比如要等内存读回），只能暂停一拍，插入一个“气泡”。'
  derivation: original
  sources:
  - ref: cs61c
    locator: 流水线冒险相关讲义
    url: https://cs61c.org/
    claim: 数据冒险可通过转发或暂停解决
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
  canvas:
    kind: swimlane
    actors:
    - lane: pipe
      id: p
      label: 流水线
    - lane: ctl
