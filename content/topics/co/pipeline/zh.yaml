    log:
      - mode: 流水线运行
        event: 多条指令同时处在不同阶段
    points:
      - 一条指令要走五个阶段，如果做完一条再做下一条，大部分电路都在闲着。
  - id: structural
    title: 结构冒险：抢同一个硬件
    tldr: 两条指令同一时刻要用同一块电路，就得有一条等。
    body: 结构冒险源于硬件只有一份，两条指令在同一拍要抢。经典例子在统一缓存的简单设计里，取指要读内存取指令，排在前面三级的访存也要读内存写数据，同一个存储口只有一个口，两件事撞在同一拍，必须有一件等一拍。解法是复制资源，现代 CPU 把一级缓存拆成指令缓存和数据缓存两份，取指和访存各走各的，冲突从根上消失，这叫用面积换吞吐。另一类结构冒险是功能单元不够，比如只有一个乘法器而两条乘法同时到执行级，第二条只能排队，超标量机器靠多配几个执行口缓解，但除法器这类昂贵单元通常仍只有一份。除法指令因此在时空图上会形成明显的排队点。判断一处等待是不是结构冒险，就看它是否与数据依赖无关，把指令换成互不相干的另一条还会不会撞，会撞就是结构问题，解法永远是加硬件或错峰，而不是等结果。写代码层面也有回响，内存带宽就是一种结构资源，多线程同时狂读内存时彼此拖慢，账算在带宽这个共享口上，与依赖无关。
    derivation: original
    sources:
      - ref: cs61c
        locator: 流水线冒险相关讲义
        url: https://cs61c.org/
        claim: 结构冒险由硬件资源冲突引起
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
