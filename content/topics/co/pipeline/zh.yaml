  - id: branch-predictor
    title: 分支预测器：2 位饱和计数器怎么躲过循环边界的坑
    tldr: 分支跳不跳要到执行级才知道，取指级等不起只能按历史猜；1 位预测器会在每次循环出口连错两回，改用 2 位饱和计数器就能抗住单次意外、把循环失误砍半。
    body: |-
      取指那一拍必须当场猜出两件事：这条分支跳不跳、跳去哪个地址，等执行级比出真结果就太晚了。最朴素的 1 位预测只记「上次跳没跳」——可跑循环时它会栽个固定跟头：假如循环体末尾的分支连续跳回循环头 9 次、第 10 次退出不跳，退出那一下猜错（第 1 错），记录被翻成「不跳」；下次程序再进同一个循环，第 1 次又照着上次的退出记成「不跳」，结果开局再错一回（第 2 错），每轮循环白白多错一次。

      把 1 位换成 2 位饱和计数器就巧妙多了：每项配一个 0 到 3 的计数（跳就加 1 封顶到 3，不跳就减 1 封底到 0，数值 ≥2 就预测跳）。还是那个 10 次循环：稳定循环时计数停在 3（强跳），第 10 次退出不跳只让它从 3 退到 2（弱跳），预测方向依然是「跳」！下次重新进循环第 1 步正好直接猜中、立马加回 3。只有连续两次走向相反，预测才会翻转，每轮循环只错退出那 1 次。

      真实处理器里的预测器更进一步：硬件会拿分支地址索引成千上万个计数器表项，再把最近一串分支的「跳/不跳」全局历史也拼进索引——因为代码里的分支常常相关（例如刚判断过指针非空，紧接着的分支走向几乎确定）。预测目标地址则交给另一张目标缓冲表（BTB），方向和地址都猜中，流水线才能零停顿接着跑。
    derivation: original
    sources:
