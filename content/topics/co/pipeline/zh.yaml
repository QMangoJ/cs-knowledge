title: 流水线和冒险：让 CPU 同时处理多条指令
summary: 把指令执行拆成几个阶段并叠起来做，速度大增，但也带来“冒险”。
premise: 沿用五阶段模型，看几条指令在流水线里怎样前后衔接。
overview:
- key: 一句话总结
  value: 流水线提高吞吐量，冒险会打断它，CPU 用转发、暂停、分支预测来应对
- key: 三类冒险
  value: 结构冒险（抢硬件）、数据冒险（等结果）、控制冒险（不知道往哪跳）
- key: 分支预测
  value: 猜下一步往哪走，猜错就作废重来
- key: 对写代码的启发
  value: 可预测的分支跑得更快
- key: 理想加速
  value: n 级流水线理想情况下吞吐提高约 n 倍，实际受冒险、各级不均衡限制
- key: 转发
  value: 结果算出后直接送给后面的指令
- key: 现代 CPU
  value: 超标量、多发射、乱序执行、推测执行
- key: 在终端里看一看
  value: perf stat -e branches,branch-misses ls　看分支预测失败率（需安装 perf）
