license: CC-BY-4.0
title: 流水线和冒险：让 CPU 同时处理多条指令
summary: 流水线不能缩短单条指令走完五步的时间，而是像装配线一样把多条指令错峰叠起来，让五套电路同时干活、把总吞吐推到接近每拍完成一条。一旦多条指令挤进同一条流水线，抢同一块硬件、等前一条算出的结果、遇分支不知道下一条取哪这三类「冒险」就会打断节奏。全课顺着这三类堵点拆解硬件复制、旁路转发和饱和计数器等解法，再进时空图实验亲手数气泡，最后看清现代超标量乱序核能跑多快的上限。
premise: 上一课里一条指令独自走完五步花了 5 拍；可现实程序动辄几百万条指令——例如连续三条 RISC-V 指令先 lw x1, 0(x2) 从内存读数，再用 add x3, x1, x4 相加，紧接着 sub x5, x3, x6。若每条都等前一条写完再开工，五套硬件总有四套在发呆；这一课就看 [[CPU]] 怎样把它们错峰叠进同一条流水线，以及叠起来后会在哪撞车。
position: 本课与上一课共同组成「指令的执行」板块：上一课让单条指令走完五阶段，这一课在段间插入流水寄存器，让五套硬件同时处理五条不同阶段的指令。学完你能分辨结构、数据、控制三类冒险的堵点与对策，算出分支预测失败浪费多少周期，也为下一课把镜头转向取数瓶颈的缓存做好衔接。
bridge:
  prev: 上一课里取指、译码、执行、访存、写回是一条指令独自排完的五拍接力。这一课在五个阶段之间插入流水寄存器，让多条指令错峰开工，把原本闲着的电路喂满。
  next: 把指令在芯片内部叠起来跑顺之后，最拖后腿的就只剩去主存取数那两三百个周期的漫长等待。下一课转入存储层次与缓存，看一条 64 字节缓存行怎样靠局部性把热点数据留到离核心最近的地方。
overview:
  - key: 一句话总结
    value: 流水线让多条指令的不同阶段同时进行，提高的是吞吐量。但指令挤在一起会产生冒险，把流水线打断，[[CPU]] 要靠转发、暂停和分支预测来应对，能少停就少停。
  - key: 三类冒险
    value: 冒险分三类，结构冒险是两条指令抢同一块硬件，数据冒险是后一条要用的结果前一条还没算出来。控制冒险是遇到了分支，还不知道下一条该取哪里的指令。
  - key: 分支预测
    value: 遇到分支时 CPU 不停下来等结果，而是先猜下一步往哪走，顺着猜测继续执行。猜对了流水线毫不停顿，猜错了就要把已经执行的几条全部作废，回到分叉口重来。
  - key: 对写代码的启发
    value: 分支如果有规律、结果可预测，预测器就能猜得准，程序跑得更快。比如先把数组排好序再循环判断，分支走向变得一边倒，速度能明显提升，这不是玄学，是预测器的工作方式决定的。
  - key: 理想加速
    value: 理想情况下，n 级流水线的吞吐量能提高到接近 n 倍，比如五级流水线稳态时每周期完成一条指令。实际上冒险会让它时不时停顿，各级耗时又不完全均衡，所以达不到理想值。
  - key: 转发
    value: 转发是把刚算出的结果直接送给紧跟其后的指令，不等它先写回寄存器再读出来。这样很多数据冒险不用停顿就能解决，是流水线里最常用的补救手段。
  - key: 现代 CPU
    value: 现代 CPU 在流水线之上又加了几招，超标量让它一个周期能发射多条指令，乱序执行让准备好的指令先做。推测执行则是顺着分支预测先跑下去，猜错再回滚，速度就是这样一层层压出来的。
  - key: 在终端里看一看
    value: "[[perf]] stat -e branches,branch-misses ls　看分支预测失败率（需安装 perf）"
