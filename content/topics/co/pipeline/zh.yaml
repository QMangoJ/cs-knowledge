steps:
  - id: why
    title: 为什么要流水线：把闲着的电路喂满
    tldr: 流水线不能缩短单条指令走完五步的时间（依然要 5 拍），而是把多条指令错峰叠在一起，让五套电路同时干活、把吞吐拉高到接近每拍完成一条。
    body: |-
      一条指令的五个阶段各占一套硬件：取指用指令缓存和 PC 逻辑，译码用译码器和寄存器堆，执行用 [[ALU]]，访存用数据缓存，写回用寄存器写口。如果老老实实做完一条再做下一条，任一拍里五套电路有四套都在发呆，硬件利用率只有五分之一。流水线就像汽车装配线：第 1 条 lw 推进执行级时，第 2 条 add 已经进译码、第 3 条 sub 正好在取指，五套硬件各自伺候不同指令。

      把数字走一遍就能看清「吞吐」和「单条延迟」的区别：每条指令走完五步还是 5 拍，单条并未变快；但稳态下每拍都有一条指令完成，理想 [[CPI]] 从 5 降到接近 1。跑 100 条指令，顺序执行要 100 × 5 = 500 拍，五级流水线只需 5 + 99 = 104 拍，接近 5 倍提速。当然这并非零代价：阶段之间必须插上流水寄存器保存中间结果，多条指令同场并行也会撞出后面三类冒险。
    derivation: original
    sources:
      - ref: cs61c
        locator: 流水线相关讲义
        url: https://cs61c.org/
        claim: 流水线通过阶段重叠提高吞吐量
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: pipe
          id: p
          label: 流水线
          highlight: true
        - lane: ctl
          id: c
          label: 冒险检测
        - lane: mem
          id: m
          label: 寄存器与内存
      messages: []
    log:
      - mode: 流水线运行
        event: 多条指令同时处在不同阶段
    points:
      - 一条指令要走五个阶段，如果做完一条再做下一条，大部分电路都在闲着。
  - id: structural
    title: 结构冒险：两条指令抢同一块硬件
    tldr: 多条指令同时跑时，如果同一拍有两条指令都要用同一份硬件资源（例如唯一的内存口），其中一条只能停下来等；把那份硬件复制一份就能根治。
    body: |-
      结构冒险的根源是「电路只有一份，同一拍却来了两个客人」。假设处理器为了省面积只做了一块统一缓存，既放指令又放数据：第 1 条 lw 走到访存级要从这块缓存读数据，恰好第 4 条指令同一拍在取指级也要从它拿指令——只有一个存储口，两条指令当场撞车，必须有一条干等一拍。现代 [[CPU]] 把一级缓存拆成独立的一级指令缓存和一级数据缓存，取指和访存各走各的路，冲突就从根上消除了，这正是用面积换吞吐。另一类碰撞发生在乘除法器这类昂贵运算单元上：如果两个除法指令连着冲进执行级而除法器只有一份，第二条就得在时空图上老实排队。

      顺带给一个不会和另外两类搞混的判断法：怀疑某个停顿是不是结构冒险，把撞车的那条指令换成一条读写完全不相干寄存器的指令再试一次——换完之后照样撞在同一拍，就是硬件只有一份的结构问题，只能靠加硬件或错峰排开；换完不撞了，才是后面要看的数据或控制问题。
    derivation: original
    sources:
      - ref: cs61c
        locator: 流水线冒险相关讲义
        url: https://cs61c.org/
        claim: 结构冒险由硬件资源冲突引起
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
