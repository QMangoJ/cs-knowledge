- id: lesson
  title: 代价与启示
  tldr: 冒险让流水线时不时停顿；分支猜错的代价尤其大。
  body: '现代 CPU 流水线很深，一次分支预测失败通常要浪费十几到二十几个时钟周期。

    （真实的 x86-64 远比五阶段复杂：会乱序执行、每个周期发射多条指令，但冒险和预测的道理相同。）

    所以有规律的分支跑得快，随机的分支跑得慢，同样的循环处理排好序的数据可能明显更快。

    日常写代码不必为此操心，但在性能热点里，这是值得知道的原理。'
  derivation: original
  sources:
  - ref: csapp
    locator: 第 5 章
    url: http://csapp.cs.cmu.edu/
    claim: 分支预测失败对程序性能有显著影响
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
    note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
