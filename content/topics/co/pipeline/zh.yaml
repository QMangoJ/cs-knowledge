  - id: pipe-lab
    title: 动手：画流水线时空图，数一数停了几拍
    tldr: 3 条有依赖的指令，理想 7 拍；不转发要 11 拍（停 4 拍），有转发只要 8 拍（停 1 拍）。
    body: 时空图的横轴是时钟周期，纵轴是指令，每格写这条指令此刻在哪个阶段，IF 取指、ID 译码读寄存器、EX 执行、MEM 访存、WB 写回。例子是 3 条 RISC-V 指令，lw x1, 0(x2) 从内存读出 x1，add x3, x1, x4 要用 x1，sub x5, x3, x6 要用 x3，一条真依赖链串到底。理想情况第 1 条 5 拍做完，之后每拍完成 1 条，共 5 加 2 等于 7 拍。不转发时，add 必须等 lw 在第 5 拍写回才能在第 5 拍译码读到 x1，比原定第 3 拍晚 2 拍，sub 同理等 add 写回又停 2 拍，总共 11 拍停 4 拍。打开转发后，add 的结果在 EX 结束就直送 sub 的 EX，sub 不用停；但 lw 的数据要到 MEM 结束即第 4 拍才从内存出来，add 的 EX 最早第 5 拍，仍要停 1 拍，这就是 load-use 冒险，转发也救不了，总共 8 拍。亲手切换转发开关看气泡位置移动，再试着在 add 和 sub 之间插一条无关指令，看 load-use 的那 1 拍能否被填满，编译器的指令调度就是在自动做这件事。记住结论的形状，依赖链的长度决定下限，无关指令越多，流水线越容易喂满，这也是为什么循环展开能提速，它把多轮迭代的独立指令混在一起给了调度器腾挪空间。
    derivation: original
    sources:
      - ref: cs61c
        locator: Pipelining / Hazards 讲义
        claim: 转发可消除大部分数据冒险，load-use 仍需停顿一拍
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: lab
      lab: pipeline-chart
      caption: 开关转发，看 3 条指令各要多少拍
      params:
        stages:
          - IF
          - ID
          - EX
          - MEM
          - WB
        program:
          - op: lw x1, 0(x2)
            writes: x1
            reads:
              - x2
            load: true
          - op: add x3, x1, x4
            writes: x3
            reads:
              - x1
              - x4
          - op: sub x5, x3, x6
            writes: x5
            reads:
              - x3
