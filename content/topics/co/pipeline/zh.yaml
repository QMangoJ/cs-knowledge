  - id: control
    title: 控制冒险：猜错一次要冲刷整段流水线
    tldr: 分支指令约占全部指令的五分之一，流水线没法每次都停下来干等比较结果；先按预测器猜方向往下取指，猜错就把错路上执行到一半的指令全部作废重来。
    body: |-
      控制冒险源于一个时间差：条件分支刚进取指级时，后面下一拍就得继续往流水线里塞新指令；可跳不跳、跳去哪要等执行级比出结果才知道。程序里平均每 5 条指令就有 1 条分支，如果次次傻等结果再取指，流水线会频繁断流。硬件的解法只能是先按第 6 步的预测器猜一条路跑下去：猜中就零停顿衔接，猜错就把已经取进来的错误指令全部作废冲刷，再从正确地址重新取指。现代高性能处理器流水线深达十五到二十级，猜错一次就是十几二十个周期白干。

      因此预测准确率直接拉出几倍的性能差距：循环回边几乎每次都跳、异常检查几乎总不跳，预测率常在 95% 以上；最致命的是跟随机数据绑定的条件判断，例如对乱序数组做 if (data[i] >= 128) 累加，成立与否像抛硬币一样各占 50%，再强的预测器也猜不准。同一段代码把数组先排好序再跑，分支方向变成连续的一边倒，速度往往直接翻倍。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 4 章、第 5 章
        url: http://csapp.cs.cmu.edu/
        claim: 分支预测与预测失败的处罚
