            cycles: 8
            stalls:
              - instr: 2
                bubbles: 1
            totalStalls: 1
        - input:
            ideal: true
          expect:
            cycles: 7
    log:
      - mode: 动手实验
        event: 无转发 11 拍，有转发 8 拍
  - id: control
    title: 控制冒险：不知道往哪跳
    tldr: 遇到 if 这类分支时，结果出来前不知道下一条该取哪里。
    body: 控制冒险源于取指时还不知道下一条该取哪。流水线在分支指令刚进来时就要继续取指上路，而分支到底跳不跳、跳去哪，要等执行级比较完才知道，中间差着两三级，这段时间取进来的指令可能全是错的。停等是最笨的办法，每遇分支空转数拍，分支在程序里约占五分之一，代价不可接受。主流解法是分支预测，按历史猜方向和目标，猜中则流水线无缝衔接，猜错则把已经取入并做到一半的投机指令全部冲刷作废，从正确地址重启。预测器细节后面有专门一步，这里先算账，现代深流水线有十五到二十级，猜错一次的冲刷代价就是这个量级的周期白费。数字感上，规则可循的分支预测准确率常在 95% 以上，循环的回边几乎总跳、错误检查几乎总不跳，都极易预测；数据相关的分支最差，比如对随机数据做 if (data[i] >= 128) 累加，成立与否约各半，几乎不可预测，同样代码处理排好序的数据能快数倍，差别全在预测器能不能学到规律。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 4 章、第 5 章
        url: http://csapp.cs.cmu.edu/
        claim: 分支预测与预测失败的处罚
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
