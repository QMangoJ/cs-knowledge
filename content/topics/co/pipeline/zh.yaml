level: 进阶
minutes: 30
prereq:
  - co/instruction-cycle
objectives:
  - 区分结构/数据/控制三类冒险及对策
  - 解释数据前递如何消掉大部分 RAW 停顿
  - 估算分支预测失败的惩罚周期
aiLink: GPU 的 warp 调度、推理引擎的算子流水、CPU 上的投机执行都是同一思想：让硬件永远有活干。理解冒险与停顿，才能理解为什么分支多的代码慢、为什么批量连续的内存访问对推理吞吐至关重要。
quiz:
  - q: 数据前递（forwarding）解决的是？
    options:
      - 结构冒险
      - RAW 数据冒险：把还没写回的结果直接送到需要的执行单元
      - 控制冒险
      - 缓存未命中
    answer: 1
    explain: 前递把等待从等写回缩短到结果一算出就能用，大多 RAW 停顿被消掉。
  - q: 分支预测失败的代价主要是？
    options:
      - 重算整个程序
      - 已投机取入流水线的指令作废，损失约等于流水线深度量级的周期
      - 内存清空
      - 寄存器清零
    answer: 1
    explain: 流水线越深、预测错一次越贵，所以热路径要减少难预测的分支。
  - q: 结构冒险指？
    options:
      - 两个指令抢同一硬件资源（如同一端口）
      - 操作数还没算出来
      - 分支方向未知
      - 页表未命中
    answer: 0
    explain: 资源冲突是结构冒险；解法是复制资源或插入停顿。
design:
  - mechanism: 五级流水把一条指令的数据通路切成五段，段间加流水寄存器让多条指令错峰开工
    problem: 做完一条再做下一条时五套电路有四套一直在发呆，利用率只有五分之一；可要是不切分直接拉长单周期，时钟节拍又会被最慢那段拖慢。
    choice: 按功能和延迟尽量均等地切出取指、译码、执行、访存、写回五段，让稳态下每拍都能完成一条指令，理想 [[CPI]] 降到接近 1。
    tradeoff: 多出流水寄存器的面积与功耗开销，也引出了三类冒险；流水线级数越深，猜错分支一次要作废的周期越多，不能无止境往下切。
    root: 流水线加速靠的不是缩短单条指令跑完的时间，而是把闲置电路喂满来提高吞吐，并且整条线的时钟频率被最慢那一段锁死。
  - mechanism: 分支预测加投机执行，用 2 位饱和计数器和历史表先猜方向再跑
    problem: 条件分支要到执行级才出结果，可程序平均每 5 条就有 1 条分支，取指级每次都干等会让流水线频频断流。
    choice: 趁分支还在执行级计算之前按历史规律先猜一步往下取指执行；循环回边和出错判断规律极强，命中率常超 95%，远远赚回偶尔猜错的冲刷成本。
    tradeoff: 猜错路径上已经跑了的指令必须作废重启，流水越深罚得越重；投机期间顺手留下的缓存痕迹还会带来侧信道安全风险。
    root: 控制流的答案来得太晚而取指又等不起，只能拿过去的历史押概率，2 位饱和计数器正是用最省面积的 2 个比特抗住单次意外的记忆单元。
  - mechanism: 转发网络在流水级间拉旁路，让后一条指令绕开写回提前拿到新值
    problem: 若相邻两条指令必须等前一条走完写回再读寄存器，真依赖 [[RAW]] 会让流水线每隔几拍就插满气泡，几乎退化成串行执行。
    choice: 按产生级到使用级直接拉旁路电线，例如把执行级刚算出的值立刻送进下一条执行级输入端，让大部分 RAW 停顿直接归零。
    tradeoff: 旁路线和入口选择器拉得越多，电路连线越复杂、反过来会拖慢时钟周期；而且像 [[load-use]] 这样数据本身出现太晚的情况，靠连线在时间上也追不回来。
    root: 执行级末其实结果就已经存在了，写回只是最后归档进寄存器堆的动作，让消费者绕过归档直接拿刚吐出的值，就能删掉这段纯属人为的等待。
