          from: m
          to: p
          label: 结果算出后直接转发给下一条指令，不等写回寄存器
          active: true
    log:
      - mode: 转发
        event: 第二条指令通过转发拿到了 x 的新值，继续执行
    code:
      lang: text
      code: |-
        lw  x1, 0(x2)     # x1 在 MEM 段才得到
        add x3, x1, x4    # EX 段就要用 x1
        无前递：等 WB → 停顿约 2 拍；有前递：MEM 结果直送 EX → 停顿约 1 拍（load-use）
      note: RAW 冒险示意
  - id: hazard-taxonomy
    title: 三类数据依赖：RAW 真卡脖子，WAR 和 WAW 靠改名消除
    tldr: 同样碰同一个寄存器，先写后读（[[RAW]]）是程序逻辑决定的真依赖，只能转发或等；先读后写（[[WAR]]）和先写后写（[[WAW]]）只是寄存器名字不够用造成的假冲突，换个物理名字就能当场消掉。
    body: |-
      拿具体的指令对走一遍就能分清三类依赖：第一类 [[RAW]]（先写后读），比如 add x1, x2, x3 后面紧跟 sub x4, x1, x5，后者真要用前者算出的 x1，任何硬件设计下都绕不开，只能靠转发或停等。第二类 [[WAR]]（先读后写），比如 sub x4, x1, x5 先读 x1、紧接着 add x1, x6, x7 要改写 x1；顺序流水线里前者在第 2 拍就读完寄存器、后者第 5 拍才写回，本来相安无事，可一旦乱序执行让后者先写完，前者就读错了。第三类 [[WAW]]（先写后写），两条指令先后写 x1，如果完成顺序颠倒，后面读到的就会变成前一条的旧结果。

      等一下，为什么 [[WAR]] 和 [[WAW]] 算「假依赖」？因为这两条指令在逻辑上根本没传递数据，纯粹是指令集只给了 32 个名字（x0 到 x31），逼得两段不相干的计算共用 x1 这个名字。现代乱序核内部备着上百个物理寄存器，用[[寄存器重命名]]给每次写入分一个新编号（比如前一条读 p10，后一条写到新分配的 p33），两条指令立马各走各的、互不干扰。

      这样一来，乱序执行真正卡脖子的只剩 [[RAW]] 真依赖链。不过碰上内存还得额外留神：寄存器编号在译码时就一眼看穿，但 store 写内存和后面 load 读内存是不是碰了同一个地址，要等两边算出有效地址才知道——乱序处理器还得靠[[地址消歧]]先猜它们不撞地址、猜错了再回滚。
    derivation: original
    sources:
      - ref: cs61c
        locator: 流水线冒险相关讲义
        url: https://cs61c.org/
        claim: 数据冒险分为 RAW、WAR、WAW，假依赖可由重命名消除
