  - id: lesson
    title: 算清停顿的账：给热点代码的三条建议
    tldr: 流水线的实际 [[CPI]] 等于理想值 1 加上各类气泡的均摊；算一笔分支冲刷的账就能明白，为什么只有热点循环里难预测的分支才值得花力气改写。
    body: |-
      把前面几步的账汇总成一句话：实际 [[CPI]] = 1 + 数据停顿 + 分支冲刷 + 缓存未命中停顿。拿分支冲刷算笔明白账：设分支占全部指令的 20%，现代流水线猜错一次冲刷 15 拍。如果分支很有规律、失败率只有 5%，均摊到每条指令不过 0.2 × 0.05 × 15 = 0.15 拍（CPI ≈ 1.15），完全可接受；一旦遇上随机数据让失败率飙到 50%，均摊代价立刻翻十倍成 1.5 拍，整体 CPI 直接翻倍不止。

      这笔账对应三条带前提的编码建议，只在性能剖析器（profiler）点名的热点循环里才值得动手：第一，用无分支写法（如[[条件传送]]或位掩码）替掉猜不准的数据相关 if，不过先看汇编确认——编译器开优化常已自动替你改好了；第二，尽量让分支一边倒，把不变检查移出循环或先规整数据；第三，把单一串行累加拆成多路并行累加，给乱序核腾出更多可并行的独立指令。日常普通业务代码怎么好读怎么写，不必为省几拍气泡自寻烦恼。
