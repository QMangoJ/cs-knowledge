steps:
- id: why
  title: 为什么要流水线
  tldr: 一条指令要走五个阶段，如果做完一条再做下一条，大部分电路都在闲着。
  body: '每条指令的五个阶段用的是不同的电路。

    流水线让它们像工厂流水线一样叠起来：第一条在执行时，第二条在译码，第三条在取指。

    单条指令没变快，但理想情况下每个时钟周期都有一条指令完成，吞吐量大大提高。'
  derivation: original
  sources:
  - ref: cs61c
    locator: 流水线相关讲义
    url: https://cs61c.org/
    claim: 流水线通过阶段重叠提高吞吐量
    status: verified
    checkedBy: Muse 核查
