  - id: forwarding-paths
    title: 转发路径细节：结果从哪一级送到哪一级
    tldr: 转发不是一根万能线，EX 到 EX、MEM 到 EX 的时机和覆盖范围各不相同。
    body: 转发网络是在流水级之间拉的旁路线，结果不必回到寄存器堆再被读出。最常用的一条是 EX 到 EX，前一条 ALU 指令在执行级末算出结果，直接接到下一条执行级的输入多路选择器上，下一拍正好用上，零停顿，这是连续算术指令链能一拍一条的功臣。第二条是 MEM 到 EX，load 的数据在访存级末才拿到，接回下一条的执行级输入，但时序上晚了一级，所以紧挨着的 load-use 组合接不上，要停一拍，等数据再经写回或 MEM 到 MEM 的路径被读到。还要分清转发和写回的先后，同一拍里前一条在写回、后一条在译码读寄存器，靠寄存器堆前半拍写后半拍读的约定刚好衔接，不必额外停顿。覆盖不了的情况也要记牢，转发只能送已经产生的结果，乘除法这类多周期运算没算完就是没算完，转发无能为力，只能调度别的指令来填。画时空图判断停几拍的方法就是逐个依赖查结果产生级和使用级，产生级结束拍不晚于使用级开始拍就不用停，晚一拍就停一拍，load-use 正是晚一拍的典型。
    derivation: original
    sources:
