  - id: hazard-taxonomy
    title: 冒险完整分类走例：RAW、WAR、WAW
    tldr: 三类数据冒险只看读写顺序，逐对走一遍才不会在判断题里翻车。
    body: 把三类数据冒险用同一对寄存器逐个走清。RAW 先写后读，add x1, x2, x3 之后 sub x4, x1, x5 要读 x1，这是真依赖，结果没算出就读必然读到旧值，任何执行方式下都成立，只能转发或等待。WAR 先读后写，sub x4, x1, x5 先读 x1，紧跟的 add x1, x6, x7 要改写 x1，如果后者抢先写完，前者就读错了；顺序五级流水里前者译码读寄存器远早于后者写回，所以天然安全，可一旦乱序执行让后者先完成，危险立刻出现。WAW 先写后写，两条指令都写 x1，如果完成顺序颠倒，后面指令读到的会是先执行那条的旧结果，同样只在乱序下成真。硬件的对策分工明确，RAW 靠转发网络和调度等待，是唯一无法消除、决定关键链的依赖；WAR 和 WAW 只是同一个寄存器名字被复用造成的假象，寄存器重命名给每次写分配一个新的物理寄存器，假依赖当场消失。所以现代乱序核里真正限制速度的只剩 RAW 链和资源、分支，判断题里先问这是不是真依赖，能省掉一半纠结。再补一类存储依赖，store 和后面的 load 是否同地址要到地址算出才知道，乱序访存还要专门做地址消歧，这可以看作 RAW 在内存上的版本。
    derivation: original
    sources:
