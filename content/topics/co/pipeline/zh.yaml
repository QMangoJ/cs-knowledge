        forwarding: false
        branchPenalty: 0
        regfileSplitCycle: true
      cases:
        - input:
            forwarding: false
          expect:
            cycles: 11
            stalls:
              - instr: 2
                bubbles: 2
              - instr: 3
                bubbles: 2
            totalStalls: 4
        - input:
            forwarding: true
