  - id: ooo-boundary
    title: 超标量与乱序执行：并行度撞上的三道天花板
    tldr: 乱序执行并不是无限制并行，实际速度顶多跑到三道上限里最矮的那一道：真依赖关键链的长度、乱序窗口的指令容量、以及每周期最多退休几条指令。
    body: |-
      前面解法越叠越厉害，很容易让人以为乱序执行能把并行度无限拉高，其实硬件死死卡着三道天花板。第一道是真依赖关键链：拿链表遍历 while (p) p = p->next 来说，下一轮要读的地址必须等这一轮 lw 从内存拿回来才知道，每一步都要吃满一次访存延迟，再宽的乱序核也只能一步步串行往前挪。

      第二道是乱序窗口大小（常见几百条指令容量），第三道是各级的发射与退休宽度。只要最前面一条指令因为缓存未命中卡住两百多拍，后续指令就会把乱序窗口迅速填满；窗口一满，取指必须停下来等最老的那条退休——一次未命中拖死的不只是那一条，而是整车后面的独立指令都被堵在门外。因此排查一段代码跑多快，永远先找关键依赖链长度，再看窗口能不能藏住访存延迟，最后才看每周期能发几条。把链表换成连续数组、把串行累加拆成多路并行累加，正是在亲手砍短关键链。
