  - id: branch-predictor
    title: 分支预测器原理：1 位与 2 位饱和计数器
    tldr: 预测器是一张按分支地址索引的小表，每项记一个会饱和增减的历史计数。
    body: 最朴素的预测器是 1 位预测，记住这条分支上次跳没跳，下次照上次猜。它在循环上栽得很惨，循环回边连续跳 9 次最后 1 次不跳，退出时错 1 次可以忍，但重新进入循环时第一次又被上次的退出带偏再错 1 次，每轮固定错 2 次。2 位饱和计数器是经典改良，每条分支配一个 0 到 3 的计数器，跳了就加一、不跳就减一，加到 3 封顶、减到 0 封底，计数器高位为 1 就预测跳。这样一次意外的不跳只把状态从强跳退到弱跳，预测方向不变，要连续两次反向才翻转，循环每轮只错退出那 1 次。走状态序列最直观，强跳状态遇一次不跳变弱跳仍预测跳，遇第二次不跳才变弱不跳。真实预测器把这张表做成按分支地址低位索引的成千上万项，再叠加全局历史，即把最近若干条分支的跳不跳序列也拼进索引，因为分支之间常有相关性，比如刚检查过指针非空紧接着的解引用分支几乎必走某向。预测目标地址则由另一张目标缓冲表提供，方向和目标都要猜对，流水线才能无缝续上，任何一个错了都是同等量级的冲刷。
    derivation: original
