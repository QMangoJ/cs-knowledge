  - id: lesson
    title: 代价与启示
    tldr: 冒险让流水线时不时停顿；分支猜错的代价尤其大。
    body: 把三类冒险的账汇总，流水线的实际 CPI 等于理想 1 加上各类停顿的平均摊派，数据依赖停顿、load-use 气泡、分支冲刷、缓存未命中长停顿，每一项都能在时空图或性能计数器里找到对应。分支冲刷尤其要换算，设分支占指令的 20%，预测失败率 5%，每次冲刷 15 拍，摊到每条指令就是 0.2 乘 0.05 乘 15 等于 0.15 拍，看着不大，但失败率涨到 50% 的随机分支场景，摊派立刻变成 1.5 拍，CPI 翻倍不止，这解释了不可预测分支为什么是性能杀手。对写代码的启示有三条且都要带条件，其一，热点里能用无分支写法替代数据相关分支时往往值得，比如用条件传送或算术掩码，但编译器经常已经这么做了，先测再改。其二，让分支变得可预测，把判断条件规整化、让同一分支长期走同一方向。其三，减少依赖链长度，把累加拆成多个部分和再合并，就是在给流水线和乱序窗口提供并行度。最后提醒，日常业务代码不必为分支焦虑，这些账只在被 profiler 点名的热点里才值得算，premature optimization 的教训和流水线知识同样重要。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 5 章
        url: http://csapp.cs.cmu.edu/
        claim: 分支预测失败对程序性能有显著影响
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: pipe
          id: p
          label: 流水线
          highlight: true
        - lane: ctl
          id: c
          label: 冒险检测
        - lane: mem
          id: m
          label: 寄存器与内存
      messages: []
    log:
      - mode: 恢复流水
        event: 猜错的指令作废，从正确位置继续
  - id: superscalar
    title: 现代 CPU：多发射与乱序执行
    tldr: 现代 CPU 每个周期能发射多条指令，还会打乱顺序先做已经准备好的。
    body: 流水线解决的是单条流水的吞吐，超标量再往前一步，每个周期同时发射多条指令进多条流水线，理想 CPI 降到 1 以下，IPC 可以到 2、3 乃至更高。能发几条受制于依赖，每拍发射前要在一批候选指令里检查谁的操作数已就绪、谁和前面无真依赖，这就是乱序执行的调度核心，就绪的先做，还在等内存的挂起，后面不相干的越过它先行，最后按程序顺序退休，保证对外表现和顺序执行严格一致，异常也能精确落在正确的指令上。走例，前一条 load 未命中要等上百周期，乱序窗口里几十条后续独立指令可以全部先算完，内存延迟被彻底藏住，这正是现代 CPU 访存不那么致命的原因。边界也要清楚，一长串首尾相接的真依赖链，比如每步都依赖上一步结果的累加，再宽的发射也只能一拍一步，关键链长度是并行度的硬顶。投机执行是这套机制的延伸，分支预测后敢把猜测路径的指令也乱序做完，猜错再撤销，性能收益和安全副作用都从这里来。软件侧能做的，是给硬件提供指令级并行，拆依赖链、用展开制造独立指令，硬件的宽度才有东西可发。
    derivation: original
    sources:
      - ref: cs61c
        locator: 流水线相关讲义
        url: https://cs61c.org/
        claim: 现代 CPU 每个周期能发射多条指令，还会打乱顺序先做已经准备好的。
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: pipe
          id: p
          label: 流水线
          highlight: true
        - lane: ctl
          id: c
          label: 冒险检测
        - lane: mem
          id: m
          label: 寄存器与内存
      messages:
        - id: m-superscalar
          from: p
          to: p
          label: 同周期发射多条、乱序完成
          active: true
    log:
      - mode: 乱序
        event: 按原顺序提交结果
level: 进阶
minutes: 30
prereq:
  - co/instruction-cycle
objectives:
  - 区分结构/数据/控制三类冒险及对策
  - 解释数据前递如何消掉大部分 RAW 停顿
  - 估算分支预测失败的惩罚周期
aiLink: GPU 的 warp 调度、推理引擎的算子流水、CPU 上的投机执行都是同一思想：让硬件永远有活干。理解冒险与停顿，才能理解为什么分支多的代码慢、为什么批量连续的内存访问对推理吞吐至关重要。
quiz:
  - q: 数据前递（forwarding）解决的是？
    options:
      - 结构冒险
      - RAW 数据冒险：把还没写回的结果直接送到需要的执行单元
      - 控制冒险
      - 缓存未命中
    answer: 1
    explain: 前递把等待从等写回缩短到结果一算出就能用，大多 RAW 停顿被消掉。
  - q: 分支预测失败的代价主要是？
    options:
      - 重算整个程序
      - 已投机取入流水线的指令作废，损失约等于流水线深度量级的周期
      - 内存清空
      - 寄存器清零
    answer: 1
    explain: 流水线越深、预测错一次越贵，所以热路径要减少难预测的分支。
  - q: 结构冒险指？
    options:
      - 两个指令抢同一硬件资源（如同一端口）
      - 操作数还没算出来
      - 分支方向未知
      - 页表未命中
    answer: 0
    explain: 资源冲突是结构冒险；解法是复制资源或插入停顿。
design:
  - mechanism: 五级流水把一条指令的数据通路切成取指、译码、执行、访存、写回五段，段间加流水寄存器让多条指令错峰共用硬件。
    problem: 顺序执行时五套硬件四套闲置，吞吐只有五分之一，但把整条通路做成一级又会让时钟周期被最慢的一级拖到不可接受。
    choice: 按功能和延迟相对均衡地切成五级，每级延迟接近，时钟可以定在单级延迟的量级，稳态吞吐逼近每周期一条，理想加速接近级数。
    tradeoff: 切分带来流水寄存器开销和冒险这一整套新问题，级数越深分支冲刷越贵，所以真实设计在级数上反复权衡而不是越深越好。
    root: 根源是流水线加速的本质是提高硬件利用率而不是缩短单条延迟，切分点必须让各级延迟均衡，最慢一级决定时钟，这和工厂工位节拍同理。
  - mechanism: 分支预测加投机执行，预测器用 2 位饱和计数器和历史表猜方向与目标，猜错时冲刷流水线并从正确地址重启。
    problem: 分支结果要到执行级才知道，若每次都停等，分支约占指令五分之一，流水线会频繁断流，深度流水的吞吐优势被等待吃光。
    choice: 用历史规律做概率下注，循环回边、错误检查这类分支规律极强，整体准确率可达 95% 以上，期望收益远大于偶尔冲刷的损失。
    tradeoff: 投机意味着会在错误路径上真实执行并留下缓存等微架构痕迹，冲刷代价随流水深度线性增长，深流水与高预测精度被绑定在一起设计。
    root: 根源是控制流的答案产生得太晚而取指不能停，唯一出路是用过去预测未来，饱和计数器则是用最少的硬件状态换取抗噪的历史记忆。
  - mechanism: 转发网络在流水级之间拉旁路，结果一产生就直送使用级，寄存器堆退化为只保存已退休的稳定状态。
    problem: 若每条指令都必须等前一条写回再读寄存器才能用结果，RAW 依赖会给几乎每对相邻指令都插入数拍停顿，流水线名存实亡。
    choice: 按结果产生级到使用级逐条拉旁路，EX 到 EX 实现零停顿衔接，转发把等待从写回时刻提前到结果产生时刻，是性价比最高的一步硬件投资
    tradeoff: 旁路越拉越多，多路选择器和比较逻辑会膨胀并可能反过来拉长时钟周期，且 load 数据产生太晚，load-use 的一拍停顿在原理上就消不掉
    root: 根源是数据依赖的时间差，结果在执行级末就已存在，写回只是归档动作，让消费者绕过归档直接取用，是消除人为等待的自然解法。
