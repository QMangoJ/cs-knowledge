  canvas:
    kind: lab
    lab: pipeline-chart
    caption: 开关转发，看 3 条指令各要多少拍
    params:
      stages:
      - IF
      - ID
      - EX
      - MEM
      - WB
      program:
      - op: lw x1, 0(x2)
        writes: x1
        reads:
        - x2
        load: true
      - op: add x3, x1, x4
        writes: x3
        reads:
        - x1
        - x4
      - op: sub x5, x3, x6
        writes: x5
        reads:
        - x3
        - x6
      forwarding: false
      branchPenalty: 0
      regfileSplitCycle: true
    cases:
    - input:
        forwarding: false
      expect:
        cycles: 11
        stalls:
        - instr: 2
          bubbles: 2
        - instr: 3
          bubbles: 2
        totalStalls: 4
    - input:
        forwarding: true
      expect:
        cycles: 8
        stalls:
        - instr: 2
          bubbles: 1
        totalStalls: 1
    - input:
        ideal: true
      expect:
        cycles: 7
  log:
  - mode: 动手实验
    event: 无转发 11 拍，有转发 8 拍
- id: control
  title: 控制冒险：不知道往哪跳
  tldr: 遇到 if 这类分支时，结果出来前不知道下一条该取哪里。
  body: '流水线不能干等，否则会空出好几拍。

    于是 CPU 做“分支预测”：根据历史猜一个方向先取指令执行。

    猜对了白赚，猜错了就把按猜测方向取进来、做到一半的指令作废，从正确的地方重来。


    数字感：规则负载下分支预测准确率常在 95% 以上（数据相关的分支会低得多），但深度 15–20 级的流水线错一次要冲刷约 15–20 个周期。经典例子是线性扫描里的 if (data[i] >= 128) sum += data[i]：数据排好序时分支几乎总是同一方向、极易预测；数据乱序时约一半成立一半不成立、几乎不可预测，同一个循环能慢出数倍。'
  derivation: original
  sources:
  - ref: csapp
    locator: 第 4 章、第 5 章
    url: http://csapp.cs.cmu.edu/
    claim: 分支预测与预测失败的处罚
    status: verified
