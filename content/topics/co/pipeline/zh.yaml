  - id: superscalar
    title: 多发射与乱序退休：现代 CPU 如何把流水压到极致
    tldr: 现代 [[CPU]] 把流水线扩成多条并行车道（超标量），还允许操作数已就绪的指令插队先算、最后再按原顺序提交结果，把漫长的访存等待藏在背后。
    body: |-
      五级流水线最多做到每拍完成一条指令，现代处理器则把车道拓宽成「超标量」：每拍同时取指、译码并发射 4 到 6 条指令进多条并排的流水线，把理想 [[CPI]] 压到 1 以下，[[IPC|IPC（每周期指令数）]] 做到 2、3 甚至更高。再配上乱序执行引擎：假如前面那条 lw 没命中缓存要等两三百拍，硬件不会让整排车道陪着发呆，而是把后面几十条操作数已就绪的独立算术指令放行先算——算完的结果先暂存重排序缓冲，等前面老指令全部搞定，再严格按源码顺序逐条正式提交（退休），保证异常和程序结果与顺序执行分毫不差。

      「投机执行」把胆子放得更大：遇上分支不等判断出来，先顺着猜的方向把后面的指令也一并乱序算完；猜中白赚几十拍，猜错就把暂存结果整批丢弃回滚（幽灵/熔断这类侧信道漏洞，正源于错路上偷偷执行时在缓存里留下的访问脚印）。但记住第 7 步的上限：面对指针追逐这类首尾相扣的真依赖链，再宽的超标量也只能一拍走一步——软件能帮硬件的，就是拆短依赖链、用循环展开多喂些互相独立的指令。

      全课收成一句口诀和排堵三问：流水提吞吐不减单条延迟，结构拆电路、数据靠转发、控制靠猜准、多发射加乱序藏延迟；看到热点代码跑不满核，先问三句——是不是卡在串行 RAW 依赖链上、是不是分支在按 50% 随机乱跳、是不是一次缓存未命中把乱序窗口堵死了。
    derivation: original
    sources:
