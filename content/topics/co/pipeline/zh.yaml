  - id: ooo-boundary
    title: 超标量与乱序的边界在哪里
    tldr: 乱序不是无限并行，真依赖链、窗口大小和退休带宽三处都是硬顶。
    body: 乱序执行容易给人无限并行的错觉，必须把三处硬顶钉死。第一处是真依赖关键链，一连串每步依赖上一步的运算，比如指针追逐 while (p) p = p->next，每步的地址都要等上一步 load 回来，每步就是一次完整的访存延迟，再强的乱序也重叠不了，这是算法结构决定的顶。第二处是乱序窗口大小，硬件同时在飞的指令数有上限，常见量级是几百条，窗口装满后取指必须停下等最老的指令退休，一次缓存未命中的长延迟能把整个窗口堵死，后面的独立指令根本进不来，这解释了为什么未命中不只拖慢那一条指令。第三处是退休带宽，每周期最多退休固定条数，投机错了还要整窗冲刷，窗口越大猜错越贵。超标量的发射宽度同理，取指、译码、重命名每一级都有每周期上限，最窄的一级就是整机吞吐的顶。所以衡量一段代码能跑多快，先找它的关键依赖链长度，再估窗口能不能藏住它的访存延迟，最后才看发射宽度，顺序反了就会把账算错。理解这三处边界，也就理解了为什么有些优化，比如把链表换成数组预取、把串行累加拆成多路，本质都是在缩短关键链或减小对窗口的压力。
    derivation: original
    sources:
