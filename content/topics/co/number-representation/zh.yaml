  - id: rounding
    title: 舍入模式：不只是四舍五入
    tldr: IEEE 754 定义了四种舍入，默认是就近偶数，它能避免系统性偏大。
    body: 尾数装不下时往哪边靠是个规则问题，IEEE 754 给了四种模式。就近舍入是默认，取最近的可表示数，正好卡在两数中间时取尾数最低位为偶数的那个，所以叫就近偶数或银行家舍入。为什么中间值要挑偶数而不是永远向上，因为大量中间值若一律向上，误差会单向累积成系统性偏大，而偶数规则让一半向上、一半向下，长期统计上误差互相抵消，长求和的漂移明显更小。其次是向零舍入即直接截断，C 里浮点转整数用的就是它，正数负数都往零靠。再有向上舍入恒取较大的、向下舍入恒取较小的，这两种合称定向舍入，单看每次都不准，但成对使用能算出结果的上下界，区间运算靠它给出保证包含真值的范围，数值验证里不可替代。硬件层面舍入模式是处理器状态寄存器里的一个开关，绝大多数程序全程保持就近偶数，只有做区间界或特定财务规则时才切换。走一个中间值例子，2.5 和 3.5 按就近偶数分别舍成 2 和 4，都取了偶数一边，而小学四舍五入会给 3 和 4，前者在成千上万次舍入后总和的偏差显著更小。记住一条实务结论，财务的四舍五入是十进制规则，和二进制硬件的就近偶数不是一回事，金额计算混用两者必在对账时差一分钱。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 2 章 浮点数
        url: http://csapp.cs.cmu.edu/
