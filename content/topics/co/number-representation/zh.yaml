  - id: point-one
    title: 为什么 0.1 + 0.2 != 0.3
    tldr: 0.1 在二进制里是无限循环小数，只能存近似值，误差加起来就露出来了。
    body: 0.1 存不准可以手算验证。把 0.1 转成二进制要反复乘 2 取整，得到 0.0001100110011 无限循环，循环节是 0011，就像 1 除以 3 在十进制写不完一样，1 除以 10 在二进制也写不完，因为 10 含因子 5 而二进制只认因子 2。尾数只有 23 位或 52 位，循环再长也要在某一位截断并舍入，于是存下的必然是离 0.1 最近的那个可表示数，float32 存的是 0.100000001490116，略大；double 存的是 0.1000000000000000055511，也略大。0.2 同理带一个自己的小误差，两数相加后误差叠起来，再和 0.3 的最近可表示数一比，正好落在相邻的另一个可表示数上，打印出来就是 0.30000000000000004。这不是 JS 的 bug，换 C、Python、Java 用 double 做同一件事结果一字不差，因为大家用的是同一个 IEEE 754 标准。推论有两条，凡是分母含 2 和 5 以外因子的十进制小数都存不准，比如 0.1、0.2、0.3、0.7 全军覆没，只有 0.5、0.25、0.75 这类分母是 2 的幂的才精确；其二，浮点相等比较必须带容差，金额必须绕开浮点，这两条纪律都从这一次手算里长出来。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 2 章 浮点数
