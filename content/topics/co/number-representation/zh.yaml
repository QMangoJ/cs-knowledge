  - id: rounding
    title: 舍入模式：为什么银行家舍入遇到正中间要挑偶数
    tldr: "[[IEEE 754]] 默认采用「就近偶数」舍入：卡在两格正中间时挑尾数末位是偶数的那一侧，让成千上万次运算后的向上偏差和向下偏差相互抵消，而不像四舍五入那样越算越偏大。"
    body: |-
      前面每次截断都要拿「舍入」拍板到底选哪一格，[[IEEE 754]] 定义了四种规矩。硬件默认叫「就近偶数」（俗称银行家舍入）：正常挑离真值最近的格子，一旦刚好卡在正中间 `.5` 的位置，就挑末位是偶数的那一侧——例如把 `2.5` 和 `3.5` 舍成整数，结果分别是 `2` 和 `4`。等一下，为什么不按小学学的四舍五入一律往上进位？因为大量中间值如果每次都无脑向上抬，连加几百万笔之后统计总和会明显偏大；改挑偶数一边，大致一半向上、一半向下，长期累积的误差自己就互相抵消了。

      另外三种模式各有专场：「向零舍入」就是一刀砍掉小数尾巴（截断），C 语言把 `double` 强转 `int` 时默认走这条路；「向上舍入」永远往大数那头靠、「向下舍入」永远往小数那头靠，这俩单算一笔都不准，成对跑一遍却能在科学计算的[[区间运算]]里严严实实框出真值的上下界。最后提醒一个财务高频雷区：财务的四舍五入是「十进制规则」，和二进制硬件的就近偶数根本不是一回事——结账系统拿二进制浮点算钱再去做四舍五入，对账时总会差那么一两分。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 2 章 浮点数
        url: http://csapp.cs.cmu.edu/
        claim: IEEE 754 舍入模式以就近偶数为默认
