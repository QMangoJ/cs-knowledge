  - id: lesson
    title: 实际写代码的五条避坑纪律，以及排错三问
    tldr: 浮点不用等号直接比，金额只存整数分或十进制，超 2 的 53 次方的 ID 在 JS 里转字符串，长求和从小往大加，跨机二进制先写死字节序。
    body: |-
      回到最初那两张故障单，把整堂课落成平时写代码的五条硬纪律。第一，比对两个浮点数永远别用 `==`，改看差值的绝对值是否小于按业务量级挑好的容差（单元测试断言浮点结果同理）。第二，钱、费率、积分全部用整数最小单位（分、厘、万分之一）或专用十进制库存储和计算，千万别用 float/double 算完账再去怪对账差一分。第三，订单 ID、雪花算法流水号一旦可能越过 `2⁵³`，后端吐给 [[JS]] 前端一律用字符串，本地大数运算改走 [[BigInt]]（记得 BigInt 不能和 Number 混算）。

      第四，大批量浮点数累加前先把绝对值小的数凑在一起加，或做树形分块求和，高精度科学计算用 Kahan 补偿求和，别让大数顺手吃光小数的贡献。第五，只要把原始内存字节跨语言或跨机器发送，接口合同里必须写死位宽、有无符号以及大端还是小端，省得读出面目全非的数字还查不出报错。

      最后带走排查数值怪象的三问自检，下次再遇数字不对劲直接挨个套：一问「是不是整数越界在表盘上绕了圈」——查无符号绕回或 C 有符号未定义溢出；二问「是不是掉进了 0.1 的二进制循环节，或 ID 挤进了间距变宽的 2 的 53 次方区」——查十进制浮点近似与安全整数上限；三问「是不是直接用了等号、大数吃小数，或者大小端排反了队」——查容差、累加顺序和字节序。牢记一点：浮点误差不是计算机算错了，而是有限位预算开出的账单。
    derivation: original
