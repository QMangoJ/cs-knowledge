  - id: bit-lab
    title: 动手实验：在位编辑器里亲眼看溢出和 0.1 舍入
    tldr: 在 8 位模式里给 11111111 与 01111111 分别加 1，就能直接看清无符号溢出和补码溢出的区别；再切到 float32 输入 0.1，拨动尾数最后 1 比特，看看 0.1 怎么卡在两个相邻格子中间。
    body: |-
      右侧是一个可以逐位点击翻转的位编辑器，下面同步显示这串比特按不同规则读出的结果。先在 8 位模式下验算两笔整数绕回：把 8 位全点成 `11111111`，按无符号读是 `255`，按补码读则是 `-1`（`-128 + 127`）。对它执行 `+1` 变成 `00000000`（第 9 位进位被丢弃）：按无符号看 `255 + 1` 绕回了 `0`，触发无符号溢出；可按补码看 `-1 + 1 = 0`，结果精准无误、没有发生有符号溢出！再反过来测 `01111111`（`127`）执行 `+1` 变成 `10000000`：无符号读是正常的 `128`，补码读却翻成了 `-128`（两正相加得负），这才是真正的有符号溢出。

      接着把模式切到 `float32` 并填入 `0.1`，32 位立刻拆开给你看：符号位 `0`，8 位阶码 `01111011`（无符号 123，减去偏移 127 得真指数 `-4`），23 位尾数 `10011001100110011001101`（十六进制 `0x3DCCCCCD`）。因为无限循环的 `0011` 在第 24 位要向上进位，实际落盘的是 `0.100000001490116119384765625`，比 `0.1` 多一点点。试着点一下把尾数最后一位从 `1` 翻成 `0`（`0x3DCCCCCC`），值立刻变成 `0.0999999940395355224609375`，比 `0.1` 偏得更远——可见 `0.1` 夹在这两格中间，硬件只是选了离它最近的那一格。
    derivation: original
    sources:
