  - id: float-add
    title: 浮点加法走例：对阶、相加、规格化、舍入
    tldr: 浮点加法不是逐位相加，要先对齐小数点，丢掉的低位就是误差来源。
    body: 拿 float 的简化版走一遍 0.5 加 0.0625，再看大数吃小数。两个数先写成规格化形式，0.5 是 1.0 乘 2 的负 1 次方，0.0625 是 1.0 乘 2 的负 4 次方。浮点加法第一步对阶，小指数向大指数看齐，0.0625 的尾数右移 3 位变成 0.001 乘 2 的负 1 次方，有效位从 1.000 变成 0.001，移出去的位直接丢掉，这一步叫对阶，是误差的第一个来源。第二步尾数相加得 1.001，第三步检查规格化，1.001 已是 1 点几的形式无需再移，第四步舍入到尾数位宽，结果是 1.001 乘 2 的负 1 次方即 0.5625，本例恰好精确。再把差距拉大，1.0 加 2 的负 24 次方做 float32 加法，对阶时小数的尾数要右移 24 位，而尾数只有 23 位，整个有效位被移出门外，结果还是 1.0，小数被大数完全吃掉。这就是大数吃小数的机制本身，不是玄学，长序列求和时先累加的全是大数、后面每个小数都被部分吃掉，误差单向累积。缓解办法都围绕对阶做文章，从小往大加让中间和保持小、成对分块求和让对阶发生在相近量级之间，补偿求和则把每次对阶丢掉的尾巴单独记账再补回来。把这四步背下来，任何浮点加法题都能手推，面试里问浮点为什么不满足结合律，答案就在对阶丢位上。
