  - id: fixed-vs-float
    title: 定点与浮点的选型：什么时候不用浮点
    tldr: 范围固定、要精确小数时定点数更合适，浮点赢在范围和通用性。
    body: 定点数是把整数按固定比例缩放，小数点位置在约定里写死。比如用一个 32 位整数存金额的角分，或者用 Q16.16 约定高 16 位整数低 16 位小数，它的加减就是整数加减完全精确，乘法后要移位修正比例。优点是行为处处可预测、没有不可表示的十进制小数陷阱、低端硬件没有浮点单元时也快；缺点是范围被小数位数吃死，比例选错不是溢出就是精度不够，且每个量都要人工管理比例，代码可读性差。浮点正相反，指数让范围自动伸缩，同一套运算通吃极大极小，编程心智负担小，代价是误差无处不在且和量级挂钩。选型判断可以走三问，数值范围是否事先可知且跨度不大，是则定点可行；是否要求十进制意义上的精确，比如账务，是则用整数或十进制数而不是二进制浮点；是否要和通用库、GPU、模型推理互通，是则老老实实用浮点并按容差设计。真实系统常是混合的，账务核心用整数分、统计展示转浮点，嵌入式控制里定点至今常见，模型量化里的整数权重加浮点缩放因子，本质也是定点思想的一次还魂，看懂这一层，量化参数里为什么每组都带一个 scale 就不用背了。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 2 章
