  - id: fixed-vs-float
    title: 定点 vs 浮点：什么时候把浮点数请出核心账本
    tldr: 定点数把小数点位置死死钉在整数缩放约定里（比如金额全存成「分」），换回十进制零误差；选定点还是浮点，只需看清范围跨度、十进制精度要求和硬件生态三件事。
    body: |-
      既然二进制浮点连 `0.1` 都留不住，那么银行算账、嵌入式控制没浮点单元时怎么算小数？答案叫「定点数」——乖乖用整数存，只在代码约定里把小数点的位置钉死。最常见的是账务系统全存成整数的「分」：`0.1` 元就是 `10` 分，`0.2` 元就是 `20` 分，`10 + 20 = 30` 分，一分钱不差；嵌入式与游戏里常用的 [[Q16.16]] 则是拿一个 32 位整数的高 16 位算整数、低 16 位算小数，加减直走高速整数电路，乘法后右移 16 位修正比例即可。它的短板是范围被写死、跨度一大就溢出，每个数的比例还得人肉记着。

      面对实际选型时只需问三件事：第一，数值跨度是否事先摸清且不大？大跨度（又要算毫厘又要算亿万）交给浮点；第二，是否要求十进制下的分毫不差（账务、计费、税率）？坚决请出二进制浮点，改用整数最小单位或专用十进制数；第三，是否要直接对接通用数学库、[[GPU]] 或神经网络推理？老实用浮点，并在比较处加上容差。顺带一提，如今大模型做 INT8 量化省显存，给一批整数权重配一个浮点缩放因子，骨子里正是定点数思维的现代回归。
    derivation: original
