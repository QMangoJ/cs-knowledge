steps:
  - id: bits
    title: 一切都是固定位数的二进制
    tldr: 内存里只有 0 和 1，而且每种类型的位数是固定的。
    body: |-
      一个 int 通常占 32 位，一个 double 占 64 位。
      位数固定，意味着能表示的数有限：要么有最大最小值，要么有精度损失。
      后面所有“奇怪现象”，都源于这一点。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 2 章
        url: http://csapp.cs.cmu.edu/
        claim: 数据以固定长度的位序列表示
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: swimlane
      actors:
        - lane: value
          id: v
          label: 数值
        - lane: bits
          id: b
          label: 二进制表示
          highlight: true
        - lane: calc
          id: c
          label: 运算结果
      messages: []
    log:
      - mode: 存储
        event: 数值被存成固定长度的二进制
  - id: unsigned-endian
    title: 无符号整数、十六进制和字节序
    tldr: 同样一串位，当无符号数和有符号数读，含义不同；多字节数据在内存里还有先后顺序。
    body: |-
      n 位无符号整数表示 0 到 2ⁿ−1；写二进制太长，所以常用十六进制，每一位正好对应 4 个二进制位。
      一个 4 字节整数在内存里占 4 个字节，x86-64 和大多数 ARM 设备把低位字节放在前面，这叫小端序；网络协议传输则约定大端序。
      所以读网络数据或二进制文件时，必须知道它是哪种字节序。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 2 章
        url: http://csapp.cs.cmu.edu/
        claim: 同样一串位，当无符号数和有符号数读，含义不同；多字节数据在内存里还有先后顺序。
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: swimlane
      actors:
        - lane: value
          id: v
          label: 数值
        - lane: bits
          id: b
          label: 二进制表示
          highlight: true
        - lane: calc
          id: c
          label: 运算结果
      messages:
        - id: m-unsigned-endian
          from: v
          to: b
          label: 低位字节放在低地址（小端）
          active: true
    log:
      - mode: 存储
        event: 多字节按小端存放
  - id: twos-complement
    title: 补码：负数怎么存
    tldr: 整数用补码表示负数，好处是加减法可以用同一套电路。
    body: |-
      补码把最高位当成“负的大数”，于是正负数的加法规则完全一样，CPU 不用为减法单独设计电路。
      代价是范围有限：32 位整数加到最大再加 1，硬件上会“绕回”成最小的负数，这叫溢出。
      注意：在 C 里有符号整数溢出是“未定义行为”，编译器不保证会绕回，不能依赖它；无符号整数才保证绕回。
      很多安全漏洞就出在没想到整数会溢出。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 2 章 整数表示
        url: http://csapp.cs.cmu.edu/
        claim: 补码表示及其溢出行为
        status: unverified
        note: 按 Daniel 决定不核对出处
      - ref: cs61c
        locator: Number Representation 讲义
        url: https://cs61c.org/
        claim: 补码统一了加减法运算
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: swimlane
      actors:
        - lane: value
          id: v
          label: 数值
        - lane: bits
          id: b
          label: 二进制表示
          highlight: true
        - lane: calc
          id: c
          label: 运算结果
      messages:
        - id: m-twos-complement
          from: v
          to: b
          label: 负数 → 补码
          active: true
    log:
      - mode: 整数
        event: 用补码表示，超范围会溢出
  - id: float
    title: 浮点数：二进制的科学计数法
    tldr: 小数用“符号 + 指数 + 尾数”存，像科学计数法，只不过底数是 2。
    body: |-
      浮点数能表示极大和极小的数，因为指数可以浮动。
      但尾数位数有限，大多数小数只能存一个最接近的近似值。
      JavaScript 的 Number 就是 64 位双精度浮点数，所以 JS 里的普通数字都遵守这套规则（BigInt 除外）。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 2 章 浮点数
        url: http://csapp.cs.cmu.edu/
        claim: IEEE 754 浮点表示由符号、指数、尾数组成
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: swimlane
      actors:
        - lane: value
          id: v
          label: 数值
        - lane: bits
          id: b
          label: 二进制表示
          highlight: true
        - lane: calc
          id: c
          label: 运算结果
      messages:
        - id: m-float
          from: v
          to: b
          label: 小数 → 浮点格式
          active: true
    log:
      - mode: 浮点
        event: 存成近似值
  - id: point-one
    title: 为什么 0.1 + 0.2 != 0.3
    tldr: 0.1 在二进制里是无限循环小数，只能存近似值，误差加起来就露出来了。
    body: |-
      就像 1/3 在十进制里写不完，0.1 在二进制里也写不完，只能截断。
      0.1 和 0.2 各带一点误差，相加后的结果和 0.3 的近似值不是同一个数，于是得到 0.30000000000000004。
      这不是 JS 的 bug，C、Python、Java 用 double 都一样。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 2 章 浮点数
        url: http://csapp.cs.cmu.edu/
        claim: 十进制小数在二进制浮点中通常无法精确表示
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: swimlane
      actors:
        - lane: value
          id: v
          label: 数值
        - lane: bits
          id: b
          label: 二进制表示
        - lane: calc
          id: c
          label: 运算结果
          highlight: true
      messages:
        - id: m-point-one
          from: b
          to: c
          label: 0.1 + 0.2 ≈ 0.30000000000000004
          active: true
    log:
      - mode: 运算
        event: 结果与 0.3 存在微小误差
  - id: bit-lab
    title: 动手：在位编辑器里看数字的二进制
    tldr: 同样 8 个 1，当无符号数是 255，当补码是 -1；0.1 存进 float32 后其实是 0.100000001490116…。
    body: |-
      右边是一个位编辑器：每一位都可以点击翻转，下面同时显示这串位按不同规则解读出来的值。
      先试补码：宽度选 8 位，把 8 位全部点成 1，也就是 11111111。按无符号读是 255，按补码读是 -1。补码里最高位代表 -128，其余 7 位加起来是 127，-128 + 127 = -1。
      再把它加 1：8 位放不下第 9 位，结果绕回 00000000，这就是上一节说的溢出。
      然后切到 float32 模式，输入 0.1。32 位分成三段：符号 0，指数 01111011（123，减去偏移 127 得 -4），尾数 10011001100110011001101。
      0.1 的二进制是 0.000110011001100…，无限循环，尾数只有 23 位，最后一位被舍入成 1。所以实际存下的是 0.100000001490116119384765625，比 0.1 稍大。
      JS 的 Number 是 64 位双精度，尾数有 52 位，误差小得多但仍然存在：0.1 实际是 0.1000000000000000055511151231257827…，这就是 0.1 + 0.2 != 0.3 的根源。
      可以试试：把尾数最后一位改成 0，看值变成 0.0999999940395355…，比 0.1 小；说明 0.1 夹在两个相邻的 float32 之间，只能取更近的那个。
    derivation: original
    sources:
      - ref: csapp
        locator: "第 2 章 整数表示与 IEEE 754 浮点"
        claim: 补码与单精度浮点的位模式
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: lab
      lab: bit-editor
      caption: 点击每一位翻转，对比无符号、补码、float32 三种读法
      params:
        width: 8
        widths: [8, 16, 32]
        mode: twos
        modes: [unsigned, twos, float32]
        value: "11111111"
      cases:
        - input: {bits: "11111111", mode: unsigned}
          expect: {decimal: 255}
        - input: {bits: "11111111", mode: twos}
          expect: {decimal: -1}
        - input: {bits: "11111111", mode: twos, op: "+1"}
          expect: {bits: "00000000", decimal: 0, overflow: true}
        - input: {value: 0.1, mode: float32}
          expect: {bits: "0 01111011 10011001100110011001101", hex: "0x3DCCCCCD", exponent: -4, stored: "0.100000001490116119384765625"}
        - input: {bits: "0 01111011 10011001100110011001100", mode: float32}
          expect: {hex: "0x3DCCCCCC", stored: "0.0999999940395355224609375"}
    log:
      - mode: 动手实验
        event: 同一串位，换一种解读规则就是不同的数
  - id: float-special
    title: 浮点数的特殊值
    tldr: 浮点数里有正负无穷、NaN 和 -0，还有“越大越稀疏”的精度。
    body: |-
      除以 0 得到 Infinity，0/0 得到 NaN（不是数），而且 NaN 不等于任何值，连它自己也不等于。
      浮点数的精度是相对的：数越大，相邻两个可表示的数之间间隔越大，所以 2⁵³ 以上的整数在 double 里就不能一一表示了。
      这就是 JS 的 Number.MAX_SAFE_INTEGER 是 2⁵³−1 的原因。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 2 章
        url: http://csapp.cs.cmu.edu/
        claim: 浮点数里有正负无穷、NaN 和 -0，还有“越大越稀疏”的精度。
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: swimlane
      actors:
        - lane: value
          id: v
          label: 数值
        - lane: bits
          id: b
          label: 二进制表示
        - lane: calc
          id: c
          label: 运算结果
          highlight: true
      messages:
        - id: m-float-special
          from: b
          to: c
          label: 0/0 → NaN；NaN ≠ NaN
          active: true
    log:
      - mode: 特殊值
        event: 无穷、NaN、-0
  - id: lesson
    title: 实际写代码怎么办
    tldr: 了解边界和误差，按场景选合适的表示。
    body: |-
      比较浮点数时，判断两者之差是否足够小，而不是直接用 ==。
      算钱用整数“分”来存，或者用十进制库，不要用浮点数。
      JS 里超过 Number.MAX_SAFE_INTEGER 的整数会失去精度，需要用 BigInt，后端传来的 64 位 ID 最好当字符串处理。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 2 章
        url: http://csapp.cs.cmu.edu/
        claim: 浮点舍入误差与整数精度限制
        status: unverified
        note: 按 Daniel 决定不核对出处
    canvas:
      kind: swimlane
      actors:
        - lane: value
          id: v
          label: 数值
        - lane: bits
          id: b
          label: 二进制表示
        - lane: calc
          id: c
          label: 运算结果
          highlight: true
      messages: []
    log:
      - mode: 总结
        event: 按场景选择表示方式
