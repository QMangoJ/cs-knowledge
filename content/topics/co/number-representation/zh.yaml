      - 内存里只有 0 和 1，而且每种类型的位数是固定的。
  - id: unsigned-endian
    title: 无符号整数、十六进制和字节序
    tldr: 同样一串位，当无符号数和有符号数读，含义不同；多字节数据在内存里还有先后顺序。
    body: 同一串位，换一种解释就是另一个数。8 位模式 11111111，按无符号读是 255，按补码读是负 1，位本身没有对错，类型决定解释规则，C 里有符号和无符号混着比较时编译器会把有符号悄悄转成无符号，负 1 一转就变成 42 亿量级的大数，比较结果当场反转，这是真实高频 bug。书写上二进制太长，人用十六进制，一位十六进制正好对应 4 位二进制，0xFF 就是 8 个 1，两位一组永不串位。再看字节序，一个 4 字节整数 0x12345678 在内存里占连续 4 个字节，小端序把最低字节 0x78 放最低地址，x86-64 和主流 ARM 都用小端；大端序把最高字节 0x12 放前面，网络协议统一用大端以便跨机器不歧义。走例，同一台小端机器把这个整数原样发上网，大端解读的对端会读成 0x78563412，值完全变了，所以序列化、文件格式、网络协议都必须写明字节序并在边界做转换，htonl 这类函数干的就是这件事。误解澄清，字节序只影响多字节数据在内存里的字节排列，不影响单个字节内部的位顺序，也不影响寄存器里值的大小，排查时先分清是字节级问题还是位级问题。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 2 章
        url: http://csapp.cs.cmu.edu/
        claim: 同样一串位，当无符号数和有符号数读，含义不同；多字节数据在内存里还有先后顺序。
        status: verified
