status: published
license: CC-BY-4.0
title: 数字在内存里长什么样：补码与浮点数
summary: 内存里不认正负号也不认小数点，所有数字都只能挤进固定长度的一串 0 和 1 里。位预算一旦写死，整数用尽了就只能像表盘一样绕回翻负，小数则在连续实数轴上按二进制科学计数法稀疏取点、从存进去那一刻就带上了近似尾巴。全课先把位宽约束立住，再拆穿补码加减复用电路与溢出绕回、IEEE 754 三段位编码与 0.1 精度丢失，最后收成算钱与传大 ID 的避坑准则。
premise: 你刚把一个结账系统推上线，立刻接到两张让人摸不着头脑的故障单：前端用 [[JS]] 算 0.1 元加 0.2 元，屏幕上明晃晃多出一条 0.30000000000000004 的尾巴；后台 C 服务里的积分计数器一直往上加，涨到边界再加 1 却突然翻成负数。问题全不在加减法写错了，而是数字一存进内存就按位模式变了形——这一课就拿 C 的 [[int]]、[[double]] 和 JS 的 Number 当样本，把这排 0 和 1 的底细翻开。
position: 本课继续留在「调用与数据的形态」板块，承接上一课函数调用时摆好在栈帧里的局部变量：上一课只分清了谁住在哪一格、怎么跟返回地址挨着，这一课则钻进格子里面，把 [[int]] 的补码、字节序和 [[float32]]、[[double]] 的浮点三段格式逐位算开。看懂单个数字在比特层面的范围与误差，下一课看 [[GPU]] 成千上万个线程同时吞吐整批浮点数、为何量化能省显存时，直觉就顺了。
bridge:
  prev: 上一课把参数、返回地址和局部变量逐块码进了栈帧，但还没打开变量格子看里面装的到底是什么；这一课就掀开格子，看看整数和小数是怎么变成一串 0 和 1 躺进去的。
  next: 单个数字的比特长相算透之后，下一课就把镜头拉到 [[GPU]]——看它怎样同时拉起成千上万个线程成束吞吐这批浮点数，以及控制流分叉时为什么会拖慢整束线程。
overview:
  - key: 一句话总结
    value: 内存里的一切都是固定位宽的二进制串，无论是整数还是小数，能排出的不同组合在选定类型的那一刻就封顶了。装不下的整数会顺着环绕回来，小数则大多根本找不到精确对应的格子，只能挑最近的近似值顶上。
  - key: 整数
    value: 有符号整数用补码存负数，让正负数加减法共用同一套硬件加法器电路，还顺手消灭了「正零、负零」两个零。代价是范围有界、左右不对称，超界就绕回（如 8 位有符号最大 127，再加 1 翻成 -128）。
  - key: 浮点数
    value: 浮点数按 [[IEEE 754]] 标准拆成符号、移码阶码、尾数三段，本质上是二进制版的科学计数法。阶码撑开量级范围，尾数卡死有效精度——数越大，相邻两个能表示的数隔得越稀疏。
  - key: JS 的 Number
    value: JavaScript 只有一种常规数字类型 Number，底层就是 64 位双精度浮点（[[double]]），整数小数不分家。53 位有效尾数卡死了精确整数的上限，订单号或用户 ID 一旦突破 2 的 53 次方就会悄悄末位撞车。
  - key: 实用建议
    value: 比较两个浮点数永远别直接写 ==，改比差值的绝对值是否落在容差带内；算钱、积分等要求十进制分毫不差的业务，一律转成整数「分」或用专用十进制库，别让二进制浮点进账本。
  - key: 无符号 vs 有符号
    value: 同一串比特按无符号读还是按补码读，含义南辕北辙——8 个 1 既可以是 255，也可以是 -1。两种类型在 C 语言里混在一起比大小时，编译器会悄悄转成无符号，当场反转大小关系。
  - key: 字节序
    value: 多字节数字在内存里谁排前面叫字节序：[[x86-64]] 与主流 [[ARM]] 用小端（低位字节放低地址），网络协议统一规定大端（高位在前）。跨机器直传原始内存字节时不在边界转换，数值就会整个倒过来。
  - key: 特殊值
    value: 浮点数把阶码全 1 留给特殊状态：[[Infinity]] 代表算爆或除零得到的无穷，[[NaN]] 代表 0 除以 0 这类无意义结果且自己不等于自己（NaN !== NaN）。此外零还分 +0 和 -0，倒数会分别得到正负无穷。
  - key: 类型转换
    value: 跨类型转换常悄悄丢信息：64 位大整数强转 double 会磨掉低位尾数精度，double 转 [[int]] 则直接向零砍掉小数部分，超范围时行为更是不可靠。
  - key: 在终端里看一看
    value: python3 -c 'print(0.1+0.2)'　看到 0.30000000000000004；node -e 'console.log(Number.MAX_SAFE_INTEGER)'
