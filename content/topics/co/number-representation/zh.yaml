steps:
  - id: bits
    title: 一切都是固定位数的二进制
    tldr: 内存里只有 0 和 1，而且每种类型的位数是固定的。
    body: 内存里只有 0 和 1，而且每种类型的位数是写死的。一个 char 占 8 位，一个 int 通常占 32 位，一个 double 占 64 位，JS 的 Number 干脆全员 64 位双精度。位数固定这句话听起来平淡，它却是后面一切奇怪现象的总源头，能表示的不同位模式总数只有 2 的位数次方个，int 只有约 42 亿个模式，可现实中的整数无穷无尽，于是必然有上限和下限，超出就溢出；小数更是连续的，固定模式数去套连续的实数轴，绝大多数实数压根没有对应模式，只能就近找一个冒充，这就是浮点误差的数学必然，不是哪个语言实现得不好。换个角度，位数就是预算，每多一位预算翻一倍，32 位到 64 位不是大了一倍而是大到约 42 亿倍，这解释了为什么 64 位时间戳和 64 位 ID 能用很久，也解释了为什么量化推理里每砍一位都要小心翼翼，每砍一位可表示的刻度就少一半。学习这一课的方法是把每个现象都追回到同一句话，模式总数有限，于是取舍无处不在。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 2 章
        url: http://csapp.cs.cmu.edu/
        claim: 数据以固定长度的位序列表示
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
