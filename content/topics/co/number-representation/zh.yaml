level: 基础
minutes: 28
prereq: []
objectives:
  - 用补码表示负数并解释只有一份 0
  - 拆解 float32 的符号/阶码/尾数并算出实际值
  - 解释 0.1 为什么存不准、量化为什么可行
aiLink: 模型量化（FP16/INT8/INT4）的全部直觉都来自这课：位宽、范围与精度的取舍。理解浮点误差与补码范围，就理解低精度推理为什么会掉点、为什么需要缩放因子与校准。
quiz:
  - q: 8 位补码能表示的范围是？
    options:
      - -127..127
      - -128..127
      - 0..255
      - -255..0
    answer: 1
    explain: 补码负数多一个：-2^7 到 2^7-1，且 0 只有一份编码。
  - q: float32 中 0.1 存不准是因为？
    options:
      - CPU 太慢
      - 二进制小数无法有限表示十进制 0.1，只能存最接近的值
      - 内存位翻转
      - 编译器 bug
    answer: 1
    explain: 1/10 在二进制下是无限循环小数，截断后得到 0.100000001490116…。
  - q: INT8 量化把权重压到 1 字节，精度损失靠什么补？
    options:
      - 更大的内存
      - 缩放因子把浮点范围线性映射到 256 个整数刻度
      - 更快的 CPU
      - 更多层
    answer: 1
    explain: 每组权重配 scale（有时还有 zero-point），用可控误差换 4 倍的体积与带宽节省。
design:
  - mechanism: 补码把最高位权重设为负值，让正负整数加减共用同一套无符号加法电路，并且零只有唯一一份编码。
    problem: 早期原码只拿最高位当正负号，加法器碰到负数就得切换成减法，还多出 +0 和 -0 两个零，判零和比大小都得额外打补丁。
    choice: 把负数定义为 2 的 n 次方表盘上的补数，让加法在这个环上封闭起来，减法统一变成「加对方的补码」，一套电路跑遍所有整数加减。
    tradeoff: 代价是正负范围不对称、负侧多出一个孤立数，最小负数没有对应的正数搭档，对它取负或取绝对值依然会溢出，必须靠语言和边界检查照顾。
    root: 根源在于模运算的代数封闭性：只要把编码闭合成首尾相连的圆环，硬件就只需要加法这一种运算，补码胜出正是为了硬件极致简化。
  - mechanism: 浮点阶码不存补码而存加上固定偏移的移码（float32 偏移 127），使阶码按无符号比大小与真指数的大小顺序完全一致。
    problem: 指数既有正数又有负数，如果拿补码存阶码，负指数最高位是 1，整串位看作无符号整数反而会排到正指数前面，无法直接用整数比较器给浮点数比大小。
    choice: 给真指数统一加一个偏移量平移成非负整数，同符号的一串浮点位模式直接按无符号整数排序就是数值大小顺序，比较与求极值都能复用整数通路。
    tradeoff: 代价是人眼读阶码时得多减一次偏移才能还原真指数，同时还必须把全 0 与全 1 两个阶码征用出来表示非规格化数和特殊值。
    root: 根源在于存储格式要优先服务于高频操作：程序里比较大小比人工看二进制位频繁得多，用一次简单平移换全程快速比较是一笔划算买卖。
  - mechanism: 浮点数把位宽切成符号、阶码、尾数三段，用随指数自动伸缩的相对精度覆盖极大与极小的数值范围，还靠隐藏位白赚一位精度。
    problem: 定点数范围和小数精度你挤我我挤你，位宽一固定，既装不下天文大数又保不住微观精度，通用计算迫切需要同一类型通吃大跨度。
    choice: 让小数点跟着指数浮动，把尾数位宽专门用来保「相对精度」，64 位就能横跨 10 的正负几百次方量级，一口气搞定跨度难题。
    tradeoff: 代价是绝对精度越往大数走越稀疏、十进制 0.1 这类小数普遍存不准、连加还不满足结合律，程序员从此必须自己盯紧精度和舍入纪律。
    root: 根源在于实数轴的信息量无穷而硬件位宽有限，浮点选择了优先保住量级覆盖与相对误差稳定，把绝对误差当成必须接住的物理账单。
