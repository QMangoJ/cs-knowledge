  - id: float-special
    title: 特殊值与稀疏规律：无穷、NaN、-0，以及 2 的 53 次方边界
    tldr: 阶码全 1 和全 0 被拿来编码无穷大、NaN 和渐进下溢的非规格化数；更关键的是浮点刻度越往大数走越稀疏，超过 2 的 53 次方后 double 连相邻整数都分不出来。
    body: |-
      常规阶码把正常大小的小数铺满后，[[IEEE 754]] 特意保留了阶码「全 1」和「全 0」两头当特殊标志。阶码全 1 且尾数全 0 代表 [[Infinity]]（比如 `1.0 / 0.0` 或算爆了上限）；阶码全 1 且尾数非 0 代表 [[NaN]]（不是一个数，来自 `0.0 / 0.0` 或负数开平方）。NaN 有两条出了名的怪脾气：第一，它和任何值比大小全返回假，甚至 `NaN === NaN` 也是假的，判它只能用专门的 `Number.isNaN` 或 `isnan`，放进排序或哈希表键里必出乱子；第二，NaN 像病毒一样一路传染，任何数跟它算一笔都会变 NaN，报表整列变 NaN 时得往上游抓第一个产生它的地方。另外浮点还有 `+0` 和 `-0` 两个零（符号位不同）：直接用等号比相等，但 `1 / -0` 会得到负无穷；而阶码全 0 时则放弃隐藏位，用非规格化数让接近 0 的精度缓缓下降，不至于突然断崖归零。

      同时别忘了浮点刻度在数轴上是「越往两边走越稀疏」的：因为每升一次 2 的幂区间，可分配的尾数位宽都一样多（[[double]] 固定 52 位），所以 1 到 2 之间挤满了 `2⁵²` 个刻度，到了 `2⁵³`（约 9 千万亿）到 `2⁵⁴` 之间也还是 `2⁵²` 个刻度，相邻两格的间距正好拉宽到 `1`。再往上翻一倍，间距直接变 `2`、变 `4`，奇数彻底消失——这就是为什么 [[JS]] 把 `Number.MAX_SAFE_INTEGER` 钉在 `2⁵³ - 1`，再大哪怕 `id + 1` 都可能等于原值、订单号悄然撞车。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 2 章
        url: http://csapp.cs.cmu.edu/
        claim: 浮点数里有正负无穷、NaN 和 -0，还有“越大越稀疏”的精度。
