  - id: bit-lab
    title: 动手：在位编辑器里看数字的二进制
    tldr: 同样 8 个 1，当无符号数是 255，当补码是 -1；0.1 存进 float32 后其实是 0.100000001490116…。
    body: 右边是一个位编辑器，每一位都可以点击翻转，下面同时显示这串位按不同规则解读出来的值。先试补码，宽度选 8 位，把 8 位全部点成 1，也就是 11111111，按无符号读是 255，按补码读是负 1，补码里最高位代表负 128，其余 7 位加起来是 127，负 128 加 127 等于负 1。再把它加 1，8 位放不下第 9 位，进位被丢掉，结果绕回 00000000，按无符号看 255 加 1 变成 0，这是无符号溢出，按补码看这是负 1 加 1 等于 0，结果完全正确，没有发生有符号溢出。对比真正的有符号溢出，01111111 即 127 加 1 得 10000000，按补码读是负 128，两个正数相加得到负数，说明结果超出了 8 位补码范围负 128 到 127，这时没有向第 9 位进位，按无符号看 127 加 1 等于 128 又是对的。所以同一次加法是否溢出要看按哪种规则读，无符号看最高位有没有进位出去，补码看同号相加是否得到异号。然后切到 float32 模式输入 0.1，32 位分成三段，符号 0，阶码 01111011 即 123，减偏移 127 得负 4，尾数 10011001100110011001101。0.1 的二进制是 0.0001100110011 无限循环，尾数只有 23 位，最后一位被舍入成 1，实际存下 0.100000001490116119384765625，比 0.1 稍大。JS 的 Number 是 64 位双精度，尾数 52 位，误差小得多但仍在，0.1 实际是 0.1000000000000000055511151231257827，这就是 0.1 加 0.2 不等于 0.3 的根源。可以试试把尾数最后一位改成 0，值变成 0.0999999940395355，比 0.1 小，说明 0.1 夹在两个相邻 float32 之间，只能取更近的那个，舍入从来不是对错问题而是距离问题。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 2 章 整数表示与 IEEE 754 浮点
        claim: 补码与单精度浮点的位模式
        status: verified
