  - id: float-add
    title: 浮点加法四步曲：为什么大数会把小数整口吃掉
    tldr: 两个浮点数相加要走完「对阶、相加、规格化、舍入」四步；对阶时小指数的尾数要往右移，如果两数差到 24 个数量级（如 1.0 加 2 的负 24 次方），小数在 float32 里会被直接移出门外。
    body: |-
      两张浮点数相加不是对齐最末位直接相加，硬件得严密跑四步，先拿简化版的 `0.5 + 0.0625` 走一趟。第一步先把两个数摆成统一的规格化形式：`0.5 = 1.0 × 2⁻¹`，`0.0625 = 1.0 × 2⁻⁴`。指数不一样没法直接加，于是第二步「对阶」，小指数向大指数对齐：`0.0625` 的指数要从 `-4` 抬到 `-1`，尾数必须向右退 3 位变成 `0.001 × 2⁻¹`。第三步尾数相加得到 `1.001 × 2⁻¹`，检查「规格化」刚好已经是 `1.` 开头不用再移；第四步「舍入」进固定尾数宽度，得到精确答案 `0.5625`。

      看着挺温和，把两数差距拉大到 [[float32]] 算 `1.0 + 2⁻²⁴` 就出大事了。对阶时，`2⁻²⁴` 要跟 `1.0 = 1.0 × 2⁰` 对齐指数，尾数必须整整右移 24 位——可 float32 加上隐藏位总共才 24 位有效位！右移 24 位后，原本那个 `1` 直接被挤出了 24 位窗口之外，变成全 `0`，相加结果纹丝不动还是 `1.0`——小数被大数整口吃掉了。

      这直接解释了为什么浮点加法不满足结合律：`(1e20 + -1e20) + 1.0` 结果是 `1.0`，而 `1e20 + (-1e20 + 1.0)` 里 `1.0` 先被 `-1e20` 吃光，结果变成 `0.0`！所以长序列累加统计时，要从小往大排序后再加、或者树形两两归并求和，精度要求极高时则用补偿求和把每次对阶移出去的尾巴另找个变量记账。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 2 章 浮点数
        url: http://csapp.cs.cmu.edu/
        claim: 浮点加法依次经历对阶、尾数相加、规格化与舍入
        status: verified
