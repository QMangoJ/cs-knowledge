    log:
      - mode: 存储
        event: 数值被存成固定长度的二进制位串，位数由类型决定
    points:
      - 内存里只有 0 和 1，而且每种类型的位数是固定的。
  - id: unsigned-endian
    title: 同一串位有两种读法，多字节还有排队方向
    tldr: 8 个 1（11111111）按无符号读是 255、按补码读是 -1，混在一起比大小会当场反转；4 字节数在内存里按小端（低字节在前）还是大端排布，跨机器传字节流时必须统一。
    body: |-
      既然内存里躺的永远只是一排 0 和 1，那它代表哪个数，全看你拿哪本字典去读。同样一串 8 位 `11111111`，按无符号整数读是 `255`，按有符号补码读却是 `-1`，比特本身没有对错，类型决定了怎么解释它。写 C 代码时最阴险的坑就是混着用：如果写一句 `if (a < b)`，其中 `int a = -1` 而 `unsigned int b = 1`，编译器会悄悄把 `-1` 当成无符号的 32 个 1（约 42.9 亿），结果 `-1 > 1` 居然判为真！平时人眼看太长的 0 和 1 容易花，习惯每 4 位收成 1 位十六进制，8 个 1 写作 `0xFF`，既齐整又不错位。

      如果是占用多个字节的数，比如一笔订单编号 `0x12345678`（4 字节），它按字节放进内存时还有谁先谁后的排队问题。我们日常用的 [[x86-64]] 电脑和绝大多数 [[ARM]] 手机用「小端序」：把最低位的零头字节 `0x78` 放在最低地址，最高位的 `0x12` 放在最高地址，内存里从低到高看着是 `78 56 34 12`。而网络传输统一约定用「大端序」，像人写数字那样最高位 `0x12` 摆在最前面。

      要是小端机器把内存里的 4 字节直接扔上网线，大端收件方一拆就会读成 `0x78563412`，金额直接乱套——所以网络编程要在边界调用 [[htonl]] 这类函数把字节序倒正。记住一条排错边界：字节序只调换「字节与字节之间」的顺序，每个字节内部的 8 个比特顺序纹丝不动。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 2 章
        url: http://csapp.cs.cmu.edu/
        claim: 同样一串位，当无符号数和有符号数读，含义不同；多字节数据在内存里还有先后顺序。
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
