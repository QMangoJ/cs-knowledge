level: 基础
minutes: 28
prereq: []
objectives:
  - 用补码表示负数并解释只有一份 0
  - 拆解 float32 的符号/阶码/尾数并算出实际值
  - 解释 0.1 为什么存不准、量化为什么可行
aiLink: 模型量化（FP16/INT8/INT4）的全部直觉都来自这课：位宽、范围与精度的取舍。理解浮点误差与补码范围，就理解低精度推理为什么会掉点、为什么需要缩放因子与校准。
quiz:
  - q: 8 位补码能表示的范围是？
    options:
      - -127..127
      - -128..127
      - 0..255
      - -255..0
    answer: 1
    explain: 补码负数多一个：-2^7 到 2^7-1，且 0 只有一份编码。
  - q: float32 中 0.1 存不准是因为？
    options:
      - CPU 太慢
      - 二进制小数无法有限表示十进制 0.1，只能存最接近的值
      - 内存位翻转
      - 编译器 bug
    answer: 1
    explain: 1/10 在二进制下是无限循环小数，截断后得到 0.100000001490116…。
  - q: INT8 量化把权重压到 1 字节，精度损失靠什么补？
    options:
      - 更大的内存
      - 缩放因子把浮点范围线性映射到 256 个整数刻度
      - 更快的 CPU
      - 更多层
    answer: 1
    explain: 每组权重配 scale（有时还有 zero-point），用可控误差换 4 倍的体积与带宽节省。
design:
  - mechanism: 补码用最高位负权重表示负数，让正负数的加减共用同一套无符号加法电路，0 只有一份编码。
    problem: 原码方案里符号位要单独处理，加法器遇到负数就得切换成减法，还出现正零负零两个零，比较和判零都要额外打补丁，硬件与语义都别扭。
    choice: 把负数定义成模 2 的 n 次方意义下的补数，加法在这个环上天然封闭，减法统一成加补码，一套电路走遍所有整数加减且零唯一。
    tradeoff: 代价是范围左右不对称，负侧多一个数，最小负数没有正搭档，取绝对值和取负都可能溢出，这类边界必须靠程序员和语言规则单独照顾。
    root: 根源是模运算的代数结构，加法群在环上封闭才允许电路复用，补码胜出不是因为它更像数学上的负数，而是因为它让硬件只剩一种运算。
  - mechanism: 浮点阶码用移码即加固定偏移存储，float32 偏移 127，存下的阶码按无符号大小序与真实指数大小序完全一致。
    problem: 指数有正有负，若用补码存阶码，负指数的位模式会比正指数大，浮点数就不能再当作一个整体用整数比较器直接比大小，还要先拆字段。
    choice: 移码把指数整体平移到非负区间，符号相同的一串浮点位模式可以直接按无符号整数排序，比较、取最大最小都能复用整数通路。
    tradeoff: 代价是每个读到阶码的人都要先减偏移才得到真指数，心算和调试时多一步换算，全 0 与全 1 两个阶码还要被征用去表示非规格化数和特殊值
    root: 根源是表示要服务于最频繁的操作，浮点比较的频率远高于人工读阶码，让位模式的字典序等于数值序，是用一次平移换全程便利的典型设计
  - mechanism: 浮点用符号、阶码、尾数三段分配固定位宽，以相对精度换取随指数伸缩的巨大范围，尾数还靠隐藏位白赚一位。
    problem: 定点数范围与精度互相挤占，位宽固定时要么表示不了天文数字和微观量，要么小数位不够，而科学计算和通用编程要求同一类型通吃。
    choice: 让小数点随指数浮动，精度只和尾数位宽挂钩且是相对的，32 位就能覆盖 10 的正负 38 次方量级，范围问题被指数一次解决。
    tradeoff: 代价是精度随数值变大而变稀、十进制小数普遍存不准、加法要对阶且不满足结合律，正确性纪律从此成为每个程序员的必修课。
    root: 根源是实数轴的信息量无穷而位宽有限，浮点选择优先保住量级覆盖，把误差摊成相对误差，这是对物理世界测量方式最贴合的一种妥协。
