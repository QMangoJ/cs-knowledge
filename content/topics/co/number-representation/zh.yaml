  - id: point-one
    title: 手算 0.1 + 0.2，看透 0.30000000000000004 从哪冒出来
    tldr: 就像 1/3 在十进制里写不完一样，1/10 变成二进制也是无限循环小数 0.0001100110011…；在 52 位尾数处截断舍入后，0.1 和 0.2 各自带着一点微小正偏差，相加正好跨进相邻的下一格。
    body: |-
      现在把开头第一张故障单当场验算破案。为什么 `0.1` 存进计算机就不准了？跟 `1 ÷ 3` 在十进制写成 `0.33333...` 永远写不到头是同一个数学道理——十进制底数是 10，分母含因子 3 就除不尽；二进制底数是 2，分母只要含有 `2` 以外的质因子（比如 `10 = 2 × 5` 里的 `5`），小数部分就必然无限循环！不信我们手算一遍把 `0.1` 乘 2 取整：`0.1×2 = 0.2`（0），`0.2×2 = 0.4`（0），`0.4×2 = 0.8`（0），`0.8×2 = 1.6`（1，留 `0.6`），`0.6×2 = 1.2`（1，留 `0.2`）……看，`0.2` 又撞回来了！于是 `0.1` 的二进制是 `0.0001100110011...`，以 `0011` 永无止境地循环。

      无论是 [[float32]] 的 23 位尾数还是 [[double]] 的 52 位尾数，循环再长也得在最后一位咔嚓截断并往最近的可表示数舍入。存进 double 后，`0.1` 实际变成约 `0.10000000000000000555...`（比真 0.1 略大一点点），`0.2` 也同样略大一点点；两个各自偏大的近似数加在一起再做一次舍入，结果刚好越过 `0.3` 最近可表示数，落到了紧邻着它的下一格——`0.30000000000000004`。用右侧 Python 代码跑一遍 `0.1 + 0.2` 和查看 32 位字节 `3dcccccd`，结果分毫不差：这不是 [[JS]] 独有的 bug，换 C、Python、Java 用硬件 [[IEEE 754]] 算出来一字不差。

      从此记住两条铁推论：第一，十进制小数里只有分母是 2 的幂（`0.5`、`0.25`、`0.75`）才能在二进制浮点里分毫不差，`0.1`、`0.2`、`0.3`、`0.7` 统统是近似值；第二，算钱绝对不能碰浮点，比较两个浮点数也只能看差值是不是小于允许误差。
    derivation: original
    sources:
