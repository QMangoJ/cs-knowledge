  - id: float-special
    title: 浮点数的特殊值
    tldr: 浮点数里有正负无穷、NaN 和 -0，还有“越大越稀疏”的精度。
    body: 阶码全 0 和全 1 被保留作特殊用途，这是理解浮点边界的关键。全 1 且尾数为 0 表示无穷大，非零数除以零或溢出上冲都会得到它；全 1 且尾数非 0 表示 NaN，来自 0 除以 0、负数开根号这类没有实数结果的运算。NaN 有个独一无二的性质，它和任何值包括它自己比较都不相等，连等号都返回假，所以判断 NaN 只能用专门的 isnan 或看它是否不等于自己，拿 NaN 做排序键和字典键都会得到诡异结果，因为它破坏了全序。符号位还要单独说，浮点有正零和负零两个零，位模式不同、比较起来相等，但 1 除以正零是正无穷、1 除以负零是负无穷，某些函数能把它们区分开。精度分布也不是均匀的，尾数固定位决定相对间隔，数越大相邻可表示数的间距越大，double 在 2 的 53 次方附近间距已经是 1，整数还能一一对应，再往上间距变 2、变 4，整数开始成片丢失，这正是 JS 的 MAX_SAFE_INTEGER 取 2 的 53 次方减 1 的原因，超过它的整数 ID 传给前端必然串号，必须当字符串传。另一端靠近零处还有非规格化数，阶码全 0 时放弃隐藏位换取更小的可表示数，让精度在零附近缓慢降级而不是突然断崖，这叫渐进下溢。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 2 章
