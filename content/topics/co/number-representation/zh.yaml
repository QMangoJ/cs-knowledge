  - id: float
    title: 浮点数：二进制版的科学计数法
    tldr: "[[IEEE 754]] 把 32 位或 64 位切为符号、移码阶码、尾数三段：阶码加上偏移存成非负整数方便硬件直接比大小，尾数靠隐含首位的 1 白赚一位精度。"
    body: |-
      整数装不下小数，现在换看小数怎么放。十进制里写天文大数或原子尺寸靠科学计数法，比如 `6.02 × 10²³`，拆成正负号、有效数字 `6.02` 和指数 `23`。[[IEEE 754]] 浮点数做的完全是同一件事，只是把乘的底数从 `10` 换成了二进制的 `2`：任何非零小数都能写成 `(±1) × (1.xxxx)₂ × 2ᵉ`，再把符号、指数（叫阶码）和小数尾巴（叫尾数）塞进固定位宽。

      来看工程里最常用的两款规格：[[float32]] 的 32 位切成「1 位符号 + 8 位阶码 + 23 位尾数」，[[double]]（也就是 [[JS]] 的 Number）用 64 位切成「1 位符号 + 11 位阶码 + 52 位尾数」。这里藏着两个极聪明的省位技巧：第一，等一下，阶码既有正指数又有负指数，为什么不用补码而要加上固定偏移（float32 加 `127`，double 加 `1023`）存成「移码」？比如真指数 `3` 存成 `3 + 127 = 130`。因为这样一来所有阶码都变成非负整数，且大小顺序和真指数一模一样——硬件比较两个正浮点数谁大时不用拆字段，直接按整数排一遍序就能出结果！第二，二进制规格化后小数点前面那位必然只能是 `1`（不像十进制能是 1 到 9），既然永远是 `1`，干脆省掉不存，白白多赚 1 位精度（叫做隐藏位）。

      三段的分工也一目了然：阶码位数撑起量级跨度（float32 能覆盖约 `1.2 × 10⁻³⁸` 到 `3.4 × 10³⁸`），尾数位数决定有多细腻（float32 含隐藏位共 24 位有效精度，约合 7 位十进制数；double 共 53 位，约合 15 到 17 位十进制数）。记死这句分工：阶码管范围，尾数管精度。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 2 章 浮点数
        url: http://csapp.cs.cmu.edu/
        claim: IEEE 754 浮点表示由符号、指数、尾数组成
