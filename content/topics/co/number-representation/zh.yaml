  - id: float
    title: 浮点数：二进制的科学计数法
    tldr: 小数用“符号 + 指数 + 尾数”存，像科学计数法，只不过底数是 2。
    body: 浮点数是二进制版的科学计数法，值等于符号乘以尾数乘以 2 的指数次方。float32 的 32 位切成符号 1 位、阶码 8 位、尾数 23 位，double 的 64 位切成符号 1 位、阶码 11 位、尾数 52 位。阶码存的不是原值而是加了偏移的移码，float32 偏移 127，存 130 表示真指数 3，这样阶码按无符号比较大小就等价于指数比较，硬件比大小更省电路，这正是移码存在的理由，后面的 design 还会展开。规格化要求把数写成 1 点几乘 2 的几次方，二进制里规格化数的首位必然是 1，于是这一位干脆不存，白赚一位精度，叫隐藏位。能表示的范围靠阶码撑开，float32 最大约 3.4 乘 10 的 38 次方，最小正规格化数约 1.2 乘 10 的负 38 次方；精度靠尾数决定，float32 约 7 位十进制有效数字，double 约 15 到 17 位。JS 的 Number 就是 double，所以 JS 里整数超过 2 的 53 次方就开始丢低位、0.1 存不准，都是同一套位预算在生效。记住分工，阶码管范围、尾数管精度，选型时先问问题出在哪一维。
    derivation: original
    sources:
