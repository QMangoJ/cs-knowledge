title: 数字在内存里长什么样：补码与浮点数
summary: 整数用补码存，小数用浮点数存。这解释了为什么整数会溢出，为什么 0.1 + 0.2 不等于 0.3。
premise: 以 C 语言的 int、double 和 JavaScript 的 Number 为例。
position: >-
  仍在「调用与数据的形态」板块里，本课从上一课栈帧的格子布局往里钻一层：栈帧只交代 int 与 double 变量住在哪一格，它们的二进制长相要在这里拆开。学完你能用补码写出一个负数且明白零为何只有一份编码，也能把 float32 的符号、移码阶码与尾数逐段拆开算出真值，并解释 0.1 为何存不准。
bridge:
  prev: >-
    上一课已把返回地址、保存寄存器与局部变量装进同一块栈帧，本课便盯住其中一个 int 格子，翻看它的补码位模式究竟如何表示正负。
  next: >-
    单个数字的编码看清之后，下一课把视线拉到成千上万个线程同时算同一批数字的 GPU，看 warp 如何成束执行、分支分化又如何拖慢它。
overview:
  - key: 一句话总结
    value: 一切都是固定位数的二进制，位数有限就有边界和误差
  - key: 整数
    value: 用补码表示负数，加减法电路统一，超出范围会溢出
  - key: 浮点数
    value: 按 IEEE 754 标准存成“符号 + 指数 + 尾数”，类似二进制的科学计数法
  - key: JS 的 Number
    value: 就是 64 位双精度浮点数（double）
  - key: 实用建议
    value: 比较浮点数要允许小误差；算钱用整数分或十进制库
  - key: 无符号 vs 有符号
    value: 同样的位，解释方式不同；比较混用时容易出错
  - key: 字节序
    value: x86-64 小端；网络字节序大端
  - key: 特殊值
    value: Infinity、NaN（NaN !== NaN）、-0
  - key: 类型转换
    value: 大整数转 double、double 转 int 都可能丢精度或截断
  - key: 在终端里看一看
    value: python3 -c 'print(0.1+0.2)'　看到 0.30000000000000004；node -e 'console.log(Number.MAX_SAFE_INTEGER)'
