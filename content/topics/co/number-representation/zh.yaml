  - id: twos-complement
    title: 补码：负数怎么存
    tldr: 整数用补码表示负数，好处是加减法可以用同一套电路。
    body: 表示负数历史上试过好几种方案，原码直接拿最高位当符号位，结果是加法器遇到负数就要改做减法，还出现正零负零两个零。补码的规则是最高位权重取负，其余位照旧，8 位补码里最高位代表负 128，于是 11111111 等于负 128 加 127 等于负 1。它的杀手锏是统一，正数加负数、负数加负数，全部走同一条无符号加法电路逐位进位即可，减法就是加上对方的补码即取反加一，CPU 不需要第二套电路，溢出判断也收敛为看符号位是否反常。范围要背准，n 位补码是负 2 的 n 减 1 次方到正 2 的 n 减 1 次方减 1，负侧比正侧多一个，因为零只占正侧一个编码，那个多出来的负数没有对应的正搭档，对它取绝对值会溢出回它自己，是边界题的常客。溢出语义必须分语言说清，无符号整数溢出在 C 里定义明确就是绕回，即对 2 的 n 次方取模；有符号溢出在 C 里是未定义行为，编译器可以假设它永不发生并据此优化，依赖它绕回的代码会被优化得面目全非，Java 则明确规定有符号也绕回。同一次 8 位加法 01111111 加 1，按无符号是 128 正确，按补码是负 128 溢出，溢出与否从来都是相对于解释规则而言的。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 2 章 整数表示
        url: http://csapp.cs.cmu.edu/
        claim: 补码表示及其溢出行为
