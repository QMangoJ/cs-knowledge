steps:
  - id: bits
    title: 位数写死了，两张故障单都从这里长出来
    tldr: 内存里只有 0 和 1，每种数据类型的位数从设计时就固定了；模式总数封顶意味着整数装不下只能溢出，连续小数大多数根本没有精确格子可住。
    body: |-
      追查开头两张故障单的总开关，只有一句话：内存条上不认加减号，也不认小数点，所有数字都只能挤进固定长度的一排 0 和 1 里。在常见平台上，一个 [[char]] 占 8 位，一个 [[int]] 占 32 位，一个 [[double]]（也是 [[JS]] 里全部常规 Number）占 64 位。8 位能排出的组合只有 `2⁸ = 256` 种，32 位是 `2³² ≈ 42.9 亿` 种——现实中的数字无穷无尽，而类型能给你的位预算就这么多，一个多余的编码都没有。

      整数和小数在这份有限预算面前的死法截然不同。整数是离散的，预算装得下的范围内每个整数都能严丝合缝占一个坑，只有往上加破了顶才会溢出；小数却是连续稠密的，哪怕只在 0 和 1 之间都有无穷多个实数，拿有限个位模式去套一条连续数轴，绝大部分实数压根就没有对应的格子，从写进内存那一刻就只能就近挑一个近似值顶替。

      顺手算一笔位宽翻倍的账：32 位升级到 64 位不是容量大了一倍，而是乘以 `2³²`（大约 42 亿倍）。这就是为什么 32 位 Unix 时间戳到了 2038 年就顶到天花板，而换成 64 位后用几百亿年都填不满。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 2 章
        url: http://csapp.cs.cmu.edu/
        claim: 数据以固定长度的位序列表示
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
