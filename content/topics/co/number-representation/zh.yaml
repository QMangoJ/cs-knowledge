  - id: twos-complement
    title: 补码：最高位权重取负，加减共用同一套电路
    tldr: 补码把最高位的权重定为负号（8 位里代表 -128），让 0 只剩唯一编码，且正负数相加、做减法全部直接丢进同一套加法器完成，只是负侧比正侧多出一个孤立的最小值。
    body: |-
      怎么用 0 和 1 表示负数，早期工程师试过最直观的「原码」：拿最高位当符号位（0 正 1 负），后面照抄绝对值。结果硬件立刻抓狂——加法器碰到负数得切换去做减法，还多出了 `+0`（`00000000`）和 `-0`（`10000000`）两个零，每次判零都要查两遍。于是现代计算机全统一成了「补码」，规矩其实就一句：**最高位的权重取负，其余各位照旧**。拿 8 位补码算：最高位代表 `-128`，剩下 7 位照常代表 `+64, +32, ..., +1`。因此 `10000000` 就是 `-128`，`11111111` 就是 `-128 + 127 = -1`，而 `0` 只剩 `00000000` 独一份。

      等一下，为什么单单把最高位改成负权重，CPU 就连减法电路都能省掉？把 8 位数字想象成一个 256 格的表盘：顺时针往前拨 `255` 格，跟逆时针往后退 `1` 格，停在完全相同的刻度上！算 `5 - 1` 时，硬件只需对 `1`（`00000001`）按位取反得 `11111110` 再加 1 变成 `11111111`（`-1` 的补码），然后把 `00000101`（5）和 `11111111`（-1）直接塞进同一条无符号加法电路逐位相加，得到 `(1)00000100`，溢出的第 9 位进位自动丢掉，剩下的正是 `4`！不需要造第二套减法电路。

      补码唯一的代价是左右不对称：n 位补码范围是 `-2ⁿ⁻¹` 到 `2ⁿ⁻¹ - 1`，8 位就是 `-128` 到 `127`。因为 `0` 占了非负那侧的一个坑，`-128` 没有对应的正数搭档——拿 `int8` 的 `-128` 取绝对值，溢出后还是 `-128`！也正因为表盘首尾相连，把最大的正数 `127`（`01111111`）加 1 变成 `10000000`，按无符号看是 `128`，按补码读就一头翻成了 `-128`——开头那张后端计数器翻负的故障单，根子就在这儿。（补一句语言差异：C 里无符号溢出明确规定按模绕回，有符号溢出则是未定义行为，Java 则规定有符号也绕回。）
    derivation: original
    sources:
