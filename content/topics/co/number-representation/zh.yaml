  - id: lesson
    title: 实际写代码怎么办
    tldr: 了解边界和误差，按场景选合适的表示。
    body: 把这一课收成可执行的选型纪律。第一，浮点比较不用等号，用两者之差的绝对值小于一个按量级选的容差来判，或者把问题改写成整数比较；单元测试里断言浮点结果同样要带容差，否则测试会随机红。第二，钱和一切要求分毫不差的量用整数最小单位存，金额存分、费率存万分之一整数，要展示再除回去，或者用十进制数库按十进制做舍入，银行家舍入这类规则浮点二进制根本表达不了。第三，ID 和计数器超过 2 的 53 次方就离开 Number，后端 64 位 ID 给前端一律字符串，本地大整数运算用 BigInt，但要记得 BigInt 不能和 Number 混算。第四，累加很多浮点数时误差会累积，大数吃小数的现象真实存在，把小数先排序从小加到大、或用分块求和，能把误差压低一个量级，长循环累加器在高精度场景可以考虑补偿求和。第五，跨语言传数据要写清类型和字节序，同一串字节对方按另一种解释读，值会变得面目全非且不报错。最后一条是心态，浮点误差不是 bug 而是位预算的账单，工程上要做的是把误差控制在业务容忍带内，并让它在边界处可见可查，而不是假装它不存在。
    derivation: original
