  - id: overflow-wrap
    title: 整数溢出的回绕语义再走深一层
    tldr: 绕回不是硬件偷懒，它是模运算；危险来自代码默认它不会发生。
    body: 无符号整数的绕回本质是模 2 的 n 次方运算，8 位无符号数就是一个 256 格的环，255 再加 1 回到 0，加法在这个环上永远封闭，所以绕回不是故障而是定义。补码有符号数共用同一个环，只是把环的上半段解释成负数，127 加 1 走到环的对面读成负 128。硬件只管在这个环上走，语义层是否算溢出由语言定。危险的真实场景从来不是绕回本身，而是代码在别处默认了不会绕回，比如用两个长度相加的结果去分配内存，相加绕回成一个小数字，分配出的缓冲区装不下随后按真实长度写入的数据，堆溢出漏洞就此成型，这类整数溢出转内存破坏是安全史上反复出现的模式。防御纪律有三条，范围可疑的加法乘法先判界再运算，或者先升到更宽的类型算完再检查能否装回，C 里用 __builtin_add_overflow 这类内建一次性拿到结果和溢出标志是最稳的写法。还要纠正一个流传很广的误解，认为有符号溢出在自己机器上测过会绕回就可以依赖，编译器优化时按标准假设有符号永不溢出，可能把 if (x + 1 < x) 这类判溢出代码整段优化没，因为在不溢出的前提下它恒为假，本地测着没事、开优化上线出事的事故正是这么来的。
    derivation: original
    sources:
