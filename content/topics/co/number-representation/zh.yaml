  - id: overflow-wrap
    title: 整数绕回的深水区：安全的表盘与编译器优化陷阱
    tldr: 无符号整数按 2 的 n 次方绕回是标准定义；真正常出安全漏洞的是后续代码默认了它不会绕回（比如相加变小去申请内存），以及误以为 C 语言有符号溢出也能放心绕回。
    body: |-
      再往深拆一层开头那张后端计数器的整数溢出问题。在数学上，8 位无符号整数就是一个 256 格的圆环，做的就是模 `2ⁿ` 算术，`255 + 1` 绕回 `0` 不是故障而是写死在规范里的正常行为；补码只是把同一个圆环的上半圈解读成负数，`127 + 1` 跨过中线变成 `-128`。真正的祸根几乎从来不是绕回本身，而是别的代码默认了它绝不会变小——比如拿前端传来的两段长度 `len1 + len2` 去调 [[malloc]] 申请缓冲，要是不小心加爆绕回成了一个极小的正数 `16`，分配器只批了 16 字节，后面拷贝却按原本的大长度硬往里写，堆缓冲区溢出当场成形。安全写法是先检查界限，或者用 `__builtin_add_overflow` 这类内建一次把和跟溢出标志一起拿出来。

      顺手拔掉一根在 C/C++ 里坑过无数人的刺：千万别因为自己在本地试过有符号 `int` 加爆会绕回负数，就放心写 `if (x + 1 < x)` 来检测溢出！在 Java 里确实明文规定有符号溢出照样绕回，但在 C/C++ 标准里，有符号整数溢出属于「未定义行为」——编译器完全有权假定合法代码永不溢出，开 `-O2` 优化时直接把 `x + 1 < x` 判成永远为假整段删光！本地不开优化测试一切正常，上线开优化防护代码突然人间蒸发，正是这么来的。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 2 章 整数表示
