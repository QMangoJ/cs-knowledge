    event: 栈保护检测到破坏
level: 基础
minutes: 15
prereq:
- co/compile-link
objectives:
- 画出一次函数调用的栈帧（返回地址、保存的寄存器、局部变量）
- 解释栈溢出的成因与缓冲区溢出攻击面
- 对比栈与堆的分配成本与生命周期
aiLink: 理解栈帧才能读懂崩溃栈、火焰图与性能剖析：推理服务的采样 profiler 展示的就是一层层栈帧；递归太深爆栈、异步回调里对象生命周期出错，也都源于这一课的模型。
quiz:
- q: 每次函数调用栈上新增的是？
  options:
  - 一整个程序
  - 一个栈帧：返回地址、保存的基址指针、局部变量等
  - 一个新线程
  - 一份堆拷贝
  answer: 1
  explain: 调用即压帧、返回即弹帧，所以递归深度受栈大小限制。
- q: 缓冲区溢出为什么危险？
  options:
  - 只是数据错
  - 写越界能覆盖返回地址，劫持控制流
  - 让栈变大
  - 导致死锁
  answer: 1
  explain: 返回地址在栈上且紧挨局部缓冲区，这是经典利用路径。
- q: 堆分配比栈分配慢，主要因为？
  options:
  - 堆在磁盘上
  - 要走分配器查找空闲块并维护元数据，栈只需移动栈指针
  - 堆不能放对象
  - 堆没有地址
  answer: 1
  explain: 栈分配是一条指针加减指令；堆分配是运行库的记账工作。
