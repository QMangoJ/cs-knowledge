  - id: callee-saved
    title: 寄存器谁来保存
    tldr: 寄存器只有一套，调用约定规定哪些由调用者保存、哪些由被调用者保存。
    body: 寄存器只有一套约十六个通用寄存器，main 正用着的寄存器，add 也想用，覆盖了就出事。约定把寄存器分成两班，调用者保存的一班包括参数寄存器和 rax 等临时寄存器，规则是 add 可以随便踩，main 若有值放里面且调用后还要用，必须自己在调用前存好。被调用者保存的一班包括 rbx、rbp 和 r12 到 r15，规则相反，add 想用必须先把原值压进自己的帧保存，返回前原样恢复，对 main 来说它们跨调用纹丝不动，适合放跨函数调用的长命变量。编译器分配寄存器时就按这套班次算账，短命的临时值优先放调用者保存班，免得每次调用都保存恢复，跨调用的大变量才占被调用者保存班并付序言收尾的保存流量。走例，main 把循环计数器放在被调用者保存的 rbx 里，就能放心在循环里调任何函数而不怕它被踩。这套约定的本质是把保存责任在调用双方之间一次谈妥，任何两个遵守同一约定编译的模块，哪怕来自不同语言、不同编译器，都能安全互调用，不需要互相看源码。
    derivation: original
    sources:
