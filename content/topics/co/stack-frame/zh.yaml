  - id: callee-saved
    title: 寄存器谁来保管：调用者班和被调用者班的分工
    tldr: CPU 只有一套约 16 个通用寄存器，main、f、g 都抢着用；System V 把它们分成两班——一班随便踩（要留就调用前自己存），一班谁借谁还（进门压栈、出门恢复）。
    body: |-
      想象 `main` 正拿一个寄存器当 `for` 循环的计数器 `i`，每一轮循环都要调一次 `f`，而 `f` 里面又要去调 `g`。全 CPU 的通用寄存器总共就十六来个，怎么才能保证 `f` 或 `g` 做加法时不会顺手把 `main` 的 `i` 给盖掉？如果每个函数进门前都把全部 16 个寄存器压栈、出门全弹出来，光内存读写就能拖死程序。

      于是调用约定把寄存器一分为二谈妥了责任。第一班叫「调用者保存」（包括参数寄存器 `rdi`–`r9`、返回值 [[rax]] 以及 `r10`、`r11`）：规矩是 `f` 和 `g` 可以大摇大摆随便覆盖，如果 `main` 自己在 `rax` 里放了重要的数且调用 `f` 后还要用，必须在执行 `call f` 之前自己提前存进栈里。第二班叫「被调用者保存」（包括 `rbx`、[[rbp]] 和 `r12`–`r15`）：规矩反过来，`main` 把循环变量 `i` 放心放进 `rbx` 就行，`f` 如果自己要用 `rbx`，必须先在 `f` 自己的栈帧里把 `main` 的 `rbx` 备份好，返回前原样还回去。

      编译器分配寄存器时精打细算全靠这套班次：只在两行之间活着、不跨函数调用的短命临时值，优先塞进调用者保存班（`rax` 等），零保存成本；像 `main` 里的跨调用循环计数器，就安排进被调用者保存班（`rbx`），哪怕里面套了 `f` 调 `g` 十层，出来时照样纹丝不动。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 3 章 过程调用
        url: http://csapp.cs.cmu.edu/
        claim: 寄存器只有一套，调用约定规定哪些由调用者保存、哪些由被调用者保存。
        status: verified
