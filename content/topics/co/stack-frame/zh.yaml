  - id: alignment-variadic
    title: 栈对齐与可变参数的代价
    tldr: 调用前栈要 16 字节对齐，可变参数函数还要为此多付一套保存动作。
    body: System V 约定要求执行 call 之前栈指针按 16 字节对齐，使得 call 压入 8 字节返回地址后，被调用者入口处栈是差 8 的状态，序言再压一个 rbp 就重新对齐。为什么苛刻到字节，因为很多 SSE 指令要求操作数 16 字节对齐，没对齐的版本要么慢要么直接 fault，统一约定让编译器可以放心在帧里用对齐的向量存取。对齐的代价是帧里常有几字节纯填充，看汇编时减栈指针减出的数字比局部变量总和大，对不上的部分多半就是对齐填充，不是编译器算错。可变参数再加一层成本，printf 这类函数不知道参数个数和类型，只能靠格式串运行时解析，被调用者还要在序言里把全部参数寄存器倒进一块寄存器保存区，让可变参数能被当成数组统一读取，普通函数省下的这套动作它一分不少要付。理解这两点有两个实用落点，一是手写汇编或做 FFI 调用时对齐错了会在莫名其妙的向量指令处崩溃，二是热点路径上避免可变参数日志接口，因为每次调用都有一笔固定的保存和解析开销，改用结构化传参能省下来。
    derivation: original
