level: 基础
minutes: 26
prereq:
  - co/compile-link
objectives:
  - 画出一次函数调用的栈帧（返回地址、保存的寄存器、局部变量）
  - 解释栈溢出的成因与缓冲区溢出攻击面
  - 对比栈与堆的分配成本与生命周期
aiLink: 理解栈帧才能读懂崩溃栈、火焰图与性能剖析：推理服务的采样 profiler 展示的就是一层层栈帧；递归太深爆栈、异步回调里对象生命周期出错，也都源于这一课的模型。
quiz:
  - q: 每次函数调用栈上新增的是？
    options:
      - 一整个程序
      - 一个栈帧：返回地址、保存的基址指针、局部变量等
      - 一个新线程
      - 一份堆拷贝
    answer: 1
    explain: 调用即压帧、返回即弹帧，所以递归深度受栈大小限制。
  - q: 缓冲区溢出为什么危险？
    options:
      - 只是数据错
      - 写越界能覆盖返回地址，劫持控制流
      - 让栈变大
      - 导致死锁
    answer: 1
    explain: 返回地址在栈上且紧挨局部缓冲区，这是经典利用路径。
  - q: 堆分配比栈分配慢，主要因为？
    options:
      - 堆在磁盘上
      - 要走分配器查找空闲块并维护元数据，栈只需移动栈指针
      - 堆不能放对象
      - 堆没有地址
    answer: 1
    explain: 栈分配是一条指针加减指令；堆分配是运行库的记账工作。
design:
  - mechanism: 函数调用靠运行时栈发房间、收房间，每调一层压进一块栈帧，返回时只需退回栈指针便一键回收。
    problem: 函数能层层嵌套甚至自己调自己，每一层都必须有自己私有的局部变量和各自的回程地址；如果给每个函数写死固定地址，递归第二层刚进去就会把第一层的变量覆盖光。
    choice: 用后进先出的运行时栈精确贴合调用嵌套顺序，要内存时把栈指针减一下，回收时再把指针加回去，分配释放快到只剩一条算术指令。
    tradeoff: 代价是整条栈顶死在几 MB 大小，且房间随函数返回瞬间作废——大数组和需要带出函数的长命对象都放不进栈，程序员必须在栈和堆之间自己划界。
    root: 根源在于调用关系天然是一棵后进先出的树，栈正是这棵树最贴身、最零开销的物理映射，用一次指针移动同时管住了作用域和内存寿命。
  - mechanism: 调用约定把参数进哪个寄存器、返回值放哪、哪几个寄存器谁来保存、以及 16 字节对齐写成跨模块的成文规则。
    problem: CPU 只有一套十几来个通用寄存器，两份毫不相识的代码文件（比如主程序和第三方库）互相调用时，若不提前定好规矩，进去一脚就能把对方的计数器踩烂。
    choice: 在操作系统和架构边界上定死一套标准，把寄存器分成「调用者自己护着」和「借用方先存后还」两班，所有编译出来的机器码按同一份合同对接。
    tradeoff: 约定一旦立下就几乎改不动，生态被几十年的二进制兼容性锁死；像 Windows 和 Linux 各自立了不同约定，同一份源码也只好跨平台分别重编。
    root: 根源在于二进制模块间没有源码可见性，调用约定就是机器指令层级唯一的接口契约，它让不同编译器甚至不同语言能安全拼进同一条调用链。
  - mechanism: 栈帧把局部数组和返回地址摆成相邻格子，同时靠金丝雀、不可执行栈和地址随机化在周围兜底防护。
    problem: 返回地址直接掌管着程序下一步跳到哪行指令，偏偏它就紧挨着最容易写超下标的局部缓冲区，一次没检查边界的拷贝就能劫持整个控制流。
    choice: 在不破坏极速栈帧结构的前提下打上三层补丁：进门放随机金丝雀值盯防篡改、把栈页设为不可执行挡住注入代码、随机化内存地址让对手猜不中跳板。
    tradeoff: 这三层补丁本质上是检测与提高门槛，金丝雀可能被读内存泄漏绕过；要想彻底断根，只有交给语言或运行时做数组越界检查，为此要多付运行时判断开销。
    root: 根源在于 C 语言把内存边界安全权交给程序员换极致效率，栈帧的零检查设计留下了性能红利，后来的安全机制都是在替这笔效率债修防护网。
