      note: 栈帧布局（x86-64 示意）
  - id: return
    title: 返回退房：结果进 rax，指针退回原位但不清零
    tldr: g 和 f 算完后把返回值塞进 rax，把 rsp 退回 rbp 处、弹回旧 rbp，最后 ret 从栈顶拿走返回地址跳回去；旧栈帧内存并不会被清零，只是标记成了谁都能覆盖的空地。
    body: |-
      `g(11, 21)` 算出 `32`，按约定放进返回值寄存器 [[rax]]（整数和指针返回值都走 `rax`，浮点数走 [[xmm]]0），然后一条 `ret` 指令把 `0x401168` 从栈顶弹出装回指令指针，控制流精准接回 `f` 里调用 `g` 的下一行。

      轮到 `f` 收工时，做的是搭栈帧的镜像动作：先把最终算出的返回值放进 `rax`；再把 `rsp` 设回 `rbp`（一条指令把那 32 字节的局部变量和填充全退掉）；接着弹出栈上存着的旧 `rbp` 还给 `main`；最后 `ret` 弹出 `0x401125`，程序顺滑地回到 `main` 继续往下走。

      这里有个抓无数 C 语言 Bug 必懂的冷事实：退栈时，那 32 字节内存里的 `tmp` 和 `buf` **一个字节都不会被清零**，`rsp` 只是往上抬回了 `0x7fffffffe000`，宣布这片地可以随便覆盖。如果 `f` 犯傻把局部数组 `buf` 的指针直接 `return` 给了 `main`，刚返回那一微秒去读似乎还能看到旧数据，下一秒 `main` 再调任何别的函数，新帧一压下去瞬间把旧值踩得稀烂——这就是悬空指针为什么那么隐蔽又致命。
    derivation: original
    sources:
