  - id: overflow
    title: 栈有多大底：递归深度账，以及两种「栈溢出」的区别
    tldr: 栈空间不是无限的，Linux 主线程默认通常 8 MB（用 ulimit -s 查看），工作线程还常更小；帧大小乘以递归深度一旦撞破边界就会段错误崩溃，但别把它和写爆局部数组混为一谈。
    body: |-
      前面 `main` 调 `f`、`f` 调 `g` 只压了两三层，栈根本没感觉。可如果 `f` 忘了写递归终止条件自己调自己，或者每次进 `f` 都在栈上开一个大数组呢？操作系统给每个线程划的栈空间有死上限：Linux 主线程默认通常是 8 MB（敲一句 `ulimit -s` 就能看到 8192 KB），而后台自己建的工作线程往往只有 1 到 2 MB。这也是为什么同一段递归在主线程好好的、扔进线程池突然崩溃。

      把算术账算细才有直觉：如果 `f` 的一帧只占 64 字节，8 MB 够压进 `8 × 1024 × 1024 / 64 ≈ 13 万` 层；可要是你在 `f` 里面随手开了一个 `char tmp[1024 * 1024]` 的 1 MB 局部数组，那栈顶才刚往下压第 8 层就直接撞穿边界的保护页，触发段错误（[[SIGSEGV]]）当场挂掉。[[JS]] 引擎跑深递归抛出的 `Maximum call stack size exceeded` 也是这笔账，只是 JS 帧大、上限常卡在一万层上下。

      顺手把两个名字长得几乎一样、性质完全不同的词劈开：上面这种「调用太深或单帧太大把 8 MB 用光」叫**栈溢出**（程序崩溃）；而 `f` 里的 `char buf[16]` 只申了 16 字节却往里写了 32 字节、把旁边的返回地址写花了，那叫**栈缓冲区溢出**（高危安全漏洞，最后一步专门拆它）。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 3 章
        url: http://csapp.cs.cmu.edu/
        claim: 栈空间有限，过深的递归会导致栈溢出
        status: verified
