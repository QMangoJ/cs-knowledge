steps:
  - id: why
    title: 为什么必须用栈：后进先出的调用天性
    tldr: main 调 f、f 再调 g 时，最后进场的 g 必须最先退场，而且 f 和 g 各自要有一份互不串台的局部变量；后进先出的栈恰好跟这种嵌套结构严丝合缝。
    body: |-
      想象 `main` 跑到一半停下来去跑 `f(10, 20)`，而 `f` 算到半截又得等 `g(11, 21)` 算出结果才接得下去。这就逼出三条铁需求：第一，`g` 算完后绝不能跳回 `main`，必须回到 `f` 当初停下的那一行；第二，`f` 和 `g` 里都可能有自己的局部变量 `tmp`，两人各自算各自的，谁也不能把对方的 `tmp` 踩坏；第三，最后被叫起来的 `g` 一定最先收工，然后才轮到 `f`，最后才回到 `main`。

      数据结构里只有「栈」天生按后进先出（LIFO）运转：进入一层就往栈顶多摞一块专属记录，返回一层就从栈顶把最上面那块揭掉。哪怕同一个函数自己递归调用自己一百次，栈上也会老老实实摞起一百块彼此独立的栈帧，每一层都有自己的参数和 `tmp`，井水不犯河水。

      你平时在浏览器 DevTools 或 IDE 里看到的 Call Stack 调用栈面板、崩溃时吐出的报错堆栈、以及性能分析里的火焰图，背后画的就是此时此刻栈上真真实实摞着的这几块帧。而且栈上腾一块新房间只需把栈指针往外拨一格，跟堆上要去空闲链表找空位记账比起来，便宜到几乎等于零。
