  - id: overflow
    title: 栈的边界：递归与栈溢出
    tldr: 栈的大小有限，递归太深会把它用完。
    body: 栈不是无限的，Linux 主线程栈默认通常 8 MB，用 ulimit -s 能查到，新线程的栈要另行设定、通常更小。每层递归多压一个帧，帧大小乘以深度就是总消耗，没有终止条件的递归会一直压到越过栈的边界页，触发段错误直接崩溃。把账算细更有感觉，一个只含几个局部变量的小帧可能只有几十字节，8 MB 能撑十几万层，但帧里若有一个 1 MB 的局部数组，8 层上下就爆，所以大缓冲必须放堆上这句话不是风格建议而是算术必然。JS 引擎里的 Maximum call stack size exceeded 是同一个机制，只是 JS 栈帧更大、默认深度上限通常在一万量级。还要区分两个同名概念，栈溢出是把栈空间用完的崩溃，栈缓冲区溢出是往帧内数组写越界的安全漏洞，后者能覆盖返回地址，名字像但完全是两回事，面试和排错时先分清说的是哪一个。合理的递归深度控制、把深递归改成显式栈加循环、用尾调用优化，都是在和这 8 MB 的硬顶打交道。
    derivation: original
    sources:
