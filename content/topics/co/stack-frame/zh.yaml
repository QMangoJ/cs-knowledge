  - id: tail-call
    title: 尾调用：最后一步是调用别人时可以不压帧
    tldr: 如果调用是函数的最后一个动作，当前帧再无用处，可以直接复用它跳过去。
    body: 观察一个事实，如果函数 f 的最后一条动作就是 return g(x)，那么 g 返回之后 f 什么都不再做，f 的帧在 g 执行期间纯占地方。可以优化为，f 先把参数按 g 的约定摆好，然后不压返回地址、不用 call，直接跳到 g 入口，g 执行完用 f 原来的返回地址直接回到 f 的调用者，栈深度全程不涨。这叫尾调用优化，尾递归经它就变成等价的循环，深递归不再爆栈。走例，阶乘的累加器写法把乘法挪进参数里、让递归调用成为最后一步，就能被优化成常数栈，而普通写法里调用之后还要乘一个 n，帧必须留着等结果，谁也优化不掉，所以尾递归的写法纪律是把计算提前做完、调用收尾。注意边界，不是所有语言和编译器都保证做这个优化，C 编译器在高优化等级下常做但标准不强制，函数式语言则普遍把它写进语言规范。JS 规范里写了尾调用优化但主流引擎实现情况不一，写 JS 深递归不能指望它兜底。判断一个调用是不是尾调用就看一句话，调用的返回值是不是原封不动就是本函数的返回值，是就有优化资格，不是就没有。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 3 章 过程调用
