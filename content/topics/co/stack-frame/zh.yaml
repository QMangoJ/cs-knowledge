- id: overflow
  title: 栈的边界：递归与栈溢出
  tldr: 栈的大小有限，递归太深会把它用完。
  body: 'Linux 上主线程的栈默认通常是 8MB 左右，用 ulimit -s 能看到。

    递归每调用一层就压一个栈帧，没有终止条件就会一直压下去，直到越界崩溃（Segmentation fault）。

    JS 里看到 Maximum call stack size exceeded，是同一个道理。


    数字感：Linux 主线程栈默认 8 MB，一个栈帧若含 1 MB 的局部数组，递归 9 层就爆；这也是为什么大缓冲要放堆上、为什么推理框架把大张量放在显存/堆而不是栈上。'
  derivation: original
  sources:
  - ref: csapp
    locator: 第 3 章
    url: http://csapp.cs.cmu.edu/
    claim: 栈空间有限，过深的递归会导致栈溢出
    status: unverified
    note: 按 Daniel 决定不核对出处
  canvas:
    kind: swimlane
    actors:
    - lane: code
      id: f
      label: 函数
    - lane: stack
      id: s
      label: 栈
      highlight: true
    - lane: regs
      id: r
      label: 寄存器
    messages:
    - id: m-overflow
      from: f
      to: s
      label: 栈帧不断压入，直到用完
      active: true
  log:
  - mode: 栈溢出
    event: 程序崩溃
- id: stack-vs-heap
  title: 栈和堆的区别，以及栈上的安全问题
  tldr: 栈自动管理但只活到函数返回；堆要手动或由 GC 管理，可以活得更久。
  body: '栈上的局部变量随栈帧一起消失，所以不能返回指向局部变量的指针，那块内存很快会被别的调用覆盖。

    要让数据活过函数调用，就用 malloc 放在堆上（JS 里对象都在堆上，由垃圾回收管理）。

    栈上数组写越界会覆盖返回地址，这是经典的“栈溢出攻击”；编译器加的栈保护（canary）和不可执行栈就是为了防它。'
  derivation: original
  sources:
  - ref: csapp
    locator: 第 3 章 过程调用
    url: http://csapp.cs.cmu.edu/
    claim: 栈自动管理但只活到函数返回；堆要手动或由 GC 管理，可以活得更久。
    status: unverified
    note: 按 Daniel 决定不核对出处
  canvas:
    kind: swimlane
    actors:
    - lane: code
      id: f
      label: 函数
    - lane: stack
      id: s
      label: 栈
      highlight: true
    - lane: regs
      id: r
      label: 寄存器
    messages:
    - id: m-stack-vs-heap
      from: f
      to: s
      label: 越界写 → 覆盖返回地址
      active: true
  log:
