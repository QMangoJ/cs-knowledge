  - id: stack-vs-heap
    title: 栈和堆的区别，以及栈上的安全问题
    tldr: 栈自动管理但只活到函数返回；堆要手动或由 GC 管理，可以活得更久。
    body: 栈和堆是两种生命周期哲学。栈上的数据随帧生灭，分配是移动指针、释放是退回指针，都是一条指令的成本，但命只到函数返回，且总量受那几 MB 的顶约束。堆上的数据由 malloc 和 free 或垃圾回收管理，能活过函数、大小能运行时决定、总量大得多，代价是分配要走分配器找空闲块并记账，还要操心释放，忘了释放泄漏、释放早了悬空、释放两次直接崩。所以选型的判断顺序是，数据活不过本函数且大小编译期可知，放栈；要交出去活得更久、或者很大、或者大小运行时才定，放堆或由调用方提供缓冲。安全上，栈帧里数组和返回地址是邻居，往局部数组写越界就能改掉返回地址，函数一返回就跳到攻击者选的地址，这是经典的栈缓冲区溢出利用链。现代防线有三层，编译器在帧里插入金丝雀值，返回前校验被改就 abort；栈内存标为不可执行，注入的代码跑不起来；地址随机化让攻击者猜不到要跳哪。三层都绕不开同一课的模型，先懂帧布局，才懂攻击和防御各自在改哪几个字节。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 3 章 过程调用
        url: http://csapp.cs.cmu.edu/
