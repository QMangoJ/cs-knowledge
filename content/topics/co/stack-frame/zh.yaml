  - id: tail-call
    title: 尾调用优化：最后一句直接调 g，f 可以不占新帧
    tldr: 如果 f 的最后一件事就是原封不动返回 g(...) 的结果，f 的栈帧其实已经没有存在的意义——编译器把 call g 改成直接 jmp g，让 g 用 f 的返回地址直接回 main，栈深度一动不动。
    body: |-
      想象 `f(a, b)` 的函数体最后写的是 `return g(a + 1, b + 1);`——把 `g` 算完的数原封不动交给 `main`，`f` 自己不再做哪怕多一次加法。你想，在 `g` 跑的那段时间里，`f` 的栈帧白白占着一块内存，唯一的用处仅仅是等 `g` 回来再替它倒一手 `rax`、回 `main`。

      聪明的编译器会直接把这个多余的台阶拆掉：先在 `f` 里把 `a + 1` 和 `b + 1` 放进 `rdi`、`rsi`，把 `f` 自己的局部空间退回、弹回 `main` 的旧 `rbp`，然后**不执行 `call g`，而是直接一条 `jmp g` 跳进 `g` 的入口**。此时栈顶躺着的依然是当年 `main` 压进来的返回地址 `0x401125`！等 `g` 算完执行 `ret`，就会带着 `rax` 里的结果一步直飞回到 `main`，全程根本没多占一字节栈空间。这就是尾调用优化；如果 `f` 这样在最后一步调用自己，几百万层递归也和 `while` 循环一样只用常数栈深。

      判断有没有资格做这个优化，只需看死一句话：**调用完之后，本函数还有没有哪怕一步尾巴动作要做**。写成 `return g(n - 1, acc * n);` 就有资格，写成 `return n * g(n - 1);` 就没资格——因为 `g` 返回后 `f` 还得留着栈帧里的 `n` 去做乘法！工程上还要认清语言边界：C/C++ 在开高优化时常做，Scheme 等函数式语言把这写进规范保证必做；而 [[JS]] 虽然规范里写了，但 V8/SpiderMonkey 等主流引擎绝大多数情况下并未开启，写 JS 深递归老老实实改循环更稳。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 3 章 过程调用
        url: http://csapp.cs.cmu.edu/
        claim: 尾调用可复用当前栈帧实现常数栈深
