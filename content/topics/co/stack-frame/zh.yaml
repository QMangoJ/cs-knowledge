level: 基础
minutes: 26
prereq:
  - co/compile-link
objectives:
  - 画出一次函数调用的栈帧（返回地址、保存的寄存器、局部变量）
  - 解释栈溢出的成因与缓冲区溢出攻击面
  - 对比栈与堆的分配成本与生命周期
aiLink: 理解栈帧才能读懂崩溃栈、火焰图与性能剖析：推理服务的采样 profiler 展示的就是一层层栈帧；递归太深爆栈、异步回调里对象生命周期出错，也都源于这一课的模型。
quiz:
  - q: 每次函数调用栈上新增的是？
    options:
      - 一整个程序
      - 一个栈帧：返回地址、保存的基址指针、局部变量等
      - 一个新线程
      - 一份堆拷贝
    answer: 1
    explain: 调用即压帧、返回即弹帧，所以递归深度受栈大小限制。
  - q: 缓冲区溢出为什么危险？
    options:
      - 只是数据错
      - 写越界能覆盖返回地址，劫持控制流
      - 让栈变大
      - 导致死锁
    answer: 1
    explain: 返回地址在栈上且紧挨局部缓冲区，这是经典利用路径。
  - q: 堆分配比栈分配慢，主要因为？
    options:
      - 堆在磁盘上
      - 要走分配器查找空闲块并维护元数据，栈只需移动栈指针
      - 堆不能放对象
      - 堆没有地址
    answer: 1
    explain: 栈分配是一条指针加减指令；堆分配是运行库的记账工作。
design:
  - mechanism: 函数调用用运行时栈管理帧，调用压帧返回弹帧，帧里装返回地址、保存的寄存器和局部变量，分配释放只动栈指针。
    problem: 函数可以任意嵌套和递归，每层都需要独立的局部状态和明确的返回去向，若用静态固定地址存局部变量，递归和重入会立刻互相覆盖。
    choice: 用后进先出的栈把调用的嵌套结构原样映射成内存布局，深度随调用走，帧的分配释放退化成一次指针加减，成本压到一条指令。
    tradeoff: 代价是总深度被几 MB 的固定上限卡死，数据活不过函数返回，大数组和长命对象都得另去堆上，选型判断成了每个程序员的日常功课。
    root: 根源是调用关系本身就是一棵后进先出的树，栈是这棵树最便宜的物理实现，生命周期和作用域被同一种结构统一管辖，这是它无可替代的原因
  - mechanism: 调用约定把参数寄存器顺序、返回值寄存器、寄存器保存班次和栈对齐写成跨模块的成文规则。
    problem: 寄存器只有一套，两个互不相识的编译单元要互相调用，若各自随便选寄存器传参和保存，组合起来必然互相踩坏对方的状态。
    choice: 把分工在约定里一次谈妥并全员遵守，调用者保存班和被调用者保存班各负其责，任何遵守同一约定的对象文件都能安全互操作。
    tradeoff: 约定一旦定版就几乎不可更改，寄存器班次和对齐规则会被几十年的二进制生态锁死，新架构想改只能另立一套约定并付出生态分裂代价。
    root: 根源是二进制兼容的本质是接口稳定，调用约定就是函数边界上的接口，它让不同语言、不同编译器、不同年代的产物能在同一进程里协作。
  - mechanism: 栈帧把局部数组和返回地址放在相邻位置，金丝雀、不可执行栈和地址随机化在这块布局周围层层设防。
    problem: 返回地址决定函数返回后去哪执行，而它恰好紧挨着最容易写越界的局部缓冲区，一次越界写就能把控制流改道到攻击者选定的地址。
    choice: 不改帧布局的前提下加三层防线，帧内金丝雀负责发现越界、栈不可执行让注入代码无法运行、地址随机化让攻击者猜不到目标地址。
    tradeoff: 三层防线都是概率和检测而不是根除，金丝雀可被信息泄漏绕过，随机化可被爆破，真正根除要靠语言层面的边界检查而那要付运行时成本。
    root: 根源是 C 把内存安全交给程序员这一最初取舍，帧布局的效率来自不做检查，所有后来的防护都是在为这笔性能债补利息而不是还本金。
