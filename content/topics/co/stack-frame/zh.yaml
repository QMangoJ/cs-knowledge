  - id: frame
    title: 搭出栈帧：rsp 往下开空地，rbp 钉死位置锚点
    tldr: 跳进 f 之后栈往低地址长：先保存 main 的帧指针 rbp 当锚点，再把栈指针 rsp 往下减去固定字节数腾出 f 的房间；rsp 可以随时跟着下层调用跑，局部变量永远靠 rbp 减偏移找回。
    body: |-
      跳进 `f` 的入口时，[[x86-64]] 的栈是**从高地址向低地址往下长**的。假定此时栈指针 [[rsp]] 指在 `0x7fffffffe000`，这一格正躺着刚才压进来的返回地址 `0x401125`。`f` 接下来要把两个指针配合成一把尺子：先把 `main` 的帧基址指针 [[rbp]] 压进栈里暂存（`rsp` 往下退 8 字节到 `0x7fffffffdff8`），再让 `rbp` 等于当前的 `rsp`，作为 `f` 这块房间永不移动的门牌锚点。

      紧接着 `f` 需要放一个局部变量 `int tmp` 和一个 `char buf[16]`，外加待会儿调用 `g` 时还要腾地方，于是直接执行一条减法把 `rsp` 往下减掉比如 32 字节（推到 `0x7fffffffdfd8`）。这就一刀切出了 `f` 的栈帧，从高到低依次排着：返回地址 `0x401125`、保存的旧 `rbp`、要代存的寄存器、以及局部变量 `buf`（`rbp - 16`）和 `tmp`（`rbp - 20`）。

      等一下，既然都有了 `rsp`，干嘛还要多此一举留个 `rbp`？因为待会儿 `f` 准备去调用 `g` 时，往栈里压参数、压 `0x401168` 会让 `rsp` 继续往下滑，而 `rbp` 纹丝不动地钉在 `0x7fffffffdff8` 上，所以 `f` 无论什么时候拿 `rbp - 20` 总能稳稳摸到 `tmp`。（小提示：如果 `g` 简单到连局部变量都不多、也不再往下调别人，编译器往往把变量直接全塞进寄存器，连栈帧都省掉，这种优化叫[[叶函数]]优化。）
    derivation: original
    sources:
