  - id: args-overflow
    title: 第 7 个参数放哪，以及叶函数专属的 128 字节红区
    tldr: 超过 6 个的整数参数由调用者在 call 前按顺序压上栈；而像 g 这样不再调任何人的叶函数，可以直接使用栈顶以下 128 字节的「红区」，连调整 rsp 都不必做。
    body: |-
      如果我们的 `f` 忽然膨胀成 `f(a1, a2, a3, a4, a5, a6, a7, a8)` 怎么办？先记清计数规矩：整数和指针走 [[rdi]]、[[rsi]]、`rdx`、`rcx`、`r8`、`r9` 这 6 个，浮点数另走 `xmm0` 到 `xmm7` 单独计数、互不挤占。整数数到第 7 个 `a7` 和第 8 个 `a8` 时寄存器装不下了，`main` 只好在执行 `call f` 之前，把 `a8`、`a7` 从右往左预先压进栈里。等进到 `f` 后，想摸回 `a7` 就得顺着 `rbp` 往高地址找——注意 `rbp` 到 `a7` 中间隔着 8 字节保存的旧 `rbp` 和 8 字节返回地址，所以 `a7` 在 `rbp + 16`、`a8` 在 `rbp + 24`。看汇编时差这 16 字节，十有八九是忘了跨过这两格。

      再来看 `g`（我们那个不再调用任何函数的叶函数）享有的特权：[[System V]] 在栈顶 [[rsp]] 下方紧挨着划出 128 字节的「红区」，系统保证哪怕此时突然来个信号或中断也不会踩进这 128 字节。于是 `g` 需要几个临时字节时，直接往 `rsp - 8`、`rsp - 16` 里写就行，连 `sub rsp` 开帧和 `add rsp` 退帧两条指令都直接省掉！

      等一下，那为什么 `f` 不敢把 `tmp` 放进红区？答案就在 `f` 还要执行 `call g` 上——一旦 `f` 执行 `call g`，CPU 当场就会把 `f` 的返回地址 `0x401168` 往 `rsp - 8` 压进去，接着 `g` 压栈帧全踩在这块地上，瞬间把 `f` 存在红区里的数据盖个精光！因此红区只配给叶函数享用。顺便提醒：Windows x64 没有红区，反而要求调用者提前空出 32 字节影子空间，跨平台看汇编一定先认清约定。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 3 章 过程调用
        url: http://csapp.cs.cmu.edu/
        claim: 超出寄存器的参数经栈传递，叶函数可使用红区
