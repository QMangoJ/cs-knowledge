  - id: alignment-variadic
    title: 16 字节对齐的强迫症，以及可变参数的隐形账单
    tldr: System V 要求执行 call 前 rsp 必须 16 字节对齐，好让 SSE 向量指令不会踩空报错；而 printf 这类参数个数不定的函数，不得不在进门时把全部参数寄存器一股脑倒进栈里。
    body: |-
      刚看汇编的同学常纳闷一个算术问题：`f` 里明明只定义了一个 4 字节的 `int tmp`，为什么进门 `sub rsp` 一下子减了 16 甚至 24 字节？秘密在 [[System V]] 的对齐铁律上：要求在每次执行 `call` 之前，栈指针 [[rsp]] 的地址必须是 16 的整数倍。想一下这笔精准的 8 字节账：`call f` 压入 8 字节返回地址后，`rsp` 刚好变成「16 的倍数差 8」；`f` 进门压入 8 字节的旧 `rbp`，刚好凑回 16 的整倍数；之后自己减局部空间时只要按 16 的倍数减，等会里面再 `call g` 时 `rsp` 依然稳稳对齐 16！

      为什么硬件要卡死到 16 字节？因为 [[SSE|SSE（向量指令扩展）]] 这类 16 字节宽的向量指令在读写内存时，很多版本要求地址必须 16 字节对齐，没对齐要么掉速、要么直接触发硬件故障崩溃。所以手写汇编或用 [[FFI]] 跨语言调用时，忘了补齐这几字节填充，程序常常莫名其妙死在底层向量指令里。

      另一笔常被忽略的账在 `printf` 这类可变参数函数上：编译 `printf` 本身时，编译器压根不知道调用者会传 1 个还是 10 个参数。为了让 `va_arg` 能像翻数组一样依次取参，`printf` 一进门就得乖乖把 `rdi` 到 `r9` 这 6 个整数寄存器以及一票 `xmm` 向量寄存器一股脑全倒进栈上的一块「寄存器保存区」里。所以在性能敏感的热点日志循环里，改用固定参数的结构化日志往往比调可变参数接口省下一大截开销。
    derivation: original
    sources:
