  - id: call
    title: 调用起手：寄存器传参，call 把回程地址压进栈
    tldr: main 调用 f(10, 20) 时，先把 10 和 20 塞进 rdi 和 rsi 两个寄存器，再执行 call 指令——这一步只做两件事：把回 main 的下一行地址压进栈，再跳进 f。
    body: |-
      按 Linux [[x86-64]] 的 [[System V]] 调用约定来走 `main` 调 `f(10, 20)` 的起手式。`main` 先不碰内存，直接把 `10` 放进第一个参数寄存器 [[rdi]]，把 `20` 放进第二个参数寄存器 [[rsi]]（前六个整数或指针参数顺序固定为 `rdi、rsi、rdx、rcx、r8、r9`，全走高速寄存器）。紧接着执行机器指令 `call f`。

      假设 `main` 里的这条 `call f` 放在地址 `0x401120`，紧挨着的下一行代码（准备接收返回值继续跑的那一行）在 `0x401125`。`call f` 这条指令不可分割地干两件事：先把 `0x401125` 这个「回来接着干什么」的地址压进栈顶，再把指令指针 [[PC]] 改成 `f` 的入口地址跳过去。紧接着 `f` 跑到中间要执行 `call g`（设 `call g` 下一行在 `0x401168`），同样先把 `0x401168` 压在 `f` 下面，再跳进 `g`。

      这里最容易看糊的是「返回地址到底是谁的地址」：压进栈的不是目标函数 `f` 在哪，而是调用者 `main` 里 `call` 紧接的下一行 `0x401125`。至于这套寄存器编号顺序和栈排布规矩，就叫「调用约定」——Linux 和 Windows 规则不同，所以同一份代码跨系统必须重新编译，不能把 Linux 编好的二进制零件直接拼进 Windows 程序里。
    derivation: original
    sources:
