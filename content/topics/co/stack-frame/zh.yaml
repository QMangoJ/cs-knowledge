      code: |-
        高地址 ┌─────────────┐
               │ 调用者帧     │
               ├─────────────┤
               │ 返回地址     │ ← 返回后从这里继续
               │ 保存的 rbp   │
               │ 局部变量…    │ ← 当前栈帧
        低地址 └─────────────┘  rsp 指向当前帧的低地址端（栈顶）
      note: 栈帧布局（x86-64 示意）
  - id: return
    title: 返回：弹出栈帧，回到调用者
    tldr: add 把结果放进约定的寄存器，释放栈帧，ret 跳回返回地址。
    body: 返回是调用的镜像。add 把返回值放进约定寄存器 rax，调用者默认就去那里取，整数和指针返回值都走 rax，浮点返回值走 xmm0，这个分工也是约定的一部分。然后执行收尾，把 rsp 恢复到帧建立前的位置，弹出保存的旧 rbp 还给调用者，最后 ret 指令从栈顶弹出返回地址装进 PC，控制流回到 main 的调用点下一行。全过程栈恢复成调用之前的样子，add 的帧所占的内存并没有被清零，只是栈指针退回去让它变成可覆盖的空地，下一次调用会直接往上写新数据，这解释了一个经典现象，返回后立刻读那块旧内存有时还能看到 add 的局部变量残值，但读它在语义上毫无保证。栈帧的这种即用即弃也决定了局部变量的生命周期边界，函数一旦返回，指向它局部变量的指针就成悬空指针，指向的内存在下一次调用时就可能被别人的帧覆盖，这是 C 语言里一类高频 bug 的源头。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 3 章 过程调用
