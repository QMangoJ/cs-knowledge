    log:
      - mode: main 运行中
        event: main 准备调用 add
    points:
      - 函数要能被调用、返回，还要各自有局部变量，互不干扰。
  - id: call
    title: 调用：传参数，压返回地址
    tldr: 参数放进寄存器，call 指令把“回哪里”压到栈上，然后跳进 add。
    body: 以 x86-64 Linux 的 System V 约定为准走一遍调用。main 先把前两个整数参数分别放进约定的前两个参数寄存器 rdi 和 rsi，约定顺序是 rdi、rsi、rdx、rcx、r8、r9，前六个整数或指针参数全走寄存器，一个内存访问都不用。接着执行 call add，call 这条指令本身做两件不可分割的事，把下一条指令的地址即返回地址压进栈，再把 PC 改成 add 的入口地址跳过去。注意返回地址存的是调用点之后的位置，add 返回时 main 就从那里无缝续上。参数走寄存器的好处是速度，坏处是超出六个就要溢出到栈上由调用者提前压好，后面专门有一步讲。调用约定就是这套寄存器分工和栈布局的成文规则，不同操作系统和架构规则不同，Windows x86-64 只用四个参数寄存器还要求预留影子空间，所以同一份源码跨平台必须重编译，约定是二进制兼容的边界，语言互调用、动态库能不能对接，先看约定是否一致。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 3 章 过程调用
        url: http://csapp.cs.cmu.edu/
        claim: call 指令压入返回地址并跳转，参数通过寄存器传递
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
