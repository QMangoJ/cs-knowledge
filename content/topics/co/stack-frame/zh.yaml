  - id: stack-vs-heap
    title: 栈与堆怎么选，以及 buf 越界怎样改写返回地址
    tldr: 栈随调用生灭、移动指针就回收，但数据活不过返回且容量受限；往局部数组 buf 写越界会顺着低地址向高地址一路盖掉保存的 rbp 和返回地址，必须靠 canary、NX 和地址随机化设防。
    body: |-
      回到 `f` 里的那块局部数组 `char buf[16]`，先看清栈与堆的分界。栈上的数据只需加减 `rsp`，一条指令领房、一条指令退房，零碎片零延迟，但缺点也很死：生命到 `f` 返回那一刻立刻结束，且总量卡死在几 MB 以内。堆上的数据由 [[malloc]]/free 或垃圾回收管，想活多久活多久、一次申请几 GB 也行，代价是分配器要查找空闲块并记账，稍不留神还会内存泄漏或重复释放。

      再把最经典的安全攻击链直接在 `f` 的栈帧上跑一遍。还记得刚才画的布局吗？`buf[16]` 住在低地址，往高地址紧挨着它上面两格的，正是保存的旧 [[rbp]] 和 `f` 的返回地址 `0x401125`！如果 `f` 没检查长度就往 `buf` 里硬塞了 32 字节（往高地址方向增长覆盖），多出来的 16 字节就会一路顺着把旧 `rbp` 碾碎，再把 `0x401125` 篡改成攻击者提前填好的恶意代码地址——等 `f` 算完一执行 `ret`，CPU 乖乖跳过去跑别人的指令！现代操作系统为此布下三道防线：第一道叫栈 [[canary]]（金丝雀），在 `buf` 和返回地址之间夹一个随机暗号，返回前发现暗号被改直接 abort 强杀；第二道是 [[NX]]（不可执行栈），让栈内存里的字节只许当数据不许当代码跑；第三道是地址随机化（ASLR），每次运行打乱栈和代码地址让攻击者猜不中跳哪。

      最后带走三条落地判断，写代码和查崩溃都能用：第一，放栈还是放堆——问「数据用完要不要带出函数、体积大不大」，不用带出且小于几 KB 放栈最快，要带出或太大老实放堆；第二，查诡异坏值——C 程序返回后数据随机变花，先查「有没有把局部指针 return 出去」和「有没有写超局部数组撞坏邻居」；第三，防递归爆栈——按「单帧大小 × 深度 vs 栈上限（主线程 8 MB、工作线程常更小）」算一笔，算不过就改尾递归或换成堆上的显式队列。
    derivation: original
    sources:
