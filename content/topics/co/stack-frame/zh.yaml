  - id: args-overflow
    title: 第七个参数去哪了：栈传参与红区
    tldr: 参数寄存器只有六个，多的参数走栈；叶函数还有一块不用调整指针就能用的红区。
    body: 前六个整数参数走寄存器，第七个开始调用者要提前把它们按顺序压在栈上，被调用者用帧基址加偏移去取，返回地址和保存的 rbp 隔在中间，偏移要把这两项算进去，这是看汇编时最容易差 16 字节的地方。浮点参数走另一班 xmm 寄存器单独计数，两班互不挤占。再讲一个 x86-64 System V 特有的设计，栈顶以下 128 字节有一块红区，约定信号处理和中断不会踩它，叶函数即不再调用别人的函数可以直接把少量局部数据放进红区，连减栈指针建帧都省了，序言收尾一起省略，小函数因此能快到只剩几条指令。红区的边界也要记牢，一旦函数要再往下调用，调用动作本身会往栈上压返回地址，红区就可能被下层帧覆盖，所以红区只属于叶函数。Windows 约定没有红区，还要求调用者在调用前预留 32 字节影子空间给被调用者暂存参数寄存器，这类差异正是同一源码在两个平台上汇编长得不一样的原因，看栈先认约定，否则偏移全错。
    derivation: original
    sources:
