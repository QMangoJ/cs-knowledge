  - id: frame
    title: 建立栈帧：放局部变量
    tldr: add 在栈上划出一块自己的区域，存局部变量和要保存的东西。
    body: 跳进 add 后，它按需建立自己的栈帧。典型序言是把调用者的帧基址 rbp 压栈保存，再让 rbp 指向当前位置，然后把 rsp 往低地址减一块，给局部变量、临时值和要保存的寄存器腾地方，x86-64 的栈向低地址增长，新帧永远在旧帧下面。帧里从高到低大致是，返回地址、保存的旧 rbp、被调用者保存的寄存器、局部变量数组，其间还有为了 16 字节对齐留的填充。走数字，add 里有一个 4 字节局部变量，编译器可能直接把它放进寄存器连帧都省了，这叫叶函数优化，只有真需要往栈上放东西时帧才有实质内容，所以不要以为每个函数都在栈上占一大块。帧基址 rbp 的作用是给帧一个稳定锚点，函数执行中 rsp 会因压栈临时变动，但通过 rbp 加固定偏移总能找回每个局部变量。函数返回前把 rsp 恢复、弹回旧 rbp，整块帧瞬间回收，没有任何逐项释放，所谓栈分配快，就是快在这一次指针 arithmetic 上。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 3 章 过程调用
        url: http://csapp.cs.cmu.edu/
        claim: 每次调用在栈上分配栈帧存放局部状态
