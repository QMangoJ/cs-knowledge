steps:
  - id: why
    title: 为什么需要栈
    tldr: 函数要能被调用、返回，还要各自有局部变量，互不干扰。
    body: 函数调用要同时满足三件事，做完能准确回到调用点继续、各自有一套互不干扰的局部变量、最后调用的最先返回。这三件事指向同一个数据结构，栈。每次调用压入一块属于这次调用的记录即栈帧，返回时弹出，后进先出和调用的嵌套结构严丝合缝，函数 A 调 B、B 调 C，帧的顺序永远是 A 在底 C 在顶，C 返回后 B 的帧原样还在。递归能成立也靠它，同一个函数调用自己一百次，就有一百个独立的帧，每层有自己的参数和局部变量，互不串扰，不需要任何特殊机制。你在浏览器 DevTools 或 IDE 里看到的 Call Stack 面板，画的正是这摞帧，异常堆栈、断点单步、性能火焰图，全都以这摞帧为坐标。栈内存由栈指针寄存器一个加减就能分配释放，成本低到几乎免费，这和堆上要走分配器查空闲块形成鲜明对照，也是把短命数据放栈上的根本理由。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 3 章 过程调用
        url: http://csapp.cs.cmu.edu/
        claim: 运行时栈支持过程调用的后进先出特性
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
