title: 函数调用时，栈发生了什么
summary: 每次调用函数，就在栈上压一块“栈帧”；返回时弹掉。递归太深就会栈溢出。
premise: 以 Linux x86-64 上 main 调用 add(a, b) 为例。
position: >-
  「调用与数据的形态」板块由它开启，位置排在缓存的空间局部性之后：缓存讲数据成行搬运，栈帧讲的则是调用时数据成帧落位，看的仍是内存的组织方式。拿 main 调用 add(a, b) 当标本学完，你能画出含返回地址与保存寄存器的栈帧剖面，也能说清递归过深为何栈溢出、局部数组越界又为何会威胁到金丝雀旁边的返回地址。
bridge:
  prev: >-
    上一课的缓存行把数据按 64 字节整行搬进 CPU，本课换个粒度看内存——函数每调用一次，就在栈上新压一整块栈帧。
  next: >-
    栈帧里躺着的局部变量终究只是一串二进制位，下一课便追问这些位如何编码，看看 int 的补码与 double 的浮点格式怎样定下它们的含义。
overview:
  - key: 一句话总结
    value: 调用时压栈帧，返回时弹栈帧，后进先出
  - key: 栈帧里有什么
    value: 返回地址、放不进寄存器的局部变量、需要保存的寄存器
  - key: 参数怎么传
    value: x86-64 Linux 上前 6 个整数/指针参数用寄存器传，多的放栈上
  - key: 栈溢出
    value: 递归太深把栈用完，程序崩溃
  - key: 类比
    value: 浏览器 DevTools 里的 Call Stack 面板；JS 的 Maximum call stack size exceeded
  - key: 寄存器保存
    value: 调用者保存 / 被调用者保存，由调用约定规定
  - key: 栈 vs 堆
    value: 栈自动随函数释放；堆手动或 GC 管理
  - key: 安全
    value: 栈缓冲区溢出可覆盖返回地址；有 canary、NX 等防护
  - key: 尾调用
    value: 有的编译器可把尾递归优化成循环，不压新栈帧
  - key: 在终端里看一看
    value: ulimit -s　看栈大小上限；gdb 里用 bt　看当前调用栈
