id: co/stack-frame
subject: co
slug: stack-frame
order: 5
status: published
license: CC-BY-4.0
title: 函数调用时，栈发生了什么
summary: 每次调用一个函数，CPU 就在栈上给它切出一块专属房间——叫栈帧，用来放返回地址、局部数据和暂时借走的寄存器；函数算完返回时把房间一键退掉。从 main 调 f、f 再调 g 这串两层嵌套出发，你能顺出调用约定怎么传参、指针怎么对齐、叶函数怎么省开销，也看清递归爆栈和越界篡改返回地址到底是怎么发生的。
premise: 代码里写下一串再普通不过的调用：main 调用 f(10, 20)，f 算出中间结果又调用叶函数 g(11, 21)。算完 g 之后程序凭什么不会糊涂回到 main，而是准确回到 f 的下一行？如果 f 和 g 都定义了一个叫 tmp 的局部变量，它们又怎么做到互不覆盖？这一课就用 Linux [[x86-64]] 上 main 调 f 再调 g 的完整链路，把栈上每一格内存的来龙去脉拆给你看。
position: 本课开启了「调用与数据的形态」板块，接在上一课讲完的缓存空间局部性后面：缓存聊的是硬件怎么按 64 字节整行搬数组，栈帧聊的则是函数层层调用时数据怎么成帧落进内存。拿 main 调 f 再调 g 这串调用当标本学透后，你能手画一张带着返回地址、基址锚点和局部变量的栈帧剖面，下一课再往下拆格子里的二进制补码和浮点数就水到渠成。
bridge:
  prev: 上一课把数组元素按 64 字节整行搬进了缓存，这一课换个视角看内存——每次函数层层嵌套调用时，栈上怎么给每一层切出互不打架的小房间。
  next: 栈帧格子里的局部变量已经各就各位，可格子里面躺着的归根结底是一串 0 和 1；下一课就翻开这些比特，拆解整数的补码与小数的浮点编码。
overview:
  - key: 一句话总结
    value: 函数每次被调用都会在栈上领一块专属区域（栈帧），放好返回地址、局部变量和要保存的寄存器；返回时直接把栈指针退回原位一键回收，整条链严丝合缝遵守后进先出。
  - key: 栈帧里有什么
    value: 一个典型栈帧里按顺序住着返回地址（算完回哪一行）、上一层的基址指针、放不进寄存器的局部变量，以及借用前暂存起来的寄存器原值。没有返回地址，函数算完就迷路了。
  - key: 参数怎么传
    value: 在 [[x86-64]] Linux 下，前 6 个整数或指针参数直接走寄存器（rdi 到 r9），寄存器够用时根本不沾内存；从第 7 个参数起才由调用者提前摆上栈。
  - key: 栈溢出
    value: 每多调一层就多压一块栈帧，主线程栈默认只有几 MB（Linux 上常为 8 MB）；忘了写终止条件的死递归或帧里塞巨型数组，会把栈空间吃穿，程序直接崩掉。
  - key: 类比
    value: 浏览器 DevTools 里的 Call Stack 调用栈面板画的正是这摞栈帧，每调进一层就多压一行；[[JS]] 里常见的 Maximum call stack size exceeded，就是这摞栈被压爆了。
  - key: 寄存器保存
    value: 全核心只有一套约 16 个通用寄存器，调用者和被调用者都要用，所以调用约定把它们分成两班：一班随便踩（调用前自己存），另一班谁借谁还（进门存好、出门恢复）。
  - key: 栈 vs 堆
    value: 栈随着函数返回瞬间自动回收，分配成本只有一条指针加减指令，但命活不过函数返回；堆上的内存靠手动释放或垃圾回收接管，能活得久、装得大，代价是分配慢且容易忘收或重复收。
  - key: 安全
    value: 栈帧里局部数组和返回地址紧挨着当邻居，往数组写超了就会直接把返回地址改写成攻击者指定的地址；现代系统靠栈 [[canary]]、[[NX]] 不可执行栈和地址随机化三层设防。
  - key: 尾调用
    value: 如果 f 的最后一句话就是原封不动返回 g 的结果，编译器可以把调用直接优化成跳转，复用 f 现在的栈帧而不再压新帧——尾递归因此能像普通循环一样跑几百万层不爆栈。
  - key: 在终端里看一看
    value: ulimit -s　看栈大小上限；[[gdb]] 里用 bt　看当前调用栈
