  - id: warp
    title: SIMT 与 warp：32 个线程捆成一束，同发一条指令
    tldr: "[[GPU]] 调度硬件的最小单位不是单个线程，而是 32 个线程捆成的 [[warp]]：同一拍全组发同一条指令，每人拿自己的寄存器和下标算自己的那份数据。这种「写单线程逻辑、按束并行跑」的模式就叫 [[SIMT]]。"
    body: |-
      回到一百万个数的向量加法 `c[i] = a[i] + b[i]`（看下面代码）。用 [[CUDA]] 写程序时，你只管写「一个线程做什么」：算好自己的全局编号 `i`，读 `a[i]` 和 `b[i]` 相加写进 `c[i]`。启动后一口气拉起一百万个线程，可 [[SM]] 并不把它们一个个单独排队，而是每 32 个连续编号的线程捆成一组（0–31 号是一组，32–63 号是下一组），同一时刻向全组广播同一条指令。这个 32 人的调度小组就是 [[warp]]（线程束），这套模型叫 [[SIMT]]（Single-Instruction, Multiple-Thread，单指令多线程）。

      等一下，这和 [[CPU]] 的 [[SIMD]]（一条向量指令同时算 8 个或 16 个数）有什么区别？在 CPU 的向量指令里，8 个浮点数是被塞进一个宽向量寄存器里打包动的，程序员得操心打包、对齐和掩码，里面没有「单个线程」的概念；而在 SIMT 里，32 个线程依然各自保留自己的寄存器和指令地址计数器，写代码时完全按独立线程写，甚至能写 `if/else`——只是同一束里各走各路要付额外代价（下一步马上算这笔账）。

      再把线程的组织层级摆出来，后面每步都要用：最小的是线程（thread）；几百个线程组成一个线程块（block，常见 128 到 512 个）；所有块合起来组成网格（grid）。一个线程块会被整体交给一个 SM 执行，块内线程能协作。拿一个 256 线程的块换算：`256 ÷ 32 = 8` 个 warp。这也解释了为什么大家总叮嘱「块大小要设成 32 的倍数」：如果你设成 40 个线程，硬件还是得发 2 个 warp（64 个槽位），多出来的 24 个位置空占发射槽却不干活，白白浪费。
    derivation: original
    sources:
      - ref: nvidia-cuda
        locator: SIMT Execution Model 一节
        claim: SM 以 32 个线程组成的 warp 为单位执行，每个线程有自己的指令地址计数器与寄存器状态
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
