subject: co
slug: gpu-simt
order: 7
status: published
license: CC-BY-4.0
title: GPU 与并行架构：SIMT 是怎么回事
summary: CPU 为少量线程的低延迟而生，GPU 为海量线程的高吞吐而生——理解 warp、分支分化与显存层级，就理解了 AI 计算的硬件底座。
premise: 以 NVIDIA GPU 执行向量加法与矩阵乘法为例（术语用 CUDA 的说法）。
position: >-
  本科由「并行硬件」板块收官，入口接在上一课 float32 与 double 的位格式之后：数值编码既已定型，最后要看一万个线程怎样同时对这些数做向量加法。学完你能用 warp 讲清 SIMT 与 SIMD 的同异，也能判断一个核函数慢在分支分化、不合并访存，还是显存带宽先被吃满。
bridge:
  prev: >-
    上一课把 double 拆成符号、阶码与尾数三段，本课让成束的 warp 线程对成批这样的浮点数动手，并用海量线程而非大缓存来掩盖访存延迟。
overview:
- key: 一句话总结
  value: GPU 用成千上万个简单线程 + SIMT 执行掩盖延迟，靠吞吐而非单线程速度取胜
- key: warp
  value: 32 个线程一组（warp）同发一条指令，各自有自己的寄存器与程序计数状态
- key: 分支分化
  value: 同一 warp 内线程走不同分支时，各分支要轮流执行并掩码，效率按分支数打折
- key: 显存层级
  value: 寄存器 > 共享内存（片上、块内手动管理）> 全局显存（HBM，大但远）
- key: 合并访存
  value: 相邻线程访问相邻地址才能合并成少数几次内存事务
- key: 延迟隐藏
  value: 一个 warp 等内存时立刻换另一个 warp 执行——靠「人多」而不是靠缓存与乱序
