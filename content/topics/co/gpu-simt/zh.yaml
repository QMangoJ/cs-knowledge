  - id: memory
    title: 显存层级：寄存器贴身、共享内存手管、HBM 最远
    tldr: "[[GPU]] 把存储分成近而快、远而大三层：线程私有的寄存器最快，片上共享内存速度接近寄存器但要程序员亲手搬，全局显存（[[HBM]]）能装几十 GB 却远在几百个周期之外。"
    body: |-
      算术单元算得再快，数据喂不到嘴边也是白搭。先按离执行单元的距离摆好 GPU 的三层存储：最贴身的是每个线程私有的**寄存器**，延迟 1 个周期量级，放临时变量最合适；往外一层是片上的**共享内存**（shared memory），容量通常几十 KB，速度接近寄存器，由同一个线程块里的所有线程共用；最远的是板卡上的**全局显存**（现代算力卡常用 [[HBM]]），容量几十 GB、靠极宽的位宽堆出惊人总带宽，但单个 [[warp]] 去取一趟要等约 400–800 个周期。至于 [[CPU]] 那边的主机内存，还得绕道 [[PCIe]] 或 [[NVLink]]，离得更远。

      听到「片上几十 KB 的高速存储」，很多人第一反应是：这不就是 CPU 的 L1 缓存吗？关键区别就在管理权归谁。CPU 缓存全靠硬件按地址规律自动猜着留，程序员看不见也插不上嘴；GPU 的共享内存更像一块**手动管理的片上工作台**——把哪一块数据搬上来、按什么格式摆好、留几轮之后再换掉，全由代码显式写出来。好处是复用次数和性能都能算得极准，矩阵乘法分块（第 8 步）靠的就是它；坏处是布局写错了要自己兜底，比如多个线程撞进同一个存储体就会排队（第 9 步）。

      还要盯紧一条贯穿全卡的资源三角：每颗 [[SM]] 上的寄存器总数和共享内存容量都是天花板。拿寄存器举个例子，如果每个线程抓 128 个寄存器而不是 32 个，同一颗 SM 上能同时驻留的线程数就会砍掉大半；要是再超出上限，编译器就会悄悄把变量「溢出」（spill）到所谓「本地内存」里——名字叫本地，物理上其实躺在大老远的全局显存里，一写一读直接掉回几百个周期。
    derivation: original
    sources:
