steps:
- id: why
  title: 为什么需要另一种架构
  tldr: 训练与推理的计算是「同一操作 × 海量数据」，CPU 的大核 + 大缓存是错配的投资。
  body: 'CPU 把芯片面积花在：少数几个强力核心、深缓存层级、分支预测与乱序执行——目标是让单个线程尽快跑完。图形渲染与神经网络的负载恰好相反：同一个操作要作用在百万级数据元素上，元素之间大多独立。

    GPU 的取舍因此完全不同：成千上万个简单得多的执行单元、相对弱的单线程性能、用海量并发线程的总吞吐取胜。理解这个取舍，就理解了为什么矩阵乘法在 GPU 上快一两个数量级，而串行逻辑（比如逐 token 的调度代码）放 GPU 上毫无意义。'
  derivation: original
  sources:
  - ref: nvidia-cuda
    locator: Programming Model / Hardware Model 一节
    claim: GPU 由大量流多处理器（SM）组成，以线程级并行获得高吞吐，与 CPU 的低延迟取向不同
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: datastate
    structure: array
    caption: 两种投资方向：少量强线程 vs 海量弱线程
    rows:
