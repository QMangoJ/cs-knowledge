- id: tiling-walk
  title: 走例：矩阵乘法 tiling 如何把访存摊薄
  tldr: 不分块时每个输出要读一整行一整列；分块后先把小块搬进共享内存，块内每个元素被复用十几次。
  body: '算 C = A×B 的一个 16×16 输出块：需要 A 的 16 行片段与 B 的 16 列片段。若每个线程各算一个输出、各自去全局内存读行读列，同一行 A 会被 16 个线程重复读 16 遍，带宽全耗在重复搬运上。tiling 的做法分两段：先协作搬运——块内 256 个线程各搬几个元素，把 A 的 16×16 子块与 B 的 16×16 子块装进共享内存；再协作计算——每个线程从共享内存里读自己需要的那行那列算点积。这一小块里每个被搬进来的元素被复用 16 次，等于把全局访存量压到约 1/16（对更大的块，复用次数等于块边长）。

    沿 K 维度把这个过程重复下去（搬下一片、累加），就是生产级矩阵乘法 kernel 的骨架。cuBLAS 之所以快，核心机制正是这套分块 + 多级缓冲的精细化，而不是某种魔法指令。'
  derivation: original
  sources:
  - ref: nvidia-cuda
    locator: Shared Memory 与矩阵乘法示例（Programming Guide）
    claim: 用共享内存缓存子块可显著提高矩阵乘法的全局内存访问效率
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
