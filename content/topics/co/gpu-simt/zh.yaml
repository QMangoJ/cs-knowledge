title: GPU 与并行架构：SIMT 是怎么让成千上万线程一起算的
summary: "[[CPU]] 把芯片面积砸在让单个线程尽快跑完上，[[GPU]] 却反过来，用成千上万个简单线程靠总吞吐取胜。为了管住这么多干活的人，硬件把 32 个线程捆成一束同发一条指令，靠海量替补轮流上阵盖住取数据的等待，再用连续访存和片上小仓库把带宽省下来。全课先算清这种取舍从哪来，再依次拆解线程编组、分支绕路、显存层级、合并访存和矩阵分块，最后落回大模型推理里「算力瓶颈」与「带宽瓶颈」怎么判断。"
premise: 给一百万个浮点数各加 1，再接着把两个大矩阵乘起来——这种成片重复的数学活，CPU 只能按个或按小批慢慢推，GPU 却能拉起上万个线程同时开算。同样一块硅片，它到底是怎么把这么多线程排成队、喂饱数据、又不至于互相踩脚的？本课就拿向量加法与矩阵乘法作主线，按 NVIDIA 显卡常用的 [[CUDA]] 术语从头走一遍。
position: 本课是组成原理「并行硬件」板块的核心一课。上一课把整数和小数怎样编码成 0 和 1 装进内存讲完了，这一课换个问题：当需要同时算成千上万个这样的数字、一个强核心远远不够用时，显卡怎么靠人多把总吞吐拉满。学完这一课，你能看清为什么并行代码总爱凑 32 的倍数、为什么一个条件判断或一次跳着读内存就能让显卡掉速十倍，也为下一课多设备共用内存通道打下底子。
bridge:
  prev: 上一课把浮点数拆成符号、阶码和尾数存进了内存，一次算一个数已经清清楚楚。可真到大模型一次要处理百万个浮点数时，靠少数核心挨个算实在太慢；这一课换上 GPU，看成千上万个简单线程怎么成群结队把这批数一起吞掉。
  next: GPU 算得再快，数据也得先经总线搬来搬去，可这条内存通道从来不是谁独占的。下一课把镜头拉回整台机器，看 CPU、磁盘、网卡和加速器都要用内存时，搬运由谁接手、通道秩序又由谁维持。
overview:
  - key: 一句话总结
    value: "[[GPU]] 把芯片面积换成成千上万个简单线程，靠 32 人一组的 [[SIMT]] 调度和轮流上阵吃满总吞吐——它不比单人跑多快，比的是整条产线同一秒出多少货。"
  - key: warp
    value: 硬件每次按 32 个线程捆成一组来调度，叫一个 [[warp]]。同一拍全组发同一条指令，每人手里拿自己的寄存器和不同的数据下标。
  - key: 分支分化
    value: 同组 32 个线程如果走上了不同的 if/else 岔路，硬件只能先跑完第一条路、再跑另一条路，没走这条路的线程当场被屏蔽干等，总耗时直接相加。
  - key: 显存层级
    value: 存储按远近分三层：线程私有的寄存器最快；同块共用的共享内存在芯片上，要程序员手动搬；容量最大的全局显存（[[HBM]]）离得最远，跑一趟要等几百个周期。
  - key: 合并访存
    value: 同组 32 个线程如果读相邻的内存地址，硬件能把 32 个请求打包成 1–2 次传输；一旦地址跨步乱跳，就得跑满 32 趟，带宽白白浪费一个数量级。
  - key: 延迟隐藏
    value: 一组线程等显存数据时，调度器零成本切到另一组已经就绪的线程继续算。GPU 不靠大缓存省等待，而是靠备选线程够多把空档填满。
