    event: 先分清 compute-bound 还是 memory-bound，再谈优化
level: 进阶
minutes: 20
prereq:
- co/pipeline
- co/cache
objectives:
- 用 warp 说明 SIMT 与 SIMD 的异同
- 解释分支分化与不合并访存为什么慢
- 区分算力瓶颈与带宽瓶颈的典型场景
aiLink: 这是理解一切推理性能数字的硬件底座：为什么 batch 变大吞吐涨、为什么解码被显存带宽卡住、为什么算子融合（少搬数据）比微调指令更值钱。读 profiler 之前，先有这一课的心智模型。
quiz:
- q: warp 在任一时刻执行什么？
  options:
  - 32 条完全不同的指令
  - 一条公共指令，32 个线程各处理自己的数据
  - 一条指令只处理一个数据
  - 由操作系统决定
  answer: 1
  explain: SIMT 以 warp（32 线程）为调度单位发射公共指令，线程靠各自的寄存器与数据区分彼此。
- q: 同一 warp 内一半线程走 else 分支时，硬件会怎样？
  options:
  - 并行执行两分支，互不影响
  - 两分支轮流执行，不走的线程被掩码，成本约为两者之和
  - 报错并终止 kernel
  - 自动把线程重排到不同 warp
  answer: 1
  explain: 分支分化使各路径串行化，未选中路径的线程在对应时段闲置。
- q: 逐 token 解码通常是什么瓶颈？
  options:
  - 算力瓶颈
  - 显存带宽瓶颈（权重每步都要整表搬一遍，复用极低）
  - PCIe 瓶颈
  - 分支预测瓶颈
  answer: 1
  explain: 解码时矩阵×向量的算术强度低，性能由把权重读进来的带宽决定；加大 batch 才能把复用提上去。
