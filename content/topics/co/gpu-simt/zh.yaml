  - id: coalescing
    title: 合并访存：相邻线程读相邻地址，32 趟变 1 趟
    tldr: 一个 [[warp]] 一次读 32 个 `float`，地址挨在一起时硬件打包成 1–2 次内存事务就搬完；地址跨步散落时被迫跑满 32 趟，有效带宽当场掉一个数量级。
    body: |-
      先拿具体的字节数走一遍从全局显存读数据的账。我们熟悉的 `float` 每个占 4 字节，一个 [[warp]] 里 32 个线程同时执行读指令，一共需要 `32 × 4 = 128` 字节的数据。显存控制器不是按 4 字节零卖的，而是按连续大段（比如 32 字节或 128 字节的内存事务）整箱发货。如果在向量加法里，0 号线程读 `a[0]`、1 号读 `a[1]`……31 号读 `a[31]`，这 128 字节正好严丝合缝躺在一起，硬件只需发 **1 次**（没对齐时最多 2 次）内存事务就把整组喂饱，总线搬的 128 字节 100% 全是有效数据——这就是**合并访存**（coalesced access）。

      现在把读取姿势转个 90 度：假设线程 `i` 要按列读取一个行宽为 32 的 `float` 矩阵（`a[i * 32]`）。0 号线程读第 0 字节，1 号线程读第 128 字节，2 号读第 256 字节……相邻线程的地址一下隔开了 128 字节，32 个地址彻底散落到 32 个互不挨边的箱子里。硬件没法打包，只能老老实实跑 **32 趟** 事务，从显存往芯片上搬了 `32 × 128 = 4096` 字节，结果你真正用上的还是那 128 字节，剩下 97% 的总线带宽全在搬空气！

      所以排查一个 [[GPU]] 核函数为什么慢，永远有个优先顺序：第一先查访存合不合并，第二查共享内存有没有撞车，最后才看加减乘除算力。矩阵转置、洗牌或按对象数组（[[AoS]]）去读数据经常慢得离谱，十有八九不是算力不够，而是第一关就没过——把对象拆成纯数字列（[[SoA]]）让同组线程读相邻下标，往往比调半天指令快十倍。
    derivation: original
    sources:
      - ref: nvidia-cuda
        locator: CUDA Best Practices / Memory Optimizations 相关章节
        claim: 全局内存访问按事务服务，线程访问地址越连续合并程度越高、有效带宽越大
