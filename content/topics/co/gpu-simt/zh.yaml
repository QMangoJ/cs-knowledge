steps:
  - id: why
    title: 为什么需要 GPU：用单线程速度换海量总吞吐
    tldr: "[[CPU]] 把晶体管砸在让单个线程尽快跑完上，[[GPU]] 则把面积全换成成千上万个简单算术单元，靠海量并发拉满总吞吐。任务能不能拆成大量互不依赖的小份，决定了该请谁上场。"
    body: |-
      拿开头那两件事算一笔芯片面积账。给一百万个浮点数各加 1、或者把两个大矩阵乘起来，特点都是同一套算式要重复盖在百万级数据上，元素之间彼此独立。[[CPU]] 的一颗大核把晶体管花在让一条指令流跑得飞快：配了复杂的分支预测器、乱序执行窗口和几十 MB 大缓存，一颗核能省下不少等待，但也只能同时伺候少数几个线程（比如 8 个核跑一二十个线程）。

      [[GPU]] 走了完全相反的投资路线。它的流多处理器（[[SM]]）把同样一片硅片上的分支预测和巨大缓存通通砍薄，省下来的面积全换成成百上千个轻巧的算术单元和超大寄存器堆，一口气挂起上万个线程。单个线程算得并不快，可一百万个独立元素同时涌上来时，千军万马一起推，总吞吐直接把 CPU 甩开一两个数量级。

      反过来问：那操作系统调度、编译器、或者大模型推理里逐个生成 [[token]] 的控制循环，扔给 GPU 岂不是更快？恰恰相反——这类活分支极多、下一步紧咬着上一步的结果，根本拆不成互不依赖的小份。一万个 GPU 线程面对一条单行依赖链，9999 个只能干瞪眼。所以真实系统从来不是谁取代谁，而是「CPU 管控制、GPU 管计算」：先看活能不能切碎成大量独立小份，能切归 GPU，环环相扣的串行活留给 CPU。
    derivation: original
    sources:
      - ref: nvidia-cuda
        locator: Programming Model / Hardware Model 一节
        claim: GPU 由大量流多处理器（SM）组成，以线程级并行获得高吞吐，与 CPU 的低延迟取向不同
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
