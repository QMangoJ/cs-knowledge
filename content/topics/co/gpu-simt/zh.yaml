    log:
      - mode: 执行
        event: warp 是硬件调度单位，线程是编程单位
    code:
      lang: cuda
      code: |-
        // 向量加：每个线程负责一个元素（CUDA C）
        __global__ void add(const float* a, const float* b, float* c) {
          int i = blockIdx.x * blockDim.x + threadIdx.x;  // 我的全局编号
          c[i] = a[i] + b[i];                            // 只管自己这一个
        }
        // 启动时开成千上万个线程，硬件把它们按 32 个一组打包成 warp 执行
      note: 写的是单线程逻辑，跑的是海量并行
      highlight: 3
  - id: divergence
    title: 分支分化：同束线程走岔路，总耗时直接相加
    tldr: 当一个 [[warp]] 里的 32 个线程分别踩进不同的 if/else 分支时，硬件无法同时跑两条路，只能先跑完一条、再回头跑另一条，总时间等于两段路加起来，而不是取较长的那一条。
    body: |-
      接着刚才的一百万个数走下去。假设我们在核函数里加了一条条件：正数做一次轻计算（耗时约 10 个周期），负数做一套重计算（耗时约 30 个周期）。如果 warp 0 里 0–15 号线程拿到的都是正数（走 if）、16–31 号拿到的是负数（走 else），硬件就会陷入两难——一个 warp 同一拍只能发一条公共指令。于是硬件先发射 if 分支的 10 个周期，同时把走 else 的 16 个线程掩码屏蔽（原地干等）；跑完后再换发 else 分支的 30 个周期，这回轮到走 if 的 16 个线程干等。总耗时 `10 + 30 = 40` 个周期，而不是并行直觉里的 `max(10, 30) = 30`！

      这叫**分支分化**（warp divergence）。有人会问：不是说现代 NVIDIA 架构（从 [[Volta]] 起）支持独立线程调度了吗，怎么还要叠加耗时？独立线程调度确实让每个线程能更灵活地交错前进、避免了早期的互锁死锁，但一个 warp 依然共用取指和发射通道，两条路的总指令量半点没少，「总耗时相加」的账依然成立。这也是 GPU 和 [[CPU]] 性能直觉相反的地方：CPU 怕分支预测猜错、清空流水线；GPU 没做分支预测，它最怕**同一束内**的 32 个线程走散。

      怎么治分支分化？常用三招：第一，调整数据排布，比如先把数组按正负排个序再启动 [[kernel]]，让 0–31 号全走正数、32–63 号全走负数——分叉落在不同的 warp **之间**时，每个 warp 自己依然整齐划一，分化代价归零；第二，把短小的 `if/else` 改写成无分支算术或三目条件选择，让两条路合流；第三，把分叉特别重的大阶段拆成两个独立的核函数。不过如果 `if` 两侧总共才一两条指令，分化绝对比不过多起一个核函数的开销，先测再动。
    derivation: original
    sources:
