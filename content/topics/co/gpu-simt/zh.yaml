design:
  - mechanism: 把 32 个线程捆成一束（warp）同发一条指令
    problem: 每个执行单元都配一套完整的取指和译码电路，省下的晶体管全会被控制电路吃光；可一束捆几百个线程，只要里面几个人走岔路，整束都得陪着多跑一轮。
    choice: 选 32 作为平衡点（CUDA 明确规定 warp 为 32 线程）：控制电路的成本被 32 个人平摊到几乎看不见，同时连续 32 个数据元素走同一条分支的概率还足够高。改成 8 会让控制面积暴涨 4 倍，改成 128 则会把分岔浪费成倍放大。
    tradeoff: 硬件造得紧凑、总算力密度极高；代价是写代码的人得迁就这 32 人的规矩——线程块大小凑 32 的倍数，条件判断尽量别落在一束里面。
    root: 一份控制配多份执行的通用权衡：控制成本随宽度摊薄，而协调整齐度随宽度变脆，最优点就在两条曲线打架的中间点。
  - mechanism: 靠几十组 warp 的寄存器常驻片上轮换，不用大缓存和乱序执行
    problem: 去显存跑一趟要等几百个周期，物理距离压不下去。等的时候算术单元要么空转，要么靠砸晶体管让单个人少等（CPU 的大缓存与乱序），要么干脆换别人来算。
    choice: GPU 把片上面积全留给超大寄存器堆和更多算术单元，几十组 warp 的全部家当常驻片上，切换零成本；一旦某组等数据，立刻切下一组上去算。
    tradeoff: 延迟隐藏几乎零开销，整卡吞吐密度极高；代价是单线程跑不快，一旦任务拆不出足够多的并发组，整张卡就会因为无人可替补而速度断崖。
    root: 排队论的利特尔法则：在途线程数 = 延迟 × 吞吐率。既然单趟延迟减不掉，要喂饱高吞吐流水线，就必须维持足够多的在途替补——和异步 I/O 靠多并发盖住磁盘等待是同一笔数学。
  - mechanism: 把片上共享内存做成手动搬运，不做全自动硬件缓存
    problem: 矩阵分块这类计算里，每块数据要被谁复用几次、什么时候丢掉，写算法的人早就一清二楚；硬件自动缓存只能靠过往地址瞎猜，既多花维护电路又经常换错。
    choice: 直接把片上存储作为可编程工作台交给代码显式管理，搬哪块、怎么垫列防冲突、什么时候同步全由人定。
    tradeoff: 换来确定可算的片上高带宽，不再怕缓存替换策略抽风；代价是编程心智负担变重，一不小心就会写出 bank 冲突或漏加同步的 bug，还要按卡的容量重调分块大小。
    root: 离算法意图最近的一方管调度最划算：当数据复用规律完全确定且可预知时，把管理权交给知情的程序员，胜过硬件事后靠猜。
quiz:
  - q: warp 在任一时刻执行什么？
    options:
      - 32 条完全不同的指令
      - 一条公共指令，32 个线程各处理自己的数据
      - 一条指令只处理一个数据
      - 由操作系统决定
    answer: 1
    explain: SIMT 以 warp（32 线程）为调度单位发射公共指令，线程靠各自的寄存器与数据区分彼此。
  - q: 同一 warp 内一半线程走 else 分支时，硬件会怎样？
    options:
      - 并行执行两分支，互不影响
      - 两分支轮流执行，不走的线程被掩码，成本约为两者之和
      - 报错并终止 kernel
      - 自动把线程重排到不同 warp
    answer: 1
    explain: 分支分化使各路径串行化，未选中路径的线程在对应时段闲置。
  - q: 逐 token 解码通常是什么瓶颈？
    options:
      - 算力瓶颈
      - 显存带宽瓶颈（权重每步都要整表搬一遍，复用极低）
      - PCIe 瓶颈
      - 分支预测瓶颈
    answer: 1
    explain: 解码时矩阵×向量的算术强度低，性能由把权重读进来的带宽决定；加大 batch 才能把复用提上去。
