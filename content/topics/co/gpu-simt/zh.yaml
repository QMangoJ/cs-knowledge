- id: warp
  title: SIMT 与 warp：32 个线程一条指令
  tldr: SM 把线程按 32 个一组（warp）调度执行：同一时刻 warp 内发同一条指令，各线程处理不同数据。
  body: 'CUDA 的执行模型叫 SIMT（Single-Instruction, Multiple-Thread）。SM 创建、调度与执行线程的单位是 warp：一组 32 个线程，从同一地址开始执行，warp 在任一时刻执行一条公共指令，每个线程用自己的寄存器与数据干自己的活。

    它和 CPU 的 SIMD（一条指令操作一个向量寄存器）像但不同：SIMT 里每个线程是独立的编程单位，有自己的指令地址计数器与寄存器状态，形式上可以各走各的分支——只是分开走有代价（下一步）。编程时你写的是「一个线程做什么」，硬件按 warp 把它们成组执行。

    把层次补全：线程（thread）是最小单位，若干线程组成线程块（block，常见 128–512 个线程），块再组成网格（grid）。块是分配单位：一个块被整体放进一个 SM 执行，块内线程可以通过共享内存协作并同步；块与块之间互不依赖、执行顺序不保证。换算一下：一个 256 线程的块 = 8 个 warp，SM 在这 8 个 warp 之间轮换发射。下次看到「每块线程数最好是 32 的倍数」这条经验，原因就在这里：不足 32 的尾巴也要占满一个 warp 的发射槽位，多出来的线程位置是纯浪费。'
