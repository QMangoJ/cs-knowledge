aiLink: 这是理解一切推理性能数字的硬件底座：为什么 batch 变大吞吐涨、为什么解码被显存带宽卡住、为什么算子融合（少搬数据）比微调指令更值钱。读 profiler 之前，先有这一课的心智模型。
design:
- mechanism: 为什么以 32 个线程为一束（warp）
  problem: 硬件发射一条指令要付出固定的译码与控制成本：若每个线程独立发射，控制开销会吃掉简单执行单元省下的面积；若一束捆得太大，线程间路径不一致的概率与代价又同步放大。束的大小是「控制成本」与「执行整齐度」之间的物理权衡，不是编程风格问题。
  choice: 选 32：一条指令的控制成本被 32 个线程摊薄到可忽略，同时一束内保持同构路径的概率还足够高。若改成 8，控制开销涨到 4 倍、吞吐打折；改成 128，一次分支分化就要串行化更多工作、掩码浪费成倍。32 是 NVIDIA 在其硬件上选定的平衡点（CUDA 编程指南明确 warp 为 32 个线程）。
  tradeoff: 换来的是极低的单线程控制成本与可预测的发射模型；牺牲的是编程模型必须迁就束：块大小要取 32 的倍数、算法要尽量避免束内分化。代价由写 kernel 的人承担——用编程纪律换硬件效率。
  root: 本质是摊销：任何「一份控制、多份执行」的结构（SIMD 向量宽度、批处理大小）都服从同一条成本曲线——控制成本固定、随宽度递减，分化/填充浪费随宽度递增，最优点在两条曲线相交处。
- mechanism: 为什么靠海量线程掩盖延迟而不是大缓存与乱序
  problem: 显存延迟是几百个周期量级，这个数字由物理距离与器件决定，压不下去。问题只剩：等的时候执行单元干什么。CPU 的答案是让单个线程不等（预测、乱序、缓存预取），GPU 的答案是换个线程干活——两条路都成立，区别在晶体管花在哪。
  choice: GPU 把面积花在寄存器堆与更多执行单元上：每个 SM 驻留大量 warp 的全部上下文（寄存器）常驻片上，切换 warp 不需要保存/恢复，近乎零成本。若走 CPU 路线（大缓存 + 乱序窗口），同样的面积只能伺候个位数线程的延迟，吞吐上不去；若线程数不够多，掩盖延迟的账就算不平——所以这条路线的前提是负载本身有海量并行。
  tradeoff: 换来近乎免费的延迟掩盖与极高的吞吐密度；牺牲的是单线程性能与通用性：并行度不足时整台机器陪跑，占用率与寄存器预算成了每个 kernel 都要算的账。代价由负载形态承担——规则数据并行受益，串行逻辑吃亏。
  root: 排队论的直觉（利特尔法则）：在途请求数 = 延迟 × 到达率。要在固定延迟下喂饱固定的发射率，就必须维持足够多的在途 warp；延迟藏不住，只能靠并发量盖住，这是所有高吞吐系统（GPU、异步 IO、流水线）共同的数学。
- mechanism: 为什么共享内存要手动管理而不是全自动缓存
  problem: 数据复用的模式写在算法里（比如 tiling 的块结构），硬件缓存只能靠地址与时间猜局部性。对规则的数据并行负载，猜测既不准也浪费：同一份数据在片上该留多久、给谁用，程序员在写算法时其实全都知道。
  choice: 把片上存储做成显式可编程的共享内存：搬运时机、布局、复用次数全由程序决定，性能可预测、可调优。若做成自动缓存，命中与否取决于替换策略的运气，同一 kernel 换个数据规模就可能性能漂移；若干脆没有片上存储，所有复用都退回全局内存，矩阵乘法的算术强度直接塌掉。
  tradeoff: 换来确定性的高带宽片上通道与可计算的访存账；牺牲的是编程负担与新的翻车点（bank 冲突、同步错误），且代码与块尺寸强耦合、移植性差。代价由开发者承担——用人力换硬件效率，与「用寄存器换内存访问」是同一笔交易。
  root: 局部性原理的分工问题：时间与空间局部性是程序的固有属性，谁离算法最近谁就最清楚复用结构。自动硬件只能看到地址流、看不到算法意图；当复用模式足够规则且可预知时，把管理权交给最知情的一方，期望收益高于任何启发式替换策略。
quiz:
- q: warp 在任一时刻执行什么？
  options:
  - 32 条完全不同的指令
  - 一条公共指令，32 个线程各处理自己的数据
  - 一条指令只处理一个数据
  - 由操作系统决定
  answer: 1
  explain: SIMT 以 warp（32 线程）为调度单位发射公共指令，线程靠各自的寄存器与数据区分彼此。
- q: 同一 warp 内一半线程走 else 分支时，硬件会怎样？
  options:
  - 并行执行两分支，互不影响
  - 两分支轮流执行，不走的线程被掩码，成本约为两者之和
  - 报错并终止 kernel
  - 自动把线程重排到不同 warp
  answer: 1
  explain: 分支分化使各路径串行化，未选中路径的线程在对应时段闲置。
- q: 逐 token 解码通常是什么瓶颈？
  options:
  - 算力瓶颈
  - 显存带宽瓶颈（权重每步都要整表搬一遍，复用极低）
  - PCIe 瓶颈
  - 分支预测瓶颈
  answer: 1
  explain: 解码时矩阵×向量的算术强度低，性能由把权重读进来的带宽决定；加大 batch 才能把复用提上去。
