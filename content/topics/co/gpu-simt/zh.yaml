- id: block-grid
  title: 线程层次：块进 SM，网格铺满整卡
  tldr: 启动 kernel 时你定的是网格与块的大小；硬件按块把活分给各个 SM，块内再切成 warp 轮换执行。
  body: '用向量加走一遍分配：100 万个元素、每块 256 个线程，需要 3907 个块。运行时把这些块分发到各个 SM 上（每卡 SM 数量从几十到上百不等，随型号而定），SM 忙完一个块就领下一个——天然的负载均衡，不需要软件调度。块大小的选择是一笔多方账：太小，块内可协作的线程少、启动与同步的固定开销占比高；太大，单个块占的寄存器与共享内存多，一个 SM 同时只能驻留一两个块，某个块卡在同步或访存上时替补不足。

    还有一条硬约束：块内线程能用屏障（barrier）同步并共享数据，块间不能——所以算法要先想清楚「哪些协作必须发生在块内」，再按这个边界切分任务。矩阵乘法的 tiling 正是按块切的：一个块负责一块输出，块内线程合搬数据、合算结果。'
  derivation: original
  sources:
