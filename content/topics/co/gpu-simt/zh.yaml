  - id: when-not
    title: 边界：过不了这三关，别硬把活扔给 GPU
    tldr: 数据跨总线搬进显存、每次启动核函数都有固定门票费；活太小、每字节算得太少，或者是一环咬一环的串行链，[[GPU]] 的吞吐优势连门票钱都赚不回来。
    body: |-
      先算第一笔门票钱：跨总线搬运。刚上场时数据通常躺在 [[CPU]] 主机内存里，搬到 GPU 显存要过 [[PCIe]] 或 [[NVLink]]，算完还要再搬回来。如果你只是想做一遍简单的「每个数加 1」，每搬进搬出 8 字节才做 1 次浮点加法（[[算术强度]]只有 0.125），花在来回搬运上的时间远超计算本身——这种活留在 CPU 上用向量指令（[[SIMD]]）原地一扫反而更快。GPU 划算的前提，要么算得够重，要么数据搬上去后能长期驻留反复算（比如大模型训练时参数和梯度全留在显存里）。

      再算第二笔门票钱：每次启动 [[kernel]] 以及主机和设备同步，都要付微秒级的固定启动开销（随平台和驱动而异）。如果你把一段计算拆成几百个几微秒就跑完的迷你核函数，CPU 光喊「开始」的嘴皮子功夫就比干活还长——工程上用「算子融合」把十几个碎步拧成一个大核函数，或者用 [[CUDA Graph]] 把一整串发射预先录好打包下发，都是在省这笔启动税。

      最后过一关硬件死穴：凡是一环扣一环、下一拍必须等上一拍算完的单条依赖链，再塞几千个线程也只能排队看戏，老老实实交给单核跑得飞快的 CPU。上 GPU 前先过完下面三关（见图）：并行量够不够大、算术强度够不够高、数据能不能留在显存里反复用——只要有一关不过，就别硬上。
    derivation: original
    sources:
      - ref: nvidia-cuda
        locator: Programming Model（异构系统与主机/设备分工）
