- id: latency-hiding
  title: 延迟隐藏：人多就不怕排队
  tldr: warp 等内存时 SM 立刻换另一个 warp 继续发指令——用并发量把延迟盖住，这是 occupancy 的意义。
  body: 'CPU 掩盖内存延迟靠缓存与乱序；GPU 靠的是「备选 warp 足够多」：一个 SM 同时驻留多个 warp，当前 warp 发出访存、要等几百个周期时，调度器零成本切到另一个就绪 warp。所以 GPU 程序要提供足够多的并行工作（占用率 occupancy：驻留 warp 数与硬件上限之比）。

    反过来，寄存器用太多、块太大都会压低驻留量，延迟没人掩盖，性能断崖。这也是为什么「GPU 没跑满」常见原因是并行度不足，而不是单条指令慢。

    延迟隐藏可以粗算一笔账：设一次全局内存访问的延迟是几百个周期量级，而一个 warp 每次访存之间只有十几到几十条计算指令，那么要让流水线不断粮，每个 SM 需要在任意时刻备好「延迟 ÷ 指令间隔」量级的 warp 数——这就是占用率（occupancy）背后的乘法。占用率上不去的三个常见元凶：每线程寄存器用太多（驻留线程数被寄存器总量卡住）、每块共享内存申请太多（驻留块数被共享内存总量卡住）、块的线程数太少（ warp 配额没吃满）。注意占用率不是越高越好：有时故意降低占用率、让每个线程用更多寄存器把数据留在手边，总账反而更划算——它是个可调的旋钮，不是 KPI。'
  derivation: original
