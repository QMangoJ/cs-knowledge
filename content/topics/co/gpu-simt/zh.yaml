- id: when-not
  title: 边界：什么时候不该上 GPU
  tldr: 数据搬运与启动都有固定成本，活太小或太串行时，GPU 的吞吐优势连成本都挣不回来。
  body: '先算搬运账：数据默认在主机内存里，算之前要经 PCIe/NVLink 拷进显存、算完再拷回来。若计算本身只做一遍简单的逐元素操作（算术强度接近 1），搬运时间会超过计算时间——这类负载留在 CPU 上用向量指令跑反而更快，或者至少要把数据长期驻留在显存里连续用（训练时数据与参数常驻就是这个道理）。

    再算启动与同步账：每次启动 kernel、每次主机与设备同步都有微秒量级的固定开销（数量级随平台而异）；把一串小操作拆成几百个小 kernel，固定开销会超过计算本身——这正是「算子融合」与 CUDA Graph 这类技术存在的理由：把碎活并成大活。最后是串行账：单条依赖链（每步等上一步结果）上，GPU 的几千个线程帮不上任何忙，延迟由单线程速度决定，CPU 全面胜出。判断口诀：先看并行量、再看算术强度、最后看这批数据能在显存里被复用多少轮。'
