  - id: latency-hiding
    title: 延迟隐藏：用等显存的空档，零成本切别的 warp 来算
    tldr: 去一趟全局显存要等几百个周期，[[GPU]] 不靠大缓存缩短这趟路，而是把几十组 [[warp]] 的寄存器全留在芯片上——一组刚发完访存要干等，调度器立刻零成本换另一组上来算。
    body: |-
      就算把 32 个请求完美合并成 1 次事务，物理距离摆在那里，数据从 [[HBM]] 走一趟回芯片依然要几百个周期。[[CPU]] 遇到几百个周期的等数据，全靠大缓存尽量命中，或者靠乱序执行在后面翻找不相干的指令先跑；GPU 的每个线程既没有大缓存也没配乱序窗口，它用一招更直接的办法：**靠人多轮流填坑**。每颗 [[SM]] 上同时住着几十个已经就绪的 warp，并且它们所有的寄存器状态常驻片上、不用往内存保存恢复——warp A 刚喊一声「去显存取数」要等 400 个周期，调度器下一拍就零成本切到 warp B 执行，再切 warp C，等转了一圈回来，warp A 的数据刚好到货。

      把这笔账算成数字，你就看懂了**占用率**（[[occupancy]]，实际驻留的 warp 数占 SM 上限的比例）是怎么来的。假设去显存等一趟要 400 个周期，而一个 warp 两次访存之间只有 10 条计算指令可跑：如果 SM 上只驻留 1 个 warp，算 10 拍闲 400 拍，算力利用率只有 `2.4%`；要想让计算单元一直不断粮，手头起码得备着 `400 ÷ 10 = 40` 个轮换的 warp，前 39 个依次上场刚好把这 400 个周期的空档铺满。

      常有人卡在这里问：那是不是占用率越高越好，恨不得凑满 `100%`？还真不是！前面第 4 步讲过资源三角——每线程寄存器要太多、每块共享内存申请太大、或者块尺寸太小，都会把占用率往下压；可有时程序员**故意**给每个线程多留些寄存器、把占用率从 `100%` 降到 `50%`，是为了让每个线程把中间结果死死攥在手边、少跑两趟全局显存，算下来总时间反而更快。记住：延迟不是被消灭的，是被别人干活盖住的；占用率是帮你盖住延迟的旋钮，不是越高越好的 KPI。
    derivation: original
    sources:
