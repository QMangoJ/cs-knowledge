- id: coalescing
  title: 合并访存：排队买票 vs 一人一窗口
  tldr: warp 内相邻线程访问相邻地址时，硬件把访问合并成少数几次事务；地址乱跳则每次都单开一趟。
  body: 'warp 一次访存指令要取 32 个线程的地址。硬件按内存事务（一段连续地址）来服务：如果 32 个地址落在少数几个连续段里，只需少数几次事务；如果地址散落在 32 个不同段，就要 32 趟——带宽利用率相差一个数量级。

    这就是「合并访存」（coalesced access）：让线程 i 访问基址 + i 附近的数据。转置、洗牌类操作在 GPU 上慢，十有八九是访存不合并或共享内存 bank 冲突，而不是算力不够。

    把合并访存换算成数字：一个 warp 读 32 个 float（每个 4 字节）。若地址连续，总共 128 字节，落在 1–2 个内存事务里取完；若每个线程跨步 32 个 float（比如按列读一个行宽 32 的矩阵），32 个地址彼此相距 128 字节，散落在 32 个不同的事务段里，要 32 趟才取完——同样是「读 128 字节有用数据」，总线上传输量与趟数相差一个数量级。所以判断 GPU 代码快慢有个优先顺序：先看访存合不合并、再看有没有 bank 冲突、最后才看算术指令本身。很多「计算密集」的 kernel 实测慢，查下来都是第一关没过。'
