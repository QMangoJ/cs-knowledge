- id: memory
  title: 显存层级：远近决定速度
  tldr: 寄存器最快，共享内存是片上的「工作台」，全局显存（HBM）容量大但每趟访问都贵。
  body: 'GPU 的存储层级和 CPU 像亲戚但性格不同：每线程的寄存器最快；共享内存（shared memory）在芯片上、由同一个线程块的线程协作读写，像一块手动管理的草稿纸，速度接近寄存器量级；全局显存（显存颗粒，现代卡用 HBM）容量几十 GB、带宽极高（靠位宽堆出来），但单个 warp 的访问延迟仍然很长，要靠大量 warp 轮换来掩盖。

    关键区别：CPU 靠大缓存自动伺候局部性，GPU 把「把数据搬到片上反复用」这件事交给程序员（或库）显式安排——矩阵乘法 tiling 就是把块搬进共享内存反复用的典型。

    共享内存再补两个关键性质。其一，它的组织方式是 32 个 bank（存储体），按 4 字节字交错编址：同一 warp 的 32 个线程若各访问不同 bank 的字，可以一次并行完成；若多个线程撞进同一个 bank 的不同地址，就要排队串行，这叫 bank 冲突（下一步专门走例）。其二，寄存器也不是无限的：每个线程用得越多，SM 能同时驻留的线程就越少，寄存器不够时编译器会把变量「溢出」（spill）到本地内存——名字叫本地，其实是显存里的一段，速度按显存算账。于是 GPU 编程有一条贯穿性的资源观：寄存器、共享内存、驻留线程数是一个三角，优化常是在三者之间挪预算。'
  derivation: original
  sources:
