  - id: tiling-walk
    title: 矩阵分块（tiling）：数据搬进共享内存，复用次数翻 16 倍
    tldr: 不分块直接算矩阵乘时，同一行同一列会被 16 个线程从显存里重复读 16 遍；分块（tiling）让一个线程块先把 16×16 小块合搬进片上共享内存再各自点乘，全局访存量直接压到 1/16。
    body: |-
      切到主线的第二场重头戏：算矩阵乘法 `C = A × B`。我们用一块 `16 × 16 = 256` 线程的线程块，专门负责算出结果矩阵 `C` 里一个 `16 × 16` 的小方块。如果傻算——每个线程算自己对应的一个格子 `C[r][c]`，每次都自己去全局显存（[[HBM]]）读一整行 `A` 和一整列 `B`——算一下重复浪费有多惊人：第 0 行的 16 个线程要的是 `A` 的**同一行**，结果这行数据被从大老远的显存里硬生生读了 **16 遍**；`B` 的每一列同样被读了 16 遍！

      分块（tiling）把这 256 个线程拧成一股绳，沿矩阵公共边一截一截往前滚，每截只干两步：
      第一，**协作搬运**：256 个线程分工合作，每人只从全局显存搬 `A` 的 1 个元素和 `B` 的 1 个元素，凑成两张 `16 × 16` 的小方块贴进片上共享内存，然后全块在屏障处等齐。
      第二，**协作点乘**：数据已经在贴身的共享内存里了，每个线程自己从上面取那 16 对数字乘加累加起来；算完后再等齐，一起去全局显存搬下一截 `16 × 16` 小块盖上去。

      算总账：刚才搬进共享内存的每一个 `float`，在这截里被 16 个点积整整复用了 **16 次**！整场矩阵乘法下来，跑全局显存的次数直接砍成原来的 **1/16**（要是换成 `32 × 32` 的块、再叠加上寄存器里的微块复用，减免倍数还能随块边长继续涨）。今天 [[cuBLAS]] 这类高性能矩阵库能把显卡算力榨到九成以上，骨架正是这套「把大块切小块、搬上芯片反复吃」的技巧。
    derivation: original
    sources:
      - ref: nvidia-cuda
        locator: Shared Memory 与矩阵乘法示例（Programming Guide）
        claim: 用共享内存缓存子块可显著提高矩阵乘法的全局内存访问效率
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
    canvas:
