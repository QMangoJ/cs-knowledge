- id: bank-conflict
  title: 共享内存的暗坑：bank 冲突
  tldr: 32 个 bank 按字交错编址；warp 内多个线程访问同一 bank 的不同地址时，访问被串行化。
  body: '共享内存被分成 32 个 bank，相邻的 4 字节字依次落在相邻 bank 里（字地址 mod 32 = bank 号）。硬件一次可以并行服务「32 个线程各访问不同 bank」的请求；若其中 k 个线程访问的是同一个 bank 的不同字地址，这 k 个请求要分 k 趟串行完成，这就是 bank 冲突。注意例外：多个线程读同一个地址时走广播，不冲突——冲突的定义是同 bank、不同地址。

    经典翻车现场是转置与按列访问：线程 i 读子块的第 i 列元素，地址步长恰好是行宽（若行宽是 32 的倍数，步长落回同一个 bank），32 个线程全撞一个 bank，共享内存的速度直接掉 32 倍。修法也经典：给子块每行多垫一个元素（padding），让列方向的地址错开一个 bank，冲突立刻消失。这类「加一列废数据换 32 倍速度」的技巧，是 GPU 性能调优里最能体现「懂硬件结构」的例子。'
  derivation: original
  sources:
  - ref: nvidia-cuda
    locator: Shared Memory 一节（bank 组织与冲突）
    claim: 共享内存按 4 字节字交错映射到 32 个 bank，同 bank 不同地址的并发访问会串行化
