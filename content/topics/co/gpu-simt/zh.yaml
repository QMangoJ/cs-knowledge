  - id: block-grid
    title: 线程层次：网格拆成块，块进 SM 领活干
    tldr: 启动核函数时，百万级任务被切成几千个线程块组成网格，硬件按「块」把活发给各颗 [[SM]]；块内线程能共享内存、设路障等齐，块与块之间彻底独立。
    body: |-
      把第 2 步提过的层级放回一百万个元素的向量加法里跑一遍分配：如果选定每块 256 个线程，就需要 `ceil(1,000,000 / 256) = 3907` 个块，合起来铺成一张网格（grid）。显卡上通常有几十到上百颗 [[SM]]，运行时调度器按「块」往空闲的 SM 上发活：每颗 SM 吃完手里这个块（里面的 8 个 warp 轮换着跑完），就立刻顺手领下一个未开张的块。同一套代码放到 40 核的消费卡和 132 核的数据中心卡上不用改一行，硬件自动把 3907 个块平摊完。

      既然块这么好用，块里放 32 个线程还是 1024 个线程有讲究吗？两头都有坑：块太小（比如只放 32 个线程 = 1 个 warp），除了几乎找不到同伙共享数据，还会撞上每颗 SM 允许同时挂靠的「最大块数」上限——好比一家店最多同时开 16 张桌，每桌只坐 1 个 warp，店里最多只能进来 `16 × 32 = 512` 人，大片算力空着；块太大（比如顶格放 1024 个线程 = 32 个 warp），这一个巨无霸块就能把 SM 的寄存器或共享内存占去大半甚至占满，一旦块内所有线程停在同步点等齐，SM 手头连第二个能切上去替补的块都没有。工程上常用 128 或 256，正是卡在中间的甜区。

      最后记牢一条硬边界：只有**同一个块内**的线程保证同时住在一颗 SM 上，所以能通过片上共享内存传纸条、用屏障（barrier）等齐；**不同块之间**谁先跑谁后跑全无保证（第 3000 块完全可能等第 0 块退场才上台），绝对不能互相等待。写并行算法时，先想清楚「哪些人必须握手协作」，就把他们切进同一个块——下一步矩阵乘法分块就是这么切的。
    derivation: original
    sources:
      - ref: nvidia-cuda
        locator: Thread Hierarchy / Programming Model 一节
