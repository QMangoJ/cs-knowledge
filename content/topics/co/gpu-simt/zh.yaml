  - id: ai-link
    title: 落回 AI 计算：算力卡在哪，带宽卡在哪，四问带走
    tldr: "[[Transformer]] 预填充把整批词拼成大矩阵乘法，权重复用极高，卡在算力上限；逐 [[token]] 生成时矩阵退化成向量乘，权重过一遍只用一次，天花板掉回显存带宽。"
    body: |-
      拿今天最火的大模型推理收个口，前面十步的拼图就全严丝合缝了。[[Transformer]] 的主力计算是权重矩阵乘输入矩阵：训练或提示词一次吃进去几千个词的预填充阶段（[[prefill]]），成万个输出元素互不依赖（海量并行），再配合第 8 步的分块搬运，一个权重从 [[HBM]] 搬上片上能被整批输入反复复用几十上百次。这时算术强度高，芯片上的算术单元吃得饱饱的，速度卡在理论算力上限（**compute-bound**，算力瓶颈）。

      可一旦切进一个词一个词往外蹦的解码阶段（[[decode]]），如果每次只服务 1 条请求（`batch = 1`），输入从大矩阵塌缩成一根孤零零的向量，矩阵乘矩阵退化成矩阵乘向量！每吐出 1 个 [[token]]，都要把好几个 GB 的模型权重从慢吞吞的全局显存整个搬过来一遍，可每个权重只参与了 **1 次**乘加就算完了——算术强度一下跌回个位数，算术单元九成时间在干等显存送货，瓶颈彻底掉成**显存带宽瓶颈**（memory-bound）。这就是用 [[roofline]] 模型看一切推理优化的底层尺子：把 `batch` 凑大就是为了把单次搬来的权重多喂几个请求复用，把算术强度重新拉高。

      全课收成一张带得走的**「GPU 性能四问口诀」**，以后读 profiler 或写核函数按顺序问就行：
      ① **形状对不对**——能拆成海量独立小份再上 GPU，单条依赖链留给 CPU；
      ② **同束齐不齐**——同个 warp 32 个线程尽量走一条路，条件判断往束外挪；
      ③ **搬运省不省**——全局读要连续合并，片上复用靠 tiling + 垫 1 列防 bank 冲突，备足轮换 warp 盖住延迟；
      ④ **瓶颈在哪头**——算术强度高（算力瓶颈）去找更快核心或融合算子，算术强度低（带宽瓶颈）就做权重量化或加大 batch。
    derivation: original
    sources:
      - ref: nvidia-cuda
