steps:
- id: why
  title: 为什么需要另一种架构
  tldr: 训练与推理的计算是「同一操作 × 海量数据」，CPU 的大核 + 大缓存是错配的投资。
  body: 'CPU 把芯片面积花在：少数几个强力核心、深缓存层级、分支预测与乱序执行——目标是让单个线程尽快跑完。图形渲染与神经网络的负载恰好相反：同一个操作要作用在百万级数据元素上，元素之间大多独立。

    GPU 的取舍因此完全不同：成千上万个简单得多的执行单元、相对弱的单线程性能、用海量并发线程的总吞吐取胜。理解这个取舍，就理解了为什么矩阵乘法在 GPU 上快一两个数量级，而串行逻辑（比如逐 token 的调度代码）放 GPU 上毫无意义。

    再把账算细一点：CPU 的一颗大核要为一个线程准备分支预测器、乱序发射窗口、几十 MB 的缓存层级，目标是把单线程延迟压到最低；GPU 的一个 SM 把同样的晶体管预算换成更多的算术单元与寄存器堆，目标是单位时间吞吐的活最多。哪种投资对，取决于负载有没有「活」可并行：数据并行负载里独立元素以百万计时，GPU 的弱线程成群结队反而总产出更高；反过来，操作系统调度、编译器、解释器主循环这类分支密集、步步依赖的串行逻辑，元素之间没有并行可挖，GPU 的海量线程只能干瞪眼。这也是为什么异构系统是「CPU 管控制、GPU 管计算」的分工而不是谁取代谁。先问负载的形状、再选处理器，是这一课最实用的结论。'
  derivation: original
