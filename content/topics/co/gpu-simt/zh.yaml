  - id: bank-conflict
    title: 共享内存的暗坑：32 个存储体撞车（bank 冲突）
    tldr: 共享内存按每 4 字节轮流排进 32 个存储体，同一组 32 个线程一旦全撞进同一个存储体的不同地址，硬件只能排成一队跑 32 趟；给每行多垫 1 列空白，速度立刻翻回 32 倍。
    body: |-
      片上共享内存虽然快，底下也有一个物理规矩：它像超市里并排的 32 个收银口（0 到 31 号存储体，bank），把每 4 个字节的字按顺序轮流摆进去——第 0 个字进 0 号口，第 1 个字进 1 号口，数到第 31 个字进 31 号口，第 32 个字又绕回 0 号口（即 `字地址 mod 32 = 存储体编号`）。同一拍里每个收银口能独立结账一个人：只要一个 [[warp]] 的 32 个线程正好各占一个不同的口，1 趟就全取完。

      麻烦就出在多个线程撞进同一个收银口的不同货位，这叫 **bank 冲突**：如果有 `k` 个线程访问同一个存储体的不同字地址，硬件只能串行分 `k` 趟结账。（注意一个例外：如果 32 个线程要的恰好是**同一个地址**，硬件直接广播出去，1 趟搞定、不算冲突。）看看最经典的翻车现场——我们在共享内存里放了一张行宽 32 的 `float` 方块 `tile[32][32]`：按**行**读第 0 行 `tile[0][0..31]` 时，地址 `0..31` 刚好落在 0..31 号存储体，1 趟飞过；可一转成按**列**读第 0 列 `tile[0..31][0]`，相邻两格的地址差了整整 32，落到的地址是 `0, 32, 64, …, 992`——对 32 取模全都是 **0**！32 个线程死死挤在 0 号存储体门口排队，只能跑满 **32 趟**，片上高速内存的带宽瞬间跌成 1/32。

      解法简单到像个魔术：声明数组时把每行多垫 1 列空白，写成 `tile[32][33]`。这多出的 1 列废数据一塞进去，第 0 列的地址立刻错位成 `0, 33, 66, 99…`，对 32 取模正好变成 `0, 1, 2, 3…`，32 个线程重新分散进 32 个存储体，32 趟当场变回 1 趟！只牺牲约 3% 的片上空间换 32 倍读写速度，这就是摸透硬件脾气能省下的大钱。
    derivation: original
    sources:
      - ref: nvidia-cuda
        locator: Shared Memory 一节（bank 组织与冲突）
        claim: 共享内存按 4 字节字交错映射到 32 个 bank，同 bank 不同地址的并发访问会串行化
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
