  - id: coherence-vs-consistency
    title: 分清两层账：单个地址保最新，多个地址谁先被看见
    tldr: 缓存一致性（coherence）只保单个地址不会拿到过期的旧副本，内存一致性（consistency）才管多个地址之间的先后顺序；SB 实验里 `X` 和 `Y` 各自的值都没错，出事纯粹在顺序这一层。
    body: |-
      做到这里，不少人会猛地卡住：不是学过缓存一致性协议（比如 [[MESI]]）吗？它都保证各核缓存同步了，怎么还能跑出 `(0, 0)`？把两个极容易混的词拆开，谜团当场解开——多核共享内存其实有两层完全不同的规矩。

      第一层叫**缓存一致性**（coherence），它的眼睛里**只有单个地址**。比如单盯 `X` 这一个地址：任何时候只许一个核写入（或大家一起只读），谁写出了新版本，其他核缓存里的旧副本必须作废，保证没有核在已经更新之后还抱着过期副本不放——这是 [[MESI]] 协议打满分的地盘。第二层叫**内存一致性**（consistency），它盯着**多个不同地址之间**的先后关系：核 1 先改 `X` 再读 `Y`，在核 2 眼里到底能不能看着像先读了 `Y` 再落了 `X`？

      回到第 3 步算出的 `(0, 0)` 现场对一对账，你就彻底明白为什么两层互不替代。单看 `X` 自己：起初是 `0`，核 2 赶在核 1 的写缓冲排出去之前读到了 `0`，随后 `X` 落地变成 `1`——对 `X` 这一个地址来说，时间线完全合理、MESI 没犯任何错！单看 `Y` 自己也完全合理！真正被颠倒的，是 `X` 和 `Y` 这两个不同地址之间的跨核可见顺序。所以千万别拿「CPU 有 MESI」当借口去裸写无锁代码，MESI 只保单个门牌号不给过期货，跨门牌号的先后顺序得靠一致性模型来管。
    derivation: original
    sources:
      - ref: sorin-primer
        locator: 第 2 章（coherence 的单写多读不变量与数据值不变量）
        claim: coherence 按单个内存位置定义（单写多读不变量加数据值不变量），consistency 则定义全体读写在架构上可见的行为规则
        status: verified
