      - v: 读 X 得 r2=0
        mark: active
    - label: 内存
      cells:
      - v: X=0
      - v: Y=0
  log:
  - mode: 手算枚举
    event: 顺序一致六种交错只出 (0,1)、(1,0)、(1,1)
  - mode: 谜底
    event: 写缓冲未排空时两读越过两写，(0,0) 成立
  code:
    lang: text
    code: |-
      初始： X = 0, Y = 0
      核 1： 写 X=1;  r1 = 读 Y
      核 2： 写 Y=1;  r2 = 读 X
      问： (r1, r2) 能不能是 (0, 0)？
    note: SB（store buffering）litmus 测试
- id: coherence-vs-consistency
  title: 分清两件事：一个地址的新旧，多个地址的先后
  tldr: cache 课的 MESI 只管一个地址不读到旧副本；本课的一致性管的是不同地址的写谁先被看见，两件事别混。
  body: 先把两个容易混的词拆开，就像一家书店要同时答好两个问题，某本书的库存数字准不准，和新书上架的先后顺序算不算数，前者错一位就是事故，后者乱一点却要看店规怎么定。缓存一致性（coherence）管前者，只盯单个地址，保证任何核读某个地址时，读到的是这个地址最新一次写的值，不会有人抱着过期副本过日子，cache 课的 MESI 协议干的正是这件事，用单写多读的不变量围住一个地址的所有副本。内存一致性（consistency）管后者，盯的是多个地址之间，一批写以什么顺序被其他核看见、读和写之间能不能互相越位。SB 实验是最好的分界标本，里面 X、Y 各自的值从头到尾都没错位，没有任何一个核读到某个地址的旧副本，一致性协议可以打满分，出问题的纯粹是顺序，两个写谁先被对方看见。把这两层混为一谈，就会得出「我有 MESI 所以并发没问题」的错误结论，MESI 解决的是副本问题，顺序问题要靠接下来几步讲的一致性模型这张合同来管，两层各有各的机制、各有各的账。
  derivation: original
  sources:
  - ref: sorin-primer
    locator: 第 2 章（coherence 的单写多读不变量与数据值不变量）
    claim: coherence 按单个内存位置定义（单写多读不变量加数据值不变量），consistency 则定义全体读写在架构上可见的行为规则
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
  canvas:
    kind: datastate
    structure: array
    caption: SB 里值全对、顺序出错——那是 consistency 的地盘
    rows:
    - label: coherence 管
      cells:
      - v: 单个地址
      - v: 副本不许过期
        mark: found
    - label: consistency 管
      cells:
      - v: 多个地址
      - v: 先后顺序
        mark: active
  log:
  - mode: 分工
    event: MESI 满分运行，SB 照样能出 (0,0)
- id: sequential-consistency
  title: 顺序一致：最合直觉的那张合同
  tldr: 所有核的读写排成一条全队、每核内部不许插队，这叫顺序一致（SC）——好懂，但要全场为它付延迟。
  body: 顺序一致（sequential consistency，简称 SC）是 Lamport 在 1979 年给出的定义，说成人话只有两条，第一，所有核的读写能排成一条全世界公认的单一队列，第二，每个核自己的操作在队列里保持它写代码时的先后，也就是程序顺序不许变。在这张合同下，多核程序的心智模型退化成单核轮流跑，一会儿这个核走一步、一会儿那个核走一步，交错可以任意选，但每一步都立即对所有人可见，SB 的六种交错正是按这张合同算的，结论干净利落。当年它会被立为标杆，是因为这是唯一不需要培训就能推理的模型，程序员脑子里那台单核机器直接平移过来。代价也正卡在「立即可见」四个字上，实现它就要拆掉或管住写缓冲这类优化，写必须等对全局生效才能算完，读也不许越过前面的写抢跑，访存延迟全部裸露在流水线面前。所以真实硬件几乎没有谁全程兑现 SC，它更像一把标尺，先量出直觉应该长什么样，再看每个真实模型到底在哪几处打了折、打折换回多少性能。
  derivation: original
  sources:
  - ref: sorin-primer
    locator: 第 3 章（顺序一致的定义与实现代价）
    claim: 顺序一致要求执行结果等价于所有核的操作按某种保持各核程序顺序的全序交错执行，实现它限制写缓冲等优化
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
  canvas:
    kind: datastate
    structure: array
    caption: SC 把所有核的操作串成一条人人认账的队
    rows:
    - label: 全局队列
      cells:
      - v: 核1 写 X=1
      - v: 核2 写 Y=1
      - v: 核1 读 Y 得 1
      - v: 核2 读 X 得 1
  log:
  - mode: SC
    event: 全序加程序顺序，结果只能是三种之一
  - mode: 代价
    event: 每步立即全局可见，优化空间被锁死
- id: tso
  title: x86-TSO：只在一处打折的合同
  tldr: x86 只放松写后读一种顺序，其余全保住，所以它既能出 SB 的 (0,0)，平时又乖得让人忘了内存模型这回事。
  body: 从 SC 往性能走一步，就是 x86 用的 TSO（total store order，全局写序）。它的规则可以用写缓冲一句话讲完，每个核带一个先进先出的写缓冲，写进缓冲后按排队顺序依次对全局生效，读先查自己的缓冲有没有同地址的新值、没有才去内存，其余一律不许乱。把四种相邻顺序逐个过堂，写后写不许乱，因为队列先进先出；读后读、读后写不许乱，因为读都是当场完成的；唯独写后读可以乱，读不必等排在前面的写落地。于是 TSO 与 SC 的全部差别就浓缩在 SB 一道题上，x86 能跑出 (0,0)，而需要「先写数据再写标志、对方见标志必见数据」的发布模式在 x86 上天然成立，一道屏障都不用加。这也解释了服务器代码在 x86 上的体感，明明合同打了折，日常却几乎撞不上，因为绝大多数同步套路只用到被保住的那三种顺序，被放松的写后读只在 SB 这类双向互相等待的写法里才咬人。记住定位，TSO 是强模型，它的乖是相对于 ARM 这类弱模型而言的，不是说 x86 上可以不加锁乱写并发代码。
  derivation: original
  sources:
  - ref: x86-tso
    locator: 摘要与模型定义一节（CACM 53(7), 2010）
    claim: x86-TSO 以每核 FIFO 写缓冲刻画 x86 多处理器，唯一放松的是读越过缓冲中的写，其余顺序均保留
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
  canvas:
    kind: datastate
    structure: array
    caption: 四种顺序里 TSO 只放松写后读一种
    rows:
    - label: 保住的顺序
      cells:
      - v: 写→写 保序
        mark: found
      - v: 读→读 保序
        mark: found
      - v: 读→写 保序
        mark: found
    - label: 放松的顺序
      cells:
      - v: 写→读 可越过
        mark: active
  log:
  - mode: TSO
    event: SB 能出 (0,0)，其余乱序罕见
  - mode: 体感
    event: 常见同步套路在 x86 上天然成立
- id: weak-models
  title: 弱模型：ARM 为什么更容易翻车
  tldr: ARM 这类弱模型把写写、读写也放开换性能与省电，同一份在 x86 上跑得好的代码，搬过去可能当场出错。
  body: 再往性能与省电的方向走，合同就更松了，ARM 采用的弱序模型（weak ordering）大致是说，对普通内存的读写，除非有数据依赖或明确的屏障，硬件可以按它方便的顺序让操作被别的核看见。逐项对照 TSO，被多放开的主要是两类，写后写可以乱序生效，后发出的写可能先被看见；读也可以乱序，后面的读可能先于前面的读完成，另外写后读同样可以乱。为什么敢放这么开，一是移动设备先要省电，强迫全局保序意味着缓存与互连要做更多协调与等待，电费直接写在账上；二是核数越堆越多时，协调成本涨得比算力还快，放松顺序是少数能保住扩展性的路。后果落在程序员头上，一份无锁代码在 x86 服务器上测了一年都没事，搬到 ARM 手机或 ARM 服务器上却偶尔读到「标志已置位、数据还是旧的」，因为发布模式里那道写写顺序在 x86 上是白送的、在 ARM 上要自己掏钱。这类 bug 的典型面貌是低概率、只在特定硬件上复现、加打印就消失，所以弱模型下更不能靠测试证明并发正确，只能靠按合同推理。
  derivation: original
  sources:
  - ref: arm-ordering
    locator: 弱序模型与 DMB 屏障一节
    claim: ARMv8 对普通内存采用弱序模型，读写可被其他观察者以不同于程序顺序的次序看到，需用屏障恢复顺序
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
  - ref: sorin-primer
    locator: 第 4 章（宽松一致性模型谱系）
    claim: 宽松模型通过放松写读、写写等顺序换取性能，模型越松硬件实现越自由、编程越难
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
  canvas:
    kind: datastate
    structure: array
    caption: 弱模型放开的顺序更多，翻车点也更多
    rows:
    - label: x86-TSO
      cells:
      - v: 只放松 写→读
    - label: ARM 弱序
      cells:
      - v: 放松 写→读
        mark: active
      - v: 放松 写→写
        mark: active
      - v: 放松 读→读
        mark: active
  log:
  - mode: 弱序
    event: 顺序要靠依赖与屏障显式声明
  - mode: 风险
    event: x86 上白送的写写顺序在 ARM 上缺席
- id: fences
  title: 内存屏障：把顺序按需买回来
  tldr: 屏障（fence）就是插在代码里的一道栅栏，它之前的访存必须先被看见，之后的才许开始——顺序回来了，停顿也回来了。
  body: 买顺序的工具叫内存屏障（memory fence，也叫 barrier），生活里像机场安检口的一条黄线，前一批人全过完，后一批才许往前走。它的语义按方向分，全屏障最强，前面的读写全部对全局生效后，后面的读写才许被看见；写屏障（store fence）只管写与写、以及写先于后面的操作生效这类写侧次序，读屏障同理只管读侧，方向越窄、代价越小，所以买的时候要先想清楚自己缺的到底是哪一种顺序。走一遍 SB 的修复，在两个核的写与读之间各插一道全屏障，写的落地被屏障顶到读之前，执行被迫回到那六种合法交错里，(0,0) 就此绝迹，这正是上一课的怪象在工程上的标准解法。代价要当场算清，屏障通常意味着把写缓冲排空、等一致性流量走完，流水线要在原地等上几十到上百个周期量级，本该被延迟掩盖的等待全额兑现。所以屏障的正确用法从来不是逢并发就撒，而是只在跨核交接的那几个点位精确投放，放多了程序慢，放错了位置则等于没放。下手前先想清自己缺的到底是哪一种顺序，再估这道屏障在目标硬件上要等多久，两笔账都算清才放行。
  derivation: original
  sources:
  - ref: x86-tso
    locator: MFENCE 一节（屏障语义）
    claim: x86 的 MFENCE 要求执行前本核写缓冲必须排空，从而恢复写后读的顺序
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
  - ref: arm-ordering
    locator: DMB 指令一节
    claim: ARM 的 DMB 保证屏障之前的访存先于之后的访存被观察者看到，可按读写方向限定范围
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
  canvas:
    kind: datastate
    structure: array
    caption: 写与读之间插一道屏障，(0,0) 被挡在门外
    rows:
    - label: 核 1
      cells:
      - v: 写 X=1
      - v: 屏障（排空缓冲）
        mark: active
      - v: 读 Y
    - label: 结果
      cells:
      - v: 回到六种合法交错
        mark: found
      - v: (0,0) 消失
        mark: found
  log:
  - mode: 屏障
    event: 前面的写全部生效，后面的读才许开始
  - mode: 代价
    event: 排空写缓冲，流水线停顿等待
- id: language-level
  title: 语言层合同：happens-before 与 DRF
  tldr: 程序员不直接对着硬件编程，Java 这类语言用 happens-before 立约，你同步做对了，它就保证你眼里只有顺序一致。
  body: 硬件合同再清楚，让每个应用工程师都对着 TSO 与弱模型写代码也不现实，于是语言再往上立一层约，Java 内存模型（JLS 第 17 章）是代表作。核心词先拆开，happens-before 直译是「先行发生」，它是一条可见性承诺，若动作甲 happens-before 动作乙，乙就保证能看见甲以及甲之前的一切修改，链条还能传递，甲先于乙、乙先于丙，甲就先于丙。建立这条链的钉子都是日常工具，同一把锁的解锁先于后续加锁，对 volatile 变量的写先于后续对它的读，线程 start 与 join 也各钉一条。合同的正文叫 DRF 保证，DRF 是 data-race-free 的缩写，一个程序若在顺序一致的跑法下不存在数据竞争（竞争指两个线程同碰一个变量、至少一个是写、又没有 happens-before 链把它们串起来），语言就保证它在真实硬件上的所有跑法都等价于顺序一致。用 SB 验收这份合同，普通变量版里两对读写全无 happens-before 链，是有竞争的程序，(0,0) 合法出现、语言不赔；把 X、Y 换成 volatile 后，写读之间钉上了链，(0,0) 被合同禁止。
  derivation: original
  sources:
  - ref: jls-ch17
    locator: §17.4.5 happens-before 顺序与 §17.4 内存模型
    claim: JLS 第 17 章以 happens-before 定义可见性，正确同步（无数据竞争）的程序只表现出顺序一致的行为
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
  canvas:
    kind: datastate
    structure: array
    caption: 有没有 happens-before 这条链，决定合同赔不赔
    rows:
    - label: 普通变量 SB
      cells:
      - v: 无链相连
        mark: active
      - v: 有竞争，(0,0) 合法
    - label: volatile 版
      cells:
      - v: 写 →hb 读
        mark: found
      - v: 无竞争，等价于 SC
        mark: found
  log:
  - mode: 语言层
    event: happens-before 是程序员与运行时之间的合同语言
  - mode: DRF
    event: 无竞争换顺序一致，有竞争概不负责
- id: lesson
  title: 工程纪律：不赌硬件的脾气
  tldr: 只信锁与原子类库写进文档的保证，不信「在我机器上跑着没事」——硬件的宽容不是合同，换个平台就作废。
  body: 把全课收成可执行的纪律。第一，只用 os/lock 一课那套同步工具给的保证编程，加锁解锁、volatile、原子变量在语言规范里钉死了什么顺序，你就只依赖什么顺序，凡是规范没写的可见性，一律当它不存在。第二，永远不赌硬件脾气，x86 的 TSO 白送写写顺序，不等于你的程序拥有写写顺序，在开发机上没出错只说明这台机器这批时序没撞上，代码评审里「测过了」不能替代按合同的心算。第三，需要跨核交接数据时走发布与订阅的固定套路，数据先写好、再用带 release 语义的写置标志，读侧用 acquire 语义读标志，顺序由这对原语买齐，不自己裸奔拼屏障，除非你在写运行时本身。第四，遇到疑似顺序 bug，先把它缩成 SB 这样的 litmus 小标本再推理，六种交错手算得完的规模，才谈得上证明对错。这四条背后是同一句话，内存一致性模型不是考试名词，而是并发代码的交通法规，硬件可以宽容，法规只认合同，按合同开车的人换哪台机器都不翻车。
  derivation: original
  sources:
  - ref: sorin-primer
    locator: 第 8 章（程序员视角的一致性与同步纪律）
    claim: 一致性模型是硬件与软件之间的合同，程序应只依赖模型与同步原语明确给出的顺序保证
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
  - ref: jls-ch17
    locator: §17.4 内存模型（正确同步程序的定义）
    claim: 语言以正确同步为界给程序员提供可推理的保证，未同步的共享访问不在保证范围内
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
  canvas:
    kind: datastate
    structure: array
    caption: 纪律清单：只认合同，不认运气
    rows:
    - label: 靠得住的
      cells:
      - v: 锁与原子的文档保证
        mark: found
      - v: happens-before 链
        mark: found
    - label: 靠不住的
      cells:
      - v: 某台机器的宽容
        mark: active
      - v: 测过没出错
        mark: active
  log:
  - mode: 纪律
    event: 按合同编程，换平台不翻车
