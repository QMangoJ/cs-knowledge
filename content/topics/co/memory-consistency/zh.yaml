      rows:
        - label: coherence 管
          cells:
            - v: 单个地址
            - v: 副本不许过期
              mark: found
        - label: consistency 管
          cells:
            - v: 多个地址
            - v: 先后顺序
              mark: active
    log:
      - mode: 分工
        event: MESI 正常工作时，SB 仍然能出现 (0,0)
  - id: sequential-consistency
    title: 顺序一致（SC）：好推理到像单核，可性能代价太贵
    tldr: 顺序一致（[[SC]]）要求所有核的读写能排成一条人人认账的全局单队，且各核自己的代码顺序一点不许乱；它完全贴合单核直觉，但逼着硬件废掉写缓冲等提速手段，日常芯片根本扛不住。
    body: |-
      既然知道顺序乱在写缓冲，那先立一把最严、最贴合直觉的标尺——1979 年计算机科学家 Lamport 给出的**顺序一致**（Sequential Consistency，简称 [[SC]]）。翻译成大白话只有两条硬规定：
      第一，多核的所有读写操作，必须能排进**同一条全世界公认的单一队列**里（好像内存门口每次只放一个人进去读或写）；
      第二，在这条总队列里，每个核自己那几条操作的先后，必须跟代码从上到下写的顺序一模一样（守住**程序顺序**）。

      在这张合同底下，多核程序的心智瞬间变回单核轮流切换：核 1 走一步、核 2 走两步、核 1 再走一步，只要每一步当场生效给所有人看，第 3 步手算出的那 6 种交错就代表了全部可能，`(0, 0)` 绝不可能发生。不用额外培训，拿单核大脑直接写并发就能想对——这就是大家梦寐以求的标杆模型。

      那为什么市面上的主流 CPU 几乎都不全程兑现 [[SC]]？问题就卡在「每一步当场对所有人生效」上。要想全程保住 SC，硬件就不能让写入丢进写缓冲就当完成，必须原地等几百个周期把所有核的旧副本全部清干净，才敢放行下一条读指令；连乱序执行引擎提前偷看后面变量也全得卡死。为了给程序员省脑子而让每条访存都裸等延迟，性能亏得太大了，所以 SC 只做尺子，真实芯片纷纷往松的方向打折。
    derivation: original
    sources:
      - ref: sorin-primer
        locator: 第 3 章（顺序一致的定义与实现代价）
        claim: 顺序一致要求执行结果等价于所有核的操作按某种保持各核程序顺序的全序交错执行，实现它限制写缓冲等优化
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-13
    canvas:
      kind: datastate
      structure: array
      caption: SC 把所有核的操作串成一条人人认账的队
      rows:
        - label: 全局队列
          cells:
            - v: 核1 写 X=1
            - v: 核2 写 Y=1
            - v: 核1 读 Y 得 1
            - v: 核2 读 X 得 1
    log:
