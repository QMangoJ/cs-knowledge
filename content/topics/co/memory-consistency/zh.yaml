objectives:
  - 分清缓存一致性与内存一致性各自管什么、用一句话说清两者的分工
  - 用 SB 实验的交错枚举证明顺序一致下 (0,0) 不可能、有了写缓冲却可能
  - 说清 SC、x86-TSO 与 ARM 弱模型分别放松了哪几种读写顺序
  - 会用内存屏障与语言层同步把顺序按需买回来，并说清 DRF 承诺的内容
aiLink: 多线程推理服务、数据加载管线与 GPU 协作里的数据竞争同出一源，懂一致性模型才能判断一把锁或一个原子变量到底买到了什么保证，而不是靠「在我机器上没出错」猜对错。
design:
  - mechanism: 宽松内存模型：默认把读写顺序放开，只在程序员点名插屏障或用同步原语时才收紧。
    problem: 要是硬件强迫每写一个字节都立刻向全芯片广播并等所有核确认才肯往下跑，之前攒下的乱序执行和写缓冲收益全会被等待吃光，核心越多越慢。
    choice: 把「严格顺序」从默认免费赠品变成按需收费的商品：[[x86]] 只放开写后读一种顺序，[[ARM]] 放得更宽，真正要交接数据的地方由程序主动下屏障买顺序。
    tradeoff: 多核吞吐和省电效果大幅提升；代价是并发代码不再能按单核直觉推演，漏加同步在某个芯片上能正常跑一年，换个场景才偶尔炸一次。
    root: 可见性有物理代价：跨核心传递一次失效确认需要几十上百个周期，信号在芯片上跑的延迟压不下去，顺序就只能标价按需出售。
  - mechanism: 缓存一致性（coherence）和内存一致性（consistency）两层分工，各管一摊。
    problem: 多核共享内存同时纠缠着两件事——「某个地址的副本是不是最新」和「不同地址的写入谁先被看见」——搅在一起既说不清问题也造不出高效硬件。
    choice: 上下切开：一致性协议（如 [[MESI]]）死守单个地址的单写多读不变量，保住每个变量自己不出错；一致性模型专门定义跨多个地址之间的先后顺序合同。
    tradeoff: 每层都能独立设计和验证，可也带来了认识盲区——两层各自满分运行，依然能跑出 SB 的 `(0,0)`，必须同时看懂两层才解释得通。
    root: 局部性质和全局性质的差别：单个地址的副本新旧是局部账，全体读写操作排什么队是全局账，数学对象不同，本来就该分两套规矩管。
  - mechanism: 语言层立下 [[DRF]] 合同，用 [[happens-before]] 把硬件脾气挡在编译器门外。
    problem: 要每个写业务的工程师都背熟 x86、ARM 各自放开了哪几种乱序并手插汇编屏障，代码既写不对也没法跨平台移植。
    choice: 语言与程序员拉手立约：只要你用锁、[[volatile]] 或原子变量消掉数据竞争（串好 happens-before 链），编译器就在弱模型芯片上自动补齐屏障，还你顺序一致的简单世界。
    tradeoff: 代码好推理又能跨平台跑；代价是必须严守同步纪律（链断了语言立刻不赔），且编译器为兑现合同在弱模型芯片上塞的屏障会吃掉一点性能。
    root: 抽象分层的老规矩：离硬件最近的一层吸收硬件差异。语言运行时替程序员扛下各芯片的乱序脾气，把问题收敛成纯软件可判定的「有没有数据竞争」。
quiz:
  - q: SB 实验中 X=Y=0，核 1 写 X=1 后读 Y 得 r1，核 2 写 Y=1 后读 X 得 r2，顺序一致下哪种结果不可能？
    options:
      - (r1, r2) = (0, 1)
      - (r1, r2) = (1, 0)
      - (r1, r2) = (1, 1)
      - (r1, r2) = (0, 0)
    answer: 3
    explain: 顺序一致要求四个操作排成一个尊重各核程序顺序的全序，(0,0) 意味着两个读都排在对方写之前，与各自的写在读之前互相矛盾；六种合法交错只产出其余三种结果。
  - q: 缓存一致性（coherence）与内存一致性（consistency）的分工是？
    options:
      - 前者管性能，后者管正确性
      - 前者管单个地址的副本新旧，后者管多个地址之间的先后顺序
      - 前者是软件概念，后者是硬件概念
      - 两者是同一件事的两种叫法
    answer: 1
    explain: MESI 让单个地址不读到旧副本，但两个地址的写谁先被看见是另一层问题，SB 的 (0,0) 正是在一致性协议完美运行时出现的顺序问题。
  - q: x86-TSO 相比顺序一致，只放松了哪一种顺序？
    options:
      - 写后写（后面的写越过前面的写）
      - 读后读（后面的读越过前面的读）
      - 写后读（读越过还在写缓冲里排队的写）
      - 读后写（写越过前面的读）
    answer: 2
    explain: TSO 的写缓冲是先进先出的，写与写、读与读、读与写的顺序都保住，唯独读可以越过本核尚未落地的写，于是 SB 能出 (0,0)，其余乱序在 x86 上罕见。
  - q: 关于语言内存模型的 DRF 承诺，正确的说法是？
    options:
      - 只要用了多线程，语言就保证顺序一致
      - 程序没有数据竞争时，执行等价于顺序一致；有竞争则不在承诺内
      - volatile 能让有数据竞争的程序也变正确
      - DRF 是说硬件会自动修复程序员漏加的锁
    answer: 1
    explain: DRF 是有条件的合同，程序员用锁、volatile、原子变量建立 happens-before 顺序，语言才回赠顺序一致的心智模型，竞争访问的结果不作任何保证。
steps:
  - id: why
    title: 单核直觉为什么会失效：四行代码竟能同时读出 0
    tldr: 单核上刚写完一个变量马上读，一定拿到新值；可在多核上，两个核明明各自「先写后读」，却能双双读到对方修改前的旧值 0——不是内存坏了，而是写生效传给别人需要时间。
    body: |-
      先拿单核电脑的直觉打底。在只有一个核的机器上，你执行 `X = 1` 紧接着去读 `X`，100% 会读到 `1`：因为这一写一读走的是自家缓存的同一套入口，中间根本插不进第二双手。

      把场景切回多核，跑一遍我们主线的四行实验（初始 `X = 0, Y = 0`）：核 1 先执行 `写 X=1`，再执行 `r1 = 读 Y`；核 2 对称地先执行 `写 Y=1`，再执行 `r2 = 读 X`。按单核大脑推理，不管两个核怎么交替跑，总有一个核先做完自己的写吧？既然如此，两个读里起码得有一个看到对方刚写进去的 `1`，绝对不可能两手空空。可把它放在真实的 [[x86]] 或 [[ARM]] 机器上连跑几万次，偏偏真会出现 `r1 = 0, r2 = 0`！

      为什么会这样？问题不在内存损坏，而在物理事实：**一次「写入」要在另一个核眼里生效，并不是瞬间传送，需要经过缓存同步和队列排队**。在那短短几十个周期的传播窗口里，核 1 眼里的 `X` 已经变成 `1`，核 2 眼里的 `X` 却还停留在 `0`。写完不等于全网同步——一旦程序在这几十个周期的空档里根据「别人写的标志位」做了判断，就会在旧版本上拍错板。单核编程只用问「值算对了吗」，多核编程头一件事得先问「顺序还在不在」。
    derivation: original
    sources:
      - ref: sorin-primer
        locator: 第 1 章（共享内存与一致性模型导论）
        claim: 共享内存机器的一致性模型定义其内存系统在架构上可见的行为，规定读写如何作用于内存
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-13
    canvas:
      kind: datastate
      structure: array
      caption: 同一瞬间，两个核眼里的 X 可以不一样
      rows:
        - label: 核 1 眼里
          cells:
            - v: 核 1 刚写完 X=1，在它自己眼里 X 已经是新值
              mark: active
            - v: Y=0
        - label: 核 2 眼里
          cells:
            - v: 核 2 还没有收到这次写，在它眼里 X 仍是旧值 0
              mark: muted
            - v: Y=1（刚写完）
              mark: active
    log:
      - mode: 直觉失效
        event: 写生效需要传播，传播途中各核看到的版本不同
  - id: store-buffer
    title: 写缓冲：写操作先丢进排队队列，后面的读抢先跑了
    tldr: 把一次写广播给其他核要等几十个周期，[[CPU]] 不肯每写一次就原地干等，于是给每个核配了一条私有的排队小缓冲：写指令往缓冲里一丢就继续跑后面的读，两个核一对照才露出顺序裂缝。
    body: |-
      核 1 刚写完 `X = 1`，为什么不老老实实等所有核都看见再往下走？全是被等待逼的。要想让核 2 也看见 `X = 1`，核 1 必须先发消息拿到 `X` 所在缓存行的独占权，再等核 2 把手里的旧副本清掉、发回确认——一来一回动辄几十个时钟周期。偏偏程序写完一个变量之后，下一行往往就是完全不相关的加法或读别的地址，每写一次都把流水线堵死干等，CPU 早就慢成乌龟了。

      于是芯片设计师给每个核塞了一条私有小队列，叫**写缓冲**（store buffer）。核 1 执行 `写 X=1` 时，压根不傻等同步结果，而是把「地址 `X`、新值 `1`」打包往自家写缓冲里一扔，当场宣布这条写指令完工，转头就顺着流水线去执行下一条指令（比如 `读 Y`）；后台再由写缓冲按先来后到的顺序，慢慢把这笔写推给缓存和内存。

      等一下——看到这儿你肯定会反问：那要是核 1 自己写完 `X = 1`，下一行马上读 `X` 怎么办，难道连自己都读成旧的 `0`？不会，硬件早就留了一道近道叫**写转发**（store forwarding）：本核发读请求时，会顺手先翻一眼自家写缓冲里有没有相同地址的最新条目，有就直接递过来。所以单个核自查永远严丝合缝，破绽偏偏只在「核 2 来读 `X`」时才炸开——因为核 2 看不到核 1 的私有写缓冲，它去共享缓存一翻，看见的还是老早之前的 `0`。（注意写缓冲也只有几十项容量，写得太急太密照样会塞满堵住。）
    derivation: original
    sources:
      - ref: x86-tso
        locator: 第 2 节（store buffer 的抽象机模型）
        claim: x86-TSO 用每核先进先出的写缓冲建模，写先入缓冲、之后任意时刻才传播到共享内存，读可先于缓冲中的写执行
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-13
      - ref: sorin-primer
        locator: 第 3 章（顺序一致与写缓冲的性能动机）
        claim: 写缓冲让核心不必等待写对全局可见即可继续执行，是放松顺序一致的基本硬件机制
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-13
    canvas:
      kind: datastate
      structure: array
      caption: 写先在队列里排队，CPU 已经跑去执行后面的读了
      rows:
        - label: 核 1 写缓冲
          cells:
            - v: X=1（排队中）
              mark: active
            - v: 尚未进缓存
              mark: muted
        - label: 共享内存
          cells:
            - v: X=0
            - v: Y=0
    log:
      - mode: 排队
        event: 写 X=1 进入写缓冲，尚未对其他核可见
      - mode: 继续执行
        event: CPU 不等写落地，转去执行后面的指令
  - id: litmus
    title: SB 实验手算：六种交错全算一遍，(0,0) 到底哪来的
    tldr: 在严守代码先后顺序的理想世界里，双核实验的 4 个操作一共只有 6 种合法排法，只能得出 `(0,1)`、`(1,0)` 和 `(1,1)`；把写缓冲放进来后，两笔读双双越过缓冲里排队的写，`(0,0)` 立刻成立。
    body: |-
      这种只有三四行的迷你双核实验，行话叫 **litmus 测试**（石蕊试纸测试）——就像化学试纸沾一下就显出酸碱性一样，跑一遍就能试出某块 CPU 的真实顺序规则。我们主线这道实验（看下方代码）是最有名的 **SB**（Store Buffering，写缓冲）测试：核 1 依次做 `W1(X=1)` 和 `R1(Y)→r1`，核 2 依次做 `W2(Y=1)` 和 `R2(X)→r2`。

      先假设世界老老实实守规矩：所有核的操作排成一条公认的单队，且各自内部的写必须在读之前（`W1` 在 `R1` 前，`W2` 在 `R2` 前）。总共 4 个操作，去掉自身乱序，合法的排队方式精确只有 **6 种**，一条一条手算给你看：
      ① `W1 → R1 → W2 → R2`：核 1 全跑完核 2 才动手，得 `(0, 1)`；
      ② `W2 → R2 → W1 → R1`：核 2 全跑完核 1 才动手，得 `(1, 0)`；
      ③ `W1 → W2 → R1 → R2`、④ `W1 → W2 → R2 → R1`、⑤ `W2 → W1 → R1 → R2`、⑥ `W2 → W1 → R2 → R1`：两笔写都在两笔读前面落了地，全得 `(1, 1)`！
      一个 `(0, 0)` 都凑不出来！用反证法一秒看穿原因：要想让 `r1 = 0`，`R1(Y)` 必须赶在 `W2(Y=1)` 之前；要想让 `r2 = 0`，`R2(X)` 又得赶在 `W1(X=1)` 之前；把核内先后连起来就是 `W1 → R1 → W2 → R2 → W1`，自己跑在自己前面，直接撞碎逻辑！

      现在打开第 2 步讲的写缓冲，谜底朴素得令人拍案：核 1 先把 `X=1` 塞进自家写缓冲，不等它落地就立刻执行 `R1(Y)` 去读共享内存，这时核 2 还没把 `Y=1` 写出来（也正卡在核 2 自己的写缓冲里），于是核 1 读出 `r1 = 0`；同一瞬间核 2 的 `R2(X)` 也越过自家缓冲里的 `Y=1` 去读内存，同样读出 `r2 = 0`。半拍之后两份写才从各自缓冲悠悠推进内存。没有谁算错，只是两笔读都合法地越过了各自还在缓冲里排队的写！
    derivation: original
