  - id: fences
    title: 内存屏障：花几十个周期，把需要的顺序买回来
    tldr: 内存屏障（fence）是一道卡在代码里的硬栅栏：它前面的访存必须先对其他核可见，后面的才许动手；在 SB 实验的写和读之间各插一道全屏障，`(0,0)` 当场消失，代价是等缓冲排空的几十上百个周期。
    body: |-
      顺序平时被硬件放开拿去换速度了，真到交接关键数据时怎么买回来？靠**内存屏障**（memory fence，也叫 barrier）。用它当场修好第 3 步坏掉的 SB 实验：在核 1 的 `写 X=1` 和 `读 Y` 之间插一道全屏障（x86 上是 [[MFENCE]]，ARM 上是 [[DMB]] SY），在核 2 的 `写 Y=1` 和 `读 X` 之间也插一道。这下 CPU 跑到屏障门口就必须刹车：先把自家写缓冲里排队的 `X=1` 全推落地、等对核确认失效，**确认完事之后**才许放行后面的 `读 Y`。两边的读都被死死按在各自写之后，执行被逼回那 6 种合法交错，`(0, 0)` 当场绝迹！

      这道栅栏可不是免费的——排空写缓冲加等待跨核一致性消息走完，流水线往往要在原地硬停 **几十到上百个时钟周期**，等于把写缓冲好不容易省下来的时间一笔吐回去。因此硬件特意把屏障按方向切成几档，按需买票更便宜：
      ① **写屏障**（只管写→写）：保住前面 `data = 42` 比后面 `ready = 1` 先对别人可见，用不到全屏障那么重；
      ② **读屏障**（只管读→读）：保住先检查 `ready == 1` 再读 `data`，不卡写操作；
      ③ **全屏障**（读和写全管，包括写→读）：像 SB 这种需要阻断写后读越位的场面才请它出山。

      记一条下手前的纪律：插屏障前，先在脑子里说出自己怕的到底是哪一对乱序——怕写写反了买写屏障，怕写读越位才买全屏障；买得越窄等得越少，千万别抱着「到处撒全屏障求心安」的心态把流水线堵死。
    derivation: original
    sources:
      - ref: x86-tso
        locator: MFENCE 一节（屏障语义）
        claim: x86 的 MFENCE 要求执行前本核写缓冲必须排空，从而恢复写后读的顺序
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-13
      - ref: arm-ordering
        locator: DMB 指令一节
        claim: ARM 的 DMB 保证屏障之前的访存先于之后的访存被观察者看到，可按读写方向限定范围
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-13
    canvas:
      kind: datastate
      structure: array
      caption: 写与读之间插一道屏障，(0,0) 被挡在门外
      rows:
        - label: 核 1
          cells:
            - v: 写 X=1
            - v: 屏障（排空缓冲）
              mark: active
            - v: 读 Y
        - label: 结果
          cells:
            - v: 回到六种合法交错
              mark: found
            - v: (0,0) 消失
              mark: found
    log:
      - mode: 屏障
        event: 前面的写全部生效，后面的读才许开始
      - mode: 代价
        event: 排空写缓冲，流水线停顿等待
  - id: language-level
    title: 语言层合同：用 happens-before 与 DRF 把硬件脾气挡在门外
    tldr: 写应用代码的人不用盯着 x86 和 ARM 的指令手册自己加屏障：语言层立下 [[DRF]] 合同——只要你用锁、[[volatile]] 或原子操作把每次共享访问串进 [[happens-before]] 链，编译器就自动补齐硬件屏障，程序结果等价于 [[SC]]。
    body: |-
      懂了硬件屏障之后，新的困惑来了：难道写个后端接口或客户端逻辑，还得背熟 [[TSO]] 和弱模型、亲自往代码里塞 `MFENCE` 和 `DMB`？当然不用！Java（[[JLS]] 第 17 章）、C++11、Go、Rust 这些现代语言在硬件之上再加了一道**语言内存模型**，核心概念叫 **[[happens-before]]**（先行发生）。

      先用最朴素的话看懂 `happens-before`：只要动作 A happens-before 动作 B，语言就保证 B 一定看得见 A 以及 A 之前做过的一切修改，而且链条还能传递（A 先于 B、B 先于 C，则 A 一定先于 C）。日常怎么在代码里钉出这条链？全是 `os/lock` 课讲过的老熟人：同一把锁「释放锁」happens-before「下个线程抢到这把锁」；对 [[volatile]]（或顺序一致原子）变量的「写」happens-before「随后对它的读」；父线程启动子线程（`start`）与等它结束（`join`）也各自钉一条链。

      把这份兜底协议写成正式合同，叫 **[[DRF]] 承诺**（Data-Race-Free，无数据竞争保证）：什么是「数据竞争」？两个线程同时碰同一个变量、至少一个是写、且两者之间没有 `happens-before` 链把它们串起来。合同正文只有一句：**只要你的程序在顺序一致世界里没有数据竞争，它在任何真实芯片上跑出来的行为都严格等价于 [[SC]]**——编译器会自己判断目标机器是 x86 还是 ARM，缺哪道屏障自动给你塞进去！拿 SB 验货：用普通变量跑 SB，两对读写没有链相连、属于数据竞争，出现 `(0, 0)` 语言概不赔付；把 `X`、`Y` 声明成 `volatile` 或顺序原子变量后，读写之间钉上了链，`(0, 0)` 立刻被合同禁止。
    derivation: original
    sources:
      - ref: jls-ch17
        locator: §17.4.5 happens-before 顺序与 §17.4 内存模型
        claim: JLS 第 17 章以 happens-before 定义可见性，正确同步（无数据竞争）的程序只表现出顺序一致的行为
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-13
    canvas:
      kind: datastate
      structure: array
      caption: 有没有 happens-before 这条链，决定合同赔不赔
      rows:
        - label: 普通变量 SB
