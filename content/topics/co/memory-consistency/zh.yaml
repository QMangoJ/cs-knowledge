- id: store-buffer
  title: 写缓冲登场：写为什么要排队
  tldr: CPU 不等写真正落地，把它丢进一个小队列就继续跑——不这么做，每次写都要陪内存一起等。
  body: 先用生活话垫平，写缓冲（store buffer）就是收银台旁的待发货架，你把包裹交给店员拿到回执就能走，包裹什么时候真正上车是店里的事。CPU 这么干是被延迟逼的，一次写要想对其他核可见，得先拿到目标缓存行的独占权，走一遍 cache 课讲的一致性流程，对方核还握着副本时还要等它失效，动辄几十个周期；若每条写指令都原地等齐，流水线会被写操作堵成长队，而程序写完一个变量，后面往往还有一串不相干的计算在等。于是硬件给每个核配一个小队列，写指令把地址和值往队列里一放就算执行完，CPU 转身去干别的，队列再按先来后到的顺序慢慢把写送进缓存。自己回头读刚写的地址时，硬件会先翻自己的队列把新值直接递回来，叫写转发，所以单核自查永远对得上，破绽只有第二个核来对照时才露。代价也埋在这里，写进了队列不等于写进了别人眼里的内存，在它真正落地前的这段时间里，本核后续的读完全可以越过它先跑，这正是下一步怪象的全部机关。补一句边界，队列只有几十项的容量，写得太密太急照样会把 CPU 堵住，它赊的是平均速度，不是无限期的账。
