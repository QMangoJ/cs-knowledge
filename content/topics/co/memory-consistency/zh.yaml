title: 内存一致性模型：多核眼里的内存为什么没有唯一版本
summary: 单核上写完马上能读到，多核下却未必——写缓冲让每个核看到的内存短暂地不一样，一致性模型就是给这种「不一样」划界的合同。
premise: 两个核各写各的变量、再去读对方写的，按单核的直觉结果应该很确定，可多核跑出来偏偏会出现谁都没读到对方新值的怪结果，问题出在哪？本课以两个核各先写一个变量、再读对方变量的小实验（SB）为例，看多核眼里的内存为什么没有唯一版本。
position: 本科是组成原理「不止一个主人：设备与多核共享内存」板块的第二站，上一课总线与 DMA 讲外部设备怎样绕过 CPU 直接读写内存，本课把主人换成多个 CPU 核，看它们同时读写同一片内存时顺序为何没有唯一答案；它承接 cache 课的缓存一致性——MESI 只保证单个地址不读到旧值，本课追问的是多个地址之间的先后顺序由谁说了算。
bridge:
  prev: 上一课总线与 DMA 里，DMA 控制器已经成了内存的另一个主人，它不等 CPU 点头就能自己搬数据；本课再把主人换成多个 CPU 核一起读写同一批变量——每个核都老老实实按程序顺序做完了自己的事，合起来看却可能找不到任何一种全局排队能解释结果，内存里到底是什么于是第一次没有了唯一答案。
overview:
- key: 一句话总结
  value: 内存一致性模型是硬件对软件的一份合同，规定多核之间读写被彼此看到的顺序可以乱到什么程度。合同越宽松，硬件跑得越快，但程序员要操的心也越多。
- key: 先分清两件事
  value: 先分清两个容易混的概念，缓存一致性（coherence）管的是单个地址的新旧，保证你不会读到某个地址的旧副本。内存一致性（consistency）管的是多个地址之间的先后，两个地址的写谁先被别人看见。
- key: 乱序的源头
  value: 乱序的一个主要源头是写缓冲，写操作先在缓冲里排队，读操作却可以先行一步。单核自己看不出破绽，因为它读自己刚写的值有特殊通道，多核一对照，顺序就对不上了。
- key: 模型谱系
  value: 模型从严到松排成一个谱系，顺序一致（SC）最合直觉，所有核看到的都是同一个全局顺序，但代价也最贵。x86 用的 TSO 只放松写后读这一种顺序，ARM 这类弱模型放松得更多，换来的是性能和省电。
- key: 买回顺序
  value: 需要顺序的地方，可以用内存屏障（fence）按需把顺序买回来。代价是屏障要等排在前面的写真正传播出去，流水线要停顿，所以屏障只该加在真正需要的地方。
- key: 程序员的合同
  value: 程序员不用直接面对硬件的脾气，语言层用 happens-before 和无数据竞争承诺（DRF）把它挡在门外。只要你用锁和原子操作正确同步，语言就保证程序表现得像顺序一致一样。
