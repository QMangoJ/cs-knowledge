      - mode: 代价
        event: 每步都要立即对所有核可见，写缓冲这类优化没法用
  - id: tso
    title: x86-TSO：四种相邻顺序里只放松「写后读」一种
    tldr: "[[x86]] 采用的 [[TSO]] 几乎和 [[SC]] 一样严，只对写缓冲开了一道口子：读可以越过自己缓冲里排队的写先跑，而写写、读读、读写全保住——所以 SB 会跑出 `(0,0)`，单向发信号套路却天然稳当。"
    body: |-
      从 [[SC]] 往性能妥协一步，就是桌面与服务器 [[x86]] 芯片采用的 **TSO**（Total Store Order，全局写序）。拿第 2 步那个「先进先出的私有写缓冲」直接就能推出它的全部四条规矩，把核内相邻两步的顺序逐一过堂：
      ① **写 → 写**：两笔写老老实实排进先进先出的队列，先写的先落地，**保序**；
      ② **读 → 读**：读不进写缓冲、依次直接执行，**保序**；
      ③ **读 → 写**：后来的写得等前面那条读拿到结果才进队列，**保序**；
      ④ **写 → 读**：先来的写还躺在队列里等传播，后面的读直接跑去内存了，**可越过**！

      对照一下立刻看穿 x86 的脾气：四个组合里，[[TSO]] 仅仅放松了「写 → 读」这一条！我们的 SB 实验里，核 1 和核 2 偏偏全都是「先写再读」（`W1 → R1` 与 `W2 → R2`），一脚踩中唯一被放开的口子，所以 x86 上能稳定跑出 `(0, 0)`。可日常开发中最常见的「核 1 先写好数据包、再写 `ready = 1`；核 2 看见 `ready == 1` 后去读数据包」这种单向发布套路，靠的全是「写 → 写」和「读 → 读」——这两条 TSO 免费帮你死死保住了，甚至不加屏障都不会翻车！

      这也就解释了为什么很多并发老手总有错觉「我从不加屏障在服务器上也没出过 bug」：只是因为 x86-TSO 在四种顺序里帮你兜住了三种！千万别把这种宽容当成理所当然——一是编译器优化本身还可能把读写重排，二是碰到 SB 这种互相检视的写法照样出 `(0, 0)`，三是一旦代码搬上手机或 ARM 服务器就会立刻翻车（下一步看）。
    derivation: original
    sources:
      - ref: x86-tso
        locator: 摘要与模型定义一节（CACM 53(7), 2010）
        claim: x86-TSO 以每核 FIFO 写缓冲刻画 x86 多处理器，唯一放松的是读越过缓冲中的写，其余顺序均保留
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-13
    canvas:
      kind: datastate
      structure: array
      caption: 四种顺序里 TSO 只放松写后读一种
      rows:
        - label: 保住的顺序
          cells:
            - v: 写→写 保序
              mark: found
            - v: 读→读 保序
              mark: found
            - v: 读→写 保序
              mark: found
        - label: 放松的顺序
          cells:
            - v: 写→读 可越过
              mark: active
    log:
      - mode: TSO
        event: SB 能出 (0,0)，其余乱序罕见
      - mode: 实际影响
        event: 常见同步套路在 x86 上天然成立
  - id: weak-models
    title: 弱模型：ARM 为什么连「写→写」和「读→读」也一起放开
    tldr: "[[ARM]] 等弱序模型不光放开写后读，还把写后写、读后读一并放开，换来更高的核间并发度与更低功耗；代价是在 [[x86]] 上白送的「先写数据再置标志」在 ARM 上必须自己买单。"
    body: |-
      把视野转向手机、笔记本和越来越多云服务器上跑的 [[ARM]] 芯片（以及 RISC-V），合同一下宽松了一大截，行话叫**弱序模型**（weak ordering）。拿上一步那张表一比就清楚：除了放开「写 → 读」，只要两组访问之间没有直接数据依赖，也允许**「写 → 写」乱序生效**（后写的标志可能比先写的数据先到对方眼里），还允许**「读 → 读」乱序完成**（后面的读提前跑去缓存抓数）。

      为什么要把合同放这么宽？说到底是为**省电**和**扩核**。想让芯片上的十几个、甚至上百个核心在写和写之间死守全局次序，缓冲不能合并、互连消息得来回等确认，手机电池会白白耗在这些协调电流上；等到数据中心堆上 64 核、128 核时，跨芯片协调的耗时涨得比算力还快。把顺序彻底放开，硬件就能趁机合并写入、提前预读，哪个核跑顺了就先落盘。

      代价全落在没按规矩写代码的程序员头上。拿上一步在 x86 上「稳稳通过」的发布套路算一笔现世报：核 1 写 `data = 42; ready = 1;`，核 2 检查 `if (ready == 1) 读 data`。在 x86 开发机上测了一年零事故；可搬上 ARM 手机或云主机后，某天核 1 的 `ready = 1` 抢先穿出互联到达核 2（写写乱序），或者核 2 投机提前抓了旧的 `data = 0`（读读乱序），结果核 2 明明看见 `ready == 1`，手里拿到的 `data` 却是错的 `0`！更折磨人的是，这类 bug 千分之几才碰上一次、加一行打印日志时序一偏就彻底消失——靠「测过了」永远证不出并发对错，必须老老实实把该买回来的顺序买回来。
    derivation: original
    sources:
      - ref: arm-ordering
        locator: 弱序模型与 DMB 屏障一节
        claim: ARMv8 对普通内存采用弱序模型，读写可被其他观察者以不同于程序顺序的次序看到，需用屏障恢复顺序
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-13
      - ref: sorin-primer
        locator: 第 4 章（宽松一致性模型谱系）
        claim: 宽松模型通过放松写读、写写等顺序换取性能，模型越松硬件实现越自由、编程越难
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-13
    canvas:
      kind: datastate
      structure: array
      caption: 弱模型放开的顺序更多，出问题的点也更多
      rows:
        - label: x86-TSO
          cells:
            - v: 只放松 写→读
        - label: ARM 弱序
          cells:
            - v: 放松 写→读
              mark: active
            - v: 放松 写→写
              mark: active
            - v: 放松 读→读
              mark: active
    log:
      - mode: 弱序
        event: 顺序要靠依赖与屏障显式声明
      - mode: 风险
