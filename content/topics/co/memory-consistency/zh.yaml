- id: litmus
  title: SB 实验：把 (0,0) 一步步算出来
  tldr: 这种「写一个、读一个对方」的小程序叫 litmus 测试，是检验内存模型的最小标本；先手算它在守规矩时为什么出不了 (0,0)。
  body: 先解释术语，litmus 测试（litmus test）就是一段巴掌大的双核小程序，专门用来问某种结果到底可不可能，像化学里的石蕊试纸，一测便知模型的酸碱。标本如下，X、Y 起初都是 0，核 1 写 X=1 后读 Y 记为 r1，核 2 写 Y=1 后读 X 记为 r2。先假设世界完全守规矩，也就是后面要讲的顺序一致，四个操作必须排成一条尊重各自程序顺序的队，核内写必在读前。全部排法只有六种，逐一算，核 1 整段先跑完得 (0,1)，核 2 整段先跑完得 (1,0)，其余四种交错都至少有一方读到了对方的写、得 (1,1)；六种排法被脚本穷举复核过，(0,0) 一次也不出现。道理也能一句话说透，要 r1=0，核 1 的读必须排在核 2 的写之前，要 r2=0，核 2 的读又必须排在核 1 的写之前，串起来核 1 的写排在自己的读之后，直接撞碎程序顺序。现在把写缓冲放进来，时序变成，两个核先把写塞进各自队列，接着各读对方变量，队列还没排空，内存里 X、Y 仍是 0，于是 r1、r2 双双读到 0，最后两笔写才悠悠落地，谜底就是这么朴素，(0,0) 不是谁算错了，而是两笔写都还在路上时两笔读就已经完成了。
  derivation: original
  sources:
  - ref: x86-tso
    locator: SB litmus test 一节（store buffering 示例）
    claim: SB 在顺序一致下不可能得到双读 0，但在带写缓冲的 x86-TSO 下可以，因为读可越过缓冲中的写
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-13
