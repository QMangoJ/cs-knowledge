              mark: found
    log:
      - mode: 语言层
        event: happens-before 是程序员与运行时之间的合同语言
      - mode: DRF
        event: 程序没有数据竞争时，结果等价于顺序一致；有数据竞争时，语言不作保证
  - id: lesson
    title: 工程纪律：只认白纸黑字的合同，三问带走
    tldr: 并发代码唯一的护身符是语言和同步原语写明的顺序保证，不认某台机器碰巧没出错的运气：跨核发信号用 [[release]]/[[acquire]] 配对，遇到疑难先缩成 SB 那样能手算的迷你实验。
    body: |-
      把全课落成两句「千万别做」和两招「标准做法」。第一，永远别依赖硬件碰巧的宽容：[[x86]] 的 [[TSO]] 免费送了写写顺序，不等于你的代码天生拥有写写顺序；测试机跑了一年不出错只代表刚好没撞上那几拍时序，不能代替合同推理。第二，尽量用 `os/lock` 课的互斥锁、[[volatile]] 或原子变量编程，规范明文写了什么保证你就只依赖什么保证，规范没承诺的可见性一律当它不存在。

      真要自己写无锁的「先备数据、再通知对方取货」，别自己裸拼汇编屏障，直接走标准发布—订阅配对：写方先写完数据，再用带 [[release]] 语义的写把标志位置成 1（保证前面的数据全部落地在前）；读方用带 [[acquire]] 语义的读检查标志位，见 1 再去读数据。在 [[ARM]] 上编译器会贴上轻巧的屏障指令，在 x86 上几乎零额外开销，可移植又快。万一线上撞见诡异的并发顺序 bug，别对着几千行代码干猜——把它剥洋葱缩成 SB 那样的 4 行迷你试纸实验，把 6 种交错摆在纸上算一遍，真相瞬间水落石出。

      带走全课的**「多核并发三问诀」**，审查任何跨核代码都能用：
      ① **卡的是值还是序？**——单个地址旧副本归缓存一致性（MESI）管，多个地址先后顺序归内存一致性管；
      ② **靠的是合同还是运气？**——有没有用锁、[[volatile]] 或 [[release]]/[[acquire]] 钉牢 [[happens-before]] 链；
      ③ **搬去弱模型芯片还稳吗？**——把脑子里的 x86 换成处处可乱序的 ARM 再推一遍，没沾「写写默认保序」的光才算真正写对。
    derivation: original
    sources:
      - ref: sorin-primer
        locator: 第 8 章（程序员视角的一致性与同步纪律）
        claim: 一致性模型是硬件与软件之间的合同，程序应只依赖模型与同步原语明确给出的顺序保证
