objectives:
- 分清缓存一致性与内存一致性各自管什么、用一句话说清两者的分工
- 用 SB 实验的交错枚举证明顺序一致下 (0,0) 不可能、有了写缓冲却可能
- 说清 SC、x86-TSO 与 ARM 弱模型分别放松了哪几种读写顺序
- 会用内存屏障与语言层同步把顺序按需买回来，并说清 DRF 承诺的内容
aiLink: 多线程推理服务、数据加载管线与 GPU 协作里的数据竞争同出一源，懂一致性模型才能判断一把锁或一个原子变量到底买到了什么保证，而不是靠「在我机器上没出错」猜对错。
design:
- mechanism: 宽松内存模型——硬件默认允许写后读等顺序被放松，只在程序员用屏障或同步原语点名时才恢复顺序，顺序从默认赠品变成按需购买的商品。
  problem: 若硬件强迫每次写都立刻对所有核可见、每次读都等前面的写落地，多核的每次访存都要付全局协调的延迟，写缓冲、乱序执行攒下的性能会被访存等待吃光，核数越多协调越贵。
  choice: 默认放松、按需收紧，x86 只放松写后读一种顺序，ARM 放松更多，程序员在哪条边界上真的需要顺序就在哪里放一道屏障，只为用到的顺序付钱，没点名的路径全速通过。
  tradeoff: 换来的是访存性能与可扩展性，代价是编程难度陡增，没有屏障的并发代码可能只在某种硬件上偶尔出错，调试时按单核直觉推理会系统性地得出错误结论。
  root: 根源是可见性有物理成本，一次写要对其他核可见，必须走缓存一致性流量并等对方确认，延迟由连线与协议决定、压不下去，所以顺序只能标价出售，不可能免费全送。
- mechanism: coherence 与 consistency 分工——一致性协议（MESI 一类）只负责单个地址的副本新旧，内存一致性模型负责多个地址的读写在全局看来按什么顺序发生，两层各管一摊。
  problem: 多核共享内存同时有两个正交的问题，一个地址的多个副本谁说了算、与不同地址的写入谁先被看见，搅在一起既说不清也验不了，硬件实现与程序员推理都会失控。
  choice: 切开处理，协议层用单写多读不变量保证任一时刻单个地址只有一个最新值来源，模型层单独定义跨地址的顺序合同，SB 实验里两个地址各自的值都没错，错的只是顺序，正说明顺序问题不在协议层的管辖内。
  tradeoff: 分工让每层都可独立实现与验证，代价是两层都正确仍拼不出直觉，MESI 完美运行照样能读出 (0,0)，程序员必须同时理解两层才能解释一个并发怪象。
  root: 根源是局部性质与全局性质的差别，副本新旧是逐地址可判定的局部性质，跨地址顺序是关于全体操作排列的全局性质，数学对象不同，本来就该由不同的机制与合同分别承担。
- mechanism: 语言层 DRF 合同——语言内存模型向程序员承诺，只要程序没有数据竞争（所有共享访问都由锁、volatile 或原子变量建立起 happens-before 顺序），执行结果就等价于顺序一致，硬件怎么乱序都看不见。
  problem: 若要求每个程序员都直接对着硬件模型编程，同一份代码在 x86 与 ARM 上要分别推理、分别加屏障，不可移植也不可教学，并发正确性会成为只有硬件专家能碰的领域。
  choice: 语言层立约，守纪律的一方换取最强的心智模型，编译器与运行时负责在具体硬件上把缺失的屏障补齐，无竞争程序按单机交错语义推理即可，有竞争的程序则不在承诺之内、结果不作保证。
  tradeoff: 换来可移植与可推理，代价是纪律本身要学，happens-before 链断在哪里往往不显眼，且编译器为兑现承诺在弱模型硬件上插入的屏障会吃掉一点性能，越守规矩的语言运行时付得越多。
  root: 根源是抽象分层，谁离硬件近谁吸收硬件差异，语言层把杂乱的硬件脾气收敛成一条可判定的程序性质（有没有数据竞争），让正确性推理重新变回纯软件问题。
quiz:
- q: SB 实验中 X=Y=0，核 1 写 X=1 后读 Y 得 r1，核 2 写 Y=1 后读 X 得 r2，顺序一致下哪种结果不可能？
  options:
  - (r1, r2) = (0, 1)
  - (r1, r2) = (1, 0)
  - (r1, r2) = (1, 1)
  - (r1, r2) = (0, 0)
  answer: 3
  explain: 顺序一致要求四个操作排成一个尊重各核程序顺序的全序，(0,0) 意味着两个读都排在对方写之前，与各自的写在读之前互相矛盾；六种合法交错只产出其余三种结果。
- q: 缓存一致性（coherence）与内存一致性（consistency）的分工是？
  options:
  - 前者管性能，后者管正确性
  - 前者管单个地址的副本新旧，后者管多个地址之间的先后顺序
  - 前者是软件概念，后者是硬件概念
  - 两者是同一件事的两种叫法
  answer: 1
  explain: MESI 让单个地址不读到旧副本，但两个地址的写谁先被看见是另一层问题，SB 的 (0,0) 正是在一致性协议完美运行时出现的顺序问题。
- q: x86-TSO 相比顺序一致，只放松了哪一种顺序？
  options:
  - 写后写（后面的写越过前面的写）
  - 读后读（后面的读越过前面的读）
  - 写后读（读越过还在写缓冲里排队的写）
  - 读后写（写越过前面的读）
  answer: 2
  explain: TSO 的写缓冲是先进先出的，写与写、读与读、读与写的顺序都保住，唯独读可以越过本核尚未落地的写，于是 SB 能出 (0,0)，其余乱序在 x86 上罕见。
- q: 关于语言内存模型的 DRF 承诺，正确的说法是？
  options:
  - 只要用了多线程，语言就保证顺序一致
  - 程序没有数据竞争时，执行等价于顺序一致；有竞争则不在承诺内
  - volatile 能让有数据竞争的程序也变正确
  - DRF 是说硬件会自动修复程序员漏加的锁
  answer: 1
  explain: DRF 是有条件的合同，程序员用锁、volatile、原子变量建立 happens-before 顺序，语言才回赠顺序一致的心智模型，竞争访问的结果不作任何保证。
steps:
- id: why
  title: 单核直觉为什么在多核下失效
  tldr: 自己写完马上能读到，是单核的特权；多核下你的写可能还堵在半路，别人读到的自然是旧账。
  body: 先把单核的直觉说清楚，在一个核上，你刚写完一个变量紧接着读它，一定读到刚写的值，就像把便签贴在自家冰箱上，回头看绝不会看错，因为写和读走的是同一条路、没有第二个人插队。多核把这份确定性打碎了，每个核都有自己的缓存和一条还没发完的写队列，你的写可能还躺在半路，另一个核来读，只能读到内存里的旧值，于是同一瞬间，两个核眼里的内存可以短暂地不一样，这不是内存坏了，而是「写生效」本身需要传播时间。先预告全课的怪现象，变量 X、Y 起初都是 0，核 1 先写 X 再读 Y，核 2 先写 Y 再读 X，按常理总有一方先写完，两个读里至少一个该读到 1；可真实机器上两个读能同时读到 0，仿佛两笔写都凭空迟到了。接下来的几步就追三件事，写为什么会迟到，这个怪象怎样一步步发生，以及程序员靠什么把确定性买回来。换句话说，内存不再是一块所有人共看的黑板，更像每个核手里一份正在同步的副本，同步走完之前，版本不一样就是常态而不是故障。记住本课的问题意识，单核问的是值对不对，多核先要问的是顺序在不在。
  derivation: original
  sources:
