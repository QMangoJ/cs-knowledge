title: 内存一致性模型：多核眼里的内存为什么没有唯一版本
summary: 同一个核刚写完就能马上读到新值，不代表另一个核同一瞬间也看得见——硬件为了不原地干等，把写操作先塞进各自核的小缓冲里排队，让后面的读先插队跑完，几个核眼里的内存于是短暂对不上号。内存一致性模型就是硬件和软件签的一份合同，规定读写顺序最多能乱到哪一步。全课先拆开写缓冲制造双双读 0 的现场，分清「单个地址保新旧」和「多地址保先后」两层管辖，再从最严的顺序一致一路对比到 [[x86]] 与 [[ARM]] 的真实宽松规则，最后落到用内存屏障和语言层同步把确定性按需买回来。
premise: 内存里有两个变量 X 和 Y，起初都是 0。现在让核 1 先把 X 改成 1、再去读 Y，同时让核 2 先把 Y 改成 1、再去读 X——按单核「写完就生效」的直觉，总有一个核先下手，至少有一边能读到 1 才对；可真放在多核 CPU 上跑，偏偏会跑出两个核同时读到 0 的怪结果。到底是谁把新值藏起来了？本课就拿这四行双核小实验贯穿到底，看清多核之间「谁先看见谁的写入」为什么没有唯一顺序。
position: 本课是组成原理「不止一个主人：设备与多核共享内存」板块的最后一站，也为整个组成原理收官。上一课讲了硬盘、网卡这些外设绕开 CPU 改内存时，缓存里怎么会留下旧副本；这一课把同台竞争的主人换成多个 CPU 核心，追问更难的一层——多个地址的修改在多核眼里为什么没有统一顺序。它直接承接缓存课的「单个地址不读旧值」，解释了多核下并发程序为什么光靠缓存一致性远远不够，也为操作系统里的锁与并发编程铺好硬件底座。
bridge:
  prev: 上一课看 DMA 绕开 CPU 直接改内存，把「外设和 CPU 抢同一片内存」摆上了桌面。可就算全换回 CPU 自己干活，只要核心不止一个，麻烦照样升级：每个核都老老实实按代码顺序跑完自己的指令，合起来却能得出单核永远解释不了的怪结果。
overview:
  - key: 一句话总结
    value: 内存一致性模型是硬件对软件签的一份合同，规定多核之间读写被彼此看见的顺序最多能乱到什么程度；合同越松，芯片跑得越快越省电，写并发程序也越容易踩坑。
  - key: 先分清两件事
    value: 缓存一致性（coherence）只盯单个地址，保证任何核读 X 都不会拿到过期的旧副本；内存一致性（consistency）管多个地址之间的先后，决定「先写 X 再写 Y」时别人会不会先看见 Y 后看见 X。
  - key: 乱序的源头
    value: 乱序最常见的机关是写缓冲：写操作先排进各核私有的小队列慢慢等同步，后面的读却提前去内存拿数；自己回头读自己有抄近道转发，外核来读却扑空。
  - key: 模型谱系
    value: 合同从严到松排成一条线：顺序一致（[[SC]]）像单核轮流跑，人人眼里顺序唯一但代价极贵；[[x86]] 的 [[TSO]] 只放开「写后读」一种越位；[[ARM]] 等弱模型连写写、读读都放开，换来性能和省电。
  - key: 买回顺序
    value: 真要保顺序的地方，插一道内存屏障（fence）把排队的写全部刷落地再往下走；因为要等几十上百个周期，屏障只该精准贴在跨核交接的那几行。
  - key: 程序员的合同
    value: 写业务代码不用盯着不同芯片的脾气手动加屏障：语言层用 [[happens-before]] 和无数据竞争承诺（[[DRF]]）兜底——只要用锁和原子变量消掉竞争，程序行为就等价于顺序一致。
