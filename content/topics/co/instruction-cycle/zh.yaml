id: co/instruction-cycle
subject: co
slug: instruction-cycle
order: 2
status: published
license: CC-BY-4.0
title: 一条指令是怎么执行的
summary: CPU 不停重复同一个循环：取一条指令、看懂它、做它、必要时读写内存、把结果存好。
premise: 以一条“从内存读一个数放进寄存器”的加载（load）指令为例，用经典五阶段（RISC 教学）模型讲解。
overview:
  - key: 一句话总结
    value: 取指 → 译码 → 执行 → 访存 → 写回，周而复始
  - key: 程序计数器
    value: 记着“下一条指令在哪”，每执行完一条就往前走
  - key: 寄存器
    value: CPU 内部极快的小存储，运算用的数据和结果大多放在这里
  - key: 说明
    value: 五阶段是教学模型；真实的 x86-64 会先把复杂指令拆成更简单的微操作，再乱序、并行地执行
  - key: 指令集
    value: x86-64（CISC）、ARM、RISC-V（RISC）；机器码互不通用
  - key: 性能公式
    value: CPU 时间 = 指令数 × CPI × 时钟周期
  - key: 控制流
    value: 跳转和函数调用就是改写 PC
  - key: 在终端里看一看
    value: objdump -d ./a.out | less　看程序的机器指令
visual: swimlane
lanes:
  - id: ctl
    label: 控制
  - id: alu
    label: 运算
  - id: mem
    label: 存储
logColumns:
  - key: mode
    label: 当前状态
  - key: event
    label: 发生了什么
steps:
  - id: fetch
    title: 取指：拿到下一条指令
    tldr: CPU 按程序计数器指的位置，从内存取出一条指令。
    body: 程序计数器 PC 记着下一条指令的地址，这是整个执行循环的锚点。取指阶段，CPU 把 PC 的值送上地址总线，从指令缓存里取出这条指令放进指令寄存器，同时算好顺序执行的下一个地址，定长指令下就是 PC 加指令长度。走一条具体的，设 PC 等于 0x400000 处放着一条 4 字节的 load 指令，取指后 PC 先变成 0x400004 待命，但这只是默认去向，如果这条指令最后是跳转，PC 还会被改写成别的值。程序之所以能一条接一条自动往下走，靠的不是谁在发号施令，就是这个取完自增、偶尔被改写的计数器。要区分指令地址和数据地址，取指走的是指令侧通路，后面访存走数据侧通路，两者第一级缓存都是分开的，这也是流水线一课里结构冒险能被化解的硬件基础。现代 CPU 还会一次取出多条指令塞进队列，因为单条取指的吞吐喂不饱后面的多发射流水线。
    derivation: original
    sources:
      - ref: cs61c
        locator: CPU datapath 相关讲义
        url: https://cs61c.org/
        claim: 处理器根据 PC 取指并更新 PC
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
