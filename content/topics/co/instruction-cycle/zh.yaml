  - id: writeback
    title: 写回：把 42 存进 x5，一条指令才算完
    tldr: 从内存取回来的 42 在这一拍写入目标寄存器 x5；直到写回完成，后续指令才看得见这个新值，随后程序计数器按 0x400004 开启下一轮取指。
    body: |-
      写回阶段把访存或执行阶段拿到的结果，放回寄存器堆里对应目标编号的那一格。对主角 lw x5, 8(x6) 来说，译码时记下的目标号是 x5，于是数值 42 在这一拍正式落进 x5，这条指令才算真正退休（store 和条件分支没有目标寄存器，这一级空手而过）。为了让紧随其后的指令能无缝接住刚算出的结果，硬件常把寄存器堆做成「前半拍写入、后半拍读出」，这样下一条指令在同一拍译码时正好能读到 x5 里的新值 42。

      注意分清一个初学者最容易搞混的点：写回写的是处理器内部极快的寄存器，不是内存——只有 store 指令才把数据写进缓存和主存。五拍走完，[[CPU]] 回到取指阶段按 0x400004 取下一条，周而复始；3 GHz 主频意味着这样的时钟节拍每秒跳 30 亿次。真实处理器当然不会傻等一条走完五拍再动下一条，而是把多条指令叠进流水线，这正是下一课的起点。
    derivation: original
    sources:
