  - id: isa
    title: 指令集：软件和硬件之间的约定
    tldr: 指令集（ISA）规定 CPU 认哪些指令，同一份机器码只能在同一指令集的 CPU 上跑。
    body: 指令集体系结构 ISA 是软件和硬件之间的一纸合约，它规定有哪些指令、指令怎么编码、有哪些寄存器、访存和异常怎么处理。编译器只按合约生成机器码，CPU 内部怎么实现是它的自由，只要对外表现符合合约，同一份程序就能跨代运行。x86-64 和 ARM 是两份不同的合约，编码、寄存器数量、内存模型都不同，所以同一份机器码互不通用，跨架构要靠重新编译或模拟翻译。风格上 RISC 追求定长、规整、load 和 store 与运算分离，硬件译码简单，RISC-V 是当代代表；CISC 如 x86-64 指令变长、单条能做访存加运算，代码密度高但前端复杂，它内部也要先拆成类 RISC 的微操作再执行，等于在硬件里藏了一个翻译层。这层合约的价值在生态，操作系统和应用按 ISA 编译一次，就能在所有兼容实现上运行，厂商则可以在不破坏软件的前提下逐年改进微架构，指令数和 CPI 的优化空间正来自这种解耦。
    derivation: original
