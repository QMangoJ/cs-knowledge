steps:
  - id: fetch
    title: 取指：按 PC 从指令缓存取出下一条指令
    tldr: 拿地址 0x400000 处的 lw x5, 8(x6) 起步：取指按 [[PC]] 记着的地址把这条 4 字节机器码从指令缓存取出，并先把 PC 加 4 预备好下一条地址。
    body: |-
      程序计数器 [[PC]] 是整个执行循环的锚点。取指阶段，[[CPU]] 把当前 PC 值 0x400000 送上地址通路，从指令缓存里取出这 4 个字节的 lw 指令放进指令寄存器，同时顺手算好顺序执行的默认下一条地址：定长 4 字节指令下，就是 0x400000 + 4 = 0x400004。等一下，如果这条指令其实是个跳转怎么办？0x400004 只是先摆好的默认去向，后面阶段算完跳转目标后随时可以覆盖它。程序能一条接一条自动往下跑，靠的就是这个「默认自增、需要时改写」的计数器。

      这里顺带埋一个下一课流水线要用的伏笔：取指走的是单独的指令侧通路，只查专门的一级指令缓存；第 4 步读写数据则走另一条数据侧通路和一级数据缓存。指令和数据把一级缓存拆成两半，这样下一条取指和上一条读内存才能同时干活、互不抢路。
    derivation: original
    sources:
      - ref: cs61c
        locator: CPU datapath 相关讲义
        url: https://cs61c.org/
        claim: 处理器根据 PC 取指并更新 PC
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
      kind: swimlane
      actors:
        - lane: ctl
          id: c
          label: 控制（取指/译码）
          highlight: true
        - lane: alu
          id: a
