  - CPU 按程序计数器指的位置，从内存取出一条指令。
- id: decode
  title: 译码：看懂要做什么
  tldr: CPU 拆开指令，弄清楚是什么操作、用哪些数据。
  body: '指令就是一串二进制，不同的位段分别表示“做什么”和“对谁做”。

    译码电路把它拆开，同时读出要用的寄存器里的值。

    这一步像解析一条 JSON 命令：先看 type，再取参数。'
  derivation: original
