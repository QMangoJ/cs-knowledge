  - id: isa
    title: 指令集 ISA：软硬件之间的一纸合约
    tldr: 只要守住同一套指令集（[[ISA]]）合约，同一份程序就能在十年后的新 [[CPU]] 上照样跑；不同合约（如 [[x86-64]] 与 [[ARM]]）的机器码则一条也不通用。
    body: |-
      指令集体系结构（[[ISA]]）是软件和硬件签好的一纸合约：它写明了处理器认哪些指令、二进制怎么编码、有多少个寄存器、访存与异常怎么处理。编译器只管按这份合约吐出机器码，芯片团队则可以在合约之下自由翻新缓存大小、流水线深度或乱序宽度——只要对外结果严丝合缝，老程序跨代升级照跑不误。[[x86-64]] 和 [[ARM]] 是两份互不相干的合约，编码和寄存器设计完全不同，所以编出来的机器码互不相通，跨架构必须重新编译或靠动态翻译器转译。

      两条主流设计哲学各有算盘：[[RISC]]（以 [[ARM]]、[[RISC-V]] 为代表）坚持指令定长规整、把 [[load]]/store 和算术运算彻底拆开，让译码前端简单省电；[[CISC]]（如 x86-64）允许指令长短不一、单条包揽访存加计算，代码体积更省，代价就是前面那步讲过的复杂译码与拆微操作前端。这层合约的最大价值在生态：操作系统和应用按 ISA 编一次，就能跑在所有兼容芯片上。
    derivation: original
    sources:
      - ref: cs61c
        locator: CPU datapath 相关讲义
        url: https://cs61c.org/
        claim: 指令集（ISA）规定 CPU 认哪些指令，同一份机器码只能在同一指令集的 CPU 上跑。
        status: verified
