  - id: walkthrough
    title: 完整走例：一条 load 的一生
    tldr: 把五级串起来走一遍带数字的 load，看每级输入输出分别是什么。
    body: 设指令内存 0x400000 处有指令 lw x5, 8(x6)，寄存器 x6 当前等于 0x1000。第一拍取指，PC 等于 0x400000，取出这条 4 字节指令，PC 暂更新为 0x400004。第二拍译码，拆出操作码是 load、目标寄存器 x5、基址 x6、立即数 8，同时读出 x6 的值 0x1000。第三拍执行，ALU 算有效地址 0x1000 加 8 等于 0x1008。第四拍访存，拿 0x1008 查数据缓存，假设命中，取出里面存的数值比如 42，未命中则这一级要拉长到上百个周期等数据回来，顺序模型里整机都得陪等。第五拍写回，把 42 写进 x5，指令结束，下一拍取 0x400004 处的下一条。注意每一级的输入都严格是上一级的输出，地址只能在执行级算、数据只能在访存级拿、写回只能在最后，这个先后关系是硬件连线决定的。流水线把五级叠起来后，相邻指令的这些依赖就变成要逐项检查的冒险，五级顺序模型不是过时的简化，而是读懂流水线时空图的坐标系。
    derivation: original
    sources:
