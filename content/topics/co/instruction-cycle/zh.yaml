  - id: micro-ops
    title: 真实 CPU 多一步：拆成微操作
    tldr: 五阶段是教学模型，真实 x86-64 先把复杂指令拆成微操作再乱序执行。
    body: 必须澄清一个边界，取指到写回的五阶段是对 RISC 风格处理器的干净抽象，不要把它当成 x86-64 的内部实拍。真实 x86-64 指令长短不一、一条指令能同时访存和运算，硬件前端先要切分指令边界、译码，再把每条复杂指令拆成若干个类 RISC 的微操作，比如一条内存加法会被拆成加载、加法、存储三步，微操作才进入后面的乱序调度、执行和退休环节。ARM 高性能核和 RISC-V 的复杂扩展也有类似的内部拆分。为什么要多这一层，因为乱序执行、寄存器重命名这些机制只适合在规整的小操作上做，拆分层把历史包袱挡在前端，保住后端设计的整洁。对软件的实际影响是，指令条数这个性能因子在 x86 上要按微操作数理解，一条看起来便宜的复杂指令可能展开成好几步，反汇编层面的指令数会低估真实工作量，用 perf 看微操作相关的计数才更接近真相。学习顺序上，先用五阶段建立心智模型，再知道它在哪里是简化，就不会被真实硬件的复杂性打乱阵脚。
    derivation: original
    sources:
