  - id: walkthrough
    title: 五拍串起来：lw x5, 8(x6) 的完整轨迹
    tldr: 把前面拆开的五步连回同一条时间线：地址 0x400000 的 lw x5, 8(x6)（x6=0x1000）一拍传一拍把 42 搬进 x5，每一级吃进的正好是上一级吐出的结果。
    body: |-
      逐拍串起这条指令的完整接力（设 x6=0x1000、地址 0x1008 存着 42）：第 1 拍取指，按 [[PC]]=0x400000 取出 4 字节指令，PC 暂加 4 成 0x400004；第 2 拍译码，拆出操作码 load、目标 x5、基址 x6 和偏移 8，同时读出 x6 的值 0x1000；第 3 拍执行，[[ALU]] 算出有效地址 0x1000 + 8 = 0x1008；第 4 拍访存，拿 0x1008 查数据缓存取回 42（若未命中则要等上两三百个周期）；第 5 拍写回，把 42 存进 x5，下一拍按 0x400004 取下一条。

      注意这条硬件连线决定的硬约束：地址最早在第 3 拍末算出来，内存数据最早在第 4 拍末拿到，结果直到第 5 拍才落进 x5。下一课把多条指令重叠进流水线后，这几处严格的时间先后就会变成要逐一化解的冒险——所以五级顺序模型不是过时的简化，而是读懂流水线时空图的坐标系。
    derivation: original
    sources:
      - ref: cs61c
        locator: CPU datapath 相关讲义
        url: https://cs61c.org/
