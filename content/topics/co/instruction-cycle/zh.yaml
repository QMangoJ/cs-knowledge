    log:
      - mode: 取指
        event: 读入一条指令
    points:
      - CPU 按程序计数器指的位置，从内存取出一条指令。
  - id: decode
    title: 译码：看懂要做什么
    tldr: CPU 拆开指令，弄清楚是什么操作、用哪些数据。
    body: 取回来的只是一串二进制位，译码阶段要把位段拆开读懂。RISC-V 这类定长格式里，低 7 位是操作码决定大类，中间位段给出源寄存器编号和目标寄存器编号，高位是立即数或功能码。以 add x3, x1, x2 为例，译码器认出这是寄存器加法，立刻并行读出 x1 和 x2 的当前值送往执行级，同时生成一串控制信号，告诉后面各级这条指令要用 ALU、不用访存、最后要写回 x3。这一步像解析一条结构化命令，先看类型字段再取参数，字段位置固定所以纯硬件并行拆解，一个周期内完成。译码还负责发现这条指令需要哪些资源，为流水线的冒险检测提供依据。x86-64 在这里要多一道工序，它指令变长、格式历史包袱重，要先切分指令边界再翻译成内部微操作，所以 x86 的前端比 RISC 复杂得多，功耗和面积都花在这里。
    derivation: original
    sources:
      - ref: cs61c
        locator: 指令格式与译码相关讲义
        url: https://cs61c.org/
        claim: 译码阶段解析操作码并读取寄存器
        status: verified
