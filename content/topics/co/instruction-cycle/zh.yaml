  - id: clock-perf
    title: 算性能总账：指令数 × CPI ÷ 主频
    tldr: 程序跑多快由三个因子决定：执行多少条指令、平均每条花几个周期（[[CPI]]）、每个周期多长；想提速只能从这三处下手，只看主频挑 [[CPU]] 肯定会看走眼。
    body: |-
      [[CPU]] 时间 = 指令数 × [[CPI]] ÷ 主频，三个因子各归各管。拿右边公式走一组数：10 亿条指令、平均 CPI 为 1.5、主频 3 GHz（每秒 30 亿拍），总耗时就是 10⁹ × 1.5 ÷ (3×10⁹) = 0.5 秒。如果靠代码优化或缓存改善把 CPI 降到 1.0，时间立马缩成约 0.33 秒——效果等同于把主频硬生生拉高到 4.5 GHz，却不用撞现代芯片最头疼的功耗墙与散热墙。

      三个因子分别找谁要优化？「指令数」归算法、语言和编译器管（换更优算法、开 -O2、用向量指令一条处理 16 个 float 都在砍它）；「CPI」反映平均每条指令耗时，算术密集负载的倒数 [[IPC|IPC（每周期指令数）]] 常在 2 到 4 之间，访存密集程序则会掉到 0.5 以下，perf stat 一测便知。千万记住公式里的 CPI 是全程序的平均账：一条没命中缓存的 load 就能拖慢两三百拍，足以把几百条 1 周期加法的平均数拉歪，排查慢代码要先找是谁在拉高 CPI。

      全课收成一句口诀和排慢三问：取译执访写五拍循环，PC 顺增也接跳转，复杂前端拆微操作，三因子算清性能总账；遇到一段代码跑得慢，先问三句——指令是不是写多了、CPI 是不是被访存或分支拉高了、主频有没有因过热降频。
    derivation: original
    sources:
      - ref: cs61c
