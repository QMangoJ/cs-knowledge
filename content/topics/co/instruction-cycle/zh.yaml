  - id: clock-perf
    title: 时钟与性能：什么决定快慢
    tldr: 程序耗时 = 指令条数 × 每条平均周期数 × 每周期时长。
    body: CPU 时间等于指令数乘以 CPI 再乘以时钟周期，也就是指令数乘 CPI 除以主频，三个因子各有主人。指令数由算法、语言和编译器决定，换个 O(n log n) 算法、开 -O2、用一条向量指令并行处理 16 个 float，都在削减它。CPI 是平均每条指令花的周期数，理想流水线接近 1，但缓存未命中、分支猜错、数据依赖都会把它推高，访存密集的程序 CPI 到 3 以上也不稀奇。时钟周期由工艺和微架构决定，主频不是越高越好，盲目拉高主频历史上撞过功耗墙。走例，10 亿条指令、CPI 为 1.5、主频 3 GHz，时间是 10 亿乘 1.5 除以 30 亿等于 0.5 秒；如果优化把 CPI 降到 1.0，时间立刻缩到约 0.33 秒，和换更高主频等效。所以只比主频选 CPU 是外行做法，perf stat 里直接给出指令数、周期数和算出的 IPC 即 CPI 的倒数，计算密集负载 IPC 经验上常在 2 到 4，访存密集常掉到 0.5 以下，先看这个数再判断瓶颈在哪一侧，是性能分析的第一手感。
