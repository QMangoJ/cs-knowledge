  - id: control-flow
    title: 控制流：PC 是怎么被改写的
    tldr: 顺序执行只是默认，分支、调用和返回都是在特定阶段改写 PC。
    body: 默认情况下 PC 每取一条就自增到下一条，程序直线前进。控制流指令的全部作用就是改写 PC。无条件跳转直接把目标地址装进 PC，下一轮取指就换了地方。条件分支要等执行级算出比较结果才决定装顺序地址还是目标地址，这个等待正是控制冒险的根。函数调用是特殊的跳转，它在改写 PC 之前还要把返回地址即当前 PC 的顺序后继存起来，x86-64 用 call 指令压栈，RISC-V 用 jal 写进链接寄存器，返回时再把存好的地址装回 PC。走一遍循环的 PC 轨迹更直观，一个 for 循环体 5 条指令，计数比较在末尾，条件成立时 PC 跳回循环头，不成立时顺序穿出，循环执行 100 轮，PC 就在这一小段地址上往返 100 次，指令缓存因此能全部命中，这也是循环跑得快的底层原因之一。异常和中断也是改写 PC，只是触发者是硬件事件，保存现场后跳到内核的处理入口，返回时恢复，机制上和函数调用同源。
    derivation: original
    sources:
