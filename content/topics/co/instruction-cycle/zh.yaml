id: co/instruction-cycle
subject: co
slug: instruction-cycle
order: 2
status: published
license: CC-BY-4.0
title: 一条指令是怎么执行的
summary: "[[CPU]] 执行程序的节拍出奇地统一：无论源码多复杂，落到硬件上都只是沿「取指→译码→执行→访存→写回」五个动作一圈圈循环。本课拿一条从内存读数的指令当主角，在五级教学模型里一拍一拍走完它的一生，顺带看清跳转、调用和循环怎样靠改写程序计数器 [[PC]] 实现。最后补齐真实 [[x86-64]] 前端拆微操作的真相，并落到算程序快慢的三因子公式。"
premise: 上一课把程序送进了内存，现在假设地址 0x400000 处躺着一条最常见的读内存指令 lw x5, 8(x6)——意思是去寄存器 x6 存的地址加 8 的位置，把数取出来放进 x5。这一课就让这条 [[load]] 指令在经典五阶段（[[RISC]] 教学）模型里从头跑到尾，看看每一步硬件到底在干什么、换颗处理器时快慢又差在哪。
position: 本课位于组成原理的「指令的执行」板块第一站，紧接上一课刚映射进内存的程序映像：代码已经躺在地址空间里，接下来看 [[CPU]] 怎样按 [[PC]] 指引一条条取出来执行。学完你能用指令数、[[CPI]] 与主频估算程序耗时，分清同为一条指令在不同处理器上快慢两样的原因，也为下一课把多条指令错峰叠进同一条流水线立好坐标系。
bridge:
  prev: 上一课靠符号解析与重定位把程序拼好并送进了内存地址空间。程序就位之后，这一课打开处理器，跟着一条机器指令看它从被取出到把结果存进寄存器的完整回合。
  next: 单条指令依次走完五步并不难，可硬件做完一条再做下一条时五套电路有四套都在闲着。下一课把多条指令错峰叠进同一条流水线，看看抢资源、等数据、猜分支这三类停顿怎么冒出来。
overview:
  - key: 一句话总结
    value: 执行一条指令按「取指→译码→执行→访存→写回」顺序过五关，再回到取指开始下一条；程序计数器推进顺序，跳转靠直接改写它。
  - key: 程序计数器
    value: 程序计数器（[[PC]]）记着下一条指令在哪，每执行完一条就往前走到下一条。程序能一条接一条跑下去靠的就是它，跳转和函数调用本质上就是改写它。
  - key: 寄存器
    value: 寄存器是 [[CPU]] 内部极快的小存储，数量不多，运算用的数据和结果大多放在这里。从寄存器取数几乎不用等，而去内存取一次要慢上百倍，所以编译器总想把热数据留在寄存器里。
  - key: 说明
    value: 五阶段是教学模型；真实的 [[x86-64]] 会先把复杂指令拆成更简单的微操作，再乱序、并行地执行
  - key: 指令集
    value: 指令集规定 CPU 认识哪些指令，x86-64 是 [[CISC]] 路线，指令复杂；[[ARM]] 和 [[RISC-V]] 是 [[RISC]] 路线，指令简单规整。各家的机器码互不通用，为 x86
      编译的程序拿到 ARM 上直接跑不了。
  - key: 性能公式
    value: 程序跑多久由公式决定，CPU 时间等于指令数乘以 [[CPI]] 再乘以时钟周期。想让程序变快只有三条路，少执行指令、让每条指令平均花的周期更少、或者把时钟频率提上去。
  - key: 控制流
    value: 顺序执行时 PC 自动往前走，遇到跳转和函数调用就是直接改写 PC。if 语句、循环、函数调用这些看起来很高级的控制流，落到硬件上全是改 PC 这一件事。
  - key: 在终端里看一看
    value: objdump -d ./a.out | less　看程序的机器指令
visual: swimlane
