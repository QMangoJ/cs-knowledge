level: 基础
minutes: 26
prereq:
  - co/compile-link
objectives:
  - 说出取指→译码→执行→访存→写回五级各自做什么
  - 用 CPI 与主频估算程序运行时间
  - 解释为什么同一条指令在不同 CPU 上快慢不同
aiLink: 估算推理延迟时绕不开这课的公式：时间 = 指令数 × CPI ÷ 主频。算子融合为什么能加速、向量指令为什么值钱，都能用指令数与 CPI 的变化来解释，而不是背结论。
quiz:
  - q: CPU 时间公式是？
    options:
      - 指令数 × 主频
      - 指令数 × CPI ÷ 主频
      - CPI × 内存大小
      - 主频 ÷ 指令数
    answer: 1
    explain: 三者缺一不可：少执行指令、每条更快、时钟更快都能缩短时间。
  - q: 写回（WB）阶段做什么？
    options:
      - 取下一条指令
      - 把执行结果写回寄存器堆
      - 访问内存读数据
      - 译码
    answer: 1
    explain: 结果先回寄存器，后续指令才能把它当操作数，形成流水线的数据通路。
  - q: 一条 load 指令慢，通常卡在？
    options:
      - 译码
      - 访存阶段等缓存/内存返回数据
      - 写回
      - 取指
    answer: 1
    explain: 访存延迟取决于缓存层级：L1 约几周期，内存要两三百个周期。
design:
  - mechanism: 把指令执行抽成取指、译码、执行、访存、写回五级顺序模型
    problem: 真实芯片里藏着微操作拆分、乱序执行和寄存器重命名，初学者一头扎进去，连一条指令怎么走完都跟不住，更别说算性能。
    choice: 先用干净的五级顺序模型立住坐标系，每一级只管一件事并把结果交给下一级，既能逐拍手推，又恰好对应下一课流水线的五个段。
    tradeoff: 顺序模型容易让人以为真实硬件也是排好队逐条执行，必须专门点破 x86 前端拆微操作和乱序退休的差异，才不会把教学模型当实拍。
    root: 复杂数据通路必须按功能切段才能分头验证与教学，阶段边界既定义了这节课的五步接力，也直接长成下一课流水线的分级线。
  - mechanism: 用指令集 ISA 锁住软硬件合约，再用三因子公式拆解性能账
    problem: 要是软件直接绑死某一代芯片的内部电路，处理器一升级软件就得重写，跑得慢也说不清到底该怪写代码的人还是做芯片的人。
    choice: 拿稳定的 [[ISA]] 当双方接口，硬件在接口之下悄悄进化；同时把跑多久拆成指令数、[[CPI]]、主频三因子，分别落到编译器/算法、微架构/缓存、工艺电路三家头上。
    tradeoff: 合约一旦签死就很难甩掉历史包袱（x86 至今要为几十年前的变长编码买单），而公式里的 CPI 只是平均数，容易掩盖单次缓存未命中拖垮几百拍的尖刺。
    root: 接口稳住之后两侧才能独立演进，而三因子公式正好把软件算法、微架构设计与芯片物理工艺三条曲线的责任清晰分开。
  - mechanism: 控制流全收敛成改写程序计数器 PC
    problem: 程序要跑判断、循环、函数调用和异常处理四种花样，如果硬件为每种分别建一套取指电路，控制逻辑会膨胀到没法维护。
    choice: 全部收口到 [[PC]] 这一个寄存器上：顺序执行默认加 4 零额外成本，其余情况只在各自对应的阶段把新目标地址写回 PC，取指级永远只认 PC。
    tradeoff: 条件分支必须等执行级算出比较结果才能定新 PC，这段等待在流水线里立刻放大成控制冒险，逼着芯片不得不靠猜分支方向来续命。
    root: 把「下一步执行哪」的状态收敛到单一真相源上，各种控制流才能正交组合，看懂谁在何时改写 PC 就看穿了所有跳转的底细。
