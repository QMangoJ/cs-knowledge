steps:
- id: fetch
  title: 取指：拿到下一条指令
  tldr: CPU 按程序计数器指的位置，从内存取出一条指令。
  body: '程序计数器（PC）记着下一条指令在哪。

    CPU 按这个地址把指令读进来，再让 PC 指向下一条。

    程序之所以能一条接一条往下走，靠的就是这个简单的机制。'
  derivation: original
  sources:
  - ref: cs61c
    locator: CPU datapath 相关讲义
    url: https://cs61c.org/
    claim: 处理器根据 PC 取指并更新 PC
