  - id: control-flow
    title: 控制流：if、循环和函数调用都在改写 PC
    tldr: 条件判断、循环和函数调用表面花样很多，落到硬件上全在做同一件事——把默认的 PC+4 覆盖成新的目标地址。
    body: |-
      默认情况下 [[PC]] 每取一条指令就自动加 4，程序直线往下跑。所有控制流语句的本质都是动手改写这个计数器：无条件跳转直接把目标地址塞进 PC，下一轮取指立马换赛道；条件分支则要等执行级比完大小，才裁决保留 PC+4 还是换去目标地址（这几拍的等待，正是下一课控制冒险的源头）。函数调用多做一步保存退路：在改写 PC 之前先把原本的顺序后继 PC+4 存下来（[[x86-64]] 用 call 压栈，[[RISC-V]] 用 jal 记进链接寄存器），函数返回时再把它装回 PC。

      拿一个具体循环轨迹看就一目了然：假设一个 for 循环体共有 5 条指令、摆在地址 0x400010 到 0x400020 之间，末尾一条条件分支负责跳回循环头。循环跑 100 轮时，PC 就在这一小段 20 字节的地址里来回打转 100 次，最后条件不成立才顺着落到 0x400024——指令缓存因此几乎次次命中。异常和硬件中断也是同一个机制，只是触发方换成了硬件事件：保存当前现场后把 PC 切到内核处理入口，处理完再恢复回来。
    derivation: original
    sources:
