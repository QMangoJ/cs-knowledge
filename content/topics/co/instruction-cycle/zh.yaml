level: 基础
minutes: 26
prereq:
  - co/compile-link
objectives:
  - 说出取指→译码→执行→访存→写回五级各自做什么
  - 用 CPI 与主频估算程序运行时间
  - 解释为什么同一条指令在不同 CPU 上快慢不同
aiLink: 估算推理延迟时绕不开这课的公式：时间 = 指令数 × CPI ÷ 主频。算子融合为什么能加速、向量指令为什么值钱，都能用指令数与 CPI 的变化来解释，而不是背结论。
quiz:
  - q: CPU 时间公式是？
    options:
      - 指令数 × 主频
      - 指令数 × CPI ÷ 主频
      - CPI × 内存大小
      - 主频 ÷ 指令数
    answer: 1
    explain: 三者缺一不可：少执行指令、每条更快、时钟更快都能缩短时间。
  - q: 写回（WB）阶段做什么？
    options:
      - 取下一条指令
      - 把执行结果写回寄存器堆
      - 访问内存读数据
      - 译码
    answer: 1
    explain: 结果先回寄存器，后续指令才能把它当操作数，形成流水线的数据通路。
  - q: 一条 load 指令慢，通常卡在？
    options:
      - 译码
      - 访存阶段等缓存/内存返回数据
      - 写回
      - 取指
    answer: 1
    explain: 访存延迟取决于缓存层级：L1 约几周期，内存要上百周期。
design:
  - mechanism: 指令执行被抽象成取指、译码、执行、访存、写回五级顺序模型，每级只做一件事并把结果传给下一级。
    problem: 真实处理器内部有乱序、重命名、微操作等大量机制，初学者若直接面对真实硬件，连一条指令如何完成都无从追踪，更谈不上算性能。
    choice: 先用五级顺序模型建立坐标系，它足够简单可以逐拍手推，又足够真实，五级划分和真实流水线一一对应，后续学的冒险全是这个模型的推论
    tradeoff: 代价是模型会给人顺序执行的错觉，需要专门澄清 x86 的微操作拆分和乱序退休，否则会把教学抽象误当成硬件实拍而产生错误直觉。
    root: 根源是分而治之的工程方法，任何复杂数据通路都要先按功能切成可独立验证的阶段，阶段边界既是教学边界，也是真实硬件的流水级边界。
  - mechanism: ISA 作为软硬件合约固定下来，编译器只对合约负责，微架构在合约之下自由演进，性能用指令数乘 CPI 除以主频刻画。
    problem: 如果软件直接绑定某代硬件的内部实现，硬件每改进一次软件就要重写，生态无法积累，性能也无从跨机器比较和归因。
    choice: 用稳定的指令集解耦两侧，再用三因子公式把性能拆给三个责任方，算法和编译器管指令数，微架构管 CPI，工艺和电路管主频。
    tradeoff: 合约稳定的代价是历史包袱甩不掉，x86 要为几十年前的编码兼容付出前端复杂度，公式里的 CPI 也只是平均值，掩盖了不同指令延迟的巨大差异
    root: 根源是接口稳定才能让两侧独立优化这一系统规律，公式的三个因子正好对应软件、微架构、工艺三条独立演进的曲线，缺一不可。
  - mechanism: 控制流统一归结为改写 PC，顺序自增是默认，分支、调用、返回、异常都只是不同触发条件下的 PC 赋值。
    problem: 程序需要循环、条件、函数和异常处理，表面上四种机制各不相同，如果硬件为每种都设计一套独立通路，控制逻辑会复杂到难以验证。
    choice: 收敛到一个寄存器上，默认自增保证直线执行零成本，其余控制流都在各自合适的阶段把目标地址写进 PC，取指级永远只认 PC。
    tradeoff: 统一带来的代价是条件分支必须等执行级出结果才能定 PC，这个等待在流水线里放大为控制冒险，只能靠分支预测这种概率手段来填补。
    root: 根源是把状态收敛到单点就能让机制正交组合，PC 是程序执行位置的唯一真相源，理解了谁在何时改写它，所有控制流问题都有落点。
