- id: isa
  title: 指令集：软件和硬件之间的约定
  tldr: 指令集（ISA）规定 CPU 认哪些指令，同一份机器码只能在同一指令集的 CPU 上跑。
  body: 'x86-64 和 ARM（如手机、Apple M 系列芯片）是两种不同的指令集，编译出来的机器码互不通用。

    RISC 风格的指令格式整齐、每条只做简单的事；x86-64 属于 CISC，一条指令能做较复杂的事，长度也不固定。

    指令集就像接口文档：只要约定不变，CPU 内部怎么实现都可以随便改。'
