  - id: memory
    title: 访存：需要时读写内存
    tldr: 只有读写内存的指令才真正访问内存，其余直接跳过。
    body: 只有 load 和 store 这类指令会真正走访存阶段，其余指令这一步直接穿过什么都不做。load 把执行级算出的有效地址先送地址翻译，把虚拟地址换成物理地址，同时查数据缓存，命中就把数据取回，未命中则向下一级缓存乃至内存发请求，整条流水线或至少这条指令要停下来等。对照着记延迟量级，寄存器访问不到 1 个周期，L1 命中约数个周期，主存则要上百个周期，访存因此是整条指令生命周期里最可能卡住的一站。store 在这一级把寄存器值写入缓存行并标脏，注意它不需要写回阶段了。编译器拼命把热点变量留在寄存器、把循环里反复用的数组元素提出来复用，本质都是在躲这一级的延迟。还有一个容易漏的点，访存次序涉及内存模型，多核下 store 的可见时机并不等于执行时机，那是内存一致性模型的话题，这里先建立单核视角，访存就是按地址读写缓存背后的那份数据。
    derivation: original
    sources:
