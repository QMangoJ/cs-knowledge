- id: clock-perf
  title: 时钟与性能：什么决定快慢
  tldr: 程序耗时 = 指令条数 × 每条平均周期数 × 每周期时长。
  body: 'CPU 由时钟驱动，主频 3GHz 表示每秒 30 亿个周期。

    程序快慢取决于三件事：要执行多少条指令（算法和编译器决定）、平均每条要几个周期（CPI，受流水线和缓存影响）、一个周期多长（主频）。

    所以只比主频不够：缓存命中差、分支总猜错的程序，主频再高也慢。


    工程注记：矩阵乘算子用 AVX-512 后一条指令能处理 16 个 float，可向量化的那段循环指令数最多降至约 1/16（整体收益还受访存与不可向量化部分限制）——这就是 SIMD 对推理加速的本质：不是时钟变快，而是指令数变少。


    工程注记：perf stat 一次给出 instructions、cycles 与算出的 IPC（=1/CPI）：计算密集型算子 IPC 经验上常在 2–4，访存密集型常掉到 0.5 以下（经验范围，依微架构与负载实测）——先看 IPC 再猜瓶颈，是性能分析的基本功。'
  derivation: original
  sources:
  - ref: cs61c
    locator: CPU datapath 相关讲义
