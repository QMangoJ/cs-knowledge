  - id: execute
    title: 执行：做计算
    tldr: 运算单元（ALU）完成加减、比较或算出内存地址。
    body: 执行阶段是 ALU 真正干活的地方。ALU 是组合逻辑电路，输入操作数和运算种类，输出结果和几个标志位，比如结果是否为零、是否溢出。对加法指令它算两数之和，对比较指令它实际做减法只保留标志，对 load 指令它并不读内存，而是把基址寄存器加偏移算出有效地址交给访存阶段。走例，load 要取地址为 x2 的值加 8 的地方，执行级算出 x2 内容 0x1000 加 8 得 0x1008，后面访存就照这个地址去取。分支指令也在这里见分晓，条件比较的结果出来后决定 PC 用顺序地址还是目标地址，这个决定做得越晚，流水线猜错的代价越大，所以现代 CPU 会在更早的阶段就配专门的加法器算分支目标并做预测。运算延迟各不相同，整数加法 1 个周期，乘法数个周期，除法和浮点更久，这也是乱序执行要按延迟调度指令的原因，一条慢指令不该堵住后面不相干的快指令。
    derivation: original
    sources:
