          from: m
          to: c
          label: 按 PC 记着的地址，从指令缓存取出这条指令
          active: true
    log:
      - mode: 取指
        event: 读入一条指令
    points:
      - CPU 按程序计数器指的位置，从内存取出一条指令。
  - id: decode
    title: 译码：拆开二进制位段，读出基址寄存器
    tldr: 取回来的 lw x5, 8(x6) 在硬件眼里只是一串 32 个二进制位；译码器按固定位段并行拆出操作类型、基址寄存器 x6、偏移量 8 与目标寄存器 x5，并当场读出 x6 的值。
    body: |-
      在 [[RISC-V]] 这类定长指令格式里，每个字段占哪几位是硬件连线写死的：低 7 位是操作码决定指令大类，中间位段分别放目标寄存器和源寄存器编号，高位则放偏移量立即数或功能码。拿本课主角 lw x5, 8(x6) 来说，译码器不必从头到尾逐位摸索，而是把所有位段在同一个周期内同时拆开：认出这是读内存操作、基址在 x6、偏移量是 8、结果写回 x5，立刻去寄存器堆读出 x6 的当前值（假设是 0x1000），并生成控制信号告诉后面几级「用 [[ALU]] 做加法、要去读数据缓存、最后写回 x5」。

      顺带对比加法指令 add x3, x1, x2，就能看清控制信号怎样切路线：译码器同样按固定位段同时拆出操作码与寄存器号，但这次读出的是两个源寄存器 x1 和 x2，告诉 ALU 把它俩相加，同时关闭内存读写信号、把目标定成 x3。相比之下，[[x86-64]] 指令长短不一（1 到 15 字节），译码前端还得先切分指令边界再翻译成内部微操作，比 [[RISC]] 复杂得多。
    derivation: original
    sources:
      - ref: cs61c
        locator: 指令格式与译码相关讲义
        url: https://cs61c.org/
        claim: 译码阶段解析操作码并读取寄存器
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
    canvas:
