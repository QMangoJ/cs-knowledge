- id: execute
  title: 执行：做计算
  tldr: 运算单元（ALU）完成加减、比较或算出内存地址。
  body: 'ALU 是 CPU 里真正“算数”的电路。

    对加法指令，它算出两数之和；对我们这条读内存的指令，它算出要访问的地址。

    跳转指令也在这里判断条件，决定下一条该去哪里。'
  derivation: original
