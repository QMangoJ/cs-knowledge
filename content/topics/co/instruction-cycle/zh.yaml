  - id: writeback
    title: 写回：保存结果，进入下一轮
    tldr: 把结果写进目标寄存器，一条指令结束，下一条开始。
    body: 写回阶段把结果送回寄存器堆里由译码时记下的目标寄存器编号指定的那一格，写完这一刻，这条指令的成果才对后续指令可见，指令正式退休。寄存器堆通常设计成同一周期前半拍写、后半拍读，这样下一条指令在它译码读寄存器时正好能读到刚写回的新值，流水线一课里时空图的停顿计算就建立在这条约定上。不是每条指令都有写回，store 和分支就没有目标寄存器，这一级对它们是空转。五级走完，CPU 回到取指取下一条，周而复始，主频 3 GHz 意味着这样的节拍每秒走 30 亿次。单周期或五级顺序执行的模型到这里闭环了，但真实 CPU 不会傻等一条走完才取下一条，而是把多条指令的不同阶段叠起来，这正是流水线要解决的问题，而五级模型里的每一级划分、每一处数据依赖，都会原封不动地变成流水线里的冒险来源，先把这一课的顺序模型吃透，后面全是它的推论。
    derivation: original
    sources:
