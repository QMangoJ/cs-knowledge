  - id: memory
    title: 访存：只有读写内存指令才会停这一步
    tldr: 拿着执行级算出的地址 0x1008，这一步才真正去查数据缓存取回数据 42；只有 [[load]] 和 store 会动用内存通路，算术指令在这一步直接空手穿过。
    body: |-
      到了这一步，主角 lw x5, 8(x6) 拿着刚才算出的地址 0x1008 真正去找数据。需要注意 0x1008 还是虚拟地址，硬件会先把它翻译成物理地址，再拿去查一级数据缓存：命中就直接把里面的数（假设是 42）取回来；要是各级缓存全没命中，就只能一路去主存请求，整条流水线或至少这条指令得停下来干等。

      对比一下耗时就能明白为什么程序员这么怕「没命中」：读寄存器不到 1 个周期，一级缓存命中大约几个周期，去主存拿一次却要两三百个周期——访存因此成了五步里最容易卡脖子的环节。注意只有 [[load]] 和 store 会真正停留在这里（store 把寄存器值写进缓存行并标脏后就结束了，不再走下一步写回），普通加减乘除指令在这一级直接穿过。编译器拼命把热点变量留在寄存器里，躲的就是这几百个周期的落差。
    derivation: original
    sources:
      - ref: cs61c
        locator: datapath 相关讲义
