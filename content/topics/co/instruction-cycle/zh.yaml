          label: 拆出 lw 的位段，读出基址寄存器 x6 的值
          active: true
    log:
      - mode: 译码
        event: 确定是“读内存”，读出地址所在的寄存器
  - id: execute
    title: 执行：ALU 把基址加偏移算出内存地址
    tldr: 对 lw x5, 8(x6) 来说，执行阶段不是去读内存，而是先让 [[ALU]] 把基址 x6（0x1000）加上偏移 8，算出要访问的有效地址 0x1008。
    body: |-
      执行阶段是 [[ALU]]（算术逻辑单元）真正干活的地方。ALU 是纯组合逻辑电路：输入两个操作数和运算类型，立刻吐出结果以及零标志、溢出标志等状态位。回到主角 lw x5, 8(x6)：译码阶段已经从 x6 读出了基址 0x1000，这里 ALU 把 0x1000 加上偏移 8，算出有效地址 0x1008，再顺手递给下一级去查数据缓存。

      顺带看其他指令在这拍干什么：对加法指令，ALU 算两数之和后直接跳过下一拍访存；对条件分支，ALU 靠做减法看零标志是否为真，当场裁决下一拍 [[PC]] 走顺序地址 0x400004 还是跳转到新位置——这个决定出得越晚，流水线猜错分支时作废的指令就越多。还要记住各种运算快慢不一：整数加减只要 1 个周期，乘法要几个周期，除法和浮点运算则要十几个甚至几十个周期，这也是现代乱序核按延迟调度指令、不让慢指令堵住后面快指令的原因。
    derivation: original
    sources:
      - ref: mit-6004
        locator: 处理器设计相关讲义
        url: https://ocw.mit.edu/courses/6-004-computation-structures-spring-2017/
