  - id: micro-ops
    title: 真实 CPU 的前端：复杂指令要先拆成微操作
    tldr: 五阶段是 [[RISC]] 的教学坐标系，真实 [[x86-64]] 处理器并不会直接按它跑复杂指令，而是先在前端把一条指令拆成几个类 RISC 微操作再送进后端乱序执行。
    body: |-
      必须把模型和真实芯片的边界划清：取指到写回的五阶段模型是对 [[RISC]] 处理器的干净抽象，千万别当成 [[x86-64]] 的内部实拍。真实 x86-64 指令长短不一（1 到 15 字节），而且单条指令就能同时干读内存、做加法、再写回内存三件事——比如把内存某格里的数直接加 1。

      遇到这种「大包大揽」的指令，x86-64 前端译码器会先切出指令边界，再把它拆成三条规整的类 RISC 微操作（读数加载、算术加 1、写回存储），然后才交给后端做乱序调度、寄存器重命名和退休。多出这层拆分是为了两头讨好：既能把历史兼容的复杂编码挡在前端、保住后端电路的简洁统一，又能继续运行几十年前的老软件。对写程序的人也有直接影响：反汇编看到的 1 条 x86 复杂指令，底层可能展开成好几条微操作，不能单靠肉眼数汇编行数去估真实耗时。
    derivation: original
    sources:
      - ref: mit-6004
