id: co/compile-link
subject: co
slug: compile-link
order: 1
status: published
license: CC-BY-4.0
title: C 代码怎么变成能运行的程序
summary: 从 hello.c 到屏幕上的 hello，中间经过编译、汇编、链接、加载四道工序。
premise: 以 Linux 上用 gcc 编译 hello.c 为例。
overview:
  - key: 一句话总结
    value: 预处理 → 编译成汇编 → 汇编成机器码 → 链接成可执行文件 → 加载进内存运行
  - key: 为什么分步
    value: 每一步只解决一个问题，各自可替换、可缓存
  - key: Linux 上的格式
    value: 目标文件和可执行文件都是 ELF 格式
  - key: 类比
    value: 前端的 TypeScript 编译 + 打包（webpack/Vite）+ 浏览器加载
  - key: 四个阶段
    value: 预处理（.i）→ 编译（.s）→ 汇编（.o）→ 链接（可执行文件）
  - key: 静态 vs 动态链接
    value: 静态把库拷进来、独立好部署；动态共享库、体积小、可单独升级
  - key: 常见报错
    value: undefined reference = 缺定义；multiple definition = 定义重复
  - key: 在终端里看一看
    value: gcc -S hello.c　生成 hello.s 看汇编；ldd ./a.out　看程序依赖哪些动态库
visual: swimlane
lanes:
  - id: tools
    label: 工具链
  - id: files
    label: 文件
  - id: os
    label: 操作系统
logColumns:
  - key: mode
    label: 当前状态
  - key: event
    label: 发生了什么
steps:
  - id: why
    title: 为什么需要“翻译”
    tldr: CPU 只认识机器码，人写的 C 代码它看不懂。
    body: CPU 只能执行一串串二进制指令，而且不同指令集的编码互不相通，x86-64 的机器码拿到 ARM 上一条也跑不了。人写的 C 代码是给人读的文本，变量名、类型、花括号这些信息 CPU 一概不认识。所以需要一整条工具链做翻译，把人能读、能维护的源代码，逐级变成某种 CPU 能直接执行的机器码，还要在翻译过程中查错和优化。这和 TypeScript 要先编译成 JavaScript 才能在浏览器里跑是同一个道理，区别是 C 的工具链还要负责把多个源文件和现成的库拼装成一个完整程序。把翻译拆成多步还有工程上的好处，每一步只解决一个问题，出错时能定位是哪一步，改一行代码时也只需重做受影响的那几个文件，这正是后面增量编译能成立的前提。这一段的每个数字和结论都应当能自己复算或手推一遍，读时先遮住结论自测，再对照正文核对差在哪一步。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 1 章
        url: http://csapp.cs.cmu.edu/
        claim: 程序从源代码经翻译系统变为可执行文件
