  - id: link
    title: 链接与动静取舍：拼装时把库拷死还是留索引
    tldr: 链接器按第 5–6 步的规则完成符号配对与段合并后，得做一道工程选择题：静态链接把库整段拷进程序、单文件走天下，动态链接只留索引、共享代码省内存。
    body: |-
      到了 gcc a.o b.o -o app 这一步，链接器把所有目标文件和标准库攒在一起，用第 5 步的符号表配齐外部引用、按第 6 步合并同名段并回填重定位地址，吐出完整的可执行 [[ELF]] 文件。如果你链接的是静态库（.a，本质上是一捆 .o 的打包归档），链接器只把你真正用到的那几个 .o 成员整段拷进 app。

      工程上静态链接和动态链接各有明白的账。静态链接产出的 app 自包含、不挑运行环境，丢进最精简的容器就能跑（Go 语言默认走的就是这套单文件路线）；代价是每个程序都塞进一份库副本、磁盘和镜像体积暴涨，而且标准库爆出安全漏洞时，必须把所有程序全部重新链接发版一遍。

      Linux 下 [[gcc]] 默认走动态链接：app 里根本不含 printf 的机器码，只写明依赖 libc.so.6，并留下第 7 步讲过的 PLT/GOT 入口。多个进程在内存里共用同一份只读的库代码页，省内存、升级库只需换掉 .so 并重启进程；代价则是部署时得管好机器上的 .so 版本矩阵，稍不注意就会撞上线上环境缺少某个 GLIBC 版本符号的报错。右边三条命令串起了从独立编译到用 nm 检查文本段符号的完整实操。
