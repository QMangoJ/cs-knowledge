steps:
  - id: why
    title: 为什么需要翻译：CPU 看不懂 C 语言
    tldr: "[[CPU]] 只认识固定编码的二进制机器码，看不懂人写的变量名、类型和花括号；工具链把源码逐级翻成机器码并拼起外部库，同时为增量构建留出接口。"
    body: |-
      [[CPU]] 硬件电路只认一串串二进制操作码，而且不同架构的编码互不相通——为 [[x86-64]] 编好的机器码拿到 [[ARM]] 上一条也跑不了。你写进 hello.c 的 #include、变量类型、花括号和 printf("hello\n") 全是给人和编译器看的符号，处理器一概不认识，所以必须靠工具链一步步翻成二进制指令，顺带做语法检查与性能优化。

      翻译不是单纯换个写法，还会丢掉大量源码信息。变量名、类型检查这些约束用完即弃，机器码里基本不留痕迹；程序线上崩了想对回第几行源码，全靠编译时额外加进来的调试表（如 -g）。拆成预处理、编译、汇编、链接四站也有硬核工程理由：每站只解一个问题、把结果落成中间文件，出错能知道卡在哪一站，改一个文件也只需重做受影响的那几个产物。

      顺带提一句这道工序的来历：早期程序员直接手写机器码或汇编助记符，程序稍大就慢得受不了还极易写错，人们干脆把「翻译」本身做成程序——先有汇编器自动查表，1957 年的 FORTRAN 编译器又把接近数学公式的高级语言自动翻成机器码，分层工具链由此定型。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 1 章
        url: http://csapp.cs.cmu.edu/
        claim: 程序从源代码经翻译系统变为可执行文件
