  - id: preprocess-opt
    title: 预处理与优化：先机械贴文本，再按语义改写
    tldr: 编译前后夹着两个脾气相反的动作：预处理完全不懂代码意思，只按指令拼接替换出 hello.i；优化器则吃透语义后改写低效写法，底线是不改变对外结果。
    body: |-
      预处理是纯文本操作，不理解任何 C 语法。#include <stdio.h> 做的事和复制粘贴没区别，它会把头文件里几百行函数声明（包含 printf 的签名）原封不动插进 hello.c；#define 做字符串替换，#ifdef 按条件删掉段落，最后吐出一个几千行的纯 C 文本 hello.i。正因为只是复制粘贴，同一份头文件被包含几遍就会展开几遍，所以才需要头文件保护宏（#ifndef）防止重复声明；也正因它不懂语法，宏定义里写错个括号，要到下一步编译器解析 hello.i 时才会报错。

      编译器读懂语义之后，轮到优化器上场。常见手段包括常量折叠（在编译期直接把 3 + 5 算成 8）、死代码消除（删掉永远走不到的分支）、函数内联（把短小函数体直接贴到调用点，省掉调用和返回开销），以及把每轮结果都不变的计算挪到循环外（[[循环不变式]]外提）。

      拿一个具体画面看优化有多激进：假如你在循环里反复调用一个两行长的 getter 函数，开 -O0 时每轮都会实打实跳转一次，开 -O2 后整个函数调用可能被内联后直接化简没影。所以拿 -O0 的汇编去猜 -O2 的性能一定会看走眼——只要对外可观察行为不变，编译器就有权彻底重构你的写法。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 1 章
        url: http://csapp.cs.cmu.edu/
        claim: 编译前先做文本替换，编译时还会大胆改写代码，只要结果不变。
