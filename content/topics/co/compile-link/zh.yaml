  - id: preprocess-opt
    title: 预处理与优化
    tldr: 编译前先做文本替换，编译时还会大胆改写代码，只要结果不变。
    body: "预处理是纯文本游戏，不理解语义。#include 把头文件原样插入，#define 做字符串替换，#ifdef 按条件删段落，产物是一个几千行的纯 C 大文件，用 gcc -E 能看到。一个常见误解是以为 #include 有什么智能加载，其实它和复制粘贴没有区别，头文件被包含几次就展开几次，这也是头文件保护宏存在的原因。进入编译后优化器才开始动脑，常量折叠把 3 加 5 在编译期算成 8，死代码消除删掉永远走不到的分支，内联把小函数的函数体直接贴进调用处省掉调用开销，循环不变式外提把每轮都算同一个值挪到循环外。走例，一个在循环里反复调用的短 getter，-O2 下可能整段消失，变量直接留在寄存器里，所以拿 -O0 的汇编去推断 -O2 的性能会完全错位。这像前端打包的 tree shaking 和压缩，产物面目全非但行为等价，前提是编译器恪守不改变可观察行为这条底线。"
    derivation: original
    sources:
