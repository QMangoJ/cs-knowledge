level: 基础
minutes: 26
prereq: []
objectives:
  - 按顺序说出预处理→编译→汇编→链接四步的产物
  - 用符号表解释未定义符号错误
  - 分清静态链接与动态链接的取舍
aiLink: 推理服务部署时满屏的 .so、符号未定义、glibc 版本问题都来自这一课：CUDA/ONNX Runtime 的动态库加载、Python 扩展模块（torch 的
  .so）本质都是链接与加载。看懂符号与重定位，排这类错就不再靠玄学。
quiz:
  - q: 链接器报 undefined reference，通常是？
    options:
      - 语法错
      - 某个符号只有声明没有定义（或没把实现的目标文件/库链进来）
      - 内存不足
      - CPU 不支持
    answer: 1
    explain: 编译只查声明，符号的定义由链接器在全部目标文件与库里配对。
  - q: 动态链接相比静态链接的代价是？
    options:
      - 二进制更大
      - 运行时要加载并重定位共享库，启动稍慢；多进程共享同一份库省内存，库还可单独升级（重启进程后生效）
      - 不能跨平台
      - 不支持函数调用
    answer: 1
    explain: 多个进程共享同一份 .so 的代码页，这正是虚拟内存共享映射的应用。
  - q: 头文件里应该放什么？
    options:
      - 函数定义
      - 声明（函数原型、类型、extern 变量）
      - main 函数
      - 全局变量定义
    answer: 1
    explain: 定义放多个 .c 里会造成重复定义；头文件只声明，链接器最后统一配对。
design:
  - mechanism: 翻译拆成预处理、编译、汇编、链接、加载接力完成
    problem: 要是一口气把 C 源码直接变成内存映像，中间哪个环节出错都说不清卡在哪，改一行代码也只能全盘重头再编一遍。
    choice: 用 .i、.s、.o 和 [[ELF]] 这些标准中间文件把流程切段，每步只管一件事，既能分段报准错误，也能让构建工具复用没改动的 .o。
    tradeoff: 信息沿流水线逐级丢失——编译器懂类型、链接器只认符号名，报不出友好的类型错；优化也被拆成编译期和链接期两截，全局优化更费劲。
    root: 只有把大流程切成靠稳定文件接口衔接的小工序，工具链才能像积木一样各自演进、缓存复用和并行加速。
  - mechanism: 动态链接靠 PLT 跳板和 GOT 间接表把绑定推迟到运行时
    problem: 静态链接把公共库拷进每个程序，几百个进程会在磁盘和内存里存几百份重复代码；库修一个漏洞还得把全站所有程序重新链接发版。
    choice: 程序只记依赖库名和符号，留出只读的 [[PLT]] 跳板与私有的可写 [[GOT]] 地址表，运行时映射同一份共享库页、再按需把真实地址填进表里。
    tradeoff: 每次调库多跳一次指针、首次调用带一点查找停顿，线上部署还多出共享库版本不匹配或找不到 .so 的运维麻烦。
    root: 只读代码页要靠多进程共享才能省内存，绝不能去改机器指令本身，所以只能把「每次启动都会变的地址」隔离进每人私有的可写地址表。
  - mechanism: 符号解析用强弱规则裁决跨文件同名冲突
    problem: 每个源文件分开编译、彼此看不见实现，万一两个文件定义了同名的函数或全局变量，链接器必须有一套与输入顺序无关的死规矩。
    choice: 规定函数和已初始化变量为强符号、未初始化全局变量为弱符号（[[公共块]]）：强符号不能重复、强能压过弱、弱弱合并取大，逼着大家把声明放头文件、定义放源文件。
    tradeoff: 弱符号合并的历史宽容会悄悄掩盖两份代码误用同一全局名的真 bug，现代编译器默认收紧这项规则正是为了早早拦住隐患。
    root: 分别编译下每个文件手里只有局部视野，只有掌握全局符号表的链接器才有资格按确定规则拍板谁该留下来。
