  - id: symbols
    title: 符号与重定位
    tldr: 目标文件里有一张符号表：我提供什么、我缺什么。
    body: 每个目标文件都带一张符号表，这是理解链接的钥匙。符号分三类，全局符号是本文件定义、别处可用的函数和全局变量，外部符号是本文件引用、等别人定义的，比如 printf，本地符号是只在本文件可见的静态函数和变量。链接器做符号解析，就是把每个外部引用和唯一的全局定义配上对。两个经典错误由此而来，多个强符号同名叫 multiple definition，找不到任何定义叫 undefined reference。强弱规则要记牢，函数和已初始化全局变量是强符号，未初始化全局变量在传统规则下是弱符号即公共块，强符号可以覆盖弱符号，两个弱符号取大的那块，这解释了为什么头文件里放未初始化变量定义有时不报错、放函数定义必报错。工程上分清发生期最重要，undefined reference 是构建期少链了库，cannot open shared object file 是运行期找不到 .so，排错方向完全不同，先看错误出现在哪一期就快了一半。
    derivation: original
    sources:
