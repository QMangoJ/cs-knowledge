  - id: compile
    title: 编译：C 变成汇编
    tldr: 编译器理解程序的意思，并翻译成和 CPU 指令一一对应的汇编。
    body: gcc 处理一个 hello.c 时，内部其实串了几个独立程序。先是预处理器展开头文件和宏，接着真正的编译器理解程序语义，做类型检查和优化，最后输出汇编代码，也就是 hello.s。用 gcc -S 就能亲手停在这一站看产物。汇编是机器指令的可读版，助记符一行大致对应一条指令，寄存器名和立即数都明明白白。编译器在这一步的自由度最大，同一个表达式，它可以选不同的指令序列、把变量留在寄存器里、重排运算顺序，只要可观察结果不变。优化等级的影响也在这里显形，-O0 几乎逐句直译，方便调试但慢，-O2 会内联、删死代码、做循环变换，汇编和源码看起来面目全非。记住一个判断，语法错误和类型错误在这一站被拦下，因为只有编译器真正理解程序的含义，后面的汇编器和链接器都不懂 C 语义。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 1 章、第 3 章
        url: http://csapp.cs.cmu.edu/
        claim: 编译器将 C 翻译为汇编程序
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
