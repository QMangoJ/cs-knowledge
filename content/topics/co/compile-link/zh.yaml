  - id: assemble
    title: 汇编：把 hello.s 翻成带缺口的目标文件
    tldr: 汇编器把 hello.s 逐行查表翻成二进制机器码 hello.o，但 hello.o 还跑不起来——call printf 的跳转目标地址空着，只在重定位表里留了待填清单。
    body: |-
      从汇编到机器码几乎是机械的查表翻译：汇编器逐条把助记符换成二进制指令编码、排好每条指令在本文件里的偏移，生成目标文件 hello.o（用 objdump -d 就能反汇编回来看）。因为这一步只看指令格式不管程序语义，汇编器几乎不挑错，除非手写内联汇编拼错了指令名。注意分清两种目标文件：hello.o 是还要继续拼装的「可重定位目标文件」，而 .so 是运行时才加载的「共享目标文件」。

      等一下，既然 hello.o 已经是真机器码，为什么还不能直接运行？因为 hello.c 里没有 printf 的代码。汇编器遇到 call printf 时根本不知道 printf 将来会被放去哪，只能在机器码里先塞个占位值（例如全 0），同时在两张表里做记号：一张是「重定位表」，记清「文件偏移 X 处将来要填进符号 printf 的地址（还要加减多少偏移）」；另一张是「符号表」，列清本文件提供了哪些函数、还缺哪些外部函数等别人来补。
    derivation: original
    sources:
