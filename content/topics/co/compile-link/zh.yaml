  - id: symbols
    title: 符号表与强弱规则：链接器怎么配对缺口
    tldr: 每个 .o 文件都带着一张「我提供什么、我缺什么」的符号表；链接器把外部引用配成唯一全局定义，找不到就报 undefined reference，重名冲突就报 multiple definition。
    body: |-
      单独编译 hello.c 时，编译器只靠头文件看到了 printf 的长相，根本看不见实现本身。这个「各自编译、信息不全」的前提，决定了每个 .o 都必须带一张符号表。表里分三类条目：全局符号是本文件定义、可以借给别人的函数和全局变量（如 main）；外部符号是本文件点了名、要等别人交货的引用（如 printf）；本地符号是加了 static 的函数和变量，只归自己内部用，绝不和外界混名。

      链接器做符号解析，就是拿所有 .o 和库里的符号表一对一配账，两个高频报错全从这里冒出来：找不到任何实现叫 undefined reference，通常是构建命令里漏传了对应的 .o 或库（注意别和运行期的 cannot open shared object file 混淆，后者是程序已编出但运行时找不到 .so）；同一个名字出现了两份强定义叫 multiple definition，链接器不知道该听谁的。

      还有一个常让人困惑的现象：为什么头文件里放函数定义一包含就报错，放个未初始化全局变量有时却能编过？这背后是强弱符号规则——函数和已初始化全局变量是强符号，未初始化全局变量按传统规则算弱符号（[[公共块]]）。强符号唯一且能压过弱符号，两个弱符号则会悄悄合并成占内存较大的那一份；不过为了堵住这种隐蔽 bug，现代编译器（如 GCC 10 起默认开启 -fno-common）也已经开始严查重名未初始化全局变量。
