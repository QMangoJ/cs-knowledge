  - id: plt-got
    title: 动态链接怎么找到函数：PLT 与 GOT
    tldr: 动态库加载地址每次运行都可能变，代码段又只读且多进程共享；程序于是靠 [[PLT]] 跳板加可写的 [[GOT]] 地址表间接跳转，把 printf 的真实地址留到首次调用时才回填。
    body: |-
      动态链接让多个程序在内存里共用一份公共库（如 libc.so），可它立刻带来一个难题：为了安全，操作系统每次启动程序都会把共享库加载到不同的虚拟地址，编译链接 hello.c 时根本写不进 printf 的最终地址。你可能会问：加载器启动时直接顺手改写 .text 段里的 call 指令不就行了？不行——.text 段设为只读且由多个进程共享同一份物理内存页，一旦改写代码页就会破坏共享、逼着内核给每个进程复制一份私有副本。

      解法是加一层「只读跳板 + 可写地址表」的间接中转。代码段照常只读，里面不直接 call printf，而是先跳进一小段固定的 [[PLT]] 跳板代码；PLT 不存真实目标，而是读一份可写的私有数据表 [[GOT]] 里的地址跳过去。第一次调用 printf 时，GOT 格子里填的是「跳回 PLT 下一行」的地址，于是触发动态链接器去 libc.so 里查出 printf 的真身，顺手把真实地址写回 GOT；从第二次调用开始，PLT 读到 GOT 里的真地址直接一跳到达，这就是「惰性绑定」。

      这套设计付出的代价是每个动态函数每次多一跳间接寻址，加上首次调用那一下查找停顿。大多数程序只在启动后第一次打日志时交一次微小的查找费，对整体毫无感觉；如果是高频交易、实时音视频这类不能容忍首次抖动的场景，可以在链接时加上立即绑定参数（-Wl,-z,now），把所有 GOT 表项提前在启动阶段一次算清。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 7 章
        url: http://csapp.cs.cmu.edu/
        claim: 动态链接通过 PLT 与 GOT 实现间接调用与惰性绑定
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
        note: 2026-11-07 已对照一手来源核查，记录见 docs/curriculum-audit.md
