      - CPU 只认识机器码，人写的 C 代码它看不懂。
  - id: compile
    title: 编译：把 hello.c 翻成汇编指令
    tldr: 编译器是整条链路里唯一真正读懂 C 语言含义的一站：它查出语法和类型错误，再把 hello.c 翻成和机器指令一一对应的汇编文本 hello.s。
    body: |-
      拿 [[gcc]] -S hello.c 停在编译这一站，产出的 hello.s 里就是和机器码一一对应的汇编助记符。hello.c 里写的是 printf("hello\n")，翻到 hello.s 里大致会变成两条核心动作：先把字符串 "hello\n" 的地址装进第一个参数寄存器（x86-64 上是 [[rdi]]），再发出一句 call printf 指令；源码里的变量名和类型标签已经消失，剩下的只有寄存器和指令。

      也正因为只有编译器懂 C 语言的语法和类型规则，少写分号、参数类型对不上这类错全都会在这一站被拦下来——后面的汇编器和链接器根本不看 C 语义。至于怎么把同一句表达式翻得更省指令，取决于优化开关：-O0 几乎逐行直译、方便单步调试，-O2 则会大胆把变量留在寄存器里、调换计算顺序，只要对外运行结果完全一致。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 1 章、第 3 章
        url: http://csapp.cs.cmu.edu/
        claim: 编译器将 C 翻译为汇编程序
