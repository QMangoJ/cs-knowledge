  - id: incremental
    title: 增量编译：改一行代码为何不用全盘重编
    tldr: 因为每个 .c 都独立编译成 .o，构建工具只要盯住每个 .o 依赖的源码和头文件，就能只重编受影响的那几个文件，再统一重新链接。
    body: |-
      设想 hello.c 长成了一个上千个源文件的大项目：你只改了某一行，总不能每次等十几分钟全盘重编。前面拆出的 .c → .o 边界正好撑起了增量构建——make 或 ninja 等构建工具在后台记了一张依赖表，只要某个 .o 对应的 .c 和它包含的头文件都没动过，就直接复用现成的 .o，只重编变了的那少数几个，最后拼在一起重新链接。

      但改动落到头文件上时，影响面会按包含关系成倍放大。假如 util.h 被 200 个 .c 文件 #include，改它里面哪怕一行注释，这 200 个 [[翻译单元]]全得重新预处理、编译一遍——这就是大项目最忌讳在头文件里乱引其他头文件、宁可多写前置声明的原因。

      日常构建最容易踩两个坑：一是依赖规则漏写了一个隐含头文件，构建工具以为不用重编、拿陈旧的 .o 凑数，导致「源码明明改了行为却没变」（做一次全量清理重编就能立刻抓出这种幽灵问题）；二是「编译能增量，链接却要整体重拼」——只要有一个 .o 变了，链接器就得重新读取全部 .o 和符号表再拼一遍，超大 C++ 项目最后的等待瓶颈往往就卡在链接器这一步。
    derivation: original
    sources:
