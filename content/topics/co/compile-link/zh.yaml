  - id: incremental
    title: 为什么改一行不用全部重编
    tldr: 分步翻译的红利是增量构建，只重做变了的那个文件，其余复用旧产物。
    body: 大项目有上千个源文件，如果改一行就要全部重编译，没人等得起。分步模型天然支持增量，每个 .c 独立编译成 .o，构建工具记录每个 .o 依赖哪些源文件和头文件，只有依赖变了才重编那一个，最后统一重新链接。make 和 ninja 干的就是这张依赖图的维护。走例，改了 util.h 而它被 200 个文件包含，这 200 个 .o 全部要重编，因为预处理把头文件内容复制进了每个翻译单元，头文件变更的影响面是按包含关系放大的，这也是大项目对头文件改动格外谨慎、偏好前置声明减少包含的原因。另一个常见坑是依赖记录不全，构建系统漏记了某个隐含依赖，增量构建就会用上陈旧的 .o，出现源码明明改了行为却没变的情况，这时全量重编能立刻验证是不是增量缓存的锅。链接这一步无法增量，任何 .o 变化都要重新拼装整个产物，所以超大项目的链接耗时本身会成为瓶颈，后来才有了增量链接器和分布式构建这些专门优化。
    derivation: original
    sources:
