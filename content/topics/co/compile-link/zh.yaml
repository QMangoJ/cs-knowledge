  - id: elf-sections
    title: ELF 文件里到底装了什么
    tldr: 可执行文件不是一坨机器码，而是一个分段装箱的结构，每段各有用途。
    body: 用 readelf -S 看一个可执行文件，会看到一串段。.text 装机器指令，只读可执行；.rodata 装字符串字面量和只读常量；.data 装已初始化的全局和静态变量，值直接存在文件里；.bss 装未初始化的全局变量，文件里只记大小不占字节，加载时整段清零，这解释了为什么声明一个巨大的全局数组不会让可执行文件等比例变大。还有 .symtab 符号表、.strtab 字符串表、.rel 或 .rela 开头的重定位段，各自服务于链接和调试。链接器拼装时做的就是把所有输入文件的同名段按顺序合并，再统一排地址。走例，a.o 和 b.o 各有一段 .text，链接后它们首尾相接成为一整段，b 里函数相对 a 里函数的偏移随之改变，所有引用这些函数的重定位项都要按新地址重算，这正是重定位这个名字的来历。分清段的另一个实用价值是看体积，程序变大先看是哪一段涨了，.text 涨是代码多了，.rodata 涨多半是嵌进了大表或大字符串，.bss 涨则是大全局数组，对症才好下手。
    derivation: original
    sources:
