  - id: load
    title: 加载与收尾：敲下 ./a.out 到 main 之前发生了什么
    tldr: 终端敲下 ./a.out 后，内核先经 execve 把 [[ELF]] 各段映射进虚拟内存；如果是动态链接程序，还要先跑完动态链接器和 C 运行时初始化，最后才轮到 main 打印出 hello。
    body: |-
      你在终端敲下 ./a.out 回车，shell 立刻调用 execve 系统调用让内核接管。内核读出 [[ELF]] 文件头里的加载清单，在新建的虚拟地址空间里划好映射关系：.text 只读可执行、.data 可读可写、.bss 标成零页。注意这只是「建好映射」，内核并没有傻傻地把整个文件全从磁盘读进物理内存——只有当 [[CPU]] 真正跳到某页指令或读某页数据时，才触发[[缺页异常]]按需装入。

      很多人以为进程启动跑的第一行代码就是你写的 main，其实不然。静态程序先从 C 运行时入口 _start 起步，整理命令行参数 argc/argv、初始化全局构造，才正式调用 main 并在返回后经 exit 交还内核；动态链接的 a.out 还要更曲折——内核先把控制权交给动态链接器（如 ld-linux.so），由它把所有依赖的 .so 映射进来、填好非惰性重定位并执行各个共享库的初始化函数，然后才轮到 C 运行时和你的 main。所以遇到「程序刚启动就崩溃、第一行日志都来不及打」，问题往往藏在动态库加载或全局对象初始化里。

      全课收成一句口诀和排错三问：预处理贴文本、编译翻汇编、汇编留缺口、链接填地址、加载先映射再进 main；以后构建或启动一报错，先问三句——报语法类型找编译，报缺符号或重定义找链接，报找不到 .so 或未进 main 就崩查加载。
    derivation: original
    sources:
