    title: 链接：把零件拼起来
    tldr: 链接器把多个目标文件和库拼成一个完整的可执行文件。
    body: 链接器做两件事，符号解析配对，再做重定位，把各目标文件的代码段和数据段拼起来，并把重定位表里记的每个占位地址按符号的最终地址改写正确，产物才是能交给操作系统的可执行 ELF 文件。静态链接把用到的库函数代码整段拷进可执行文件，产物自包含、部署简单，代价是体积大、库有漏洞时每个程序都要重新链接发布。动态链接只在可执行文件里记下依赖哪个 .so 和需要哪些符号，真正的代码由运行时的动态链接器加载，所有进程共享同一份库代码页，省内存、库可单独升级，代价是启动时要多做一轮加载和符号绑定，还可能撞上版本不匹配。走例，gcc a.o b.o -o app 这一步里如果 printf 来自动态 libc，app 本身并不含 printf 的代码，只有它在 PLT 和 GOT 里的一个间接入口，第一次调用时才由动态链接器把真实地址填进 GOT。这很像前端打包解析 node_modules 依赖，区别是动态链接把一部分打包工作推迟到了每次启动时。
    derivation: original
    sources:
