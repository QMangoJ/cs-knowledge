level: 基础
minutes: 26
prereq: []
objectives:
  - 按顺序说出预处理→编译→汇编→链接四步的产物
  - 用符号表解释未定义符号错误
  - 分清静态链接与动态链接的取舍
aiLink: 推理服务部署时满屏的 .so、符号未定义、glibc 版本问题都来自这一课：CUDA/ONNX Runtime 的动态库加载、Python 扩展模块（torch 的 .so）本质都是链接与加载。看懂符号与重定位，排这类错就不再靠玄学。
quiz:
  - q: 链接器报 undefined reference，通常是？
    options:
      - 语法错
      - 某个符号只有声明没有定义（或没把实现的目标文件/库链进来）
      - 内存不足
      - CPU 不支持
    answer: 1
    explain: 编译只查声明，符号的定义由链接器在全部目标文件与库里配对。
  - q: 动态链接相比静态链接的代价是？
    options:
      - 二进制更大
      - 运行时要加载并重定位共享库，启动稍慢；多进程共享同一份库省内存，库还可单独升级（重启进程后生效）
      - 不能跨平台
      - 不支持函数调用
    answer: 1
    explain: 多个进程共享同一份 .so 的代码页，这正是虚拟内存共享映射的应用。
  - q: 头文件里应该放什么？
    options:
      - 函数定义
      - 声明（函数原型、类型、extern 变量）
      - main 函数
      - 全局变量定义
    answer: 1
    explain: 定义放多个 .c 里会造成重复定义；头文件只声明，链接器最后统一配对。
design:
  - mechanism: 翻译被拆成预处理、编译、汇编、链接、加载五步，每步产物落盘，分别是 .i、.s、.o、可执行文件和内存映像，这一点在习题和工程判断里都要能独立说清来龙去脉，而不是只记结论。
    problem: 把源码一次性变成内存映像是个巨大工程，一步做完则无法定位错误、无法复用中间产物、无法让多个文件并行翻译，改一行也要全量重来，这一点在习题和工程判断里都要能独立说清来龙去脉，而不是只记结论。
    choice: 流水线式分工，每步只解决一个问题且接口用文件格式固定下来，编译器、汇编器、链接器可以独立替换，构建系统还能按依赖做增量复用，这一点在习题和工程判断里都要能独立说清来龙去脉，而不是只记结论。
    tradeoff: 分步的代价是信息逐级丢失，链接器不懂 C 语义所以报不出友好的类型错误，优化也被切成编译期和链接期两段，全局最优更难做到，这一点在习题和工程判断里都要能独立说清来龙去脉，而不是只记结论。
    root: 根源是关注点分离加上文件作为稳定接口的工程规律，只要中间格式标准化，工具链就能像积木一样组合、缓存和并行，这是构建系统的地基
  - mechanism: 动态链接把符号绑定推迟到加载甚至首次调用时，经 PLT 跳板和 GOT 间接表完成，库代码只加载一份供多进程共享，这一点在习题和工程判断里都要能独立说清来龙去脉，而不是只记结论。
    problem: 静态链接把库拷进每个程序，磁盘和内存里同一份 libc 存在成百上千份副本，库修个安全漏洞要重发所有程序，运维上完全不可行，这一点在习题和工程判断里都要能独立说清来龙去脉，而不是只记结论。
    choice: 只在可执行文件里记依赖和符号名，运行时由动态链接器统一加载共享库并回填地址，多进程映射同一份只读代码页，升级库文件即全场生效
    tradeoff: 代价是启动多一轮加载重定位、首次调用有惰性绑定停顿，还引入了版本矩阵和运行期找不到 .so 这类只有部署时才暴露的故障模式，这一点在习题和工程判断里都要能独立说清来龙去脉，而不是只记结论。
    root: 根源是代码页只读可共享这一虚拟内存特性，不改写代码、只改写一张私有间接表，就能同时满足共享、升级和地址无关三件事，这一点在习题和工程判断里都要能独立说清来龙去脉，而不是只记结论。
  - mechanism: 符号解析按强弱规则配对，未初始化全局变量作弱符号即公共块，函数与已初始化变量作强符号，链接器据此裁决重复名字，这一点在习题和工程判断里都要能独立说清来龙去脉，而不是只记结论。
    problem: 多个文件都声明了同名全局量时，链接器必须有确定规则决定用哪份、报不报错，否则同样的输入在不同链接顺序下会得到不同程序，这一点在习题和工程判断里都要能独立说清来龙去脉，而不是只记结论。
    choice: 用强弱规则给出可预测的裁决，强符号唯一且覆盖弱符号，弱符号之间取尺寸最大者，让头文件里放声明、源文件里放定义成为全员遵守的约定
    tradeoff: 规则的历史包袱是公共块的宽容会掩盖真 bug，两个文件误写了同名未初始化变量会被悄悄合并而不是报错，现代编译器默认关掉这份宽容正是为此
    root: 根源是分别编译的必然结果，每个翻译单元只能看见声明，定义归属的最终裁决只能交给掌握全局符号表的链接器，规则必须简单且与顺序无关
