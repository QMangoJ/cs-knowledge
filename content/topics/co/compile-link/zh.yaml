  - id: assemble
    title: 汇编：变成机器码
    tldr: 汇编器把汇编逐条翻译成二进制机器码，得到目标文件。
    body: 汇编到机器码几乎是机械的查表翻译，汇编器逐行把助记符换成二进制编码，算出每条指令的地址，产物是目标文件 hello.o，可以用 objdump -d 反汇编回来看。目标文件已经是真机器码，但还不能运行，因为它调用的 printf 不在自己体内，这些引用位置的地址先填占位值，同时在重定位表里记一笔，某个偏移处将来要填某个符号的地址加或减多少。汇编器还顺手生成符号表，列清本文件定义了哪些全局符号、引用了哪些外部符号。两类目标文件要分清，可重定位目标文件就是普通的 .o，要被链接器继续加工；共享目标文件是 .so，链接方式特殊。汇编这一站几乎不报错，能报的多半是助记符拼写或格式问题，语义对不对它一概不管，这种各管一段的分工正是整条工具链可组合的原因。这一段的每个数字和结论都应当能自己复算或手推一遍，读时先遮住结论自测，再对照正文核对差在哪一步。
    derivation: original
