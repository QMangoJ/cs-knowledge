order: 1
status: published
license: CC-BY-4.0
title: C 代码怎么变成能运行的程序
summary: 从源码到跑起来的程序并不是一口气直译，而是一条接力流水线：先做文本替换与翻译成汇编，再转成带缺口的二进制目标文件，由链接器把外部库拼齐，最后交给操作系统放进内存启动。拆成多步让每一步只管一类事、产物格式固定，报错能精准定位，改一行代码也不用全盘重编。全课顺着 hello.c 一路往下追：先看预处理、编译与汇编怎样把文本翻成带占位符的机器码，再看符号表、ELF 分段与链接时怎样补全缺口并做动静取舍，最后看运行期动态库如何通过中转表定位、进程启动时又在 main 之前做了什么。
premise: 你在 Linux 终端里写了一个只有几行的 hello.c，里面调了 printf("hello\n")；敲下 [[gcc]] hello.c 后，目录里就多出一个能直接运行的 a.out。明明你的代码里没写 printf 的实现，[[CPU]] 也看不懂英文字母——这几行源码到底经过了哪几步加工，才变成指令并把库函数拼进内存跑起来的？
position: 本课是组成原理的开篇，独自撑起「从代码到可执行文件」板块：只有先弄清源码怎样被翻译、拼装并映射进内存，后面讲 [[CPU]] 怎么一条条跑指令才有落脚的对象。学完你能一眼分清报错卡在编译还是链接阶段，也能说清「编译时把库直接拼死进程序」与「运行时再按需去找共享库」这两种路线各自的代价。
bridge:
  next: 程序已经拼装完毕并放进了内存，接下来就看处理器怎么把它一条条跑起来。下一课把镜头推近到芯片内部，跟着一条从内存取数的 load 指令，走通取指、译码、执行、访存、写回五步。
overview:
  - key: 一句话总结
    value: 源码变可执行文件分预处理、编译、汇编、链接四道加工，最后交给操作系统加载运行；每一步产出标准文件，改一处不用全部重编。
  - key: 为什么分步
    value: 分成几步是因为每一步只解决一个问题，互不纠缠。这样编译器可以单独替换，中间产物也能缓存，改一个文件时不用把全部文件重编一遍。
  - key: Linux 上的格式
    value: 在 Linux 上，目标文件和可执行文件都是 [[ELF]] 格式。它像一个分段装箱的标准，代码、数据、符号表各有自己的区段，加载器照着这张装箱单就能把程序摆进内存。
  - key: 类比
    value: 前端里 [[TypeScript]] 编译成 JS ≈ 这里的编译，webpack/Vite 把多个文件打包成一个产物 ≈ 链接，浏览器把产物装进页面运行 ≈ 加载
  - key: 四个阶段
    value: 四个阶段依次产出四种文件，预处理得到 .i，编译得到汇编 .s，汇编得到目标文件 .o，链接得到可执行文件。平时一条 [[gcc]] 命令把四步连着做完，用 -S、-c 这些选项可以让它停在中间某一步看产物。
  - key: 静态 vs 动态链接
    value: 静态链接把库的代码直接拷进可执行文件，文件大一些，但独立好部署，搬到哪台机器都能跑。动态链接运行时才去找共享库，多个程序能共用一份，体积小，库也能单独升级。
  - key: 常见报错
    value: 链接期最常见的两个报错要分清，undefined reference 是用了某个函数却找不到它的定义。multiple definition 是同一个东西被定义了两遍，链接器不知道该听谁的。
  - key: 在终端里看一看
    value: gcc -S hello.c　生成 hello.s 看汇编；ldd ./a.out　看程序依赖哪些动态库
