  - id: plt-got
    title: 动态链接怎么找到函数：PLT 与 GOT
    tldr: 动态库函数地址运行时才知道，调用只能先跳一层中转，这层中转叫 PLT 和 GOT。
    body: 动态链接有个先天难题，编译链接时 .so 里 printf 的最终内存地址根本不知道，因为它要等加载时才定。如果可执行文件里直接写死调用地址，加载器就得改写代码段，而代码段是只读且多进程共享的，改写会破坏共享。解法是间接一层，可执行文件自己的代码只跳到一小段跳板即 PLT，PLT 再按 GOT 表项里存的地址跳过去，GOT 是可写的数据表，每项对应一个动态符号。第一次调用某个函数时 GOT 里存的是回到 PLT 的地址，PLT 转而调用动态链接器做真正的符号查找，找到后把真实地址回填进 GOT，之后每次调用就一次间接跳转直达，不再惊动链接器，这叫惰性绑定。代价是每个动态函数多一跳，外加第一次调用有个明显的查找停顿，实时性敏感的程序可以改用立即绑定在启动时一次算清。理解这一层，很多现象就通了，比如函数指针比较、符号插入即用 LD_PRELOAD 抢先提供同名符号，本质都是在这张间接表上做文章。
    derivation: original
    sources:
