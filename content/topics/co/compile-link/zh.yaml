  - id: elf-sections
    title: ELF 分段装箱：代码、常量和变量各有去处
    tldr: Linux 下的 .o 和可执行文件按 [[ELF]] 格式分段装箱：指令、字符串常量、有初值变量、未初始化变量分开存放，链接时同名段首尾合并再统一重算地址。
    body: |-
      为什么要分段装、不把所有机器码和数据揉成一坨？因为它们的读写权限和生命周期完全不同：指令要允许执行但绝不能被程序改写，"hello\n" 这类字符串只读不写，有初值的全局变量要在磁盘文件里带好初值，未初始化变量刚启动时全是 0——没必要在文件里白占空间。用 readelf -S 查看 [[ELF]] 文件就能看到对应分段：.text 装机器指令（只读可执行），.rodata 装字符串常量，.data 装已初始化全局与静态变量，.bss 装未初始化全局变量。

      注意 .bss 是个省空间的巧思：哪怕你在 hello.c 里声明一个 100 MB 的全局数组，磁盘上的 a.out 几乎不会变大，因为 .bss 在文件里只记个字节数，等操作系统加载进内存时才整段清零。链接器拼装 hello.o 和其他 .o 时，会把所有输入文件的 .text 首尾相接合成一整段 .text，.data 也同理合并；排完新位置之后，所有函数相对彼此的偏移都变了，链接器便回头按第 4 步的重定位表把每个占位地址一一填实——「重定位」这个名字就是这么来的。
