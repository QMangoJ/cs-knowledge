  - id: load
    title: 加载：程序跑起来
    tldr: 运行时，操作系统把可执行文件装进内存，从入口开始执行。
    body: 在终端敲下 ./a.out 后，shell 调用 execve 系统调用，内核解析 ELF 头，按程序头把各段映射进新建的地址空间，注意是建立映射而不是把整个文件读进内存，页面真正用到时才经缺页异常装入。静态可执行文件到此就能跳到入口开始跑，动态可执行文件还要先跳进动态链接器的入口，由它按依赖列表加载全部 .so、完成重定位、处理初始化函数，然后才跳到程序自己的入口，先经 C 运行时做全局构造等初始化，最后才调用 main，main 返回值再经 exit 交回内核。所以程序里第一行代码并不是进程执行的第一条指令，动态库的构造函数会在 main 之前就运行，这是很多初始化顺序 bug 的来源。具体部署上，静态链接一个带完整运行时的二进制体积会明显膨胀、容器镜像随之变大，动态链接镜像小但要管好 .so 的版本矩阵，两条路线都常见，看团队在独立性和体积之间的取舍。
    derivation: original
    sources:
