  - id: programmed-io
    title: 两种旧办法的账：轮询与中断驱动
    tldr: 秩序有了，再回头看在没有专门搬运硬件之前，人们是怎么对付输入输出的。两种老办法各解决了一半问题：轮询让 CPU 空转着等设备准备好，中断免掉了空等、却免不掉逐字搬运——搬 1 MB 仍要参与 262144
      次。这一步把两笔账摆在一起，好看清还差什么。
    body: >-
      在请出 [[DMA]] 之前，先看没有它时人们怎么对付 I/O，这里有两种经典办法，正好对应指令周期一课里学过的等待与中断。第一种叫程序控制 I/O（programmed I/O，简称 PIO）：CPU
      发出读命令后，反复去读设备的状态寄存器问好了没有，这叫轮询（polling）。磁盘寻道要几毫秒量级，CPU 一圈圈空转问的都是同一句话，这段时间全额浪费。


      第二种是中断驱动 I/O：CPU 发完命令就去干别的，设备准备好一个字（或一小块）后发一个中断信号，CPU
      暂停手头工作、跳进中断服务程序把数据搬走、再返回原处。它免掉了空转等待，是实打实的进步，但请看清它没免掉什么：数据仍然要逐字经过 CPU 寄存器，中断服务程序搬一个字、返回、再被下一个中断打断，如此往复。


      把账算到底。搬 1 MB 共 262144 个字：纯轮询下 CPU 全程被占死，参与次数等于 262144 次搬运外加数不清的状态查询；中断驱动下若按每搬满一页 4 KB 中断一次，全程中断次数是
      1048576 除以 4096 等于 256 次，听起来少多了，可是中断服务程序内部仍然是一个字一个字地搬，总搬运动作还是 262144
      次一次不少。结论：中断解决的是等待的浪费，没解决搬运的浪费。要两个都解决，必须让搬运本身脱离 CPU，这正是 DMA 的出发点。
    derivation: original
    sources:
