  - 说清总线三组信号线各自的职责，并解释为什么共享通路必须有仲裁
  - 算清搬 1 MB 时逐字搬运与 DMA 的 CPU 参与次数差距
  - 区分周期窃取与突发模式的取舍，并判断一笔传输该用哪种
