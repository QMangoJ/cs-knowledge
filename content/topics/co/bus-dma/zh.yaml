  - id: dma-what
    title: DMA 登场：CPU 只填一张设置单
    tldr: 老办法缺的那一半，就是让搬运本身脱离 [[CPU]]。这一步请出主角 [[DMA]] 控制器——一块只会搬数据的专用硬件。实际场面是磁盘读：CPU
      只往它的寄存器里写清源地址、目的地址、长度和方向这四项设置，剩下的整块搬运由它自己跑完。
    body: |-
      DMA（Direct Memory Access，直接内存访问）就是为这件事准备的分工：多出一块叫 DMA 控制器的专用硬件，它不会算题，只会一件事，按 CPU 填好的设置在设备与内存之间整块搬数据，搬完再发一个中断通知 CPU。

      CPU 要做的只是填单子，也就是往 DMA 控制器的几个寄存器里写四个信息：源地址（数据现在在哪，比如磁盘控制器的数据缓冲，或内存某处）、目的地址（搬到哪）、长度（共多少字节）、方向（设备到内存叫读入，内存到设备叫写出）。这和此前给函数传参数是同一种动作：几条写寄存器或写内存映射地址的指令，瞬间完成。

      填完单子，CPU 就转身去执行别的指令了。DMA 控制器则自己去仲裁、申请成为总线主设备，一段一段地把数据从设备读出、写进内存，每搬一段就把内部的地址加一截、剩余长度减一截，直到长度归零。它搬运时数据不经过 CPU 寄存器，这是它和中断驱动 I/O 的分水岭：上一课缓存里讲过寄存器是最快的一层，但搬运根本不需要计算，让数据绕开 CPU 不是损失，是把贵资源还给真正需要计算的活。下一歩就跟着一张真实的单子，从头到尾走一遍磁盘读的全程。
      补一个细节，免得把单子想得太抽象：这四个信息不是写在纸上，而是写进 DMA 控制器里几个固定的寄存器，CPU 用几条普通的写指令就能填完，和给函数传参数没有本质区别。填完之后控制器内部有一个计数器，每搬走一段就自动减长度、加地址，不需要 CPU 中途再来指点。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 6 章与第 10 章 DMA 相关节
        claim: DMA 控制器由 CPU 写入源地址、目的地址与字节数后，自行在设备与内存之间传输整块数据而不经 CPU
        status: verified
