title: 总线与 DMA：内存通道不止 CPU 一个主人
summary: 内存从来不是 [[CPU]] 一个人的私产，显卡、磁盘和网卡都挂在同一套公共通道（总线）上排队读写。与其让昂贵的 CPU 当搬运工一个个字地挪数据，不如加一块专门只会搬数据的 [[DMA]] 硬件：CPU 只在开头写清「从哪搬、搬到哪、搬多少」，搬完收一次完成通知，中间几十万趟跑腿全甩出去。全课先算清逐字搬运有多亏，再依次拆解公共通道怎么排队分先后、DMA 怎么接手整块搬运、抢道怎么让路，最后补上两个避不开的善后：缓存里的旧副本怎么同步、设备地址怎么关进安全围栏。
premise: 电脑要从磁盘读一页 4 KB 的数据进内存，紧接着再读一整块 1 MB 的大文件——如果每个 4 字节的字都要让 CPU 亲手从磁盘接过来放进内存，光这 1 MB 就得跑二十六万多趟，CPU 什么正事都干不了。有没有办法让设备自己把数据搬进内存、CPU 只在开头交代一句和结尾验个收？本课就拿这两个读写规模贯穿到底，看公共通道和专用搬运硬件怎样分工。
position: 本课是组成原理「不止一个主人：设备与多核共享内存」板块的第一站，接在上一课 GPU 并行架构之后：显卡里的海量线程最终也得经同一条通道去抢内存带宽，内存从来不只服务 CPU 一个消费者。学完这一课，你能算清逐字搬运和整块代搬在 CPU 出手次数上的巨大落差，明白多设备共用一条通道怎么排队让路，也看清「外设改了内存但缓存没更新」「怎么防设备乱写别人内存」这两道必解的坑；下一课讲多核内存顺序，就从这个「多方共用同一片内存」的悬案接着往下追。
bridge:
  prev: 上一课看 GPU 拉起上万个线程拼命算，可算之前数据也得先从内存通道搬进来。其实不光 GPU，磁盘和网卡也全挤在通往内存的路上——这一课来看，当不止一个设备都要读写同一片内存时，通道归谁管、搬运谁来做。
  next: 设备绕过 CPU 把新数据写进内存，CPU 却可能还抱着缓存里的旧副本浑然不觉——这还只是多了一个外设。下一课把主人换成多个 CPU 核心同时读写同一片内存，看看为什么有时候连「刚写进去的值」都会暂时对不上顺序。
overview:
  - key: 一句话总结
    value: 所有设备共用一套内存通道（总线），谁上路都得排队；[[DMA]] 干脆配个专用搬运工绕开 [[CPU]] 自己搬整块，CPU 只管开头填单和结尾收工。
  - key: 总线三组线
    value: 公共通道按职责拆成三股线：地址线报门牌号、数据线运货物、控制线发指令和裁判谁先走。
  - key: 总线主设备
    value: 当前这一拍能主动开口要读写内存的那一方叫主设备。CPU 只是候选人之一，磁盘、网卡和 DMA 控制器拿到许可都能上。
  - key: 必算的账
    value: 按每次搬 4 字节算，从磁盘读 1 MB 让 CPU 亲自搬要出手 262144 次；换成 DMA 只要开头填 1 次单加结束收 1 次通知，总共只出场 2 次。
  - key: 抢带宽的取舍
    value: DMA 搬运要和 CPU 共用同一条通道：每次只插缝搬 1 个字（周期窃取），对 CPU 干扰小但搬得慢；一口气霸占通道搬完整块（突发模式），总耗时最短但 CPU 得整段干等。
  - key: 两个后续问题
    value: 外设绕开 CPU 直接改内存后，会撞出两道坑：缓存里躺着过时旧副本（一致性问题），以及得防着设备乱写内核或别人的内存（靠 [[IOMMU]] 划安全围栏）。
