  - id: bus-what
    title: 总线：所有部件共用的三股公共道路
    tldr: "[[CPU]]、内存、磁盘和网卡没有各自直连的专线，全挤在同一组共用连线（总线）上通行；这组线分成地址、数据、控制三股，同一拍只能服务一对收发方。"
    body: |-
      一台电脑里，[[CPU]] 取指令、内存吐数据、磁盘写页、网卡收包裹，其实全挤在同一组公共连线上，没有各自专用的直通专线——因为让 `N` 个部件两两直连，主板走线会按 `N²` 爆炸，也没法随便插新设备。这套把 CPU、内存和各种外设串在一起的公共通道，就叫**总线**（bus），而「同一拍只能有一对部件在上面说话」这条物理限制，就是后面排队和抢带宽的全部背景。

      顺着一次真实的 8 字节内存读取，看这组公共通道拆成的三股线各自干什么：
      第一股叫**地址线**（报门牌号）：发起方把目标内存地址摆上去，整条线上的所有部件都盯得见，只有管那个门牌号的内存条认领响应；
      第二股叫**数据线**（运货物）：真正的 0 和 1 沿着它走，线有多宽一次就并行运多少，比如 64 位数据线一拍就能运 8 字节；
      第三股叫**控制线**（发号施令）：负责喊清这次是读还是写、货物放稳没有，也传各个设备请求上路和获准通行的信号。

      看清谁站在路边，后面的好戏才对得上号：CPU、内存控制器、磁盘和网卡、马上要登场的 [[DMA]] 控制器，还有上一课的 [[GPU]]，全都在这条路上有户口。公共道路立刻逼出两个问题：两家同时开口说话撞车了怎么办（下一步讲排队仲裁），以及 CPU 以外的外设能不能自己当发起方（后面讲 DMA）。
    derivation: original
