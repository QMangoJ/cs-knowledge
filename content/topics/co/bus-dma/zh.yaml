  - id: lesson
    title: 选型纪律：小而急自己拿，成块搬运交给 DMA
    tldr: 判断用不用 [[DMA]] 就比两笔账：数据只有几字节且立刻要用，填单加收中断的固定门票比自己读还贵；数据成块且 [[CPU]] 在搬完前也做不了别的，干脆甩给 DMA。
    body: |-
      先看什么时候**不该**用 [[DMA]]：读一个键盘按下的按键码、查一下温度传感器的 2 字节状态，数据就一两个字节，且 [[CPU]] 马上要靠它决定下面怎么走分支。这时候填四项 DMA 寄存器、等仲裁排期、再加上收一次完成中断的固定开销，比 CPU 亲自发一条读指令拿回来贵得多，况且 CPU 等不到这个值也没别的事干——所以 [[GPIO]] 和串口至今老老实实直接读。

      再看什么时候**一定**要甩给 DMA：从磁盘整页整 MB 地读文件、网卡批量吞吐网络帧、或者往 [[GPU]] 显存整批灌入大模型权重和缓存。只要数据上到 KB、MB 量级，对比两笔账就一清二楚：一边是「字数 × 逐字搬运成本」（随数据量暴涨），另一边是「1 次填单 + 1 次中断」（永远只出场 2 次），前者一旦盖过后者，交给 DMA 就是净赚。

      全课收成可带走的**「多主人共享内存三问诀」**，以后看到任何外设搬运都能套上检查：
      ① **谁在当主设备？**——总线共用三组线，靠仲裁轮流发牌，CPU、DMA 和显卡都能当主设备；
      ② **这笔搬运划不划算？**——小而急自己拿，成块大活甩给 DMA，并在周期窃取（不卡 CPU）和突发模式（总时长最短）间挑节奏；
      ③ **两个善后做了没？**——写完内存有没有和 CPU 缓存对账（一致性），设备地址有没有进 [[IOMMU]] 围栏（隔离）？
      理清了外设和 CPU 共用内存的规矩，下一课换更头疼的场景：多个 CPU 核自己同时改写同一片内存时，以谁看见的顺序为准？
    derivation: original
    sources:
      - ref: csapp
        locator: 第 10 章系统级 I/O 相关节
        claim: DMA 的设置开销需由足够大的传输量摊薄，小传输用程序控制或中断方式更合适
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-13
