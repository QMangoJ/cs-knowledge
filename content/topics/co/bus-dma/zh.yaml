  - id: programmed-io
    title: 老办法的困境：轮询原地干等，中断依然亲自搬
    tldr: 在专用搬运硬件登场前，两种老办法各解了一半：轮询让 [[CPU]] 空转等磁盘，中断省掉了干等却还是得由 CPU 亲手搬完 262144 个字，总搬运次数一下都没少。
    body: |-
      先看没有专用搬运工之前，[[CPU]] 是怎么伺候磁盘读的。第一种老办法叫程序控制 I/O（PIO），核心动作是**轮询**（polling）：CPU 给磁盘下完读 4 KB 的命令后，就守在原地一圈一圈读磁盘的状态寄存器，「好了没？好了没？好了没？」。磁盘找扇区动辄要几毫秒，CPU 的几百万个时钟周期全烧在问这同一句话上，真正算数的代码一行没跑。

      第二种老办法改用**中断驱动**：CPU 发完读盘命令转身先去算别的任务，等磁盘把数据准备进自家缓冲、再发一个中断信号拍 CPU 的肩膀。CPU 收到后暂停手头工作，跳进中断处理程序把数据搬进内存，搬完再回来。等一下——这下不用干等了，问题是不是解决了一半，还是全都解决了？

      把 1 MB 数据的账算到底就露馅了：就算磁盘每凑满一整页 4 KB 才喊一次中断（全程 `1,048,576 ÷ 4096 = 256` 次中断），在每次中断处理程序里面，CPU **依然是一个字一个字从磁盘缓冲读进自己寄存器、再写进内存**！256 趟乘以每趟 1024 个字，总搬运动作还是实打实的 **262144 次**，一次没少。中断省掉的只是「干等的浪费」，「亲自跑腿搬运」的浪费照旧一分不少——要彻底解脱，必须让字节彻底绕开 CPU 的寄存器。
    derivation: original
    sources:
