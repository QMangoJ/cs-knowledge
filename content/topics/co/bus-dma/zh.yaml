  - id: arbitration
    title: 抢道怎么办：仲裁把通行权轮流交给总线主设备
    tldr: 同一根物理连线上同时发两份电信号会直接撞成乱码，因此每一轮只许一个「总线主设备」发号施令；[[CPU]] 只是候选人之一，谁先走由仲裁逻辑按规则发许可。
    body: |-
      想象一个立刻就会发生的撞车现场：[[CPU]] 这边正要从内存取下一条指令，同一微秒网卡刚好收到一个数据包也要往内存写。物理铜线上同时只能承载一份高低电平信号——两边要是同时往地址线和数据线上放信号，电压叠在一起谁都读不出来，传过去全是乱码。所以共享通路的第一条铁律就是：任一时刻只许一家主动发话。

      这里立两个角色名字。这一轮有权往地址线上写门牌号、在控制线上喊读还是写的那一方，叫**总线主设备**（bus master）；只负责被动听地址、按指令收发数据的那一方叫**从设备**（slave），比如内存永远是从设备，从不主动开口。很多人习惯以为总线天生归 CPU 独霸——其实错了，CPU 只是最常当主设备的成员之一，磁盘、网卡和 DMA 控制器一旦拿到牌照，同样能当这一轮的主设备。

      谁来发牌照？靠**仲裁**（arbitration）。要上路的设备在控制线上举手发请求，仲裁器按优先级或轮流次序挑出一家发许可；拿到许可的设备当这一轮主设备，跑完传输把路交还，严格走「请求—许可—占用—释放」四步循环。代价也很直白：排队和裁判都要花时间，挂的设备越多、请求越密，等许可吃掉的带宽就越多——这也解释了后来高速通道为什么纷纷走向点对点直连（如 [[PCIe]]），尽量少让一堆设备挤在同一根公用铜线上。
    derivation: original
    sources:
