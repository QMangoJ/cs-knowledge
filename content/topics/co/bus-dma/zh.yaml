  - 说清总线三组信号线各自的职责，并解释为什么共享通路必须有仲裁
  - 算清搬 1 MB 时逐字搬运与 DMA 的 CPU 参与次数差距
  - 区分周期窃取与突发模式的取舍，并判断一笔传输该用哪种
  - 说清 DMA 带来的一致性问题与 IOMMU 的隔离作用各是什么
aiLink: 大模型推理时，权重、KV Cache 与输入数据要在主机内存与 GPU 显存之间来回搬运，走的正是 DMA 这条路：CPU 只填一次设置，搬运由 DMA 引擎整块完成，搬运带宽与 CPU
  算力一样是推理流水线的一等瓶颈。
steps:
  - id: why
    title: 先算账：CPU 亲自搬运有多浪费
    tldr: 先看一个最日常的场面：程序要把磁盘上的一页数据读进内存。为什么先算这笔账？因为只有先看清让 CPU 亲自搬有多浪费，后面请出专门的搬运硬件才有理由。这一步就把 4 KB
      一页算起：一个字一个字地搬，光这一页就要 CPU 亲自跑 1024 趟，再放大到 1 MB 看它要陪跑多少趟。
    body: |-
      先把场景摆到桌面上：程序要读磁盘上的一页数据，大小 4 KB，也就是 4096 字节，要放进内存里一块指定区域。最直白的做法是 CPU 亲自搬：从磁盘控制器的数据寄存器里取出一个字（这里一个字取 4 字节，就是此前指令周期一课里一条 load 能搬的量），写进内存，再取下一个字，再写，如此往复。

      数一数要往复多少次：4096 除以 4 等于 1024。也就是说，光这一页，CPU 就要亲自参与 1024 次搬运，每次至少是一读一写两条访存指令，还没算上循环计数和判断是否搬完的开销。这期间它算不了别的：搬运不需要任何判断和运算，纯粹是把字节从一处挪到另一处，却占着全机器最贵、最会算的部件。

      再放大到 1 MB：1048576 除以 4 等于 262144 次参与。数据量涨 256 倍，CPU 的陪跑次数也涨 256 倍，一秒钟都花在当搬运工上。问题不在 CPU 搬得慢，而在它根本不该干这件事——搬运是机械重复劳动，应该交给一个只会搬运的专用硬件，CPU 只负责在开始时说清搬什么、搬到哪、搬多少。那个专用硬件就是本课后半程的主角 [[DMA]] 控制器，而所有搬运要走的那条公共道路，就是先要讲清的总线。
      这里还要补一句容易被跳过的解释：为什么说搬运「不需要判断」？因为每个字搬到哪里，在开始之前就完全定死了——源头顺着数、目的地顺着数，不存在搬到一半要看内容再决定的情况。凡是这种规则完全定死、只剩重复执行的活，都适合从 CPU 手里拿走，交给更便宜的专用硬件。
    derivation: original
    sources:
