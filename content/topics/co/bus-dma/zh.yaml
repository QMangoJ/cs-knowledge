  - id: dma-what
    title: DMA 登场：CPU 只填四行设置单就撤
    tldr: "[[DMA]]（直接内存访问）加了一块只会搬数据的专用硬件：[[CPU]] 只需往它的寄存器里写清源地址、目的地址、长度和方向四项设置，就能转身干别的，让整块数据彻底绕开自己。"
    body: |-
      主角终于上场——**DMA**（Direct Memory Access，直接内存访问）。说白了，就是在主板或芯片上多雇一个只会搬砖、不会做题的专职搬运工，叫 **DMA 控制器**。它不会做加减乘除，也跑不了操作系统，唯一的本事就是按指令自己去当总线主设备，把整块数据在设备和内存之间直接对倒，倒完再通知 [[CPU]] 一声。

      别把「填设置单」想得太神秘：在硬件层，它不过就是 CPU 顺着普通写指令，往 DMA 控制器里的四个控制寄存器分别填四个数（和调用函数传四个参数一模一样）：
      ① **源地址**：数据现在在哪（比如磁盘控制器的缓冲口，或某段内存）；
      ② **目的地址**：要搬去哪儿（比如内存的指定页）；
      ③ **长度**：一共搬多少字节（比如 `4096`）；
      ④ **方向**：从设备读进内存，还是从内存写出到设备。

      这四步几条指令微秒内填完，CPU 立马撤场去算真正需要它的计算题。DMA 控制器自己去跟仲裁举手拿通行权，内部带着一套地址累加器和剩余长度计数器：每搬完一段，地址自动往后移一截、剩余长度自动减一截，直到长度减到 0。关键分水岭就在这儿——整趟搬运数据**一次都不经过 CPU 寄存器**，把最金贵的算力彻底留给真正需要计算的任务。
    derivation: original
