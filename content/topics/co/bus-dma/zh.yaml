          cells:
            - v: 搬一字偷一周期
              mark: found
            - v: 慢设备下约占 0.1%
              mark: found
        - label: 突发模式
          cells:
            - v: 整块 262144 字连续占用
              mark: active
            - v: 总时长最短，CPU 整段等
              mark: active
    log:
      - mode: 周期窃取
        event: 每次只占用一个总线周期搬一个字，搬完马上把总线还给 CPU
      - mode: 突发
        event: 整块搬完才释放，CPU 期间访存停等
  - id: coherence-problem
    title: 善后坑一：DMA 改了内存，CPU 缓存里还是旧副本
    tldr: "[[DMA]] 绕过 [[CPU]] 直接往内存写新数据时，多核缓存协议看不见它——如果不把 CPU 缓存里同地址的旧副本清掉，CPU 下次一命中缓存就会捧着旧值当真的。"
    body: |-
      外设能自己写内存之后，立刻撞出一个隐蔽的坑：[[CPU]] 平时读数据先看自己的 [[L1]] 缓存，命中就直接拿走，根本不会去内存核对一遍。过去所有改内存的都是 CPU 自己，各核缓存靠 [[MESI]] 协议互相发消息保鲜；可 [[DMA]] 控制器是个绕过所有 CPU 缓存、直接动内存的「外人」，缓存协议根本看不见它出手。

      按真实时间线走一遍这个事故。假设地址 `0x8000` 之前被 CPU 读过，旧数据还舒舒服服躺在 CPU 的 L1 缓存里；接着网卡收包，DMA 把新数据直接写进物理内存的 `0x8000` 处，写完发中断喊 CPU 来收货。CPU 兴冲冲去读 `0x8000`，一查自家 L1 缓存：命中！于是心满意足拿走了过时的旧值，新数据明明躺在大内存里却被当场截胡。反过来一样会翻车：CPU 把新结果改在自家缓存里还没刷回内存（写回缓存下很常见），DMA 直接从内存抽走往网卡发，发出去的就是一包陈年老数据！

      记住什么叫「旧副本」：不是内存坏了，而是同一门牌号此刻同时有两份不一样的版本（内存是新、缓存是旧），而 CPU 天真地默认缓存永远最新。工程上解这道坑有三条路：第一，做**硬件一致性**（[[x86]] 平台常见），让 DMA 动内存时硬件顺便去 CPU 缓存里盯一眼、自动作废旧行；第二，靠**软件手动刷缓存**（许多嵌入式和 [[ARM]] 驱动这么干），DMA 写前写后由驱动显式写回或作废对应缓存行；第三，干脆把 DMA 缓冲区划成「不进缓存」（uncacheable），干净却慢。多个改写者共处一室必有一套同步规矩，下一课就专门把多核之间的规矩讲透。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 6 章缓存一致性相关节
        claim: 设备经 DMA 直接写内存可使 CPU 缓存中的副本过期，需要硬件或软件手段维护一致性
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-13
    canvas:
      kind: datastate
      structure: array
      caption: 同一地址两份视图：内存已是新值，缓存还躺着旧副本
      rows:
        - label: 内存
          cells:
            - v: DMA 刚写入的新值
              mark: found
        - label: CPU 缓存
          cells:
            - v: 同一地址的旧副本
              mark: active
            - v: 命中即读到旧值
              mark: active
    log:
      - mode: 不一致
        event: DMA 改了内存，缓存副本未被通知
  - id: iommu
    title: 善后坑二：给外设也装「门禁查表」——IOMMU
    tldr: 能绕开 [[CPU]] 直接读写内存的外设一旦出错或被攻破，就能顺着地址改烂整个内核；[[IOMMU]] 在设备和内存之间插进一道专属地址映射表，没登记的物理门牌一律拦下。
    body: |-
      [[CPU]] 上的普通程序从来碰不到真实的物理内存门牌——它发出的每条地址都先过 [[MMU]]（内存管理单元）查一遍页表翻译、检查权限，没登记的地址直接报错，程序于是只碰得到自己的内存。可如果外设这边不设防，一个能做 [[DMA]] 的网卡或固态硬盘拿着填单上的地址直接往物理内存写：万一驱动写错一个指针、或者插上一块被恶意篡改固件的扩展卡，它能把内核代码和别人进程的密码一股脑全覆盖掉；云服务器上把显卡直通给租户虚拟机时，甚至可能顺道打穿宿主机和邻居的内存！

      解法就是给外设也配一套「门禁翻译官」，叫 **[[IOMMU]]**（输入输出内存管理单元）。它干的活和 CPU 侧的 MMU 一脉相承：驱动填单子时不再给外设真实的物理地址，而是发一个设备专属的虚拟地址（I/O 虚拟地址）。每当外设发起 DMA 读写，请求必须先停在 IOMMU 门口，由它查这台设备专属的那张映射表——登记且授权过的才翻译成真实物理地址放行，越界地址当场拦截并上报错误。

      顺手还附带一个工程甜头：哪怕操作系统在物理内存里只凑得出零散的好几个 4 KB 碎片页，IOMMU 映射表一兜，外设看见的依然是一段整整齐齐连续的地址，单子好填得多。代价是每次 DMA 多了一步查表翻译（靠 IOMMU 内部自带的翻译缓存——类似 CPU 的 [[TLB]]——来加速），且操作系统得提前把映射表建好维护好。记住这条底层铁律：**任何能独立往内存发请求的硬件，它的地址都必须被翻译和划界**。
    derivation: original
    sources:
      - ref: linux-iommu-docs
        locator: Intel IOMMU Support 一节（IOVA 与每设备域）
