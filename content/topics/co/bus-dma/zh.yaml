            - v: 中间逐字搬运时 CPU 参与 0 次
              mark: found
    log:
      - mode: 搬运中
        event: DMA 后台搬运，CPU 做其他工作
      - mode: 完成
        event: 长度归零，发出唯一一次中断
  - id: cycle-stealing
    title: 抢带宽怎么让路：周期窃取与突发模式
    tldr: "[[DMA]] 搬数据用的正是 [[CPU]] 取指令、读内存要用的同一条总线：每次只抽 1 个周期搬 1 个字就交还（周期窃取），对 CPU 几乎无感；一口气占着总线搬完整块（突发模式），总时长最短但 CPU 得整段干等。"
    body: |-
      [[DMA]] 省下了 CPU 的算力，却省不掉总线带宽——它往内存写数据时，走的正是 CPU 没命中缓存时也要去内存拿数的那同一条路。如果这一拍总线正被 DMA 握着，CPU 的取指或访存流水线就得停下来等一拍。所以真正的工程取舍在于：DMA 该按什么节奏和 CPU 错开用路？

      第一种节奏叫**周期窃取**（cycle stealing）：DMA 每次只申请占用 1 个总线周期、搬走 1 个字就立刻把总线还给 CPU，等下一拍设备备好下个字再来「偷」一拍。拿慢速设备算笔账：假如一个外设每 1000 个总线周期才备好 1 个字，DMA 每次只抽走 1 个周期，占用的总线时间只有 `1 ÷ 1000 = 0.1%`，CPU 几乎感觉不到卡顿。

      第二种节奏叫**突发模式**（burst mode）：DMA 一拿到主设备许可就锁住通道不松手，把整块数据一口气全送完再撤——搬 1 MB 就是连续霸占 `262144` 个字的传输时间，期间 CPU 只要想访存就整段停摆干等。它的好处是省掉了二十六万次反复举手排队，也不怕中间有人插队，总搬完时间最短，高速磁盘和网卡就爱用它。两种模式占用的总线总拍数一模一样，区别只是把同一块等待切碎成细雨（周期窃取），还是打包成一场倾盆大雨（突发模式）。
    derivation: original
    sources:
      - ref: cs61c
        locator: DMA 传输模式相关讲义
        claim: 周期窃取模式下 DMA 每次只占用一个总线周期搬一个字，突发模式则连续占用总线搬完整块
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-13
    canvas:
      kind: datastate
      structure: array
      caption: 同一笔占用，切碎还是打包：总量相同，打断 CPU 的形状不同
      rows:
