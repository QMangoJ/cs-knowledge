  - id: dma-flow
    title: 全程追踪：DMA 读 1 MB 数据，CPU 全程只出场 2 次
    tldr: 从填单、离场、后台抢道搬运到最后收一次完成中断，无论搬 4 KB 还是 1 MB，[[CPU]] 全程都只出现 2 次，把按字节计费的参与成本压成常数。
    body: |-
      拿上一步那张四项设置单，把读 4 KB 一页磁盘数据的全程从头走到尾。
      第 1 步，**填单开工**：[[CPU]] 把目的内存地址、长度 `4096`、方向「磁盘→内存」写进 [[DMA]] 寄存器，顺手叫磁盘控制器开始读盘。
      第 2 步，**CPU 离场**：填完单子 CPU 立刻切去跑其他程序——接下来几毫秒磁盘慢慢转、缓冲慢慢搬，全和它没关系。

      第 3 步，**后台自主搬运**：磁盘把数据备好进缓冲后，DMA 控制器自己向总线仲裁申请主设备权限，把数据一段一段直接写进内存，地址从起点顺着加、剩余长度从 `4096` 一路倒数到 `0`。
      第 4 步，**发唯一一次中断**：长度归 `0` 那一刻，DMA 敲一次门发完成中断。
      第 5 步，**CPU 验收收工**：CPU 响应这一次中断，扫一眼状态寄存器确认没出错，直接拿这页新数据继续往下用。

      把 1 MB 的账摆到一起看多震撼：同样读 1 MB（262144 个 4 字节字），CPU 亲手逐字搬要出手 **262144 次**；换成 DMA，CPU 的全部动作就是**开头设置 1 次 + 结束收中断 1 次 = 2 次出场**，中间那二十六万多个字它连看都没看一眼！而且不管数据涨到 10 MB 还是 1 GB，CPU 出场次数依然是个常数，这才是 DMA 最根本的价值。
    derivation: original
    sources:
      - ref: cs61c
        locator: DMA 相关讲义
        claim: DMA 传输完成后控制器以一次中断通知 CPU，传输期间 CPU 可执行其他工作
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-13
    canvas:
      kind: datastate
      structure: array
      caption: 搬 1 MB 的总账：逐字 262144 次参与，对 DMA 的 1 次设置加 1 次中断
      rows:
