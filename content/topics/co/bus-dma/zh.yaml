  - id: arbitration
    title: 多个设备同时申请怎么办：仲裁与总线主设备
    tldr: 总线同一时刻只能服务一对部件，新问题马上来了：[[CPU]] 想取指令、网卡同时想写内存，两边一起上路会撞在一起。这一步看管秩序的办法：同一时刻只许一个设备发起传输，这个发起者叫总线主设备，谁来当，由仲裁决定。
    body: |-
      先说清一个前提：总线同一时刻只能传一份地址和一份数据，这是物理连线决定的，不是谁定的规矩。两个设备同时往线上放信号，电信号叠在一起，谁的都读不出来。仲裁要解决的，就是在这种硬约束下排队的问题。
      共享的麻烦随之而来：CPU 正想从内存取下一条指令，网卡同时收到一个数据包想写进内存，两边都把请求摆上了控制线。若没有规矩，两边的地址和数据会同时挤上总线，互相覆盖，传回来的只能是乱码。所以共享通路的第一条规矩是：任一时刻，只允许一个设备发起传输。

      能发起传输的设备有个名字，叫总线主设备（bus master）：它有权把地址放到地址线上、驱动控制线说清读还是写；其余设备这一轮只是被访问的一方，叫从设备。内存永远是典型的从设备，它从不主动发起，只被动响应。CPU 平时是主设备，但请特别注意，它只是能当主设备的成员之一，不是这条街天生的主人。

      谁当下一轮主设备，由仲裁（arbitration）决定：想上街的设备在控制线上举手发请求，仲裁逻辑按优先级或轮转顺序发许可，拿到许可的才上街，传输结束交还。仲裁可以是集中的一个仲裁器统一发号，也可以是分布式的各设备按规则自决，本课只需记住机制本身：请求、许可、占用、释放，四步循环。代价也直白：仲裁本身要花时间，设备多了、请求密了，排队等待会吃掉一部分带宽——这是所有共享资源的共同命运，日后看多核争缓存、线程争锁，底层都是同一道题。
    derivation: original
    sources:
