            - v: 目的地址：数据要搬到的位置
            - v: 长度：这次一共搬多少字节
            - v: 方向：从设备读进内存，还是从内存写出到设备
              mark: found
        - label: 分工
          cells:
            - v: CPU 只负责填这一张单子
              mark: found
            - v: 填完单子后，DMA 控制器自己把整块数据搬完
              mark: active
    log:
      - mode: DMA 设置
        event: CPU 写入四个寄存器后离开
  - id: dma-flow
    title: 走完全程：一次磁盘读的 DMA 之旅
    tldr: 单子的四项填法知道了，这一步跟着一次真实的磁盘读从头走到尾：填单、CPU 离场、后台搬运、结束时发一次中断、CPU 回来看结果。重点看一个对比——搬 4 KB 如此，搬 1 MB 也如此，CPU
      都只在头尾出现，逐字搬运和这种办法里 CPU 出现的次数差多少。
    body: >-
      把镜头对准一次完整的磁盘读，目标仍是把 4 KB 一页读进内存指定区域。第一步，CPU 填单：把目的内存地址、长度 4096、方向为设备到内存写进 [[DMA]]
      寄存器，再命令磁盘控制器开始读盘。第二步，CPU 离场，去执行其他进程的指令，或者接着算不需要这页数据的部分——从这一刻起，这页数据的旅程与它无关。


      第三步，磁盘把数据准备进自家缓冲后，DMA 控制器向仲裁申请总线，拿到许可成为主设备，把数据一段段写进内存：地址从目的地址起步逐段递增，剩余长度从 4096 一路减到 0。整个搬运期间总线被 DMA 与
      CPU 轮流使用，具体怎么轮流是下一步的主题，这里只需知道搬运在后台持续推进。第四步，长度归零，DMA 发出唯一一次中断。


      第五步，CPU 响应中断，看一眼状态确认无误，回来使用这页数据，全程结束。把必算的账摆在这里收口：同样搬 1 MB，逐字搬运要 CPU 参与 262144 次，DMA 方式下 CPU 的参与是 1
      次设置（填单）加 1 次完成中断，总共 2 次出场，中间 262144 个字的搬运它一次都不碰。数据量越大，这个差距越悬殊：参与次数从跟字节数成正比，变成与字节数无关的常数。这就是 DMA 的全部价值：CPU 参与的次数不再随数据量增长，固定为一次设置加一次完成中断。
    derivation: original
    sources:
      - ref: cs61c
        locator: DMA 相关讲义
        claim: DMA 传输完成后控制器以一次中断通知 CPU，传输期间 CPU 可执行其他工作
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-13
    canvas:
      kind: datastate
      structure: array
      caption: 搬 1 MB 的总账：逐字 262144 次参与，对 DMA 的 1 次设置加 1 次中断
      rows:
        - label: 逐字搬运
          cells:
            - v: CPU 参与 262144 次
              mark: active
        - label: DMA
          cells:
            - v: 开始时设置 1 次
              mark: found
            - v: 搬完后发 1 次完成中断
              mark: found
            - v: 中间逐字搬运时 CPU 参与 0 次
              mark: found
    log:
      - mode: 搬运中
        event: DMA 后台搬运，CPU 做其他工作
      - mode: 完成
        event: 长度归零，发出唯一一次中断
  - id: cycle-stealing
    title: 抢带宽的取舍：周期窃取与突发模式
    tldr: 全程走完，还剩一个没算的账：[[DMA]] 搬运占用的正是 [[CPU]]
      取指访存要用的同一条总线，两边会正面抢。这一步比较两种占用节奏，一种是每次只偷一个周期、搬一个字就还回去，另一种是整块数据一口气搬完，前者影响小、后者总时长短。
    body: >-
      DMA 不是免费的，它搬运走的正是 CPU 取指访存要用的同一条总线。CPU 若这一拍正要去内存取数据，而总线被 DMA
      占着，它只能停一拍等——这就从指令周期一课的流水线视角看得很清楚：访存级被堵住，后面全队都要慢下来。所以问题不是 DMA 用不用总线，而是它以什么节奏用。


      第一种节奏叫周期窃取（cycle stealing）：DMA 每搬一个字，只占用一个总线周期，然后立刻把总线还给 CPU，下一个字再来偷一个。名字里的偷很传神：趁 CPU
      不注意抽走一拍，单次影响小到几乎无感。算笔账，假设设备每 1000 个总线周期才备好一个字（慢速设备的常态），DMA 偷走的比例是千分之一，也就是约 0.1% 的总线时间，CPU 几乎察觉不到。


      第二种节奏叫突发模式（burst mode）：DMA 一旦拿到总线，就把整块数据一口气搬完再释放。搬 1 MB 就是连续占用 262144 个字的传输时间，期间 CPU
      只要需要访存就整段干等。它的好处是省掉了反复申请释放的开销、也没有别的设备插队，传输总时长最短，磁盘、网卡这类大块高速设备偏爱它。取舍的实质是把同一笔总线占用切碎还是打包：总量都是 262144
      个字的传输时间不变，变的是 CPU 被打断的形状——细水长流的零星停顿，还是集中一次的长停顿。选哪种看设备速度与系统对延迟的敏感程度，没有通吃答案。
    derivation: original
    sources:
      - ref: cs61c
        locator: DMA 传输模式相关讲义
        claim: 周期窃取模式下 DMA 每次只占用一个总线周期搬一个字，突发模式则连续占用总线搬完整块
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-13
    canvas:
      kind: datastate
      structure: array
      caption: 同一笔占用，切碎还是打包：总量相同，打断 CPU 的形状不同
      rows:
        - label: 周期窃取
          cells:
            - v: 搬一字偷一周期
              mark: found
            - v: 慢设备下约占 0.1%
              mark: found
        - label: 突发模式
          cells:
            - v: 整块 262144 字连续占用
              mark: active
            - v: 总时长最短，CPU 整段等
              mark: active
    log:
      - mode: 周期窃取
        event: 每次只占用一个总线周期搬一个字，搬完马上把总线还给 CPU
      - mode: 突发
        event: 整块搬完才释放，CPU 期间访存停等
  - id: coherence-problem
    title: 悬案：DMA 写完内存，缓存里却是旧的
    tldr: 抢带宽的问题说清了，还有一个更隐蔽的后果。[[DMA]] 是绕过 [[CPU]] 直接改内存的，可 CPU
      的缓存里还躺着同一地址的旧副本，而且没人通知它。这一步走一遍事故是怎么发生的：新数据明明已经到了内存，CPU 读到的却还是旧的。
    body: >-
      回收缓存一课的旧知识：CPU 读数据先看自己的缓存，命中就直接用缓存里的副本，并不去内存核对。过去这没有问题，因为改数据的只有 CPU 自己，一致性由 [[MESI]]
      这类协议在各核心的缓存之间维持。现在局面变了：DMA 控制器是一个不经过任何缓存、直接读写内存的改数据者，缓存协议根本看不见它。


      把事故走一遍。某块内存区域的数据先前被 CPU 读过，它所在的缓存行还躺在 [[L1]] 里，内容是旧值。网卡收到新数据，DMA 把新值直接写进这块内存，写完发中断通知 CPU。CPU
      回来读这块数据，先查缓存：命中。于是它心满意足地拿走了旧值，新数据明明已经在内存里，却被一份没人通知要作废的旧副本截了胡。反方向同样成立：CPU
      把新数据写在缓存里还没写回（写回策略下脏行就待在缓存里），DMA 从内存读走的会是更旧的值。


      现实的修法有三类：硬件让 DMA 传输也走缓存一致性检查，自动作废或更新相关行，叫硬件一致性，[[x86]] 平台多属此类；软件在 DMA 前后显式地把相关缓存行写回或作废，不少嵌入式与 [[ARM]]
      平台靠驱动这么做；或者干脆把 DMA
      用的缓冲区划为不可缓存区域，绕开问题但牺牲速度。本课点到为止：记住为什么会有这道裂缝就够了——多个改数据者加多份副本，必然要有一套谁说了算的规则。下一课的内存一致性模型，正是把这套规则对多核与设备统一讲透。

      再补清一个概念：这里说的「旧副本」不是内存里的数据旧，而是同一份数据现在同时存在两个地方——内存里是新值、缓存里是旧值——两个地方说法不一致。单看任何一边都没有错，错在 CPU
      默认缓存里的就是最新的，而这个默认在多了一个改数据的人之后不再成立。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 6 章缓存一致性相关节
        claim: 设备经 DMA 直接写内存可使 CPU 缓存中的副本过期，需要硬件或软件手段维护一致性
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-13
    canvas:
      kind: datastate
      structure: array
      caption: 同一地址两份视图：内存已是新值，缓存还躺着旧副本
      rows:
        - label: 内存
          cells:
            - v: DMA 刚写入的新值
              mark: found
        - label: CPU 缓存
          cells:
            - v: 同一地址的旧副本
              mark: active
            - v: 命中即读到旧值
              mark: active
    log:
      - mode: 不一致
        event: DMA 改了内存，缓存副本未被通知
  - id: iommu
    title: 设备的地址也要管：IOMMU 一瞥
    tldr: 上一步是数据新旧的问题，这一步换成安全问题：设备既然能自己读写内存，它要是乱写怎么办。先交代一个前提——[[CPU]]
      发出的地址要先经过翻译和检查才能落到内存上，设备这边也需要同样的把关，这一步看给设备把关的 [[IOMMU]] 是怎么工作的。
    body: |-
      先补一个前面用过、但没有正式交代的前提：CPU 平时发出的地址并不是内存的真实门牌号，而是虚拟地址，要先由 [[MMU]] 查一张表翻译成物理地址，表里没有的地址直接报错，进程因此碰不到别人的内存。这一步问的是：设备这边有没有同样的翻译和把关。
      先想一个安全问题。[[DMA]] 让设备能自己读写内存，凭的是 CPU 填单时给的地址。可设备若出了故障、或被恶意程序操纵，在单子之外乱写一气，它就能把数据写进操作系统的内核区域、甚至别的进程的内存——一个能直达内存又无人看管的搬运工，本身就是一道后门。虚拟机场景更尖锐：设备直通给某个虚拟机使用时，它绝不能碰到宿主机和其他虚拟机的内存。

      解法是给设备的地址也加一层翻译和检查，靠的是 IOMMU（输入输出内存管理单元）。它做的和 CPU 侧的 MMU 是同一件事，只是对象换成设备：CPU 发出的虚拟地址要经 MMU 查页表翻译成物理地址，页表里没有的地址直接报错，进程因此只能碰自己的内存；到了设备这边，设备在单子上写的地址先被当作设备侧的虚拟地址，IOMMU 按该设备专属的映射表翻译成物理地址，没登记的地址一律拦截。

      于是每个设备只能看见、也只能碰到被明确授权给它的那几块内存，设备之间、设备与系统之间被硬件隔开。附带的好处是，设备看到的地址可以是一段连续区间，背后对应物理上零散的页，单子因此更好填。代价是每次 DMA 都多一层翻译查表，靠 IOMMU 内部的翻译缓存摊薄，以及映射表要由操作系统提前建好。本课只需建立直觉：只要一个部件能独立访问内存，它的地址就必须被翻译和检查，CPU 如此，设备亦然——这条原则在下一课和后面讲虚拟化时还会回来。
    derivation: original
    sources:
      - ref: linux-iommu-docs
        locator: Intel IOMMU Support 一节（IOVA 与每设备域）
        claim: IOMMU 为每个设备维护独立的 I/O 虚拟地址域并把设备 DMA 地址翻译为物理地址，从而隔离设备可访问的内存
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-13
      - ref: linux-kernel-docs
        locator: IOMMU 与 DMA 相关文档
        claim: Linux 通过 IOMMU 子系统管理设备的 DMA 地址翻译与隔离
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-13
    canvas:
      kind: datastate
      structure: array
      caption: 设备地址先过 IOMMU 查表：登记过的才放行到物理内存
      rows:
        - label: 设备单子
          cells:
            - v: 设备侧地址
            - v: 经 IOMMU 翻译
              mark: found
        - label: 结果
          cells:
            - v: 授权区间的物理地址
              mark: found
            - v: 未登记地址被拦截
              mark: active
    log:
      - mode: IOMMU
        event: 设备地址翻译后放行，未授权访问被拦
  - id: lesson
    title: 选型纪律：小而急自己搬，大块交给 DMA
    tldr: 最后把全课收成一条能直接用的选型纪律。判断只看两笔账的对比：数据小、又急着马上要用，填单的固定开销不划算，[[CPU]] 自己搬；数据成块、CPU 拿到整块之前也做不了别的，就交给
      [[DMA]]。这一步把界限划清楚。
    body: >-
      全课收成一条可执行的纪律。先看反面：读一个键盘按键、查一次传感器状态，数据只有一两个字节，且程序正等着这个结果做下一步判断——这时填一张 DMA 单子的寄存器写入、中断响应加起来的固定开销，比 CPU
      自己读一趟还贵，而且 CPU 反正要等结果，离场也无处可去。这类小而急的活，轮询或一次中断直接搬走就是对的，[[GPIO]] 与串口至今这么工作。


      再看正面：磁盘整页整文件地读、网卡成批收发数据包、[[GPU]] 整批拷入权重与显存数据，数据以 KB、MB 计，且 CPU 拿到整块之前无事可做于这块数据——这类大块活交给 DMA，CPU
      的参与从按字计费变成两次出场，省下的时间去跑真正的计算。判断线不在某个固定字节数上，而在比较两笔账：数据的字数乘以逐字成本，对比一次设置加一次中断的固定成本，前者明显大，就交出去。


      最后把全课的线收拢。总线是共享通路，共享就要仲裁，仲裁承认了 CPU 不是唯一主人；主人不止一个之后，让设备自己搬运的 DMA
      才顺理成章，而它又带来两个新问题：抢带宽的节奏要用周期窃取与突发模式去调，改内存的副作用要用一致性规则与 [[IOMMU]]
      去管。一句话带走：内存同时被 CPU、设备等多个部件读写，本课讲的全是它们共用内存时要守的规矩，下一课就去细看其中最难的那条——多个 CPU 核同时改同一个变量时，以谁的版本为准。
    derivation: original
    sources:
      - ref: csapp
        locator: 第 10 章系统级 I/O 相关节
        claim: DMA 的设置开销需由足够大的传输量摊薄，小传输用程序控制或中断方式更合适
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-13
    canvas:
      kind: datastate
      structure: array
      caption: 选型只比两笔账：逐字总成本对一次设置加一次中断的固定成本
      rows:
        - label: 小而急
          cells:
            - v: 一两字节、立刻要用
            - v: CPU 自己搬
              mark: found
        - label: 大块
          cells:
            - v: KB 到 MB 级整块
            - v: 交给 DMA
              mark: found
    log:
      - mode: 总结
        event: 小而急自己搬，大块交给 DMA
quiz:
  - q: 搬运 1 MB 数据（每字 4 字节），逐字搬运与 DMA 的 CPU 参与次数分别约是？
    options:
      - 1024 次与 256 次
      - 262144 次与 1 次设置加 1 次完成中断
      - 262144 次与 262144 次，DMA 只是搬得快些
      - 256 次与 2 次
    answer: 1
    explain: 1048576 除以 4 等于 262144 个字，逐字搬运每个字都要 CPU 出手；DMA 只在填单与完成中断时各出场一次，中间搬运与字节数无关。
  - q: 关于总线主设备与仲裁，正确的是？
    options:
      - CPU 是总线唯一的主人，设备只能被动等待
      - 内存可以主动发起传输，是最常见的主设备
      - 任一时刻只有一个主设备，CPU、DMA 控制器等都需经仲裁拿到许可才能当
      - 仲裁的作用是给数据加密
    answer: 2
    explain: 总线是共享连线，同时发起会互相覆盖；仲裁按请求发许可，拿到许可的设备这一轮当主设备，CPU 只是候选之一。
  - q: 周期窃取与突发模式的核心区别是？
    options:
      - 周期窃取不占总线，突发模式占总线
      - 两者占用的总线总量相同，区别在切碎零星占用还是整块连续占用
      - 突发模式下 CPU 参与每次搬运
      - 周期窃取只用于键盘，突发只用于 CPU 取指
    answer: 1
    explain: 搬同样多数据，总占用时间一样；周期窃取把打断切成零星小停顿，突发把停顿集中成一整段，但省了反复申请的开销、总时长最短。
  - q: IOMMU 解决的核心问题是？
    options:
      - 让 DMA 搬得更快
      - 给 CPU 的虚拟地址做翻译
      - 翻译并检查设备的 DMA 地址，让每个设备只能访问被授权的内存
      - 维护 CPU 缓存与内存的一致性
    answer: 2
    explain: 设备能独立读写内存后必须有人看管它的地址：IOMMU 按设备专属映射表翻译地址、拦截未授权访问，实现设备与系统、虚拟机之间的隔离。
design:
  - mechanism: DMA 控制器作为专用搬运硬件，CPU 只写入源地址、目的地址、长度与方向，整块传输由控制器自行经总线完成，结束时以一次中断通知。
    problem: 数据搬运不需要任何计算与判断，却在程序控制与中断驱动方式下逐字占用全机最贵的 CPU：搬 1 MB 要 CPU 参与 262144 次，数据量越大浪费越线性放大。
    choice: 把搬运从计算中剥离给专用硬件，CPU 的成本由按字计费改为常数：一次设置加一次完成中断，无论搬 4 KB 还是 1 MB 都只出场两次。
    tradeoff: 多一块硬件与一套寄存器接口，且每次传输有填单的固定开销，小而急的一两字节传输用 DMA 反而比 CPU 自己搬更贵；DMA 还占用总线带宽，与 CPU 访存正面竞争。
    root: 根源是成本结构的不对称：CPU 的时间贵在计算能力，搬运的价值只与字节数成正比、与计算无关，让最贵的部件干最不需要计算的活，在任何规模下都是错配。
  - mechanism: 所有部件共享一组总线连线（地址、数据、控制三组），同一时刻由仲裁选出一个总线主设备发起传输，其余设备等待许可轮转。
    problem: 若每个部件都与内存点对点单独连线，连线与接口数量随部件数平方级膨胀且难以扩展新设备；可一旦共享连线，多方同时发起又会互相覆盖数据。
    choice: 用共享换成本与可扩展性，用仲裁换秩序：新设备挂上总线即可加入，代价是所有传输排进同一条队列，按请求与许可的节奏分时复用这条物理通路。
    tradeoff: 总线带宽成为全机共享的上限，设备越多争抢越明显，仲裁等待直接吃带宽；这也是后来的系统走向点对点互连（如 PCIe 链路）的推力所在。
    root: 根源是物理连线的成本与共享介质的争用这对矛盾本身：分时复用是让有限连线服务多方主体的唯一通用办法，而复用必然要求某种形式的仲裁与排队。
  - mechanism: IOMMU 位于设备与内存之间，按每个设备专属的映射表把设备给出的地址翻译为物理地址，未登记的地址直接拦截报错。
    problem: DMA 让设备获得独立读写内存的能力后，一个故障或恶意的设备可以把数据写进内核或别的虚拟机的内存，软件层面的检查拦不住已经发到总线上的传输。
    choice: 把 CPU 侧 MMU 的成熟思路复制到设备侧：地址翻译与权限检查下沉到硬件，每个设备只看得见被授权的内存区间，隔离不再依赖设备驱动写得对不对。
    tradeoff: 每次 DMA 多一层查表翻译，要靠翻译缓存才能不拖慢传输；映射表须由操作系统提前建立与维护，配置错误会让合法传输也被拦截，排障成本上升。
    root: 根源是能力与约束必须成对发放：任何能独立访问内存的主体，无论 CPU 进程还是外设，其地址空间都必须被翻译和圈定，否则共享内存就等于无边界内存。
