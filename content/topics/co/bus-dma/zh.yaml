aiLink: 大模型推理时，权重、KV Cache 与输入数据要在主机内存与 GPU 显存之间来回搬运，走的正是 DMA 这条路：CPU 只填一次设置，搬运由 DMA 引擎整块完成，搬运带宽与 CPU
  算力一样是推理流水线的一等瓶颈。
steps:
  - id: why
    title: 先算账：让 CPU 亲手搬 1 MB 数据要跑 26 万趟
    tldr: 把整块数据从磁盘挪进内存纯属机械体力活，如果按每趟 4 字节让 [[CPU]] 亲自接手，读 1 MB 就得连续出手 262144 次，全机最贵的芯片几乎全耗在当搬运工上。
    body: |-
      拿前面立好的磁盘读场景算第一笔账：程序要从磁盘读一页 4 KB（4096 字节）的数据放进内存。最直白的做法是让 [[CPU]] 亲自动手：发一条 [[load]] 指令从磁盘控制器的缓冲里抓出 4 个字节放进自己寄存器，再发一条写指令存进内存，然后地址加 4、计数器减 4、判断搬完没有，接着下一轮。

      数一数这一页要跑多少趟：`4096 ÷ 4 = 1024`。光这一小页，CPU 就要亲自出手 1024 次、至少执行两千多条访存指令，还没算循环计数和跳转。把同一件事放大到 1 MB（`1,048,576` 字节）：`1,048,576 ÷ 4 = 262,144` 次出手！数据量涨 256 倍，CPU 陪跑的次数也跟着涨 256 倍，算力全被死死锁在当搬运工上。

      等一下，为什么说这种搬运完全用不上 CPU 的聪明脑子？因为从第 1 个字节到第 1048576 个字节，每个字从哪儿拿、往哪儿放，在开始搬之前就已经全写死了，中途根本不需要看数据内容做半点条件判断。凡是规则定死、只剩机械重复的活，都应该从昂贵的 CPU 手里摘出来交给专用硬件——这就是后面出场的主角 [[DMA]] 控制器；而在此之前，得先看清所有搬运都要走的那条公共公路：总线。
    derivation: original
    sources:
