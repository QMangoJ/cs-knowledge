        event: 小而急自己搬，大块交给 DMA
quiz:
  - q: 搬运 1 MB 数据（每字 4 字节），逐字搬运与 DMA 的 CPU 参与次数分别约是？
    options:
      - 1024 次与 256 次
      - 262144 次与 1 次设置加 1 次完成中断
      - 262144 次与 262144 次，DMA 只是搬得快些
      - 256 次与 2 次
    answer: 1
    explain: 1048576 除以 4 等于 262144 个字，逐字搬运每个字都要 CPU 出手；DMA 只在填单与完成中断时各出场一次，中间搬运与字节数无关。
  - q: 关于总线主设备与仲裁，正确的是？
    options:
      - CPU 是总线唯一的主人，设备只能被动等待
      - 内存可以主动发起传输，是最常见的主设备
      - 任一时刻只有一个主设备，CPU、DMA 控制器等都需经仲裁拿到许可才能当
      - 仲裁的作用是给数据加密
    answer: 2
    explain: 总线是共享连线，同时发起会互相覆盖；仲裁按请求发许可，拿到许可的设备这一轮当主设备，CPU 只是候选之一。
  - q: 周期窃取与突发模式的核心区别是？
    options:
      - 周期窃取不占总线，突发模式占总线
      - 两者占用的总线总量相同，区别在切碎零星占用还是整块连续占用
      - 突发模式下 CPU 参与每次搬运
      - 周期窃取只用于键盘，突发只用于 CPU 取指
    answer: 1
    explain: 搬同样多数据，总占用时间一样；周期窃取把打断切成零星小停顿，突发把停顿集中成一整段，但省了反复申请的开销、总时长最短。
  - q: IOMMU 解决的核心问题是？
    options:
      - 让 DMA 搬得更快
      - 给 CPU 的虚拟地址做翻译
      - 翻译并检查设备的 DMA 地址，让每个设备只能访问被授权的内存
      - 维护 CPU 缓存与内存的一致性
    answer: 2
    explain: 设备能独立读写内存后必须有人看管它的地址：IOMMU 按设备专属映射表翻译地址、拦截未授权访问，实现设备与系统、虚拟机之间的隔离。
design:
  - mechanism: 加一块专用 DMA 控制器，CPU 只填源地址、目的地址、长度和方向四项设置，搬完收一次中断。
    problem: 搬运数据本身不需要半点条件判断和数学运算，却让全机最贵的 CPU 一个字一个字陪跑——搬 1 MB 要出手 262144 次，数据翻多少倍浪费就翻多少倍。
    choice: 把「发号施令」和「体力搬运」拆开：CPU 只在头尾出场 2 次（填单 + 验收），中间整块搬运交给只会挪字节的便宜专用硬件在后台跑完。
    tradeoff: 多一块硬件芯片，且每次传输要付填单和收中断的固定门票钱——所以一两个字节又立等要用的小数据反而亏，且 DMA 还会占总线和 CPU 抢带宽。
    root: 本质是算力错配：CPU 的值钱之处在复杂计算和分支判断，把只跟字节数成正比的机械拷贝交给它，在任何规模下都是最不划算的买卖。
  - mechanism: 所有部件共用地址、数据、控制三组总线连线，靠仲裁每轮挑出一个主设备发号施令。
    problem: 要是每个部件都和内存点对点单拉专线，连线数会随设备数平方级暴涨、也没法随便加扩展卡；可一旦共用铜线，两家同时开口信号就撞成乱码。
    choice: 用分时复用的公共道路换主板布线简洁和可插拔扩展性，再配一套仲裁器按规则轮流发通行许可，保证同一拍只有一家当主设备。
    tradeoff: 所有设备抢同一条总线的带宽上限，挂的部件越多排队等许可的损耗越明显——这也正是现代高速总线后来改用点对点多通道链路（如 PCIe）的原因。
    root: 物理连线成本和共享介质争用是一体两面：让有限铜线服务多方主人必然要分时复用，而复用就一定得配仲裁排队。
  - mechanism: 在设备和物理内存之间挡一道 IOMMU，按设备专属映射表把设备地址翻译并检查后再放行。
    problem: DMA 让外设有了绕开 CPU 自己读写内存的本事，一旦驱动传错地址、或者遇上坏固件和直通虚拟机，设备就能直接把内核或邻居的内存写烂。
    choice: 把 CPU 侧 MMU 验证页表的成熟防线照搬到外设侧：每台设备只准用操作系统签发的虚拟地址，未登记的物理地址在硬件门口一律拦截报错。
    tradeoff: 每笔 DMA 多了一道查表翻译（靠内部翻译缓存兜住速度），操作系统也得额外维护每台设备的映射表；一旦驱动漏登记，合法传输也会被当场拦停。
    root: 能力必须配围栏：只要某个部件能独立往内存发读写请求，不管它是 CPU 进程还是外部设备，它的地址就必须经过翻译和权限划界。
