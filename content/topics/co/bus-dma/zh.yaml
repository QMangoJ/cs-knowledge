title: 总线与 DMA（Direct Memory Access，直接内存访问）：不止一个主人
summary: "[[CPU]]、[[GPU]]、磁盘与网卡都要用同一条通路访问内存：总线定规矩、仲裁分先后，[[DMA]] 让设备绕过 CPU 自己搬整块数据。"
premise: 电脑要从磁盘读一大块数据进内存，如果每个字节都让 CPU 亲自搬，CPU 就什么正事都干不了了。有没有办法让设备自己把数据搬好、CPU 只在头尾出现两次？本课以磁盘读一页 4 KB、再读 1 MB
  数据进内存为例，看总线和 DMA 怎样分工。
position: 本课是组成科新板块「不止一个主人：设备与多核共享内存」的第一站，入口接在上一课 gpu-simt 之后：GPU 的海量线程最终也要经一条共享通路去抢内存带宽，内存从来不只服务 CPU
  一个消费者。学完你能算清逐字搬运与 DMA 在 CPU 参与次数上的差距，也能讲明白仲裁、周期窃取与 [[IOMMU]] 各自解决什么问题；下一课的内存一致性模型，就从本课末尾 DMA
  改完内存、缓存却还躺着旧副本这个悬案接着讲。
bridge:
  prev: 上一课 gpu-simt 里，GPU 靠海量线程访存掩盖延迟，它本身就是内存的一个大胃口消费者；而 CPU、磁盘、网卡同样在排队用内存——总线与 DMA
    正是所有设备共享这条内存通路时必须遵守的规矩，本课就把这套规矩拆开看。
  next: 设备经 DMA 写进内存的值，CPU 却可能读到缓存里的旧副本——这还只是两个主人；下一课看多个 CPU 核同时读写时，为什么连刚写进去的值都可能暂时读不到。
overview:
  - key: 一句话总结
    value: 总线是所有设备共享的内存通路，谁要用都要排队走它。[[DMA]] 让设备自己搬整块数据，[[CPU]] 只在开始时填一张单子、结束时收一次中断，中间不用管。
  - key: 总线三组线
    value: 总线分三组线，地址线报门牌号，数据线运货物，控制线发信号和做仲裁。三组各管一摊，一次传输就是先报地址、再运数据、全程听控制线指挥。
  - key: 总线主设备
    value: 任一时刻能主动发起传输的设备叫当前主设备。CPU 只是主人之一，网卡、磁盘控制器也都能当，要靠仲裁轮流来，谁也不能一直占着。
  - key: 必算的账
    value: 搬 1 MB 数据如果逐字让 CPU 参与，要参与 262144 次。换成 DMA 只需要 1 次设置加 1 次完成中断，差距就是几十万次和两次的区别。
  - key: 抢带宽的取舍
    value: DMA 搬运要和 CPU 抢总线带宽，周期窃取把占用切成小片，影响小但搬得慢。突发模式整块占用总线，搬得快，但那段时间 CPU 只能整段等着。
  - key: 两个后续问题
    value: DMA 带来两个后续问题，一是它写完内存后，CPU 缓存里同一地址的旧副本怎么办，这是一致性问题。二是设备用的地址也要翻译和隔离，不能让它乱碰内存，这就是 [[IOMMU]] 管的事。
