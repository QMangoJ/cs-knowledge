  - id: bus-what
    title: 总线是什么：一条共用路，三组信号线
    tldr: 账算完了，结论是搬运不该占着 [[CPU]]。那搬运要走的路先得看清：所有部件共用一组连线，叫总线。这一步把这条共用路拆成三组线看——一组报地址、一组运数据、一组发信号——先弄清路的规矩，再谈谁能在路上跑。
    body: >-
      先把场面摆清楚：一台电脑里，CPU、内存、磁盘控制器和网卡控制器都连在同一组总线连线上，CPU
      取指令、网卡往内存写收到的数据包，都要经过这组连线，没有各自的专线。为什么先看这条通道？因为后面仲裁、[[DMA]] 抢带宽，抢的都是它。

      正式的说法是，总线是连接 CPU、内存与 I/O 设备的一组共享连线，同一时刻只允许一对部件在上面完成一次传输。这组连线同一时刻只能服务一对部件，谁想用都得先拿到许可——这条约束是后面仲裁和 DMA 抢带宽的全部背景。


      这组连线按职责分成三组。地址线负责给出地址：发起传输的一方把目标地址放到地址线上，内存和各设备都盯着它看，地址是自家的才响应。数据线负责传数据：真正的数据沿数据线走，线有多宽，一次能并行运多少位就定死了，比如
      64 位数据线一次搬 8 字节。控制线负责发信号：读还是写、传输开始还是结束、设备想插队时发出的请求与仲裁给出的许可，都走控制线。


      谁挂在总线上？CPU、内存控制器、磁盘与网卡这类 I/O 设备、本课后半程的 DMA 控制器，还有上一课的
      GPU。它们在总线面前地位对等：都听得到地址线上的地址，也都有机会申请发起传输。共享带来两个立刻要回答的问题：两个设备同时想发起传输听谁的，以及 CPU 之外的设备能不能自己发起传输。这两个问题分别由下一步的仲裁和再后面的 DMA 回答。
    derivation: original
