id: distributed/mq-governance
subject: distributed
slug: mq-governance
order: 5
status: published
license: CC-BY-4.0
bridge:
  prev: 上一课把跨机事务收在幂等、去重与补偿上——但日常系统里更多的调用并不需要同生共死，它们死于洪峰、抖动与地址漂移。这一课接过幂等这块地基，给普通调用补上队列、限流、重试与治理这套续命工具。
title: 分布式进阶：消息队列、限流与重试、服务治理
summary: 同步调用在部分失败的世界里是串联的风险：能异步的交给消息队列削峰填谷，投递靠至少一次加幂等兜底；剩下的同步调用靠限流、带退避抖动的重试、重试预算与熔断降级续命；规模再大，用注册发现、配置中心、灰度与追踪把成百上千个服务管起来。
premise: 以一条广告投放请求穿过网关、审核与投放服务的旅程为样本，看它在洪峰与抖动里怎样先被改成异步、再被层层保险护住，最后被治理面管起来。
position: 本课位于分布式系统本科的第五段「进阶：让调用可靠」：前四站解决的是事实如何达成一致（顺序、共识、原子），这一站解决的是调用如何在注定失败一部分的世界里保持可用。学完本科五站，你应当能对任何一次跨机调用先问三件事：它能不能异步、失败时谁在放大、地址与配置从哪来。
overview:
- key: 一句话总结
  value: 能异步就异步（队列削峰、至少一次加幂等），必须同步就上保险（限流、退避重试、预算、熔断），规模大了靠治理（发现、配置、灰度、追踪）
- key: 消息队列
  value: 把调用拆成投递与处理两段，用存储换时间：洪峰先进队列排队，下游按自己的速率消费
- key: 投递语义
  value: 默认至少一次：不丢，但会重复；效果上的恰好一次靠消费端幂等与去重拼出来，而不是靠投递本身
- key: 重试
  value: 指数退避加全抖动错峰；每层都重试会乘法放大，重试预算给总重试量封顶
- key: 限流与熔断
  value: 令牌桶管入口速率与突发，熔断在下游病重时快速失败并给它留恢复窗口，降级用次级结果保住主流程
- key: 服务治理
  value: 注册发现解决地址从哪来，配置中心解决参数如何动态生效，灰度解决新版本如何小步放量，追踪解决一次请求死在哪一跳
visual: swimlane
lanes:
- id: up
  label: 上游：调用方与网关
- id: mid
  label: 中间层：队列与治理组件
- id: down
  label: 下游：被调用的服务
logColumns:
- key: mode
  label: 当前议题
- key: event
  label: 发生了什么
steps:
- id: sync-chain-risk
  title: 同步调用的账：每一跳都在串联风险
  tldr: 一次同步请求要穿过每一跳才算完成：可用性逐跳相乘、延迟逐跳相加，还有超时的老问题——你不知道对方到底做没做。
  body: |-
    回到第一课的清单：同步调用把「等对方做完」写进了自己的执行流。设一条链路有四跳（网关→编排→审核→存储），每跳可用性 99.9%（示例数字），整条链的可用性是 0.999 的四次方，约 99.6%——每多串一跳，就多乘一个小于一的数。延迟同理：每跳的尾部延迟（p99）是 50 毫秒量级，四跳串起来就是 200 毫秒量级起步，还没算排队。
    更麻烦的是超时的语义没变：等不到回复时，对方可能没做、可能做了没回、可能正在做（第一课与上一课的老问题），重试与否都得替这笔糊涂账负责。所以工程上的第一反应是分流：结果不必当场拿到的调用，改成异步投递；必须当场拿结果的，才留在同步链上，并给它配齐后面几站的保险。
  derivation: original
  sources:
  - ref: ddia
    locator: 第 8 章 The Trouble with Distributed Systems（不可靠的网络与超时）
    claim: 同步请求把对方的可用性与延迟串进自己的执行流；超时无法区分对方是未执行、已执行未回复还是仍在执行，这是部分失败的核心困境
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-15
  canvas:
    kind: swimlane
    actors:
    - lane: up
      id: u
      label: 调用方：等全链返回才算完
      highlight: true
    - lane: mid
      id: m
      label: 编排与审核：每一跳都可能慢、可能挂
    - lane: down
      id: d
      label: 存储服务：最后一跳
    messages:
    - id: m1
      from: u
      to: d
      label: 四跳串联，任何一跳失败即全败
      active: true
    registers:
    - name: 可用性账
      value: 0.999 的四次方 ≈ 99.6%（示例）
    - name: 延迟账
      value: 逐跳相加，尾部延迟更贵
  log:
  - mode: 链路
    event: 同步调用的成本是乘法（可用性）加加法（延迟）
- id: mq-shape
  title: 消息队列的形状：把一次调用拆成两段
  tldr: 生产者把消息投进队列就返回，消费者按自己的速率取走处理——队列是一段可排队的存储，用它换来削峰与解耦。
  body: |-
    队列把一次调用从中间剪开：上游只负责把消息可靠地放进队列（投递段），下游什么时候取、取多快，由消费段自己决定。剪开之后有三样东西立刻变了。其一，时间被解耦：洪峰到来时消息先在队列里排队，下游按恒定速率消化，不必按峰值扩容。其二，失败被隔离：下游宕机时消息留在队列里等它回来，而不是像同步调用那样当场报错给用户。其三，耦合被拆开：上游只认队列的名字，不认下游的地址与生死，下游可以独立扩缩与发布。
    代价是结果不再当场可得：调用方拿到的是「已收下」，不是「已办妥」——需要结果的场景要另配回执或查询。队列的本质是一段带顺序的可排队存储：它把时间维度上的不匹配（来得快、办得慢）转成空间上的堆积，而堆积必须有人算账——下一站就把这笔账算清。
  derivation: original
  sources:
  - ref: ddia
    locator: 第 11 章 Stream Processing（消息代理与参与者模型）
    claim: 消息代理把生产与消费在时间上解耦，代理本身作为缓冲区吸收生产与消费的速率差，消费者可以按自己的节奏处理积压
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-15
  canvas:
    kind: swimlane
    actors:
    - lane: up
      id: u
      label: 生产者：投递完就返回
    - lane: mid
      id: m
      label: 队列：可排队、可堆积的存储
      highlight: true
    - lane: down
      id: d
      label: 消费者：按自己的速率取走处理
    messages:
    - id: m1
      from: u
      to: m
      label: 投递段：放进去就算交差
      active: true
    - id: m2
      from: m
      to: d
      label: 消费段：速率由下游决定
    registers:
    - name: 换来
      value: 削峰 / 失败隔离 / 解耦
    - name: 代价
      value: 结果异步可得，堆积要算账
  log:
  - mode: 队列
    event: 调用被剪成投递与处理两段，时间差变成堆积量
- id: mq-drain-math
  title: 削峰的算术：堆积多少、多久排空
  tldr: 堆积量 =（入队速率 − 消费速率）× 持续时间；排空时间 = 堆积 ÷ 净排空速率。算不清这笔账，削峰就会削成雪崩。
  body: |-
    用示例数字算一遍（以下均为自洽的示例数字）：某审核队列在投放高峰的 10 分钟里以每分钟 5,000 条入队，消费者每分钟处理 2,000 条，堆积 =（5,000 − 2,000）× 10 = 30,000 条。高峰过后入队降到每分钟 1,000 条，净排空速率 = 2,000 − 1,000 = 1,000 条/分钟，要 30 分钟才排空；而高峰末尾入队的那条消息，前面压着 30,000 条，要等 30,000 ÷ 2,000 = 15 分钟才被处理。若高峰期把消费者临时扩到每分钟 4,000 条，堆积只到 10,000 条，高峰过后约 3.3 分钟排空——扩容消费者的决策点，就藏在这条算式里。
    业务场景示意：广告审核在投放高峰会遇到任务洪峰——大量广告集中提交、审核吞吐却相对恒定。把审核改成队列消费后，高峰只是让队列变长，机审与人审都按恒定速率工作；前提是审核任务带业务单号、消费端幂等，重复投递不会让同一条广告被审两遍（下一站）。队列不是免费的午餐：它把「当场失败」换成「延迟兑现」，延迟的上限由堆积算式决定，超了上限就得在入口限流（第六站）或拒绝低优先级任务。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: up
      id: u
      label: 提交端：高峰 10 分钟集中涌入
    - lane: mid
      id: m
      label: 审核队列：水位先涨后落
      highlight: true
    - lane: down
      id: d
      label: 审核消费者：恒定速率处理
    messages:
    - id: m1
      from: u
      to: m
      label: 入队 5,000/分钟（示例）
      active: true
    - id: m2
      from: m
      to: d
      label: 消费 2,000/分钟（示例）
    registers:
    - name: 堆积
      value: 30,000 条，排空 30 分钟（示例）
    - name: 扩容消费者后
      value: 堆积 10,000 条，约 3.3 分钟排空（示例）
  log:
  - mode: 堆积
    event: 削峰的账只有一条算式：速率差 × 时间
- id: delivery-semantics
  title: 投递语义：至少一次是默认，恰好一次靠幂等拼
  tldr: 消费者「处理完再提交位移」决定了崩溃后消息会被重投——不丢的代价是重复；把重复变无害，靠的是上一课的幂等与去重。
  body: |-
    队列凭什么不丢消息？以 Kafka 式日志队列为例：消费者处理完一批消息后才提交位移（offset），若它在处理完、提交前崩溃，接管者从旧位移重读，这批消息就被投递第二次。这不是实现缺陷，而是「不丢」与「不重」在崩溃点上只能选一边的结果（与第一课超时不可区分同源）：提交在处理前，崩溃就丢；提交在处理后，崩溃就重。所以主流队列默认至少一次（at-least-once）：保证不丢，承认会重。
    效果上的恰好一次（exactly-once）在单个队列系统内部靠事务能做到一部分，但副作用一旦落到外部系统（发短信、扣款、写另一家的库），投递层管不着——真正的解法在消费端：每条消息带业务单号，处理前先查去重表，处理动作本身幂等（上一课 Saga 的地基在这里复用）。另有一类消息永远处理不了：格式坏死、依赖永久缺失的「毒消息」。它们若留在队头反复重试，会堵死后面所有消息——重试若干次后把它们转进死信队列隔离，主队列继续走，毒消息留待人工排查。RabbitMQ 的死信交换机就是为此设的：消息被拒绝、TTL 过期、队列超长或超过投递次数上限时，会被转投到死信交换机。
  derivation: original
  sources:
  - ref: kafka-delivery-semantics
    locator: Consumer receipt 与 Exactly once support 两节
    claim: 消费者在处理后才提交位移则崩溃会造成重复处理；Kafka 默认至少一次投递，恰好一次仅限于 Kafka 内部流处理等事务型场景
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-15
  - ref: rabbitmq-dlx
    locator: What is a Dead Letter Exchange 一节
    claim: 消息在被消费者拒绝、TTL 过期、队列达到长度上限或超过投递次数上限时成为死信，被转投到死信交换机隔离处理
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-15
  canvas:
    kind: swimlane
    actors:
    - lane: mid
      id: m
      label: 队列：按位移记录消费进度
    - lane: down
      id: d
      label: 消费者：先处理、后提交位移
      highlight: true
    messages:
    - id: m1
      from: m
      to: d
      label: 崩溃后从旧位移重投同一条
      active: true
    registers:
    - name: 默认语义
      value: 至少一次（不丢、会重）
    - name: 消重
      value: 业务单号去重 + 处理动作幂等
    - name: 毒消息
      value: 死信队列隔离，人工排查
  log:
  - mode: 投递
    event: 不丢与不重在崩溃点上二选一，工业界选不丢，再用幂等消重
- id: retry-storm
  title: 重试：退避抖动错峰，预算给总量封顶
  tldr: 每层都重试，总量按乘法放大：三层链、每层多试两次，最坏 27 倍请求砸向叶子；指数退避加全抖动把重试错峰，重试预算再给总量上硬顶。
  body: |-
    同步链上剩下的调用要面对抖动：一次网络闪断、一次 GC 停顿，都不该直接判死刑——重试是标准解法，但它有个乘法陷阱。设调用链三层，每层在失败后都「首次之外再重试 2 次」（单层最多 3 次尝试）：最坏情况下，一个用户请求会在叶子服务变成 3 的三次方 = 27 次尝试（示例算式）。下游本就虚弱时，这 27 倍流量就是压垮它的最后一根稻草——重试风暴。
    两件解药。其一是指数退避加全抖动（full jitter）：第 n 次重试前睡一个随机时长 random(0, min(上限, 基础 × 2 的 n 次方))——基础 100 毫秒、上限 3.2 秒时，天花板依次是 100、200、400、800、1600、3200 毫秒，再在天花板内取随机值，让成千上万个客户端的重试时刻彼此错开，而不是整齐地同时砸回来（AWS 的模拟显示，加上抖动后竞争场景的总调用数可降一半以上）。其二是重试预算：给重试总量封顶，例如「重试次数不超过同期请求数的 20%」——叶子每秒 1,000 个请求时，每秒最多放行 200 次重试，只够 10% 的请求走完两次重试链，其余快速失败。Envoy 的熔断配置里专门有「最大并发重试数」，并官方建议改用重试预算，理由正是防止重试量爆炸成级联失败。
    业务场景示意：广告投放链路中，下游某个定向服务抖动变慢，上游各层按各自配置纷纷重试，流量在分钟级放大数倍，慢服务被重试彻底打死、恢复遥遥无期——这是重试风暴的典型剧本；止血顺序是先熔断止损（下一站），再复盘各层的重试配置是否都开着、预算是否缺位。
  derivation: original
  sources:
  - ref: aws-backoff-jitter
    locator: Adding Jitter 与 Full Jitter 两节（temp = min(cap, base × 2^attempt)，sleep = random_between(0, temp)）
    claim: 无抖动的指数退避仍会形成同步的重试簇；全抖动把重试时刻在天花板内随机摊平，100 个竞争客户端的模拟中总调用数减少过半
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-15
  - ref: envoy-circuit-breaking
    locator: Cluster maximum active retries 一节
    claim: Envoy 对并发重试数设有熔断型上限，并建议改用重试预算（retry budget）控制重试占正常流量的比例，以防重试量爆炸引发级联失败
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-15
  canvas:
    kind: swimlane
    actors:
    - lane: up
      id: u
      label: 网关：1 个用户请求
    - lane: mid
      id: m
      label: 中间两层：每层都重试 2 次
    - lane: down
      id: d
      label: 叶子服务：最坏收到 27 次尝试
      highlight: true
    messages:
    - id: m1
      from: u
      to: d
      label: 重试在每一层乘法放大
      active: true
    registers:
    - name: 放大倍数
      value: 3 的三次方 = 27（示例）
    - name: 预算口径
      value: 重试 ≤ 请求数的 20%，只够 10% 的请求重试到底（示例）
  log:
  - mode: 重试
    event: 重试是正反馈：单层是保险，三层无预算就是放大器
- id: rate-limit
  title: 限流：令牌桶管突发与匀速，超了就排队或拒绝
  tldr: 令牌桶以固定速率发令牌、桶容量决定能攒多大的突发额度；漏桶则把出口削成绝对匀速。限流只治突发，治不了持续过载。
  body: |-
    限流回答的是「最多放多快」。两种经典形状：漏桶（leaky bucket）把请求按固定速率匀速放出，来再多也排队，出口绝对平滑；令牌桶（token bucket）以固定速率往桶里放令牌，请求拿到令牌才通过，桶的容量决定突发额度——攒满的桶可以瞬间放行一波。用示例数字算令牌桶：速率每秒 100、容量 200，桶满时 350 个请求同时到达：200 个立即通过，剩下 150 个按每秒 100 的速率领令牌，最后一个等 1.5 秒；同样的 350 个请求进漏桶，最后一个要等约 3.5 秒——令牌桶对突发友好，漏桶对下游最温柔。
    但注意：若到达速率持续高于发令速率（比如每秒来 150、只发 100），桶空之后积压以每秒 50 的速度无限增长——限流只治突发，治不了持续过载，那要靠扩容或降级。落地上，单机限流只看得见自己那份流量；分布式限流要全局口径，就得把计数收拢到一处（集中式计数，代价是每次判断多一跳）或给每个节点预分配配额（本地计数，代价是口径粗）。限流触发后的动作也有讲究：排队（等一会就轮到，适合可延迟的）与拒绝（立即失败并给明确信号，适合保护性的）——选哪个取决于请求能不能等。
    业务场景示意：电商大促时工单量暴涨，客服工单平台在入口按优先级分流：高优先级（支付、履约类）走高配额通道，低优先级（一般咨询）走低配额、必要时排队或提示改走自助——限流在这里不只是保护系统，也是把稀缺处理能力按业务价值分配。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: up
      id: u
      label: 请求洪峰：350 个同时到达（示例）
    - lane: mid
      id: m
      label: 令牌桶：速率 100/秒、容量 200（示例）
      highlight: true
    - lane: down
      id: d
      label: 下游：只承受被整形过的流量
    messages:
    - id: m1
      from: u
      to: m
      label: 先领令牌再通过
      active: true
    - id: m2
      from: m
      to: d
      label: 200 个立即通过，其余按速率放行
    registers:
    - name: 令牌桶
      value: 容量决定突发额度，速率决定长期天花板
    - name: 漏桶
      value: 出口绝对匀速，最后一个等约 3.5 秒（示例）
  log:
  - mode: 限流
    event: 桶的容量决定突发的额度，速率决定长期的天花板
- id: circuit-breaker
  title: 熔断与降级：下游病重时，先止血再放行
  tldr: 熔断器像电路保险丝：失败率过线就跳闸快速失败，给下游留安静恢复的窗口，再用半开状态放探针试探；降级则用次级结果保住主流程。
  body: |-
    重试与限流都假设下游还有救。若下游已经病重（错误率飙升、延迟爆炸），继续把请求送过去只会让它更难恢复，还会拖住上游的线程与连接。熔断器（circuit breaker）的做法是学保险丝：统计一个滚动窗口内的失败比例（例如最近 20 个请求里失败过半，示例口径），过线就跳闸——之后一段时间内所有请求当场快速失败，连网络都不碰；冷却期过后进入半开状态，只放一两个探针请求试探，成功了才合闸恢复，失败则继续跳闸。
    它与重试的次序很关键：熔断在前，先判断「还值不值得试」，重试在后，只对熔断放行的请求做有限次重试——否则重试会绕过熔断的止血。Envoy 这类代理把熔断做在网络层：按集群设连接数、待处理请求数、并发请求数与并发重试数的上限，超限即溢出拒绝，不必每个应用各写一遍。降级是熔断的搭档：非核心功能（推荐、评论计数）在下游不可用时返回缓存值、默认值或直接隐藏，保住下单、支付这类核心链路——降级的本质是提前约定「什么可以先不要」。
  derivation: original
  sources:
  - ref: envoy-circuit-breaking
    locator: Circuit breaking（架构概览）一节
    claim: Envoy 在网络层按集群强制执行熔断上限（连接数、待处理请求数、并发请求数与并发重试数），理念是快速失败并尽早向调用方传递背压，而不是让请求在病重的下游排队
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-15
  canvas:
    kind: swimlane
    actors:
    - lane: up
      id: u
      label: 调用方：请求先过熔断器
    - lane: mid
      id: m
      label: 熔断器：关闭 → 打开 → 半开
      highlight: true
    - lane: down
      id: d
      label: 病重的下游：需要一段没人打扰的恢复期
    messages:
    - id: m1
      from: m
      to: d
      label: 跳闸期间只放探针请求
      active: true
    registers:
    - name: 三态
      value: 关闭（放行）/ 打开（快速失败）/ 半开（探针）
    - name: 次序
      value: 熔断在前，重试在后，降级垫底
  log:
  - mode: 熔断
    event: 熔断给下游留的不是请求，是安静
- id: service-discovery
  title: 注册与发现：地址不写死，名单实时问
  tldr: 实例会扩缩、会漂移，调用方不能把地址写进配置：实例启动时把自己登记进注册中心，下线与假死靠心跳过期剔除，调用方从名单里挑一个。
  body: |-
    前面几站的保险都假设「知道要调谁」。可云上的实例地址天天变：扩容新增、故障下线、发布换批。若把地址写死在配置里，每次变更都要改配置、重启全场。注册与发现把这件事变成运行时查询：实例启动时向注册中心登记「服务名 → 我的地址与端口」，并周期性发心跳续命；注册中心发现某个实例心跳超时，就把它从名单里剔除（宁可短暂误杀，不留死地址）；调用方按服务名查名单，在健康实例里挑一个（轮询、随机或按负载）发起调用。发现可以放在客户端（调用方直查名单、自己做负载均衡，少一跳）或服务端（经负载均衡器转发，多一跳但调用方无感）。
    有个绕不开的递归：注册中心自己就是全系统的要害，它挂了，新实例登记不上、名单也查不了——所以注册中心本身必须用共识复制做成高可用（第三课的 Raft 在这里上班），并且调用方要缓存名单，注册中心短暂不可用时按旧名单继续跑，绝不让治理面故障变成业务面故障。
  derivation: original
  sources:
  - ref: istio-traffic
    locator: Introducing Istio traffic management（service registry）一节
    claim: Istio 通过连接平台的服务发现系统填充自己的服务注册表，边车代理据此把流量导向正确的服务实例并做负载均衡，实例的扩缩对调用方透明
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-15
  canvas:
    kind: swimlane
    actors:
    - lane: up
      id: u
      label: 调用方：按服务名查名单
    - lane: mid
      id: m
      label: 注册中心：名单靠共识多副本续命
      highlight: true
    - lane: down
      id: d
      label: 实例群：启动登记、心跳续命
    messages:
    - id: m1
      from: d
      to: m
      label: 登记地址 + 周期心跳
      active: true
    - id: m2
      from: u
      to: m
      label: 查名单，挑一个健康实例
    registers:
    - name: 剔除
      value: 心跳超时下名单，宁可误杀不留死地址
    - name: 兜底
      value: 调用方缓存旧名单，注册中心宕机照常跑
  log:
  - mode: 发现
    event: 地址从配置项变成运行时名单，注册中心自己靠共识续命
- id: config-gray-trace
  title: 治理三件套：配置、灰度与追踪
  tldr: 配置中心让参数动态生效不用重启；灰度发布把新版本按比例小步放量、出事能秒回；链路追踪用一个贯穿全程的 ID 回答「这次请求死在哪一跳」。
  body: |-
    规模再上一个台阶，痛点从「调不通」变成「管不住」，三件套各管一摊。配置中心：限流阈值、熔断参数、开关这类参数若写死在代码或配置文件里，改一次要全场重启；收进配置中心后，变更推送到各实例动态生效（第六站的阈值、第五站的预算都靠它在线调整）。它的风险也对称：一条坏配置能在一分钟内推满全场，所以配置变更本身也要灰度与回滚。灰度发布（金丝雀）：新版本先接 1% 流量，盯住错误率与延迟，没问题再逐级放量到 100%；出问题时把比例拨回 0 即完成回滚——发布从「全量赌博」变成「可调的阀门」，Istio 这类网格就是按百分比与请求特征切流量的。链路追踪：一次请求穿过十几个服务，日志各记各的，靠什么拼回全程？入口生成一个 trace ID，逐跳透传，每跳把自己的耗时记成一个 span，事后按 ID 聚合，就能看见时间到底花在哪一跳、错误从哪一跳冒出来；全量记录太贵，通常按比例采样，错误请求优先留样。
    业务场景示意：跨多个数据中心的客服工单平台，服务实例分布在各地，靠注册中心按数据中心就近发现彼此，靠配置中心统一一处修改、全球生效（例如大促期间统一调低低优先级工单的配额），新版本按数据中心逐个灰度——治理三件套在这里是「多地如一地」的地基。
  derivation: original
  sources:
  - ref: istio-traffic
    locator: Virtual services（按百分比的流量切分与金丝雀发布）一节
    claim: 虚拟服务可按百分比把流量切给新版本服务做金丝雀发布，路由规则与实例的扩缩容相互独立，比例调整即完成放量或回滚
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-15
  canvas:
    kind: swimlane
    actors:
    - lane: up
      id: u
      label: 入口：生成 trace ID 贯穿全程
    - lane: mid
      id: m
      label: 治理面：配置推送、灰度切流
      highlight: true
    - lane: down
      id: d
      label: 各实例：动态生效、逐跳记 span
    messages:
    - id: m1
      from: m
      to: d
      label: 参数变更推送，不用重启
      active: true
    registers:
    - name: 配置
      value: 动态生效，但坏配置也能推满全场
    - name: 灰度
      value: 比例即阀门，回滚即拨回 0
    - name: 追踪
      value: trace ID 贯穿，采样留样
  log:
  - mode: 治理
    event: 规模的答案是把变更与观测都变成可调的阀门
- id: toolbox-map
  title: 落点：一张可靠性工具箱地图
  tldr: 按症状选工具：洪峰找队列与限流，抖动找退避重试，病重找熔断降级，地址漂移找注册发现，变更风险找配置与灰度，黑盒找追踪。
  body: |-
    把这一课收成一张地图，按症状对号入座：流量洪峰——先队列削峰（堆积算得清），入口再限流分级；短暂抖动——带退避与抖动的重试，但必须挂预算；下游病重——熔断快速止血，降级保核心；投递要可靠——至少一次加幂等去重，毒消息进死信；地址天天变——注册发现，名单靠共识续命；参数要在线调、版本要小步换——配置中心与灰度；请求死得不明不白——链路追踪按 ID 拼全程。
    这些工具没有一件是免费的：队列拿延迟换平稳，重试拿流量换成功率，熔断拿可用性换恢复窗口，治理面拿复杂度换可控性——价目表和前四课一样，全是权衡。回望本科五站：第一课认清部分失败的世界，第二课给一致性标价，第三课用共识立裁决，第四课给顺序与原子结账，这一课给日常调用买保险。五站合起来，就是把单机的确定性拆开之后，在每个缺口处有意识地买回一部分——买多少、买哪种，就是分布式系统设计的全部日常。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: up
      id: u
      label: 症状：洪峰 / 抖动 / 病重 / 漂移 / 黑盒
    - lane: mid
      id: m
      label: 工具箱：队列、限流、重试、熔断、发现、灰度、追踪
      highlight: true
    - lane: down
      id: d
      label: 代价：每件工具都明码标价
    messages:
    - id: m1
      from: u
      to: m
      label: 先对症状，再选工具
      active: true
    registers:
    - name: 选型口诀
      value: 先异步、再保险、后治理
    - name: 全课主线
      value: 每件工具都是在为一种失败标价
  log:
  - mode: 收官
    event: 本科五站闭环：认清世界、标价、立规、结账、买保险
minutes: 26
prereq:
- distributed/time-and-transactions
objectives:
- 用速率差算式估算队列堆积量与排空时间，并据此判断该扩容消费者还是该在入口限流
- 说清至少一次投递为何是默认、效果上的恰好一次为何要靠消费端幂等与去重，并指出死信队列的用途
- 算出多层重试的最坏放大倍数，并说清退避抖动与重试预算分别治什么
- 为一次跨机调用在限流、熔断、降级、注册发现、灰度与追踪之间按症状选对工具
aiLink: LLM 网关是这套工具的当代重演：推理服务按 token 限流（令牌桶的令牌换成了 token）、上游模型抖动时带退避重试并切换备用模型（降级）、请求在队列里等 GPU 空位（削峰的堆积算式原样适用）——给模型 API 做可靠性设计，用的还是这一课的地图。
design:
- mechanism: 为什么消息队列默认至少一次，而不是追求恰好一次投递
  problem: 根本约束在确认的不可区分性：消费者处理完、位移还没提交时崩溃，队列无从知道这条消息「办妥了没有」——这与超时后不知道对方做没做是同一种不可区分。投递层若强行恰好一次，就必须让「处理结果」与「位移推进」原子绑定，而处理结果多半落在队列管不着的外部系统里
  choice: 做法是投递层只承诺至少一次（不丢），把「不重」下放给消费端：业务单号去重加处理动作幂等，让重复投递变得无害。效果上的恰好一次由两层拼出，而不是由一层硬扛
  tradeoff: 代价是每个消费端都要自己实现去重与幂等，接入成本重复支付；且去重表本身要存储与过期管理，单号设计错了（比如用了可复用的编号）会把真消息误判成重复而吞掉
  root: 根子在副作用的归属：投递是队列的职责，副作用发生在别人的系统里。恰好一次要求跨职责边界的原子性——上一课已经证明那是全系统最贵的东西。把保证拆回各自的边界内，是唯一可扩展的解法
- mechanism: 为什么重试必须同时带退避抖动与预算，缺一不可
  problem: 根本约束是重试的正反馈结构：失败往往意味着下游过载，而重试恰好在过载时增加负载；若各客户端还按相同节奏重试，流量会聚成同步的尖峰。只退避不抖动，尖峰只是被推迟；只抖动不封顶，总量仍可乘法放大
  choice: 做法是双管齐下：指数退避加全抖动负责把重试在时间上摊平（治形状），重试预算负责给重试总量占正常流量的比例封顶（治总量），熔断再负责在下游病重时整体停手（治存亡）
  tradeoff: 代价是成功率被主动放弃一部分：预算耗尽时，本可重试成功的请求被快速失败；抖动也让单次重试的等待时间不可预测，调试与超时设置都要为最坏值留余量
  root: 根子在相关性：独立随机的小概率失败可以靠重试消解，相关的系统性失败只会被重试放大。退避、抖动与预算本质上都是在打破重试之间的相关性——让它们不再同进同退
- mechanism: 为什么注册中心与配置中心自己必须是共识系统
  problem: 根本约束是治理面的递归地位：所有业务实例都依赖注册名单与配置内容做决定，这两份数据若各副本不一致，不同实例会按不同名单与参数行事，等于全系统没有统一事实；而治理面若单点，它一宕全系统跟着失明
  choice: 做法是让治理面自己先是个小型分布式系统：名单与配置用共识协议（第三课的 Raft 一类）多副本复制，强一致地对外提供读写；业务侧再加本地缓存兜底，允许治理面短暂不可用时按旧名单旧配置继续运行
  tradeoff: 代价是运维复杂度前置：系统还没上线，先要养一个高可用的共识集群；且强一致的注册在分区时同样要面对 CAP 的取舍（保名单准确还是保可查），多数实现选择分区时可查旧名单、不可注册新实例
  root: 根子在「谁来管管理者」的递归只能终止于共识：任何一层治理都需要一份所有人认账的事实，而在部分失败的世界里生产这种事实的唯一已知方法就是共识。把共识集群做小、做专，是让递归停下来的工程办法
terminal:
- cmd: kafka-consumer-groups.sh --bootstrap-server localhost:9092 --describe --group review-workers
  note: 看消费组的 lag（堆积量）：第三站的算式里，lag 就是还没排空的那笔账
