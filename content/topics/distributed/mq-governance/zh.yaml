      value: 追踪靠同一个 trace ID 贯穿全程，记录的时候按比例采样，遇到错误请求会优先把它的记录保留下来
  log:
  - mode: 治理
    event: 服务规模变大后，要把配置和版本变更做成可以小步调整、随时回退的操作，并用追踪持续观察请求经过了哪里
- id: toolbox-map
  title: 落点：一张可靠性工具箱地图
  tldr: 前面把队列、重试、限流、熔断和治理工具一个个看完了，这最后一步把它们收成一张地图，方便以后按症状直接对号入座。选工具时先看具体症状，流量突然冲高就用队列排队和限流控制，只是短暂抖动就用带退避的重试，下游已经大量故障就用熔断先停手、降级保核心，实例地址经常变就用注册发现查最新名单，改参数或发新版本风险大就用配置中心和灰度小步推进，请求出错却不知道卡在哪里，就用链路追踪按编号查全程。
  body: |-
    把这一课收成一张地图，按症状对号入座：流量洪峰——先队列削峰（堆积算得清），入口再限流分级；短暂抖动——带退避与抖动的重试，但必须挂预算；下游病重——熔断快速止血，降级保核心；投递要可靠——至少一次加幂等去重，毒消息进死信；地址天天变——注册发现，名单靠共识续命；参数要在线调、版本要小步换——配置中心与灰度；请求死得不明不白——链路追踪按 ID 拼全程。
    这些工具都有代价：用队列会增加等待延迟，但换来流量平稳；重试会增加请求量，但换来更高的成功率；熔断会暂时放弃一部分调用，但换来下游恢复的时间；治理面会增加系统复杂度，但换来可控性——和前四课一样，每种选择都是权衡。回望本科五站：第一课先认清网络会部分失败，第二课为一致性做取舍，第三课用共识做裁决，第四课处理顺序与原子性，这一课为日常调用加上这些可靠性措施。五站合起来，就是把单机上原本确定的执行拆到多台机器后，在每个容易出问题的地方有意识地补回一部分可靠性——补多少、补哪一种，就是分布式系统设计每天要做的决定。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: up
      id: u
      label: 先看清楚症状是什么，是流量洪峰、短暂抖动、下游故障、地址变化，还是出错位置不明
    - lane: mid
      id: m
      label: 再根据症状选对应的工具，包括队列、限流、重试、熔断、服务发现、灰度和追踪
      highlight: true
    - lane: down
      id: d
      label: 最后把代价一起算进去，每种工具都有明确的取舍，不能只看它解决了什么问题
    messages:
    - id: m1
      from: u
      to: m
      label: 先判断出了什么问题，再选对应的工具
      active: true
    registers:
    - name: 选型口诀
      value: 选型的顺序是，先看能不能改成异步排队，再给同步调用加上保护，最后用治理工具来管理规模
    - name: 全课主线
      value: 每种工具都对应一种具体的失败情况，也都有对应的代价
  log:
  - mode: 收官
    event: 本科五站到这里收尾：先认清部分失败，再为一致性做取舍、用共识裁决、处理顺序与原子性，最后为日常调用加上可靠性措施
minutes: 26
prereq:
- distributed/time-and-transactions
objectives:
- 用速率差算式估算队列堆积量与排空时间，并据此判断该扩容消费者还是该在入口限流
- 说清至少一次投递为何是默认、效果上的恰好一次为何要靠消费端幂等与去重，并指出死信队列的用途
- 算出多层重试的最坏放大倍数，并说清退避抖动与重试预算分别治什么
- 为一次跨机调用在限流、熔断、降级、注册发现、灰度与追踪之间按症状选对工具
aiLink: LLM 网关是这套工具的当代重演：推理服务按 token 限流（令牌桶的令牌换成了 token）、上游模型抖动时带退避重试并切换备用模型（降级）、请求在队列里等 GPU 空位（削峰的堆积算式原样适用）——给模型 API 做可靠性设计，用的还是这一课的地图。
design:
- mechanism: 为什么消息队列默认至少一次，而不是追求恰好一次投递
  problem: 问题出在崩溃时无法确认结果：消费者处理完消息、位移还没提交时崩溃，队列无从知道这条消息「办妥了没有」——这与超时后不知道对方做没做是同一种不可区分。投递层若强行保证恰好一次，就必须让「处理结果」与「位移推进」原子绑定，而处理结果多半落在队列管不着的外部系统里
  choice: 做法是投递层只承诺至少一次，也就是保证不丢；是否重复处理，交给消费端解决：用业务单号去重，再让处理动作本身幂等，这样即使同一条消息送来两次，最终效果也像只处理了一次。效果上的恰好一次，是投递和消费两层配合出来的，不是由投递层单独保证的
  tradeoff: 代价是每个消费端都要自己实现去重与幂等，接入成本重复支付；且去重表本身要存储与过期管理，单号设计错了（比如用了可复用的编号）会把真消息误判成重复而吞掉
  root: 根本原因在于副作用发生在哪里：队列只负责投递消息，真正的扣款、发短信等副作用发生在外部系统里。要让投递和外部副作用严格只发生一次，就需要跨系统边界的原子性，而上一课已经说明这是全系统成本最高的保证。把保证拆开，让队列管不丢、消费端管不重复产生副作用，才是能扩展的做法
- mechanism: 为什么重试必须同时带退避抖动与预算，缺一不可
  problem: 问题在于重试会自我放大：失败往往意味着下游已经过载，而重试恰好在过载时又增加负载；若各客户端还按相同节奏重试，流量会聚成同一时刻的尖峰。只退避不抖动，尖峰只是被推迟到同一时刻；只抖动不封顶，总量仍可按乘法放大
  choice: 做法是两件事一起做：指数退避加全抖动，把大量重试在时间上分散开，避免同一时刻一起涌回；重试预算，给重试总量占正常流量的比例设上限，避免总量被层层放大；另外熔断负责在下游已经严重故障时整体停止调用
  tradeoff: 代价是成功率被主动放弃一部分：预算耗尽时，本可重试成功的请求被快速失败；抖动也让单次重试的等待时间不可预测，调试与超时设置都要为最坏值留余量
  root: 根本原因在于失败是否相关：如果只是各自独立的偶发失败，重试一次往往就成功了；如果是下游过载这类系统性故障，所有客户端同时重试只会让过载更严重。退避、抖动和预算的作用，都是让重试不要在同一时间、以无上限的总量一起发生
- mechanism: 为什么注册中心与配置中心自己必须是共识系统
  problem: 问题在于治理面自己也会被依赖：所有业务实例都靠注册名单决定调谁、靠配置内容决定参数，这两份数据若各副本不一致，不同实例会按不同名单与参数行事，等于全系统没有统一事实；而治理面若是单点，它一宕机，全系统就查不到名单、也拿不到配置
  choice: 做法是让治理面自己先是个小型分布式系统：名单与配置用共识协议（第三课的 Raft 一类）多副本复制，强一致地对外提供读写；业务侧再加本地缓存兜底，允许治理面短暂不可用时按旧名单旧配置继续运行
  tradeoff: 代价是运维复杂度前置：系统还没上线，先要养一个高可用的共识集群；且强一致的注册在分区时同样要面对 CAP 的取舍（保名单准确还是保可查），多数实现选择分区时可查旧名单、不可注册新实例
  root: 根本问题是：治理系统本身由谁来保证一致？任何一层治理都需要一份所有实例都认可的事实，而在网络会部分失败的情况下，目前已知能可靠产生这种共同事实的方法就是共识。把负责共识的集群做得小而专门，只管名单和配置这类治理数据，递归就停在这里，不必无限套下去
terminal:
- cmd: kafka-consumer-groups.sh --bootstrap-server localhost:9092 --describe --group review-workers
  note: 看消费组的 lag，也就是还没被消费的堆积量：用第三站的算式算，lag 就是队列里还没排空的消息数量
