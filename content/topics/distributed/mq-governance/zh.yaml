steps:
- id: sync-chain-risk
  title: 同步链路每多串一跳，可用性就相乘打折、慢延迟就逐段相加
  tldr: 一条同步请求串过四跳时，整链可用性等于各跳可用性连乘（0.999⁴ ≈ 99.6%），尾部延迟逐跳累加，且任一跳超时仍分不清对端做没做；可靠性设计的第一刀就是把不必当场拿结果的步骤拆成异步。
  body: |-
    先给开头那条广告投放请求算一笔同步硬账：假设请求从网关进来，要依次同步穿过网关 → 编排 → 审核 → 存储四跳，调用方必须站在原地等每一跳都办完、结果原路退回才算交差。哪怕每一跳单拎出来都有 `99.9%` 的高可用（示例数字），四跳串在一起整条链的可用性就是 `0.999⁴ ≈ 99.6%`——故障概率直接翻了四倍；延迟同样要逐段累加，每跳尾部延迟（[[p99]]）若是 50 毫秒，四跳串下来还没算排队就已经 200 毫秒起步了。

    更棘手的是第一课和第四课反复交手的超时盲盒：一旦中间哪一跳超时未回，上游根本分不清对方是压根没收到、已经落库但回包丢了、还是正在半死不活地跑着，盲目重发怕重复扣费，直接报错又白白丢单。所以高可靠架构的第一刀从来不是硬扛，而是做分流手术：凡是不必当场拿结果的动作（比如耗时的广告审核）一律切出同步链改走异步投递；非得当场拿结果的才留在同步链上，再给它层层穿上后面几站的防弹衣。
  derivation: original
  sources:
  - ref: ddia
    locator: 第 8 章 The Trouble with Distributed Systems（不可靠的网络与超时）
    claim: 同步请求把对方的可用性与延迟串进自己的执行流；超时无法区分对方是未执行、已执行未回复还是仍在执行，这是部分失败的核心困境
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-15
  canvas:
