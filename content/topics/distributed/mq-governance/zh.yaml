      value: 可用性这样算，四跳各自都是 99.9%，乘起来整条链约是 99.6%，也就是 0.999 的四次方约等于 99.6%（示例）
    - name: 延迟账
      value: 每一跳的延迟逐段相加，尾部慢请求会把总延迟拉得更高
  log:
  - mode: 链路
    event: 同步调用中，可用性按每一跳相乘计算，延迟按每一跳相加计算，所以链越长风险越累积
- id: mq-shape
  title: 消息队列把一次调用拦腰切成两段，拿磁盘排队空间换下游喘息时间
  tldr: 生产者把消息写进队列即可返回，消费者按自身吞吐匀速拉取；一段带顺序的持久化缓冲同时换来削峰填谷、下游故障隔离与上下游地址解耦，代价是调用方当场只拿到「已收下」而非「已办妥」。
  body: |-
    拿广告提审开刀：广告主点完提交根本没必要干等几秒钟等机审跑完。我们在中间架起一组消息队列（比如 2011 年 LinkedIn 为吞吐全站海量活动流而开源的 [[Kafka]]，真实形态是一组把消息顺序追加写进磁盘分区的独立 Broker 进程，配上下游服务里的客户端 SDK，同构于浏览器里把非紧急任务塞进空闲回调队列慢慢消化）：上游编排服务只管把提审消息可靠写进队列（投递段）就立刻向用户返回「已提交」，至于下游审核服务什么时候拉取、每秒拉多少条，全由消费段按自己的胃口做主。

    这一刀切下去，三样工程红利当场到手：第一是**时间解耦（削峰填谷）**，大促流量翻倍涌入时消息先躺在磁盘队列里排队，下游审核照旧按恒定安全速率消费，不必按峰值规模堆几倍机器；第二是**故障隔离**，就算审核服务重启三分钟，消息也稳稳留在队列里等它回来接着办，上游提单丝毫无感；第三是**拓扑解耦**，上游只认队列主题名，压根不关心下游有几个消费者、IP 在哪儿。当然天下没有白吃的午餐：调用方当场拿到的只是「收据」而非「审批结论」，想看结果得另配异步通知或轮询接口；而且把时间上的来得太快转嫁成磁盘上的空间堆积后，堆积到底多深、多久能清空，必须提前拿算盘算死。
  derivation: original
  sources:
  - ref: ddia
    locator: 第 11 章 Stream Processing（消息代理与参与者模型）
    claim: 消息代理把生产与消费在时间上解耦，代理本身作为缓冲区吸收生产与消费的速率差，消费者可以按自己的节奏处理积压
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-15
  canvas:
    kind: swimlane
    actors:
    - lane: up
      id: u
      label: 生产者：把消息放进队列后就返回，不等处理结果
    - lane: mid
      id: m
      label: 队列：先存住暂时处理不完的消息，让它们排队等待
      highlight: true
    - lane: down
      id: d
      label: 消费者：按自己能处理的速度从队列取走消息
    messages:
    - id: m1
      from: u
      to: m
      label: 投递段：消息成功放进队列，上游这一步就算完成
      active: true
    - id: m2
      from: m
      to: d
      label: 消费段：下游按自己的处理速率取走消息
    registers:
    - name: 换来
      value: 换来的好处是，洪峰到来时消息先在队列里排队削峰，下游故障时消息会留在队列里被隔离开，上下游也不必直接互相依赖对方的地址
    - name: 代价
      value: 代价是结果不能当场拿到，只能之后异步查询，而且消息到底会堆积多少，还要单独算一笔账
  log:
  - mode: 队列
    event: 一次调用被分成投递和处理两段，来得快、处理慢的时间差就表现为队列里堆积的消息量
- id: mq-drain-math
  title: 削峰不是变魔术：算不清速率差与排空时间，队列自己也会爆仓
  tldr: 队列堆积量等于（入队速率 − 消费速率）× 洪峰时长，排空耗时等于堆积量 ÷ 高峰后净消费速率；算清这笔硬账才能决定何时扩容消费者、何时在入口提前限流。
  body: |-
    直接摆上示例数字算一笔硬账：大促开场的 10 分钟洪峰里，广告提审以每分钟 `5,000` 条的速度涌入队列，而下游审核集群每分钟只能稳妥消化 `2,000` 条；10 分钟下来，队列里攒出的最高堆积量就是 `(5,000 − 2,000) × 10 = 30,000` 条。洪峰退去后，日常提审降回每分钟 `1,000` 条，此时消费者除了应付新来的 `1,000` 条，每分钟净排空积压的能力只有 `2,000 − 1,000 = 1,000` 条，整整要花 `30,000 ÷ 1,000 = 30` 分钟才能把账还清；而在第 10 分钟洪峰末尾刚塞进队尾的那条广告，前头压着 `30,000` 条老大哥，得干等 `30,000 ÷ 2,000 = 15` 分钟才轮得上受审。要是在洪峰期把审核消费者临时扩容到每分钟 `4,000` 条呢？峰值堆积立刻缩水到 `10,000` 条，洪峰过后净排空速率变成 `4,000 − 1,000 = 3,000` 条/分钟，约 `3.3` 分钟就彻底清爽了——监控面板上盯着消费滞后量（lag）决定扩多少机器，算的就是这条减法与除法。

    放到真实业务里看：大促前夜商家扎堆提交广告，机审显卡与人审坐席的吞吐天花板却是固定的。套上队列之后，洪峰只是让队列水位涨高一截，下游照旧稳稳推磨；但前提有两条——一是每条提审消息必须带唯一业务单号以便消费端做幂等（防重审），二是队列绝非无底洞，它只是把「当场报错」换成了「排队晚点办」。一旦算出来的最大排队等待时长突破了业务承诺（比如承诺 5 分钟内出审核结果，算出来却要等 15 分钟），光靠队列就兜不住了，必须在入口提前限流或给普通商户降级排队。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: up
      id: u
      label: 提交端在高峰的 10 分钟里把请求集中涌进来
    - lane: mid
      id: m
      label: 审核队列：高峰时消息越积越多，高峰过后慢慢减少
      highlight: true
    - lane: down
      id: d
      label: 审核消费者一直按固定的速率处理队列里的消息
    messages:
    - id: m1
      from: u
      to: m
      label: 入队 5,000/分钟（示例）
      active: true
    - id: m2
      from: m
      to: d
      label: 消费 2,000/分钟（示例）
    registers:
    - name: 堆积
      value: 这样算下来一共会堆积 30,000 条消息，高峰过后需要 30 分钟才能排空（示例）
    - name: 扩容消费者后
      value: 如果把消费速率提高，堆积会降到 10,000 条，高峰过后约 3.3 分钟就能排空（示例）
  log:
  - mode: 堆积
    event: 计算削峰能堆多少消息，只需看入队和消费的速率差，再乘以这段时间持续了多久
- id: delivery-semantics
  title: 队列默认「至少投递一次」，效果上的恰好一次靠消费端幂等去重拼出来
  tldr: 消费者处理完消息、还没提交消费位移（offset）就崩溃时，接管者只能从旧位移重读，因此主流队列默认保证不丢但允许重投；外部副作用靠业务单号去重表与幂等接口兜底，反复报错的毒消息则转入死信队列隔离。
  body: |-
    消息进了队列怎么保证不丢？拿 [[Kafka]] 这类日志型队列来说，队列替每个消费组记着一个消费位移（offset），消费者拉走一批消息办完正事后，再向队列提交新位移打卡报平安。那万一消费者刚把广告审完落库、手还没摸到「提交位移」按钮就断电崩溃了呢？接班的新消费者顶上来一看位移还停在原地，只能从旧位置重读一遍，刚才办过的那批消息就会被结结实实投递第二回。这可不是队列写出了 bug，而是崩溃点上绕不开的二选一（跟第一课超时盲盒同宗同源）：要是改成「先提交位移再干活」，干活中途崩溃消息就彻底丢了（至多一次）；改成「干完活再提交位移」，崩溃重来就会重复投递。两害相权，主流生产队列一律默认**至少一次（at-least-once）**：宁可重送，绝不丢单。

    你可能听说某些流处理引擎宣称支持「恰好一次（exactly-once）」，那其实只管得住「从同一个队列读、算完再写回同一个队列」的闭环事务；一旦消费者的副作用跨出了队列边界——调银行扣款、发审核通过短信、写外部业务库——队列自己根本管不着对岸。真正能落地的全链路「恰好一次」，全靠消费端把上一课 [[Saga]] 的看家本领搬过来：每条消息揣着唯一业务单号，落库前先查去重表，处理逻辑写成[[幂等]]接口，「至少投递一次 + 幂等去重消费」一拼，外部世界看到的效果就跟只跑过一次分毫不差。

    线上还会撞见另一种刺头：某条消息JSON格式写坏了，或者关联的广告主账号早被物理注销了，消费者拿起来一次崩一次。要是任由这颗「毒消息」卡在队头无限重试，后面几万条正常广告全得陪葬。标准解法是给重试设上限：连续失败三五次立刻把它踢进专门的**死信队列（DLQ）**隔离留案，让主队列畅通无阻，留着死信等工程师慢慢排查。比如 [[RabbitMQ]] 的死信交换机就是干这个的——消息被消费者明确拒绝、[[TTL]] 存活期耗尽、队列满员溢出或超过最大投递次数时，统统自动转投死信通道。
  derivation: original
  sources:
  - ref: kafka-delivery-semantics
    locator: Consumer receipt 与 Exactly once support 两节
    claim: 消费者在处理后才提交位移则崩溃会造成重复处理；Kafka 默认至少一次投递，恰好一次仅限于 Kafka 内部流处理等事务型场景
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-15
  - ref: rabbitmq-dlx
    locator: What is a Dead Letter Exchange 一节
    claim: 消息在被消费者拒绝、TTL 过期、队列达到长度上限或超过投递次数上限时成为死信，被转投到死信交换机隔离处理
    status: verified
