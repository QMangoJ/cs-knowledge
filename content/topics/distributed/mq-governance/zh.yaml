bridge:
  prev: 上一课算清了跨机因果顺序与同生共死的事务账，可日常线上九成调用并不要求严格绑定提交——比如广告提审晚几分钟出结果完全能接受，真正把系统拖垮的反倒是突发洪峰、网络闪断引发的重试风暴，以及容器频繁扩缩容换掉的死地址。这一站接过幂等与去重的底子，给海量日常调用装齐队列缓冲、流量防线与集群治理工具箱。
title: 分布式进阶：消息队列、限流与重试、服务治理
summary: 同步调用把每一跳的故障率连乘、把尾部延迟逐段相加；工程可靠性先靠分流破局——不必当场拿结果的请求送进消息队列削峰填谷，用「至少投递一次 + 消费端幂等去重」兜底；必须当场等结果的同步链路，入口用令牌桶限流控速，偶发抖动用指数退避加全抖动和重试预算克制重放，下游雪崩时先靠熔断跳闸止血并降级保主干；集群规模扩大后，再靠注册发现查活地址、配置中心热调参、金丝雀灰度切流与链路追踪串起全局视野。
premise: 一条广告投放请求从网关进入，本来要一路同步串过编排、审核与落库四跳：大促高峰期每分钟突然涌入 5,000 条提交，下游审核服务每分钟却只啃得动 2,000 条；半路上的定向服务偶尔闪断抖动、有时干脆报错瘫痪；而跑在云上的几百个服务实例每天都在自动扩缩容、IP 地址换个不停。面对洪峰、抖动、雪崩与移动靶地址，一次普通的跨机调用怎么既不被下游拖死，也不顺手把小毛病放大成全站事故？
position: 本课是分布式系统专题的第五站收官课，视角从前四站的「数据真相、多数派共识与跨机原子性」转向海量日常调用的「工程韧性与集群治理」。走完这一站，以后审查任何一条生产跨机调用链，你都能立刻追问三件具体的事：这步操作能不能拆成异步队列并算清排空时长？失败重试有没有加随机抖动和总量预算以防风暴？上游手里的目标实例地址与限流开关又是靠谁动态下发的？
overview:
- key: 一句话总结
  value: 能异步的先入队削峰，靠「至少一次投递 + 幂等去重」保准确；必须同步的用限流控入口、退避抖动加预算管重试、熔断降级防雪崩，规模大了再配齐注册发现、配置热推、灰度切流与链路追踪。
- key: 消息队列
  value: 把一次跨机调用拦腰切成「投递」与「消费」两段，拿持久化排队空间换下游匀速消化的时间；同时换来流量削峰、下游故障隔离与上下游地址解耦，但必须算清入队与消费速率差决定的排空耗时。
- key: 投递语义
  value: 消费者先办事后提交位移，崩溃重读天然导致重复，因此主流队列默认「至少投递一次」；外部副作用靠唯一业务单号去重表与幂等接口拼出效果上的恰好一次，反复报错的毒消息转入死信队列隔离。
- key: 重试
  value: 多层调用各自重试会让流量按指数连乘爆炸；必须同时用「指数退避 + 全抖动」把重试时刻随机打散，并用「重试预算」（如限制在正常流量的 20% 以内）锁死重试总量天花板。
- key: 限流与熔断
  value: 限流守入口（令牌桶兼顾短时突发与长期限速，漏桶严控匀速出口）；熔断护病患（下游报错越线即本地秒拒留出恢复期，半开探针试探合闸），严守「熔断在前、重试在后」并用降级兜住核心交易。
- key: 服务治理
  value: 专治大规模集群「找不着、改不动、发不稳、查不清」：注册中心靠心跳实时维护活实例名单，配置中心免重启热推参数，灰度发布从 1% 流量起小步验证秒级回滚，链路追踪靠唯一 trace ID 串起每跳耗时。
