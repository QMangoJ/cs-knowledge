- id: toolbox-map
  title: 按故障症状对号入座，用一张可靠性地图收束分布式五课
  tldr: 没有包治百病的银弹，只有按症状匹配的扳手：洪峰上队列与限流、偶发抖动上退避抖动重试加预算、下游雪崩上熔断降级、规模失控上发现灰度和追踪，每一件工具都明码标着延迟、流量或复杂度代价。
  body: |-
    把整站十步收拢成一张随取随用的排障药方，遇到症状直接对号抓药：**突发流量洪峰**——能异步的塞队列削峰（盯紧速率差与排空时间），同步入口挂令牌桶分级限流；**偶发网络闪断**——指数退避加全抖动打散重试波峰，外加 20% 重试预算焊死上限；**下游彻底报错雪崩**——熔断器前置拉闸秒拒留出回血期，非核心支线降级返缓存保交易主干；**异步投递怕丢怕重**——队列默认至少投递一次，消费端挂唯一单号去重表加幂等接口，死磕不过的毒消息踢进死信队列；**容器地址天天漂移**——注册中心心跳维护活名单、底层共识加本地缓存兜底；**改参发版怕炸全场、跨十跳查不出慢在哪儿**——配置热推、1% 金丝雀灰度切流、[[trace ID]] 串起全链 [[span]]。

    抓药的同时千万别忘了看药盒背面的副作用：上队列拿排队延迟换吞吐平稳；开重试拿额外流量开销换偶发成功率；拉熔断主动牺牲局部请求换下游活命窗口；搭治理面背上前期的共识集群与边车运维债换百节点可控。记住本课收官口诀：**能异步先入队算排空，至少一次靠幂等兜；同步入口限流、雪崩前置熔断、抖动退避打散锁预算；规模大了找注册、推配置、切灰度、串追踪**。

    回望分布式系统全部五站，其实自始至终都在算同一本总账：第一站认清物理宿命（部分失败、超时不可区分、无全局时钟），第二站给不一致明码标价（CAP 与读写一致性阶梯），第三站用多数派与任期立下唯一裁决权（Raft 共识日志），第四站结清因果顺序与跨机原子账（逻辑时钟、2PC 与 Saga），第五站给海量日常调用穿齐缓冲与治理盔甲。把单机里原本免费的确定性拆散到多台机器之后，在每一道裂缝处清醒地挑对补丁、付清代价——这就是分布式系统工程的全部手艺。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: up
      id: u
      label: 先看清楚症状是什么，是流量洪峰、短暂抖动、下游故障、地址变化，还是出错位置不明
    - lane: mid
      id: m
      label: 再根据症状选对应的工具，包括队列、限流、重试、熔断、服务发现、灰度和追踪
      highlight: true
    - lane: down
      id: d
      label: 最后把代价一起算进去，每种工具都有明确的取舍，不能只看它解决了什么问题
    messages:
    - id: m1
      from: u
      to: m
      label: 先判断出了什么问题，再选对应的工具
      active: true
    registers:
    - name: 选型口诀
      value: 选型的顺序是，先看能不能改成异步排队，再给同步调用加上保护，最后用治理工具来管理规模
    - name: 全课主线
      value: 每种工具都对应一种具体的失败情况，也都有对应的代价
  log:
  - mode: 收官
    event: 本科五站到这里收尾：先认清部分失败，再为一致性做取舍、用共识裁决、处理顺序与原子性，最后为日常调用加上可靠性措施
minutes: 26
prereq:
- distributed/time-and-transactions
objectives:
- 用入队与消费速率差算式算出队列峰值堆积量与排空时间，判断何时扩容消费者、何时在入口限流
- 解释主流消息队列为何默认「至少投递一次」，如何靠唯一单号去重表与幂等消费拼出效果上的恰好一次，并用死信队列隔离毒消息
- 算出多层重试的最坏指数放大倍数（如 3³ = 27），说清指数退避全抖动与重试预算各自的止血分工
- 严守「熔断在前、重试在后」次序，按故障症状在限流、熔断降级、注册发现、灰度切流与链路追踪间精准选型
aiLink: "[[LLM]] 推理网关正是这套可靠性地图的当代翻版：入口按每分钟 [[token]] 额度跑令牌桶限流，主模型抖动超时时带全抖动退避重试或熔断切往备用小模型（降级），长耗时批处理请求先进队列等 [[GPU]] 算力空位（排空算式一字不差）——给大模型 [[API]] 搭护城河，用的还是这一课的扳手。"
design:
- mechanism: 队列「至少一次投递」与消费端幂等分工
  problem: 消费者办完业务、还没提交位移就断电崩溃时，队列根本无从得知那条消息到底落没落外部库；若强求队列单方面做到恰好一次，就得把队列位移与外部银行、短信网关绑进跨系统强事务，成本高到没法扩展。
  choice: 投递层只兜底「绝不丢信（至少投递一次）」，防重责任明确移交给消费端——每条消息带唯一业务单号查去重表，配合幂等接口，两层合力拼出业务效果上的恰好执行一次。
  tradeoff: 每个下游消费方都得各自维护去重表、设计过期清理策略，一旦单号生成规则写错（比如误用可复用的临时号），还会把正常新消息当成重复件静默吞掉。
  root: 队列只管搬运字节，真正的扣款、改库副作用全发生在队列管不着的外部边界之外；顺着系统边界把「不丢」和「不重」拆给最擅长的一方各守一半，才能换来水平扩展能力。
- mechanism: 指数退避全抖动加重试预算双重枷锁
  problem: 线上报错大半源于下游过载而非独立偶发丢包，此时多层调用一起重发不仅按指数连乘放大流量，固定间隔退避还会让成千上万客户端在同一毫秒整队二次冲锋。
  choice: 用指数退避拉长冷静期、用全抖动随机数揉碎同步重试波峰，再挂上全局重试预算（如卡死在正常流量的 20% 以内）封住总量天花板，重度故障则交由前置熔断器直接拉闸。
  tradeoff: 重试预算耗尽时会主动放弃一部分本有机会重试成功的请求，随机抖动也让单次调用的耗时上限更难预估，上游超时配置必须留足余量。
  root: 偶发独立丢包靠重发能救活，系统性过载靠重发只会加速陪葬——两重枷锁的本质就是在分不清哪一种失败时，强行不让重试聚成同一秒的无上限洪峰。
- mechanism: 注册与配置中心的共识底座加客户端缓存兜底
  problem: 全站成百上千个业务实例都靠注册表认路、靠配置中心定参数，治理面一旦变成单点宕机或副本间数据劈叉，整座集群就会陷入找不到人或参数混乱的瘫痪状态。
  choice: 让治理中心底层先跑在 Raft 这类小规模强一致共识集群上保住权威真相，同时强制所有业务客户端在本地内存缓存上一份健康名单与配置，治理面短暂失联时照旧按旧快照运转。
  tradeoff: 业务代码还没跑起来就得先维护一套高可用共识底座；遇到网络分区时治理中心宁可拒收新实例注册也要保住旧名单可读，接受短暂的名单滞后。
  root: 想要协调一群不可靠节点，总得先有一份全员公认的基准事实；把昂贵的强一致共识收敛在极小体量的地址与开关元数据上，再用客户端缓存斩断治理面对业务面的级联故障，套娃递归就在这一层干净收口了。
