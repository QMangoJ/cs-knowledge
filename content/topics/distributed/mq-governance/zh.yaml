bridge:
  prev: 上一课讲的是跨机事务：几个步骤要么一起成功，要么靠幂等、去重和补偿收尾。但日常系统里更多调用并不要求一起成功，比如一条广告提交后，审核晚几分钟完成也可以；它们出问题，往往是因为流量突然冲高、网络短暂抖动，或者服务实例地址变了找不到。这一课沿用上一课的幂等做法，给这类普通调用补上具体办法：先用队列缓冲，再用限流和重试处理波动，最后用服务治理管理大量实例。
title: 分布式进阶：消息队列、限流与重试、服务治理
summary: 一次同步调用要等每一跳都成功，任何一跳失败整条链就失败。比如提交后不必当场拿到结果的请求，就先放进消息队列排队，下游按自己的速度慢慢处理；投递时默认至少送到一次，重复的靠幂等处理。剩下必须当场等结果的同步调用，则用限流控制进入速度，用带退避和随机抖动的重试应对短暂抖动，用重试预算防止重试太多，再用熔断和降级在下游故障时及时止损。服务多到成百上千个时，再用注册发现找地址、用配置中心改参数、用灰度小比例发布新版本、用链路追踪定位请求卡在哪一跳。
premise: 这节课要回答的问题是，日常的普通调用在流量突然冲高、网络短暂抖动、服务地址又经常变化的情况下，怎么尽量不失败、失败了也不把问题放大。整节课会跟着一条广告投放请求来讲，它从网关进来，再依次经过审核和投放服务，路上会碰到高峰、抖动和下游故障。我们先看这条请求里哪些步骤不必当场等结果、可以改成排队慢慢处理，哪些必须当场等结果的步骤需要用限流、重试和熔断保护起来，最后再看当服务多到成百上千个时，怎么靠注册、配置、灰度和追踪把它们统一管起来。
position: 本课是分布式系统本科的第五段，主题是让调用更可靠。前四站讨论的是多台机器如何对事实达成一致，包括顺序、共识和原子性；这一站讨论的是另一类问题：网络和服务总有一部分会失败，调用怎样在这种情况下仍尽量可用。学完五站后，遇到任何一次跨机调用，可以先问三个具体问题：这件事能不能改成异步排队处理？如果失败后重试，会不会把流量放大？要调用的服务地址和它用的配置，又是从哪里查到的？
overview:
- key: 一句话总结
  value: 先判断这件事能不能改成异步，能异步的就先放进队列排队处理，不必当场等结果。比如提交广告审核之后不必马上拿到结论，就可以先排队削峰，投递按至少一次保证不丢，重复送到的靠幂等处理。如果必须同步等结果，就用限流控制进入的速度，用带退避的重试应对短暂抖动，用重试预算限制重试总量，再用熔断在下游故障时快速失败，服务规模变大之后，再靠服务发现找地址、配置中心改参数、灰度发布新版本、链路追踪定位问题
- key: 消息队列
  value: 消息队列的做法是把一次调用拆成投递和处理两段，用队列的存储空间换取处理时间。比如高峰时请求一下子涌进来，下游一时处理不完，就先把请求作为消息存进队列里排队，上游把消息投递完就可以返回，不用站在那里等结果。这样下游就能按自己能处理的速度一条条把消息取走慢慢处理，高峰只是让队列变长，不会直接把下游冲垮
- key: 投递语义
  value: 投递默认是至少一次，意思是保证消息不丢，但同一条消息可能会被送到不止一次。比如消费者已经把一条消息处理完了，还没来得及确认就崩溃了，接管的人不知道它处理过没有，只能把这条消息再送一次。想让最终效果看起来像只处理过一次，不能只靠投递这一层保证，要靠消费端用业务单号认出重复消息并去重，同时让处理动作本身做到幂等，重复执行也不会再产生第二次副作用
- key: 重试
  value: 重试不是失败了马上再试一次就好，关键是要错开时间，还要给总量封顶。做法是先等一小段时间再重试，等待时间按指数往上增长，再在上限范围内随机取值，这样大量客户端的重试时刻就能彼此错开，不会整齐地在同一秒一起砸回来。还要再加一层保护，就是设重试预算，给一段时间内允许的重试总数封顶，因为调用链上每一层都重试的话，总请求量会按乘法放大，很容易把本来就虚弱的下游彻底压垮
- key: 限流与熔断
  value: 限流和熔断管的是两件不同的事，限流管入口进来的速度，熔断管下游已经病重时还要不要继续往里送请求。入口流量突然冲高时，用令牌桶控制通过的速率，桶里平时攒下的令牌还能应对一波短时间的突发，不至于一有高峰就全部拦住。下游已经大量报错时，熔断会直接让请求快速失败，不再把请求送过去，给下游留出一段不受打扰的恢复时间，这时降级会先返回缓存或者默认值这类次级结果，保住下单、支付这类最重要的主流程
- key: 服务治理
  value: 服务治理管的是服务多起来之后怎么找得到、改得动、发得稳、查得清这四件事。实例地址经常变化时，靠注册发现实时查询现在哪些实例可用、地址是什么，限流阈值这类参数要改时，靠配置中心把新参数推送出去动态生效，不用把所有实例重启一遍。新版本上线时靠灰度先只放一小部分流量验证，确认没问题再慢慢放量，一次请求跨多个服务出错时，靠链路追踪按同一个编号把每一跳的记录拼起来，查清它到底卡在哪一跳
