      value: 多次处理都失败的消息会被转到死信队列里隔离开，再留给人工慢慢排查
  log:
  - mode: 投递
    event: 在崩溃发生的那个点上，很难同时保证既不丢又不重复；常见做法是先保证不丢，再用幂等处理重复消息
- id: retry-storm
  title: 多层无脑重试会把流量放大 27 倍：靠退避抖动错峰、靠重试预算封顶
  tldr: 三层调用链每层失败后额外重试 2 次，最坏会把 1 个请求在叶子节点放大成 3³ = 27 次冲击；必须用指数退避加随机全抖动打散重试波峰，再用重试预算（如不超过正常流量的 20%）锁死重试总量。
  body: |-
    能异步的进了队列，剩下必须当场等结果的同步链路（比如实时广告竞价定向）怎么扛偶发网络闪断或 [[GC]] 毛刺？第一反应当然是失败重试，可一旦多层调用各自开启重试，里头就藏着一个要命的指数乘法炸弹。算笔账：一条三层同步链路，假设每一层都在首次失败后「额外重试 2 次」（即单层最多尝试 3 次）；一旦最底层的叶子服务抖了一下变慢，最坏情况下顶层进来的 1 个用户请求，传到叶子节点身上会裂变成 `3³ = 27` 次轮番轰炸！下游本来就因为负载高才喘不上气，这凭空翻了 27 倍的重试洪流砸下来，当场就能把半死的服务彻底拍死——这就是线上闻之色变的**重试风暴**。

    拆掉这颗炸弹得两味药同服。第一味叫**指数退避加全抖动（full jitter）**：第 `n` 次重试前先睡一个随机时长 `random(0, min(上限, 基础 × 2^n))`。比如基础定 100 毫秒、上限封顶 3.2 秒，那每轮等待天花板依次涨到 `100、200、400、800、1600、3200` 毫秒，再在 `0` 到天花板之间随机摸一个数睡觉。为什么光翻倍还不够、非得加随机数？因为如果一万个客户端在同一秒超时，光按固定 `100ms、200ms` 退避，它们还是会在 100 毫秒后整整齐齐列队砸出第二波洪峰；加上全抖动把队伍彻底揉碎摊平，[[AWS]] 的压测模拟显示竞争场景下总调用次数能直接砍掉一半以上。

    第二味药叫**重试预算（retry budget）**：给整个服务允许发出的重试总量焊死天花板，比如规定「重试请求数绝不超过同期正常流量的 `20%`」。叶子服务每秒接 `1,000` 个正常请求时，全网每秒最多只放行 `200` 次重试（只够 `10%` 的请求走完两次重试），额度一旦用光立刻放弃重试直接报错，从算术根源掐死 27 倍裂变的可能——[[Envoy]] 代理除了设最大并发重试数外，官方文档也强烈建议改配重试预算来防级联雪崩。放到广告投放现场看，一旦定向服务响应变慢、上游各层重试配置叠加引发流量暴涨，救火铁律永远是：先靠下一站的熔断器拉闸止血，回头再把中间层的重复重试关掉、给最靠近故障的一层挂死重试预算。
  derivation: original
  sources:
  - ref: aws-backoff-jitter
    locator: Adding Jitter 与 Full Jitter 两节（temp = min(cap, base × 2^attempt)，sleep = random_between(0, temp)）
    claim: 无抖动的指数退避仍会形成同步的重试簇；全抖动把重试时刻在天花板内随机摊平，100 个竞争客户端的模拟中总调用数减少过半
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-15
  - ref: envoy-circuit-breaking
    locator: Cluster maximum active retries 一节
    claim: Envoy 对并发重试数设有熔断型上限，并建议改用重试预算（retry budget）控制重试占正常流量的比例，以防重试量爆炸引发级联失败
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-15
  canvas:
    kind: swimlane
    actors:
    - lane: up
      id: u
      label: 网关：最初只有 1 个用户请求
    - lane: mid
      id: m
      label: 中间两层：每一层失败后都额外重试 2 次
    - lane: down
      id: d
      label: 叶子服务：最坏情况下会收到 27 次尝试
      highlight: true
    messages:
    - id: m1
      from: u
      to: d
      label: 每一层都重试后，请求量按层数相乘放大到下游
      active: true
    registers:
    - name: 放大倍数
      value: 放大倍数这样算，每层最多尝试 3 次，三层乘起来是 3 的三次方，等于 27 次（示例）
    - name: 预算口径
      value: 按预算口径算，重试总数不超过请求数的 20% 时，就只有 10% 的请求能完整走完两次重试（示例）
  log:
  - mode: 重试
    event: 单层重试能应对偶发失败，但三层都无限制重试时，失败会引发更多请求，反过来把请求量放大
- id: rate-limit
  title: 令牌桶攒突发额度、漏桶严控匀速出口，但限流救不了持续过载
  tldr: 令牌桶按固定速率补发令牌、靠桶容量放行短时突发，漏桶则不论涌入多少都按恒定速率滴出；一旦长期到达速率持续高于处理能力，队列照样无限积压，只能靠扩容或拒绝低优流量破局。
  body: |-
    重试防的是失败后添乱，限流守的是大门口别一次性放进超载人潮。假设下游每秒只能稳妥处理 `100` 个请求，大门口突然同时涌来 `350` 个，两种经典水桶怎么接招？**漏桶（leaky bucket）**底下凿个小孔，不论桶口倒进来多猛，出口永远按每秒 `100` 个的绝对匀速往外滴，第 `350` 个请求得老老实实排到约 `3.5` 秒后才能出门，对下游最温柔；**令牌桶（token bucket）**则按每秒 `100` 个的速率往桶里发通行证、桶上限最多攒 `200` 张，平时闲着攒满一桶，等 `350` 个请求同时砸来时，前 `200` 个当场领证秒过，剩下 `150` 个按每秒 `100` 张的速度领新证，排在最后的只需等 `1.5` 秒——既给短时突发开了绿灯，又卡死了长期平均流量。

    但千万别把限流当成万能仙丹：要是入口流量不是短时脉冲，而是长期每秒涌来 `150` 个、桶每秒只发 `100` 张证，攒下的老本两秒耗光后，门口等待队列就会以每秒 `50` 个的速度无限膨胀——**限流只治短时突发，治不了持续过载**，真遇上长期供不应求，只能扩容机器或直接拒单降级。工程落地上还有两道必答题：一是分布式口径怎么算——把计数收拢到集中存储（如中心缓存）口径最准，但每次放行多一跳网络开销；把配额预先切分给各网关节点本地计数最快，但流量偏斜时口径变粗。二是超限后排队还是当场秒拒——能等的后台任务进队小等，交互式接口直接回 `429 Too Many Requests` 让客户端死心。

    看一眼电商大促时的客服工单入口：咨询量翻十倍时，网关按业务价值分级发令牌——涉及支付卡单、物流丢件的高优工单走大桶高配额通道秒放行，普通活动规则咨询走小配额通道，满了就排队或引导转自助问答。限流在这儿不光是保命闸门，更是把稀缺算力按轻重缓急精准派发的调度台。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: up
      id: u
      label: 请求洪峰：350 个请求同时到达（示例）
    - lane: mid
      id: m
      label: 令牌桶：每秒补充 100 个令牌，桶最多存 200 个（示例）
      highlight: true
    - lane: down
      id: d
      label: 下游：只接收限流后按规则放行的流量
    messages:
    - id: m1
      from: u
      to: m
      label: 请求先拿到令牌，才能通过
      active: true
    - id: m2
      from: m
      to: d
      label: 200 个立即通过，其余按速率放行
    registers:
    - name: 令牌桶
      value: 桶容量决定一波突发最多能立即通过多少，补充速率决定长期每秒最多通过多少
    - name: 漏桶
      value: 出口始终匀速放行，350 个请求中最后一个要等约 3.5 秒（示例）
  log:
  - mode: 限流
    event: 令牌桶的容量决定突发时能先放多少，令牌补充速率决定长期能稳定放行多少
- id: circuit-breaker
  title: 下游病重时熔断器当场拉闸止血：先熔断、后重试、再拿降级兜住主干
  tldr: 当滚动窗口内下游报错率越过阈值，熔断器立刻跳闸到打开态本地秒拒请求，冷却期满切半开放一两个探针试探恢复；工程上必须严守「熔断在前、重试在后」，非核心模块同步降级返回缓存或默认值。
  body: |-
    不管是退避重试还是令牌桶限流，骨子里都默认下游「还能干活，只是偶发呛水或一时忙不过来」。要是下游数据库挂死、错误率飙上 80%，你还往里放请求，不仅下游永远缓不过一口气，上游自己的线程池和连接池也会被慢超时全部拖死。**熔断器（circuit breaker，名字就取自家用电箱里的空气开关）**专治这种硬伤：平时处于关闭态正常放行，同时紧盯滚动窗口内的报错率（比如最近 `20` 个请求里失败过半）；一旦越线立刻跳闸切到**打开态**，接下来假设冷却 `30` 秒——这 `30` 秒里哪怕上游每秒涌来 `200` 个请求，全在本地内存里微秒级直接秒拒，连网卡都不碰一下，给病重的下游留出整整 `30` 秒清静回血期；`30` 秒期满切入**半开态**，只小心翼翼放一两个探针请求过去探路，探针成了才合闸恢复，探针又挂就重新拉闸再歇 `30` 秒。

    把熔断和重试装进同一条链路时，先后次序一步都不能装反：**必须熔断在前、重试在后**——先问熔断器「下游还值得调吗」，只有熔断放行的请求才允许走有限次重试，否则重试会把熔断器挡回来的失败当成抖动再冲一遍。像 [[Envoy]] 这类服务网格代理干脆把熔断下沉到基础设施网络层，按上游集群硬卡最大连接数、待处理队列、并发请求与并发重试上限，超限当场溢出快败（spillover），省得业务代码各写一套。跟熔断成对出场的是**服务降级**（同构于前端组件崩溃时 `ErrorBoundary` 渲染兜底静态卡片）：推荐列表、评论数这类旁支服务熔断跳闸后，直接返回本地旧缓存或空默认值，丢卒保车把下单、支付这条命脉死死护住。
  derivation: original
  sources:
  - ref: envoy-circuit-breaking
    locator: Circuit breaking（架构概览）一节
    claim: Envoy 在网络层按集群强制执行熔断上限（连接数、待处理请求数、并发请求数与并发重试数），理念是快速失败并尽早向调用方传递背压，而不是让请求在病重的下游排队
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-15
  canvas:
    kind: swimlane
    actors:
    - lane: up
      id: u
      label: 调用方：每个请求先经过熔断器判断能不能放行
    - lane: mid
      id: m
      label: 熔断器：在关闭、打开、半开三种状态之间切换
      highlight: true
    - lane: down
      id: d
      label: 已经故障的下游：需要一段时间不被新请求打扰来恢复
    messages:
    - id: m1
      from: m
      to: d
      label: 熔断打开一段时间后，只放少量探针请求试探下游是否恢复
      active: true
    registers:
    - name: 三态
      value: 三种状态分别是，关闭时正常放行请求，打开时让请求直接快速失败，半开时只放少量探针请求去试探下游
    - name: 次序
      value: 先用熔断判断还值不值得调用，再对放行的请求有限重试，最后用降级结果兜底
  log:
  - mode: 熔断
    event: 熔断打开后不再把普通请求送给下游，让下游有一段不受打扰的时间恢复
- id: service-discovery
  title: 实例地址天天变：注册中心靠心跳剔除死节点，自身靠共识与本地缓存双保险
  tldr: 服务实例启动时向注册中心登记地址并定期发心跳续命，超时即从健康名单剔除；注册中心自身用 Raft 共识多副本防单点故障，调用方再缓存旧名单，确保治理面抖动绝不拖垮业务调用。
  body: |-
    前面所有防弹衣都默认了一件事：你知道下游的 IP 和端口在哪儿。可云原生容器集群里的实例是流水的兵——大促自动扩容新拉起几十台、宿主机故障原地漂移、滚动发版整批换血，如果把 IP 写死在配置文件里，运维一天光改配置重启就得累趴下。**服务注册与发现**把静态写死改成了动态通讯录：每个服务实例一启动就去注册中心报到（「我是审核服务，`10.0.4.18:8080`」），之后每隔 `10` 秒发一次心跳续命；要是某台机器断电，注册中心连续 `30` 秒没收到心跳就判定失联，将它从健康名单里一脚踢开。注意这 `30` 秒就是调用方仍可能撞上死地址的残留窗口——心跳越密、超时越短，死窗口越窄，但几千台机器给注册中心制造的心跳洪流也越猛。至于谁去查这份通讯录，既可以让客户端直查名单自己挑节点（客户端发现，少一跳中转），也可以交给像 [[Istio]] 边车代理或网关统一查表转发（服务端发现，业务代码零侵入）。

    追问到底会撞上一个套娃死结：全站几百个服务都指着注册中心找人，万一注册中心自己挂了岂不是全站失明？解法是两道双保险：第一道在注册中心内部——它自己就得先用第三课讲的 [[Raft]] 共识协议建成多副本高可用集群，死掉少数节点照常对外服务；第二道在调用方手里——客户端本地内存永远留一份上次拉到的健康实例缓存，就算注册中心整个机房短暂断联，业务请求照着旧名单照样跑得通，绝不让「通讯录故障」演变成「全站停摆」。
  derivation: original
  sources:
  - ref: istio-traffic
    locator: Introducing Istio traffic management（service registry）一节
    claim: Istio 通过连接平台的服务发现系统填充自己的服务注册表，边车代理据此把流量导向正确的服务实例并做负载均衡，实例的扩缩对调用方透明
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-15
  canvas:
    kind: swimlane
    actors:
    - lane: up
      id: u
      label: 调用方：按服务名向注册中心查可用实例名单
    - lane: mid
      id: m
      label: 注册中心：名单用共识协议复制到多个副本，保证可用
      highlight: true
    - lane: down
      id: d
      label: 实例群：启动时登记地址，之后定期发心跳证明存活
    messages:
    - id: m1
      from: d
      to: m
      label: 实例登记自己的地址，并周期性发送心跳
      active: true
    - id: m2
      from: u
      to: m
      label: 调用方查到名单后，挑一个健康实例发起调用
    registers:
    - name: 剔除
      value: 某个实例心跳超时就先从名单移除，避免调用方继续把请求发到已经失效的地址
    - name: 兜底
      value: 调用方缓存上一次查到的名单，注册中心短暂故障时仍可按旧名单调用
  log:
  - mode: 发现
    event: 服务地址不再写死在配置里，而是运行时从注册中心查名单；注册中心本身用共识复制保证名单可靠
- id: config-gray-trace
  title: 配置动态热推、灰度从 1% 小步放量、链路追踪靠 trace ID 一号串全程
  tldr: 服务规模上百后靠三件套控盘：配置中心免重启热改阈值但自身也需灰度，金丝雀发布先切 1% 流量试水、出事秒拨回 0%，链路追踪在入口签发唯一 trace ID 逐跳记下耗时 span，秒级定位慢跳与报错源头。
  body: |-
    等微服务拆到几十上百个，痛点立刻从「调不通」变成「管不住」，必须请出治理三件套各管一摊。第一件是**配置中心**：前面讲的令牌桶速率、重试预算、熔断开关要是写死在代码包里，救火调个阈值还得重新编译发版；收拢进配置中心后，后台改一行数字秒级长连接推送到几百个实例热生效。但威力越大反噬越狠——手滑推错一行参数能在十秒内毒翻全场，所以线上铁律是「改配置等同于发代码，必须走审核、分批灰度与一键回滚」。

    第二件是**灰度发布（金丝雀发布）**：新版本上线绝不全量硬切，而是先用 [[Istio]] 这类流量网格拨出 `1%` 的真实流量探路。算个数就明白它有多稳：一个每分钟接 `10,000` 次请求的服务，`1%` 意味着每分钟只有 `100` 个请求落到新实例上，就算新代码藏着致命空指针，爆炸半径也被死死锁在这 `100` 单里，拨回 `0%` 秒级止损；盯稳错误率与延迟无异常后，再按 `10% → 50% → 100%` 逐级拧大阀门。

    第三件是**分布式链路追踪**：一次广告请求穿过十几个微服务，每个服务各打各的本地日志，出了超时到底是谁背锅？做法是在网关入口给请求烙上一枚全局唯一的 [[trace ID]] 随请求头一路透传，每经过一跳服务就把自己的起止耗时与报错栈记成一段 [[span]] 上报，后台按同一个 [[trace ID]] 拼成瀑布时间轴，哪一跳慢了 180 毫秒、哪一跳抛了异常一目了然；海量流量下全量落盘太烧钱，通常按固定比例采样，但报错和慢请求一律优先 100% 留底。把这三件套合进跨机房客服工单平台里，各地实例就近发现、大促限流配额一处下发全球生效、新版本逐机房灰度、慢工单一号追到底，庞大舰队才真正像单机程序一样指哪打哪。
  derivation: original
  sources:
