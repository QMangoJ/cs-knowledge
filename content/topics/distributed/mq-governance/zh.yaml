steps:
- id: sync-chain-risk
  title: 同步调用的账：每一跳都在串联风险
  tldr: 这节课先从一条广告请求走同步链路的账算起，看清为什么普通调用也需要一整套保护。一个请求要依次经过网关、编排、审核、存储四跳，任何一跳失败，整次请求就算失败，所以整条链的可用性是每一跳可用性相乘，延迟是每一跳延迟相加，如果某一跳超时，你还判断不了对方到底是没做、做了没回复，还是正在做。
  body: |-
    设一条链路有四跳（网关→编排→审核→存储），调用方发出请求后，必须等每一跳都做完、结果一跳跳返回，才算完成——这就是同步调用把「等对方做完」写进了自己的执行流。每跳可用性 99.9%（示例数字）时，整条链的可用性是 0.999 的四次方，约 99.6%——每多串一跳，就多乘一个小于一的数。延迟同理：每跳的尾部延迟（p99）是 50 毫秒量级，四跳串起来就是 200 毫秒量级起步，还没算排队。
    更麻烦的是超时的语义没变：等不到回复时，对方可能没做、可能做了没回、可能正在做（第一课与上一课的老问题），重试与否都得替这笔糊涂账负责。所以工程上的第一反应是分流：结果不必当场拿到的调用，改成异步投递；必须当场拿结果的，才留在同步链上，并给它配齐后面几站的保险。
  derivation: original
  sources:
  - ref: ddia
    locator: 第 8 章 The Trouble with Distributed Systems（不可靠的网络与超时）
    claim: 同步请求把对方的可用性与延迟串进自己的执行流；超时无法区分对方是未执行、已执行未回复还是仍在执行，这是部分失败的核心困境
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-15
  canvas:
    kind: swimlane
    actors:
    - lane: up
      id: u
      label: 调用方：发出请求后一直等到全链返回，才算完成
      highlight: true
    - lane: mid
      id: m
      label: 编排与审核：中间每一跳都可能变慢，也可能故障
    - lane: down
      id: d
      label: 存储服务：链路的最后一跳，前面都成功也要等它完成
    messages:
    - id: m1
      from: u
      to: d
      label: 请求要依次穿过四跳，任何一跳失败整次请求就失败
      active: true
    registers:
    - name: 可用性账
      value: 可用性这样算，四跳各自都是 99.9%，乘起来整条链约是 99.6%，也就是 0.999 的四次方约等于 99.6%（示例）
    - name: 延迟账
      value: 每一跳的延迟逐段相加，尾部慢请求会把总延迟拉得更高
  log:
  - mode: 链路
    event: 同步调用中，可用性按每一跳相乘计算，延迟按每一跳相加计算，所以链越长风险越累积
- id: mq-shape
  title: 消息队列的形状：把一次调用拆成两段
  tldr: 上一步看到同步调用要把每一跳的风险都串进来，这一步就先看能不能把一部分调用改成异步，用队列把一次调用拆成两段。比如上游短时间投进来很多消息、下游处理不了那么快时，生产者把消息放进队列后就可以返回，不必等下游处理完，消费者再按自己的速率从队列里取走处理，队列本质上就是一段可以排队等待的存储，先存住洪峰再慢慢消化，这样就做到了削峰和解耦。
  body: |-
    以广告审核为例，提交后不必当场出结果：上游只负责把消息可靠地放进队列（投递段）就返回，下游什么时候取、取多快，由消费段自己决定。队列就这样把一次调用从中间分成两段，分开之后有三样东西立刻变了。其一，时间被解耦：洪峰到来时消息先在队列里排队，下游按恒定速率消化，不必按峰值扩容。其二，失败被隔离：下游宕机时消息留在队列里等它回来，而不是像同步调用那样当场报错给用户。其三，耦合被拆开：上游只认队列的名字，不认下游的地址与生死，下游可以独立扩缩与发布。
    代价是结果不再当场可得：调用方拿到的是「已收下」，不是「已办妥」——需要结果的场景要另配回执或查询。队列的本质是一段带顺序的可排队存储：它把时间维度上的不匹配（来得快、办得慢）转成空间上的堆积，而堆积必须有人算账——下一站就把这笔账算清。
  derivation: original
  sources:
  - ref: ddia
    locator: 第 11 章 Stream Processing（消息代理与参与者模型）
    claim: 消息代理把生产与消费在时间上解耦，代理本身作为缓冲区吸收生产与消费的速率差，消费者可以按自己的节奏处理积压
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-15
  canvas:
    kind: swimlane
    actors:
    - lane: up
      id: u
      label: 生产者：把消息放进队列后就返回，不等处理结果
    - lane: mid
      id: m
      label: 队列：先存住暂时处理不完的消息，让它们排队等待
      highlight: true
    - lane: down
      id: d
      label: 消费者：按自己能处理的速度从队列取走消息
    messages:
    - id: m1
      from: u
      to: m
      label: 投递段：消息成功放进队列，上游这一步就算完成
      active: true
    - id: m2
      from: m
      to: d
      label: 消费段：下游按自己的处理速率取走消息
    registers:
    - name: 换来
      value: 换来的好处是，洪峰到来时消息先在队列里排队削峰，下游故障时消息会留在队列里被隔离开，上下游也不必直接互相依赖对方的地址
    - name: 代价
      value: 代价是结果不能当场拿到，只能之后异步查询，而且消息到底会堆积多少，还要单独算一笔账
  log:
  - mode: 队列
    event: 一次调用被分成投递和处理两段，来得快、处理慢的时间差就表现为队列里堆积的消息量
- id: mq-drain-math
  title: 削峰的算术：堆积多少、多久排空
  tldr: 上一步把队列的形状讲清楚了，知道它能先存住洪峰，这一步接着算一笔具体的账，就是到底会堆积多少、要多久才能排空。先算一个例子，每分钟进来 5,000 条、只能处理 2,000 条，10 分钟就会多出 30,000 条堆积，通用的算法是堆积量等于入队速率减去消费速率再乘以持续时间，排空时间等于堆积量除以净排空速率，如果不先算清这两笔账，原本想削峰的队列可能积压得太多，最后自己变成新的故障。
  body: |-
    用示例数字算一遍（以下均为自洽的示例数字）：某审核队列在投放高峰的 10 分钟里以每分钟 5,000 条入队，消费者每分钟处理 2,000 条，堆积 =（5,000 − 2,000）× 10 = 30,000 条。高峰过后入队降到每分钟 1,000 条，净排空速率 = 2,000 − 1,000 = 1,000 条/分钟，要 30 分钟才排空；而高峰末尾入队的那条消息，前面压着 30,000 条，要等 30,000 ÷ 2,000 = 15 分钟才被处理。若高峰期把消费者临时扩到每分钟 4,000 条，堆积只到 10,000 条，高峰过后约 3.3 分钟排空——扩容消费者的决策点，就藏在这条算式里。
    业务场景示意：广告审核在投放高峰会遇到任务洪峰——大量广告集中提交、审核吞吐却相对恒定。把审核改成队列消费后，高峰只是让队列变长，机审与人审都按恒定速率工作；前提是审核任务带业务单号、消费端幂等，重复投递不会让同一条广告被审两遍（下一站）。队列并不是没有代价：它把原本会当场失败的请求改成先排队、晚一点处理，所以延迟的上限由堆积算式决定，超了上限就得在入口限流（第六站）或拒绝低优先级任务。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: up
      id: u
      label: 提交端在高峰的 10 分钟里把请求集中涌进来
    - lane: mid
      id: m
      label: 审核队列：高峰时消息越积越多，高峰过后慢慢减少
      highlight: true
    - lane: down
      id: d
      label: 审核消费者一直按固定的速率处理队列里的消息
    messages:
    - id: m1
      from: u
      to: m
      label: 入队 5,000/分钟（示例）
      active: true
    - id: m2
      from: m
      to: d
      label: 消费 2,000/分钟（示例）
    registers:
    - name: 堆积
      value: 这样算下来一共会堆积 30,000 条消息，高峰过后需要 30 分钟才能排空（示例）
    - name: 扩容消费者后
      value: 如果把消费速率提高，堆积会降到 10,000 条，高峰过后约 3.3 分钟就能排空（示例）
  log:
  - mode: 堆积
    event: 计算削峰能堆多少消息，只需看入队和消费的速率差，再乘以这段时间持续了多久
- id: delivery-semantics
  title: 投递语义：至少一次是默认，恰好一次靠幂等拼
  tldr: 队列能存住消息之后，紧接着的问题是消息到底会不会丢、会不会被重复处理，这一步就看投递语义是怎么定的。比如消费者已经处理完一条消息，但在提交消费位移之前崩溃了，接管的人只能从旧的位移重新读，这条消息就会被再处理一次，这样做的好处是不丢消息，代价是可能重复，要让重复不产生错误结果，就靠上一课讲的幂等和去重。
  body: |-
    队列凭什么不丢消息？以 Kafka 式日志队列为例：消费者处理完一批消息后才提交位移（offset），若它在处理完、提交前崩溃，接管者从旧位移重读，这批消息就被投递第二次。这不是实现缺陷，而是「不丢」与「不重」在崩溃点上只能选一边的结果（与第一课超时不可区分同源）：提交在处理前，崩溃就丢；提交在处理后，崩溃就重。所以主流队列默认至少一次（at-least-once）：保证不丢，承认会重。
    效果上的恰好一次（exactly-once）在单个队列系统内部靠事务能做到一部分，但副作用一旦落到外部系统（发短信、扣款、写另一家的库），投递层管不着——真正的解法在消费端：每条消息带业务单号，处理前先查去重表，处理动作本身幂等（上一课 Saga 的地基在这里复用）。另有一类消息永远处理不了：格式坏死、依赖永久缺失的「毒消息」。它们若留在队头反复重试，会堵死后面所有消息——重试若干次后把它们转进死信队列隔离，主队列继续走，毒消息留待人工排查。RabbitMQ 的死信交换机就是为此设的：消息被拒绝、TTL 过期、队列超长或超过投递次数上限时，会被转投到死信交换机。
  derivation: original
  sources:
  - ref: kafka-delivery-semantics
    locator: Consumer receipt 与 Exactly once support 两节
    claim: 消费者在处理后才提交位移则崩溃会造成重复处理；Kafka 默认至少一次投递，恰好一次仅限于 Kafka 内部流处理等事务型场景
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-15
  - ref: rabbitmq-dlx
    locator: What is a Dead Letter Exchange 一节
    claim: 消息在被消费者拒绝、TTL 过期、队列达到长度上限或超过投递次数上限时成为死信，被转投到死信交换机隔离处理
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-15
  canvas:
    kind: swimlane
    actors:
    - lane: mid
      id: m
      label: 队列：用位移记录消费者已经处理到哪里
    - lane: down
      id: d
      label: 消费者：先处理消息，处理完再提交位移确认进度
      highlight: true
    messages:
    - id: m1
      from: m
      to: d
      label: 如果提交位移前崩溃，接管者会从旧位移重新投递同一条消息
      active: true
    registers:
    - name: 默认语义
      value: 默认语义是至少一次，也就是保证消息不会丢，但同一条消息可能会被处理多次
    - name: 消重
      value: 用业务单号查出重复消息并去掉，同时让处理动作重复执行也不会重复产生副作用
    - name: 毒消息
      value: 多次处理都失败的消息会被转到死信队列里隔离开，再留给人工慢慢排查
  log:
  - mode: 投递
    event: 在崩溃发生的那个点上，很难同时保证既不丢又不重复；常见做法是先保证不丢，再用幂等处理重复消息
- id: retry-storm
  title: 重试：退避抖动错峰，预算给总量封顶
  tldr: 异步的那条路看完了，这一步回到还留在同步链上的调用，看它们失败之后重试要怎么试才不会帮倒忙。比如调用链有三层，每层失败后都额外重试 2 次，最坏情况下 1 个请求会在最下游变成 27 次尝试，重试量是按层数相乘放大的，解决办法是每次重试前等待的时间按指数增长，并在上限内随机取值，让大量客户端错开重试时刻，同时再设重试预算，限制一段时间内重试的总数不能超过上限。
  body: |-
    同步链上剩下的调用要面对抖动：一次网络闪断、一次 GC 停顿，都不该直接判死刑——重试是标准解法，但它有个乘法陷阱。设调用链三层，每层在失败后都「首次之外再重试 2 次」（单层最多 3 次尝试）：最坏情况下，一个用户请求会在叶子服务变成 3 的三次方 = 27 次尝试（示例算式）。下游本就虚弱时，这 27 倍流量就是压垮它的最后一根稻草——重试风暴。
    两件解药。其一是指数退避加全抖动（full jitter）：第 n 次重试前睡一个随机时长 random(0, min(上限, 基础 × 2 的 n 次方))——基础 100 毫秒、上限 3.2 秒时，天花板依次是 100、200、400、800、1600、3200 毫秒，再在天花板内取随机值，让成千上万个客户端的重试时刻彼此错开，而不是整齐地同时砸回来（AWS 的模拟显示，加上抖动后竞争场景的总调用数可降一半以上）。其二是重试预算：给重试总量封顶，例如「重试次数不超过同期请求数的 20%」——叶子每秒 1,000 个请求时，每秒最多放行 200 次重试，只够 10% 的请求走完两次重试链，其余快速失败。Envoy 的熔断配置里专门有「最大并发重试数」，并官方建议改用重试预算，理由正是防止重试量爆炸成级联失败。
    业务场景示意：广告投放链路中，下游某个定向服务抖动变慢，上游各层按各自配置纷纷重试，流量在分钟级放大数倍，慢服务被重试彻底打死、恢复遥遥无期——这是重试风暴的典型剧本；止血顺序是先熔断止损（下一站），再复盘各层的重试配置是否都开着、预算是否缺位。
  derivation: original
  sources:
  - ref: aws-backoff-jitter
    locator: Adding Jitter 与 Full Jitter 两节（temp = min(cap, base × 2^attempt)，sleep = random_between(0, temp)）
    claim: 无抖动的指数退避仍会形成同步的重试簇；全抖动把重试时刻在天花板内随机摊平，100 个竞争客户端的模拟中总调用数减少过半
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-15
  - ref: envoy-circuit-breaking
    locator: Cluster maximum active retries 一节
    claim: Envoy 对并发重试数设有熔断型上限，并建议改用重试预算（retry budget）控制重试占正常流量的比例，以防重试量爆炸引发级联失败
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-15
  canvas:
    kind: swimlane
    actors:
    - lane: up
      id: u
      label: 网关：最初只有 1 个用户请求
    - lane: mid
      id: m
      label: 中间两层：每一层失败后都额外重试 2 次
    - lane: down
      id: d
      label: 叶子服务：最坏情况下会收到 27 次尝试
      highlight: true
    messages:
    - id: m1
      from: u
      to: d
      label: 每一层都重试后，请求量按层数相乘放大到下游
      active: true
    registers:
    - name: 放大倍数
      value: 放大倍数这样算，每层最多尝试 3 次，三层乘起来是 3 的三次方，等于 27 次（示例）
    - name: 预算口径
      value: 按预算口径算，重试总数不超过请求数的 20% 时，就只有 10% 的请求能完整走完两次重试（示例）
  log:
  - mode: 重试
    event: 单层重试能应对偶发失败，但三层都无限制重试时，失败会引发更多请求，反过来把请求量放大
- id: rate-limit
  title: 限流：令牌桶管突发与匀速，超了就排队或拒绝
  tldr: 上一步的重试管的是失败之后怎么再试，这一步的限流管的是请求进来之前先控制速度，别让洪峰直接冲到下游。比如桶里事先攒了令牌，一波突发请求到来时可以先用攒下的令牌快速通过，这就是令牌桶，它按固定速率补充令牌，桶的容量决定最多能攒多少突发额度，漏桶则不管来多少，都按固定速率匀速放出，需要注意的是，限流只能应对短时间的突发，如果请求持续超过处理能力，积压还是会不断增长。
  body: |-
    先看一个具体场景：350 个请求同时到达，下游每秒只能稳妥处理 100 个，限流要决定最多放多快、突发能放多少。两种经典形状：漏桶（leaky bucket）把请求按固定速率匀速放出，来再多也排队，出口绝对平滑；令牌桶（token bucket）以固定速率往桶里放令牌，请求拿到令牌才通过，桶的容量决定突发额度——攒满的桶可以瞬间放行一波。用示例数字算令牌桶：速率每秒 100、容量 200，桶满时 350 个请求同时到达：200 个立即通过，剩下 150 个按每秒 100 的速率领令牌，最后一个等 1.5 秒；同样的 350 个请求进漏桶，最后一个要等约 3.5 秒——令牌桶对突发友好，漏桶对下游最温柔。
    但注意：若到达速率持续高于发令速率（比如每秒来 150、只发 100），桶空之后积压以每秒 50 的速度无限增长——限流只治突发，治不了持续过载，那要靠扩容或降级。落地上，单机限流只看得见自己那份流量；分布式限流要全局口径，就得把计数收拢到一处（集中式计数，代价是每次判断多一跳）或给每个节点预分配配额（本地计数，代价是口径粗）。限流触发后的动作也有讲究：排队（等一会就轮到，适合可延迟的）与拒绝（立即失败并给明确信号，适合保护性的）——选哪个取决于请求能不能等。
    业务场景示意：电商大促时工单量暴涨，客服工单平台在入口按优先级分流：高优先级（支付、履约类）走高配额通道，低优先级（一般咨询）走低配额、必要时排队或提示改走自助——限流在这里不只是保护系统，也是把稀缺处理能力按业务价值分配。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: up
      id: u
      label: 请求洪峰：350 个请求同时到达（示例）
    - lane: mid
      id: m
      label: 令牌桶：每秒补充 100 个令牌，桶最多存 200 个（示例）
      highlight: true
    - lane: down
      id: d
      label: 下游：只接收限流后按规则放行的流量
    messages:
    - id: m1
      from: u
      to: m
      label: 请求先拿到令牌，才能通过
      active: true
    - id: m2
      from: m
      to: d
      label: 200 个立即通过，其余按速率放行
    registers:
    - name: 令牌桶
      value: 桶容量决定一波突发最多能立即通过多少，补充速率决定长期每秒最多通过多少
    - name: 漏桶
      value: 出口始终匀速放行，350 个请求中最后一个要等约 3.5 秒（示例）
  log:
  - mode: 限流
    event: 令牌桶的容量决定突发时能先放多少，令牌补充速率决定长期能稳定放行多少
- id: circuit-breaker
  title: 熔断与降级：下游病重时，先止血再放行
  tldr: 上一步的限流和前面的重试，都默认下游还有救、只是暂时忙不过来或者抖了一下，这一步看下游已经大量报错、确实病重时该怎么办。熔断器的做法像家里的保险丝，失败比例超过阈值就先断开，之后的请求直接快速失败，不再打扰下游，给它留出恢复时间，过一段时间再用半开状态放少量探针请求试探，成功了才恢复，降级则是在下游不可用时先返回缓存或默认值这类次级结果，先保住主流程。
  body: |-
    重试与限流都假设下游还有救。若下游已经病重（错误率飙升、延迟爆炸），继续把请求送过去只会让它更难恢复，还会拖住上游的线程与连接。熔断器（circuit breaker）的做法是学保险丝：统计一个滚动窗口内的失败比例（例如最近 20 个请求里失败过半，示例口径），过线就跳闸——之后一段时间内所有请求当场快速失败，连网络都不碰；冷却期过后进入半开状态，只放一两个探针请求试探，成功了才合闸恢复，失败则继续跳闸。拿时间走一遍就更具体了，假设熔断打开后先冷却 30 秒（示例），这 30 秒里哪怕每秒涌进来 200 个请求，它们都会在本地直接快速失败，一个都不会真的打到下游身上，下游就得到了整整 30 秒不受打扰的恢复时间，30 秒之后只先放一两个探针过去试探，探针成功才把流量慢慢放回来，探针失败就重新打开熔断、再等下一轮冷却。
    它与重试的次序很关键：熔断在前，先判断「还值不值得试」，重试在后，只对熔断放行的请求做有限次重试——否则重试会绕过熔断的止血。Envoy 这类代理把熔断做在网络层：按集群设连接数、待处理请求数、并发请求数与并发重试数的上限，超限即溢出拒绝，不必每个应用各写一遍。降级是熔断的搭档：非核心功能（推荐、评论计数）在下游不可用时返回缓存值、默认值或直接隐藏，保住下单、支付这类核心链路——降级的本质是提前约定「什么可以先不要」。
  derivation: original
  sources:
  - ref: envoy-circuit-breaking
    locator: Circuit breaking（架构概览）一节
    claim: Envoy 在网络层按集群强制执行熔断上限（连接数、待处理请求数、并发请求数与并发重试数），理念是快速失败并尽早向调用方传递背压，而不是让请求在病重的下游排队
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-15
  canvas:
    kind: swimlane
    actors:
    - lane: up
      id: u
      label: 调用方：每个请求先经过熔断器判断能不能放行
    - lane: mid
      id: m
      label: 熔断器：在关闭、打开、半开三种状态之间切换
      highlight: true
    - lane: down
      id: d
      label: 已经故障的下游：需要一段时间不被新请求打扰来恢复
    messages:
    - id: m1
      from: m
      to: d
      label: 熔断打开一段时间后，只放少量探针请求试探下游是否恢复
      active: true
    registers:
    - name: 三态
      value: 三种状态分别是，关闭时正常放行请求，打开时让请求直接快速失败，半开时只放少量探针请求去试探下游
    - name: 次序
      value: 先用熔断判断还值不值得调用，再对放行的请求有限重试，最后用降级结果兜底
  log:
  - mode: 熔断
    event: 熔断打开后不再把普通请求送给下游，让下游有一段不受打扰的时间恢复
- id: service-discovery
  title: 注册与发现：地址不写死，名单实时问
  tldr: 前面几步的限流、重试和熔断，都默认了一件事，就是你已经知道要调的服务在哪里，这一步就看服务地址经常变化时该怎么找到它。比如昨天还在运行的实例今天扩容换了一批，地址全变了，调用方如果把旧地址写死在配置里就会调错，正确的做法是实例启动时把自己的地址登记到注册中心，并定期发心跳证明自己还活着，心跳超时就从名单里剔除，调用方每次按服务名查最新名单，再从健康实例里挑一个来调用。
  body: |-
    前面几站的保险都假设「知道要调谁」。可云上的实例地址天天变：扩容新增、故障下线、发布换批。若把地址写死在配置里，每次变更都要改配置、重启全场。注册与发现把这件事变成运行时查询：实例启动时向注册中心登记「服务名 → 我的地址与端口」，并周期性发心跳续命；注册中心发现某个实例心跳超时，就把它从名单里剔除（宁可短暂误杀，不留死地址）；调用方按服务名查名单，在健康实例里挑一个（轮询、随机或按负载）发起调用。拿数字走一遍，假设每个实例每 10 秒发一次心跳、连续 30 秒收不到心跳就判定它已经下线（示例口径），那一个实例真的宕机之后，最多过 30 秒它就会从名单里消失，这 30 秒就是调用方还可能把请求发到死地址的窗口，窗口大小就是这样由心跳间隔和超时阈值一起决定的，心跳发得越勤、超时定得越短，窗口就越小，但注册中心要处理的心跳量也越大。发现可以放在客户端（调用方直查名单、自己做负载均衡，少一跳）或服务端（经负载均衡器转发，多一跳但调用方无感）。
    有个绕不开的递归：注册中心自己就是全系统的要害，它挂了，新实例登记不上、名单也查不了——所以注册中心本身必须用共识复制做成高可用（第三课的 Raft 在这里上班），并且调用方要缓存名单，注册中心短暂不可用时按旧名单继续跑，绝不让治理面故障变成业务面故障。
  derivation: original
  sources:
  - ref: istio-traffic
    locator: Introducing Istio traffic management（service registry）一节
    claim: Istio 通过连接平台的服务发现系统填充自己的服务注册表，边车代理据此把流量导向正确的服务实例并做负载均衡，实例的扩缩对调用方透明
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-15
  canvas:
    kind: swimlane
    actors:
    - lane: up
      id: u
      label: 调用方：按服务名向注册中心查可用实例名单
    - lane: mid
      id: m
      label: 注册中心：名单用共识协议复制到多个副本，保证可用
      highlight: true
    - lane: down
      id: d
      label: 实例群：启动时登记地址，之后定期发心跳证明存活
    messages:
    - id: m1
      from: d
      to: m
      label: 实例登记自己的地址，并周期性发送心跳
      active: true
    - id: m2
      from: u
      to: m
      label: 调用方查到名单后，挑一个健康实例发起调用
    registers:
    - name: 剔除
      value: 某个实例心跳超时就先从名单移除，避免调用方继续把请求发到已经失效的地址
    - name: 兜底
      value: 调用方缓存上一次查到的名单，注册中心短暂故障时仍可按旧名单调用
  log:
  - mode: 发现
    event: 服务地址不再写死在配置里，而是运行时从注册中心查名单；注册中心本身用共识复制保证名单可靠
- id: config-gray-trace
  title: 治理三件套：配置、灰度与追踪
  tldr: 上一步解决了地址去哪里查的问题，服务能调通之后，规模再变大就会遇到管不住的问题，这一步看配置、灰度和追踪这三件套各管一摊。比如要改限流阈值，如果写在配置文件里就要重启所有实例，收进配置中心后推送一下就能动态生效，新版本上线时灰度发布先只放 1% 流量验证，出问题就把比例调回 0 来回滚，一次请求跨十几个服务出错时，链路追踪用一个贯穿全程的编号把每一跳的记录拼起来，看清它到底卡在哪一跳。
  body: |-
    规模再上一个台阶，痛点从「调不通」变成「管不住」，三件套各管一摊。配置中心：限流阈值、熔断参数、开关这类参数若写死在代码或配置文件里，改一次要全场重启；收进配置中心后，变更推送到各实例动态生效（第六站的阈值、第五站的预算都靠它在线调整）。它的风险也对称：一条坏配置能在一分钟内推满全场，所以配置变更本身也要灰度与回滚。灰度发布（金丝雀）：新版本先接 1% 流量，盯住错误率与延迟，没问题再逐级放量到 100%；出问题时把比例拨回 0 即完成回滚——发布从「全量赌博」变成「可调的阀门」，Istio 这类网格就是按百分比与请求特征切流量的。拿流量算一遍就知道 1% 有多小，假设这个服务每分钟要处理 10,000 个请求（示例），1% 就只有 100 个请求会走到新版本上，就算新版本全错，受影响的也只是这 100 个请求，确认这 100 个请求的错误率和延迟都正常，再把比例往 10%、50% 逐级放大，每一级都重新看一遍指标。链路追踪：一次请求穿过十几个服务，日志各记各的，靠什么拼回全程？入口生成一个 trace ID，逐跳透传，每跳把自己的耗时记成一个 span，事后按 ID 聚合，就能看见时间到底花在哪一跳、错误从哪一跳冒出来；全量记录太贵，通常按比例采样，错误请求优先留样。
    业务场景示意：跨多个数据中心的客服工单平台，服务实例分布在各地，靠注册中心按数据中心就近发现彼此，靠配置中心统一一处修改、全球生效（例如大促期间统一调低低优先级工单的配额），新版本按数据中心逐个灰度——有了这三件套，多个数据中心的服务才能像在一个地方一样统一管理。
