- id: log-round
  title: 走完一轮复制：一条命令怎样变成「已提交」
  tldr: 命令到主、主追加、并行下发、多数派落盘回执、主宣告提交并应用、再通知各从应用——回执过半的那个瞬间，决定正式不可撤销。
  body: '选举是换届的热闹，复制才是日常。把一条命令的全程放慢：客户端把命令发给主；主先把它作为新的一行追加进自己的本地日志（此时还只是草稿，未提交）；随即并行地把这一行发给所有从节点；从节点把行写进自己的日志后回一个确认。

    主数着回执：当连同自己在内、多数派都已把这一行落盘保存，主就把这行标记为已提交（committed）——这是整条流程的心脏时刻：一旦提交，它就获得永不回滚的承诺，哪怕下一秒主宕机、新主上台，这一行也必须活在新主的日志里（下一幕证明这件事为什么成立）。主把命令应用到自己的状态机、把结果回给客户端，然后在下一轮心跳里捎带通知各从节点「提交线推进到这里了」，从节点随之应用。

    注意回执门槛为什么是多数派而不是全部：等所有节点等于让最慢、最容易死的那台决定全系统的可用性，一台宕机就全停。多数派门槛把容忍度做成了可计算的数：3 台容忍 1 台坏、5 台容忍 2 台——想多容忍，就多加机器，且永远是奇数台划算，因为 4 台与 3 台容忍的同样是 1 台，多出的那台只花钱不涨容错。'
  derivation: original
