- id: safety-majority
  title: 安全性的地基：任意两个多数派必有交集
  tldr: 过半这个数不是随便选的：两个都过半的集合必然重叠，于是已提交的条目必在新主的选民里留过痕，再加上「只投日志够新的人」，旧账就永远丢不了。
  body: '现在证明全课最要紧的一句话：已提交的日志为什么永远丢不了。地基是一条朴素的集合论事实：任意两个多数派必然相交。比如 5 台机器里任选 3 台、再任选 3 台，两组至少共享 1 台——因为 3 加 3 大于 5，挤不进互不重叠的两个角落。这叫多数派交集（quorum intersection）。

    把它接到流程上。某条日志被多数派落盘才算已提交（上一幕），意味着至少一个多数派集合的每台机器上都有它。之后任何一次选举，新主也要靠一个多数派集合的票当选——两个多数派必相交，所以新主的选民里至少有一台保存着那条已提交日志。再加上选举时的那条限制：投票人只投给「日志至少和自己的一样新」的候选人（比较最后一条日志的任期与长度）。选民里既有带着旧账的人、又只肯把票投给账够全的人，两条一夹，账不全的候选人就永远凑不齐票——能当选的新主，日志里必然包含全部已提交条目。

    请注意整条证明没有一处依赖运气或时间：不依赖消息多快、不依赖谁先谁后，只依赖「过半集合必交」与投票规则。这就是分布式协议里难得的确定性绿洲：正确性不靠测试跑出来，靠数学夹出来。本课设计部分还会回到这个数——为什么门槛必须是过半，多一分少一分都不行。'
  derivation: original
