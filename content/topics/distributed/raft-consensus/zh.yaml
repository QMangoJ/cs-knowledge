- id: leader-and-term
  title: 任期与主：先同意一个人，再由他排顺序
  tldr: 时间被切成一届届任期（term），每届至多一个主；稳态时主一个人负责收命令、排顺序、往下复制，全员表决只发生在换届那一刻。
  body: '如果每条命令都要全员投票表决，通信量与僵局都会爆炸。Raft 的做法是把「同意」摊销：先用一次选举同意「这一届由谁说了算」，之后这一届里的所有排序都委托给这个主（leader）。时间因此被切成一段段任期（term），每届有单调递增的编号（第 1 届、第 2 届……），任期就像一枚谁也伪造不了的届次印章：任何消息都带着任期号，收到比自己旧的任期的指令，一律当作前朝遗诏不予理会。

    「每届至多一个主」由投票规则机械保证：每个节点一届里只投一票，一名候选人必须拿到多数派的票才算当选——一届里不可能凑出两个互不相交的多数派（地基在后面一幕细说），所以不可能选出两个主。稳态随之变得极其简单：客户端只找主，主追加日志后往下复制，心跳周期性地发出去维系权威；从节点（follower）只做三件事：抄日志、回确认、发现主失联太久就发起下一届选举。

    委托的代价也要认：任期内主是热点，也是单点——主一倒下，集群要经历一段没有排序者的空窗，直到新一届选出新主。这段空窗的长短由选举超时决定，是可用性账上的一笔固定开支，与第一站的超时哲学一脉相承。'
