          to: l
          label: 这类问题没法靠事后补丁修好，只能先商量出一个共同决定
          active: true
      registers:
        - name: 决定的性质
          value: 只有一个版本，形成后不能推翻，活着的节点最后都会知道
        - name: 容忍边界
          value: 比如 3 台里死 1 台，剩下的 2 台还要能继续作出决定
    log:
      - mode: 问题
        event: 这一课要做的，就是把「几台机器同意同一件事」变成一套靠规则就能可靠执行的流程
  - id: replicated-sm
    title: 复制状态机：不直接核对千变万化的结果，只核对同一本命令日志
    tldr: 起点相同的三台机器，只要按一模一样的顺序执行同一串命令，最终算出的余额必然分毫不差；共识的对象由此缩成一张有序的命令日志表。
    body: |-
      让三台机器每改一个内存字节都开会表决太笨重了，Raft 第一招是靠**复制状态机**（replicated state machine）把靶子缩到最小：只要三台机器装着同一套确定性程序、从同一个初始状态出发，拿到完全相同的一串命令并按完全相同的顺序执行，各自内存里算出来的结果必然一模一样。这样一来，跨机器唯一需要商量的事，就只剩「日志第 1 行、第 2 行、第 3 行分别填哪条命令」。

      为什么顺序半点都不能错？拿数字心算一遍就懂：假设账户初始余额是 10 元，收到两条命令「加 10」和「乘以 2」。节点甲按「先加 10 再乘 2」算出 `(10 + 10) × 2 = 40` 元；节点乙要是顺序颠倒成「先乘 2 再加 10」，算出来就是 `10 × 2 + 10 = 30` 元——命令一条没丢，账却直接差出 10 块钱。

      这跟 MySQL 主从复制里重放 [[binlog]] 的原理一脉相承：都是靠按序重放操作日志复刻状态。区别在于传统主从里「谁当主库」靠外部管理员或外挂脚本指派，而 Raft 把「谁有资格往日志里写下一行」本身也锁进了协议内部。
    derivation: original
    sources:
      - ref: raft-paper
        locator: 论文第 2 节 Replicated State Machines
        claim: Raft 采用复制状态机结构：各服务器对同一份日志中的命令按相同顺序执行，状态保持一致；共识模块的职责是维护这份复制日志
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
    canvas:
      kind: swimlane
      actors:
        - lane: l
          id: l
          label: 每台机器：装着同一套程序、从同一个初始状态出发
        - lane: f1
          id: f1
          label: 三台机器拿到同一串日志，并且按同一个顺序执行
        - lane: f2
          id: f2
          label: 执行命令是每台机器自己在本地做的事，这一步不需要再商量
          highlight: true
      messages:
        - id: m1
          from: l
          to: f1
          label: 唯一需要几台机器一起商量的，是这串日志的顺序表
          active: true
      registers:
        - name: 收敛后的问题
          value: 大家一起同意的，不再是每个状态，而是这一串日志的顺序
        - name: 与 binlog 的关系
          value: 道理和 binlog 一样都是重放日志；区别是还要保证「由谁来定顺序」在出故障时也不会乱
    log:
      - mode: 收敛
        event: 这样，共识要解决的问题就变小了：从「同意所有状态」缩小到「同意一张命令的顺序表」
  - id: leader-and-term
    title: 任期与唯一主节点：选一次班长管一届，省掉逐条命令全员公投
    tldr: Raft 把时间切成递增的「任期（term）」，靠「每人每届一票、过半当选」保证同届最多一个主；平时只由主单向排日志发心跳，从节点等满 150–300 毫秒听不到心跳才发起换届。
    body: |-
      如果每写一行日志都要三台机器互相拉票商量，吞吐量根本跑不起来。Raft 的聪明之处是把公投成本摊薄：先投一次票选出「这一届听谁的」，选定之后整届任期内的日志顺序全由这位**主节点**（Leader）一人拍板往下抄送，**从节点**（Follower）老老实实干三件事——抄日志、回确认、盯心跳。

      为了防止新旧两任主节点撞车，Raft 用单调递增的整数把时间切成一届届**任期**（Term：第 1 届、第 2 届……），所有网络消息头上都必须印着任期号。同届之内为什么绝不会选出两个主？因为规矩写死**每个节点在同一届最多投出一张赞成票，且候选人必须拿满严格过半票数才能当选**——3 台里过半要 2 票，不可能同时有两个人各拿 2 票；至于断联的老主节点，哪怕后来缓过神来发号施令，别人一看它消息头上的旧任期号比自己低，当场拒收并逼它自动退位成从节点。

      稳态运转全靠一快一慢两个时间齿轮咬合：主节点每隔几十毫秒（如 30–50 毫秒）群发一次空心跳续命，而从节点的选举超时设在 **150 到 300 毫秒**量级。心跳间隔远短于超时线，这样哪怕网络偶尔抖动丢了一两声心跳，从节点也不会大惊小怪地乱掀桌子重选。当然，强主模型也有代价：主节点倒下到新主选出之间，集群必然有一两百毫秒的停写空窗。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: l
          id: l
          label: 主：这一届里唯一负责给命令排顺序的机器
          highlight: true
        - lane: f1
          id: f1
          label: 从节点甲：收到主的日志就照着抄，并回一个确认
        - lane: f2
          id: f2
          label: 从节点乙：盯着心跳计时，太久没收到就准备发起选举
      messages:
        - id: m1
          from: l
          to: f1
          label: 每条消息都带任期号，看到任期号就能知道这是哪一届的指令
          active: true
      registers:
        - name: 每届主的数量
          value: 最多一个；靠「每人一届只投一票、过半才当选」的投票规则来保证
        - name: 稳态成本
          value: 平时不用反复投票，只剩下主把日志单向复制给从节点这一件事
    log:
      - mode: 组织
        event: 先用一次选举定下这一届谁说了算，后面很多条命令就都能直接按主的排序执行，不必每条都重新表决
  - id: election-round
    title: 选举实战走一遍：日志不够新拿不到票，随机超时破平票僵局
    tldr: 从甲先等满超时把任期加一升到第 5 届，先投自己一票再向同伴拉票；同伴只把票投给「日志至少和自己一样新」的候选人，而 150–300 毫秒的随机超时能错开同时拉票的平票死局。
    body: |-
      顺着主节点突然断电的瞬间，把第 5 届选举一步步跑出来：从节点甲的选举倒计时（比如随机掷出了 168 毫秒）比从节点乙（掷出 275 毫秒）先归零。从甲立刻干三件事：把本地任期号从 4 加到 **5**，把身份切成**候选人**（Candidate），先给自己投下第 1 票，紧接着向全场广播拉票请求，信封里附上自己的任期号 `5` 以及自己最后一条日志的任期与总长度。

      从乙收到拉票信，必须连过两道安检才肯给票：第一，我第 5 届还没把票许给别人；第二，**你的日志至少得和我手里的一样新**——比法很硬核，先比两人最后一条日志的任期号，任期大的赢；任期相同再比日志总条数，条数多的赢。只要从甲日志不落后，从乙当场回赠第 2 票；3 台集群里从甲凑够 2 票（过半！）立刻转正为第 5 届新主，马上群发心跳压住从乙的倒计时，集群在两百毫秒内满血复工。

      要是凑巧从甲和从乙在同一毫秒超时、各自投自己一票导致没人凑够 2 票（平票 split vote）怎么办？这一届直接流产重来，而破局法宝正是**随机化选举超时**：每台机器每轮都在 150–300 毫秒里重新掷骰子定闹钟，下一轮几乎必然一快一慢错开起跑——跟第 1 课给重试加随机抖动防踩踏用的是同一味药。
    derivation: original
    sources:
      - ref: raft-paper
        locator: 论文第 5.2 节 Leader Election
        claim: 从节点选举超时后自增任期转为候选人并投票给自己，获得多数票当选；随机化的选举超时用于避免平票反复，让某一候选人能率先赢得选举
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
    canvas:
      kind: swimlane
      actors:
        - lane: f1
          id: f1
          label: 从甲：计时先走完，把任期加一后开始拉票
          highlight: true
        - lane: f2
          id: f2
          label: 从乙：这一届还没投过票；如果候选人的日志还没有我的新，就不投
        - lane: l
          id: l
          label: 旧主：已经宕机，这个位置现在空着
      messages:
        - id: m1
          from: f1
          to: f2
          label: 第 5 届拉票：拿到过半数的票就当选
          active: true
      registers:
        - name: 当选门槛
          value: 必须拿到多数派的票；差一票没过半，就不能当选
        - name: 平票解法
          value: 每个节点的选举超时随机取值，让大家不要在同一时刻一起发起选举
    log:
      - mode: 选举
        event: 选举是整个流程里消息来往最多的一刻；选完之后，平时就只需要主定期发心跳和复制日志了
  - id: log-round
    title: 复制实战走一遍：多数派落盘才盖「已提交」铁戳，偶数台集群最冤大头
    tldr: 主节点收到命令先写本地草稿，再并发抄送从节点；连主在内过半机器落盘确认那一刻才升格为永不回滚的「已提交」——算清 ⌊(N−1)/2⌋ 容错公式就知道为什么生产环境一律配 3 台或 5 台奇数集群。
    body: |-
      新主上任后，客户端发来一笔「扣款 100 元」，跟着它走完两趟半的正式转正流程：主节点先把这条命令追加进本地磁盘日志（注意此时只是未生效的草稿），随即并行发给从甲和从乙；从甲手快先写进磁盘回了个确认，此时连主带从甲已有 **2 台**（3 台里的多数派）落盘。就在收齐过半回执这一毫秒，主节点拍板把该行标为**已提交**（Committed），真正扣减内存余额并回复客户端「扣款成功」，随后在下一次心跳里顺带通知从甲和慢半拍的从乙推进提交线。

      为什么提交门槛非得卡在「严格多数派」而不是等全员到齐？要是必须等齐 3 台，从乙只要重启换块硬盘，整个集群就得陪葬停服；改成过半门槛后，N 台集群能稳稳容忍 `⌊(N−1)/2⌋` 台机器死机——3 台坏 1 台照跑，5 台坏 2 台照跑。

      顺着这条算式还能一眼看穿运维铁律：**千万别搭 4 台机器的 Raft 集群！** 4 台机器过半要 3 票，最多只能容忍 `4 - 3 = 1` 台故障，跟 3 台集群的抗揍能力一模一样；多买的第 4 台服务器不仅多花钱，还白白把凑齐多数派的网络负担拉重了一分，纯粹当冤大头。
    derivation: original
    sources:
      - ref: raft-paper
        locator: 论文第 5.3 节 Log Replication 与官网简介（raft.github.io）
        claim: 主将日志复制到多数派服务器后该条目即视为已提交并可应用；N 台服务器的集群可容忍少于一半节点故障，如 5 台容忍 2 台
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
    canvas:
      kind: swimlane
      actors:
        - lane: client
          id: c
          label: 客户端：发完命令后，等主回一个「已经提交」的结果
        - lane: l
          id: l
          label: 主：先把命令追加到本地日志（这时还只是草稿），再同时发给从节点
          highlight: true
        - lane: f1
          id: f1
          label: 从甲：把这一行写进自己的日志后，回一个确认
        - lane: f2
          id: f2
          label: 从乙：把这一行写进自己的日志后，回一个确认
      messages:
        - id: m1
          from: l
          to: f1
          label: 回执过半后就宣告提交，提交后永不回滚
          active: true
      registers:
        - name: 提交门槛
          value: 连主自己在内，多数派机器都已经把这一行落盘保存
        - name: 容忍公式
          value: 容忍的数量可以这样算，N 台机器能容忍 ⌊(N−1)/2⌋ 台坏掉，比如 3 台能容忍 1 台、5 台能容忍 2 台，剩下的仍然能凑齐多数派
    log:
      - mode: 复制
        event: 平时每处理一条命令，基本都是在重复这一轮的几个步骤
  - id: safety-majority
    title: 旧账丢不了的算术铁底：任意两个多数派必有交集
    tldr: 5 台机器里任选 3 台落盘、再任选 3 台投票选新主，因为 3+3>5，两边至少重叠 1 台知情机器；再配上「只投给日志不比自己旧的候选人」，新主手里必然握有全部已提交日志。
    body: |-
      已提交的日志为什么哪怕主库连环死机也绝不会丢？靠的不是祈祷网络别出乱子，而是一条小学生都能验算的集合论铁律：**任意两个严格过半的集合，必然至少共享 1 名共同成员**（多数派交集 quorum intersection）。拿 5 台机器走一遍数字：过半门槛是 3 台；无论你挑哪 3 台存下日志，下次选举再挑哪 3 台投出赞成票，因为 `3 + 3 = 6 > 5`，两个圈子怎么画都至少叠着 **1 台共同的机器**。

      现在把两把铁钳合拢：第一把钳子是「提交过半 + 选举过半」，保证了新主当选所依赖的选民团里，**至少站着 1 台亲手把那笔旧账写进磁盘的知情人**；第二把钳子是第 4 步讲过的「投票门槛」——这位知情选民死守规矩，**绝不把票投给日志比自己旧的糊涂蛋**。想拿走它手里的关键一票当选新主，候选人自己的日志里就必须早已包含那条已提交旧账！

      整条证明漂亮在完全不看网速快慢、不看物理时钟准不准，纯粹靠 `3 + 3 > 5` 与投票门禁把漏洞焊死——分布式系统的安全性从来不是靠压测碰运气跑出来的，而是靠数学夹出来的。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: l
          id: l
          label: 已提交的条目：已经保存在一个多数派的每台机器上
        - lane: f1
          id: f1
          label: 两个多数派重叠的那台机器：它手里有旧日志，而且只投给日志和自己一样全的候选人
          highlight: true
        - lane: f2
          id: f2
          label: 新主：当选时必然已经见过全部已提交的条目
      messages:
        - id: m1
          from: f1
          to: f2
          label: 因为 3+3>5，两个多数派必然至少重叠 1 台
          active: true
      registers:
        - name: 地基
          value: 地基是这样一条事实，任意两个成员数都过半的集合，必然至少有 1 台共同的机器，不可能完全错开
        - name: 夹子
          value: 两条规则像夹子一样一起起作用，重叠的那台机器留下了旧日志，再加上大家只投给日志够新的候选人，就能保证新主不会漏掉已经提交的旧账
    log:
      - mode: 证明
        event: 已提交日志不会丢，不靠运气：靠的是多数派必有交集这条集合论事实，再加上投票规则，一起保证新主的日志里必有旧账
  - id: failure-modes
    title: 三场故障压力测试：半路死机、网线断成 2 比 3、旧主诈尸
    tldr: 未过半的草稿本就没答应客户，被新主覆盖不算违约；5 台裂成 2 与 3 时，少数派凑不够 3 票主动停服（CAP 保 C 弃 A）；旧主复活带着过期任期号发令会被当场拒收并自动退位。
    body: |-
      把开篇最揪心的三场极端事故挨个放进规则里过一遍，看 Raft 怎么接招。**第一场：主节点刚把扣款命令抄给 1 台或只写进自己本地（5 台里才 1–2 台，未过半）就当场烧机。** 后来当选的新主手里可能没这行草稿，后续新日志会直接把它盖掉——这算丢账违约吗？不算！因为当时压根没凑齐过半回执，主节点从未给客户端回过「扣款成功」，客户端拿到的只是超时，按幂等规矩重发或查单即可；而凡是回过成功的已提交日志，早已被多数派交集锁死在新主肚子里了。

      **第二场：机房网线被挖断，5 台机器裂成 2 台与 3 台两座孤岛。** 3 台那一侧能凑齐 3 票选出新主照常接单；被困在 2 台那一侧的哪怕是原任老主节点，它接下新命令后最多攒够 2 份落盘，永远凑不齐 3 份提交门槛，只能让客户端等到超时报错——这就是上一课 CAP 定理里**选 C 弃 A** 的活教材：宁可让少数派孤岛暂停营业，也绝不允许两边同时改账。

      **第三场：断网的老主节点十分钟后网线重连「诈尸」归来，会不会乱发号施令？** 不会。老主还停在第 4 届，而大部队早就选到第 5 届了；老主发出的任何复制包一亮出任期 `4`，第 5 届的从节点看一眼直接弹回拒绝并亮出新任期 `5`，老主见天外有天，当场乖乖卸任降回普通从节点，无需任何人工干预。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: l
          id: l
          label: 旧主：复制到一半就宕机，或者被分区困在少数派那一侧
        - lane: f1
          id: f1
          label: 多数派一侧：能凑齐票数，选出新主并继续提交命令
          highlight: true
        - lane: f2
          id: f2
          label: 少数派一侧：总是差一票选不出主，只能等待分区恢复
      messages:
        - id: m1
          from: f1
          to: f2
          label: 已经提交的日志必然在新主手里；还没提交的草稿则不受这个保证保护
          active: true
      registers:
        - name: 承诺的边界
          value: 「永不丢失」这个承诺只保护已经提交的条目，未提交的草稿不在内
        - name: 旧主处理
          value: 旧主的任期号一旦过期，它发出的指令就会被拒绝，它自己也会自动降为从节点
    log:
      - mode: 演练
        event: 上面三种故障都已经有现成的处理规则，不需要出事时再临时发明办法
  - id: membership
    title: 在线扩缩容防裂：每次只准增减一台机器
    tldr: 要是把 3 台集群一口气改成 5 台，切换瞬间可能同时凑出旧多数派（2 台）和新多数派（3 台）闹出双主；把「每次只增减 1 台机器」写成普通日志走共识，新旧多数派全程必有交集。
    body: |-
      线上集群早晚要换坏机器或从 3 台扩到 5 台，可改花名册这件事藏着大坑：假如管理员直接改配置文件把 3 台扩成 5 台，由于各台机器收到新花名册有快有慢，切换那一秒可能旧名单里的 2 台（3 过半）选出一个主，新名单里的另外 3 台（5 过半）同时选出另一个主，当场人为造出双主脑裂！

      Raft 最稳妥的工程解法极其克制：**把增减节点本身当成一条日志走共识提交，且每次只准增减 1 台机器**（比如 3 台扩 5 台，必须先走 `3 → 4`，等稳了再走 `4 → 5`）。算一下就知道妙在哪：3 台多数派是 2，4 台多数派是 3，因为 `2 + 3 = 5 > 4`，新旧两套多数派哪怕在交接瞬间共存，也必然至少重叠 1 台机器，绝无可能裂出两个互不相干的主。

      论文里还给过另一套叫「联合共识」（joint consensus）的方案，允许一次性换多台机器，代价是过渡期每次表决都得同时拿满旧名单和新名单两边的多数票，状态机复杂一倍；工业界绝大多数生产实现（包括 `etcd`）都偏爱一步步单节点替换——慢半拍，但每一步都稳稳踩在交集铁底上。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: l
          id: l
          label: 主：把「增加或减少一个节点」也写成一条普通日志来提交
          highlight: true
        - lane: f1
          id: f1
          label: 换人前后的多数派：只差一个成员，所以仍然必然有重叠的机器
      messages:
        - id: m1
          from: l
          to: f1
          label: 一次只换一个节点，换人全程都不破坏多数派交集的证明
          active: true
      registers:
        - name: 变更方式
          value: 变更的方式是，先把这次增减写进日志、再走共识流程确认，而且一次只替换一个节点，不批量一起换
        - name: 守护的
          value: 这样做要守住的是，在换人的整个过程中，任意新旧两套多数派都仍然有交集，已提交日志不会丢的证明才不会在中途失效
    log:
      - mode: 成员
        event: 连换节点这种管理操作，也走和普通命令相同的共识流程，靠的还是多数派必有交集这条地基
  - id: two-generals
    title: 划清理论边界：Raft 没推翻两将军问题，而是换掉了三道前提
    tldr: 两将军问题在「只有两方、信使可永久丢信、追求无限层确知」前提下数学无解；Raft 改用多方多数派、假定网络终会恢复且节点只崩溃不伪造假票（非拜占庭），解的是真实机房里可解的那道题。
    body: |-
      学过网络科 [[TCP]] 握手的人常会犯嘀咕：两将军问题明明证明了「靠可能丢包的信使永远达不成百分之百确知的共识」，Raft 凭什么敢拍胸脯说已提交永不推翻？答案很坦诚：**Raft 压根没有推翻两将军定理，而是把原题那三道死胡同前提全换成了机房里的真实条件。**

      拿放大镜逐条比对：第一，两将军只有**两支军队**，一方不吭声就彻底抓瞎；Raft 至少摆 **3 台机器**，靠多数派交集说话，死掉 1 台照样拍板。第二，两将军允许信使**永远把信全吞掉**；Raft 假设网线断了迟早会修好（分区期间只保安全不丢账，等网通了再恢复推进），并且假设服务器**只会断电崩溃、绝不会像内鬼一样伪造假选票**——这叫**非拜占庭假设**（non-Byzantine，要是防黑客节点撒谎作伪就得上贵十倍的区块链式拜占庭容错协议）。第三，两将军钻的是「我知道你知道我知道……」的无限哲学牛角尖；Raft 只要求「一旦过半落盘，后续任何新主都翻不了案」。

      就像 TCP 三次握手没有消灭两将军，而是靠序号与超时重传把不确定性压进工程可承受的框里；看懂任何分布式论文的第一招，永远是**先查它偷偷换掉了哪几条前提假设**，再看算法本身。
    derivation: original
    sources:
      - ref: ddia
        locator: 第 8、9 章（系统模型：崩溃故障与拜占庭式故障的区分；共识的适用前提）
        claim: 分布式算法的正确性依赖系统模型假设：崩溃故障模型下节点只会停机不会撒谎，拜占庭模型则允许任意行为；算法结论不能脱离其模型假设来宣称
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
    canvas:
      kind: swimlane
      actors:
        - lane: l
          id: l
          label: 两将军：只有两方，没有多数派可用，信使的消息还可能永远丢失
        - lane: f1
          id: f1
          label: Raft：有多台机器可以取多数派，节点只崩溃不伪造，网络最终会恢复连通
          highlight: true
      messages:
        - id: m1
          from: l
          to: f1
          label: 三个前提都换了，所以这已经不是原来那个问题了
          active: true
      registers:
        - name: 判断标准
          value: 判断一个方案靠不靠谱，要先看它假设了哪些前提，再看它的算法本身
        - name: 同种智慧
          value: TCP 三次握手也是同样思路：把剩下的不确定性压到足够小，剩下的交给上层处理
    log:
      - mode: 边界
        event: 结论不应该写成「解决了无解的问题」，而应该写清：在换掉哪些前提之后这个问题才变得可解，这样才既诚实又对工程有用
  - id: where-used
    title: 收官落地：共识坐镇控制面，业务只调现成库、绝不自己手搓
    tldr: 共识只管小而致命的「控制面户籍本」（如 Kubernetes 底下的 etcd、ZooKeeper、Consul 以及 D1 的单写者选主），绝不扛每秒百万次的普通业务读写；实战守死两条铁律：认准三大信号词，调用成熟现成组件。
    body: |-
      日常写后端业务几乎不用亲手敲一行 Raft 代码，因为你每天早就踩在它肩膀上干活了——共识协议专职坐镇基础设施的**控制面**：[[Kubernetes]] 用 [[etcd]] 存全集群容器编排状态，微服务用 Consul 或早期同门师兄 ZooKeeper 管服务注册与选主，Cloudflare [[D1]] 靠控制面协调锁死「全网同一时刻只有唯一主副本接写」，然后放心地让数据面边缘副本狂奔服务海量读请求。记住这条分工：**共识是法院院长，只判「谁当主、配置改哪版」这种一锤定音的大案，绝不下场替你扛每秒十万笔的普通商品查询。**

      把整课收成两条能救命的实战铁律与一句口诀：
      1. **绝不自己手写共识协议**：磁盘半写断电、网络乱序重放、脑裂旧主残包组成的边界组合是天文数字，自己手搓一个「简易选主脚本」上线必炸，老老实实调 `etcd`、Consul 或成熟的 Raft 库。
      2. **听见三个词立刻请出共识层**：只要产品需求里同时出现跨多台机器的**「全局唯一」「同一时刻只能有一个」「严格顺序不能乱」**，别拿脆弱的睡眠轮询凑合，直接交给共识组件裁决。

      收尾口诀背下来：**任期防双主，过半定铁案；三加三超五，旧账丢不掉。**
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: client
          id: c
          label: 业务代码：直接用现成的共识服务，不要自己重新实现
          highlight: true
        - lane: l
          id: l
          label: 协调层：像 etcd 这类已经实现了共识的服务
        - lane: f1
          id: f1
          label: 数据面：按照协调层裁决出的结果去读写数据
      messages:
        - id: m1
          from: c
          to: l
          label: 共识负责在关键处做裁决，不参与每一笔数据的快速读写
          active: true
      registers:
        - name: 识别信号
          value: 需求里出现「全局唯一」「只能有一个」「顺序不能乱」这些说法时，就是需要共识的信号
        - name: 纪律
          value: 要用已经成熟的共识实现，不要自己从零手写一个
    log:
      - mode: 落点
        event: 共识更像可以直接采用的现成地基，不需要每个项目都从零再做一遍
minutes: 30
prereq:
  - distributed/cap-consistency
  - network/tcp-handshake
objectives:
  - 拿具体毫秒与票数走完一轮 Raft 选举与一轮日志复制，说出当选与提交的两道硬门槛
  - 用 3+3>5 多数派交集加投票日志新旧限制，证明已提交日志在换主时绝不丢失
  - 对比两将军问题与 Raft 的三处前提差异，解释非拜占庭假设的工程边界
  - 说清 etcd / ZooKeeper / Consul 在控制面的分工，识别业务中需要引入共识的三大信号词
aiLink: 千卡大模型训练集群的调度大脑同样靠共识防分裂：哪张坏卡正式剔除出通信环、最新一轮检查点以哪个步数版本为准、主控节点挂了谁接管——一旦控制面冒出两个答案，整场昂贵的训练就会当场跑废。
design:
  - mechanism: 先选主再单向抄日志：选一次班长管整届，摊平逐条公投的天价通信费
    problem: 要是每来一条写命令都让集群全员互相投票商量顺序，多轮网络广播的延迟和选票撞车僵局会随并发量原地爆炸，每秒几千笔写入都扛不住。
    choice: 把时间切成递增任期，每届只在换主那一刻投一次票；稳态下排序大权全权交给唯一主节点，其余从节点只管按序落盘回执。
    tradeoff: 主节点成了整届任期里的吞吐天花板和单点瓶颈——它要是磁盘卡顿全群跟着慢，它要是断电全群得熬过一两百毫秒选举空窗才能恢复写入。
    root: 让互不共享内存的多台机器达成一次共同认知极其昂贵；把成千上万次逐条协商折叠成「一次授权选主 + 批量顺序抄写」，与操作系统用缓冲区攒批减少系统调用是同一种摊销智慧。
  - mechanism: 严格过半门槛（Quorum）：唯一同时保住「死少数不停工」与「新旧必交集」的平衡点
    problem: 提交门槛定高到全员确认，坏一块硬盘就全站停摆；门槛定低到不足半数，断网时两边孤岛就能各自凑齐达标人数、各自签出互相冲突的铁案。
    choice: 把选举当选和日志提交双双钉死在严格过半（⌊N/2⌋ + 1），并且生产集群一律按 3 台或 5 台奇数部署，不花偶数台那份不涨容错的冤枉钱。
    tradeoff: 每笔写入都得等多数派里倒数第一名落盘才算完事；一旦把 5 台机器跨洲摆在三个国家，每次写延迟都会被跨洋光纤生生拉高到上百毫秒。
    root: 两个元素数严格大于 N/2 的子集必然至少重叠 1 个元素——这条不依赖网速、不依赖时钟的纯算术事实，是异步世界里把过去与未来焊接在一起的唯一锚点。
  - mechanism: 可理解性优先于极致弹性：宁肯强主受限，也要让人脑装得下整套状态机
    problem: 分布式协议的异常时序组合用压测永远跑不完，前辈 [[Paxos]] 虽精妙却晦涩到连顶尖工程师都频频写错边界，工业界各家魔改版本互不兼容、暗雷遍地。
    choice: Raft 故意砍掉乱序空洞提交等花哨自由度，用任期切时间、用日志单向从主往从流、用随机定时器破平票，确保每条不变式都能画在一张纸上逐行审计。
    tradeoff: 强主单向流牺牲了多主并发写入与无主就近提交的峰值吞吐上限，跨洲多写场景下不如无主变体灵活。
    root: 代码终究要靠人去写、去审、半夜告警时去查；工程师脑容量的理解上限也是系统可靠性的硬约束——一套人人能完全看懂的 90 分协议，在真实线上远比没人敢拍胸脯摸透的 100 分协议安全。
terminal:
  - cmd: etcdctl member list（在装有 etcd 的环境里）
    note: 看一眼真实共识集群的成员与谁是 leader——那正是 Raft 在值班的地方；没有环境时读一遍 raft.github.io 的可视化演示亦可
