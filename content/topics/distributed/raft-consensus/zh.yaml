bridge:
  prev: 上一课的一致性谱系管的是「读到的数据能容忍多旧」，但遇到「现在到底谁是主库」「这笔扣款算不算正式生效」这类裁决，哪怕两台机器各执一词半秒钟都会酿成双主乱账。这一课就看多台随时可能死机的机器，怎样商量出一个铁板钉钉、永不翻案的共同决定。
  next: 共识搞定了「多台机器听谁排顺序」，但还剩两笔跨机硬账没结：没有全局准钟时两台独立机器上的事件凭什么排先后？一笔转账横跨两家不同服务时，怎样保证同生共死？下一课就用逻辑时钟、两阶段提交与补偿把这两块补齐。
title: 共识与 Raft：任期、投票与一本共同的日志
summary: 共识协议要让一组随时可能宕机的机器对同一串命令顺序达成不可推翻的决定。2014 年诞生的 Raft 把难题拆成「先选主、再抄日志」两步：靠递增任期保证每届最多一个主，靠「过半落盘才算已提交」容忍少数节点死机，再靠「任意两个多数派必有重叠机器」这条算术铁律锁死旧账不丢，并与无解的[[两将军问题]]划清前提界限。
premise: 三台服务器（主节点、从节点甲、从节点乙）共同掌管一份核心账本，对外承诺哪怕任意死掉一台也不停服、不丢账。某天主节点刚把一笔「扣款 100 元」命令发给从甲，还没来得及发给从乙就突然断电黑屏；几百毫秒后从甲和从乙要自己选出新主接着干活——在没有中心裁判盯着的情况下，怎么防止两台从节点同时自立为王（[[脑裂]]），又怎么确保刚才已经答应过客户的旧账绝不在换届时被抹掉？
position: 本课位于分布式系统板块第三段「共识：让多台机器同意一件事」，承接一致性谱系。谱系允许边缘读副本慢半拍，而集群选主与元数据裁决容不下丝毫含糊；学完后你能拿数字推演 Raft 的选举、复制与多数派交集证明，并看懂 etcd 等控制面底座的工作原理。
overview:
  - key: 一句话总结
    value: 裁决容不下两本账：Raft 用递增任期锁死每届唯一主节点，用过半落盘划定提交红线，再靠多数派必有交集保证任何新主上台都漏不掉已提交的旧账。
  - key: 问题收敛
    value: 复制状态机把「商量千变万化的内存状态」简化成「商量同一本命令日志的顺序」——起点相同的机器只要按完全相同的顺序重放命令，算出的最终状态必然分毫不差。
  - key: 任期与选主
    value: 时间被切成单调递增的任期（第 1 届、第 2 届……），每台机器每届只准投一票、过半才当选，从根上杜绝同届双主；旧主就算复活，带着过期任期号发出的指令也会被当场拒收。
  - key: 提交门槛
    value: 一条日志必须被连主在内的严格多数派机器落盘（如 3 台里的 2 台、5 台里的 3 台）才算「已提交」，一旦跨过这道线就永久生效、绝不回滚。
  - key: 安全地基
    value: 5 台机器里任选 3 台存日志、再任选 3 台投票选新主，因为 3+3>5，两边至少重叠 1 台知情者；叠加上「只投给日志不比自己旧的候选人」，新主手里必然握有全部已提交日志。
  - key: 容错边界
    value: N 台集群最多容忍少于一半节点故障（5 台坏 2 台、3 台坏 1 台，部署偶数台白花钱不涨容错）；网络分区时少数派一侧凑不够半数票主动停写，对应 [[CAP]] 里保 C 弃 A。
  - key: 与两将军的界
    value: 两将军问题只有两方、无多数派且允许永久丢信，因此无解；Raft 换成多方多数派、机器只崩溃不撒谎（非拜占庭）且网络终会恢复连通，解的是工程可落地的另一道题。
