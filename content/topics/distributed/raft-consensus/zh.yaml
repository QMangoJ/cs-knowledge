steps:
- id: why-consensus
  title: 为什么需要共识：裁决容不下「差不多」
  tldr: 读到旧数据可以打补丁，可「谁是主」「这笔提交算不算」若有两个答案，系统会当场分裂——这类问题要的是单一、不可推翻的共同决定。
  body: '上一站的谱系处理的是容忍问题：数据旧一点、乱一点，都有补丁可打。但分布式系统里还有一类问题完全不吃这一套：裁决问题。眼下谁是主库？这一笔跨行转账到底算不算提交成功？集群里现在有哪几台成员？这些问题若在系统内部出现两个答案，后果不是体验瑕疵而是直接分裂——两个主各自收写、两笔都自称已提交，账从此对不平。

    共识（consensus）就是为裁决问题准备的：一组机器，哪怕其中一些会崩溃、消息会迟到，最终对某个值形成一个共同的决定，并且这个决定一旦形成就不可推翻、所有活着的节点最终都会得知同一个结果。注意定义里的克制：它不要求所有节点都活着（那是不可能的），只要求活着且能互通的多数派能推进，并且任何时刻都不会冒出第二个互相冲突的决定。

    本课把共识做成看得见的流程：选用的协议是 Raft——它是为「让人能理解」而设计的共识协议，如今活在大量基础设施的控制面里。后面的每一幕只引入一个新部件：先把问题收敛成「同意一串日志」，再逐个装上任期、投票、提交规则与多数派交集这块数学地基。'
