      value: 最多一个；靠「每人一届只投一票、过半才当选」的投票规则来保证
    - name: 稳态成本
      value: 平时不用反复投票，只剩下主把日志单向复制给从节点这一件事
  log:
  - mode: 组织
    event: 先用一次选举定下这一届谁说了算，后面很多条命令就都能直接按主的排序执行，不必每条都重新表决
- id: election-round
  title: 走完一轮选举：从失联到新主上任
  tldr: 上一步讲的是任期和主的静态规则，这一步把一轮选举真的走一遍，看看主的位置空出来之后，新主是怎么产生的。从节点如果太久等不到主的心跳，就会把任期加一、把自己变成候选人，先投自己一票，再向其他机器拉票，拿到过半数的票就当选为新主；如果有两名候选人同时拉票、票被分走谁都过不了半，这一届就只能作废重选，让每个节点的等待时间随机错开，比如在 150 到 300 毫秒里随机取，就能减少两人同时起跑、再次平票的机会。
  body: |-
    把一轮选举放慢看。主正常时，从节点靠周期心跳不断重置选举计时器。某刻主宕机了，某个从节点的计时器先走完：它把当前任期加一（比如进入第 5 届），切换为候选人，先给自己投一票，然后向所有同伴发出拉票请求，请求带着新任期号与自己的日志进度。
    同伴按两条规则裁决：这一届还没投过票，才有投票资格；再看候选人的日志是否至少和我的一样新（选举限制，后面讲它为何是安全关键），两条都满足才投赞成。这里说的「一样新」具体是这样比较的，先比两边最后一条日志的任期号，任期号大的更新；如果任期号相同，再比日志的长度，条数多的更新，候选人必须至少和投票人一样新，投票人才会把票投给他。候选人收到多数派赞成，当选新主，立刻广播心跳宣告权威，集群恢复运转。反过来，若两个从节点同时超时、各自拉票，票源被瓜分，谁都凑不齐多数派，这叫平票（split vote）：这一届流产，等计时器再次走完后进入下一届重选。
    平票的解法是「以随机治僵局」：每个节点的选举超时在区间里随机取（比如 150 到 300 毫秒之间各掷一次）。随机化让「同时超时」成为小概率，某一轮大概率只有一名候选人率先起跑、干净当选。第一站的重试抖动防同步，是同一味药。
