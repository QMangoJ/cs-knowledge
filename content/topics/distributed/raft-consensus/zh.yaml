  log:
  - mode: 证明
    event: 安全性不靠运气，靠集合论把新主的日志夹住
- id: failure-modes
  title: 故障演练：主死一半路上、分区少数派会怎样
  tldr: 主复制到一半宕机：已提交的活、未提交的可能被新主覆盖；分区时少数派一侧既选不出主也提交不了——这正是 CAP 里选 C 的具体长相。
  body: '把故障挨个演一遍，检验前面的部件。第一幕：主把一行日志只发给一台从就宕机了，这行没凑齐多数派、从未提交。新主当选后，它的日志里没有这一行（或者位置不同），后续新行会把旧草稿覆盖掉——这不违约：未提交的草稿本来就不享有任何承诺，客户端收到的是超时而非成功，它会重试，操作语义毫发无损。若那一行已经提交（多数派落盘过），则按上一幕的证明，新主必然带着它，覆盖不可能发生。一条线划得干净：承诺只保护跨过门槛的东西。

    第二幕：网络分区，5 台被切成 2 与 3。3 的一侧能凑齐多数派：选新主、继续提交，业务照常。2 的一侧选不出主（永远差一票），旧的若恰好留在那侧还会自说自话地收命令，但一行也提交不了，只能让客户端等到超时。对照上一站：这就是选 C 的具体长相——分区期间少数派一侧主动不可用，换取全系统永远只有一个真相。

    第三幕顺带回答一个常见恐惧：旧主复活或没死透，会不会回来捣乱？它带的任期号已经过期：新一届的节点收到旧任期的复制请求会直接拒绝，旧主一旦收到更高任期的消息，自己就自动降级为从节点。任期这枚印章在这里值回票价：不用谁宣布废黜，数字自己说话。'
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: l
      id: l
      label: 旧主：倒在半路或困在少数派
    - lane: f1
      id: f1
      label: 多数派一侧：选新主、继续提交
      highlight: true
    - lane: f2
      id: f2
      label: 少数派一侧：差一票，只能等待
    messages:
    - id: m1
      from: f1
      to: f2
      label: 已提交的必在新主手里，未提交的不受保护
      active: true
    registers:
    - name: 承诺的边界
      value: 只保护已提交条目
    - name: 旧主处理
      value: 任期过期即自动作废
  log:
  - mode: 演练
    event: 三种故障各有归宿，没有一幕需要临场发明规则
- id: membership
  title: 成员变更一句：一次只换一个人
  tldr: 增减节点本身也是一条要过共识的日志；一次换一个、新旧两套多数派始终交叠，交集地基就不会在换人途中塌掉。
  body: '集群不是一成不变的：机器要替换、容量要扩缩，成员名单本身会变。麻烦在于成员变更也是裁决问题（名单只能有一个版本），而且变更途中若新旧两套配置各自选主，就等于人为制造双真相。Raft 给的保守解法是：把成员变更也当成一条普通日志走共识流程，并且一次只增减一个节点。

    一次换一个的妙处在交集地基上：换人前后的两套多数派之间只差一个成员，任何新旧多数派依然必有交集，前面那条「已提交永不丢」的证明在整个换人过程里不间断地成立。更激进的联合共识（新旧配置同时表决）允许批量变更，机制更复杂，实践中最常用的仍是这种单步替换：慢，但每一步都踩在证明覆盖的地面上。

    这一课的取舍后面会作为一种设计气质再出现：分布式协议的作者宁可牺牲变更的灵活性，也不让安全性证明出现一分钟的空窗——因为空窗出现的时刻，正是故障最爱挑的时刻。'
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: l
      id: l
      label: 主：把「换人」当普通日志提交
      highlight: true
    - lane: f1
      id: f1
      label: 新旧多数派：始终保持交集
    messages:
    - id: m1
      from: l
      to: f1
      label: 一次换一个，证明不间断
      active: true
    registers:
    - name: 变更方式
      value: 入日志、过共识、单步替换
    - name: 守护的
      value: 多数派交集全程不破
  log:
  - mode: 成员
    event: 连换人这种元操作，也走同一套流程、守同一块地基
- id: two-generals
  title: 划清界限：Raft 没有「解决」两将军问题
  tldr: 两将军无解的前提——只有两方、信使可任意丢失、无多数派可用——Raft 一样都改了：多方取多数、节点只崩不伪、消息终将送达。解的是另一个更弱、但真实存在于工程里的问题。
  body: '网络科的 TCP 课里你见过两将军问题：两支军队靠信使约时间，信使可能被截，任何有限次通信都无法让双方确知对方确知——它证明了在任意丢信的信道上达成确知性的共识是不可能的。有人会问：Raft 号称达成共识，岂不是推翻了它？没有。Raft 改掉了题目的全部前提，解的是另一个问题。

    逐条对照。两将军只有两方，一方沉默就无从判断；Raft 是多方，判断不靠某一个节点，靠多数派的交集，少几个节点照样推进。两将军假设信使可以任意、永远地丢失消息；Raft 假设网络最终会恢复连通（分区只是暂时的），且节点虽会崩溃但不会伪造消息、不两面三刀——后者叫非拜占庭（non-Byzantine）假设：机器只会坏，不会骗。若允许节点作伪（比如被入侵后发假票），Raft 的投票就被攻破，那是另一个更贵的问题域（拜占庭容错），本课不展开。最后，两将军要求的是双方确知对方确知……的无限回归；Raft 只要求「决定不可推翻且多数派知道」，不追求每个节点在每个瞬间都确知。

    与 TCP 的呼应值得点明：三次握手同样没有消灭两将军，它把残余的不确定性压小到工程可接受，再让上层（超时重传、连接状态机）消化剩余部分。Raft 是同一种智慧的集群版：不在无解的问题上硬碰，把前提换到真实世界成立的那一档，再在那一档里把机制做到数学可证。判断一个分布式方案是否靠谱，先问它的前提清单，常常比先看它的算法更重要。'
  derivation: original
  sources:
  - ref: ddia
    locator: 第 8、9 章（系统模型：崩溃故障与拜占庭式故障的区分；共识的适用前提）
    claim: 分布式算法的正确性依赖系统模型假设：崩溃故障模型下节点只会停机不会撒谎，拜占庭模型则允许任意行为；算法结论不能脱离其模型假设来宣称
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: l
      id: l
      label: 两将军：两方、无多数派、信可永丢
    - lane: f1
      id: f1
      label: Raft：多方多数派、只崩不伪、网终恢复
      highlight: true
    messages:
    - id: m1
      from: l
      to: f1
      label: 前提全换，问题已不是同一个
      active: true
    registers:
    - name: 判断标准
      value: 先看前提清单，再看算法
    - name: 同种智慧
      value: TCP 握手亦然：压小不确定性，上层消化
  log:
  - mode: 边界
    event: 不说「解决了无解问题」，说清在哪些前提下可解——这才是诚实且有用的结论
- id: where-used
  title: 落点：你平时不直接写 Raft，但天天站在它上面
  tldr: etcd、各种数据库的选主与元数据管理、D1 的单写者协调，底层都是共识在值班；业务层要学的是识别哪里需要它，而不是重复实现它。
  body: 'Raft 这类共识协议最终活在哪里？答案是基础设施的控制面：Kubernetes 用来存集群状态的 etcd、各类分布式数据库用来管理元数据与选主的协调服务、配置与服务发现系统——它们的共同需求都是「一份小而关键的状态，必须全网只有一个版本，且任意几台机器死了都不丢、不裂」。

    数据科末尾的 D1 也可以放回这张图里看：它敢在全球边缘铺读副本、却坚持写归一到主所在的一处，靠的正是控制面层面的协调来保证「写只有一个入口」这个裁决永远成立——写路径因此不需要逐笔共识，而读路径拿着会话书签就近取。共识不在数据的快车道上，它在路口当交警。

    对业务开发者的实务结论有两条。其一，不要自己手写共识：正确性证明覆盖的边界极多（消息重排、磁盘半写、时钟乱序都有对应条款），自己写的版本几乎必然在某个角落漏掉一条，老老实实用成熟实现。其二，要学会识别「这里需要共识」：当需求里出现「全局唯一」「只能有一个」「顺序不能乱」且参与方是多台机器时，就该把问题交给共识层，而不是用分布式锁凑合——下一站结尾会正面处理「跨机事务」时，你会看到凑合方案与正经方案的分界线。'
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 业务代码：用，不实现
      highlight: true
    - lane: l
      id: l
      label: 协调层：etcd 一类共识服务
    - lane: f1
      id: f1
      label: 数据面：照裁决结果干活
    messages:
    - id: m1
      from: c
      to: l
      label: 共识在路口，不在快车道上
      active: true
    registers:
