steps:
  - id: why-consensus
    title: 裁决容不下「差不多」：一旦冒出双主，账本立刻脑裂
    tldr: 读点赞数差几秒顶多体验微瑕，但「眼下谁是主库」一旦同时冒出两个答案，两台机器各自收钱改账就会当场引发脑裂；斯坦福团队 2014 年设计 Raft，就是为了给这类裁决提供一套人脑能看透的铁律。
    body: |-
      有些问题绝不能用「最终一致慢慢对齐」糊弄过去——最典型的就是**裁决问题**：此刻 3 台机器里到底谁是唯一主库？分布式锁归谁拿走了？要是节点甲和节点乙同时自封为主、各自对外接单扣款（行话叫[[脑裂]]），不出十秒两本账就会彻底改花，神仙也合不回来。共识（consensus）协议干的就是这件硬活：哪怕机器随时死机、消息半路迟到，活着的多数派也必须敲定唯一一个决定，且一旦定案永不推翻。

      早年统治这一领域的是 Leslie Lamport 提出的 [[Paxos]]，理论上无懈可击，却因规则晦涩难懂导致工业界各家写出来的代码漏洞百出。2014 年斯坦福大学的 Diego Ongaro 和 John Ousterhout 被这份痛苦逼出了 **Raft**，破天荒把「让人脑能彻底看懂」列为第一设计目标——如今无论是独立运行的协调服务（如 `etcd`、Consul），还是嵌进分布式数据库里的共识库，十有八九跑的都是它。

      前端同学其实在浏览器里见过它的微缩同构物：用户在浏览器里同时打开同一个网页的 5 个标签页时，为了防止 5 个 Tab 同时建长连接弹 5 遍桌面通知，前端常靠 `BroadcastChannel` 或 `Web Locks` 选出唯一一个「主 Tab」干活，主 Tab 关掉再由剩下的 Tab 接班——Raft 只是把这件事搬到了没有浏览器内核兜底、只能隔着不可靠网线喊话的多台服务器之间。
    derivation: original
    sources:
      - ref: ddia
        locator: 第 9 章 Consistency and Consensus（共识问题概述）
        claim: 共识是让一组节点对某个值达成一致决定的问题，决定一旦形成不可更改；它是选主、唯一性约束等裁决型问题的形式化基础
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
