- id: replicated-sm
  title: 先把问题变小：从「同意一切」到「同意一串日志」
  tldr: 让每台机器都按同一顺序执行同一串命令，它们的状态就必然一致（复制状态机）；于是共识只需解决一件事：共同排定这串命令的顺序。
  body: '共识听起来像要让机器们对世界上的一切达成一致，范围大得无从下手。Raft 的第一步是把问题收敛：设想每台机器内部都是一台相同的状态机（同一套程序、同一个初始状态），如果所有机器都拿到完全相同的一串命令、按完全相同的顺序执行，它们的内部状态就会步步相同、永远相同。这叫复制状态机（replicated state machine）。

    这样一收敛，共识的对象就从「一切状态」缩成「一串有序的命令日志」：大家不需要逐条商量每个状态长什么样，只需要共同同意日志的第 1 条、第 2 条、第 3 条分别是什么。执行是本地的、确定的，唯一需要跨机器商量的，是顺序表本身。请注意这与数据库的日志思想同构：binlog 之所以能造出从库，靠的也是「同样的操作按同样的顺序重放，必然得到同样的状态」——区别在于主从复制里顺序由主库单方面说了算，而共识要保证的，是连「谁说了算」这件事本身在故障面前都不翻车。

    接下来所有部件都为这张顺序表服务：主负责往表里追加新行，提交规则负责宣告「这一行从此不可撤销」，选举负责在主倒下时选出一个能看见全表的新主。'
  derivation: original
  sources:
  - ref: raft-paper
    locator: 论文第 2 节 Replicated State Machines
    claim: Raft 采用复制状态机结构：各服务器对同一份日志中的命令按相同顺序执行，状态保持一致；共识模块的职责是维护这份复制日志
