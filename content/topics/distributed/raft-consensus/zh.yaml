    event: 共识是买来的地基，不是每个项目都要重打的地基
minutes: 30
prereq:
- distributed/cap-consistency
- network/tcp-handshake
objectives:
- 完整复述一轮 Raft 选举与一轮日志复制，指出各自的关键门槛
- 用多数派交集与选举限制，说明已提交日志永不丢失的理由
- 说清 Raft 与两将军问题的三处前提差异，以及非拜占庭假设的含义
- 举出共识在真实系统中的落点，并识别业务中「这里需要共识」的信号
aiLink: 大模型训练里也有裁决问题：哪张卡汇报的梯度算数、检查点以谁为准、坏卡摘除由谁宣布——这些控制面决定一旦双版本，整个训练任务就会分裂，所以集群调度器内部同样跑着共识。
design:
- mechanism: 为什么共识要「选主加复制日志」，而不是每条决定都全员表决
  problem: 根本约束是表决的成本与僵局随决定条数线性爆炸：每条命令都全员协商一次，通信轮次多、延迟高，协商中还有意见分裂无人裁决的风险；而真实系统每秒要下成千上万个决定，逐个表决在物理上就跑不起来
  choice: 做法是把共识摊销：只对「这一届由谁排序」表决一次，稳态时排序权委托给主，其余节点复制与确认即可。表决因此只剩两个廉价出场点——换届选举，与「回执过半即提交」这个无需额外通信的计数判定
  tradeoff: 代价是主成为任期内的热点与单点：吞吐受单台主的上限约束，主宕机带来一段选举空窗，且主若被慢盘或网络抖动拖累，整个集群跟着变慢——委托制的效率是用这份不对称换来的
  root: 根子在经济学上：共识的本质开销是「让独立节点形成共同知识」，这件事每做一次都很贵。把无数个决定折叠成「一次授权、无数次执行」，是把贵操作摊薄的经典手法，与操作系统里把系统调用批量化、数据库里把日志顺序化是同一个母题
- mechanism: 为什么提交门槛必须是严格过半，多一台少一台都不行
  problem: 根本约束有两头：门槛若是全体，任何一台故障都让系统停摆，可用性被最弱的成员绑架；门槛若低于半数，则可能存在两个互不相交的「达标集合」，各自提交互相冲突的决定，双真相从此合法诞生，安全性当场破产
  choice: 做法是取严格过半：它同时是两个条件的唯一交点——既能容忍少数节点故障（可用性），又能保证任意两个达标集合必有交集（安全性）。奇数台部署划算，也由此而来：容忍数只随过半线变化，偶数台多花一台却不涨容忍
  tradeoff: 代价在延迟分布上：每笔提交要等到排在中间位置的那个成员回执才算数，于是写延迟由多数派里最慢的成员决定；成员跨地域部署时，这个中位延迟会被最远的那一侧显著拉高
  root: 根子是纯集合论：两个元素数都大于 n/2 的子集必然相交，这是与机器、网络、时间全都无关的算术事实。Raft 的全部安全性正是把工程问题逐级归约到这条算术上——好的分布式设计，最后往往要落到这种不依赖运气的地方
- mechanism: 为什么 Raft 把「可理解性」当成头号设计目标，排在性能之前
  problem: 根本约束是分布式协议的正确性无法靠测试穷尽：消息时序、崩溃点、磁盘状态的组合是天文数字，前任主流协议 Paxos 正确但出了名的难懂，结果是各家实现理解不一、细节各异，协议越难懂，实现里藏的雷越多
  choice: 做法是主动为「人脑能完全装下它」优化协议：用任期把时间切段、用强主把稳态做成单向复制、用随机选举超时换取规则简化，宁可牺牲一些理论上的优雅与峰值性能，也要让协议的每条规则都能被工程师完整复述与逐条审计
  tradeoff: 代价是某些场景不如更灵活的协议变体：强主模型下主是吞吐瓶颈，多主或无主变体在特定负载下更有优势，Raft 的保守取舍等于主动放弃了这部分上限
  root: 根子在认知带宽也是一种硬资源：协议的正确性最终要经过人脑这道关——设计评审、实现、排障都靠人对机制的理解深度。为理解优化不是降低学术标准，而是承认在不可穷尽测试的领域里，能被完全理解的正确，比不能被完全把握的更优，更容易活得久
terminal:
- cmd: etcdctl member list（在装有 etcd 的环境里）
  note: 看一眼真实共识集群的成员与谁是 leader——那正是 Raft 在值班的地方；没有环境时读一遍 raft.github.io 的可视化演示亦可
