steps:
- id: why-consensus
  title: 为什么需要共识：裁决容不下「差不多」
  tldr: 我们先从上一课留下的问题接起，上一课讲的谱系能容忍数据旧一点、乱一点，但这一课要处理的是另一类完全不能含糊的问题。读到稍微旧一点的数据，通常还能靠重试或事后修正补回来，但「谁是主」「这笔提交算不算」这类问题如果同时出现两个答案，比如两台机器都自称是主、都接受写入，系统就会直接分裂，所以这类问题需要的是大家最后只认同一个决定，而且这个决定定下后不能再推翻。
  body: |-
    上一站的谱系处理容忍问题：数据旧一点、乱一点，都有补丁可打。但还有一类问题不吃这一套：裁决问题。眼下谁是主库？这一笔跨行转账到底算不算提交成功？集群里现在有哪几台成员？这些问题若在系统内部出现两个答案，后果不是体验瑕疵而是直接分裂——两个主各自收写、两笔都自称已提交，账从此对不平。
    共识（consensus）就是为裁决问题准备的：一组机器，哪怕其中一些会崩溃、消息会迟到，最终对某个值形成一个共同的决定，决定一旦形成就不可推翻、所有活着的节点最终都会得知同一个结果。它不要求所有节点都活着，只要求活着且能互通的多数派能推进，并且任何时刻都不会冒出第二个互相冲突的决定。
    本课选用 Raft——为「让人能理解」而设计的共识协议，如今活在大量基础设施的控制面里。后面每一幕只引入一个新部件：先把问题收敛成「同意一串日志」，再逐个装上任期、投票、提交规则与多数派交集这块数学地基。
