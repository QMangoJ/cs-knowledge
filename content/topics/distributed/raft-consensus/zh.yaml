  log:
  - mode: 问题
    event: 这一课要做的，就是把「几台机器同意同一件事」变成一套靠规则就能可靠执行的流程
- id: replicated-sm
  title: 先把问题变小：从「同意一切」到「同意一串日志」
  tldr: 上一步先说清了裁决为什么容不下两个答案，这一步先不急着讲选举，而是把问题本身变小，看看真正需要大家一起商量的到底是什么。比如三台机器都依次执行「余额加 10」「再乘以 2」这两条命令，因为起点相同、顺序相同，最后算出的余额必然相同，这就叫复制状态机，这样一来大家不必逐个商量每个状态，只需要共同商量一件事，这串命令的顺序到底怎么排。
  body: >-
    Raft 的第一步是把问题收敛：设想每台机器内部都是一台相同的状态机（同一套程序、同一个初始状态），如果所有机器都拿到完全相同的一串命令、按完全相同的顺序执行，它们的内部状态就会步步相同。这叫复制状态机（replicated
    state machine）。

    共识的对象由此从「一切状态」缩成「一串有序的命令日志」：大家不需要逐条商量每个状态，只需要共同同意日志的第 1 条、第 2 条、第 3 条分别是什么。执行是本地的、确定的，唯一需要跨机器商量的，是顺序表本身。顺序为什么一点都不能含糊，用数字算一遍就明白了，假设余额一开始是 10，先加 10 再乘以 2，结果是 40；如果顺序反过来，先乘以 2 再加 10，结果就变成了 30，同一组命令只要顺序不同，最后的状态就是两个完全不同的答案。这与 binlog
    的道理是相通的：它能造出从库，靠的也是把主库执行过的操作记成日志，再让从库按同样的顺序一条条重放一遍，必然得到同样的状态——区别在于主从复制里顺序由主库单方面说了算，而共识要保证的，是连「谁说了算」本身在故障面前都不翻车。

    接下来所有部件都为这张顺序表服务：主负责追加新行，提交规则负责宣告「这一行从此不可撤销」，选举负责在主倒下时选出一个能看见全表的新主。
