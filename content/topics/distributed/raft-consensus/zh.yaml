  prev: 上一站的价格表里有一格是灰的：裁决类问题（谁是主、这笔算不算）容忍不了「差不多一致」。这一站进入共识：让多台随时会死的机器，商量出一个单一、不可推翻的共同决定。
title: 共识与 Raft：任期、投票与一本共同的日志
summary: 共识让多台机器对同一串决定形成不可推翻的共识；Raft 把它拆成选主与日志复制：任期保证一届一主，多数派落盘才算提交，多数派交集保证旧账永不丢失，并与两将军问题划清前提的界限。
premise: 以一个三节点集群（一主两从，容忍任意一台宕机）为样本：走完一次选举、一轮日志复制、一次主宕机后的改选，全程盯住「已提交的决定为什么丢不了」。
position: >-
  本课位于分布式系统本科的第三段「共识：让多台机器同意一件事」，接在一致性谱系之后：谱系管的是读能容忍多旧，而选主、提交判定这类裁决必须只有一个答案，本课就专治裁决。学完你能完整复述 Raft 的一届任期如何产生、一条日志如何走到「已提交」、以及为什么任意两个多数派必有交集是整套安全性的数学地基。
overview:
- key: 一句话总结
  value: 共识不是让大家差不多同意，而是让一个决定一旦形成就不可推翻——Raft 用任期、投票与多数派把这件事做成了机械流程
- key: 问题收敛
  value: 复制状态机：让所有机器按同一顺序执行同一串命令，难题只剩「共同同意这串日志」
- key: 任期
  value: 逻辑上的届次编号；每届至多一个主，由投票规则保证
- key: 提交规则
  value: 一条日志被多数派落盘保存，才算已提交，之后永不回滚
- key: 安全地基
  value: 任意两个多数派必有交集（集合论事实）；已提交条目必在交集里留痕，新主不可能没见过它
- key: 容错边界
  value: N 台容忍少于一半的节点崩溃：5 台容 2、3 台容 1；分区时少数派一侧停摆（选 C 的具体形态）
- key: 与两将军的界
  value: 两将军无多数派可言、信使可任意丢失，故无解；Raft 假设非拜占庭加多数派可达，解的是被弱化后的问题
