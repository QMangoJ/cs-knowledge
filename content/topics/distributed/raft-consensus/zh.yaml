    - lane: l
      id: l
      label: 旧主：已经宕机，这个位置现在空着
    messages:
    - id: m1
      from: f1
      to: f2
      label: 第 5 届拉票：拿到过半数的票就当选
      active: true
    registers:
    - name: 当选门槛
      value: 必须拿到多数派的票；差一票没过半，就不能当选
    - name: 平票解法
      value: 每个节点的选举超时随机取值，让大家不要在同一时刻一起发起选举
  log:
  - mode: 选举
    event: 选举是整个流程里消息来往最多的一刻；选完之后，平时就只需要主定期发心跳和复制日志了
- id: log-round
  title: 走完一轮复制：一条命令怎样变成「已提交」
  tldr: 选举走完、新主已经上任之后，这一步接着看稳态下最常见的一轮工作，一条普通命令是怎样一步步变成正式决定的。一条命令先发到主，主把它追加到自己的日志里，再同时发给所有从节点，从节点落盘后回一个确认，当连主在内过半数的机器都确认已经落盘时，主就宣告这条命令已提交、把它应用到状态机，之后再通知从节点也去应用，就在回执过半的那一刻起，这条命令就正式定下，之后不能再撤销。
  body: |-
    把一条命令的全程放慢：客户端把命令发给主；主先把它作为新的一行追加进本地日志（此时还只是草稿，未提交）；随即并行地发给所有从节点；从节点把行写进自己的日志后回确认。
    主数着回执：当连同自己在内、多数派都已把这一行落盘，主就把这行标记为已提交（committed）——一旦提交，它就获得永不回滚的承诺，哪怕下一秒主宕机、新主上台，这一行也必须活在新主的日志里（下一幕证明）。主把命令应用到状态机、把结果回给客户端，然后在下一轮心跳里捎带通知从节点「提交线推进到这里了」，从节点随之应用。
    门槛为什么是多数派而不是全部？等所有节点等于让最慢、最容易死的那台决定可用性，一台宕机就全停。多数派把容忍度做成可计算的数：3 台容忍 1 台坏、5 台容忍 2 台——永远是奇数台划算，因为 4 台与 3 台容忍的同样是 1 台，多出的那台只花钱不涨容错。
  derivation: original
  sources:
  - ref: raft-paper
    locator: 论文第 5.3 节 Log Replication 与官网简介（raft.github.io）
    claim: 主将日志复制到多数派服务器后该条目即视为已提交并可应用；N 台服务器的集群可容忍少于一半节点故障，如 5 台容忍 2 台
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端：发完命令后，等主回一个「已经提交」的结果
    - lane: l
      id: l
      label: 主：先把命令追加到本地日志（这时还只是草稿），再同时发给从节点
      highlight: true
    - lane: f1
      id: f1
      label: 从甲：把这一行写进自己的日志后，回一个确认
    - lane: f2
      id: f2
      label: 从乙：把这一行写进自己的日志后，回一个确认
    messages:
    - id: m1
      from: l
      to: f1
      label: 回执过半后就宣告提交，提交后永不回滚
      active: true
    registers:
    - name: 提交门槛
      value: 连主自己在内，多数派机器都已经把这一行落盘保存
    - name: 容忍公式
      value: 容忍的数量可以这样算，N 台机器能容忍 ⌊(N−1)/2⌋ 台坏掉，比如 3 台能容忍 1 台、5 台能容忍 2 台，剩下的仍然能凑齐多数派
  log:
  - mode: 复制
    event: 平时每处理一条命令，基本都是在重复这一轮的几个步骤
- id: safety-majority
  title: 安全性的地基：任意两个多数派必有交集
  tldr: 前面两步反复用到了「过半」这个门槛，选举要过半、提交也要过半，这一步就来回答这个门槛为什么偏偏定在这里，而不是随便一个数。因为任意两个都过半的集合必然有重叠的成员，比如 5 台里任选 3 台、再任选 3 台，至少有 1 台是共同的，这样一条日志既然被一个多数派保存过，后来选举新主的那个多数派里就至少有一台见过它，再加上投票时只投给日志足够新的候选人，能当选的新主就不可能没见过已经提交的旧日志，所以旧账丢不了。
  body: |-
    现在证明全课最要紧的一句话：已提交的日志为什么永远丢不了。地基是一条集合论事实：任意两个多数派必然相交。比如 5 台机器里任选 3 台、再任选 3 台，两组至少共享 1 台——因为 3 加 3 大于 5。这叫多数派交集（quorum intersection）。
    接到流程上：某条日志被多数派落盘才算已提交，意味着至少一个多数派集合的每台机器上都有它。之后任何一次选举，新主也要靠一个多数派集合的票当选——两个多数派必相交，所以新主的选民里至少有一台保存着那条已提交日志。再加上选举限制：投票人只投给「日志至少和自己的一样新」的候选人（比较最后一条日志的任期与长度）。选民里既有带着旧账的人、又只肯把票投给账够全的人，两条一夹，能当选的新主日志里必然包含全部已提交条目。
    整条证明不依赖消息多快、不依赖谁先谁后，只依赖「过半集合必交」与投票规则：正确性不靠测试跑出来，靠数学夹出来。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: l
      id: l
      label: 已提交的条目：已经保存在一个多数派的每台机器上
    - lane: f1
      id: f1
      label: 两个多数派重叠的那台机器：它手里有旧日志，而且只投给日志和自己一样全的候选人
      highlight: true
    - lane: f2
      id: f2
      label: 新主：当选时必然已经见过全部已提交的条目
    messages:
    - id: m1
      from: f1
      to: f2
      label: 因为 3+3>5，两个多数派必然至少重叠 1 台
      active: true
    registers:
    - name: 地基
      value: 地基是这样一条事实，任意两个成员数都过半的集合，必然至少有 1 台共同的机器，不可能完全错开
    - name: 夹子
      value: 两条规则像夹子一样一起起作用，重叠的那台机器留下了旧日志，再加上大家只投给日志够新的候选人，就能保证新主不会漏掉已经提交的旧账
  log:
  - mode: 证明
    event: 已提交日志不会丢，不靠运气：靠的是多数派必有交集这条集合论事实，再加上投票规则，一起保证新主的日志里必有旧账
- id: failure-modes
  title: 故障演练：主死一半路上、分区少数派会怎样
  tldr: 地基证明完之后，这一步把前面讲的规则放到真实故障里演练一遍，看看主死在半路上、网络又分区时，系统到底会怎么表现。如果主只复制了一半就宕机，已经提交的那部分会保留下来，还没提交的草稿则可能被新主后来的日志覆盖；如果网络分区，少数派那一侧因为票数和落盘数都凑不够多数，既选不出新主、也提交不了任何命令，只能停下来等待，这就是上一站 CAP 里说的选 C，也就是一致性优先，在 Raft 里的具体样子，宁可少数派那边不可用，也不能出现两个互相冲突的结果。
  body: |-
    把故障挨个演一遍。第一幕：主把一行日志只发给一台从就宕机了，这行没凑齐多数派、从未提交。新主当选后，它的日志里没有这一行，后续新行会把旧草稿覆盖掉——这不违约：未提交的草稿不享有任何承诺，客户端收到的是超时而非成功，它会重试。若那一行已经提交，则按上一幕的证明，新主必然带着它，覆盖不可能发生。
    第二幕：网络分区，5 台被切成 2 与 3。3 的一侧能凑齐多数派：选新主、继续提交，业务照常。2 的一侧选不出主（永远差一票），旧主若留在那侧还会自说自话地收命令，但一行也提交不了，只能让客户端等到超时。这就是上一站选 C 的具体长相——少数派一侧主动不可用，换取全系统永远只有一个真相。
    第三幕：旧主复活或没死透，会不会捣乱？它带的任期号已过期：新一届节点收到旧任期的复制请求会直接拒绝，旧主一旦收到更高任期的消息，自己就自动降级为从节点。不需要谁专门宣布它被废黜，光看任期号已经过期这一点就够了。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: l
      id: l
      label: 旧主：复制到一半就宕机，或者被分区困在少数派那一侧
    - lane: f1
      id: f1
      label: 多数派一侧：能凑齐票数，选出新主并继续提交命令
      highlight: true
    - lane: f2
      id: f2
      label: 少数派一侧：总是差一票选不出主，只能等待分区恢复
    messages:
    - id: m1
      from: f1
      to: f2
      label: 已经提交的日志必然在新主手里；还没提交的草稿则不受这个保证保护
      active: true
    registers:
    - name: 承诺的边界
      value: 「永不丢失」这个承诺只保护已经提交的条目，未提交的草稿不在内
    - name: 旧主处理
      value: 旧主的任期号一旦过期，它发出的指令就会被拒绝，它自己也会自动降为从节点
  log:
  - mode: 演练
    event: 上面三种故障都已经有现成的处理规则，不需要出事时再临时发明办法
- id: membership
  title: 成员变更一句：一次只换一个人
  tldr: 故障演练看的是机器坏掉的情况，这一步换一个更日常的场景，看看机器没有坏、只是要正常增减节点时，规则要怎么跟着调整。给集群增加或减少节点，这件事本身也要当成一条日志走共识流程，不能绕过，做法是一次只换一个节点，这样换人前后的两套多数派只差一台机器，仍然必然有交集，前面「已提交日志不会丢」的证明在换人过程中就不会失效。
  body: |-
    集群不是一成不变的：机器要替换、容量要扩缩，成员名单本身会变。麻烦在于成员变更也是裁决问题（名单只能有一个版本），变更途中若新旧两套配置各自选主，就等于人为制造双真相。Raft 的保守解法是：把成员变更也当成一条普通日志走共识流程，并且一次只增减一个节点。
    一次换一个的妙处在交集地基上：换人前后的两套多数派只差一个成员，任何新旧多数派依然必有交集，「已提交永不丢」的证明在整个换人过程里不间断地成立。更激进的做法叫联合共识，它的做法是先让新旧两套配置同时存在、每一次决定都要同时拿到新配置和旧配置各自的多数票，才算通过，这样就可以一次换掉多个节点，不必一个一个慢慢替换。它的代价是机制明显更复杂，配置本身要同时维护两个版本，出问题时也更难判断到底是哪一套在起作用，所以实践中最常用的仍是单步替换：慢，但每一步都踩在证明覆盖的地面上。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: l
      id: l
      label: 主：把「增加或减少一个节点」也写成一条普通日志来提交
      highlight: true
    - lane: f1
      id: f1
      label: 换人前后的多数派：只差一个成员，所以仍然必然有重叠的机器
    messages:
    - id: m1
      from: l
      to: f1
      label: 一次只换一个节点，换人全程都不破坏多数派交集的证明
      active: true
    registers:
    - name: 变更方式
      value: 变更的方式是，先把这次增减写进日志、再走共识流程确认，而且一次只替换一个节点，不批量一起换
    - name: 守护的
      value: 这样做要守住的是，在换人的整个过程中，任意新旧两套多数派都仍然有交集，已提交日志不会丢的证明才不会在中途失效
  log:
  - mode: 成员
    event: 连换节点这种管理操作，也走和普通命令相同的共识流程，靠的还是多数派必有交集这条地基
- id: two-generals
  title: 划清界限：Raft 没有「解决」两将军问题
  tldr: 机制本身讲完之后，这一步来划清一条很容易被误会的界限，免得把 Raft 说成解决了那个著名的无解问题。两将军问题之所以无解，靠的是三个前提，只有两方、信使的消息可以任意丢失、也没有多数派可以依靠；Raft 把这三个前提都换掉了，它有多台机器可以取多数派，节点只会崩溃不会伪造消息，而且假设网络最终会恢复、消息最终能送达，所以 Raft 解的不是原来那个无解的问题，而是一个条件更宽松、但在真实工程里确实存在的问题。
  body: >-
    网络科的 TCP 课里你见过两将军问题：两支军队靠信使约时间，信使可能被截，任何有限次通信都无法让双方确知对方确知——它证明了在任意丢信的信道上达成确知性的共识是不可能的。Raft 号称达成共识，岂不是推翻了它？没有。Raft
    改掉了题目的全部前提，解的是另一个问题。

    逐条对照。两将军只有两方，一方沉默就无从判断；Raft 是多方，判断不靠某一个节点，靠多数派的交集，少几个节点照样推进。两将军假设信使可以任意、永远地丢失消息；Raft
    假设网络最终会恢复连通（分区只是暂时的），且节点虽会崩溃但不会伪造消息——这叫非拜占庭（non-Byzantine）假设：机器只会坏，不会骗。若允许节点作伪（比如被入侵后发假票），Raft
    的投票就被攻破，那是另一个更贵的问题域（拜占庭容错），本课不展开。最后，两将军要求双方确知对方确知……的无限回归；Raft 只要求「决定不可推翻且多数派知道」。

    三次握手同样没有消灭两将军，它把残余的不确定性压小到工程可接受，再让上层消化。Raft
    是同一种智慧的集群版：不在无解的问题上硬碰，把前提换到真实世界成立的那一档，再在那一档里把机制做到数学可证。判断一个方案是否靠谱，先问它的前提清单，常常比先看算法更重要。
  derivation: original
  sources:
  - ref: ddia
    locator: 第 8、9 章（系统模型：崩溃故障与拜占庭式故障的区分；共识的适用前提）
    claim: 分布式算法的正确性依赖系统模型假设：崩溃故障模型下节点只会停机不会撒谎，拜占庭模型则允许任意行为；算法结论不能脱离其模型假设来宣称
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: l
      id: l
      label: 两将军：只有两方，没有多数派可用，信使的消息还可能永远丢失
    - lane: f1
      id: f1
      label: Raft：有多台机器可以取多数派，节点只崩溃不伪造，网络最终会恢复连通
      highlight: true
    messages:
    - id: m1
      from: l
      to: f1
      label: 三个前提都换了，所以这已经不是原来那个问题了
      active: true
    registers:
    - name: 判断标准
      value: 判断一个方案靠不靠谱，要先看它假设了哪些前提，再看它的算法本身
    - name: 同种智慧
      value: TCP 三次握手也是同样思路：把剩下的不确定性压到足够小，剩下的交给上层处理
  log:
  - mode: 边界
    event: 结论不应该写成「解决了无解的问题」，而应该写清：在换掉哪些前提之后这个问题才变得可解，这样才既诚实又对工程有用
- id: where-used
  title: 落点：你平时不直接写 Raft，但天天站在它上面
  tldr: 前面把机制和边界都讲清楚之后，最后一步落回日常工作，看看你平时其实已经站在哪些共识系统上面了。etcd、很多数据库的选主和元数据管理、以及 D1 的单写者协调，底层都靠共识来保证只有一个版本，写业务代码时要学的不是自己再实现一遍共识，而是识别出哪些地方出现了「必须全局唯一、只能有一个」的需求，那里就应该用共识。
  body: |-
    Raft 这类共识协议活在基础设施的控制面：Kubernetes 用来存集群状态的 etcd、分布式数据库用来管理元数据与选主的协调服务、配置与服务发现系统——它们的共同需求都是「一份小而关键的状态，必须全网只有一个版本，且任意几台机器死了都不丢、不裂」。
    数据科末尾的 D1 也可以放回这张图里看：它敢在全球边缘铺读副本、却坚持写归一到主所在的一处，靠的正是控制面协调来保证「写只有一个入口」——写路径因此不需要逐笔共识，读路径拿着会话书签就近取。也就是说，共识不参与每一笔数据的快速读写，它只在需要裁决的关键位置起作用。
    实务结论有两条。其一，不要自己手写共识：正确性证明覆盖的边界极多（消息重排、磁盘半写、时钟乱序都有对应条款），自己写的版本几乎必然在某个角落漏掉一条，用成熟实现。其二，要学会识别「这里需要共识」：需求里出现「全局唯一」「只能有一个」「顺序不能乱」且参与方是多台机器时，就该把问题交给共识层，而不是用分布式锁凑合。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 业务代码：直接用现成的共识服务，不要自己重新实现
      highlight: true
    - lane: l
      id: l
      label: 协调层：像 etcd 这类已经实现了共识的服务
    - lane: f1
      id: f1
      label: 数据面：按照协调层裁决出的结果去读写数据
    messages:
    - id: m1
      from: c
      to: l
      label: 共识负责在关键处做裁决，不参与每一笔数据的快速读写
      active: true
    registers:
    - name: 识别信号
      value: 需求里出现「全局唯一」「只能有一个」「顺序不能乱」这些说法时，就是需要共识的信号
    - name: 纪律
      value: 要用已经成熟的共识实现，不要自己从零手写一个
  log:
  - mode: 落点
    event: 共识更像可以直接采用的现成地基，不需要每个项目都从零再做一遍
minutes: 30
prereq:
- distributed/cap-consistency
- network/tcp-handshake
objectives:
- 完整复述一轮 Raft 选举与一轮日志复制，指出各自的关键门槛
- 用多数派交集与选举限制，说明已提交日志永不丢失的理由
- 说清 Raft 与两将军问题的三处前提差异，以及非拜占庭假设的含义
- 举出共识在真实系统中的落点，并识别业务中「这里需要共识」的信号
aiLink: 大模型训练里也有裁决问题：哪张卡汇报的梯度算数、检查点以谁为准、坏卡摘除由谁宣布——这些控制面决定一旦双版本，整个训练任务就会分裂，所以集群调度器内部同样跑着共识。
design:
- mechanism: 为什么共识要「选主加复制日志」，而不是每条决定都全员表决
  problem: 根本约束是表决的成本与僵局随决定条数线性爆炸：每条命令都全员协商一次，通信轮次多、延迟高，还有意见分裂无人裁决的风险；而真实系统每秒要下成千上万个决定，逐个表决跑不起来
  choice: 做法是把共识摊销：只对「这一届由谁排序」表决一次，稳态时排序权委托给主，其余节点复制与确认即可。表决只剩两个廉价出场点——换届选举，与「回执过半即提交」的计数判定
  tradeoff: 代价是主成为任期内的热点与单点：吞吐受单台主的上限约束，主宕机带来一段选举空窗，主被慢盘或网络抖动拖累时整个集群跟着变慢
  root: 根本原因在成本上：让本来独立的几台机器形成共同认识，每做一次都要多轮通信，很贵。把很多个决定折叠成「先授权一次、后面多次执行」，能省下重复表决的成本，这和批量处理系统调用、把操作按顺序写进日志来省开销是同一种思路
- mechanism: 为什么提交门槛必须是严格过半，多一台少一台都不行
  problem: 根本约束有两头：门槛若是全体，任何一台故障都让系统停摆，可用性被最弱的成员绑架；门槛若低于半数，则可能存在两个互不相交的「达标集合」，各自提交互相冲突的决定，安全性当场破产
  choice: 做法是取严格过半：它同时是两个条件的唯一交点——既能容忍少数节点故障（可用性），又能保证任意两个达标集合必有交集（安全性）。奇数台部署划算也由此而来：偶数台多花一台却不涨容忍
  tradeoff: 代价在延迟分布上：每笔提交要等多数派里最慢的成员回执才算数，成员跨地域部署时，这个中位延迟会被最远的那一侧显著拉高
  root: 根本原因是一条纯集合论的算术事实：两个元素数都大于 n/2 的子集必然相交，比如 n 等于 5 时，任选 3 个再任选 3 个必然重叠。这条事实和机器、网络、时间都没有关系。Raft 的全部安全性，就是把复杂的工程问题一步步归结到这条算术事实上
- mechanism: 为什么 Raft 把「可理解性」当成头号设计目标，排在性能之前
  problem: 根本约束是分布式协议的正确性无法靠测试穷尽：消息时序、崩溃点、磁盘状态的组合是天文数字，前任主流协议 Paxos 正确但出了名的难懂，结果是各家实现理解不一、细节各异，协议越难懂，实现里藏的雷越多
  choice: 做法是主动为「人脑能完全装下它」优化协议：用任期把时间切段、用强主把稳态做成单向复制、用随机选举超时换取规则简化，宁可牺牲一些优雅与峰值性能，也要让每条规则都能被完整复述与逐条审计
  tradeoff: 代价是某些场景不如更灵活的协议变体：强主模型下主是吞吐瓶颈，多主或无主变体在特定负载下更有优势，Raft 等于主动放弃了这部分上限
  root: 根本原因是人的理解能力也是一种有限资源：协议最后要靠人来做设计评审、写实现、出故障时排查，人理解得越完整，实现里漏掉规则的可能性就越小。一个能被人完全理解的正确方案，比一个理论上更优、但没人能完全把握的方案更可靠
terminal:
- cmd: etcdctl member list（在装有 etcd 的环境里）
  note: 看一眼真实共识集群的成员与谁是 leader——那正是 Raft 在值班的地方；没有环境时读一遍 raft.github.io 的可视化演示亦可
