- id: election-round
  title: 走完一轮选举：从失联到新主上任
  tldr: 从节点等不到心跳，自己升任期、变候选人、给自己一票再四处拉票；过半数同意即当选，平票则随机错开后重选——随机在这里是解僵局的正经工具。
  body: '把一轮选举放慢看。主正常时，从节点靠周期心跳不断重置自己的选举计时器。某刻主宕机了，某个从节点的计时器先走完：它把当前任期加一（比如进入第 5 届），身份切换为候选人，先给自己投一票，然后向所有同伴发出拉票请求，每个请求都带着新任期号与自己的日志进度。

    同伴收到请求时按两条规则裁决：这一届我还没投过票，就有投票资格；再看候选人的日志是否至少和我的一样新（选举限制，后面讲它为何是安全关键），两条都满足才投赞成。候选人收到多数派赞成，当选新主，立刻广播一轮心跳宣告权威，从节点们认下新一届，计时器重置，集群恢复运转。反过来，若两个从节点同时超时、各自拉票，票源被瓜分，谁都凑不齐多数派，这叫平票（split vote）：这一届流产，所有人等各自的计时器再次走完后进入下一届重选。

    平票的解法是 Raft 里一处著名的「以随机治僵局」：每个节点的选举超时不是定值，而是在一个区间里随机取（比如 150 到 300 毫秒之间各掷一次）。随机化让「同时超时」成为小概率，某一轮大概率只有一名候选人率先起跑、干净当选。你在第一站见过重试要加抖动防同步，这里是同一味药：凡是多方可能齐步行动的地方，随机就是最便宜的错峰器。'
