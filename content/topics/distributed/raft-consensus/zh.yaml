    - name: 与 binlog 的关系
      value: 道理和 binlog 一样都是重放日志；区别是还要保证「由谁来定顺序」在出故障时也不会乱
  log:
  - mode: 收敛
    event: 这样，共识要解决的问题就变小了：从「同意所有状态」缩小到「同意一张命令的顺序表」
- id: leader-and-term
  title: 任期与主：先同意一个人，再由他排顺序
  tldr: 问题收敛成「同意一串日志的顺序」之后，这一步接着看 Raft 用什么办法把排序这件事组织起来，避免每条命令都全员投票。Raft 把时间切成一届一届的任期（term），就像第 1 届、第 2 届这样编号，每一届最多只能有一个主，平时状态稳定时由主一个人收命令、排顺序、再复制给其他机器，只有在换届选举时，才需要大家一起投票。
  body: |-
    如果每条命令都要全员投票，通信量与僵局都会爆炸。Raft 的做法是把「同意」摊销：先用一次选举同意「这一届由谁说了算」，之后这一届里的所有排序都委托给这个主（leader）。时间因此被切成一段段任期（term），每届有单调递增的编号（第 1 届、第 2 届……）：任何消息都带着任期号，收到比自己旧的任期的指令，一律当作已经过期的指令，不予理会。
    「每届至多一个主」由投票规则机械保证：每个节点一届里只投一票，候选人必须拿到多数派的票才算当选——一届里不可能凑出两个互不相交的多数派（地基在后面细说）。稳态随之简单：客户端只找主，主追加日志后往下复制，心跳周期性地发出去维系权威；从节点（follower）只做三件事：抄日志、回确认、发现主失联太久就发起下一届选举。这里有一个时间上的配合关系需要说清，心跳的发送间隔要明显短于选举超时，比如主每隔几十毫秒就发一次心跳，而从节点的选举超时是 150 到 300 毫秒这个量级，这样偶尔丢一两次心跳、或者网络抖动一下，从节点也不会误以为为主已经死了、急着发起一场没有必要的选举。
    代价是任期内主是热点，也是单点：主一倒下，集群要经历一段没有排序者的空窗，直到选出新主。空窗长短由选举超时决定，是可用性账上的一笔固定开支。
