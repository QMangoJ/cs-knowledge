bridge:
  prev: 上一站讲一致性时留了一类没解决的问题：像「现在谁是主」「这笔操作到底算不算数」这种裁决，不能接受几台机器各说一个差不多的答案。这一站讲共识，就是要让多台随时可能宕机的机器，最后商量出同一个决定，而且这个决定一旦定下就不能再推翻。
  next: 共识解决了「多台机器到底听谁的」，但还有两件相关的事没有讲清：一笔操作如果跨了好几台机器，怎么保证它要么全部成功、要么全部不算数；以及在没有一个大家都信得过的时钟时，几件事的先后顺序到底凭什么排。下一站就讲这两件事。
title: 共识与 Raft：任期、投票与一本共同的日志
summary: 共识要解决的是：多台机器怎样对同一串决定达成一致，而且决定一旦形成就不能推翻。Raft 把这件事拆成两部分——先选出一个主来排顺序，再把主排好的日志复制到其他机器。具体规则是：用任期保证每一届最多只有一个主；一条日志只有被多数派机器落盘保存后才算已提交；因为任意两个多数派必然有重叠的机器，已提交的日志就不会在换主时丢失。最后还会说明，Raft 和两将军问题的前提并不相同，不能混为一谈。
premise: 这一课要回答的问题是，几台随时可能宕机的机器，怎样才能对同一件事商量出同一个结果，而且这个结果定下来之后就再也不能被推翻。我们跟着一个很小的集群把全过程走一遍，这个集群只有三台机器，一台是主、两台是从，能容忍任意一台宕机。我们会依次看一次选举是怎么选出主的、一轮日志复制是怎么把一条命令变成正式决定的、主宕机之后改选又是怎么接上的，全程只盯住一个核心问题，已经提交的决定为什么丢不了。
position: 本课位于分布式系统本科的第三段「共识：让多台机器同意一件事」，接在一致性谱系之后：谱系管的是读能容忍多旧，而选主、提交判定这类裁决必须只有一个答案，本课就专治裁决。学完你能完整复述 Raft
  的一届任期如何产生、一条日志如何走到「已提交」、以及为什么任意两个多数派必有交集——比如 5 台里任选 3 台、再任选 3 台，必然有重叠的机器——是整套安全性最底层的数学依据。
overview:
- key: 一句话总结
  value: 比如「现在谁是主」这个问题，几台机器给出差不多的答案是不够的，必须只认同一个答案，而且这个答案定下后不能再改。共识要做的就是这件事，让一组机器最后只形成一个共同决定。Raft 用任期、投票和多数派这几条明确规则，把这件听起来很抽象的事，变成了一套可以照着执行的流程。
- key: 问题收敛
  value: 复制状态机的想法是，先不直接商量每一个状态，而是让大家先同意一串命令的顺序。比如三台机器都从同一个初始状态出发，依次执行同一串命令，因为顺序完全相同，它们最后的状态必然一致。这样难题就只剩一件，大家先共同同意这串命令日志的顺序，状态一致的问题就跟着解决了。
- key: 任期
  value: 任期是给时间分段的逻辑编号，就像第 1 届、第 2 届这样一届一届往下排。每一届最多只能有一个主，这一点靠投票规则保证，每个节点一届只投一票，拿到多数票的人才能当选。这样即使旧主没有及时退场，光看任期号也能判断出哪些指令已经过期了。
- key: 提交规则
  value: 一条日志要算已提交，必须先被多数派机器落盘保存，这是 Raft 判断一条命令算不算数的门槛。比如 3 台机器里有 2 台已经把一条日志落盘保存，这条日志才算已提交。一旦算作已提交，之后即使换了主，也不能再把它回滚掉，客户端收到的成功回复靠的就是这个承诺。
- key: 安全地基
  value: 任意两个多数派必然有重叠的机器，这是整套安全性最底层的集合论事实。比如 5 台里任选 3 台、再任选 3 台，至少有 1 台是共同的，因为 3 加 3 已经大于 5。所以已提交的条目必然保存在这个重叠里，后来当选的新主不可能完全没见过它，这正是旧账丢不了的原因。
- key: 容错边界
  value: N 台机器能容忍少于一半的节点崩溃，剩下的机器仍然要能凑齐多数派，系统才能继续工作。换成具体的数，5 台可以坏 2 台、3 台可以坏 1 台，剩下的机器仍能继续工作。如果发生网络分区，少数派那一侧凑不够多数，就只能停下来等待，这是 CAP 里选 C，也就是一致性优先，在 Raft 里的具体样子。
- key: 与两将军的界
  value: 两将军问题里只有两方、没有多数派可用，信使的消息还可以任意丢失，所以在那个前提下问题无解。Raft 换了前提，它有多台机器可以取多数派，假设节点只会崩溃不会伪造消息，也就是非拜占庭假设，并且多数派之间最终能互相连通。它解的不是原来那个无解的问题，而是这个前提更宽松、但在真实工程里确实存在的问题。
