id: distributed/time-and-transactions
subject: distributed
slug: time-and-transactions
order: 4
status: published
license: CC-BY-4.0
bridge:
  prev: 前面三节课分别讲了分布式难在哪里、数据可以容忍旧到什么程度、冲突时听谁的。这一课处理最后两个连在一起的问题：没有一台可信的时钟时，怎么判断两件事谁先谁后；一笔操作要同时改动多台机器时，怎么保证要么全部成功、要么全部不做。
  next: 分布式事务解决的是：一笔操作跨多台机器时，怎么让它们一起成功或一起失败。但大多数普通调用并不需要这么强的保证，它们更容易被流量高峰、延迟抖动和反复重试放大故障。下一课就讲这些普通调用怎么治理：先看能不能改成异步，再看失败时是谁在放大问题，并补上队列、限流、重试与治理。
title: 分布式事务与时间：用因果关系排顺序，用补偿代替强原子性
summary: 不同机器上的墙上时钟有误差，拿它给跨机器事件排顺序会排错，所以改用因果关系来排：Lamport 时钟用一个计数器给出不违背因果的顺序，向量时钟能进一步判断两个事件是因果相关还是互不相关的并发。跨机器的原子性可以用两阶段提交（2PC）实现，但协调者故障时会阻塞；现代系统通常先问能不能避免分布式事务，实在要跨机器，就用幂等、去重和补偿来兜底。
premise: 以一笔跨行转账为例（账户服务 A 扣款、服务 B 入账，两边必须一起成功或一起失败），前半课解决「谁先谁后」，后半课解决「要么全部成功、要么全部不做」。
position: 本课是分布式系统这一科的第四节，主题是「时间与跨机器事务」：前半讲的因果排序，是对第一节课「不能指望全局统一时钟」的回应；后半讲的 2PC 与补偿，是在数据分散到多台机器后，怎么保证原子性。学完前四节，你应该能审查任何分布式方案的前提：网络分区时选哪一边、谁有裁决权、顺序依据是什么、原子性由谁负责。
overview:
- key: 一句话总结
  value: 给事件排顺序时，不要信各机器墙上时钟的时间，要看事件之间的因果关系；保证原子性时，先想能不能让操作不跨机器，实在跨机器了，就用补偿动作把账补平
- key: 唯一可靠的顺序
  value: 因果关系：同一节点内先发生的在前，一次发送发生在它对应的接收之前——连不起来的两个事件就是并发，本来就没有先后之分
- key: Lamport 时钟
  value: 每台机器维护一个只增的计数器，用它给事件编号，编号尊重因果顺序；局限是只能保证不排反，不能仅凭编号大小断定两个事件一定有因果关系
- key: 向量时钟
  value: 每台机器都维护一份记录所有节点进度的计数表；比较两份表就能判断因果或并发，代价是这份表的大小会随节点数量增长
- key: 2PC
  value: 两阶段提交：协调者先让所有参与者投票并承诺自己能提交或能回滚，再统一宣布提交或回滚；如果协调者在宣布前宕机，参与者已经承诺了，只能锁住数据等待
- key: 退路全家桶
  value: 幂等（重复执行结果一样）、用请求号去重、补偿事务（Saga，用新动作抵消已做的动作）、最后用对账兜底——这些是现代系统更常用的做法
- key: 元原则
  value: 做分布式设计时先问：这件事能不能不做成分布式事务？很多跨机器难题，其实是数据被切分到不同机器上才产生的
