    event: 原子性从「事前锁死」换成「事后做平」，这是两种世界观的切换
- id: dont-distribute
  title: 落点：先问能不能不做分布式事务
  tldr: 大部分跨机原子性需求，是被数据的切分方式制造出来的：把必须同生共死的数据放回同一台机器、同一个库，分布式事务就地消失。
  body: '把本课的工具箱合上之前，先说全课最重要的一句：遇到跨机事务需求，第一反应不该是选 2PC 还是 Saga，而该是往回退一步，问这笔事务为什么跨了机。账户与它的流水必须同生共死，那就把它们放进同一个库、甚至同一张事务边界里——同生共死的数据，本来就该住在一起。订单与库存若能接受「先预占、后确认」的两步语义，跨机原子性就降级成普通的异步流程。绝大多数被称作分布式事务难题的东西，拆开看都是数据划分或流程设计阶段欠下的债，在事务协议层还，怎么还都贵。

    这不是逃避，而是本科四站走完之后应有的顺序感：难是物理给的（消息会迟到、同伴会装死、时钟各说各话），但难的剂量是设计选的——副本放多远、数据切多碎、强一致买多宽，每一笔都在第一站那张清单上标了价。成熟的分布式设计，一大半功夫花在「让问题变小」：把裁决收进共识组的小世界、把强一致收窄到最小数据集、把跨机事务尽量变回单机事务。

    本科到此收官。四站的回收是这样一条线：先认清世界（部分失败、不可区分、无全局时钟），再给容忍标价（一致性谱系），然后给裁决立规（共识与多数派），最后给顺序与原子结账（因果、2PC 与补偿）。回头再看任何一台你熟悉的系统——MySQL 的主从、边缘的 D1、跑在集群里的训练任务——你已经有了一套能把它们一一拆开的工具。'
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: coord
      id: c
      label: 设计者：先问能不能不跨机
      highlight: true
    - lane: a
      id: a
      label: 同生共死的数据：住回同一处
    - lane: b
      id: b
      label: 真要跨机的少数：再开工具箱
