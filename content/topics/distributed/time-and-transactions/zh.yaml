- id: two-pc
  title: 两阶段提交：先投票承诺，再统一宣布
  tldr: 协调者先问全员「能不能提交」，参与者把操作以可提交可回滚的形态落盘后投赞成票；全票通过，协调者才宣布提交，缺一票就宣布全体回滚。
  body: '两阶段提交（2PC，two-phase commit）把宣布权与执行权分开，分两段走。第一段是准备（prepare）：协调者向所有参与者广播「这笔事务你能不能提交」。参与者在本地把该做的修改以一种特殊形态完成并落盘——数据写进日志、锁加好、一切就绪但不对外生效——同时确认自己之后无论收到「提交」还是「回滚」的命令都有能力照办，然后回一票：能（yes）或不能（no，比如余额不足、约束冲突）。这一票投出去就不再是普通回答，而是一份承诺：投了能，之后就不许反悔、不许擅自行动。

    第二段是决定（commit/abort）：协调者收齐票，全是能，就把「提交」写入自己的日志后广播给所有人，参与者把已备好的修改正式生效、释放锁；只要有一张不能、或者有参与者迟迟不回票（超时按不能处理），协调者就宣布「回滚」，所有人撤销备好的修改。宣布以协调者的日志为准：决定一旦落盘，哪怕协调者宕机重启，也会照着日志把决定补发完毕。

    流程的美感在于承诺的对称性：准备段结束时，每个参与者都处于「进退皆可、唯命是从」的状态，最终方向只由一处宣布，所以不可能出现一半提交一半回滚。下一幕的痛也正藏在这份对称里：若协调者在宣布之前宕机，那批「唯命是从」的参与者，就要面对无命可从的空窗。'
  derivation: original
  sources:
  - ref: ddia
    locator: 第 9 章 Consistency and Consensus（Atomic Commit and Two-Phase Commit）
