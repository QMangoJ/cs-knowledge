steps:
- id: wallclock-fails
  title: 墙钟排顺序，先看它怎样悄悄翻车
  tldr: 拿时间戳决定「最后写入者胜」时，钟慢的那台的正当写入会被静默丢弃；多机日志按墙钟合并，顺序能排得面目全非——还都不报错。
  body: '第一站埋的雷在这里爆。设想两地副本都允许写同一条数据，冲突时按「时间戳大者胜」合并（最后写入者胜，last-write-wins，是很多系统的默认裁决）。A 地的钟慢了 5 秒：用户在 A 刚改的新值盖着较旧的时间戳，B 地五秒前的值反而时间戳更大——合并之后，新的被旧的盖掉，数据静默丢失，没有任何一处报错。钟是物理设备，它的误差不产生异常，只产生错误结果。

    日志与审计是另一处重灾区：事故复盘时把三台机器的日志按时间戳拼成一条时间线，看起来天衣无缝，实际上每条日志的横坐标都飘着各自的误差。用这种时间线推断「是 A 先超时还是 B 先崩溃」，结论可能整个反过来。监控大盘上那些跨机对齐的曲线，同样的问题只是藏在像素底下。

    结论不是「把钟校准些」——校准有下限，误差永远存在。结论是：排序这件事，从一开始就选错了尺子。可靠的那把尺子不量时间，量因果：谁导致了谁，这个关系不依赖任何物理设备，是信息流动本身的形状。下一幕把这把尺子立起来。'
  derivation: original
  canvas:
