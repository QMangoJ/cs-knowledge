steps:
- id: wallclock-fails
  title: 墙钟排顺序，先看它怎样悄悄翻车
  tldr: 如果用时间戳决定「最后写入的胜出」，钟慢的那台机器刚写入的新数据，会因为时间戳较小被当成旧数据静默丢掉；把多台机器的日志按墙上时钟合并，顺序也可能完全排错——而且这些错误都不会报错。
  body: >-
    第一节课提到的时钟问题，会在这里造成实际错误。两地副本都允许写同一条数据，冲突时按「时间戳大者胜」合并（最后写入者胜，last-write-wins）。A 地的钟慢了 5 秒：用户在 A 刚改的新值盖着较旧的时间戳，B
    地五秒前的值反而时间戳更大——合并之后，新的被旧的盖掉，数据静默丢失，没有任何一处报错。钟的误差不产生异常，只产生错误结果。

    日志与审计是另一处重灾区：把三台机器的日志按时间戳拼成一条时间线，看似天衣无缝，每条日志的横坐标却都飘着各自的误差。用它推断「是 A 先超时还是 B 先崩溃」，结论可能整个反过来。

    所以问题不在于「把时钟校得更准一点」——校准总有误差下限，误差永远存在。真正的问题是排序选错了标准：可靠的标准不看物理时间，看因果关系——哪个事件导致了哪个事件，这不依赖任何时钟设备，而是由信息实际怎么流动决定的。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: a
      id: a
      label: 服务 A：钟慢 5 秒，新写入的值时间戳更小，被误判为旧值
      highlight: true
    - lane: b
      id: b
      label: 服务 B：五秒前写入的旧值，时间戳反而更大
    messages:
    - id: m1
      from: a
      to: b
      label: 按最后写入者胜合并 → 新值输给旧值，被丢掉
      active: true
    registers:
    - name: 失败方式
      value: 新数据被静默丢弃，系统不报错
    - name: 病根
      value: 用物理时钟的时间，来裁决逻辑上的先后顺序
  log:
  - mode: 时钟
    event: 墙钟有误差时不会报错，只会给出看起来正确、实际错误的排序结果
- id: happens-before
  title: 唯一可靠的顺序是因果
  tldr: 因果顺序只靠两条关系定义：同一节点内先执行的在前、一次发送在它对应的接收之前；如果两个事件用这两条关系连不起来，它们就是并发——并发不是「不知道谁先」，而是「本来就没有先后，排不排序都不影响结果」。
  body: |-
    Lamport 在 1978 年给分布式排序换了地基：别问时钟，先问因果。一个事件先于（happens-before）另一个事件，只在三种情形下成立：它们在同一节点上、且一个执行在前；或者一个是发送、另一个是对应的接收；或者经由一串这样的关系传递可达。除此之外的两个事件，关系是并发（concurrent）——并发不是「不知道谁先」，而是更强的论断：它们之间没有信息流动，谁先谁后对任何结果都不产生影响，本就不需要排序。
    因果关系由程序执行与消息传递的事实构成，不依赖时钟精度，不随校时跳变而翻转。若真有因果，总能沿着「同节点顺序」与「发送到接收」这两类边一路走通；若走不通，它们就是真并发，强行排序只能是随意指定。
    接下来两幕是把因果做成可计算的盖章术：Lamport 时钟用一个计数给出尊重因果的全序，向量时钟用一张计数表回答「这两个事件到底有没有因果」。
  derivation: original
  sources:
  - ref: ddia
    locator: 第 8 章 The Trouble with Distributed Systems（happens-before 与因果关系）
    claim: 跨节点可靠的顺序概念是 happens-before（先行发生关系）：同节点先后与消息的发送—接收定义因果，不可比的事件即并发；墙上时钟无法给出这种关系
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: a
      id: a
      label: 服务 A：发出一条消息
    - lane: b
      id: b
      label: 服务 B：收到消息，所以接收事件排在发送之后
      highlight: true
    messages:
    - id: m1
      from: a
      to: b
      label: 发送发生在接收之前——这是因果关系的一条边
      active: true
    registers:
    - name: 两类边
      value: 同一节点内的先后 / 一次发送到它对应的接收
    - name: 并发
      value: 不是不知道谁先，是本来就没有先后之分
  log:
  - mode: 因果
    event: 排序标准从「时钟显示几点几分」换成「哪个事件导致了哪个事件」
- id: lamport
  title: Lamport 时钟：一个计数盖出尊重因果的序号
  tldr: 每台机器维护一个只增的计数器：本地有事件就加一，发消息时带上当前计数，收到消息时先把自己的计数抬到双方较大值再加一——这样，因果上在前的事件，计数一定更小。
  body: |-
    把因果变成数字，规则只有三条。每台机器维护一个计数器（逻辑时钟）。其一，本地每发生一个事件，先把计数加一，再把计数盖在事件上。其二，发送消息时，把当前计数随消息一起发出。其三，收到消息时，先把自己的计数抬到「自己的计数与消息带来的计数两者中的较大值」，再加一，然后继续。
    效果是：只要事件 X 因果上先于事件 Y，X 的计数必然小于 Y 的计数——因果链上的每一步都严格把计数往上推。于是按计数从小到大排，得到的顺序永远不会违逆任何一条因果链。给同值的事件再按节点编号打破平局，就得到一个完整的全序，可用于日志排序、版本裁决。
    局限方向相反：计数小不等于有因果。两个毫无关系的并发事件，计数也有大小之分，那纯属盖章的先后，不能反推因果——Lamport 时钟只提供单向保证：不违逆因果，但无法证明因果。想确切回答「这两份数据到底谁抄了谁」，需要下一幕的向量时钟。
  derivation: original
  sources:
  - ref: ddia
    locator: 第 8 章（逻辑时钟：Lamport 时间戳按因果排序事件）
    claim: Lamport 时间戳通过节点计数器与消息携带最大值加一的方式，保证因果在先的事件时间戳更小，从而给出尊重因果的事件顺序
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: a
      id: a
      label: A 的计数：本地事件记为 1、2，发消息时带上 2
    - lane: b
      id: b
      label: B 收到消息：先把计数抬到 2，再加一，所以从 3 开始记
      highlight: true
    messages:
    - id: m1
      from: a
      to: b
      label: 计数随消息一起传过去，因果顺序就被计数保留下来
      active: true
    registers:
    - name: 三条规则
      value: 本地事件加一 / 发送时带上计数 / 收到时取较大值再加一
    - name: 局限
      value: 能保证排序不违背因果，但不能仅凭计数证明两个事件有因果
  log:
  - mode: 逻辑时钟
    event: 逻辑时钟不测量真实时间，它记录的是因果链走到了多深
- id: vector
  title: 向量时钟：每个事件带一份「全员进度表」
  tldr: 把单个计数器换成每个节点一格的计数表：比较两个事件的表，就能确切判断谁因果在先、还是两者互不相关（并发）——副本系统判断「两个版本是不是各自改的」靠的就是它。
  body: |-
    向量时钟（vector clock）把盖章术升级一个维度：不再是一个总数，而是每台机器一张表，记着「据我所知，每个节点各推进到了第几步」。本地事件只增自己那一格；发消息时把整张表带上；收到消息时把两张表逐格取大、再增自己那格。邮戳携带的不是一个深度，而是事件的完整来历。
    比较两个事件的向量，结论是三值的，并且都是确切的：若向量甲逐格都不大于向量乙且至少一格更小，则甲因果在先；反之乙在先；若互有大小，则两者并发——没有任何一方的来历里包含对方。这正好补上 Lamport 时钟的盲区：它不能证明因果，向量时钟可以。
    它的用武之地在副本世界：同一数据的两个版本各带一个向量，一比就知是「新版取代旧版」（因果在后，直接覆盖）还是「两边在互不知情时各改了一次」（并发，产生冲突，需要合并或请用户裁决）——上一站因果一致的依赖追踪，落地就是它。代价是向量的大小随节点数量线性增长，节点上万时邮戳比信还长，所以它常驻在成员相对固定的副本系统里。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: a
      id: a
      label: 版本甲的向量时钟：[3, 1]
    - lane: b
      id: b
      label: 版本乙的向量时钟：[2, 2]
      highlight: true
    messages:
    - id: m1
      from: a
      to: b
      label: 两张表互有大小 → 两者并发，是各改各的
      active: true
    registers:
    - name: 判读
      value: 一张表逐格都不大于另一张，是因果在先；互有大小，是并发
    - name: 代价
      value: 表的大小随节点数量线性增长
  log:
  - mode: 向量时钟
    event: 判断冲突不再靠时间戳猜，而是看两个版本的来历（向量）来判定
- id: total-order
  title: 若非要一个全序：排序本身就是共识问题
  tldr: 如果业务非要一个全网统一的单一顺序，那就等价于让所有节点对同一份日志达成共识——绕一圈还是回到 Raft 这类共识；如果想直接用真实时间，就必须把时钟误差算清楚，并用等待来抵消它。
  body: |-
    并发事件本就无序，可业务有时偏偏要一个全序（比如全局唯一的流水号顺序）。先认清价码：让所有节点认同一个跨越全网的事件顺序，等于让所有人对「同一份日志」达成一致——这正是共识的定义。所以现实系统殊途同归：把排序权交给一个排序者（主节点或共识组的日志），其余事件按入日志的先后编号。上一站的 Raft 日志下标，就是全序的一种工业实现。
    另一条路是把真实时间做得可用：精确测出每台钟的误差上界，写入时主动等掉这个上界再盖时间戳——等完之后，全网的时间戳大小就与真实发生的先后严格吻合（以 Google Spanner 的 TrueTime 为代表）。它没有消灭误差，只是把误差从「藏在数据里翻车」变成「显式付在延迟上」。
    排序到这里闭环：墙钟不可信，因果是可靠的骨架，非要全序就付共识或等待的钱。下一幕换战场：一笔操作同时改两台机器的数据，原子性由谁来担保。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: coord
      id: c
      label: 排序者/共识日志：事件进入日志的顺序，就是全序
      highlight: true
    - lane: a
      id: a
      label: 各节点的事件：按进入日志的位置领取序号
    messages:
    - id: m1
      from: a
      to: c
      label: 全序不是自然发现的，是由排序者裁决出来的
      active: true
    registers:
    - name: 路线一
      value: 把排序权交给共识日志，按入日志顺序编号
    - name: 路线二
      value: 先测出时钟误差上界，写入时等掉这段时间再盖时间戳
  log:
  - mode: 全序
    event: 一旦需要全网统一的顺序，问题就变成了共识问题
- id: txn-problem
  title: 跨机事务登场：一笔转账的同生共死
  tldr: A 行扣 100 元、B 行加 100 元，必须一起成功或一起失败；数据在单台机器上时，事务能保证这一点，拆到两台机器上后，任何一边只做一半，都会直接造成资金错误。
  body: |-
    现在进入本科的最后一个问题。经典的跨行转账：从账户甲转一百元到账户乙，甲的账户存在服务 A 的机器上，乙的存在服务 B 的机器上。「A 扣、B 加」必须满足原子性：要么两个都生效，要么两个都不生效。若 A 扣完、B 宕机没加上，一百元凭空蒸发；若 B 先加上、A 没扣成，钱又凭空诞生。单机数据库里这不是问题——事务与预写日志把原子性做成了本职工作。
    跨机之后，本职保障消失了：A 与 B 各有自己的本地事务，各自能保证自家账的原子，却没有任何一方能单独保证「两笔本地事务同生共死」。它们之间只剩消息，而消息会迟到、发消息的人会宕机。原子性的担保人必须由协议临时搭建：找一个协调者主持全程，让参与者在动手之前先彼此承诺——这就是两阶段提交。
    接下来所有方案（2PC、补偿、幂等）都是同一道题的不同价位：为「同生共死」付多少可用性、延迟与业务复杂度。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: a
      id: a
      label: 服务 A：甲账户扣 100
    - lane: b
      id: b
      label: 服务 B：乙账户加 100
      highlight: true
    - lane: coord
      id: c
      label: 担保人缺位：没有谁能单独保证两边一起成功或一起失败
    messages:
    - id: m1
      from: a
      to: b
      label: 只成功一半 = 资金事故（钱蒸发或凭空多出）
      active: true
    registers:
    - name: 要求
      value: 两边一起成功，或两边一起失败
    - name: 难点
      value: 每台机器只能保证自己那一半的原子性
  log:
  - mode: 问题
    event: 跨机器原子性的担保人，只能由协议临时搭建出来（比如找一个协调者）
- id: two-pc
  title: 两阶段提交：先投票承诺，再统一宣布
  tldr: 协调者先问所有参与者「你能不能提交」，参与者把修改准备到可提交也可回滚的状态并落盘后，投赞成票并承诺不反悔；所有人都赞成，协调者才宣布提交，只要有一票反对或超时，就宣布全体回滚。
  body: |-
    两阶段提交（2PC，two-phase commit）把宣布权与执行权分开。第一段是准备（prepare）：协调者向所有参与者广播「这笔事务你能不能提交」。参与者在本地把修改以特殊形态完成并落盘——数据写进日志、锁加好、一切就绪但不对外生效——同时确认自己之后无论收到「提交」还是「回滚」都有能力照办，然后回一票：能（yes）或不能（no，比如余额不足、约束冲突）。这一票是承诺：投了能，之后就不许反悔、不许擅自行动。
    第二段是决定（commit/abort）：协调者收齐票，全是能，就把「提交」写入自己的日志后广播，参与者把备好的修改正式生效、释放锁；只要有一张不能、或者有参与者迟迟不回票（超时按不能处理），就宣布「回滚」，所有人撤销备好的修改。宣布以协调者的日志为准：决定一旦落盘，哪怕协调者宕机重启，也会照着日志把决定补发完毕。
    准备段结束时，每个参与者都处于「进退皆可、唯命是从」的状态，最终方向只由一处宣布，所以不可能出现一半提交一半回滚。下一幕的痛也正藏在这里：若协调者在宣布之前宕机，那批参与者就要面对无命可从的空窗。
  derivation: original
  sources:
  - ref: ddia
    locator: 第 9 章 Consistency and Consensus（Atomic Commit and Two-Phase Commit）
    claim: 两阶段提交由协调者分两段执行：准备阶段参与者承诺可提交或可回滚；协调者根据全票与否决定提交或中止，并把决定记录在案后通知所有参与者
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
