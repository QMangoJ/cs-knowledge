steps:
  - id: wallclock-fails
    title: 墙钟慢 300 毫秒静默吞新账：物理时间戳当不了跨机裁判
    tldr: 服务 A 的石英钟慢了 300 毫秒时，按「最后写入者胜（LWW）」合并副本会把刚写入的新数据当成旧垃圾悄悄覆盖，全程零报错；物理校时永远存在误差下限，必须换掉排序标准。
    body: |-
      拿各台服务器自己的系统时间戳去裁决跨机新旧，是最隐蔽的线上丢数据杀手。假设双写存储采用看似合理的「最后写入者胜」（Last-Write-Wins，谁时间戳大留谁）：服务 B 在 200 毫秒前写入了旧状态，而服务 A 的石英钟恰好慢了 **300 毫秒**——用户此刻在 A 提交最新修改，盖上的时间戳反而比 B 的旧值还早 100 毫秒！等两边同步合并时，系统一声报错都不出，直接拿旧值把刚写进去的新值静默抹掉了。

      排查线上事故拼日志时也是同款灾难：把 A、B、协调者三台机器的日志按本地时间戳排成一张表，几百毫秒的钟差足以让你得出「B 先入账、A 后扣款」或者「先报超时、后发请求」的荒唐倒果为因结论。

      别指望靠加密集的网络校时（NTP）根治它——只要走公网或机房交换机校时，几毫秒到几十毫秒的不确定窗口永远抹不掉。病根不在钟不够贵，而在**拿带误差的物理时刻去回答一个信息依赖问题**：跨机真正可靠的先后，只看谁触发了谁。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: a
          id: a
          label: 服务 A：钟慢 300 毫秒，新写入的值时间戳更小，被误判为旧值
          highlight: true
        - lane: b
          id: b
          label: 服务 B：200 毫秒前写入的旧值，时间戳反而更大
      messages:
        - id: m1
          from: a
          to: b
          label: 两边按最后写入者胜的规则合并时，新值因为时间戳更小输给了旧值，就这样被丢掉了
          active: true
      registers:
        - name: 失败方式
          value: 新写入的数据被当成旧数据静默丢弃了，整个过程系统不会报任何错误
        - name: 病根
          value: 问题出在拿物理时钟显示的时间，去裁决逻辑上谁先谁后，这两件事本来就不是一回事
    log:
      - mode: 时钟
        event: 墙钟有误差时不会报错，只会给出看起来正确、实际错误的排序结果
  - id: happens-before
    title: 1978 年换掉排序地基：只认「同机先后」与「先发后收」的因果链
    tldr: Leslie Lamport 定义的先行发生关系（happens-before）彻底甩开了石英钟：只有同节点一前一后、或跨节点一发一收能连起来的事件才有因果先后，连不上的就是真并发。
    body: |-
      1978 年 Leslie Lamport 发表分布式开山论文，一句话给排序换了地基：**别看墙上几点几分，只看信息有没有传过去。** 他定义的「先行发生关系」（happens-before，记作 `→`）只认三条硬事实：① 同一台机器上，先执行的指令排在后执行的指令前；② 跨机器通信时，A 发出消息必然排在 B 收到同一条消息前；③ 顺着这两类箭头一路传递能走通的，也算在先（如 A 扣款 → A 发信 → B 收信 → B 入账）。

      要是两个事件顺着这两类箭头怎么都连不上呢？比如东京的甲改了密码，同一秒法兰克福的乙改了昵称，中间没有任何消息往来——它们的关系叫**并发**（concurrent）。注意，并发绝不是「时钟不够准、暂时没查清谁先」，而是铁板钉钉的物理结论：**两边压根没有信息流动，谁排前面都不影响对方结果，本来就不存在先后。**

      这个定义之所以坚不可摧，是因为它只依赖程序执行和收发数据包这两个板上钉钉的动作，无论机房石英钟快一小时还是倒退五分钟，因果箭头一根都不会歪。
    derivation: original
    sources:
      - ref: ddia
        locator: 第 8 章 The Trouble with Distributed Systems（happens-before 与因果关系）
        claim: 跨节点可靠的顺序概念是 happens-before（先行发生关系）：同节点先后与消息的发送—接收定义因果，不可比的事件即并发；墙上时钟无法给出这种关系
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
    canvas:
      kind: swimlane
      actors:
        - lane: a
          id: a
          label: 服务 A：发出一条消息
        - lane: b
          id: b
          label: 服务 B：收到消息，所以接收事件排在发送之后
          highlight: true
      messages:
        - id: m1
          from: a
          to: b
          label: 发送发生在接收之前——这是因果关系的一条边
          active: true
      registers:
        - name: 两类边
          value: 因果关系只看两类边，一类是同一台机器内部的先后顺序，另一类是一次发送到它对应的那次接收
        - name: 并发
          value: 并发的意思不是暂时不知道谁先谁后，而是这两个事件本来就没有先后之分
    log:
      - mode: 因果
        event: 排序标准从「时钟显示几点几分」换成「哪个事件导致了哪个事件」
  - id: lamport
    title: Lamport 逻辑时钟：信封上贴计数，收信取 max 加 1
    tldr: 每台机器维护一个递增整数，发信时把计数贴在信封上，收信时把本地计数顶到 max(本地, 信封) + 1；但若两台机器从不通信，计数大小纯属巧合，绝不能拿来反推因果。
    body: |-
      把抽象的因果箭头变成代码里一个 `uint64` 整数，就是 **Lamport 逻辑时钟**，规则简单到像往信封上贴邮戳：每台机器揣一个初始为 0 的计数器；本地每干一件事计数 `+1`；往外发消息时把当前计数贴在信封上带走；收到消息时，**先把本地计数顶到 `max(本地计数, 信封计数) + 1`**。拿数字走一遍：服务 A 连做两步（准备、扣款），计数走到 `1`、`2`，随后把 `2` 贴在转账消息上发给 B；此时 B 本地刚干过一件事，计数才停在 `1`，拆信一看信封上是 `2`，立刻算出 `max(1, 2) + 1 = 3` 盖在收信入账事件上——`2 < 3`，发信在前、收信在后的因果铁律稳稳刻进了数字里！

      但读到这里你肯定会冒出一个刁钻反问：**「慢着！要是服务 A 和服务 B 从头到尾压根没发过一条消息，Lamport 时钟凭什么给它们排先后？」** 问到命门上了——**它根本排不出真因果！** 假设 A 闲着只干了 2 件事（计数 `2`），完全不相干的 B 忙着干了 5 件事（计数 `5`）；单看数字 `2 < 5`，可 A 和 B 之间半毛钱关系都没有。

      这就是必须死死记住的**单向保证**：如果 A 因果先于 B，计数一定满足 `L(A) < L(B)`（绝不把因果排反）；但反过来看到 `L(A) < L(B)`，**绝不能断定 A 导致了 B**，俩人完全可能是互不相识的并发路人。想一眼看穿俩事件到底有没有血缘关系，得请出升级版的全员进度表。
    derivation: original
    sources:
      - ref: ddia
        locator: 第 8 章（逻辑时钟：Lamport 时间戳按因果排序事件）
        claim: Lamport 时间戳通过节点计数器与消息携带最大值加一的方式，保证因果在先的事件时间戳更小，从而给出尊重因果的事件顺序
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
    canvas:
      kind: swimlane
      actors:
        - lane: a
          id: a
          label: A 的计数：本地事件记为 1、2，发消息时带上 2
        - lane: b
          id: b
          label: B 收到消息：先把计数抬到 2，再加一，所以从 3 开始记
          highlight: true
      messages:
        - id: m1
          from: a
          to: b
          label: 计数随消息一起传过去，因果顺序就被计数保留下来
          active: true
      registers:
        - name: 三条规则
          value: 三条规则连起来是，本地发生事件时计数加一，发送消息时把当前计数一起带上，收到消息时先取双方里更大的计数再加一
        - name: 局限
          value: 它能保证排出来的顺序不违背因果，但不能只看计数大小就证明两个事件之间一定有因果关系
    log:
      - mode: 逻辑时钟
        event: 逻辑时钟不测量真实时间，它记录的是因果链走到了多深
  - id: vector
    title: 向量时钟：随信附带「全员进度表」，一眼揪出并发双写冲突
    tldr: 向量时钟把单个计数扩成每人一格的进度数组；拿 [3, 1] 和 [2, 2] 逐格一比互有高低，当场就能铁板判定两份数据是互不知情的并发冲突。
    body: |-
      为了补上 Lamport 时钟分不清「真有因果」和「纯属巧合」的盲区，1988 年 Fidge 与 Mattern 提出了**向量时钟**（Vector Clock）：信封上不再贴孤零零一个整数，而是贴一张**全员进度表**（数组里每个节点占一格）。本地干活只给自己那一格 `+1`；发信带走整张表；收信时把本地表和信封表**逐格取最大值**，再给自己那格 `+1`。

      判读规则干脆利落：若表甲每一格都不大于表乙（如 `[2, 1]` 对比 `[3, 2]`），说明乙完整继承了甲的全部历史，甲铁定是乙的前因；**若两张表互有高低，则铁定是并发冲突！** 拿数字验一把：同一份购物车在节点 A 改出版本甲 `[3, 1]`，同时在节点 B 改出版本乙 `[2, 2]`——看第 1 格甲大（`3 > 2`），看第 2 格乙大（`1 < 2`），说明谁都没见过对方最新那一下修改，两边是在断联或并发时各改各的！

      早年 Amazon Dynamo 购物车和 Riak 数据库正是拿向量时钟在数据对象头上盖章（很像前端接口里升级成数组形态的 `ETag` 版本号）：一旦抓出 `[3, 1]` 与 `[2, 2]` 互有高低，就触发第 2 课讲过的并集合并而不乱盖数据。它的唯一软肋是空间账：10 台机器的表只有 10 个整数，要是客户端节点涨到十万个，光信封上的进度表就比正文还沉，所以多用于副本数固定的存储集群内部。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: a
          id: a
          label: 版本甲带着的向量时钟是 [3, 1]，记着它所知道的各节点走到了哪一步
        - lane: b
          id: b
          label: 版本乙带着的向量时钟是 [2, 2]，记着它所知道的各节点走到了哪一步
          highlight: true
      messages:
        - id: m1
          from: a
          to: b
          label: 两张表互有大小 → 两者并发，是各改各的
          active: true
      registers:
        - name: 判读
          value: 如果一张表的每一格都不大于另一张，说明它在因果上更靠前，如果两张表互有大小，说明两个事件是并发的
        - name: 代价
          value: 这张表的大小会随着节点数量增加而线性变长，节点越多，这张表就越长
    log:
      - mode: 向量时钟
        event: 判断冲突不再靠时间戳猜，而是看两个版本的来历（向量）来判定
  - id: total-order
    title: 硬要全网唯一全序只有两条路：上 Raft 排队，或像 Spanner 装原子钟硬等 7 毫秒
    tldr: 并发事件天然无序，若业务硬要全网唯一流水顺序，要么交给 [[Raft]] 主节点排成一根日志，要么像 [[Google Spanner]] 那样架设原子钟与 GPS 把钟差锁进 7 毫秒，每笔写入硬憋满 7 毫秒再放行。
    body: |-
      向量时钟会把并发事件诚实地标成「平级无先后」，可银行总账偏偏要求全网所有交易排成唯一一条单列流水号——想在没有共享内存的多机间强行排出唯一全序，全世界只有两条路可走。第一条是平民路：**请出上一课的共识协议**，把所有需要排队的请求塞进同一个 Raft 日志组，按入日志的下标领号——全序说穿了就是共识的同义词。

      第二条是钞能力路：2012 年公开的全球数据库 **Google Spanner** 祭出了 **[[TrueTime]]**。Google 直接在自家机房楼顶架起 GPS 天线、机柜里塞进昂贵的铷原子钟，外加跨洋私有海底光缆，硬把全球服务器的物理时钟误差上限 `ε` 死死摁在 **7 毫秒以内**；紧接着每笔事务盖完时间戳准备提交时，服务器故意原地**憋满这 7 毫秒**（commit-wait）才对外宣布成功！

      为什么干等 7 毫秒就能逆天改命？因为哪怕你的钟是全网最快、下一位读者的钟是全网最慢，你俩撑死也就差 7 毫秒；等你原地坐满 7 毫秒再出门，全宇宙最慢的那块表也已经跨过了你刚才盖章的数字，物理时间戳的大小从此和真实先后严丝合缝。你看，哪怕强如 Google 也没消灭物理误差，只是靠钞能力把误差压到 7 毫秒，再用真金白银的写延迟把它买断了。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: coord
          id: c
          label: 排序者或者共识日志负责定顺序，事件进入日志的先后顺序，就是最后定下来的全序
          highlight: true
        - lane: a
          id: a
          label: 各个节点的事件，都按自己进入日志的位置来领取序号
      messages:
        - id: m1
          from: a
          to: c
          label: 全序不是自然发现的，是由排序者裁决出来的
          active: true
      registers:
        - name: 路线一
          value: 第一条路线是把排序权交给共识日志，所有事件按进入日志的先后顺序来编号
        - name: 路线二
          value: 第二条路线是先测出时钟误差的上限，写入时先等掉这段时间，再盖上时间戳
    log:
      - mode: 全序
        event: 一旦需要全网统一的顺序，问题就变成了共识问题
  - id: txn-problem
    title: 跨行转账拆上两台机器后，本地事务再也保不住「同生共死」
    tldr: 跨行转账要求账户甲扣 100 元、账户乙加 100 元要么同时生效、要么同时作废；拆到两台机器后各自只有本地事务，谁也没法单靠自己担保两边同生共死，必须靠跨机协议临时搭出担保人。
    body: |-
      回到开头那笔跨行转账：账户甲在服务 A 的机器上扣 100 元，账户乙在服务 B 的机器上加 100 元。「A 扣 100、B 加 100」必须满足原子性——要么两边都落账，要么两边都当没发生过。要是 A 扣完钱、B 宕机没加上，100 元就凭空蒸发；反过来 B 先加上、A 余额不足没扣成，账上又凭空多出 100 元。单机数据库里这根本不算难题，本地事务配预写日志（[[WAL]]）本来就把原子性做成了看家本领。

      一旦拆上两台机器，看家本领就管不到对岸了：A 和 B 各自的本地事务只能管好自家那一亩三分地，谁也没法隔着随时会丢包、迟到、断连的网络替对方打包票。想让两笔本地事务绑成一根绳上的蚂蚱，只能在两台机器外头用协议临时搭出一个担保人——找一位协调者主持大局，让参与者在真正拍板前先各自锁好账本、立下字据。后面所有跨机事务方案（两阶段提交、[[Saga]] 补偿、[[幂等]]去重），本质上都是在给「同生共死」报不同的价：你愿意拿多少可用性、吞吐和业务复杂度去买这份担保？
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: a
          id: a
          label: 服务 A：甲账户扣 100
        - lane: b
          id: b
          label: 服务 B：乙账户加 100
          highlight: true
        - lane: coord
          id: c
          label: 担保人缺位：没有谁能单独保证两边一起成功或一起失败
      messages:
        - id: m1
          from: a
          to: b
          label: 只成功一半 = 资金事故（钱蒸发或凭空多出）
          active: true
      registers:
        - name: 要求
          value: 这笔转账的要求是两边要么一起成功，要么一起失败，不能只成功一半
        - name: 难点
          value: 难点在于每台机器只能保证自己那一半操作的原子性，没有谁能单独保证两边绑在一起
    log:
      - mode: 问题
        event: 跨机器原子性的担保人，只能由协议临时搭建出来（比如找一个协调者）
  - id: two-pc
    title: 两阶段提交先让全员锁账立誓，再由协调者一锤定音
    tldr: 两阶段提交（2PC）把执行与拍板拆成两步：准备段所有参与者把修改写进日志并加锁就绪，投出不可反悔的赞成票；决定段只有全员赞成协调者才落盘宣布提交，但凡有一票反对或超时就宣布全体回滚。
    body: |-
      两阶段提交（2PC，two-phase commit，1978 年由 Jim Gray 在数据库恢复体系中定型，常见形态是内嵌在数据库驱动与事务管理器里的 [[XA 事务]]协议）把「准备就绪」与「正式拍板」拆成两段。第一段叫准备（prepare）：协调者向服务 A、服务 B 广播「这笔甲扣 100、乙加 100 你能不能提交？」。A 和 B 各自在本地把账算好、数据写进磁盘日志、行锁死死攥在手里，只差最后一步对外生效；确认自己接下来无论收到「提交」还是「回滚」都能照办后，才郑重回一票「能（yes）」，余额不够或写盘失败就回「不能（no）」。注意，这张赞成票是一份铁契：一旦投出「能」，参与者就绝不许反悔，也不许自己偷偷提交或放锁。

      第二段叫决定（commit / abort）：协调者收齐选票，只有全票都是「能」，才把「提交」二字写进自己的持久化日志，随后向全员广播提交，A 和 B 把备好的账目正式生效并放锁；只要有一张反对票，或者谁迟迟不回话（超时一律按反对算），协调者就落盘记录「回滚」并通知全员撤销修改、释放行锁。最终裁决只认协调者日志里写下的那一行——哪怕协调者刚写完盘就断电，重启后照着日志补发通知，结局也绝不会劈叉。

      你看它的精妙之处：准备段结束那一刻，每个参与者都站在「进退皆可、唯命是从」的起跑线上，而发令枪全网只有协调者手里一把，所以绝不可能闹出 A 提交了、B 却回滚了的半截账。可隐患也恰恰埋在这张铁契里——万一全员刚立完誓，手握发令枪的协调者当场倒地不起呢？
    derivation: original
    sources:
      - ref: ddia
        locator: 第 9 章 Consistency and Consensus（Atomic Commit and Two-Phase Commit）
        claim: 两阶段提交由协调者分两段执行：准备阶段参与者承诺可提交或可回滚；协调者根据全票与否决定提交或中止，并把决定记录在案后通知所有参与者
        status: verified
        checkedBy: Muse 核查
        checkedAt: 2026-11-07
    canvas:
      kind: swimlane
      actors:
        - lane: coord
          id: c
          label: 协调者：收集投票、把决定写进日志、再宣布
          highlight: true
        - lane: a
          id: a
          label: A：准备好修改，回复「能」
        - lane: b
          id: b
          label: B：准备好修改，回复「能」
      messages:
        - id: m1
          from: c
          to: a
          label: 先让所有人承诺，再统一宣布提交或回滚
          active: true
      registers:
        - name: 第一段
          value: 第一段里投票就是承诺，参与者要先把自己准备到既能提交、也能回滚的状态，再把票投出去
        - name: 第二段
          value: 第二段里只有全员都赞成时才宣布提交，只要有一票反对或者有人超时没有回票，就宣布全体回滚
    log:
      - mode: 2PC
        event: 原子性靠两件事搭出来：所有参与者事先承诺，加上协调者一处统一宣布
  - id: two-pc-pain
    title: 协调者倒在宣布前夕，参与者就只能抱着行锁无限干等
    tldr: 参与者一旦投出赞成票就交出了自主权，若协调者在宣布决定前宕机，参与者既不敢擅自提交也不敢擅自回滚，只能攥着锁死等；加上整笔事务可用性等于各方可用性连乘，2PC 基本被困在同机房受控数据库内。
    body: |-
      顺着最要命的时机往下推：A 和 B 都锁好了那 100 元账户、投出了「能」，协调者刚收齐选票、还没来得及发出最终决定就断电宕机了。这时 A 和 B 进退维谷：能自己拍板提交吗？绝对不行——万一刚才 B 其实投了反对票、协调者死前已经决定回滚，A 擅自扣钱就铸成大错；那能自己放锁回滚吗？也不行——万一协调者死前已经把「提交」写进了日志、甚至已经通知了另一方，这边擅自回滚照样平不了账。唯一合法的动作就是原地死等协调者复活查日志，在此期间被锁住的账户谁也读写不了，后续请求排成长龙——这就是 2PC 甩不掉的阻塞（blocking）顽疾。

      再算一笔可用性总账：2PC 里协调者加全体参与者是串联关系，任何一环掉链子，整笔事务要么中止、要么抱锁卡死。假设协调者与 A、B 各自的可用性都是 `99.9%`，三者连乘 `0.999³ ≈ 99.7%`，故障率直接翻了三倍；参与节点越多，连乘出来的可用性掉得越狠，而且每次还得顶着多轮网络往返延迟攥住数据库行锁，高并发下热点账户吞吐当场塌方。更现实的是，跨机构转账时对方银行根本不可能让你的协调者长时间锁住人家的库表。因此 2PC 的领地始终被困在「同一管理域、底层全是受控关系库」的 [[XA 事务]]场景里。

      你可能会问：既然痛在协调者单点宕机，给协调者配上一课的 [[Raft]] 共识组做高可用不就根治了吗？工业界确实这么补强——把协调者的决定日志写进共识组，一台倒下秒切新主继续宣布，能把阻塞窗口压到极窄；但在异步网络里，只要还隔着不可靠的通信链路，「承诺已出口、裁决未送达」的空窗就只能尽量压小，在原理上永远无法彻底清零。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: coord
          id: c
          label: 协调者：收齐票后、宣布之前宕机
        - lane: a
          id: a
          label: A：已承诺，只能抱着锁等待宣布
          highlight: true
        - lane: b
          id: b
          label: B：同上，既不能提交也不能回滚
      messages:
        - id: m1
          from: a
          to: c
          label: 不能自己提交，也不能自己回滚，只能等
          active: true
      registers:
        - name: 病灶
          value: 问题出在宣布决定的协调者是单点，而参与者一旦投了票，这个承诺就不能撤销了
        - name: 标准补强
          value: 常见的补强办法是把协调者的决定放进共识组来做高可用，这样只能把阻塞的时间窗口缩小，没有办法完全消除
    log:
      - mode: 阻塞
        event: 2PC 能用在什么范围，是由它的可用性决定的：任何一环故障，整笔事务都会卡住或中止
  - id: alternatives
    title: Saga 用逆序补偿把账事后做平，靠幂等与去重兜住重试
    tldr: 现代跨服务系统大多放弃跨机长锁，改用 Saga 把大事务拆成一串独立提交的本地事务，失败时逆序执行退款、退票等语义补偿；底下靠业务单号去重与接口幂等兜底，把「至少投递一次」拼成效果上的「恰好执行一次」。
    body: |-
      既然事前锁死代价太重，互联网微服务干脆换了一条活法：不跨机加锁、不等全员投票，每一步先各自提交，搞砸了再事后把账抹平——代表模式就是 [[Saga]]（1987 年由 Hector Garcia-Molina 与 Kenneth Salem 最初为长耗时数据库事务提出，如今常以 Temporal、Seata 这类编排引擎，或业务库里的「状态表 + 本地消息表」落地）。比如订机票、订酒店、扣房费拆成三笔独立本地事务，每做完一步立刻提交放锁，同时登记好对应的反悔动作（退票、取消预订、原路退款）；万一第三步扣款失败，编排方就倒着触发取消酒店和退机票，让业务回到等价的起点。注意补偿是「语义回滚」而非物理擦除：退款会在账本上新增一条退款流水，而不是把原先那条扣款记录偷偷抹掉。

      整套事后补平能转起来，底下全靠第一课留下的两块基石撑腰。第一块是去重：异步消息和超时重试天然会重复送达，消费方必须按唯一业务单号（同构于前端表单防连点的提交 Token）查去重表，认出「这笔单号我已经办过了」；第二块是[[幂等]]：同一个扣款或退款接口哪怕被重放三遍，也只生效第一遍、后续直接返回上次结果。这两块地基打牢，就能用廉价的「至少一次投递 + 幂等去重消费」，在业务效果上拼出昂贵的「恰好执行一次」。

      拿它换走 2PC 的长锁与阻塞，也得认账领走两样新麻烦：一是隔离性当场没了——机票刚订妥、酒店还没订上的几秒钟里，用户刷新页面会看到半成品状态，前端和产品流程必须专门设计「处理中」提示；二是有些动作天生覆水难收（发出去的短信撤不回），而且补偿动作自己也可能失败，所以生产系统最后一定还挂着定时重试与每日对账兜底。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: coord
          id: c
          label: 编排方：记录每一步做了什么、对应的补偿是什么
        - lane: a
          id: a
          label: A：执行本地事务，带业务单号以便去重
        - lane: b
          id: b
          label: B：失败发生在这里，于是启动逆序补偿
          highlight: true
      messages:
        - id: m1
          from: c
          to: b
          label: 退款、退票：用一个新的动作，抵消已经做过的动作
          active: true
      registers:
        - name: 地基
          value: 这条路的地基有两块，一块是幂等，也就是同一个操作重复执行也不会重复产生效果，另一块是用请求号去重，认出已经处理过的消息
        - name: 代价
          value: 代价是中间状态会对外被看见，而且补偿本身如果也失败了，还要靠重试和人工对账来兜底
    log:
      - mode: 补偿
        event: 原子性从「事前锁死」换成「事后做平」：不再锁住等投票，而是先执行、失败再补偿
  - id: dont-distribute
    title: 最好的分布式事务就是别跨机：先合库改流程，万不得已再选协议
    tldr: 碰上跨机原子性诉求，第一步不是挑 2PC 还是 Saga，而是回头审视数据切分与业务流程——把同生共死的数据合回同一个库，或把同步强绑定改成「预占 + 确认」，绝大多数分布式事务难题当场就能消解。
    body: |-
      工具箱看全了，收官却要先泼一盆最省钱的冷水：碰到跨机事务需求，第一反应绝不该是在 2PC 和 [[Saga]] 之间二选一，而是退后一步反问——这笔账为什么非跨机器不可？如果账户余额和账户流水天生必须同生共死，那就把它们放回同一个库、同一个分片边界里，单机事务一毫秒搞定；如果下单和扣库存能改成「先锁预占额度、支付成功再异步确认」的两步业务语义，硬邦邦的跨机原子性当场就化成了普通消息流。线上十桩分布式事务血泪史，八桩都是早期拆库太碎欠下的架构债，放到事务协议层去还，选哪条路都肉疼。

      以后真遇上跨服务写操作，直接按「跨机事务选型三问」拍板：① 能不能把同生共死的表合回同库同分片，或者把业务改成异步预占？（能就改设计，直接绕开分布式事务）；② 不能合库时，参与方是不是都在同一机房、全是受控关系库且并发不高？（是才考虑 [[XA 事务]] / 2PC）；③ 跨微服务、跨组织或高并发链路？（老老实实用 [[Saga]] 补偿 + 唯一单号去重 + [[幂等]]接口 + 定时对账）。

      到这一步，前四站的硬核主干就严丝合缝扣上了环：先认清物理底牌（部分失败、超时与宕机不可区分、无全局时钟），再给不一致标出明码实价（[[CAP]] 与读写一致性谱系），接着用多数派与任期立下唯一裁决规矩（[[Raft]] 共识日志），最后结清跨机事件的因果顺序与原子账本（逻辑时钟、2PC 与 [[Saga]]）。记住收官口诀：**墙钟排先后必翻车，因果靠计数或向量，全局定全序找共识，跨机事务先合库、真拆就靠幂等与补偿**。回头再看 [[MySQL]] 主从、边缘 [[D1]] 或跨卡大模型检查点，底牌已经在你手里了。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: coord
          id: c
          label: 设计者：先问这笔事务能不能不跨机器
          highlight: true
        - lane: a
          id: a
          label: 必须一起成功或失败的数据：放回同一台机器、同一个库
        - lane: b
          id: b
          label: 真正必须跨机器的少数情况：再打开 2PC / Saga 工具箱
      messages:
        - id: m1
          from: c
          to: a
          label: 先让问题变小，再考虑怎么把剩下的问题解好
          active: true
      registers:
        - name: 全科主线
          value: 全科的主线是先认清部分失败，再给一致性标价，然后用共识立裁决规则，最后再处理顺序和原子性
        - name: 纪律
          value: 分布式事务是最后才选的方案，不是默认方案
    log:
      - mode: 收官
        event: 四节课的骨架到此闭环：清单上的每一行问题，后面都有一套对应的应对方法
minutes: 28
prereq:
  - distributed/raft-consensus
objectives:
  - 说清物理墙上时钟给跨机事件排先后为何静默翻车，以及「发信先于收信」为何是唯一可靠的因果锚点
  - 推演 Lamport 时钟三条规则与单向局限，并用向量时钟逐位比较区分因果先后与真正并发
  - 走通两阶段提交（2PC）的准备与决定全流程，算出串联可用性并指出协调者宕机阻塞的病灶
  - 按「跨机事务选型三问」在合库改流程、2PC 与 Saga 幂等补偿之间做出清晰取舍
aiLink: 大模型跨百张卡存检查点（Checkpoint）就是一笔活生生的跨机原子提交：几百张卡的权重与优化器状态必须定格在同一训练步数，哪怕有一张卡存了第 10,001 步而其余卡停在第 10,000 步，恢复出来的模型就是四不像——训练框架靠全局屏障同步加统一版本号落盘提交，解的正是这一课「无全局时钟下的跨机一致定格」。
design:
  - mechanism: 用逻辑因果计数取代物理墙上时钟
    problem: 跨机排先后需要单调递增且贴合真实依赖关系，物理墙钟两条都保不住：NTP 校时可能把钟往回拨，误差窗口内的数字大小只是晶振噪声，拿它做「最后写入胜出」还会静默吞掉新数据而不报任何错。
    choice: 彻底放弃打听物理几点几分，改按程序执行与收发消息事实推进逻辑计数器（max + 1），需要精确揪出并发冲突时再把单个数字升级成每人一格的向量时钟。
    tradeoff: 逻辑时钟与真实物理流逝脱钩，能算清「谁导致了谁」，却答不出「等了多少毫秒」；凡涉及超时、租约、缓存过期的地方，仍得跟有误差的物理单调钟配合双轨运行。
    root: 我们真正关心的「先后」从来不是挂钟指针落在哪一格，而是信息沿着消息流向谁影响了谁——拿带测量误差的物理量去回答拓扑依赖问题，从立题那一刻就问错了尺子。
  - mechanism: 两阶段提交（2PC）的受控领地与阻塞边界
    problem: 要让一群自治节点交出不可反悔的就绪承诺、又只认同一个最终结果，结构上就绕不开唯一宣布者；而宣布者在收齐选票后、发出裁决前倒下时，参与者既不敢提交也不敢回滚，阻塞是协议结构自带的胎记。
    choice: 严守使用边界，只在同机房、受控关系库内部（如 XA 事务）启用 2PC，并用持久化协调日志与共识组高可用把阻塞空窗压到毫秒级，一旦跨服务跨组织就果断停用。
    tradeoff: 锁要横跨多轮网络往返，高并发热点行吞吐急剧下滑，且微服务拆库越普及，满足「同域同控」前提的场景越稀少。
    root: 异步网络里「全员严格原子提交」与「任何节点宕机都不阻塞他人」存在原理级互斥，工程上不强求不存在的完解，而是划清边界、只在划算的领地里用它。
  - mechanism: Saga 事后逆序补偿加幂等去重
    problem: 高并发与跨组织服务绝不接受把数据库行锁挂在网络往返上干等协调者，外部合作方更不可能开放底层锁控制权。
    choice: 把原子性从「事前锁死」挪到「事后抹平」——各步本地事务先独立提交放锁，失败就按逆序跑退款、退票等语义补偿，底下用唯一单号去重表与幂等接口兜住重试与重复消息。
    tradeoff: 事务隔离性当场消失，中间半成品状态对外可见，产品与前端必须兜住「处理中」状态；遇到无法撤回的外部动作还得靠定时重试与人工对账表收尾。
    root: 原子性破了能靠一笔反向新流水事后冲平，属于可补救的账；长锁把系统吞吐拖垮或跨组织根本跑不通则是当场休克——两害相权，先放开锁、再用业务复杂度把账做平。
terminal:
  - cmd: 在你的数据库里查一次 SELECT NOW() 与另一台机器同一时刻的值
    note: 有条件时对比两台机器的时钟差，亲手看一眼「没有全局时钟」到底差多少
