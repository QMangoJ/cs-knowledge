      value: 宣布者是单点，加上参与者的承诺不可撤销
    - name: 标准补强
      value: 把协调者的决定放进共识组做高可用（只能缩小阻塞窗口，不能消除）
  log:
  - mode: 阻塞
    event: 2PC 能用在什么范围，是由它的可用性决定的：任何一环故障，整笔事务都会卡住或中止
- id: alternatives
  title: 不用 2PC 的路：补偿、幂等与去重
  tldr: 把一笔大事务拆成一串各自独立的本地事务，每一步都登记好对应的撤销动作，失败时按逆序执行补偿；前提是每一步都能重复执行而不重复生效（幂等），并且能用请求号识别重复消息（去重）——原子性从「事前锁住不让出错」换成「出错后用补偿把账做平」。
  body: |-
    现代系统的主流答案是换一种原子性：不锁、不等、不投票，接受中间状态存在，用补偿把账做平，代表叫 Saga。一笔跨机业务被拆成一串各自独立的本地事务：订机票、订酒店、扣款，每一步成功时都顺手登记好它的补偿动作（退票、取消预订、退款）。任何一步失败，就逆序执行已成功步骤的补偿，业务回到等价的初始状态。补偿是语义回滚不是物理回滚：退款会留下一条退款记录，而不是把扣款记录抹掉——账本的历史因此完整。
    这条路的两块地基全是第一站的老朋友。其一是幂等：每一步都可能因超时被重试，必须保证重复执行不产生第二次效果（扣款接口带业务单号，重号直接返回上次结果）。其二是去重：消息天然会被重复投递，消费方要按请求号认出「这封信我处理过了」。两块地基打牢，就可以用「至少一次投递加幂等消费」拼出效果上的恰好一次。
    代价也要说清：中间状态对外可见——机票订好了酒店还没订的窗口里，用户刷新会看见半成品，业务要自己设计展示与话术；补偿本身失败时，还得有重试与人工对账兜底。它换走 2PC 的锁与阻塞，换回来业务复杂度的上升。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: coord
      id: c
      label: 编排方：记录每一步做了什么、对应的补偿是什么
    - lane: a
      id: a
      label: A：执行本地事务，带业务单号以便去重
    - lane: b
      id: b
      label: B：失败发生在这里，于是启动逆序补偿
      highlight: true
    messages:
    - id: m1
      from: c
      to: b
      label: 退款、退票：用一个新的动作，抵消已经做过的动作
      active: true
    registers:
    - name: 地基
      value: 幂等（重复执行不重复生效）+ 用请求号去重
    - name: 代价
      value: 中间状态对外可见；补偿失败时还要重试和人工对账兜底
  log:
  - mode: 补偿
    event: 原子性从「事前锁死」换成「事后做平」：不再锁住等投票，而是先执行、失败再补偿
- id: dont-distribute
  title: 落点：先问能不能不做分布式事务
  tldr: 大部分跨机器原子性需求，是数据切分方式造成的：把必须一起成功或一起失败的数据放回同一台机器、同一个数据库里，分布式事务这个问题就消失了。
  body: |-
    在选工具之前，先说全课最重要的一点：遇到跨机事务需求，第一反应不该是选 2PC 还是 Saga，而该是往回退一步，问这笔事务为什么跨了机。账户与它的流水必须同生共死，那就把它们放进同一个库、同一张事务边界里——同生共死的数据，本来就该住在一起。订单与库存若能接受「先预占、后确认」的两步语义，跨机原子性就降级成普通的异步流程。绝大多数分布式事务难题，拆开看都是数据划分或流程设计阶段欠下的债，在事务协议层还，怎么还都贵。
    困难有一部分来自物理现实（消息会迟到、同伴会宕机、时钟各有误差），但困难的程度是设计选出来的——副本放多远、数据切多碎、强一致买多宽，每一笔都在第一站那张清单上标了价。成熟的设计，一大半功夫花在「让问题变小」：把裁决收进共识组、把强一致收窄到最小数据集、把跨机事务尽量变回单机事务。
    本科的骨架到此立完。四站的回收是这样一条线：先认清世界（部分失败、不可区分、无全局时钟），再给容忍标价（一致性谱系），然后给裁决立规（共识与多数派），最后给顺序与原子结账（因果、2PC 与补偿）。回头再看 MySQL 的主从、边缘的 D1、跑在集群里的训练任务，你已经有了一套能把它们一一拆开的工具。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: coord
      id: c
      label: 设计者：先问这笔事务能不能不跨机器
      highlight: true
    - lane: a
      id: a
      label: 必须一起成功或失败的数据：放回同一台机器、同一个库
    - lane: b
      id: b
      label: 真正必须跨机器的少数情况：再打开 2PC / Saga 工具箱
    messages:
    - id: m1
      from: c
      to: a
      label: 先让问题变小，再考虑怎么把剩下的问题解好
      active: true
    registers:
    - name: 全科主线
      value: 认清部分失败 → 给一致性标价 → 用共识立裁决规则 → 给顺序和原子性做最后处理
    - name: 纪律
      value: 分布式事务是最后才选的方案，不是默认方案
  log:
  - mode: 收官
    event: 四节课的骨架到此闭环：清单上的每一行问题，后面都有一套对应的应对方法
minutes: 28
prereq:
- distributed/raft-consensus
objectives:
- 说清墙上时钟给跨机事件排序的失败方式，以及因果为何是唯一可靠的顺序
- 复述 Lamport 时钟三条规则与其单向局限，并用向量比较判定因果与并发
- 完整走一遍 2PC，并指出协调者阻塞的成因与可用性公式
- 为一笔跨机业务在 2PC、Saga 补偿与「改回单机」之间做出有理由的选择
aiLink: 训练任务的检查点保存和跨机事务很像：几百张卡的权重必须保存成同一时刻的一致版本，任何一张卡存了新步数、其余还是旧步数，恢复出来的模型就是四不像——业界用屏障同步加版本号来解决，本质上处理的是这一课讲的同一个问题：多台机器上的状态怎么保持一致版本。
design:
- mechanism: 为什么排顺序的标准要整个换掉：不用墙上时间，改用因果计数
  problem: 排序需要两个性质：顺序只能往前、不能回头（单调），并且要和真实的依赖关系一致。墙上时钟两条都不保证：校时会把时间拉回去，违反单调；误差范围内的先后只是噪声，和因果无关。用它裁决数据新旧，错的时候还不会产生任何异常信号，是最危险的一种错法
  choice: 做法是放弃物理时刻，改用逻辑计数：因果由程序执行和消息传递的事实构成，计数只增不减、还会随消息传播，所以天生单调、天生尊重因果。需要确切判断两个事件是因果还是并发时，再把单个计数升为向量时钟，用更大的邮戳换一个确切的三值结论（在先、在后、或并发）
  tradeoff: 代价是逻辑时钟和真实时间脱钩：它能回答谁导致了谁，回答不了等了多久、有没有超时。凡是和真实时长有关的判断（超时、租约、过期），仍要回到不可靠的墙上时钟，所以两套时间要并行使用
  root: 根本原因在于「顺序」到底指什么：我们关心的不是事件发生在几点几分，而是它们之间的依赖形状。时刻是带测量误差的物理量，因果是没有误差的信息流动关系——拿一个拓扑问题去问物理量，从一开始就问错了对象
- mechanism: 为什么 2PC 明知会阻塞，还在它的适用范围里用了几十年
  problem: 原子提交有一个结构性要求：让一群各自独立的参与者给出不可撤销的承诺，又只接受一个统一的最终决定，就必须有一个宣布者；而宣布者在收齐投票之后、宣布决定之前倒下时，参与者在原理上没有任何合法动作可用——阻塞是这个结构本身带来的，不是实现没写好
  choice: 做法是接受阻塞的存在，并经营它的适用范围：把 2PC 限制在同一管理域、参与方都是受控数据库的场景，用协调者日志和恢复流程把阻塞窗口压到最短，再给协调者做共识高可用。超出这个范围就明确不用
  tradeoff: 代价是适用范围持续收窄：微服务与跨云越普及，满足「同域、同控」前提的事务越少，2PC 更多时候只作为 XA 标准活在中间件里，新系统直接按「不做分布式事务」的前提来划分数据
  root: 根本原因和 CAP 里分区时的选择类似：异步系统里，原子提交和永不阻塞之间存在真实的张力，没有两全的完解。成熟的判断不是去找不存在的完解，而是认清边界、只在边界内使用
- mechanism: 为什么现代系统宁可用 Saga 补偿，也要躲开分布式事务
  problem: 根本约束有两层：第一，2PC 的锁要横跨多次网络往返，高并发下等于把热点数据按往返延迟排队串行执行，吞吐会崩塌；第二，参与方是自治的——别人的服务不会为你的事务长时间上锁待命，跨组织时连接入这个协议的入口都不存在
  choice: 做法是把原子性从事前保证挪到事后补平：一串本地事务先自由执行，每一步都登记好补偿动作，失败就按逆序抵消；再用幂等和去重兜住重试与重复投递，让「至少投递一次」在效果上等价于「恰好执行一次」。原子性从硬承诺，降级为业务上最终把账做平
  tradeoff: 代价是隔离性当场消失：中间状态对外可见，别的事务可能读到「扣了钱还没发货」的半成品；而且补偿不是万能的——已经发出的短信撤不回、已经寄出的货只能召回处理，最后还要连着人工对账
  root: 根子在两种性质的可恢复性不同：原子性破坏后可以用新动作事后抵消，属于可修复的债；隔离性一旦在过程中被外人看见，那个「看见」本身无法撤回。两害相权，工程选择先让渡可修复的那一个
terminal:
- cmd: 在你的数据库里查一次 SELECT NOW() 与另一台机器同一时刻的值
  note: 有条件时对比两台机器的时钟差，亲手看一眼「没有全局时钟」到底差多少
