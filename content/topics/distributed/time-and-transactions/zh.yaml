- id: total-order
  title: 若非要一个全序：排序本身就是共识问题
  tldr: 给所有事件一个全网认账的单一顺序，等价于让大家对一份日志达成共识——绕了一圈，又回到 Raft；想直接用真实时间，就得把时钟误差变成显式的等待。
  body: '有人会问：并发事件本就无序，可业务有时偏偏要一个全序（比如全局唯一的流水号顺序）。先认清这件事的价码：让所有节点认同一个跨越全网的事件顺序，等于让所有人对「同一份日志」达成一致——这正是共识的定义。所以现实系统的做法殊途同归：把排序权交给一个排序者（主节点或共识组的日志），其余事件按入日志的先后编号。上一站的 Raft 日志下标，就是全序的一种工业实现。

    另一条路是把真实时间做得可用：不假装时钟没误差，而是精确测出每台钟的误差上界，写入时主动等掉这个上界再盖时间戳——等完之后，全网的时间戳大小就与真实发生的先后严格吻合（这一思路以 Google Spanner 的 TrueTime 为代表）。它没有消灭误差，只是把误差从「藏在数据里翻车」变成「显式付在延迟上」，与本课一以贯之的哲学相同：不确定的东西不要藏，要标价。

    排序的话题到这里闭环：墙钟不可信（第一站），因果是可靠的骨架（逻辑与向量时钟），非要全序就付共识或等待的钱。下一幕换战场：一笔操作同时改两台机器的数据，原子性由谁来担保。'
  derivation: original
  canvas:
