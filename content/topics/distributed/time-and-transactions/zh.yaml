- id: lamport
  title: Lamport 时钟：一个计数盖出尊重因果的序号
  tldr: 每台机器维护只增计数：本地事件加一，发消息带上计数，收到时取双方最大值再加一——因果在前者，计数必然更小。
  body: '把因果变成数字，规则只有三条。每台机器维护一个自己的计数器（逻辑时钟）。其一，本地每发生一个事件，先把计数加一，再把计数盖在事件上。其二，发送任何消息时，把当前计数随消息一起发出。其三，收到消息时，先把自己的计数抬到「自己的计数与消息带来的计数两者中的较大值」，再加一，然后继续。就这么多。

    效果是：只要事件 X 因果上先于事件 Y，X 的计数必然小于 Y 的计数——因为因果链上的每一步（同节点顺序、发送到接收）都严格把计数往上推。于是按计数从小到大排，得到的顺序永远不会违逆任何一条因果链。给同值的事件再按节点编号打破平局，就得到一个完整的全序，可直接用于日志排序、版本裁决等一切需要「排队」的地方。

    它的局限同样要认清，而且方向相反：计数小不等于有因果。两个毫无关系的并发事件，计数也有大小之分，那纯属盖章的先后，不能反推因果——Lamport 时钟只提供单向的保证：不违逆因果，但无法证明因果。想确切回答「这两份数据到底谁抄了谁、还是各自独立改的」，需要下一幕的向量时钟：盖章的信息量必须再加一个维度。'
  derivation: original
  sources:
  - ref: ddia
    locator: 第 8 章（逻辑时钟：Lamport 时间戳按因果排序事件）
    claim: Lamport 时间戳通过节点计数器与消息携带最大值加一的方式，保证因果在先的事件时间戳更小，从而给出尊重因果的事件顺序
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
