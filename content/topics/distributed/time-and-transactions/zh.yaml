minutes: 28
prereq:
- distributed/raft-consensus
objectives:
- 说清墙上时钟给跨机事件排序的失败方式，以及因果为何是唯一可靠的顺序
- 复述 Lamport 时钟三条规则与其单向局限，并用向量比较判定因果与并发
- 完整走一遍 2PC，并指出协调者阻塞的成因与可用性公式
- 为一笔跨机业务在 2PC、Saga 补偿与「改回单机」之间做出有理由的选择
aiLink: 训练任务的检查点保存是跨机事务的近亲：几百张卡的权重必须保存成同一时刻的一致版本，任何一张卡存了新步数、其余还是旧步数，恢复出来的模型就是四不像——业界用屏障同步加版本号，本质上仍在还这一课的账。
design:
- mechanism: 为什么排顺序的尺子要整个换掉：从墙上时间换成因果计数
  problem: 根本约束是排序所需要的性质——单调不回头、与真实的依赖关系吻合——墙上时钟两条都不保证：它会被校时拉回（违反单调），误差范围内谁先谁后纯属噪声（与因果无关）。用它裁决数据新旧，错的时候还不产生任何异常信号，是最危险的那种错法
  choice: 做法是放弃物理时刻，改用逻辑计数：因果关系由程序与消息的事实构成，计数只增不减且随消息携带传播，天生单调、天生尊重因果。需要判定并发时再升一维到向量，付出邮戳变大的代价换取三值确切结论
  tradeoff: 代价是与真实时间彻底脱钩：逻辑时钟能回答谁导致谁，回答不了等了多久、超时没有，所有与真实时长有关的判断（超时、租约、过期）仍要回到不可靠的墙钟上，两套时间从此要在系统里并行生活
  root: 根子在「顺序」的语义本身：我们真正关心的从来不是事件发生的钟点，而是它们之间的依赖形状。时刻是物理量、带着测量误差，因果是信息流的拓扑、没有误差——拿拓扑问题去问物理量，从一开始就问错了对象
- mechanism: 为什么 2PC 明知会阻塞，还在它的领地里活了几十年
  problem: 根本约束是原子承诺的结构性要求：让一群自治参与者给出不可撤销的承诺、又只接受统一的最终决定，就必须存在宣布者这个角色；而宣布者在投票之后、宣布之前倒下这段时间，参与者在原理上无任何合法动作可用——阻塞不是实现瑕疵，是这个结构自带的影子
  choice: 做法是接受它并经营它的领地：把 2PC 限制在同一管理域、参与方都是受控数据库的场景里，用协调者日志与恢复流程把阻塞窗口压到最短，再为协调者本身做共识高可用。领地之外——跨组织、跨服务——则明确弃用，不与边界硬碰
  tradeoff: 代价是领地的持续收窄：微服务与跨云架构越普及，满足「同域同控」前提的事务越少，2PC 更多时候只作为 XA 标准活在中间件里，新系统则直接按无分布式事务的前提去做数据划分
  root: 根子在不可能性结果的家族相似性上：异步系统里原子提交与永不阻塞之间存在真实张力，如同 CAP 里分区时的那道选择。成熟的工程判断不是寻找不存在的完解，而是认出边界、待在边界划给你的领地里、并把越界的代价提前算清
- mechanism: 为什么现代系统宁可用 Saga 补偿，也要躲开分布式事务
  problem: 根本约束有两层：其一是 2PC 的锁要横跨多个网络往返的时间，高并发下等于把热点数据按往返延迟串行化，吞吐直接崩塌；其二是参与方自治——别人的服务不会为你的事务长时间上锁待命，跨组织场景里连协议入口都不存在
  choice: 做法是把原子性从事前挪到事后：一串本地事务自由奔跑，每步登记补偿，失败就逆序抵消；用幂等与去重兜住重试与重复投递，让「至少一次」在效果上等价于恰好一次。原子性从协议的硬承诺，降级为业务的最终账平
  tradeoff: 代价是隔离性当场消失：中间状态对外可见，别的事务可能读到「扣了钱还没发货」的半成品，业务要为每种中间态准备展示与解释；且补偿不是万能的——已发出的短信撤不回、已寄出的货只能召回，补偿链的末端永远连着人工对账
  root: 根子在两种性质的可恢复性不同：原子性破坏后可以用新动作事后抵消，属于可修复的债；隔离性一旦在过程中被外人看见，那个「看见」本身无法撤回。两害相权，工程选择先让渡可修复的那一个——这条判断在缓存、队列与最终一致的设计里反复出现
terminal:
- cmd: 在你的数据库里查一次 SELECT NOW() 与另一台机器同一时刻的值
  note: 有条件时对比两台机器的时钟差，亲手看一眼「没有全局时钟」到底差多少
