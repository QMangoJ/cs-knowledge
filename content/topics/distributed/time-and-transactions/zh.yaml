- id: vector
  title: 向量时钟：每个事件带一份「全员进度表」
  tldr: 把单个计数换成每节点一份的计数表：比较两张表就能判定谁因果在先、还是互为并发——副本检测「我们是不是各改各的」靠的正是它。
  body: '向量时钟（vector clock）把盖章术升级一个维度：不再是一个总数，而是每台机器一张表，表里记着「据我所知，每个节点各推进到了第几步」。本地事件只增自己那一格；发消息时把整张表带上；收到消息时把两张表逐格取大、再增自己那格。邮戳从此携带的不是一个深度，而是事件的完整来历。

    比较两个事件的向量，结论是三值的，并且都是确切的：若向量甲逐格都不大于向量乙且至少一格更小，则甲因果在先；反之乙在先；若互有大小（甲在这一格大、乙在那一格大），则两者并发——没有任何一方的来历里包含对方。这正好补上 Lamport 时钟的盲区：它不能证明因果，向量时钟可以。

    它的用武之地在副本世界：同一数据的两个版本各带一个向量，一比就知是「新版取代旧版」（因果在后，直接覆盖）还是「两边在互不知情时各改了一次」（并发，产生冲突，需要合并或请用户裁决）——上一站因果一致里提到的依赖追踪，落地就是它。代价也明码标价：向量的大小随节点数量线性增长，节点上万时邮戳比信还长，所以它常驻在成员相对固定的副本系统里，而不是开放网络里。'
  derivation: original
  canvas:
    kind: swimlane
