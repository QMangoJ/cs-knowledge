bridge:
  prev: 前三课依次摊开了部分失败的隐患、给副本新旧差标了价、并用 Raft 解决了多机选主裁决。还剩最后两块硬骨头：没有全局准钟时，两台机器上的事件凭什么排先后？一笔转账同时改两台机器的数据时，怎样保证同生共死？
  next: 跨机事务解决的是「多步改账必须同成同败」，但线上九成日常接口并不要求强原子绑定——它们真正怕的是洪峰冲垮下游、慢请求引发重试雪崩、以及几百个实例变来变去找不到地址。最后一课就用消息队列、限流熔断与服务治理替日常调用兜底。
title: 分布式事务与时间：用因果关系排顺序，用补偿代替强原子性
summary: 物理墙钟存在漂移与回拨，跨机排先后必须改看信息传递的因果链：Lamport 时钟在信封上贴单调计数保住因果不颠倒，向量时钟带上全员进度表识别并发冲突。跨机改账若强求同生共死，两阶段提交（2PC）会在协调者死机时锁死阻塞；现代工程首选把同生共死的数据合回单库，非跨机不可时则用幂等、去重与 Saga 补偿事后做平。
premise: 考虑一笔横跨两台独立服务器的跨行转账：账户服务 A 给甲扣款 100 元，账户服务 B 给乙入账 100 元。麻烦接踵而至：第一，A 的石英钟比标准时间慢了 300 毫秒，要是按时间戳合并日志或覆盖新旧版本，刚改的新账竟会被当成旧账静默吞掉；第二，万一 A 刚扣完 100 元，B 机器断电没加上钱，这凭空蒸发的 100 元谁来兜底？
position: 本课位于分布式系统板块第四段「时间与跨机事务」，直接偿还第一课欠下的「无全局时钟」与「跨机状态割裂」两笔债。前半程从因果关系推演逻辑时钟与 TrueTime，后半程对比 2PC 强锁与 Saga 补偿；学完前四课，你就握齐了审视任何分布式存储与账务架构的完整标尺。
overview:
  - key: 一句话总结
    value: 跨机排先后不看墙上几点几分，只看谁给谁发过消息的因果链；跨机保原子性先问能不能合回单库，非拆不可就用「幂等 + 去重 + 逆向补偿」替代跨网长锁。
  - key: 唯一可靠顺序
    value: 1978 年 Lamport 指出跨机唯一站得住的先后是因果关系（happens-before）：同机先执行的在前、发信排在收信在前；两条规则都连不上的事件属于真并发，本就无先后之分。
  - key: Lamport 时钟
    value: 每台机器维护递增计数器并在发消息时贴在信封上，收信方取 max(本地, 信封) + 1；它能保证「有因果则编号必递增」，但反过来编号小不代表真有因果。
  - key: 向量时钟
    value: 把单个数字升级成记录全员进度的数组（全员进度表），两张表逐格一比就能铁板判定「谁是前因」还是「互不知情的并发冲突」，代价是表长随节点数线性膨胀。
  - key: 两阶段提交
    value: 2PC 让协调者先收齐全体参与者的落盘承诺票，再统一宣布提交或回滚；致命伤是协调者一旦倒在宣布前夕，所有参与者只能死死抱着行锁干等复活。
  - key: 补偿全家桶
    value: 现代微服务常用 Saga 替代 2PC：每步本地事务直接提交并登记逆向补偿（如扣款配退款），配合请求幂等键与消费去重表，失败时倒着把账冲平。
  - key: 第一元原则
    value: 最好的分布式事务就是不做分布式事务——凡是必须同生共死的账户与流水，划分库表时就该留在同一个单机事务边界里。
