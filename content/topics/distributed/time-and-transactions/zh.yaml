      label: 先让所有人承诺，再统一宣布提交或回滚
      active: true
    registers:
    - name: 第一段
      value: 投票就是承诺：参与者准备到既能提交、也能回滚的状态
    - name: 第二段
      value: 全员赞成才提交，有一票反对或超时就回滚
  log:
  - mode: 2PC
    event: 原子性靠两件事搭出来：所有参与者事先承诺，加上协调者一处统一宣布
- id: two-pc-pain
  title: 2PC 的痛：协调者倒在宣布之前
  tldr: 参与者投了「能」之后，既不能自己提交、也不能自己回滚，只能锁住数据等协调者宣布——协调者这时宕机，它们就一直阻塞；而且整笔事务的可用性要乘上协调者的可用性，所以 2PC 在跨组织场景里几乎用不了。
  body: |-
    设想协调者收齐全票、正要宣布时宕机。参与者的状态是：修改备好了、锁加着、承诺已经出口。此时它们绝不能自作主张提交（万一决定是回滚呢？可能某个迟到参与者的反对票已让协调者宣布中止，只是消息还没到），也不能擅自回滚（万一决定是提交呢）。唯一合法的动作是等协调者复活、查日志、补发决定。这段时间被锁住的数据谁也动不了，后续事务排队堆积。这就是阻塞（blocking）：正确性无懈可击，可用性被一台机器的人质问题拖住。
    再算总账：一次 2PC 的可用性约等于协调者与全体参与者可用性的乘积——任何一环故障，整笔事务要么卡住要么中止。参与者还多半是别人的系统：银行不会为你的协调者保留锁。于是 2PC 的领地始终限于「同一管理域内、参与方都是数据库」的场景（XA 事务），跨服务、跨组织的互联网业务里，它更多以历史坐标的形式出现。
    2PC 不是设计失败，而是原子提交在异步网络里的真实边界：宣布者倒下的空窗在原理上无法完全消除，只能用共识给协调者做高可用去缩小（把协调者的决定本身放进 Raft 组，是工业界的标准补强）。补强缓解了它，没有取消它。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: coord
      id: c
      label: 协调者：收齐票后、宣布之前宕机
