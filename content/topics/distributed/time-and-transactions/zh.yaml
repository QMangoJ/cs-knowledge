- id: alternatives
  title: 不用 2PC 的路：补偿、幂等与去重
  tldr: 把一笔大事务拆成一串本地事务，每步配好撤销动作，失败就逆序补偿；前提是每一步都幂等且可去重——原子性从「事前锁死」换成「事后做平」。
  body: '现代系统的主流答案是换一种原子性：不锁、不等、不投票，而是接受中间状态存在，用补偿把账做平，这一系列做法的代表叫 Saga。一笔跨机业务被拆成一串各自独立的本地事务：订机票、订酒店、扣款，每一步在成功时都顺手登记好它的补偿动作（退票、取消预订、退款）。任何一步失败，就逆序执行已成功步骤的补偿，业务回到等价的初始状态。注意补偿是语义回滚不是物理回滚：退款会留下一条退款记录，而不是把扣款记录抹掉——账本的历史因此完整，审计反而更爱它。

    这条路的两块地基，全是第一站的老朋友。其一是幂等：每一步都可能因超时被重试，必须保证重复执行不产生第二次效果（扣款接口带业务单号，重号直接返回上次结果）。其二是去重：消息天然会被重复投递，消费方要按请求号认出「这封信我处理过了」。把这两块地基打牢，系统就可以用「至少一次投递加幂等消费」拼出效果上的恰好一次，而不需要传输层给出它给不了的承诺。

    补偿的代价也要说清：中间状态对外可见——机票订好了酒店还没订的窗口里，用户刷新页面会看见半成品，业务要自己设计展示与话术；补偿动作本身失败时，还得有重试与人工对账兜底。它换走的是 2PC 的锁与阻塞，换回来的是业务复杂度的实打实上升。'
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: coord
      id: c
      label: 编排方：记录每步与它的补偿
    - lane: a
