- id: happens-before
  title: 唯一可靠的顺序是因果
  tldr: 两条关系定义全部秩序：同一节点内先发生的在前、一次发送先于它的接收；连不上的两个事件叫并发——并发不是未知，是「本就无序」。
  body: 'Lamport 在 1978 年给分布式排序换了地基：别问时钟，先问因果。一个事件先于（happens-before）另一个事件，只在三种情形下成立：它们在同一节点上、且一个执行在前；或者一个是发送、另一个是对应的接收；或者经由一串这样的关系传递可达。除此之外的两个事件，关系是并发（concurrent）——注意，并发不是「不知道谁先」，而是一个更强的论断：它们之间没有信息流动，谁先谁后对系统的任何结果都不产生影响，所以本就不需要排序。

    这套定义的革命性在于它把排序问题从物理里解救出来：因果关系由程序执行与消息传递的事实构成，不依赖时钟精度，不随校时跳变而翻转。两个事件若真有因果，你总能沿着「同节点顺序」与「发送到接收」这两类边一路走通；若走不通，它们就是真并发，强行排序只能是随意指定，与真相无关。

    接下来两幕是把因果做成可计算的两种盖章术：Lamport 时钟用一个计数给出尊重因果的全序，向量时钟用一张计数表进一步回答「这两个事件到底有没有因果」。它们都是给事件随身携带的邮戳：事件走到哪，邮戳就把它的来历带到哪。'
  derivation: original
  sources:
  - ref: ddia
    locator: 第 8 章 The Trouble with Distributed Systems（happens-before 与因果关系）
    claim: 跨节点可靠的顺序概念是 happens-before（先行发生关系）：同节点先后与消息的发送—接收定义因果，不可比的事件即并发；墙上时钟无法给出这种关系
