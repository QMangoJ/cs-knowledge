- id: txn-problem
  title: 跨机事务登场：一笔转账的同生共死
  tldr: A 行扣一百、B 行加一百，必须同成同败；单机时这是事务的本职，拆到两台机器上，部分成功就是直接的资金事故。
  body: '现在进入本科的最后一个问题。场景是经典的跨行转账：从账户甲转一百元到账户乙，甲的账户存在服务 A 的机器上，乙的存在服务 B 的机器上。「A 扣、B 加」必须满足原子性：要么两个都生效，要么两个都不生效。若 A 扣完、B 那边宕机没加上，一百元凭空蒸发；若 B 先加上、A 没扣成，钱又凭空诞生。单机数据库里这根本不是问题——事务与预写日志（数据科的事务课）把原子性做成了本职工作。

    跨机之后，本职保障消失了：A 与 B 各有自己的本地事务，各自能保证自家账的原子，却没有任何一方能单独保证「两笔本地事务同生共死」。它们之间只剩消息（第一站的老规矩），而消息会迟到、发消息的人会宕机。原子性的担保人必须由协议临时搭建出来：找一个协调者主持全程，让参与者在动手之前先彼此承诺——这就是两阶段提交，两幕讲完它，再讲它的痛与退路。

    立规矩的时候把标准放低一点看后文：接下来所有方案（2PC、补偿、幂等）都是在回答同一道题的不同价位：你愿意为「同生共死」付多少可用性、多少延迟、多少业务复杂度。本课的落点——先问能不能不做——正是在价位表之外多给的一个选项。'
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: a
      id: a
      label: 服务 A：甲账户扣 100
    - lane: b
      id: b
      label: 服务 B：乙账户加 100
      highlight: true
    - lane: coord
      id: c
