  prev: 前面三站分别解决了难在哪、容忍多旧、听谁的。本站收官处理最后一对缠绕的问题：没有可信时钟时凭什么排先后，一笔操作横跨多台机器时凭什么保证全成或全不成。
title: 分布式事务与时间：用因果排顺序，用补偿替原子
summary: 墙上时钟排不了跨机顺序，就改用因果：Lamport 计数尊重因果、向量时钟能判并发；跨机原子性靠 2PC 能做但会阻塞，现代系统更常先问「能不能不做分布式事务」，退路是幂等、去重与补偿。
premise: 以一笔跨行转账（账户服务 A 扣款、服务 B 入账，必须同生共死）为样本，前半课解决「谁先谁后」，后半课解决「要么全成、要么全不成」。
position: >-
  本课位于分布式系统本科的收官一段「时间与跨机事务」：因果排序回收第一站作废的「时钟唯一」，2PC 与补偿则回应数据落到多台机器后原子性的归属问题。学完本科四站，你应当能对任何一个分布式方案先审它的前提清单：分区时选哪边、谁有裁决权、顺序凭什么、原子性的账记在谁头上。
overview:
- key: 一句话总结
  value: 排顺序别信墙上的钟，信因果；保原子先问能不能不跨机，实在不行，用补偿把账做平
- key: 唯一可靠的顺序
  value: 因果关系：同一节点内先后、发送先于接收——其余事件是并发的，本来就无所谓谁先
- key: Lamport 时钟
  value: 一个只增的计数：给事件盖尊重因果的序号；局限是看不出两个事件到底有没有因果
- key: 向量时钟
  value: 每人一份计数表：能判定因果与并发，代价是尺寸随节点数增长
- key: 2PC
  value: 两阶段提交：先全员投票承诺、再统一宣布；协调者一宕，参与者被承诺锁住不能动弹
- key: 退路全家桶
  value: 幂等、请求号去重、补偿事务（Saga）、对账兜底——现代系统的实际主力
- key: 元原则
  value: 分布式里先问能不能不做分布式事务：一大半跨机难题，是被数据划分方式制造出来的
