- id: two-pc-pain
  title: 2PC 的痛：协调者倒在宣布之前
  tldr: 参与者投了「能」之后既不能提交也不能回滚，只能抱着锁干等——这就是阻塞；再加上可用性要乘上协调者的可用性，2PC 在跨组织场景里几乎用不动。
  body: '设想协调者收齐全票、正要宣布时宕机。参与者们的状态是：修改备好了、锁加着、承诺已经出口。此时它们绝不能自作主张提交（万一协调者的决定是回滚呢？它可能因为某个迟到参与者的反对票而宣布中止，只是消息还没到），也不能擅自回滚（万一决定是提交呢）。唯一合法的动作是等——等协调者复活、查日志、补发决定。这段时间里，被这笔事务锁住的数据谁也动不了，后续事务排队堆积。这就是阻塞（blocking）协议的含义：正确性无懈可击，可用性被一台机器的人质问题拖住。

    再往外算一笔总账：一次 2PC 的可用性约等于协调者与全体参与者可用性的乘积——每一方都是串联的一环，任何一环故障，整笔事务要么卡住要么中止。参与者还多半是别人的系统：银行不会为你的协调者保留锁，合作方宕机恢复后你得找它对账。于是 2PC 的实际领地几十年来始终限于「同一管理域内、参与方都是数据库」的场景（XA 事务），跨服务、跨组织的互联网业务里，它更多以历史坐标的形式出现。

    说句公道话：2PC 不是设计失败，它是原子提交在异步网络里的一个真实边界——想让互不信任时序的自治参与者给出不可撤销的承诺，就要有人承担宣布者的角色，而宣布者倒下的空窗在原理上无法完全消除，只能用共识给协调者做高可用去缩小（把协调者的决定本身放进 Raft 组，是工业界的标准补强）。补强缓解了它，没有取消它。'
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: coord
      id: c
