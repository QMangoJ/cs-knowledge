- id: spectrum-eventual
  title: 谱系弱端：最终一致，便宜的代价是学会合并与打补丁
  tldr: 只保证「停写之后终将对齐」；中途读到的旧与乱由业务消化，冲突靠可交换的合并化解，体验靠会话保证补丁。
  body: '最松、也最常用的一档是最终一致（eventual consistency）：不承诺任何时刻读到的新鲜度，只承诺一条——只要不再有新的写入，所有副本最终会收敛到相同的值。中间过程可以旧、可以乱、A 地读到第三版 B 地读到第一版，都在这份契约的容忍之内。它的便宜是结构性的：写只需落在任意一份副本上就生效，读随便找最近的副本，协调开销降到接近于零，于是可用性高、延迟低、扩展性最好。

    便宜不是免费，账记在两处。一处是冲突合并：分区或并发之下两份副本各自改了同一数据，收敛时要有人决定结果。化解之道是让合并操作可交换——比如购物车的收敛规则是取并集：两地各加了几件商品，合并就是都算上，先加后加结果都一样，这类被设计成「怎么合都不出错」的数据结构（CRDT 一族）就是为此而生的。另一处是体验补丁：用户刚提交评论，转头刷新却看不到，会觉得系统坏了——于是有会话保证这一组补丁：读己之写（自己总能读到自己的写）、单调读（不会越读越旧），它们只约束单个用户的视角，便宜，却能补掉最终一致最扎眼的那几根刺。

    回扣一下：你在复制课里见过的异步主从，本质就是最终一致配上工程惯例（关键读走主库，等于手动实现读己之写）。谱系不是新世界，而是给已经见过的系统们发了正式的名牌。'
  derivation: original
  sources:
