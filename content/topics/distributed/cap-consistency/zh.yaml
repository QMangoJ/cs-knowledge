bridge:
  prev: 上一站说明了一个事实：同一份数据放在多台机器上时，各副本的进度天生会有差别。这一站把这种差别具体化——先说清 CAP 到底在什么情况下才要求做选择，纠正最常见的误读，再从强到弱介绍一致性的各个档位分别承诺什么、代价是什么。
  next: 谱系回答的是「读到的数据可以旧到什么程度」；但像「谁是主副本」这类问题不能有模糊答案，必须只有一个大家都认的结果。下一站讲多台随时可能故障的机器如何共同做出一个不可推翻的决定，内容包括选主、日志复制和多数派原则。
title: CAP 与一致性谱系：分区时才做的那道选择题
summary: 先从一个场景说起：同一份数据存在东京和法兰克福两台机器上，两边靠网络互相抄送更新，所以同一时刻，两台机器手里的数据可能新旧不一。这一课要讲的，就是系统该对「读到的数据可以有多旧」给出什么样的承诺。先说 CAP（一致性 Consistency、可用性 Availability、分区容错 Partition tolerance）：它常被误读成系统平时就要在三项里放弃一项，其实不是——只有当网络分区真的发生时，才必须在一致性和可用性之间选一边。平时没有分区，真正的取舍是 [[PACELC]]后半句讲的延迟与一致性：想让数据更一致，就要多等。后面会从强到弱看线性一致、因果一致、最终一致各自承诺什么、代价是什么，最后把 [[MySQL]]主从和 [[D1]]的副本放到这条谱系上，看它们各站在哪一档。
premise: 这一课要回答的问题很具体。同一份数据放在东京和法兰克福两台机器上，平时两边看起来都好好的，可一旦中间的网络断开，系统到底应该让用户继续用旧数据，还是宁可先拒绝一部分请求，也要保证大家看到的是同一份账？我们就跟着这样一份跨洲的数据往下看。东京是主副本，法兰克福是跟着同步的副本。海底光缆断掉的那十分钟里，系统没有时间慢慢商量，必须当场在这两种做法里选一种。后面讲的 CAP、PACELC 和一致性的各个档位，都是在把这次选择背后的道理一条条说清楚。
position: 本课位于分布式系统本科的第二段「一致性的谱系」，接在为什么难之后。上一站已经说明，副本之间必然会有进度差；这一站接着说，这种进度差会逼系统做哪些具体的取舍：CAP 在什么时刻要求系统选边，PACELC 怎样补充说明平时没有分区时的取舍，以及强弱不同的档位各自要付出多少代价。学完这一课，面对任何一个多副本系统，你都能问出两个准确的问题：发生分区时，它优先保一致性还是可用性？平时，它为了让数据更一致，愿意多等多少延迟？
overview:
- key: 一句话总结
  value: 先记住一句话：CAP 要求做选择，只发生在网络分区期间。没有分区的时候，一致性和可用性完全可以同时做到，系统既能给出最新的数据，也能正常回应每一个请求。平时真正需要权衡的是另一件事：为了让数据更一致，每次操作愿意多付多少延迟。
- key: CAP 的 C
  value: CAP 里的 C 指的是线性一致（linearizability）：系统对外看起来像只有一个副本。举个例子，你刚把昵称改好并收到了成功提示，紧接着不管从哪台机器去读，都应该读到新昵称，而不是改之前的旧名字。也就是说，任何一次读，只要发生在一次写完成之后，就应该读到那次写的结果。这就是这一档给出的承诺。
- key: CAP 的 A
  value: 可用性指的是，系统对每个请求都能给出一个正常回应，不用报错来拒绝服务。要注意，能回应不等于回应的内容是最新的。比如分区期间，法兰克福那一侧虽然还能正常返回库存数字，但那个数字可能还是几分钟前的旧数据。
- key: P 的地位
  value: 分区容忍不是一道可做可不做的选项题，这一点很容易被误解。只要系统是跨机器部署的，网络总有可能断开：海底光缆会被挖断，交换机也要重启，这是部署方式带来的事实前提。真正要选的，是分区已经发生时，系统优先保一致性，还是优先保可用性。
- key: PACELC
  value: PACELC 补充了 CAP 没有讲到的平时情况，也就是大多数没有分区的时间该怎么取舍。它的后半句说的是：没有分区（Else）时，系统还要在延迟（Latency）和一致性（Consistency）之间做选择。想让远方副本更快跟上、让读到的数据更新一些，通常就要让每次写入多等一会儿。这才是日常最常见的权衡。
- key: 谱系
  value: 一致性从强到弱依次是线性一致、因果一致、最终一致，承诺一档比一档松。档位越弱，系统通常延迟越低、可用性也越高，因为它不需要每次操作都等所有副本对齐。代价也很明确：读到旧数据、或者几台机器暂时对不上的可能性会变大。所以只有业务能接受这种程度的不一致时，才适合选弱档。
- key: 选购原则
  value: 选档时要按数据类型分别决定，不能全站只用一个档位，这样才能把钱花在真正不能出错的地方。余额、库存这类错了代价很大的数据，应该偏向强档；点赞数、浏览计数这类晚几秒对齐也无妨的数据，偏向弱档就够了。如果选了最终一致，还可以用读己之写这类只针对单个用户会话的保证，减少用户刚写完就读不到自己内容的那种别扭体验。
