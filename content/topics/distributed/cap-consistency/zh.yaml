- id: cap-accurately
  title: CAP 的准确含义：三个字母先对齐定义
  tldr: C 是线性一致这个特定档位，A 是请求必有回应，P 是分区会发生这个事实前提；三者不是一道平时的菜单题。
  body: 'CAP 定理流传最广，也被误读最广，先把三个字母的定义钉死。C 指一致性，但不是泛泛的「数据正确」，而是一个特定档位：线性一致（linearizability）——系统表现得好像只有一个副本，任何读都读到最近一次已完成写的结果，操作之间存在一个与真实时间吻合的全局顺序。A 指可用性：每个请求都能得到一个（非错误的）回应，哪怕回应里的内容是旧数据。P 指分区容忍：网络断成互不连通的几块时，系统还能继续工作。

    注意 P 的地位：它不是一道「要不要」的选择题。只要系统跨机器部署，分区就可能发生——光缆会断、交换机要重启、跨机房链路会抖——区别只在频率与时长。一个系统总不能在分区时整体自杀，所以 P 实际上是前提，不是选项。

    那么定理到底断言什么？它说：当分区真的发生时，你无法同时拥有线性一致与可用。理由几乎是构造性的：分区两侧无法通信，一侧收到了写、另一侧来了读，读的一侧要么返回旧值（牺牲 C），要么拒绝服务（牺牲 A）——没有第三种可能，因为新值过不来，这是信息层面的 impossibility，不靠任何工程能绕开。记住这个「当……时」的条件，它正是下一幕纠正误读的钥匙。'
  derivation: original
