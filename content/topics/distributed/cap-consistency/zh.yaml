    registers:
    - name: C
      value: 线性一致的意思是，系统看起来像只有一个副本，一次写完成之后，后面的读就应该读到那次写的结果
    - name: A
      value: 可用性的意思是，每个请求都能得到一个正常回应，系统不用靠报错来拒绝服务
    - name: P
      value: 分区容忍说的是网络分区确实可能发生，这是跨机器部署时的事实前提，不是可做可不做的可选项
  log:
  - mode: 定义
    event: CAP 是一个带条件的结论：只有在分区正在发生时，一致性和可用性才无法同时保证
- id: partition-moment
  title: 算清断网两本账：超卖赔礼道歉，还是当场关门拒单
  tldr: 光缆断开时选 A 意味着两地照常卖货，恢复后得替「2 件库存卖出 4 单」擦屁股；选 C 意味着断联侧立刻拒单，账本永远干净但当场丢掉生意——真实大厂按赔钱轻重把两套方案混着用。
  body: |-
    顺着断网那十分钟把真金白银的损失算出来：假设仓库里某款限量镜头只剩最后 2 件，光缆刚断，东京涌进两位顾客买走了 2 件，法兰克福也涌进两位顾客盯着旧库存买走了 2 件。

    如果选 **A（先接单再说）**，断网期间两边收银台一片祥和，4 笔订单全秒过；可十分钟后光缆修好、两本账一对，2 件现货对着 4 张已付款订单，当场爆出 2 单超卖。数据库自己可不知道该退谁的货，最后只能由业务系统发致歉信、赔优惠券人工冲正——银行 ATM 机在脱机断网时其实也常走这条改良路子：允许每张卡小额离线取现几百元保住应急可用性，等半夜网络恢复再跑批对账，真透支了走催收流程。

    如果选 **C（账不准就不接）**，规矩事先定死「只有东京主库能扣款，法兰克福失联期间一律拒绝写请求」。这样从头到尾只有一本真账，光缆修好后零冲突；代价是法兰克福的用户那十分钟点啥都报错。真实工业界从不一刀切，比如微信红包与支付核心账本严守 C（宁可提示系统繁忙绝不双花一分钱），而旁边的朋友圈点赞与未读红点全走 A——怎么选全看「事后赔钱道歉」和「当场拦客拒单」哪头更肉疼。
  derivation: original
