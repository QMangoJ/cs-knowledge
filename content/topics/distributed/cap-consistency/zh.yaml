steps:
- id: what-consistency
  title: 先定义问题：多副本到底怕什么
  tldr: 例如东京已经写入新值、法兰克福还没同步到，这段时间同一份数据在两地读到的结果不同；一致性就是系统对「读可能读到多旧、多不一致的数据」所做的明确承诺。
  body: |-
    上一站提到的四条被打破的假设里，最后一条是以为状态只存放在一处。数据一经复制——为了容错、为了就近、为了分担读流量——它就同时存在于多台机器上，而同步消息再快也要时间。于是东京的副本可能已经是新值，法兰克福的还停留在三秒前：用户在两地读同一条数据，读到两个世界。
    一致性（consistency）讨论的就是系统对「读能读到什么样的值」给出什么承诺。最严的是「像只有一个副本」：谁刚写完，所有人立刻读到新值。最松的是「最终会一致」：中间读到什么都有可能，但只要不再写入，所有副本最后会对齐。中间还有好几档，各有价钱与适用面。
    一致性不是数据的属性，而是契约的属性——同一套副本，配上不同的读写协议，就能给出不同档位的承诺。所以谈谱系，谈的其实是协议的价目表：你愿意为「读得新」付多少延迟与可用性。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: w
      id: w
      label: 写入方：刚刚在东京提交了一个新值
    - lane: p
      id: p
      label: 主副本（东京）：已经保存了新值
    - lane: r
      id: r
      label: 远方副本（法兰克福）：同步消息还没到，仍是旧值
      highlight: true
    messages:
    - id: m1
      from: p
      to: r
      label: 同步消息从东京传到法兰克福所花的时间里，两地数据不一致，这段时间就是不一致窗口
      active: true
    registers:
    - name: 契约的两端
      value: 最强是像只有一个副本、最弱是停止写入后最终会对齐，中间有多个档位
    - name: 决定因素
      value: 同一份数据采用不同的读写协议，就能得到不同档位的一致性，所以决定因素是协议，不是数据本身
  log:
  - mode: 定义
    event: 先说清系统承诺让读者读到多新的数据，再讨论用什么协议实现这个承诺
- id: cap-accurately
  title: CAP 的准确含义：三个字母先对齐定义
  tldr: 先把三个字母的准确含义对齐：C 特指线性一致这一个档位，A 指每个请求都能得到正常回应，P 指网络分区确实可能发生这一事实前提；所以 CAP 不是让系统平时就从三项里挑两项的菜单题。
  body: >-
    CAP 定理流传最广，也被误读最广，先把三个字母的定义说准确。C
    不是泛泛的「数据正确」，而是特定档位：线性一致（linearizability）——系统表现得好像只有一个副本，任何读都读到最近一次已完成写的结果，操作之间存在一个与真实时间吻合的全局顺序。A
    指可用性：每个请求都能得到一个（非错误的）回应，哪怕内容是旧数据。P 指分区容忍：网络断成互不连通的几块时，系统还能继续工作。

    注意 P 的地位：只要系统跨机器部署，分区就可能发生——光缆会断、交换机要重启、跨机房链路会抖——区别只在频率与时长。系统不能一遇到分区就整体停服，所以 P 是前提，不是选项。

    定理断言的是：当分区真的发生时，无法同时拥有线性一致与可用。分区两侧无法通信，一侧收到了写、另一侧来了读，读的一侧要么返回旧值（牺牲 C），要么拒绝服务（牺牲 A）——没有第三种可能，因为新值过不来，这是信息层面的
    impossibility。记住这个「当……时」的条件，它正是下一幕纠正误读的钥匙。
  derivation: original
  sources:
  - ref: ddia
    locator: 第 9 章 Consistency and Consensus（CAP 定理与线性一致的讨论）
    claim: CAP 中的一致性指线性一致，分区发生时线性一致与可用性不可兼得；CAP 常被误读为任何时刻都要三选二，实际上只有在分区期间才被迫取舍
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
