minutes: 28
prereq:
- distributed/why-hard
objectives:
- 用准确的定义复述 CAP：线性一致、可用、分区容忍，并说清选择只在分区期间发生
- 用 PACELC 补全平时的一半：无分区时在延迟与一致性之间选
- 从强到弱说出谱系各档的承诺、价格与典型场景
- 给出 MySQL 主从、半同步、D1 在谱系上的站位，并按三问法为一类数据选档
aiLink: 模型推理服务同样在谱系上选位：多地部署的模型副本要不要实时同步到同一版本、用户会话粘在哪一台、限流计数要全网强一致还是各自近似——选法与本课完全同构。
design:
- mechanism: 为什么把 CAP 讲成「条件句」而不是「菜单」，是理解一切副本系统的前提
  problem: 根本约束是定理的逻辑形式本身：它是一个带前提的蕴含——「若分区发生且仍要可用，则不可能有线性一致」——前提不触发时结论不适用。把它讲成无条件的三选二，等于抹掉前提，会让设计者在没有分区的日子里也以为自己必须牺牲点什么
  choice: 做法是在定义上较真儿：C 限定为线性一致这一个档位，P 讲成事实前提而非选项，并把 CAP 与 PACELC 并排呈现——前者规管灾时那几分钟，后者规管平时每一次操作的延迟预算，合起来才覆盖一个系统的全部生命
  tradeoff: 代价是讲解与心智都变贵了：一个字母一个定义的精确版，远没有「三选二」朗朗上口，团队沟通时要用更长的句子、更多的限定词，还总有人拿着江湖版本来对线
  root: 根子在定理的证明方式上：它证明的是信息过不来时的无奈——新值物理上无法出现在断开的另一侧。所以 CAP 不是工程取舍的品味宣言，而是一条关于信息传播的物理界限；理解它，先要把它当界限而不是口号
- mechanism: 为什么一致性要做成一条谱系，而不是一个「强/弱」开关
  problem: 根本约束是数据价值的异质性：同一个系统里，余额与点赞数对「读错」的耐受差了几个数量级，若只有一档全局一致性，要么给点赞数付余额的协调费，要么给余额冒点赞数的险，两种都是系统性错配
  choice: 做法是把一致性做成可选档位与组合：按数据类别、甚至按读写面分别定档，强档收窄到最小集合，其余用弱档加会话保证打补丁。D1 式的「写归一、读分布」就是组合拼法的代表
  tradeoff: 代价是语义复杂化：开发者必须随时清楚自己脚下这块数据是哪一档，跨档位的组合推理（在这里读己之写、在那里最终一致）容易出错，文档与测试的负担同步上升
  root: 根子在一致性的价格来源：它本质是副本间消息传播的函数——传播要时间，强承诺等于为每次操作买断传播时间。在光速画死的上限面前，唯一理性的花法是把强承诺当稀缺品，只配给最怕错的那部分数据
- mechanism: 为什么给最终一致打补丁用「会话保证」，而不是整体升档
  problem: 根本约束是感知的不对称：用户能察觉的不一致，几乎全部发生在他自己刚刚做过的操作上——刚发的评论看不到、刚改的资料读回旧值；至于别人三秒前的数据新不新，他既不知道也无从比较。给全系统升强档去解决这种局部感知，是拿全局的钱补局部的洞
  choice: 做法是把保证收窄到会话视角：读己之写、单调读、写跟随读这一组保证，只约束「同一个用户的连续操作」，实现成本低得多（会话内记住自己写到哪、读时不低于这个位置即可），却能灭掉用户实际抱怨的绝大部分不一致
  tradeoff: 代价是保证有覆盖边界：换设备、清缓存、会话标识丢失，补丁就会漏——用户在手机上改了头像、到电脑上看到旧的，补丁管不着。这类跨会话的残余不一致，只能靠缩短同步延迟去缓解，根除不了
  root: 根子是「一致性」这个词混装了两种需求：数据的全局真实顺序，与用户的局部感知连贯。前者贵且多数场景不必要，后者便宜且直接决定体验。把两者拆开定价，是把钱花在感知上而不是花在形式上
terminal:
- cmd: sysbench 或你熟悉的压测工具对主从各读一次同一行
  note: 练习思路：连续写、立刻从从库读，统计有多少次读到旧值——把不一致窗口亲手量出来
