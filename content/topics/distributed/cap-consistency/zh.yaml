- id: the-myth
  title: 纠正「平时三选二」：没分区的世界里 C 与 A 同在
  tldr: CAP 被说成「一致性、可用性、分区容忍三者永远只能选两个」是误读：没分区时既一致又可用的系统到处都是。
  body: '江湖版本的 CAP 听起来像一道永远的菜单题：任何分布式系统都要在三个字母里扔掉一个。照这个讲法，一个平时运行在单机房、网络健康的系统也必须牺牲一致性或可用性——这与日常经验直接冲突：你的数据库集群平时既给出强一致的读，请求也从不报错，可用得很。它们并没有违反定理，因为定理的条件根本没有触发：没有分区。

    准确的重述是：分区发生的那段时间里，可用与线性一致不可兼得；分区没有发生时，两者可以兼得，定理对此不置一词。所以「CP 系统」「AP 系统」这种产品标签，准确的读法应该是「它在分区时倾向于牺牲哪一边」，而不是「它平时就缺少哪一边」。一个 AP 系统平时照样可以提供很新的读，CP 系统平时照样高度可用，差别只在断网的那几分钟里现形。

    为什么要较这个真？因为误读会导出错误的设计恐慌：有人以为「选了 AP 就永远读不到自己的写」，从而给不需要强一致的场景（点赞计数、浏览量）也上重型协议，白白付掉延迟与运维成本。定理是用来算清代价的工具，不是用来吓人的旗号——先问「我的分区时刻选哪边」，再问「平时我愿意付多少」，这两问分属下一幕的两个定理。'
  derivation: original
  canvas:
