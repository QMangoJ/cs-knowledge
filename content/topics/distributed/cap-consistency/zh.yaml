steps:
- id: what-consistency
  title: 不一致窗口：光跑海底光缆的那 100 毫秒里，两地看着两本账
  tldr: 东京刚把余额从 100 改成 0，同步消息还在海底光缆里飞往法兰克福的这段时间就是「不一致窗口」；一致性谱系不是数据本身的属性，而是读写协议对「允许读到多旧的数据」签下的不同价位契约。
  body: |-
    多副本系统的核心烦恼，全长在同步消息在路上飞的那段时间里。假设用户在东京主副本刚把账户余额从 100 元扣成 0 元，东京立刻把这条变更发往法兰克福从副本；光走海底光缆打个来回要 100 多毫秒，赶上网络排队落后两三秒更是家常便饭。就在这短短两三秒的「不一致窗口」里，东京读出来是 0 元，法兰克福读出来却还是 100 元——没有任何机器坏掉，同一份数据却在地球两端裂成了两个世界。

    既然跨机抄送总有时差，所谓「一致性档位」说穿了就是读写协议对外签下的服务契约：最严的契约承诺「对外像只有一台机器，写完立刻全网可见」；最松的契约只兜底「只要停下新写入，大家早晚会抄成一样，中间读到啥自己担着」。

    在工程代码里，这些档位并不是一个虚无缥缈的理论名词，而是存储驱动与中间件里实打实的配置参数——比如数据库连接的读写分离路由策略、每次查询带不带版本号标尺。同一套东京与法兰克福双副本，配上不同的读写规矩，就能卖出完全不同的档位和延迟价格。
