- id: spectrum-strong
  title: 谱系强端：线性一致，贵在每一程都要等齐
  tldr: 像只有一个副本：读永远读到最新——代价是协调开销跟着副本距离走，跨洲强一致意味着每次操作都背着往返延迟。
  body: '现在正式走谱系。最强一档是线性一致（linearizability）：系统对外表现得像只有一份数据，每个操作都像是某个瞬间原子地发生的，读操作只要发生在写完成之后，必读到那个写的值。它给编程模型的最大好处是心智简单：你脑子里那台单机的直觉，在这一档全部成立——刚写完就读得到、不存在读回旧值的惊悚时刻。

    价格与物理死死绑定：要让分布在各地的副本「像一个」，每次写都得在生效前与足够多的副本对齐，每次读也要确认自己拿的不是过期货。副本都在同机房时这笔钱还不大，往返不到一毫秒；副本一旦跨洲，每一程都是上百毫秒，强一致的吞吐与延迟会肉眼可见地变贵。这也是为什么全球级系统很少把整站数据都做成线性一致，而是只留给真正经不起错乱的那一小部分（账户余额、名额、锁）。

    谱系往下走之前插一句近义档：顺序一致（sequential consistency）比线性一致松一格——它只要求所有节点看到的操作顺序彼此一致，不要求这个顺序与真实时间完全吻合。对单线程的心智来说差别微妙，工程选型时通常直接在线性一致与下一档因果一致之间做决定，故这里只留个名字。'
  derivation: original
  sources:
  - ref: ddia
