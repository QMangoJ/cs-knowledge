- id: pacelc
  title: PACELC 补刀：平时那一半，才是日常的账
  tldr: 没有分区时，你仍然要为一致性付费——付在延迟上：每次写都等远端确认，还是先返回再慢慢同步？
  body: 'CAP 只规管分区时刻，可系统 99.99% 的时间没有分区，平时的取舍由谁规管？PACELC 给出了补完：若发生分区（if Partition），在可用性（A）与一致性（C）之间选；否则（Else），在延迟（L）与一致性（C）之间选。后半句才是运维日常：为了让读更新一些，你愿意给每次写加多少等待？

    场景具体得很：东京写完一条数据，要不要等法兰克福确认收到再对用户说「成功」？等，写延迟直接加上一个跨洲往返（百毫秒量级）；不等，写飞快返回，但法兰克福的用户几秒内读到的还是旧值。一台数据库的同步复制与异步复制、D1 主写之后边缘读要不要等书签，问的全是这道题。

    PACELC 的好处是把「一致性」从分区时刻的哲学问题，拉回平时的工程预算：强一致不是免费的美德，它的价格按每次操作、按毫秒持续扣费。你在复制课里见过的异步与半同步，正是这条轴上的两个档位——半同步就是肯付一程等待，换不一致窗口缩到最小。两个定理合起来才完整：CAP 管灾时，PACELC 管平时。'
  derivation: original
  canvas:
