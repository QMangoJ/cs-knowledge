- id: cap-accurately
  title: CAP 的准确含义：三个字母先对齐定义
  tldr: 先把这一分钟的场面摆出来：光缆断了，东京刚存下一个新值，法兰克福正好来了一个读请求——新值过不去，法兰克福只能拿旧值回，或者干脆拒绝。CAP 讲的就是这一分钟的事。这一步先把三个字母的定义说准：C 特指线性一致这一个档位，A 指每个请求都能得到正常回应，P 指网络分区确实可能发生这个事实前提。定义准了，才能看出 CAP 不是让系统平时就三选一的菜单题。
  body: >-
    CAP 定理流传最广，也被误读最广，所以先把三个字母的定义说准确。C 不是泛泛的「数据正确」，它特指一个具体档位：线性一致（linearizability）。意思是系统表现得好像只有一个副本，任何读都读到最近一次已完成写的结果，所有操作之间存在一个和真实时间吻合的全局顺序。A 指可用性：每个请求都能得到一个正常回应（不是报错），哪怕回应的内容是旧数据。P 指分区容忍：网络断成互不连通的几块时，系统还能继续工作。

    P 的地位要特别说一句：它不是可选项。只要系统跨机器部署，分区就可能发生——光缆会断，交换机要重启，跨机房链路会抖动——区别只在发生的频率和持续的时长。系统不能一遇到分区就整体停服，所以 P 是前提，不是选项。

    定理断言的是：当分区真的发生时，无法同时拥有线性一致和可用。把场面摆开就明白了：分区两侧无法通信，一侧刚收到了写，另一侧来了读。读的这一侧要么返回手里的旧值，这就牺牲了 C；要么拒绝服务，这就牺牲了 A——没有第三种可能。原因很朴素：新值在物理上就是过不来，读的一侧手里只有旧数据，它不可能凭空知道另一侧刚刚写了什么。这不是实现写得好不好的问题，而是信息根本没有到达。记住这个「当……时」的条件，它正是下一步纠正误读的钥匙。
  derivation: original
