  prev: 上一站作废了「状态一处」：副本天生有进度差。这一站把进度差标成价目表——先纠正 CAP 最常见的误读，再沿着一致性的谱系从强到弱走一遍。
  next: 谱系解决「容忍多旧」，可「谁是主」这类裁决容不下含糊：下一站让多台会死的机器商量出一个不可推翻的共同决定——选主、日志与多数派，一个部件都不能少。
title: CAP 与一致性谱系：分区时才做的那道选择题
summary: CAP 不是平时的三选二，而是分区发生的那段时间里二选一；真正日常的取舍在 PACELC 的另一半。之后沿强→因果→最终的谱系逐档标价，并回扣 MySQL 主从与 D1 的副本各站在哪一格。
premise: 以一份横跨两地的数据（东京是主、法兰克福是副本）为样本：海底光缆断掉的那十分钟，系统必须现场做一道选择题。
position: >-
  本课位于分布式系统本科的第二段「一致性的谱系」，接在为什么难之后：上一站说清副本必有进度差，这一站就把进度差做成一份价目表——CAP 到底在哪一刻逼你做选择、PACELC 补上了平时那一半、强弱各档一致性分别卖什么价。学完你能对任何一个多副本系统问出准确的问题：分区时它选哪边，平时它为一致性付多少延迟。
overview:
- key: 一句话总结
  value: CAP 的选择题只在分区发生时弹出；分区不存在时，C 与 A 可以兼得，日常要付的是延迟
- key: CAP 的 C
  value: 线性一致（linearizability）：系统表现得像只有一个副本，读永远读到最新写
- key: CAP 的 A
  value: 可用：每个请求都得到回应（哪怕内容是旧的），不以报错收场
- key: P 的地位
  value: 分区容忍不是可选项——网络会断是事实；真正的选择是分区期间偏 C 还是偏 A
- key: PACELC
  value: 补上平时：无分区（Else）时还要在延迟（Latency）与一致性之间选，这才是日常取舍
- key: 谱系
  value: 强（线性一致）→ 因果一致 → 最终一致；每往松里走一格，换回延迟与可用，前提是业务能消化那个档位的「乱」
- key: 选购原则
  value: 按数据逐个选：钱与库存往强端，点赞与计数往松端；最终一致的乱，用读己之写等会话保证打补丁
