- id: pacelc
  title: PACELC 补齐日常账：没断网时，你天天在拿延迟换新鲜度
  tldr: 系统 99.99% 的时间根本没断网，管这绝大部分日常的是 Daniel Abadi 提出的 PACELC 后半句：东京写完要不要干等 100 多毫秒让法兰克福收妥再返回？等就慢，不等就旧。
  body: |-
    平时光缆好端端的，真正每天在扣钱的是 Daniel Abadi 在 2012 年补上的 **PACELC 定理**：若发生分区（if Partition），在可用性（A）与一致性（C）间二选一；**否则（Else），在延迟（Latency）与一致性（Consistency）间二选一。** 后半句才是架构师天天算的日常账。

    回到东京与法兰克福的账本走一遍数字：用户在东京改完数据，主库落盘只要 1 毫秒，此刻要不要等法兰克福从库回执确认，才给前端弹窗「保存成功」？如果等（同步复制），每次写操作凭空多出 100 多毫秒跨洋往返——一个页面流程要是连写 10 次，光在海底光缆里干等就烧掉 1 秒多，写 100 次就是十几秒；如果不等（异步复制），东京毫秒级秒回，代价是接下来两三秒内法兰克福读到的全是旧值。

    你看，CAP 与 PACELC 并不是竞争对手，而是一张完整排班表的上下半场：CAP 管一年里偶发那几分钟断网事故怎么保命，PACELC 管平时每一秒、每一笔读写怎么在「快」和「新」之间付毫秒费。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: w
      id: w
      label: 写入方：在回复用户「写入成功」之前，要不要等远方副本确认？
    - lane: p
      id: p
      label: 东京（主副本）：数据已经落盘保存
    - lane: r
      id: r
      label: 法兰克福（远方副本）：确认消息还在路上，没有返回
      highlight: true
    messages:
    - id: m1
      from: p
      to: r
      label: 如果等法兰克福确认，延迟会增加 100ms 量级；如果不等就返回，法兰克福一段时间内会读到旧值
      active: true
    registers:
    - name: 平时之问
      value: 平时要权衡的是：为了更一致，愿意接受多高的延迟
    - name: 既有例子
      value: 前面讲过的异步复制和半同步复制，就是在这条权衡轴上的两个不同档位
  log:
  - mode: 平时
    event: 平时每次操作为一致性多付的延迟会累积起来，这部分才是日常成本的主要部分
- id: spectrum-strong
  title: 谱系最严档：线性一致对外像单机，代价是每趟都要跨网对表
  tldr: 线性一致承诺「写完返回那一刻起，全网任何角落立刻读出新值」，心智跟单机一样省心；但每次读写都得找多数副本对表，跨洲部署时每一跳都是上百毫秒真金白银的等待。
  body: |-
    把新鲜度拉到顶格就是**线性一致**（linearizability）：哪怕底下藏着东京、法兰克福、新加坡多份副本，系统对外表现得就像全世界只有唯一一份原件——你在东京把余额从 100 扣成 0 并收到成功提示，下一毫秒朋友在法兰克福刷新，看到的必须是 0，绝不允许闪现 100。这一档最大的诱惑是开发心智极简，单机编程时的直觉原封不动全成立。

    但顶格体验得按光速交顶格路费：要想让全球副本「像同一台机器」，不仅每次写入得等过半副本确认落盘，连每次读取都不能随便找手边副本瞎读，必须跟主库或多数派对表验明没有过期货。同机房往返不到 1 毫秒还付得起；一旦跨大洲，每次读写都得硬扛上百毫秒延迟，所以全球系统只把这一档省着留给账户余额、抢购名额与分布式锁。

    顺手辨析一个教材里常挨着它的近亲——**顺序一致**（sequential consistency）：它只要求所有节点看到的「操作先后剧本」是同一个版本，却不强求跟物理真实时刻对齐（比如你刚写完，别人紧接着读到旧值也算合法，只要大伙儿事后认同一个排列顺序就行）。真实工程选型很少卡在这半格上，要严就直接上线性一致，要省钱就直接退到下一档因果一致。
  derivation: original
  sources:
  - ref: ddia
    locator: 第 9 章 Consistency and Consensus（线性一致 linearizability 一节）
    claim: 线性一致让多副本系统表现得像只有一个副本：读能读到最近写的值；实现它需要副本间协调，其可用性与延迟代价随协调范围增长
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: p
      id: p
      label: 主副本：一次写要同步到足够多的副本后，才算真正完成
      highlight: true
    - lane: r
      id: r
      label: 远方副本：每一次来回确认所需的时间，都受光速决定的传播下限限制
    messages:
    - id: m1
      from: p
      to: r
      label: 承诺越强，每次操作就越需要花时间做副本间的协调
      active: true
    registers:
    - name: 承诺
      value: 这一档承诺的是，一次写只要已经完成，后面发生的读就一定能读到那次写的结果，不会读到更旧的值
    - name: 价格
      value: 这一档的价格是，副本之间每次都要协调，副本距离越远，一次协调需要等待的时间就越长，延迟也就越高
  log:
  - mode: 谱系·强
    event: 这一档最容易理解和使用，但实现代价也是各档里最高的
- id: spectrum-causal
  title: 谱系甜点档：因果一致只保「前因后果」，省掉无关操作的排队费
  tldr: 因果一致承诺「先发原帖、再回『同意楼主』」这类有因果依赖的操作绝不在任何副本颠倒顺序，至于两个陌生人各自发帖谁先露面则不管，用十分之一的协调开销挡住了用户真正在意的乱序。
  body: |-
    从线性一致往松退半步，就是性价比极高的**因果一致**（causal consistency）：凡是有「前因后果」关系的操作，全网所有人看到的先后顺序绝不能反；而彼此毫无瓜葛的并发操作，谁先刷出来都行。拿评论区一看就懂：甲在东京发了原帖，乙看到原帖后评论一句「同意楼主」——法兰克福的读者要么两篇都还没刷出来，要么先见原帖再见回复，绝不允许先蹦出一句孤零零的「同意楼主」让人一头雾水；至于东京的甲和纽约的丙同时各发一条无关动态，谁排上面晚几秒根本没人察觉。

    这一档之所以讨喜，是因为人类用户肉眼能抓包的系统抽风，十有八九全是因果颠倒：改完新密码立刻被旧密码放行、先撤回消息却后显示发送。把因果链锁死，用户体感的怪事就消除了大半；而底层系统不用再把全网所有毫不相干的写入拉到同一个独木桥上排队，只要随数据捎上一枚记录「我建立在哪些前置版本之上」的依赖标签（第 4 课的向量时钟干的就是这活），跨洲协调成本直接降了一个数量级。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: w
      id: w
      label: 用户：先发出原帖，之后才有人写回复
    - lane: r
      id: r
      label: 其他读者：看到时原帖必须在回复之前，顺序不能颠倒
      highlight: true
    messages:
    - id: m1
      from: w
      to: r
      label: 有因果关系的操作保持顺序，没有因果关系的操作不强制排序
      active: true
    registers:
    - name: 保什么
      value: 这一档保证的是，有因果关系的操作会按原来的因果顺序被所有人看到，比如原帖一定排在回复前面
    - name: 省什么
      value: 这一档省下的是，没有因果关系的操作不需要再做全局排序，因此也就省去了为无关操作付出的那部分协调成本
  log:
  - mode: 谱系·中
    event: 用户能明显察觉的不一致，大多是因果顺序被颠倒，这一档主要解决的就是这类问题
- id: spectrum-eventual
  title: 谱系最松档：最终一致读写飞快，但得靠 CRDT 合并冲突、靠会话补丁护体验
  tldr: 最终一致只兜底「停写后所有副本早晚抄成一样」，就近读写零等待——像极了前端的乐观更新；省下的钱要在两处补交：并发改同一份数据时靠合并规则（如 CRDT）收口，用户刷不出自己刚发的内容时靠「读己之写」打补丁。
  body: |-
    最宽松也最常见的一档叫**最终一致**（eventual consistency）：它对当下的新鲜度不做任何保证——短视频点赞数这一秒刷出 102、下一秒连到慢副本跳回 101 都算合规——唯一承诺的是「只要不再有新写入，所有副本最终会收敛成同一个值」。由于写请求落进手边任意一台副本就算成、读请求抓起最近一台就返回，跨机协调开销几乎为零，这跟前端开发里的「乐观更新」（点完赞先把本地 UI 数字加 1，后台慢慢发请求对齐）完全同构。

    但省下的协调费得在后面两处还账。第一处是**冲突合并**：用户在东京购物车加了牛奶，同时在法兰克福平板上加了鸡蛋，两边事后对账不能谁把谁盖掉。2011 年 Shapiro 等人系统化的 [[CRDT]]（无冲突复制数据类型）专门解决这类问题：把数据结构设计成满足交换律的合并（例如集合取并集，先加牛奶还是先加鸡蛋合出来都是牛奶加鸡蛋），不用中心裁判就能自动收敛。

    第二处是**会话保证补丁**：别人三秒前的点赞少算一个你根本不知道，但**你自己刚发出去的评论一刷新居然不见了**，你会当场骂系统吞帖。工程上用极低成本的「会话保证」单防这种尴尬：**读己之写**确保你总能看见自己刚提交的改动，**单调读**确保你的页面绝不倒退回更老的版本——只约束单个用户的连续视角，花小钱办大事。
  derivation: original
  sources:
  - ref: ddia
    locator: 第 5 章 Replication 与第 9 章（最终一致、收敛与读己之写、单调读等会话保证）
    claim: 最终一致只保证停止写入后副本最终收敛；并发写同一数据的冲突需要合并（如购物车取并集式的收敛）；读己之写与单调读是会话级的一致性保证
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: p
      id: p
      label: 副本甲：用户在购物车里加了牛奶
    - lane: r
      id: r
      label: 副本乙：同一时间用户在购物车里加了鸡蛋
      highlight: true
    messages:
    - id: m1
      from: p
      to: r
      label: 合并规则是取并集：两边加的商品都保留，牛奶和鸡蛋都不会丢
      active: true
    registers:
    - name: 承诺
      value: 停止写入之后，所有副本最终会收敛到相同的值
    - name: 两笔账
      value: 代价有两处：并发修改产生的冲突需要合并，用户体验问题需要用会话保证来缓解
  log:
  - mode: 谱系·弱
    event: 这一档协调成本最低，但需要在冲突合并和会话保证上额外花功夫
- id: examples-backref
  title: 真实系统对号入座：MySQL 主从、半同步与 D1 各站在哪一格
  tldr: MySQL 默认异步主从站在最终一致，业务常靠「付完款第一眼强读主库」手搓读己之写；半同步复制拿一程等待把丢账窗口压小，但仍不是线性一致；Cloudflare D1 则把强一致留给单主写入、把最终一致加会话书签留给全球边缘读。
  body: |-
    把谱系尺子贴回你天天打交道的三个真实系统，档位一眼就能看穿。先看最普遍的 **MySQL 异步主从**：东京主库写完日志立刻给用户回成功，法兰克福从库什么时候追上全看网络和负载——这是纯粹的最终一致。为了防住「用户刚付完款跳回订单页，读到慢从库显示未支付」的客诉，后端代码常给刚写完的请求打个标记，5 秒内的查询强制路由回主库，这就是手写的「读己之写」补丁。

    再看 **MySQL 半同步复制**，很多人会误问：「既然主库写完要等至少一个从库收妥日志才返回，是不是就升成线性一致了？」**并不是！** 半同步只是防住了主库猝死时丢掉刚提交的账（PACELC 里多付一程等待换数据安全），但客户端如果去读另一台还没追上的从库，照样会读出旧值，离线性一致还差着读路径对表那一关。

    最后看全球边缘数据库 **D1** 的巧劲组合：它规定所有写请求一律跨网回到唯一主副本串行执行（写路径守住单副本强心智），而在全球几百个边缘节点铺满只读副本（读路径享最终一致的低延迟）；每次响应头里给客户端发一枚记录「当前写到第几号日志」的会话书签（Bookmark），下次边缘节点接读请求时先瞄一眼书签，要是本地副本比书签还旧就等追平再返回——不花全局强一致的冤枉钱，照样把个人体验缝得严丝合缝。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: p
      id: p
      label: MySQL 主从：异步复制是最终一致，关键读走主库是手动实现的读己之写
    - lane: r
      id: r
      label: D1：写入都回到主副本、按强一致处理，读取就近走边缘副本、属于最终一致
      highlight: true
    messages:
    - id: m1
      from: p
      to: r
      label: 真实系统通常按写入面和读取面分别选档，而不是全站只用一个档位
      active: true
    registers:
    - name: 半同步的位置
      value: 半同步让不一致的时间窗口变小，但还没有达到线性一致的档位
    - name: 组合承诺
      value: 组合方式是：写入侧用强档，读取侧用较弱档，中间用会话保证保证单个用户的体验连贯
  log:
  - mode: 对照
    event: 看一个系统的复制说明时，先判断它的写入和读取分别处在谱系的哪个档位
- id: choosing
  title: 收官选档三问：默认走松档，只给赔不起的核心账升强档
  tldr: 给任何业务数据定档只需连问三句：读旧了赔不赔钱、跨区延迟给几毫秒、写冲突合不合得拢；工程黄金铁律是全站默认最终一致加会话补丁，只把余额和名额单独锁进强一致。
  body: |-
    拿到一张新业务表该定哪一档，不用凭感觉拍脑袋，挨个过完这**「选档三问」**答案自动浮现：
    1. **读到三秒前的旧值会赔真金白银吗？** 账户余额扣重、秒杀库存超卖会直接酿成资损事故，必须往线性一致推；视频点赞数、浏览量晚对齐十秒毫无投诉，果断放最终一致。
    2. **接口延迟预算给得起跨网往返吗？** 要是产品经理死卡全球用户 50 毫秒内响应，物理光速直接判了跨洲强一致死刑，只能收缩主库范围或改走边缘弱读。
    3. **两地同时改撞车了，代码能自动合并吗？** 购物车增删能靠 [[CRDT]] 取并集自动合拢，放弱档很安全；银行扣款一旦两边各扣一笔没法自动合账，天生得离弱档远一点。

    实战落地再送你一句口诀：**断网看 CAP 保命，平时看 PACELC 算账；全站默认松档配书签，唯独真金白银上强档。** 先从最终一致加读己之写起步，省下 90% 的延迟与机器成本，把昂贵的强一致好钢全砸在刀刃上。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: w
      id: w
      label: 选档时要问的三个问题：后果多严重？延迟预算多少？冲突好不好合并？
      highlight: true
    - lane: p
      id: p
      label: 余额和库存这类数据：应该偏向强一致档位
    - lane: r
      id: r
      label: 点赞和计数这类数据：可以偏向弱一致档位
    messages:
    - id: m1
      from: w
      to: p
      label: 先从较弱档位开始、遇到问题再加强，通常比一开始就用强档、之后再放松更节省成本
      active: true
    registers:
    - name: 元规则
      value: 基本原则是：默认先选较弱档位，如果出现业务不能接受的问题，再把这类数据升到更强档位
    - name: 下一站
      value: 下一站讨论不能容忍模糊答案的裁决问题，例如谁是主副本
  log:
  - mode: 选档
    event: 选档不是选立场，而是为每一类数据分别权衡后果和代价
minutes: 28
prereq:
- distributed/why-hard
objectives:
- 准确说出 CAP 三个字母的定义，并解释为何二选一只在网络分区期间触发
- 用 PACELC 算清无分区日常里「跨网等待延迟」与「数据新鲜度」的交换账
- 对比线性一致、因果一致与最终一致的承诺边界、开销与适用数据
- 标出 MySQL 异步/半同步复制与 Cloudflare D1 的档位，并用「选档三问」做实战定档
aiLink: 多地部署的大模型推理集群同样站在这条谱系上：新微调的权重文件要不要全球机房强同步完才切流、用户的多轮对话上下文粘在哪台节点、API 剩余额度计数走中心强扣还是边缘近似预扣，全是同一道选档题。
design:
- mechanism: 条件句式 CAP + PACELC：把「断网几分钟的预案」与「平时的毫秒账」拆开算
  problem: 把 CAP 简化成无条件「永远三选二」虽好背，却抹掉了「发生网络分区时」这个前提，误导不少工程师以为平时网络健康也非得在正确性和不报错之间二舍一。
  choice: 严格限定 C 为线性一致、把 P 还原为跨机部署的物理前提，再并排引入 PACELC——断网时按 CAP 选保 C 还是保 A，平时 99.99% 的日子按 PACELC 算愿意拿多少毫秒延迟换新鲜度。
  tradeoff: 准确表述比一句顺口溜啰嗦得多，评审沟通时每次都得先把「分区时」和「无分区时」两套语境掰开对齐。
  root: CAP 的本质是光缆断开时新信息物理上过不去，而 PACELC 的本质是光缆没断时信息跑过去也要花光速时间；两道物理约束分别统治故障态与日常态，缺一不可。
- mechanism: 分档混搭的一致性谱系：不设全局一刀切开关，按数据身价分别买单
  problem: 同一个应用里，账户余额读旧一秒会赔钱，点赞计数旧十秒无人关心；若全库锁死单一档位，要么替点赞白交跨洋协调费，要么让余额裸奔冒超卖险。
  choice: 把存储与路由做成可按表、甚至按读写方向拼装的档位谱系——像 D1 那样让写请求统一回主库排队保严，让读请求散到全球边缘节点就近取快。
  tradeoff: 开发人员必须时刻清楚手里操作的每个字段站在哪一档，一旦在代码里拿最终一致的旧查询结果去驱动强一致的扣款判断，就会埋下隐蔽的数据错乱。
  root: 强一致的代价直接绑定光速传播往返，属于永远无法靠堆硬件凭空变便宜的稀缺预算，只能像特护病房一样留给最娇贵的核心状态。
- mechanism: 会话保证补丁：只修单人视角的连贯性，不花全局同步的冤枉钱
  problem: 用户刷页面时几乎察觉不到陌生人的动态晚到了三秒，却会一眼抓包「我自己刚发的评论刷新没了」；若为了修这几处体感别扭就把整张评论表升为全局线性一致，无异于拿大炮打蚊子。
  choice: 在最终一致之上叠加「读己之写」与「单调读」会话补丁——客户端随身带一枚记录自己最后写入位置的书签，读副本只要追平这个位置即可放行，无需全网大对齐。
  tradeoff: 补丁只管得住带同一枚书签的当前会话；用户要是在手机上刚改完头像、立刻扭头看旁边没同步书签的电脑网页，还是有可能瞄见旧头像。
  root: 「数据一致」混杂了「全局绝对时序」和「个人操作因果连贯」两件成本悬殊的事；把后者单独拎出来用轻量的客户端位置标记解决，就能用百分之一的成本换回九成的顺滑体感。
terminal:
- cmd: sysbench 或你熟悉的压测工具对主从各读一次同一行
  note: 练习思路：连续写、立刻从从库读，统计有多少次读到旧值——把不一致窗口亲手量出来
