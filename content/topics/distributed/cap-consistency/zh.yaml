steps:
- id: what-consistency
  title: 先定义问题：多副本到底怕什么
  tldr: 副本之间同步需要时间，这段时间里同一份数据在不同地点有不同的值；一致性是关于「读能读到多旧、多乱」的一份契约。
  body: '上一站作废的四条假设里，最后一条是「状态一处」。数据一旦复制——为了容错、为了就近、为了分担读流量——它就同时存在于多台机器上，而同步消息再快也要时间。于是在任何一个瞬间，东京的副本可能已经是新值，法兰克福的还停留在三秒前。用户在两地读同一条数据，读到两个世界。

    一致性（consistency）讨论的就是这件事：系统对「读能读到什么样的值」给出什么承诺。最严的承诺是「像只有一个副本」：谁刚写完，所有人立刻读到新值，仿佛复制不存在。最松的承诺是「最终会一致」：中间读到什么都有可能，但只要不再写入，所有副本最后会对齐。中间还有好几档，各有各的价钱与适用面。

    先立一个视角：一致性不是数据的属性，而是契约的属性——同一套副本，配上不同的读写协议，就能给出不同档位的承诺（比如每次写都等所有副本确认，承诺就变强；写完主副本就返回，承诺就变弱）。所以后面谈谱系，谈的其实是协议的价目表：你愿意为「读得新」付多少延迟与可用性。本课最后会把这张价目表，贴回你已经学过的系统身上。'
