    event: CAP 是一个带条件的结论：只有在分区正在发生时，一致性和可用性才无法同时保证
- id: partition-moment
  title: 分区那十分钟：把选择题做一遍
  tldr: 把选择题真的做一遍。海底光缆断了，东京和法兰克福暂时通不上话，一件只剩两件的商品，两边各卖了两件。这一步看两种选法各自的账单：两边都继续接单，分区恢复后要处理两本对不上的账；只让一边继续写、另一边拒绝写，账永远只有一本，但当下就有一部分用户下不了单。两种选法都有代价，没有免费的选项。
  body: |-
    把定理落成一个具体场面。某个电商系统在东京和法兰克福各存了一份库存和订单数据。某天，海底光缆被挖断，分区开始，两边暂时联系不上。偏偏有一件商品只剩两件，东京这边卖了两件，法兰克福那边也卖了两件——库存一共两件，却收到了四件订单。

    如果分区期间选 A，也就是两边都继续接单：当下的账单是零，谁来买都能买。可等分区恢复、两边重新连上，就要合并两本账了：四件订单对着两件库存，超卖了两件。冲突会以业务事故的形式迟到登场——要道歉、要补偿，还要决定取消哪两笔订单。而哪笔订单该取消，是业务判断，不是数据库能替你做的判断，系统自动消化不了。

    如果选 C，也就是只允许一边继续写：比如规定东京是主，法兰克福在断联期间拒绝写。这样账永远只有一本，恢复之后没有冲突要合并。代价是法兰克福的用户在分区期间下不了单。现实里，银行核心账务多半选这条，社交和内容系统多半选前一条——取决于「事后处理冲突」和「当下拒绝用户」哪个更贵。这是业务上的定价，不是技术上的品味。
