    event: 这两种结果都不是系统出了故障，而是你事先选择优先保哪一边所对应的代价
- id: the-myth
  title: 破除「永远三选二」误读：没断网时 C 与 A 本就同在
  tldr: 把 CAP 背成「任何时候都只能三选二」是最害人的流行误读；只要光缆没断，系统完全可以既返回最新数据（C）又不报错（A），所谓 CP 与 AP 只是预案标签。
  body: |-
    面试和网文里最常见的口头禅是「CAP 三者永远只能选两个」，这话把定理的前提偷偷吞掉了。想一想：如果平时网络通畅的日子里也必须扔掉一项，那岂不是全世界的强一致数据库平时要么天天吐假账、要么天天报错拒客？现实里同机房健康的集群既能读到最新值，也正常响应每个请求——因为「网络分区」这个触发开关压根没合上。

    所以行话里常说的「[[CP 系统]]」和「[[AP 系统]]」，准确翻译是**「万一哪天网断了，它的应急预案准备牺牲哪一头」**，绝不是说它一年 365 天都瘸着一条腿。平时风平浪静时，两类系统都能稳稳当当地同时交付一致与可用。

    看穿这个误读能帮你省下大笔冤枉钱：不少团队误以为「选了 AP 系统平时就永远读不准」，吓得给文章阅读量、商品收藏数也硬上跨机房强同步重武器，一年到头没遇上几分钟断网，却在平时的每一次点击上白交了成百上千毫秒的等待税。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: p
      id: p
      label: 链路正常工作（当前没有分区）
      highlight: true
    - lane: r
