- id: cap-accurately
  title: CAP 只管断网那十分钟：新数据传不过去，放旧账还是报错拒客
  tldr: Eric Brewer 提出的 CAP 定理讲的其实就一件事：海底光缆断掉的那十分钟里，法兰克福收不到东京的新账，面对读请求只能要么返回旧值（弃 C 保 A），要么报错拒绝服务（弃 A 保 C）。
  body: |-
    CAP 定理讲的其实就一件事：网线断成两截的那十分钟里，被迫做的生死二选一。这一定理由 Eric Brewer 在 2000 年提出、Gilbert 与 Lynch 在 2002 年严格证明，先把三个字母抠准才不会跑偏：**C** 不是笼统的「账没算错」，而是特指最严苛的线性一致（写完之后全网任何角落立刻读到新值）；**A** 指可用性（每个发到健康节点的请求都必须拿到非报错的业务响应）；**P** 指分区容忍（网络断成互不连通的孤岛时系统不崩盘）。

    注意 **P 根本不是你能放弃的选项**。只要把机器摆进两个机柜或两座城市，光缆被施工挖断、核心交换机重启就是迟早会撞上的物理事实；宣称「我选 CA、不要 P」，等于宣布我只跑在一台单机上。

    把海底光缆断掉的现场摊开，定理的证明朴素得像大白话：东京刚把余额从 100 改成 0，光缆断着，消息物理上过不去；下一秒用户连上法兰克福查余额。法兰克福手里只有旧数字 100，它只有两条路可走——要么硬着头皮把旧值 100 回给用户（保住了响应 A，砸碎了线性一致 C）；要么直接弹窗报错「网络异常暂停查询」（保住了绝不吐假账的 C，牺牲了可用性 A）。代码写得再出神入化，也变不出第三条路。
  derivation: original
  sources:
  - ref: ddia
    locator: 第 9 章 Consistency and Consensus（CAP 定理与线性一致的讨论）
    claim: CAP 中的一致性指线性一致，分区发生时线性一致与可用性不可兼得；CAP 常被误读为任何时刻都要三选二，实际上只有在分区期间才被迫取舍
    status: verified
