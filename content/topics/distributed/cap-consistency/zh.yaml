- id: partition-moment
  title: 分区那十分钟：把选择题做一遍
  tldr: 海缆断掉，东京与法兰克福各成一国：继续收写的一方要事后合并冲突，拒绝写的一方要拿可用性付账——二选一没有免费项。
  body: '把定理落成一个场景。你的电商系统在东京与法兰克福各有一份库存与订单数据，某天海底光缆被挖断，分区开始。法兰克福的用户还在下单，东京的用户也在下单，同一件只剩两件的商品，两边各自卖了两件。

    若你在分区期间选 A（两侧都继续接单），可用性的账单当下为零，用户毫无察觉；但分区恢复时要合并两本账：四件订单、一件库存，冲突以业务事故的形式迟到登场——超卖、要道歉、要补偿。注意冲突不是系统自动能消化的：系统只知道两个版本都有「扣库存两件」，哪笔订单该取消是业务判断，不是数据库判断。

    若你选 C（只允许一侧继续写，比如规定东京为主、法兰克福在断联时拒绝写），账永远只有一本，不会有冲突；代价是法兰克福用户在分区期间下不了单，可用性当场打折。银行核心账务多半选这条，社交与内容系统多半选前条——选哪边取决于「事后冲突」与「当下拒绝」哪个更贵，这是业务定价，不是技术品味。'
