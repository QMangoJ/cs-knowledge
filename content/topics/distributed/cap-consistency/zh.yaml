bridge:
  prev: 上一课摊开了跨机协作的隐患清单，其中最常撞上的一条是「数据不再只有一份原件」：多台机器各存一份副本时，同步总有快慢。这一课就给副本之间的进度差明码标价——先还原 CAP 定理真正的触发条件，再从强到弱拆开一致性各档的承诺与账单。
  next: 一致性谱系回答的是「读到的数据能容忍旧到什么程度」，但碰到「眼下到底谁是主库」这类裁决问题，任何含糊都会导致双主写乱账。下一课就看 Raft 共识协议怎样靠任期、投票和多数派交集，让多台随时可能宕机的机器敲定唯一铁案。
title: CAP 与一致性谱系：分区时才做的那道选择题
summary: CAP 定理只管网络断开那几分钟里的生死二选一——要在「线性一致 C」和「可用性 A」之间舍弃一头；而在 99.99% 网络通畅的日常里，真正持续扣费的是 [[PACELC]] 后半句：为了让各地副本读得更新，每次写入愿意多等多少毫秒。本课顺着这条成本轴拆解线性一致、因果一致与最终一致，并标定 [[MySQL]] 主从与 [[D1]] 的真实站位。
premise: 同一本账户与库存账本同时放在东京（主副本）和法兰克福（从副本）两台服务器上，平时两边隔着海底光缆抄送更新，一趟来回就要 100 多毫秒。某天海底光缆被挖断整整十分钟，两边彻底失联：东京刚把仅剩的 2 件商品卖空、把余额 100 元扣成 0 元，同一秒法兰克福也有用户刷页面、点下单——此刻法兰克福手握几分钟前的旧账，该照常接单还是当场报错拒客？
position: 本课位于分布式系统板块第二段「一致性的谱系」，承接第一课「部分失败与光速延迟」。既然跨机副本的进度差受光速限制无法清零，系统就只能对「允许读出多旧的值」分档定规矩；学完后面对任何多副本存储，你都能用「断网保哪头、平时等几毫秒」两把尺子量准它的档位。
overview:
- key: 一句话总结
  value: CAP 的二选一只在网络分区期间触发；平时网络健康时一致性和可用性完全能兼顾，真正天天在付的账是「用多少毫秒等待换更小的新旧差」。
- key: CAP 的 C
  value: C 特指最严格的线性一致（linearizability），即多台机器对外表现得像只有一份原件——只要东京刚写完新值返回成功，下一毫秒哪怕从法兰克福去读，也必须读到最新值。
- key: CAP 的 A
  value: A 指每个发给非故障节点的请求都能拿到非报错的正常响应，哪怕响应里装的是几分钟前的旧库存。
- key: P 的地位
  value: 分区容忍 P 不是架构师能勾掉的可选项：只要机器跨网线部署，光缆被挖断、交换机重启迟早会发生，真正能选的只有断网那一刻保 C 还是保 A。
- key: PACELC
  value: 2012 年提出的 PACELC 补全了平时那 99.99% 的时间：分区时（P）在 A 和 C 之间选；没分区时（Else）在延迟（Latency）和一致性（Consistency）之间选。
- key: 谱系三档
  value: 从严到松依次是线性一致（像单副本，最贵）、因果一致（只保「先发帖后回帖」这类有来由的顺序，性价比高）、最终一致（停写后终会对齐，最快但要处理冲突合并与会话补丁）。
- key: 选购原则
  value: 按数据赔钱程度分档混搭：余额和名额走强档，点赞和浏览量走弱档，再给弱档贴上「读己之写」会话补丁消除用户刚改完自己却看不见的别扭感。
