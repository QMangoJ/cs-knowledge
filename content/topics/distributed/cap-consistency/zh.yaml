- id: examples-backref
  title: 回扣实例：三个熟系统的站位
  tldr: MySQL 异步主从是最终一致加手动补丁，半同步往强端挪了一格，D1 是主写强一致与边缘最终一致的拼图。
  body: '把价目表贴回熟系统，谱系立刻从概念变成读图能力。先看 MySQL 主从：异步复制时主库写完即返回，从库落后多少全看负载——这就是最终一致，承诺止步于「从库终将追上」。许多业务手动给它打补丁：用户下单后立刻看订单详情的那一次读，强制走主库——这正是读己之写的土法实现。

    半同步往强端挪了一格：写要等至少一个从库把日志收进中继日志才返回，不一致的窗口被压到很小，数据丢失的面也收窄；但它仍不是线性一致——从库的读仍可能落后于主库的最新提交。它的位置精确地落在 PACELC 的账上：每笔写付一程等待费，买回一段小得多的风险敞口。

    最后看 D1：写全部回到主所在的那一台、按序执行，写路径是单副本心智；读却可以从全球边缘的副本就近取，配会话书签保证你能读到自己至少写到的那个位置。这正是大厂系统的典型拼法：不给全站任何单一档位，而是按「写归一、读就近」拼出组合承诺——强一致留给写入点，最终一致留给读取面，中间用会话保证把用户体验缝上。'
