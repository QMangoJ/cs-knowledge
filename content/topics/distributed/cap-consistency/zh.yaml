- id: choosing
  title: 选档实务：三个问题问完再定钱花在哪
  tldr: 读到旧数据会出多大的事、延迟预算有多少、冲突合并的业务难度多大——答案决定每一类数据站在谱系哪一格。
  body: '收尾给一套可操作的选档法，三个问题依次问。第一问：读到旧或乱，后果多严重？余额少一位、库存卖超，是真金白银的事故，往强端放；点赞数差几个、评论晚出现三秒，用户根本无感，往松端放。后果定档位，这是总闸。第二问：延迟预算有多少？强一致的协调费随副本距离线性涨，若你的用户全球分布、又要求百毫秒返回，强端根本付不起，只能把强一致收缩到最小的那部分数据上。第三问：冲突合并做得动吗？购物车能取并集，文档能留双版本给用户挑；可银行账目没有「合并」这回事，两个版本并存就是事故——合不动的数据，天生就该离弱端远一点。

    三问之外还有一条元规则：先选最松、再按事故往强里调，而不是反过来。强一致是贵且难退的承诺（协议与延迟结构都会被它锁死），弱档位出问题时往上加补丁（关键读走主、加版本号、加会话保证）相对便宜得多。绝大多数互联网业务的最终形态，都是这条规则的结果：默认最终一致，少数热点数据被单独升舱。

    下一站换个问题：谱系解决的是「容忍多旧」，可有些事容忍不了任何含糊——比如「谁是主库」本身。裁决类问题需要所有人认同一个结果，那是共识的领地。'
