    registers:
    - name: 误读
      value: 误读的说法是，任何时候都必须在一致性、可用性和分区容忍三者里面选两个，好像平时也总要放弃一项
    - name: 正解
      value: 准确的理解是，只有在分区正在发生的期间，系统才被迫在一致性和可用性之间二选一，平时两者可以同时做到
  log:
  - mode: 纠偏
    event: 所谓 CP 或 AP 系统，说的是它在分区时倾向于牺牲哪一边，不是说它平时就缺少哪一边
- id: pacelc
  title: PACELC 补刀：平时那一半，才是日常的账
  tldr: 先算一笔具体的账：东京写完一条数据，要不要等法兰克福确认收到，再回复用户「成功」？等，一次跨洲往返一百多毫秒，写十次就多等一秒多；不等，回复飞快，但法兰克福的用户几秒内读到的还是旧值。CAP 管不了这笔账——它只管分区时刻，而系统 99.99% 的时间没有分区。管平时这笔账的，是 PACELC 的后半句。
  body: >-
    CAP 只规管分区时刻，可系统 99.99% 的时间没有分区，平时的取舍由谁规管？PACELC 给出了补充：若发生分区（if Partition），在可用性（A）和一致性（C）之间选；否则（Else），在延迟（L）和一致性（C）之间选。后半句才是运维日常：为了让读到的数据更新一些，你愿意给每次写加上多少等待？

    场景很具体。东京写完一条数据，要不要等法兰克福确认收到，再对用户说「成功」？等，写延迟直接加上一个跨洲往返，百毫秒量级；不等，写飞快返回，但法兰克福的用户几秒内读到的还是旧值。这个数算到底就知道为什么不能忽略：一次往返一百多毫秒，用户连续写十次、每次都等远方确认，光等待就烧掉一秒多；写一百次，就是十几秒。延迟是按操作次数一笔一笔累加的。

    同步复制和异步复制的区别、D1 在主副本写完之后边缘读要不要等书签，问的全是这道题。这里说的书签，可以理解成一个记录「你已经写到哪个位置」的标记：边缘副本在读之前先看一眼这个标记，确认自己至少已经同步到这个位置了，才把数据返回给你，这样你就不会读到比自己刚写的内容还旧的结果。

    所以强一致的价格，是按每次操作、按毫秒持续扣费的。复制课里讲的异步和半同步，正是这条轴上的两个档位——半同步就是肯付一程等待，换不一致窗口缩到最小。两个定理合起来才完整：CAP 说的是分区那几分钟，PACELC 说的是平时每一次操作。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: w
      id: w
      label: 写入方：在回复用户「写入成功」之前，要不要等远方副本确认？
    - lane: p
      id: p
      label: 东京（主副本）：数据已经落盘保存
    - lane: r
      id: r
      label: 法兰克福（远方副本）：确认消息还在路上，没有返回
      highlight: true
    messages:
    - id: m1
      from: p
      to: r
      label: 如果等法兰克福确认，延迟会增加 100ms 量级；如果不等就返回，法兰克福一段时间内会读到旧值
      active: true
    registers:
    - name: 平时之问
      value: 平时要权衡的是：为了更一致，愿意接受多高的延迟
    - name: 既有例子
      value: 前面讲过的异步复制和半同步复制，就是在这条权衡轴上的两个不同档位
  log:
  - mode: 平时
    event: 平时每次操作为一致性多付的延迟会累积起来，这部分才是日常成本的主要部分
- id: spectrum-strong
  title: 谱系强端：线性一致，贵在每一程都要等齐
  tldr: 先想象一个时刻：你在东京刚把昵称改好，法兰克福的朋友紧接着刷新——他必须看到新昵称，不能还是旧的。能给出这种保证的，就是最强的一档，线性一致：系统看起来像只有一份数据。代价是每次操作都要等副本之间对齐，副本离得越远越慢，跨洲时每一程都是上百毫秒。
  body: |-
    最强的一档是线性一致（linearizability）。它承诺的是：系统对外表现得像只有一份数据，每个操作都像是在某个瞬间一下子生效的；只要一次读发生在一次写完成之后，就必定读到那次写的值。它的最大好处是心智简单：单机上的直觉在这一档全部成立，不存在读到旧值的意外情况。

    价格和物理传播时间直接相关。要让各地的副本「像一个」，每次写在生效之前，都得和足够多的副本对齐；每次读，也要确认拿到的不是过期货。同机房时，一个往返不到一毫秒；副本一旦跨洲，每一程都是上百毫秒，吞吐和延迟肉眼可见地变贵。所以全球级系统很少把整站数据都做成线性一致，只留给经不起出错的那一小部分：账户余额、名额、锁。

    顺带说清一个近亲：顺序一致（sequential consistency）比线性一致松一格。它只要求所有节点看到的操作顺序彼此一致，不要求和真实时间完全吻合。差别举个例子就清楚了：你刚写完一个值，另一个人紧接着去读。线性一致要求他必须读到你刚写的值，因为在真实时间上，你的写已经完成了；顺序一致只要求大家最后看到的先后顺序是同一个版本，哪怕这个顺序和真实发生的先后差了一点，也算合格。工程选型通常直接在线性一致和下一档因果一致之间做决定，所以这里把区别说清之后，就不再单独展开这一档了。
  derivation: original
  sources:
  - ref: ddia
    locator: 第 9 章 Consistency and Consensus（线性一致 linearizability 一节）
    claim: 线性一致让多副本系统表现得像只有一个副本：读能读到最近写的值；实现它需要副本间协调，其可用性与延迟代价随协调范围增长
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: p
      id: p
      label: 主副本：一次写要同步到足够多的副本后，才算真正完成
      highlight: true
    - lane: r
      id: r
      label: 远方副本：每一次来回确认所需的时间，都受光速决定的传播下限限制
    messages:
    - id: m1
      from: p
      to: r
      label: 承诺越强，每次操作就越需要花时间做副本间的协调
      active: true
    registers:
    - name: 承诺
      value: 这一档承诺的是，一次写只要已经完成，后面发生的读就一定能读到那次写的结果，不会读到更旧的值
    - name: 价格
      value: 这一档的价格是，副本之间每次都要协调，副本距离越远，一次协调需要等待的时间就越长，延迟也就越高
  log:
  - mode: 谱系·强
    event: 这一档最容易理解和使用，但实现代价也是各档里最高的
- id: spectrum-causal
  title: 谱系中段：因果一致，只保住「有来由」的顺序
  tldr: 先看一个让人摸不着头脑的场面：你刷到一条回复，写着「同意楼主」，可往上翻，怎么也找不到它回复的那条原帖——回复跑到了原帖前面。因果一致管的就是这种颠倒：有因果关系的操作，顺序绝不能乱；没有因果关系的，谁先被看到都无妨。所以它不需要全局排序，协调成本低得多。
  body: |-
    把线性一致放松一点点，就是因果一致（causal consistency）：只保证有因果关系的操作，按因果顺序被所有人看到；没有因果关系的操作，也就是并发发生、互不相干的那些，顺序可以各行其是。直觉例子就是社交时间线：你先发原帖，别人再回帖，这条因果链，任何人刷到的顺序都不能颠倒；但两个互不相干的陌生人谁先发帖，你晚看到一分钟，毫无问题。

    这一档性价比高，是因为用户真正在乎的乱序，恰恰都是因果乱序：问答错位、回复抢跑、改完密码却还能用旧密码登录成功。把因果链保住，就消灭了用户能感知的大部分不一致。而系统这边，不必为无关操作付全局排序的钱，只需要追踪依赖关系——谁看到了谁之后才写——协调成本能降一个量级。

    因果追踪靠的是给每个版本带上「它见过哪些前序」的标记——这正是最后一课向量时钟要解决的问题。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: w
      id: w
      label: 用户：先发出原帖，之后才有人写回复
    - lane: r
      id: r
      label: 其他读者：看到时原帖必须在回复之前，顺序不能颠倒
      highlight: true
    messages:
    - id: m1
      from: w
      to: r
      label: 有因果关系的操作保持顺序，没有因果关系的操作不强制排序
      active: true
    registers:
    - name: 保什么
      value: 这一档保证的是，有因果关系的操作会按原来的因果顺序被所有人看到，比如原帖一定排在回复前面
    - name: 省什么
      value: 这一档省下的是，没有因果关系的操作不需要再做全局排序，因此也就省去了为无关操作付出的那部分协调成本
  log:
  - mode: 谱系·中
    event: 用户能明显察觉的不一致，大多是因果顺序被颠倒，这一档主要解决的就是这类问题
- id: spectrum-eventual
  title: 谱系弱端：最终一致，便宜的代价是学会合并与打补丁
  tldr: 先看一个没人会投诉的场面：同一个视频的点赞数，你这次刷新看到 102，下次刷新又变回 101，过一会儿才稳住。这就是最弱、也最常用的一档，最终一致：只保证停止写入之后，所有副本最终会变成相同的值；在此之前，读到旧值或者暂时对不上，是允许的。它便宜，但有两笔账要还：两地同时改同一份数据产生的冲突，要靠合并规则处理；用户刚写完就读不到的别扭，要用会话保证来补。
  body: |-
    最松、也最常用的一档是最终一致（eventual consistency）。它不承诺任何时刻的新鲜度，只承诺一件事：只要不再有新的写入，所有副本最终会收敛到相同的值。中间可以旧、可以乱：A 地读到第三版，B 地读到第一版，都在契约的容忍之内。它为什么便宜？原因是结构性的：写只需要落在任意一份副本上就生效，读随便找最近的副本，协调开销接近于零。于是可用性高、延迟低、扩展性也最好。

    但便宜不是免费，账记在两处。第一处是冲突合并：两份副本各自改了同一份数据，收敛时总要有人决定结果。化解的办法，是让合并操作可以交换顺序——比如购物车取并集：两地各加了几件商品，合并就是都算上，先加后加结果一样。这类专门设计成「不管按什么顺序合并、结果都一样」的数据结构，就是 [[CRDT]] 这一族方法要做的事：它把原本需要人工裁决的冲突，提前变成了数据结构自己就能算清楚的合并。

    第二处是体验补丁。用户刚提交一条评论，转头刷新却看不到，会觉得系统坏了。于是有会话保证，只约束单个用户的视角：读己之写，保证自己总能读到自己的写；单调读，保证不会越读越旧。这类保证便宜，却能补掉最扎眼的那几根刺。
  derivation: original
  sources:
  - ref: ddia
    locator: 第 5 章 Replication 与第 9 章（最终一致、收敛与读己之写、单调读等会话保证）
    claim: 最终一致只保证停止写入后副本最终收敛；并发写同一数据的冲突需要合并（如购物车取并集式的收敛）；读己之写与单调读是会话级的一致性保证
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: p
      id: p
      label: 副本甲：用户在购物车里加了牛奶
    - lane: r
      id: r
      label: 副本乙：同一时间用户在购物车里加了鸡蛋
      highlight: true
    messages:
    - id: m1
      from: p
      to: r
      label: 合并规则是取并集：两边加的商品都保留，牛奶和鸡蛋都不会丢
      active: true
    registers:
    - name: 承诺
      value: 停止写入之后，所有副本最终会收敛到相同的值
    - name: 两笔账
      value: 代价有两处：并发修改产生的冲突需要合并，用户体验问题需要用会话保证来缓解
  log:
  - mode: 谱系·弱
    event: 这一档协调成本最低，但需要在冲突合并和会话保证上额外花功夫
- id: examples-backref
  title: 回扣实例：三个熟系统的站位
  tldr: 先看一个你天天遇到的时刻：下单成功，立刻点进订单详情——如果这一眼读的是还没追上的从库，订单就像不存在一样。很多系统为这一下专门规定「下单后的第一次读走主库」。这一步就把价目表贴回你熟悉的系统：MySQL 异步主从属于最终一致，半同步往强端挪了一格，D1 则是组合用法，写入按强一致处理，读取走最终一致。
  body: |-
    先看 MySQL 主从。异步复制时，主库写完立刻返回，从库落后多少全看负载——这就是最终一致，承诺止步于「从库终将追上」。许多业务会自己手动打补丁：用户下单后立刻看订单详情的那一次读，强制走主库。这正是读己之写的手动实现。

    半同步往强端挪了一格：写要等至少一个从库把日志收进中继日志，才返回。不一致窗口压得很小，但它仍不是线性一致——从库的读，仍可能落后于主库的最新提交。它落在 PACELC 的账上：每笔写付一程等待费，换来小得多的不一致窗口和风险。

    D1 则是典型的拼法：写全部回到主所在的那一台、按顺序执行，写路径就是单副本的心智；读从全球边缘副本就近取，再配上会话书签，保证你能读到自己至少写到的那个位置。强一致留给写入点，最终一致留给读取面，中间用会话保证把体验缝上。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: p
      id: p
      label: MySQL 主从：异步复制是最终一致，关键读走主库是手动实现的读己之写
    - lane: r
      id: r
      label: D1：写入都回到主副本、按强一致处理，读取就近走边缘副本、属于最终一致
      highlight: true
    messages:
    - id: m1
      from: p
      to: r
      label: 真实系统通常按写入面和读取面分别选档，而不是全站只用一个档位
      active: true
    registers:
    - name: 半同步的位置
      value: 半同步让不一致的时间窗口变小，但还没有达到线性一致的档位
    - name: 组合承诺
      value: 组合方式是：写入侧用强档，读取侧用较弱档，中间用会话保证保证单个用户的体验连贯
  log:
  - mode: 对照
    event: 看一个系统的复制说明时，先判断它的写入和读取分别处在谱系的哪个档位
- id: choosing
  title: 选档实务：三个问题问完再定钱花在哪
  tldr: 假设你面前摆着两类数据要定档：账户余额和视频点赞数。凭感觉拍不行，这一步给出三个可以依次问的问题：读到旧数据后果多严重？延迟预算有多少？两地同时改时，冲突在业务上好不好合并？三个答案出来，这类数据该选强档还是弱档，也就出来了。
  body: |-
    选档时，三个问题依次问。第一问：读到旧的、或者乱的，后果有多严重？余额少一位、库存卖超，是真金白银的事故，往强端放；点赞数差几个、评论晚出现三秒，用户无感，往松端放。这是总闸，先过这一问。

    第二问：延迟预算有多少？强一致的协调费随副本距离线性上涨：用户遍布全球、又要求百毫秒内返回时，强端根本付不起，只能把强一致收缩到最小的那部分数据。第三问：冲突合并做得动吗？购物车能取并集，文档能留两个版本给用户挑；银行账目没有「合并」这回事，两个版本并存就是事故——合不动的数据，天生该离弱端远一点。

    最后一条元规则：先选最松的，再按事故往强里调。强一致是贵、而且难退的承诺；弱档位出了问题，往上加补丁相对便宜——关键读走主库、加版本号、加会话保证。绝大多数互联网业务的最终形态都是这样：默认最终一致，少数热点数据单独升到更强的档位。

    下一站换个问题：谱系解决的是「能容忍数据有多旧」，可有些事容忍不了任何含糊——比如「谁是主库」本身。裁决类问题需要所有人认同一个结果，那是共识的领地。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: w
      id: w
      label: 选档时要问的三个问题：后果多严重？延迟预算多少？冲突好不好合并？
      highlight: true
    - lane: p
      id: p
      label: 余额和库存这类数据：应该偏向强一致档位
    - lane: r
      id: r
      label: 点赞和计数这类数据：可以偏向弱一致档位
    messages:
    - id: m1
      from: w
      to: p
      label: 先从较弱档位开始、遇到问题再加强，通常比一开始就用强档、之后再放松更节省成本
      active: true
    registers:
    - name: 元规则
      value: 基本原则是：默认先选较弱档位，如果出现业务不能接受的问题，再把这类数据升到更强档位
    - name: 下一站
      value: 下一站讨论不能容忍模糊答案的裁决问题，例如谁是主副本
  log:
  - mode: 选档
    event: 选档不是选立场，而是为每一类数据分别权衡后果和代价
minutes: 28
prereq:
- distributed/why-hard
objectives:
- 用准确的定义复述 CAP：线性一致、可用、分区容忍，并说清选择只在分区期间发生
- 用 PACELC 补全平时的一半：无分区时在延迟与一致性之间选
- 从强到弱说出谱系各档的承诺、价格与典型场景
- 给出 MySQL 主从、半同步、D1 在谱系上的站位，并按三问法为一类数据选档
aiLink: 模型推理服务同样在谱系上选位：多地部署的模型副本要不要实时同步到同一版本、用户会话粘在哪一台、限流计数要全网强一致还是各自近似——选法与本课完全同构。
design:
- mechanism: 为什么把 CAP 讲成「条件句」而不是「菜单」，是理解一切副本系统的前提
  problem: 根本约束在定理的逻辑形式本身：它是一个带前提的结论——「若分区发生、并且仍要保持可用，就不可能有线性一致」。前提不触发时，结论就不适用。如果讲成无条件的三选二，等于把前提抹掉，让设计者在根本没有分区的日子里，也以为自己必须牺牲点什么。
  choice: 做法是在定义上严格限定：C 只指线性一致这一个档位；P 讲成事实前提，而不是一个选项；再把 CAP 和 PACELC 并排呈现——CAP 管分区那几分钟，PACELC 管平时每一次操作的延迟预算。
  tradeoff: 代价是讲解和心智都变贵：精确的版本远没有「三选二」朗朗上口，沟通时要用更长的句子、更多的限定词。
  root: 根本原因在于，定理证明的就是信息传不过去时的限制：分区时，新值在物理上无法到达断开的另一侧。CAP 不是关于设计品味的宣言，而是关于信息传播存在物理界限的结论。
- mechanism: 为什么一致性要做成一条谱系，而不是一个「强/弱」开关
  problem: 根本约束是数据价值不一样：余额和点赞数对「读错」的耐受，差了几个数量级。如果只有一档全局一致性，要么给点赞数付余额的协调费，要么让余额冒点赞数的险，两种都是系统性的错配。
  choice: 做法是把一致性做成可选的档位，还能组合：按数据类别、甚至按读和写分别定档；强档收窄到最小的集合，其余用弱档加会话保证打补丁。D1 就是代表：写全部回到主副本，读分散到各地的边缘副本。
  tradeoff: 代价是语义变复杂：开发者必须随时清楚自己脚下这块数据是哪一档，跨档位的组合推理容易出错，文档和测试的负担也跟着上升。
  root: 根本原因在于，一致性的代价来自副本之间的消息传播：传播需要时间，承诺越强，就越要为每次操作等待传播完成。而传播速度有光速决定的上限，突破不了，所以强一致只能当作稀缺资源，只分配给最不能出错的那部分数据。
- mechanism: 为什么给最终一致打补丁用「会话保证」，而不是整体升档
  problem: 根本约束是感知的不对称：用户能察觉的不一致，几乎全部发生在他自己刚做过的操作上——刚发的评论看不到、刚改的资料读回来还是旧值。别人三秒前的数据新不新，他无从比较。为了这几个局部问题给全系统升强档，是拿全局的钱补局部的洞。
  choice: 做法是把保证收窄到会话视角：读己之写、单调读、写跟随读，只约束「同一个用户的连续操作」。成本低得多——会话内记住自己写到了哪，读的时候不低于这个位置即可——却能灭掉用户实际抱怨的绝大部分不一致。
  tradeoff: 代价是保证有覆盖边界：换设备、清缓存、会话标识丢失，补丁就会漏。比如手机上改了头像，电脑上看到的还是旧的，补丁管不着，只能靠缩短同步延迟来缓解。
  root: 根本原因在于，「一致性」这个词同时装了两种不同的需求：一种是数据在全局范围内的真实顺序，另一种是单个用户自己操作前后的连贯感知。前者实现代价高、多数场景并不需要；后者代价低，却直接影响用户体验。把两者分开选档，才能把成本花在用户真正能感知到的地方。
terminal:
- cmd: sysbench 或你熟悉的压测工具对主从各读一次同一行
  note: 练习思路：连续写、立刻从从库读，统计有多少次读到旧值——把不一致窗口亲手量出来
