      to: w
      label: 新值传不到法兰克福：读请求只能返回旧值，或者拒绝服务，二者选一
      active: true
    registers:
    - name: C
      value: 线性一致：系统看起来像只有一个副本，读应读到最新写
    - name: A
      value: 每个请求都能得到正常回应，不用报错拒绝
    - name: P
      value: 网络分区可能发生，这是前提，不是可选项
  log:
  - mode: 定义
    event: CAP 是一个带条件的结论：只有在分区正在发生时，一致性和可用性才无法同时保证
- id: partition-moment
  title: 分区那十分钟：把选择题做一遍
  tldr: 例如海底光缆断掉后，东京和法兰克福暂时无法通信：如果两边都继续接单，分区恢复后就要处理两边账目不一致的冲突；如果只让一边继续写、另一边拒绝写，当下就会有一部分用户无法下单。两种选法都有代价，没有免费的选项。
  body: |-
    把定理落成一个场景。电商系统在东京与法兰克福各有一份库存与订单数据，某天海底光缆被挖断，分区开始。同一件只剩两件的商品，两边各自卖了两件。
    若分区期间选 A（两侧都继续接单），可用性的账单当下为零；但分区恢复时要合并两本账：四件订单、一件库存，冲突以业务事故的形式迟到登场——超卖、要道歉、要补偿。哪笔订单该取消是业务判断，不是数据库判断，系统自动消化不了。
    若选 C（只允许一侧继续写，比如东京为主、法兰克福断联时拒绝写），账永远只有一本；代价是法兰克福用户在分区期间下不了单。银行核心账务多半选这条，社交与内容系统多半选前条——取决于「事后冲突」与「当下拒绝」哪个更贵，这是业务定价，不是技术品味。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: w
      id: w
      label: 两地用户：分区期间都还在继续下单
    - lane: p
      id: p
      label: 东京侧：卖了 2 件
    - lane: r
      id: r
      label: 法兰克福侧：也卖了 2 件
      highlight: true
    messages:
    - id: m1
      from: p
      to: r
      label: 库存总共只有 2 件，却产生了 4 件订单：分区恢复时，这两本账要怎么合并？
      active: true
    registers:
    - name: 选 A 的账
      value: 选可用性：分区期间用户可以照常下单，但恢复后要处理超卖等冲突
    - name: 选 C 的账
      value: 选一致性：分区期间一侧用户会被拒绝下单，但恢复后只有一本账、没有冲突要合并
  log:
  - mode: 分区
    event: 这两种结果都不是系统出了故障，而是你事先选择优先保哪一边所对应的代价
- id: the-myth
  title: 纠正「平时三选二」：没分区的世界里 C 与 A 同在
  tldr: 常见的说法「一致性、可用性、分区容忍三者永远只能选两个」是误读：很多系统在没有分区时，既能给出一致的读结果，也能正常回应所有请求。
  body: |-
    流传很广的通俗版本把 CAP 讲成一道永远的菜单题：任何分布式系统都要在三个字母里扔掉一个。照此讲法，一个平时在单机房、网络健康的系统也必须牺牲一致性或可用性——这与日常经验冲突：数据库集群平时既给出强一致的读，请求也从不报错。它们没有违反定理，因为定理的条件根本没有触发：没有分区。
    准确的重述是：分区发生的那段时间里，可用与线性一致不可兼得；没有分区时，两者可以兼得。所以「CP 系统」「AP 系统」的准确读法是「它在分区时倾向于牺牲哪一边」，而不是「它平时就缺少哪一边」，差别只在断网的那几分钟里现形。
    误读会导出错误的设计恐慌：有人以为「选了 AP 就永远读不到自己的写」，从而给点赞计数、浏览量这类不需要强一致的场景也上重型协议，白白付掉延迟与运维成本。先问「分区时刻选哪边」，再问「平时愿意付多少」。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: p
      id: p
      label: 链路正常工作（当前没有分区）
      highlight: true
    - lane: r
      id: r
      label: 各副本之间的同步正在顺畅进行
    messages:
    - id: m1
      from: p
      to: r
      label: 此时没有触发 CAP 的条件，一致性和可用性可以同时做到
      active: true
    registers:
    - name: 误读
      value: 误读的说法是：任何时候都必须三选二
    - name: 正解
      value: 准确理解是：只有分区期间，才被迫在一致性和可用性之间二选一
  log:
  - mode: 纠偏
    event: 所谓 CP 或 AP 系统，说的是它在分区时倾向于牺牲哪一边，不是说它平时就缺少哪一边
- id: pacelc
  title: PACELC 补刀：平时那一半，才是日常的账
  tldr: 即使没有分区，想让数据更一致也要付出代价，代价体现在延迟上：例如每次写入都等远方副本确认后才返回，延迟就会更高；先返回再慢慢同步，延迟低但一段时间内可能读到旧值。
  body: >-
    CAP 只规管分区时刻，可系统 99.99% 的时间没有分区，平时的取舍由谁规管？PACELC 给出补充：若发生分区（if
    Partition），在可用性（A）与一致性（C）之间选；否则（Else），在延迟（L）与一致性（C）之间选。后半句才是运维日常：为了让读更新一些，你愿意给每次写加多少等待？

    场景很具体：东京写完一条数据，要不要等法兰克福确认收到再对用户说「成功」？等，写延迟直接加上一个跨洲往返（百毫秒量级）；不等，写飞快返回，但法兰克福的用户几秒内读到的还是旧值。同步复制与异步复制、D1
    主写之后边缘读要不要等书签，问的全是这道题。

    强一致不是免费的美德，它的价格按每次操作、按毫秒持续扣费。复制课里的异步与半同步正是这条轴上的两个档位——半同步就是肯付一程等待，换不一致窗口缩到最小。两个定理合起来才完整：CAP 管灾时，PACELC 管平时。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: w
      id: w
      label: 写入方：在回复用户「写入成功」之前，要不要等远方副本确认？
    - lane: p
      id: p
      label: 东京（主副本）：数据已经落盘保存
    - lane: r
      id: r
      label: 法兰克福（远方副本）：确认消息还在路上，没有返回
      highlight: true
    messages:
    - id: m1
      from: p
      to: r
      label: 如果等法兰克福确认，延迟会增加 100ms 量级；如果不等就返回，法兰克福一段时间内会读到旧值
      active: true
    registers:
    - name: 平时之问
      value: 平时要权衡的是：为了更一致，愿意接受多高的延迟
    - name: 既有例子
      value: 前面讲过的异步复制和半同步复制，就是在这条权衡轴上的两个不同档位
  log:
  - mode: 平时
    event: 平时每次操作为一致性多付的延迟会累积起来，这部分才是日常成本的主要部分
- id: spectrum-strong
  title: 谱系强端：线性一致，贵在每一程都要等齐
  tldr: 线性一致让系统看起来像只有一个副本，写完成后读就能读到最新值；代价是副本之间每次都要协调，副本距离越远协调越慢，跨洲部署时每次操作都要承担跨洲往返的延迟。
  body: |-
    最强一档是线性一致（linearizability）：系统对外表现得像只有一份数据，每个操作都像是某个瞬间原子地发生的，读只要发生在写完成之后，必读到那个写的值。它的最大好处是心智简单：单机的直觉在这一档全部成立，不存在读到旧值的意外情况。
    价格与物理传播时间直接相关：要让各地的副本「像一个」，每次写都得在生效前与足够多的副本对齐，每次读也要确认拿的不是过期货。同机房时往返不到一毫秒；副本一旦跨洲，每一程都是上百毫秒，吞吐与延迟肉眼可见地变贵。所以全球级系统很少把整站数据都做成线性一致，只留给经不起错乱的那一小部分（账户余额、名额、锁）。
    近义的顺序一致（sequential consistency）比它松一格——只要求所有节点看到的操作顺序彼此一致，不要求与真实时间完全吻合；工程选型通常直接在线性一致与下一档因果一致之间做决定，故这里只留个名字。
  derivation: original
  sources:
  - ref: ddia
    locator: 第 9 章 Consistency and Consensus（线性一致 linearizability 一节）
    claim: 线性一致让多副本系统表现得像只有一个副本：读能读到最近写的值；实现它需要副本间协调，其可用性与延迟代价随协调范围增长
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: p
      id: p
      label: 主副本：一次写要同步到足够多的副本后，才算真正完成
      highlight: true
    - lane: r
      id: r
      label: 远方副本：每一次来回确认所需的时间，都受光速决定的传播下限限制
    messages:
    - id: m1
      from: p
      to: r
      label: 承诺越强，每次操作就越需要花时间做副本间的协调
      active: true
    registers:
    - name: 承诺
      value: 写完成之后，读一定能读到那次写的结果
    - name: 价格
      value: 副本距离越远，协调所需的延迟就越高
  log:
  - mode: 谱系·强
    event: 这一档最容易理解和使用，但实现代价也是各档里最高的
- id: spectrum-causal
  title: 谱系中段：因果一致，只保住「有来由」的顺序
  tldr: 例如回复不能出现在原帖之前：因果一致只保证有因果关系的操作不颠倒顺序，比如先发帖后回复的顺序不能乱；没有因果关系的两个操作谁先被看到都无妨，因此不需要全局排序，协调成本低得多。
  body: |-
    把线性一致放松一点点，就是因果一致（causal consistency）：只保证有因果关系的操作按因果顺序被所有人看到，并发操作顺序可以各行其是。直觉例子是社交时间线：你先发原帖、别人再回帖，这条因果链任何人刷到的顺序都不能颠倒；但两个互不相干的陌生人谁先发帖，你晚看到一分钟毫无问题。
    这一格性价比高，是因为用户真正在乎的乱序恰恰都是因果乱序：问答错位、回复抢跑、改完密码却用旧密码登录成功。保住因果链，就消灭了用户能感知的大部分不一致；系统也不必为无关操作付全局排序的钱，只需追踪依赖关系（谁看到了谁之后才写），协调成本降一个量级。
    因果追踪靠的是给每个版本带上「它见过哪些前序」的标记——这正是最后一课向量时钟要解决的问题。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: w
      id: w
      label: 用户：先发出原帖，之后才有人写回复
    - lane: r
      id: r
      label: 其他读者：看到时原帖必须在回复之前，顺序不能颠倒
      highlight: true
    messages:
    - id: m1
      from: w
      to: r
      label: 有因果关系的操作保持顺序，没有因果关系的操作不强制排序
      active: true
    registers:
    - name: 保什么
      value: 保证有因果关系的操作按原来的因果顺序被看到
    - name: 省什么
      value: 不需要为没有因果关系的操作做全局排序，因此省去这部分协调成本
  log:
  - mode: 谱系·中
    event: 用户能明显察觉的不一致，大多是因果顺序被颠倒，这一档主要解决的就是这类问题
- id: spectrum-eventual
  title: 谱系弱端：最终一致，便宜的代价是学会合并与打补丁
  tldr: 最终一致只保证一件事：停止写入之后，所有副本最终会变成相同的值；在此之前读到旧值或暂时不一致是允许的，需要业务能接受。两地同时修改同一数据产生的冲突，要靠可交换的合并规则处理；用户刚写完就读不到这类体验问题，则用会话保证来缓解。
  body: |-
    最松、也最常用的一档是最终一致（eventual consistency）：不承诺任何时刻的新鲜度，只承诺只要不再有新的写入，所有副本最终会收敛到相同的值。中间可以旧、可以乱，A 地读到第三版 B 地读到第一版，都在契约的容忍之内。它的便宜是结构性的：写只需落在任意一份副本上就生效，读随便找最近的副本，协调开销接近于零，于是可用性高、延迟低、扩展性最好。
    便宜不是免费，账记在两处。一处是冲突合并：两份副本各自改了同一数据，收敛时要有人决定结果。化解之道是让合并操作可交换——比如购物车取并集：两地各加了几件商品，合并就是都算上，先加后加结果一样，这类「怎么合都不出错」的数据结构（CRDT 一族）就是为此而生的。另一处是体验补丁：用户刚提交评论，转头刷新却看不到，会觉得系统坏了——于是有会话保证：读己之写（自己总能读到自己的写）、单调读（不会越读越旧），只约束单个用户的视角，便宜，却能补掉最扎眼的那几根刺。
  derivation: original
  sources:
  - ref: ddia
    locator: 第 5 章 Replication 与第 9 章（最终一致、收敛与读己之写、单调读等会话保证）
    claim: 最终一致只保证停止写入后副本最终收敛；并发写同一数据的冲突需要合并（如购物车取并集式的收敛）；读己之写与单调读是会话级的一致性保证
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: p
      id: p
      label: 副本甲：用户在购物车里加了牛奶
    - lane: r
      id: r
      label: 副本乙：同一时间用户在购物车里加了鸡蛋
      highlight: true
    messages:
    - id: m1
      from: p
      to: r
      label: 合并规则是取并集：两边加的商品都保留，牛奶和鸡蛋都不会丢
      active: true
    registers:
    - name: 承诺
      value: 停止写入之后，所有副本最终会收敛到相同的值
    - name: 两笔账
      value: 代价有两处：并发修改产生的冲突需要合并，用户体验问题需要用会话保证来缓解
  log:
  - mode: 谱系·弱
    event: 这一档协调成本最低，但需要在冲突合并和会话保证上额外花功夫
- id: examples-backref
  title: 回扣实例：三个熟系统的站位
  tldr: 用熟悉的系统对照：MySQL 异步主从属于最终一致，业务常靠手动指定读主库来补上读己之写；半同步比异步更接近强一致，因为写要等从库确认；D1 则是组合用法，写入集中到主副本保证强一致，读取就近走边缘副本属于最终一致。
  body: |-
    把价目表贴回熟系统。MySQL 主从：异步复制时主库写完即返回，从库落后多少全看负载——这就是最终一致，承诺止步于「从库终将追上」。许多业务手动打补丁：用户下单后立刻看订单详情的那一次读强制走主库——正是读己之写的土法实现。
    半同步往强端挪了一格：写要等至少一个从库把日志收进中继日志才返回，不一致窗口压到很小；但它仍不是线性一致——从库的读仍可能落后于主库的最新提交。它落在 PACELC 的账上：每笔写付一程等待费，买回一段小得多的风险敞口。
    D1 则是典型拼法：写全部回到主所在的那一台、按序执行，写路径是单副本心智；读从全球边缘副本就近取，配会话书签保证你能读到自己至少写到的那个位置——强一致留给写入点，最终一致留给读取面，中间用会话保证把体验缝上。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: p
      id: p
      label: MySQL 主从：异步复制是最终一致，关键读走主库是手动实现的读己之写
    - lane: r
      id: r
      label: D1：写入都回到主副本、按强一致处理，读取就近走边缘副本、属于最终一致
      highlight: true
    messages:
    - id: m1
      from: p
      to: r
      label: 真实系统通常按写入面和读取面分别选档，而不是全站只用一个档位
      active: true
    registers:
    - name: 半同步的位置
      value: 半同步让不一致的时间窗口变小，但还没有达到线性一致的档位
    - name: 组合承诺
      value: 组合方式是：写入侧用强档，读取侧用较弱档，中间用会话保证保证单个用户的体验连贯
  log:
  - mode: 对照
    event: 看一个系统的复制说明时，先判断它的写入和读取分别处在谱系的哪个档位
- id: choosing
  title: 选档实务：三个问题问完再定钱花在哪
  tldr: 为一类数据选档时依次问三个问题：读到旧数据会造成多严重的后果，能接受的延迟预算有多少，两地同时修改时的冲突在业务上好不好合并；这三个答案决定这类数据应该选强档还是弱档。
  body: |-
    选档法三个问题依次问。第一问：读到旧或乱，后果多严重？余额少一位、库存卖超是真金白银的事故，往强端放；点赞数差几个、评论晚出现三秒，用户无感，往松端放。这是总闸。第二问：延迟预算有多少？强一致的协调费随副本距离线性涨，用户全球分布又要求百毫秒返回时，强端根本付不起，只能把强一致收缩到最小的那部分数据。第三问：冲突合并做得动吗？购物车能取并集，文档能留双版本给用户挑；银行账目没有「合并」这回事，两个版本并存就是事故——合不动的数据天生该离弱端远一点。
    元规则是：先选最松、再按事故往强里调。强一致是贵且难退的承诺，弱档位出问题时往上加补丁（关键读走主、加版本号、加会话保证）相对便宜。绝大多数互联网业务的最终形态都是：默认最终一致，少数热点数据单独升到更强的档位。
    下一站换个问题：谱系解决「容忍多旧」，可有些事容忍不了任何含糊——比如「谁是主库」本身。裁决类问题需要所有人认同一个结果，那是共识的领地。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: w
      id: w
      label: 选档时要问的三个问题：后果多严重？延迟预算多少？冲突好不好合并？
      highlight: true
    - lane: p
      id: p
      label: 余额和库存这类数据：应该偏向强一致档位
    - lane: r
      id: r
      label: 点赞和计数这类数据：可以偏向弱一致档位
    messages:
    - id: m1
      from: w
      to: p
      label: 先从较弱档位开始、遇到问题再加强，通常比一开始就用强档、之后再放松更节省成本
      active: true
    registers:
    - name: 元规则
      value: 基本原则是：默认先选较弱档位，如果出现业务不能接受的问题，再把这类数据升到更强档位
    - name: 下一站
      value: 下一站讨论不能容忍模糊答案的裁决问题，例如谁是主副本
  log:
  - mode: 选档
    event: 选档不是选立场，而是为每一类数据分别权衡后果和代价
minutes: 28
prereq:
- distributed/why-hard
objectives:
- 用准确的定义复述 CAP：线性一致、可用、分区容忍，并说清选择只在分区期间发生
- 用 PACELC 补全平时的一半：无分区时在延迟与一致性之间选
- 从强到弱说出谱系各档的承诺、价格与典型场景
- 给出 MySQL 主从、半同步、D1 在谱系上的站位，并按三问法为一类数据选档
aiLink: 模型推理服务同样在谱系上选位：多地部署的模型副本要不要实时同步到同一版本、用户会话粘在哪一台、限流计数要全网强一致还是各自近似——选法与本课完全同构。
design:
- mechanism: 为什么把 CAP 讲成「条件句」而不是「菜单」，是理解一切副本系统的前提
  problem: 根本约束是定理的逻辑形式本身：它是一个带前提的蕴含——「若分区发生且仍要可用，则不可能有线性一致」——前提不触发时结论不适用。讲成无条件的三选二，等于抹掉前提，让设计者在没有分区的日子里也以为必须牺牲点什么
  choice: 做法是在定义上严格限定：C 限定为线性一致这一个档位，P 讲成事实前提而非选项，并把 CAP 与 PACELC 并排呈现——前者规管灾时那几分钟，后者规管平时每一次操作的延迟预算
  tradeoff: 代价是讲解与心智都变贵：精确版远没有「三选二」朗朗上口，沟通时要用更长的句子、更多的限定词
  root: 根本原因在于定理证明的就是信息传不过去时的限制：分区时新值在物理上无法到达断开的另一侧。CAP 不是关于设计品味的宣言，而是关于信息传播存在物理界限的结论
- mechanism: 为什么一致性要做成一条谱系，而不是一个「强/弱」开关
  problem: 根本约束是数据价值的异质性：余额与点赞数对「读错」的耐受差了几个数量级，若只有一档全局一致性，要么给点赞数付余额的协调费，要么给余额冒点赞数的险，都是系统性错配
  choice: 做法是把一致性做成可选档位与组合：按数据类别、甚至按读写面分别定档，强档收窄到最小集合，其余用弱档加会话保证打补丁。D1 式的「写归一、读分布」就是代表
  tradeoff: 代价是语义复杂化：开发者必须随时清楚脚下这块数据是哪一档，跨档位的组合推理容易出错，文档与测试的负担同步上升
  root: 根本原因在于一致性的代价来自副本间消息传播：传播需要时间，承诺越强，就越要为每次操作等待传播完成。在光速决定的传播上限无法突破的情况下，强一致只能作为稀缺资源，只分配给最不能出错的那部分数据
- mechanism: 为什么给最终一致打补丁用「会话保证」，而不是整体升档
  problem: 根本约束是感知的不对称：用户能察觉的不一致，几乎全部发生在他自己刚做过的操作上——刚发的评论看不到、刚改的资料读回旧值；别人三秒前的数据新不新，他无从比较。给全系统升强档，是拿全局的钱补局部的洞
  choice: 做法是把保证收窄到会话视角：读己之写、单调读、写跟随读只约束「同一个用户的连续操作」，成本低得多（会话内记住自己写到哪、读时不低于这个位置即可），却能灭掉用户实际抱怨的绝大部分不一致
  tradeoff: 代价是保证有覆盖边界：换设备、清缓存、会话标识丢失，补丁就会漏——手机上改了头像、电脑上看到旧的，补丁管不着，只能靠缩短同步延迟缓解
  root: 根本原因在于「一致性」这个词同时包含了两种不同需求：一种是数据在全局范围内的真实顺序，另一种是单个用户自己操作前后的连贯感知。前者实现代价高、多数场景并不需要，后者代价低却直接影响用户体验。把两者分开选档，才能把成本花在用户真正能感知到的地方
terminal:
- cmd: sysbench 或你熟悉的压测工具对主从各读一次同一行
  note: 练习思路：连续写、立刻从从库读，统计有多少次读到旧值——把不一致窗口亲手量出来
