steps:
- id: what-consistency
  title: 先定义问题：多副本到底怕什么
  tldr: 先看一个具体的别扭时刻：东京刚写入新值，法兰克福还没同步到，这段时间里，同一份数据在两地读出两个结果。一致性要讨论的，就是系统愿意对「读可能读到多旧、多不一致的数据」做出什么样的明确承诺。
  body: |-
    先看一个具体时刻。你在东京刚把一条数据改成新值，法兰克福那台机器还没收到同步消息，手里还是三秒前的值。这时有人在东京读，读到新值；有人在法兰克福读，读到旧值——同一份数据，读出两个世界。这不是谁出了故障：东京到法兰克福的消息走海底光缆，一个来回就要一百多毫秒，中间要是再赶上排队、重试或者网络拥堵，落后几秒钟也是常有的事。从写入完成到所有副本都跟上的这段时间，有个名字，叫不一致窗口，后面会反复提到。

    数据为什么会同时存在于多台机器上？为了容错，为了让用户就近读得更快，也为了分担读流量——上一站说过，四条单机假设里最后一条「状态只存放在一处」，就是在这里被打破的。副本一多，进度差就躲不掉，于是就有了这一课的问题：一致性（consistency）讨论的，是系统对「读能读到什么样的值」给出什么承诺。最严的承诺是「像只有一个副本」：谁刚写完，所有人立刻读到新值。最松的承诺是「最终会一致」：中间读到什么都有可能，但只要不再写入，所有副本最后会对齐。中间还有好几档，各有各的价钱和适用场面。

    还有一件事要先说清：一致性说的不是数据本身，而是系统给出的承诺。同一套副本，配上不同的读写协议，就能给出不同档位的承诺。所以这条谱系谈的其实是协议的价目表：你愿意为「读得新」付出多少延迟、多少可用性，后面每一档都会标出来。
