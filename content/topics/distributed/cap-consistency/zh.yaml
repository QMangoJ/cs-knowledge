license: CC-BY-4.0
bridge:
  prev: 上一站说明了一个事实：同一份数据放在多台机器上时，各副本的进度天生会有差别。这一站把这种差别具体化——先说清 CAP 到底在什么情况下才要求做选择，纠正最常见的误读，再从强到弱介绍一致性的各个档位分别承诺什么、代价是什么。
  next: 谱系回答的是「读到的数据可以旧到什么程度」；但像「谁是主副本」这类问题不能有模糊答案，必须只有一个大家都认的结果。下一站讲多台随时可能故障的机器如何共同做出一个不可推翻的决定，内容包括选主、日志复制和多数派原则。
title: CAP 与一致性谱系：分区时才做的那道选择题
summary: CAP 不是说系统平时就要在三项里放弃一项；它说的是只有当网络分区发生时，才必须在一致性和可用性之间选一边。平时没有分区时，真正的取舍是 PACELC 后半句讲的延迟与一致性。后面会从强到弱介绍线性一致、因果一致、最终一致各自的承诺和代价，并说明 MySQL 主从和 D1 的副本分别处在哪个档位。
premise: 以一份横跨两地的数据（东京是主、法兰克福是副本）为样本：海底光缆断掉的那十分钟，系统必须现场做一道选择题。
position: 本课位于分布式系统本科的第二段「一致性的谱系」，接在为什么难之后。上一站已经说明副本之间必然会有进度差，这一站进一步说明这种进度差会带来什么具体取舍：CAP 在什么时刻要求系统选边，PACELC 如何补充说明平时没有分区时的取舍，以及强弱不同的档位各自需要付出多少代价。学完后，面对任何一个多副本系统，你都能问出两个准确问题：发生分区时它优先保一致性还是可用性，平时它为了更一致愿意多等多少延迟。
overview:
- key: 一句话总结
  value: CAP 要求做选择，只发生在网络分区期间；没有分区时，一致性和可用性可以同时做到，这时日常需要权衡的是为了更一致要多付多少延迟
- key: CAP 的 C
  value: 线性一致（linearizability）：系统对外看起来像只有一个副本，任何读如果发生在一次写完成之后，就应该读到那次写的结果
- key: CAP 的 A
  value: 可用性：系统对每个请求都给出一个正常回应，不用报错来拒绝服务；但在分区时，这个回应里的内容可能是旧数据
- key: P 的地位
  value: 分区容忍不是一道可做可不做的选项：跨机器部署时网络总有可能断开，这是事实前提；真正要选的是分区期间优先保一致性还是优先保可用性
- key: PACELC
  value: PACELC 补充了 CAP 没讲的平时情况：没有分区（Else）时，系统还要在延迟（Latency）和一致性之间取舍——想让数据更新得更及时，通常就要接受更高的操作延迟，这才是日常最常见的权衡
- key: 谱系
  value: 一致性从强到弱依次是线性一致、因果一致、最终一致；档位越弱，系统通常延迟越低、可用性越高，但读到旧数据或暂时不一致的可能性也越大，只有业务能接受这种程度的不一致时才适合选弱档
- key: 选购原则
  value: 选档时要按数据类型分别决定：余额、库存这类错了代价大的数据偏向强档，点赞数、浏览计数这类晚几秒对齐也无妨的数据偏向弱档；如果选了最终一致，可以用读己之写等只针对单个用户会话的保证，减少用户刚写完就读不到的体验问题
