- id: spectrum-causal
  title: 谱系中段：因果一致，只保住「有来由」的顺序
  tldr: 回复不能跑到原帖前面去——只保证有因果关系的操作不乱序，无关的操作谁快谁慢无所谓；协调成本因此低得多。
  body: '把线性一致放松一点点，就是因果一致（causal consistency）：只保证有因果关系的操作按因果顺序被所有人看到，没有因果关系的操作（并发操作）顺序可以各行其是。这个档位的直觉例子是社交时间线：你先发了原帖、别人再回帖，这条因果链任何人刷到的顺序都不能颠倒——回帖先出现、原帖还没影，是惊悚的；但两个互不相干的陌生人谁先发帖，你晚看到一分钟毫无问题。

    为什么这一格性价比高？因为大部分真实业务里，用户真正在乎的乱序恰恰都是因果乱序：问答错位、回复抢跑、改完密码却用旧密码登录成功。保住因果链，就消灭了用户能感知的大部分不一致；而为了保住它，系统不必为无关操作付全局排序的钱，只需追踪依赖关系（谁看到了谁之后才写），协调成本随之降一个量级。

    实现机制预告一句：因果追踪靠的是给每个版本带上「它见过哪些前序」的标记——这正是最后一课向量时钟要解决的问题。谱系走到这一档，开始和「时间」那一课接壤了：不用墙上时钟，怎么把因果链精确地记下来，就是那一课的主菜。'
  derivation: original
