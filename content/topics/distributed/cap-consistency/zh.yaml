  log:
  - mode: 分区
    event: 这两种结果都不是系统出了故障，而是你事先选择优先保哪一边所对应的代价
- id: the-myth
  title: 纠正「平时三选二」：没分区的世界里 C 与 A 同在
  tldr: 你可能听过一句话：「一致性、可用性、分区容忍，三者永远只能选两个。」照这个说法，系统平时也得一直在三项里扔掉一项。这一步就来纠正这个流传最广的误读：很多系统在没有分区时，既能给出一致的读结果，也能正常回应所有请求——CAP 的选择题只在分区期间才出现。
  body: |-
    流传很广的通俗版本，把 CAP 讲成一道永远的菜单题：任何分布式系统，都要在三个字母里扔掉一个。可照这个讲法，一个平时待在单机房、网络健康的系统，也必须牺牲一致性或者可用性。这和日常经验对不上：数据库集群平时既能给出强一致的读，请求也从不报错。它们没有违反定理，因为定理的条件根本没有触发——没有分区。

    准确的说法是：分区发生的那段时间里，可用和线性一致不可兼得；没有分区时，两者可以兼得。所以「[[CP 系统]]」「[[AP 系统]]」这两个叫法，准确的读法是「它在分区时倾向于牺牲哪一边」，而不是「它平时就缺少哪一边」。差别只在断网的那几分钟里现形。

    误读会带来实实在在的损失。有人以为「选了 AP 就永远读不到自己的写」，于是给点赞计数、浏览量这类根本不需要强一致的场景也上重型协议，白白付掉延迟和运维成本。正确的问法是先问「分区时刻选哪边」，再问「平时愿意付多少」。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: p
      id: p
      label: 链路正常工作（当前没有分区）
      highlight: true
    - lane: r
      id: r
      label: 各副本之间的同步正在顺畅进行
    messages:
    - id: m1
      from: p
      to: r
      label: 此时没有触发 CAP 的条件，一致性和可用性可以同时做到
