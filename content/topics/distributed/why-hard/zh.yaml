steps:
- id: origins
  title: 分布式不是一开始就有的
  tldr: 先把来历捋清楚：最早的计算机只有一台机器、自己从头算到尾，分布式并不是一开始就有的。它是被三件事一步步逼出来的——一台机器算不过来、装不下；一台机器坏了，业务不能跟着停；用户和数据本来就分散在不同的地方。这一步讲这段演变，后面那些难处，都是这段来历的后果。
  body: |-
    最早的计算机是单机：一台大型机放在机房里，要算的活排队交给它，它自己从头算到尾，算完出结果。那时候没有「多台机器协作」这回事，数据在一处、时钟只有一个，机器坏了就全停，修好再接着算——这一课后面要讲的概念，在那个世界里一个都不存在。
    变化是被现实一步步推出来的。先是机器太贵：一台大型机价格高得吓人，大学和研究机构买不了几台，于是把分散在各地的机器用网络连起来共用，[[ARPANET]] 就是这样出现的，它后来慢慢长成了今天的互联网。接着个人电脑便宜了，企业不再供着一台大机器，而是摆很多台小机器分工：一台在前面接待用户，一台在后面专门存数据，客户机和服务器就此分家，多台机器协作干活成了企业里的日常。
    再往后，互联网把规模顶上了天：用户和数据涨到一台机器、甚至一个机房都装不下、算不完，用户还分散在全球各地，机器坏一台也不能让业务停摆。老办法不够用了，Google 把「用一大堆普通机器扛海量数据」做成了成套的方法：存文件有 [[GFS]]，批量计算有 [[MapReduce]]，存结构化数据有 [[Bigtable]]。这三篇论文公开之后，开源界照着做出了 [[Hadoop]]，这套做法从大公司的内部手艺，变成了全行业的通用做法。再到后来，云计算让机器变成随时能租、用完能退，服务也被拆成许多小服务分别部署、互相调用——多台机器协作，从少数大公司的难题，变成了今天写后端程序的默认环境。
    回头看这条线，每一步都是单机方案先撞了墙，才换上多台机器协作：算不过来、装不下，是一堵墙；一坏就全停，是一堵墙；用户离得太远，又是一堵墙。协作确实把这些事办成了，但代价紧跟着就来——机器一多，在一台机器里根本不用操心的事，全都要重新操心。下一步就看代价的第一笔：单机世界里暗中成立的四条假设，出了这台机器会怎样。
