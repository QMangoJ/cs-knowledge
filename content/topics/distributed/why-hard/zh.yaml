- id: dead-or-slow
  title: 分不清死与慢：超时的两难
  tldr: 没回音的三种可能——对方死了、对方在忙、信还在路上——观察上一模一样；超时值设多长，都是拿一种错换另一种错。
  body: '把部分失败放大看，核心是一道无解的判别题：对面没回音，到底发生了什么？可能性至少有三种：对方进程崩了；对方活着，但正被一波流量压得喘不过气，或者被一次长时间的垃圾回收暂停冻住；又或者双方都没事，只是网络拥堵，信还在路上慢慢爬。三种情形在你这端的观察完全相同：都是沉默。

    工程上唯一的武器是超时：等过某个时限还没回音，就当对方死了，改走备用路径。可这个时限没有正确值，只有价格：设得短，对方只是慢了三秒就被你判死刑，流量切走、它随后恢复，系统白折腾一轮，还可能因为误杀好节点引发连锁切换；设得长，真正的尸体要等很久才被发现，这段时间里请求全都卡在它身上，用户先一步离开。

    更深一层的原因在物理上：网络延迟没有上限。一条消息在拥堵、重试、排队之下可以迟到任意久，所以「等足够久总能等到」在理论上成立、在业务上无意义——你等不起。超时因此注定是一次赌博：赌的是在你的业务里，误杀的代价与迟杀的代价哪个更贵。后面每一课里出现的超时参数，都是这场赌博在不同位置的下注。'
  derivation: original
  canvas:
