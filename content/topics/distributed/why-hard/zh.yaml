    event: 局部理性的重试，叠加成全局的雪崩——分布式要防的常是这种合成谬误
- id: failure-detectors
  title: 证据都是二手的：故障检测只能是概率
  tldr: 心跳只能证明「它刚才还活着」；把心跳缺失翻译成死亡判决的那条阈值线，画在哪里都是取舍。
  body: '既然分不清死与慢，系统总得有个机制定期给同伴「测存活」：故障检测（failure detector）。最常见的形态是心跳：节点周期性地互相报一声平安，连续几声没听到，就把对方标记为疑似死亡，触发切换或摘除。听着合理，可把每个环节拆开看，全是概率：心跳走的还是那条会迟到的网络，一次没听到可能只是拥堵；就算对方真死了，你得知消息的那一刻，它也已经死了有一阵了。

    成熟的做法干脆承认概率：不输出「死/活」的二值结论，而是输出一个怀疑度——心跳越久没来，怀疑度涨得越快，上层按自己业务的代价去选在怀疑度多高时动手。这类按统计规律累积怀疑的检测器（如 phi 累积故障检测器），把「判决阈值」这件本该由业务出价的事，还给了业务本身。

    请把这一点与前面的课串起来：主从复制里从库判断主库已死、锁的世界里等待超时兜底，都是同一种「证据二手、阈值出价」的结构。分布式系统里不存在完全可靠的故障知识，存在的只有不同价格、不同误报率的近似——所有上层裁决，都是建在这层近似之上的。'
  derivation: original
  sources:
