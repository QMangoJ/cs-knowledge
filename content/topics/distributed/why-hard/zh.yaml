- id: assumptions
  title: 先作废四条单机假设
  tldr: 上一步把来历捋完了：多台机器协作是单机撞墙之后被逼出来的。这一步看代价的第一笔——在一台机器里，调用立刻有结果、进程死了马上知道、时钟只有一个、数据只有一份，顺手得你根本不会多想；可出了这台机器，这四条会同时作废，后面讲的全是作废之后的事。
  body: |-
    先回到单机世界，看它顺手在哪：那时编程顺手，是因为四条假设在暗中兜底。第一，调用即达：函数调用要么立刻返回，要么抛异常，不存在「结果在路上」。第二，失败即知：进程崩溃，操作系统立刻回收，没有半死不活。第三，时钟唯一：整台机器共用一个时钟，谁先谁后一问便知。第四，状态一处：一份数据只有一个原件，不存在副本对不上。
    程序一旦拆到多台机器上，四条假设同时作废。调用变成把消息扔进网络：可能丢、可能迟到几秒、可能被重复投递。失败变成未知的：对面没回音，可能是它死了，也可能只是慢。时钟每台机器一个，各自漂移，没人能说清跨机器的真实先后。状态则天然多份，副本之间永远存在进度差。
    这四条其实是同一件事的四个面：你没法直接看到系统的真实情况，只能靠别人发来的、可能迟到、可能已经过时的消息，拼凑一个永远看不全的世界。超时、重试、心跳、共识，都是在这种看不全的情况下做的补救。
  derivation: original
