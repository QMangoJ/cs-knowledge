minutes: 26
prereq:
- network/tcp-handshake
- data/replication
objectives:
- 列出单机四条隐含假设，并说清它们走出单机后如何逐条作废
- 解释部分失败为什么是分布式系统的定义性特征
- 说清死与慢不可区分的根源，以及超时不存在正确值的原因
- 说出分布式换来的三样东西，以及不该上分布式的情形
aiLink: 今天的 AI 系统本身就是大型分布式系统：训练要跨成百上千张卡同步梯度，推理要跨许多副本分发请求——本课这张作废清单，在 GPU 集群里一条都不少，只是延迟更低、代价更高。
design:
- mechanism: 为什么分布式系统不肯把复杂性藏进中间件、假装自己是一台大单机
  problem: 根本约束是抽象必然漏水：部分失败、延迟与不可区分性都是物理层面的事实，任何封装层都无法把「对方可能死了」翻译成单机式的确定异常——藏得越深，泄漏时离业务代码越远、越不可控
  choice: 做法是把分布式的难显式化：超时要业务自己定、重试要带幂等、一致性要分档选购，框架只提供机制与默认值，不承诺透明；设计者被迫在写第一行代码时就面对多机的真实世界
  tradeoff: 代价是编程心智负担陡增：单机上一个函数调用能办完的事，到了分布式要多想三层（失败了怎么办、重复了怎么办、读到旧的怎么办），开发速度与人才门槛都被实实在在地抬高了
  root: 根子在信息的物理边界上：一个节点能知道的，只有到达它的消息。任何声称「像单机一样简单」的抽象，都在假装这条边界不存在——而边界不会因为被假装不存在就消失，它只会在最糟的时刻以事故的形式回来收账
- mechanism: 为什么超时注定没有正确值，工程上只能按代价调，还要配上退避
  problem: 根本约束是观察的不可区分性：在有限等待时间内，「对方已死」与「对方还活着但消息还在路上」给观察者呈现完全相同的画面，任何阈值都是在这个不可区分面上划一刀，划在哪里都会同时制造误杀与迟杀两类错误
  choice: 做法是承认二值判决的不完美，转而经营错误成本：按业务对两类错误的出价设定时限，再用退避与抖动把误判的连锁反应压下去，用重试预算给全局重试量封顶，让单点的赌博不至于传染全系统
  tradeoff: 代价是参数永远处于「差不多」状态：业务形态、网络状况、同伴负载都在变，今天合适的超时到了明天的高峰就可能成批误杀，运维需要持续地盯着它、调它，没有一劳永逸的配置
  root: 根子仍是两将军问题同源的无解性：你无法用有限次通信确知一个可能已沉默的对方的状态。工程的智慧不在于求得正解，而在于当正解不存在时，怎样让错误的代价最小且可控
- mechanism: 为什么故障检测的输出应该是怀疑度，而不是死或活的判决
  problem: 根本约束是证据的二手性：检测者拿到的一切——心跳的缺失、延迟的分布——都是统计意义上的弱信号，信号强度随网络与负载漂移；强行压成二值输出，等于让最缺上下文的组件替全系统做最贵的决定（切换、摘除、判死）
  choice: 做法是让检测器只负责累积怀疑：心跳缺席越久怀疑度涨得越快，输出一个连续的量；真正的判决阈值留給上层按自己的代价结构去选——支付系统宁可多等，静态内容服务宁可早摘
  tradeoff: 代价是系统多了一层需要调校的语义：怀疑度曲线与阈值的搭配没有标准答案，调错了要么频繁误切换、要么迟迟不切换，得靠观测与演练慢慢磨出适合自己业务的那组数
  root: 根子在决策权与信息的匹配：怀疑度机制把「测量」与「裁决」拆开，测量归最贴近信号的组件，裁决归最懂代价的业务——和缓冲池、优化器是同一条原则在分布式世界的回声
terminal:
- cmd: ping -c 5 example.com
  note: 看往返延迟的平均值与抖动：同一条链路，每次的数字都不一样
- cmd: curl -o /dev/null -s -w '%{time_total}\n' https://example.com
  note: 量一次真实跨网请求的总耗时，和你在代码里感觉的「瞬间」对比一下
