title: 分布式为什么难：一个没有全局时钟的世界
summary: 在一台机器上，有四件事不用操心：调用一下就有结果、进程死了马上知道、大家共用一个时钟、数据只有一份。程序拆到多台机器上，这四件事逐条都不成立了。这一课先不讲解法，只把分布式全部的难摊开，列成一张清单。
premise: 这一课先回答一个问题：为什么程序一拆到多台机器上，原来顺手的做法就接连失灵？场景摆在三台机器上：一个订单服务拆成 A、B、C 三个节点，分别跑在不同的机器上，彼此看不见对方的内存，想协作只能发网络消息。接下来就跟着它们过一遍日常：A 调用 B 一次、B 没回音等到超时一次、节点之间靠心跳互相确认死活一次——每出一个状况就停下来看，单机上根本不会发生的这件事，到底难在哪。
position: 本课位于分布式系统板块的开篇一段「难在哪：部分失败的世界」，是全科的全景第一站：它不急着给任何解法，先把单机世界里默认成立的假设逐条说明为什么不再成立——比如消息发出去可能迟到、对方没回音时分不清是死了还是只是慢了、每台机器的时钟说法都不一样——让后面每一课都有明确要解决的问题。学完你能说清「部分失败」为什么是分布式系统的定义性特征，也能预判后面三站各自要解决哪一类问题。
overview:
- key: 一句话总结
  value: 分布式的难，不在于机器多，而在于你看不到全貌。想知道对方现在是什么状态，你只能等它发消息告诉你；可消息在路上要花时间，等你收到时，它那边可能已经变了样。说到底，你永远在靠迟到的消息，猜一个看不全的世界——这一课讲的所有麻烦，都是从这里长出来的
- key: 作废的假设
  value: 在一台机器里，有四件事从来不用操心，拆开之后逐条作废。调用：原来喊一声就有结果，现在消息发出去可能丢、可能迟到几秒；生死：原来对方没回应就是死了，现在没回应可能只是它慢，你分不清；时钟：原来全机共用一个钟，现在每台机器的钟都略有偏差，谁先谁后说不准；数据：原来只有一份原件，现在多个副本的更新进度各不相同。后面每一课，都是在给这四条里的某一条还账
- key: 定义性特征
  value: 分布式有一种单机永远不会出现的状态，叫部分失败。举个样子：三个节点里，一个没了回音，另外两个毫不知情，还在正常接单、继续运行——坏了一部分，其余照常运转。它难缠的地方在于，剩下的节点还得在「不知道坏的那个到底死没死」的情况下，继续做决定
- key: 超时的本质
  value: 超时是怎么回事？等了半天没回音，你手里只有一条信息——「已经等了多久」——却要拿它判定对方是死是活。对方可能真死了，也可能只是忙，或者消息还在路上。所以没有哪个超时值是绝对正确的：设短了会误杀还活着的，设长了真死的又迟迟发现不了，只能看业务更怕哪种错，按代价来选
- key: 换来的东西
  value: 拆成多台机器，换来三样单机给不了的东西：规模更大，一台机器装不下就摊到一百台；一台坏了也不全停，坏的只是百分之一的容量；服务能放到离用户更近的地方，延迟更低。前面说的那些难，就是得到这三样东西要付的价——不是说分布式不值得做，而是先把账算清，再决定要不要付
- key: 全科地图
  value: 这一课只列清单、不解题，后面三课逐个来还账。下一课讲一致性的谱系：数据存了多份之后，能容忍它有多旧、多不一致；再下一课讲共识与 [[Raft]]：多台机器意见不一致时，怎样商量出一个大家都认的结果；最后一课讲时间与跨机器事务：没有共同的钟，怎么排先后，一笔跨机器的操作怎么做到要么全成、要么全不成
