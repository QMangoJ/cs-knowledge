steps:
- id: assumptions
  title: 先作废四条单机假设
  tldr: 在一台机器里，函数调用立刻返回、进程死了你立刻知道、时钟只有一个、数据只有一份；出了这台机器，四条全不成立。
  body: '单机编程之所以顺手，是因为有四条假设在暗中兜底，你甚至意识不到它们的存在。第一，调用即达：一个函数调用要么立刻返回结果，要么抛异常，不存在「结果在路上」这种中间状态。第二，失败即知：进程崩溃，操作系统立刻回收它，没有半死不活。第三，时钟唯一：整台机器共用一个时钟，谁先谁后一问便知。第四，状态一处：一份数据只有一个原件，改完就是改完，不存在副本之间对不上的问题。

    程序一旦拆到多台机器上，四条假设在同一瞬间全部作废。调用变成把消息扔进网络：可能丢、可能迟到几秒、可能被重复投递。失败变成未知的：对面没回音，可能是它死了，也可能是它活得好好的只是慢。时钟每台机器一个，各自漂移，没人能说清两个事件跨机器的真实先后。状态则天然多份，副本之间永远存在进度差。

    本课的任务就是把这四条作废的假设逐条看清。它们不是分布式系统的四个小毛病，而是同一件事的四个面：你不再拥有对系统的直接观察，只能靠迟到的、二手的、可能过时的消息，去拼凑一个永远看不全的世界。后面所有机制——超时、重试、心跳、共识——都是在这个残缺的观察之下做的补救。'
  derivation: original
