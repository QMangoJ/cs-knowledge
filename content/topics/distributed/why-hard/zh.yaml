      active: true
    registers:
    - name: 作废清单
      value: 调用不再即达 / 失败不再即知 / 时钟不再唯一 / 状态不再只有一处
    - name: 共同根源
      value: 看不到现场，只能靠别人发来的消息拼凑全貌
  log:
  - mode: 开局
    event: 后面要学的所有办法，都是因为这四条假设不再成立，才需要重新设计一套协作方式
- id: messages-only
  title: 节点之间没有共享内存，只剩迟到的旧消息
  tldr: 多台机器之间唯一的沟通手段是发网络消息，没有共享内存也没有全局「现在」；节点 A 对节点 B 的全部认知，永远停留在 B 上一条消息发出的那一刻。
  body: |-
    跨机器节点之间没有任何共享内存可走捷径——你没法在节点 A 改一个变量就让节点 B 瞬间看见，唯一的通道是把字节流发进网络，再等对面的回包。这意味着你收到的永远是「过去的新闻」：哪怕 B 回了一条「我活着，余额还是 100 元」，也只证明它在发出数据包那一毫秒是这个状态；包在光纤里飞的这几十毫秒内，B 可能已经扣完了钱甚至当场宕机，A 却毫不知情。

    结果就是多台机器之间根本不存在一个共同的「现在」。由于网络既会延迟又会乱序，节点 A 和节点 C 在同一时刻收到的消息集合往往不一样，两边在各自内存里拼出来的系统状态图天然对不齐——这和操作系统课里同一台机器上靠共享内存加信号量就能瞬间对齐状态完全是两个世界。

    写过前端的同学对这种无力感其实很熟：浏览器页面发出一笔支付 `fetch` 请求后，页面上显示的「余额 100 元」只是上次接口拉回来的快照，在下一条响应抵达之前，前端对后端数据库此刻变成什么样一无所知。分布式后端只是把前端面对的这道信息墙，搬进了每两台服务器之间。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: a
      id: a
      label: 节点 A：我对 B 的了解，还停留在它上一条消息里说的
    - lane: b
      id: b
      label: 节点 B：我对 A 的了解也一样，只知道上一条消息
    - lane: net
      id: n
      label: 网络：两个节点之间唯一的通道，消息还经常迟到
      highlight: true
    messages:
    - id: m1
      from: a
      to: n
      label: 想同步状态，只能把消息发过去等对方回
      active: true
    registers:
    - name: 协作手段
      value: 只有发消息这一种办法，没有共享内存之类的捷径
    - name: 信息时效
      value: 最多只新到上一条消息发出的那一刻
  log:
  - mode: 通道
    event: 两个节点没有共同的「现在」：各自根据收到的消息拼出一幅图，拼出来的还可能不一样
- id: partial-failure
  title: 部分失败：坏了一半，活着的一半还得继续接单
  tldr: 单机故障往往是全活或全死，而分布式系统的标志性常态是「部分失败」——节点 B 失联了，节点 A 和 C 还在照常收单，且必须在信息残缺时当场拍板怎么往下走。
  body: |-
    分布式区别于单机的分水岭，叫「部分失败」（partial failure）：系统里某台机器或某段网线坏了，其余机器毫不知情、照常运转。单机很少陷入这种尴尬——主板或 [[CPU]] 一坏整台机器直接黑屏停机，不会出现「扣款函数死了、下单函数还活着并拼命往外接单」的割裂场面。

    回到订单系统：节点 B 突然没了动静，而网关还在把用户的下单请求源源不断打给节点 A。系统绝不能因为一个周边节点可疑就全站关门谢客（比如推荐节点失联绝不该拦住用户付钱），于是节点 A 被迫在看不清全局的瞬间做决断：是死等 B 缓过来，还是立刻报错拒单，又或者切去备用节点 C？

    在几百台机器组成的集群里，网卡闪断、磁盘写满、某台机器掉电每天都在发生，故障不再是罕见意外而是环境背景音。因此分布式设计的目标从来不是「消灭故障」，而是承认随时会烂掉一块，确保坏的时候爆炸半径可控、账目不乱。
  derivation: original
  sources:
