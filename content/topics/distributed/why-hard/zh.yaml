- id: latency
  title: 延迟不是零，而且有物理下限
  tldr: 同机房往返不到一毫秒，跨洲就是上百毫秒；光速摆在那里，任何协议聪明都绕不过去。
  body: '再补一条物理约束：延迟。同进程调用是纳秒级，跨进程是微秒级，出了机器立刻变天：同机房内一次往返通常不到一毫秒，跨城市几十毫秒，跨大洋上百毫秒。这些数字背后站着光速：光在光纤里一秒约二十万公里，东京与法兰克福之间一个来回，物理上就先欠下一百多毫秒，任何协议、任何优化都只能在这个下限之上加价。

    这条约束直接改写设计直觉。在单机里，「每次操作都确认一下」是美德；在分布式里，每多一次跨洲往返确认，就是多一百多毫秒的用户等待。所以分布式协议拼命在做的事，本质上都是减少往返次数：把消息攒成批、让读就近命中副本、在本地先成立再慢慢同步——数据科里 D1 把读副本铺到全球、写却必须回到主所在的那一处，就是这条物理账算出来的形状。

    延迟还不只是大，而且抖：排队、拥堵、重传让同一条链路的耗时在毫秒与秒之间漂移。设计时盯着平均延迟毫无意义，真正决定体验的是尾巴上最慢的那百分之一——它们往往正是被抖动、重试与排队叠满的那一批。'
