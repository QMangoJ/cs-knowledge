- id: no-global-clock
  title: 石英钟各自漂移还会倒流：跨机不能靠时间戳排先后
  tldr: 每台机器的石英钟快慢不一，网络校时还会把快了的钟强行往回拨；当两台机器存在几十毫秒时钟差时，拿本地时间戳裁决跨机事件的先后顺序会静默排反。
  body: |-
    跨机器不能直接拿系统时间戳来判断两件事谁先谁后。每台服务器主板上的物理时钟靠石英晶体振荡计时，受温度和器件差异影响，每天都会慢几毫秒或快几毫秒；更致命的是后台跑着的网络校时服务（NTP）一旦发现本机比标准时间快了 50 毫秒，可能直接把系统时间往回拨或让它跳变——在单台机器的日志里，甚至会出现后一行时间戳比前一行还小的「时间倒流」。

    放到订单场景里算一笔具体的账：假设节点 A 的钟快了 30 毫秒，节点 B 的钟慢了 45 毫秒，两边天然差着 75 毫秒。用户在 12:00:00.000 先在 A 下单（打上时间戳 `.030`），10 毫秒后请求传到 B 完成扣款，B 按自己的慢钟打上时间戳 `11:59:59.965`。事后若按时间戳合并日志或用「最后写入者胜」覆盖数据，系统会一本正经地认定「扣款发生在下单之前 65 毫秒」，把真实因果颠倒过来还一声报错都不出。

    你可能会问：换更贵的校时方案把误差压小不就行了？就算压到 1 毫秒，只要两台机器在 1 毫秒内发生过跨机通信，误差区间内的先后依然是瞎猜。真正的出路不是跟石英晶体死磕，而是彻底换掉排序尺子——改用第 4 课要讲的「逻辑计数」顺着消息传递的因果链编号。
  derivation: original
  sources:
  - ref: ddia
    locator: 第 8 章 The Trouble with Distributed Systems（不可靠的时钟一节）
    claim: 各节点的物理时钟存在漂移且会被 NTP 校正跳变，依赖墙上时钟给跨节点事件排序不可靠，需要逻辑时钟等替代办法
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: a
      id: a
      label: 节点 A 的钟：快了 30 毫秒
    - lane: b
      id: b
      label: 节点 B 的钟：慢了 45 毫秒
    - lane: caller
      id: c
      label: 调用方：拿两边的时间戳一比，对不上，不能直接信
      highlight: true
    messages:
    - id: m1
      from: c
      to: a
      label: 判断谁先谁后，没有一把两边都准的共同尺子
      active: true
    registers:
    - name: 误差来源
      value: 石英振荡慢慢漂移，加上校时时直接拨快或拨回
    - name: 出路预告
      value: 后面改用逻辑计数来排顺序，不再只看墙上时钟
  log:
  - mode: 时钟
    event: 要判断跨机器的先后，不能只靠各自的时钟，得另找一种不依赖物理时间的办法
- id: latency
  title: 光速封死了延迟下限：设计全在省跨网往返次数
  tldr: 光在光纤里每秒只跑约 20 万公里，东京到法兰克福打个来回物理下限就要 100 多毫秒；任何协议都快不过光速，所以分布式性能优化的核心就是少跑跨网往返。
  body: |-
    就算网络一滴包都不丢、机器一台都不坏，光速本身也给跨机协作钉死了一道物理铁底。在单机内存里调一次函数只要几纳秒，同机房跨机器往返不到 1 毫秒，跨城市涨到几十毫秒，而一旦跨洲——光在海底光纤里的传播速度约为每秒 20 万公里，从东京到法兰克福光跑个来回就要 100 多毫秒，算法写得再精妙也休想压到这道底线以下。

    这笔物理账直接改写了代码习惯：单机里顺手在一个请求里连查 10 次数据库毫无感觉，要是换成 10 次跨洲同步确认，业务代码还没算一行，光在路上就已经烧掉 1 秒多。所以分布式协议使出浑身解数干的事，说穿了都在省往返次数：把零碎请求攒成一批发、让读请求就近命中边缘副本、或者先在本地落盘再异步往远端抄送——Cloudflare 的全球数据库 [[D1]] 把只读副本铺满全球边缘、却规定写入必须回到主副本所在机房，正是按这笔光速账算出来的形态。

    更棘手的是网络延迟从来不是一条平稳直线，遇到路由器排队或重传，同一条链路的耗时会从几毫秒猛蹿到几秒。真正毁掉用户体验的往往不是平均延迟，而是最慢的那百分之一长尾请求。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: caller
      id: c
      label: 调用方：每多发一次跨机往返，就要多等一程的时间
      highlight: true
    - lane: net
      id: n
      label: 网络：延迟有个物理下限：光速决定，再优化也快不过；而实际延迟还忽快忽慢，抖动是常态
    messages:
    - id: m1
      from: c
      to: n
      label: 同机房 <1ms，跨洲 >100ms
      active: true
    registers:
    - name: 下限
      value: 由光速决定，再优化也降不到这个下限以下
    - name: 设计响应
      value: 把多次消息攒成一批、让读尽量就近命中副本、先在本地成立再慢慢同步
  log:
  - mode: 延迟
    event: 协议再聪明，每多一次跨机往返就要多付一程延迟，最后都按往返次数算总账
- id: retry-amplification
  title: 好心重试变雪崩：没配幂等与退避的重试最致命
  tldr: 下游因为过载变慢时，上游所有节点一超时就立刻重试，会在下游最虚弱的时刻把流量翻倍打死它；更危险的是回信丢包时的重试会导致重复扣款，所以重试必须绑死幂等与退避三件套。
  body: |-
    遇到节点 B 扣款 3 秒超时，程序员最本能的反应往往是写一行循环「再试一次」——单看一次请求合情合理，放到全系统视角下却是无数线上雪崩的导火索。假如 B 变慢正是因为流量高峰快扛不住了，上游成百上千个节点 A 同一秒超时、同一秒补发重试，等于在 B 濒死时把请求量直接翻倍；B 被砸得更慢，触发更多超时和新一轮重试，瞬间滚成正反馈闭环的「重试风暴」（retry storm）。

    比压垮机器更吓人的是把钱扣两遍：万一第一次请求在 B 那边其实已经扣完 100 元，只是成功回执丢在了半路，A 盲目重发一次，用户就会收到两条扣款短信。这就立下了一条铁律：凡是敢自动重试的接口，操作本身必须做到[[幂等]]（执行一次和执行十次结果完全相同），或者像前端防重复点击那样随请求带上一枚全局唯一的[[幂等键]]（业务单号），让 B 看到熟面孔直接返回上次结果。

    至于防止流量翻倍砸死下游，工业界靠三把锁把重试关进笼子：退避（backoff，每次重发前多等一倍时间）、抖动（jitter，在等待时间里掺入随机数，打散大伙儿齐步冲锋的节奏）、以及重试预算（retry budget，规定重试流量最多只准占总流量的比如 10% 到 20%，超限直接报错停手）。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: caller
      id: c
      label: 调用方们：同时等到超时，又同时再发一次
    - lane: b
      id: b
      label: 节点 B：本来就忙不过来，又收到翻倍的重试请求
      highlight: true
    messages:
    - id: m1
      from: c
      to: b
      label: 越慢就越多人重试，越重试就越慢，循环放大
      active: true
    registers:
    - name: 前提纪律
      value: 能重试的操作必须做到：重复执行效果不变（幂等），或者能按编号去掉重复
    - name: 降速三招
      value: 退避（间隔拉长）/ 抖动（加随机错开）/ 重试预算（超上限就停）
  log:
  - mode: 重试
    event: 每个调用方单独看，重试都合理；所有人一起重试，叠加起来却能把系统压垮——分布式要防的常常就是这种叠加效应
- id: failure-detectors
  title: 心跳只证明「刚才还活着」：故障检测永远是概率怀疑
  tldr: 周期性心跳走的还是那条会拥堵丢包的网络，最多证明对方发包那一刻活着；成熟系统不让检测器直接判死刑，而是输出连续上涨的怀疑度，把拍板权留给懂代价的业务层。
  body: |-
    既然单次请求超时摸不准死活，集群里通常会配一个后台巡检机制——让节点之间每隔几秒互发一条「心跳包」报平安。但千万别把心跳当成生死簿：心跳包走的还是同一条会抖动的网线，收到心跳只证明节点 A 在发出数据包那一毫秒还喘气，下一毫秒它可能就断电了；反过来连续漏掉三声心跳，也可能只是机房交换机刚好堵了兩秒。

    正因为手里全是二手概率证据，2004 年 Hayashibara 等人提出了后来被 Cassandra、Akka 广泛采用的 [[phi 累积故障检测器]]：它干脆放弃「死 / 活」二选一的武断判决，改按历史心跳间隔分布实时算出一个连续攀升的「怀疑度分数」。心跳晚到越久，怀疑分涨得越陡。

    把「测量怀疑度」和「拍板动手」拆开，工程账一下子就顺了：检测组件离网卡最近，只管如实报出当前有多可疑；至于怀疑分涨到 3 就立刻摘除节点（适合宁可错杀的静态内容分发），还是熬到 10 才敢主从切换（适合怕双主写乱账的核心账本），交还给最清楚误判有多贵的业务层自己定夺。
  derivation: original
  sources:
  - ref: ddia
    locator: 第 8 章 The Trouble with Distributed Systems（不可靠的故障检测与超时）
    claim: 故障检测本质上是不确定的：只能靠超时与心跳推测节点生死，不存在能准确区分节点崩溃与网络延迟的检测办法
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: a
      id: a
      label: 节点 A：这次的心跳又迟到了，还没收到
    - lane: b
      id: b
      label: 节点 B：越久没收到心跳，就越怀疑 A 已经出问题
      highlight: true
    messages:
    - id: m1
      from: a
      to: b
      label: 心跳最多只能说明：发出心跳的那一刻，它还活着
      active: true
    registers:
    - name: 检测输出
      value: 不是直接说死或活，而是给出怀疑程度有多高
    - name: 阈值归属
      value: 在多高的怀疑度下动手，由业务按误判的代价来定
  log:
  - mode: 检测
    event: 所有判断都只是近似、没有百分之百准确的故障消息，先接受这一点，再谈后面的机制
- id: what-you-get
  title: 吞下这么多苦头，换回规模、容错与就近三样真本事
  tldr: 分布式之所以值得做，是因为它能换回单机物理上做不到的水平扩容、局部容错和全球就近接入；反过来说，一台机器就能稳稳装下的业务，硬拆成分布式纯属没苦硬吃。
  body: |-
    把麻烦清单摊得这么透，绝不是劝你退回单机，而是要算清这笔复杂度到底买回了哪三样单机永远给不了的硬通货。第一样是破除容量上限：顶配单机的核数、内存与磁盘带宽终归有顶，把负载摊到 100 台普通机器上，吞吐上限立刻抬高两个数量级；第二样是不停机容错：单机电源一烧就是 100% 停服，而在 100 台机器的集群里坏掉 1 台只损失 1% 容量，把账本多抄几份就能让硬件损坏从灾难降级成日常换盘；第三样是物理就近：把边缘节点摆到东京和法兰克福用户家门口，省下每次跨洋跑光纤的那 100 多毫秒。

    这笔账还有极其重要的一条反面纪律：**用不上这三样收益的系统，千万别上分布式。** 一台现代云主机配有几十核 CPU、几百 GB 内存和每秒几十万次读写的固态盘，足以扛住绝大多数中小型业务的全部流量；在单机还没摸到瓶颈前就盲目拆成十几个微服务，除了凭空背上超时、乱序和对不齐的假账，换不回半点好处。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: caller
      id: c
      label: 调用方：需要更大的规模、一台坏了也不全停、服务离用户更近
      highlight: true
    - lane: a
      id: a
      label: 节点群：每台机器只承担总负载的一部分
    - lane: b
      id: b
      label: 节点群：坏掉一台，只是少了一部分容量，不会全停
    messages:
    - id: m1
      from: c
      to: a
      label: 前面的难，就是换来这三样要付的价
      active: true
    registers:
    - name: 换来的
      value: 更大的规模 / 一台坏了也不全停 / 离用户更近
    - name: 反面纪律
      value: 一台机器装得下的业务，就不要拆成分布式
  log:
  - mode: 动机
    event: 先看清分布式换来了什么，后面几课再逐个讲这些好处背后的复杂度怎么处理
- id: course-map
  title: 收官口诀：先过「拆机三问」，再按四张欠条对号找解药
  tldr: 动手拆系统前先问装不装得下、死不死得起、离得远不远；一旦决定上分布式，本课列出的四张欠条——副本进度差、多机争裁决、无钟排先后、调用易雪崩——就是后面四课逐个攻克的靶子。
  body: |-
    把整节课浓缩成一套能直接带进架构评审的**「拆机三问」**：① 单台机器升级硬件真的装不下、算不完了吗？② 单机宕机几分钟做重启恢复，业务真的赔不起吗？③ 用户真的跨大洲分布、非靠多地部署压延迟不可吗？三问全答「否」，老老实实用单机加定期备份；只要有一项答「是」，就带着本课这张隐患清单进场。

    进场之后，本课作废的四条单机假设会精准变成后面四课要还的四张欠条：
    - **状态多份、新旧不一** → 第 2 课用一致性谱系明码标价，讲透 [[CAP 定理|CAP]] 在断网那十分钟的真实取舍；
    - **死慢难辨、谁说了算** → 第 3 课用 Raft 任期与多数派交集做铁板裁决，并与无解的[[两将军问题]]划清前提界限；
    - **无全局钟、跨机改账** → 第 4 课用逻辑时钟按因果排先后，用两阶段提交或幂等补偿保住跨机转账；
    - **同步链脆、重试雪崩** → 第 5 课用消息队列削峰、令牌桶限流与熔断治理替日常调用兜底。

    记住一句话口诀收尾：**跨机只剩旧消息，死慢难分钟漂移；不图扩容容错近，单机永远是第一。**
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: caller
      id: c
      label: 本课：先把不再成立的假设列成清单
      highlight: true
    - lane: a
      id: a
      label: 下一站：一致性的谱系
    - lane: b
      id: b
      label: 再下一站：共识与时间
    messages:
    - id: m1
      from: c
      to: a
      label: 清单上的每一项难题，后面都有一课专门讲怎么解决
      active: true
    registers:
    - name: 第 2 站
      value: CAP 与一致性谱系
    - name: 第 3 站
      value: 共识与 Raft
    - name: 第 4 站
      value: 时间与分布式事务
  log:
  - mode: 地图
    event: 先把难在哪里讲清楚，后面的课再逐个给出解法
minutes: 26
prereq:
- network/tcp-handshake
- data/replication
objectives:
- 列出单机暗中成立的四条假设，并说明跨出单机后为何同时作废
- 解释「部分失败」为何是分布式系统的定义性特征
- 说清死与慢无法区分的物理根源，以及超时与重试为何必须配齐幂等和退避
- 用「拆机三问」判断一个业务值不值得承担分布式复杂度
aiLink: 今天的 [[AI]] 大模型训练与推理本身就是最硬核的分布式系统：上千张 [[GPU]] 跨节点同步梯度时，掉卡、慢卡（straggler）、光速通信墙和心跳误判一条不少，本课这张隐患清单在算力集群里被放大到了极致。
design:
- mechanism: 拒绝伪装单机：把超时、幂等和一致性档位摆在明面上
  problem: 早年不少中间件试图把跨网远程调用包装得跟本地函数一模一样，可网络丢包、死慢难辨是客观物理事实；藏得越深，一旦遇到半路超时，业务代码既不知道钱扣没扣、也没留重试保护，摔得越惨。
  choice: 现代框架干脆放弃「像单机一样透明」的幻觉，强制调用方显式传入超时阈值、为写接口配齐幂等键、按业务场景挑选读写一致性档位，把风险留在代码表层。
  tradeoff: 写业务代码的心智负担肉眼可见地变重——单机一行函数能搞定的扣款，跨机后得额外考虑超时怎么查单、重发怎么防重、读到旧账怎么兜底。
  root: 节点获取外部世界信息的唯一渠道是网络数据包，这道物理信息边界任何软件抽象都抹不平；假装边界不存在的封装，迟早会在网络抖动那天变成线上事故。
- mechanism: 超时配退避与预算：不求猜准死活，只求把猜错的代价封顶
  problem: 在有限等待时间内，下游崩溃和消息堵车呈现完全相同的沉默，无论把超时定在几百毫秒还是几十秒，都必然同时犯下「误杀慢节点」或「傻等死节点」两种错之一。
  choice: 放弃寻找绝对正确的超时数字，先按业务更怕哪种错定下基准时限，再给重试套上指数退避、随机抖动和总比例封顶（重试预算），斩断误判引发的流量雪崩。
  tradeoff: 超时参数永远只能调到眼下差不多顺手——大促流量翻倍或底层硬件波动时，平时温顺的阈值随时可能批量误杀健康节点，需要长期盯着监控微调。
  root: 与两将军问题同源：在可能丢包延迟的异步信道上，有限次通信无法确知沉默一方的真实状态；既然原理上算不出标准答案，工程唯一能管的就是犯错时的爆炸半径。
- mechanism: 累积怀疑度检测：让离网卡最近的组件打分，让最懂业务的组件拍板
  problem: 心跳漏收和延迟升高都只是受网络抖动严重干扰的间接信号；如果底层检测器直接输出「死」或「活」的二值判决，等于让完全不懂业务轻重的底层库替全系统拍下了主从切换这种天价决定。
  choice: 检测器只根据历史心跳分布实时算出一个连续爬升的怀疑分数（如 phi 值），至于涨到多少分才动手摘除或切换，交由上层业务按误判损失自己设线。
  tradeoff: 多出一组需要摸索经验值的灵敏度与阈值参数，调得太激进会频繁假警报乱切主库，调得太迟钝又会让故障恢复慢半拍。
  root: 测量信号和承担后果需要两套完全不同的知识：底层网络库最懂包延迟的统计规律，上层业务最懂切错一次主库要赔多少钱，把测量权和裁决权拆开才能各司其职。
terminal:
- cmd: ping -c 5 example.com
  note: 看往返延迟的平均值与抖动：同一条链路，每次的数字都不一样
- cmd: curl -o /dev/null -s -w '%{time_total}\n' https://example.com
  note: 量一次真实跨网请求的总耗时，和你在代码里感觉的「瞬间」对比一下
