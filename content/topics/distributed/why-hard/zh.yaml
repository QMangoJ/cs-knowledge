    event: 从这里开始，要把故障当成日常会发生的事来设计，而不是当成罕见意外
- id: dead-or-slow
  title: 死与慢长得一模一样：超时永远是拿一种错换另一种错
  tldr: 节点 B 不回话时，进程崩溃、机器卡顿与网络丢包在节点 A 眼里全是同一种沉默；超时阈值不存在绝对正确的数字，设短了误杀活节点，设长了被死节点拖垮。
  body: |-
    把节点 A 苦等节点 B 扣款 3 秒没回音的瞬间放大看，A 面对的是一道物理上无解的判别题。对面沉默至少有三种完全不同的真相：第一，B 进程早就崩了，根本没收到请求；第二，B 活着且刚把 100 元扣完，偏偏赶上一次长达 4 秒的垃圾回收暂停，回信卡在嘴边没发出来；第三，B 秒回确认，但数据包堵在半路路由器队列里丢了。这三种真相传到 A 眼里只有同一种表象：套接字上静悄悄，一个字节都没收到。

    工程上打破僵局的唯一武器是设一个超时时间，到点没回就当对方死了处理，可这个阈值注定两头挨打。如果把超时设短到 500 毫秒，B 只是稍微忙了一点就被判死刑，流量瞬间全切给同伴 C，把 C 也压垮引发连环雪崩，等 B 缓过神来还会冒出两个节点同时干活的乱子；反过来如果设长到 30 秒，B 真死的时候成千上万个前端请求全挂在 A 身上干等，连接池瞬间耗尽。

    为什么不能等一个「绝对够用」的上限？因为公网与分组交换网的排队延迟没有硬上限，数据包理论上可以迟到任意久。所以超时从来不是一道求标准答案的算术题，而是一道业务定价题：先问清楚「误杀一个慢节点」和「晚发现一具真尸体」哪边赔得更惨，再按代价划线。
