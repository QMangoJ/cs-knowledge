- id: course-map
  title: 全科地图：后面三站逐个还账
  tldr: 一致性谱系回答「能容忍多旧」，共识回答「听谁的」，时间与事务回答「谁先谁后、跨机怎么原子」。
  body: '收尾把全科地图钉好，后面每一站都回收本课清单上的一项。后一站先讲一致性：既然副本不可能时刻同步，「数据能有多旧」就成了一个可以标价的谱系——从强一致到最终一致，每往松里走一格，换回多少可用性与延迟，CAP 定理会在那里得到它准确的含义，而不是江湖流传的那句三选二。

    再往后是共识：当裁决不可避免——选谁当主、一笔操作算不算数——多台机器怎样在同伴会死、消息会迟到的前提下，仍然商量出一个所有人认账的结果。Raft 会把这件事拆成选主与日志复制两件可理解的小事，并与你早已见过的两将军问题划清界限。

    最后一站收拾时间与事务：没有可信的墙上时钟，怎样用逻辑计数给事件排序；跨机器的一笔事务要么全成要么全不成，做不到时又怎样用补偿、幂等与去重把账做平。四站走完，你回头再看本课这张「假设作废清单」，每一行后面都会站着一套成熟的应对——那时清单就不再是噩耗，而是分布式的设计目录。'
