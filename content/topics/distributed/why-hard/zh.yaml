  log:
  - mode: 来历
    event: 分布式不是一开始设计出来的，是单机先不够用了，才一步步被逼出来的
- id: assumptions
  title: 跨出单机那一刻，四条默认假设同时作废
  tldr: 单机写代码之所以顺手，全靠「调用即达、失败即知、时钟唯一、状态一处」四条隐含假设暗中兜底；一旦拆成跨机器的节点 A、B、C，这四条在同一秒全部失效。
  body: |-
    单机编程顺手得让人毫无察觉，是因为操作系统和硬件在底下替你兜住了四条铁律：第一是调用即达，本地函数调用只是内存里的指令跳转，要么微秒内拿到返回值，要么当场抛异常，绝没有「结果还在半路上」；第二是失败即知，进程一崩操作系统立刻回收，生死二值分明；第三是时钟唯一，全机所有线程看同一块硬件钟；第四是状态一处，余额变量在内存里只有一份原件，不存在两本对不上的账。

    等我们的订单系统拆到 A、B、C 三台机器上，这四条铁律瞬间作废。A 调 B 扣 100 元，变成往网卡塞一个数据包：包可能半路丢掉、可能堵上 3 秒、还可能重传两遍；B 没回音时，A 根本摸不准它是崩了还是卡住了；A、B、C 三台机器各有各的石英钟，快慢不一；为了防丢数据把账本抄成三份后，三份副本的写入进度又总有先后。

    这四条作废假设剥到底其实是同一个病根：没有任何一个节点能开天眼看到全系统的真实当下，大家只能凭网络送来的二手消息盲人摸象。后面所有的超时、重试、心跳与共识协议，全是在这间黑屋子里摸索出的补救规矩。
  derivation: original
  canvas:
