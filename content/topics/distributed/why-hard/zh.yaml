- id: messages-only
  title: 节点之间只剩消息：没有共享的现在
  tldr: 拆开的进程之间没有共享内存、没有全局变量；你对另一个节点的全部了解，来自它上一封回信。
  body: '多台机器之间到底靠什么协作？答案朴素得让人不安：只有消息。没有共享内存让你写一个变量对方立刻看见，没有全局时钟让你对齐节奏，没有一条总线让你广播给所有人。你能做的只有把一封信扔进网络，然后等——等回信，或者等到自己放弃。

    这带来一个深刻的后果：你对任何其他节点的了解，永远停留在它发出上一封信的那一刻。它现在是死是活、忙闲如何、数据更新到哪了，你一概不知道，只能从回信的内容与迟早里猜。两个节点对「现在系统是什么状态」也永远不可能有完全一致的看法——因为各自收到的信，本来到得就有先有后。

    操作系统课里进程间还能靠共享内存与信号量说悄悄话，网络科里我们又见过信道会丢包、会乱序。把两者叠起来就是分布式的日常：协作的每一方都是信息孤岛，协议设计的全部艺术，就是在孤岛之间用注定迟到的信件，维持一个「足够像样」的共同事实。'
  derivation: original
