      value: 没有正确答案，只能看误判哪种更贵，再定等多久
  log:
  - mode: 判别
    event: 只看「有没有回音」，死和慢看起来完全一样——后面很多裁决之所以难，都是卡在这里
- id: no-global-clock
  title: 没有全局时钟：每台机器自说自话
  tldr: 死活分不清，时间也靠不住。这一步算一笔账：每台机器的钟靠石英振荡，会慢慢漂移，还会被校时直接拨回去；两台钟差着几十毫秒的时候，拿时间戳给跨机器的事件排先后，排出来的顺序为什么不能信。
  body: >-
    单机上问「谁先谁后」，看一眼时钟就行。多台机器则每台有自己的物理时钟，靠石英振荡计时，频率有细微偏差，跑着跑着就互相差出几毫秒到几百毫秒；校时服务发现差太多，还会把时间直接拨回去或跳过一段——时间在一台机器上甚至可能倒流。

    后果砸在最常见的需求上：给事件排序。两条日志分别打在两台机器上，时间戳说 A 在 B 之前一毫秒，你敢信吗？两台钟的误差可能有几十毫秒，这一毫秒纯属噪声。靠墙上时钟（wall
    clock）合并多机日志、判断谁覆盖了谁、用「最后写入者胜」解决冲突，都会在误差里悄悄出错——平时全对，只在误差大的那一瞬翻车。

    出路不是把钟校得更准（校得再准也有误差下限），而是换一套不依赖物理时间的排序办法——用逻辑计数代替墙上时间，这正是本科最后一课的主角。跨机器谈先后，必须先回答「凭什么」，而墙上时钟给出的答案并不可靠。
  derivation: original
  sources:
  - ref: ddia
    locator: 第 8 章 The Trouble with Distributed Systems（不可靠的时钟一节）
    claim: 各节点的物理时钟存在漂移且会被 NTP 校正跳变，依赖墙上时钟给跨节点事件排序不可靠，需要逻辑时钟等替代办法
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: a
      id: a
      label: 节点 A 的钟：快了 30 毫秒
    - lane: b
      id: b
      label: 节点 B 的钟：慢了 45 毫秒
    - lane: caller
      id: c
      label: 调用方：拿两边的时间戳一比，对不上，不能直接信
      highlight: true
    messages:
    - id: m1
      from: c
      to: a
      label: 判断谁先谁后，没有一把两边都准的共同尺子
      active: true
    registers:
    - name: 误差来源
      value: 石英振荡慢慢漂移，加上校时时直接拨快或拨回
    - name: 出路预告
      value: 后面改用逻辑计数来排顺序，不再只看墙上时钟
  log:
  - mode: 时钟
    event: 要判断跨机器的先后，不能只靠各自的时钟，得另找一种不依赖物理时间的办法
- id: latency
  title: 延迟不是零，而且有物理下限
  tldr: 前面几步讲的都是「不确定」，这一步讲一条能算清的物理账：延迟。东京的机器向美国的机器问一个问题，光跑个来回就要 100 多毫秒，问 10 次就烧掉 1 秒多；同机房却不到 1 毫秒。协议再聪明也快不过光速，所以这一步要看的，是设计上怎么少跑这些冤枉路。
  body: |-
    再补一条物理约束：延迟。同进程调用是纳秒级，跨进程是微秒级，出了机器立刻变天：同机房内一次往返通常不到一毫秒，跨城市几十毫秒，跨大洋上百毫秒。原因是光速有限：光在光纤里一秒约走二十万公里，东京与法兰克福之间一个来回，光本身就要一百多毫秒，所以任何协议的延迟都只能在这个基础上再往上加，降不到它以下。
    这条约束会改变设计习惯：单机里「每次操作都确认一下」没有问题，分布式里每多一次跨洲往返确认，就是多一百多毫秒的用户等待；一个请求里要是串上十次这样的往返，什么都还没开始算，光在路上就先烧掉一秒多。所以分布式协议花大力气做的事，本质上都是减少往返次数：把消息攒成批、让读就近命中副本、在本地先成立再慢慢同步——数据科里 [[D1]]把读副本铺到全球、写却必须回到主所在的那一处，就是按这笔物理账算出来的形状。
    延迟还不只是大，而且不稳定：排队、拥堵、重传会让同一条链路的耗时在毫秒与秒之间漂移。决定体验的是尾巴上最慢的那百分之一，不是平均延迟。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: caller
      id: c
      label: 调用方：每多发一次跨机往返，就要多等一程的时间
      highlight: true
    - lane: net
      id: n
      label: 网络：延迟有个物理下限：光速决定，再优化也快不过；而实际延迟还忽快忽慢，抖动是常态
    messages:
    - id: m1
      from: c
      to: n
      label: 同机房 <1ms，跨洲 >100ms
      active: true
    registers:
    - name: 下限
      value: 由光速决定，再优化也降不到这个下限以下
    - name: 设计响应
      value: 把多次消息攒成一批、让读尽量就近命中副本、先在本地成立再慢慢同步
  log:
  - mode: 延迟
    event: 协议再聪明，每多一次跨机往返就要多付一程延迟，最后都按往返次数算总账
- id: retry-amplification
  title: 重试的放大效应：一片好心怎样压垮系统
  tldr: 延迟的账算完，再回到超时这件事：超时之后，最自然的反应是再试一次。这一步看这件好事怎么变坏事：如果对方变慢正是因为负载太高，所有人一起重试，等于在它最忙的时候把请求再翻一倍——越慢越重试、越重试越慢，最后滚成雪崩。
  body: |-
    面对超时，最自然的反应是重试：大概只是网络抖了一下，再发一次就好了。可把视角拉到全系统：对方变慢的原因若是负载过高，每个调用方都在超时后重试，等于在它最喘不过气时把请求量翻倍；它更慢，超时更多，重试再翻倍——正反馈闭环，这就是重试风暴（retry storm），无数真实事故的剧本。
    更阴险的是重复执行：请求其实成功了，只是回信在路上丢了，调用方以为失败、重试一次，对方就把同一笔业务做了两遍——扣了两次款、发了两次货。重试因此有个前提纪律：被重试的操作必须幂等（idempotent，同一个请求执行一次与多次效果相同），做不到幂等的，要靠请求编号去重。这条纪律是最后一课的主角之一。
    缓和的办法都是给重试降速与打散：退避（backoff，间隔逐次拉长）、抖动（jitter，在间隔上加随机，避免所有调用方同一时刻齐步重试）、重试预算（一段时间内重试占比超过上限就不再重试）。三招合起来，是把「好心的重试」关进笼子的标准做法。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: caller
      id: c
      label: 调用方们：同时等到超时，又同时再发一次
    - lane: b
      id: b
      label: 节点 B：本来就忙不过来，又收到翻倍的重试请求
      highlight: true
    messages:
    - id: m1
      from: c
      to: b
      label: 越慢就越多人重试，越重试就越慢，循环放大
      active: true
    registers:
    - name: 前提纪律
      value: 能重试的操作必须做到：重复执行效果不变（幂等），或者能按编号去掉重复
    - name: 降速三招
      value: 退避（间隔拉长）/ 抖动（加随机错开）/ 重试预算（超上限就停）
  log:
  - mode: 重试
    event: 每个调用方单独看，重试都合理；所有人一起重试，叠加起来却能把系统压垮——分布式要防的常常就是这种叠加效应
- id: failure-detectors
  title: 证据都是二手的：故障检测只能是概率
  tldr: 既然靠一次超时判生死这么不可靠，系统就得有个专门盯着同伴死活的机制：心跳。这一步看它能证明什么、不能证明什么——心跳只能说明「它刚才还活着」，证明不了它现在还活着；连续几声没听到就动手，这个界限画在哪里，仍然要在误判和迟判之间选。
  body: |-
    既然分不清死与慢，系统总得有个机制定期给同伴「测存活」：故障检测（failure detector）。最常见的形态是心跳：节点周期性地互相报平安，连续几声没听到，就把对方标记为疑似死亡，触发切换或摘除。可每个环节全是概率：心跳走的还是那条会迟到的网络，一次没听到可能只是拥堵；就算对方真死了，你得知消息时它也已经死了有一阵了。
    成熟的做法干脆承认概率：不输出「死/活」的二值结论，而是输出怀疑度——心跳越久没来，怀疑度涨得越快，上层按自己业务的代价去选在多高时动手。这类检测器（如 [[phi 累积故障检测器]]）把「判决阈值」这件本该由业务出价的事，还给了业务本身。
    主从复制里从库判断主库已死、锁的世界里等待超时兜底，都是同一种结构：拿到的只是间接证据，最后在什么界限下动手，要按代价来定。分布式里不存在完全可靠的故障消息，只有代价不同、误报率不同的近似判断——所有上层裁决都建立在这种近似之上。
  derivation: original
  sources:
  - ref: ddia
    locator: 第 8 章 The Trouble with Distributed Systems（不可靠的故障检测与超时）
    claim: 故障检测本质上是不确定的：只能靠超时与心跳推测节点生死，不存在能准确区分节点崩溃与网络延迟的检测办法
    status: verified
    checkedBy: Muse 核查
    checkedAt: 2026-11-07
  canvas:
    kind: swimlane
    actors:
    - lane: a
      id: a
      label: 节点 A：这次的心跳又迟到了，还没收到
    - lane: b
      id: b
      label: 节点 B：越久没收到心跳，就越怀疑 A 已经出问题
      highlight: true
    messages:
    - id: m1
      from: a
      to: b
      label: 心跳最多只能说明：发出心跳的那一刻，它还活着
      active: true
    registers:
    - name: 检测输出
      value: 不是直接说死或活，而是给出怀疑程度有多高
    - name: 阈值归属
      value: 在多高的怀疑度下动手，由业务按误判的代价来定
  log:
  - mode: 检测
    event: 所有判断都只是近似、没有百分之百准确的故障消息，先接受这一点，再谈后面的机制
- id: what-you-get
  title: 难归难：分布式换来的三样东西
  tldr: 清单列完了，这一步把账的另一面补上：拆成多台机器，换来了规模更大、一台坏了也不全停、服务能离用户更近——这三样单机都给不了。前面说的难，就是为这三样付的价；反过来，用不上这三样的系统，压根不该上分布式。
  body: |-
    清单列完，先说明一点：本课不是劝大家不要用分布式。把系统拆到多台机器上，换来三样单机永远给不了的东西。第一是规模：一台机器的 CPU、内存、磁盘都有物理上限，把负载摊到一百台机器上，上限就抬高了两个量级。第二是容错：一台机器坏了只是百分之一的容量波动，而不是全站停摆；数据多存几份，单点故障就从事故变成了日常维护。第三是就近：用户在全球，服务器放在他身边几十毫秒之外，单机做不到。
    后面每一课要拆的难题——一致性、共识、时间排序——都是为了得到这三样东西而要付出的后续代价。要问的不是「为什么这么麻烦」，而是「这份麻烦换来了什么、还有没有代价更小的办法」。
    反面也要记住：用不上这三样的系统，就别上分布式。一台机器能装下的业务，单机就是最优解——只有当一台机器装不下、坏一次就承受不起、或者离用户太远时，才值得承担分布式的复杂度。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: caller
      id: c
      label: 调用方：需要更大的规模、一台坏了也不全停、服务离用户更近
      highlight: true
    - lane: a
      id: a
      label: 节点群：每台机器只承担总负载的一部分
    - lane: b
      id: b
      label: 节点群：坏掉一台，只是少了一部分容量，不会全停
    messages:
    - id: m1
      from: c
      to: a
      label: 前面的难，就是换来这三样要付的价
      active: true
    registers:
    - name: 换来的
      value: 更大的规模 / 一台坏了也不全停 / 离用户更近
    - name: 反面纪律
      value: 一台机器装得下的业务，就不要拆成分布式
  log:
  - mode: 动机
    event: 先看清分布式换来了什么，后面几课再逐个讲这些好处背后的复杂度怎么处理
- id: course-map
  title: 全科地图：后面三站逐个还账
  tldr: 最后收个尾，把本课的清单和后面三课对上号：一致性谱系回答「数据能容忍有多旧」，共识回答「多台机器意见不一致时听谁的」，时间与事务回答「谁先谁后、跨机器的一笔操作怎么做到要么全成要么全不成」。下一课先从一致性开始。
  body: >-
    收尾把全科地图说清楚，后面每一站都会对应本课清单上的一项。后一站先讲一致性：既然副本不可能时刻同步，「数据能有多旧」就成了一个可以按代价分档的谱系——从强一致到最终一致，每往宽松走一格，能换回多少可用性与延迟，[[CAP 定理|CAP]]会在那里得到准确的含义，而不是流传很广的那句简化的「三选二」。

    再往后是共识：当必须做裁决时——比如选谁当主、一笔操作算不算数——多台机器怎样在同伴可能死掉、消息可能迟到的前提下，商量出一个所有人都认可的结果。Raft 会把这件事拆成选主与日志复制两件小事，并与[[两将军问题]]划清界限。

    最后一站讲时间与事务：没有可信的墙上时钟，怎样用逻辑计数给事件排序；跨机器的一笔事务要么全成要么全不成，做不到时又怎样用补偿、幂等与去重把结果处理一致。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: caller
      id: c
      label: 本课：先把不再成立的假设列成清单
      highlight: true
    - lane: a
      id: a
      label: 下一站：一致性的谱系
    - lane: b
      id: b
      label: 再下一站：共识与时间
    messages:
    - id: m1
      from: c
      to: a
      label: 清单上的每一项难题，后面都有一课专门讲怎么解决
      active: true
    registers:
    - name: 第 2 站
      value: CAP 与一致性谱系
    - name: 第 3 站
      value: 共识与 Raft
    - name: 第 4 站
      value: 时间与分布式事务
  log:
  - mode: 地图
    event: 先把难在哪里讲清楚，后面的课再逐个给出解法
minutes: 26
prereq:
- network/tcp-handshake
- data/replication
objectives:
- 列出单机四条隐含假设，并说清它们走出单机后如何逐条作废
- 解释部分失败为什么是分布式系统的定义性特征
- 说清死与慢不可区分的根源，以及超时不存在正确值的原因
- 说出分布式换来的三样东西，以及不该上分布式的情形
aiLink: 今天的 [[AI]]系统本身就是大型分布式系统：训练要跨成百上千张卡同步梯度，推理要跨许多副本分发请求——本课这张作废清单，在 [[GPU]]集群里一条都不少，只是延迟更低、代价更高。
design:
- mechanism: 为什么分布式系统不肯把复杂性藏进中间件、假装自己是一台大单机
  problem: 根本约束是有些复杂性藏不住：比如对方没回音，中间件没法像单机那样明确告诉你「它就是死了」，因为它可能只是慢了。部分失败、延迟、死与慢分不清，都是实际存在的事实，任何封装层都变不掉；藏得越深，真出问题时，业务代码离现场越远，越难处理
  choice: 做法是把这些难处摆到明面上：等多久算超时由业务自己定，重试的操作要先做到幂等，一致性要按档位选。框架只提供机制和默认值，不承诺「用起来和单机一样」；写代码的人从一开始就要考虑多台机器的真实情况
  tradeoff: 代价是要操心的事明显变多：单机上一个函数调用能办完的事，到了分布式要多想三层（失败了怎么办、重复了怎么办、读到旧的怎么办），开发速度与人才门槛都被抬高
  root: 根子在于一个节点能知道的信息有边界：它只能知道已经送达自己的消息。声称「像单机一样简单」的封装，等于假装这条边界不存在；可边界不会消失，往往在最糟的时候以事故的形式暴露出来
- mechanism: 为什么超时注定没有正确值，工程上只能按代价调，还要配上退避
  problem: 根本约束是在你能等的那段时间里，「对方已经死了」和「对方还活着、只是消息还在路上」，在你这边看起来完全一样。不管把超时线画在哪里，都会同时带来两种错：把还活着的误判为死了，和把真死了的发现得太晚
  choice: 做法是承认这个判断不可能完全准确，转而控制犯错的代价：按业务更怕哪种错来设定时限，再用退避与抖动减少误判引发的连锁反应，用重试预算给总的重试量封顶
  tradeoff: 代价是参数只能调到「差不多合适」：业务量、网络状况、对方的负载一直在变，今天合适的超时，到了明天的高峰期就可能把一批还活着的节点误判为死了，没有一次调好就永远不用改的配置
  root: 根子与两将军问题相同：靠有限次通信，没法确切知道一个已经不回话的对方到底是什么状态。工程上能做的不是求出正确答案，而是在没有正确答案时，把犯错的代价压到最小、并控制在可承受范围内
- mechanism: 为什么故障检测的输出应该是怀疑度，而不是死或活的判决
  problem: 根本约束是你拿到的只是间接证据：心跳没来、延迟变长，都只是弱信号，而且会随网络和负载变化。如果硬把这些信号压成「死」或「活」一个结论，就等于让最不了解业务的检测组件，替全系统做了最贵的决定，比如切换、摘除节点、判定死亡
  choice: 做法是让检测器只负责累积怀疑：心跳缺席越久怀疑度涨得越快，输出一个连续的量；最后在多高时动手，留给上层按自己的代价去选——支付系统宁可多等，静态内容服务宁可早摘
  tradeoff: 代价是多了一层需要调校的设置：怀疑度涨多快、阈值定多高，这两者的搭配没有标准答案，调错了要么频繁误切换、要么迟迟不切换，得靠观测与演练慢慢调整
  root: 根子在于让掌握信息的人做测量、让懂代价的人做裁决：检测器离信号最近，由它负责测量；业务最清楚误判有多贵，由它负责最后裁决。把这两件事拆开，和缓冲池、优化器的分工是同一个道理，只是换到了分布式场景
terminal:
- cmd: ping -c 5 example.com
  note: 看往返延迟的平均值与抖动：同一条链路，每次的数字都不一样
- cmd: curl -o /dev/null -s -w '%{time_total}\n' https://example.com
  note: 量一次真实跨网请求的总耗时，和你在代码里感觉的「瞬间」对比一下
