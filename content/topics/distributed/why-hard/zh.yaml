- id: no-global-clock
  title: 没有全局时钟：每台机器自说自话
  tldr: 每台机器的时钟靠石英振荡，会漂移、会被校时拉回甚至跳变；拿它给跨机器事件排序，排出来的可能是假的。
  body: '单机上问「谁先谁后」，看一眼时钟就行。到了多台机器，这条路断了：每台机器有自己的物理时钟，靠石英振荡计时，频率有细微偏差，跑着跑着就互相差出几毫秒到几百毫秒；负责校时的服务发现差太多，还会把时间直接拨回去或跳过一段——时间在一台机器上甚至可能倒流。

    后果直接砸在最常见的需求上：给事件排序。两条日志分别打在两台机器上，时间戳说 A 在 B 之前一毫秒，你敢信吗？两台钟的误差可能有几十毫秒，这一毫秒的先后纯属噪声。靠墙上时钟（wall clock）合并多机日志、判断谁覆盖了谁、用「最后写入者胜」解决冲突，都会在这种误差里悄悄出错——而且错得毫无征兆，平时全对，只在误差大的那一瞬翻车。

    出路不是把钟校得更准就完事：校得再准也有误差下限。真正的出路是换一套不依赖物理时间的排序办法——用逻辑计数代替墙上时间，这正是本科最后一课的主角。本课先立住问题：跨机器谈先后，必须先回答「凭什么」，而墙上时钟给出的答案并不可靠。'
  derivation: original
  sources:
  - ref: ddia
    locator: 第 8 章 The Trouble with Distributed Systems（不可靠的时钟一节）
    claim: 各节点的物理时钟存在漂移且会被 NTP 校正跳变，依赖墙上时钟给跨节点事件排序不可靠，需要逻辑时钟等替代办法
