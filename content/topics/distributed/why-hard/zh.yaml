id: distributed/why-hard
subject: distributed
slug: why-hard
order: 1
status: published
license: CC-BY-4.0
title: 分布式为什么难：一个没有全局时钟的世界
summary: 单机上理所当然的四件事——调用即达、失败即知、时钟唯一、状态一处——走出单机逐条作废；这一课把分布式全部的难，先摊成一张清单。
premise: 以三个只靠网络消息协作的节点（订单服务 A、B、C，部署在不同机器）为样本：一次调用、一次超时、一次心跳，逐个拆解。
position: >-
  本课位于分布式系统板块的开篇一段「难在哪：部分失败的世界」，是全科的全景第一站：它不急着给任何解法，先把单机世界里隐含的假设逐条作废——消息会迟到、同伴分不清死活、时钟各说各话——让后面每一课都有明确的敌人。学完你能说清「部分失败」为什么是分布式系统的定义性特征，也能预判后面三站各自要收拾哪一摊残局。
overview:
- key: 一句话总结
  value: 分布式的难，不在机器多，而在于你永远只能靠迟到的消息，去猜一个看不全的世界
- key: 作废的假设
  value: 调用即达（消息会丢会迟）、失败即知（死与慢不可分）、时钟唯一（各机自说自话）、状态一处（副本各有进度）
- key: 定义性特征
  value: 部分失败：系统的一部分坏了，其余部分还在照常运行——单机世界里不存在这种状态
- key: 超时的本质
  value: 用有限的信息给「对方死没死」下二值判决，所以不存在正确的超时值，只有按代价选的超时值
- key: 换来的东西
  value: 规模、容错、就近——难是这三样东西的标价，不是劝退书
- key: 全科地图
  value: 本课摊清单，后三课逐个还账：一致性的谱系、共识与 Raft、时间与跨机事务
