- id: what-you-get
  title: 难归难：分布式换来的三样东西
  tldr: 规模、容错、就近——这三样单机给不了，所有的难都是它们的标价，不是劝退书。
  body: '清单摊完，免得误会：本课不是劝退。把系统拆到多台机器上，换来的是三样单机永远给不了的东西。第一是规模：一台机器的 CPU、内存、磁盘都有物理上限，而把负载摊到一百台机器上，上限就抬高了两个量级——互联网级服务的体量，只能这样长出来。第二是容错：一台机器坏了只是百分之一的容量波动，而不是全站停摆；数据多存几份，单点故障从事故降级成日常维护。第三是就近：用户在全球，服务器放在他身边几十毫秒之外，体验是把服务部署在离用户最近的机房里换来的，单机做不到。

    把账算平：后面每一课要拆的难题——一致性怎么保、共识怎么达成、时间怎么排序——都是在为这三样东西付尾款。理解分布式的心态应该是工程师式的：不问「为什么这么麻烦」，而问「这份麻烦换来了什么、还有没有更便宜的付法」。

    也要记住反面：用不上这三样的系统，就别上分布式。一台机器能装下的业务，单机就是最优解——分布式的所有复杂度，都是在为「一台机器装不下、坏不起、离太远」这三件事赎身。'
  derivation: original
