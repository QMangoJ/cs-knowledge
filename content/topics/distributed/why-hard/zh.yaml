steps:
- id: origins
  title: 单机撞上三堵墙，才逼出多机协作
  tldr: 分布式不是凭空设计出来的花架子，而是单机接连撞上「算不过来装不下、坏一台就全站停摆、用户离得太远」三堵死墙后，一步步被逼出来的工程形态。
  body: |-
    分布式系统是被单机的物理极限逼出来的，而不是哪位架构师闲来无事造出的复杂玩具。最早的计算机只有机房里的一台大型机，活排队交给它从头算到尾，数据在一处、时钟就一个，坏了就停机大修——今天让你头疼的分布式难题，在那个世界里一个都不存在。

    转折是被三波现实痛点一步步推出来的。第一波是大型机贵得吓人，高校买不起几台，1960 年代末美国把各地机器连起来共用算力，催生了互联网的前身 [[ARPANET]]；等个人电脑便宜下来，企业把前台接待和后台存数据的机器拆开，客户机与服务器正式分家。第二波是互联网把数据量顶穿了单机天花板，2003 到 2006 年间 Google 接连公开三篇奠基论文——分布式文件系统 [[GFS]]、批量计算 [[MapReduce]]、结构化存储 [[Bigtable]]——开源社区照着造出 [[Hadoop]]，用成百上千台廉价普通机器扛海量数据从此成了行业标配。第三波是云计算与微服务普及，机器按秒租退，一个订单系统顺理成章被拆成跑在不同 Linux 服务器上的多个独立进程，隔着网卡靠网络请求协作。

    看清这条演变线就能明白：每一次拆分，都是单机先撞了「装不下、死不起、够不着全球用户」的墙。多机协作确实把这三件事办成了，但账单也当场送到——原本在一台机器内存里顺理成章的事，跨出网线那一刻全变了天。
