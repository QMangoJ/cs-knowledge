- id: retry-amplification
  title: 重试的放大效应：一片好心怎样压垮系统
  tldr: 超时了重试一次，天经地义；可对方慢的原因正是负载时，重试就是往火上浇油，还会滚成雪崩。
  body: '面对超时，最自然的反应是重试：大概只是网络抖了一下，再发一次就好了。单看一次重试无可厚非，可把视角拉到全系统，画面就变了味：对方变慢的原因若是负载过高，每个调用方都在超时后重试，等于在它最喘不过气的时候把请求量翻倍；它更慢，超时更多，重试再翻倍——正反馈闭环，这就是重试风暴（retry storm），无数真实事故的剧本。

    更阴险的是重复执行：请求其实成功了，只是回信在路上丢了，调用方以为失败、重试一次，对方就把同一笔业务做了两遍——扣了两次款、发了两次货。重试因此有个前提纪律：被重试的操作必须幂等（idempotent，同一个请求执行一次与多次效果相同），做不到幂等的，要靠请求编号去重。这条纪律是最后一课的主角之一，这里先埋下。

    缓和的办法都是给重试降速与打散：退避（backoff，每次重试的间隔逐次拉长）、抖动（jitter，在间隔上加随机，避免所有调用方在同一时刻齐步重试）、以及重试预算（一段时间内重试占比超过上限就不再重试）。三招合起来，是把「好心的重试」关进笼子的标准做法。'
  derivation: original
