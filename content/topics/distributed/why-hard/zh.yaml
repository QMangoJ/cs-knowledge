- id: partial-failure
  title: 部分失败：分布式系统的定义性特征
  tldr: 单机只有全活或全死；分布式系统里最常见的状态，是一部分坏了、其余部分还在认真工作。
  body: '分布式系统真正的分水岭，是一种单机世界里不存在的状态：部分失败（partial failure）。一台由许多部分组成的系统，其中一部分坏掉了，其余部分毫不知情、继续运转。单机不会这样：CPU 坏了整台机器就停了，不存在「一半进程活着、一半进程死了、活着的还要把服务撑下去」的场面。

    部分失败最难缠的地方在于它的不确定性：坏掉的部分是真坏了还是只是慢，你不知道（下一幕细说）；更麻烦的是，系统不能因为一部分可疑就整体停摆——电商的订单服务不能因为推荐服务没回音就拒绝下单。于是每个节点都被迫在信息不全的情况下做决定：等，还是不等？信，还是不信？把对方当死了处理，还是当活着继续？

    这也是为什么分布式系统不能靠「写对代码」来保证不出问题。单机程序的 bug 是确定性的，改对了就永远对；分布式系统的故障是环境的一部分，网络会抖、磁盘会满、进程会被暂停，代码写得再对也要在故障的包围里工作。设计的目标因此变了：不是消灭故障，而是让故障发生时，系统坏得可控、恢复得可知。'
  derivation: original
  sources:
  - ref: ddia
    locator: 第 8 章 The Trouble with Distributed Systems（部分失败与不可靠网络）
    claim: 部分失败是分布式系统的定义性特征：系统的一部分故障而其余部分仍在运行，且故障本身带有不确定性，无法确知哪部分坏了
