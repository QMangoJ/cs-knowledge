title: 分布式为什么难：一个没有全局时钟的世界
summary: 单机编程默认成立的四件事——调用立刻返回、崩溃当场可知、全机共用一钟、数据只有一份——一旦把程序拆到多台机器上便同时作废，节点之间只能靠注定会迟到的网络消息拼凑彼此状态。本课先把部分失败、死慢难辨、时钟漂移、光速下限与重试风暴逐条算清，再划出值得为此买单的边界。
premise: 原本跑在一台服务器上的订单系统扛不住增长，被拆成 A、B、C 三个独立服务节点部署在不同机器上，彼此看不见对方的内存，协作全靠发网络消息。某天用户在前端点下「支付 100 元」，节点 A 发消息让节点 B 扣款，等满 3 秒却毫无回音：B 到底是进程崩了没扣成、刚扣完回信丢在路上，还是仅仅被垃圾回收卡住了？在单机里调一次函数就能立刻拿准的事，为什么一跨机器就处处失灵？
position: 本课是分布式系统板块的第一站「难在哪：部分失败的世界」，接在网络传输与数据库主从复制之后。它先不急着抛协议解法，而是把单机世界暗中兜底的四条假设逐一拆穿，解释为什么「部分失败」是分布式系统的定义性特征；学完后你能看懂超时、心跳和重试背后的物理死结，并清楚后面四课各自在替哪条作废假设还债。
overview:
- key: 一句话总结
  value: 分布式的难不在于机器台数多，而在于没有任何节点能直接看见全局现状——大家只能凭着在网络里花时间跑过来的旧消息，去猜一个永远看不全的世界。
- key: 作废的假设
  value: 单机暗中兜底的四条假设跨机后全部作废：调用从内存跳转变成可能丢包迟到的网络消息；故障从操作系统当场回收变成死慢难辨的沉默；时钟从全机唯一变成各走各的石英钟；状态从唯一原件变成进度不一的多份副本。
- key: 定义性特征
  value: 部分失败是分布式独有的常态：三台机器里坏了一台，其余两台毫不知情仍在接单，而且必须在「摸不准同伴到底死没死」的前提下当场做决定。
- key: 超时的本质
  value: 对面沉默时，进程崩溃、机器卡顿与网络堵车在调用方眼里长得一模一样；超时不存在绝对正确的毫秒数，设短了误杀慢节点，设长了真故障迟迟不切，只能按业务更怕哪种错来出价。
- key: 换来的东西
  value: 扛下这些麻烦能换回三样单机给不了的能力：突破单机硬件上限的水平扩容、坏一台只损局部容量的容错能力、以及把服务推到用户身边的低延迟。
- key: 全科地图
  value: 后面四课逐项还债：第 2 课用一致性谱系给「副本进度差」标价，第 3 课用 [[Raft]] 共识解决「意见冲突时听谁裁决」，第 4 课用逻辑时钟与事务补偿解决「跨机先后与原子性」，第 5 课用队列、限流与熔断守住日常调用。
