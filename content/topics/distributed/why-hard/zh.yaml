- id: dead-or-slow
  title: 分不清死与慢：超时的两难
  tldr: 部分失败里最难受的一点，是坏掉的那个不吭声。这一步把镜头拉近：没回音可能是对方死了、可能在忙、可能信还在路上，三种情况在你这边看起来一模一样；而你唯一的办法——超时——设多长都是拿一种错换另一种错。
  body: |-
    把部分失败放大看，核心是一道无解的判别题：对面没回音，到底发生了什么？至少三种可能：对方进程崩了；对方活着，但被流量压住，或被一次长时间的垃圾回收暂停冻住；又或者双方都没事，只是网络拥堵，信还在路上。三种情形在你这端的观察完全相同：都是沉默。
    工程上唯一的武器是超时：等过某个时限还没回音，就当对方死了，改走备用路径。可时限没有正确值，只有价格：设得短，对方只是慢了三秒就被判死刑，流量切走、它随后恢复，系统白折腾一轮，还可能误杀好节点引发连锁切换；设得长，真正的尸体要等很久才被发现，这段时间请求全卡在它身上，用户先一步离开。
    更深的原因在物理上：网络延迟没有上限，消息在拥堵、重试、排队之下可以迟到任意久，「等足够久总能等到」在业务上无意义。超时因此注定要做取舍：要比较把还活着的误判为死了、和把真死了的发现得太晚，哪一种代价更贵。后面每一课的超时参数，都是在不同位置按这个代价做的取舍。
  derivation: original
  canvas:
