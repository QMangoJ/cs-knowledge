- id: partial-failure
  title: 部分失败：分布式系统的定义性特征
  tldr: 通道看清了，再看故障长什么样。单机只有全活或全死；分布式里最常见的状态，是一部分坏了、其余部分毫不知情、还在认真工作。这一步讲的「部分失败」，就是分布式区别于单机的那个标志。
  body: |-
    分布式真正的分水岭，是一种单机世界里不存在的状态：部分失败（partial failure）。一台由许多部分组成的系统，其中一部分坏掉了，其余部分毫不知情、继续运转。单机不会这样：[[CPU]]坏了整台机器就停了，不存在「一半进程活着、一半死了、活着的还要把服务撑下去」的场面。
    它最难缠的是不确定性：坏掉的部分是真坏了还是只是慢，你不知道（下一幕细说）；系统还不能因为一部分可疑就整体停摆——订单服务不能因为推荐服务没回音就拒绝下单。于是每个节点都被迫在信息不全时做决定：等，还是不等？把对方当死了处理，还是当活着继续？
    分布式故障是环境的一部分，网络会抖、磁盘会满、进程会被暂停，代码写得再对也要在故障的包围里工作。设计的目标因此变了：不是消灭故障，而是让故障发生时，系统坏得可控、恢复得可知。
