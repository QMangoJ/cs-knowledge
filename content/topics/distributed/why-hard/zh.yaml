- id: messages-only
  title: 节点之间只剩消息：没有共享的现在
  tldr: 上一步作废的四条，根子是同一件事。这一步就看它：拆开之后，节点之间没有共享内存、没有共同的「现在」，你对另一个节点的全部了解，只来自它上一次发来的消息；那之后它变成了什么样，你并不知道。
  body: |-
    多台机器之间靠什么协作？只有消息。没有共享内存让你写一个变量对方立刻看见，没有全局时钟让你对齐节奏，没有一条总线让你广播给所有人。你能做的只有把一条消息发进网络，然后等对方回消息，或者等到超时放弃。要注意，你知道的永远是对方发出那条消息那一刻的情况：消息还在路上时它那边发生了什么、它在回消息之前又更新了什么，你都无从得知，只能等下一条消息送到才知道。
    后果是：你对任何其他节点的了解，永远停留在它发出上一条消息的那一刻。它现在是死是活、数据更新到哪了，只能从回消息的内容与迟早里猜。两个节点对「现在系统是什么状态」也不可能有完全一致的看法——各自收到的消息，本来到得就有先有后。
    操作系统课里进程间还能靠共享内存与信号量直接协作，网络科里信道又会丢包、会乱序。叠起来就是分布式的日常：每一方都只能看到自己收到的消息，协议设计要做的，就是在这种彼此看不全的情况下，用注定会迟到的消息，维持一个各方都基本认可的共同事实。
