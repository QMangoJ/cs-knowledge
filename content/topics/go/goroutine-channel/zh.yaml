  - id: work-stealing-blocking
    title: "[[工作窃取]]与阻塞交接：闲工位去偷活，卡住线程先交权"
    tldr: 本地队列空了的 P 会从其他忙碌 P 队列尾部一次偷走约一半任务；遇阻塞系统调用时 M 会把 P 转交给其他线程，网络 [[I/O]] 则交给 netpoller 轮询，绝不白占工位。
    body: |-
      任务分进各个 P 的本地队列后，难免忙闲不均：1 号 P 积压了两百个协程，2 号 P 手里的活却早干完了。Go[[调度器]]靠[[工作窃取]]（work stealing）自动找平：空闲的 P 除了定期瞄一眼全局队列，还会随机挑一个忙碌的 P，从对方队列尾部**一把偷走大约一半的 G** 塞进自己兜里。之所以一次偷一半而非偷一个，是为了摊薄跨队列偷取的同步开销，偷一趟就够自己低头忙活好一阵。

      更精彩的配合发生在「卡壳」瞬间。假如某个 G 调用了磁盘文件读写这类真正会阻塞内核线程的系统调用，跑它的线程 M 会被操作系统直接挂起；如果 M 死攥着手里的 P 不撒手，这台工位连同队列里排队的上百个 G 就得跟着陪葬。运行时的做法叫 **P 交接（handoff）**：一旦检测到 M 卡进阻塞系统调用，立刻把 P 从它手里摘下来，转交给另一个休眠中或新拉起的线程 M 继续消费本地队列。

      要是碰上最常见的网络 [[I/O]] 等待（等客户端发包、等下游接口返回），连线程切换都省了：Go 内置了基于操作系统 [[epoll]] 等多路复用机制的**网络轮询器（`netpoller`）**。协程读不到网卡数据时，只把这个 G 单独挂到 `netpoller` 名下等通知，底下的 M 连同手里的 P 当场抽身去跑队列里的下一个 G；等网卡数据到了，`netpoller` 再把刚才那个 G 重新塞回运行队列。一偷、一交、一托管，八颗核从头到尾满负荷运转。
    derivation: original
    sources:
      - ref: go-sched-design
        locator: "Scalable Go Scheduler Design Doc: work stealing 与 P handoff"
        claim: 设计文档规定空 P 从其他 P 的队列窃取约一半任务；G 进入阻塞系统调用时，M 释放 P 给其他 M 使用，网络等待则由 netpoller 统一托管。
        status: verified
        checkedBy: subagent-research
        checkedAt: "2026-11-17"
