        mark: active
      - v: 计数器类状态
        sub: Mutex 更顺手
  log:
  - at: 出处
    text: CSP（Hoare, 1978）→ Go 的语言级实现
- id: select-multiplex
  title: 第七步：select——同时等好几个 channel
  tldr: 一个 goroutine 经常要同时等几路消息：select 让它在多个 channel 里谁先到先处理哪路，还能顺手加超时。
  body: |-
    场景：一个聚合服务要同时问库存、价格、优惠三个下游，答复谁先回来先用谁，超过 200 毫秒没等齐就先返回已有部分。用普通接收语句只能死等某一路；Go 的 select 语句专门干这个：它把多个 channel 的发送与接收写成几个 case，哪个先就绪就执行哪个，多个同时就绪时随机挑一个（避免某一路被饿死）。配上 time.After 返回的定时 channel，「等结果或者等超时」就是再加一个 case 的事；加上 default 分支，则变成「有就收、没有立刻走」的非阻塞模式。

    select 是 Go 并发代码里出现率最高的语句之一，因为真实服务的等待几乎总是多路的：业务结果、上游取消信号（context 的 Done 通道本质上也是一个 channel）、定时器，都要在同一个等待点汇合。写的时候注意一个坑：select 在循环里用时，如果某个 case 对应的 channel 被关闭，它会永远就绪、疯狂空转——关闭的通道要从 select 里摘掉或直接 return。
  derivation: original
  sources:
  - ref: go-spec
    locator: "The Go Programming Language Specification: Select statements"
    claim: 规范定义 select 在多个就绪的通信操作中随机选一执行；配合定时通道可实现超时，default 分支使其非阻塞。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
  code:
    lang: go
    code: |-
      select {
      case v := <-resultCh:   // 结果先到
          use(v)
      case <-time.After(200 * time.Millisecond): // 超时先到
          usePartial()
      }
  canvas:
    kind: datastate
    caption: select 的等待点：多路输入汇合到一个 goroutine
    structure: array
    rows:
    - label: select 的 case
      cells:
      - v: 先到先处理
        sub: 多就绪随机挑
        mark: active
      - v: 200ms 超时
        sub: time.After
      - v: 有就收没有走
        sub: 非阻塞模式
  log:
  - at: 坑
    text: 已关闭的通道在 select 里永远就绪，循环里要防空转
- id: deadlock-self-wait
  title: 第八步：死锁图鉴一——自己等自己，与永远等不到的 close
  tldr: 两种最常见的卡死：无缓冲通道在单 goroutine 里自发自收；消费者等一个永远不会被关闭的通道。
  body: |-
    第一种就是在第五步埋的雷：main 里直接向无缓冲 channel 发送——发送要等接收方，可唯一的 goroutine 正卡在发送上，后面的接收语句永远执行不到。这种情况下所有 goroutine 都睡死了，运行时会直接报错退出：fatal error: all goroutines are asleep - deadlock!。它好歹会喊一声。

    第二种更常见也更安静：生产者写完数据忘了 close(channel)，消费者用 for range 循环收——range 只有在通道被关闭时才结束，于是消费者永远挂在那里等下一条。如果程序里还有别的 goroutine 在跑，运行时不报死锁，进程看起来一切正常，只是这条流水线再也不出活。规矩因此很明确：谁创建、谁发送，谁负责 close；接收方永远不要去关通道（关一个还有人发的通道会引发 panic）。带 range 的消费端，生命线就系在发送方的那个 close 上。
  derivation: original
  sources:
  - ref: go-spec
    locator: "The Go Programming Language Specification: Send statements / Close"
    claim: 规范定义发送在无缓冲通道上阻塞至接收方就绪、close 由发送方负责、向已关闭通道发送会 panic；运行时对全局死锁给出 fatal error。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
  canvas:
    kind: datastate
    caption: 两种卡死的差别：一个当场报错，一个无声无息
    structure: array
    rows:
    - label: 死锁图鉴 · 上
