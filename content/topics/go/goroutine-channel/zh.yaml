      - v: 发送方关
        sub: 接收方不关
        mark: active
  log:
  - at: 原则
    text: 每个 channel 都要能回答「谁关、何时关」
- id: deadlock-cycle-leak
  title: 第九步：死锁图鉴二——循环等待与 goroutine 泄漏
  tldr: 两个 goroutine 互相等对方先收，就构成循环等待；而「发不出去的发送」堆积起来，就是最常见的内存泄漏来源。
  body: |-
    循环等待是死锁的教科书形状：goroutine A 要先把结果发给 B 才肯收 B 的输入，B 那边写的也是同样的顺序——两边都卡在发送上，谁也不先接收。只要有第三个 goroutine 还在跑，运行时同样不会报错：A 与 B 就此从系统里「消失」，它们负责的请求永远得不到回复。排查这类问题靠的是运行时提供的 goroutine 堆栈转储：卡住的 goroutine 会成片地停在 chan send / chan receive 的代码行上，顺着行号对图就能找到环。

    由此引出一个更日常的概念：goroutine 泄漏。它就是局部死锁的累积版——每次请求都新开一个 goroutine 去等一个永远不会来的接收方，单次看只是丢了一个任务，跑上一个月，几万个卡死的 goroutine 带着它们的栈与持有的资源一起堆在内存里。防御写法是固定的：每个可能阻塞的发送，都要给它一条逃生通道——放进 select，同时监听一个取消信号（比如 context.Done），上游不要了，这个 goroutine 就能自己退出。下一课换个话题讲类型系统，但这条纪律会跟着所有 Go 并发代码走下去。
  derivation: adapted
  sources:
  - ref: go-effective
    locator: "Effective Go: Channels / goroutine 生命周期管理"
    claim: 官方文档强调 goroutine 的退出要由程序结构保证：阻塞的发送接收必须配合关闭或取消信号，否则 goroutine 将永久驻留。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
  canvas:
    kind: datastate
    caption: 循环等待与泄漏：同一个病的两种病程
    structure: array
    rows:
    - label: 死锁图鉴 · 下
      cells:
      - v: 互相卡发送
        sub: 成对停在发送
