  - id: channel-rendezvous
    title: 无缓冲 [[channel]] 靠会合传值：数据交手那一刻同步已完成
    tldr: 无缓冲 [[channel]] 没有暂存区，发送与接收必须两个协程同时到场才能当面交接（会合语义）；有缓冲通道则内置固定容量环形队列，未满时发送方放下就走。
    body: |-
      协程跑起来了，彼此之间怎么安全递数据？看下方三行最小代码：`main` 协程先用 `make(chan int)` 建一条无缓冲 [[channel]]，另起一个子协程往里发 `42`，自己在外头收。如果去掉 `go func()` 直接在 `main` 里先发后收，程序当场就会卡死——因为无缓冲通道里连一个格子的暂存区都没有，发送语句 `ch <- 42` 完成的前提是**此刻正好有另一个协程守在对端执行 `<-ch`**。先到的一方必须原地挂起等后到的一方，双方碰面把值直接从发送方栈拷进接收方栈，才双双放行。这种「一手交钱、一手交货」的设计叫**会合（rendezvous）语义**：值传过去的那一瞬间，天然确立了严格的先后同步关系。

      如果改成 `make(chan int, 100)`，运行时底层的通道结构（`hchan`）里就会多出一段容量为 100 的环形数组缓冲区，外加发送等待队列和接收等待队列：只要缓冲区没塞满，发送方把值扔进环形槽位扭头就走；只有缓冲区满了发送才阻塞，彻底空了接收才阻塞。

      选无缓冲还是带缓冲，看的不是心情而是语义：无缓冲提供最强的同步担保——发出去就代表对方肯定接到了；带缓冲适合吸收短时流量毛刺，但如果上下游长期速度倒挂，再大的缓冲迟早也会填满，还容易掩盖下游已经快被压垮的背压信号。
    derivation: original
    sources:
      - ref: go-effective
        locator: "Effective Go: Channels"
        claim: Effective Go 说明无缓冲通道的发送与接收会互相阻塞直到对端到场，交接即同步；带缓冲通道则在缓冲未满时不阻塞发送方。
        status: verified
        checkedBy: subagent-research
        checkedAt: "2026-11-17"
    code:
      lang: go
      code: |-
        ch := make(chan int)   // 无缓冲通道
        go func() { ch <- 42 }() // 发送方：另一个 goroutine
        v := <-ch              // 接收：两边到场，42 交手完成
    canvas:
      kind: datastate
      caption: 无缓冲与带缓冲：仓库的有无，决定发送方等不等
      structure: array
      rows:
        - label: 两种通道
          cells:
            - v: 必须会合
              sub: 等接收到场
              mark: active
            - v: 先放仓库
              sub: 没满放下就走
            - v: 传值即同步
              sub: 交接即先后
              mark: active
    log:
