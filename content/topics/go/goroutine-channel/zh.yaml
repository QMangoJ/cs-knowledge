  - id: gmp-model
    title: "[[GMP]] 调度模型：线程必须先拿 P，并行度由 P 封顶"
    tldr: Go 运行时通过 G（协程任务）、M（内核线程）、P（带 256 槽本地队列的逻辑处理器）三层解耦调度；M 必须持有 P 才能跑 G，真并行上限由等于 GOMAXPROCS 的 P 数量锁死。
    body: |-
      几十万个 [[goroutine]] 终归要落到寥寥几颗 [[CPU]] 核心上执行，负责在用户态居中调度的就是 Go `runtime` 包里的 [[GMP]] 模型（底层对应 `g`、`m`、`p` 三个核心结构体）：
      - **G（Goroutine）**：装着待跑函数、当前[[栈]]与寄存器现场的一份逻辑任务，开几十万个也不稀奇。
      - **M（Machine）**：真正的操作系统内核线程，负责上 CPU 干苦力的工人。
      - **P（Processor）**：逻辑处理器，好比车间里的「持证工位」，身上挂着一条容量为 256 的本地运行队列（local run queue）。铁律只有一条：**M 必须先绑上一个 P，才有资格从 P 的队列里取 G 执行**；没抢到 P 的 M 只能休眠待命或去跑系统调用。

      P 的总个数由 `GOMAXPROCS` 决定，默认等于机器的逻辑 CPU 核数。这就把两件事彻底解耦了：哪怕程序里开了五十万个 G、因为系统调用多拉起了上百个线程 M，**同一微秒真正在 CPU 上并行跑用户代码的 M 永远不超过 P 的个数**。

      为什么要给每个 P 配一条独立的 256 槽本地队列，再备一条全局队列兜底？答案是为了省锁与亲和缓存：如果所有线程都去抢同一条全局队列，光排队抢锁就能把多核性能磨平；让新派生的 G 优先塞进当前 P 的本地队列（满了才溢去全局队列），不仅取任务几乎不用加锁，互相配合的协程还能留在同一颗核的高速缓存里热乎着跑完。
    derivation: original
    sources:
      - ref: go-sched-design
        locator: "Scalable Go Scheduler Design Doc: G/P/M 与本地队列"
        claim: 设计文档定义了 GMP 模型：P 的个数即并行度，P 带本地运行队列（容量 256），溢出与兜底走全局队列，M 必须持有 P 才能执行用户代码。
        status: verified
        checkedBy: subagent-research
        checkedAt: "2026-11-17"
