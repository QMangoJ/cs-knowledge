  log:
  - at: 账一
    text: 线程贵在固定成本：栈与内核调度
  - at: 账二
    text: goroutine 把固定成本压到 KB 级
- id: tiny-growing-stack
  title: 第二步：2KB 的栈为什么够用——不够就长大
  tldr: goroutine 的栈不是固定配给，而是运行时盯着用量伸缩：平时小、深调用时整段搬走扩容。
  body: |-
    线程栈为什么那么大？因为操作系统给线程的栈一旦定下就不能动，程序员只能按最坏情况预留——某个深调用链真用到了，栈不够就是崩溃，于是宁可多给。goroutine 的栈换了个管理方式：起步只给 2KB（这个起步值是 Go 1.4 引入连续栈后的数字），运行时在函数调用前检查剩余空间，不够时就分配一段更大的新栈、把旧栈内容整段拷过去、再更新所有指向栈的指针——这套机制叫连续栈（contiguous stack）。用得深就长大，任务结束栈还回去，平均占用贴着实际用量走。

    对写代码的人来说，这件事完全透明：你不需要给 goroutine 设栈大小，也不用担心默认太小。代价在运行时那边：栈拷贝要花时间、指针要逐个修正，这是 Go 运行时复杂度的一部分。可以记成一句话：goroutine 便宜，一半靠调度在用户态（下一步讲），一半靠栈不再按最坏情况预留。
  derivation: original
  sources:
  - ref: go-faq
    locator: "FAQ: How do goroutines work / stack size"
    claim: goroutine 栈起步 2KB 并由运行时动态伸缩（连续栈），这是单个进程能承载海量 goroutine 的内存基础。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
  canvas:
