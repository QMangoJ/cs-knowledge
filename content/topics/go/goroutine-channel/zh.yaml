        text: channel 不是队列的同义词：无缓冲时它根本没有队列
  - id: csp-share-by-communicating
    title: "[[CSP]] 流水线思维：让数据所有权顺着通道往下交接"
    tldr: 源自 1978 年 Hoare [[CSP]] 模型的 Go 核心格言主张「通过通信来共享内存」：把数据装进 [[channel]] 在工序间流转所有权，任一时刻仅单协程读写；但原地高频改状态仍该直接用 sync.Mutex。
    body: |-
      [[channel]] 的理论祖师爷是图灵奖得主 Tony Hoare 在 1978 年提出的 [[CSP]]（通信顺序进程）模型：并发实体之间不直接翻看彼此的内存，只靠显式通道收发消息。Effective Go 把这套哲学浓缩成了整门语言最出名的一句格言：**「Do not communicate by sharing memory; instead, share memory by communicating.」**（不要通过共享内存来通信，而要通过通信来共享内存。）

      怎么把这句格言落成代码？想象一条售后工单流水线，新工单进来要依次经过「智能分类 → 坐席派单 → 消息通知」三道工序。传统共享内存写法是把工单对象摆在公共内存里，三个线程轮流抢锁上去改字段，谁漏加一把锁就是线上数据竞态；CSP 写法则是拉起三组协程并用两条 channel 串起来——分类协程填完标签把工单塞进通道，从此洗手不碰；派单协程接过来填好负责人再往下一棒传。**数据的所有权顺着通道移交，任何时刻全世界只有一个协程握着这张工单**，数据竞争从结构上就不复存在。

      不过千万别把格言念成教条：通道擅长的是「流水线交接、任务编排与取消广播」；如果十几个协程只是要高频累加同一个内存计数器、或者读写同一张本地内存缓存表，硬套一条 channel 居中倒手反而既啰嗦又慢。Go 标准库大大方方留着 `sync.Mutex` 互斥锁——流动交接用 channel，原地护状态用锁，哪把顺手拿哪把。
    derivation: original
    sources:
      - ref: go-effective
        locator: "Effective Go: Share memory by communicating"
        claim: 该节给出原句并解释：让数据的所有权通过通道转移、任一时刻只有一个 goroutine 持有，是 Go 推荐的并发组织方式；同时说明锁依然存在且适用。
        status: verified
        checkedBy: subagent-research
        checkedAt: "2026-11-17"
    canvas:
      kind: datastate
      caption: 两种组织并发的方式：共享数据加锁，还是让数据流动（工单流水线为业务场景示意）
      structure: array
      rows:
        - label: 组织方式对比
          cells:
            - v: 数据不动人动
              sub: 锁错就竞态
            - v: 数据流动
              sub: 所有权随交接
              mark: active
            - v: 计数器类状态
              sub: Mutex 更顺手
    log:
      - at: 出处
        text: CSP（Hoare, 1978）→ Go 的语言级实现
  - id: select-multiplex
    title: select 多路监听：谁先就绪先办谁，顺手挂上超时闸门
    tldr: "select 让单个协程同时守候多条 [[channel]] 的收发、定时器与取消信号，多路同时就绪时伪随机挑一防饥饿；循环监听时须警惕已关闭通道永远就绪引发的空转。"
    body: |-
      大促商品详情页的聚合接口要同时并发查库存、算到手价、拉优惠券三路下游，谁先回包先组装谁，超过 200 毫秒还没回齐就果断降级返回已有结果。如果只靠普通接收语句 `<-ch`，协程一旦堵在慢吞吞的优惠券通道上，另外两路早就回来的结果也得跟着干等。Go 专门准备了 `select` 多路复用语句（写过前端的同学可以把它类比成语言内置、还能同时管发送和接收的增强版 `Promise.race`）：把多条 [[channel]] 操作并排写成多个 `case`，哪一路先就绪就立刻走哪一路；如果好几路碰巧同时就绪，运行时会掷骰子**伪随机挑一个**执行，防止排在前面的分支把后面的饿死。

      真实生产代码里，`select` 几乎是所有阻塞点的标准插座：一条 `case` 等业务结果通道，一条 `case` 挂上 `time.After(200 * time.Millisecond)` 定时通道兜底超时，再挂一条 `case <-ctx.Done()` 监听上游请求取消（就像前端的 `AbortController` 信号）；如果连一毫秒都不想等，补个 `default` 分支就能瞬间变成「有货就拿、没货扭头就走」的非阻塞试探。

      在 `for` 循环里套 `select` 时务必防住一个经典暗坑：**一条已经 `close` 的通道在接收操作上永远算「已就绪」**（每次读立刻返回零值和 `ok == false`）。如果某个分支对应的通道关掉了，你既没退出循环也没把该通道变量置为 `nil`（`nil` 通道在 `select` 里永远不就绪），循环就会每秒几百万次疯狂命中这个分支，瞬间把整颗 [[CPU]] 核烧到 100%。
    derivation: original
    sources:
      - ref: go-spec
        locator: "The Go Programming Language Specification: Select statements"
        claim: 规范定义 select 在多个就绪的通信操作中随机选一执行；配合定时通道可实现超时，default 分支使其非阻塞。
        status: verified
        checkedBy: subagent-research
        checkedAt: "2026-11-17"
    code:
      lang: go
      code: |-
        select {
        case v := <-resultCh:   // 结果先到
            use(v)
        case <-time.After(200 * time.Millisecond): // 超时先到
            usePartial()
        }
    canvas:
      kind: datastate
      caption: select 的等待点：多路输入汇合到一个 goroutine
      structure: array
      rows:
        - label: select 的 case
          cells:
            - v: 先到先处理
              sub: 多就绪随机挑
              mark: active
            - v: 200ms 超时
              sub: time.After
            - v: 有就收没有走
              sub: 非阻塞模式
    log:
      - at: 坑
        text: 已关闭的通道在 select 里永远就绪，循环里要防空转
  - id: deadlock-self-wait
    title: 卡死现场一：单协程自发自收当场崩，漏写 close 静默挂死
    tldr: 全进程所有协程一起堵死会触发 「all goroutines are asleep - deadlock!」 报错退出；但生产者忘调 close 让 for range 消费者干等只会局部静默挂死，因此通道必须由发送方明确负责关闭。
    body: |-
      用 [[channel]] 最容易踩中的第一颗雷叫「自己等自己」：在单个 `main` 协程里不加 `go` 就直接往无缓冲通道发数据，发送动作死等接收方到场，可接收代码偏偏写在下一行，永远轮不到执行。此时整个进程里连一个活着的协程都不剩，Go 运行时的全局[[死锁]]检测器还能替你兜一把底，当场打印 `fatal error: all goroutines are asleep - deadlock!` 并终止进程——虽然崩了，好歹死得明明白白。

      真正阴险的是第二种：**生产者发完最后一条数据拍拍屁股走了，忘了调用 `close(ch)`**，而下游消费者正用 `for v := range ch` 循环取数据。`for range` 只有在通道被显式关闭且排空后才会跳出循环；少写那句 `close`，消费者协程就会天荒地老地僵在原地等下一条消息。更要命的是，线上服务往往还有心跳、监控或其他接口协程在正常跑，全局死锁检测器看还有活人就一声不吭——进程看似健康存活，唯独这条消费流水线彻底停摆。

      所以每次新建通道时就要把生死契约立好：**永远由发送方负责 `close` 通道，接收方绝对不要越俎代庖去关通道**。因为接收方根本不知道对面是不是还有人正准备往里发，一旦向已关闭的通道执行发送，Go 运行时会当场抛出 `panic` 崩掉协程。
    derivation: original
    sources:
      - ref: go-spec
        locator: "The Go Programming Language Specification: Send statements / Close"
        claim: 规范定义发送在无缓冲通道上阻塞至接收方就绪、close 由发送方负责、向已关闭通道发送会 panic；运行时对全局死锁给出 fatal error。
        status: verified
        checkedBy: subagent-research
        checkedAt: "2026-11-17"
    canvas:
      kind: datastate
      caption: 两种卡死的差别：一个当场报错，一个无声无息
      structure: array
      rows:
        - label: 死锁图鉴 · 上
          cells:
            - v: 当场 fatal
              sub: 全睡死才触发
            - v: 静默挂死
              sub: 永远等下一条
            - v: 发送方关
              sub: 接收方不关
              mark: active
    log:
      - at: 原则
        text: 每个 channel 都要能回答「谁关、何时关」
  - id: deadlock-cycle-leak
    title: 卡死现场二：互等发送成环，日积月累熬成协程泄漏
    tldr: 两个协程都抢着先向对方无缓冲通道发数据再接收就会构成循环等待；这类局部阻塞日积月累不退出便是「goroutine 泄漏」，必须给阻塞收发配上 select 与 context.Done 逃生门。
    body: |-
      两个协程打配合时还会撞上教科书式的循环[[死锁]]：协程 A 写的是「先把我的结果发给 B，再去收 B 的回执」，协程 B 写的也是「先把我的数据发给 A，再去收 A 的结果」。两条无缓冲通道碰在一起，两边同时卡死在发送语句上，谁也腾不出手去执行下一行的接收。只要进程里还有别的协程在跑，运行时照样不报错；抓这种线上幽灵靠的是导出 `pprof` 协程堆栈快照——你会看到成百上千个协程整整齐齐僵死在 `chan send` 或 `chan receive` 的同一行代码上。

      把这种局部卡死乘以时间，就是后端最头疼的 **goroutine 泄漏**。最典型的事故写法是：主协程开了一个子协程去查慢下游并往无缓冲 `resultCh` 发结果，主协程自己在 `select` 里等了 200 毫秒超时就直接返回给前端了；几秒后慢下游终于回了包，子协程执行 `resultCh <- res`，却发现接货的主协程早就下班走了！于是这个子协程连同它的 2KB [[栈]]和引用的堆内存永久钉死在进程里。每秒漏十个，跑上一周就是几百万个僵尸协程把内存生生撑爆（OOM）。

      根治协程泄漏的工程铁律只有两条：要么给这类单次结果通道设 `1` 个缓冲槽（`make(chan Result, 1)`），让迟到的子协程放下结果就能体面退出；要么把所有可能阻塞的发送都包进 `select`，并排监听 `<-ctx.Done()` 取消信号，一旦上游放弃等待就立刻跟着收工撤退。
    derivation: adapted
    sources:
      - ref: go-effective
        locator: "Effective Go: Channels / goroutine 生命周期管理"
        claim: 官方文档强调 goroutine 的退出要由程序结构保证：阻塞的发送接收必须配合关闭或取消信号，否则 goroutine 将永久驻留。
        status: verified
        checkedBy: subagent-research
        checkedAt: "2026-11-17"
    canvas:
      kind: datastate
      caption: 循环等待与泄漏：同一个病的两种病程
      structure: array
      rows:
        - label: 死锁图鉴 · 下
          cells:
            - v: 互相卡发送
              sub: 成对停在发送
            - v: 越积越多
              sub: 每次丢一个
            - v: select+取消
              sub: 阻塞要有逃生口
              mark: active
    log:
      - at: 纪律
        text: 没有确定接收方的发送，不要裸着写
  - id: when-not-goroutine
    title: 并非万物皆该开协程：算清粒度、协调与可读性三笔账
    tldr: "[[goroutine]] 便宜在创建与栈内存，不便宜在跨协程协调；计算粒度过细会反被调度开销拖慢，工程上应先写清晰的顺序代码，测出真实等待或并行瓶颈后再引入并发。"
    body: |-
      刚尝到 `go` 关键字甜头的新手最容易犯「并发滥用症」——看见一个遍历一万个元素的数组求和循环，也忍不住拆成一万个 [[goroutine]] 去跑。结果一压测反而比单协程慢好几倍：虽然协程比线程轻得多，但入队、调度切换、连续[[栈]]检查和通道收发全是真金白银的指令开销；当单次计算本身只需要几十纳秒时，调度的包装费早就贵过了货物本身。

      比机器开销更贵的是人的心智账单：顺序代码天然没有竞态、没有乱序、出错直接往外 `return`；一旦拆成多协程并发，你就必须逐一回答「共享变量谁有资格改」「第 3 个协程报错了怎么通知另外 9 个停手」「返回给前端的列表还要不要保住原来的顺序」。这些问题漏答任何一个，埋下的都是只有半夜流量高峰才复现的偶发 Bug。

      在提交任何一段带有 `go func()` 或 [[channel]] 的代码前，养成自查三问的肌肉记忆：
      1. **这处真有等待或重计算瓶颈吗？** 顺序代码够快就绝不瞎拆并发。
      2. **启动的每个协程清楚自己什么时候退出吗？** 盯紧对端走了以后它会不会永远卡在通道收发上。
      3. **这条通道由谁负责 `close`、取消信号怎么传进去？** 发送方关通道、长耗时必带 `context.Context`，守住这两条底线就能避开九成线上并发事故。
    derivation: adapted
    sources:
