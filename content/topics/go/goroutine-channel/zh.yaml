    text: 没有确定接收方的发送，不要裸着写
- id: when-not-goroutine
  title: 第十步：边界——不是所有事都值得开一个 goroutine
  tldr: goroutine 便宜不等于免费：调度、栈与协调都有价；顺序能写清的逻辑，别为了并发而并发。
  body: |-
    最后划边界。第一笔账是调度本身：每个 goroutine 都要被调度器排队、切换，栈要伸缩管理，任务粒度太细时，这些开销会超过任务本身——把一个几行代码的循环拆成一万个 goroutine 分片跑，很可能比单 goroutine 还慢。第二笔账是协调成本：一旦并发，就要回答数据谁持有、出错谁收尾、结果是按完成顺序还是原始顺序——这些问题顺序代码根本不存在。第三笔账是可读性：Go 社区有句常被引用的话，大意是不要为了用并发而并发；先写顺序版本，测出瓶颈确实在等待或并行度上，再把那一段改成 goroutine 加 channel。

    本课收束成三句：成本上，goroutine 把执行流的固定开销从 MB 级压到 KB 级，这是它敢当默认写法的底气；机制上，GMP 用 P 封顶并行度、用工作窃取分匀活、用交接与 netpoller 让等待不占工位；纪律上，channel 的每一次阻塞都要有确定的对端或逃生口，否则死锁与泄漏只是时间问题。
  derivation: adapted
  sources:
  - ref: go-sched-design
    locator: "Scalable Go Scheduler Design Doc: 设计目标与开销讨论"
    claim: 设计文档的目标是让调度开销足够低以支持细粒度并发，但调度与栈管理仍是真实成本，任务粒度过细时得不偿失。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
  canvas:
    kind: datastate
    caption: 开 goroutine 之前要过的三道账
    structure: array
    rows:
