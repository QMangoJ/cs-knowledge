- id: channel-rendezvous
  title: 第五步：channel——传值的那一瞬，同步也完成了
  tldr: 无缓冲 channel 是一次会合：发送方与接收方都到场，数据才交手；交手完成之前，双方都在原地等。
  body: |-
    机制先看最小例子。下面这段代码里，main 向一个无缓冲 [[channel]] 发一个数字，再从它收回来打印——这行不通：发送动作会一直等接收方出现，可接收方正是发送方自己后面的代码，永远轮不到执行，程序直接死锁（第八步细讲）。这个「坑」恰好说明了 channel 的语义：无缓冲通道没有暂存区，发送完成的条件是「另一个 goroutine 此刻正在接收」，数据从发送方的手里直接交到接收方手里，这次交接同时向双方保证了对方已经到达某个执行点——传值与同步是同一个动作。

    带缓冲的 channel 则相当于在通道中间加了一个小仓库：make(chan T, 100) 表示仓库能存 100 个值，仓库没满时发送方放下就走，空了时接收方才等。它适合削峰，但也会把「对方处理不过来」的信号推迟——缓冲不是越大越好。下面例子把发送挪进一个新 goroutine，才是这段代码的正常形态。
  derivation: original
  sources:
  - ref: go-effective
    locator: "Effective Go: Channels"
    claim: Effective Go 说明无缓冲通道的发送与接收会互相阻塞直到对端到场，交接即同步；带缓冲通道则在缓冲未满时不阻塞发送方。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
  code:
    lang: go
    code: |-
      ch := make(chan int)   // 无缓冲通道
      go func() { ch <- 42 }() // 发送方：另一个 goroutine
      v := <-ch              // 接收：两边到场，42 交手完成
  canvas:
    kind: datastate
    caption: 无缓冲与带缓冲：仓库的有无，决定发送方等不等
    structure: array
    rows:
    - label: 两种通道
      cells:
      - v: 必须会合
        sub: 等接收到场
        mark: active
      - v: 先放仓库
        sub: 没满放下就走
      - v: 传值即同步
        sub: 交接即先后
        mark: active
  log:
  - at: 语义
    text: channel 不是队列的同义词：无缓冲时它根本没有队列
- id: csp-share-by-communicating
  title: 第六步：CSP 与那句口号——用通信来共享内存
  tldr: 「不要通过共享内存来通信，要通过通信来共享内存」：数据的所有权跟着通道走，谁收到谁负责，锁就没活干了。
  body: |-
    channel 的思想来源是 [[CSP]]：Tony Hoare 在 1978 年提出的并发模型，主张独立的进程之间不共享内存、只通过通道传消息。Go 把这套模型做成了语言设施，并留下一句官方口号，出自 Effective Go：「Do not communicate by sharing memory; instead, share memory by communicating.」翻译过来：不要靠共享内存来通信，要靠通信来共享内存。

    这句话落到写代码上是一个具体的组织方式：把数据当成在流水线上流动的工件——一个 goroutine 处理完，通过 channel 把结果交给下一个，自己不再碰它。所有权随交接转移，任何时刻一份数据只有一个 goroutine 在动，竞态从源头消失大半。举个工单系统的业务场景示意：新工单进来后要经过「分类、派单、通知」三步，与其让三个模块共享一张工单表各自加锁读写，不如让工单对象在 channel 里依次流过三个处理 goroutine——每步处理完往下传，整条线天然串行、安全。要注意边界：如果几个 goroutine 就是要频繁读写同一份共享状态（比如一个计数器），硬套 channel 反而别扭，Go 同时提供了 sync.Mutex——口号指方向，不是禁令。
  derivation: original
  sources:
  - ref: go-effective
    locator: "Effective Go: Share memory by communicating"
    claim: 该节给出原句并解释：让数据的所有权通过通道转移、任一时刻只有一个 goroutine 持有，是 Go 推荐的并发组织方式；同时说明锁依然存在且适用。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
  canvas:
    kind: datastate
    caption: 两种组织并发的方式：共享数据加锁，还是让数据流动（工单流水线为业务场景示意）
    structure: array
    rows:
    - label: 组织方式对比
      cells:
