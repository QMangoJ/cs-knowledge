- id: gmp-model
  title: 第三步：调度器 GMP——抓住 P 就抓住了一大半
  tldr: G 是任务、M 是线程、P 是「开工许可」：线程必须先拿到 P 才能跑任务，并行度由 P 的个数封顶。
  body: |-
    几十万个 goroutine 最终要落到几个 CPU 核上跑，中间这层就是 Go 运行时的调度器，模型叫 [[GMP]]。三个字母各管一件事：G 是 goroutine，也就是待跑的任务；M 是操作系统线程，是真正在 CPU 上干活的工人；P 是逻辑处理器，可以理解为一个工位——它带着一条本地运行队列（run queue），存着等着在这个工位上跑的 G。关键规则只有一条：M 必须先拿到一个 P，才能从 P 的队列里取 G 来执行；没有 P 的 M 只能等着或去干杂活。

    P 的个数由 GOMAXPROCS 决定，默认等于 CPU 核数。这意味着：同一时刻真正并行执行的 goroutine 最多就是核数个，其余都在队列里排队——goroutine 可以开几十万个，但「同时在跑」被 P 封了顶。本地队列的容量在调度器设计里定为 256：一个 P 的队列满了，新 G 会溢到一条全局队列里，空闲的 P 没活时先去全局队列拿。这样设计的原因很实际：大多数 G 只跟少数几个 G 协作，把它们留在本地队列，缓存命中率更高、跨核搬运更少。
  derivation: original
  sources:
  - ref: go-sched-design
    locator: "Scalable Go Scheduler Design Doc: G/P/M 与本地队列"
    claim: 设计文档定义了 GMP 模型：P 的个数即并行度，P 带本地运行队列（容量 256），溢出与兜底走全局队列，M 必须持有 P 才能执行用户代码。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
  canvas:
    kind: datastate
    caption: GMP 三件套各自的角色（8 核机器示意）
