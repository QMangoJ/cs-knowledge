overview:
  - key: 一句话总结
    value: "[[goroutine]] 靠 2KB 可伸缩连续[[栈]]与用户态 [[GMP]] 调度把并发执行流成本砍低千倍；[[channel]] 把传值与同步合二为一，前提是每个阻塞点都备好确定的对端或取消逃生口"
  - key: 内存成本账
    value: 操作系统线程固定预留 1–8MB 栈，一万连接需 10–80GB；goroutine 起步仅 2KB 按需扩容，一万连接只占约 20MB
  - key: GMP 调度核心
    value: G 为协程任务、M 为内核线程、P 为带 256 槽本地队列的逻辑处理器（默认等于 [[CPU]] 核数）；M 必须先拿到 P 才能跑 G，靠[[工作窃取]]与 P 交接吃满多核
  - key: channel 生存铁律
    value: 无缓冲通道靠双方到场会合完成传值与同步；永远由发送方负责 close；可能阻塞的收发必须配合 select 与 context.Done 防[[死锁]]和泄漏
summary: "[[goroutine]] 用 2KB 起步的连续[[栈]]与用户态 [[GMP]] 调度器把几十万条并发任务铺到与核数相等的几个线程上，[[channel]] 再以「传值即同步」移交数据所有权；算清内存账、P 的并行封顶机制与通道泄漏死穴，才能驯服 Go 的高并发利器。"
premise: 电商大促当晚，网关同时挂着一万条客户端长连接等下单、等支付回调：按「一连接一线程」来接，光预留栈空间就要吃掉几十 GB 内存；为什么换成 [[goroutine]] 起步只占约 20MB，而顺手写的 [[channel]] 一旦漏掉退出路径又会让成千上万个协程静默卡死在内存里？
position: 本课位于 Go 语言学科核心板块「并发：goroutine 与 channel」，承接第一课「把并发做进语言」的设计立论。学完你能算清协程与内核线程的千倍内存账，拆透 GMP 调度与工作窃取的运转闭环，并避开线上最高发的通道死锁与协程泄漏大坑。
level: 进阶
minutes: 26
prereq:
  - go/origins
objectives:
  - 算清 [[goroutine]] 与操作系统线程在初始[[栈]]内存、扩容方式与调度层级上的数量级差异
  - 拆透 [[GMP]] 模型里 P 封顶并行度、[[工作窃取]]、阻塞系统调用 P 交接与 netpoller 托管的配合机制
  - 讲清 [[CSP]]「用通信来共享内存」与互斥锁的适用边界，熟练运用 select 处理多路等待与超时
  - 精准识别单协程自锁、漏关通道挂死、循环等待与 goroutine 泄漏四类现场并给出防御写法
aiLink: 今天用 Go 编写的 [[LLM]] 推理网关与 Agent 并行工具调用编排器，动辄要同时维持上万路 SSE 流式连接并并发扇出检索请求：靠的正是 [[GMP]] 里 P 把海量等待协程与少量工作线程解耦，再借 select + context 随时掐断超时或用户取消的流。
bridge:
  prev: 上一课立下了「把并发原语直接做进语言运行时」的总账，本课立刻掀开引擎盖兑现承诺：先算一万条连接下线程栈为什么先爆，再拆解运行时怎样靠连续栈、GMP 调度器与通道把高并发变成平铺直叙的日常代码。
  next: 并发回答了「怎样同时干成千上万件事」，下一课转向大型工程怎样组织代码结构：在彻底删掉类继承与 try-catch 异常之后，Go 如何单靠隐式接口、结构体[[组合]]与显式 error 返回撑起整套类型系统。
design:
  - mechanism: 用户态 GMP 调度与 2KB 可伸缩连续栈
    problem: 操作系统内核线程固定预留 1–8MB 栈且切换需进出内核，连接数一破万光栈内存就飙上几十 GB，逼得业务代码碎成难懂的异步回调。
    choice: 把调度权收归 Go 运行时：[[goroutine]] 栈从 2KB 起步按需整段搬家扩容，[[GMP]] 以 P 锁死真并行度、靠本地队列与[[工作窃取]]在用户态无感切换。
    tradeoff: Go 运行时必须自己背负一整套复杂调度器、抢占信号与 netpoller 实现；极端深递归触发频繁栈扩容拷贝时也会付出额外运行时开销。
    root: 网络服务绝大部分时间花在等 [[I/O]] 而非算 [[CPU]]：等待中的任务理应按 KB 级逻辑状态计价，而不该按 MB 级内核执行实体计价。
  - mechanism: 无缓冲通道会合语义与所有权移交（CSP）
    problem: 传统共享内存加锁模型里，业务数据与锁全凭程序员自觉配对；漏锁、锁粒度失当或加锁顺序不一，都会埋下只在高压峰值才引爆的竞态与[[死锁]]。
    choice: 把 [[channel]] 做成语言一等公民，无缓冲收发必须双方当面会合，让数据所有权顺着流水线交接，任一时刻仅有一个协程触碰数据。
    tradeoff: 通道并非银弹——未配对的阻塞发送极易酿成静默的 goroutine 泄漏；且面对高频原地读写的计数器或缓存表，硬套通道反而不如 sync.Mutex 直接高效。
    root: 并发最难的从来不是「同时跑」，而是「安全交接」；把传值与同步捏成同一个原子动作，竞态风险面就从漫天散落的共享变量收窄到了几条清晰的通信管道上。
quiz:
  - q: 同样承接一万条空闲等待的长连接，用操作系统线程与用 [[goroutine]] 相比，几十 GB 与几十 MB 的内存差距主要出在哪里？
    options:
      - 操作系统线程栈固定预留 1–8MB，而 goroutine 连续[[栈]]从 2KB 起步、按实际深度动态伸缩
      - goroutine 执行函数完全不需要调用栈
      - 操作系统线程必须额外占用显卡显存
      - goroutine 会把暂时不用的局部变量自动换出到磁盘文件
    answer: 0
    explain: 核心账本就在栈空间上：一万个固定 1–8MB 的线程栈直接吃掉 10–80GB，而一万个 2KB 起步的协程栈合计仅约 20MB，叠加用户态调度才撑起单机十万级并发。
  - q: 在 [[GMP]] 调度模型中，真正决定「同一微秒最多有几个用户态 [[goroutine]] 在多核上同时并行执行」的是？
    options:
      - 当前已创建的 G（goroutine）总数
      - 进程当前拉起的 M（操作系统内核线程）总数
      - P（逻辑处理器）的个数，由 GOMAXPROCS 控制，默认等于逻辑 [[CPU]] 核数
      - 全局运行队列的槽位上限
    answer: 2
    explain: 铁律是「M 必须持有 P 才能跑 G」：阻塞系统调用虽会让 M 的数量超过核数，但没握着 P 的 M 跑不了用户协程，因此真并行度严格由 P 的数量封顶。
  - q: 向一条无缓冲 [[channel]]（make(chan int)）执行发送语句 ch <- v，什么时候才算真正执行完成？
    options:
      - 数据拷贝进通道内部环形缓冲区的那一刻
      - 恰好有另一个 goroutine 在对端接收、双方当面把数据交接完毕的那一刻
      - 发送语句刚一调用就立即返回，由后台运行时异步投递
      - 下一次垃圾回收（[[GC]]）扫描完该通道时
    answer: 1
    explain: 无缓冲通道没有任何内部暂存槽，遵循会合（rendezvous）语义：发送方与接收方必须同时到场完成值交接，传值完成的瞬间同步也一并达成。
  - q: 线上服务里有一批业务 [[goroutine]] 永久卡死在无人接收的 [[channel]] 发送上，但 HTTP 主监听协程仍在正常运转，此时会发生什么？
    options:
      - Go 运行时立刻打印 「all goroutines are asleep - deadlock!」 并退出整个进程
      - 运行时不报任何错误：全局[[死锁]]检测只管「全员睡死」，局部卡死会化作 goroutine 泄漏悄悄吞噬内存
      - "[[GC]] 发现该通道无人再读后会自动强行销毁卡住的 goroutine"
      - "[[GMP]] 调度器会在超时 1 分钟后自动强制唤醒阻塞协程并返回错误"
    answer: 1
    explain: 这是生产环境最隐蔽的陷阱：只要进程里还有一个协程在跑，全局死锁检测就不会触发；卡住的协程连同栈与堆引用永久驻留，必须靠有缓冲结果槽或 select 配合 context.Done 防御。
steps:
  - id: ten-thousand-connections
    title: 一万条长连接算内存账：线程栈先爆，协程只占约 20MB
    tldr: 操作系统线程固定预留 1–8MB 栈，一万条空闲等待的长连接光栈就要吃掉 10–80GB；[[goroutine]] 起步栈仅 2KB，一万个才占约 20MB，把单连接固定成本砍低约一千倍。
    body: |-
      电商大促当晚，接入网关上同时挂着一万条客户端连接，绝大部分时间它们什么都不算，只是静静等着——等用户点下单、等支付渠道回调、等库存服务回包。如果按最符合直觉的「一条连接配一个操作系统线程」来写，不用等 [[CPU]] 跑满，内存就先炸了：操作系统给每个线程固定预留的[[栈]]通常高达 1–8MB，一万个线程光栈空间就要吞掉 10–80GB，这还没算内核线程控制块与频繁陷入内核切换上下文的开销。传统后端为了活命，要么用线程池限流排队，要么把好端端的顺序逻辑切碎成满屏异步回调。

      换成 Go 来算同一笔账，数字瞬间降了三个数量级：一个 [[goroutine]] 起步栈只有 2KB，一万个协程加起来不过 20MB 左右；哪怕在线连接飙到几十万条，总栈内存依然稳稳压在 1GB 以内。

      执行流的固定成本便宜了约一千倍，写代码的姿势就彻底翻篇了：工程师不再需要精打细算省着用线程，直接「每来一条连接开一个 goroutine，从头到尾按同步顺序往下写」成了最地道的默认写法。至于 2KB 的小栈怎么防溢出、几十万协程怎么落到几个核上跑，正是运行时在底下替你扛下的活。
    derivation: original
    sources:
      - ref: go-faq
        locator: "FAQ: Why goroutines instead of threads"
        claim: FAQ 说明 goroutine 的栈按需伸缩、起步极小，使单个进程可以同时跑成千上万个 goroutine，而线程的固定大栈与内核调度成本撑不住这个量级。
        status: verified
        checkedBy: subagent-research
        checkedAt: "2026-11-17"
    canvas:
      kind: datastate
      caption: 一万个连接的栈内存账（起步值，业务场景示意）
      structure: array
      rows:
