id: go/goroutine-channel
subject: go
slug: goroutine-channel
title: goroutine 与 channel：把并发做进语言
order: 2
visual: datastate
logColumns:
- key: at
  label: 阶段
- key: text
  label: 发生了什么
status: published
license: CC-BY-NC-SA-4.0
overview:
- key: 一句话总结
  value: goroutine 把执行流的固定成本从线程的 MB 级压到 2KB 起步，GMP 调度器再以 P 封顶并行度、用工作窃取分活；channel 把传值与同步合成一个动作，代价是每次阻塞都要有确定的对端或逃生口
- key: 成本账
  value: 线程栈固定 1–8MB、goroutine 栈 2KB 起步按需伸缩，一万个连接的栈内存从几十 GB 降到约 20MB
- key: GMP
  value: G 是任务、M 是线程、P 是带本地队列的逻辑处理器，个数等于 GOMAXPROCS；M 必须先持有 P 才能跑 G
- key: channel 纪律
  value: 无缓冲通道靠会合完成传值与同步；发送方负责 close；阻塞操作要配 select 与取消信号，防死锁与泄漏
summary: 线程模型撑不住网络服务的连接数：一个线程光栈就要占 1–8MB，一万个连接就是几十 GB 内存。Go 的 goroutine 起步栈只有 2KB、按需长大，运行时再用 GMP 调度器把几十万个协程铺到与核数相同的几个线程上。channel 则把「传值」和「同步」合成一个动作，逼你用通信组织并发。本课把成本账、调度模型与最常见的两种死锁一次讲清。
premise: 一万个连接同时在线：用线程接，每个连接几 MB 栈，内存先爆；用 goroutine 接，每个连接 2KB 起步，这才是常态写法。
position: 这是 Go 学科的第二课，位于「并发：goroutine 与 channel」板块，紧接第一课的设计哲学：上一课说并发是 Go 的立身之本，本课拆开它的成本账与调度机制，并给出 channel 的使用边界与死锁图鉴。
level: 进阶
minutes: 26
prereq:
- go/origins
objectives:
- 能算清 goroutine 与线程的成本差：栈大小、数量级、调度方
- 能讲清 GMP 模型：P 为什么是关键、工作窃取怎么分活、阻塞时 P 怎么交接
- 能解释「用通信来共享内存」与锁的区别，并说出 select 的用途
- 能识别两种最常见的 channel 死锁与 goroutine 泄漏场景
aiLink: 理解 GMP 的关键是抓住 P：它把「能同时跑几个 goroutine」与「有几个操作系统线程」解耦——线程可以远多于核数，真正限流的是 P。
bridge:
  prev: 上一课立下结论：Go 把并发做进语言，是为了让服务器用最自然的写法接住海量连接。本课兑现这个结论：先算一笔内存账，看看线程模型为什么在连接数面前先撑不住，再看运行时用什么模型把协程铺开。
  next: 并发解决的是「同时做很多事」，下一课换到类型系统：Go 没有继承，靠的是接口的隐式实现与类型的组合嵌入——以及它那套最有争议的设计，把 error 当普通值一层层显式返回。
design:
- mechanism: 用户态调度加可增长栈：goroutine 由 Go 运行时（而非操作系统内核）调度，栈从 2KB 起、运行时按需伸缩，于是「一个连接一个执行流」从奢侈变成默认。
  problem: 操作系统线程的栈固定占 1–8MB 且调度要进内核：连接数一上万，光栈内存就是几十 GB，线程池与异步回调只能绕，代码形状被迫扭曲。
  choice: 把调度权从操作系统收回运行时：GMP 模型以 P 封顶并行度、本地队列就近取任务、工作窃取分匀负载，goroutine 的创建与切换全程不进内核。
  tradeoff: 运行时自己接管调度，代价是多出一整套 GMP 调度器与抢占机制要维护，且 goroutine 栈的伸缩靠运行时拷贝栈实现，极端深递归时有额外开销。
  root: 网络服务的时间大多花在等待上：等待的任务应该按「逻辑任务」计价而不是按「内核线程」计价，Go 把计价单位从 MB 级压到 KB 级，并发模型才与业务形态对齐。
- mechanism: channel 把传值与同步合成一个动作：无缓冲通道的发送与接收必须双方到场才完成，数据交接的瞬间天然建立了先后关系，不必再单独加锁保护这次交接。
  problem: 共享内存加锁的并发里，数据与锁是两件东西：忘了加锁、加错锁、锁的顺序不一致，都会留下只在高并发下才现形的竞态与死锁。
  choice: 把通道定为首选的协作方式，让数据以「交接」代替「共享」：所有权随值一起转移，任一时刻只有持有者能动这份数据，流水线式的任务分工由此成为默认形状。
  tradeoff: 用 channel 组织并发不是免费的：它适合流水线式的任务分工；遇到「多个协程读写同一份状态」硬套 channel 反而绕远，Go 因此同时保留了互斥锁——哲学归哲学，顺手优先。
  root: CSP 的核心判断是：并发的难点不在计算而在协调；把协调做成语言里的一等公民（传值即同步），竞态的产生面就从「所有共享变量」收窄到「通道的使用方式」。
quiz:
- q: 一万个并发连接，用操作系统线程接与用 goroutine 接，内存差主要来自？
  options:
  - 线程的栈固定占 1–8MB，goroutine 栈 2KB 起步按需长大
  - goroutine 不需要栈
  - 线程要额外占用显存
  - goroutine 把数据存在磁盘上
  answer: 0
  explain: 账算在栈上：一万个线程光栈就是 10–80GB 量级，一万个 goroutine 起步只要约 20MB；再加上调度不进内核，数量级完全不同。
- q: GMP 模型里，决定「同一时刻最多能真并行跑几个 goroutine」的组件是？
  options:
  - G（goroutine 本身）的数量
  - M（操作系统线程）的数量
  - P（逻辑处理器），个数等于 GOMAXPROCS，默认等于 CPU 核数
  - 全局运行队列的长度
  answer: 2
  explain: M 必须先持有 P 才能执行 G；线程可以因为阻塞而多开，但没有 P 就跑不了用户代码，所以并行度由 P 的个数封顶。
- q: 无缓冲 channel 的一次发送，什么时候完成？
  options:
  - 数据写进通道的缓冲区时
  - 有另一个 goroutine 在对端接收、数据交接完成时
  - 调用发送语句后立刻完成
  - 垃圾回收运行时
  answer: 1
  explain: 无缓冲通道是 rendezvous（会合）语义：发送与接收双方到场才成交，这一步同时完成了传值与同步。
- q: 程序里一半 goroutine 永久阻塞在 channel 上、另一半还在正常跑，会发生什么？
  options:
  - 运行时立刻报「all goroutines are asleep」并退出
  - 什么都不报：运行时只检测全局死锁，局部卡死表现为 goroutine 泄漏，任务静默丢失
  - GC 会自动回收阻塞的 goroutine
  - 调度器会强制唤醒它们
  answer: 1
  explain: 这是最阴险的一种：进程看起来活着，卡住的任务永远不完成。写 channel 代码时必须为每个发送安排确定的接收方或退出路径（如配合 context 取消）。
steps:
- id: ten-thousand-connections
  title: 第一步：先算账——一万个连接，线程模型为什么先爆
  tldr: 电商大促时网关挂着一万个长连接：用线程接，光栈内存就要几十 GB；问题不在 CPU，在每个执行流的固定成本。
  body: |-
    先看一个业务场景示意：电商大促当晚，网关上挂着一万个客户端连接，大部分时间它们在等——等用户下单、等支付回调、等库存服务返回。假设按最直白的模型写：一连接配一个操作系统线程，线程阻塞在读操作上等数据。账这样算：一个线程的[[栈]]是固定预留的，通常 1–8MB（视平台与运行时而定）；一万个线程，光栈就是 10–80GB——还没算线程控制块与内核调度开销，内存先爆了。真实系统于是被迫绕路：线程池限流加请求排队，或者写异步回调把逻辑切成碎片，代码形状被成本逼得很难看。

    换 Go 的账：一个 [[goroutine]] 起步栈只有 2KB，一万个约 20MB；就算涨到几十万个连接，栈内存也在 GB 以内。数量级差了约一千倍，于是「一个连接一个 goroutine、同步写法从头写到尾」成了默认姿势。本课后面讲的三件事——栈为什么能这么小、调度器怎么铺开、channel 怎么组织协作——都是为兑现这笔账。
  derivation: original
  sources:
  - ref: go-faq
    locator: "FAQ: Why goroutines instead of threads"
    claim: FAQ 说明 goroutine 的栈按需伸缩、起步极小，使单个进程可以同时跑成千上万个 goroutine，而线程的固定大栈与内核调度成本撑不住这个量级。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
  canvas:
    kind: datastate
    caption: 一万个连接的栈内存账（起步值，业务场景示意）
    structure: array
    rows:
    - label: 1 万个执行流的栈
      cells:
      - v: "10–80 GB"
        sub: 每线程 1–8MB
