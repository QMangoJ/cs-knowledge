- id: work-stealing-blocking
  title: 第四步：活怎么分匀——工作窃取与阻塞交接
  tldr: 某个 P 的队列空了，就去别的 P 那里偷一半任务；某个 M 卡在系统调用上，它手里的 P 会转交给别的线程继续跑。
  body: |-
    队列是分布式的，活就可能分不匀：一个 P 忙死、一个 P 闲着。Go 的办法是[[工作窃取]]：空闲的 P 不傻等，它随机挑一个忙碌的 P，从对方队列尾部一次偷走大约一半的 G 回来跑。偷一半而不是偷一个，是为了减少窃取的往返次数——拿一次就够自己忙一阵。全局队列则是最后的兜底：本地队列溢出的 G 与被唤醒的老 G 先落在那里，P 们定期去捞。

    另一个关键场景是阻塞：goroutine 执行文件读写这类会卡住线程的系统调用时，M 被操作系统挂起；这时它手里的 P 不能跟着闲置——运行时把 P 连同它的队列转交给另一个空闲或新建的 M，队列里的 G 继续有人跑。网络 I/O 还要更进一步：goroutine 等网络数据时，M 不阻塞，等待交给一个网络轮询器（netpoller，底层是 epoll 这类机制），数据到了再把 G 放回队列。这两招合起来，保证了「某个任务在等」不会浪费一个工位。
  derivation: original
  sources:
  - ref: go-sched-design
    locator: "Scalable Go Scheduler Design Doc: work stealing 与 P handoff"
    claim: 设计文档规定空 P 从其他 P 的队列窃取约一半任务；G 进入阻塞系统调用时，M 释放 P 给其他 M 使用，网络等待则由 netpoller 统一托管。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
  canvas:
