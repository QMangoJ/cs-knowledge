    log:
      - at: 账一
        text: 线程贵在固定成本：栈与内核调度
      - at: 账二
        text: goroutine 把固定成本压到 KB 级
  - id: tiny-growing-stack
    title: 2KB 起步不够就搬家：连续栈让内存贴着实际用量走
    tldr: 操作系统线程栈定死后不能挪动，只能按最坏深度预留；[[goroutine]] 采用可伸缩连续[[栈]]，函数入口检查空间不足时自动分配大栈、整段拷贝并修正指针。
    body: |-
      操作系统线程的[[栈]]为什么非要预留好几 MB？因为线程栈在虚拟地址空间里一旦划定就很难原地扩容，万一遇上一条深层调用链把栈撑穿就是直接崩溃，内核与运行时只能宁多勿少、按最坏情况提前圈地。绝大多数只等网络回包的浅层任务，白白占着几 MB 却只用了几 KB。

      [[goroutine]] 换了一套按需配给的活法（Go 1.4 起定型为「连续栈」机制）：刚创建时运行时只批给它 2KB 栈空间；编译器在每个函数开头自动插了一小段栈余量检查指令，一旦发现当前栈快见底了，运行时立刻在堆上申请一块两倍大的新栈，把旧栈里的数据整段拷贝过去，再顺手把所有指向旧栈地址的指针逐一修正到新地址，任务跑完后再把空间收回来。

      对写业务代码的人来说，这套「不够就搬家」全程无感——既不用调栈大小参数，也不必担心 2KB 兜不住深层调用。代价自然记在 Go 运行时账上：扩容瞬间要付出内存拷贝与指针修正的开销。用这点偶发的搬家成本，换掉成千上万空闲连接按最坏情况傻占的几十 GB 内存，这笔买卖稳赚不赔。
    derivation: original
    sources:
      - ref: go-faq
        locator: "FAQ: How do goroutines work / stack size"
        claim: goroutine 栈起步 2KB 并由运行时动态伸缩（连续栈），这是单个进程能承载海量 goroutine 的内存基础。
        status: verified
