  - id: builtin-concurrency-gc
    title: 并发与 [[GC]] 写进语言运行时：高并发不必手管线程与内存
    tldr: 函数前加 go 即可拉起极轻量的 [[goroutine]] 并通过 [[channel]] 通信，配合内置 [[GC]] 自动回收内存；用毫秒级回收停顿与少量 CPU 开销，换掉手工管线程和指针的高危心智负担。
    body: |-
      前几项取舍管的是写代码、编译与发版，这一项直接重塑了服务端运行时的骨架。网络服务每天面对的是数以万计同时在线的连接，每条连接绝大部分时间都在等网络收发或数据库响应。如果沿用「一条连接绑一个操作系统线程」的传统做法，光预留线程栈就能吃光几十 GB 内存；如果改写成层层嵌套的异步回调，业务代码又会被拆得支离破碎。Go 直接把并发升格为一等语法：在任意函数调用前写个 `go` 关键字就能启动一个极轻量的 [[goroutine]]，协程之间通过 [[channel]] 安全传递数据，用平铺直叙的同步写法就能跑出高并发异步的吞吐。

      与之配套的另一半底座是内置垃圾回收（[[GC]]）。常驻后台的服务器程序动辄连续运行数月，每秒都在海量创建请求上下文与临时对象；像 C/C++ 那样靠手工释放内存，在千人协作的并发代码里极易踩出内存泄漏或悬空指针崩溃。Go 从诞生第一天就由运行时接管内存回收，把工程师从算生命周期的泥潭里解放出来。

      天下没有白吃的午餐：内置 GC 要消耗一部分 [[CPU]] 算力做后台扫描标记，还会带来亚毫秒到毫秒级的短暂回收停顿，所以写操作系统内核或硬实时嵌入式固件通常不用 Go。但在网关、微服务、云原生控制面与 AI 编排后端等绝大部分服务端战场，拿这点运行时损耗换取极高的并发开发效率与内存安全，是一笔划算得不能再划算的买卖——这也是 Go 与 C++ 分道扬镳最彻底的一刀。
    derivation: original
    sources:
      - ref: go-effective
        locator: "Effective Go: Concurrency / Garbage collection"
        claim: Effective Go 说明 goroutine 与 channel 是语言级并发设施、开销远低于线程，且 Go 以 GC 换取内存安全与开发效率。
        status: verified
        checkedBy: subagent-research
        checkedAt: "2026-11-17"
    canvas:
      kind: datastate
      caption: 并发模型的位置：库里还是语言里，决定了它是例外还是默认
      structure: array
      rows:
