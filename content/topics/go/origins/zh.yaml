  - id: minimal-25-keywords
    title: 25 个关键字封顶：用克制的语法换全员一致的代码
    tldr: Go 语言规范自 Go 1 至今始终锁死 25 个关键字，只留 for 一种循环并自带 gofmt 强制统一排版，宁肯局部写得啰嗦也要消灭大团队里的「代码方言」。
    body: |-
      翻开 Go 语言规范数一数就知道它有多克制：关键字总共只有 25 个（`break`、`case`、`chan`、`const`、`continue`、`default`、`defer`、`else`、`fallthrough`、`for`、`func`、`go`、`goto`、`if`、`import`、`interface`、`map`、`package`、`range`、`return`、`select`、`struct`、`switch`、`type`、`var`），从 2012 年 Go 1 发布至今一个都没加过。横向对比一眼见分晓：Java 有 50 多个关键字，C++ 更是超过 90 个。不仅关键字少，语法分支也被砍到极致——循环只有 `for` 一种（没有 `while` 和 `do-while`），没有类与继承，没有 `try-catch` 异常，连句末分号都由编译器在词法分析阶段自动补齐。

      为什么要对语法下这么重的手？因为在千人团队里，语言每多塞进两种等价写法，代码库就会分裂出两个互看不顺眼的流派，新人上手成本与老代码维护负担成倍放大。Go 干脆从根源上收走选择权，还在第一天就随官方工具链内置了 `gofmt`——相当于把前端生态里后来靠 Prettier 才普及的「保存即统一排版」直接升格成全语言硬标准，代码审查从此不再为花括号换不换行吵架。

      极简的代价同样摆在明面上：表达手段变少后，不少逻辑写起来确实显啰嗦，最典型的就是每一层调用都得手写 `if err != nil` 判错（第三课细拆）。Go 算完大账后的决定很干脆：认下写代码时多敲几行字的啰嗦，换取全公司几千人读代码时零障碍的通畅。
    derivation: original
    sources:
      - ref: go-spec
        locator: "The Go Programming Language Specification: Keywords"
        claim: 规范列出的关键字恰为 25 个，且自 Go 1 以来未增删。
        status: verified
        checkedBy: subagent-research
        checkedAt: "2026-11-17"
    canvas:
