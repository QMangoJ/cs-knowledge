- id: no-inheritance
  title: 第七步：为什么没有继承——它要解的问题被接口换了种解法
  tldr: 继承想解决的是复用与多态；Go 认为继承树的代价大于收益，改用接口加组合：第三课的主角，这里先立论。
  body: |-
    面试常问：Go 为什么没有类与继承？先看继承在 Google 的规模下出了什么问题：类型关系必须在写代码时提前声明、上报给一棵继承树；项目一大，树越长越脆——改动顶层基类，下游一串子类跟着受影响（脆弱基类问题）；而「一个类型到底有哪些行为」要顺着树爬好几层才看得全，违背了 Go「打开文件就能读懂」的目标。

    Go 的替代方案分两半。多态那一半交给接口：一个类型不需要声明「我实现某接口」，只要它的方法集对得上，编译器就认——关系从「提前登记」变成「用时核对」。复用那一半交给组合：把现成的类型嵌进新类型里，直接借用它的方法（第三课细讲）。官方 FAQ 的说法很直白：Go 故意不做类型层级，因为提前声明关系这件事本身，就是麻烦的来源。要注意这不是说继承一无是处，而是 Go 按自己的三条约束算完账，认为不划算。
  derivation: original
  sources:
  - ref: go-faq
    locator: "FAQ: Why is there no type inheritance"
    claim: FAQ 原文：Go 不要求程序员提前声明两个类型相关；类型自动满足任何包含其方法子集的接口，因此不存在类型层级。
    status: verified
