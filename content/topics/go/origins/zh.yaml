- id: generics-15-years
  title: 第八步：泛型为什么等了十五年——三条实现路线全踩红线
  tldr: 不是没想到，是每次设计都过不了 Go 自己的关：不能拖慢编译、不能让二进制膨胀、不能让运行变慢。
  body: |-
    时间线先摆出来：Go 2009 年开源时没有[[泛型]]；2018 年设计重启；2021 年 2 月提案通过；2022 年 3 月随 Go 1.18 正式发布——从开源算起等了 13 年，从立项算起 15 年。为什么这么久？2009 年，语言设计者 Russ Cox 写了一篇短文《The Generic Dilemma》，把实现泛型的三条路一次说清：第一条，程序员为每种类型手写一份代码——慢在人，等于没有泛型；第二条，编译时为每个用到的类型各生成一份代码（C++ 模板的路）——编译变慢、二进制膨胀，正面撞上 Go 的编译速度红线；第三条，运行时把值装箱成统一表示（早期 Java 的路）——执行变慢，撞上性能红线。三条路每条都要牺牲一个 Go 的核心指标。

    这十年社区的将就办法是 interface{} 加运行时类型断言（丢掉编译期类型安全），或用代码生成工具按类型批量产出代码（能跑但难维护）。最终落地的方案是第四条路：类型参数加「约束」——用接口描述类型参数必须具备的方法，编译器据此做检查；实现上用了一种在生成代码与装箱之间取平衡的办法。这个过程最值得记的不是技术细节，而是判断标准：一个特性再多人想要，只要实现要牺牲语言的核心承诺，就先不上。
  derivation: original
  sources:
  - ref: cox-generics
    locator: "Russ Cox: The Generic Dilemma (2009)"
    claim: 泛型三种实现分别导致程序员慢、编译慢且二进制膨胀、运行慢，三者都不可接受，这是泛型长期缺席的直接原因。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
  - ref: go-release-118
    locator: "Go 1.18 Release Notes: Generics"
    claim: Go 1.18 于 2022 年 3 月发布，泛型（类型参数）随之正式可用。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
