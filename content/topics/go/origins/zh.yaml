        text: 慢的根源是依赖形状，不是编译器手速
  - id: single-binary
    title: 静态链接[[单二进制]]：拷一个文件就能跑，顺手成就容器时代
    tldr: Go 默认把运行时与全部依赖静态打包进单个可执行文件，免去目标机配环境之苦；极简交付路径与超小 scratch 容器镜像天然契合，使它成为云原生基础设施的首选语言。
    body: |-
      写完、编译完，下一步是往成百上千台服务器上发版。用 Java 发版，目标机器得先装好大版本匹配的虚拟机与启动脚本；用 Python 或 Node.js 发版，得在机器上对齐解释器版本与一长串第三方库，稍有偏差就会撞上经典的「在我本机明明跑得好好的」。Go 选了最省心的交付形态：默认把语言运行时（含[[调度器]]与垃圾回收器）、标准库和第三方依赖全部**静态链接进一个独立可执行文件**。

      编译产物就是一个几 MB 到几十 MB 的[[单二进制]]文件：只要操作系统与 [[CPU]] 架构对得上，把它拷上裸机、赋个可执行权限就能立刻跑起来，目标机器上连一行依赖库都不用预装。这套「零外部环境依赖」的脾气恰好撞上了几年后爆发的容器浪潮：制作容器镜像时甚至不需要塞入完整的 Linux 发行版，直接拿空的 `scratch` 基础镜像装进这一个二进制就能上线——镜像体积压缩到几十 MB，拉取秒级完成，连多余的 shell 工具都没留，安全攻击面随之降到最低。Docker 与 [[Kubernetes]] 双双用 Go 写成绝非偶然，基础设施软件要分发到全球无数节点，「单文件交付」就是最短路径。

      硬币的背面同样清楚：每个可执行文件都要各自揣一份运行时，磁盘体积比动态共享库方案偏大；与动态链接库、运行时热加载插件相关的生态也相对薄弱。在服务器磁盘早已白菜价、运维排障工时却贵如黄金的今天，Go 毫不犹豫地选了部署确定性。
    derivation: original
    sources:
      - ref: go-faq
        locator: "FAQ: Why does Go not support dynamic linking / binary size"
        claim: FAQ 说明 Go 默认静态链接、单个二进制包含运行时，这是为部署简单与启动行为可预期做的取舍，代价是体积较大。
        status: verified
        checkedBy: subagent-research
        checkedAt: "2026-11-17"
