  - id: generics-15-years
    title: "[[泛型]]为什么苦等十五年：三条老路全踩核心红线"
    tldr: Russ Cox 早在 2009 年就点破「泛型三难」——手写累人、C++ 模板拖慢编译且胀大体积、早期 Java 装箱拖慢运行；直到类型参数加接口约束方案兼顾三头，[[泛型]]才在 2022 年 Go 1.18 落地。
    body: |-
      Go 的演进史上最受争议的一桩悬案就是[[泛型]]：2007 年立项、2009 年开源时统统没有，2018 年才重启正式设计，2021 年 2 月提案获批，直到 2022 年 3 月随 Go 1.18 才正式上线——从立项算起整整熬了 15 年。不是核心团队看不见社区的呼声，而是早在 2009 年，核心设计者 Russ Cox 就在名篇《The Generic Dilemma》（泛型三难）里把账摊在了桌面上：当时业界实现泛型的三条老路，每一条都精准踩中 Go 的命门。

      哪三条老路？第一条是 C 语言式的**不管不顾**，让程序员为 `int`、`string` 各手抄一遍函数——慢在程序员，等于没解决问题；第二条是 C++ 模板式的**编译期单态化**，编译器为每种具体类型各生成一份机器码——运行虽快，却会导致编译变慢、二进制体积暴涨，正面撞碎 Go 好不容易砍出来的秒级编译红线；第三条是早期 Java 式的**运行时统一装箱**，把所有值包成指针间接访问——保住了编译速度，却多了内存分配与解引用开销，拖慢运行性能。三条路不管选哪条，都要牺牲一项核心立身之本，Go 团队干脆拍板：没想出两全之策前，宁可先不上。

      在漫长的十几年空窗期里，社区只能靠 `interface{}` 配合运行时类型断言（牺牲编译期类型安全），或者靠 `go generate` 代码生成工具硬扛。直到 Go 1.18 最终落地的「类型参数 + 接口约束」方案成熟——用接口来限定类型参数允许的操作，底层编译器按数据的内存形状（GC shape）做混合单态化与字典传参，把编译耗时、二进制体积和运行速度捏到了可接受的平衡点，这道卡了十五年的关口才终于放行。
    derivation: original
    sources:
      - ref: cox-generics
        locator: "Russ Cox: The Generic Dilemma (2009)"
        claim: 泛型三种实现分别导致程序员慢、编译慢且二进制膨胀、运行慢，三者都不可接受，这是泛型长期缺席的直接原因。
        status: verified
        checkedBy: subagent-research
        checkedAt: "2026-11-17"
      - ref: go-release-118
        locator: "Go 1.18 Release Notes: Generics"
        claim: Go 1.18 于 2022 年 3 月发布，泛型（类型参数）随之正式可用。
        status: verified
        checkedBy: subagent-research
        checkedAt: "2026-11-17"
