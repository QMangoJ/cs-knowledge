      kind: datastate
      caption: 泛型三难：每条实现路线牺牲的东西，正好都是 Go 的命根子
      structure: array
      rows:
        - label: 三条路的代价
          cells:
            - v: 慢在人
              sub: 等于没有泛型
            - v: 编译慢+膨胀
              sub: C++ 模板的路
            - v: 运行慢
