id: go/origins
subject: go
slug: origins
title: Go 为什么诞生：为多核与网络时代重写一门语言
order: 1
visual: datastate
logColumns:
- key: at
  label: 阶段
- key: text
  label: 发生了什么
status: published
overview:
- key: 一句话总结
  value: Go 是为多核、网络服务与大代码库三条约束设计的语言：不靠加功能取胜，靠把语言做小、把编译做快、把并发做进语法，让几千人维护同一批服务器代码的总成本降下来
- key: 出身
  value: 2007 年三位设计者在等一次约 45 分钟的 C++ 构建时起意，2009 年 11 月开源，2012 年 3 月 Go 1 发布并附兼容承诺
- key: 四项取舍
  value: 25 个关键字封顶的极简、只看直接依赖的快编译、静态链接的单文件部署、goroutine 与 GC 内置的并发与内存托管
- key: 两个没有
  value: 没有继承——多态交给隐式接口、复用交给组合；泛型缺席十五年——三条实现路线都踩核心指标，直到 1.18 的约束式设计过关
summary: 2007 年的 Google 有三笔账算不过来：C++ 编译一次要等几十分钟、服务器 CPU 已经全是多核而主流语言的并发还是靠线程硬扛、代码库大到没人读得懂别人的代码。Go 的回答不是加功能，而是做减法：25 个关键字、编译快到像脚本、部署只剩一个文件、并发写进语言本身。本课把每个取舍背后的账算清楚，包括最容易被问的两个：为什么没有继承，泛型为什么拖到 2022 年的 1.18 才有。
premise: 一次 C++ 构建要等 45 分钟——Go 的三位设计者就是在等构建的工夫，开始在白板上画一门新语言的。
position: 这是 Go 语言学科的第一课，位于「为什么是 Go：设计与取舍」板块：先看清 2007 年 Google 的三笔账，才能理解后面 goroutine 与接口两课里的每个决定。本课不教语法，只讲这门语言为什么长成现在这个样子。
level: 进阶
minutes: 22
objectives:
- 能说清 Go 诞生的三个约束：多核、网络服务、大代码库
- 能解释语言极简、编译快、单文件部署、内置并发四项取舍各换来了什么、放弃了什么
- 能回答「为什么没有继承」与「泛型为什么 1.18 才有」两个高频问题
aiLink: 后来 Docker 与 Kubernetes 都用 Go 写成不是巧合：它们要的正是单文件分发与便宜的并发，而这两点在本课的取舍清单里排在最前面。
bridge:
  next: 本课说 Go 把并发做进了语言本身，只给了结论没给机制：下一课拆开 goroutine 与 channel——一个协程起步只要 2KB 栈、调度器怎样把几十万个协程铺到几个线程上、以及那句「用通信来共享内存」到底在要求你怎样写代码。
design:
- mechanism: 语言功能做减法：关键字压到 25 个，不做继承、不做异常，新特性宁缺毋滥。
  problem: 在 Google 的规模下，语言复杂度会被团队规模放大：每个人只用自己顺手的特性子集，代码就分裂成互不相认的方言，审查与重构的成本随人数往上涨。
  choice: 把语言的「功能上限」主动封顶，并用 gofmt 等官方工具把风格统一收归工具，让所有 Go 代码长成一个样，任何人打开任何一份代码都能直接读、直接改。
  tradeoff: 用「表达力上限」换「全员可读」：有些模式写起来确实啰嗦（错误要手动判、早期没有泛型要靠复制代码），但任何一段 Go 代码，团队里任何人打开都能直接读。
  root: Go 优化的不是单人写代码的速度，而是几千人维护同一批服务器代码十年的总成本——编译、阅读、部署、交接，每一笔都按大团队的量级算。
- mechanism: 泛型晚到：2009 年 Russ Cox 就把三种实现路线摆上台面，发现每条都要付出不可接受的代价，于是整个特性被搁置，等约束式设计成熟后才在 1.18 落地。
  problem: 泛型的三难（generic dilemma）：要么程序员手写每种类型的版本（慢在人）、要么编译期为每个类型生成一份代码（编译慢、二进制膨胀）、要么运行时装箱（执行慢）——三条路都踩 Go 的红线。
  choice: 选择「不上」并长期维持这个决定：官方明确让生态先用 interface{} 与代码生成解决眼前问题，而不是为一个没过关的设计背上兼容包袱。
  tradeoff: 宁可让社区用 interface{} 加类型断言、或用代码生成将就十年，也不把一个会拖慢编译或运行的设计塞进语言；代价是这十年里「没有泛型」一直是 Go 被抱怨最多的一条。
  root: 2012 年 Go 1 的兼容承诺让任何进入语言的特性都近乎永久：一旦发布就再也删不掉，所以新特性要先证明「价值配得上复杂度」，泛型过的正是这道最严的门。
quiz:
- q: Go 只有 25 个关键字、长期不做泛型，最主要的原因是？
  options:
  - 编译器团队人手不够，一直排不上期
  - 在 Google 的规模下，语言复杂度会被团队规模放大；特性一旦发布又受兼容承诺约束删不掉，所以宁缺毋滥
  - Go 定位是脚本语言，不需要复杂类型系统
  - 关键字多会让二进制体积变大
  answer: 1
  explain: 极简是按大团队维护成本算的账：功能越少，代码越互通可读；再加上 Go 1 兼容承诺让每个新特性都近乎永久，准入门槛被推到极高。
- q: Go 程序部署时通常只需要拷贝一个可执行文件，因为？
  options:
  - 服务器上预装了 Go 运行时
  - 运行时与依赖默认静态链接进单个二进制，不依赖目标机器的环境
  - Go 代码在部署时会被转成 shell 脚本
  - 包管理器会自动补齐缺失的库
  answer: 1
  explain: 单二进制是静态链接的结果：运行时、标准库与第三方依赖全部打进一个文件，这也是 Docker 镜像可以做到极小的原因。
- q: 关于泛型拖到 Go 1.18（2022 年）才发布，正确的说法是？
  options:
  - 社区一直没人提出需要泛型
  - 泛型会让所有程序运行变慢，所以被永久放弃，后来又反悔
  - 早期三种实现路线分别踩中「程序员慢、编译慢加二进制膨胀、运行慢」，设计一直没过关，直到约束式方案成熟才落地
  - 泛型需要新的硬件指令集支持
  answer: 2
  explain: 这就是 Russ Cox 2009 年总结的 generic dilemma：不是不想做，是每条实现路线都要牺牲 Go 的核心指标，直到 2018 年重启设计、2021 年提案通过。
- q: Go 1 兼容承诺（2012 年）的内容是？
  options:
  - Go 程序永远不需要升级依赖
  - 按 Go 1 规范写的程序，在后续所有 Go 1.x 版本上都应能编译运行
  - Go 保证每个版本都新增至少一个语言特性
  - 旧版本编译器永久免费提供下载
  answer: 1
  explain: 兼容承诺是企业敢把生产系统压在 Go 上的前提；它的另一面是语言进化极其保守——加东西容易删东西难，所以每个特性都要反复论证。
steps:
- id: cpp-build-45min
  title: 第一步：2007 年，等一次编译要 45 分钟
  tldr: Go 的起点是一次等构建的闲聊：服务器代码用 C++ 写，编译一次几十分钟，机器却已经换成了多核。
  body: |-
    先看场景。2007 年 9 月，Google 的工程师 Robert Griesemer、Rob Pike 与 Ken Thompson 在等一个大型 C++ 程序编译——按 Rob Pike 后来的说法，一次构建要等大约 45 分钟。三个人聊起当时的处境：服务器硬件已经全面进入多核时代，服务天生就是网络化的，代码库大到以千人计在同一批代码上干活。可手里的语言没有一个是按这三件事设计的：C++ 编译慢、依赖关系盘根错节；Java 要背着虚拟机与一整套企业级抽象；脚本语言写大型服务又撑不住性能与维护。

    他们决定利用等构建的时间，在白板上回答一个问题：如果只为「多核、网络、大代码库」这三件事设计一门新语言，它应该长什么样。两年后的 2009 年 11 月，这个白板草图以 Go 的名字开源；2012 年 3 月发布 Go 1。本课接下来讲的每个取舍，都是对这三笔账的直接回答。
  derivation: original
  sources:
  - ref: go-faq
    locator: "FAQ: History / Why did Go appear"
    claim: Go 于 2007 年在 Google 开始设计，2009 年 11 月开源，目标是多核、网络化机器与大代码库时代的生产力；三位设计者为 Griesemer、Pike、Thompson。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
  canvas:
    kind: datastate
    caption: 2007 年 Google 的三笔账：每笔都是当时主流语言没算好的
    structure: array
    rows:
    - label: 三笔账
      cells:
      - v: "45 分钟"
        sub: 一次构建的量级
      - v: 多核
        sub: 靠核数涨性能
      - v: 千人规模
        sub: 多人维护同一批代码
  log:
  - at: "2007-09"
    text: 三位设计者在等构建时开始在白板上画新语言
  - at: "2009-11"
    text: Go 正式开源
  - at: "2012-03"
    text: Go 1 发布，附带兼容承诺
- id: three-constraints
  title: 第二步：先把三个约束说准，后面的取舍才有标准
  tldr: 多核、网络、大代码库——这三条不是背景介绍，而是 Go 每个设计决定打分的标尺。
  body: |-
    为什么先花一步讲约束？因为判断一个语言设计好不好，不能看它功能多不多，要看它对约束答得准不准。Go 的三条约束展开说：第一，硬件变了——单核频率涨不动了，性能只能从多核并行里要，一门语言如果并发还要靠程序员手管线程与锁，就等于没跟上硬件。第二，程序的形态变了——服务器程序的日常就是同时接成千上万个网络连接、等数据库、等下游服务，花在等待上的时间远多于计算，语言要让「开很多个并发任务」便宜到不用犹豫。第三，写代码的人变了——代码库的寿命以十年计、经手人以千计，语言的第一美德从「写得爽」变成「谁来读都懂、工具能自动处理」。

    记住这三条标尺：后面每一步的取舍，都可以拿它打分。编译快对应大代码库，并发内置对应多核与网络，极简对应「谁来读都懂」。
  derivation: original
  sources:
  - ref: go-faq
    locator: "FAQ: What is the purpose of the project"
    claim: FAQ 原文把目标定为「多核、网络化机器与大代码库时代的生产力」，且明确说已有语言没有一个是针对这组挑战设计的。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
  canvas:
    kind: datastate
    caption: 三条约束与 Go 的对应回答（细节在后面各步展开）
    structure: array
    rows:
    - label: 约束 → 回答
      cells:
      - v: 并发内置
        sub: 协程与通道进语言
        mark: active
      - v: 等待便宜
        sub: 每连接一个协程
        mark: active
      - v: 极简+快编译
        sub: 少特性、依赖简单
        mark: active
  log:
  - at: 标尺
    text: 每个取舍都回这三条约束打分
- id: minimal-25-keywords
  title: 第三步：取舍一，语言极简——25 个关键字封顶
  tldr: Go 的关键字从 Go 1 到现在一直只有 25 个；少特性不是抠门，是让所有人的代码长一个样。
  body: |-
    数一下就知道有多克制：Go 的语言规范里，关键字一共 25 个（break、case、chan、const、continue、default、defer、else、fallthrough、for、func、go、goto、if、import、interface、map、package、range、return、select、struct、switch、type、var），而且从 2012 年的 Go 1 到今天一个没加。对比一下量级：C++ 的关键字在 90 个以上，Java 50 多个。Go 不只关键字少，语法决定也少：循环只有 for 一种，没有 while；没有类与继承；没有异常；连分号都由编译器自动补，省掉风格争论。

    这笔账要这样算：语言特性每多一个，大团队里就会多一种写法流派，新人要多学一截，老代码要多兼容一种风格。Go 反过来用限制换统一：官方还配了一个自动格式化工具 gofmt，所有代码排版长一个样，代码审查时没人再为格式吵架。极简的代价也真实存在：有些事情写起来就是啰嗦——比如错误处理每层都要手写判断（第三课细讲）。Go 的选择是认下这份啰嗦，换全员可读。
  derivation: original
  sources:
  - ref: go-spec
    locator: "The Go Programming Language Specification: Keywords"
    claim: 规范列出的关键字恰为 25 个，且自 Go 1 以来未增删。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
