  log:
  - at: 效果
    text: 代码风格被语言本身统一，gofmt 再把排版统一
  - at: 代价
    text: 表达手段少，部分模式写起来啰嗦
- id: fast-compile
  title: 第四步：取舍二，编译快——靠砍依赖关系换来的
  tldr: Go 编译快不是编译器写得快，而是语言从设计上不让依赖关系长成网：只看直接导入的包。
  body: |-
    回到那 45 分钟：C++ 编译慢的一大半原因在依赖——头文件被层层包含，编译一个文件要把它的全部传递依赖读进来解析一遍，代码库越大这张网越密。Go 的解法是把依赖关系在语言层面砍平：一个源文件只写明它直接 import 的包，编译时只读这些包已经编译好的导出信息，不顺着依赖链往下翻；C 里那种「头文件与实现文件各一份、还要保持同步」的机制直接不存在。

    还有一条配套的小规矩特别能说明风格：import 了却不用、定义了变量却不用，直接编译报错。这逼着代码时刻保持干净，依赖图也因此不会悄悄长胖。综合起来的效果是：中大型 Go 项目的全量构建通常在秒到分钟量级，改一行代码的反馈循环接近脚本语言的手感。对每天要构建几百次的大团队来说，这省下的不是机器时间，是所有人的注意力。
  derivation: original
  sources:
  - ref: go-faq
    locator: "FAQ: Why is the compiler so fast / dependencies"
    claim: FAQ 说明 Go 编译快的关键在依赖模型：只分析直接导入包的导出信息、不做传递依赖解析；未使用的导入与变量是编译错误。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
  canvas:
    kind: datastate
    caption: 依赖模型对比：编译一个文件时要读多少东西
    structure: array
    rows:
    - label: 编译一个文件
      cells:
      - v: 整张网
        sub: 头文件层层解析
      - v: 只读直接依赖
        sub: 只读导出信息
        mark: active
      - v: 编译报错
        sub: 逼依赖保持干净
        mark: active
  log:
