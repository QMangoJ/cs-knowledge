  - id: no-inheritance
    title: 不设类与继承：用隐式接口做多态、用[[组合]]做复用
    tldr: 大型代码库里的多层类继承树极易演变成牵一发动全身的「脆弱基类」；Go 彻底取消类型层级，把多态交给按方法集自动匹配的隐式接口，把代码复用交给结构体[[组合]]。
    body: |-
      面试高频必问：作为一门现代工程语言，Go 为什么连 `class` 和 `extends` 继承都没做？这要先看类继承树在几千人规模的工程里踩过什么大坑：传统面向对象要求在定义类型之初就提前规划好父子层级树；随着需求左改右改，继承树越长越深，顶层基类哪怕改一个字段或默认行为，底下几十个派生子类就可能跟着集体翻车（即著名的「脆弱基类」难题）。更糟的是，想看懂一个子类到底有哪些行为，得顺着五六层父类文件一路往上翻，正面违背了 Go「打开当前文件就能看懂」的铁律。

      Go 把继承原本包揽的两件事拆开，分别换了更松散的解法：**多态交给隐式接口**——具体类型根本不需要写 `implements` 提前向接口报到，只要它实现的方法签名跟接口对得上，编译器在调用处自动放行（写过 [[TypeScript]] 的同学会觉得眼熟，和结构化类型「形状对上就算」如出一辙）；**代码复用交给结构体[[组合]]**——直接把现成类型嵌进新结构体里借用方法，平铺直叙不建树（第三课会结合代码细拆）。

      官方 FAQ 把话挑得很明：Go 刻意不做类型层级，因为强迫程序员在动笔第一天就提前锁定类型间的血缘关系，本身就是日后重构僵化的根源。这并不是全盘否定继承在特定领域（比如桌面组件树）的价值，而是按大团队后端演进的账本算下来，不建树活得更轻松。
    derivation: original
    sources:
      - ref: go-faq
        locator: "FAQ: Why is there no type inheritance"
        claim: FAQ 原文：Go 不要求程序员提前声明两个类型相关；类型自动满足任何包含其方法子集的接口，因此不存在类型层级。
        status: verified
        checkedBy: subagent-research
        checkedAt: "2026-11-17"
