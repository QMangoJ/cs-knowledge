- id: compat-promise
  title: 第九步：兼容承诺——Go 进化慢，是写进合同的
  tldr: 2012 年 Go 1 承诺：按 Go 1 写的程序永远能在新版上编译运行。这份信任换来的，是此后每个特性都要过最严的审查。
  body: |-
    最后补一块拼图，否则前面几个「为什么不上某功能」都缺一半解释。2012 年 Go 1 发布时附了一份兼容承诺：凡是按 Go 1 语言与标准库规范写的程序，在之后所有 Go 1.x 版本里都应当能不改一行地编译、运行。企业敢把核心系统压在一门新语言上，靠的正是这份合同——升级编译器永远不会把线上代码弄坏。

    合同的另一面是约束：一旦某个特性进了语言，按承诺就几乎永远删不掉、改不得。所以 Go 的每个新特性都要先回答「十年后还配留在语言里吗」。这解释了整课的画风：关键字 25 个封顶、泛型等十五年、继承与异常干脆不做。把这一课收成一句话：Go 的设计哲学是按「大团队、长寿命、服务器场景」的总成本做减法；下一课开始看它做得最成功的一笔——并发。
  derivation: original
  sources:
  - ref: go-faq
    locator: "FAQ: What is the status of the Go 1 compatibility promise"
    claim: Go 1 兼容承诺保证按 Go 1 规范编写的程序在后续版本中继续编译与运行，这是语言保持保守演进的制度原因。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
