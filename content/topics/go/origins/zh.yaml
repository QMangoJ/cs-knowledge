  - id: three-constraints
    title: 多核、网络等待与千人代码库：衡量一切取舍的三把标尺
    tldr: 单核主频见顶逼出原生并发，网络高并发等待逼出廉价执行单元，十年千人协作逼出极简可读与自动化工具链——Go 的每项设计都按这三把标尺打分。
    body: |-
      评价一门工程语言不能比谁的语法糖多，得看它对现实约束答得准不准。压在现代服务端头上的第一条约束是**硬件变了**：单核主频早已涨不动，算力增长全靠堆核心数；如果一门语言的并发还得靠程序员手工伺候操作系统线程与底层锁，无异于拿单核时代的旧船票登多核的船。

      第二条约束是**服务端程序的日常形态变了**：后端网关和微服务绝大部分时间并不在做密集数学运算，而是同时挂着成千上万条客户端连接，等网卡收包、等数据库回包、等下游接口响应。既然花在「等」上的时间远多于「算」，语言就必须让「新开一个并发任务去等」便宜到像声明普通变量一样毫不心疼。

      第三条约束是**协作规模变了**：一套核心服务一跑就是十年，前后经手上千名工程师，人员流动是常态。在千人规模下，语言的第一美德不再是「高手能用三行黑魔法炫技」，而是「任何同事点开任意文件五分钟就能看懂，格式与重构全能交给工具自动跑通」。抓住这三把标尺，Go 看似保守甚至固执的取舍就全有了清晰账本。
    derivation: original
    sources:
      - ref: go-faq
        locator: "FAQ: What is the purpose of the project"
        claim: FAQ 原文把目标定为「多核、网络化机器与大代码库时代的生产力」，且明确说已有语言没有一个是针对这组挑战设计的。
        status: verified
        checkedBy: subagent-research
        checkedAt: "2026-11-17"
