  - id: compat-promise
    title: Go 1 兼容承诺：升级不坏线上代码，新特性进门如过鬼门关
    tldr: 2012 年写进官方文档的 Go 1 兼容承诺保证旧代码在新版 Go 1.x 上持续可编译运行；它给了企业把核心业务压上来的底气，也逼得任何新语法一旦加进来就永远无法后悔。
    body: |-
      为什么 Go 对加新特性谨慎到近乎苛刻？答案藏在 2012 年 3 月随 Go 1 一同签下的**兼容性承诺**里：除极少数安全漏洞或规范本身自相矛盾的修正外，凡是按 Go 1 语言规范和标准库编写的程序，在未来所有 Go 1.x 版本下都必须能原封不动地编译并正常运行。各大互联网公司敢放心地把几十万行核心基础设施压在这门年轻语言上，靠的就是这颗定心丸——半年升一次编译器版本，绝不会把正在跑的线上服务升崩。

      对用户是蜜糖，对语言设计者就是紧箍咒：任何语法或标准库 API 一旦放进正式版，就等于签了终身卖身契，日后就算发现设计得别扭也再难删改。因此，每一项新提案在进门前都得先扛住灵魂拷问：「没有它大家真的活不下去吗？十年后它还会不会成为拖累编译速度与可读性的包袱？」25 个关键字锁死不变、继承与异常干脆不做、[[泛型]]打磨十五年才放行，全都是在这份终身合同下算出来的理性结果。

      读任何关于 Go「为什么这么设计」的争论时，不妨掏出这三把标尺对号入座：
      1. **省没省编译与交付时间？**（直接依赖导出摘要、静态链接[[单二进制]]）
      2. **省没省多核与网络等待成本？**（内置 [[goroutine]]、[[channel]] 与 [[GC]]）
      3. **省没省千人团队十年的阅读与升级成本？**（25 个关键字、`gofmt`、隐式接口与 Go 1 兼容承诺）
    derivation: original
    sources:
      - ref: go-faq
        locator: "FAQ: What is the status of the Go 1 compatibility promise"
        claim: Go 1 兼容承诺保证按 Go 1 规范编写的程序在后续版本中继续编译与运行，这是语言保持保守演进的制度原因。
        status: verified
        checkedBy: subagent-research
        checkedAt: "2026-11-17"
