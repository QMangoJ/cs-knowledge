  - id: fast-compile
    title: 砍平传递依赖：只读直接导入包的导出摘要换来秒级构建
    tldr: Go 编译快靠的不是编译器奇技淫巧，而是从语言层面消灭头文件层层展开的传递解析——编译单个文件只读直接 import 包的导出信息，未使用的导入直接报错。
    body: |-
      回到开头那漫长的 45 分钟：C++ 构建慢的病根不在编译器写得笨，而在 `#include` 头文件机制引发的依赖爆炸。A 包含 B、B 包含 C，编译单个源文件时预处理器必须把整棵传递依赖树里的几万行头文件一遍遍重新展开解析；代码库越庞大，重复解析的冗余工作量越惊人。

      Go 直接在语言设计上把依赖关系砍平：彻底废除「头文件与实现文件分离」的包袱，源文件开头明确声明自己直接 `import` 了哪些包；编译器处理该文件时，**只读取这些直接依赖包编译产物里的导出摘要**，绝不顺着依赖链往深处翻间接依赖的源码。原本网状蔓延的重复解析，瞬间收敛成只看一层的常数级读取。

      为了防止依赖图在漫长迭代中悄悄发福，Go 还立了一条铁规矩：**导入了却没用到的包、声明了却没用到的局部变量，一律直接算编译错误**，连警告都不给。这条规矩刚上手时有点烦人，却保证了代码库里永远不留死依赖。两招合璧，中大型 Go 项目的全量构建从几十分钟压到了几秒至数十秒，改完一行代码转身就能跑起来，把大团队每天成百上千次等待构建的心流损耗省了回来。
    derivation: original
    sources:
      - ref: go-faq
        locator: "FAQ: Why is the compiler so fast / dependencies"
        claim: FAQ 说明 Go 编译快的关键在依赖模型：只分析直接导入包的导出信息、不做传递依赖解析；未使用的导入与变量是编译错误。
        status: verified
        checkedBy: subagent-research
        checkedAt: "2026-11-17"
    canvas:
      kind: datastate
      caption: 依赖模型对比：编译一个文件时要读多少东西
      structure: array
      rows:
        - label: 编译一个文件
          cells:
            - v: 整张网
              sub: 头文件层层解析
