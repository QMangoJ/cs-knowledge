    text: 慢的根源是依赖形状，不是编译器手速
- id: single-binary
  title: 第五步：取舍三，部署只有一个文件
  tldr: Go 程序把运行时与全部依赖静态链接成一个可执行文件：部署就是拷一个文件，不用先伺候环境。
  body: |-
    再看部署环节的账。用 Java 写服务，目标机器要先有版本对得上的虚拟机，再配一堆库；用脚本语言，要先把解释器与依赖包逐个装好，版本对不齐就是经典的「在我机器上是好的」。Go 的做法是把运行时（包括垃圾回收器与调度器）和全部依赖默认静态链接进一个可执行文件，产物就是一个几 MB 到几十 MB 的[[单二进制]]：拷到任何一台同架构的 Linux 服务器上，给个执行权限就能跑，不查环境、不装依赖。

    这件事后来被云原生放大成决定性优势：Docker 镜像可以只装这一个文件（scratch 基础镜像），镜像小到几十 MB，拉取快、启动快、攻击面也小。Docker 本体与 Kubernetes 都是 Go 写的，很难说只是巧合——它们要分发到千千万万台机器上，「一个文件」就是最短的交付路径。代价也有：每个二进制都自带一份运行时，体积比共享库方案大；动态链接与插件生态相对弱。Go 认这个代价。
  derivation: original
  sources:
  - ref: go-faq
    locator: "FAQ: Why does Go not support dynamic linking / binary size"
    claim: FAQ 说明 Go 默认静态链接、单个二进制包含运行时，这是为部署简单与启动行为可预期做的取舍，代价是体积较大。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
  canvas:
    kind: datastate
    caption: 部署一个服务，要往目标机器上搬多少东西
    structure: array
    rows:
    - label: 部署清单
      cells:
      - v: 运行时+库+代码
        sub: 版本逐个对齐
      - v: 1 个文件
        sub: 静态链接自带运行时
        mark: active
      - v: 可小到几十 MB
        sub: 镜像只放它
        mark: active
  log:
  - at: 效果
    text: 交付路径最短：拷贝、赋权、运行
  - at: 代价
    text: 每个文件自带运行时，体积偏大
- id: builtin-concurrency-gc
  title: 第六步：取舍四，并发与垃圾回收都做进语言
  tldr: 服务器程序的主要工作是等：等连接、等数据库。Go 让「开一个并发任务」的成本低到不用算计，并把内存回收交给运行时。
  body: |-
    前三条取舍解决的是写与部署，这一条解决运行时的形态。网络服务的典型画面是：成千上万个连接同时挂着，每个连接大部分时间在等对方发数据、等数据库返回。如果用「一个连接一个操作系统线程」的老模型，光线程栈就要吃掉几十 GB 内存（下一课算细账）。Go 把并发原语直接做进语言：关键字 go 加一个函数调用就是一个 [[goroutine]]，起步成本极低；goroutine 之间用 [[channel]] 传值。并发不再是「引入一个线程库、处处小心」，而是默认写法。

    另一半是垃圾回收（[[GC]]）：服务器程序长年运行、对象生生死死，手动管理内存既容易泄漏又容易写出悬空指针。Go 从第一天就带 GC，让程序员把注意力放在业务上；代价是回收会占用一部分 CPU、带来毫秒级的停顿，且二进制要自带运行时。对互联网服务的绝大多数场景，这笔交换划算——这也是它与 C++ 分道扬镳最明确的一刀。机制细节留给下一课。
  derivation: original
  sources:
  - ref: go-effective
    locator: "Effective Go: Concurrency / Garbage collection"
    claim: Effective Go 说明 goroutine 与 channel 是语言级并发设施、开销远低于线程，且 Go 以 GC 换取内存安全与开发效率。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
