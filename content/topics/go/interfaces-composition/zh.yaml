        mark: active
      - v: 单方法接口
        sub: error 本质：Error() string
  log:
  - at: 收益
    text: 失败路径在代码里全程可见
- id: why-no-exceptions
  title: 第八步：为什么不用异常——官方的理由与 panic 的位置
  tldr: FAQ 的原话是：把错误处理耦合进异常控制流，会诱导人把日常错误也当异常抛出，代码越写越纠缠。
  body: |-
    官方 FAQ 对这个问题的回答值得细读。它说：Go 团队试过异常式的设计，但每种方案都给语言与运行时增加可观的复杂度；更关键的是，把错误处理与 try-catch 这类控制结构耦合起来，结果往往是代码变得纠缠不清（convoluted），而且它在事实上鼓励程序员把很普通的错误——文件不存在、参数不对——也标记成「异常」抛出去。异常的语义本该是「意料之外」，一旦日常错误全走这条路，调用方就再也分不清哪些失败是正常业务、哪些是真出事了，中间层也不得不层层围着 catch 猜。

    Go 的划分是：日常错误全部走 error 返回值，逼它们在出错点附近被处理；真正「程序已经不知道怎么继续」的局面——比如索引越界这种逻辑错误——保留 panic，它会让当前 goroutine 的调用栈逐层回退执行 defer，最后若没人 recover 就终止进程；recover 只建议用在库的边界上，把 panic 拦下来转成 error 还给调用方。一句话：异常通道只留给程序错误，不给业务错误——这是它与 Java/C# 异常哲学最根本的分界。
  derivation: original
  sources:
  - ref: go-faq
    locator: "FAQ: Why does Go not have exceptions"
    claim: FAQ 原文：异常式设计显著增加复杂度，且把错误耦合到 try-catch 控制流会使代码纠缠、并鼓励把普通错误标记为异常；Go 以多返回值处理错误，panic 留给真正的异常局面。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
  canvas:
    kind: datastate
    caption: 两类失败，两种通道：分界线划在「是不是日常」
    structure: array
    rows:
    - label: 失败的分流
      cells:
      - v: error 返回
        sub: 日常错误：文件不存在、网络超时、参数错
        mark: active
      - v: panic
        sub: 程序错误：索引越界等逻辑已崩的局面
      - v: recover 转 error
        sub: 库的边界：别把 panic 漏给调用方
  log:
  - at: 分界
    text: 业务错误是正常输入，程序错误才是异常
- id: error-cost-wrapping
  title: 第九步：代价要认——啰嗦、丢上下文，与社区的补救
  tldr: if err != nil 写一千遍是真啰嗦，裸返回错误丢上下文是真丢人：Go 的补救是逐层包装，而不是改掉显式本身。
  body: |-
    批评要同样具体。第一笔：重复——真实项目里 if err != nil 的出现频率高到成了 Go 的标志性吐槽，样板代码挤占了业务逻辑的版面。第二笔更实质：错误一层层往上返回时，如果每层只是裸着 return err，到了顶层只剩一句「文件不存在」，不知道是哪一步、处理哪条数据时出的事——上下文在传递中丢光，线上排查无从下手。

    Go 的补救没有动「显式」这个根，而是在传递方式上加工具：fmt.Errorf 用 %w 动词把下层错误包进一句带本层上下文的话里（第七步代码里就是这么写的），形成一条可追溯的错误链；排查时用 errors.Is 判断链里有没有某个目标错误、errors.As 取出某一层的具体类型。约定再补一层纪律：错误要么被处理掉、要么被包装后上报，二选一写清楚，禁止「记个日志又继续往上抛」式的重复处理。把账算总：Go 用啰嗦换可见性，再用包装工具把可见性做完整——面试被问到这题时，先讲理由、再认代价、最后给补救，这三段就是完整的答案结构。
  derivation: original
  sources:
  - ref: go-effective
    locator: "Effective Go: Errors / error wrapping 惯例"
    claim: 官方惯例要求错误在向上传递时用 fmt.Errorf 与 %w 添加本层上下文，并用 errors.Is/As 在链上判定，显式处理与可追溯性兼得。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
  canvas:
    kind: datastate
    caption: 显式 error 的两笔代价与对应补救
    structure: array
    rows:
    - label: 代价与补救
      cells:
      - v: 样板重复
        sub: 代价一：if err != nil 高频出现
      - v: 上下文丢失
        sub: 代价二：裸返回只剩底层一句
      - v: "%w 逐层包装"
        sub: 补救：错误链 + Is/As 判定
        mark: active
  log:
  - at: 纪律
    text: 处理掉，或者包装上报——不许含糊地穿过
- id: interview-recap
  title: 第十步：收束——「Go 为什么没有继承和异常」怎么答
  tldr: 把这一课压成面试可用的回答：不是缺功能，是同一套哲学下的成套替代——接口管多态、组合管复用、error 管失败。
  body: |-
    用一个问题收束本课，也是全栈与后端面试里最容易被追问的一题：Go 为什么没有继承、没有异常？完整的答法分三层。第一层给立场：这不是实现不了，而是按「关系不提前登记、控制流不暗中跳转」的原则主动删掉的——继承要求提前把类型关系钉进一棵树，异常让失败路径从代码里隐身，两者都与 Go 服务于大团队长寿命代码的目标冲突。第二层给替代：多态由隐式接口承担，接口由使用方定义、越小越值钱；复用由嵌入组合承担，拼装关系写在明处；失败由 error 显式返回承担，出错点附近必须表态。第三层认代价：接口关系不可见要靠工具确认，error 啰嗦要靠包装纪律补上下文——能把代价说清，这个回答才算完整。

    至此 Go 学科的三课走完：第一课的设计哲学是总纲，第二课的并发是最成功的兑现，本课的类型系统是最能体现「做减法」的样本。学完之后再回头看第一课那句「按大团队的总成本做减法」，应该能自己举出三个例子了。
  derivation: adapted
  sources:
  - ref: go-faq
    locator: "FAQ: Design principles 相关条目汇总"
    claim: FAQ 中关于继承、异常与接口的条目共同构成同一立场：以隐式接口、组合与显式错误替代类型层级与异常控制流。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
  canvas:
    kind: datastate
    caption: 本课答法的三层结构
    structure: array
    rows:
    - label: 回答框架
      cells:
      - v: 主动删
        sub: 立场：与大团队长寿命目标冲突
        mark: active
      - v: 接口+组合+error
        sub: 替代：多态、复用、失败各有归属
        mark: active
      - v: 要认账
        sub: 代价：不可见与啰嗦及补救
  log:
  - at: 收束
    text: 三课一条线：一切关系与控制流都写在明处
