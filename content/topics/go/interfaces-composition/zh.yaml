  - id: consumer-defined-interfaces
    title: 接口写在调用方地盘上：只索取自己真用到的那一两个方法
    tldr: 隐式实现让依赖方向彻底反转——接口不再由实现方提前画大饼，而由调用方在自己包里按最小需求裁剪，配合成对工程格言「接受接口，返回具体结构体」。
    body: |-
      隐式实现直接催生了 Go 最地道的一条架构惯例：**接口应当定义在消费它的调用方包里，而不是提供具体实现的包里**。在传统面向对象项目里，往往是写底层存储或 SDK 的人先抛出一个塞满十几个方法的庞大接口；而在 Go 里，既然实现方根本不需要 import 接口包，订单模块就只管在自己包里写一个单方法 `Charger` 接口——哪怕支付 SDK 里还躺着退款、查账单、拉汇率等十几个方法，也跟订单模块半毛钱关系没有，依赖面被削到了极致。

      与它成双成对的另一句工程格言叫**「接受接口，返回结构体」（accept interfaces, return structs）**。函数入参收小接口，调用方就能轻松塞进真实客户端或单测假对象；函数返回值给具体结构体，调用方拿到手就能使用它的完整能力，不必被某个提前裁剪过的接口捆住手脚，日后给结构体新增方法也不会破坏已有签名。

      这两条规矩合在一起，解释了为什么翻开优秀的 Go 源码，里面看不到动辄二三十个方法的「全能接口」，满眼全是一两个方法、紧贴调用点的袖珍接口——接口在 Go 里不是替实现方写的「全身说明书」，而是调用方开出的「最小需求单」。
    derivation: original
    sources:
      - ref: go-effective
        locator: "Effective Go: Interfaces and methods"
        claim: Effective Go 示范了接口应按使用方的需要定义、保持小而贴身；接口的价值在于描述行为需求而非类型的全貌。
        status: verified
        checkedBy: subagent-research
        checkedAt: "2026-11-17"
