- id: error-as-value
  title: 第七步：error 是普通值——错误不许隐身
  tldr: Go 函数把结果与错误并排返回：调用方在下一行就必须表态，处理、包装上报、还是明确忽略。
  body: |-
    从这一步起讲 Go 最有争议的设计。先看它长什么样：可能失败的函数，返回值里多带一个 error；调用方拿到后立刻判断，err 不是 nil 就走处理分支，是 nil 才继续用结果。error 本身只是一个内置的小接口——只有一个 Error() string 方法，任何类型凑齐这个方法都能当错误用。整个机制没有任何特殊语法：错误就是个普通值，和订单号、金额一样在返回值里明码传递。

    这种写法换来的东西很具体：读任何一段 Go 代码，它的失败路径全部写在明面上——哪一步可能失败、失败了往哪走，顺着代码读就能看全，不需要知道「这段代码可能抛出哪些异常」这种藏在别的文件里的知识。审查代码时，漏处理一个 error 是肉眼可查的（编译器也会对「把返回值整个丢掉」皱眉，静态检查工具更是会直接报错）。代价同样具体，就是下一两步要算的啰嗦账。
  derivation: original
  sources:
  - ref: go-faq
    locator: "FAQ: Why does Go not have exceptions"
    claim: FAQ 说明 Go 把错误设计为普通返回值（error 接口），要求在调用点显式处理，使控制流与失败路径保持可见。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
  code:
    lang: go
    code: |-
      order, err := store.LoadOrder(id)
      if err != nil {
          return fmt.Errorf("加载订单 %d: %w", id, err)
      }
      // 到这里，order 一定可用，err 一定为空
  canvas:
    kind: datastate
    caption: 显式返回的控制流形状：失败路径与成功路径并排写着
    structure: array
    rows:
    - label: 错误的传递方式
      cells:
