  - id: composition-embedding
    title: 结构体嵌入[[组合]]：借来方法与字段，却绝不认作父子
    tldr: 在结构体里匿名嵌入现成类型即可将其方法与字段「提升」到外层直接调用；但嵌入只是委托语法糖而非 is-a 继承，复用与多态在 Go 里彻底分家。
    body: |-
      隐式接口解决了多态，代码复用这半边天则由结构体[[组合]]——语法上叫**匿名嵌入（embedding）**——来挑大梁。看下方示例：`OrderService` 结构体里只写了类型名 `*Logger` 而没写字段名，编译器就会自动把 `Logger` 的字段和方法「提升」（promote）到外层，`svc.Log("...")` 直接就能调，省去了手写一堆转发包装函数的苦力活，同时里面的 `*Logger` 依然是个能随时替换、独立单测的普通零件。

      千万别被表面写法骗了：**匿名嵌入借来的是方法，绝不是继承树里的 `is-a` 父子血缘**。`OrderService` 嵌了 `*Logger`，但它并不是 `*Logger` 的子类——如果某个函数点名要收 `*Logger` 类型的参数，你把 `OrderService` 传进去会当场编译报错（除非那个函数收的是只要求 `Log` 方法的接口）。

      遇到外层结构体自己也定义了同名 `Log` 方法时，规则同样直白：外层方法直接遮蔽（shadow）内层同名方法，永远是离调用者最近的那一层说了算，既没有虚函数表重写的心智绕弯，也仍然能通过 `svc.Logger.Log("...")` 显式点进内层调用。复用归嵌入拼装，多态归接口匹配，两件事桥归桥、路归路。
    derivation: original
    sources:
      - ref: go-effective
        locator: "Effective Go: Embedding"
        claim: Effective Go 说明嵌入使内层类型的方法集提升到外层，这是 Go 实现复用的方式；它不构成类型层级，外层可重定义同名方法。
        status: verified
        checkedBy: subagent-research
        checkedAt: "2026-11-17"
    code:
      lang: go
      code: |-
        type Logger struct{ /* … */ }
        func (l *Logger) Log(msg string) { /* … */ }

        type OrderService struct {
            *Logger // 嵌入：只写类型名，不写字段名
        }
        // svc.Log("…") 直接可用——方法被提升到了外层
