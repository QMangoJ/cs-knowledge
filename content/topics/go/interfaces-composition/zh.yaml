license: CC-BY-NC-SA-4.0
overview:
  - key: 一句话总结
    value: Go 用编译期匹配的隐式接口管多态、用结构体嵌入[[组合]]管复用、用普通返回值 error 管失败——关系不提前登记、控制流不暗中跳栈、失败路径全程摆在明面上
  - key: 隐式接口与调用方定义
    value: 免去 implements 声明，赋值瞬间由编译器核对方法集（编译期[[鸭子类型]]）；接口因此由消费方按最小需求裁剪，配合成规「接受接口，返回结构体」
  - key: 小接口与嵌入组合
    value: 单方法 io.Reader 印证「接口越大，抽象越弱」；结构体匿名嵌入直接提升内层方法实现复用，但不产生 is-a 继承层级
  - key: 显式 error 与包装链
    value: 日常业务失败走普通返回值 error 就近处理，逻辑崩溃才走 panic；针对样板啰嗦与裸返丢上下文，用 fmt.Errorf 的 %w 串起错误链并靠 errors.Is/As 判别
summary: Go 彻底砍掉类继承树与 try-catch 异常控制流，把多态交给编译期按方法集核对的隐式小接口，把代码复用交给装配期可见的结构体嵌入[[组合]]，把日常失败交给并排返回的普通值 error，让一切类型耦合与失败分支都摊在当前文件的明面上。
premise: 订单结账服务要把支付从渠道 A 切到外部第三方渠道 B：对方两年前写死的 SDK 压根没写过 implements 声明你的接口，为什么订单代码连一行都不用改就能直接传进去跑？而把类继承和异常跳转全砍掉之后，满屏躲不掉的 if err != nil 又到底换回了什么？
position: 本课是 Go 语言学科收官板块「类型系统：接口与组合」的压轴课，承接第一课的极简标尺与第二课的并发机制，正面拆解这门语言最反传统的两项减法——没有继承、没有异常。学完你能用隐式小接口与嵌入组合写出低耦合模块，也能按三层框架完整答透显式错误处理的得失。
level: 进阶
minutes: 24
prereq:
  - go/origins
objectives:
  - 分清编译期隐式接口匹配与 implements 登记制的差别，解释为什么 Go 接口应当由调用方包按需定义
  - 结合 io.Reader 说透小接口原则，解释「接口越大，抽象越弱」背后的组合空间账
  - 准确区分结构体嵌入[[组合]]（方法提升）与类继承（is-a 子类型）在耦合时机与演化代价上的边界
  - 按「工程理由、现实代价、错误链补救」三层结构完整回答 Go 为什么不用 try-catch 异常
aiLink: 在多模型 [[LLM]] 应用后端里，把 OpenAI、Claude 与本地推理引擎统一抽象成一个只有单方法 Stream(ctx, prompt) (io.Reader, error) 的小接口，正是本课「调用方定义小接口 + 流式 Reader 组合 + 显式错误链回传」在 AI 工程里的标准落地。
bridge:
  prev: 前两课算清了 Go 的工程标尺与轻量并发引擎，本课来补齐取舍清单上最惹眼的两个「没有」——没有类继承、没有异常机制。它们不是功能残缺，而是被隐式接口、嵌入[[组合]]与显式 error 返回成套替换后的必然形态。
design:
  - mechanism: 编译期隐式接口匹配与调用方最小接口
    problem: 声明式 implements 把实现关系锁死在提供方源码里：想让第三方已发布的类型接入你今天新抽出来的抽象，除了改对方源码就只能硬包一层适配器。
    choice: 彻底废除提前登记，改由调用方只声明自己真用到的那一两个方法，编译器在传参赋值瞬间当场核对方法集；代码复用则另交结构体匿名嵌入[[组合]]。
    tradeoff: 光看结构体定义看不出它究竟实现了哪些接口，必须借助 IDE 静态分析或编译期赋值断言来确认；极少数方法重名巧合也可能误撞接口。
    root: Go 把「谁跟谁是一类」的定义权从写底层库的人手里收回，交还给写上层调用的人，让大型代码库从自上而下画大树变成自下而上拼积木。
  - mechanism: 错误即普通返回值（error 与 panic 双轨分流）
    problem: "try-catch 异常机制让失败沿着调用栈隐身穿透多层，且极易诱使程序员把文件不存在、网络超时等日常业务输入也当异常乱抛，把控制流搅成迷宫。"
    choice: 日常业务与环境失败一律作为普通 error 值并排返回、紧邻调用点当场表态；仅把数组越界这类不可恢复的程序逻辑硬伤留给 panic，并在库边界用 recover 兜回 error。
    tradeoff: 源码里不可避免会出现大量 if err != nil 样板代码；若每层只裸写 return err 还会丢光业务现场，必须严守 %w 逐层包装纪律。
    root: 对长年在线的服务端程序而言，「每一处潜在失败都在出错点眼皮底下被看见、被处置」远比「把正常路径写得表面清爽」重要得多。
quiz:
  - q: 在 Go 语言里，判定一个具体结构体「实现了某个接口」的唯一标准是？
    options:
      - 必须在结构体声明行显式写上 implements 接口名
      - 必须在包初始化函数 init() 里向全局接口表注册一次
      - 编译器在赋值或传参处自动核对方法集：接口要求的全部方法签名它都具备即算实现，无需任何提前声明
      - 编译期完全不检查，等到线上第一次调用该方法时再动态查找
    answer: 2
    explain: 这正是编译期检查的[[鸭子类型]]：既省去了提前声明 implements 的跨包耦合，又由编译器在静态阶段兜住类型安全，缺一个方法都编不过。
  - q: Go 工程界推崇「接口应当由消费它的调用方定义，而不是由实现方定义」，这一惯例能跑通的语言前提是？
    options:
      - 运行时反射可以在程序启动后动态给第三方结构体塞入新方法
      - 隐式接口满足机制：调用方在自己包里写一个袖珍接口，现成第三方类型只要方法对得上就能直接传入，无需改动对方半行源码
      - Go 所有自定义结构体都默认继承自同一个根基类
      - 编译器会自动为不匹配的类型生成适配器包装代码
    answer: 1
    explain: 正因为接口关系是「用时核对」而非「定义时登记」，调用方才能只把自己真用到的那一两个方法写成小接口，把包间依赖裁剪到最小。
  - q: 标准库 io.Reader 全身上下只要求一个 Read 方法，却能成为串起整个 Go 生态的核心抽象，根本原因是？
    options:
      - 接口要求的方法越少，接入成本越低，文件、网络套接字、内存缓冲与解压流全能轻松满足，跨模块[[组合]]空间反而最大
      - 它是编译器硬编码开绿灯的内置关键字类型，享有特殊指令优化
      - Go 语言规定所有业务结构体在传输前都必须先手动序列化成字节切片
      - 单方法接口的函数调用比多方法接口少一次内存拷贝
    answer: 0
    explain: 这就是 Rob Pike 总结的小接口原则「接口越大，抽象越弱」：方法要求越苛刻，能塞进来的具体类型就越少；单方法契约反而拥有最强的通用拼装力。
  - q: 根据 Go 官方 FAQ，语言设计团队拒绝引入 try-catch 异常机制的最核心理由是？
    options:
      - 栈回退与异常表实现难度过高，早期编译器团队人手不足
      - 引入异常捕获表会让静态链接产出的[[单二进制]]体积翻倍
      - 将错误处理绑进异常控制结构容易把分支搅得纠缠不清（convoluted），并诱使程序员把文件缺失、参数错误等日常输入也当异常抛出
      - 异常跳转机制与并发运行时里的内置垃圾回收器（[[GC]]）无法共存
    answer: 2
    explain: Go 并非没有栈回退机制——panic/recover 留给了真正不可恢复的程序逻辑硬伤；而网络超时、查无记录等属于每天都在发生的正常业务输入，理应作为普通 error 值显式处理。
steps:
  - id: swap-payment-scenario
    title: 换支付渠道不改订单代码：只认方法签名，不查出身门派
    tldr: 订单结账模块只在自己包里声明一个单方法收款接口 Charge；无论渠道 A、第三方渠道 B 还是单测假支付，不用提前登记实现关系，凑齐签名就能直接塞进来跑。
    body: |-
      电商核心订单服务在结账那一步其实只关心一件事：「替这笔订单扣这么多钱，告诉我成没成。」今天接的是支付渠道 A 的 SDK，下个月商务谈妥了要切去渠道 B，大促前还得补一个内部积分抵扣通道外加单元测试里的假支付（Mock）。要是订单代码里硬编码了渠道 A 的客户端结构体，每次换渠道都得剖开核心结账流程动刀，线上事故风险拉满。

      Go 的标准解法干净利落：订单模块直接在自己的包里写一个只有一行 `Charge(订单号, 金额)` 方法的收款接口；渠道 A 客户端、渠道 B 客户端、积分客户端和单测替身，谁身上有这个同名同签名的方法，谁就能直接作为参数传进结账函数。切换支付渠道时，只改启动入口装配依赖的那一行，核心订单代码连一个标点都不用动。

      细品一下这里最反传统的一幕：**渠道 B 的 SDK 是外部第三方团队两年前写的，作者压根不知道世上存在你这个订单模块，源码里更不可能写过半句 `implements` 声明**——它仅仅因为方法签名对上了，就天然成了合法实现。这种「不问出身、只看手艺」的松耦合，正是整套 Go 类型系统的起点。
    derivation: adapted
    sources:
      - ref: go-faq
        locator: "FAQ: Why does Go not have type inheritance / interfaces"
        claim: FAQ 说明 Go 的接口靠方法集匹配自动满足，实现方无需声明，这使得接口可以由使用方按需定义、套在任意现成类型上。
        status: verified
        checkedBy: subagent-research
        checkedAt: "2026-11-17"
