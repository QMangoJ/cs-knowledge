        mark: active
  log:
  - at: 原则
    text: 接口越大，抽象越弱——Pike
- id: composition-embedding
  title: 第五步：组合——把现成类型嵌进来，方法就借到了
  tldr: 复用不用继承树：结构体里写一行嵌入的类型名，它的方法与字段就像自己的的一样被「提升」上来。
  body: |-
    接口管多态，复用这半边天靠[[组合]]，Go 里叫嵌入（embedding）。写法极简：定义新结构体时，只写类型名、不写字段名地放进一个现成类型，新类型就自动获得它的方法与字段，对外可以直接调用，就像自己的一样。下面这段代码里，订单服务嵌了一个日志器，于是订单服务直接有了 Log 方法——没有继承声明，没有父类构造，日志器还是一个可以独立替换、独立测试的普通类型。

    与继承的差别要说准：嵌入得到的是「方法提升」，不是「is-a 关系」。订单服务不会因此变成一个日志器，不能把订单服务当作日志器传给别人（除非靠接口按方法集匹配——那是第二步的机制）。这恰恰是 Go 想要的：复用与多态被拆成两件独立的事，复用靠拼装、多态靠接口，谁也不假装谁。外层类型还可以定义同名方法遮蔽内层的，行为以离你最近的一层为准，查找规则简单可预测。
  derivation: original
  sources:
  - ref: go-effective
    locator: "Effective Go: Embedding"
    claim: Effective Go 说明嵌入使内层类型的方法集提升到外层，这是 Go 实现复用的方式；它不构成类型层级，外层可重定义同名方法。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
  code:
    lang: go
    code: |-
      type Logger struct{ /* … */ }
      func (l *Logger) Log(msg string) { /* … */ }

      type OrderService struct {
          *Logger // 嵌入：只写类型名，不写字段名
      }
      // svc.Log("…") 直接可用——方法被提升到了外层
  canvas:
    kind: datastate
    caption: 嵌入发生了什么、没发生什么
    structure: array
    rows:
    - label: 嵌入的账
      cells:
      - v: 方法与字段
        sub: 得到：内层的直接借用
        mark: active
      - v: is-a 关系
        sub: 没得到：外层不是内层的子类
      - v: 同名取外层
        sub: 遮蔽：最近一层说了算
        mark: active
  log:
  - at: 分工
    text: 复用靠组合、多态靠接口，两件事拆开
- id: composition-vs-inheritance
  title: 第六步：组合与继承，差的到底是什么
  tldr: 继承是「先有分类树，再往格子里放类型」；组合是「先有零件，用时拼」——差别落在耦合出现的位置。
  body: |-
    把两种复用方式摆在一起打分。继承的耦合出现在设计期：类型关系在写代码时就钉死成一棵树，子类默认背上父类的全部行为，父类改一处，整棵子树都要回归测试（脆弱基类）；想给一个类型换个分类维度——比如既按形状又按颜色分——单继承的树立刻不够用。组合的耦合出现在装配期：类型之间没有登记在案的亲缘，拼装关系写在结构体定义里，一眼可见；想换零件，改嵌入的那一行即可，零件本身可以独立演化。

    也要给继承留一句公道话：当一类东西确实构成稳定的「is-a」分类、且行为需要按层级统一覆盖改写时（比如 UI 控件树），继承的表达更直接，Go 的嵌入加接口写同样的东西会多几行样板。Go 的判断不是「继承永远错」，而是按它自己的场景算账：服务器后端代码里，分类树大多不稳定、拼装需求天天有，于是把默认值设成了组合。做技术选型答辩时，能说出「继承在什么场景仍然更好」，比只背「组合优于继承」的口号可信得多。
  derivation: adapted
  sources:
  - ref: go-faq
    locator: "FAQ: Why is there no type inheritance"
    claim: FAQ 的立场是类型层级带来的提前声明与耦合不符合 Go 的目标，接口加组合是给出的替代路径。
    status: verified
    checkedBy: subagent-research
    checkedAt: "2026-11-17"
  canvas:
    kind: datastate
    caption: 两种复用方式的打分（定性对比）
    structure: array
    rows:
