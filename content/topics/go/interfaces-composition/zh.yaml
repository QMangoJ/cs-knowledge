      cells:
      - v: 设计期 vs 装配期
        sub: 耦合位置：树钉死 vs 拼装可见
        mark: active
      - v: 继承波及全树
        sub: 改基类的影响：组合只动装配处
      - v: 稳定的 is-a 树
