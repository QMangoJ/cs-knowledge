  - id: composition-vs-inheritance
    title: "[[组合]]对比继承：把设计期锁死的树换成装配期可见的积木"
    tldr: 类继承在设计期就把耦合焊死在一棵单维分类树上，改基类易波及全树；结构体[[组合]]把关系推迟到装配期按需拼装，零件各自独立演进，唯独在稳定层级树（如 UI 控件）上略输简洁度。
    body: |-
      把继承和[[组合]]摆上台面算总账，核心差异就落在**耦合绑定在哪个时刻**。继承把耦合钉死在最早的设计期：代码还没写几行，你就得先猜准未来五年的业务分类树；子类被迫全盘背上父类的内部状态，顶层基类稍微动一下默认逻辑，底下整串子类全得心惊胆战重跑回归测试（脆弱基类问题）。一旦业务冒出交叉维度——比如订单既要按「普通/团购」分，又要按「实物/虚拟」分——单继承树当场就会拧成麻花。

      组合则把耦合推迟到了装配期：日志器、限流器、缓存客户端彼此之间没有任何祖宗辈分，谁需要哪几样能力，就在结构体定义里明明白白嵌进去；明天想换掉缓存实现，只拆那一颗零件，别的零件毫发无损。

      当然，工程讨论不能拉偏架：当问题域本身确实是一棵天然稳定、需要按层级成批重写默认行为的 `is-a` 分类树时（最经典的就是桌面客户端或游戏引擎里的 UI 控件树），传统类继承表达起来更顺手，用 Go 的嵌入加接口模拟反而要多写几行胶水代码。Go 砍掉继承不是宣判继承死刑，而是看准了在后端网络服务里，「灵活换零件」的频率远高于「维护稳定分类树」，干脆把全员默认姿势锁在了组合上。
    derivation: adapted
    sources:
      - ref: go-faq
        locator: "FAQ: Why is there no type inheritance"
        claim: FAQ 的立场是类型层级带来的提前声明与耦合不符合 Go 的目标，接口加组合是给出的替代路径。
        status: verified
        checkedBy: subagent-research
        checkedAt: "2026-11-17"
    canvas:
      kind: datastate
      caption: 两种复用方式的打分（定性对比）
      structure: array
      rows:
