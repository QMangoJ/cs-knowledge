  - id: implicit-satisfaction
    title: 编译期[[鸭子类型]]：省掉 implements 登记，赋值时当场验方法集
    tldr: Go 取消显式 implements 声明，改在具体值赋给接口变量的编译瞬间核对方法集；既有动态[[鸭子类型]]事后套接口的自由，又保住静态类型检查的安全底线。
    body: |-
      拿 Java 做个对照就能一眼看清分水岭：Java 采用「户籍登记制」，一个类想实现某个接口，必须在定义那个类的源码第一行白纸黑字写上 `implements PaymentGateway`。登记制一旦遇上跨团队或第三方库就会卡壳——别人早就发版锁死的类没写你的接口名，你想拿接口收编它，就非得额外包一层繁琐的适配器（Adapter）不可。

      Go 把核对的时机和地点全搬了家：具体类型定义时不用向任何接口报备；等到调用处**把某个具体类型的值赋给接口变量的那一刻，编译器当场核对它的方法集有没有完整覆盖接口要求的全部方法**，对上了直接放行，少一个方法或差一个参数类型就当场编译报错（写过 [[TypeScript]] 的同学会倍感亲切，和结构化类型按形状匹配是同一个路数）。

      这套机制常被称为**编译期检查的[[鸭子类型]]**：它跟 Python「走起来像鸭子就是鸭子」一样免去了提前登记的束缚，允许你随时事后新建小接口去套住早已写死的旧类型；同时又不像动态语言那样要等线上跑到那一行才炸出 `AttributeError`，所有缺斤短两都在编译阶段被拦死在门外。
    derivation: original
    sources:
      - ref: go-faq
        locator: "FAQ: Why is there no type inheritance"
        claim: FAQ 原文：类型自动满足任何包含其方法子集的接口，无需提前声明关系，因此不存在类型层级；核对由编译器按方法集完成。
        status: verified
        checkedBy: subagent-research
        checkedAt: "2026-11-17"
