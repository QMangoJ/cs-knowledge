  - id: error-as-value
    title: error 只是普通返回值：逼调用方在下一行当场表态
    tldr: "error 只是内置的单方法接口 Error() string；函数把错误与业务结果并排返回，把所有潜在失败路径摊在调用点明面上，杜绝跨层隐身跳转。"
    body: |-
      聊完接口与[[组合]]，正好顺着小接口引出 Go 全身上下争议最大的一项设计——显式错误处理。在 Go 里，`error` 连关键字都不是，它仅仅是一个预声明的单方法接口（`Error() string`），任何结构体只要实现了这个方法就能充当错误返回。凡是可能失败的函数，习惯上都在返回值列表末尾多带一个 `error`；调用方接住后下一行立刻写 `if err != nil`，不是空就走错误处理分支，是空才放心往下走。

      既然错误降格成了跟整数、字符串平起平坐的普通值，它就彻底失去了「隔空跳栈」的特权。你打开任何一份 Go 源码，哪一步调数据库可能挂、挂了是直接退回前端还是降级读缓存，全都在紧挨着的那三五行里写得明明白白，绝不会出现「表面看三行代码风平浪静，底层第七层突然抛出一个未声明异常把整条调用链炸穿」的惊吓。

      代码审查时，这种摊在明面上的控制流威力尤显：谁要是敢用下划线 `_` 硬吞掉一个关键函数的 `err` 返回值，评审人扫一眼就能揪出来，静态检查工具（linter）更是会直接亮红灯拦截。至于代价——满屏躲不掉的样板代码，咱们紧接着算。
    derivation: original
    sources:
      - ref: go-faq
        locator: "FAQ: Why does Go not have exceptions"
        claim: FAQ 说明 Go 把错误设计为普通返回值（error 接口），要求在调用点显式处理，使控制流与失败路径保持可见。
        status: verified
        checkedBy: subagent-research
        checkedAt: "2026-11-17"
    code:
      lang: go
      code: |-
        order, err := store.LoadOrder(id)
        if err != nil {
            return fmt.Errorf("加载订单 %d: %w", id, err)
        }
        // 到这里，order 一定可用，err 一定为空
    canvas:
      kind: datastate
      caption: 显式返回的控制流形状：失败路径与成功路径并排写着
      structure: array
      rows:
