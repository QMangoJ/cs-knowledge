  - id: small-interfaces-io-reader
    title: 接口越小越有力量：单方法 io.Reader 串起整座标准库
    tldr: 标准库灵魂接口 io.Reader 只要求一个 Read 方法，磁盘文件、网络连接、内存缓冲与加密解压流全能无缝接入；正如 Rob Pike 所言，「接口越大，抽象越弱」。
    body: |-
      要找小接口威力的铁证，翻开标准库 `io.Reader` 就够了。它全身上下只要求实现一个方法：`Read(p []byte) (n int, err error)`——往调用方递过来的字节切片里填数据，汇报填了几个字节以及有没有读完或出错。就凭这区区一行契约，磁盘文件（`os.File`）、TCP 网络连接（`net.Conn`）、HTTP 请求体、内存字节缓冲（`bytes.Buffer`）全都天然满足它；你写一个解析 [[JSON]] 的函数，只要入参收 `io.Reader`，不管是读本地配置文件、接网络请求还是跑单元测试塞一段字符串，一行代码都不用改。

      更妙的是乐高积木式的流式套娃（跟 Web 标准里的 [[ReadableStream]] 管道异曲同工）：`gzip.NewReader` 收一个 `io.Reader`，吐出来的还是一个 `io.Reader`；把网络连接外面包一层解密 Reader、再包一层解压 Reader 传给 JSON 解析器，每层各司其职，最里头的解析器对此浑然不觉。

      设计者 Rob Pike 把这背后的数学账浓缩成了一句名言：**「The bigger the interface, the weaker the abstraction.」（接口越大，抽象越弱。）** 接口每多塞进一个方法，能满足它的具体类型就少一大截，跨模块拼装的通用性就跟着缩水一圈。所以 Go 标准库遍地都是单方法接口（`io.Reader`、`io.Writer`、`fmt.Stringer`、`error`），真遇到既要读又要写的场景，再用接口[[组合]]把两个小接口拼成 `io.ReadWriter` 即可。
    derivation: original
    sources:
      - ref: go-effective
        locator: "Effective Go: Interfaces / io.Reader"
        claim: Effective Go 与标准库 io 包显示 Reader 仅含单个 Read 方法，文件、连接、缓冲与各类包装流都满足它，小接口由此获得最大组合空间。
        status: verified
        checkedBy: subagent-research
        checkedAt: "2026-11-17"
    code:
      lang: go
      code: |-
        type Reader interface {
            Read(p []byte) (n int, err error)
        }
