              mark: active
            - v: 当场表态
              sub: 必须当场表态
              mark: active
            - v: 单方法接口
              sub: 就一个方法
    log:
      - at: 收益
        text: 失败路径在代码里全程可见
  - id: why-no-exceptions
    title: 为什么拒绝 try-catch：日常业务失败不是「程序崩了」
    tldr: Go 官方 FAQ 直指 try-catch 容易把控制流搅得纠缠不清（convoluted），并诱使人把文件缺失、网络超时等日常输入全当异常乱抛；Go 将日常失败归入 error 值，只把逻辑崩溃留给 panic。
    body: |-
      为什么全世界主流语言都在用 `try-catch`，Go 偏偏铁了心不用？官方 FAQ 给出的核心理由非常犀利：把错误处理绑死在异常跳转这种特殊控制流结构上，不仅会让代码分支变得纠缠不清（原文用了 `convoluted` 一词），更致命的是它会诱导程序员偷懒——把「配置文件不存在」「下游接口超时」「用户传错了手机号」这类天天都在发生的**日常业务分支**，统统打包成「异常」一抛了之。等所有普通失败都在调用栈上漫天乱飞时，上层调用者根本分不清接住的到底是可预期的业务拒绝，还是系统真出 Bug 崩了。

      Go 因此在「意料之中的业务失败」与「意料之外的程序崩溃」之间划下了一道不可逾越的鸿沟：
      - **日常业务与外部环境失败（走 `error` 返回值）**：磁盘满、网络断、查无此人，全是服务器每秒都要面对的正常输入，老老实实当普通值就近处理。
      - **不可恢复的程序逻辑硬伤（走 `panic` / `recover`）**：数组下标越界、空指针解引用这类纯属代码写错的崩溃才触发 `panic`，它会沿着当前 [[goroutine]] 调用栈逐层倒退执行已注册的 `defer` 清理动作，无人拦截就直接终止进程；`recover` 仅建议放在基础库或 HTTP 框架顶层边界上兜底，把意外 `panic` 拦下来转成 `error` 或 500 响应，严禁拿 `panic` 代替日常业务报错。
    derivation: original
    sources:
      - ref: go-faq
        locator: "FAQ: Why does Go not have exceptions"
        claim: FAQ 原文：异常式设计显著增加复杂度，且把错误耦合到 try-catch 控制流会使代码纠缠、并鼓励把普通错误标记为异常；Go 以多返回值处理错误，panic 留给真正的异常局面。
        status: verified
        checkedBy: subagent-research
        checkedAt: "2026-11-17"
    canvas:
      kind: datastate
      caption: 两类失败，两种通道：分界线划在「是不是日常」
      structure: array
      rows:
        - label: 失败的分流
          cells:
            - v: error 返回
              sub: 文件、网络、参数
              mark: active
            - v: panic
              sub: 逻辑已崩局面
            - v: recover 转 error
              sub: 不漏给调用方
    log:
      - at: 分界
        text: 业务错误是正常输入，程序错误才是异常
  - id: error-cost-wrapping
    title: 认下啰嗦、补齐上下文：用 %w 错误链守住线上可排查性
    tldr: 显式返回的两大痛点是满屏 if err != nil 样板代码与裸 return err 丢光现场线索；工程上靠 fmt.Errorf 的 %w 逐层打包业务上下文，并用 errors.Is/errors.As 精准解包判别。
    body: |-
      替 Go 说完理由，也得坦荡认下它让人头疼的两笔真代价。第一笔是视觉啰嗦：真实业务函数里三步一判错，满屏 `if err != nil` 确实冲淡了主干逻辑的紧凑感；第二笔在工程上更要命——因为没有异常自带的调用栈回溯，新手往往每层只写一句干巴巴的 `return err`，等错误一路穿透五层传到网关日志里，只剩孤零零一句 `sql: no rows in result set`，鬼才知道到底是查哪个用户、哪张订单时缺了数据！

      Go 没有为了省字数动摇「显式返回」的根基，而是自 1.13 起补齐了标准**错误包装链（error wrapping）**：每一层往上交错误时，用 `fmt.Errorf("加载订单 %d: %w", id, err)` 里的 `%w` 动词把底层原错嵌进带本层业务参数的新错误里，串成一条既有完整业务故事线、又不丢底层根因的链条。上层需要按错施策时，调 `errors.Is(err, sql.ErrNoRows)` 就能穿透整条链认出是不是缺行，调 `errors.As` 就能把特定错误结构体掏出来读详情。

      再配上一条铁打的团队日志纪律：**同一个错误，要么在本层就地消化并打日志，要么用 `%w` 添上本层上下文往上报——严禁「先打一行错误日志、紧接着又往外 return err」**，否则一桩小错会在日志系统里刷出五条一模一样的噪音。
    derivation: original
    sources:
      - ref: go-effective
        locator: "Effective Go: Errors / error wrapping 惯例"
        claim: 官方惯例要求错误在向上传递时用 fmt.Errorf 与 %w 添加本层上下文，并用 errors.Is/As 在链上判定，显式处理与可追溯性兼得。
        status: verified
        checkedBy: subagent-research
        checkedAt: "2026-11-17"
    canvas:
      kind: datastate
      caption: 显式 error 的两笔代价与对应补救
      structure: array
      rows:
        - label: 代价与补救
          cells:
            - v: 样板重复
              sub: 高频出现
            - v: 上下文丢失
              sub: 裸返回丢上下文
            - v: "%w 逐层包装"
              sub: 错误链可追溯
              mark: active
    log:
      - at: 纪律
        text: 处理掉，或者包装上报——不许含糊地穿过
  - id: interview-recap
    title: 三层框架答透高频面试题：Go 为什么既没继承也没异常
    tldr: 答透这道经典设计题分三步走：先点明「不提前锁死层级、不暗中跳转控制流」的总立场，再给出「隐式小接口 + 结构体[[组合]] + 显式 error」成套替代，最后坦诚指出代价与工程补救。
    body: |-
      全栈与后端面试里，考官最爱追问的一道压轴题就是：「你用过 Go，那你说说它为什么既不做类继承，也不做 `try-catch` 异常？」只背一句「为了简单」拿不到高分，按下面这三层递进框架作答才能展现扎实的工程全局观：
      1. **先立工程标尺（为什么删）**：在千人维护十年的服务端代码库里，类继承强迫在设计初期锁死父子层级树，基类一动波及全树；`try-catch` 则鼓励把日常失败当异常隔空乱抛，让失败路径在源码里隐身。两者都违背了 Go「点开当前文件就能看清全部关系与控制流」的底线。
      2. **再给成套替代（拿什么顶）**：把继承拆成两半——多态交给编译期按方法集匹配的**隐式小接口**（由调用方按需定义），复用交给装配期按需拼装的**结构体嵌入[[组合]]**；把失败拆成两道——日常业务与环境错误走普通返回值 `error` 当场表态，真正不可恢复的程序硬伤才走 `panic`。
      3. **最后坦诚认账（怎么补短板）**：隐式接口看不出实现关系，靠 IDE 静态导航和编译期赋值断言补齐；显式判错样板啰嗦且裸返易丢线索，靠 `%w` 逐层包装上下文与 `errors.Is/As` 错误链纪律兜底。

      合上这门课再回望整个 Go 语言板块，从第一课的 25 个关键字与[[单二进制]]，到第二课 2KB 起步的 [[goroutine]] 与 [[channel]]，再到本课的隐式接口、组合与显式 `error`，背后自始至终只有一条主线：**宁可让写代码的人多敲几行摆在明面上的字，也绝不给读代码和维护系统的人埋任何藏在暗处的机关**。
    derivation: adapted
    sources:
      - ref: go-faq
        locator: "FAQ: Design principles 相关条目汇总"
        claim: FAQ 中关于继承、异常与接口的条目共同构成同一立场：以隐式接口、组合与显式错误替代类型层级与异常控制流。
        status: verified
        checkedBy: subagent-research
        checkedAt: "2026-11-17"
    canvas:
      kind: datastate
      caption: 本课答法的三层结构
      structure: array
      rows:
        - label: 回答框架
          cells:
            - v: 主动删
              sub: 与目标冲突
              mark: active
            - v: 接口+组合+error
              sub: 各有归属
              mark: active
            - v: 要认账
              sub: 不可见与啰嗦
    log:
      - at: 收束
        text: 三课一条线：一切关系与控制流都写在明处
