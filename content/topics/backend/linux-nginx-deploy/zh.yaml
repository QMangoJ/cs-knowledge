- id: static-cache
  title: 第五步：静态托管的细节——带哈希的文件名与长缓存
  tldr: 前端打包产物发到 Nginx 时有个经典配合：文件名带内容哈希（app.a3f9c1.js），于是可以给它设一年长缓存；内容变了文件名就变，天然不会拿到旧文件。入口文件 index.html 则不缓存，保证用户总能拿到最新版的入口。
  body: |-
    先说清问题。静态文件若不设缓存，用户每次打开页面都要把几百 KB 的 JS 重新下一遍，慢且费流量；若设了长缓存又不换文件名，发新版后用户手里还是旧文件，页面和接口对不上版，事故就来了。

    带哈希的文件名把这对矛盾拆开了。构建时按内容给文件命名：内容没变，名字不变，浏览器与 CDN 放心用缓存里的那份；内容一变，名字跟着变，新的 index.html 会指向新名字，用户自然拿到新文件。所以规则是两段：带哈希的资源设一年长缓存（immutable），作为入口的 index.html 不缓存或短缓存——入口永远新鲜，资源永远可缓存。

    判断一个站点的静态托管做得对不对，就看这两段规则在不在。再补一句同域的好处：页面与接口都从 Nginx 这一个域名出去，浏览器眼里是同源，跨域问题在单机部署里天然不存在——这也是很多小项目把前后端塞进一台机器的一个隐形红利。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: nginx
      id: nx
      label: Nginx：两种缓存规则分开设
    - lane: visitor
      id: u
      label: 用户：资源用缓存，入口永远新鲜
      highlight: true
    messages:
    - id: m1
      from: nx
      to: u
      label: app.a3f9c1.js 缓存一年，index.html 不缓存
      active: true
    registers:
    - name: 带哈希资源
      value: 内容变名字就变，长缓存不会拿到旧版
    - name: 入口文件
      value: 不缓存，保证指向的永远是最新资源
  log:
  - at: 静态托管
    text: 哈希命名让长缓存与及时更新同时成立
- id: config-env
  title: 第六步：配置分层——代码一份，配置按环境注入
  tldr: 同一个制品要跑开发、测试、生产：变的只有数据库地址、域名、密钥这些配置。做法是代码只读环境变量，值由每个环境在启动时注入——在单机上，就是 systemd 单元里指的那份环境文件。
  body: |-
    先看写死配置的下场。数据库地址写进代码，测试环境要连测试库，就得改代码重新构建——构建出来的已经不是同一个制品了，测试验过的和上线跑的不是一份东西，发布课里「只构建一次」的规矩就破了。密钥写进代码的下场，安全课已经算过账：它会跟着代码走遍每一个克隆与备份。

    环境变量注入把这件事翻过来：代码在启动时从环境里读配置，读不到必填项就宁可启动失败，也不能带着默认的错误配置硬跑。单机上落点很具体：把生产配置写进一份只有管理员能读的环境文件（如 /srv/shop/.env，权限收紧），在 systemd 单元里用 EnvironmentFile 指给它。第二步写单元文件时埋的那一行，就是为这里准备的。

    配置分层再往前一步是分级：不敏感的配置（端口、日志级别）可以进仓库的示例文件，敏感的（密钥、口令）只进环境文件与密钥服务。审查一个项目的配置管理，就看这两级分清了没有、示例文件里有没有混进真密钥。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: systemd
      id: env
      label: 环境文件：只有管理员能读
    - lane: app
      id: app
      label: 应用：启动时读环境，缺必填项就拒绝启动
      highlight: true
    messages:
    - id: m1
      from: env
      to: app
      label: 同一制品，换环境只换这份文件
      active: true
    registers:
    - name: 分级
      value: 普通配置可进示例文件，密钥只进环境文件
    - name: 缺配置的态度
      value: 宁可起不来，不能带错配置硬跑
  log:
  - at: 配置
    text: 制品一次构建处处跑，差异全在注入的配置里
- id: logs-on-box
  title: 第七步：日志在哪看——两个落点与一条轮转铁律
  tldr: 单机上日志只有两个落点：应用的输出归 systemd 的 journal，用 journalctl 按服务名查；请求的进出归 Nginx 的访问日志与错误日志。再加一条铁律：所有日志必须轮转，否则磁盘会被日志吃满。
  body: |-
    先把落点认清。应用打到标准输出的东西，systemd 会收进 journal：journalctl -u shop 就能只看这个服务的日志，带 -f 是跟着尾巴实时看。Nginx 自己写两份文件：访问日志记每个请求的路径、状态码与耗时，错误日志记它转交时出的问题。排障时的分工很自然：用户说页面打不开，先看 Nginx 访问日志确认请求到没到、返回了什么，再去 journal 看应用那一段发生了什么——第三步的「先切应用段还是入口段」，在这里落地。

    然后把爆盘的账算出来。一个日活不大的服务，访问日志加应用日志一天写 2GB 不稀奇。不做轮转，一个月就是 60GB——云服务器的系统盘常常总共就 40 到 100GB。磁盘满的那一刻，死掉的往往不是日志本身：数据库写不进数据、上传落不了盘、应用建不了临时文件，报错个个看起来和日志无关，这是单机运维最经典的慢性事故。

    轮转是系统自带工具 logrotate 的活：按天或按大小切割，旧的压缩，只留最近若干份。在部署清单里它和守护、入口是同级的必做项，不是等出事了再补的优化。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: j
      label: journal：journalctl 按服务名查应用日志
    - lane: nginx
      id: acc
      label: Nginx 日志：请求到没到、返回了什么
    - lane: systemd
      id: rot
      label: logrotate：按天切割，只留最近几份
      highlight: true
    messages:
    - id: m1
      from: j
      to: rot
      label: 一天 2GB，不轮转一月吃满磁盘
      active: true
    registers:
    - name: 排障顺序
      value: 先 Nginx 访问日志，再 journal 看应用
    - name: 爆盘的伪装
      value: 报错出现在数据库与上传处，根源是日志
  log:
  - at: 日志
    text: 落点要认清，轮转是必做项不是优化项
- id: release-on-box
  title: 第八步：在这台机器上发一版，具体动作是什么
  tldr: 与流水线课分工：流水线把制品送到机器上，这一步接的是送达之后——换文件、改配置不动、重启服务、看健康端点确认，回滚就是把这套动作对旧制品再做一遍。
  body: |-
    跟着一次发布走。新制品（比如新版的可执行文件）被流水线送到服务器，先放在新目录里，和正在跑的旧版并存。发布动作就三下：把 systemd 单元指向新制品（或替换符号链接）、systemctl restart 重启、立刻看健康端点与错误日志确认新版活得好好的。整个过程用户侧的感知只有重启那一两秒——Nginx 在门口挡着，请求短暂排队而不是报错。

    回滚是对称的：新版不对劲，把指向换回旧制品目录，再重启一次，回到发布前的状态。所以单机发布的纪律是：旧制品别删，至少留上一版在磁盘上；数据库的变更要能向前兼容新旧两版（这一条的深水在数据学科与发布课，这里只点名）。蓝绿、金丝雀那些策略在单机上也能玩简化版——两个端口各跑一版，Nginx 切流量——原理已在发布课讲过，这里不重复，只记住落点：切的动作发生在 Nginx 的配置里。

    强调分工是为了审查时不混淆：发布慢、发布险，先分清是送达的流水线慢，还是安顿的这几步没做对——两边的药方完全不同。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: systemd
      id: swap
      label: 发布三下：换指向、重启、验活
    - lane: app
      id: old
      label: 旧制品：留在磁盘上，随时可回
    - lane: nginx
      id: door
      label: Nginx：重启的几秒里在门口挡着
      highlight: true
    messages:
    - id: m1
      from: swap
      to: old
      label: 回滚就是对旧制品把三下再做一遍
      active: true
    registers:
    - name: 纪律
      value: 旧版至少留一份，数据库变更要兼容两版
    - name: 分工
      value: 流水线管送达，这几步管安顿
  log:
  - at: 发布
    text: 单机发布是换、重启、验活，回滚是对称动作
- id: single-box-ceiling
  title: 第九步：单机的天花板——什么时候必须离开它
  tldr: 单机的账要算清：它便宜、简单、全套骨架一个人就能管。但它有三个硬顶：机器坏了全完、流量涨了只能换更大的机器、发布时总有一瞬的抖动。撞上任何一个，才轮到集群与编排出场。
  body: |-
    第一个顶是可用性。这台机器宕机、断电、被云厂商回收，服务就是百分之百不可用，没有第二个落点。业务若到了「停一小时要赔钱」的级别，单机就不合格了——注意这不是技术问题，是业务对停机的出价问题，出价为零时单机就是正确答案。

    第二个顶是扩展。单机的扩容只有一条路：换更大的机器（纵向扩展），而机器的规格有上限，价格还涨得比性能快。流量再涨，就必须把服务拆到多台机器上跑（横向扩展），那一刻负载均衡、会话共享、配置同步全都要重新安排——就是编排课接手的摊子了。第三个顶是发布与维护的窗口：重启总有一两秒的抖动，给系统打补丁要挑深夜，这类不便在小规模时可以忍，规模大了就成了硬约束。

    还要补一句数据的事：服务可以重拉，数据丢了就是丢了。单机上的数据库必须有异地备份——备份文件定期送到另一台机器或对象存储，并真的演练过恢复。没有恢复演练的备份，只能算一个心理安慰。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: box
      label: 单机：便宜简单，一个人管得过来
    - lane: visitor
      id: ceil
      label: 三个硬顶：坏了全完、只能纵向扩、发布有抖动
      highlight: true
    messages:
    - id: m1
      from: box
      to: ceil
      label: 撞上任何一个，才轮到集群出场
      active: true
    registers:
    - name: 判断标准
      value: 不是规模崇拜，是业务为停机出的价
    - name: 数据底线
      value: 异地备份且演练过恢复，才算有备份
  log:
  - at: 天花板
    text: 单机是算过账的选择，离开它也要有账
- id: closing-deploy
  title: 第十步：收束——四句口诀与一份部署清单
  tldr: 全课收成四句：进程有人管（systemd）、入口有人守（Nginx）、配置不进代码（环境变量）、日志有地方看（journal 与 Nginx 日志加轮转）。拿着这四句去审任何一台服务器的部署，成色立判。
  body: |-
    把这一课的账并一并。服务在一台机器上活着，靠的是四根支柱各就其位：systemd 以单元文件托管进程的生死，崩溃以秒计复活；Nginx 做统一入口，终结 TLS、发静态、转交接口，让应用躲在回环后面；配置与代码分离，同一制品靠环境变量跑遍所有环境；日志分落 journal 与 Nginx 两处，并由轮转守住磁盘。发布是换制品、重启、验活的对称动作，回滚照方抓药。

    这套骨架还有一个身份：它是后面所有放大版的原型。Kubernetes 的探针敲的是这一课的健康端点，它的守护与入口就是 systemd 与 Nginx 的集群版；云厂商的负载均衡与托管服务，卖的也是这四件事的免运维版。先在单机上把四件事看清，再看集群时就不会被名词淹没。

    下一课回到代码质量：在一台机器上安顿好的服务，怎么证明改一版没把老功能弄坏——后端测试的三层分工，是下一个话题。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: systemd
      id: four
      label: 四句口诀：管进程、守入口、配置外置、日志有落点
    - lane: app
      id: proto
      label: 单机骨架：一切集群方案的原型
      highlight: true
    messages:
    - id: m1
      from: four
      to: proto
      label: 审任何部署，逐句对照即可
      active: true
    registers:
    - name: 与集群的关系
      value: 探针、守护、入口都是这四件事的放大版
  log:
  - at: 收束
    text: 单机部署的骨架，就是后端运维的字母表
