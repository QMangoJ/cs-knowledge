overview:
  - key: 一句话总结
    value: 单机把服务养活靠四样组件各司其职：systemd 管进程生死（开机自启、崩了秒级拉起），Nginx 守大门（终结 TLS、发静态文件、转发接口），环境变量管配置（一份制品按环境注入），journal 与 logrotate 管日志归集与防爆盘。
  - key: 进程守护
    value: 手动在 SSH 终端启动的进程，关窗口收 SIGHUP 会死、半夜崩溃没人拉、机器重启回不来。写成 systemd 单元文件托管后，进程的生老病死全由系统 1 号进程替你盯着。
  - key: 反向代理
    value: 用户不直连应用端口，统一走门口的 Nginx：它监听 80/443 终结 HTTPS、直接读盘发静态资源、把 /api/ 请求转给本机回环地址上的服务，让业务进程专心算逻辑。
  - key: 配置分层
    value: 开发、测试、生产跑同一份构建制品，差异全在数据库地址、域名与密钥。代码启动时只读环境变量，缺必填项当场退出，绝不把密钥写进代码仓库。
  - key: 日志落点
    value: 应用标准输出归 systemd 的 journal（用 journalctl -u 按服务查），进出流量归 Nginx 访问与错误日志。所有日志必须配 logrotate 轮转，否则一天 2GB 一个月就能把系统盘吃满。
  - key: 与流水线的分工
    value: 持续交付流水线管「怎么把制品造出来并送到机器上」，这一课管「制品落地后怎么安顿下来长久运行」——流水线负责送达，单机部署负责养活。
  - key: 谁在用
    value: 中小团队与独立项目靠一两台云服务器就能撑起全站业务；大厂的 Kubernetes 与云网关，也只是把这套「守护 + 入口 + 配置 + 日志」骨架放大到了多机集群。
summary: 你刚租下一台 2 核 4G 的 Linux 云服务器，要把写好的订单服务放上去全天候对外接客。全课沿着这台裸机把四根支柱逐一搭齐：先把进程交给 [[systemd]] 托管，配好开机自启与崩溃 1 秒自愈；再让 [[Nginx]] 守住 80/443 大门做[[反向代理]]，接管 [[TLS]] 证书、前端静态缓存与接口转发；接着用权限收紧的环境文件注入配置，守住「一份[[制品]]跑遍三套环境」；最后厘清 journal 与 Nginx 两处日志排障顺序，用 logrotate 堵住爆盘隐患，并算清平滑换版与离开单机的临界点。
premise: 把订单服务传上云服务器、在 SSH 窗口里敲命令跑通，浏览器能打开页面——这只算「暂时在跑」，远不算「活着」。万一你关掉笔记本合上终端、半夜遇到一条脏数据触发进程崩溃、或者云厂商凌晨重启宿主机，谁把服务拉起来？公网用户敲哪个端口、HTTPS 证书搁在哪、出了错去哪翻线索？这一课就解决怎么在一台裸机上把服务真正养活。
position: 本课位于后端工程学科第九段「单机部署：Linux 与 Nginx」。前面的持续交付课讲[[制品]]怎么从[[流水线]]构建并送达服务器，本课接手制品到站后的运行安顿；同时它也是容器编排课的单机母版——Kubernetes 在集群里做的探针自愈、Ingress 入口与配置挂载，正是把本课的 [[systemd]] 与 [[Nginx]] 放大到了多机尺度。
level: 基础
minutes: 26
objectives:
  - 说清裸机养活服务的四根支柱（守护、入口、配置、日志）各由哪个组件负责
  - 看懂 systemd 单元文件的核心指令，算清崩溃秒级自愈与开机自启的账
  - 拆解 Nginx 在门口接管的三件事，配对带哈希静态资源与 index.html 的缓存规则
  - 算清日志慢性爆盘的账，掌握三级验活、双落点查日志与软链平滑发版的标准动作
aiLink: 记住单机部署四句口诀：进程有人管、入口有人守、配置不进代码、日志有轮转。后面的容器编排与云原生网关，全是把这四句话放大到集群规模。
bridge:
  prev: 上一课堵住了接口层的注入与越权漏洞，可代码还停在仓库里：租下一台真实云服务器后，进程归谁看守、HTTPS 证书装在哪、半夜崩了谁来拉起？这一课就把订单服务稳稳安顿到一台 Linux 机器上。
  next: 服务在服务器上全天候跑起来了，可业务每周都要改版：动一下优惠券退款逻辑，怎么敢肯定没把下单和对账弄坏？下一课讲后端测试，看单元、集成与契约三层防线各拦哪类故障。
design:
  - mechanism: 进程生命周期交给 systemd 托管
    problem: 手动在终端跑起来的进程有三种常见死法：关 SSH 窗口收到挂断信号跟着死、半夜 panic 崩溃没人拉、宿主机重启后起不来。随便撞上一个，线上就无声停摆。
    choice: 写一份 /etc/systemd/system/shop.service 单元文件，写明启动命令、工作目录、环境文件、Restart=always 与开机自启，把生老病死全权交给系统 1 号进程看管。
    tradeoff: 需要掌握单元文件语法和 journalctl 查询命令；而且 systemd 只管本机进程，机器本身宕机它无能为力——跨机容灾要等集群编排接手。
    root: 服务「活着」是一种持续状态而非一次启动动作，必须有一个常驻看守者不停比对「期望在跑」与「实际在跑」，发现掉线立刻补齐。
  - mechanism: 反向代理做统一入口
    problem: 让公网用户直连业务端口，应用就得自己背 HTTPS 证书、自己读盘发前端静态包，重启换版那几秒用户还会直接撞上连接拒绝，业务进程毫无缓冲地裸露在公网上。
    choice: 门口立一道 Nginx 监听 80 与 443：终结 TLS 加密、直接从磁盘发静态资源、把 /api/ 请求转给 127.0.0.1:8080，业务进程只绑本机回环地址。
    tradeoff: 链路多一跳就多一层配置和排障切面，接口变慢得先分清卡在 Nginx 还是应用；换来的是证书续期、静态加速、限流切流全收口到一处。
    root: 公网入口是全站唯一对外暴露的关口，把接待杂活剥给专职反向代理，业务进程才能退居内网专心算业务、随时重启换版。
  - mechanism: 配置与代码分离，环境变量注入
    problem: 一旦把数据库密码或线上域名写死进代码，测试与生产就没法共用同一个二进制包，改个参数都得重新编译发版，敏感密钥还会顺着 Git 克隆到处流散。
    choice: 代码启动时只从环境变量读取配置，缺关键项直接报错退出；本地开发读 .env，线上服务器通过权限收紧的 EnvironmentFile 或密钥服务在启动瞬间注入。
    tradeoff: 配置项变多后必须维护清晰的示例清单与启动自检逻辑，本地跑项目也要多配一份环境文件。
    root: 构建制品应当「一次编译、到处运行」，环境差异属于部署现场而不属于代码；把配置剥离出去，发版与回滚才能简化成纯粹的「换制品」。
quiz:
  - q: 服务用 nohup 在终端里跑起来了，为什么还说它没有被真正「养活」？
    options:
      - 因为 nohup 启动的进程性能差
      - 进程半夜崩溃没人自动拉起、机器重启后不会自启、工作目录与标准输出日志也缺乏统一托管
      - 因为 systemd 启动的进程有特殊权限
      - 因为 nohup 不支持环境变量
    answer: 1
    explain: 活着是持续受控的状态：nohup 顶多挡住关终端那一下的 SIGHUP 挂断信号，既救不了程序运行期崩溃，也管不了机器重启自启和日志结构化归集，这些全靠 systemd 单元文件一次管齐。
  - q: 用户打开商城页面时，前端打包出来的 JS、CSS 等静态文件应该由谁直接发送？
    options:
      - 应用服务逐个读取发送
      - 门口的 Nginx 直接读盘发送：这是它的看家本领，省得静态请求去占业务进程的资源
      - 数据库里存着发送
      - 浏览器自己生成
    answer: 1
    explain: Nginx 基于事件驱动发静态文件极快且开销极低；让它在门口直接回传静态包，后端应用只需监听 127.0.0.1:8080 专心处理 /api/ 业务请求。
  - q: 访问日志加应用日志一天写 2GB，如果不配轮转，一个月后会发生什么？
    options:
      - 日志会自动变小
      - 约 60GB 日志把系统盘吃满，数据库写盘或文件上传纷纷报出表面和日志毫不相干的错误而停摆
      - 操作系统会把旧日志传到云端
      - 没有任何影响
    answer: 1
    explain: 慢性爆盘是单机运维头号隐形杀手：磁盘被日志塞满那一刻，往往是数据库落盘或建临时文件先报错，排查半天才发现祸首是没配 logrotate 按天切割清旧。
  - q: 同一份订单服务代码要依次跑在开发、测试、生产三套环境，正确做法是？
    options:
      - 维护三份代码，各写各的配置
      - 代码统一读环境变量，各环境在启动时注入各自配置，同一个构建制品原样跑遍三处
      - 把生产配置写进代码，上线前改回来
      - 用注释切换配置
    answer: 1
    explain: 环境配置属于部署现场而非代码仓库。靠环境变量注入，既守住了持续交付「只构建一次」的铁律，也落实了安全课「密钥绝不进代码」的底线。
steps:
  - id: four-pillars
    title: 关掉 SSH 进程就死：裸机养活服务的四根支柱
    tldr: 手动敲命令跑起程序只算「暂时在跑」；真正养活服务要靠 [[systemd]] 管生死、[[Nginx]] 守大门、环境变量注配置、日志轮转防爆盘。
    body: |-
      在 2 核 4G 云服务器上敲下 `./server`，浏览器能打开商城页，为什么关掉笔记本 SSH 窗口服务就断了？因为终端断开那一刻，Linux 内核会向关联的前台进程组发送 `SIGHUP` 挂断信号，直接终止程序。就算在命令前加 `nohup` 挡住挂断信号，万一半夜遇到脏数据触发 panic 崩溃，或者云厂商例行重启宿主机，进程照样无声消失。

      想让订单服务在一台裸机上全天候活着，四根支柱缺一不可：进程守护归 Linux 自带的 1 号总管进程 [[systemd]]，入口接待归守在 80/443 端口的[[反向代理]] [[Nginx]]，环境差异归启动时注入的环境变量，事后追查归 `journal` 与经过轮转的日志文件。大厂的 Kubernetes 集群看着庞大，干的也是把这四根支柱从一台机器放大到上千台节点。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: systemd
          id: guard
          label: 守护：崩了拉起、开机自启
        - lane: nginx
          id: door
          label: 入口：接客、发静态、转交
        - lane: app
          id: svc
          label: 服务进程：只管办业务
          highlight: true
      messages:
        - id: m1
          from: guard
          to: svc
          label: 进程的生死归看守者管
        - id: m2
          from: door
          to: svc
          label: 请求从正门进，不直连进程
          active: true
      registers:
        - name: 四根支柱
          value: 守护、入口、配置、日志，各有主人
    log:
      - at: 全景
        text: 活着是持续状态，不是一次启动动作
  - id: systemd-unit
    title: 进程交给 [[systemd]] 托管：五句声明管住生老病死
    tldr: 写一份 .service 单元文件声明启动命令、工作目录、环境文件与 Restart=always，进程意外退出后 1 秒内就会被自动拉起。
    body: |-
      进程守护不用自己写死循环脚本，直接写一份放在 `/etc/systemd/system/shop.service` 的纯文本单元文件即可。[[systemd]] 由 Red Hat 的 Lennart Poettering 等人设计，用来取代早期繁琐易错的 SysV init 启动脚本，如今已是主流 Linux 发行版开机启动的第一个进程（PID 1）。单元文件核心只有五句：`WorkingDirectory` 定运行目录，`EnvironmentFile` 指配置路径，`ExecStart` 写启动命令，`Restart=always` 配 `RestartSec=1` 声明退出满 1 秒即重拉，`WantedBy` 挂上开机自启。

      算一笔停机时间账就知道它的分量：没人看守时，订单服务凌晨 2 点崩溃，往往要等到早上 9 点第一个顾客下单报错才被发现，故障长达 7 小时；托管给 systemd 后，进程刚退出 1 秒就被重新拉起，故障窗口缩到用户几乎无感。日常运维也收拢成三条固定命令：`systemctl status shop` 查死活，`systemctl restart shop` 换版重启，`journalctl -u shop` 翻输出日志。
    derivation: original
    sources:
      - ref: systemd-docs
        locator: "systemd.service 手册: ExecStart、Restart、WorkingDirectory 等单元配置"
        claim: systemd 服务单元通过 ExecStart 等指令定义启动方式，Restart 策略控制进程退出后是否及如何重启，单元可设置为开机自启。
        status: verified
        checkedBy: subagent
        checkedAt: "2026-11-17"
    code:
      lang: ini
      code: |-
        [Service]
        WorkingDirectory=/srv/shop
        EnvironmentFile=/srv/shop/.env
        ExecStart=/srv/shop/server
        Restart=always
        RestartSec=1
        [Install]
        WantedBy=multi-user.target
      note: 五句声明管住生老病死：怎么起、在哪跑、配置哪来、崩了拉起、开机自启
    canvas:
      kind: swimlane
      actors:
        - lane: systemd
          id: unit
          label: 单元文件：启动方式的一份声明
        - lane: app
          id: svc
          label: 服务进程：崩溃一秒后被重新拉起
          highlight: true
      messages:
        - id: m1
          from: unit
          to: svc
          label: Restart=always：应该在跑，就必须在跑
          active: true
      registers:
        - name: 无守护的故障时长
          value: 半夜崩溃到早晨被发现，可达数小时
        - name: 有守护
          value: 崩溃到复活以秒计，用户几乎无感
    log:
      - at: 守护
        text: 守护的价值不在启动，在持续比对与拉起
  - id: health-check
    title: 三级验活：查监听端口、探本机回环、问健康端点
    tldr: 进程在列表里不代表服务能用；顺着端口监听、本机回环和 /healthz 依赖检查三级往下排，一分钟就能切开故障在应用还是入口。
    body: |-
      `systemctl status` 显示绿灯只说明进程没退出，确认服务真能接客要过三道关。第一关敲 `ss -tlnp` 看预定的 `8080` 端口有没有处于监听态——如果进程在但端口没竖起来，多半是启动半路卡在连库或读错配置上。

      第二关在服务器本机敲 `curl http://127.0.0.1:8080`，这是单机排障最管用的分水岭：本机回环能正常返回，说明订单服务自身没毛病，公网打不开就专心去查 Nginx 和云服务器安全组防火墙；本机回环都不答，直接盯紧应用本身。

      第三关是专门给订单服务留一个 `/healthz` 接口，内部顺手探测一下数据库与缓存是否连通，连不上就返回 `503`。单机阶段它是给人排障看的，等将来迁上 Kubernetes，集群的存活与就绪探针敲的就是这同一扇门。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: systemd
          id: ps
          label: 第一级：进程在、端口在监听
        - lane: app
          id: curl
          label: 第二级：本机回环能答
        - lane: nginx
          id: hz
          label: 第三级：健康端点查依赖，坏了报 503
          highlight: true
      messages:
        - id: m1
          from: ps
          to: curl
          label: 先把故障切成应用段还是入口段
          active: true
      registers:
        - name: 排障分水岭
          value: 回环通则查入口，不通则查应用
        - name: 健康端点
          value: 编排系统的探针将来敲的就是这扇门
    log:
      - at: 验活
        text: 在跑、能答、依赖通，三级都过才算活着
  - id: nginx-proxy
    title: "[[Nginx]] 守大门：终结 [[TLS]]、直发静态、转发接口"
    tldr: 公网请求全部先过 80/443 端口的 Nginx：静态文件由它直接读盘返回，/api/ 接口转发给 127.0.0.1:8080，业务进程在公网完全隐身。
    body: |-
      用户打开商城首页时，浏览器连的并不是你的订单服务，而是守在门口的 [[Nginx]]。Nginx 由 Igor Sysoev 为攻克单机万级并发（C10K 问题）用事件驱动模型写成，在服务器上体现为 `/etc/nginx/conf.d/` 下的配置文件加一组 master/worker 常驻进程。它按 URL 路径分流：遇到 JS、CSS、图片等静态资源，直接从 `/srv/shop/web` 读盘回传，快且丝毫不占业务进程资源；遇到 `/api/` 开头的请求，才通过 `proxy_pass` 转给绑在本机 `127.0.0.1:8080` 的订单服务。

      HTTPS 加密也在这一层统一终结。Let's Encrypt 自动申请续期的证书只装在 Nginx 一处，由它跑完 [[TLS]] 握手解开密文，再把干净的明文 HTTP 递给本机回环上的应用。改完 Nginx 配置只需敲一行 `nginx -s reload`，旧 worker 会把手里正在传的请求体面处理完再退出，新 worker 无缝顶上，线上连接一根不断。

      把大门收归[[反向代理]]还顺手买来一层护盾：订单服务只监听 `127.0.0.1`，公网扫描器根本摸不到它的端口；哪怕应用重启换版卡了一两秒，Nginx 也能在门口暂存缓冲或返回友好的维护页，不让顾客直接撞上生硬的连接拒绝。
    derivation: original
    sources:
      - ref: nginx-docs
        locator: "nginx 官方文档: proxy_pass 反向代理与静态文件服务"
        claim: nginx 可作为反向代理将请求转发给后端应用（proxy_pass），并直接提供静态文件服务与 TLS 终止，是单机部署的常见入口形态。
        status: verified
        checkedBy: subagent
        checkedAt: "2026-11-17"
    code:
      lang: nginx
      code: |-
        location / {
            root /srv/shop/web;        # 静态文件：我直接发
        }
        location /api/ {
            proxy_pass http://127.0.0.1:8080;   # 接口请求：转交应用
        }
      note: 两段配置就是门口的分工：静态归 Nginx，接口归应用
    canvas:
      kind: swimlane
      actors:
        - lane: visitor
          id: u
          label: 用户：只和 Nginx 对话
        - lane: nginx
          id: nx
          label: Nginx：静态直接发，接口转交
        - lane: app
          id: app
          label: 应用：只监听本机 8080，公网看不见
          highlight: true
      messages:
        - id: m1
          from: u
          to: nx
          label: HTTPS 在这里终结
        - id: m2
          from: nx
          to: app
          label: 接口请求转交本机端口
          active: true
      registers:
        - name: 证书
          value: 只装在 Nginx 一处，应用不懂 TLS
        - name: 应用的暴露面
          value: 只监听回环地址，公网无法直连
    log:
      - at: 入口
        text: 门口解耦：换应用不动入口，换证书不动应用
  - id: static-cache
    title: 静态资源缓存术：哈希文件名强缓存一年，入口页绝不缓存
    tldr: 带内容摘要的 app.a3f9c1.js 放心设一年 immutable 强缓存，入口 index.html 设为不缓存，让秒开加载与发版即刻生效同时成立。
    body: |-
      前端工程打包完丢给 Nginx 托管时，常遇到一对两难：不设缓存，用户每次进商城都要重下几百 KB 的 JS 包，又慢又烧带宽；设了长缓存，发新版后用户浏览器里还攥着旧脚本，新接口配老页面当场报错。

      破局全靠前端构建工具（Vite 或 Webpack）生成的「内容哈希文件名」加 Nginx 两段式缓存头。代码没改，打包出的 `app.a3f9c1.js` 名字不变，Nginx 给它挂上一年长缓存（`Cache-Control: max-age=31536000, immutable`），浏览器和 [[CDN]] 直接读本地副本；代码一改，文件名变成 `app.8b2e04.js`，而作为唯一入口的 `index.html` 被 Nginx 设为 `no-cache`，用户每次打开都先拿最新入口页，顺着新名字自然拉下新脚本。

      前后端合住一台机器经同一个 Nginx 域名对外，还白得一个红利：页面地址与 `/api/` 接口在浏览器眼里完全同源，本地开发联调时头疼的跨域（CORS）预检请求，在生产环境天然消失。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: nginx
          id: nx
          label: Nginx：两种缓存规则分开设
        - lane: visitor
          id: u
          label: 用户：资源用缓存，入口永远新鲜
          highlight: true
      messages:
        - id: m1
          from: nx
          to: u
          label: app.a3f9c1.js 缓存一年，index.html 不缓存
          active: true
      registers:
        - name: 带哈希资源
          value: 内容变名字就变，长缓存不会拿到旧版
        - name: 入口文件
          value: 不缓存，保证指向的永远是最新资源
    log:
      - at: 静态托管
        text: 哈希命名让长缓存与及时更新同时成立
  - id: config-env
    title: 配置与代码分离：同一份[[制品]]靠环境变量跑遍三套环境
    tldr: 代码里严禁写死数据库地址与密钥，统一在启动时读取环境变量，缺关键项宁可拒绝启动也绝不带错硬跑。
    body: |-
      要是把测试库地址写死在代码里，上线前就得改代码重新编译——测试验过的包和线上跑的包根本不是同一份[[制品]]，持续交付「只构建一次」的铁律当场作废；要是把密钥写进代码，它还会顺着每一次 Git 克隆和备份散落各处。

      正道是彻底倒过来：代码在启动瞬间只向环境变量伸手要参数，发现必填项缺失当场报错退出，绝不拿默认假配置硬撑。落在咱们这台服务器上，就是把生产参数写进 `/srv/shop/.env`，用 `chmod 600` 收紧到仅管理员可读，再由单元文件里的 `EnvironmentFile` 注入进程。

      日常维护还要做好两级切分：端口号、日志级别等非敏感参数可以写进仓库的 `.env.example` 当说明书；数据库口令与支付私钥只准留在服务器的环境文件或专用密钥服务里。审一个项目的配置卫不卫生，先翻仓库里的示例文件有没有混进真密码。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: systemd
          id: env
          label: 环境文件：只有管理员能读
        - lane: app
          id: app
          label: 应用：启动时读环境，缺必填项就拒绝启动
          highlight: true
      messages:
        - id: m1
          from: env
          to: app
          label: 同一制品，换环境只换这份文件
          active: true
      registers:
        - name: 分级
          value: 普通配置可进示例文件，密钥只进环境文件
        - name: 缺配置的态度
          value: 宁可起不来，不能带错配置硬跑
    log:
      - at: 配置
        text: 制品一次构建处处跑，差异全在注入的配置里
  - id: logs-on-box
    title: 日志双落点与 logrotate 轮转：防住一天 2GB 悄悄塞爆磁盘
    tldr: 应用标准输出归 journalctl、进出请求归 Nginx 日志；所有日志必须配 logrotate 按天切割清旧，防止慢性爆盘拖垮数据库。
    body: |-
      单机排障看日志只需认准两扇门：订单服务往标准输出打的日志全被 systemd 收进 `journal`，敲 `journalctl -u shop -f` 就能按服务名实时追尾；外部请求进出则记在 Nginx 的 `access.log`（路径、状态码、耗时）与 `error.log` 里。顾客反馈下单失败时，先翻 Nginx 访问日志确认请求到没到门口、回了什么状态码，再去 `journal` 查业务栈报错。

      比找不到日志更要命的是不删旧日志。日活不大的商城，访问日志加业务日志一天写满 2GB 毫不稀奇；放任不管，30 天就是 60GB，而云服务器的系统盘往往一共才 40 到 100GB。等磁盘被塞满那一秒，先炸的往往不是日志本身——数据库写不进新订单、用户头像上传失败、临时文件建不出来，满屏报错看着都跟日志无关，却是单机最经典的慢性死亡。

      Linux 自带的 `logrotate` 专治这病：按天或按文件大小自动切割、把旧文件压缩归档、只保留最近 7 份或 14 份。上线第一天就把日志轮转和进程守护一起配齐，它是保命底线而非事后优化。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: app
          id: j
          label: journal：journalctl 按服务名查应用日志
        - lane: nginx
          id: acc
          label: Nginx 日志：请求到没到、返回了什么
        - lane: systemd
          id: rot
          label: logrotate：按天切割，只留最近几份
          highlight: true
      messages:
        - id: m1
          from: j
          to: rot
          label: 一天 2GB，不轮转一月吃满磁盘
          active: true
      registers:
        - name: 排障顺序
          value: 先 Nginx 访问日志，再 journal 看应用
        - name: 爆盘的伪装
          value: 报错出现在数据库与上传处，根源是日志
    log:
      - at: 日志
        text: 落点要认清，轮转是必做项不是优化项
  - id: release-on-box
    title: 单机平滑发版：新旧目录并存，换软链重启再验活
    tldr: 新[[制品]]传进独立版本目录，切符号链接、systemctl restart、探 /healthz 三步上线；出问题把软链指回旧目录重启即完成[[回滚]]。
    body: |-
      [[流水线]]把新版可执行文件送到服务器后，千万别直接覆盖正在跑的旧文件，而是放进带版本号的新目录（如 `/srv/shop/releases/v1.2/`），与旧版并排躺着。上线动作干脆利落三步走：把 `/srv/shop/current` 符号链接切向新目录，敲 `systemctl restart shop` 重启服务，紧接着探一遍 `/healthz` 和错误日志验活。重启那一两秒有门口的 Nginx 兜着，用户顶多感觉加载顿了一下。

      万一新版上线冒出严重 bug，[[回滚]]就是把同一套动作倒着做一遍：符号链接切回 `v1.1` 目录再重启，几秒钟退回安全区。这要求守住两条纪律：磁盘上至少保留上一个稳定版制品别手快删掉，数据库表结构变更必须兼容新旧两版代码。想在单机上做到零抖动，还能起两个端口各跑新旧一版，改 Nginx 的 `upstream` 权重做简化版[[蓝绿发布]]或[[金丝雀发布]]。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: systemd
          id: swap
          label: 发布三下：换指向、重启、验活
        - lane: app
          id: old
          label: 旧制品：留在磁盘上，随时可回
        - lane: nginx
          id: door
          label: Nginx：重启的几秒里在门口挡着
          highlight: true
      messages:
        - id: m1
          from: swap
          to: old
          label: 回滚就是对旧制品把三下再做一遍
          active: true
      registers:
        - name: 纪律
          value: 旧版至少留一份，数据库变更要兼容两版
        - name: 分工
          value: 流水线管送达，这几步管安顿
    log:
      - at: 发布
        text: 单机发布是换、重启、验活，回滚是对称动作
  - id: single-box-ceiling
    title: 单机的三道硬顶：什么时候才该迈向多机集群
    tldr: 单机便宜省心、一个人就管得过来，但撞上「宿主机挂掉全站停摆、纵向升配见顶、维护重启必有抖动」任一红线，才轮到集群编排出场。
    body: |-
      单机架构什么时候才算不够用？看三条硬顶。第一条是可用性：这台云服务器一旦遇到硬件故障、机房断网或宿主机迁移，全站就是 100% 停摆。要不要为防它多养几台机器，不是技术炫技问题，而是商业算账问题——停机一小时不赔钱的早期项目，单机就是性价比最高的正解；停一分钟都赔钱的交易系统，单机天然不合格。

      第二条是扩容上限：单机扛不住流量时只能纵向升配（2 核 4G 换 8 核 16G），不仅规格有顶，云主机价格涨幅还远快于性能涨幅；逼到必须横向拆成多台机器分摊流量时，会话共享、负载均衡与服务编排才会一并找上门。第三条是维护窗口：重启进程或升级内核总免不了秒级抖动。

      无论单机跑多久，有一条底线绝不能省：进程死了能重拉，数据库丢了就真倾家荡产了。单机数据库必须定时把备份传往异地机器或对象存储，并且亲手在空库上演练过恢复——没演练过恢复的备份，关键时刻多半是一堆坏文件。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: app
          id: box
          label: 单机：便宜简单，一个人管得过来
        - lane: visitor
          id: ceil
          label: 三个硬顶：坏了全完、只能纵向扩、发布有抖动
          highlight: true
      messages:
        - id: m1
          from: box
          to: ceil
          label: 撞上任何一个，才轮到集群出场
          active: true
      registers:
        - name: 判断标准
          value: 不是规模崇拜，是业务为停机出的价
        - name: 数据底线
          value: 异地备份且演练过恢复，才算有备份
    log:
      - at: 天花板
        text: 单机是算过账的选择，离开它也要有账
  - id: closing-deploy
    title: 单机部署收官：四句口诀与上线自查清单
    tldr: 进程有人管、入口有人守、配置不进代码、日志有轮转——拿着这四把尺子去量任何服务器或集群，运维底子一眼见底。
    body: |-
      交付一台生产服务器前，对照这份四问清单逐项打钩：① 杀掉服务进程 1 秒后 `systemd` 会不会拉起，重启整机能不能自启？② 业务端口是不是只绑在 `127.0.0.1`，[[Nginx]] 有没有配好 [[TLS]] 证书与「哈希长缓存 + 入口不缓存」？③ 代码仓库里干不干净，漏传环境变量时程序会不会拒绝启动？④ `logrotate` 轮转配没配，数据库异地备份有没有真恢复过？

      这套单机骨架更是理解一切云原生基础设施的母版：Kubernetes 的存活探针敲的就是第 3 步的 `/healthz`，Deployment 与 Ingress 干的就是集群版的 `systemd` 与 `Nginx`，ConfigMap 与 Secret 对应的就是那份 `.env` 环境文件。把这台 2 核 4G 机器上的来龙去脉摸透，以后再庞大的集群名词也唬不住你。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: systemd
          id: four
          label: 四句口诀：管进程、守入口、配置外置、日志有落点
        - lane: app
          id: proto
          label: 单机骨架：一切集群方案的原型
          highlight: true
      messages:
        - id: m1
          from: four
          to: proto
          label: 审任何部署，逐句对照即可
          active: true
      registers:
        - name: 与集群的关系
          value: 探针、守护、入口都是这四件事的放大版
    log:
      - at: 收束
        text: 单机部署的骨架，就是后端运维的字母表
