overview:
- key: 一句话总结
  value: 一台服务器把服务养活，靠四样东西各就其位：systemd 管进程的生死（崩了拉起、开机自启），Nginx 管入口（接客、发静态文件、转交请求），环境变量管配置（代码一份、配置按环境注入），日志文件管事后追查（服务的归 journal、访问的归 Nginx）。四样各管一段，就是单机部署的全部骨架。
- key: 进程守护
  value: 服务不能靠一个手动开的终端养着：终端一关、进程崩溃、机器重启，都会让它无声消失。交给 systemd 写一个单元文件：启动命令、崩溃后自动重启、工作目录、环境文件，一次写清，之后它替你守着。
- key: 反向代理
  value: 用户不直连应用端口，先过 Nginx：它终结 HTTPS、直接发送静态文件、把接口请求转给应用。应用因此可以只监听本机端口，证书与静态资源也不用应用操心。
- key: 配置分层
  value: 同一份代码跑在开发、测试、生产三个环境，变的只是配置：数据库地址、密钥、域名。配置经环境变量注入，不写进代码——这和安全课「密钥不进代码」是同一条规矩在部署侧的落点。
- key: 日志落点
  value: 单机上看日志就两个地方：服务的输出归 systemd 的 journal（journalctl 按服务名查），请求的进出归 Nginx 的访问与错误日志。日志必须轮转，不然一天几 GB 的日志能在一个月里把磁盘吃满，服务会以一种最难查的方式死掉。
- key: 与流水线的分工
  value: CI/CD 课讲的是制品怎么造、怎么送到机器上；这一课讲制品到了之后怎么活着：被谁拉起、从哪个门接客、配置从哪来、出事看哪。流水线管送达，这一课管安顿。
- key: 谁在用
  value: 绝大多数小团队与个人项目跑在一到几台云服务器上，这套骨架就是它们的全部基础设施；大公司的服务最终也落在某台机器的某个进程上，只是守护与入口换成了 Kubernetes 与云网关——形状没变，规模变了。
summary: 你租了一台云服务器：2 核 4G，装着干净的 Linux。现在要把前面几课写好的订单服务放上去，让全世界能访问，还要它半夜崩了能自己爬起来。这一课就干这一件事：先把进程交给 systemd 守护（崩溃重启、开机自启、日志归集），再让 Nginx 站到门口做反向代理（接 HTTPS、发静态文件、转交接口请求），然后把配置从代码里剥出来用环境变量注入，最后把日志的落点与轮转安排好。发布在这台机器上的具体动作、单机的天花板在哪，也会一并算清。
premise: 这节课要回答的问题是：一个服务在一台裸机上「活着」，具体是什么意思？不是把进程跑起来就算活——它要能在崩溃后复活、在重启后自启、在用户敲门时被找到、在出事时留下线索。这四件事，就是这一课的四根支柱。
position: 本课位于后端工程学科第九段「单机部署：Linux 与 Nginx」。它和发布课的分工是：发布课讲制品怎么从流水线送达机器，这一课讲制品到了之后怎么被安顿；它和编排课的关系是单机版与集群版：Kubernetes 在集群里做的守护与入口，这一课用 systemd 与 Nginx 在一台机器上做一遍。写服务一侧走到这里，服务第一次有了真实的落脚点。
level: 基础
minutes: 26
objectives:
- 能说清一台服务器上服务的四根支柱：守护、入口、配置、日志，各由谁负责
- 能写出 systemd 单元文件的关键字段，并说清崩溃重启与开机自启怎么生效
- 能解释反向代理在门口接管的三件事：TLS、静态文件、请求转交
- 能算清日志爆盘的账，并给出轮转与查看日志的标准动作
aiLink: 记住单机部署的口诀：进程有人管、入口有人守、配置不进代码、日志有地方看。后面的编排与云服务，都是把这四句放大到集群尺度。
bridge:
  prev: 上一课把接口的攻击面堵完了，可服务还悬在空中：代码写在仓库里，用户敲的门在哪、进程半夜死了谁知道。这一课给它落脚：一台真实的云服务器，把服务在上面安顿下来。
  next: 服务在一台机器上安顿好了，可你怎么知道改一版没有把老功能弄坏？下一课讲后端测试：单元、集成、契约三层测试各拦什么，以及为什么后端的测试形状和前端不一样。
design:
- mechanism: 进程生命周期交给 systemd 托管
  problem: 靠终端手动启动的进程有三个死法：终端关了它跟着死、崩溃了没人知道、机器重启后不会自己回来。每一个都足以让服务在深夜无声消失。
  choice: 把服务的启动方式写成 systemd 单元文件：执行命令、工作目录、环境文件、重启策略（崩溃后总是拉起）、开机自启。之后进程的生老病死归 systemd 管。
  tradeoff: 要多学一套单元文件的写法与 journalctl 的查法；且 systemd 只管单机，多机一致性不在它能力内——那是编排课的地界。
  root: 「活着」是一个持续状态，不是一次启动动作：需要有一个常驻的看守者持续比对「应该在跑」与「实际在跑」，这正是守护进程这一角色存在的理由。
- mechanism: 反向代理做统一入口
  problem: 让用户直连应用端口，证书要应用自己管、静态文件要应用自己发、应用重启的那几秒用户直接撞上连接失败，且应用暴露在公网没有任何缓冲。
  choice: 在应用前面放 Nginx：它监听 80 与 443，对外接客；静态文件它直接发，接口请求它转交本机端口上的应用，应用只监听内网回环地址。
  tradeoff: 多一层就多一份配置与排障面：请求慢要先分清卡在 Nginx 还是应用；但入口收成一个，换证书、加限流、切流量都有了落点。
  root: 入口是全站唯一「用户够得着」的地方，把接客的活从业务进程里剥出来交给专用组件，业务进程才能专心办事、自由重启。
- mechanism: 配置与代码分离，环境变量注入
  problem: 数据库地址、密钥、域名若写死在代码里，同一份代码没法跑三个环境，且每次改配置都要重新发版，密钥还会被代码带着到处跑。
  choice: 代码只读环境变量，配置由部署环境在启动时注入：开发机用本地的 .env 文件，服务器由 systemd 的环境文件或部署脚本注入，敏感值走密钥管理（呼应安全课）。
  tradeoff: 配置项多了之后要有一份清单与校验（启动时检查必填项，缺了宁可起不来也不能带病运行）；本地开发要多一步准备环境文件。
  root: 代码是制品，应该一次构建处处运行；环境差异是部署的属性，把它从制品里剥出来，发布与回滚才都只剩「换制品」一个动作。
quiz:
- q: 服务用 nohup 在终端里跑起来了，为什么还说它没有被「养活」？
  options:
  - 因为 nohup 启动的进程性能差
  - 终端关了它可能跟着死、崩溃了没人拉起、机器重启后不会自启、日志也无处归集
  - 因为 systemd 启动的进程有特殊权限
  - 因为 nohup 不支持环境变量
  answer: 1
  explain: 活着是持续状态：要有人持续看守、崩了拉起、重启自启、日志归集。systemd 单元文件一次写清这四件事，nohup 只解决了「关终端不死」这半件。
- q: 用户访问网站时，静态文件（如前端打包的 JS）应该由谁发送？
  options:
  - 应用服务逐个读取发送
  - Nginx 直接发送：它就是为高效发静态文件生的，应用只处理接口请求
  - 数据库里存着发送
  - 浏览器自己生成
  answer: 1
  explain: 反向代理在门口的第二件活就是发静态文件：Nginx 发文件快且不占用应用进程。应用只监听本机端口处理接口，证书、静态、转交都归入口。
- q: 日志一天写 2GB，不做轮转，一个月后会发生什么？
  options:
  - 日志会自动变小
  - 约 60GB 日志吃满磁盘，服务写不下日志与数据，以一种和日志毫无表面关系的报错死掉
  - 操作系统会把旧日志传到云端
  - 没有任何影响
  answer: 1
  explain: 磁盘满是单机最经典的慢性事故：报错往往出现在数据库写盘、上传文件等完全不相干的地方，查半天才发现根源是日志。轮转（按大小或天数切割、删旧）是部署时的必做项，不是优化项。
- q: 同一份代码要跑开发、测试、生产三个环境，正确做法是？
  options:
  - 维护三份代码，各写各的配置
  - 代码只读环境变量，配置由各环境在启动时注入，制品一次构建处处运行
  - 把生产配置写进代码，上线前改回来
  - 用注释切换配置
  answer: 1
  explain: 配置是部署的属性，不是代码的属性。环境变量注入让同一制品跑遍所有环境，也让密钥不进代码（安全课的规矩）与回滚只换制品（发布课的规矩）同时成立。
steps:
- id: four-pillars
  title: 第一步：先给地图——一台机器上活着的四个条件
  tldr: 结论先行：服务在一台服务器上「活着」要满足四个条件——崩了有人拉起（守护）、用户敲门有人应（入口）、换环境不用改代码（配置）、出事有线索可查（日志）。这一课后面就逐根支柱搭。
  body: |-
    先把画面定住。你租的云服务器已经就绪，订单服务的制品（一个可执行文件或一份代码）已经躺在它的磁盘上。现在你敲下命令把它跑起来，浏览器里打开，页面出来了——这一刻它活着吗？只活了一半。半夜它若崩溃，谁把它拉回来？机器若重启，它会不会自己回来？用户敲的是哪个门、证书谁管？它吐的日志堆在哪、磁盘满了怎么办？这四个问题答不上来，服务就只是「暂时在跑」，不是「活着」。

    四根支柱各有主人。守护归 [[systemd]]，Linux 自带的服务总管；入口归 [[Nginx]]，站在最前面的[[反向代理]]；配置归环境变量，由部署环境在启动时注入；日志归文件与 journal，且必须配轮转。这套分工是单机部署的全部骨架，大公司的 Kubernetes 与云服务，本质上是把这四根支柱放大到成百上千台机器——形状在这一课先看清，后面学编排时就只是换规模。

    接下来四步逐根支柱搭，每一步都落到具体的配置文件与命令上；再往后算发布动作与单机的天花板。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: systemd
      id: guard
      label: 守护：崩了拉起、开机自启
    - lane: nginx
      id: door
      label: 入口：接客、发静态、转交
    - lane: app
      id: svc
      label: 服务进程：只管办业务
      highlight: true
    messages:
    - id: m1
      from: guard
      to: svc
      label: 进程的生死归看守者管
    - id: m2
      from: door
      to: svc
      label: 请求从正门进，不直连进程
      active: true
    registers:
    - name: 四根支柱
      value: 守护、入口、配置、日志，各有主人
  log:
  - at: 全景
    text: 活着是持续状态，不是一次启动动作
- id: systemd-unit
  title: 第二步：进程守护——把启动方式写成一份单元文件
  tldr: systemd 的用法是写一份单元文件：启动命令、工作目录、环境文件、崩溃后总是重启、开机自启，一次写清。写完之后，进程的生老病死就归它管，你的终端可以关了。
  body: |-
    先看它接管了什么。单元文件（unit）是放在固定目录下的一份声明，核心就几行：ExecStart 写启动命令，WorkingDirectory 写它该在哪个目录里跑，EnvironmentFile 指向配置所在的环境文件，Restart=always 声明崩溃后总是拉起，WantedBy 声明开机时把它带上。执行一次启用命令，这份声明就生效了：现在拉起它，今后每次开机自动拉起，它崩溃后一秒内被重新拉起。

    把重启的账算具体。没有守护时，服务半夜两点崩溃，发现它的可能是早上九点的第一个用户——故障时长七小时。有了 Restart 策略，崩溃到复活以秒计，故障时长塌缩到用户几乎无感。差别不在技术高深，在于「有没有一个常驻的看守者在比对应该在跑与实际在跑」。

    日常动作就三个：systemctl status 看它活没活、systemctl restart 发新版后重启它、journalctl -u 按服务名看它的输出日志。第三步会展开日志，这里先把动作记下。
  derivation: original
  sources:
  - ref: systemd-docs
    locator: "systemd.service 手册: ExecStart、Restart、WorkingDirectory 等单元配置"
    claim: systemd 服务单元通过 ExecStart 等指令定义启动方式，Restart 策略控制进程退出后是否及如何重启，单元可设置为开机自启。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  code:
    lang: ini
    code: |-
      [Service]
      WorkingDirectory=/srv/shop
      EnvironmentFile=/srv/shop/.env
      ExecStart=/srv/shop/server
      Restart=always
      RestartSec=1
      [Install]
      WantedBy=multi-user.target
    note: 五句声明管住生老病死：怎么起、在哪跑、配置哪来、崩了拉起、开机自启
  canvas:
    kind: swimlane
    actors:
    - lane: systemd
      id: unit
      label: 单元文件：启动方式的一份声明
    - lane: app
      id: svc
      label: 服务进程：崩溃一秒后被重新拉起
      highlight: true
    messages:
    - id: m1
      from: unit
      to: svc
      label: Restart=always：应该在跑，就必须在跑
      active: true
    registers:
    - name: 无守护的故障时长
      value: 半夜崩溃到早晨被发现，可达数小时
    - name: 有守护
      value: 崩溃到复活以秒计，用户几乎无感
  log:
  - at: 守护
    text: 守护的价值不在启动，在持续比对与拉起
- id: health-check
  title: 第三步：怎么确认它真的活着——端口、回环与健康端点
  tldr: 进程在跑不等于服务可用：还要验它在监听对的端口、本机回环能答、健康端点返回正常。这三级确认是排障时的标准顺序，也是后面监控探针的雏形。
  body: |-
    第一级看进程与端口。进程在进程列表里躺着，只能证明它没退出；用 ss 命令看它是不是真的在监听预定的端口（比如 8080），才知道它有没有把耳朵竖起来。进程在、端口不在，通常是启动到一半卡住或配置写错，日志里一般有答案。

    第二级看本机回环。在服务器上直接 curl 本机的 8080 端口：答了，说明应用本身工作正常，此时用户访问不通就该去查 Nginx 与防火墙，而不是应用；不答，问题就在应用这一段。这一级是单机排障的分水岭——先把故障切成「应用段」还是「入口段」，再往下查。

    第三级是健康端点：给应用留一个专门的 /healthz 路径，它检查自己依赖的数据库、缓存还连得上，连不上就返回 503。这个端点现在是给人看的，到了编排课你会见到它就是 Kubernetes 探针要敲的门——单机时代先把它备好，后面所有自动化都指着它判断生死。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: systemd
      id: ps
      label: 第一级：进程在、端口在监听
    - lane: app
      id: curl
      label: 第二级：本机回环能答
    - lane: nginx
      id: hz
      label: 第三级：健康端点查依赖，坏了报 503
      highlight: true
    messages:
    - id: m1
      from: ps
      to: curl
      label: 先把故障切成应用段还是入口段
      active: true
    registers:
    - name: 排障分水岭
      value: 回环通则查入口，不通则查应用
    - name: 健康端点
      value: 编排系统的探针将来敲的就是这扇门
  log:
  - at: 验活
    text: 在跑、能答、依赖通，三级都过才算活着
- id: nginx-proxy
  title: 第四步：Nginx 站门口——接客、发静态、转交，三件事
  tldr: 用户的所有请求先到 Nginx：它终结 HTTPS、把静态文件直接发掉、把接口请求转交给本机端口上的应用。应用只监听回环地址，从公网上根本看不见它。
  body: |-
    跟着一个页面请求走。用户打开书店首页，请求先到 Nginx。它先看路径：是打包好的 JS、CSS、图片这类静态文件，它从磁盘上直接发回——[[Nginx]] 发文件是老本行，快且不惊动应用进程。是接口请求（路径以 /api 开头），它才把请求转交给监听在本机 8080 的应用，应用答完，它再把响应递回用户。这就是[[反向代理]]的日常：用户以为自己在和应用说话，其实一直在和门口的 Nginx 说话。

    加密连接也在这里终结：HTTPS 的证书装在 Nginx 上，它解开加密、把明文请求递给内网的应用。证书的申请与续期（如今多半是 Let's Encrypt 的自动化）就只需在这一处操心，应用完全不必懂 TLS——网络学科里讲的握手，落点就是这里。

    这层缓冲还买来一个自由：应用重启换版的那几秒，Nginx 可以先把请求挡一挡或返回友好的维护提示，而不是让用户直面连接被拒。入口与应用就此解耦：换应用不用动入口，换证书不用动应用。
  derivation: original
  sources:
  - ref: nginx-docs
    locator: "nginx 官方文档: proxy_pass 反向代理与静态文件服务"
    claim: nginx 可作为反向代理将请求转发给后端应用（proxy_pass），并直接提供静态文件服务与 TLS 终止，是单机部署的常见入口形态。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  code:
    lang: nginx
    code: |-
      location / {
          root /srv/shop/web;        # 静态文件：我直接发
      }
      location /api/ {
          proxy_pass http://127.0.0.1:8080;   # 接口请求：转交应用
      }
    note: 两段配置就是门口的分工：静态归 Nginx，接口归应用
