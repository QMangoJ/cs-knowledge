overview:
- key: 一句话总结
  value: 给无记忆的 HTTP 补登录态，靠的是每次请求随身带一张可验证凭证：要么服务器存档案、只给浏览器发一把随机钥匙（Session），要么把身份盖章签进令牌交由客户端自持（JWT）；OAuth/OIDC、密码慢哈希与 RBAC 都是围着这张凭证配套的规矩。
- key: Session 路线
  value: 登录档案留在服务端（内存或 Redis），浏览器只拿 128 位随机编号当钥匙。删掉档案就能当场踢人下线，代价是每次请求多查一次存储，多实例部署必须共享这份档案。
- key: JWT 路线
  value: 令牌自带用户标识与过期时间，靠服务端密钥签名防伪，本地验签即可认人、不用查库。代价是载荷仅编码未加密，且令牌发出去收不回，通常压短有效期并配刷新令牌来补撤销能力。
- key: OAuth 与 OIDC
  value: OAuth 2.0 管有限授权，让网站在你许可下拿到临时令牌、全程不碰你的 Google 密码；OIDC 在其上多签发一枚 id_token（JWT），专门证明「当前登录的人是谁」。
- key: 密码存储
  value: 自建密码库绝不能存明文或 MD5/SHA-256 这类快哈希，必须给每名用户配独立随机盐值，再用 Argon2id 或 bcrypt 故意算慢（单次百毫秒级），把离线爆破成本抬到攻击者算不起。
- key: 权限模型
  value: 认证管「你是谁」，授权管「你能干什么」。RBAC 把权限绑给角色（普通用户、客服、管理员），再把角色发给人；岗位调权只改角色表，不翻代码逐个改人。
- key: 谁在用
  value: 传统单体与服务端渲染框架默认用 Session，前后端分离与微服务架构常用短命 JWT 加刷新令牌；「用 Google/微信/Apple 登录」底层都是 OAuth 2.0 加 OIDC；慢哈希加盐则是 OWASP 明文规定的行业底线。
summary: |-
  HTTP 天生没有记忆，想让网站在翻页、下单、隔天重开时一直认得你，就必须在登录成功时发一张凭证，让后续每个请求都带回来核验。围绕「登录状态存在哪」，工程上分化出两条路线：Session 把档案留在服务器或 Redis 里、只发随机编号当钥匙，随时删档就能踢人下线；JWT 把身份与过期时间签进令牌交给客户端保管，省去查库却无法提前收回，只能靠短有效期配服务端刷新令牌折中。在此之上，第三方登录用 OAuth 2.0 传递有限授权、用 OIDC 的 id_token 核验身份，避免网站触碰用户原密码；自建账号则靠「每人随机盐 + 慢哈希」守住密码库，靠 RBAC 两张表管住操作权限。
premise: 你打开一家电子书网站，点下「使用 Google 账号登录」，挑中两本书下单、改了一次收货地址；中途关掉浏览器去吃顿饭，回来再点开，网站依然认得你。奇怪的是，底层的 HTTP 每答完一次请求就会把刚才见过谁忘得一干二净——网站到底把这份「认得你」的记忆藏在了哪？每次点链接靠什么证明你是同一个人？万一账号被盗或违规封号，服务器又怎么立刻把人请下线？
position: 本课位于后端工程第五板块「身份：认证与会话」，是从运维部署转向「怎么写服务」的第一课。前四课解决了打包、编排、发布与观测，本课守住业务服务的第一道门禁：确认来者身份、管理会话生命周期、划分角色权限。这里立下的凭证传递与 RBAC 模型，会在后续请求链路课的认证中间件和安全课的越权防线里直接复用。
level: 基础
minutes: 26
objectives:
- 说清无状态的 HTTP 如何靠凭证与 Cookie 维持登录态
- 对比 Session 与 JWT 在状态存放、提前踢下线与多服务扩展上的取舍
- 走通 OAuth 2.0 授权码流程，并分清它与 OIDC id_token 的分工
- 算清密码加盐慢哈希防爆破的成本账，并用 RBAC 拆解角色权限表
aiLink: 审查或让 AI 生成登录模块时，拆成三问就不会乱：你是谁（认证与密码/OIDC）、凭证存哪怎么作废（Session vs JWT + 刷新令牌）、进门后能干什么（RBAC 授权）。
bridge:
  prev: 上一课用日志、指标与链路追踪帮线上服务开口说话；从这一课起切回代码内部看服务怎么写，进门第一道关口就是门禁——怎么确认敲门的人是谁，又凭什么放他进来办事。
  next: 认清身份之后，用户在书店里翻看的每个热门详情页都在反复读取同一批几乎不变的数据，最先扛不住的是数据库。下一课引入缓存与 Redis，看怎样用内存拦住绝大多数重复读，又怎样收拾缓存与数据库不一致的烂摊子。
design:
- mechanism: 凭证状态放服务端（Session）还是随身带（JWT）
  problem: HTTP 请求之间不留上下文，服务器每次都得重新认人；但登录状态放服务端还是塞进客户端凭证，两边各有躲不开的代价。
  choice: Session 把档案集中存在服务端（如 Redis），只发一串随机编号当钥匙；JWT 把用户标识和过期时间写进令牌并盖上服务端签名，客户端每次原样带回，服务端只验签不查库。
  tradeoff: Session 删档就能立刻踢人下线，但每请求要查一次存储、多机要共享 Redis；JWT 天然免查库、跨服务扩展省心，但发出去收不回，想提前封号只能压短有效期再配服务端刷新令牌——等于把状态又请回来一半。
  root: 本质是分布式「状态放哪」在登录场景的投影：状态集中则控制力强、横向扩展贵；状态随身则扩展便宜、实时撤回难。
- mechanism: 密码存储用独立随机盐配自适应慢哈希
  problem: 数据库一旦拖库泄露，攻击者会在自家显卡上离线试密码；如果用 MD5 或 SHA-256 这类追求速度的哈希，每秒上百亿次试算会把常见密码在几分钟内撞穿。
  choice: 注册时给每个用户生成独立的随机盐值混入密码，再用 Argon2id 或 bcrypt 这类可调慢的哈希函数计算，把单次耗时卡在百毫秒量级。
  tradeoff: 正常用户登录时也要多等约 250 毫秒，高并发登录高峰会吃掉实打实的服务器 CPU；换来的是离线暴力破解的时间被拉长到百万年量级。
  root: 防守方与攻击方的计算次数极度不对称：正常登录只算一次，暴力破解要试上万亿次——故意抬高单次计算成本，账几乎全算在攻击者头上。
- mechanism: 授权流转（OAuth）、身份断言（OIDC）与站内权限（RBAC）三层拆开
  problem: 「登录」两个字背后混着借用第三方账号、确认登录者是谁、决定他在站内能干什么三件事；混成一团写，就会干出代收用户 Google 密码或把角色判断散落全站代码的蠢事。
  choice: 用 OAuth 2.0 传递有限范围的授权码与令牌，用 OIDC 的签名 id_token 核验登录者身份，再用站内 RBAC 两张表管理角色与权限。
  tradeoff: 初看多了授权码、访问令牌、ID 令牌和角色表几层概念；但拆清边界后，新增微信/Apple 登录或调整客服权限都不用改动业务代码。
  root: 外部登录渠道、身份核验标准与内部业务权限的变化频率完全不同，按职责分层才能让每一层独立替换演进。
quiz:
- q: Session 与 JWT 最根本的区别是什么？
  options:
  - JWT 字符串更长，所以天然比 Session 更安全
  - Session 把登录档案留在服务端、浏览器只拿随机编号；JWT 把身份与过期时间签进令牌本身，服务端不存档案
  - Session 只能用于传统网页，JWT 只能用于手机 App
  - JWT 自带签名，所以不需要设置过期时间
  answer: 1
  explain: 核心分界线就是「状态放哪」：Session 是钥匙归你、档案柜在服务器；JWT 是盖了防伪章的档案复印件随身带。能不能当场撤回、要不要每次查存储，全从这一条推出来。
- q: 用户改密码或账号被封时，为什么纯用 JWT 的系统很难让他「当场下线」？
  options:
  - 因为浏览器会自动备份旧的 JWT
  - 因为服务端验签只认签名真伪与过期时间，只要旧令牌没到期就依然有效，必须靠短有效期配刷新令牌或黑名单来补
  - 因为黑名单能加速签名校验
  - 因为改密码会顺带改掉服务端的签名密钥
  answer: 1
  explain: JWT 自包含且服务端无档案可删：只要签名合法、没过 exp 时间戳，任何拿到它的请求都会通过核验。因此线上通常把访问令牌压到 15 分钟左右，并把长效刷新令牌存在服务端以便随时吊销。
- q: 密码库被拖库后，如果当初只用了快速哈希（如 MD5）存密码，会发生什么？
  options:
  - 毫无风险，因为哈希函数是单向不可逆的
  - 攻击者用显卡按每秒上百亿次的速度离线正向试算，8 位常见密码几分钟就会被撞开
  - 只要密码满 8 位就绝对算不出来
  - 只要加了随机盐值，MD5 就会自动变慢
  answer: 1
  explain: 单向不可逆挡不住正向穷举：攻击者拿候选密码算一遍哈希去比对即可。盐值只能废掉预计算的彩虹表，拖不慢单次计算速度；必须换成 Argon2id 或 bcrypt 这类慢哈希。
- q: 在 OAuth 2.0 授权码流程中，电子书网站是怎么拿到你 Google 身份信息的？
  options:
  - 你在电子书网站的登录框里输入 Google 账号密码，网站代你登录
  - 浏览器跳去 Google 域名完成登录与授权，带回一次性授权码，再由书店后端拿授权码加客户端密钥向 Google 换取令牌
  - Google 把你的密码哈希同步一份给书店数据库
  - 书店前端脚本直接读取浏览器里 Google 域名下的 Cookie
  answer: 1
  explain: 密码全程只输在 Google 自己的页面上，前端地址栏只经手寿命极短的一次性授权码，真正的令牌由书店后端与 Google 服务器背靠背交换拿到。
steps:
- id: http-no-memory
  title: HTTP 天生没记忆，登录态靠随身凭证补齐
  tldr: "[[HTTP]] 每答完一个请求就清空上下文；想让网站一直认得你，只能在登录成功时发一张凭证，往后每次请求都随身带回核验。"
  body: |-
    你在电子书网站填好账号密码点下登录，服务器核对无误，回了一句「登录成功」。一秒钟后你点开某本书的详情页，浏览器发出一条全新的请求——单看这条请求本身，里面没有任何字段能证明「我就是一秒前刚登录的那个人」。因为 [[HTTP]] 天生是一问一答的无状态协议，答完即忘，两次请求之间不留半点上下文。

    无状态并不是设计缺陷，而是刻意换来的扩展能力：服务器不必为几万名在线读者各自留一份内存上下文，来一万次请求就独立答一万次，加机器横向扩容毫无负担。只是凡涉及「记住你是谁」的业务——买书下单、购物车、改收货地址——就得在 HTTP 之上自己补一层记忆。

    补法几十年来没变过：登录成功那一刻，服务器发给客户端一张防伪凭证；此后客户端每次发请求都自动带上它（放进浏览器 Cookie 或请求头 `Authorization`），服务器验过凭证才放行。整套认证体系的分岔，全都围着这张凭证打转：怎么自动带过去、状态存在哪一端、出事时怎么让它当场作废。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: browser
      id: br
      label: 浏览器：刚登录成功，又发出新请求
    - lane: site
      id: sv
      label: 书店服务器：只看得见这一个请求本身
      highlight: true
    messages:
    - id: m1
      from: br
      to: sv
      label: 新请求里没有任何「我登录过」的证据
      active: true
    registers:
    - name: 协议的记忆
      value: 零。上一个请求发生过什么，下一个请求天然不知道
    - name: 要补的东西
      value: 一张能随请求携带、服务器能验证的凭证
  log:
  - at: 本质
    text: 登录态是给无记忆的协议补的记忆，载体是一张凭证
- id: cookie-mechanics
  title: Cookie 充当传递管道：浏览器代存并自动带回
  tldr: 服务器通过 Set-Cookie 响应头把凭证交给浏览器保管，之后每次访问同站点都会自动附上；Expires、HttpOnly、Secure 与 SameSite 四道属性锁死它的寿命与安全边界。
  body: |-
    凭证发下来之后，总不能让用户在每个链接后面手动贴一串字符。浏览器为此内置了 [[Cookie]] 管道：登录成功时，书店服务器在响应头里写一行 `Set-Cookie`，把凭证塞给浏览器存下；从这一刻起，只要你还在访问这家书店，浏览器每次发请求都会自动在 `Cookie` 请求头里把这张纸条捎上，页面业务代码根本不用操心。

    光能自动带还不够，纸条上的四个属性决定了它会不会惹祸。`Expires`（或 `Max-Age`）管寿命：不写就是关掉浏览器即失效，写上 30 天就能实现「吃完饭回来还认得你」；`HttpOnly` 禁止页面里的 JavaScript 读取 `document.cookie`，就算页面不慎混入跨站脚本（XSS），攻击脚本也摸不到登录凭证；`Secure` 强制纸条只走加密连接发送；`SameSite` 则拦住跨站请求自动带票，堵上跨站请求伪造（CSRF）的大门。

    不过 [[Cookie]] 终究只是跑腿的信封，它只管「自动捎过去」，不管信封里装的是什么。信封里到底塞一把随机钥匙编号，还是塞一整份盖了章的身份档案，直接劈出了 Session 与 JWT 两条路线。
  derivation: original
  sources:
  - ref: rfc-6265
    locator: "RFC 6265: Set-Cookie 与 Cookie 头、Expires / HttpOnly / Secure 等属性"
    claim: Cookie 由服务器经 Set-Cookie 响应头下发、浏览器存储并在后续请求中以 Cookie 头自动带回；HttpOnly、Secure、Expires 等属性的语义由该 RFC 定义。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: site
      id: sv
      label: 服务器：登录成功，在响应里塞一张纸条
    - lane: browser
      id: br
      label: 浏览器：存好纸条，之后每次自动带上
      highlight: true
    messages:
    - id: m1
      from: sv
      to: br
      label: Set-Cookie：纸条和它的有效期、可见范围
    - id: m2
      from: br
      to: sv
      label: 后续每个请求：Cookie 头自动附带纸条
      active: true
    registers:
    - name: HttpOnly
      value: 页面脚本读不到纸条，偷凭证的门被关上一半
    - name: Expires
      value: 不写则关浏览器失效，写日期则能「记住我三十天」
  log:
  - at: 管道
    text: Cookie 只负责自动传递，写什么内容是路线的分岔
- id: session-route
  title: Session 路线：浏览器只拿随机钥匙，档案留服务端
  tldr: 服务器在内存或 [[Redis]] 里记下登录档案，只把 128 位随机编号塞进 Cookie；每次请求多查一次存储，换来删档就能当场踢人下线的控制力。
  body: |-
    先看把状态留在书店服务器这边的做法。你登录成功时，服务端生成一串毫无规律的随机字符串作为[[会话]]编号（Session ID），在自己手头的内存或 [[Redis]] 里记一笔「这个编号对应用户 `u_1023`、何时登录、什么角色」，再把编号放进 Cookie 发给浏览器。之后每次翻页下单，服务器拿带回来的编号查一下档案柜，就知道来者是谁。

    既然只凭一串编号认人，别人瞎蒙一个编号岂不是能冒充你？算一笔概率账就放心了：标准会话编号通常取 128 位密码学安全随机数，总共有 2 的 128 次方（约 3.4×10³⁸）种可能。就算攻击者每秒能猜 10 亿次，把整个空间试完也要 10²² 年量级，比宇宙年龄还长得多。只要底层用的是密码学安全随机数生成器（而不是可预测的普通随机函数），光靠空间够大就能防住瞎猜。

    这条路线最大的底气是「随时收权」：一旦你改了密码，或者管理员封禁违规账号，服务端把对应档案一删，浏览器手里的钥匙下一秒就变成废铁。代价则是每次请求都得查一遍档案，而且书店一旦扩成多台应用服务器，档案就不能只放单机内存，必须搬进所有机器都能读写的共享存储——这也是 [[Redis]] 在后端最经典的岗位之一。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: browser
      id: br
      label: 浏览器：只拿着一个随机编号
    - lane: site
      id: sv
      label: 服务器：每个请求先凭编号查档案
    - lane: db
      id: store
