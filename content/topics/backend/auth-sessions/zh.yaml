- id: jwt-route
  title: JWT 路线：把身份档案盖上防伪章，交由客户端自持
  tldr: "[[JWT]] 把用户标识与过期时间直接编码进令牌并附上服务端签名，各服务本地验签即可认人、零次查库；代价是载荷谁都能解码看见，且令牌发出去收不回。"
  body: |-
    如果书店越做越大，拆成了图书、订单、支付、书架好几个独立服务，难道每次请求路过一个服务都要回头查一遍会话库？[[JWT]] 反着解这道题：干脆不在服务端存档案，而是把「你是 `u_1023`、令牌几点几分过期」直接写进凭证本身，盖上防伪章交给客户端保管。

    拆开右边的示例字符串，能看到用点号隔开的三段：第一段头部写明签名算法；第二段载荷是一段 JSON，装着用户编号与过期时间戳——注意它只做了 Base64URL 编码而没有加密，任何人截获都能解码看清原文，所以绝不能往里面塞密码或隐私数据；第三段签名才是防伪核心，由服务端拿自己独有的密钥对前两段算出。

    收到请求时，订单服务或支付服务只需拿密钥对前两段重算一次签名：只要有人偷偷把载荷里的 `u_1023` 改成 `u_1001`，算出来的签名立刻对不上，当场拒之门外。全程零次查库，每个服务靠本地 CPU 验签就能独立认人，这也是前后端分离、移动端 App 与多服务架构偏爱它的原因。
  derivation: original
  sources:
  - ref: rfc-7519
    locator: "RFC 7519: JWT 的三段结构与签名验证"
    claim: JWT 由 JOSE 头部、载荷与签名三段以点分隔组成；验证方通过重算签名确认令牌由持有密钥的一方签发且未被篡改，载荷本身只是编码而非加密。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  code:
    lang: text
    code: |-
      eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1XzEwMjMiLCJleHAiOjE3NjM0ODAwMDB9.SflKxwRJSMeKKF2QT4
      └────── 头部 ──────┘└──────── 载荷：用户 u_1023、何时过期 ────────┘└──── 签名 ────┘
    note: 载荷解开就是明文 JSON，防伪全靠第三段签名，密钥只在服务器手里
  canvas:
    kind: swimlane
    actors:
    - lane: browser
      id: br
      label: 浏览器：保管着整份盖章的档案
    - lane: site
      id: sv
      label: 服务器：只验签名，不查任何库
      highlight: true
    messages:
    - id: m1
      from: br
      to: sv
      label: 请求带回完整令牌：我是谁、何时过期都在里面
      active: true
    registers:
    - name: 载荷
      value: 明文可读，写了谁就认谁，防伪只靠签名
    - name: 查库次数
      value: 零。每个服务本地验签即可认人
  log:
  - at: 路线二
    text: 状态随凭证走：免查库换扩展性，代价是收不回
- id: session-vs-jwt
  title: Session 对账 JWT：分水岭不在性能而在「立刻踢人」
  tldr: 内存查会话和密码学验签都在微秒级，性能并非胜负手；真正的分歧在被动下线——JWT 没档案可删，工程上靠「15 分钟访问令牌 + 30 天服务端刷新令牌」折中。
  body: |-
    看到这里你多半会卡住：既然 [[JWT]] 发出去收不回，那用户点退出、改密码或账号被盗封禁时怎么办？得拆开看。主动退出很好办，客户端删掉本地令牌即可；真正棘手的是被动踢人——小偷已经拷走了令牌，签名合法、又没过期，服务端手里没档案可删，拿什么拦住他？

    业界标配是「长短双令牌」：把随请求携带的访问令牌有效期压到 15 分钟，泄露窗口最多十几分钟；另发一枚 30 天的刷新令牌存进服务端，专供访问令牌到期时换新票。一旦改密或封号，服务端删掉刷新令牌，小偷最多再撑 15 分钟就断粮——你看，为了拿回撤回权，服务端终究把状态请回来了一半。

    至于常被拿来比较的「查库耗时」，其实微不足道：Session 查内存存储与 JWT 跑密码学验签都是微秒级，Session 真正多付的是维护共享 [[Redis]] 的运维账。选型只看一句：单体应用、要求当场踢人，选 Session；多服务协同、跨端调用多，选短命 JWT 配刷新令牌。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: site
      id: need
      label: 需求：改密码或封号，要立刻下线
    - lane: db
      id: sess
      label: Session：删档案，当场生效
    - lane: browser
      id: jwt
      label: JWT：只能等过期，靠短有效期加刷新令牌补
      highlight: true
    messages:
    - id: m1
      from: need
      to: jwt
      label: 访问令牌压到 15 分钟，刷新令牌存服务器可删
      active: true
    registers:
    - name: 风险窗口
      value: JWT 访问令牌的有效期有多长，窗口就有多长
    - name: 性能对比
      value: 查档案与验签都是微秒量级，选型分水岭不在性能
  log:
  - at: 对账
    text: 撤销能力是分水岭：Session 天生有，JWT 靠短过期补
- id: oauth-flow
  title: OAuth 授权码流程：借用 Google 身份却全程不碰密码
  tldr: "[[OAuth]] 让用户只在 Google 域名下输密码并确认范围，前端地址栏只带回一次性临时授权码，真正的令牌由书店后端找 Google 背靠背换取。"
  body: |-
    如果电子书网站弹窗让你填 Google 账号密码来「快捷登录」，等于把万能钥匙交给了卖书商家——它存不存明文、偷不偷看邮件，你完全失控。[[OAuth]] 2.0 授权码模式解决的就是「借身份却不交密码」。

    点下「使用 Google 账号登录」后，浏览器直接跳往 `accounts.google.com`，密码全程只输在 Google 页面上。登录后 Google 询问是否允许书店读取邮箱和昵称；你点同意，浏览器跳回书店，网址后只附一个几分钟就失效的一次性授权码。随后书店后端拿授权码加上自家客户端密钥，走后端请求向 Google 换取正式令牌，再拉取邮箱与昵称建号。

    为什么不在跳回浏览器时直接把令牌挂在网址上？因为浏览器地址栏会留在历史记录、代理日志和插件视野里；前端只传一次性的废纸授权码，把真令牌锁在后端机房之间交接，安全得多。并且令牌只限「读邮箱昵称」且带期限，随时能在 Google 账号后台撤销。
  derivation: original
  sources:
  - ref: rfc-6749
    locator: "RFC 6749 §4.1: Authorization Code Grant 的四步流程"
    claim: 授权码模式中，用户在授权服务器处完成认证与同意，客户端以授权码加自身凭证在令牌端点换取访问令牌，用户的密码不经过客户端。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: browser
      id: br
      label: 浏览器：在网站与 Google 之间跑腿传话
    - lane: google
      id: gg
      label: Google：密码只输在它的页面上
    - lane: site
      id: sv
      label: 书店后端：拿授权码加网站密钥换令牌
      highlight: true
    messages:
    - id: m1
      from: br
      to: gg
      label: 你在 Google 页面登录并点同意
    - id: m2
      from: gg
      to: br
      label: 送回网站，附一个一次性的授权码
    - id: m3
      from: sv
      to: gg
      label: 后端凭码与密钥换令牌，再取邮箱昵称
      active: true
    registers:
    - name: 密码的轨迹
      value: 只出现在 Google 的页面上，网站全程不见
    - name: 令牌的边界
      value: 有范围（只要邮箱昵称）、有期限，授权可撤销
  log:
  - at: 授权
    text: OAuth 让身份可借用，密码不交出
- id: oidc-layer
  title: OIDC 身份层：用签名的 id_token 证明「登录者是谁」
  tldr: "[[OAuth]] 访问令牌只管「允许访问什么资源」，直接当身份证用曾引发跨应用冒充事故；[[OIDC]] 在其上增发 JWT 格式的 id_token，锁死签发方、受众网站与用户标识。"
  body: |-
    光有 OAuth 还差半步：它的访问令牌是一张「取货单」，只管允许应用读什么资源，并不承诺当前登录者是谁。早期不少网站拿访问令牌查通资料就算登录成功，结果闹出过跨应用冒充事故——恶意应用 A 骗用户授权拿到合法令牌，转手塞给书店网站 B 冒充号主登录。

    [[OIDC]]（OpenID Connect）在 OAuth 2.0 之上补齐了这层身份协议：换令牌时额外签发一枚 `id_token`。它本身就是标准的 [[JWT]]，写明签发方是 Google、受众（`aud`）特指这家书店、用户编号是多少、何时完成登录，末尾附上 Google 签名。

    书店后端验过签名、再核对受众确实是自己，才认这次登录，跨应用冒充的路就此堵死。今天所有的「用 Google / 微信 / Apple 登录」，底下都是「OAuth 传授权 + OIDC 认身份」两层叠在一起。
  derivation: original
  sources:
  - ref: openid-connect-core
    locator: "OpenID Connect Core 1.0: ID Token 的声明与验证规则"
    claim: OIDC 在 OAuth 2.0 流程中增加 ID Token（JWT），载明签发方、受众（客户端）、用户标识与认证时间，客户端须验签并核对受众后才可采信登录身份。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: google
      id: gg
      label: Google：多签发一个 id_token
    - lane: site
      id: sv
      label: 书店网站：验签并核对「是发给我的」
      highlight: true
    messages:
    - id: m1
      from: gg
      to: sv
      label: id_token：我是谁、何时登录、发给哪个网站
      active: true
    registers:
    - name: 分工
      value: OAuth 管授权流转，OIDC 管身份断言
  log:
  - at: 身份层
    text: 访问令牌不是身份证，id_token 才是
- id: password-storage
  title: 密码存储底线：每人一撮随机盐，再用慢哈希拖垮爆破
  tldr: 密码库一旦泄露，MD5 这类快哈希在显卡每秒百亿次穷举下几分钟就会失守；必须为每名用户配独立随机[[盐值]]，并用 Argon2id 或 bcrypt 把单次计算调到约 250 毫秒。
  body: |-
    假如用户在书店直接注册设密码，数据库里该怎么存？存明文是裸奔，只算一遍 MD5 或 SHA-256 [[哈希]]则是半裸奔：一旦被拖库，攻击者在自家显卡上离线试密码，每秒能跑上百亿次 MD5。8 位小写字母加数字一共约 2.8×10¹² 种组合，按每秒百亿次犁过去，几分钟就能撞穿整张表。

    合格做法必须下两味药。第一味是每人独立的随机[[盐值]]：注册时生成一串随机字节混进密码一起算哈希，哪怕两人密码相同，落库结果也完全两样，攻击者预计算的彩虹表整张作废，只能按人头重算。

    第二味是故意「算得慢」的算法（OWASP 首推 Argon2id，次选 bcrypt），把单次耗时调到约 250 毫秒：正常用户登录多等四分之一秒毫无感觉，攻击者穷举 2.8×10¹² 种组合却要算上百万年。审查密码表只盯三条：是不是专用慢哈希、盐值是否每人随机、参数近年有没有随硬件升级调高。
  derivation: original
  sources:
  - ref: owasp-password-storage
    locator: "OWASP Password Storage Cheat Sheet: Argon2id / bcrypt 参数与盐值要求"
    claim: 密码应使用加盐的自适应慢哈希（首选 Argon2id，次选 bcrypt）存储，盐值须随机且每用户唯一；快速哈希（如 MD5、SHA-256）不适合存密码。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: db
      id: fast
      label: 快速哈希存的库：每秒上百亿次可试
    - lane: db
      id: slow
      label: 盐加慢哈希存的库：单次约 250 毫秒
      highlight: true
    messages:
    - id: m1
      from: fast
      to: slow
      label: 同一个密码空间：几分钟试完 vs 上百万年
      active: true
    registers:
    - name: 8 位密码空间
      value: 约 2.8×10¹² 种组合，快哈希几分钟犁完
    - name: 慢的尺度
      value: 单次约 250 毫秒：用户无感，爆破无望
  log:
  - at: 存储
    text: 慢哈希加盐：把爆破的账记在攻击者头上
- id: rbac-roles
  title: RBAC 权限模型：权限绑给角色，人只领角色
  tldr: "把角色判断散落在几十个接口里迟早漏出[[越权]]漏洞；[[RBAC]] 用「角色—权限」和「用户—角色」两张表集中收口，岗位调权只改一行配置。"
  body: |-
    认出登录者是张三只算完成认证，张三在书店能不能点退款则归授权管。如果在每个接口里散写 `if (user.type === 'admin')`，等业务长出客服、编辑、仓库管理员七八个岗位，改一条规则就得翻遍全站代码，漏改一处就是安全课要讲的[[越权]]漏洞。

    [[RBAC]] 用两张表把人与权限解耦：表一定「角色能干什么」（读者买书查自己订单；客服查全站订单、改地址，无退款权；管理员能退款封号），表二定「谁是什么角色」（张三是客服，李四是管理员）。请求进来只查当前角色有没有这项权限，绝不按人头写特例。

    大促期间临时给客服开放「发补偿券」，只需在表一加一行，全体客服即刻生效；员工转岗离职，在表二删掉角色绑定就干净收场。
  derivation: original
  sources:
  - ref: owasp-authorization
    locator: "OWASP Authorization Cheat Sheet: 最小权限与集中式授权校验"
    claim: 授权应遵循最小权限原则并集中实施，避免把权限判断散落在各处代码中；基于角色的授权是业务系统的主流做法。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: site
      id: req
      label: 请求进来：这个人想退款
    - lane: db
      id: table
      label: 角色权限表：客服不能退款，管理员能
      highlight: true
    messages:
    - id: m1
      from: req
      to: table
      label: 不查「你是谁」，查「你的角色能不能」
      active: true
    registers:
    - name: 表一
      value: 角色 → 能做的事（客服：查订单、改地址；无退款）
    - name: 表二
      value: 人 → 角色（张三：客服；李四：管理员）
  log:
  - at: 授权
    text: 权限发给角色，人领角色：改规则只动一张表
- id: closing-questions
  title: 登录系统验收三问：靠什么防伪、状态存哪、怎样当场作废
  tldr: 评审任何一套登录方案，顺着「谁签发防伪、状态存在哪一端、出事怎样立刻作废」连问三句，答不上来的那一环就是线上隐患。
  body: |-
    从点下 Google 登录、带着 Cookie 翻页买书，到后台客服改地址、管理员退款，书店门禁的每一环都落回三个验收问题——面试设计与代码评审照单过筛即可：

    - **凭证靠什么防伪？** Session 编号靠 128 位随机空间防瞎猜；JWT 与 OIDC 的 `id_token` 靠密码学签名加受众（`aud`）校验防篡改冒用；自存密码靠每人随机盐加约 250 毫秒的 Argon2id / bcrypt 慢哈希防爆破。
    - **状态到底存在哪？** 全放服务端共享存储（Session + Redis），全放客户端令牌（纯 JWT），还是两边分担（15 分钟访问令牌在客户端 + 30 天刷新令牌在服务端）。
    - **出事怎么当场作废？** Session 删档案即刻下线；双令牌删刷新令牌把窗口锁在 15 分钟内；纯长效 JWT 则答不上这一问，除非再把黑名单请回服务端。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: site
      id: any
      label: 任何一套登录系统
    - lane: db
      id: three
      label: 三问：谁签发、存哪、怎么失效
      highlight: true
    messages:
    - id: m1
      from: any
      to: three
      label: 答不清的那一问，就是它的事故现场
      active: true
    registers:
    - name: 三问
      value: 谁签发防伪、状态存哪、如何立刻失效
  log:
  - at: 收束
    text: 认证、会话、授权三件事，各有各的答案
