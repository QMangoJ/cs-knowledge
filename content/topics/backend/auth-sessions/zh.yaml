id: backend/auth-sessions
subject: backend
slug: auth-sessions
title: 认证与会话：登录态到底存在哪
order: 5
visual: swimlane
lanes:
- id: browser
  label: 浏览器
- id: site
  label: 书店网站
- id: google
  label: Google 账号系统
- id: db
  label: 网站数据库
logColumns:
- key: at
  label: 阶段
- key: text
  label: 发生了什么
status: published
license: CC-BY-4.0
overview:
- key: 一句话总结
  value: 登录态的本质，是给没有记忆的 HTTP 补一份记忆：服务器发给你一张凭证，之后每个请求都带上它，服务器凭它认人。凭证有两种做法——服务器自己记档案、只给你一把钥匙（Session），或者把档案盖个章直接交给你保管（JWT）；其余的 OAuth、密码存储、权限模型，都是围着这张凭证转的规矩。
- key: Session 路线
  value: 登录数据存在服务器这边（内存或 Redis），浏览器只拿一个随机编号当钥匙。好处是作废一把钥匙就能把人踢下线；代价是每个请求都要凭编号查一次，且多台服务器要共享这份档案。
- key: JWT 路线
  value: 凭证本身就是一份签过名的声明：用户是谁、何时过期都写在里面，服务器验签即可、不查库。代价是它发出去就收不回——想提前作废只能另设黑名单，或者把有效期压短再配刷新令牌。
- key: OAuth 与 OIDC
  value: OAuth 解决的是授权：让网站在你许可下使用你的 Google 身份，全程不碰你的 Google 密码。OIDC 在它上面补了一层身份：通过签过名的 id_token 回答「登录的人是谁」。今天的第三方登录，基本都是这两层叠起来的。
- key: 密码存储
  value: 网站自己存密码时，存的不能是明文，也不能是快速哈希的结果：要给每个用户加随机盐值，再用故意很慢的哈希算法（bcrypt、Argon2）。慢，是为了让偷走密码库的人也算不起账。
- key: 权限模型
  value: 登录只回答「你是谁」，权限回答「你能干什么」。RBAC 把权限先发给角色、再把角色发给人：普通用户、客服、管理员各有一张权限表，改权限只动表，不逐个改人。
- key: 谁在用
  value: 传统网站多用 Session（服务端框架的默认），前后端分离与多服务系统多用 JWT；「用 Google/微信/Apple 账号登录」背后是 OAuth 加 OIDC；凡是自己存密码的系统，慢哈希加盐是行业底线，OWASP 有专门的速查表盯着这件事。
summary: 你点下「使用 Google 账号登录」，几秒钟后网站就认识你了，之后你翻页、下单、改地址，它都记得你是谁。这份记忆不是理所当然的：HTTP 本身没有记忆，每个请求到了服务器都是一张新面孔。本课就追这一件事——登录态到底存在哪、靠什么在每个请求里被认出来。先看凭证的两种做法（Session 与 JWT）各自把状态放在哪、又各自付出什么，再看 OAuth 怎样让网站借用你的 Google 身份却不碰你的密码，最后落到两件常被做错的事：密码该怎么存，权限该怎么分。
premise: 这节课的场景很具体：你打开一个卖电子书的网站，点「使用 Google 账号登录」，登录成功之后连着下了两单、改了一次收货地址，中途还关掉页面去吃了顿饭，回来它还认得你。这一课要回答的就是：它凭什么认得你？这份「认得」存在哪里、每次请求怎么证明、想让你下线时又怎么收回？
position: 本课位于后端工程学科的第五段「身份：认证与会话」，是写服务这一侧的第一课。前面四课讲的是服务上线之后的事——打包、编排、发布、观测；从这一课起换到上线之前，先讲每个服务都躲不开的第一道门：谁在敲门、怎么证明、能放他做哪些事。它立下的凭证与权限概念，后面的请求链路课与安全课都会接着用。
level: 基础
minutes: 26
objectives:
- 能说清登录态的本质：给无状态的 HTTP 补一份可验证的记忆
- 能对比 Session 与 JWT：状态存哪、怎么撤销、扩展时贵在哪
- 能完整走一遍 OAuth 授权码流程，并说清 OIDC 在它上面补了什么
- 能解释密码为什么要加盐慢哈希，并能用 RBAC 给一个场景配出角色权限表
aiLink: 把登录拆成三个问题就不会乱：你是谁（认证）、凭证怎么在请求间传递与撤销（会话）、你能干什么（授权）。本课所有机制都是在回答这三问中的一问。
bridge:
  prev: 上一课讲的是服务上线之后怎么被看见：日志、指标、链路追踪把内部状态说出来。可一个服务在上线之前还有半条命：它本身怎么写。从这一课起换到写服务这一侧，第一道关口就是门禁——谁在敲门，凭什么放他进来。
  next: 登录解决的是「你是谁」，可你登录之后翻的每个商品页，背后都在反复读同一批几乎不变的数据，数据库先被读趴下。下一课讲缓存与 Redis：把慢的读变成快的读，以及缓存与数据库不一致时该怎么收场。
design:
- mechanism: 凭证与状态的存放位置二选一
  problem: HTTP 没有记忆，服务器必须在每个请求里重新确认「你是谁」，可把登录状态放哪，是个绕不开的分岔：放服务器、放客户端，各有各的账。
  choice: Session 把状态留在服务器、只给浏览器一把随机钥匙；JWT 把状态写进凭证本身、签名防伪，服务器不存。两条路线选一条做主线，其余组件围着它补短板（短过期加刷新、共享存储等）。
  tradeoff: Session 撤销容易、每请求要查一次且要共享存储；JWT 免查库、易扩展，但发出去收不回，撤销要额外引入黑名单，等于把状态又请回来一半。
  root: 这不是哪个更先进的问题，而是「状态放哪」这个分布式老问题在登录场景里的投影：状态集中则控制力强、扩展贵，状态随身则扩展便宜、控制力弱。
- mechanism: 密码存储用慢哈希加盐
  problem: 密码库一旦泄露，攻击者离线爆破的速度取决于哈希的快慢：用 MD5 这类为速度而生的算法，等于把用户的密码明文摆在货架上。
  choice: 每个用户配一段随机盐值，再用 bcrypt、Argon2 这类故意可调慢的哈希函数存储，让单次校验约在几百毫秒量级。
  tradeoff: 合法用户登录时也要多等这几百毫秒，且登录高峰时这笔 CPU 开销真实存在；换来的是爆破成本被放大到不可承受。
  root: 防守方和攻击方的成本结构不对称：防守方每个用户只算一次，攻击方要对每个密码算上亿次——把单次成本抬高，受益的全是防守方。
- mechanism: 认证与授权分层，各管一段
  problem: 「登录」一个词里其实混着三件事：证明你是谁、让第三方代为证明、决定你能干什么。混在一起做，网站就会去收用户的 Google 密码、权限就会散落在每个页面的判断里。
  choice: OAuth 管授权的传递（网站不碰密码），OIDC 在它上面管身份的断言，本站的 RBAC 管本站内的权限分配，三层各回答一个问题。
  tradeoff: 概念与组件变多，小站全套上齐有过度设计之嫌；但边界清楚之后，换登录方式、加角色都不用动业务代码。
  root: 三件事的变化速度完全不同：身份提供方可以替换，权限规则天天在变，业务代码不该被任何一边绑住——分层就是让它们能各自变化。
quiz:
- q: Session 与 JWT 最根本的区别是？
  options:
  - JWT 更安全，因为它更长
  - Session 把登录状态存在服务器、浏览器只拿随机编号；JWT 把状态写进签过名的凭证本身，服务器不存
  - Session 只能用在传统网站，JWT 只能用在手机应用
  - JWT 不需要过期时间
  answer: 1
  explain: 分界线在状态放哪：Session 是「钥匙加档案柜」，档案在服务器；JWT 是「盖章的档案复印件」，档案随身带。撤销难易、查不查库，全从这一条推出来。
- q: 用户改了密码，为什么用 JWT 的网站通常还要把旧令牌拉黑名单？
  options:
  - 因为 JWT 会自己复制
  - 因为验签只看签名与有效期，令牌没过期就一直有效，服务器没有别的办法让它提前失效
  - 因为黑名单能让验签更快
  - 因为改密码会改掉签名密钥
  answer: 1
  explain: JWT 是自包含凭证：签名对、没过期，服务器就认。改密码、封号这类「立刻下线」的需求，只能靠黑名单或短有效期加刷新令牌来补——这正是它与 Session 的核心取舍。
- q: 密码库泄露后，用快速哈希（如 MD5）存密码的下场是？
  options:
  - 没什么下场，哈希是单向的，算不回来
  - 攻击者按每秒上百亿次的量级离线试密码，常见密码几分钟到几小时就被撞开
  - 只要密码够长就绝对安全
  - 盐值会让 MD5 变得足够慢
  answer: 1
  explain: 哈希单向不等于爆破不了：攻击者是拿候选密码正着算一遍去比对。快速哈希算得太快，8 位常见组合的空间很快试完；盐值只能防预计算的彩虹表，挡不住速度，必须换慢哈希。
- q: 在 OAuth 授权码流程里，书店网站什么时候能拿到你的身份信息？
  options:
  - 你在网站上输入 Google 密码之后
  - 网站把你送到 Google 登录，你同意后 Google 发一个临时授权码，网站后端拿码去换令牌，再用令牌取身份信息
  - Google 会把你的密码哈希发给网站存档
  - 网站直接读你浏览器里 Google 的 Cookie
  answer: 1
  explain: 你的密码只输在 Google 的页面上，网站全程不接触。授权码是一次性的临时凭证，换令牌这一步发生在网站后端与 Google 之间，浏览器只负责跑腿传话。
steps:
- id: http-no-memory
  title: 第一步：本质——HTTP 没有记忆，每个请求都是新面孔
  tldr: 先把问题摆正：HTTP 协议本身不记任何事，你登录成功后的下一个请求，在服务器眼里和陌生人的请求长得一模一样。登录态，就是人为给这条没记忆的协议补上的一份记忆。
  body: |-
    先做个思想实验。你在书店网站上输入账号密码点了登录，服务器核对无误，回了一句「登录成功」。紧接着你点开一本书的详情页，浏览器发出一个全新的请求——这个请求里有什么能证明「我就是刚才登录成功的那个人」？答案是：什么都没有。[[HTTP]] 是一问一答的协议，答完就忘，上一个请求里发生过什么，下一个请求天然不知道。

    这不是设计失误，是刻意为之：无状态让服务器不用为每个用户留着一份上下文，来一万个请求就答一万次，简单且易扩展。代价是，所有需要「记住你」的业务——登录、购物车、个性化推荐——都得自己在协议之上补一层记忆机制。

    这层机制的形状几十年没变过：登录成功时，服务器发给你一张凭证；之后你的每个请求都自动带上这张凭证；服务器验一下凭证，就知道你是谁。本课后面讲的全部内容，都是在回答这张凭证的三个问题：它长什么样、状态存在哪、怎么让它失效。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: browser
      id: br
      label: 浏览器：刚登录成功，又发出新请求
    - lane: site
      id: sv
      label: 书店服务器：只看得见这一个请求本身
      highlight: true
    messages:
    - id: m1
      from: br
      to: sv
      label: 新请求里没有任何「我登录过」的证据
      active: true
    registers:
    - name: 协议的记忆
      value: 零。上一个请求发生过什么，下一个请求天然不知道
    - name: 要补的东西
      value: 一张能随请求携带、服务器能验证的凭证
  log:
  - at: 本质
    text: 登录态是给无记忆的协议补的记忆，载体是一张凭证
- id: cookie-mechanics
  title: 第二步：Cookie——凭证怎么在每个请求里自动传递
  tldr: 凭证的传递管道是 Cookie：服务器在响应里塞一张小纸条让浏览器存好，之后浏览器每次访问这个站点都会自动把纸条带上。管道解决了「怎么带」，纸条上写什么才是下一步的分岔。
  body: |-
    机制只有两步。第一步，登录成功时，服务器在响应头里加一行 Set-[[Cookie]]，等于跟浏览器说：这张纸条你替我收着。第二步，从此浏览器每次向这个站点发请求，都会自动在请求头里把这张纸条附上，不用页面代码操心，也不用用户配合。它就是[[Cookie]]：浏览器代存、自动携带的一小段数据。

    纸条上有几个属性决定了它的行为边界。Expires 决定它活多久：不写就是关掉浏览器即失效，写了日期就能「记住我三十天」。HttpOnly 决定页面里的脚本能不能读它：设上之后脚本读不到，跨站脚本攻击偷走凭证的难度大增，登录凭证几乎都应该设。Secure 决定它只走加密连接发送。SameSite 则限制它在跨站请求时带不带，是防跨站请求伪造的一道闸。

    注意 Cookie 本身只是管道：它只负责「自动带过去」，不负责防伪也不负责内容。纸条上到底写一把钥匙的编号，还是一整份盖章的档案，就是接下来 Session 与 JWT 两条路线的分工。
  derivation: original
  sources:
  - ref: rfc-6265
    locator: "RFC 6265: Set-Cookie 与 Cookie 头、Expires / HttpOnly / Secure 等属性"
    claim: Cookie 由服务器经 Set-Cookie 响应头下发、浏览器存储并在后续请求中以 Cookie 头自动带回；HttpOnly、Secure、Expires 等属性的语义由该 RFC 定义。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: site
      id: sv
      label: 服务器：登录成功，在响应里塞一张纸条
    - lane: browser
      id: br
      label: 浏览器：存好纸条，之后每次自动带上
      highlight: true
    messages:
    - id: m1
      from: sv
      to: br
      label: Set-Cookie：纸条和它的有效期、可见范围
    - id: m2
      from: br
      to: sv
      label: 后续每个请求：Cookie 头自动附带纸条
      active: true
    registers:
    - name: HttpOnly
      value: 页面脚本读不到纸条，偷凭证的门被关上一半
    - name: Expires
      value: 不写则关浏览器失效，写日期则能「记住我三十天」
  log:
  - at: 管道
    text: Cookie 只负责自动传递，写什么内容是路线的分岔
- id: session-route
  title: 第三步：Session 路线——钥匙在你手里，档案在服务器
  tldr: 第一条路线把状态留在服务器：登录成功后，服务器建一份你的档案，只发给你一个随机编号当钥匙。每个请求凭编号查档案——多一次查询，换来随时作废任何一把钥匙的权力。
  body: |-
    做法很朴素。登录成功时，服务器生成一个足够长的随机字符串当[[会话]]编号，把「这个编号对应哪个用户、何时登录、有什么权限」记在自己这边（内存，或者专门的存储如 [[Redis]])，再把编号写进 Cookie 发给浏览器。之后每个请求带回编号，服务器拿它查到档案，就知道你是谁。

    编号必须长到猜不出来，这笔账可以算：用 128 位随机数，可能性是 2 的 128 次方，约 3.4×10³⁸ 种。攻击者就算每秒能试 10 亿次，试完整个空间也要 10²² 年量级——比宇宙的年龄还长得多。所以会话编号的安全性不靠保密算法，靠的是空间大到试不完，前提是随机数生成器本身可靠。

    这条路线的账很清楚。好处全在控制力：你改了密码、管理员要封你的号，服务器把档案一删，你手里的钥匙立刻作废，下一个请求就被请出去。代价是每个请求多一次查档案的操作，且网站扩到多台服务器时，这份档案必须放在所有机器都够得着的地方——这正是 [[Redis]] 在后端里最经典的一个岗位。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: browser
      id: br
      label: 浏览器：只拿着一个随机编号
    - lane: site
      id: sv
      label: 服务器：每个请求先凭编号查档案
    - lane: db
      id: store
      label: 会话档案：编号对应哪个用户，存在这里
      highlight: true
    messages:
    - id: m1
      from: br
      to: sv
      label: 请求带回编号，本身不含任何用户信息
    - id: m2
      from: sv
      to: store
      label: 查档案：这个编号是谁、何时登录
      active: true
    registers:
    - name: 编号的空间
      value: 128 位随机数约 3.4×10³⁸ 种，每秒试 10 亿次也要 10²² 年
    - name: 撤销方式
      value: 删掉档案即可，钥匙当场作废
  log:
  - at: 路线一
    text: 状态在服务器，浏览器只有钥匙：控制力换查询成本
- id: jwt-route
  title: 第四步：JWT 路线——把档案盖个章，直接交给你保管
  tldr: 第二条路线反过来：把「你是谁、何时过期」直接写进凭证，用服务器的密钥签名防伪，凭证本身随请求带回，服务器验签就行、不查库。省掉查询的代价，是这张凭证发出去就收不回。
  body: |-
    [[JWT]] 是一个长字符串，由三段拼成，段与段之间用点隔开。第一段是头部，写明签名用的算法；第二段是载荷，是几行 JSON：用户编号、签发时间、过期时间都明文写在里面（只是做了编码，不是加密，谁都能解开看）；第三段是签名——服务器用只有自己知道的密钥，对前两段算出的一个防伪章。

    验证时服务器做的事只有一件：拿密钥对前两段重算一遍签名，和第三段比对得上，就说明这份档案确实是自己签发的、且没被人改过一个字。整个过程不查任何数据库——凭证自带全部信息，这叫自包含。

    它最适合的画面是多服务系统：订单服务、支付服务、物流服务都要验登录，难道每个服务都去查一遍会话档案？有了 JWT，每个服务本地验签即可，谁也不用求谁。移动应用与前后端分离的架构偏爱它，也是同一个理由：状态不再是扩展时要小心伺候的那份共享数据。
  derivation: original
  sources:
  - ref: rfc-7519
    locator: "RFC 7519: JWT 的三段结构与签名验证"
    claim: JWT 由 JOSE 头部、载荷与签名三段以点分隔组成；验证方通过重算签名确认令牌由持有密钥的一方签发且未被篡改，载荷本身只是编码而非加密。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  code:
    lang: text
    code: |-
      eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1XzEwMjMiLCJleHAiOjE3NjM0ODAwMDB9.SflKxwRJSMeKKF2QT4
      └────── 头部 ──────┘└──────── 载荷：用户 u_1023、何时过期 ────────┘└──── 签名 ────┘
    note: 载荷解开就是明文 JSON，防伪全靠第三段签名，密钥只在服务器手里
  canvas:
    kind: swimlane
    actors:
    - lane: browser
      id: br
      label: 浏览器：保管着整份盖章的档案
    - lane: site
      id: sv
      label: 服务器：只验签名，不查任何库
      highlight: true
    messages:
    - id: m1
      from: br
      to: sv
      label: 请求带回完整令牌：我是谁、何时过期都在里面
      active: true
    registers:
    - name: 载荷
      value: 明文可读，写了谁就认谁，防伪只靠签名
    - name: 查库次数
      value: 零。每个服务本地验签即可认人
  log:
  - at: 路线二
    text: 状态随凭证走：免查库换扩展性，代价是收不回
- id: session-vs-jwt
  title: 第五步：两条路线对账——撤销、过期与那笔查询账
  tldr: 两条路线的分歧收敛到一个问题上：你要多强的「立刻下线」能力。Session 删档案就行；JWT 只能等它过期，所以现实里 JWT 都把有效期压到十几分钟，再配一支活得久的刷新令牌打配合。
  body: |-
    先看读者最容易卡住的地方：JWT 既然收不回，那用户点了退出登录、或者账号被盗了怎么办？答案是分层的。退出登录这种自愿动作，客户端把令牌删掉就行，眼不见为净。真正的麻烦是被动下线：改密码、管理员封号——这时服务器必须让还没过期的令牌立刻失效，可它手里没有档案可删。业界的标准补丁是两条：一是把访问令牌的有效期压短，比如 15 分钟，风险窗口就只剩这十几分钟；二是另发一支有效期长（比如 30 天）的刷新令牌，专门用来换新的访问令牌，刷新令牌存在服务器这边——封号时删掉它，这条线就断了。你看，为了拿回撤销能力，状态又被请回来了一半，这是 JWT 方案绕不开的账。

    再算查询那笔账，别被夸大。Session 每请求查一次档案，查的是内存型存储，一次在微秒量级，网站规模没到很大之前根本不是瓶颈；它真正的成本在运维：多一个要伺候的共享存储、多一条故障路径。反过来 JWT 验签也要算一次密码学运算，量级相近。所以选型别盯着性能，多半是平局——真正的分水岭是撤销要求与团队习惯。

    一句可带走的判断：要强撤销、架构传统，选 Session；服务多、要免状态扩展，选 JWT 并配短过期加刷新令牌。两者都有大厂在用，不存在谁淘汰谁。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: site
      id: need
      label: 需求：改密码或封号，要立刻下线
    - lane: db
      id: sess
      label: Session：删档案，当场生效
    - lane: browser
      id: jwt
      label: JWT：只能等过期，靠短有效期加刷新令牌补
      highlight: true
    messages:
    - id: m1
      from: need
      to: jwt
      label: 访问令牌压到 15 分钟，刷新令牌存服务器可删
      active: true
    registers:
    - name: 风险窗口
      value: JWT 访问令牌的有效期有多长，窗口就有多长
    - name: 性能对比
      value: 查档案与验签都是微秒量级，选型分水岭不在性能
  log:
  - at: 对账
    text: 撤销能力是分水岭：Session 天生有，JWT 靠短过期补
- id: oauth-flow
  title: 第六步：OAuth——网站借用你的 Google 身份，全程不碰密码
  tldr: 回到开场场景：书店网站想认识你，最笨的办法是让你把 Google 密码填在它的页面上——绝不可行。OAuth 的解法是让你只在 Google 的页面上登录，网站全程只经手一串临时的、有限的令牌。
  body: |-
    先把危险说清楚。如果书店网站弹个框让你输入 Google 账号密码来「快捷登录」，那等于把你 Google 账号的命根子交给一个卖书的网站：它存得住存不住、会不会拿去干别的，你完全没数。任何正经的第三方登录都不会这么做。

    [[OAuth]] 的授权码流程这样走一遍。你点「使用 Google 账号登录」，浏览器被送到 Google 的登录页——注意地址栏，是 Google 的域名，你的密码只输在这里。登录后 Google 问你：这个书店网站想知道你的邮箱和昵称，同意吗？你点同意，Google 把浏览器送回书店网站，并附上一个一次性的授权码。这个码本身没用、寿命只有几分钟，书店网站的后端拿它去敲 Google 的后门：出示码、再出示只有网站和 Google 知道的网站密钥，换回正式的令牌。最后网站用令牌去取你的邮箱与昵称，在自己这边给你建一个账号。

    整个过程里，网站没见过你的密码，Google 也没把你的全部数据交出去——令牌有范围（只要邮箱和昵称）、有期限。这就是 OAuth 的核心：授权是有限的、可撤销的传递，而不是密码的交出。
  derivation: original
  sources:
  - ref: rfc-6749
    locator: "RFC 6749 §4.1: Authorization Code Grant 的四步流程"
    claim: 授权码模式中，用户在授权服务器处完成认证与同意，客户端以授权码加自身凭证在令牌端点换取访问令牌，用户的密码不经过客户端。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: browser
      id: br
      label: 浏览器：在网站与 Google 之间跑腿传话
    - lane: google
      id: gg
      label: Google：密码只输在它的页面上
    - lane: site
      id: sv
      label: 书店后端：拿授权码加网站密钥换令牌
      highlight: true
    messages:
    - id: m1
      from: br
      to: gg
      label: 你在 Google 页面登录并点同意
    - id: m2
      from: gg
      to: br
      label: 送回网站，附一个一次性的授权码
    - id: m3
      from: sv
      to: gg
      label: 后端凭码与密钥换令牌，再取邮箱昵称
      active: true
    registers:
    - name: 密码的轨迹
      value: 只出现在 Google 的页面上，网站全程不见
    - name: 令牌的边界
      value: 有范围（只要邮箱昵称）、有期限，授权可撤销
  log:
  - at: 授权
    text: OAuth 让身份可借用，密码不交出
- id: oidc-layer
  title: 第七步：OIDC——OAuth 只管授权，它在上面补了「你是谁」
  tldr: 有个容易混的点：OAuth 设计出来是管「授权」的，它并没规定怎么证明「登录的人是谁」。OIDC 在它上面加了一层：多发一个签过名的 id_token，专门回答身份问题。
  body: |-
    为什么会有这一层？早期很多网站直接拿 OAuth 的访问令牌当登录凭证用，可访问令牌的本职是「允许这个应用访问某些资源」，它并不承诺里面写的人是谁、这次登录是什么时候发生的。拿它当身份证用，出过真实的冒用事故：一个应用拿到的令牌，被塞到另一个应用里冒充登录。

    [[OIDC]]（OpenID Connect）的补法很直接：在 OAuth 流程里多发一个 id_token，它就是一个 [[JWT]]：里面写明签发方是 Google、这个令牌是发给哪个网站的、用户编号是什么、登录发生在何时，末尾有 Google 的签名。书店网站验签、核对「确实是发给我这个网站的」，才敢认这次登录。

    所以今天你看到的「使用 Google 账号登录」，底下是两层：OAuth 管令牌的流转，OIDC 管身份的断言。面试里被问到「OAuth 和 OIDC 什么关系」，就答这一句：OIDC 是建在 OAuth 之上的身份层。
  derivation: original
  sources:
  - ref: openid-connect-core
    locator: "OpenID Connect Core 1.0: ID Token 的声明与验证规则"
    claim: OIDC 在 OAuth 2.0 流程中增加 ID Token（JWT），载明签发方、受众（客户端）、用户标识与认证时间，客户端须验签并核对受众后才可采信登录身份。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: google
      id: gg
      label: Google：多签发一个 id_token
    - lane: site
      id: sv
      label: 书店网站：验签并核对「是发给我的」
      highlight: true
    messages:
    - id: m1
      from: gg
      to: sv
      label: id_token：我是谁、何时登录、发给哪个网站
      active: true
    registers:
    - name: 分工
      value: OAuth 管授权流转，OIDC 管身份断言
  log:
  - at: 身份层
    text: 访问令牌不是身份证，id_token 才是
- id: password-storage
  title: 第八步：密码存储——故意算得慢，才是正确的存法
  tldr: 如果网站不用第三方登录、要自己存密码，存法决定了密码库泄露那天的下场：明文是当场全灭，快速哈希是延时全灭，正解是每个用户加随机盐，再用故意很慢的哈希算一遍存起来。
  body: |-
    先算攻击者的账。密码库被偷走之后，攻击者是在自己的机器上离线试密码：拿候选密码算一遍哈希，和库里比对得上就撞开了。用 MD5 这类为速度而生的[[哈希]]算法，现代显卡每秒能算上百亿次。人类常用密码的空间有多大？8 位小写字母加数字的组合约 2.8×10¹² 种——按每秒百亿次算，几分钟就试完了。你的密码再有创意，也架不住机器把整个空间犁一遍。

    正解有两味药。第一味是[[盐值]]：每个用户注册时随机生成一段数据，和密码一起算哈希再存。这样即使两个人的密码相同，存下来的结果也不同；更关键的是，攻击者没法用预先算好的彩虹表整表套用，只能对每个用户单独开算。第二味是慢：bcrypt、Argon2 这类算法专门为存密码设计，慢的程度可调——把单次计算调到约 250 毫秒。你登录时多等这 250 毫秒毫无感觉，可攻击者试完上面那个空间要花上百万年。防守方每人只算一次，攻击方每人要算上亿次，把单次成本抬高，账全记在攻击者头上。

    所以审查任何系统的密码存储，只看三件事：是不是慢哈希、盐是不是每人随机、参数是不是近年调过的。三条有一条不对，这套存储就不合格。
  derivation: original
  sources:
  - ref: owasp-password-storage
    locator: "OWASP Password Storage Cheat Sheet: Argon2id / bcrypt 参数与盐值要求"
    claim: 密码应使用加盐的自适应慢哈希（首选 Argon2id，次选 bcrypt）存储，盐值须随机且每用户唯一；快速哈希（如 MD5、SHA-256）不适合存密码。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: db
      id: fast
      label: 快速哈希存的库：每秒上百亿次可试
    - lane: db
      id: slow
      label: 盐加慢哈希存的库：单次约 250 毫秒
      highlight: true
    messages:
    - id: m1
      from: fast
      to: slow
      label: 同一个密码空间：几分钟试完 vs 上百万年
      active: true
    registers:
    - name: 8 位密码空间
      value: 约 2.8×10¹² 种组合，快哈希几分钟犁完
    - name: 慢的尺度
      value: 单次约 250 毫秒：用户无感，爆破无望
  log:
  - at: 存储
    text: 慢哈希加盐：把爆破的账记在攻击者头上
- id: rbac-roles
  title: 第九步：RBAC——登录管你是谁，权限管你能干什么
  tldr: 最后一块：认出你是谁只是第一步，系统还得决定你能干什么。RBAC 的做法是把权限发给角色、把角色发给人——书店里普通用户、客服、管理员三张权限表，覆盖绝大多数业务系统。
  body: |-
    先分清两个词。认证回答「你是谁」，授权回答「你能干什么」，前几步讲的全是认证，这一步讲授权。最原始的授权写法是把判断散落在代码里：这个接口检查一下是不是管理员，那个页面判断一下是不是客服。系统一大，规则就散佚了：新加一个「仓库管理员」角色，要翻遍全站改判断。

    [[RBAC]] 把这件事收成两张表。第一张表写角色能干什么：普通用户能下单、看自己的订单；客服能看所有订单、改收货地址，但不能退款；管理员能退款、能封号。第二张表写谁是什么角色：张三是客服，李四是管理员。请求进来时，系统查的是「你的角色能不能做这件事」，而不是「你这个人能不能」。

    好处在变更时显形：客服岗新增「能发优惠券」，只改第一张表一行，所有客服立刻生效；某人离职，删掉第二张表里他的角色即可。判断标准也随之简单：审查一个系统的权限设计，就看权限是不是收敛在这两张表里，还是散落在代码各处——散落的，迟早漏一个，那就是安全课要讲的[[越权]]。
  derivation: original
  sources:
  - ref: owasp-authorization
    locator: "OWASP Authorization Cheat Sheet: 最小权限与集中式授权校验"
    claim: 授权应遵循最小权限原则并集中实施，避免把权限判断散落在各处代码中；基于角色的授权是业务系统的主流做法。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: site
      id: req
      label: 请求进来：这个人想退款
    - lane: db
      id: table
      label: 角色权限表：客服不能退款，管理员能
      highlight: true
    messages:
    - id: m1
      from: req
      to: table
      label: 不查「你是谁」，查「你的角色能不能」
      active: true
    registers:
    - name: 表一
      value: 角色 → 能做的事（客服：查订单、改地址；无退款）
    - name: 表二
      value: 人 → 角色（张三：客服；李四：管理员）
  log:
  - at: 授权
    text: 权限发给角色，人领角色：改规则只动一张表
- id: closing-questions
  title: 第十步：收束——拿到任何登录系统，先问三件事
  tldr: 全课收成三问：凭证是谁签发的、状态存在哪、怎么让它立刻失效。答得清这三问，任何一套登录系统的骨架你就看穿了；答不清的那一问，就是它的事故现场。
  body: |-
    把这一课的账并一并。登录态是给无记忆的 HTTP 补的记忆，载体是一张随请求携带的凭证。凭证有两条路线：Session 把状态留在服务器、给你钥匙，控制力强；JWT 把状态签进凭证本身，扩展性好、撤销靠短过期加刷新令牌补。第三方登录是两层：OAuth 让网站借用身份而不碰密码，OIDC 用 id_token 把「你是谁」断言清楚。自己存密码的，慢哈希加盐是底线；权限用 RBAC 收成两张表，别散落在代码里。

    带走这三问，面试和审查都够用。第一问，凭证是谁签发的、靠什么防伪——随机编号靠空间大，JWT 靠签名，id_token 靠身份提供方的签名。第二问，状态存在哪——服务器的档案、客户端的凭证、还是两边各存一半。第三问，怎么让它立刻失效——删档案、删刷新令牌，还是只能等过期。

    下一课换个问题：登录之后用户翻来翻去看的那些商品页，数据几乎不变，却把数据库读到冒烟——该把这份热数据挪到哪去。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: site
      id: any
      label: 任何一套登录系统
    - lane: db
      id: three
      label: 三问：谁签发、存哪、怎么失效
      highlight: true
    messages:
    - id: m1
      from: any
      to: three
      label: 答不清的那一问，就是它的事故现场
      active: true
    registers:
    - name: 三问
      value: 谁签发防伪、状态存哪、如何立刻失效
  log:
  - at: 收束
    text: 认证、会话、授权三件事，各有各的答案
