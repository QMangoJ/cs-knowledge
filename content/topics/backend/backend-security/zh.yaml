title: 后端安全：注入、越权与密钥
order: 9
visual: swimlane
lanes:
  - id: attacker
    label: 攻击者
  - id: app
    label: 应用服务
  - id: db
    label: 数据库
  - id: ops
    label: 运维与配置
logColumns:
  - key: at
    label: 阶段
  - key: text
    label: 发生了什么
status: published
license: CC-BY-4.0
overview:
  - key: 一句话总结
    value: 后端安全立在「客户端发来的一切皆不可信」之上，靠三道防线兜底：输入永远当数据不当指令（用参数化查询防 SQL 注入）、每次访问都核对「这条资源归不归你」（逐资源防越权）、秘密绝不进代码也不进日志（密钥外置轮换与出口脱敏）。
  - key: SQL 注入
    value: 把用户输入直接拼进 SQL 字符串，输入就能篡改语句逻辑——一句 ' OR '1'='1 足以让登录校验恒真。参数化查询先把语句结构编译锁死，再把输入作为纯数据绑定，从根上剥夺输入变成指令的通道。
  - key: 越权
    value: 登录只证明「你是谁」，不证明「你能动这条数据」。改一位订单号就看到别人买的东西是水平越权，普通账号调通管理员接口是垂直越权；必须在接口与取数现场逐次核对角色与归属。
  - key: 密钥管理
    value: 云厂商 API 密钥或数据库密码一旦推上公开代码库，全天候盯梢的扫描机器人几分钟内就会捡去盗刷挖矿或拖库。密钥只能通过环境变量或密钥管理服务（KMS）注入，且一旦泄露必须先吊销轮换再清历史。
  - key: 日志脱敏
    value: 日志读者多、留存久，图省事把整个请求体打进日志，等于把密码、令牌和身份证号长期摊给所有能查日志的人。脱敏必须焊在结构化日志的统一出口，敏感字段一律掩码。
  - key: 谁在用
    value: OWASP 安全速查表常年将注入与越权列为头号风险；GitHub 等代码托管平台默认开启公开仓库密钥扫描并联动云厂商自动告警吊销；各大云平台的 KMS 则是生产环境密钥托管、轮换与审计的标配。
summary: 后端安全的起点是默认客户端发来的任何字节都可能经过恶意构造，在此之上铺开纵深防线：用参数化查询拆开指令与数据通道，根治 SQL 注入；把身份认证收拢到入口中间件，同时将功能角色校验与数据归属校验贴在接口和数据出口上，堵死水平与垂直越权；将系统密钥外置到环境变量或密钥管理服务并保持可轮换，配合日志出口统一脱敏，管住秘密的传播半径与存活周期。
premise: 订单详情接口 /orders/123456 登录校验齐全、功能测试全绿上线。可没过几天有人发现，登录自己的账号后只要把网址末尾改成 123457，陌生买家的姓名、收货地址和商品明细便一览无余——代码明明一行报错都没有，为什么功能全对的接口在攻击者手里一捅就破？
position: 本课位于后端工程学科第九课，与上一课 SQL 实务一快一稳配成数据访问双翼：上一课治理无意写出的慢查询，本课防御蓄意构造的恶意请求。它把前序课程里的参数校验、密码哈希、RBAC 角色模型与结构化日志放到对抗视角下合拢，补齐写服务侧上线前的最后一块安全拼图。
level: 进阶
minutes: 26
objectives:
  - 能复盘字符串拼接引发 SQL 注入的过程，讲清参数化查询根治注入的两步机制
  - 能区分水平越权（IDOR）与垂直越权，把认证、功能角色与数据归属校验放到正确位置
  - 能说清密钥推上公开仓库后的分钟级失陷链，掌握先吊销轮换再清历史的处置顺序
  - 能制定结构化日志出口的脱敏规则，并用「输入、权限、秘密」三问审查任意接口
aiLink: 审接口先问三句：外部输入当成了数据还是指令？权限是贴着资源验的还是只在门口验了一次登录？密钥与用户隐私有没有溜进代码库和日志？
bridge:
  prev: 上一课把数据库查询调得既快又省，但跑得飞快的接口如果轻信了原始输入或漏验了资源归属，攻击者只要塞进半句引号或改一位编号就能搬空数据。
  next: 代码逻辑写稳、常见攻击面也堵严实之后，服务终于要离开开发机：下一课走进单机 Linux 与 Nginx 部署实务，看进程怎么守护、流量怎么进门。
design:
  - mechanism: 输入永远当数据，不当指令
    problem: 只要用字符串拼接把用户输入塞进 SQL、系统命令或模板，输入就获得了与开发者代码同等的解释权，一段精心闭合的引号就能改写整条语句。
    choice: 在外部输入与执行引擎之间强制走参数化通道：先发送带占位符的语句模板编译定型，再把用户输入作为纯字面量数据单独绑定。
    tradeoff: 表名、动态排序列名等语法结构本身无法作为参数绑定，必须额外写一层严格的白名单映射；团队也要立下「见字符串拼 SQL 即打回」的红线。
    root: 一切注入漏洞的病根都是数据与指令共用同一条解析通道；把两条通道从协议层拆开，整类漏洞便彻底失去了滋生条件。
  - mechanism: 授权校验贴着资源走
    problem: 只在网关或中间件验一次「已登录」，相当于查完门票就让人随便翻所有储物柜；任何合法用户改一下参数里的编号就能读写他人记录。
    choice: 每当接口读取或修改具体业务对象时，直接把「资源归属当前用户」写进查询条件或紧挨取数处核验，让越权请求连资源是否存在都摸不到。
    tradeoff: 每次资源操作都要多带一层归属条件，碰到多人协作、客服代查等复杂业务时，还得把权限判断抽成独立可测的策略函数统一维护。
    root: 权限本质上是「当前主体与目标资源的关系」，而资源归属藏在数据库记录里——大门口看不见数据，前端界面拦不住直连，唯有取数那一刻能验准。
  - mechanism: 秘密不进代码、不进日志，可随时轮换
    problem: 写死在代码里的密钥会随每一次克隆、分支备份无限扩散，改密钥还得重新发版；打进日志的密码则会长期躺在日志平台里，暴露给所有排障人员。
    choice: 代码里只留配置变量名，真实密钥由运行环境或密钥管理服务动态注入，轮换时无需改代码；同时在日志库出口按字段名统一掩码脱敏。
    tradeoff: 本地开发与线上部署多了一步配置注入，历史仓库和旧日志里若曾漏进过明文密钥，还必须走专门的吊销与清洗流程还债。
    root: 秘密的风险取决于传播半径与存活时长：不进代码掐住扩散面，不进日志缩短留存期，支持热轮换则把万一泄露后的可乘之机压到最短。
quiz:
  - q: 输入 「' OR '1'='1」 为什么能绕过字符串拼接的登录查询？
    options:
      - 触发了数据库内置后门
      - 拼进 SQL 后让 WHERE 变成「用户名匹配 或 '1'='1'」恒为真，直接短路密码校验并返回首行用户
      - 恰好撞上了管理员密码的哈希值
      - 查询超时后数据库默认放行
    answer: 1
    explain: 字符串拼接让输入升格成了查询语法。补上的 OR 恒真分支使条件无条件成立；参数化查询把输入作为纯数据绑定，再也改不动语句结构。
  - q: 已登录用户把网址订单号改大一位就看到陌生人的订单，这是什么漏洞，怎么防？
    options:
      - SQL 注入；用参数化查询防
      - 水平越权（IDOR）；查库时把「买家 ID = 当前用户」写进查询条件验归属
      - 缓存穿透；在 Redis 缓存空值防
      - 跨站脚本（XSS）；在前端转义防
    answer: 1
    explain: 账号登录合法，漏在只验身份没验数据归属，即水平越权（IDOR）。把当前用户一并写进 WHERE 条件，不属于他的订单直接按不存在返回最稳妥。
  - q: 误把云厂商 API 密钥写进代码推上公开仓库，最可能的后果与急救第一步是什么？
    options:
      - 代码文件多，别人翻不到就没事
      - 扫描机器人几分钟内就会抓去盗刷；应立刻去云控制台吊销并轮换密钥，而非只删代码重提交
      - 删掉那行代码再提交一次就安全了
      - 把仓库改回私有就能消除风险
    answer: 1
    explain: 公开仓库的新提交会被机器人按前缀实时抓取试用；Git 历史里仍留着旧记录，删代码救不了，必须第一时间吊销轮换旧密钥。
  - q: 打印排障日志时，哪一组信息绝对不该原样写进日志？
    options:
      - 请求耗时与 HTTP 状态码
      - 订单编号与用户内部 ID
      - 明文密码、访问令牌、完整的身份证号与银行卡号
      - 接口路径与客户端版本号
    answer: 2
    explain: 日志读者范围远宽于数据库且留存数月。密码与令牌进日志等于广播凭证，完整证件号则触碰合规红线，必须在日志出口统一脱敏。
steps:
  - id: threat-model
    title: 对抗视角：默认客户端发来的每一个字节都经过恶意构造
    tldr: 功能测试只验证善意输入下能不能跑通，而攻击者专门寻找代码漏问的边界；后端安全的全部防线都立在「绝不信任客户端输入、自称权限与隐蔽性」之上。
    body: |-
      订单详情接口 `/orders/123456` 上线前测得滴水不漏：未登录访问会拦、正常点进详情能看。可任何一个登录用户只要手动把地址栏末尾改成 `123457`，就能直接刷出另一位买家的真实姓名、家庭住址与购买清单。代码一行报错都没有——它老老实实执行了「按编号查订单」，唯独漏问了一句「这笔订单归不归当前登录的人」。

      单靠常规功能测试永远抓不出这类漏洞，因为功能测试默认对面的用户按常理出牌；而安全工程面对的是主动找茬的对手：如果输入框里塞进半句 SQL 会怎样？如果合法用户去碰别人的资源编号会怎样？如果配置文件或日志被人翻到会怎样？

      请求链路课在参数校验环节提过「不信客户端」，放到安全视角下要彻底贯通到底：不信任何外部输入是纯洁数据，不信已登录用户只会访问份内资源，更不信藏在代码或日志里的密钥能永远没人看见。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: attacker
          id: atk
          label: 攻击者：把编号改一位的用户
        - lane: app
          id: app
          label: 接口：功能完全正常，忠实地查了
        - lane: db
          id: db
          label: 别人的订单：姓名地址全被看到
          highlight: true
      messages:
        - id: m1
          from: atk
          to: app
          label: 登录合法、请求合法，归属没人验
          active: true
      registers:
        - name: 功能视角
          value: 正常输入下对不对，全过
        - name: 安全视角
          value: 恶意输入下会怎样，没测过
    log:
      - at: 本质
        text: 安全问题不在功能里，在没人问过的那几句里
  - id: sql-injection-walk
    title: SQL 注入复盘：字符串拼接如何让用户输入篡改查询逻辑
    tldr: 把用户输入直接拼进 SQL 字符串，数据与指令就混在了同一条通道里；一句 「' OR '1'='1' --」 就能闭合引号、让条件恒真并注释掉密码校验。
    body: |-
      早年最常见的登录写法是拿字符串直接拼查询：`SELECT * FROM users WHERE name = '` 接上前端传来的用户名，再拼上 `' AND password = '` 和密码。只要用户老老实实填「张三」，这段代码跑得毫无破绽。

      一旦攻击者在用户名框里敲进 `' OR '1'='1' --`，拼出来的完整语句立刻变味成 `WHERE name = '' OR '1'='1' -- ' AND password = ''`。数据库引擎顺着读下来：名字等于空字符串，或者 `'1'='1'`——后半句永远成立，整个 `WHERE` 条件瞬间恒真；紧跟着的 `--` 又把后半截密码校验当成注释直接抹掉。引擎随即把用户表第一行（往往正好是系统管理员）当作匹配结果返回，攻击者连密码都没猜就登进了后台。

      [[SQL 注入]]并不是什么高深黑客魔法，它是「数据与指令共用同一条文本通道」的必然恶果。只要靠字符串拼接构造可执行语句，SQL 能注入，Shell 命令拼接能注入系统命令，HTML 模板拼接能注入恶意脚本——通道不拆开，漏洞就永远堵不完。
    derivation: original
    code:
      lang: sql
      code: |-
        -- 拼接前的本意：
        SELECT * FROM users WHERE name = '张三' AND password = '******'
        -- 输入 ' OR '1'='1' -- 之后拼成的实际语句：
        SELECT * FROM users WHERE name = '' OR '1'='1' -- ' AND password = ''
      note: OR 后半句恒真，-- 把密码校验整段注释掉，第一行用户被当作登录成功
    canvas:
      kind: swimlane
      actors:
        - lane: attacker
          id: atk
          label: 攻击者：用户名框里输入一段构造好的文字
        - lane: app
          id: app
          label: 应用：把输入原样拼进 SQL
        - lane: db
          id: db
          label: 数据库：条件恒真，返回第一行用户
          highlight: true
      messages:
        - id: m1
          from: atk
          to: app
          label: 输入里藏着半句 SQL
        - id: m2
          from: app
          to: db
          label: 拼好的语句：密码校验已被注释掉
          active: true
      registers:
        - name: 关键变化
          value: 输入从「被查的数据」升格成「查询逻辑」
    log:
      - at: 注入
        text: 数据与指令共用通道，输入就能改写语句
  - id: parameterized-query
    title: 参数化查询：先锁死语法结构再填纯数据，从根上废掉注入
    tldr: "[[参数化查询]]把执行拆成两步：先发带占位符的 SQL 模板让数据库编译定型，再把用户输入作为纯字面量单独绑定，输入里的引号和 OR 永远升格不成指令。"
    body: |-
      [[参数化查询]]把一条查询拆成严格隔离的两步走。第一步，应用先把带占位符的模板 `WHERE name = ? AND password = ?` 发给数据库，数据库当场完成语法解析与编译——有几个条件、用 `AND` 还是 `OR` 连接，在这一刻已经彻底锁死。第二步，应用再把前端传来的用户名与密码作为参数单独递过去，引擎只把它们填进坑位当普通字符串比对。就算攻击者再敲进 `' OR '1'='1' --`，数据库也只是去查有没有人真叫这个怪名字，查无此人便直接拒之门外。

      为什么不能靠写正则去过滤 `OR`、`SELECT`、`--` 这些危险词？因为黑名单过滤是在跟攻击者玩猫鼠游戏：大小写混写、编码绕过、内联注释层出不穷，防御规则永远慢半拍。参数化查询根本不猜输入危不危险，而是直接拆掉了输入变成指令的语法通道，这也是 OWASP 防注入速查表将其列为首选防线的原因。

      唯一要注意的盲区是表名和 `ORDER BY` 排序列名——它们属于语法结构本身，不能用 `?` 占位绑定。遇到动态排序需求时，后端必须建一张白名单字典，把前端传来的枚举词映射成固定列名，绝不拿原值直接拼进 SQL。
    derivation: original
    sources:
      - ref: owasp-sql-injection
        locator: "OWASP SQL Injection Prevention Cheat Sheet: 参数化查询为首选防法"
        claim: 防御 SQL 注入的首选是参数化查询（预处理语句），使输入只能作为数据绑定；无法参数化的结构部分（如排序字段）应使用白名单映射。
        status: verified
        checkedBy: subagent
        checkedAt: "2026-11-17"
    code:
      lang: sql
      code: |-
        -- 结构先行：占位符的含义在编译时就锁死
        SELECT * FROM users WHERE name = ? AND password = ?
        -- 参数随后单独传入，永远只是数据：
        --   ?1 = ' OR '1'='1' --    ?2 = （任意）
      note: 输入里的引号与 OR 只是普通字符，查不到这个名字的用户，仅此而已
    canvas:
      kind: swimlane
      actors:
        - lane: app
          id: app
          label: 应用：先发结构，再发数据
        - lane: db
          id: db
          label: 数据库：结构已锁死，参数只当数据
          highlight: true
      messages:
        - id: m1
          from: app
          to: db
          label: 两步分开：含义先定，数据后填
          active: true
      registers:
        - name: 防法本质
          value: 不是过滤危险词，是拆掉成因
        - name: 覆盖不到的
          value: 表名与排序字段，用白名单映射补
    log:
      - at: 防注入
        text: 通道分开之后，注入这一类洞失去成因
  - id: idor-horizontal
    title: 水平越权：把资源归属直接焊进查询条件，不给同级串门留缝
    tldr: 登录只证明你是合法用户，不代表你能看别人的记录；把「买家 ID = 当前用户」直接写进查库条件，不属于他的资源一律返回 404，连存在与否都不泄露。
    body: |-
      回看开场那起改一位编号就看光别人订单的事故：访问者带着合法登录凭证、走着正规接口，半句特殊字符都没塞，仅仅把订单号加了 1。服务端验了登录态、验了数字格式，偏偏漏验了「这笔订单是不是他本人买的」。这种同级别用户之间互相串门偷看或篡改数据的漏洞叫水平[[越权]]（IDOR），常年霸占业务安全通报榜首，病根就在于开发者下意识假设「登录进来的人只会点自己页面上的链接」。

      最稳妥的防法是把归属条件直接焊进数据查询语句：`SELECT ... FROM orders WHERE id = ? AND buyer_id = ?`。只要订单不属于当前登录用户，数据库直接查出空集，接口顺理成章返回 `404 Not Found`——连「这笔订单确实存在、只是你没权限看」的口风都不漏给试探者。比起先按主键查出整行记录再在业务代码里写 `if` 判断，把归属塞进查询条件能大大降低多接口复用时漏写校验的风险。

      排查存量代码时抓手极其简单：把全站所有按 `id` 或单号读取、修改、删除记录的接口拉出来逐个过堂，只要查询条件里没出现当前用户或所属租户编号，十有八九就是一处待爆的水平越权。
    derivation: original
    sources:
      - ref: owasp-authorization
        locator: "OWASP Authorization Cheat Sheet: 对每个资源的访问都要做授权校验"
        claim: 授权校验必须针对每个被访问的资源执行，验证当前主体对该资源是否有权，而不能仅依赖登录状态；缺失即构成不安全的直接对象引用（IDOR）。
        status: verified
        checkedBy: subagent
        checkedAt: "2026-11-17"
    canvas:
      kind: swimlane
      actors:
        - lane: attacker
          id: atk
          label: 攻击者：编号加一，请求照常发出
        - lane: app
          id: app
          label: 接口：查询条件里带着当前用户
        - lane: db
          id: db
          label: 数据库：别人的订单查出来就是不存在
          highlight: true
      messages:
        - id: m1
          from: atk
          to: app
          label: 改编号的请求，撞上归属条件
        - id: m2
          from: app
          to: db
          label: 编号对且买家是我，才查得到
          active: true
      registers:
        - name: 防线位置
          value: 焊在查询条件里，而不是查完再判断
        - name: 返回口径
          value: 不属于他的，一律按不存在处理
    log:
      - at: 水平越权
        text: 登录管身份，归属管数据，两道验不能互相顶替
  - id: vertical-authz
    title: 垂直越权与校验落点：认证收口在中间件，角色与归属贴着接口和数据验
    tldr: 前端隐藏按钮挡不住直接发请求调管理员接口；身份认证放在入口中间件统一做，功能级角色校验放在接口入口，数据级归属校验则必须落在取数现场。
    body: |-
      后台全额退款接口本该只有管理员能点，前端页面也乖乖对普通买家藏起了退款按钮——可如果后端接口本身没验角色，普通用户抓个包直接发请求照样能把款退出来。前端藏按钮只是界面排版，从来不是安全防线；只要后端没拦，大门就是敞开的。这种低权限账号调通高权限功能的漏洞就是垂直越权。

      权限体系要想不漏，三道检查点必须各就各位：身份认证（你是谁）收拢在请求链路的[[中间件]]里全站统一做一次，验完凭证把当前用户塞进请求上下文；功能级授权（能不能调退款接口）守在具体路由入口，对照 [[RBAC]] 角色权限表放行；数据级授权（能不能看这笔订单）则贴在数据访问处核验资源归属。两半授权缺一不可：只验角色防不住同级买家互看订单，只验归属又拦不住普通用户硬闯管理后台。

      为什么不能把数据归属也一股脑塞进外层中间件统一验完？因为请求刚进大门时，中间件手里只有一串订单编号，根本不知道这笔订单的买家是谁——归属关系躺在数据库记录里，唯有把数据读出来的那一刻才能对上号。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: app
          id: mw
          label: 中间件：统一验认证，你是谁
        - lane: app
          id: fn
          label: 接口入口：验功能级角色
        - lane: db
          id: own
          label: 数据出口：验归属，这条是不是你的
          highlight: true
      messages:
        - id: m1
          from: mw
          to: fn
          label: 身份先行，角色随后
        - id: m2
          from: fn
          to: own
          label: 归属只能在数据被取出时验
          active: true
      registers:
        - name: 认证的位置
          value: 中间件一处，全站统一
        - name: 授权的两半
          value: 功能级在入口，数据级贴资源
    log:
      - at: 检查点
        text: 藏按钮不是权限，接口验了才是
  - id: secrets-in-code
    title: 密钥外置与轮换：推上公开仓库的密钥几分钟内就会失陷
    tldr: 把云平台 API 密钥写进代码推上公开仓库，自动化扫描机器人几分钟内就会抓去盗刷；一旦泄露必须先吊销轮换再清历史，日常则只通过环境变量或密钥管理服务注入。
    body: |-
      图一时省事把云厂商的 API 密钥硬编码进配置文件、`git push` 到公开仓库，从推送成功那一秒起倒计时就开始了：全网有成群的自动化爬虫紧盯公开仓库的新提交流，专门按密钥前缀（如 `AKIA`、`sk-`）与长度特征实时匹配，抓到立刻自动调云接口验活。短短几分钟内，这把密钥就会被拿去批量开高配云主机挖矿、群发垃圾邮件，或是把 [[S3]] 存储桶翻个底朝天，天价账单与数据泄露双双砸下来。GitHub 与各大云厂商之所以联手做推送密钥扫描和自动吊销，正是因为这套黑产早已全自动流水线化。

      万一手滑推上去了，千万别以为删掉那行代码再提交一次就能脱险——Git 历史提交树里明明白白留着旧快照，早被爬虫拉走了。唯一正确的急救顺序是：第一时间冲进云控制台吊销旧密钥、签发新密钥完成轮换止血，最后再去清洗仓库历史记录。

      正道是从源头禁止任何秘密沾代码库的边：本地开发写进被 `.gitignore` 排除的 `.env` 文件，生产部署由容器或宿主环境注入为环境变量，团队规模大了再接入云厂商的密钥管理服务（KMS）做统一派发、定期轮换与调用审计。认证课管住的是用户的登录密码，这里管住的是系统自己的通行证——秘密摆在哪，直接决定了它失窃时的爆炸半径。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: app
          id: push
          label: 开发者：密钥写进配置，推送公开
        - lane: attacker
          id: bot
          label: 扫描机器人：按格式特征几分钟内捡走
        - lane: ops
          id: cloud
          label: 云账户：密钥被拿去开机器、翻存储
          highlight: true
      messages:
        - id: m1
          from: push
          to: bot
          label: 推送即公开，自动化不需要等人发现
        - id: m2
          from: bot
          to: cloud
          label: 验证通过立刻试用，账单先到
          active: true
      registers:
        - name: 补救顺序
          value: 先吊销轮换，再清理历史，删代码救不了
        - name: 密钥正位
          value: 环境变量或密钥管理服务，不进代码
    log:
      - at: 密钥泄露
        text: 秘密进仓库等于公开，且按分钟计被利用
  - id: log-masking
    title: 日志出口脱敏：别让排障宝库变成明文凭证仓库
    tldr: 日志查阅范围远宽于生产数据库且留存数月；必须在结构化日志组件出口统一拦截，密码与令牌整段掩码，证件与手机号只留头尾，绝不指望开发者逐条手写过滤。
    body: |-
      生产数据库往往只有极少数 DBA 能直连，可应用日志为了方便排障，研发、运维、驻场外包都能查，甚至还会同步到第三方日志云平台留存好几个月。如果图省事在排查登录报错时把整个请求体原样打进日志，用户的明文密码、访问令牌和身份证号就等于长期摊在了所有能看日志的人面前，留存期比那次请求本身长出几万倍。

      脱敏规则既要分清轻重，更要选对落点：密码、密钥与各类 Token 必须整段抹成星号或直接剔除；手机号、身份证号、银行卡号保留头尾供排障核对、中间一律打码（如手机号留前 3 后 4）；订单金额等业务字段可正常保留，但别跟完整身份信息绑在同一行明文里。最关键的是把规则焊死在日志库的统一输出口——指望每个工程师写 `logger.info` 时自觉手删敏感字段，跟指望每个接口自觉写认证一样，迟早漏穿。

      这也正是观测课强调[[结构化日志]]的另一重红利：每条日志都是键值分明的 JSON 字段，出口拦截器只要匹配 `password`、`authorization`、`idCard` 等键名就能精准掩码；要是满屏都是随意拼接的自由文本，拿正则表达式捞得再苦也难免漏网。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: app
          id: raw
          label: 原始请求：密码、令牌、身份证号都在里面
        - lane: ops
          id: mask
          label: 日志出口：按字段统一脱敏
          highlight: true
      messages:
        - id: m1
          from: raw
          to: mask
          label: 密码整段掩码，证件号留头尾打中间
          active: true
      registers:
        - name: 脱敏对象
          value: 密码与令牌整段掩码，证件号保留头尾
        - name: 执行位置
          value: 日志出口一处，不靠各人自觉
    log:
      - at: 脱敏
        text: 日志读者多、活得久，秘密进去就等于扩散
  - id: defense-in-depth
    title: 纵深防御：默认任何单层都会失守，五道筛子层层兜底
    tldr: 参数化查询防不住越权，查归属也防不住密钥泄露；必须在传输、输入、权限、秘密与第三方依赖五层同时设防，确保任意单点漏检时不会演变成全库裸奔。
    body: |-
      没有任何一道安全机制能包打天下，生产系统的底气来自五层联防：传输层靠 HTTPS（底层是 [[TLS]]）防半路窃听与篡改；输入层靠参数校验与参数化查询，把脏数据和恶意指令挡在门外；权限层靠统一认证加逐资源、逐角色的细粒度授权，锁死访问边界；秘密层靠密钥外置轮换与日志出口脱敏，掐断凭证外泄；最外围还有第三方依赖治理——2021 年底席卷全球的 Log4Shell 漏洞就是警钟，哪怕自家业务代码写得再稳，引用的底层日志库爆出高危漏洞照样全线沦陷，必须靠依赖清单巡检与及时打补丁兜底。

      纵深防御的精髓，是坦然承认「人总会写漏某处」：万一某个新接口漏写了参数化，数据库账号的最小权限还能限制删库破坏；万一某处归属判断写漏了，异常访问告警与脱敏日志还能及时止损并保住核心隐私。反过来，那种指望「公司有内网防火墙，所以内部服务全免认证」的单墙思维，一旦边界被打穿就是彻底裸奔。

      从前端或纯业务开发转向后端工程，不必人人都去钻研二进制漏洞挖掘，但必须把这五层基本功变成写接口时的肌肉记忆——绝大多数线上安全事故，从来不是输给了神出鬼没的零日攻击，而是漏掉了其中最朴素的一环。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: attacker
          id: atk
          label: 攻击者：打穿了其中一层
        - lane: app
          id: layers
          label: 纵深：传输、输入、权限、秘密层层在
          highlight: true
      messages:
        - id: m1
          from: atk
          to: layers
          label: 一层破了，下一层还兜着数据范围
          active: true
      registers:
        - name: 五层
          value: 传输、输入、权限、秘密、依赖
        - name: 反面
          value: 只靠一层的系统，那层破时全线裸奔
    log:
      - at: 纵深
        text: 安全不是一道墙，是一层层的筛子
  - id: closing-security
    title: 接口上线安全三问：查输入通道、验资源归属、清代码与日志秘密
    tldr: 任何接口合并代码前连问三句：外部输入有没有彻底走参数化通道？角色与数据归属是不是贴着每个接口和资源验的？仓库与日志出口有没有彻底清掉明文密钥与隐私？
    body: |-
      三大高危攻击面各自对应着釜底抽薪的工程解法：防注入靠[[参数化查询]]把语法模板与用户输入拆成两条独立通道；防[[越权]]靠入口统一验认证、路由入口验功能角色、取数现场把资源归属直接焊进查询条件；护秘密靠环境变量或密钥管理服务动态注入并支持随时轮换，再加结构化日志出口统一掩码脱敏。五层筛子叠在一起，才算立住了纵深防线。

      以后每次提交或评审接口代码，习惯性过一遍这三问：第一问看输入，所有外部参数是不是都过了结构校验与参数绑定，动态排序列名有没有走白名单映射？第二问看权限，每个凭单号或 ID 读写记录的查询，归属条件写在了哪一行；每个管理操作，角色拦截挂在了哪一层？第三问看秘密，全局搜一遍仓库有没有硬编码凭证的影子，核对一遍日志出口有没有漏打密码、Token 与完整证件号？三问全有着落，接口就能踏实上线。

      服务写稳了、慢查询治好了、常见攻击面也堵严实了，接下来就该让它离开本地开发机真正对外营业：下一课走进单机 Linux 与 Nginx 部署实务，看一台空白云服务器怎么把进程稳稳托住。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: app
          id: any
          label: 任何一个接口
        - lane: ops
          id: three
          label: 三问：输入、权限、秘密
          highlight: true
      messages:
        - id: m1
          from: any
          to: three
          label: 答不上来的那一问，就是隐患所在
          active: true
      registers:
        - name: 三问
          value: 输入当数据还是指令、权限贴没贴资源、秘密进没进代码日志
    log:
      - at: 收束
        text: 安全基本功是默认动作，不是专家专长
