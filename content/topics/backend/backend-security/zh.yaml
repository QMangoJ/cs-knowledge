overview:
- key: 一句话总结
  value: 后端安全的地基是一个假设：客户端发来的一切都不可信。在这个假设上立三道防线：输入永远当数据不当指令（防 SQL 注入靠参数化查询）、每个请求都要验「这条数据归不归你」（防越权）、秘密永远不进代码也不进日志（密钥管理与脱敏）。任何一道缺位，攻击者要的就只是时间。
- key: SQL 注入
  value: 把用户输入拼进 SQL 语句，输入就获得了改写语句含义的机会：一个 ' OR '1'='1 就能让登录校验恒为真。根治靠参数化查询：语句结构先定死，用户输入只作为数据单独传过去，永远成不了指令。
- key: 越权
  value: 登录只证明你是谁，不证明你能看这条数据。把订单号改一位就看到别人的订单，是水平越权；普通账号调通管理员接口，是垂直越权。防法是每个请求都贴着资源验一遍归属，而不是只在门口验一次登录。
- key: 密钥管理
  value: API 密钥、数据库密码这类秘密，写进代码仓库等于公开：自动化机器人全天候扫描公开仓库，新提交的密钥几分钟内就会被拿去试用。正道是密钥只出现在环境变量或专门的密钥管理服务里，并且能随时轮换。
- key: 日志脱敏
  value: 日志是排障的宝，也是泄露的重灾区：图省事把整个请求体打进日志，密码、令牌、身份证号就全躺在日志系统里，谁能看日志谁就能拿到它们。脱敏规则要在日志出口统一做，敏感字段一律掩码。
- key: 谁在用
  value: 这三道防线是行业共识的形状：OWASP 的系列速查表把注入与越权常年列在风险前列；GitHub 等平台会对公开仓库做密钥扫描并通知厂商吊销；云厂商的密钥管理服务（KMS）就是为轮换与审计而生的。
summary: 这一课换一个视角看前面几课写的接口。开场是一个真实感十足的小事故：有人发现，把订单详情页网址里的编号改一位，就能看到别人的订单——他明明登录的是自己的账号。顺着这条线，这一课把后端最常见的三类攻击各走一遍：SQL 注入是怎么从一个输入框里长出来的、越权为什么靠登录挡不住、密钥写进代码仓库后几分钟内会发生什么。每类攻击都配上对应的防线：参数化查询、逐请求验归属、密钥不进代码不进日志。最后落到一条总原则：安全是纵深，不是单点。
premise: 这节课要回答的问题是：接口功能都对、测试都过，为什么还可能被人撬开？因为功能测试验的是「正常输入下对不对」，攻击者送的全是不正常的输入。这一课站在攻击者一侧，把正常接口当成攻击面重新看一遍。
position: 本课位于后端工程学科第八段「数据实务：SQL 与后端安全」的后半，与上一课配成一对：上一课防的是无意写出的慢，这一课防的是有人故意写出的攻击。它要用的概念前面都已备齐：参数校验在请求链路课、密码存储在认证课、日志在观测课——这一课把它们从攻击者视角重新串起来，并补上注入与越权这两个新主题。
level: 进阶
minutes: 26
objectives:
- 能走一遍 SQL 注入的成因，并说清参数化查询为什么能根治它
- 能分清水平越权与垂直越权，并给出逐请求验归属的防法
- 能说清密钥写进仓库的后果链，以及密钥该放哪、怎么轮换
- 能列出日志脱敏的对象，并用「输入、权限、秘密」三问审查一个接口
aiLink: 记住审查三问：输入被当数据还是当指令、权限是贴着资源验的还是只在门口验的、秘密有没有进代码和日志。三问都过关，常见攻击面就堵住了大半。
bridge:
  prev: 上一课把 SQL 写对了：该走的索引走了、往返次数压下来了。可「写对」防的是慢，防不了坏——同样的接口，输入里塞进一段构造好的文字，就能改写 SQL 的含义。这一课换到攻击者一侧，把接口当攻击面重新审一遍。
  next: 接口防住了，服务还要有个能落脚的地方：一台云服务器租下来，进程谁拉起、请求从哪个门进、日志去哪看。下一课讲 Linux 与 Nginx 的单机部署实务，把服务在一台机器上安顿好。
design:
- mechanism: 输入永远当数据，不当指令
  problem: 只要把用户输入拼进 SQL、命令或模板，输入就获得了和开发者指令同等的地位，攻击者可以用一段文字改写整条语句的含义。
  choice: 所有外部输入与可执行语句之间隔一层参数化通道：语句结构先行编译，用户输入随后作为纯数据传入，两者在引擎眼里泾渭分明。
  tradeoff: 个别动态拼接的场景（如动态排序字段）参数化覆盖不到，要用白名单映射补；团队要立下「字符串拼 SQL 即打回」的审查纪律。
  root: 注入类漏洞的共同根源是数据与指令共用一条通道。把通道分开，不是堵某一个洞，而是让这一整类洞失去成因。
- mechanism: 授权校验贴着资源走
  problem: 只在入口验登录，等于验了「你是会员」就放行整个仓库：任何已登录用户改个编号就能碰别人的数据，越权事故几乎全部出在这里。
  choice: 每个涉及具体资源的请求，都在取出数据时顺手验归属：这条订单的买家编号是不是当前用户。校验点贴着数据访问层，而不是散落在页面判断里。
  tradeoff: 每次资源访问多一次归属判断，个别复杂场景（协作、代查）的授权规则会变绕，需要把规则集中成可测的函数，而不是各接口各写一份。
  root: 权限的本质是「主体与资源的关系」，关系只能在主体与资源相遇的那一刻验——也就是数据被取出的那一刻，门口太早，页面太晚。
- mechanism: 秘密不进代码、不进日志，可轮换
  problem: 密钥写进代码会随仓库的每一次克隆、备份、泄露扩散出去，且改起来要动代码发版；打进日志则会沉淀在日志系统里，被远超必要范围的人看到。
  choice: 密钥只经环境变量或密钥管理服务注入运行时，代码与日志里永远只有它的引用名；轮换流程做到不改代码、不停服。
  tradeoff: 多一个要运维的注入环节，新人本地开发要多一步配置；且历史日志与仓库里的旧密钥要专门清理，欠的账要还。
  root: 秘密的危险程度与它的传播范围和存活时间成正比：不进代码控制传播，不进日志控制存活，能轮换控制泄露后的窗口——三件事分别掐住三个变量。
quiz:
- q: "' OR '1'='1 为什么能绕过拼接式的登录查询？"
  options:
  - 因为数据库有个后门
  - 它被拼进 SQL 后让 WHERE 条件恒为真：用户名等于某值「或」'1'='1'，后半句永远成立，第一行用户就被查了出来
  - 因为它加密了密码
  - 因为它让查询超时了
  answer: 1
  explain: 拼接让输入成了语句的一部分：攻击者补上的 OR 恒真条件，把「密码对不对」的校验整个短路。参数化查询根治它，是因为输入永远以数据身份传入，改不了语句结构。
- q: 用户把订单编号改一位看到了别人的订单，这是什么问题？怎么防？
  options:
  - SQL 注入；用参数化查询防
  - 水平越权；每个请求取出订单时验一遍「买家是不是当前用户」
  - 缓存穿透；给订单加缓存防
  - 跨站脚本；在前端转义防
  answer: 1
  explain: 他登录合法、接口也正常，坏在只验了登录没验归属——这是水平越权（IDOR）。防法是授权贴着资源走：查订单时把当前用户作为条件之一，或取出后立即验归属。
- q: 把云厂商的 API 密钥写进代码推到公开仓库，最可能的后果是？
  options:
  - 没什么后果，密钥藏在代码里很难找
  - 自动化机器人全天候扫描公开仓库，几分钟内密钥就会被试用，账单与数据一起遭殃
  - 只要之后删掉那行代码就没事了
  - 仓库设为公开也不会有人看
  answer: 1
  explain: 公开仓库有专门的扫描机器人在盯新提交，密钥从推送那一刻起就按「已泄露」处理：正确动作是立刻吊销轮换，而不是删代码——历史记录里它还在。密钥的正位是环境变量或密钥管理服务。
- q: 日志里最不该出现的是哪一组？
  options:
  - 请求耗时与状态码
  - 订单编号与用户编号
  - 密码、访问令牌、完整的身份证号与银行卡号
  - 接口路径与客户端版本
  answer: 2
  explain: 日志的读者范围远大于数据库：运维、排障、日志服务商都可能接触。密码与令牌进日志等于把凭证发给所有能看日志的人；身份证号这类则是合规红线。脱敏要在日志出口统一做。
steps:
- id: threat-model
  title: 第一步：本质——默认所有输入都是攻击者写的
  tldr: 先把安全的心智模型立住：功能测试的世界里输入都是善意的，安全的世界里，任何一个字节都可能是攻击者精心构造的。后端安全的全部防线，都是从「不信客户端」这一条长出来的。
  body: |-
    从开场的事故说起。订单详情接口 /orders/123456，登录校验做得好好的，功能测试全过。可任何登录用户把编号改成 123457，看到的是别人的订单：姓名、地址、买了什么，一览无余。接口没有 bug——它忠实地执行了「查这个编号的订单」，坏在没人问过一句「这个订单归不归你」。

    这类问题用功能视角永远测不出来，因为功能测试问的是「正常用户正常用，对不对」；安全问的是另一组问题：输入被改成最恶意的样子会怎样、登录的人去碰不属于他的东西会怎样、秘密会不会在某个角落里躺着。请求链路课里立过一句「永远不信客户端」，那时它服务于参数校验；这一课把它贯彻到底：不信输入的内容、不信请求自称的身份权限、不信任何秘密能藏得住。

    全课的结构就按攻击面排：先看输入怎么变成指令（注入），再看权限怎么被绕过（越权），最后看秘密怎么泄露（密钥与日志）。每类攻击走完，立刻立对应的防线。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: attacker
      id: atk
      label: 攻击者：把编号改一位的用户
    - lane: app
      id: app
      label: 接口：功能完全正常，忠实地查了
    - lane: db
      id: db
      label: 别人的订单：姓名地址全被看到
      highlight: true
    messages:
    - id: m1
      from: atk
      to: app
      label: 登录合法、请求合法，归属没人验
      active: true
    registers:
    - name: 功能视角
      value: 正常输入下对不对，全过
    - name: 安全视角
      value: 恶意输入下会怎样，没测过
  log:
  - at: 本质
    text: 安全问题不在功能里，在没人问过的那几句里
- id: sql-injection-walk
  title: 第二步：SQL 注入走一遍——输入是怎样变成指令的
  tldr: 注入的成因只有一句话：把用户输入拼进 SQL 语句，输入就从数据升格成了语句的一部分。跟着登录查询走一遍，' OR '1'='1 是怎样把密码校验短路的。
  body: |-
    看一段最常见的登录代码：它把用户名和密码直接拼进查询——「SELECT * FROM users WHERE name = '」加上输入的用户名，再接「' AND password = '」加上输入的密码。正常输入下它工作得很好。

    现在攻击者在用户名框里输入 ' OR '1'='1' -- 。拼出来的语句变成了：WHERE name = '' OR '1'='1' -- ' AND password = ''。逐段读：name 等于空，或者 '1'='1'——后半句永远为真，整个条件恒真；再后面的密码校验被 -- 注释掉了。数据库于是把用户表的第一行（常常是管理员）当作登录成功返回。一次输入，改写了整条语句的含义：输入不再是被查的数据，它成了查询逻辑本身。

    记住这个画面：注入不是某种高深技巧，它是「数据与指令共用一条通道」的必然结果。SQL 能注入，命令拼接能注入命令，模板拼接能注入模板——通道不分，洞就一直在。
  derivation: original
  code:
    lang: sql
    code: |-
      -- 拼接前的本意：
      SELECT * FROM users WHERE name = '张三' AND password = '******'
      -- 输入 ' OR '1'='1' -- 之后拼成的实际语句：
      SELECT * FROM users WHERE name = '' OR '1'='1' -- ' AND password = ''
    note: OR 后半句恒真，-- 把密码校验整段注释掉，第一行用户被当作登录成功
  canvas:
    kind: swimlane
    actors:
    - lane: attacker
      id: atk
      label: 攻击者：用户名框里输入一段构造好的文字
    - lane: app
      id: app
      label: 应用：把输入原样拼进 SQL
    - lane: db
      id: db
      label: 数据库：条件恒真，返回第一行用户
      highlight: true
    messages:
    - id: m1
      from: atk
      to: app
      label: 输入里藏着半句 SQL
    - id: m2
      from: app
      to: db
      label: 拼好的语句：密码校验已被注释掉
      active: true
    registers:
    - name: 关键变化
      value: 输入从「被查的数据」升格成「查询逻辑」
  log:
  - at: 注入
    text: 数据与指令共用通道，输入就能改写语句
- id: parameterized-query
  title: 第三步：参数化查询——把通道分开，一劳永逸
  tldr: 防注入不用过滤关键词，用[[参数化查询]]：SQL 的结构先发给数据库定死，用户输入随后作为纯数据单独传过去。输入里的引号与 OR 只是普通字符，永远升格不了。
  body: |-
    机制分两步。第一步，应用把带占位符的语句发给数据库：「WHERE name = ? AND password = ?」，数据库把这条语句的结构解析、编译好——此刻语句的含义已经锁死，有几个条件、怎么组合，都定了。第二步，应用把用户名和密码作为参数单独发过去，数据库把它们填进占位符当数据用。攻击者再输入 ' OR '1'='1，数据库只会去找一个名字恰好是这串字符的用户——找不到，登录失败，如此而已。

    为什么不用黑名单过滤关键词？因为过滤是和攻击者在文字游戏里缠斗：大小写、编码、注释符，绕法层出不穷，防线永远慢一步。参数化是把成因拆掉：不是「这段输入看起来不危险」，而是「输入根本没有成为指令的通道」。OWASP 的防注入速查表把参数化查询列为首选，就是这个道理。

    覆盖不到的角落要知道：表名、排序字段这类结构本身不能当参数传。实务里用白名单解决——允许的排序字段就那几个，前端传什么，后端映射到固定的列名，永远不直接拼接。
  derivation: original
  sources:
  - ref: owasp-sql-injection
    locator: "OWASP SQL Injection Prevention Cheat Sheet: 参数化查询为首选防法"
    claim: 防御 SQL 注入的首选是参数化查询（预处理语句），使输入只能作为数据绑定；无法参数化的结构部分（如排序字段）应使用白名单映射。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  code:
    lang: sql
    code: |-
      -- 结构先行：占位符的含义在编译时就锁死
      SELECT * FROM users WHERE name = ? AND password = ?
      -- 参数随后单独传入，永远只是数据：
      --   ?1 = ' OR '1'='1' --    ?2 = （任意）
    note: 输入里的引号与 OR 只是普通字符，查不到这个名字的用户，仅此而已
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: app
      label: 应用：先发结构，再发数据
    - lane: db
      id: db
      label: 数据库：结构已锁死，参数只当数据
      highlight: true
    messages:
    - id: m1
      from: app
      to: db
      label: 两步分开：含义先定，数据后填
      active: true
    registers:
    - name: 防法本质
      value: 不是过滤危险词，是拆掉成因
    - name: 覆盖不到的
      value: 表名与排序字段，用白名单映射补
  log:
  - at: 防注入
    text: 通道分开之后，注入这一类洞失去成因
- id: idor-horizontal
  title: 第四步：水平越权——登录了，不等于能看这条数据
  tldr: 回到开场的事故：改个编号看别人订单，坏的不是登录，是归属没人验。这叫水平越权：同一级别的用户之间互相串门。防法是把归属校验贴到数据上——查订单时，买家必须是当前用户。
  body: |-
    先给它定性。攻击者用的是自己的合法账号、走的是正常接口、没注入任何东西。他唯一的动作是把编号改了一位。系统验过他的登录，验过参数格式，唯独没验「这条订单的买家是不是他」。这类「同级别用户之间越界」的问题有个名字叫[[越权]]中的水平越权，也是各类安全报告里出现频率最高的漏洞类型之一，因为它的成因太朴素了：开发者默认了「能登录的人，只会看自己的东西」。

    防法要贴着数据走。最稳的写法是把当前用户写进查询条件本身：「查订单，编号等于这个，且买家编号等于当前用户」——不属于他的订单，在数据库眼里就是不存在，接口返回 404，连「存在但你不能看」都不泄露。次一等的写法是查出来之后立刻验归属再返回，也能防，但漏验的风险随接口增多而放大；把条件写进查询，是把防线焊在数据出口上。

    审查时的抓手很明确：全站逐个资源接口过一遍，凡是「凭编号取数据」的，问一句归属条件在哪。问不到答案的那个接口，就是事故候选。
  derivation: original
  sources:
  - ref: owasp-authorization
    locator: "OWASP Authorization Cheat Sheet: 对每个资源的访问都要做授权校验"
    claim: 授权校验必须针对每个被访问的资源执行，验证当前主体对该资源是否有权，而不能仅依赖登录状态；缺失即构成不安全的直接对象引用（IDOR）。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: attacker
      id: atk
      label: 攻击者：编号加一，请求照常发出
    - lane: app
      id: app
      label: 接口：查询条件里带着当前用户
    - lane: db
      id: db
      label: 数据库：别人的订单查出来就是不存在
      highlight: true
    messages:
    - id: m1
      from: atk
      to: app
      label: 改编号的请求，撞上归属条件
    - id: m2
      from: app
      to: db
      label: 编号对且买家是我，才查得到
      active: true
    registers:
    - name: 防线位置
      value: 焊在查询条件里，而不是查完再判断
    - name: 返回口径
      value: 不属于他的，一律按不存在处理
  log:
  - at: 水平越权
    text: 登录管身份，归属管数据，两道验不能互相顶替
- id: vertical-authz
  title: 第五步：垂直越权与检查点的位置——认证在门口，授权贴资源
  tldr: 另一种越权是向上的：普通用户调通了管理员接口。这引出检查点的分工：认证（你是谁）放在中间件统一做，授权（这条数据、这个功能归不归你用）必须贴着每个资源与功能点验。
  body: |-
    垂直越权的画面：退款接口是给管理员用的，页面上普通用户看不到按钮——可接口本身没验角色，普通用户拿工具直接调，一样退款成功。前端藏按钮不是权限控制，只是界面安排；接口不验，等于大门敞着，只是没挂牌。

    把检查点的位置定下来。认证放在请求链路的中间件里统一做（请求链路课的洋葱那一层）：验凭证、把当前用户挂进上下文，全站一处。授权分两半：功能级的（这个接口要管理员角色）在接口入口按[[RBAC]]的角色表验；数据级的（这条订单归不归你）在取出数据时按归属验，就是上一步的防线。两半都不可少：只验功能级，挡不住同角色之间串门；只验数据级，挡不住普通用户摸管理员功能。

    为什么不能都塞进中间件统一验？因为中间件只看得见请求本身，看不见「这条订单的买家是谁」——归属信息在数据里，校验就必须发生在数据被取出的那一刻。这就是本课设计里那句「授权贴着资源走」的全部理由。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: mw
      label: 中间件：统一验认证，你是谁
    - lane: app
      id: fn
      label: 接口入口：验功能级角色
    - lane: db
      id: own
      label: 数据出口：验归属，这条是不是你的
      highlight: true
    messages:
    - id: m1
      from: mw
      to: fn
      label: 身份先行，角色随后
    - id: m2
      from: fn
      to: own
      label: 归属只能在数据被取出时验
      active: true
    registers:
    - name: 认证的位置
      value: 中间件一处，全站统一
    - name: 授权的两半
      value: 功能级在入口，数据级贴资源
  log:
  - at: 检查点
    text: 藏按钮不是权限，接口验了才是
- id: secrets-in-code
  title: 第六步：密钥进仓库——从推送到被试用，只有几分钟
  tldr: 第三种泄露不靠攻击技巧，靠的是公开与自动化：API 密钥写进代码推到公开仓库，扫描机器人几分钟内就会把它捡走试用。密钥的正位是环境变量与密钥管理服务，且必须能轮换。
  body: |-
    先走一遍后果链。开发者图省事，把云厂商的 API 密钥直接写在配置文件里，推上了公开仓库。此刻起，专门扫描公开仓库的机器人就在全天候盯着新提交——它们按密钥的格式特征（前缀、长度）自动识别，捡到就立刻拿去调用云 API 验证。整个过程以分钟计。验证通过，这把密钥会被用来开机器挖矿、发垃圾邮件、或者把你的存储桶翻个底朝天，账单和数据一起遭殃。各云厂商与 GitHub 都有密钥扫描与告警机制，正是因为这类事故是流水线式的。

    事后补救的第一动作不是删代码——仓库的历史记录里那行密钥还在，任何人克隆过都能翻出来。正确顺序是：立刻在云控制台吊销这把密钥（按已泄露处理），换新密钥，再回头清理历史。记住这条：密钥一旦进过公开仓库，就只有「吊销」能救，删除不能。

    正道是让密钥根本不进代码：本地开发放在不进仓库的 .env 文件里，线上由部署环境注入为环境变量，规模大了用专门的密钥管理服务集中发放与审计。认证课讲密码存储管的是用户的密码，这一步管的是系统自己的密钥，两者的共同点是：秘密的存放位置，决定了它的泄露半径。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: push
      label: 开发者：密钥写进配置，推送公开
    - lane: attacker
      id: bot
      label: 扫描机器人：按格式特征几分钟内捡走
    - lane: ops
      id: cloud
      label: 云账户：密钥被拿去开机器、翻存储
      highlight: true
    messages:
    - id: m1
      from: push
      to: bot
      label: 推送即公开，自动化不需要等人发现
    - id: m2
      from: bot
      to: cloud
      label: 验证通过立刻试用，账单先到
      active: true
    registers:
    - name: 补救顺序
      value: 先吊销轮换，再清理历史，删代码救不了
    - name: 密钥正位
      value: 环境变量或密钥管理服务，不进代码
  log:
  - at: 密钥泄露
    text: 秘密进仓库等于公开，且按分钟计被利用
- id: log-masking
  title: 第七步：日志脱敏——排障的宝库也是泄露的仓库
  tldr: 密钥的第二个泄露口是日志：为了排障把请求体整个打进日志，密码、令牌、身份证号就全沉淀在日志系统里。防线是在日志出口统一脱敏：敏感字段一律掩码，规则一处维护。
  body: |-
    先想清楚日志的读者范围。数据库有严格的权限，可日志系统为了排障方便，往往运维能看、外包能看、日志服务商那边也存着一份。一条为了调试登录问题打下的日志，若把请求体原样记了，用户的密码就躺在了所有这些地方——而且日志留存动辄几个月，比请求本身活得长得多。

    脱敏的规则要具体。密码类字段（password、token、密钥）一律整段掩码或不打；身份证号、手机号、银行卡号保留头尾、中间打码（如手机号留前三后四）；支付金额这类业务字段可以留，但要和身份信息分开记。关键不在规则多细，在于执行的位置：必须在日志组件的出口统一做，靠每个开发者自觉「这条别打密码」，迟早漏一条——这和中间件收横切是同一个道理，防线要焊在管道上，不能靠人手。

    观测课讲日志时立过结构化的规矩，正好在这里合流：结构化日志的每个字段都有名字，脱敏规则才能按字段名精确执行。一堆拼字符串的日志想脱敏，只能靠正则满篇捞，捞不干净的。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: raw
      label: 原始请求：密码、令牌、身份证号都在里面
    - lane: ops
      id: mask
      label: 日志出口：按字段统一脱敏
      highlight: true
    messages:
    - id: m1
      from: raw
      to: mask
      label: 密码整段掩码，证件号留头尾打中间
      active: true
    registers:
    - name: 脱敏对象
      value: 密码与令牌整段掩码，证件号保留头尾
    - name: 执行位置
      value: 日志出口一处，不靠各人自觉
  log:
  - at: 脱敏
    text: 日志读者多、活得久，秘密进去就等于扩散
- id: defense-in-depth
  title: 第八步：纵深——任何一层都会被打穿，所以每层都设防
  tldr: 把视角拉高：这一课的每道防线单独看都不完美，参数化防不了越权，验归属防不了注入。安全的正解是纵深：传输、输入、权限、秘密、日志层层设防，一层破了还有下一层。
  body: |-
    先把前面几层摆齐。传输层有 HTTPS，保证路上不被偷听（网络学科的 TLS 讲过它的机制）；输入层有参数校验与参数化查询，保证恶意输入进不了业务、成不了指令；权限层有认证与逐资源授权，保证登录的人只能碰自己的东西与自己级别的功能；秘密层有密钥管理与日志脱敏，保证凭证与敏感信息不扩散。再往外还有一层常被忘的：依赖——你引的日志库、解析库爆出漏洞时，整个应用跟着遭殃，2021 年底的 Log4Shell 就是一夜之间全球系统一起中招的例子，防法是依赖清单要有人管、漏洞公告要有人跟。

    纵深的意义在于承认单层必破：参数化写漏一处，还有权限层兜着数据范围；权限验漏一个接口，日志与监控还能帮你发现异常访问。反过来，只靠一层的系统——比如「我们有防火墙所以内网接口不验权」——那一层破掉之时，就是全线裸奔之日。

    对前端转后端的人补一句实务：你不需要成为安全专家，但要把「这一课的防线清单」变成写接口时的默认动作。安全事故的绝大多数，不是输给高深的攻击，而是漏了这几件基本功中的一件。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: attacker
      id: atk
      label: 攻击者：打穿了其中一层
    - lane: app
      id: layers
      label: 纵深：传输、输入、权限、秘密层层在
      highlight: true
    messages:
    - id: m1
      from: atk
      to: layers
      label: 一层破了，下一层还兜着数据范围
      active: true
    registers:
    - name: 五层
      value: 传输、输入、权限、秘密、依赖
    - name: 反面
      value: 只靠一层的系统，那层破时全线裸奔
  log:
  - at: 纵深
    text: 安全不是一道墙，是一层层的筛子
- id: closing-security
  title: 第九步：收束——审查接口的三问
  tldr: 全课收成三问，拿到任何接口都能用：输入被当数据还是当指令、权限贴着资源验了没有、秘密进没进代码与日志。三问各对应一道防线，答不上来的那问就是隐患。
  body: |-
    把这一课的账并一并。注入的根源是数据与指令共用通道，参数化查询把通道分开，根治这一类；越权的根源是只验登录不验归属，防线是认证在门口统一做、授权贴着资源与功能逐个验；秘密的根源是存放位置错了，密钥进环境变量与密钥服务、日志出口统一脱敏，再加上能轮换。最后是纵深：五层防线层层在，单层被打穿不等于全线失守。

    三问再钉一遍。第一问，输入：所有外部输入是不是都经参数化与校验，有没有一处字符串拼接还开着。第二问，权限：每个凭编号取数据的接口，归属条件写在哪；每个管理功能，角色验在哪。第三问，秘密：仓库里搜一遍有没有密钥的影子，日志里翻一遍有没有密码与证件号。三问都答得上来，这个接口的安全基本功就齐了。

    下一课离开攻击面，回到建设面：服务写好了、也防住了，要把它安顿到一台真实的服务器上——进程谁来守护、请求从哪个门进、日志去哪里看。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: any
      label: 任何一个接口
    - lane: ops
      id: three
      label: 三问：输入、权限、秘密
      highlight: true
    messages:
    - id: m1
      from: any
      to: three
      label: 答不上来的那一问，就是隐患所在
      active: true
    registers:
    - name: 三问
      value: 输入当数据还是指令、权限贴没贴资源、秘密进没进代码日志
  log:
  - at: 收束
    text: 安全基本功是默认动作，不是专家专长
