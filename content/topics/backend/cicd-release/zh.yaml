id: backend/cicd-release
subject: backend
slug: cicd-release
title: CI/CD 与发布：蓝绿、金丝雀与回滚
order: 3
visual: swimlane
lanes:
  - id: dev
    label: 开发者
  - id: pipe
    label: 流水线
  - id: art
    label: 制品仓库
  - id: prod
    label: 生产环境
