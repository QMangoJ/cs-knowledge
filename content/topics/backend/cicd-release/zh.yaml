id: backend/cicd-release
subject: backend
slug: cicd-release
title: CI/CD 与发布：蓝绿、金丝雀与回滚
order: 3
visual: swimlane
lanes:
- id: dev
  label: 开发者
- id: pipe
  label: 流水线
- id: art
  label: 制品仓库
- id: prod
  label: 生产环境
logColumns:
- key: at
  label: 阶段
- key: text
  label: 发生了什么
status: published
license: CC-BY-4.0
overview:
- key: 一句话总结
  value: CI/CD 是把「从提交代码到用户用上新版本」这条路修成自动流水线：持续集成保证每次改动都被自动构建和测试，持续交付保证任何时刻都拿得出一个验过的成品，发布策略再决定这个成品以多大的步子面对真实用户。
- key: 流水线分工
  value: 一条流水线通常分五段：构建把代码变成可运行的包，测试替人把关质量，安全扫描拦下带已知漏洞的依赖，打包把成品做成镜像存进制品仓库，部署把指定版本的镜像送上线。每一段不过关，整条线就停在那一段。
- key: 只构建一次
  value: 这是整条链最容易被违反、也最重要的一条纪律：测试环境验过的那个制品，必须原样晋升到生产环境。如果上生产前重新构建一遍，依赖版本、构建时间、随机因素都可能让两个包不一样，验过的就不等于上线的。
- key: 蓝绿发布
  value: 养两套一模一样的环境，旧版在蓝、新版进绿，验证通过后把流量入口整体切到绿。它的最大优点是回滚快——切回去就是回滚；最大代价是发布期间要花两套环境的资源，且数据库这类有状态的部分很难真的备两份。
- key: 金丝雀发布
  value: 不整体切换，而是先给 1% 左右的流量用上新版本，盯着错误率与延迟看一阵子，没问题再逐步放大到全部。出事时受影响的只是那一小撮用户，代价是发布周期被拉长，且新旧两版要并存一段时间，接口与数据格式必须互相兼容。
- key: 回滚优先
  value: 成熟的发布流程是先写回滚方案、再写发布方案的：回滚触发条件是什么、谁有权按下、多久能完成、数据怎么处理。出事时再现场想回滚，等于没有回滚——这是无数发布事故复盘里重复出现的同一句结论。
- key: 谁在用
  value: 一天发布几十次的产品靠全自动流水线加金丝雀过日子；发布受监管的行业则在流水线末尾保留人工审批。规模再小也不该回到全手工：哪怕只有两个人，先把最容易出错的部署动作自动化，收益就已经成立。
summary: 上一课的 Kubernetes 能把一个镜像稳稳地跑成三个副本，可它不管这个镜像是怎么来的、验没验过、该以什么节奏换掉线上的旧版本。本课讲的就是这条上游的路：代码从提交到上线，先被持续集成反复构建与测试，再被打包成只构建一次的制品，最后由发布策略决定它面对真实用户的步子——是一刀切过去的蓝绿，还是先放一小撮流量试水的金丝雀。而整条路的保险丝，是一个必须先于发布设计好的东西：回滚。
premise: 这节课从一个经典事故现场开始：周五下午，手工上线，文件传错了一版，回滚时才发现没人记得清上一个版本到底是哪个。手工发布的问题从来不是某个人不仔细，而是每一步都靠人，就必然有一步会出错。流水线要消灭的不是某个错误，而是「靠人保证不出错」这件事本身。
position: 本课位于后端工程学科的第三段「发布：CI/CD 与上线策略」，接在《Kubernetes》之后：编排系统负责把镜像跑好，本课负责镜像从代码到集群的这段路。它与第一课也有一条暗线——流水线层层验过的制品，正是第一课讲的那个自带环境的镜像；与下一课的暗线是：金丝雀放量时盯的那些指标，就是可观测性的主场。
level: 进阶
minutes: 26
prereq:
- backend/docker-containers
objectives:
- 能说清持续集成、持续交付、持续部署三者的区别与递进关系
- 能列出流水线的典型分段，并解释每一道关存在的理由
- 能对比蓝绿与金丝雀的账：切换方式、回滚速度、资源代价、适用场景
- 能解释为什么回滚必须先于发布设计，以及代码回滚与数据回滚的难度差
aiLink: 本课只有一条主线：让每一次变更都小到可控、验到可信、退到可回。流水线负责「验」，发布策略负责「小步」，回滚设计负责「可退」。
bridge:
  prev: 上一课的 Kubernetes 只认镜像：你给它一个新版本的镜像，它就能滚动着把旧副本换掉。可镜像是谁造的、造得对不对、换版的节奏该多快多慢，它一概不管——那正是本课这条流水线要补上的上半场。
  next: 金丝雀放量时要盯错误率与延迟，回滚触发要靠告警——可这些数字从哪来、怎么组织、出事时怎么帮人定位？下一课讲可观测性：日志、指标与链路追踪这三类数据，是发布之后判断一切的眼睛。
design:
- mechanism: 制品只构建一次
  problem: 如果测试环境与生产环境各构建一遍，两次构建之间依赖版本、工具链状态、时间戳都可能不同，验过的包和上线的包就不是同一个东西，测试结论随之作废。
  choice: 构建只发生一次，产物带着版本号存进制品仓库；之后所有环境的部署都只是「取同一个制品来运行」，环境之间只差配置不差包。
  tradeoff: 制品仓库成了要认真维护的基础设施：版本要可追溯、旧版本要保留到回滚窗口结束，存储与清理都要有规矩。
  root: 质量保证的对象必须是最终上线的那个二进制本身，任何「同源重建」在严格意义上都是另一个对象——这条纪律守的是证据链。
- mechanism: 先小流量试水再放大
  problem: 测试再全，也盖不住真实流量的组合：数据形状、并发时序、第三方依赖的状态，都只有生产环境才有。全量发布等于让全体用户同时替你做最后一轮测试。
  choice: 用金丝雀或分批滚动把「发布」从一个瞬间动作改成一个可观察的过程：先放小比例，盯着指标做决定，好就放大，坏就退回。
  tradeoff: 发布周期被拉长，新旧两版必须并存且互相兼容，数据库与接口的变更都要为这种并存留余地。
  root: 风险没法靠测试消灭，只能靠控制爆炸半径来管理：让每次变更先只影响最小的人群，拿真实数据换决策依据。
- mechanism: 回滚方案先于发布写好
  problem: 事故现场是最差的设计环境：人紧张、时间紧、信息还不全。在现场临时拼凑回滚步骤，漏掉配置、数据、顺序中的任何一环，都会让故障雪上加霜。
  choice: 把回滚做成发布方案的第一部分：触发条件、执行人、步骤、预计耗时、数据处理方式，全部预先写明并演练，让回滚退化成一个照单执行的动作。
  tradeoff: 每次发布都要为「可能用不上」的回滚付设计与演练成本，且有些变更（比如已落库的数据格式）本质上不可逆，只能靠向前修复。
  root: 发布的安全感不来自「这次肯定没问题」，而来自「出问题时我知道怎么退、且退得动」——可逆性才是高频发布真正的地基。
quiz:
- q: 持续交付与持续部署的区别是？
  options:
  - 没有区别，两种叫法而已
  - 持续交付保证随时能发布、最后一步保留人工确认；持续部署连确认也去掉，通过检查就自动上线
  - 持续部署只适用于小项目
  - 持续交付不需要自动化测试
  answer: 1
  explain: 两者的分界线就是生产发布前那个按钮：留着它、随时可点，是持续交付；拆掉它、全自动上线，是持续部署。后者对测试与回滚能力的要求更高。
- q: 为什么「制品只构建一次」如此重要？
  options:
  - 为了节省构建机器的电费
  - 因为重新构建出的包可能与验过的包不完全一样，验过的结论就不能算数在上线的包头上
  - 构建一次可以让版本号更好看
  - 仓库放不下太多版本
  answer: 1
  explain: 依赖版本、工具链、时间戳都会让两次构建产生差异。质量保证必须作用于最终上线的那个二进制本身，晋升而不是重建，守的是这条证据链。
- q: 蓝绿发布最大的优点与最大的代价分别是？
  options:
  - 优点省钱，代价回滚慢
  - 优点是回滚快（把入口切回旧环境即可），代价是发布期间要养两套环境的资源
  - 优点是不用测试，代价是要写很多脚本
  - 优点是流量切换细腻，代价是用户能察觉
  answer: 1
  explain: 蓝绿的切换与回滚都是「改入口指向」这一个动作，所以快且干净；代价同样来自这个结构——两套环境双倍资源，且数据库等有状态部分很难复制成两套。
- q: 金丝雀发布进行到 5% 流量时新版本错误率明显升高，最合理的动作是？
  options:
  - 继续放大到 50%，样本大一点再看
  - 立即把流量切回旧版本，只让这 5% 的影响到此为止，然后离线查原因
  - 先给用户发公告解释
  - 把告警关掉避免打扰
  answer: 1
  explain: 金丝雀的全部意义就是控制爆炸半径：小比例阶段发现问题，就在小比例阶段结束它。把问题放大再观察，等于亲手拆掉这道保险。
steps:
- id: friday-manual-deploy
  title: 第一步：场景——周五下午的手工上线
  tldr: 把一次经典事故复盘一遍：手工打包、手工传文件、手工改配置，上线后才发现传错了一版，想回滚却没人说得清上一个版本是哪个。流水线要治的病，全在这场事故里。
  body: |-
    先看场景。周五下午四点，一个后端服务要上线新版本。流程是祖传的手工五步：负责人在自己电脑上打包，把包传到服务器，备份旧文件，替换，重启，再打开页面看一眼——没报错，就算上线成功。四点半，客服转来投诉：用户数据看不见了。众人连忙排查，最后发现传上去的包是昨天下午打的旧包，新代码根本没上线，而配置却已经按新版改了，两边对不上才出的故障。

    更难受的还在后面：决定回滚时，大家发现备份的旧文件被上一次的人覆盖过一次，谁也说不清现在服务器上跑的到底混合了哪几个版本。一场原本二十分钟的发布，最后折腾到晚上九点。这类事故的复盘结论从来不是「下次小心点」——靠人小心的环节，只要重复次数够多，出错就是必然。

    这就是 CI/CD 要解决的问题：把从提交代码到上线这条路上的每一步，从「人照着文档操作」改成「机器照着流水线执行」。人负责写规则与处理异常，重复动作交给机器——机器不会把昨天的包当成今天的，也不会在第四步漏掉备份。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: dev
      id: human
      label: 发布的人：打包、传文件、改配置全靠手
    - lane: prod
      id: server
      label: 生产服务器：版本混杂，谁也说不清
      highlight: true
    messages:
    - id: m1
      from: human
      to: server
      label: 传错一版、备份被覆盖，故障折腾到晚上
      active: true
    registers:
    - name: 病根
      value: 每一步靠人保证不出错，重复够多次必然出错
    - name: 解法方向
      value: 重复动作交给机器，人只写规则与处理异常
  log:
  - at: 场景
    text: 手工发布的事故不是粗心，是流程本身没有防错
- id: ci
  title: 第二步：持续集成——每次提交都自动验一遍
  tldr: 持续集成治的是「攒着合并」的老毛病：每个人写完就往主干合，每次合并都触发自动构建与测试，坏代码在几分钟内就被拦下，而不是攒到发布日一起爆。
  body: |-
    先看它治的病。没有持续集成时，常见画面是：五个人各开一条分支写一周，到合并日把代码往一起凑——冲突成片出现，好不容易合完，构建失败，测试红了一大片，谁的改动弄坏的都分不清。集成的痛苦随攒的时间指数上升，最后大家开始害怕合并，分支越拉越长，恶性循环。

    [[持续集成]]把这个节奏倒过来：改动要勤合并，最好每天都往主干合；每一次合并，服务器自动把代码拉下来，完整构建一遍、把自动化测试跑一遍，几分钟内给出红绿灯。红了，提交者立刻知道是自己这次改动的问题，趁热修掉。集成的成本被切碎成每天几分钟的小额支付，而不是月底一次还清的高利贷。

    它能成立有两个前提，都不轻松。一是测试要够快：一条流水线要跑四十分钟，大家就会开始绕过它、攒着提交，前功尽弃。二是测试要可信：一个天天误报的测试套件，比没有测试更糟——大家会学会无视红灯。所以持续集成的真正投入不在服务器，而在把测试养得又快又准。
  derivation: original
  sources:
  - ref: fowler-continuous-integration
    locator: "Continuous Integration：勤合并、自动构建、自动测试与快速反馈的核心实践"
    claim: 持续集成要求开发者频繁把改动合入主干，每次合入都触发自动构建与测试，让集成问题在几分钟内暴露，而非攒到发布时集中爆发。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: dev
      id: committer
      label: 提交者：小步改动，天天往主干合
    - lane: pipe
      id: ci-server
      label: 集成服务器：每次合并自动构建加测试
      highlight: true
    messages:
    - id: m1
      from: committer
      to: ci-server
      label: 合并即触发，几分钟内给出红绿灯
      active: true
    registers:
    - name: 前提一
      value: 测试要快，慢流水线会被大家绕过去
    - name: 前提二
      value: 测试要可信，天天误报的红灯等于没有红灯
  log:
  - at: 集成
    text: 把集成的账切碎成每天几分钟的小额支付
- id: cd-two-meanings
  title: 第三步：持续交付与持续部署——一个按钮之差
  tldr: CI 保证了改动随时验得过，再往前一步是 CD 的问题：成品要不要自动送上生产？持续交付留一个人工按钮，持续部署连按钮也拆掉。两种选法对应不同的风险偏好。
  body: |-
    先把两个词分清。[[持续交付]]说的是：每一次通过检查的改动，都自动打包成一个随时可以发布的成品，摆在货架上；真正按下发布按钮的动作，保留给人来确认。它保证的是一种状态——「我们随时能发布」，而不是「我们一直在发布」。[[持续部署]]则把按钮也拆掉：通过全部检查的改动，直接自动上线到生产环境，中间没有人工环节。

    选哪种，看的是出错的代价与发布的频率。一天要发布几十次的消费级产品，人工确认会成为瓶颈、且每次变更都很小，持续部署更合算；而受监管的行业、或者一次发布牵动资金与合规的系统，留一个按钮让人看一眼发布清单，是必要的成本。要注意按钮的价值不在「看一眼代码」——代码在 CI 阶段已经被机器验过——而在时机判断：避开业务高峰、避开大促、等依赖方就位，这些是流程之外的现实判断。

    无论选哪种，它们共享同一个地基：没有可信的自动化测试与回滚能力，按钮拆不拆都轮不到讨论——那是第六到第十步的内容。
  derivation: original
  sources:
  - ref: fowler-continuous-delivery
    locator: "Continuous Delivery：随时可发布的状态与部署流水线"
    claim: 持续交付的目标是让软件始终处于可发布状态、发布成为低风险的常规动作；持续部署是其进一步形态，通过检查的改动自动进入生产。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: pipe
      id: shelf
      label: 货架：每个验过的改动都是一个成品
    - lane: prod
      id: button
      label: 那个按钮：留给人，还是拆掉
      highlight: true
    messages:
    - id: m1
      from: shelf
      to: button
      label: 交付保证随时能发，部署保证一直在发
      active: true
    registers:
    - name: 按钮的价值
      value: 不在复查代码，在判断时机：高峰、大促、依赖方状态
  log:
  - at: 交付
    text: 一个按钮之差，分开交付与部署两种风险偏好
- id: pipeline-stages
  title: 第四步：流水线的分工——五道关各管什么
  tldr: 把一条典型流水线拆开看：构建、测试、安全扫描、打包、部署，每一道关拦的都是不同种类的事故。理解每道关存在的理由，才知道哪道关不能为了赶时间跳过。
  body: |-
    流水线不是一个笼统的黑盒，它是一串分工明确的关。第一关构建：把代码编译、打包成可运行的形态，这一关拦的是「代码根本跑不起来」——语法错误、依赖缺失、资源文件漏带。第二关测试：单元测试、接口测试成批跑过，拦的是「能跑但行为不对」。第三关安全扫描：把依赖库与镜像逐项比对已知的漏洞名单，拦的是「自己没写错，但用的库带着已公开的洞」——这类问题靠人看代码是看不出来的。

    第四关打包：把验过的东西做成[[制品]]——在容器世界里就是镜像——打上版本号，存进制品仓库。第五关部署：把指定版本的制品送到目标环境去运行，在 Kubernetes 的世界里，就是把新镜像的声明提交给集群。五关的共同规矩是：一关不过，整条线停在那关，不许绕行；且越靠前的关越要快——构建与单元测试以分钟计，大家才有耐心等它，慢关往后放、并行跑。

    分工清楚之后，排障也有了地图：线停在扫描关，去查依赖；停在部署关，去查集群与配置。流水线的另一重价值就在这里——它把「上线前要检查的一切」从老员工的脑子里，搬成了所有人看得见的一串关卡。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: dev
      id: change
      label: 一次改动：从代码开始过关
    - lane: pipe
      id: gates
      label: 五道关：构建、测试、扫描、打包、部署
      highlight: true
    - lane: art
      id: artifact
      label: 制品仓库：过关的成品带版本号存档
    messages:
    - id: m1
      from: change
      to: gates
      label: 一关不过整条线停住，不许绕行
    - id: m2
      from: gates
      to: artifact
      label: 全部过关才打包存档
      active: true
    registers:
    - name: 每关拦的事故
      value: 构建拦跑不起来，测试拦行为不对，扫描拦依赖带洞
    - name: 速度规矩
      value: 越靠前的关越要快，慢关靠后放并并行
  log:
  - at: 分工
    text: 流水线把检查清单从人脑里搬成看得见的关卡
- id: build-once
  title: 第五步：制品只构建一次——验过的必须等于上线的
  tldr: 一条最容易被偷工的纪律：测试环境验过的包，要原样送上生产。如果生产部署前重新构建一遍，哪怕源码相同，两个包也可能不一样，全部测试结论随之作废。
  body: |-
    先看违反它的事故长什么样。某次发布，测试环境一切正常，上生产前运维「为了保险」用生产配置重新构建了一遍。偏偏这两天里，一个依赖库刚发布了小版本，构建工具自动取了新版——新版改了一个默认行为。上线半小时，接口开始间歇性报错。排查的人对着测试环境死活复现不出来，因为两个环境跑的根本不是同一个包。这个故事的每个零件都是真实存在的：依赖漂移、构建工具的自动升级、时间戳与随机顺序，都会让「同源重建」不等于「同一个包」。

    纪律因此定得很硬：[[制品]]只构建一次。流水线在打包关产出带版本号的成品——容器场景下就是带标签的镜像——存进制品仓库；测试环境部署的是它，预发环境部署的是它，生产环境部署的还是它，环境之间只允许配置不同，包本身一个字节都不许变。这样，测试结论才严格地作用于上线的那个东西。

    这条纪律还顺带给了回滚一份礼物：上一个版本的制品原封不动地躺在仓库里，回滚在制品层面就退化为「换回旧版本号重新部署」，不需要现场重新构建一个可能已经构建不出来的旧包。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: art
      id: oneartifact
      label: 同一个制品：测试、预发、生产都用它
    - lane: prod
      id: envs
      label: 各环境：只差配置，不差包
      highlight: true
    messages:
    - id: m1
      from: oneartifact
      to: envs
      label: 晋升而不是重建，版本号一路到底
      active: true
    registers:
    - name: 漂移来源
      value: 依赖小版本、工具自动升级、时间戳，都会让重建变味
    - name: 附带好处
      value: 旧制品躺在仓库里，回滚就是换回旧版本号
  log:
  - at: 纪律
    text: 只构建一次，守的是测试结论与上线实物的同一性
- id: blue-green
  title: 第六步：蓝绿发布——两套环境，一次切换
  tldr: 蓝绿是最干脆的发布策略：旧版在蓝环境跑着，新版整套部署到绿环境，验证通过就把流量入口整体切过去。切换与回滚都是同一个动作，这是它最大的魅力与代价的来源。
  body: |-
    先把画面摆出来。线上有一套正在服务的环境，叫它蓝；你再备一套与它一模一样的绿，把新版本整套部署到绿上面，但先不给真实流量，只用测试请求把绿验证一遍。验证通过，在负载均衡或网关上改一下指向：全部流量从蓝切到绿。用户侧的感受是某一瞬间服务换了个版本，中间没有新旧混跑的阶段。

    它最大的优点在回滚：切过去十分钟发现新版有问题，把指向改回蓝，一分钟内全量回到旧版本，干净利落——因为蓝在整个过程中原封不动地待命着。这份底气是其他策略很难给的。[[蓝绿发布]]因此特别适合那种「要么全对、要么全退」的变更，比如底层框架升级、运行时大版本切换，这类变更没法只放一点点流量试。

    代价同样来自它的结构：发布期间要同时养两套完整环境，资源成本直接翻倍；而且有一样东西复制不了第二份——数据库。新旧两版通常只能共用同一个库，于是数据库变更必须同时兼容新旧两个版本，这给表结构变更套上了紧箍。蓝绿的账可以总结成：拿双倍资源与数据兼容的约束，换切换与回滚的干脆。
  derivation: original
  sources:
  - ref: fowler-bluegreen
    locator: "Blue Green Deployment：双环境切换与回滚的机制"
    claim: 蓝绿发布维护两套相同环境，流量在验证后整体切换，回滚即切回旧环境；数据库变更需兼容新旧两版是其主要难点。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: pipe
      id: switcher
      label: 入口：指向蓝，或指向绿
    - lane: prod
      id: bluegreen
      label: 蓝在服务、绿待命，验证后整体切换
      highlight: true
    messages:
    - id: m1
      from: switcher
      to: bluegreen
      label: 切换与回滚是同一个动作：改指向
      active: true
    registers:
    - name: 优点
      value: 回滚就是切回去，一分钟全量回到旧版
    - name: 代价
      value: 双倍环境资源，数据库变更要同时兼容两版
  log:
  - at: 蓝绿
    text: 拿双倍资源，换切换与回滚的干脆利落
- id: canary
  title: 第七步：金丝雀发布——先让 1% 的流量试水
  tldr: 与蓝绿的一刀切相反，金丝雀先把新版本放给极小一撮流量，盯着指标观察一段时间，好就逐步放大，坏就当场收回。它的核心思想是：用最小的爆炸半径换真实数据的判断。
  body: |-
    名字先说一下来历：早年矿工下井会带一只金丝雀，井下有毒气时金丝雀先遭殃，矿工就知道该撤了。[[金丝雀发布]]借的就是这个意象：让一小撮真实流量先替所有人试新版本。具体做法是新旧两版同时在线，按比例把请求分流——先给新版 1%，观察一阵；没问题，放到 5%、20%、50%，最后到 100%，新版转正、旧版下线。比例也可以按人群切，比如先只给内部员工或某个地区的用户。

    它换来的东西，蓝绿给不了：真实流量下的真实判断。测试环境再像生产，数据形状、并发时序、第三方服务的脾气都学不全；金丝雀让这些问题在只影响 1% 用户时就暴露出来，而且暴露的是带完整现场的真问题。出事时把比例调回 0，受影响的就到此为止。

    代价有两笔。一是时间：一轮金丝雀走完常常要几小时甚至跨天，发布从「一个动作」变成「一个过程」，急着全量的热修复不适合慢慢放。二是兼容：放量期间新旧两版同时在服务，两版之间的接口、消息格式、共用的数据结构必须互相兼容——新版写的字段旧版读到不能崩。这条兼容约束会反过来塑造你写代码的方式，下一课讲可观测性时还会回来：放量期间盯的那些指标，正是它存在的理由。
  derivation: original
  sources:
  - ref: fowler-canary
    locator: "Canary Release：按比例逐步放量并观察的发布方式"
    claim: 金丝雀发布先将新版本开放给一小部分用户，验证无误后逐步扩大比例，出问题时可快速收回，把发布的风险半径控制在最小范围。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: pipe
      id: splitter
      label: 分流：先给新版 1%，逐级放大
    - lane: prod
      id: canarypods
      label: 新旧两版并存，指标盯着新版看
      highlight: true
    messages:
    - id: m1
      from: splitter
      to: canarypods
      label: 出事就把比例调回 0，影响到此为止
      active: true
    registers:
    - name: 换来的
      value: 真实流量下的真实判断，问题在 1% 时暴露
    - name: 代价
      value: 周期拉长，两版并存期间接口与数据必须兼容
  log:
  - at: 金丝雀
    text: 用最小爆炸半径，换真实数据的判断依据
- id: canary-judgement
  title: 第八步：金丝雀的判定——盯什么、何时停手
  tldr: 放量不是开闸放水等时间到，而是带着判定标准放：错误率、延迟与业务指标哪条越线就自动收回。这一步把判定怎么做、为什么必须自动化讲清楚。
  body: |-
    先说盯什么。技术指标看两类最要紧的：新版的错误率——它和旧版同期比是高了还是低了；新版的响应延迟——尤其是尾部那批最慢的请求有没有变差。业务指标看这次改动直接影响的那个数：下单成功率、支付转化率这类。判定的关键是「和旧版同期对比」，而不是看绝对值：大促期间错误率整体都会涨，只有新版比旧版多涨的那部分，才是新版的问题。

    再说为什么判定必须自动化。人盯着图表做决定有两个毛病：一是慢，凌晨的发布没人盯得住；二是心软，看着指标在红线边缘徘徊，总想「再观察五分钟」，而事故正是在犹豫里放大的。成熟的流水线把判定写成规则：金丝雀阶段新版错误率超过旧版某个幅度，自动把流量切回 0 并告警；全部达标，才自动晋升到下一档比例。人退到规则之外，只处理规则没覆盖的异常。

    这里要点出一条暗线：判定依赖的错误率、延迟数据，正是下一课可观测性要讲的指标体系。没有平时就建好的指标与告警，金丝雀就只能靠手感——发布策略的天花板，是观测能力的天花板。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: pipe
      id: judge2
      label: 自动判定：越线即收回，达标才晋升
    - lane: prod
      id: metrics2
      label: 新版指标：错误率与延迟，与旧版同期对比
      highlight: true
    messages:
    - id: m1
      from: metrics2
      to: judge2
      label: 只比新版比旧版多出来的那部分异常
      active: true
    registers:
    - name: 判据
      value: 错误率与尾部延迟为主，业务指标按改动选
    - name: 为什么自动
      value: 人盯图又慢又心软，规则不会犹豫
  log:
  - at: 判定
    text: 发布策略的天花板，是观测能力的天花板
- id: rollback-first
  title: 第九步：回滚要先于发布设计
  tldr: 一条被无数事故验证过的规矩：发布方案的第一部分应该是回滚方案。触发条件、执行步骤、预计耗时、数据处理，全部预先写死并演练过，出事时照单执行，而不是现场发明。
  body: |-
    先想象没有它的现场：新版上线十分钟，错误率飙升，群里开始讨论「要不要回滚」。回滚的步骤在谁的脑子里？上一个版本的制品还在吗？配置要不要跟着改回去？数据库刚执行的那条变更能不能撤销？每个问题都要现场确认，而现场的时钟是按用户流失速度走的。事故复盘里反复出现的一句话是：回滚本身不难，难的是出事时才发现回滚没准备。

    所以顺序要倒过来：写发布方案时，先写[[回滚]]——什么指标到什么程度就触发、谁有权决定、步骤一二三是什么、预计多久完成、回滚后要验证什么。还要真的演练过：很多团队第一次演练回滚时才发现，旧制品早被清理了、回滚脚本半年没用过已经失效。演练的意义就是提前拆掉这些哑弹。

    最后必须点破一层难度差：代码回滚容易，数据回滚难。新版代码往数据库里写了新格式的数据，切回旧版，旧代码读不懂新数据，照样出事。对付它的通用办法是让数据变更永远向后兼容：加字段可以、删字段要分两步，先发一个不依赖新字段的版本过渡，等新版站稳了再清理——这类「扩张、收缩分两步」的打法，是为回滚留后路的必然结果。回滚设计得越认真，你对变更的拆分就越保守，这不是胆小，是账算清了。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: pipe
      id: plan
      label: 发布方案：第一部分先写回滚
    - lane: prod
      id: incident
      label: 事故现场：照单执行，不现场发明
      highlight: true
    messages:
    - id: m1
      from: plan
      to: incident
      label: 触发条件、步骤、耗时，全部预先写死
      active: true
    registers:
    - name: 难度差
      value: 代码回滚是换版本，数据回滚要处理已落库的新格式
    - name: 对策
      value: 数据变更永远向后兼容，增删字段分两步走
  log:
  - at: 回滚
    text: 出事时才想回滚，等于没有回滚
- id: feature-flags
  title: 第十步：功能开关——把「部署」与「上线」拆开
  tldr: 再往前一步的解耦：代码可以先部署上去，但功能用开关关着，等时机到了再远程打开。出事时关开关比回滚更快，它也因此成了金丝雀之外的另一种放量工具。
  body: |-
    先分清两个一直被混在一起的动作：部署是把新代码送到生产环境运行，上线是让用户真正用上新功能。传统发布把它们绑死：部署完成的那一刻，功能就对所有人打开了。[[功能开关]]做的事就是把这两件事拆开：新功能代码里留一个开关，部署时开关是关的，代码在线上跑着但功能不露面；等你选好时机——比如先给内部员工、再给 1% 用户——远程把开关逐级打开。

    它在事故现场的价值最直观：新功能出问题，关掉开关，几秒钟功能下线，连回滚都省了——代码还在机器上躺着，只是用户看不见了。它也能做比金丝雀更细的分流：金丝雀按流量比例切，开关可以按用户名单切，同一个版本里，A 用户看到新界面、B 用户还是旧界面，A/B 实验就是建立在这套机制上的。

    代价是开关会攒债：每个开关都是代码里的一条分支路径，开多了，组合爆炸，测试要覆盖的路径翻倍；用完的开关不及时拆，代码里会躺满没人敢动的死开关。所以开关要有台账、有期限：短期发布开关用完即拆，只有少数长期开关（比如按客户分级的功能权限）才常驻。工具越顺手，越要防它把代码拖进泥潭。
  derivation: original
  sources:
  - ref: fowler-feature-toggles
    locator: "Feature Toggles：开关的分类、发布开关与长期开关的管理"
    claim: 功能开关把功能启用与代码部署解耦，发布型开关用于安全放量与快速关闭，但需要管理与清理，避免开关长期堆积造成复杂度失控。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: pipe
      id: toggle
      label: 开关：关着部署，按名单逐级打开
    - lane: prod
      id: feature
      label: 新功能：代码在线上，露面由开关决定
      highlight: true
    messages:
    - id: m1
      from: toggle
      to: feature
      label: 出事关开关，几秒下线，连回滚都省了
      active: true
    registers:
    - name: 更细的分流
      value: 金丝雀按流量比例切，开关可以按用户名单切
    - name: 开关债
      value: 短期开关用完即拆，攒多了代码路径会爆炸
  log:
  - at: 开关
    text: 部署与上线拆开，放量与下线都有了更细的把手
- id: costs-minimum
  title: 第十一步：收束——小团队的最小可用版
  tldr: 全套 CI/CD 不是开局就建得起的。这一步给一条务实的推进顺序：先自动化最痛的一步，再补门禁，最后上放量策略——按疼痛程度排队，而不是按架构图排队。
  body: |-
    先给结论：这条链的正确建法是按疼痛排队。第一步，先把部署动作本身自动化——哪怕只是一个脚本把「拉制品、换版本、重启、看一眼健康检查」串起来，手工传错包这类事故当场绝迹，投入最小、见效最快。第二步，补上持续集成与测试门禁，让坏代码在进货架之前就被拦下。第三步，制品仓库与版本号规矩立起来，回滚从此有据可依。最后才轮到金丝雀、自动判定这些高级件——它们依赖的观测能力，往往是团队最后才补齐的一块。

    反过来建是最常见的弯路：一上来就照着大厂架构图搭全套平台，三个月过去流水线还没跑通，团队对「搞 CI/CD」先累出了抵触。工具链的每一件都应该能指着一个具体的痛说「我是来治这个的」，指不出来的，就先别建。

    整课收成三句：流水线让变更验得可信，发布策略让变更小步可控，回滚设计让变更退得回去。三者齐了，发布才从「周五下午的赌博」变成「随时可做的日常」。下一课补上最后一块：发布之后，你靠什么知道系统还好——日志、指标与链路追踪。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: dev
      id: smallteam
      label: 小团队：从最痛的一步开始自动化
    - lane: pipe
      id: roadmap
      label: 推进顺序：部署、门禁、制品、放量策略
      highlight: true
    messages:
    - id: m1
      from: smallteam
      to: roadmap
      label: 每件工具都要能指出它治的是哪个痛
      active: true
    registers:
    - name: 三句收束
      value: 验得可信、小步可控、退得回去，发布才成为日常
  log:
  - at: 收束
    text: 流水线补上游，观测补下游，下一课讲眼睛
