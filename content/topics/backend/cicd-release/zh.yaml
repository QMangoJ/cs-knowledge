    label: 发生了什么
status: published
license: CC-BY-4.0
overview:
  - key: 一句话总结
    value: CI/CD 把「改一行代码到用户用上新功能」修成带自动刹车的轨道：[[持续集成]]每次合并自动验代码，[[流水线]]把唯一[[制品]]一路晋升，发布策略与[[回滚]]预案把线上爆炸半径锁到最小。
  - key: 五道关卡
    value: 典型流水线串联构建、自动化测试、安全漏洞扫描、打包归档与环境部署五关：快关放前面秒级反馈，任何一关亮红灯全线立停，绝不允许带病绕行。
  - key: 只构建一次
    value: 测试环境验过的那个带哈希标签的镜像，必须原封不动晋升到预发和生产；临上生产前「重新编译一遍」会引入依赖与环境漂移，让前序测试结论当场作废。
  - key: 蓝绿发布
    value: 蓝环境跑旧版、绿环境备好全量新版，冒烟验通后改[[网关]]指向一刀切过去；最大底气是一秒切回蓝即可回滚，代价是双倍机器开销与共用数据库的兼容约束。
  - key: 金丝雀发布
    value: 先拨 1% 真实流量给新版试毒，紧盯与旧版同期的错误率和尾部延迟差值，达标再按 5% → 20% → 100% 放大；把未知生产缺陷锁在最小受灾面里。
  - key: 回滚与开关
    value: 回滚预案必须先于发布动笔，数据库改表要用「先扩后缩」两步法留退路；[[功能开关]]则进一步把代码部署与功能露面拆开，出事一秒关闸止血。
  - key: 推进顺序
    value: 日发几十版的大团队靠全自动流水线配金丝雀；两三人的小团队也别退回手工拷包，先把部署写成一键脚本，第一天就能收回成本。
summary: |-
  CI/CD 与发布策略靠三道防线终结手工上线的赌博：[[持续集成]]在每次代码合入主干时自动构建并跑完测试，几分钟内揪出破坏性改动；[[流水线]]死守「[[制品]]只构建一次」铁律，让同一个镜像跨测试、预发、生产原样晋升；上线环节再用[[蓝绿发布]]、[[金丝雀发布]]或[[功能开关]]管住放量步幅，配合预先演练好的[[回滚]]方案与向后兼容的数据改表，让发版从惊心动魄的周末加班变成随时可做的日常小事。
premise: 周五下午四点，工程师手工给订单服务发新优惠券版本：本机打包、传上服务器、备份旧目录、改完新配置重启。四点半客服炸锅——订单页全白了。排查才发现手滑传成了昨天下午打的旧包，新配置撞上旧代码当场崩盘；等决定回退时更傻眼，备份文件夹上周就被人覆盖过，谁也拼不出线上原本跑的是哪一版，五个人围着终端折腾到晚上九点。手工发版从来不是输在某个人粗心，而是每一步靠人盯就迟早有一步漏掉——怎样把上线修成一条不会传错包、出事能秒退的自动轨道？
position: 本课位于后端工程学科第三板块「发布：CI/CD 与上线策略」，承接《Kubernetes》并串联前后。第一课封好的容器镜像是本课流水线唯一流转的制品，第二课的集群控制器是本课部署关的落脚点，而金丝雀放量时紧盯的错误率与尾部延迟，则直接引出下一课的可观测性体系。
level: 进阶
minutes: 26
prereq:
  - backend/docker-containers
objectives:
  - 分清持续集成、持续交付与持续部署的边界，说明生产门前保留人工按钮的真实作用
  - 说出流水线五道关卡各自拦截的故障类型，解释为什么「制品只构建一次」不能妥协
  - 算清蓝绿发布、金丝雀发布与功能开关在机器成本、放量粒度、回滚速度与兼容性上的取舍
  - 解释代码回滚与数据库回滚的难度差，能用「先扩后缩」两步法设计可回滚的改表方案
aiLink: 大模型应用把这套流水线延伸到了提示词与模型权重上：每次改系统提示词或微调模型，CI 会先跑几百条评测集（Eval）自动打分防退化；上线时先靠[[金丝雀发布]]和[[功能开关]]切 1% 真实对话，对比新旧模型的拒答率、幻觉率与首字延迟，一旦指标劣化立刻远程关闸切回旧模型，不必重发整套后端代码。
bridge:
  prev: 上一课的 Kubernetes 只管照单干活：你递给它一个 order-service:v1.3 镜像，它就能滚动替换旧副本。可这个镜像是谁打出来的、有没有夹带漏洞、上线时该一刀切还是先放 1% 流量试水，全靠本课这条上游流水线拍板。
  next: 金丝雀自动晋升要对比错误率与尾部延迟，一键回滚要靠告警吹哨——可线上几十台机器每分每秒都在跑，这些健康信号平时从哪采、出事怎么顺藤摸瓜抓出慢在哪一环？下一课进入可观测性三支柱。
design:
  - mechanism: 制品只构建一次，跨环境原样晋升
    problem: 如果测试环境打一次包、上生产前又拿源码重打一次包，两次构建之间第三方依赖的小版本浮动、构建机缓存或编译时间戳都会让两个包暗中走样，前序测试验过的根本不是最终上线的那个东西。
    choice: 整条流水线只在打包关编译生成一次带唯一哈希标签的制品（如 order-service:git-a1b2c3d）存入仓库，测试、预发、生产拉取的永远是同一串字节，环境差异一律抽成外部配置注入。
    tradeoff: 团队必须把配置与代码彻底剥离，还得认真维护制品仓库的不可变标签与历史版本保留期，不能再图省事往包里硬写环境地址。
    root: 质量检验的结论只对被检验的那个二进制本体有效；任何「同源码重新编译」严格说都是造出了一个未经检验的新物件，原样晋升守住的是证据链不断裂。
  - mechanism: 按比例渐进放量，拿小范围真实流量换判断
    problem: 预发测试造得再逼真，也模拟不全生产环境的奇葩历史数据、高并发争抢与下游第三方抖动；一上来 100% 全量替换，等于拉全体真实用户陪新代码赌命。
    choice: 把「发布」从一个瞬间动作拆成一段可刹车的渐进过程：先拨 1% 流量给新版本，自动对比新旧两版的错误率与延迟，站稳一档再升一档，越线当场归零。
    tradeoff: 单次发版耗时从几分钟拉长到几小时，而且放量期间新旧两版同时读写同一个数据库、互调接口，逼着每次改动都得做好双向兼容。
    root: 未知风险无法在上线前靠静态检查 100% 算尽，唯一稳妥的办法是锁死单次试错的爆炸半径——用 1% 的可控代价换回 100% 真实的生产反馈。
  - mechanism: 回滚预案与数据兼容先于发布设计
    problem: 线上报错飙升的事故现场分秒必争、人心慌乱，如果等出事了才去翻旧包在哪、临时琢磨刚跑完的删字段 SQL 怎么撤回，越忙越乱往往酿成二次雪崩。
    choice: 把回滚触发阈值、一键退版命令和验证步骤写成发版方案的第一节并提前演练；涉及数据库结构变更时强制采用向后兼容的「先扩后缩」分步发版。
    tradeoff: 每次改动都要多付一份兼容设计与回滚演练成本，删一个废弃字段也得拆成前后两次发版慢慢收尾，短期看变啰嗦了。
    root: 高频发版的底气从来不是「我保证这次绝对没 bug」，而是「就算有 bug 我也能在两分钟内无损退回来」——可逆性才是敢于天天发版的真正护城河。
quiz:
  - q: 持续交付（Continuous Delivery）与持续部署（Continuous Deployment）差在哪里？
    options:
      - 完全一回事，只是国内外团队的不同翻译
      - 持续交付把每次改动打成随时可发的成品、生产前留人工按钮确认时机；持续部署拆掉按钮，过关即自动上生产
      - 持续部署只适合没有测试的小作坊项目
      - 持续交付不需要跑自动化测试
    answer: 1
    explain: 分界线就在生产环境大门口那颗人工确认按钮：留着按钮挑发版窗口是持续交付，拆掉按钮一路全自动直达线上是持续部署，后者对自动化测试与自动回滚的要求极高。
  - q: 为什么流水线铁律要求「制品只构建一次」，严禁上生产前重新编译打包？
    options:
      - 为了省下构建服务器的 CPU 电费
      - 重建可能因依赖小版本漂移或环境差异打出不一样的包，导致测试环境的通过结论无法担保生产包
      - 只构建一次能让镜像体积缩小一半
      - 制品仓库规定同一个项目一天只能上传一次
    answer: 1
    explain: 未锁死的传递依赖升级、编译器状态和时间戳都会让二次构建暗中变味。只有让测试、预发、生产跑完全相同的二进制字节，测试绿灯才算数。
  - q: 蓝绿发布最突出的优势与最现实的代价分别是什么？
    options:
      - 优势是最省机器成本，代价是回滚要等半小时
      - 优势是切换与回滚极快（改入口指向即可），代价是发版期间双倍环境资源且共用数据库仍需兼容
      - 优势是不用写任何测试，代价是用户切流时会断网五分钟
      - 优势是能按 1% 粒度切流，代价是不能回滚
    answer: 1
    explain: 蓝绿靠改网关指向一次性切流，旧环境原样热备，一秒就能切回止血；代价是同时养两套计算资源，而且生产数据库没法轻易复制两份，表结构仍得兼容新旧两版。
  - q: 金丝雀发布放到 5% 流量时，监控发现新版错误率比同期旧版高出 2%，该怎么处理？
    options:
      - 继续放大到 50%，多攒点报错样本才好排查
      - 立刻把新版流量切回 0% 止血，把受灾面锁死在这 5% 以内，再去线下查日志修代码
      - 保持 5% 不动，先发全站弹窗向用户道歉
      - 把告警阈值调高 3%，让流水线继续跑完
    answer: 1
    explain: 金丝雀的使命就是用最小爆炸半径试毒：5% 阶段抓到了明确的相对劣化，就该当场归零止损，绝不能带着已知故障继续扩大受灾人群。
steps:
  - id: friday-manual-deploy
    title: 周五下午四点的事故：靠人小心的流程早晚必炸
    tldr: 手工打包、传包、改配置只要重复次数够多就必然出错，更糟的是现场连上一个正常版本是哪份都找不回来；自动化流水线治的是「靠人防错」本身。
    body: |-
      复盘开头那场折腾到晚上九点的订单服务事故，真正让人后背发凉的不是「传错了昨天下午的旧包」这一个失误，而是连环失守：手工敲命令没有校验包哈希、改了新优惠券配置却没跟代码版本绑定、连救命的备份目录都被上周的人顺手覆盖了。只要上线还是一页让人照着敲的部署文档，哪怕每次准确率高达 99%，一年发两百次版也注定要炸两回。

      CI/CD 的出发点就是不再要求人「下次更细心」，而是把从 `git push` 到线上生效的每一步写成仓库里的机器配置（比如 `.github/workflows/deploy.yml` 或 `.gitlab-ci.yml`）：让构建机照单跑完重复动作，人退到幕后只管写检查规则与拍板异常——机器绝不会把昨天的旧包认成今天的，也绝不会漏掉第四步。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: dev
          id: human
          label: 发布的人：打包、传文件、改配置全靠手
        - lane: prod
          id: server
          label: 生产服务器：版本混杂，谁也说不清
          highlight: true
      messages:
        - id: m1
          from: human
          to: server
          label: 传错一版、备份被覆盖，故障折腾到晚上
          active: true
      registers:
        - name: 病根
          value: 每一步靠人保证不出错，重复够多次必然出错
        - name: 解法方向
          value: 重复动作交给机器，人只写规则与处理异常
    log:
      - at: 场景
        text: 手工发布的事故不是粗心，是流程本身没有防错
  - id: ci
    title: 持续集成：每天小步合入主干，五分钟内亮出红绿灯
    tldr: "[[持续集成]]要求开发者每天小步往主干合代码，每次提交自动拉起干净容器跑完编译与测试，把月底集中合并的大爆炸拆成每天几分钟的小账单。"
    body: |-
      没有持续集成的团队都经历过「周五合并地狱」：五个人各自拉分支闷头写一周优惠券逻辑，周五下午往主干一凑，四十几处代码冲突；好不容易解完冲突，测试红了一大片，谁改坏了哪行根本理不清。分支拉得越久，合并越痛；越怕痛就越不敢合并，拖成死循环。

      [[持续集成]]（CI）直接把节奏反过来：规定每个人把大需求拆小，每天往主干合入；只要一推代码，CI 服务器立刻拉起一个干净容器，3 到 5 分钟内跑完编译与自动化测试亮出红绿灯。灯一红，提交者记忆还是热的，两分钟就能定位到刚改的那十行代码。

      这套机制转得动全仰仗两条硬门槛：一是流水线必须快——跑一趟要是等上四十分钟，大家嫌烦又会攒着一块儿交；二是测试绝不能狼来了——一套天天随机假红（Flaky）的测试比没测试还毒，不出两周全员都会养成无视红灯的习惯。
    derivation: original
    sources:
      - ref: fowler-continuous-integration
        locator: "Continuous Integration：勤合并、自动构建、自动测试与快速反馈的核心实践"
        claim: 持续集成要求开发者频繁把改动合入主干，每次合入都触发自动构建与测试，让集成问题在几分钟内暴露，而非攒到发布时集中爆发。
        status: verified
        checkedBy: subagent
        checkedAt: "2026-11-17"
    canvas:
      kind: swimlane
      actors:
        - lane: dev
          id: committer
          label: 提交者：小步改动，天天往主干合
        - lane: pipe
          id: ci-server
          label: 集成服务器：每次合并自动构建加测试
          highlight: true
      messages:
        - id: m1
          from: committer
          to: ci-server
          label: 合并即触发，几分钟内给出红绿灯
          active: true
      registers:
        - name: 前提一
          value: 测试要快，慢流水线会被大家绕过去
        - name: 前提二
          value: 测试要可信，天天误报的红灯等于没有红灯
    log:
      - at: 集成
        text: 把集成的账切碎成每天几分钟的小额支付
  - id: cd-two-meanings
    title: 持续交付对比持续部署：生产门前留不留那颗人工按钮
    tldr: 两者都把每次过关提交打成随时可发的成品，区别只在最后一步：[[持续交付]]留一颗人工按钮挑窗口，[[持续部署]]拆掉按钮全自动直达生产。
    body: |-
      缩写同为 CD，工程里却对应两档不同的油门。[[持续交付]]（Continuous Delivery）是把每次通过检查的订单服务自动打成带版本号的成品镜像摆上货架，保证主干「任何时刻都拿得出可发版本」，但推上生产前保留一颗人工确认按钮；[[持续部署]]（Continuous Deployment）则把这颗按钮也拆了——只要自动化检查全绿，代码直接自动发往生产集群，一天上线几十次。

      该拆还是该留，取决于行业约束与变更颗粒度。消费级互联网应用每次改动极小、一天发几十版，留人工审批只会堵车，选持续部署更顺；而银行账务、核心支付或强监管系统，留住那颗按钮是必要的护栏。注意这颗人工按钮真正的价值绝不是「让人再肉眼审一遍代码」（代码早被前序关卡验过了），而是挑业务时机：避开中午十二点用餐高峰、避开大促封网期、确认上下游合作方已经就位。
    derivation: original
    sources:
      - ref: fowler-continuous-delivery
        locator: "Continuous Delivery：随时可发布的状态与部署流水线"
        claim: 持续交付的目标是让软件始终处于可发布状态、发布成为低风险的常规动作；持续部署是其进一步形态，通过检查的改动自动进入生产。
        status: verified
        checkedBy: subagent
        checkedAt: "2026-11-17"
    canvas:
      kind: swimlane
      actors:
        - lane: pipe
          id: shelf
          label: 货架：每个验过的改动都是一个成品
        - lane: prod
          id: button
          label: 那个按钮：留给人，还是拆掉
          highlight: true
      messages:
        - id: m1
          from: shelf
          to: button
          label: 交付保证随时能发，部署保证一直在发
          active: true
      registers:
        - name: 按钮的价值
          value: 不在复查代码，在判断时机：高峰、大促、依赖方状态
    log:
      - at: 交付
        text: 一个按钮之差，分开交付与部署两种风险偏好
  - id: pipeline-stages
    title: 五道流水线关卡：越快的检查越靠前，一关红灯全线叫停
    tldr: "[[流水线]]按「构建、测试、安全扫描、打包、部署」五关串联，前快后慢、不过即停，把散在老员工脑子里的上线规矩固化成硬门禁。"
    body: |-
      打开订单服务仓库里的[[流水线]]配置，里面是一条分工严密的五关安检线：第一关「构建」（约 1 分钟），编译源码并检查静态类型，拦下语法写错、缺文件这类根本跑不起来的硬伤；第二关「测试」（约 3 分钟），跑[[单元测试]]与[[集成测试]]，拦下优惠券金额算错这类逻辑故障；第三关「安全扫描」（约 2 分钟），拿依赖清单和基础镜像去比对公开漏洞库（CVE），揪出「自家代码没写错、但引用的第三方库带高危漏洞」的暗雷。

      前几关全绿才进第四关「打包」：把成品封成带提交哈希的[[制品]]镜像（如 `order-service:git-a1b2c3d`）推入仓库归档；第五关「部署」再把这串镜像标签递给 Kubernetes 集群上线。五关共享两条铁律：一是越快的关越往前摆，拼写错误 30 秒就打回，绝不浪费后面十分钟的扫描资源；二是任何一关亮红灯，整条线当场卡死，不给赶工期留绕行后门。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: dev
          id: change
          label: 一次改动：从代码开始过关
        - lane: pipe
          id: gates
          label: 五道关：构建、测试、扫描、打包、部署
          highlight: true
        - lane: art
          id: artifact
          label: 制品仓库：过关的成品带版本号存档
      messages:
        - id: m1
          from: change
          to: gates
          label: 一关不过整条线停住，不许绕行
        - id: m2
          from: gates
          to: artifact
          label: 全部过关才打包存档
          active: true
      registers:
        - name: 每关拦的事故
          value: 构建拦跑不起来，测试拦行为不对，扫描拦依赖带洞
        - name: 速度规矩
          value: 越靠前的关越要快，慢关靠后放并并行
    log:
      - at: 分工
        text: 流水线把检查清单从人脑里搬成看得见的关卡
  - id: build-once
    title: 制品只构建一次：测试验过的包必须原封不动上生产
    tldr: 同一份源码隔两天重新编译，传递依赖、工具链和时间戳都可能漂移；唯一可靠的纪律是只打一次包生成唯一哈希标签，跨环境原样晋升。
    body: |-
      看一桩真实的翻车案：周三订单服务在测试环境测得滴水不漏；周五上生产前，脚本按老习惯用「生产参数」重新跑了一遍安装与构建。偏偏周四晚上某个底层间接依赖发了小版本 `1.4.2` 改了小数舍入规则，未锁死版本的重构建自动拉到了新版——结果上线半小时优惠券金额频频对不上账，开发在测试环境死活复现不出来，因为两边跑的压根不是同一个二进制包。

      所以流水线必须焊死一条铁律：**[[制品]]只构建一次**。第四关打出的 `order-service:git-a1b2c3d` 一旦进库，测试环境拉它、预发环境拉它、生产环境拉的还是它，字节级分毫不差；数据库连接串、密钥这类环境差异一律在容器启动时通过外部环境变量或配置挂载喂进去，绝不写进镜像里。

      守住这条铁律还顺手送了回滚一份大礼：上一版健康跑过的 `order-service:git-9f8e7d6` 原封不动躺在仓库里，紧急退版只需把集群镜像号改回去，一分钟就能拉起，再也不用半夜冒汗重编老代码。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: art
          id: oneartifact
          label: 同一个制品：测试、预发、生产都用它
        - lane: prod
          id: envs
          label: 各环境：只差配置，不差包
          highlight: true
      messages:
        - id: m1
          from: oneartifact
          to: envs
          label: 晋升而不是重建，版本号一路到底
          active: true
      registers:
        - name: 漂移来源
          value: 依赖小版本、工具自动升级、时间戳，都会让重建变味
        - name: 附带好处
          value: 旧制品躺在仓库里，回滚就是换回旧版本号
    log:
      - at: 纪律
        text: 只构建一次，守的是测试结论与上线实物的同一性
  - id: blue-green
    title: 蓝绿发布：养蓝绿两套环境，切网关指向一秒换天
    tldr: "[[蓝绿发布]]在旧版（蓝）旁备好全量新版（绿），内部验通后改[[网关]]或负载均衡指向一次性切流；底气是一秒切回即可[[回滚]]，代价是双倍算力与共用数据库的兼容紧箍。"
    body: |-
      制品到了生产大门口，第一种放量打法追求极致干脆：线上 3 个订单实例正跑着 `v1.2`（叫蓝环境），你另起 3 个一模一样的绿环境实例跑上 `v1.3`，先不接外部流量，只派内部冒烟测试把绿环境捅个遍。确认无误后，在入口[[网关]]或 Kubernetes [[Service]] 上把标签指向从 `blue` 改成 `green`，100% 用户流量瞬间切到新版，全程没有新旧混跑。

      [[蓝绿发布]]最迷人的地方在退路：切过去五分钟要是发现异常，把网关指向改回 `blue`，几秒钟内全站无损退回旧版——因为那套蓝环境压根没关机，一直热备待命。它特别适合底层框架跨大版本升级这类「没法新旧混跑、要么全切要么全退」的硬仗。

      但算盘另一头是两笔硬成本：一是发版窗口期得同时掏双倍机器钱；二是机器能备两份，几 TB 的生产订单数据库却备不了两份——蓝和绿底下连的还是同一张 `orders` 表，新版绝不能上来就删改旧版正在读的列，数据库双向兼容这道紧箍依然逃不掉。
    derivation: original
    sources:
      - ref: fowler-bluegreen
        locator: "Blue Green Deployment：双环境切换与回滚的机制"
        claim: 蓝绿发布维护两套相同环境，流量在验证后整体切换，回滚即切回旧环境；数据库变更需兼容新旧两版是其主要难点。
        status: verified
        checkedBy: subagent
        checkedAt: "2026-11-17"
    canvas:
      kind: swimlane
      actors:
        - lane: pipe
          id: switcher
          label: 入口：指向蓝，或指向绿
        - lane: prod
          id: bluegreen
          label: 蓝在服务、绿待命，验证后整体切换
          highlight: true
      messages:
        - id: m1
          from: switcher
          to: bluegreen
          label: 切换与回滚是同一个动作：改指向
          active: true
      registers:
        - name: 优点
          value: 回滚就是切回去，一分钟全量回到旧版
        - name: 代价
          value: 双倍环境资源，数据库变更要同时兼容两版
    log:
      - at: 蓝绿
        text: 拿双倍资源，换切换与回滚的干脆利落
  - id: canary
    title: 金丝雀发布：先拨 1% 真实流量试毒，把爆炸半径锁在最小
    tldr: "[[金丝雀发布]]沿用矿工下井带金丝雀测瓦斯的做法，按 1% → 10% → 50% → 100% 逐档放量；拿真实流量试出隐蔽缺陷，万一翻车最多只伤及 1% 请求。"
    body: |-
      早年煤矿工人下井总拎一笼对毒气极敏感的金丝雀，鸟一扑腾大家立刻撤离。[[金丝雀发布]]借的就是这套试毒逻辑：保持旧版 `v1.2` 承接 99% 订单流量不动，在入口网关或灰度控制器（如 Argo Rollouts）上只拨 1% 真实请求（或先限定公司内部员工账号）打进新版 `v1.3`；盯稳 15 分钟无异常，再按 `1% → 10% → 50% → 100%` 逐级扶正，最后下线旧版。

      它买到的是蓝绿发布给不了的真金白银——真实生产现场的压力测试。预发环境造不出「一个攒了两百张过期优惠券的老账号恰好撞上并发重试」这种刁钻数据，金丝雀却能让这类隐蔽故障在只波及 1% 请求时就原形毕露，一秒调回 `0%` 即可止损。

      代价同样有两笔：一是慢，走完四五档观察动辄两三个小时，火烧眉毛的紧急漏洞修复等不起；二是漫长的新旧并存期——`v1.2` 和 `v1.3` 同时在线服务，新版往消息队列或缓存里塞的新字段，旧版读到了绝不能崩。
    derivation: original
    sources:
      - ref: fowler-canary
        locator: "Canary Release：按比例逐步放量并观察的发布方式"
        claim: 金丝雀发布先将新版本开放给一小部分用户，验证无误后逐步扩大比例，出问题时可快速收回，把发布的风险半径控制在最小范围。
        status: verified
        checkedBy: subagent
        checkedAt: "2026-11-17"
    canvas:
      kind: swimlane
      actors:
        - lane: pipe
          id: splitter
          label: 分流：先给新版 1%，逐级放大
        - lane: prod
          id: canarypods
          label: 新旧两版并存，指标盯着新版看
          highlight: true
      messages:
        - id: m1
          from: splitter
          to: canarypods
          label: 出事就把比例调回 0，影响到此为止
          active: true
      registers:
        - name: 换来的
          value: 真实流量下的真实判断，问题在 1% 时暴露
        - name: 代价
          value: 周期拉长，两版并存期间接口与数据必须兼容
    log:
      - at: 金丝雀
        text: 用最小爆炸半径，换真实数据的判断依据
  - id: canary-judgement
    title: 金丝雀自动裁判：跟同期旧版比差值，别靠人眼盯屏心软
    tldr: 放量判定必须拿新版与同一时刻的旧版基线比对错误率和 P99 延迟差值，并把晋升与归零写成自动规则，杜绝人工犹豫放大事故。
    body: |-
      拨出去那 1% 流量到底算好还是算坏，不能拍脑袋看绝对值，必须跟同一时刻跑着的 99% 旧版做同期对比。比如晚八点高峰期第三方支付通道抖动，旧版 `v1.2` 的错误率也从平时的 `0.1%` 涨到了 `0.4%`：此时看绝对阈值会误杀无辜；但若同一分钟里新版 `v1.3` 错误率飙到了 `2.8%`，多出来的这 `+2.4%` 铁定是新版自己的锅。裁判固定盯三项差值：接口报错率、最慢那 1% 请求的 P99 尾部延迟，以及下单支付转化率这类核心业务数。

      这套裁判逻辑必须交给机器自动执行（如 Flagger 或 Argo Rollouts 自动读取监控指标打分），绝不能靠工程师肉眼盯折线图。人盯屏有两大死穴：夜里困倦反应慢，而且看到曲线贴着红线抖动时总心存侥幸想「再看五分钟」——事故往往就在这五分钟里从 1% 放到了 50%。机器规则冷酷无情：越线当场切回 `0%` 并拉响告警，全部达标才自动推向下一档。注意，裁判手里的错误率与延迟全靠下一课的可观测性喂数——没有可信的指标，金丝雀就是蒙眼走钢丝。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: pipe
          id: judge2
          label: 自动判定：越线即收回，达标才晋升
        - lane: prod
          id: metrics2
          label: 新版指标：错误率与延迟，与旧版同期对比
          highlight: true
      messages:
        - id: m1
          from: metrics2
          to: judge2
          label: 只比新版比旧版多出来的那部分异常
          active: true
      registers:
        - name: 判据
          value: 错误率与尾部延迟为主，业务指标按改动选
        - name: 为什么自动
          value: 人盯图又慢又心软，规则不会犹豫
    log:
      - at: 判定
        text: 发布策略的天花板，是观测能力的天花板
  - id: rollback-first
    title: 回滚方案先于发布动笔：代码退版只需一秒，数据改表得拆两步
    tldr: 发版预案第一页必须写明[[回滚]]红线、执行人与操作清单并提前演练；数据库字段变更无法一键倒带，必须靠「先扩后缩」分两次发版兜底。
    body: |-
      无数血泪复盘都指向同一条常识：出事之后再现场商量怎么回滚，等于没有回滚。订单报错率一分钟掉三成时，谁敢拍板退版？旧镜像有没有被定时任务误删？刚改的配置中心参数要不要跟着退？写发版方案时必须倒过来，把[[回滚]]写在第一页：触发红线是多少、值班人无需层层请示直接执行的命令是什么、退完查哪两个接口验活，并且平时就要真刀真枪演练，提前排掉失效脚本这类哑弹。

      读者一定会追问最棘手的那道坎：无状态容器切回 `v1.2` 只需几秒，可要是 `v1.3` 刚上线时顺手把数据库 `orders` 表的旧优惠列删了、或者写进了旧版不认识的新格式数据，代码一退回去岂不照样全崩？

      没错，代码回滚易如反掌，数据回滚难于登天。工程上的标准解法是**扩张—收缩（Expand & Contract）两步法**，绝不一次到位硬改表：第一步「扩张」，只新增允许为空的 `discount_cents` 新列、原样保留旧列，发 `v1.3` 同时双写新旧两列——万一这会儿回滚回 `v1.2`，旧代码只读旧列、无视新列，毫发无损；等 `v1.3` 稳跑两周彻底过了回滚期，再发第二次「收缩」小版本停写并清理旧列。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: pipe
          id: plan
          label: 发布方案：第一部分先写回滚
        - lane: prod
          id: incident
          label: 事故现场：照单执行，不现场发明
          highlight: true
      messages:
        - id: m1
          from: plan
          to: incident
          label: 触发条件、步骤、耗时，全部预先写死
          active: true
      registers:
        - name: 难度差
          value: 代码回滚是换版本，数据回滚要处理已落库的新格式
        - name: 对策
          value: 数据变更永远向后兼容，增删字段分两步走
    log:
      - at: 回滚
        text: 出事时才想回滚，等于没有回滚
  - id: feature-flags
    title: 功能开关：把「代码部署上机」和「新功能对客露面」彻底拆开
    tldr: "[[功能开关]]在代码里埋下远程阀门，让新代码关着开关先随主干暗中上线，再按用户名单灰度放开；出事一秒关闸，但短期开关用完必须及时拆掉。"
    body: |-
      前面不论蓝绿还是金丝雀，都还默认「部署新容器 = 开启新功能」。[[功能开关]]（Feature Flag）把这两件事彻底解了绑：开发写新优惠券逻辑时套一层 `if (flags.enabled("coupon_v2", userId))`，随 `v1.3` 镜像部署上生产时开关默认全关——新代码已经在机器上跑着了，用户却完全无感；等产品挑好吉时，在[[配置中心]]或开关平台（如 LaunchDarkly、Unleash）里点一下，先对测试白名单开放，再切给某城市 5% 用户做 A/B 实验——跟前端代码里靠远程开关控制新版组件显隐完全同构。

      它在事故现场是最快的一把止血钳：要是新优惠券算错了账，连容器都不用重启回滚，远程把 `coupon_v2` 拨回关闭，1 秒钟内全网切回老逻辑。

      但越顺手的工具越容易攒下高利贷：每多留一个开关，代码里就多一条 `if/else` 分支，攒上二十个开关就能炸出上百万种状态组合，测试根本盖不住。因此团队必须给开关建生命周期台账：用来护航上线的短期开关一旦 100% 站稳，下一迭代立刻提交代码把旧分支连同开关一起删干净。
    derivation: original
    sources:
      - ref: fowler-feature-toggles
        locator: "Feature Toggles：开关的分类、发布开关与长期开关的管理"
        claim: 功能开关把功能启用与代码部署解耦，发布型开关用于安全放量与快速关闭，但需要管理与清理，避免开关长期堆积造成复杂度失控。
        status: verified
        checkedBy: subagent
        checkedAt: "2026-11-17"
    canvas:
      kind: swimlane
      actors:
        - lane: pipe
          id: toggle
          label: 开关：关着部署，按名单逐级打开
        - lane: prod
          id: feature
          label: 新功能：代码在线上，露面由开关决定
          highlight: true
      messages:
        - id: m1
          from: toggle
          to: feature
          label: 出事关开关，几秒下线，连回滚都省了
          active: true
      registers:
        - name: 更细的分流
          value: 金丝雀按流量比例切，开关可以按用户名单切
        - name: 开关债
          value: 短期开关用完即拆，攒多了代码路径会爆炸
    log:
      - at: 开关
        text: 部署与上线拆开，放量与下线都有了更细的把手
  - id: costs-minimum
    title: 收官路线图：小团队四步止痛顺序与发布三铁律
    tldr: 别一上来照搬大厂全套平台，按「一键部署脚本 → CI 门禁 → 唯一制品库 → 灰度放量」按痛点推进；守住三条铁律就能把周五发版变成家常便饭。
    body: |-
      给两三人的小团队落地 CI/CD，最忌讳照着大厂架构图闷头搭三个月平台，正确的修路顺序永远按疼痛程度排队：第一步先花半天把「拉包、替换、健康检查」写成一键脚本，周五手滑传错包的低级事故当场绝迹；第二步接上主干合并自动跑测试门禁；第三步立下哈希版本号与制品库规矩，锁死一分钟退版能力；等流量上了规模、监控指标齐备了，第四步再加金丝雀自动放量。

      临走带走三句发布铁律：**「[[制品]]只打一次包，放量先拨一成流，[[回滚]]写好再发版。」** 每次准备点下发布键前过一遍三问自检：① 即将上生产的镜像，和预发测过的是同一个哈希包吗？② 万一新旧混跑或半路退回旧版，数据库表结构与接口能双向兼容吗？③ 如果五分钟后报错飙升，值班人不用请示谁就能在两分钟内切回去吗？

      到这里，打包、排班、上线三条链都串通了，只剩最后一块悬念：刚才金丝雀自动裁判紧盯的错误率、P99 延迟，还有半夜故障时的根因线索，系统是怎么从黑盒里吐出来的？下一课装上后端工程的眼睛——可观测性。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: dev
          id: smallteam
          label: 小团队：从最痛的一步开始自动化
        - lane: pipe
          id: roadmap
          label: 推进顺序：部署、门禁、制品、放量策略
          highlight: true
      messages:
        - id: m1
          from: smallteam
          to: roadmap
          label: 每件工具都要能指出它治的是哪个痛
          active: true
      registers:
        - name: 三句收束
          value: 验得可信、小步可控、退得回去，发布才成为日常
    log:
      - at: 收束
        text: 流水线补上游，观测补下游，下一课讲眼睛
