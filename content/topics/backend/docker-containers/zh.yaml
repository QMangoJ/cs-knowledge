status: published
license: CC-BY-4.0
overview:
- key: 一句话总结
  value: 容器不是小号虚拟机，它本质上是被隔离起来的普通进程：和宿主机共用一个操作系统内核，靠命名空间获得独占系统的错觉，靠控制组被划定资源上限，所以它启动快、占用小，但隔离强度也比虚拟机弱一档。
- key: 镜像
  value: 镜像是把应用、运行时、依赖和配置按层叠成的只读文件包。每一层都可以被多个镜像共享、被构建缓存复用；容器启动时只在最上面加一层薄薄的可写层，所以改一行代码只需重建并传输变化的那一层。
- key: 隔离靠什么
  value: 命名空间负责让进程「只能看见自己的那份世界」：自己的进程号、自己的网卡与端口、自己的文件系统视图。六类命名空间合起来，容器里的进程会真心以为整台机器只有它自己。
- key: 限额靠什么
  value: 控制组负责划上限：这个容器最多用两个核的 CPU、512MB 内存。内存超限时内核会直接杀掉容器里的进程，CPU 超限时则会被节流变慢——参数里写的限额，最终都落到控制组的配置上。
- key: 与虚拟机的分界
  value: 虚拟机模拟的是整台硬件，每台都背一个完整的操作系统内核，隔离强，但启动以分钟计、每台先吃掉几个 GB 的磁盘和内存。容器共享宿主内核，启动在秒以内，一台机器能塞下的数量通常比虚拟机多一个量级。
- key: 代价
  value: 共享内核既是便宜的原因，也是风险所在：所有容器离宿主机只隔着同一个内核，隔离边界比虚拟机薄。所以特权容器不能随便开，多租户和强合规场景还要额外补隔离手段，或者干脆回到虚拟机。
- key: 谁在用
  value: 现在的云服务几乎都建立在容器之上：开发时用它统一环境，测试时用它快速起一整套依赖，上线时把它当作交付与部署的标准单位。你在云厂商买的云主机本身多半是虚拟机，而你的服务正以容器的形式跑在这些虚拟机里面，两者是分层共存的关系。
summary: 先看一笔浪费账：一台服务器上跑十个服务，如果每个服务配一台虚拟机，就要养十份完整的操作系统——磁盘、内存和启动时间，大半花在重复的操作系统上。容器给出的答案是：不要模拟硬件，让应用直接以进程的形式跑在宿主机上，只用内核自带的隔离与限额机制把它圈起来。本课把这个答案拆开看：镜像为什么要分层、命名空间到底隔离了什么、控制组到底限制了什么，以及容器与虚拟机之间那笔隔离与成本的账该怎么算。
premise: 这节课要回答的问题很直接：既然虚拟机已经能把一台服务器切成很多台「小服务器」了，为什么后来大家还要再发明容器？答案藏在浪费的地方——每个服务真正需要的只是自己的代码和依赖，可虚拟机逼着每个服务连一整个操作系统一起搬。容器就是把这份重复砍掉之后剩下的东西。
position: 本课位于后端工程学科的第一段「打包：容器与 Docker」，是整个学科的起点：先把一个服务怎样打包、怎样在一台机器上安稳运行讲清楚，后面 Kubernetes 的编排、流水线的发布才有对象可管。它默认你写过服务、部署过代码，但不要求你懂操作系统内核的细节——需要用到的内核机制会在课里现场交代。
level: 基础
minutes: 24
objectives:
- 能说清容器与虚拟机的根本区别：共享内核的进程，还是模拟硬件加完整操作系统
- 能解释镜像为什么分层：共享、缓存与只传变化的那一层分别省了什么
- 能分清命名空间与控制组的分工：一个管「能看见什么」，一个管「能用多少」
- 能按隔离要求与成本，给一个场景判断该用容器、虚拟机还是两者分层共存
aiLink: 记住一条分界线：虚拟机虚拟化的是硬件，容器虚拟化的是操作系统——前者每台自带内核，后者全体共用一个内核。本课其余的账，都可以从这一句推出来。
bridge:
  next: 一个容器在一台机器上跑起来了，可真实系统里是成百上千个容器散在几十台机器上：哪个容器放哪台、挂了谁补、版本怎么换。下一课讲 Kubernetes——它就是被请来管这摊事的编排系统。
design:
- mechanism: 共享内核，不模拟硬件
  problem: 每个服务配一台虚拟机，意味着每台都要养一整个操作系统：重复的磁盘占用、重复的内存开销、分钟级的启动，浪费随服务数量线性放大。
  choice: 让应用直接以进程形式跑在宿主机内核上，只借内核现成的隔离与限额机制圈出边界，不再为每个服务模拟一台计算机。
  tradeoff: 启动从分钟级降到秒以内、密度涨一个量级，代价是隔离边界只剩一层内核，且容器只能跑与宿主同族的操作系统应用。
  root: 大多数服务的真实需求只是「环境一致加互不干扰」，并不需要一台完整的虚拟计算机——为不需要的东西付费，才是虚拟机方案里最大的浪费。
- mechanism: 镜像分层与写时复制
  problem: 如果每次发版都要把应用连同全部依赖打包成一整块文件重新传输，几百 MB 的包一天传几十次，构建慢、分发也慢。
  choice: 把镜像切成一叠只读层，每条构建指令生成一层：层可以跨镜像共享、可以命中构建缓存，容器运行时再在顶上加一层可写层接住所有改动。
  tradeoff: 改一行代码只需重建和传输变化的那一层，代价是写文件时多了一次复制的开销，且层与层之间的顺序开始影响构建速度，要花心思排。
  root: 一次发布里真正变化的永远只是少数文件，分层就是把「变化的部分」与「不变的部分」在存储结构上分开，让系统只为变化付费。
- mechanism: 隔离与限额分成两个机制
  problem: 把一群进程圈在一起运行，要同时解决两件事：它们不能互相看见、互相干扰，也不能有谁把整台机器的资源吃光连累邻居。
  choice: 内核把这两件事拆给两个独立机制：命名空间管视图隔离，让每组进程只看见自己的世界；控制组管资源限额，给每组进程划 CPU 与内存的上限。
  tradeoff: 两个机制可以自由组合、按需开关，代价是配置项分散在内核的多个角落，排障时要分清一个故障到底是「看不见」还是「不够用」。
  root: 「隔离」这个词其实混着两个正交的问题——可见性与配额——把它们拆开各自演进，容器才既能轻装上阵，又能按场景调紧或调松。
quiz:
- q: 容器与虚拟机最根本的区别是？
  options:
  - 容器更小，所以只能跑小服务
  - 虚拟机模拟整台硬件、每台自带完整操作系统内核；容器是共享宿主机内核的进程，靠内核机制隔离
  - 容器只能跑在 Linux 上，虚拟机只能跑 Windows
  - 虚拟机不需要操作系统
  answer: 1
  explain: 分界线在内核：虚拟机每台背一个客户机操作系统，容器全体共用宿主机的那一个。启动速度、密度与隔离强度的差异，全部从这一条推出来。
- q: 改了一行代码重新构建镜像，为什么不用把几百 MB 全部重新传输？
  options:
  - 镜像会被自动压缩成几 MB
  - 镜像是分层的：只有变化的那一层需要重建与传输，其余层可以共享和复用缓存
  - 仓库会自动做增量同步
  - 因为容器启动时会自己下载依赖
  answer: 1
  explain: 分层把「不变的部分」与「变化的部分」分开了：基础系统层、依赖层在各个版本之间是同一批层，只有放代码的那一层变了，构建与分发都只为这一层付费。
- q: 在宿主机上执行 ps，为什么能看到容器里进程的身影？
  options:
  - 看不到，容器进程对宿主机完全隐形
  - 因为容器里的进程本来就是宿主机上的普通进程，只是被命名空间限制了它自己能看见的范围
  - Docker 会把进程列表同步给宿主机
  - 只有特权容器才看得到
  answer: 1
  explain: 容器没有第二个内核：它的进程就是宿主机进程表里的一员。命名空间改变的是容器内进程「能看见什么」，在宿主机视角看，它们一直都在。
- q: 给容器设了 512MB 内存上限，它却用了 600MB，最可能发生什么？
  options:
  - 容器自动向邻居借内存
  - 内核触发 OOM，把容器里的进程杀掉，容器随之退出
  - CPU 被节流，内存不受影响
  - 什么都不会发生，上限只是建议值
  answer: 1
  explain: 控制组的内存上限是硬限额：超限时内核的 OOM 机制会杀掉进程。这也是「容器莫名其妙重启」最常见的原因之一——先查是不是被内存上限杀的。
steps:
- id: vm-waste
  title: 第一步：场景——十个服务，十份操作系统
  tldr: 一台服务器上跑十个服务，每个服务配一台虚拟机：真正干活的是十份应用代码，可机器养的却是十份完整的操作系统。这一步先把这笔浪费账算清楚，它就是容器被发明出来的原因。
  body: |-
    先看一个很常见的画面。一台配置不错的服务器，要在上面跑十个服务：用户服务、订单服务、支付服务、三个后台任务、两个内部工具，还有一对跑批的程序。为了让它们互不干扰，传统做法是先把服务器切成十台[[虚拟机]]，每个服务住一台。听起来整齐，可账算下来很别扭：每台虚拟机里都要装一整个操作系统，光系统本身就要占几个 GB 的磁盘；开机时先等操作系统启动，一两分钟能进系统就算利索；运行时，就算应用本身什么都不干，那份操作系统也要先吃掉一截内存养着自己。

    把十个服务加总：真正产生价值的是十份应用代码，可这台机器的大半磁盘、相当一部分内存和每次重启的等待时间，都花在了十份几乎一模一样的操作系统上。服务越多，这份重复就越夸张——五十个服务，就是五十份操作系统在重复占地方。

    这笔账就是本课的起点：能不能只保留每个服务真正需要的东西——它的代码、它依赖的库、它的配置——把「一整个操作系统」这份重复砍掉？容器的全部设计，都是对这个问题的回答。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: eng
      id: vmhost
      label: 十台虚拟机挤在一台服务器上
    - lane: kern
      id: hostos
      label: 宿主机：资源先被十份操作系统分走大半
      highlight: true
    messages:
    - id: m1
      from: vmhost
      to: hostos
      label: 每个服务进来，都要连一整个操作系统一起搬进来
      active: true
    registers:
    - name: 磁盘
      value: 每台虚拟机的操作系统占几个 GB，十份就是几十 GB 的重复
    - name: 启动
      value: 先等操作系统开机，再等应用启动，一台一两分钟是常态
  log:
  - at: 场景
    text: 十个服务养十份操作系统，浪费随服务数量放大
- id: container-is-process
  title: 第二步：容器是什么——被圈起来的进程
  tldr: 揭开盖子看：容器里跑的进程，在宿主机上执行 ps 就能找到，它就是宿主机上的一个普通进程。容器不是一种更小的虚拟机，而是给进程套上隔离与限额之后的名字。
  body: |-
    先做个小实验来破除幻觉。在一台 Linux 机器上启动一个容器，让它在里面睡上一整天；然后回到宿主机执行 ps 查看进程列表——你会发现容器里那个睡觉的进程就躺在宿主机的进程表里，和其他普通进程排在一起。它没有藏在另一个世界里，它就是这台机器上的一个进程。

    这就是[[容器]]的定义：容器是被隔离起来的进程组。它与宿主机、与邻居容器共用同一个操作系统内核——整台机器只有一个内核在真正管硬件。容器与普通进程的差别只在于，内核对它多做了两件事：限制它能看见的东西，限制它能用的资源。这两件事分别是后面要讲的命名空间与控制组。

    那镜像又是什么？[[镜像]]是容器启动之前的那份打包：应用代码、运行时、依赖库、配置文件，全部封在一起。容器是镜像跑起来的实例，就像程序是代码跑起来的实例。把这两句记住，后面所有概念都有地方安放：镜像解决「打包与分发」，容器解决「运行与隔离」。
  derivation: original
  sources:
  - ref: docker-docs
    locator: "Docker overview: What is a container / Containers and virtual machines"
    claim: Docker 官方文档明确区分：虚拟机虚拟化硬件、每台运行完整操作系统；容器虚拟化操作系统、与宿主机共享内核，本质是隔离的进程。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
