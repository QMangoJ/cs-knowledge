      value: 硬上限，超了就杀掉进程，容器随之退出
    - name: CPU
      value: 超了不杀，按周期节流，表现是变慢
  log:
  - at: 限额
    text: 每个住户都有配额，一个出事不能拖垮全楼
- id: container-vs-vm
  title: 第七步：容器与虚拟机，正面算一次账
  tldr: 两条路线放在一起比：虚拟机隔离强但重，容器轻快但隔离薄。这一步把启动、密度、隔离三笔账并排算清，并说明为什么现实里两者常常是分层共存，而不是二选一。
  body: |-
    先比启动与密度。虚拟机开机要走完一整个操作系统的启动流程，一两分钟是常态；容器只是起一个进程，配置好隔离与限额就能干活，通常在秒以内。一台机器能塞下多少也随之拉开差距：虚拟机每台先被自己的操作系统占掉几个 GB 磁盘和一截内存，能开几十台已经不错；容器省掉了这份重复，同样的机器塞下几百个容器并不稀奇，密度通常差出一个量级。

    再比隔离，这笔账的方向是反的。虚拟机之间隔着虚拟硬件加各自的内核：一个客户机系统被攻破，攻击者还被关在那台虚拟机里，要碰宿主机还得再穿一层虚拟化层。容器之间只隔着同一个内核的几道配置：隔离是逻辑意义上的，强度天然弱一档。所以这不是谁取代谁的问题，而是拿什么换什么：容器用隔离强度换密度与速度，虚拟机用成本换隔离强度。

    现实里的主流答案是分层共存：你去云厂商买的云主机，本身就是一台虚拟机——用它做租户之间的强隔离；你的服务再以容器形式跑在这台虚拟机里面，用它做部署与密度的单位。两层各管一段，这也是后面 Kubernetes 默认的工作环境：它调度的容器，绝大多数都跑在虚拟机之上。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: eng
      id: vmroute
      label: 虚拟机路线：重，但隔离厚
    - lane: eng
      id: ctroute
      label: 容器路线：轻快，隔离薄一档
    - lane: kern
      id: layered
      label: 云上的常态：容器跑在虚拟机里面
      highlight: true
    messages:
    - id: m1
      from: ctroute
      to: layered
      label: 强隔离交给虚拟机这一层，密度与部署交给容器这一层
      active: true
    registers:
    - name: 启动
      value: 虚拟机以分钟计，容器通常在秒以内
    - name: 隔离
      value: 虚拟机隔着独立内核，容器只隔着同一内核的配置
  log:
  - at: 对比
    text: 不是二选一：云上是容器跑在虚拟机里分层共存
- id: docker-roles
  title: 第八步：Docker 到底是什么——分工看一遍
  tldr: 容器不是 Docker 发明的，Docker 是把镜像格式、构建工具与运行引擎打包成的那套最流行的工具链。这一步把它的内部分工拆开，顺便回答面试常问的「Docker 和容器是什么关系」。
  body: |-
    先纠正一个常见误会：容器技术比 Docker 老得多，命名空间与控制组在 Linux 内核里存在了很多年，难的是用起来太繁琐——要手动配置十几项内核参数才能圈出一个容器。2013 年 Docker 出现，它真正的贡献是把这件事做成了人人能用的产品：定下镜像的格式、给出 Dockerfile 这种简单的构建方式、配上仓库分发，再加一个引擎替你把内核配置填好。「容器」从此从内核专家的手艺活，变成了普通开发者的日常工具。

    Docker 引擎内部分工大致三层。你打交道的命令行是客户端，它把指令发给常驻的守护进程；守护进程负责管镜像、管容器、管网络这些全局事务；再往下，真正创建与运行容器的活由更底层的运行时组件接手，去调用内核的命名空间与控制组把进程圈起来。知道这条分工线就够了：日常排障时，「镜像拉不下来」找仓库与网络，「容器起不来」看引擎日志，「容器被杀」去查控制组的限额——三类故障对应三层。

    也因为分工是清楚的，Docker 不是唯一选择：云原生生态里还有只负责运行容器的轻量引擎，Kubernetes 后面会直接对接它们。Docker 是容器最常见的入口，但不是容器本身。
  derivation: original
  sources:
  - ref: docker-docs
    locator: "Docker architecture：client、daemon 与 underlying runtimes 的分工"
    claim: Docker 采用客户端—守护进程架构，守护进程管理镜像与容器，底层通过 containerd 与 runc 等运行时调用内核能力创建容器。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
