      active: true
    registers:
    - name: 省磁盘
      value: 一百个服务共用同一个基础层，磁盘上只存一份
    - name: 省时间
      value: 改一行代码，只重建和传输最上面那一层
  log:
  - at: 分层
    text: 不变的层共享与缓存，系统只为变化的那一层付费
- id: build-ship-run
  title: 第四步：从构建到运行——镜像的一次旅行
  tldr: 跟着一个镜像走完它的旅程：开发机上构建出来，推到镜像仓库存着，服务器把缺少的层拉下来，引擎照着它把容器跑起来。这条链就是「在我机器上是好的」这句抱怨的解药。
  body: |-
    先回到一句流传很广的抱怨：「在我机器上是好的。」它的病根是环境不在代码里：开发机装的是这个版本的运行时，服务器上是另一个版本；开发机有的库，服务器上没有。代码传过去了，环境没传过去，故障就这么来的。

    镜像的旅程正是冲着这个病根设计的。第一步，构建：开发者在自己机器上按 Dockerfile 把镜像搭出来，应用连同它需要的整套环境一起封进镜像。第二步，推送：镜像被推到[[镜像仓库]]存起来，仓库是专门存放与分发镜像的服务。第三步，拉取：服务器要运行这个服务时，从仓库把镜像拉下来——已经有的层不会重复拉。第四步，运行：容器引擎照着镜像把进程拉起来，并当场给它套上隔离与限额。从这一刻起，开发机和服务器跑的是同一个镜像，环境差异被提前消灭在打包环节。

    这也是为什么容器后来成了交付的标准单位：交付的不再是「代码加一份部署说明」，而是一个自带环境的成品。后面讲 Kubernetes 与流水线时你会看到，编排系统排班的对象、流水线层层验过的制品，本质上都是这个镜像。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: dev
      id: builder
      label: 开发机：照 Dockerfile 构建镜像
    - lane: reg
      id: registry
      label: 镜像仓库：存着每个版本的镜像
    - lane: eng
      id: runner
      label: 服务器引擎：拉下镜像把容器跑起来
      highlight: true
    messages:
    - id: m1
      from: builder
      to: registry
      label: 构建完成，推送上去存档
    - id: m2
      from: registry
      to: runner
      label: 只拉本地没有的层，拉齐后启动
      active: true
    registers:
    - name: 交付物
      value: 不再是代码加部署说明，而是自带环境的整个镜像
  log:
  - at: 旅程
    text: 构建、推送、拉取、运行，环境在打包时就定死
- id: namespaces
  title: 第五步：命名空间——隔离的是「能看见什么」
  tldr: 走进容器执行 ps，只看得到自己这一个进程，还以为自己是 1 号进程。这份错觉来自命名空间：它把进程的视野切开，每种命名空间管一种「能看见什么」。
  body: |-
    做个实验：进入一个正在运行的容器，在里面查看进程列表，你只会看到容器自己的那几个进程，而且主进程的编号赫然是 1——在容器眼里，它就是这台「机器」的第一个进程、唯一的主人。回到宿主机看，同一个进程的编号其实是几千号。制造这份错觉的机制叫[[命名空间]]，它是 Linux 内核提供的隔离手段，管的是一个进程能看见什么。

    命名空间不止一种，每种切一刀。进程命名空间切进程视野：只看见自己人。网络命名空间切网络：给容器一套独立的网卡、IP 地址与端口，所以两个容器可以同时占用各自眼里的 80 端口而不打架。挂载命名空间切文件系统视图：容器只看见镜像给它的那套目录。还有主机名、进程间通信、用户等几类。几刀切完，容器里的进程会真心以为整台机器只有它自己——这正是隔离想要的效果：看不见，就碰不着。

    但要记住这一刀切的是视野，不是资源。命名空间不负责回答「这个容器能用多少 CPU」——那是下一步控制组的事。把这两件事分清，是理解容器隔离的第一道分水岭。
  derivation: original
  sources:
  - ref: linux-man-pages
    locator: "namespaces(7)：PID、network、mount 等命名空间的种类与语义"
    claim: Linux 命名空间按资源类型划分（进程、网络、挂载、UTS、IPC、用户等），每种隔离一类资源的可见性，是容器隔离视图的基础机制。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
