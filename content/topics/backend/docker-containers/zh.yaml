  - id: container-is-process
    title: 容器不是小虚拟机，而是被内核圈起来的普通进程
    tldr: 容器里的程序在宿主机 ps 列表里赫然在列，整台机器自始至终只有一个宿主机内核；[[镜像]]负责静态打包，[[容器]]则是镜像跑起来后的受限进程组。
    body: |-
      在宿主机上把订单[[容器]]启动起来，然后切回宿主机终端敲一行 `ps aux`——你会发现容器里那个 `node server.js` 进程就明晃晃地躺在宿主机的总进程表里，带着一个普通的进程号（比如 [[PID]] `4821`），和宿主机上的其他程序并排站着。容器压根没有藏进另一个虚拟硬件世界，它本质上就是宿主机内核直接管着的一组普通进程，整台服务器从头到尾只有宿主机这一个内核。

      那它凭什么不跟隔壁用户服务打架？因为宿主机内核在启动它时顺手给它套了两道紧箍：一道管「能看见什么」（命名空间），一道管「能用多少资源」（控制组）。放到前端视角里，这就像浏览器里新开一个标签页：不用为了跑一个网页重新开一台电脑，浏览器进程直接给这个 Tab 划出一块独立的全局对象与内存沙箱就够了。

      顺手把最常混用的两个词分清：[[镜像]]是静态躺在磁盘上的一摞分层目录加一份 [[JSON]] 清单，把代码、Node.js 运行时和依赖库封死在一起；容器则是拿这份镜像拉起来的运行实例——镜像管打包分发，容器管隔离运行。
    derivation: original
    sources:
      - ref: docker-docs
        locator: "Docker overview: What is a container / Containers and virtual machines"
        claim: Docker 官方文档明确区分：虚拟机虚拟化硬件、每台运行完整操作系统；容器虚拟化操作系统、与宿主机共享内核，本质是隔离的进程。
        status: verified
        checkedBy: subagent
        checkedAt: "2026-11-17"
    canvas:
      kind: swimlane
      actors:
        - lane: eng
          id: ctn
          label: 容器：里面睡着一个进程
        - lane: kern
          id: psview
          label: 宿主机的进程表：这个进程赫然在列
          highlight: true
      messages:
        - id: m1
          from: ctn
          to: psview
          label: 同一个进程，在容器里看是独苗，在宿主机看是普通一员
          active: true
      registers:
        - name: 内核数量
          value: 整台机器只有一个宿主机内核，容器不自带内核
        - name: 镜像与容器
          value: 镜像是封好的打包，容器是它跑起来之后的实例
    log:
      - at: 定义
        text: 容器是被隔离的进程，镜像是它启动前的打包
  - id: image-layers
    title: 镜像分层与写时复制：改一行代码只传几 KB
    tldr: "[[Dockerfile]] 每条指令叠出一层只读文件系统，基础层与依赖层可跨服务共享、命中构建缓存；运行时顶上再加一层薄可写层，靠写时复制接住改动。"
    body: |-
      如果订单服务的镜像是一个 400MB 的实心压缩包，你修掉 `server.js` 里的一个错别字，就得重打 400MB 并往几十台机器重传一遍，一天发十次版光传包就能把网口塞满。真实的镜像按 [[Dockerfile]] 从上往下叠成一摞只读层：`FROM node:20-slim` 铺下 180MB 基础层，`RUN npm install` 叠上 219MB 依赖层，最后 `COPY . .` 放上 50KB 的业务代码层，叠在一起拼成完整的根目录。

      这一拆直接省下三笔开销：第一省磁盘，同机 10 个 Node.js 服务共用同一份 `node:20-slim` 只读层，硬盘只存一份 180MB；第二省构建时间，从下往上逐层比对，没动过的层直接复用本地缓存；第三省网络传输，推送和拉取只传最上面新变出来的那 50KB 代码层。等容器跑起来时，引擎在只读层最顶上再盖一层薄薄的可写层，采用「写时复制」（Copy-on-Write）：平时读文件直接穿透读底下只读层，只有容器第一次修改某个底层文件时，才把那个文件拷到顶上可写层里改，底下原件纹丝不动。

      这里藏着新手必踩的缓存坑：一旦某一层变了，叠在它上面的所有层都会跟着缓存失效。看代码区第 3 到 5 行——先把 `package.json` 单独拷进去跑完 `npm install`，最后才 `COPY . .` 拷业务代码；要是图省事把 `COPY . .` 写在 `npm install` 前面，每次改一行 `server.js` 都会连累 219MB 依赖层全部重装一遍，跟前端工程里把业务源码哈希和第三方 vendor 包拆开缓存是一个道理。
    derivation: original
    sources:
      - ref: docker-docs
        locator: "Docker Docs: Image layers / Dockerfile best practices"
        claim: 镜像由只读层叠成，Dockerfile 的每条指令形成一层；层可被缓存与共享，构建时应把不常变化的步骤放在前面以命中缓存。
        status: verified
        checkedBy: subagent
        checkedAt: "2026-11-17"
    code:
      lang: dockerfile
      code: |-
        FROM node:20-slim
        WORKDIR /app
        COPY package.json ./
        RUN npm install
        COPY . .
        CMD ["node", "server.js"]
      note: 先拷依赖清单、装好依赖，最后才拷代码：改代码不会让依赖层失效
      highlight: 5
    canvas:
      kind: swimlane
      actors:
        - lane: eng
          id: layers
          label: 镜像：一叠只读的层
        - lane: kern
          id: writable
          label: 容器可写层：改动都落在这里
      messages:
        - id: m1
          from: layers
          to: writable
          label: 读文件读下面的层，第一次改才复制上来改
          active: true
      registers:
        - name: 省磁盘
          value: 一百个服务共用同一个基础层，磁盘上只存一份
        - name: 省时间
          value: 改一行代码，只重建和传输最上面那一层
    log:
      - at: 分层
        text: 不变的层共享与缓存，系统只为变化的那一层付费
  - id: build-ship-run
    title: 构建、推送、拉取、运行：把运行环境焊死在交付物里
    tldr: 开发者在本地把代码连同运行时打成[[镜像]]推上[[镜像仓库]]，服务器只拉缺失层就能原样启动，从根上终结「在我机器上是好的」。
    body: |-
      后端最经典的甩锅台词「在我机器上是好的」，病根在于以前只交付代码、不交付环境：你电脑上装的是 Node `20.11`，线上服务器还停在 Node `16` 或者少装了一个系统动态库，代码一跑就炸。

      镜像用四步标准动作把这个病根拔掉了：第一步 `build`，开发机或构建机照着 Dockerfile 把订单代码、Node `20` 运行时与系统库一并封进镜像（比如标上 `order-service:v1.2`）；第二步 `push`，推到[[镜像仓库]]（公有的 Docker Hub，或自建 Harbor、云厂商私有仓库）集中存档；第三步 `pull`，目标服务器对照本地已有层，只把缺少的那 50KB 新代码层拉下来；第四步 `run`，容器引擎挂载只读层、套上隔离参数把进程拉起。

      从此交付物不再是「源码压缩包加一页手写部署文档」，而是一个在任何 Linux 机器上解开都分毫不差的成品包——就像前端带 `package-lock.json` 打出来的静态产物目录。后面 Kubernetes 调度的对象、CI/CD 流水线晋升的制品，指的都是这个带版本号的镜像。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: dev
          id: builder
          label: 开发机：照 Dockerfile 构建镜像
        - lane: reg
          id: registry
          label: 镜像仓库：存着每个版本的镜像
        - lane: eng
          id: runner
          label: 服务器引擎：拉下镜像把容器跑起来
          highlight: true
      messages:
        - id: m1
          from: builder
          to: registry
          label: 构建完成，推送上去存档
        - id: m2
          from: registry
          to: runner
          label: 只拉本地没有的层，拉齐后启动
          active: true
      registers:
        - name: 交付物
          value: 不再是代码加部署说明，而是自带环境的整个镜像
    log:
      - at: 旅程
        text: 构建、推送、拉取、运行，环境在打包时就定死
  - id: namespaces
    title: 命名空间切视野：为什么容器以为自己是 1 号进程
    tldr: Linux [[命名空间]]按资源类别裁剪进程的可见范围，让宿主机上 [[PID]] 为 4821 的进程在容器内自认是 1 号独苗，实现「看不见就碰不着」。
    body: |-
      钻进正在运行的订单容器敲 `ps`，里面只看得到 `node server.js` 自己，而且进程号赫然是 `PID 1`；可退回宿主机看，它明明是 `4821` 号。制造这层「独占整台机器」错觉的，正是 Linux 内核的[[命名空间]]（namespace）机制——它专门负责裁剪一个进程往外看时能看见什么。

      内核一共从六个维度各切一刀：`PID` 命名空间切进程树，让容器看不见邻居进程；`Network` 命名空间发给每个容器独立的虚拟网卡、[[IP]] 与端口空间；`Mount` 命名空间把根目录锁定在镜像叠出来的那棵目录树上；再加上管主机名的 `UTS`、管进程间通信的 `IPC` 和映射用户身份的 `User`。读者常会好奇：既然订单容器和用户容器都在各自容器里监听 `80` 端口，同住一台宿主机为什么不报端口冲突？因为它们各自拥有独立的网络命名空间，彼此的 `80` 端口根本不在同一张网卡上，对外只需由宿主机把 `8081`、`8082` 分别转发进去即可。

      记住一道关键分界：命名空间只切视野，不管配额。容器看不见邻居，但如果它死循环狂吃内存，照样能把整台机器拖垮——管住资源胃口得靠下一步的控制组。
    derivation: original
    sources:
      - ref: linux-man-pages
        locator: "namespaces(7)：PID、network、mount 等命名空间的种类与语义"
        claim: Linux 命名空间按资源类型划分（进程、网络、挂载、UTS、IPC、用户等），每种隔离一类资源的可见性，是容器隔离视图的基础机制。
        status: verified
        checkedBy: subagent
        checkedAt: "2026-11-17"
    canvas:
      kind: swimlane
