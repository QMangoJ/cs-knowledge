license: CC-BY-4.0
overview:
  - key: 一句话总结
    value: 容器不是小号虚拟机，而是与宿主机共用同一个内核的普通进程：靠[[命名空间]]切开视野，靠[[控制组]]锁死配额，再用分层[[镜像]]把运行环境焊死在交付包里。
  - key: 镜像与分层
    value: 镜像按 [[Dockerfile]] 指令叠成一摞只读层，基础层与依赖层可跨服务共享并命中缓存；容器启动时只在顶上加一层薄可写层，改一行代码只需重传变化的那几 KB。
  - key: 隔离靠什么
    value: 命名空间管「能看见什么」，切开进程号、网卡端口与目录树视图，让宿主机上几千号的进程在容器里自以为是 1 号独苗。
  - key: 限额靠什么
    value: 控制组管「能用多少」，把参数落进内核配额文件：内存撞上硬上限会触发 [[OOM]] 杀掉进程，[[CPU]] 超额则按周期节流变慢。
  - key: 与虚拟机的分界
    value: 虚拟机模拟整套硬件并自带客户机内核，隔离厚但开机要一两分钟、每台先占几 GB；容器省掉客户机内核，秒内启动，单机密度高出一个量级。
  - key: 安全代价
    value: 共享内核意味着所有容器离宿主机只隔一层系统调用边界，特权模式不能乱开；跑不可信多租户代码时需套上微虚拟机或用户态内核补厚边界。
  - key: 云上常态
    value: 云厂商卖给你的云主机本身是虚拟机（用来隔离不同租户），而你的业务以容器形式跑在虚拟机里面（用来标准化交付与拉高密度），两者分层共存。
summary: |-
  [[容器]]的解法是不再模拟硬件和客户机操作系统，让应用直接作为普通进程跑在宿主机内核上，借 Linux 内核现成的[[命名空间]]切开视野、借[[控制组]]划定资源上限，再用只读分层的[[镜像]]把代码与运行环境封成一个标准件。全课跟着同一个 Node.js 订单服务，从算清虚拟机的重复税出发，一路拆解镜像分层与写时复制、六类命名空间、控制组的软硬限额、Docker 从命令行到 runc 的三层分工，最后划清共享内核的安全边界与选型账。
premise: 你租了一台 16 核 32GB 的 Linux 服务器，准备在上面跑订单、用户、支付等 10 个内部服务。按老办法把机器切成 10 台[[虚拟机]]，每台都得先装一整套操作系统——业务代码一行没跑，二三十 GB 磁盘、5GB 空闲内存和每次一两分钟的开机等待，全耗在了 10 份一模一样的内核上。既然每个服务真正需要的只是自己的代码和运行库，能不能砍掉重复的操作系统，又让这 10 个服务同住一机而互不干扰？
position: 本课位于后端工程学科第一板块「打包：容器与 Docker」，是全学科的开篇起点。先把单个服务怎样连同环境封进镜像、怎样在一台机器上被宿主机内核隔离和限流讲透，下一课 Kubernetes 的集群排班与第三课流水线的制品晋升才有明确的操作对象。
level: 基础
minutes: 24
objectives:
  - 说清容器与虚拟机的内核分界：共享宿主机内核的受限进程，还是模拟硬件加独立客户机内核
  - 结合具体体积算清镜像分层的三笔收益，解释为什么 Dockerfile 要把装依赖写在拷代码前面
  - 分清命名空间与控制组的分工，预判内存超 512MB 与 CPU 超 2 核时的不同内核处置
  - 根据内核依赖、多租户安全要求与服务规模，判断该选裸容器、微虚拟机还是分层共存
aiLink: 大模型推理镜像动辄带着十几 GB 的 CUDA 驱动与 PyTorch 依赖，全靠[[镜像]]分层把底层环境固化缓存，日常改推理代码只需重传最上面几 MB；而 AI Agent 执行用户生成代码的沙箱，恰好撞上容器共享内核的短板——跑不可信代码不能裸上普通容器，业界普遍在容器外套一层 Firecracker 微[[虚拟机]]或 gVisor 来防逃逸。
bridge:
  next: 单个订单容器在一台机器上跑稳了，可等系统长到 20 台机器、200 个容器时，凌晨挂掉一个谁去补、新副本往哪台塞、发版怎么不停机替换？下一课讲 Kubernetes，看集群管家如何用控制循环接手这摊排班活。
design:
  - mechanism: 共享宿主机内核，不模拟硬件
    problem: 给每个小服务配一台虚拟机，就得为每个服务多养一份客户机内核与系统守护进程，磁盘、空闲内存与分钟级启动开销随服务数量线性膨胀。
    choice: 让业务直接以普通进程形式跑在宿主机内核上，只借内核自带的命名空间与控制组圈出边界，不再为每个服务虚拟一整台计算机。
    tradeoff: 启动从分钟级压到秒以内、单机密度涨一个量级，代价是隔离墙只剩同一层内核，且 Linux 容器跑不了原生 Windows 内核程序。
    root: 绝大多数自家服务要的只是「运行环境一致加彼此不打架」，根本用不着独立硬件与独立内核——砍掉没人用的虚拟硬件层，省下的全是纯利润。
  - mechanism: 只读镜像分层与写时复制
    problem: 如果每次改一行代码都要把运行时、依赖库和业务代码重新打成几百 MB 的整包上传下发，一天发十次版光构建和拉包就能把带宽与耐心耗光。
    choice: 按构建指令把镜像切成一摞只读层，不变的底层跨镜像共享并命中构建缓存；容器跑起来时只在顶上垫一层薄可写层，第一次改文件时才复制上来写。
    tradeoff: 日常发版只需重建和传输最上面几 KB 的代码层，代价是容器内首次修改大文件多一次复制开销，且一旦写反 Dockerfile 顺序就会让缓存成片失效。
    root: 一次发版里变化的永远是极少数业务文件，把高频变化层和低频基础层在存储结构上拆开，系统就只需为真正变动的部分买单。
  - mechanism: 视图隔离与资源限额拆归两套内核机制
    problem: 十几个服务挤在同一台宿主机上，既要防止它们互相窥探进程和抢占同号端口，又要防止某一个服务内存泄漏把整台机器拖死。
    choice: Linux 内核把这两件事交给两套正交机制：命名空间管「能看见什么」的视图裁剪，控制组管「能用多少」的配额闸门，由容器运行时启动时一并填好。
    tradeoff: 两套机制可按需自由组合，代价是底层配置散落在内核不同子系统里，线上排障必须先分清故障是「视图隔离挡住了」还是「配额超限被杀了」。
    root: 「隔离」背后本来就混着可见性与资源配额两个独立维度，拆开演进既能让内核机制保持简单，也方便上层工具按场景松紧搭配。
quiz:
  - q: 容器与虚拟机最根本的分界线在哪里？
    options:
      - 容器体积更小，所以只能跑轻量级脚本
      - 虚拟机模拟硬件且每台自带完整操作系统内核；容器是共享宿主机内核的普通进程，靠内核机制做隔离与限额
      - 容器只能跑在 Linux 上，虚拟机只能跑在 Windows 上
      - 虚拟机不需要宿主机操作系统支持
    answer: 1
    explain: 分界线就在内核数量：虚拟机每台背一份客户机内核，容器全体共用宿主机的同一个内核。秒级启动、高密度与较薄的安全边界，全从这一条长出来。
  - q: 只改了一行 server.js 重新构建镜像，为什么不用把 400MB 环境全部重传一遍？
    options:
      - Docker 会把整个镜像压缩到几 KB
      - 镜像按只读层组织：基础系统层与依赖层直接复用缓存，只需重建并传输最上面变化的代码层
      - 镜像仓库会自动对比两个整包的二进制差异
      - 容器启动时会临时去公网重新下载依赖
    answer: 1
    explain: 分层把不变的底层与常变的代码层拆开了：只要前面的 package.json 没动，180MB 基础层和 219MB 依赖层在构建与拉取时都直接复用，只传几 KB 的新代码层。
  - q: 在宿主机终端里敲 ps aux，为什么能直接看到容器里跑着的业务进程？
    options:
      - 看不到，容器进程对宿主机完全隐身
      - 容器进程本来就是宿主机内核进程表里的普通一员，命名空间只裁剪了容器内部往外看的视野
      - Docker 守护进程每秒把进程名同步给宿主机
      - 只有加了特权参数的容器才会在宿主机露面
    answer: 1
    explain: 整台机器只有一个内核和一张总进程表。PID 命名空间只是给容器内部发了一个「1 号进程」的局部编号，站在宿主机根命名空间看，它自始至终都在表里。
  - q: 给订单容器设了 512MB 内存上限，它因内存泄漏涨到 600MB 时会发生什么？
    options:
      - 自动借用隔壁空闲容器的内存继续跑
      - 内核触发 OOM 杀掉容器内的进程，容器以退出码 137 终止
      - 只会被限制 CPU 速度，内存不受影响
      - 什么都不会发生，512MB 只是监控告警参考线
    answer: 1
    explain: 控制组的内存上限是硬墙：一旦越线，内核 OOM Killer 会直接杀掉容器进程（常见退出码 137），这也是排查「容器无故重启」时第一个要核对的地方。
steps:
  - id: vm-waste
    title: 十个服务养十份内核：虚拟机的重复税花在哪
    tldr: 每台[[虚拟机]]都要独占一份客户机操作系统，十个小服务同住一台服务器时，几十 GB 磁盘、数 GB 空闲内存与分钟级开机时间全耗在了重复的内核与系统进程上。
    body: |-
      把这台 16 核 32GB 机器上的资源账摊开算一遍：如果把订单、用户、支付和后台任务分别塞进 10 台[[虚拟机]]，每台虚拟机都要先模拟出一套虚拟硬件，再在里面装一套完整的 Linux 操作系统。光系统文件每台就得占掉 2 到 3GB 磁盘，10 台先划走二三十 GB；哪怕订单服务一条请求还没接，每份客户机内核和后台守护进程也要先吃掉约 500MB 内存，10 台平白吞掉 5GB；遇到重启扩容，还得挨个等操作系统走完开机自检，一两分钟能拉起业务就算利索。

      可回头看订单服务自己真正需要的家当：不过是一个 Node.js 运行时、`node_modules` 依赖目录、一份配置和 `server.js` 代码。为这点东西每次陪嫁一整套操作系统内核，50 个服务就是 50 份内核在原地空转——砍掉这份重复、只留业务进程和它的依赖，正是容器诞生的直接动因。
    derivation: original
    canvas:
