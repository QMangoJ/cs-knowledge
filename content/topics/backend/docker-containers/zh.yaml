    text: 容器是被隔离的进程，镜像是它启动前的打包
- id: image-layers
  title: 第三步：镜像为什么分层——只为变化付费
  tldr: 镜像不是一整块文件，而是一叠只读的层：基础系统一层、依赖一层、代码一层。层可以共享、可以缓存，改一行代码时只有最上面那层需要重建和传输——这一步算这笔分发的账。
  body: |-
    设想镜像是一整块文件会发生什么：一个应用连同依赖打成 400MB 的包，你改了一行代码、修了个错别字，就要重新构建整包，再把它传到几十台服务器上，一天发十次版，光传输就先把人耗死。真实的镜像不是一整块，而是一叠层。写 [[Dockerfile]] 时，每条指令通常生成一层：先铺基础操作系统层，再铺运行时层，再装依赖层，最后放上你的代码层。每一层都是只读的，层与层叠起来拼成容器看到的完整文件系统。

    分层换来三笔省。第一笔是共享：一台机器上一百个服务共用同一个基础系统层，磁盘上只存一份。第二笔是缓存：构建时从下往上逐层检查，哪一层的内容没变就直接用上次的结果，所以把「不常变的依赖安装」写在前面、「天天改的代码」写在最后，构建会快得多。第三笔是传输：推送和拉取都按层进行，没变过的层服务器上已经有了，只传变化的那一层。容器启动时，引擎在这一叠只读层最上面再加一层可写层，运行中的所有改动都落在这层里——这个机制叫写时复制：读文件直接读下面的层，第一次改某个文件时才把它复制到可写层来改。

    代价藏在顺序里：层一旦变了，它上面的所有层都要重建。所以 Dockerfile 的写法有讲究，依赖装在前、代码拷在后，是每个写容器的人最早学会的一课。
  derivation: original
  sources:
  - ref: docker-docs
    locator: "Docker Docs: Image layers / Dockerfile best practices"
    claim: 镜像由只读层叠成，Dockerfile 的每条指令形成一层；层可被缓存与共享，构建时应把不常变化的步骤放在前面以命中缓存。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  code:
    lang: dockerfile
    code: |-
      FROM node:20-slim
      WORKDIR /app
      COPY package.json ./
      RUN npm install
      COPY . .
      CMD ["node", "server.js"]
    note: 先拷依赖清单、装好依赖，最后才拷代码：改代码不会让依赖层失效
    highlight: 5
