      id: inside
      label: 容器内视角：自己是 1 号进程
    - lane: kern
      id: kernel
      label: 内核：按命名空间给每个容器发一份视图
      highlight: true
    messages:
    - id: m1
      from: kernel
      to: inside
      label: 进程、网络、文件系统，每种视图各切一刀
      active: true
    registers:
    - name: 管什么
      value: 命名空间只管可见性，不管每个容器能用多少资源
  log:
  - at: 隔离
    text: 看不见就碰不着，命名空间切的是进程的视野
- id: cgroups
  title: 第六步：控制组——限制的是「能用多少」
  tldr: 一个服务的内存泄漏了，如果没人管，它能把整台机器的内存吃光、连累所有邻居一起死。控制组就是那道闸：给每个容器划好 CPU 与内存的上限，超了就处置。
  body: |-
    先看没有闸的下场。一台机器上跑着十个容器，其中一个服务的代码有内存泄漏，内存占用一路往上涨。宿主机内存被吃光之后，内核开始随机杀进程保命，死的不一定是肇事者——十个服务陪着一起遭殃。共享一台机器的前提，是每个住户都要有明确的配额，这就是[[控制组]]存在的理由：它是 Linux 内核的限额机制，专门给一组进程划资源上限。

    划法很具体。启动容器时你写的那些参数——最多用 512MB 内存、最多用两个核的 CPU——最终都被写进控制组的配置里。两种资源的超限处置还不一样：内存是硬墙，容器想用的内存超过上限，内核会直接触发 OOM 把里面的进程杀掉，容器随之退出——线上「容器莫名其妙重启」，十有八九先查这条；CPU 是软一些的闸，超了不会被杀，而是被节流：这个周期内你的份额用完了，剩下的时间就只能等着，表现是服务变慢而不是死掉。

    命名空间与控制组这一对，凑齐了容器的全部隔离：一个发视图、一个发配额。容器引擎做的事，本质上就是替你把这两套内核配置按参数填好，再把进程放进去。
  derivation: original
  sources:
  - ref: linux-kernel-docs
    locator: "Control Groups v2 文档：memory 与 cpu 控制器的限额语义"
    claim: cgroups 给进程组划定 CPU 与内存等资源的用量上限；内存超限触发 OOM 终止进程，CPU 超限按周期节流，是容器资源参数的内核落点。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
