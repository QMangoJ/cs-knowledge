          id: cli
          label: 命令行：build、push、run 都从这里发
        - lane: eng
          id: daemon
          label: 守护进程：管镜像、容器与网络
        - lane: kern
          id: runtime
          label: 底层运行时：动手配置内核、圈起进程
          highlight: true
      messages:
        - id: m1
          from: cli
          to: daemon
          label: 指令交给守护进程统一调度
        - id: m2
          from: daemon
          to: runtime
          label: 真正创建容器时，再由运行时落到内核
          active: true
      registers:
        - name: 定位
          value: Docker 是最流行的容器工具链，不是容器技术本身
    log:
      - at: 分工
        text: 命令行发令、守护进程调度、运行时落到内核
  - id: security-boundary
    title: 共享内核的代价：逃逸风险、特权禁区与微虚拟机加固
    tldr: 所有容器与宿主机共用同一套系统调用入口，开启特权模式或用 root 裸跑等于亲手拆墙；运行外部不可信代码时，业界普遍套上 Firecracker 或 gVisor 补厚边界。
    body: |-
      共享内核是容器省钱的根源，也是它最大的安全软肋：同机 10 个容器的每一次文件读写和网络收发，敲的都是同一个宿主机内核的大门。万一宿主机内核曝出提权漏洞，或者容器拿到了过高的内核权限，攻击者攻破订单服务后就能顺着内核「容器逃逸」爬上宿主机，把隔壁支付服务的密钥一锅端。

      日常上线最忌讳亲手拆墙，头号禁区就是 `--privileged`（特权容器）：它会卸掉绝大多数隔离限制、把宿主机硬件设备直接暴露进容器，里面的进程几乎等同于宿主机 `root`，除了极少数底层网络或存储插件，普通业务服务一律禁用。守住共享内核的基本卫生靠三条铁律：只拉可信仓库扫过漏洞的镜像、在 Dockerfile 里用普通用户（如 `USER node`）代替默认 `root` 启动进程、只开放业务必需的最小权限。

      如果要跑的是完全不可信的外部代码——比如无服务器函数平台或在线沙箱——只靠命名空间就兜不住了。AWS Lambda 用 Firecracker 给每个函数外面单套一层百毫秒启动的极简微[[虚拟机]]，Google Cloud Run 则用 gVisor 在容器和宿主机内核之间垫一层用户态内核拦截系统调用，本质都是在尽量保住秒级启动的同时，把城墙补回虚拟机厚度。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: eng
          id: attacker
          label: 被攻破的容器：想往宿主机爬
        - lane: kern
          id: thinwall
          label: 共享内核：所有容器共同的那道边界
          highlight: true
      messages:
        - id: m1
          from: attacker
          to: thinwall
          label: 边界只有一层内核，特权模式等于把这道墙拆掉
          active: true
      registers:
        - name: 基本卫生
          value: 镜像做漏洞扫描、进程不用管理员身份、权限按最小需要给
    log:
      - at: 代价
        text: 便宜来自共享内核，风险也来自共享内核
  - id: when-not-container
    title: 什么时候别硬套容器：内核绑死、强隔离沙箱与极小项目
    tldr: 依赖异构操作系统内核、运行外部恶意风险代码、或者单机一两个低频发版的小工具，直接硬套整套容器设施反而得不偿失。
    body: |-
      容器虽是云上标配，碰到三类场景却要先踩刹车。第一类是被内核绑死的负载：Linux 容器共享的是 Linux 内核，跑不了依赖原生 Windows 内核的老 `.NET` 程序（那得上 Windows 容器或直接开虚拟机）；同样，如果业务必须自行编译加载特定版本的内核模块，也没法跟别人共用宿主机内核。

      第二类是安全压倒密度的不可信多租户负载，比如在线编程判题机（OJ）或公共构建任务，用户传上来的代码本来就可能带恶意系统调用——直接裸跑普通容器等于引狼入室，必须退回虚拟机或微虚拟机方案。

      第三类恰恰相反，是规模小到工具链回不了本：个人或两三人维护的一个内部小后台，单机跑着、半年才改一次代码，用 [[systemd]] 托管进程配个脚本五分钟就能发完版；硬去搭私有镜像仓库和全套容器流水线，纯属拿养车队的成本养一辆自行车。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: dev
          id: decider
          label: 做选型的人：手里有三类场景要掂量
        - lane: eng
          id: notfit
          label: 不合身的场景：内核绑定、强隔离、小规模
          highlight: true
      messages:
        - id: m1
          from: decider
          to: notfit
          label: 先看约束再选工具，不要为用容器而用容器
          active: true
      registers:
        - name: 判断标准
          value: 容器的收益随服务数量与发布频率放大，小规模时先算维护账
    log:
      - at: 选型
        text: 容器是算过账的选择，不是逢服务必上的默认项
  - id: closing-ledger
    title: 收官总账：四句分工口诀与容器选型三问
    tldr: 容器拿一档隔离厚度换来环境焊死、秒级启动与十倍密度；带走四句底层分工口诀和选型三问，就能把单机容器账算清。
    body: |-
      把整课拆过的机制收成四句口诀，面试和排障都能顺着摸到底：**「[[镜像]]分层焊环境，[[命名空间]]切视野，[[控制组]]锁死硬配额，运行时落地成进程。」** 配套记住三条排障条件反射：拉不下包查仓库与网络层缓存，容器秒退查启动命令与引擎日志，跑得好好的突然以 `137` 重启直接去查控制组内存上限。

      动手给新系统做技术选型前，先过三道自检问题：① 业务能不能直接跑在标准 Linux 内核上、不额外绑特定内核模块？② 里面跑的是自家可信代码，还是必须套微虚拟机防逃逸的外部代码？③ 服务个数与发版频率，已经高到手工配环境开始拖后腿了吗？

      单台 16 核机器上跑 10 个容器的问题到这儿彻底结清了。可一旦订单系统扩成 20 台机器、200 个容器，凌晨三点某台机器断电挂掉十几个容器，谁来自动找空机器补上、发版时又怎么不停机挨个换新？下一课就请出集群管家 [[Kubernetes]]。
