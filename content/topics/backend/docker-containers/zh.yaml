      id: cli
      label: 命令行：build、push、run 都从这里发
    - lane: eng
      id: daemon
      label: 守护进程：管镜像、容器与网络
    - lane: kern
      id: runtime
      label: 底层运行时：动手配置内核、圈起进程
      highlight: true
    messages:
    - id: m1
      from: cli
      to: daemon
      label: 指令交给守护进程统一调度
    - id: m2
      from: daemon
      to: runtime
      label: 真正创建容器时，再由运行时落到内核
      active: true
    registers:
    - name: 定位
      value: Docker 是最流行的容器工具链，不是容器技术本身
  log:
  - at: 分工
    text: 命令行发令、守护进程调度、运行时落到内核
- id: security-boundary
  title: 第九步：代价——共享内核这条边界有多薄
  tldr: 便宜的另一面必须说透：所有容器共用一个内核，隔离边界比虚拟机薄。这一步看这条边界薄在哪、哪些用法等于亲手拆墙，以及业界用什么办法给隔离补厚。
  body: |-
    把风险说具体。虚拟机的世界里，攻击者攻破一个应用，还被关在客户机操作系统里，想碰宿主机要再打穿虚拟化层。容器的世界里，应用和宿主机之间只隔着同一个内核：内核一旦被利用出漏洞，或者容器拿到了过大的权限，攻击者就可能从容器里「逃逸」到宿主机上，进而碰到同机所有其他容器。共享内核让容器便宜，也让这条边界天然薄一档——这是架构事实，不是某个产品的缺陷。

    有些用法等于亲手拆墙，最典型的是特权容器：它几乎放开了全部隔离与限额，里面的进程约等于宿主机上的管理员进程，只该出现在极少数必须操作硬件的系统组件里，业务服务永远不该用。日常的防护是几件小事叠起来的：镜像只从可信来源拉并做漏洞扫描、容器进程不用管理员身份运行、权限按最小需要给。这些不是高级技巧，是共享内核这个前提下的基本卫生。

    对隔离要求再高一档的场景——比如要跑互不信任的租户代码——业界的办法是给容器补一层：有的方案在每个容器外面套一台极轻量的虚拟机，有的方案在应用和内核之间加一个用户态的拦截层——思路都是同一个：把边界补回到接近虚拟机的厚度，同时尽量保住容器的启动速度。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: eng
      id: attacker
      label: 被攻破的容器：想往宿主机爬
    - lane: kern
      id: thinwall
      label: 共享内核：所有容器共同的那道边界
      highlight: true
    messages:
    - id: m1
      from: attacker
      to: thinwall
      label: 边界只有一层内核，特权模式等于把这道墙拆掉
      active: true
    registers:
    - name: 基本卫生
      value: 镜像做漏洞扫描、进程不用管理员身份、权限按最小需要给
  log:
  - at: 代价
    text: 便宜来自共享内核，风险也来自共享内核
- id: when-not-container
  title: 第十步：什么时候别硬套容器
  tldr: 容器不是默认答案。这一步看三类要先算账的场景：负载被操作系统绑死、隔离要求高到逻辑隔离不够、以及规模小到全套工具链的维护成本超过它省下的钱。
  body: |-
    第一类是被内核绑死的负载。Linux 容器跑的是 Linux 内核上的进程，它装不了 Windows 的应用——需要 Windows 内核的服务，得用另一套 Windows 容器或回到虚拟机。同理，负载如果深度依赖某种特定内核版本或内核模块，共享宿主内核这件事本身就会变成约束。

    第二类是隔离要求压倒一切的场景。第九步说过，容器的边界是一层逻辑隔离。跑自家服务时这通常够用；可如果你要运行的是互不信任的租户提交上来的代码，比如在线判题、代码托管的构建任务，风险模型就完全不同——这类场景要么给容器补虚拟化层，要么直接用虚拟机，把账算在安全上而不是密度上。

    第三类反过来，是规模太小。一个跑在单机上的小服务，手工部署一年也出不了两次事，引入镜像仓库、编排与全套发布流程，维护工具链的成本可能比它省下的还多。容器的价值随服务数量与发布频率放大：服务越少、发布越稀，它的账越算不过来。判断标准始终是同一句——先看约束，再选工具，不要倒过来。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: dev
      id: decider
      label: 做选型的人：手里有三类场景要掂量
    - lane: eng
      id: notfit
      label: 不合身的场景：内核绑定、强隔离、小规模
      highlight: true
    messages:
    - id: m1
      from: decider
      to: notfit
      label: 先看约束再选工具，不要为用容器而用容器
      active: true
    registers:
    - name: 判断标准
      value: 容器的收益随服务数量与发布频率放大，小规模时先算维护账
  log:
  - at: 选型
    text: 容器是算过账的选择，不是逢服务必上的默认项
- id: closing-ledger
  title: 第十一步：收束——容器的总账
  tldr: 把整课收成一张账：容器用一档隔离强度，换来了环境一致、启动速度与部署密度。下一课的问题随之而来：当容器多到成百上千，谁来给它们排班。
  body: |-
    先把这课的账并排摆一遍。换来的东西有三样：环境一致——镜像把环境和代码封在一起，「在我机器上是好的」从源头上消失；启动与密度——进程级的启动是秒以内的事，一台机器能塞下的服务多出一个量级；交付标准化——构建、推送、拉取、运行这条链，让所有服务的交付长成同一个样子。付出的东西有两样：隔离强度降一档，所有容器共用一层内核做边界；操作系统被绑定，Linux 容器只能跑在 Linux 内核上。

    还要记住那对分工：命名空间管「能看见什么」，控制组管「能用多少」，镜像管「打包与分发」，引擎管「把这一切执行出来」。面试里问到容器，沿着这四句往下讲，基本不会散。

    最后一个问题留给下一课：一个容器跑起来不难，可当你有几百个容器、几十台机器时，谁来决定每个容器放哪台、谁挂了谁补上、发新版时怎么逐个替换？这就是编排系统 Kubernetes 要接手的摊子了。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: eng
      id: many
      label: 几百个容器：靠人盯已经盯不过来
    - lane: kern
      id: machines
      label: 几十台机器：放置、补充、替换都要有人管
      highlight: true
    messages:
