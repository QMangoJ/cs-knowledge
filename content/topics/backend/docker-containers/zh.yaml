          label: 进程、网络、文件系统，每种视图各切一刀
          active: true
      registers:
        - name: 管什么
          value: 命名空间只管可见性，不管每个容器能用多少资源
    log:
      - at: 隔离
        text: 看不见就碰不着，命名空间切的是进程的视野
  - id: cgroups
    title: 控制组划配额：内存超 512MB 直接杀，CPU 超 2 核只节流
    tldr: "[[控制组]]在内核里给进程组锁死资源上限；内存撞上硬限额会触发 [[OOM]] 当场杀进程，[[CPU]] 超额则按时间片节流变慢而不杀。"
    body: |-
      十个容器同住一台 32GB 宿主机，要是订单服务写出内存泄漏一路涨到 30GB，宿主机内存见底后内核就会乱杀进程保命，隔壁无辜的支付服务也得陪葬。Linux 内核用[[控制组]]（cgroups）立下这道配额闸门，它在机器上的真实形态就是 `/sys/fs/cgroup/` 目录下一组内核虚拟文件：你启动容器时传的 `--memory=512m --cpus=2`，最终就是往这个目录的 `memory.max` 里写进 `536870912`（字节），往 `cpu.max` 里写进每 `100ms` 周期最多跑 `200ms`（合 2 个核）。

      注意内核对这两样超限的脾气截然不同。内存是硬墙：订单容器一旦申请到 600MB 撞穿 512MB 红线，内核没有办法把已经发出去的内存收回来，只能当场触发 [[OOM]] Killer 把容器进程杀掉（退出码 `137`）——线上遇到「容器毫无报错突然重启」，十有八九先查是不是撞了内存上限。[[CPU]] 则是可回收的时间片，属于软闸：这一轮 `100ms` 里容器把 `200ms` 核时花光了，内核只是暂停调度它、让它排队等到下一轮周期再跑，表现出来是接口响应变慢，绝不会直接死掉。

      把第五步和这一步合拢，容器的内核底牌就全亮出来了：命名空间发独立视图，控制组发资源配额，容器引擎不过是替你把这两套内核文件填好再拉起进程。
    derivation: original
    sources:
      - ref: linux-kernel-docs
        locator: "Control Groups v2 文档：memory 与 cpu 控制器的限额语义"
        claim: cgroups 给进程组划定 CPU 与内存等资源的用量上限；内存超限触发 OOM 终止进程，CPU 超限按周期节流，是容器资源参数的内核落点。
        status: verified
        checkedBy: subagent
        checkedAt: "2026-11-17"
    canvas:
      kind: swimlane
      actors:
        - lane: eng
          id: leaky
          label: 泄漏的容器：内存一路涨到上限
        - lane: kern
          id: cgroup
          label: 控制组：到线就处置，不让它连累邻居
          highlight: true
      messages:
        - id: m1
          from: leaky
          to: cgroup
          label: 内存超限触发 OOM 杀进程，CPU 超限被节流
          active: true
      registers:
        - name: 内存
          value: 硬上限，超了就杀掉进程，容器随之退出
        - name: CPU
          value: 超了不杀，按周期节流，表现是变慢
    log:
      - at: 限额
        text: 每个住户都有配额，一个出事不能拖垮全楼
  - id: container-vs-vm
    title: 容器对比虚拟机：拿一档隔离厚度换秒级启动与十倍密度
    tldr: 容器省掉客户机内核，启动压进秒级、单机密度高出一个量级，但共享内核使隔离薄了一层；云上主流做法是「虚拟机隔离租户、里面跑容器管部署」。
    body: |-
      把容器与[[虚拟机]]摆上同一张天平，两边的得失正好对称。比速度与密度，容器完胜：虚拟机开机要走完客户机内核与系统服务自检，动辄一两分钟，16 核 32GB 的宿主机开一二十台就见顶；容器只是填好内核参数拉起一个进程，启动不到 1 秒，省下几十 GB 重复系统开销后，同一台机器塞进上百个轻量容器稀松平常。

      反过来比隔离厚度，虚拟机赢回一城。虚拟机之间隔着虚拟化层（Hypervisor）加各自独立的内核，就算黑客攻破订单服务所在的客户机内核，也还被关在虚拟机笼子里；而容器之间只隔着同一个宿主机内核的几道逻辑配置，城墙天然薄了一层。

      所以在真实云生产环境里，两者根本不是二选一，而是上下分层搭档：你在 AWS EC2 或阿里云 ECS 买到的云主机本身就是一台虚拟机——云厂商靠它把你和隔壁公司的租户硬隔开；回到你自己的云主机内部，订单、支付、用户服务再以容器形态跑在里面，吃满秒级扩缩与标准化交付的红利。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: eng
          id: vmroute
          label: 虚拟机路线：重，但隔离厚
        - lane: eng
          id: ctroute
          label: 容器路线：轻快，隔离薄一档
        - lane: kern
          id: layered
          label: 云上的常态：容器跑在虚拟机里面
          highlight: true
      messages:
        - id: m1
          from: ctroute
          to: layered
          label: 强隔离交给虚拟机这一层，密度与部署交给容器这一层
          active: true
      registers:
        - name: 启动
          value: 虚拟机以分钟计，容器通常在秒以内
        - name: 隔离
          value: 虚拟机隔着独立内核，容器只隔着同一内核的配置
    log:
      - at: 对比
        text: 不是二选一：云上是容器跑在虚拟机里分层共存
  - id: docker-roles
    title: Docker 不是容器本身：从命令行到 runc 的三层接力
    tldr: Linux 内核早就有命名空间与控制组，2013 年诞生的 Docker 把镜像格式与内核配置封装成顺手工具链，内部按 docker 客户端、dockerd 守护进程、containerd/runc 运行时三层分工。
    body: |-
      容器并不是 Docker 发明的——Linux 内核早就有命名空间、控制组和早期的 LXC 容器，但当年想手工圈出一个容器得配十几项晦涩的内核参数，只有内核老手玩得转。2013 年 Solomon Hykes 团队开源 Docker，真正的突破是定下了分层[[镜像]]标准和 [[Dockerfile]] 写法，把繁琐的内核配置包成了一条 `docker run` 命令，才让容器一夜之间走进每个业务团队。

      落到一台 Linux 服务器上，Docker 并不是一个大一统黑盒，而是三个独立二进制程序在接力：你在终端敲的 `docker` 只是个传话客户端，它通过本地套接字把请求发给常驻后台的守护进程 `dockerd`（管镜像构建、网络与全局调度）；真正动手启停容器时，`dockerd` 又把活转交给下层的 `containerd`，最后由轻量级运行时 `runc` 调内核系统调用建好命名空间与控制组、拉起 `node server.js` 后自己功成身退。

      摸清这三层形态有两个直接好处：一是排障有地图——镜像拉不动查仓库与网络，容器起不来看 `dockerd` 日志，跑着跑着消失去查内核控制组的 [[OOM]] 记录；二是看懂为什么下一课的 [[Kubernetes]] 后来绕开笨重的 `dockerd`、直接对接底层的 `containerd` 就能照常跑容器——因为镜像与运行时的行业标准早就独立出来了。
    derivation: original
    sources:
      - ref: docker-docs
        locator: "Docker architecture：client、daemon 与 underlying runtimes 的分工"
        claim: Docker 采用客户端—守护进程架构，守护进程管理镜像与容器，底层通过 containerd 与 runc 等运行时调用内核能力创建容器。
        status: verified
        checkedBy: subagent
        checkedAt: "2026-11-17"
    canvas:
      kind: swimlane
      actors:
