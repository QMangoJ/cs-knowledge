    text: 计算贴着数据做，高频操作收进服务端命令
- id: read-path
  title: 第四步：读路径走一遍——旁路缓存的固定动作
  tldr: 读的动作被收成一条固定路径：先问缓存，有就直接返回；没有才去数据库查，并顺手把结果抄回缓存再返回。下一次同样的读，就在缓存门口被拦下了。
  body: |-
    跟着一次商品详情请求走。请求进来，应用先拿商品编号去问 Redis：有这份数据吗？有，直接返回，数据库的大门都没进——这是命中，是五千次里的大多数。没有（第一次被问，或者刚过期），应用去数据库把这行数据查出来，一边返回给用户，一边把一份抄进 Redis 并设好过期时间——这是未命中加回填。

    把命中率算成账：如果命中率是 98%，五千次读里只有一百次真正落到数据库，数据库的压力降到原来的五十分之一。缓存的全部收益，就是这个比例。反过来也要看清：未命中的那条路比不用缓存时还多绕了一趟 Redis，所以缓存层必须快、必须稳，它要是慢了或挂了，读路径要能降级直查数据库，不能陪着一起死。

    这条路径有个名字叫旁路缓存（Cache-Aside）：缓存站在数据库旁边，读的规则由应用统一执行。规则收成一条，命中率才统计得出来，问题才定位得下去——这也是它成为业界默认的原因。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: app
      label: 应用：先问缓存，再问数据库
    - lane: redis
      id: rd
      label: Redis：98% 的读在这里被拦下
    - lane: db
      id: db
      label: 数据库：只接待未命中的那 2%
      highlight: true
    messages:
    - id: m1
      from: app
      to: rd
      label: 先查缓存：命中直接返回
    - id: m2
      from: app
      to: db
      label: 未命中才查库，查完回填缓存
      active: true
    registers:
    - name: 命中率 98%
      value: 五千次读只剩一百次落到数据库
    - name: 降级后手
      value: 缓存挂了要能直查数据库，不能陪葬
  log:
  - at: 读路径
    text: 先缓存后库、未命中回填，收益就是命中率
- id: write-path
  title: 第五步：写路径的规矩——先写库，再删缓存
  tldr: 商品改价了，缓存里那份旧的怎么办？业界的答案是：先把新价格写进数据库，再把缓存里那份删掉。删而不是改、库先行而不是缓存先行，这两个选择各有各的事故教训垫底。
  body: |-
    先说为什么是删不是改。改缓存意味着把新值算好写进缓存，可并发写一多，两个更新的先后顺序一乱，旧值可能盖掉新值，缓存里就留下一份谁也不知道的错数据。删则没有这个问题：删是幂等的，删完之后下一个读者自然会去数据库取最新值回填，缓存永远从账本重新抄，不在抄本上涂改。

    再说为什么库要先行。反过来先删缓存再写库，会开出一个空窗：删完还没写完时，一个读请求进来，未命中、去库里读到旧值、又把旧值回填进缓存——等写请求落库，缓存里躺的已经是旧值了，而且没人会再去删它。先写库再删缓存，不一致的窗口只剩「库已更新、缓存还没删」的那一瞬，下一个删的动作紧跟着就到。

    还剩最后一个小洞：删缓存的那一瞬恰好有读请求把旧值回填了回来（时序极端巧合）。补法叫延迟双删：更新后隔几百毫秒再删一次，把那份可能的回填也清掉。代价是多一次删除与短暂的不一致容忍，值不值取决于业务对这几百毫秒旧数据的容忍度——展示价格能忍，账户余额不能忍，那种数据压根不该走缓存决策。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: wr
      label: 写请求：商品改价
    - lane: db
      id: db
      label: 数据库：先落新价格（账本先行）
    - lane: redis
      id: rd
      label: Redis：随后删掉旧的那份
      highlight: true
    messages:
    - id: m1
      from: wr
      to: db
      label: 第一步：新值写进数据库
    - id: m2
      from: wr
      to: rd
      label: 第二步：删缓存，下个读者回源重抄
      active: true
    registers:
    - name: 删而不改
      value: 删是幂等的，不会写出半成品或乱序的错值
    - name: 残留窗口
      value: 库新缓存旧的一瞬，延迟双删再压一层
  log:
  - at: 写路径
    text: 账本先行、抄本删除：缓存永远重新抄，不涂改
- id: penetration
  title: 第六步：穿透——查不存在的东西，每次都砸到库
  tldr: 第一种翻车：请求查的商品编号根本不存在，缓存里永远攒不下这份「没有」，于是每个请求都穿过缓存砸到数据库。攻击者拿不存在编号狂刷时，它就是一次现成的拒绝服务。
  body: |-
    机制很直白。旁路缓存的规矩是未命中就回源，可如果数据在数据库里也不存在，回源查了个空，就没东西可回填——下次同样的请求来，还是未命中，还是回源。一个不存在的商品编号被每秒问一千次，数据库就白白挨一千次查询。正常用户偶尔输错编号无伤大雅，可要是有人拿着编号生成器恶意狂刷，[[缓存穿透]]就成了一把不用很大力气就能撬动数据库的杠杆。

    防法有两层。第一层是把空结果也缓存：查不到，就在缓存里放一个短命的空标记（比如 30 秒），这段时间里同样的请求在缓存门口就被答掉。第二层是[[布隆过滤器]]挡在前面：它用很小的内存记住「哪些编号是存在的」，问它不存在的，直接拒绝，连缓存都不用查；它的代价是极小的误判率——可能把个别存在的误判成不存在，所以只适合当第一道粗筛。

    两层都指向同一个判断：不存在的数据，也要给它一个便宜的答案，不能让「没有」成为最贵的查询。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: user
      id: atk
      label: 请求：狂查不存在的商品编号
    - lane: redis
      id: rd
      label: Redis：空标记与布隆过滤器先答掉
    - lane: db
      id: db
      label: 数据库：不再为「没有」反复挨查
      highlight: true
    messages:
    - id: m1
      from: atk
      to: rd
      label: 不存在的编号，在缓存门口就被答掉
      active: true
    registers:
    - name: 空值缓存
      value: 查不到的结果也存 30 秒，挡住重复的空查
    - name: 布隆过滤器
      value: 小内存粗筛存在性，代价是极小误判率
  log:
  - at: 穿透
    text: 让「没有」也有便宜的答案，是穿透的解法
- id: breakdown-avalanche
  title: 第七步：击穿与雪崩——过期方式决定翻车方式
  tldr: 另外两种翻车都和过期有关：击穿是一个热点数据过期瞬间、众人同时回源；雪崩是一大批数据同时过期、流量整片压向数据库。一个治点，一个治面，防法完全不同。
  body: |-
    先看[[缓存击穿]]。爆款商品的缓存设了一小时过期，到了整点那一秒它失效了，而这一秒正有一千个请求在问它：一千个请求同时发现未命中，同时涌向数据库去查同一行——查完第一个回填之后，后面的才陆续被拦下。数据库挨的这一下，就是击穿。防法一是互斥重建：只放一个请求去查库回填，其余的等一下再来读缓存；防法二是逻辑过期：缓存里多存一个逻辑过期时间，过了就先返回旧值，同时由一个请求异步去刷新，用户完全无感。

    再看[[缓存雪崩]]。如果中午十二点有一大批商品数据被批量写入缓存、都设了两小时过期，那么下午两点它们会集体失效，五千次每秒的读会整片压到数据库上——不是一行数据的问题，是整个缓存层的塌方。它的防法就是本课开头设计里立的那条规矩：过期时间加随机抖动，让失效时刻错开；再加一层后手，数据库前面留[[限流]]，缓存整体宕机时宁可拒绝一部分请求，也不能让数据库被打死。

    分清三者的口诀：穿透是数据不存在，击穿是热点单点过期，雪崩是批量同时过期。名字像，病灶完全两样，药不能混吃。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: redis
      id: hot
      label: 热点数据：整点过期的一瞬间
    - lane: app
      id: crowd
      label: 一千个请求：同时发现未命中
    - lane: db
      id: db
      label: 数据库：互斥重建只放一个进来查
      highlight: true
    messages:
    - id: m1
      from: crowd
      to: db
      label: 击穿的防法：只放一个回源，其余读旧值或等待
      active: true
    registers:
    - name: 击穿
      value: 单个热点过期瞬间并发回源，治点
    - name: 雪崩
      value: 批量同时过期整片回源，治面靠抖动加限流
  log:
  - at: 击穿雪崩
    text: 过期方式决定翻车方式：点靠互斥，面靠抖动
- id: eviction-limits
  title: 第八步：淘汰与边界——缓存里的数据生来可丢
  tldr: Redis 的内存是有上限的，满了就要删旧迎新：按最久没用（LRU）或用得最少（LFU）淘汰。这一条决定了缓存的使用纪律：任何数据都不能只存在于缓存里，它随时可能被淘汰、被清空。
  body: |-
    先看淘汰怎么工作。给 Redis 设了内存上限（比如 4GB），写满之后再写新数据，它按策略删一批旧的腾地方。最常用的是 [[LRU]]：删最久没被碰过的——背后的假设是刚用过的数据马上还会用，这和组成原理里缓存替换的逻辑同源。另一种 [[LFU]] 按使用频率删，适合热点长期稳定的场景。无论哪种，结论一致：缓存里的数据没有「一定还在」的承诺。

    由此推出两条纪律。第一，缓存只能放能重建的数据：数据库里有原件，或者能重新算出来。把只此一份的数据只写进 Redis，淘汰或宕机那天就是数据丢失那天。第二，要给缓存的故障留后手：Redis 挂掉时，全部流量瞬间直达数据库——这正是雪崩的极端形态，所以读路径要有限流与降级，数据库要按「缓存不在」的水位留一手容量。

    还有一种滥用要警惕：把 Redis 当队列、当分布式锁、当一切——它确实都能客串，但每种客串都有自己的坑。本课的立场是先把它本职的缓存用扎实，客串的用法知道存在、用时再查。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: redis
      id: rd
      label: Redis：内存写满，按 LRU 删最久没用的
    - lane: db
      id: db
      label: 数据库：原件永远在这里，可重建
      highlight: true
    messages:
    - id: m1
      from: rd
      to: db
      label: 被淘汰的数据，下次读时回源重抄即可
      active: true
    registers:
    - name: 淘汰策略
      value: LRU 删最久没用，LFU 删用得最少
    - name: 使用纪律
      value: 只放可重建的数据，缓存故障要有降级
  log:
  - at: 边界
    text: 缓存数据生来可丢，这是它的使用前提
- id: when-not-cache
  title: 第九步：反例——什么数据不该进缓存
  tldr: 缓存不是免费加速，它是拿一致性换速度的交易。有些数据天生不配这笔交易：要强一致的、写得比读还勤的、每个人都不一样的——放进去不是加速，是给自己埋不一致的雷。
  body: |-
    第一类是决策依据型数据。商品库存的展示数字放缓存没问题，晚几秒无伤大雅；可真正下单扣减时若拿缓存里的数字做判断，就会超卖——扣减必须走数据库的事务与锁，那是数据学科讲的领地。分布式学科里选 CP 还是选 AP 的那套判断，在这里有个具体投影：展示走 AP 式的缓存，扣减走 CP 式的数据库。

    第二类是写多读少的数据。一份数据写十次才被读一次，缓存它等于每次写都要多维护一份删的动作，收益为负。第三类是高度个性化、几乎不重复的数据：每个用户一份的推荐列表若彼此毫无重合，命中率天然上不去，缓存只是白占内存——除非单份的计算极贵（如复杂推荐模型的结果），才值得按「计算贵不贵」另算一笔账。

    判断口诀收成一句：先问这份数据读比写多多少、旧几秒会出多大事，两条都过关，才轮到缓存出场。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: judge
      label: 选型判断：这份数据配不配进缓存
    - lane: db
      id: keep
      label: 留在数据库的：扣减依据、写多读少、互不重复
      highlight: true
    messages:
    - id: m1
      from: judge
      to: keep
      label: 展示可以旧，决策不能旧
      active: true
    registers:
    - name: 两问
      value: 读比写多多少，旧几秒出多大事
  log:
  - at: 反例
    text: 缓存是拿一致性换速度，不配的数据别做这笔交易
- id: closing-cache
  title: 第十步：收束——缓存的三句规矩
  tldr: 全课收成三句：读走旁路先缓存后库，写先落库再删缓存，过期时间必加抖动。再加一条底线：缓存里只放丢得起、重建得出来的数据。做到这几条，缓存就是加速器；做不到，它就是事故源。
  body: |-
    把这一课的账并一并。缓存的收益是命中率：98% 的读被内存挡下，数据库只处理剩下的 2%。它的成本是一致性的维护：写路径用「先落库再删缓存」把不一致窗口压到最短，延迟双删再补一层。它的三种翻车各有固定防法：穿透用空值与布隆过滤器，击穿用互斥重建或逻辑过期，雪崩用过期抖动加限流后手。它的边界是数据生来可丢：淘汰策略决定了缓存里没有永久的东西。

    面试里被问到缓存，沿着这条线讲不会散：为什么快（内存与单线程）、读怎么写怎么写（旁路与删除）、会怎么坏（穿透击穿雪崩）、坏了怎么办（防法与降级）。这四段，就是缓存这一课的全部骨架。

    下一课把镜头拉回请求本身：一个写请求从用户点下按钮出发，过网关、限流、中间件、校验，最后落到数据库——这条完整的链路，每一关都在拦什么。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: rules
      label: 三句规矩：旁路读、删式写、抖动过期
    - lane: redis
      id: rd
      label: Redis：守规矩时是加速器
      highlight: true
    messages:
    - id: m1
      from: rules
      to: rd
      label: 规矩之外再加底线：只放丢得起的数据
      active: true
    registers:
    - name: 骨架
      value: 为什么快、读写规矩、三种翻车、淘汰边界
  log:
  - at: 收束
    text: 缓存的学问不在存，在于两份数据如何收场
