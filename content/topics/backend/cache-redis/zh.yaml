      label: 五千次读，读的是几乎不变的同一份答案
      active: true
    registers:
    - name: 读的形状
      value: 读多写少、答案高度重复，是缓存的适用签名
    - name: 要砍的浪费
      value: 同一份答案被源头重复算了五千遍
  log:
  - at: 场景
    text: 热点读把数据库压垮，病根是重复劳动
- id: why-redis-fast
  title: 第二步：Redis 为什么快——全内存，外加单线程的简单
  tldr: 抄本放在 Redis 里，理由是它快得理直气壮：数据全在内存，延迟比磁盘低几个数量级；命令由单线程顺序执行，没有锁的纠缠。它是为「快读快写小份数据」生的，不是数据库的替代品。
  body: |-
    先算延迟的账。读一次内存大约是百纳秒量级，读一次固态硬盘是百微秒量级，差着一千倍；机械硬盘还要再慢两个量级。数据库的数据主要躺在磁盘上（虽有缓冲池帮衬），而 [[Redis]] 把数据全部放在内存里——它的快，首先是介质的快。

    其次是模型的简单。Redis 处理命令基本是单线程顺序执行：一条命令做完再做下一条，没有多线程抢锁、切换的开销，计数器自增这类操作天然不会算错。代价它也认：一条慢命令会堵住后面所有人，所以它的数据结构都设计得操作简单、复杂度可控。单机每秒处理十万量级的命令，是它的常见水位。

    但要划清边界：内存贵且有限，Redis 存的是精选出来的热点小份数据；它也能把数据落盘做持久化，但定位始终是缓存与快速存储，不是账本。账本在数据库那边——这个分工在讲一致性时还会回来。
  derivation: original
  sources:
  - ref: redis-docs
    locator: "Redis Documentation: 数据结构、内存淘汰（maxmemory 与 eviction）与持久化"
    claim: Redis 是内存数据存储，提供字符串、哈希、列表、集合、有序集合等数据结构，并以 LRU/LFU 等策略在内存上限时淘汰键；其定位包含缓存与快速数据存储。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
