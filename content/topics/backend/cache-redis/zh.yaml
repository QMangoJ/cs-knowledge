      highlight: true
    messages:
    - id: m1
      from: crowd
      to: db
      label: 五千次读，读的是几乎不变的同一份答案
      active: true
    registers:
    - name: 读的形状
      value: 读多写少、答案高度重复，是缓存的适用签名
    - name: 要砍的浪费
      value: 同一份答案被源头重复算了五千遍
  log:
  - at: 场景
    text: 热点读把数据库压垮，病根是重复劳动
- id: why-redis-fast
  title: Redis 快在全内存介质，也快在单线程免锁执行
  tldr: "内存读取在百纳秒级，比固态硬盘快约一千倍；[[Redis]] 再靠单线程顺序跑命令省去锁竞争，单机轻松扛起每秒十万级操作。"
  body: |-
    抄本为什么首选放进 [[Redis]]？先看硬件账：读一次内存大约在百纳秒量级，读一次固态硬盘约百微秒，两者差着整整一千倍，机械硬盘更是慢出五六个数量级。关系型数据库的主体数据终究躺在磁盘上，而 Redis 把活跃数据全摊在内存里，起跑线就快了三个数量级。

    再看执行模型：Redis 处理读写命令采用单线程事件循环，一条命令跑完再接下一条，既没有多线程抢锁和上下文切换的内耗，做点赞自增这类计数时也天然不会算乱，单机每秒处理十万量级的命令是家常便饭。当然单线程也有脾气：一旦谁发了一条全量遍历的慢命令，后面排队的请求全得跟着干等，所以线上严禁跑耗时不可控的大命令。

    边界也得在开头划死：内存又贵又有限，哪怕开了持久化落盘，Redis 的本职依然是存放精选热点小数据的加速层，而不是替代数据库的唯一账本。
  derivation: original
  sources:
  - ref: redis-docs
    locator: "Redis Documentation: 数据结构、内存淘汰（maxmemory 与 eviction）与持久化"
    claim: Redis 是内存数据存储，提供字符串、哈希、列表、集合、有序集合等数据结构，并以 LRU/LFU 等策略在内存上限时淘汰键；其定位包含缓存与快速数据存储。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
