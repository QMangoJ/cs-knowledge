    - lane: app
      id: app
      label: 应用：发一条命令
    - lane: redis
      id: rd
      label: Redis：内存里顺序执行，微秒级返回
      highlight: true
    messages:
    - id: m1
      from: app
      to: rd
      label: 读一次内存比读一次磁盘快约三个数量级
      active: true
    registers:
    - name: 延迟量级
      value: 内存约百纳秒，固态硬盘约百微秒
    - name: 吞吐水位
      value: 单机每秒十万量级的命令，单线程顺序执行
  log:
  - at: 选型
    text: 快来自介质与模型：全内存、单线程、无锁
- id: data-structures
  title: 五种原生数据结构：数据长什么样就递什么刀
  tldr: "[[Redis]] 把排行榜排序、原子自增与集合判重直接做成贴着数据的服务端命令，省掉应用层拉全量数据加锁自算的折腾。"
  body: |-
    拿开场的电商业务往里套，五种高频结构各司其职：整份商品详情可以序列化成**字符串**存下，想单独改价格字段也可以拆成**哈希**按字段存；实时热搜榜既要按热度加分又要随时取前十，**有序集合**（Sorted Set）把话题当成员、热度当分值，加分和取榜各只需一条命令（微博热搜榜就是典型代表）；点赞数与库存展示走字符串的原子自增命令（如抖音点赞计数），高并发下绝不漏记；判断「该用户领过新人券没有」用**集合**（Set）一次判重搞定；上一课的登录[[会话]]档案，则是带过期时间的字符串。

    为什么不干脆全塞进普通字符串、拉回应用代码自己算？试想榜单如果放在应用层排，每次更新都得把整张榜拉过网络、加锁排好再写回去；计数如果放在应用层加一，并发一高立刻撞车。把高频操作下沉成紧贴数据的服务端原子命令，正是 Redis 比普通「内存键值柜」值钱的地方。

    反过来也要守住边界：一旦数据大到要多条件翻页、跨表关联统计，就赶紧退回关系型数据库——Redis 是给热而小的数据准备的手术刀，不是堆货大仓库。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: need
      label: 五类需求：详情、榜单、计数、去重、档案
    - lane: redis
      id: shapes
      label: 五种结构：字符串、哈希、有序集合、计数、集合
      highlight: true
    messages:
    - id: m1
      from: need
      to: shapes
      label: 数据长什么形状，就选什么结构
      active: true
    registers:
    - name: 排行榜
      value: 有序集合：成员加分值，取前十是一条命令
    - name: 计数器
      value: 自增是原子操作，并发点赞不会算错
  log:
  - at: 结构
    text: 计算贴着数据做，高频操作收进服务端命令
- id: read-path
  title: 旁路缓存读路径：命中直返，未命中查库回填
  tldr: 应用统一先查 Redis、未命中再查数据库并顺手写回缓存；98% 的命中率就能把每秒五千次数据库查询压回一百次。
  body: |-
    商品详情请求进门后，应用按固定三步走：先拿商品编号问 Redis，查到了直接返回给用户，数据库连面都不用见——这就是缓存命中；没查到（首次访问或刚过期），再去数据库捞出这行商品，一边返回给用户，一边顺手抄一份塞进 Redis 并设好过期时间。这套「缓存站在数据库旁侧、由应用统一调度」的标准套路，就叫旁路缓存（Cache-Aside）。

    拿数字算一笔收益账：只要这套详情缓存做到 98% 命中率，每秒五千次请求里就有四千九百次在内存门口直接打发，落到数据库的只剩一百次，负载瞬间降到原来的五十分之一。

    但硬币还有反面：未命中的那 2% 请求其实比不用缓存还多绕了一趟 Redis。所以缓存层自己必须既快又稳，同时应用代码必须留好降级开关——万一 Redis 网络抖动或宕机，读请求要能配合限流退回直查数据库，绝不能被旁路组件拖着一起卡死。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: app
      label: 应用：先问缓存，再问数据库
    - lane: redis
      id: rd
      label: Redis：98% 的读在这里被拦下
    - lane: db
      id: db
      label: 数据库：只接待未命中的那 2%
      highlight: true
    messages:
    - id: m1
      from: app
      to: rd
      label: 先查缓存：命中直接返回
    - id: m2
      from: app
      to: db
      label: 未命中才查库，查完回填缓存
      active: true
    registers:
    - name: 命中率 98%
      value: 五千次读只剩一百次落到数据库
    - name: 降级后手
      value: 缓存挂了要能直查数据库，不能陪葬
  log:
  - at: 读路径
    text: 先缓存后库、未命中回填，收益就是命中率
- id: write-path
  title: 写路径铁律：先更新数据库，再删掉旧缓存
  tldr: 商品改价时「删缓存而不改缓存」能防并发写乱序覆盖，「先写库再删缓存」则堵死先删后写空窗期里旧值被读请求重新抄回缓存的漏洞。
  body: |-
    运营在后台把商品从 100 元改成 80 元时，缓存怎么动？这里有两个极易踩坑的分岔。第一问：为什么是**删掉缓存**而不是顺手把 80 元写进缓存？设想两个运营先后改价（A 改 90、B 改 80），数据库里 B 后到存下了 80，可网络一抖，写缓存时 A 的请求反而晚一步到达，直接拿 90 盖掉了 80——从此缓存里躺着错价。改成「只删不改」就没这毛病：删除天然幂等，删完由下一个读请求从数据库原件重抄最新值即可。

    第二问更关键：为什么必须**先写数据库、再删缓存**，反过来先删缓存不行吗？拿并发时序跑一遍就清楚了：假如写请求 A 先删了缓存，正准备往数据库写 80 元；就在这几毫秒空窗里，读请求 B 冲进来发现缓存空了，扭头去数据库读出还没改完的旧价 100 元，顺手把 100 元重新回填进 Redis！紧接着 A 把数据库改成了 80 元，可 Redis 里的 100 元再也没人去删，一路错到过期为止。

    反过来「先写库、再删缓存」，不一致窗口就只剩「库刚改成 80、删除命令还在路上」的那一两毫秒，删除一到立刻清零。哪怕撞上「缓存恰好过期时慢读与快写交错」这种极低概率巧合，也只需在更新后隔几百毫秒补一次**延迟双删**就能兜底——当然，像账户余额这种连几百毫秒旧值都容不下的强一致数据，压根就不该拿缓存做判断。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: wr
      label: 写请求：商品改价
    - lane: db
      id: db
      label: 数据库：先落新价格（账本先行）
    - lane: redis
      id: rd
      label: Redis：随后删掉旧的那份
      highlight: true
    messages:
    - id: m1
      from: wr
      to: db
      label: 第一步：新值写进数据库
    - id: m2
      from: wr
      to: rd
      label: 第二步：删缓存，下个读者回源重抄
      active: true
    registers:
    - name: 删而不改
      value: 删是幂等的，不会写出半成品或乱序的错值
    - name: 残留窗口
      value: 库新缓存旧的一瞬，延迟双删再压一层
  log:
  - at: 写路径
    text: 账本先行、抄本删除：缓存永远重新抄，不涂改
- id: penetration
  title: 缓存穿透：狂查不存在的编号，句句砸穿到库
  tldr: "请求查询数据库里也根本没有的商品编号时，缓存攒不下结果，恶意遍历就会句句打穿到库；靠短命空值标记或前置[[布隆过滤器]]给「查无此物」发一份低成本答卷。"
  body: |-
    旁路缓存默认「未命中就回源查库再回填」，可要是请求查的商品编号在数据库里也压根不存在呢？回源查了个寂寞，没东西可回填，下一秒同样的编号再来，照样穿过缓存直砸数据库。正常买家偶尔点错链接无所谓，可一旦有人拿脚本每秒狂刷一千个负数或随机商品编号，[[缓存穿透]]就成了撬垮数据库的现成杠杆。

    拦住它有两道闸。第一道是**缓存空结果**：数据库查出为空时，照样往 Redis 写一个只活 30 秒的空标记，随后半分钟内重复刷同一个假编号的请求在内存门口就被打发掉。

    要是攻击者每次换一个不重样的假编号呢？这就轮到第二道闸[[布隆过滤器]]上场：它用极小的位数组内存预先记下所有真实存在的商品编号，凡是它判定「不存在」的编号，请求连 Redis 都不用进就直接回绝；代价是存在极低的误判率，只适合摆在最前面做粗筛。两招说到底是一个理：不能让「没有」变成全站最昂贵的查询。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: user
      id: atk
      label: 请求：狂查不存在的商品编号
    - lane: redis
      id: rd
      label: Redis：空标记与布隆过滤器先答掉
    - lane: db
      id: db
      label: 数据库：不再为「没有」反复挨查
      highlight: true
    messages:
    - id: m1
      from: atk
      to: rd
      label: 不存在的编号，在缓存门口就被答掉
      active: true
    registers:
    - name: 空值缓存
      value: 查不到的结果也存 30 秒，挡住重复的空查
    - name: 布隆过滤器
      value: 小内存粗筛存在性，代价是极小误判率
  log:
  - at: 穿透
    text: 让「没有」也有便宜的答案，是穿透的解法
- id: breakdown-avalanche
  title: 击穿与雪崩：单点过期靠互斥，成批过期靠抖动
  tldr: "[[缓存击穿]]是单个爆款整点失效引来千人同时回源，靠互斥重建或逻辑过期化解；[[缓存雪崩]]是大批缓存同时到期或宕机引发整片塌方，靠过期随机抖动与数据库限流兜底。"
  body: |-
    回到开场那件每秒五千次访问的爆款商品：假如它的缓存设了整整 1 小时过期，到点失效的那一秒恰好涌进一千个请求，这一千个请求同时发现缓存没了，一窝蜂冲进数据库查同一行商品——在第一个请求把结果抄回 Redis 之前，数据库已经结结实实挨了一记闷棍，这就是[[缓存击穿]]。治单点爆款有两招：要么加**互斥锁**，只放一个请求进库回填，其余九百九十九个稍等片刻再读缓存；要么用**逻辑过期**，缓存永不物理删除，只把过期时间戳写在值里面，发现过期先秒回旧值，同时派一个后台线程异步刷新。

    [[缓存雪崩]]则是成片塌方：大促前在中午十二点批量预热十万件商品，清一色设两小时过期，到了下午两点十万个键齐刷刷失效，全站流量整片砸向数据库。治成片失效靠写入时给过期时间加**随机抖动**（比如两小时再加零到五分钟随机数），把回源请求摊平到时间轴上；同时在数据库门前配好[[限流]]降级，万一碰上 Redis 整机宕机这种极端雪崩，宁可拒掉一部分外围请求，也绝不让数据库陪葬。

    三个词长得很像，记死病灶就绝不会混：穿透是「根本不存在」，击穿是「单个爆款到期」，雪崩是「大批集体到期」。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: redis
      id: hot
      label: 热点数据：整点过期的一瞬间
    - lane: app
      id: crowd
      label: 一千个请求：同时发现未命中
    - lane: db
      id: db
      label: 数据库：互斥重建只放一个进来查
      highlight: true
    messages:
    - id: m1
      from: crowd
      to: db
      label: 击穿的防法：只放一个回源，其余读旧值或等待
      active: true
    registers:
    - name: 击穿
      value: 单个热点过期瞬间并发回源，治点
    - name: 雪崩
      value: 批量同时过期整片回源，治面靠抖动加限流
  log:
  - at: 击穿雪崩
    text: 过期方式决定翻车方式：点靠互斥，面靠抖动
- id: eviction-limits
  title: 淘汰策略与底线：缓存里的数据生来可丢
  tldr: "内存触及上限后 Redis 会按 [[LRU]] 或 [[LFU]] 自动清退旧键；因此缓存里绝不能存孤本数据，数据库原件必须随时能把它重建出来。"
  body: |-
    给 Redis 划定 4GB 内存上限后，一旦写满还要塞新数据，它就会按淘汰策略删旧腾地。默认最常用的是 [[LRU]]（淘汰最久没被访问的键），和 CPU 缓存替换一脉相承；如果某些爆款长期稳居热榜、怕被偶发的批量扫描冲掉，可以切到按访问频次淘汰的 [[LFU]]。无论选哪一种，潜台词都只有一句：Redis 从不承诺里面的键一直都在。

    看清这一点，两条工程纪律就不言自明。第一，**只放丢得起、能重建的数据**：原件必须稳稳躺在数据库里，谁把唯一一份业务状态只写进缓存，内存淘汰或机器重启那天就是丢数据事故。第二，**给空缓存留好活路**：预演「此刻 Redis 突然清空，数据库能不能靠[[限流]]与降级活下来」，平时就留足余量。

    顺带提个醒：Redis 虽然也能客串消息队列或分布式锁，但每种客串都有丢消息或锁超时的暗礁；先把「可丢弃的热点缓存」这份本职用扎实，再去碰进阶玩法。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: redis
      id: rd
      label: Redis：内存写满，按 LRU 删最久没用的
    - lane: db
      id: db
      label: 数据库：原件永远在这里，可重建
      highlight: true
    messages:
    - id: m1
      from: rd
      to: db
      label: 被淘汰的数据，下次读时回源重抄即可
      active: true
    registers:
    - name: 淘汰策略
      value: LRU 删最久没用，LFU 删用得最少
    - name: 使用纪律
      value: 只放可重建的数据，缓存故障要有降级
  log:
  - at: 边界
    text: 缓存数据生来可丢，这是它的使用前提
- id: when-not-cache
  title: 反例边界：三类一进缓存就添乱的数据
  tldr: 扣款扣库存的决策依据、写比读还频繁的流水、千人千面互不重复的结果，强行塞进缓存只会赔上资金安全或白烧内存。
  body: |-
    缓存的本质是拿「短暂旧几秒」去换「微秒级响应」，三类数据天生做不得这笔买卖。头一类是**扣减决策依据**：详情页上的「剩余库存」放缓存展示没问题，晚两秒更新顶多让买家点进去提示售罄；可真正下单扣库存、扣账户余额时，如果拿缓存里的旧数字做判断，高并发下立刻超卖超扣——这类强一致动作必须回数据库走事务与行锁（借分布式课的术语，展示走 AP 缓存，扣减走 CP 账本）。

    第二类是**写多读少的数据**：像高频上报的轨迹流水，写十次才被查一次，加缓存等于每次写入白白多发一条删除命令，纯属倒贴。第三类是**千人千面且毫无重合的数据**：每个用户独一份、刷新完就不再看的列表，命中率低到可怜，塞进内存只是徒增淘汰压力——除非单次计算本身昂贵到离谱（比如重型推荐模型推理结果），才值得专门缓存。

    动手加缓存前先问两句：「读比写多出几个量级？」「数据旧三秒会不会出资损？」两关都过了再请 Redis 出山。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: judge
      label: 选型判断：这份数据配不配进缓存
    - lane: db
      id: keep
      label: 留在数据库的：扣减依据、写多读少、互不重复
      highlight: true
    messages:
    - id: m1
      from: judge
      to: keep
      label: 展示可以旧，决策不能旧
      active: true
    registers:
    - name: 两问
      value: 读比写多多少，旧几秒出多大事
  log:
  - at: 反例
    text: 缓存是拿一致性换速度，不配的数据别做这笔交易
- id: closing-cache
  title: 缓存落地四步清单：读写规矩、三防与兜底底线
  tldr: 守住「读走旁路、写先落库再删缓存、过期必加随机抖动、只放可重建副本」四条规矩，缓存才是稳定的加速器。
  body: |-
    把爆款商品每秒五千次读平安接住，靠的不是把数据往 Redis 一丢了事，而是四步环环相扣的纪律——面试作答或上线前自查都可以顺着这张清单逐项打钩：

    - **选对结构**：纯对象用字符串或哈希，实时榜单用有序集合，并发计数用原子自增，判重用集合。
    - **守死读写顺序**：读统一走旁路缓存（命中直返、未命中查库回填）；写一律「先更新数据库，再删缓存」，严禁并发改缓存或先删后写。
    - **对症布好三防**：空值短存或布隆过滤器防**穿透**，互斥锁或逻辑过期防单点**击穿**，过期时间加随机抖动配数据库限流防成片**雪崩**。
    - **划清账本底线**：默认缓存随时会被淘汰或宕机清空，展示可以读副本，扣款扣库存只认数据库事务。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: rules
      label: 三句规矩：旁路读、删式写、抖动过期
    - lane: redis
      id: rd
      label: Redis：守规矩时是加速器
      highlight: true
    messages:
    - id: m1
      from: rules
      to: rd
      label: 规矩之外再加底线：只放丢得起的数据
      active: true
    registers:
    - name: 骨架
      value: 为什么快、读写规矩、三种翻车、淘汰边界
  log:
  - at: 收束
    text: 缓存的学问不在存，在于两份数据如何收场
