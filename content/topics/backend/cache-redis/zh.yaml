overview:
- key: 一句话总结
  value: 同一份热点数据每秒被问五千遍，就不该去数据库现查五千遍。把副本抄进内存里的 Redis，读走旁路、写先落库再删缓存，再防住穿透、击穿、雪崩三类翻车——处理好原件与抄本的时差，就是缓存的全部手艺。
- key: 读路径的规矩
  value: 标配旁路缓存（Cache-Aside）：先查 Redis，命中直返；未命中才查数据库，并顺手把结果抄回缓存。规则收口在一处，命中率才算得清、降级才兜得住。
- key: 写路径的规矩
  value: 更新数据时「先写数据库，再删缓存」，绝不直接改缓存。删除天然幂等，不怕并发写乱序覆盖；若极端并发下仍有读请求回填旧值，可用延迟双删或订阅变更日志再清一次。
- key: 三种翻车
  value: 穿透是狂查不存在的数据、句句漏到库（防靠空值缓存或布隆过滤器）；击穿是单个热点过期瞬间千人同时回源（防靠互斥重建或逻辑过期）；雪崩是大批键同时到期整片压垮数据库（防靠过期加随机抖动与限流）。
- key: 淘汰策略
  value: 内存写满后按 LRU（删最久未碰）或 LFU（删访问最少）腾地方。缓存里的数据生来可丢，只能放数据库能随时重建的副本，绝不能当唯一账本。
- key: 谁在用
  value: 商品详情、微博热搜榜（有序集合）、抖音点赞计数（原子自增）以及上一课的登录会话，凡是读多写少的热点小数据，线上几乎都蹲在 Redis 里。
summary: |-
  缓存的核心手艺，是把读多写少的热点数据抄一份放进内存（最常用的是 Redis），让九成以上的重复读在微秒级直接返回。读路径统一走旁路缓存：先问 Redis，未命中再查数据库并回填；写路径严守「先更新数据库，再删除缓存」，避免并发改缓存乱序或先删后写导致旧值长驻。在此之上，用空值缓存与布隆过滤器拦穿透、用互斥锁或逻辑过期防击穿、用随机抖动错峰防雪崩，并守住一条铁律：缓存随时会被内存淘汰或重启清空，只能给展示加速，绝不能拿来做扣款扣库存的决策依据。
premise: 一件爆款商品冲上热搜，详情页每秒涌进五千次打开请求。每次请求应用都老老实实去数据库查同一行商品数据，数据库的磁盘与 CPU 先撑不住了——可商品名称、价格和配图一天也改不了两回，五千次查询里有四千九百九十九次都在搬运同一份答案。怎样把这批重复读拦在数据库门外？一旦商家中途改价，抄出来的副本又怎么跟数据库原件对齐？
position: 本课位于后端工程第六板块「加速：缓存与 Redis」。上一课把会话档案存进 Redis 只用到了它共享键值柜的一面，本课补齐它作为数据库前置加速层的全貌：原生数据结构选型、旁路读写顺序与三种高并发翻车防线。它与数据学科形成内外分工——那边讲数据库内部怎样组织索引与事务，本课讲怎样在数据库门前拦下绝大多数重复读。
level: 基础
minutes: 26
objectives:
- 算清缓存命中率账：98% 命中率能把数据库读压力压到原来的几分之几
- 为商品详情、热搜榜、点赞计数、领券去重与会话选对 Redis 数据结构
- 推演写路径为什么必须「先写库再删缓存」，说清先删后写与直接改缓存各自的并发漏洞
- 分清缓存穿透、击穿、雪崩的病灶，并对症给出工程防法
aiLink: 缓存的所有坑都是「原件与抄本怎么对齐」的变体。评审代码紧盯四条：读走旁路、写先落库再删缓存、过期时间必加随机抖动、扣款扣库存绝不信缓存。
bridge:
  prev: 上一课把登录会话放进 Redis 时，只借用了它多机共享、微秒级响应的底座；其实在后端架构里，它更吃重的岗位是挡在数据库门前扛下热点读洪峰。
  next: 读请求靠缓存挡下了大半，可用户点下「提交订单」发起写请求时，从入口网关、限流、中间件一直到落库防重，整条链路要闯过哪些关口？下一课跟着一个请求从头走到尾。
design:
- mechanism: 旁路缓存（Cache-Aside）统一收口读路径
  problem: 如果放任几十个业务接口各自决定先查谁、未命中回不回填，迟早有人漏查缓存、有人忘了设过期时间，命中率和一致性立刻失控。
  choice: 把读封装成固定三步：先查缓存，命中直返；未命中查库，写回缓存再返回。业务层只声明「要哪份数据」，不手工拼装缓存细节。
  tradeoff: 未命中请求比直查数据库多绕一趟 Redis；且 Redis 成了读路径必经节点，一旦慢了或挂了必须有直查数据库加限流的降级后手。
  root: 读是后端最高频的动作，只有把路径收成唯一入口，监控命中率、压测容量与故障降级才有抓手。
- mechanism: 写路径坚持「先落数据库，再删缓存」
  problem: 数据更新时，同时操作数据库与缓存有「改还是删」「谁先谁后」四种组合；并发一旦交错，选错顺序就会把脏旧数据长期钉死在缓存里。
  choice: 先把新值提交进数据库（唯一账本），再删掉缓存里的旧键，留给下一个读请求自然回源重抄。
  tradeoff: 数据库刚提交、缓存还没删掉的极短一瞬仍可能读到旧值；极端时序下冷读慢写交错的残余小洞，需视业务容忍度决定是否加延迟双删或变更日志异步清理。
  root: 副本永远从属于原件：数据库是唯一真相源，缓存只是随时可撕掉重抄的草稿纸——撕掉重抄幂等安全，在草稿纸上并发涂改必乱。
- mechanism: 过期时间叠加随机抖动（Jitter）
  problem: 大促预热或定时任务常在同一秒批量写入几万个缓存键，如果统一设两小时过期，两小时后它们会在同一秒集体失效，回源流量瞬间冲垮数据库。
  choice: 在基础过期时长上叠加一段随机偏移（例如 2 小时再加 0 到 300 秒随机数），把集中到期的尖峰摊平到几分钟的时间窗里。
  tradeoff: 各键的保鲜期不再整齐划一，个别旧数据可能多留几分钟；换来的是数据库免遭整点洪峰冲击。
  root: 压垮系统的往往不是总流量，而是齐步走的同步峰值——用一点随机性打散齐步走，是成本最低的削峰手段。
quiz:
- q: 商品改价时，为什么推荐「先写数据库，再删缓存」，而不是「先删缓存，再写数据库」？
  options:
  - 因为 Redis 删除命令比数据库更新命令执行得更快
  - 先删缓存再写库的空窗期里，并发读请求会去库里读出旧价格重新回填进缓存，导致旧值长期滞留
  - 因为关系型数据库事务禁止在此之前访问外部缓存
  - 两种顺序效果完全一样，只是代码书写习惯
  answer: 1
  explain: 先删缓存还没来得及写库的那几毫秒里，只要插进一个读请求，它发现缓存空了就会去库里读出旧值写回缓存；随后写请求落库完毕，缓存里躺着的旧值再也没人去删，只能干等过期。
- q: 缓存穿透与缓存击穿的根本区别是什么？
  options:
  - 穿透是 Redis 宕机，击穿是数据库宕机
  - 穿透查的是库里也根本不存在的数据，每次都漏到库；击穿是单个热点数据刚过期那一刻，大批并发请求同时回源查库
  - 穿透只发生在凌晨低峰期，击穿只发生在大促秒杀期
  - 两者只是同一个故障在不同公司的叫法
  answer: 1
  explain: 穿透输在「查无此物」，缓存永远攒不下结果，得靠缓存短命空值或布隆过滤器挡门；击穿输在「单点爆款整点失效」，得靠互斥锁只放一个请求回源，或用逻辑过期异步刷新。
- q: 给缓存过期时间加上几分钟的随机抖动，主要防的是哪种事故？
  options:
  - 缓存穿透
  - 缓存击穿
  - 缓存雪崩
  - 主从脑裂
  answer: 2
  explain: 批量写入的缓存若设相同时长，会在同一秒集体失效引发雪崩；加上随机偏移能把回源请求打散到不同时刻。单个热点的击穿靠抖动救不了，得靠互斥重建。
- q: 下面哪类数据最不适合直接拿缓存里的值做业务处理？
  options:
  - 爆款商品详情页的图文介绍
  - 全站实时热搜前十榜单
  - 用户下单扣款时的账户可用余额依据
  - 登录成功后的用户会话档案
  answer: 2
  explain: 缓存副本天生存在毫秒到秒级的滞后，图文和榜单旧几秒无伤大雅，但拿滞后的余额或库存做扣减判断会直接导致超扣或超卖，这类强一致决策必须走数据库事务与锁。
steps:
- id: read-storm
  title: 每秒五千次读同一行商品，把抄本挪进内存挡刀
  tldr: "面对读多写少、答案高度重复的热点流量，[[缓存]]把结果抄进独立内存服务供全站共享，免得数据库为同一份答案每秒重查五千遍。"
  body: |-
    一台常规配置的数据库服务器，扛简单的主键查询大约在每秒几千次的水位，还得照顾全站其他读写。一旦某件爆款商品冲上热搜，详情页每秒涌进五千次打开请求，应用要是每次都老老实实去库里查那一行商品记录（标题、价格、配图、展示库存），数据库的 CPU 最先见顶——可这些字段一天也改不了两回，五千次查回来的全是同一份答案。

    凡是「读远多于写、答案高度重复」的地方，就是[[缓存]]上场的信号：与其每次都回源头现查，不如把答案抄一份摆在离应用最近的地方。组成原理里的 CPU 缓存、数据库内部的缓冲池、前端浏览器里的本地缓存，全都在用同一招；落到后端应用层，这份抄本通常跑在一台独立的内存服务器进程里，供所有业务实例共同读取。

    抄本一立，紧跟着就长出一个贯穿全课的矛盾：数据库原件和内存抄本成了两份数据，商家一旦改价，抄本怎么跟上？顺着下面的硬件底子与读写路径走完，答案自然落地。
  derivation: original
  canvas:
