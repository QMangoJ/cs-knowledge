overview:
- key: 一句话总结
  value: 缓存的本质是把答案抄在手边：同一份数据被读一千次，就不该去数据库算一千次。Redis 是最常用的那本草稿纸——数据全在内存、读写微秒级、自带多种数据结构。它的全部麻烦也来自同一件事：草稿纸和账本是两份数据，怎么让它们别差太多，就是缓存一致性的全部内容。
- key: 读路径的规矩
  value: 业界标配是旁路缓存：先查缓存，有就直接用；没有才查数据库，并顺手把结果抄回缓存。读的逻辑收在这一条路径里，业务代码不用到处操心缓存的存在。
- key: 写路径的规矩
  value: 更新数据时先写数据库、再删缓存，而不是去改缓存。删是幂等且不会写出半成品的动作；残留的不一致窗口只剩删之前的极短一瞬，真要再补，就用延迟双删把窗口再压一层。
- key: 三种翻车
  value: 穿透是查根本不存在的数据、每次都砸到库；击穿是热点数据过期瞬间众人一起回源；雪崩是大批数据同时过期、流量整片压垮数据库。三者的防法分别是缓存空值或布隆过滤、重建互斥或逻辑过期、过期时间加随机抖动。
- key: 淘汰策略
  value: 内存是有上限的，满了就得删旧迎新：LRU 删最久没用的，LFU 删用得最少的。所以缓存里的数据生来就是可丢的——任何把缓存当数据库用的设计，都在给自己埋雷。
- key: 谁在用
  value: 商品详情、热搜榜、会话档案、计数器——读多写少的热点数据几乎都在 Redis 里。抖音的点赞计数、微博的热搜榜是公开谈过的用法；上一课的会话档案，经典落点也是它。
summary: 场景是这样的：一件爆款商品上了热搜，它的详情页每秒被打开五千次，每次都要去数据库把同一行数据读出来。数据库的磁盘和 CPU 先撑不住了，可这五千次读里有四千九百九十九次读到的是一模一样的内容。本课讲的缓存，就是把这份重复劳动砍掉：把热点数据抄一份放在内存里，读先读它。先讲 Redis 为什么快、它的数据结构各自解决什么，再走一遍读写两条路径的规矩，最后把穿透、击穿、雪崩这三种经典翻车连同防法一次讲清。
premise: 这节课要回答的问题是：一份数据被成千上万人反复读，凭什么每次都去数据库里现查？数据库慢在哪、内存快在哪，这笔账先算清；然后是一个更棘手的问题——抄出来的那份和账本原件迟早会不一样，差多少能忍、怎么收场，才是缓存真正的学问。
position: 本课位于后端工程学科的第六段「加速：缓存与 Redis」，接在认证与会话之后：上一课把登录档案放进 Redis 时只用了它一个岗位，这一课把它的全貌补齐——数据结构、读写路径、一致性与三种翻车。它和数据学科的关系是分工：那边讲数据库自己怎么存怎么查，这一课讲怎么在数据库前面加一层，让大多数读根本到不了数据库。
level: 基础
minutes: 26
objectives:
- 能算清缓存的收益账：多少读被内存挡下，数据库的压力降到几分之几
- 能给常见数据（排行榜、计数、会话、详情页）选对 Redis 数据结构
- 能说清写路径为什么是先写库再删缓存，以及延迟双删补的是哪个窗口
- 能分清穿透、击穿、雪崩的成因，并对症给出防法
aiLink: 缓存的所有问题都是同一个问题的变体：两份数据如何保持足够接近。记住「读走旁路、写先落库再删缓存、过期必加抖动」这三句，其余都是在这三句上打补丁。
bridge:
  prev: 上一课结尾把登录档案交给了 Redis 存着，只说了它快、适合放共享状态。可 Redis 在后端里远不止一个档案柜：它是挡在数据库前面的那层加速层，这一课把它的岗位全貌讲清。
  next: 缓存让读变快了，可一个写请求从用户点下按钮到落进数据库，中间要过多少关、每一关拦什么，还没拆过。下一课把一个请求完整地追一遍：网关、限流、中间件、校验、幂等，一关一关看。
design:
- mechanism: 旁路缓存（Cache-Aside）作为默认读路径
  problem: 如果让业务代码各自决定何时查缓存、何时查库，规则会散落在几十个地方，迟早有人漏查缓存、有人查完忘了回填，缓存命中率与一致性都无从谈起。
  choice: 把读收成一条固定路径：先缓存后数据库，未命中时回填。业务代码只管「要这份数据」，缓存的存在由这条路径统一处理。
  tradeoff: 每个读都要先多问缓存一句，未命中时还要多走一趟回填；且缓存层成了读路径上的必经组件，它挂了要设计好降级直查数据库的后手。
  root: 读是后端最高频的操作，高频路径最怕规则分散——把规则收成一条，所有优化与统计才有地方落。
- mechanism: 写路径先落库、再删缓存
  problem: 数据更新时缓存怎么办有四种组合（先删还是先改、先缓存还是先库），选错了会把中间状态或旧值长时间留在缓存里，被无数读者读到。
  choice: 先把新值写进数据库（唯一的账本），再把缓存里那份删掉，下一个读者自然会回源拿到新值并回填。删而不是改，是因为删是幂等的、不会写出半成品。
  tradeoff: 删缓存之前的一瞬间仍有读者读到旧值，窗口虽小但存在；并发极端时序下还有极小概率残留脏数据，要靠延迟双删或订阅变更日志再补一层。
  root: 一致性问题的通用解法是先选定唯一的真相来源——数据库是账本，缓存只是抄本，抄本错了就撕掉重抄，而不是在抄本上涂改。
- mechanism: 过期时间加随机抖动
  problem: 一批数据在同一时刻被写进缓存、设了同样的过期时间，就会同一时刻集体过期，流量整片回源把数据库打垮——这就是雪崩的成因。
  choice: 给每个过期时间加上一个随机量（比如基础一小时再加零到五分钟的随机数），让过期时刻天然错开。
  tradeoff: 数据的新鲜度从整齐划一变成因数据而异，个别数据可能比预期多留几分钟；换来的是回源流量被摊平到时间轴上。
  root: 很多系统事故不是总量太大，而是峰值太齐——把整齐的时刻打散，是比扩容更便宜的削峰手段。
quiz:
- q: 写路径为什么推荐「先写数据库，再删缓存」，而不是「先删缓存，再写数据库」？
  options:
  - 因为删缓存比写数据库快
  - 先删后写的空窗里，一个读请求会把旧值重新回填进缓存，旧值可能长期赖着不走
  - 因为数据库不允许先被写
  - 两种顺序完全等价，只是习惯
  answer: 1
  explain: 先删缓存再写库时，若有读请求插进来，它查不到缓存、去库里读到旧值并回填，等写请求落库后，缓存里躺的已经是旧值且无人再删。先写库再删缓存把不一致窗口压到最短。
- q: 缓存穿透和缓存击穿的区别是？
  options:
  - 穿透是缓存服务器宕机，击穿是数据库宕机
  - 穿透是查根本不存在的数据、永远不会被缓存；击穿是存在的热点数据刚好过期，众人同时回源
  - 穿透只发生在夜间，击穿只发生在促销时
  - 两者是同一个问题的两种叫法
  answer: 1
  explain: 穿透的关键词是「不存在」：缓存里攒不下结果，每次都穿过去。击穿的关键词是「热点加过期瞬间」：数据存在且极热，失效那一刻并发回源。防法因此不同：空值缓存或布隆过滤对穿透，互斥重建或逻辑过期对击穿。
- q: 给过期时间加随机抖动，防的是哪种翻车？
  options:
  - 穿透
  - 击穿
  - 雪崩
  - 脑裂
  answer: 2
  explain: 雪崩的成因是大批缓存同时过期、流量整片压向数据库。抖动把过期时刻错开，回源被摊平。击穿是单个热点的问题，抖动帮不上，要靠互斥或逻辑过期。
- q: 下列哪类数据最不适合放进缓存？
  options:
  - 商品详情页的展示数据
  - 热搜排行榜
  - 账户余额的扣减依据
  - 用户的登录会话档案
  answer: 2
  explain: 缓存里的副本天然可能旧几秒：展示旧一点没关系，拿它当扣款依据就会超扣或误扣。余额这类强一致数据要走数据库与事务，缓存顶多放它的展示副本，且不能用副本做决策。
steps:
- id: read-storm
  title: 第一步：场景——五千次读，读的是同一行数据
  tldr: 先把浪费算出来：一件爆款商品的详情页每秒五千次请求，每次都去数据库读同一行几乎不变的数据。数据库先被读垮，而这五千次里绝大多数是重复劳动——缓存就是来砍这份重复的。
  body: |-
    把账算具体。一台普通的数据库服务器，扛简单的按主键查询大约在每秒几千次的量级，还得和其他查询分着用。现在一件爆款商品上了热搜，它的详情页每秒涌进五千次打开，每次打开，应用都老老实实去数据库把这行商品数据读一遍：名称、价格、图片、库存展示。商品信息一天也改不了几次——五千次读，读的是同一份答案。

    这就是[[缓存]]要解决的问题的形状：读多写少、答案重复。与其让每个请求都去源头重算一遍答案，不如把答案抄一份放在离请求最近的地方，谁来问先看抄本。这个思想在计算机里到处都是——组成原理课里的 CPU 缓存、数据课里的缓冲池，都是同一招在不同层上的复刻。本课讲的是应用层这一份：抄本放在一台专门的内存服务器里，全站共享。

    抄本带来一个新问题，它会贯穿全课：抄本和原件是两份数据，原件变了，抄本怎么办。先记住问题，走完读写两条路径，答案自然浮出来。
  derivation: original
  canvas:
