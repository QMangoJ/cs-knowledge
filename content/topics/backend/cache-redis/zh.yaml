    text: 快来自介质与模型：全内存、单线程、无锁
- id: data-structures
  title: 第三步：数据结构选型——每种结构对应一类问题
  tldr: Redis 不只是存字符串的柜子：它自带五种常用数据结构，各自是为一类问题准备的。选型的判断很朴素：你的数据长什么形状、你要对它做什么操作，结构就选什么。
  body: |-
    逐个对到场景里。商品详情是一整份小数据，用字符串存它的序列化结果，或者用哈希按字段存——想只改价格时，哈希可以单改一个字段。热搜榜要按热度排序还要随时取前十，有序集合天生干这个：成员是话题，分值是热度，加分、取前十都是一条命令。点赞数、库存展示数这类计数器，用字符串存数字，自增命令是原子的，不怕并发算错。判断「这个用户领过券没有」，用集合存领过的人，一次成员查询答清。上一课的[[会话]]档案，本质是一份带过期时间的小数据，用字符串加过期时间正合适。

    为什么不用一张表全存字符串自己拼？因为把排行榜逻辑写在应用层，就要把整榜拉回来自己排；把计数写在应用层，并发一来就得自己加锁。Redis 的结构把这些高频操作做成了服务端的原子命令——数据在哪，计算就贴着数据做，这是它比「一个内存版的键值柜子」多出来的价值。

    反过来也要知道边界：数据一旦大到要分页扫、要复杂关联查询，就该回数据库。Redis 的结构是为小而热的数据准备的手术刀，不是仓库。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: need
      label: 五类需求：详情、榜单、计数、去重、档案
    - lane: redis
      id: shapes
      label: 五种结构：字符串、哈希、有序集合、计数、集合
      highlight: true
    messages:
    - id: m1
      from: need
      to: shapes
      label: 数据长什么形状，就选什么结构
      active: true
    registers:
    - name: 排行榜
      value: 有序集合：成员加分值，取前十是一条命令
    - name: 计数器
      value: 自增是原子操作，并发点赞不会算错
  log:
