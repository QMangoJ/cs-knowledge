overview:
- key: 一句话总结
  value: AI 应用后端的本质，是把一个远程的、会出错的、按字收费的模型接口，驯化成一个可靠的产品功能：用流式输出藏住它的慢，用 RAG 给它喂它不知道的事实，用超时重试与限流防住它的不稳定，用 token 账本管住它的成本。模型内部怎么工作是 AI 学科的事，这一课只讲应用层怎么伺候它。
- key: 流式输出
  value: 模型是一个字一个字生成的，全文生成完要十秒，用户等不了。流式输出把生成变成直播：首字半秒可见，体验从「等十秒看结果」变成「看着它写」。传输用 SSE——单向、走 HTTP、浏览器原生支持，正好对上「服务器单向吐字」这个形状。
- key: RAG 管线
  value: 模型不知道你的产品文档，硬问只会编。RAG 把流程改成先查后答：文档预先切分、向量化、存进向量数据库；用户提问时先检索出最相关的几段，拼进提示词，模型照着材料回答。事实在库里，表达在模型里，分工就此定死。
- key: 向量数据库
  value: 它解决的是「按语义找最近」：把文本变成一串坐标（向量），问题也变成坐标，找距离最近的几段就是最相关的。它不替代关系数据库：原文与业务数据还在关系库，向量库只存坐标与索引，靠近似最近邻（如 HNSW）用一点精度换速度。
- key: 调用侧可靠性
  value: 模型接口会超时、会限流、会生成一半截断，按普通接口伺候是不行的：超时要分层设（连接、首字、总时长），重试要带退避且算钱（重试一次就是再付一次生成费），还要给每个用户与全局设用量上限，防一个人把账单刷爆。
- key: 成本控制
  value: 账按 token 算：输入与输出分开计价，输出更贵。一次问答几分钱，十万次就是一笔真金白银。省钱的招都在应用层：问答结果缓存、简单问题分流给小模型、上下文只喂检索到的几段而不是整本手册。
- key: 谁在用
  value: 客服问答、文档助手、企业知识库搜索是 RAG 的标准落地；流式输出是所有对话产品的默认形态。做这件事的框架（LangChain 等）换来换去，管线形状不变：切分、向量化、检索、拼接、生成、计费，每一环都是普通后端的手艺。
summary: 场景是给客服系统加一个智能问答：用户问「退货政策是几天」，答案要来自公司自己的退货手册，还要像聊天一样逐字蹦出来，月底账单还不能吓人一跳。这一课就把这件事从头做一遍：先看为什么答案必须流式（以及为什么用 SSE 而不是 WebSocket），再把 RAG 管线拆开——文档怎么切分、向量是什么、向量数据库在一百万段文档里怎么找最近的几段、检索结果怎么拼进提示词，最后算调用侧的两笔账：可靠性（超时、限流、重试）与成本（按 token 计费怎么控制）。模型内部的注意力与 KV 缓存，AI 学科已经讲过，这一课一概指路不复述。
premise: 这节课要回答的问题是：大模型在应用里到底是个什么角色？答案是：它是一个远程接口——只不过这个接口慢、贵、会出错、还会一本正经地编。后端的工作，就是用普通后端的手艺（流式、检索、缓存、限流、计费）把这四样毛病一一管住，让它变成一个可靠的功能。
position: 本课位于后端工程学科第十一段「AI 应用后端：把模型接成服务」，是全学科的收官。它与 AI 学科的分工是：那边讲模型内部——注意力怎么算、推理为什么慢；这一课讲模型外部——怎么把这个接口接进一个真实服务。它用的全是前面课文的零件：流式是请求链路的变体，检索是缓存课与 SQL 课的近亲，可靠性是分布式课的老话题。
level: 进阶
minutes: 28
objectives:
- 能算清流式的体验账，并说清 SSE 与 WebSocket 在这个场景的取舍
- 能完整走一遍 RAG 管线：切分、向量化、检索、拼接、生成，各环的输入输出
- 能走一遍暴力检索的成本账，说清向量数据库为什么必须用近似索引
- 能算一笔 token 账单，并给出超时分层、重试算钱、成本三招的完整方案
aiLink: 记住这个定位：模型是接口不是神仙。上下文决定它答得对不对的上限，检索决定下限，超时与重试保命，token 是钱——四句就是 AI 应用后端的全部骨架。
bridge:
  prev: 上一课算的是传统服务拆与不拆的账。可如今最常被要求新接进系统的，是一种全新的下游：大模型接口。它慢、贵、会编、会限流，伺候它的手艺和伺候数据库很不一样——这一课就补这门新手艺，也是全学科的收官。
design:
- mechanism: 流式优先的交互契约（SSE）
  problem: 模型逐字生成，一段五百字的答案要近十秒才完整。若等全文生成完再返回，用户面对的是十秒白屏，超时与重试的账也全压在这一发上。
  choice: 接口从一开始就按流式设计：用 SSE 把生成出的 token 逐个推给前端，首字半秒可见；用户中途关页面，后端能感知断开并停掉生成，不再白烧钱。
  tradeoff: 流式让错误处理变复杂：生成一半失败时只能告知「中断了」而不能换一份完整的；落库与计费要在流结束时结算，链路上的每一层都要支持不缓冲地透传。
  root: 生成的时间结构（逐字、首字快全程慢）决定了交互的时间结构：把「等结果」改成「看过程」，慢就从缺陷变成了可接受的体验。
- mechanism: 检索与生成分工（RAG）
  problem: 模型的参数里没有你的业务事实，硬让它凭记忆答专业问题，它会流畅地编造。把整本手册塞进上下文也不行：贵、慢、且超过长度上限。
  choice: 事实放进可检索的库：文档预先切分向量化，用户问题先检索出最相关的几段，只把这几段拼进提示词让模型组织语言。检索管对不对，生成管顺不顺。
  tradeoff: 多一条管线要建与要维护：切分策略、向量模型、索引都要选型与调优；且答错时要分清是检索没找到还是模型没用好，排障多一层。
  root: 模型的长处是语言组织，短处是事实记忆不可靠且不可更新。让它只做长处、把短处外包给可更新的检索库，是这一课全部架构的出发点。
- mechanism: 调用侧按不可靠远程服务设防
  problem: 模型接口会超时、限流、截断，还按量收费：一次失控的重试风暴或一个刷接口的用户，能在一夜之间烧掉一个月的预算。
  choice: 超时分层（连接、首字、总时长分别设限）、重试带指数退避且计入成本、用户级与全局双层限额、生成可取消——把分布式课里对付不可靠下游的全套手段搬过来，再加一本 token 账。
  tradeoff: 设防越全，用户在高峰时被限流与降级的概率越高，体验要和成本一起权衡；账本与告警要先行，否则设防阈值没有依据。
  root: 它本质上就是一个第三方远程依赖，只是把「慢、贵、错」三样都放大了。对付远程依赖的通用框架不变，只是每个参数都要按它的量级重调。
quiz:
- q: 客服问答的答案为什么要用 SSE 流式，而不是等全文生成完一次性返回？
  options:
  - 因为 SSE 更安全
  - 五百字答案全文生成要近十秒，一次性返回是十秒白屏；流式首字半秒可见，且用户关页能停掉生成止损
  - 因为 HTTP 不支持长响应
  - 因为模型只能流式工作
  answer: 1
  explain: 生成是逐字的，时间结构决定交互结构：流式把「等十秒」变成「半秒后开始读」。SSE 是单向推送、走普通 HTTP、浏览器原生支持，正对这个形状；WebSocket 的双向能力在这里用不上，还多一层连接管理。
- q: RAG 里检索与生成的分工是？
  options:
  - 检索负责把话说顺，生成负责查资料
  - 检索负责把对的事实找出来，生成负责把事实组织成流畅的回答；事实在库里，表达在模型里
  - 两者都负责生成，只是速度不同
  - 检索只是为了省钱，和对不对无关
  answer: 1
  explain: 模型记不住也更新不了你的业务事实，硬答会编。RAG 让可更新的检索库管事实、模型只管语言组织——答错时也能分清是没找到还是没用好。
- q: 一百万段文档向量，每段 1536 维，用户问题来了要暴力逐个算距离，为什么不行？
  options:
  - 因为向量不能比距离
  - 一次查询要做一百万次 1536 维的距离计算，量级在十亿次运算，用户等不起；要用 HNSW 这类近似索引把候选先缩到一小撮
  - 因为数据库存不下一百万条
  - 因为问题不能变成向量
  answer: 1
  explain: 暴力法是文档数乘向量维度的乘法账：10⁶×1536 已是十亿量级，还没算并发。近似最近邻索引用「偶尔漏掉真正的第一名」换几个数量级的速度，这正是向量数据库存在的理由。
- q: 模型接口调用失败时，重试策略和调普通接口最大的不同是？
  options:
  - 没有不同，随便重试
  - 每次重试都重新生成、重新计费：重试一次就是再付一次钱，所以要有次数与总时长预算，还要防重试风暴烧账单
  - 模型接口不许重试
  - 重试时要用更大的模型
  answer: 1
  explain: 普通接口重试的成本主要是时间，模型接口重试的成本是真金白银的 token 费。退避、预算、用户级限额，都是为「钱」这个新变量准备的。
steps:
- id: llm-as-dependency
  title: 第一步：本质——模型在应用里只是一个远程接口
  tldr: 先把定位钉死：接进后端的模型，就是一个 HTTP 接口，只不过它集齐了远程依赖的全部毛病——慢（逐字生成）、贵（按字收费）、会出错（限流超时）、还会编（答得流畅但内容是假的）。这一课就是给这四样毛病逐个上手段。
  body: |-
    先划清与 AI 学科的边界。那边讲模型内部：注意力怎么计算、推理为什么要逐字吐、KV 缓存怎么省带宽。这一课站在接口这一边：你发一段提示词过去，它回一段文字回来，内部一概不管。把它当成一个第三方服务来伺候，后端的手艺就全用得上——它和支付接口、短信接口是同一类角色：系统之外的、不可控的依赖。

    不一样的地方在毛病的量级。普通接口的响应是毫秒级且确定的；模型生成五百字要近十秒，且同样的输入两次答得可以不一样。普通接口调用失败重试几乎免费；模型每次生成都按 [[token]] 计费，重试就是再买一次。普通接口不知道答案会说错误码；模型不知道答案时，会用最流畅的语气编一个。

    所以这一课的四件事正好对着四样毛病：流式对付慢，RAG 对付编，可靠性设计对付出错，成本控制对付贵。顺序也是这个顺序。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: app
      label: 应用服务：把它当第三方接口伺候
    - lane: llm
      id: llm
      label: 模型接口：慢、贵、会出错、会编
      highlight: true
    messages:
    - id: m1
      from: app
      to: llm
      label: 发提示词过去，回一段文字回来
      active: true
    registers:
    - name: 与普通接口的差
      value: 慢三个量级、按字收费、答错不报错只编
  log:
  - at: 本质
    text: 先当远程依赖看，四样毛病逐个上手段
- id: streaming-sse
  title: 第二步：流式输出——把十秒白屏变成半秒开读
  tldr: 答案必须逐字蹦出来：全文五百字生成近十秒，一次性返回就是十秒白屏；流式让首字半秒可见，用户边看边等。通道选 SSE 而不是 WebSocket，因为这里只需要服务器单向吐字。
  body: |-
    先算体验账。模型生成速度按每秒几十个 token 算，一段五百字的回答，全程要近十秒。若接口等全文齐了再返回，用户点完提问要对着白屏等满十秒，中途还不知道是死是活——这个体验在对话产品里是不合格的。流式把返回改成直播：第一个字在约半秒后到达，之后字一个个往外蹦，用户从「等结果」变成「看它写」，同样十秒，感受完全不同。还有一个实际好处：用户看到一半发现问错了，关掉页面，后端感知到连接断开就能停掉生成——剩下的钱不烧了。

    通道为什么是 [[SSE]]？它就是为「服务器单向往客户端推」设计的：一条普通的 HTTP 长连接，服务器把每个 token 包成一个小事件发出去，浏览器用 EventSource 原生接收，断线了还会自动重连。这里不需要双向：用户的问题是一次性发完的，之后只有服务器在说话。[[WebSocket]] 的双向能力（网络学科讲过它的握手）在这个场景纯属浪费，还要多养一套连接状态管理。网络学科里 SSE 与 WebSocket 的协议差别，这里落成了选型：形状对上 [[SSE]]，就用 SSE。

    代价要认：流式下错误只能中途告知，没法像一次性返回那样「失败就整份重试」；计费与落库要等流结束才结算。这些在第七、八步分别处理。
  derivation: original
  sources:
  - ref: mdn-sse
    locator: "MDN: Using server-sent events（EventSource 与单向推送模型）"
    claim: SSE 基于普通 HTTP 长连接实现服务器到客户端的单向事件推送，浏览器以 EventSource 接收并支持自动重连，适合流式文本等单向数据流场景。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
