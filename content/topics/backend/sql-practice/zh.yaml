overview:
- key: 一句话总结
  value: SQL 实务的核心只有一句：SQL 是声明式的，你只说要什么，引擎决定怎么找——所以后端的手艺不在把 SQL 写出来，而在看懂引擎找得好不好（执行计划）、管住应用与数据库之间的往返次数（N+1 与批量）、以及复用昂贵的连接（连接池）。索引与事务的原理在数据学科，这一课讲日常怎么用。
- key: 执行计划
  value: EXPLAIN 是引擎的答卷：它打算走索引还是全表扫描、先查哪张表、预计扫多少行，都写在里面。慢查询优化的第一步永远是先看它，而不是先改 SQL——改的方向对不对，它说了算。
- key: N+1
  value: 先查出 N 条记录、再逐条去查每条的关联数据，一共发出 N+1 条 SQL。它是 ORM 时代最常见的慢法：代码看着只写了一行循环，数据库却被问了一百遍。解法是把逐条查改成一次联表或一次批量查询。
- key: 连接池
  value: 建一条数据库连接要走网络握手加身份认证，几十毫秒起步，不可能每请求现建。连接池预先养一批连接轮流借用；池子大小是道算术题：太小了请求排队，太大了所有实例的池子加起来会把数据库的连接上限打穿。
- key: 事务边界
  value: 实务里的规矩是：一个请求一个事务，事务要短，事务里绝不调用外部接口。占着连接与锁等网络返回，是把数据库拖下水的经典姿势；跨出数据库的那一步，要靠幂等与补偿，而不是把事务拉长。
- key: 谁在用
  value: 这套手艺不分数据库：MySQL 与 PostgreSQL 的执行计划格式不同，读法相通；各语言的 ORM（Prisma、TypeORM、MyBatis、GORM）都有把 N+1 藏进循环里的能力，也都有批量预加载的解法。慢查询日志加执行计划，是每个后端团队的日常两件套。
summary: 场景是一个客服后台的订单列表页：要同时显示订单、买家昵称和商品名，查的是三张表。页面慢到三秒，投诉已经来了。这一课就围着这个页面转：先学会看引擎的答卷（执行计划），把联表查询的乘法账算清；再走一遍 ORM 最经典的暗坑 N+1，看一百条 SQL 是怎么从一行循环里长出来的；然后算连接池的算术题——为什么一百个应用实例能把数据库的连接打穿；最后立下事务在实务里的边界规矩。原理部分（索引结构、事务隔离）数据学科已经讲透，这一课只讲怎么用、怎么查、怎么防。
premise: 这节课要回答的问题是：SQL 写出来能跑，和写得让数据库轻松跑，是两回事——中间隔着的手艺是什么？答案不在语法里，在三处：看懂引擎的执行计划、管住往返次数、养好连接池。订单列表页从三秒到五十毫秒，靠的全是这三处。
position: 本课位于后端工程学科第八段「数据实务：SQL 与后端安全」的前半。它和数据学科是明确分工：数据学科讲数据库内部——B+ 树怎么组织索引、事务的隔离级别怎么实现；本课讲应用侧的手艺——同样的索引与事务，日常写代码时怎么用对、查对、防对。请求链路课派下来的活，到这一课落进数据库。
level: 进阶
minutes: 28
objectives:
- 能读懂一份执行计划，判断它走索引还是全表扫描、先查哪张表
- 能算清联表查询的乘法账，并指出该给哪个字段加索引
- 能识别 N+1 并走一遍它的往返账，给出联表或批量的改法
- 能算连接池大小的账：单实例池大小乘实例数不能打穿数据库上限
aiLink: 记住三句：优化先看执行计划，别先改 SQL；慢常常慢在往返次数，不在单条 SQL；连接与事务都是借来的资源，借了要快还。本课全部内容都是这三句的展开。
bridge:
  prev: 上一课的请求链走到最后一环停住了：业务层把活派给数据库，可 SQL 写得好不好、连接怎么管，直接决定那一环是五十毫秒还是三秒。这一课就钻进这最后一环，先把客服后台那个三秒的订单列表页治好。
  next: SQL 写得对，还挡不住有人故意写错的输入：把编号改一位看别人的订单、在输入框里塞一段 SQL。下一课换到攻击者视角，讲后端安全——注入、越权与密钥管理这三道防线。
design:
- mechanism: 声明式查询，执行计划问责
  problem: SQL 只声明要什么结果，同一句 SQL 在不同的数据量与索引下，引擎可能走出相差千倍的路径。只盯着 SQL 文本调优，等于蒙着眼睛改。
  choice: 把执行计划定为唯一的问责对象：任何慢查询先 EXPLAIN，看它实际的找法（扫描方式、联表顺序、预计行数），再决定加索引还是改写法。
  tradeoff: 执行计划是引擎的估计，统计信息过期时会估歪；且读计划需要练习，团队要形成「先看计划再动手」的纪律。
  root: 声明式的代价是执行路径不由你直接控制，你能控制的只有数据组织（索引）与问题提法（SQL 写法）——执行计划是这两者之间唯一的观测面。
- mechanism: 连接池复用昂贵连接
  problem: 建连接要三次握手加认证，几十毫秒；每请求现建现销，高并发下光建连接就能耗掉大半响应时间，还会把数据库的连接数打满。
  choice: 在应用侧养一个连接池：启动时建好一批连接，请求借用、用完归还，池子负责排队与上限。
  tradeoff: 多了一个要调的参数与要监控的组件；池子配置要和实例数、数据库上限一起算总账，扩容应用时必须同步重算。
  root: 连接是数据库侧的稀缺资源（每条连接占内存与一个工作线程），池子本质是把「稀缺资源的分配」从失控的按需创建，收成可计算的配额管理。
- mechanism: 事务边界跟着请求走且不含外部调用
  problem: 事务开着的时候占着连接、持着锁。若在事务里调用支付、发短信这类外部接口，网络等多久，连接与锁就被占多久，高并发下迅速演变成全站卡死。
  choice: 事务只包住数据库内的几步读写，一个请求一个事务、尽快提交；跨出数据库的动作放在事务提交之后，用幂等与补偿处理失败（呼应分布式课的 Saga 思路）。
  tradeoff: 事务之外的步骤失败时，数据会短暂处于中间状态，需要补偿逻辑与对账兜底，代码比一个大事务包到底要多写。
  root: 事务的原子性只在单个数据库内成立，把网络调用包进来并不会让它变强，只会把锁的持有时间从毫秒放大到秒——量级错了，机制就失效了。
quiz:
- q: 订单列表页慢到三秒，第一步该做什么？
  options:
  - 先把 SQL 重写一遍试试手气
  - 先给所有字段都加上索引
  - 先 EXPLAIN 看执行计划：它走没走索引、先查哪张表、预计扫多少行
  - 先给数据库加内存
  answer: 2
  explain: SQL 是声明式的，慢的原因藏在引擎的找法里，不在文本里。执行计划是唯一的观测面：全表扫描、联表顺序反了、估行差太多，病因不同药方完全不同。
- q: 查出 100 个订单后，页面为每个订单又单独查一次买家信息，一共多少条 SQL？这叫什么问题？
  options:
  - 2 条，叫联表查询
  - 101 条，叫 N+1 问题
  - 100 条，叫全表扫描
  - 1 条，叫慢查询
  answer: 1
  explain: 1 条查订单列表，加上 100 条逐个查买家，就是 N+1。它慢在往返次数：单条 1 毫秒，一百次往返加上排队就能拖到几百毫秒。改法是联表一次查回，或用 IN 批量查。
- q: 100 个应用实例，每个连接池配 20 条连接，数据库最大连接数 500，会发生什么？
  options:
  - 没问题，池子越大越快
  - 100×20=2000 条连接需求打穿 500 的上限，后启动的实例拿不到连接直接报错
  - 数据库会自动把上限调到 2000
  - 连接池之间会互相借用
  answer: 1
  explain: 池子要算总账：所有实例的池上限之和，必须小于数据库能承受的连接数。扩容实例时不同步调小池子，是线上经典事故——新实例一启动就把连接抢光。
- q: 为什么事务里绝不能调用支付接口？
  options:
  - 因为支付接口太贵
  - 事务开着时占着连接与锁，等网络返回的秒级时间里它们全被扣住，高并发下会把数据库拖死
  - 因为支付接口不支持事务
  - 因为 SQL 语法不允许
  answer: 1
  explain: 锁的持有时间应该以毫秒计。把秒级的网络等待包进事务，等于把稀缺资源按秒出租——并发一上来，连接与锁全部耗尽，后面的请求只能排队超时。
steps:
- id: declarative-sql
  title: 第一步：本质——SQL 是声明式的，你只说要什么
  tldr: 先把和数据库打交道的方式说清：你写的 SQL 只描述想要的结果，至于先查哪张表、走不走索引，是引擎自己定的。所以手艺不在写 SQL，在读懂引擎的决定。
  body: |-
    对比一下两种命令方式。你写一段循环代码，是在一步步指挥机器：先做这、再做那。写 SQL 不是：你写下「把这三张表按这个条件连起来、按时间倒序、取前二十条」，这是一句需求描述，具体怎么找——先翻哪张表、用哪个索引、扫多少行——全是引擎的决定。同一个需求，数据量不同、索引不同，引擎的找法可以相差一千倍。

    这决定了优化的方法论：病因不在你的文本里，在引擎的找法里。引擎愿意把找法亮出来给你看，那份答卷就是执行计划：用 [[EXPLAIN]] 在 SQL 前面一放，它会逐行写明每一步打算怎么扫、预计扫多少行。实务里读计划先看三样：扫描方式（走索引还是[[全表扫描]]）、联表顺序（先查哪张表）、预计行数与实际差多少。

    索引为什么能加速、[[B+ 树]]怎么组织，数据学科的索引课已经讲透；这一课的立场是应用侧：给你一份计划，你能判断它找得好不好，并知道该动哪里。
  derivation: original
  sources:
  - ref: postgresql-docs
    locator: "PostgreSQL Documentation: EXPLAIN 与查询计划的读法"
    claim: EXPLAIN 展示查询的执行计划，包括扫描方式（顺序扫描/索引扫描）、联表方式与预计行数，是诊断慢查询路径的标准工具。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: dev
      label: 开发者：只写下想要的结果
    - lane: engine
      id: eng
      label: 引擎：自己决定怎么找，并用执行计划交卷
      highlight: true
    messages:
    - id: m1
      from: dev
      to: eng
      label: SQL 是需求描述，不是操作步骤
    - id: m2
      from: eng
      to: dev
      label: 执行计划：扫描方式、联表顺序、预计行数
      active: true
    registers:
    - name: 读计划三看
      value: 扫描方式、联表顺序、预计行数准不准
  log:
  - at: 本质
    text: 声明式的代价是路径不可见，执行计划是观测面
- id: join-multiplication
  title: 第二步：联表的乘法账——先过滤，再联表
  tldr: 订单列表要连三张表：订单一万行、用户一万行、商品五千行。若不过滤就硬连，引擎要比对的组合是乘法级的；先用条件把订单筛到二十条再联，账就塌缩成加法级。
  body: |-
    把乘法账算出来。最笨的联法是嵌套循环：一万条订单，每条都去用户表里找一遍买家——若用户表没索引，每找一次扫一万行，总量是一亿次比对，页面不慢才怪。给联表的字段（订单表里的买家编号）加上索引，每次找买家变成在 [[B+ 树]]里走三四层，总量塌缩到四万次量级。索引在实务里的第一用途，就是给联表字段兜底。

    第二笔是顺序账。列表页只要最新二十条订单，正确的做法是先在订单表上按条件过滤、排序、截断到二十条，再拿这二十条去联用户和商品：联表发生在二十行的小集合上。若反过来先把三张表全联成一张大宽表再过滤，前面的乘法就白付了。引擎的优化器通常会自己把过滤提前，但写出让它容易优化的 SQL、再用执行计划确认它真的提前了，是应用侧的本分。

    读计划时对应看两处：联表字段那一步是不是索引扫描，过滤条件是不是出现在联表之前。两处都对，这个页面的三秒通常就先去掉一大半。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: engine
      id: naive
      label: 硬连：一万乘一万，一亿次比对
    - lane: engine
      id: smart
      label: 先筛到二十条再联，加索引走树高
      highlight: true
    messages:
    - id: m1
      from: naive
      to: smart
      label: 过滤提前加联表索引，乘法账塌缩成加法账
      active: true
    registers:
    - name: 没索引的联表
      value: 10000 × 10000 = 一亿次比对
    - name: 优化后
      value: 先截断到 20 行，联表只发生在小集合上
  log:
  - at: 联表
    text: 联表的成本是乘法，先过滤再联是第一原则
- id: slow-log-triage
  title: 第三步：慢查询怎么找——先定位，再动手
  tldr: 慢查询不是靠用户投诉发现的：数据库自带慢查询日志，把超过阈值的 SQL 按耗时与频率记下来。实务的顺序是先按「总耗时」排序找到最值得治的那几条，再逐条看执行计划。
  body: |-
    先说定位工具。主流数据库都有慢查询日志：执行超过设定阈值（比如一秒）的 SQL 会被记下，连同耗时、扫描行数、出现次数。线上排障先看它，而且排序的口径有讲究：不要只盯单次最慢的那条——一条十秒的 SQL 一个月出现一次，不如一条半秒的 SQL 每分钟出现一百次，后者对系统的总拖累大得多。按单次耗时乘以频率得到的总耗时排序，治病才治在刀刃上。

    定位到具体 SQL 后才轮到执行计划，按第二步的方法看扫描与顺序。常见的三种病因对应三种药：联表或过滤字段没索引，加索引；有索引却没走，多半是写法让索引失效（如对字段套函数）或数据分布让引擎觉得全表更划算，改写法或更新统计信息；计划没问题但就是慢，往往是返回的行数太多，回到分页与字段裁剪上解决。

    还要留一句纪律：优化完要在慢查询日志里验证它真的消失了，而不是页面测着快了就收工——缓存热没热、数据量多少都会骗人，日志不会。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: engine
      id: log
      label: 慢查询日志：耗时、行数、频率都在
    - lane: app
      id: triage
      label: 排障顺序：按总耗时排，先治最拖累的
      highlight: true
    messages:
    - id: m1
      from: log
      to: triage
      label: 半秒乘一百次，比十秒乘一次更值得治
      active: true
    registers:
    - name: 排序口径
      value: 单次耗时 × 频率 = 总拖累
    - name: 验证方式
      value: 回到日志里确认它消失，而不是手测变快
  log:
  - at: 定位
    text: 先按总耗时找到刀刃，再看执行计划定药方
- id: n-plus-one
  title: 第四步：N+1 走一遍——一百条 SQL 从一行循环里长出来
  tldr: 列表页的第二大病灶是 N+1：先查出 100 个订单（1 条 SQL），渲染时为每个订单单独查一次买家（100 条 SQL）。代码里只是一行循环，数据库却被问了 101 遍——慢在往返次数，不在任何单条 SQL。
  body: |-
    跟着代码走一遍。应用先执行一条 SQL，把最新 100 个订单查出来。然后页面要显示每个订单的买家昵称，ORM 发现订单对象上的买家字段还没加载，就替每个订单悄悄补发一条「按编号查用户」的 SQL。开发者写的代码只有一段循环，数据库收到的却是 1 加 100 共 101 条查询。

    把时间账算出来：单条查询本身只要 1 毫秒，可每次往返还有网络与排队的开销，按每回 2 毫秒算，101 条就是 200 多毫秒；若列表是 1000 条，直接奔着 2 秒去。这解释了为什么 N+1 在开发环境（数据少、列表短）毫无感觉，一上生产就爆——它随列表长度线性膨胀。

    改法有两条。一是联表：在查订单的那一条 SQL 里就把用户表联进来，一次拿全，回到第二步的联表账。二是批量：先收集 100 个订单的买家编号，用一条 IN 查询把买家一次查回再在内存里对号入座——前端生态里的 DataLoader 就是把这件事自动化的工具，后端各 ORM 也都有预加载（eager loading）的开关。共同的要点是：把逐条问改成一次问。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: loop
      label: 应用：一行循环，看似只查了一次
    - lane: engine
      id: db
      label: 数据库：实际收到 101 条查询
      highlight: true
    messages:
    - id: m1
      from: loop
      to: db
      label: 1 条查订单，100 条逐个查买家
      active: true
    registers:
    - name: 往返账
      value: 101 条 × 每回约 2 毫秒 = 200 多毫秒
    - name: 改法
      value: 联表一次拿全，或 IN 批量查回再对号
  log:
  - at: N+1
    text: 慢在次数不在单条，把逐条问改成一次问
- id: connection-pool
  title: 第五步：连接池——连接是借的，借了要算总账
  tldr: 每请求现建连接，光握手加认证就几十毫秒，比查询本身还贵。连接池预先养一批连接轮流借用；但池子大小要算总账：一百个实例乘每池二十条，足以把数据库五百条的连接上限打穿。
  body: |-
    先算建连接的成本。一条数据库连接要经过 TCP 三次握手、数据库的身份认证与会话初始化，局域网里也要几十毫秒——比一条普通查询（1 毫秒量级）贵一个数量级。若每个请求都现建现销，一万次请求就是一万次握手，数据库还要不停地为连接分配与回收资源。[[连接池]]的解法是把连接养起来：应用启动时建好一批（比如 20 条），请求来借一条、用完还回去，连接在池里循环使用。

    池子的大小是道必须算的算术题。太小：高峰时请求在池门口排队，延迟被排队吃掉。太大要看总账：你有 100 个应用实例，每个池 20 条，全部打满就是 2000 条连接，而数据库的最大连接数可能只有 500——超出的连接请求直接被拒，后启动的实例一上线就报错。扩容应用实例时不同步重算池子，是线上反复出现的经典事故：新实例不是来帮忙的，是来抢连接的。

    实务参数就三条：单池大小按「单实例并发查库数」估，实例数乘池大小必须小于数据库上限并留余量，借不到连接的等待超时要设（宁可快速失败，也不能无限排队把请求拖死）。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: inst
      label: 100 个应用实例：每池 20 条连接
    - lane: pool
      id: pool
      label: 连接池：借还循环，总额要算账
    - lane: engine
      id: db
      label: 数据库：最大连接数 500
      highlight: true
    messages:
    - id: m1
      from: inst
      to: db
      label: 100 × 20 = 2000，打穿 500 的上限
      active: true
    registers:
    - name: 建连接成本
      value: 握手加认证几十毫秒，比查询贵一个量级
    - name: 总账铁律
      value: 实例数 × 池大小 < 数据库上限，还要留余量
  log:
  - at: 连接池
    text: 连接是配额，扩容应用必须同步重算池子
- id: transaction-boundary
  title: 第六步：事务的实务边界——要短，且不许等网络
  tldr: 事务的原理（隔离级别、MVCC）在数据学科，这里只立三条实务规矩：一个请求一个事务、事务里只放数据库读写、绝不在事务里调外部接口——占着连接与锁等网络，是把数据库拖下水的经典姿势。
  body: |-
    先说清为什么短。事务开着的时候，它占着一条连接（连接池里借来的那条）、持着它改过的数据行上的锁。别的请求想改同一行，只能排队。所以事务的寿命直接等于锁与连接被扣押的时间：一个正常事务几毫秒，扣押可以忽略；若事务里塞了一次调支付接口的网络请求，对方慢个两秒，这两秒里连接与锁全被这一个请求扣着。高并发下，一批这样的事务就能把连接池借空、把热门行锁死，全站跟着超时。

    正确的切法是：事务只包住「扣库存、写订单」这种数据库内的几步，提交之后，再去调支付、发通知。这些外部动作失败了怎么办？靠[[幂等]]重试与补偿把状态收回来——这正是分布式学科里 Saga 的思路在单库场景的投影：宁可事后补偿，也不把事务拉长去包网络。

    第三条规矩是边界跟着请求走：一个 HTTP 请求内的数据库操作，要么全成一个事务，要么明确拆成几个有补偿的事务。最怕的是半自动：一半操作在事务里、一半在外面，失败时数据停在谁也不认识的中间状态。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: bad
      label: 坏切法：事务里调支付，等了两秒
    - lane: engine
      id: held
      label: 这两秒里：连接与行锁全被扣着
    - lane: pool
      id: good
      label: 好切法：事务只包数据库几步，外部动作在提交后
      highlight: true
    messages:
    - id: m1
      from: bad
      to: held
      label: 锁的寿命从毫秒被放大到秒
      active: true
    registers:
    - name: 事务寿命
      value: 应该以毫秒计，不许包含秒级的网络等待
    - name: 失败收场
      value: 外部动作靠幂等重试与补偿，不靠拉长事务
  log:
  - at: 事务边界
    text: 事务只包数据库内的事，网络的事在提交后办
- id: pagination-deep
  title: 第七步：深分页的 SQL 账——OFFSET 先数一遍再扔掉
  tldr: 请求课讲过游标分页的结论，这里算它的 SQL 层成本：OFFSET 10000 不是跳过，是引擎先老实数出一万行再扔掉。游标分页用「上一页最后一个编号」当锚点，配索引定点直达，深浅一个价。
  body: |-
    把上一课留的那笔账算实。列表接口要第 501 页、每页 20 条，用偏移写法就是 LIMIT 20 OFFSET 10000。引擎的执行方式是：按顺序把符合条件的行一条条数出来，数到第 10001 条才开始真正取，取满 20 条收工——前一万条全是数完就扔的。页码越深，扔的越多，第 5000 页和第 1 页的成本差着一万行的扫描。

    [[游标分页]]在 SQL 层的样子是给查询加一个条件：WHERE 编号 > 上一页最后一个编号 ORDER BY 编号 LIMIT 20。编号上有索引时，引擎在 [[B+ 树]]里直接定位到锚点，往后取 20 条走人，不存在「数一万条」的环节。这就是它深浅一个价的原因——成本只和一页的大小有关，和翻到第几页无关。

    代价在上一课说过：游标分页没法跳页、没法报总页数。所以实务分工不变：管理后台要跳页要总数，用偏移并接受深页变慢（或给页数设上限）；用户侧的信息流只顺序翻，用游标。选型先看用户怎么翻，再看 SQL 怎么写。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: engine
      id: off
      label: OFFSET 10000：先数一万行再扔掉
    - lane: engine
      id: cur
      label: 游标：锚点定位，往后取 20 条
      highlight: true
    messages:
    - id: m1
      from: off
      to: cur
      label: 成本从与页深成正比，变成只与页大小有关
      active: true
    registers:
    - name: 偏移分页
      value: 第 5000 页要先扫过前 99980 条
    - name: 游标分页
      value: 索引定位锚点，深浅一个价
  log:
  - at: 深分页
    text: OFFSET 的成本藏在被扔掉的那些行里
- id: batch-writes
  title: 第八步：批量写入——一千条数据别发一千次
  tldr: 读有 N+1，写有同样的病：循环里逐条 INSERT 一千次，就是一千次往返加一千次事务开销。批量插入把它们并成一条语句，导入场景再配合索引的取舍，快的是数量级。
  body: |-
    先看逐条写的账。一条 INSERT 本身不到 1 毫秒，可逐条发一千次，往返开销照第四步的算法先吃掉两秒；若每条还各自开一个事务，每次提交都要把日志刷盘，一千次刷盘又是另一笔。批量写法把一千条并进一条 INSERT（或分批每批几百条），往返塌缩成个位数，事务也只剩一批一次。

    导入大量数据时还有第二笔账：索引。每插入一行，引擎要顺手维护这张表上的每个索引——表上有四个索引，一行数据就要多写四棵 [[B+ 树]]。百万级导入时，先把非必要索引摘掉、导完再重建，常常比硬导快得多；代价是导入期间这些索引不可用，所以只适合停机窗口或新表初始化，线上热表不能这么干。

    批量也不是越大越好：一批塞十万条，单条语句的内存、锁与失败重试成本都膨胀——一条失败整批回滚，重来一次更贵。实务的常见分批是每批几百到几千条，在往返与风险之间取中。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: loop
      label: 逐条写：一千次往返加一千次提交
    - lane: engine
      id: batch
      label: 批量写：每批五百条，两次往返办完
      highlight: true
    messages:
    - id: m1
      from: loop
      to: batch
      label: 并成批，往返从千次塌缩到个位数
      active: true
    registers:
    - name: 索引的账
      value: 一行要维护每个索引，大导入先摘后建
    - name: 批量大小
      value: 几百到几千一条，太大则失败重试太贵
  log:
  - at: 批量写
    text: 写的优化和读同理：先砍往返次数
- id: orm-and-beyond
  title: 第九步：边界——ORM 不是原罪，报表别压在业务库上
  tldr: 最后划边界：ORM 的问题不在抽象本身，在它把 SQL 藏起来让人忘了往返的存在；手写 SQL 也不是银弹。另一个边界是负载分家：报表与统计这类重查询不该和在线业务抢同一个库。
  body: |-
    先给 ORM 正名。N+1 不是 ORM 发明的，是「逐条查」这个动作的病，ORM 只是把它藏进了一行看起来无害的循环里。解法也不是弃用 ORM，而是用好它的预加载与批量开关，并在代码审查里对「循环里碰数据库」保持警觉。反过来，手写 SQL 写满全站，改表结构时要翻遍所有字符串拼接处——两种极端都是债。实务的平衡点是：常规增删改查走 ORM，复杂查询与性能敏感处手写 SQL 并附执行计划验证。

    第二个边界是负载。客服后台的列表页是轻查询，可运营的月度报表要扫三个月的全量订单——这种查询再优化也是重活，让它和在线下单抢同一个数据库，报表一跑，下单就抖。常规解法是读写分离：报表走只读副本（复制的原理在数据学科的复制课），业务库只伺候在线请求；再重，就把数据同步到专门的分析系统里去。

    这两个边界其实是同一句话：工具与负载都要对位。把合适的活派给合适的层，是 SQL 实务从手艺变成判断的地方。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: mix
      label: 在线业务：轻查询，要的是稳与快
    - lane: engine
      id: split
      label: 报表负载：赶去只读副本，不抢业务库
      highlight: true
    messages:
    - id: m1
      from: mix
      to: split
      label: 重查询与在线请求分家，互不拖累
      active: true
    registers:
    - name: ORM 的定位
      value: 常规走 ORM，复杂与敏感处手写并验计划
    - name: 负载分家
      value: 报表走副本，业务库只伺候在线请求
  log:
  - at: 边界
    text: 工具与负载对位，是手艺之上的判断
- id: closing-sql
  title: 第十步：收束——SQL 实务的三句口诀
  tldr: 全课收成三句：先看执行计划再谈优化；慢常常慢在往返次数而非单条；连接与事务都是借来的资源，借了要快还。订单列表页的三秒，拆开就是这三句各犯了一条。
  body: |-
    回头看开场那个三秒的页面，病因正好三处：联表没走索引（计划没看）、渲染时逐条查买家（N+1 的往返）、高峰时连接池排队（连接账没算）。三处都治好，五十毫秒就是这么来的——没有一处靠换数据库或加硬件，全是应用侧的手艺。

    把三句口诀再钉一遍。第一，优化先看执行计划：SQL 是声明式的，病因在引擎的找法里，计划是唯一的观测面。第二，慢常常慢在次数：N+1、逐条写、深分页，病灶都是往返或扫描的次数，先数次数再抠单条。第三，连接与事务是借来的：连接要算总账、事务要短到不包含网络等待。

    下一课换一个视角：这一课防的是无意写出的慢，下一课防的是有人故意写出的攻击——同样的接口，在攻击者手里会怎么被撬开。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: page
      label: 订单列表页：从三秒到五十毫秒
    - lane: engine
      id: three
      label: 三处病因：没走索引、N+1、连接排队
      highlight: true
    messages:
    - id: m1
      from: page
      to: three
      label: 没换硬件，全靠应用侧手艺
      active: true
    registers:
    - name: 口诀
      value: 先看计划、慢在次数、借来的要快还
  log:
  - at: 收束
    text: SQL 实务是应用侧的手艺，不是数据库的玄学
