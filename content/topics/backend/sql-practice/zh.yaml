overview:
  - key: 一句话总结
    value: SQL 是声明式语言，你只描述要什么结果，怎么找由数据库引擎决定——写服务的真功夫不在背熟语法，而在用执行计划看懂引擎路径、管住应用与数据库的往返次数（消除 N+1 与逐条写），以及算清连接池配额与短事务边界。
  - key: 执行计划
    value: EXPLAIN 是引擎亮出的执行答卷：走索引还是全表扫描、先查哪张表、预计扫多少行一目了然。排查慢查询永远先看计划再动手，而不是蒙着眼改 SQL。
  - key: N+1
    value: 先查出 N 条主记录，再在循环里逐条查关联数据，一共发出 N+1 条 SQL。代码看似只有一行属性读取，数据库却被来回追问上百遍；正道是改成一次联表或一次 IN 批量查询。
  - key: 连接池
    value: 建一条数据库连接要经历 TCP 握手与权限认证，动辄几十毫秒，远比毫秒级查询本身昂贵。连接池预先养好一批连接循环借还；池大小乘以应用实例数必须小于数据库总上限，否则扩容即打穿连接数。
  - key: 事务边界
    value: 在线服务遵守「一请求一短事务」，事务内绝不夹带外部网络调用。占着连接与行锁苦等支付或短信接口返回，高并发下几秒就能拖垮全库；跨出数据库的步骤靠幂等重试与补偿收尾。
  - key: 谁在用
    value: MySQL 与 PostgreSQL 的 EXPLAIN 输出格式虽异，读法完全相通；Prisma、TypeORM、MyBatis、GORM 等主流框架既容易在懒加载循环里藏进 N+1，也都内置了批量预加载开关。慢查询日志配执行计划，是后端团队的日常排障标配。
summary: SQL 是声明式语言，你只写想要的结果，具体扫描路径由数据库引擎决定。把慢接口从秒级压回毫秒级靠三项实务手艺：先用 EXPLAIN 读懂执行计划，确认过滤提前与联表索引到位，把乘法级比对压回加法级；再砍掉循环查库引发的 N+1 与逐条写入，管住网络往返次数；最后算清多实例连接池的总配额，守住毫秒级短事务、绝不在事务内等待外部网络接口的红线。
premise: 客服后台的订单列表页要同时展示订单、买家昵称和商品名，背后关联三张表。开发环境几十条数据跑得飞快，一上生产页面加载慢到 3 秒，客服投诉接连不断——明明每句 SQL 语法都没错，数据库 CPU 也没跑满，时间到底漏在了哪、不换硬件怎么压回 50 毫秒？
position: 本课处于后端工程学科第八课，承接接口请求链路的最后一环落入数据库实务。数据学科负责拆解 B+ 树索引结构与事务隔离的底层引擎实现，本课则聚焦业务服务侧的日常手艺——怎么读执行计划、控往返次数、管连接配额与划事务边界，并与下一课的后端安全共同守住数据访问层。
level: 进阶
minutes: 28
objectives:
  - 能读懂 EXPLAIN 执行计划，判断扫描方式、联表顺序与行数估算偏差
  - 能算清联表查询的乘法账，找准该加索引的关联字段与过滤顺序
  - 能识别 ORM 循环里的 N+1 往返开销，并用 JOIN 联表或 IN 批量预加载消除它
  - 能核算多实例连接池总账，划清不含外部网络调用的短事务边界
aiLink: 抓牢三条铁律：调优前先看执行计划，别盲改 SQL；慢往往慢在往返次数而非单条语句；连接与事务都是向数据库借来的稀缺资源，好借快还。
bridge:
  prev: 沿着请求链路穿过网关、中间件与业务层后，压力最终落到数据库调用上：SQL 怎么写、连接怎么借还，直接决定接口是 50 毫秒返回还是卡上 3 秒。
  next: 查得快还不够，接口还得扛得住恶意构造的请求：把订单号改一位偷看别人记录、在输入框里塞半句 SQL 绕过登录，正是下一课后端安全要堵住的缺口。
design:
  - mechanism: 声明式查询，执行计划问责
    problem: SQL 只描述要什么结果，同一句查询在不同数据量与索引下，引擎选出的路径可能相差上千倍；光盯着 SQL 文本盲改，无异于蒙眼撞大运。
    choice: 把 EXPLAIN 执行计划定为唯一问责依据：遇到慢查询先看扫描方式、联表顺序和预计行数，找准病根再决定是补索引还是改写法。
    tradeoff: 执行计划依赖引擎统计信息，统计过期时可能估偏；而且读懂计划需要实战积累，团队得养成「先看计划再动手」的硬习惯。
    root: 声明式语言把执行路径交给了优化器，开发者能控制的只有索引组织与条件提法，执行计划正是连接这两头的唯一透视窗。
  - mechanism: 连接池复用昂贵连接
    problem: 新建数据库连接要走三次握手与身份认证，耗时几十毫秒；若每来一个请求现建现拆，高并发下光握手就吃掉大半时间，还会瞬间打爆数据库连接上限。
    choice: 应用启动时在内存里预建一批长连接放进连接池，请求来了借走、查完立刻归还，由池子统一管控上限与排队超时。
    tradeoff: 多了一组必须紧盯的监控指标与配额参数；尤其应用水平扩容时，若不同步下调单实例池上限，多实例加总会直接冲垮数据库。
    root: 数据库每条连接都要独占一份内存与工作线程，连接池本质上是把失控的按需建连收拢成可计算的全局配额管理。
  - mechanism: 短事务边界且剥离外部网络调用
    problem: 事务未提交时会一直霸占数据库连接与行锁。一旦在事务里调支付、发短信等外部接口，网络卡几秒，连接与锁就陪绑几秒，并发一高全站跟着卡死。
    choice: 事务只包住数据库内部那几步读写，做完立刻提交；跨出数据库的网络动作放到提交之后，用幂等重试与补偿逻辑兜底（与分布式 Saga 一脉相承）。
    tradeoff: 外部调用失败时业务会短暂处于中间态，必须多写异步重试、逆向补偿或定时对账代码，不能靠一句回滚偷懒。
    root: 数据库事务的原子性管不到外部网络，把秒级网络等待塞进毫秒级锁周期里，不会换来跨系统一致性，只会把稀缺锁资源彻底耗尽。
quiz:
  - q: 线上订单列表页慢到 3 秒，排查第一步该做什么？
    options:
      - 凭感觉重写 SQL 碰碰运气
      - 给表里所有字段都加上索引
      - 先跑 EXPLAIN 看执行计划：走没走索引、先查哪张表、预计扫多少行
      - 直接给数据库扩容内存
    answer: 2
    explain: SQL 是声明式的，病根藏在引擎的实际扫描路径里。先看 EXPLAIN 才能分清是缺索引全表扫描、联表顺序反了还是统计信息过期，对症下药。
  - q: 先查出 100 条订单，渲染时又在循环里逐条查买家昵称，共发出多少条 SQL？叫什么问题？
    options:
      - 2 条，联表查询
      - 101 条，N+1 查询问题
      - 100 条，全表扫描
      - 1 条，慢查询锁等待
    answer: 1
    explain: 1 条查订单列表加 100 条逐个查买家，共 101 条 SQL，即 N+1 问题。单条虽快，上百次网络往返也会拖到几百毫秒，应改为 JOIN 联表或 IN 批量查回。
  - q: 100 个应用实例各配 20 条连接池上限，数据库 max_connections 为 500，高峰期会怎样？
    options:
      - 池子配得越大并发越顺畅
      - 100×20=2000 打穿 500 上限，超出的建连请求被数据库直接拒绝报错
      - 数据库会自动把连接上限扩容到 2000
      - 不同实例的连接池会自动共享空闲连接
    answer: 1
    explain: 连接池必须算全局总账：所有实例池上限之和加预留余量必须小于数据库上限。扩容实例忘调小单池，新实例一上线就会抢光连接。
  - q: 为什么数据库事务里绝不能直接调用第三方支付接口？
    options:
      - 第三方支付接口按次计费太贵
      - 事务未提交时一直扣着连接与行锁，等外部网络返回的秒级时间会把池借空、把热点行锁死
      - 支付接口返回 JSON 而非 SQL
      - SQL 语法禁止事务期间发网络请求
    answer: 1
    explain: 数据库连接与行锁只应按毫秒持有。把秒级外部网络请求包进事务，下游一抖动就会耗尽连接与锁，拖垮全站。
steps:
  - id: declarative-sql
    title: SQL 只声明要什么结果，怎么找由引擎的执行计划说了算
    tldr: SQL 描述的是结果而非操作步骤，同一句查询在不同数据量与索引下速度可差上千倍；调优永远先用 EXPLAIN 读懂引擎的实际扫描路径，再决定改索引还是改写法。
    body: |-
      平时写业务循环是在下达命令式步骤：先遍历哪个数组、再拿哪个键去哈希表里查，每一步怎么跑全由你写死。SQL 恰恰相反——你只写下「把这三张表按条件连起来、按时间倒序取前 20 条」，至于先翻哪张表、走哪个索引、扫多少行，全由数据库查询优化器自己拍板。同样一句 SQL，测试库几百行和生产库几百万行、有索引和没索引，引擎选出的路径开销能差出上千倍。

      正因为执行路径不在 SQL 字面上，盲改查询语句才像蒙眼抓药。好在引擎愿意把执行方案亮出来：在查询前加上 [[EXPLAIN]]，它就会逐行交出执行计划。日常排查抓住三处看就够了：扫描方式（走了索引还是落入[[全表扫描]]）、联表顺序（拿哪张小表驱动大表）、以及预计行数与真实数据量偏差大不大。

      [[B+ 树]]为什么能把查找压到三四层高，数据学科的索引课已经拆透；站在写服务的一侧，我们的核心基本功是看懂这份执行计划，一眼揪出引擎在哪一步走了弯路。
    derivation: original
    sources:
      - ref: postgresql-docs
        locator: "PostgreSQL Documentation: EXPLAIN 与查询计划的读法"
        claim: EXPLAIN 展示查询的执行计划，包括扫描方式（顺序扫描/索引扫描）、联表方式与预计行数，是诊断慢查询路径的标准工具。
        status: verified
        checkedBy: subagent
        checkedAt: "2026-11-17"
    canvas:
      kind: swimlane
      actors:
        - lane: app
          id: dev
          label: 开发者：只写下想要的结果
        - lane: engine
          id: eng
          label: 引擎：自己决定怎么找，并用执行计划交卷
          highlight: true
      messages:
        - id: m1
          from: dev
          to: eng
          label: SQL 是需求描述，不是操作步骤
        - id: m2
          from: eng
          to: dev
          label: 执行计划：扫描方式、联表顺序、预计行数
          active: true
      registers:
        - name: 读计划三看
          value: 扫描方式、联表顺序、预计行数准不准
    log:
      - at: 本质
        text: 声明式的代价是路径不可见，执行计划是观测面
  - id: join-multiplication
    title: 联表查询的乘法账：给关联键加索引，先筛出小集合再联表
    tldr: 一万条订单硬连一万个无索引用户，引擎要做一亿次比对；给关联字段建索引并先将订单筛到 20 条再联表，比对开销立刻从乘法级塌缩回加法级。
    body: |-
      订单列表页要连订单（1 万行）、用户（1 万行）和商品（5000 行）三张表。最原始的嵌套循环联表，是拿每条订单去用户表里找买家：一旦关联字段没建索引，每找一次就要把用户表从头扫一遍，1 万乘 1 万等于 1 亿次比对，页面不卡到 3 秒才怪。给关联键建好索引后，每次查买家只在 [[B+ 树]]里走三四层，总寻址量瞬间降回四万次量级——给联表外键兜底，正是业务库里索引的头号用途。

      光有索引还不够，联表顺序同样致命。列表页最终只要最新 20 条订单，划算的路径是先在订单表上过滤、排序、截断出这 20 行，再拿这 20 行小集合去关联用户与商品；要是反过来先把三张表拼成大宽表再过滤，前面的海量关联就全白算了。查询优化器通常会尝试把过滤条件下推，但写出不阻碍下推的 SQL、再用执行计划亲眼确认过滤发生在了联表之前，依然是开发者的职责。

      拿到这类多表慢查询的执行计划，直接盯紧两处：被关联字段走没走索引扫描，过滤与截断是不是压在了最内层。这两处理顺，列表页那 3 秒延迟往往当场砍掉大半。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: engine
          id: naive
          label: 硬连：一万乘一万，一亿次比对
        - lane: engine
          id: smart
          label: 先筛到二十条再联，加索引走树高
          highlight: true
      messages:
        - id: m1
          from: naive
          to: smart
          label: 过滤提前加联表索引，乘法账塌缩成加法账
          active: true
      registers:
        - name: 没索引的联表
          value: 10000 × 10000 = 一亿次比对
        - name: 优化后
          value: 先截断到 20 行，联表只发生在小集合上
    log:
      - at: 联表
        text: 联表的成本是乘法，先过滤再联是第一原则
  - id: slow-log-triage
    title: 慢查询排障：按「耗时×频率」抓头号拖累，改完回日志验尸
    tldr: 数据库慢查询日志忠实记录超时 SQL 的耗时与频次；排障先按「单次耗时×出现频率」的总拖累排序擒贼擒王，对症下药后再回慢日志确认它真正消失。
    body: |-
      线上慢查询不靠等用户投诉才发现，主流数据库都自带慢查询日志：凡是执行超过阈值（比如 1 秒或 200 毫秒）的语句，都会连同耗时、扫描行数与调用次数记入账本。排查时千万别只盯着单次最慢的那条——一条跑 10 秒但每月才跑一次的后台统计，远不如一条跑 0.5 秒却每分钟触发 100 次的核心列表危险。按「单次耗时 × 调用频率」算出总拖累排序，力气才花在刀刃上。

      拎出头号嫌犯后再跑 [[EXPLAIN]] 对症开方，常见病根逃不出三类：过滤或联表字段缺索引，补上索引即可；明明建了索引却没走，多半是对字段套了函数导致索引失效，或是统计信息过期让优化器误判[[全表扫描]]更省，需要改写法或刷新统计信息；计划走了索引依然慢，往往是一次拉回了几万行大字段，得靠分页与裁剪列收口。

      改完上线还有最后一条纪律：别在浏览器里手点两下觉得变快就收工——测试时缓存正热、并发又低，最容易产生幻觉。必须盯住生产慢查询日志，亲眼确认这条语句不再上榜才算结案。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: engine
          id: log
          label: 慢查询日志：耗时、行数、频率都在
        - lane: app
          id: triage
          label: 排障顺序：按总耗时排，先治最拖累的
          highlight: true
      messages:
        - id: m1
          from: log
          to: triage
          label: 半秒乘一百次，比十秒乘一次更值得治
          active: true
      registers:
        - name: 排序口径
          value: 单次耗时 × 频率 = 总拖累
        - name: 验证方式
          value: 回到日志里确认它消失，而不是手测变快
    log:
      - at: 定位
        text: 先按总耗时找到刀刃，再看执行计划定药方
  - id: n-plus-one
    title: N+1 查询陷阱：一行无害的循环怎样暗中发出上百条 SQL
    tldr: 先查 100 条订单再在循环里逐条懒加载买家信息，会让数据库收到 101 次查询；单条哪怕只要 1 毫秒，上百次网络往返也会拖垮接口，必须改为联表或 IN 批量预加载。
    body: |-
      代码审查里最隐蔽的慢法莫过于 [[N+1]]：应用先发 1 条 SQL 取出最新 100 笔订单，接着在模板或循环里读取每笔订单的买家昵称；ORM 发现关联对象还没加载，便悄悄替每笔订单补发 1 条按主键查用户的 SQL。开发者眼里只是干干净净几行循环，数据库却硬生生接了 `1 + 100 = 101` 次独立查询。

      单看其中任何一条主键查询都快如闪电（不到 1 毫秒），连慢查询日志都抓不到它；可每次查询都要走一趟应用与数据库之间的网络往返与连接借还，按每趟 2 毫秒算，101 次就白白烧掉 200 多毫秒，一旦列表扩到 1000 条直接卡上 2 秒。这也解释了为什么它在只有三五条假数据的开发机上毫无察觉，一上生产就原形毕露。

      根治思路只有一条——把「逐条追问」合并成「一次问清」：要么在查订单的那条 SQL 里直接 `JOIN` 用户表一次拿齐；要么先收集这 100 笔订单去重后的买家 ID，发一条 `WHERE id IN (...)` 批量查回再在内存里拼装。GraphQL 生态里的 [[DataLoader]] 和各家 ORM 内置的预加载（Eager Loading）开关，干的全是这件打包活。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: app
          id: loop
          label: 应用：一行循环，看似只查了一次
        - lane: engine
          id: db
          label: 数据库：实际收到 101 条查询
          highlight: true
      messages:
        - id: m1
          from: loop
          to: db
          label: 1 条查订单，100 条逐个查买家
          active: true
      registers:
        - name: 往返账
          value: 101 条 × 每回约 2 毫秒 = 200 多毫秒
        - name: 改法
          value: 联表一次拿全，或 IN 批量查回再对号
    log:
      - at: N+1
        text: 慢在次数不在单条，把逐条问改成一次问
  - id: connection-pool
    title: 连接池总账：单池大小乘以应用实例数，绝不能打穿数据库上限
    tldr: 新建数据库连接要走握手与认证，开销比查询本身贵一个数量级；连接池预先养好连接循环借还，但所有应用实例的池上限之和必须小于数据库最大连接数，扩容时必须同步重算。
    body: |-
      建一条数据库连接远比想象中沉重：走完 [[TCP]] 三次握手、身份认证与会话初始化，哪怕在同机房内网也要几十毫秒，比一条毫秒级普通查询贵出一个数量级。要是一万次并发请求全靠现建现拆，光握手和回收线程就能把数据库折腾趴下。[[连接池]]的做法是在应用启动时预先建好一批长连接（比如 20 条），请求来了借走一条、查完立刻归还，让连接在池子里循环周转。

      池子配多大，是一道不能偷懒的全局算术题。配太小，高峰期请求全堵在池门口排队等借连接；配太大，单看一个实例似乎没事，一旦横向扩容到 100 个应用实例，每池 20 条全打满就是 `100 × 20 = 2000` 条连接，而数据库的 `max_connections` 上限可能只有 500——超出的建连请求会被数据库直接拒绝，新扩容出来的实例非但没帮上忙，反而一上线就把连接抢光报错。

      线上配池盯死三条准则：单实例池大小按本实例实际并发查库数估算；「实例总数 × 单池上限」必须小于数据库上限并给运维留出余量；借不到连接的等待超时必须设短（比如几百毫秒快速失败），绝不能无限死等把上游线程全拖垮。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: app
          id: inst
          label: 100 个应用实例：每池 20 条连接
        - lane: pool
          id: pool
          label: 连接池：借还循环，总额要算账
        - lane: engine
          id: db
          label: 数据库：最大连接数 500
          highlight: true
      messages:
        - id: m1
          from: inst
          to: db
          label: 100 × 20 = 2000，打穿 500 的上限
          active: true
      registers:
        - name: 建连接成本
          value: 握手加认证几十毫秒，比查询贵一个量级
        - name: 总账铁律
          value: 实例数 × 池大小 < 数据库上限，还要留余量
    log:
      - at: 连接池
        text: 连接是配额，扩容应用必须同步重算池子
  - id: transaction-boundary
    title: 事务边界：毫秒级快进快出，绝不在事务里等待外部网络
    tldr: 开启中的事务一直占着数据库连接与数据行锁；事务只应包住数据库内那几步读写并尽快提交，调支付、发通知等网络请求一律放到提交之后，靠幂等重试与补偿收尾。
    body: |-
      隔离级别与 [[MVCC]] 的底层机制已在数据学科拆过，落回线上代码最要命的是事务时长。事务一旦开启，就会一直扣押着从连接池借来的那条连接，并死死攥住它改过的行锁；其他并发请求想改同一行商品库存，只能排队干等。正常事务只有几毫秒，锁争用微乎其微；可一旦有人在事务里塞进一次第三方支付或发短信的网络请求，下游抖动两秒，连接和热点行锁就被平白扣押两秒——并发稍高，连接池瞬间借空，全站跟着雪崩超时。

      干净的切法是把外部调用彻底剥出事务外：事务只包住「扣减库存、写入订单记录」这几步纯数据库操作，毫秒级提交释放锁之后，再去发起支付请求或消息通知。万一外部接口调失败了怎么办？靠[[幂等]]重试与逆向补偿把订单状态扭转回来——这正是分布式课程里 [[Saga]] 模式在单库业务里的日常落地：宁可事后多写一段补偿，也绝不拿数据库锁去陪跑外部网络。

      同一个 [[HTTP]] 请求里的多步写库动作也要边界分明：要么完整包进一个短事务同生共死，要么明确拆成带补偿状态机的多阶段步骤。最忌讳半截在事务里、半截散在外面，一旦中途报错，数据就会卡在谁也修不好的半成品状态。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: app
          id: bad
          label: 坏切法：事务里调支付，等了两秒
        - lane: engine
          id: held
          label: 这两秒里：连接与行锁全被扣着
        - lane: pool
          id: good
          label: 好切法：事务只包数据库几步，外部动作在提交后
          highlight: true
      messages:
        - id: m1
          from: bad
          to: held
          label: 锁的寿命从毫秒被放大到秒
          active: true
      registers:
        - name: 事务寿命
          value: 应该以毫秒计，不许包含秒级的网络等待
        - name: 失败收场
          value: 外部动作靠幂等重试与补偿，不靠拉长事务
    log:
      - at: 事务边界
        text: 事务只包数据库内的事，网络的事在提交后办
  - id: pagination-deep
    title: 深分页的底层开销：OFFSET 不是跳过，而是先数一遍再扔掉
    tldr: "LIMIT 20 OFFSET 10000 会让引擎老老实实数出一万行再丢弃，翻得越深越慢；游标分页改用上一页末尾编号做索引定位锚点，无论翻多深开销恒定。"
    body: |-
      订单列表翻到第 501 页（每页 20 条）时，偏移写法发出的 SQL 是 `LIMIT 20 OFFSET 10000`。很多人以为 `OFFSET` 是指针一步跳过去，实际上数据库引擎必须顺着排序结果从头一条条往后数，硬数够前 10000 行全部扔掉，从第 10001 行才开始装填返回的 20 条。页码一旦翻到第 5000 页，被白白扫出来又扔掉的行数高达 99980 行，接口自然越翻越卡。

      [[游标分页]]在 SQL 层的改法只有一行条件：`WHERE id > 上一页最后一条编号 ORDER BY id LIMIT 20`。只要 `id` 上有索引，引擎就能在 [[B+ 树]]里直接定位到那个锚点编号，顺着叶子节点往后摘 20 条收工，彻底省掉了前面白数几万行的冤枉路——所以第 5000 页和第 1 页的扫描开销完全一样。

      当然，省掉计数是有代价的：游标分页没法直接跳到第 37 页，也没法顺手算出总页数。因此线上选型先看交互形态：管理后台需要跳页和总条数，用偏移分页并给最大页码封顶（比如只允许翻前 100 页）；移动端信息流只管往下滑，果断用游标分页。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: engine
          id: off
          label: OFFSET 10000：先数一万行再扔掉
        - lane: engine
          id: cur
          label: 游标：锚点定位，往后取 20 条
          highlight: true
      messages:
        - id: m1
          from: off
          to: cur
          label: 成本从与页深成正比，变成只与页大小有关
          active: true
      registers:
        - name: 偏移分页
          value: 第 5000 页要先扫过前 99980 条
        - name: 游标分页
          value: 索引定位锚点，深浅一个价
    log:
      - at: 深分页
        text: OFFSET 的成本藏在被扔掉的那些行里
  - id: batch-writes
    title: 批量写入：每批几百到几千条合并提交，砍掉千次网络往返与刷盘
    tldr: 在循环里逐条 INSERT 一千行，会白付一千次网络往返与一千次事务刷盘；合并成每批几百至几千条批量提交，才能在吞吐与失败回滚成本之间拿到最优解。
    body: |-
      读数据怕循环逐条查，写数据同样怕循环逐条插。单条 `INSERT` 执行不到 1 毫秒，可放在循环里连发 1000 次，光网络往返就先烧掉 2 秒；如果每条还默认自动提交一个独立事务，数据库每次提交都要把重做日志刷进磁盘，1000 次磁盘同步更是沉重负担。把数据攒成多值 `INSERT` 批量发送，网络往返与事务提交瞬间从上千次压回个位数。

      大批量离线导入时还要算清索引维护账：表上每多建一个二级索引，每插入一行数据，引擎就得顺手往对应的 [[B+ 树]]里多写一笔——表上有 4 个索引，写 1 行其实干了 5 份活。初始化新表或停机窗口灌入百万级数据时，先把非核心索引摘掉、导完再统一重建，速度往往快出好几倍；但正在承接流量的线上热表绝不能这么拆索引。

      批次也不是塞得越大越好：一口气把 10 万行拼成一条巨型 SQL，不仅撑爆单次报文内存、长时间锁住大片记录，万一第 99999 行数据格式报错，整批 10 万行全得回滚重来。线上最稳妥的分批粒度通常是每批 500 到 1000 条，兼顾低往返与小颗粒重试。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: app
          id: loop
          label: 逐条写：一千次往返加一千次提交
        - lane: engine
          id: batch
          label: 批量写：每批五百条，两次往返办完
          highlight: true
      messages:
        - id: m1
          from: loop
          to: batch
          label: 并成批，往返从千次塌缩到个位数
          active: true
      registers:
        - name: 索引的账
          value: 一行要维护每个索引，大导入先摘后建
        - name: 批量大小
          value: 几百到几千一条，太大则失败重试太贵
    log:
      - at: 批量写
        text: 写的优化和读同理：先砍往返次数
  - id: orm-and-beyond
    title: 工具与负载分家：常规读写交 ORM，复杂重报表赶去只读副本
    tldr: ORM 并非慢查询原罪，常规 CRUD 走 ORM 提效、复杂热路径手写 SQL 并核验计划才是平衡点；同时必须把大跨度统计报表挪到只读副本或分析库，绝不与在线交易抢主库。
    body: |-
      [[N+1]] 并不是 ORM 发明出来的毛病，而是「在循环里逐条查库」本身的恶果，ORM 只是让它藏在一行属性读取背后更难察觉。因此解药也不是一刀切禁掉 ORM、让全站退回满地字符串拼 SQL 的刀耕火种，而是用熟框架自带的批量预加载开关，并在代码审查里盯紧一切循环内的数据库调用。工程上的甜点很清晰：八成常规增删改查交给 ORM 保开发效率，两成复杂多表与高频核心接口手写精调 SQL，并附上 [[EXPLAIN]] 计划留档。

      另一道必须划死的边界是轻重负载分家。客服后台翻一页 20 条订单属于毫秒级在线轻查询，而财务或运营拉取过去三个月全量订单汇总则是动辄扫几百万行的重活——把这两类负载塞在同一个主库里，月度报表一点下导出，前台用户下单立刻跟着抖动。标准解法是读写分离：把重报表切去只读从库（主从复制机制见数据学科复制课），让主库专心伺候在线读写；若统计再重，就同步到专门的列式分析库去跑。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: app
          id: mix
          label: 在线业务：轻查询，要的是稳与快
        - lane: engine
          id: split
          label: 报表负载：赶去只读副本，不抢业务库
          highlight: true
      messages:
        - id: m1
          from: mix
          to: split
          label: 重查询与在线请求分家，互不拖累
          active: true
      registers:
        - name: ORM 的定位
          value: 常规走 ORM，复杂与敏感处手写并验计划
        - name: 负载分家
          value: 报表走副本，业务库只伺候在线请求
    log:
      - at: 边界
        text: 工具与负载对位，是手艺之上的判断
  - id: closing-sql
    title: SQL 实务三条铁律：先看执行计划、少跑网络往返、借来的资源快还
    tldr: 客服后台订单页从 3 秒压回 50 毫秒，靠的不是换数据库或堆内存，而是补齐联表索引、砍掉 N+1 循环往返、算准连接池与短事务边界。
    body: |-
      回看开场那个慢到 3 秒的客服订单列表页，三处病根如今一目了然：联表关联键漏建索引导致大表比对（没看执行计划）、渲染列表时逐条懒加载买家昵称（踩中 [[N+1]] 往返陷阱）、高峰期连接池配额失衡外加长事务排队（没算连接与锁的借还账）。三处病灶逐一拔除，不用换数据库也不用加一兆内存，接口稳稳落回 50 毫秒。

      把日常写库护库的手艺浓缩成三句口诀：第一，调优先看 [[EXPLAIN]] 执行计划，病因藏在引擎的扫描路径里而非字面语法里；第二，慢往往慢在次数而非单条，无论是 N+1、逐条 `INSERT` 还是深分页 `OFFSET`，先砍往返与白扫次数；第三，[[连接池]]连接与数据库事务都是借来的稀缺资源，总额要算全局账，事务要短到绝不陪等外部网络。

      治好了无意间写出来的「慢」，还得防住有人蓄意构造的「坏」——下一课切换到攻击者视角，看同样一条查库接口，怎样被半句引号或一位数字撬开大门。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: app
          id: page
          label: 订单列表页：从三秒到五十毫秒
        - lane: engine
          id: three
          label: 三处病因：没走索引、N+1、连接排队
          highlight: true
      messages:
        - id: m1
          from: page
          to: three
          label: 没换硬件，全靠应用侧手艺
          active: true
      registers:
        - name: 口诀
          value: 先看计划、慢在次数、借来的要快还
    log:
      - at: 收束
        text: SQL 实务是应用侧的手艺，不是数据库的玄学
