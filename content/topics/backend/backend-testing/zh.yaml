title: 后端测试：单元、集成与契约各拦什么
order: 11
visual: swimlane
lanes:
- id: dev
  label: 开发者
- id: ci
  label: 流水线
- id: testdb
  label: 测试数据库
- id: prod
  label: 生产环境
logColumns:
- key: at
  label: 阶段
- key: text
  label: 发生了什么
status: published
license: CC-BY-4.0
overview:
- key: 一句话总结
  value: 后端测试是按故障出生地分层设防的网：单元测试拦函数逻辑算错（毫秒级、数量最多），集成测试连真库真缓存拦 SQL 与事务咬合错误，契约测试拦改接口悄悄弄坏下游。越往上越慢越脆，数量必须呈金字塔收敛。
- key: 单元测试
  value: 只测单个纯函数：喂输入、断输出，绝不碰数据库与网络。单条 5 毫秒、1000 条 5 秒跑完，足够快才能让开发者每次保存或提交前都顺手跑一遍。
- key: 集成测试
  value: 用容器拉起同版本真数据库和缓存，真建表、真跑 SQL、真开事务。它专抓单元层瞎掉的接缝事故——JOIN 写反、事务代理失效、序列化字段错位，因单条约 200 毫秒，只压在关键路径上。
- key: 契约测试
  value: 把调用方依赖的字段名与类型写成可执行契约（如 Pact 或 JSON Schema），提供方每次发版前自动跑一遍校验，不用拉起整套上下游联调就能拦住跨团队改崩接口。
- key: 测试数据库
  value: 数据库引擎必须真，用例数据必须独：每个测试用工厂函数自造数据，跑完靠事务回滚或清理抹平，零共享才不会出现「换个执行顺序就变红」的幽灵故障。
- key: 与前端测试的差别
  value: 前端状态多在内存与 DOM，刷新即重置；后端状态沉进持久化数据库，一处写脏长期传染，且下游调用方不在眼前——因此后端测试中段（集成层）更厚，对数据隔离的要求也更严苛。
- key: 谁在用
  value: Google 工程实践常被概括为 70% 单元、20% 集成、10% 端到端的金字塔配比；微服务组织普遍引入 Pact 做消费者驱动契约测试，流水线按由快到慢分段执行。
summary: 沿着一次真实改动展开：你要把订单服务的退款规则改成「优惠券抵扣按商品实付比例分摊」。全课围绕这次改版织起三层测试网：先用毫秒级的[[单元测试]]钉死分摊计算的所有边界；再通过 Testcontainers 拉起真数据库跑[[集成测试]]，揪出字段写反与事务失效等接缝 bug，并用「自造自清」管住测试数据隔离；接着用[[契约测试]]守住与物流、前端的接口约定；最后算清[[测试金字塔]]的时间账、划定 Stub/Mock 的禁区，讲透怎样读代码覆盖率以及探索性手测的补位价值。
premise: 给订单服务改一行优惠券退款代码，你怎么敢确定没把正常下单、财务对账或物流打单悄悄弄坏？前端改劈了还能刷新浏览器肉眼看出来，后端没有界面，写脏的数据直接沉进数据库、报错爆在下游团队的日志里。靠人脑记清所有调用链迟早翻车，怎么织一张既跑得快又不漏大鱼的自动化防线？
position: 本课位于后端工程学科第十段「质量与形态：测试与微服务」的前半。前面的持续交付课搭好了自动执行检查的[[流水线]]轨道，本课专门解决轨道上跑的测试套件该怎么分层配比；同时它也是下一课微服务的先决条件——服务还没拆开之前，必须先把可执行的[[契约测试]]与集成防线备齐。
level: 进阶
minutes: 26
objectives:
- 按 bug 诞生的位置指派防线：纯逻辑归单元、组件咬合归集成、跨服务接口归契约
- 算清 1000/100/10 的金字塔耗时账，解释为什么沙漏形测试套件必被团队废弃
- 落地「真容器实例 + 独立自清数据」的集成测试方案，划清 Mock 停在系统边界之外的红线
- 拿覆盖率当查漏地图而非 KPI，分清自动化回归与人工探索性测试的分工
aiLink: 记住后端测试两句总纲：按出生地设防——逻辑归单元、咬合归集成、约定归契约；按单价配数量——越快的层铺得越密，越慢的层挑得越精。
bridge:
  prev: 上一课把订单服务稳稳安顿在了 Linux 云服务器上，可线上的服务每周都在迭代：改一处优惠券退款公式，怎么敢拍胸脯保证没把下单弄坏？这一课就把提心吊胆变成可秒级重跑的测试网。
  next: 测试防线织牢了，系统长到三十个人挤同一个代码仓库时又会撞上新的痛：发版排队、故障连坐、扩容只能整站一起扩。下一课算清单体拆微服务的收益账与分布式税单。
design:
- mechanism: 按失败类型分层设防
  problem: 指望一种测试包打天下必翻车：只写单元测试，SQL 写反和事务失效全漏；全堆端到端测试，跑一轮几十分钟还天天因环境抖动误报，最后红灯被全员无视。
  choice: 让测试层对准 bug 的出生地：函数内算错归单元测试，代码与数据库/缓存咬合出错归集成测试，跨服务字段违约归契约测试，端到端只留几条核心主链路。
  tradeoff: 团队需要同时维护三套测试工具和写法，还得拿准分层边界——把纯逻辑塞进集成层只会白白拖慢流水线。
  root: 故障在哪一层滋生，就只有哪一层的上下文能照出它；用最轻的上下文抓对应层级的错，整张网才跑得起、信得过。
- mechanism: 集成测试连真组件，拒用内存假库
  problem: 拿内存假库或全量 Mock 充当集成测试，恰好把生产数据库特有的 SQL 方言、隔离级别、事务代理与类型转换全假掉了，测出满屏绿灯，上线照样炸。
  choice: 测试启动时用容器拉起与生产同版本的真实数据库和缓存，真跑建表迁移与 SQL 事务；只有支付、短信这类不受控的外部第三方才换用测试桩（Stub）。
  tradeoff: 容器拉起与数据准备拉高了单条耗时（约 200 毫秒），因此不能像单元测试那样铺满所有分支，只能精选钱与核心状态流转的主干道。
  root: 集成测试唯一的价值就是「真咬合」——假组件验证的只是程序员自己脑子里对数据库的想象。
- mechanism: 测试数据自造自清、零共享
  problem: 几百条测试共用同一批固定种子数据（比如都改「1 号订单」），前一条测试把它改成了已退款，后一条测发货的用例就莫名挂掉，结果随执行顺序飘忽不定。
  choice: 每条测试开跑时用工厂函数现场生成专属用户和订单，跑完立刻回滚事务或清空记录，用例之间零状态共享，支持乱序与并发执行。
  tradeoff: 需要编写并随业务模型同步维护一套测试数据工厂代码。
  root: 自动化测试的命根子是确定性——跑一百遍结果必须分毫不差，而共享可变状态正是确定性的头号死敌。
quiz:
- q: 一条 SQL 语法合法、但把买家 ID 和卖家 ID 写反了，导致张三查到了李四的订单。这类 bug 归哪层测试拦？
  options:
  - 单元测试，因为它最快
  - 集成测试：只有连上真实数据库建表跑真 SQL，才能照出字段张冠李戴这类配合问题
  - 契约测试，因为涉及两个用户
  - 哪层都拦不住，只能靠上线后看日志
  answer: 1
  explain: 单元测试不连数据库，压根不会执行 SQL；这类故障出在代码与数据库的接缝上，必须靠集成测试往真库里塞入买家卖家两条不同记录、真查一遍才能当场抓获。
- q: 算一笔金字塔耗时账：1000 个单元（单条 5ms）、100 个集成（单条 200ms）、10 个端到端（单条 5s），各层耗时大约是多少？
  options:
  - 单元 5 秒、集成 20 秒、端到端 50 秒——越往上单价越贵，所以数量必须逐层收敛
  - 三层一样快，数量可以随意
  - 端到端最快，应该多写
  - 集成测试比单元还快
  answer: 0
  explain: 金字塔形状纯粹是算术结果：单元层写 1000 个才花 5 秒，端到端才 10 个就吃掉 50 秒。一旦配比倒挂成倒三角或沙漏，流水线就会慢到没人愿意等。
- q: 集成测试时好时坏，单独跑全绿、合起来换个顺序跑就红，头号嫌疑是？
  options:
  - 数据库版本太旧
  - 用例之间共用了同一份测试数据，前一个用例改脏了状态，把后面的用例绊倒了
  - 测试写得太多
  - 单元测试没写够
  answer: 1
  explain: 结果随执行顺序变化是共享可变状态的典型指纹。让每个测试现场自造数据、跑完回滚抹平，才能做到红灯亮起必是真故障。
- q: 行覆盖率高达 95%，但核心退款链路连一条带断言的测试都没有，这说明什么？
  options:
  - 说明系统质量很好
  - 覆盖率只是查漏地图而非质量证明：它只代表代码行跑过，不代表结果验对，漏掉核心资金链的高覆盖率反而给人假安全感
  - 说明应该把覆盖率刷到 100%
  - 说明单元测试写太多了
  answer: 1
  explain: 覆盖率只统计「哪行代码执行过」，哪怕写个没有断言的空调接口也能刷高数字。正确用法是先保住下单、支付、退款的硬核断言，再拿覆盖率去扫遗漏的死角。
steps:
- id: regression-fear
  title: 后端没有肉眼可见的界面：测试防的是改 A 坏 B
  tldr: 后端状态沉在数据库里、调用方远在千里之外，改一行退款逻辑会不会碰坏下单和对账，全指望自动化测试网在发版前报警。
  body: |-
    把订单退款从「原路全退」改成「优惠券按比例分摊」，你动的只是退款函数那十几行代码。但下单落库的优惠字段、财务夜间的对账脚本、客服后台的退款单详情全跟它咬在一起——光靠人脑顺着调用链捋一遍，服务小的时候还能应付，代码上了几万行就是在赌运气。

    自动化测试干的事很朴素：把每一处关键业务行为凝固成可反复重跑的检查脚本。改完代码跑一轮，绿灯证明老规矩没破，亮起红灯的那三条用例当场指明碰疼了哪根神经。而且这张网是复利资产：系统越老、接手的人越多，它替你拦下的线上回归事故就越值钱。

    为什么后端比前端更离不了这张网？前端改劈了样式或状态，刷新浏览器点两下多半能看见；后端没有界面，一旦把错误的退款金额写进数据库，脏数据就会永久留在表里传染后续所有查询，而调你接口的手机 App 和物流服务根本不在你眼前。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: dev
      id: dev
      label: 开发者：只改了退款计算一处
    - lane: ci
      id: net
      label: 测试网：红了三个，指明碰疼了哪里
      highlight: true
    messages:
    - id: m1
      from: dev
      to: net
      label: 改动先过网，再谈上线
      active: true
    registers:
    - name: 敌人
      value: 不是写不出，是改 A 坏 B 而不自知
    - name: 后端的特殊性
      value: 状态在数据库里，坏了看不见，只能靠网
  log:
  - at: 本质
    text: 测试是把「知道碰没碰疼」变成可重跑的检查
- id: unit-tests
  title: "[[单元测试]]专盯纯函数：1000 个用例 5 秒跑完"
  tldr: 单元测试只给纯函数喂输入、断输出，绝不连数据库与网络；单条 5 毫秒的极速，让它能把分摊计算的刁钻边界全部钉死。
  body: |-
    拿优惠券退款算一笔实账：总价 300 元的订单用了 30 元满减券，顾客退掉其中一件标价 100 元的商品，按实付比例分摊 10 元券额，应退 90 元。那连退两件怎么取整？最后一分钱尾差归哪件？券面额比单品还贵怎么办？运费退不退？把这十几种边界分别写成测试函数（就像前端用 Vitest 测纯工具函数那样），改没改对一跑便知。

    [[单元测试]]之所以能铺上几百上千条，全靠一个「快」字：不连数据库、不发网络包、不读写磁盘，纯内存计算单条只要 5 毫秒，1000 个用例 5 秒跑完。开发者每次保存代码都愿意顺手跑一遍，[[流水线]]也把它摆在第一道关卡。

    守住速度只有一条铁律：一旦某个「单元测试」开始连库或调远程接口，它就变质了。为了让核心规则好测，写业务代码时就要主动把「算退多少钱」抽成不依赖数据库的纯函数，把查出来的订单数据当普通参数传进去——好测的代码，天然就是职责解耦的好代码。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: dev
      id: fn
      label: 退款计算函数：纯规则，无外部依赖
    - lane: ci
      id: fast
      label: 一千个用例：5 秒跑完，第一关
      highlight: true
    messages:
    - id: m1
      from: fn
      to: fast
      label: 边界全钉成用例：退一件、退两件、券比货贵
      active: true
    registers:
    - name: 标准像
      value: 300 元订单、30 元券、退 100 元的商品退 90 元
    - name: 纪律
      value: 碰了数据库或网络，它就不再是单元测试
  log:
  - at: 单元层
    text: 快让它能铺满，纯让它的红绿可信
- id: integration-tests
  title: "[[集成测试]]专抓接缝事故：只有真数据库能照出原形"
  tldr: SQL 字段写反、事务代理失效、JSON 序列化错位都长在组件接缝处，单元测试完全看不见，必须把服务连上真数据库与真缓存才能抓获。
  body: |-
    看两个单元测试永远抓不到的线上真事故。第一个是字段写反：下单逻辑算得滴水不漏，偏偏 INSERT 语句里把 `buyer_id` 和 `seller_id` 填颠倒了——单元测试不跑 SQL 发现不了，开发者拿自己账号自测买家卖家同一个 ID 也看不出来，只有[[集成测试]]往真数据库里塞进张三、李四两个不同账号真跑一遍下单查询，颠倒当场败露。

    第二个重灾区是事务静默失效。代码方法头上明明挂了声明式事务注解，却因为同一个类内部直接调方法绕过了框架动态代理，事务压根没开启：库存扣掉了，写订单报错抛异常，库存却没退回来。要是用内存假对象代替数据库，假对象根本没有真实事务引擎，测一百遍也是假绿灯。

    真刀真枪连库是有代价的：建表、插数据、走网络协议，单条集成测试普遍要花 200 毫秒左右，比单元慢上 40 倍。所以集成层绝不追求穷举所有算术分支，只把火力集中在下单、支付、退款这几条钱流过的核心主干道上。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: dev
      id: svc
      label: 服务：下单接口，逻辑看着全对
    - lane: testdb
      id: real
      label: 真数据库：买家卖家字段写反，当场现形
      highlight: true
    messages:
    - id: m1
      from: svc
      to: real
      label: 假数据库测不出的，真实咬合一测便知
      active: true
    registers:
    - name: 高发区
      value: SQL 语义、事务是否真生效、字段对位
    - name: 取舍
      value: 慢四十倍，只覆盖钱经过的路径
  log:
  - at: 集成层
    text: 价值全在真字上，验的是咬合不是想象
- id: test-database
  title: 测试数据库怎么管：Testcontainers 起真库，用例自造自清
  tldr: 用容器现场拉起与生产同版本的真数据库保证咬合真实，每个用例用工厂自造数据、跑完回滚抹平，彻底根治随顺序飘忽的假红灯。
  body: |-
    集成测试的真数据库长什么样、在哪跑？现代后端工程的标配是 Testcontainers 这类测试库：跑测试命令时，它自动调本机 Docker 拉起一个与生产同版本的 PostgreSQL 或 MySQL [[容器]]，先刷一遍建表迁移脚本，全套测试共用这一个容器实例以省下每次几秒的启动时间，跑完整个容器直接销毁——新人克隆下代码敲一行测试命令就能跑，不用先在电脑上手工装数据库。

    容器实例可以共用，里面的表数据却半点不能共用。最害人的反模式是全套测试共享一份固定的初始化 SQL：大家轮流操作「用户张三、1 号订单」，前一个退款测试把 1 号订单改成了「已关闭」，后一个测发货的用例紧跟着就挂了；单独重跑发货用例又是绿的。解法是每个测试开头用三行工厂函数现场造出专属用户和订单，用例结束立刻做事务[[回滚]]或清表，做到零状态残留、支持乱序并行。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: testdb
      id: env
      label: 容器起的真数据库：与生产同版本
    - lane: dev
      id: data
      label: 每个测试：工厂造数据，跑完回滚清掉
      highlight: true
    messages:
    - id: m1
      from: env
      to: data
      label: 环境共用一个实例，数据坚决不共用
      active: true
    registers:
    - name: 反模式
      value: 共享固定数据，失败跟着顺序走
    - name: 正解
      value: 自造自清，红了就一定是真红
  log:
  - at: 测试数据
    text: 环境求真，数据求独，确定性是地基
- id: contract-tests
  title: "[[契约测试]]守住跨团队接口：把口头约定写成校验清单"
  tldr: 调用方把依赖的响应字段与类型写成可执行契约，提供方每次改接口都在流水线里自动核对，无需拉起两套服务联调就能防住改崩下游。
  body: |-
    订单服务程序员看驼峰命名不顺眼，把返回[[JSON]]里的 `buyerName` 改成了 `buyer_name`，或者把退款金额单位从「分」改成了「元」，顺手把订单仓库自己的单元和集成测试全改绿了。结果周五一发版，隔壁物流服务取不到收件人名字，全站快递面单全部停打——两边各自的测试明明都全绿，事故却在两个团队的接缝间炸了。

    [[契约测试]]专门给这种跨团队接口上锁。以开源工具 Pact 代表的「消费者驱动契约」为例：消费方（物流服务或前端仓库）把「我只依赖订单接口返回这 4 个字段及对应类型」写成一份契约文件提交上去；提供方（订单服务）每次跑[[流水线]]时，自动拿这份契约请求自家接口——只要删了字段、改了名字或变了类型，订单团队自己的构建当场红灯拦下。哪怕不引专用框架，上下游共享一份 JSON Schema 或 `.proto` 定义跑自动校验，干的也是同一件事。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: dev
      id: consumer
      label: 消费方：把依赖的字段写成契约
    - lane: ci
      id: verify
      label: 提供方流水线：每次改动先过契约
      highlight: true
    messages:
    - id: m1
      from: consumer
      to: verify
      label: 字段改名或改义，红灯当场亮起
      active: true
    registers:
    - name: 拦的事故
      value: 每边都没错，约定变了没人通知
    - name: 与集成的分工
      value: 集成管自家咬合，契约管与人约定
  log:
  - at: 契约层
    text: 约定写成可执行文件，改接口先过它
- id: pyramid-math
  title: "[[测试金字塔]]的时间算术：单价决定数量形状"
  tldr: 1000 个单元花 5 秒、100 个集成花 20 秒、10 个端到端花 50 秒；越往上越慢越脆，数量倒挂成沙漏只会让整套测试被团队彻底抛弃。
  body: |-
    Mike Cohn 提出、经 Martin Fowler 普及的[[测试金字塔]]（Google 常见经验配比约为 7:2:1），背后的道理纯粹是一笔时间账。按真实量级算一算：单元测试单条 5 毫秒，铺满 1000 个总共才 5 秒，每次提交都跑毫无压力；集成测试要连真库造数据，单条 200 毫秒，100 个耗时 20 秒，放在[[流水线]]第二阶段刚好；端到端测试要把前后端整站拉起模拟点击，单条 5 秒起步，才写 10 个就要 50 秒，还三天两头因网络或动画抖动报假红灯。

    要是团队嫌抽纯函数麻烦，把校验全堆在端到端层（堆成「冰淇淋筒」或「沙漏形」），几百条端到端跑一轮动辄四十分钟，每次还随机红五六条假的。不出两周，所有人都会养成「红了重跑一下或者直接跳过」的习惯——一旦红灯失去威慑力，整张测试网就形同虚设。流水线排布也照这笔账来：毫秒级单元打头阵秒抓逻辑错，集成与契约紧随其后，少量端到端殿后守住主路径。
  derivation: original
  sources:
  - ref: fowler-test-pyramid
    locator: "Martin Fowler: Test Pyramid（金字塔形的测试配比与成本论证）"
    claim: 测试金字塔主张底层单元测试占多数、越往上数量越少，依据是高层测试更慢、更脆、定位成本更高；配比反转会导致套件运行成本失控。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: ci
      id: pyr
      label: 金字塔：单元千个、集成百个、端到端十个
    - lane: prod
      id: time
      label: 总账：5 秒、20 秒、50 秒，逐层变贵
      highlight: true
    messages:
    - id: m1
      from: pyr
      to: time
      label: 数量形状由每层的单价决定
      active: true
    registers:
    - name: 沙漏死法
      value: 端到端太多，跑不起又天天误报，被团队无视
    - name: 流水线顺序
      value: 快的先跑，慢的后跑，契约并行验
  log:
  - at: 配比
    text: 速度定数量，是算术不是审美
- id: mock-boundary
  title: Stub 与 Mock 的禁区：假货只准挡在系统边界之外
  tldr: 自家数据库与缓存必须连真的，Mock 掉它们等于拿想象测自己；只有微信支付、短信网关这类外部第三方才该换用测试桩。
  body: |-
    为什么很多项目「本地测试一片全绿，一发到线上立刻崩盘」？十有八九是 Mock 滥用越了界。先把两个替身词掰清楚：测试桩（Stub）负责给依赖预设死台词——比如问支付网关「这单付了吗」，桩固定回「已付」；Mock 则多长一只眼睛，专门核对「你调没调我、传的参数分秒不差吗」。

    替身到底该停在哪条线外，只看「这处咬合归谁负责」。PostgreSQL 和 Redis 是你自家系统内部的一半，SQL 方言对不对、事务锁生没生效本就是集成测试要验的正主；如果图省事把数据库也 Mock 掉，你测的就只是自己脑子里对数据库的幻想。反过来，微信支付或短信网关由外部厂商维护，你既不该在日常单测里真扣钱发短信，也没义务替厂商测内部逻辑——用 Stub 模拟成功、余额不足、超时三种返回码，验准自家分支处理即可，真联调留给低频的厂商沙箱。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: testdb
      id: real
      label: 必须真的：数据库、缓存（自家咬合）
    - lane: dev
      id: stub
      label: 可以假的：支付、短信（系统之外）
      highlight: true
    messages:
    - id: m1
      from: real
      to: stub
      label: 分界线：咬合归谁验，假货就停在哪之外
      active: true
    registers:
    - name: 滥用签名
      value: 测试全绿、上线全红
    - name: 沙箱的位置
      value: 第三方真联调低频做，不进日常套件
  log:
  - at: 假货边界
    text: 假的只能顶替系统之外的依赖
- id: coverage-reading
  title: 代码覆盖率是查漏地图，一旦定成 KPI 立刻失效
  tldr: 行覆盖率 90% 只代表代码跑过一遍，不代表断言验对了结果；先钉死钱、权、数据三条命脉，再拿未覆盖标红区扫盲点。
  body: |-
    看到覆盖率报告印着漂亮的 `90%`，千万别急着放心——这个数字只证明测试执行期间有九成代码行被 CPU 路过了一次，却对三件要命的事只字未提：跑完到底写没写 `assert` 断言（调一遍接口啥也不验照样涨覆盖率）、除零或负金额等刁钻边界试没试、剩下没跑到的 `10%` 里是不是正好躺着核心退款分支。

    读覆盖率的正确姿势分两步走：第一步抛开百分比，先点名核查资金链（下单、支付、分摊退款）、权限链（越权拦截）与数据迁移链，确保每一条都有验到数据库落盘结果的硬断言；第二步才打开覆盖率染色图当雷达，看看哪段异常兜底分支从来没亮过——要么补条故障用例把它测透，要么干脆删掉永远走不到的死代码。一旦管理层把「覆盖率必须过 85%」定成考核 KPI，团队马上会挑最省事的 `getter/setter` 狂刷数字，真正棘手的核心交易逻辑反而被绕着走。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: ci
      id: cov
      label: 覆盖率报告：九成代码被执行过
    - lane: dev
      id: read
      label: 正确读法：先按风险查核心路径，再扫未覆盖区
      highlight: true
    messages:
    - id: m1
      from: cov
      to: read
      label: 数字回答「哪里没测」，不回答「测得对不对」
      active: true
    registers:
    - name: 先保的路径
      value: 钱、权、数据三类路径，断言要验到结果
    - name: 当 KPI 的下场
      value: 专挑简单代码刷数字，核心逻辑被绕过
  log:
  - at: 覆盖率
    text: 它是查漏的地图，变成目标就失效
- id: manual-testing
  title: 人工测试的真正位置：已知回归交给机器，未知盲区交给探索
  tldr: 每次发版前靠人肉点一遍页面，结论在下次改代码那秒就过期了；人工精力应留给带着怀疑乱试的探索性测试，并把抓到的新洞沉淀回自动用例。
  body: |-
    算一笔手工点页面的账：测试同学花整整半天把下单、用券、退款手工点通一遍，换来的安心感只对今天这个 Git 提交有效；下周别人改了三行折扣代码，上周的结论全部作废，要么再搭进半天人肉重测，要么壮着胆子裸发。凡是「每次发版都得重复验一遍」的确定路径，写自动测试虽然开头费劲，往后跑一万遍边际成本几乎为零。

    那自动化测试能彻底取代人吗？取代不了，因为脚本只能校验你事先想得到的剧本。真正需要人上场的叫「探索性测试」：由老练的工程师带着破坏欲去折腾系统——往备注框塞十万字表情包、在点下退款的瞬间断网连按三次、开两个浏览器窗口同时退同一笔子订单。每当探索性测试揪出剧本外的漏网之鱼，修完 bug 顺手补一条自动用例锁死现场，测试网就会越织越密。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: dev
      id: auto
      label: 自动测试：已知的、重复验的
    - lane: prod
      id: explore
      label: 探索性测试：未知的、靠直觉嗅的
      highlight: true
    messages:
    - id: m1
      from: auto
      to: explore
      label: 探索的发现沉淀成新用例，网越用越密
      active: true
    registers:
    - name: 手测的原罪
      value: 结论只对当前版本有效，不可重复
    - name: 探索的价值
      value: 专找用例清单之外的问题
  log:
  - at: 边界
    text: 已知归自动，未知归探索，发现要沉淀
- id: closing-testing
  title: 后端测试收官：三句分工口诀与成色审查四问
  tldr: 逻辑归单元、咬合归集成、约定归契约；审任何后端仓库的测试成色，连问核心断言、真库假库、数据隔离、可执行契约四件事即见分晓。
  body: |-
    接手任何一个后端仓库，不用被几千个测试文件名晃花眼，直接拿这四个问题去探底：① 像优惠券分摊退款这样的资金核心路径，有没有验到最终金额与落盘状态的硬断言？② 集成测试连的是容器拉起的同版本真库，还是自欺欺人的全量 Mock？③ 把测试套件打乱顺序并发跑十遍，会不会因为共享种子数据而随机翻红？④ 跨团队调用的接口字段，有没有 Pact 或 Schema 校验在流水线里替下游站岗？

    四问全过，团队每次改核心代码就都有底气秒级发版；但等研发团队从几个人长到几十个人挤在同一个仓库里时，哪怕测试全绿，发版排队与资源连坐也会成为新的瓶颈——下一课我们就来算单体拆微服务的总账。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: ci
      id: net
      label: 三层网：单元、集成、契约各就其位
    - lane: dev
      id: four
      label: 审查四问：核心断言、真库假库、数据独立、契约可执行
      highlight: true
    messages:
    - id: m1
      from: net
      to: four
      label: 四问答完，网的疏密就清楚了
      active: true
    registers:
    - name: 口诀
      value: 逻辑归单元、配合归集成、约定归契约
  log:
  - at: 收束
    text: 测试网的成色，决定改版时的胆量
