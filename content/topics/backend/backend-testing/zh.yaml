title: 后端测试：单元、集成与契约各拦什么
order: 11
visual: swimlane
lanes:
- id: dev
  label: 开发者
- id: ci
  label: 流水线
- id: testdb
  label: 测试数据库
- id: prod
  label: 生产环境
logColumns:
- key: at
  label: 阶段
- key: text
  label: 发生了什么
status: published
license: CC-BY-4.0
overview:
- key: 一句话总结
  value: 后端测试是按失败类型分层设防的网：单元测试拦逻辑算错（快而多），集成测试拦配合问题——SQL 写错、事务没生效、字段对不上（用真数据库真缓存跑），契约测试拦接口改动把下游弄坏。三层各拦一类，形状是金字塔：越往上越少，因为越往上越慢越脆。
- key: 单元测试
  value: 只测一个函数：给输入、断输出，不连数据库不发网络，毫秒级一个。它能铺满的前提就是快——一千个单元测试几秒跑完，开发者每次改动都愿意跑。退款金额怎么算这类纯逻辑，是它的主场。
- key: 集成测试
  value: 把服务和真组件接起来测：真数据库里真建表、真跑 SQL、真开事务。它拦的是单元测试永远看不见的那类 bug——SQL 语法对但语义错、事务边界划错、序列化字段对不上。代价是慢，所以要挑关键路径写。
- key: 契约测试
  value: 服务之间的约定写成可执行的契约：调用方依赖哪些字段、什么类型，列成清单，提供方每次改动先过一遍。它拦的是「我改了我的接口」这类跨团队事故，不需要把两个服务真的拉起来联调。
- key: 测试数据库
  value: 集成测试的数据库要真，但数据要独立：每个测试自己造数据、自己清理，互不依赖顺序。共享一套固定测试数据，是集成测试时好时坏的头号来源——污染会顺着测试之间传染。
- key: 与前端测试的差别
  value: 前端的状态大多在内存里、测的是渲染与交互；后端的状态沉在数据库里、测的是契约与数据。前端刷新页面就能重来，后端写坏的数据会留下来——所以后端的测试金字塔更厚在中间层（集成），且对测试数据独立性的要求更高。
- key: 谁在用
  value: 分层是行业共识的形状：Google 的测试实践常被引用为七成单元、二成集成、一成端到端的配比；契约测试在微服务多的组织里流行，Pact 是最常见的工具。流水线里三层按速度分段跑：快的先跑，慢的后跑。
summary: 场景是给订单服务改退款规则：优惠券抵扣的订单，退款金额要按比例分摊。改之前，相关代码旁边躺着几百个测试；改完跑一遍，红了三个——你因此知道这次改动碰疼了哪里。这一课就讲这张网是怎么织的：单元、集成、契约三层各自拦什么 bug，为什么数量要呈金字塔形，测试数据库该怎么安排，以及覆盖率这个人人都在看的数字到底该怎么读。后端没有界面，改 A 处坏 B 处时没有用户帮你肉眼发现，测试网就是唯一的提前量。
premise: 这节课要回答的问题是：后端改一行代码，怎么知道没把别处弄坏？前端改坏了还能打开页面看一眼，后端的坏常常藏在数据里、藏在别人调用的接口里。测试就是回答这个问题的机制——而关键不在写不写，在分层：哪类 bug 归哪层拦，配比错了，网就又慢又漏。
position: 本课位于后端工程学科第十段「质量与形态：测试与微服务」的前半。它和流水线课的关系是分工：流水线提供跑测试的轨道与时机，这一课讲轨道上跑的测试该怎么分层、怎么配比。它也是后面微服务课的前置：服务一拆，契约测试从可选变成必需——拆分之前先把这张网织好。
level: 进阶
minutes: 26
objectives:
- 能按失败类型给一个 bug 指派该拦它的测试层：逻辑、配合、契约
- 能走一遍金字塔的时间账，说清为什么端到端测试必须少
- 能安排集成测试的数据库：真组件、独立数据、自造自清
- 能正确读覆盖率：它是查漏的地图，不是达标的目标
aiLink: 记住分层的口诀：逻辑归单元、配合归集成、约定归契约。再记住形状的成因：速度定数量——越快的层写得越多，越慢的层只配精挑细选。
bridge:
  prev: 上一课把服务安顿到了一台服务器上，它开始真实地活着。可活着的服务要不停地改版，每改一次都提心吊胆：退款规则动一下，会不会把下单弄坏？这一课讲怎么把这份提心吊胆变成一张可重复执行的网。
  next: 测试网织好，服务的形态还剩最后一个大问题：一个系统长到几十个人一起开发时，该继续做单体，还是拆成微服务？下一课是判断课：拆分的收益与税款逐项算，结论落在什么时候不该拆。
design:
- mechanism: 按失败类型分层设防
  problem: 用一种测试包打天下行不通：全用单元测试，配合类 bug 全漏；全用端到端，慢到没人愿意跑、脆到天天误报，最后被整个团队无视。
  choice: 按 bug 的类型分工：纯逻辑错误归单元测试，组件配合错误归集成测试，接口约定错误归契约测试，端到端只留几条最关键的用户路径。
  tradeoff: 三层各有工具与写法，团队要维护三套测试习惯；且分层边界要靠经验拿捏，放错层的测试会既慢又拦不住目标 bug。
  root: bug 的产生位置决定它能被哪层看见：逻辑在函数里诞生，就在函数层拦；配合在接缝处诞生，就在接缝处拦——测试的层要对准 bug 的出生地。
- mechanism: 集成测试用真组件，不用假数据库
  problem: 用内存假数据库或全量 mock 跑集成测试，SQL 方言差异、事务真实行为、字段类型转换这些最容易出错的环节，恰好全被假掉了——测了个寂寞。
  choice: 集成测试连真数据库（用容器临时起一个，与生产同版本），真建表、真跑迁移、真开事务；只对系统外的第三方（支付、短信）用桩。
  tradeoff: 环境准备与数据清理要花工程量，速度也明显慢于单元测试，所以数量必须克制，只覆盖关键路径与高风险接缝。
  root: 集成测试的价值全在「真」字上：它要验的正是各组件按真实规则咬合的样子，假组件验的是你对规则的想象。
- mechanism: 测试之间数据独立、自造自清
  problem: 一套共享的固定测试数据被几百个测试轮流用：某个测试改了订单状态，后面的测试就时好时坏，失败原因与执行顺序绑定，排查成本爆炸。
  choice: 每个测试自己构造需要的数据（用工厂方法快速造），跑完自己清掉或随事务回滚；测试之间零共享、零顺序依赖，可以任意并行与乱序。
  tradeoff: 造数据的代码要花心思维护，工厂方法要跟着模型一起演进；换来的是测试结果的确定性——红了就是真红。
  root: 测试的第一美德是确定性：同一个测试跑一百遍结果必须一致。共享状态是确定性的头号敌人，所以独立性不是洁癖，是地基。
quiz:
- q: 一条 SQL 语法没错、但 JOIN 条件写反了，把张三的订单查给了李四。这类 bug 该由哪层测试拦？
  options:
  - 单元测试，因为它最快
  - 集成测试：只有连真数据库跑真 SQL，才能暴露语义写错这类配合问题
  - 契约测试，因为涉及两个用户
  - 哪层都拦不住，只能靠上线后看日志
  answer: 1
  explain: 单元测试不连数据库，永远看不见 SQL 的实际行为；这类 bug 诞生在代码与数据库的接缝处，就要在接缝处拦——集成测试用真库真数据造两个用户的订单，一查便知。
- q: 金字塔的时间账：一千个单元（每个 5 毫秒）、一百个集成（每个 200 毫秒）、十个端到端（每个 5 秒），总时长大约是？
  options:
  - 单元 5 秒、集成 20 秒、端到端 50 秒——越往上越慢，所以越往上越要少
  - 三层一样快，数量可以随意
  - 端到端最快，应该多写
  - 集成测试比单元还快
  answer: 0
  explain: 形状的成因就是速度：单元层快到可以写一千个还只要 5 秒；端到端慢且脆，十个就要 50 秒。把数量配比反过来，流水线会被顶层拖到没人愿意等。
- q: 集成测试时好时坏，跑的顺序一变结果就变，最可能的原因是？
  options:
  - 数据库版本太旧
  - 测试之间共享同一套数据，前面的测试改了状态，后面的就跟着遭殃
  - 测试写得太多
  - 单元测试没写够
  answer: 1
  explain: 顺序敏感是共享状态的签名。解法是每个测试自造数据、自清或回滚，测试之间零共享——确定性是测试的地基，红了必须能断定是真红。
- q: 覆盖率 95% 但退款路径一条测试都没有，这组数字说明什么？
  options:
  - 说明系统质量很好
  - 覆盖率是地图不是目标：它只能告诉你哪里没测，不能证明测过的地方测对了；核心路径缺席时，高覆盖率反而更危险
  - 说明应该把覆盖率刷到 100%
  - 说明单元测试写太多了
  answer: 1
  explain: 覆盖率度量的是「代码被执行过」，不是「行为被验证过」。正确的读法是拿它查漏：先保下单、支付、退款这些核心路径，再谈百分比；为数字而写的测试只会制造虚假的安全感。
steps:
- id: regression-fear
  title: 第一步：本质——后端测试拦的是回归，怕的是改 A 坏 B
  tldr: 先把测试的敌人定准：不是新功能写不出来，是改老功能时把别处弄坏了还不知道。后端没有界面可看，坏又常藏在数据与接口里——测试网就是为「改动之前先知道会碰疼哪里」织的。
  body: |-
    跟着开场的退款改动走一遍。退款规则从「原路全退」改成「优惠券部分按比例分摊」，动手的地方只有退款计算那一处。可下单时保存的订单结构、支付那边的对账、客服后台的展示，都和退款金额有关系——你怎么知道这次改动没有碰疼它们？靠人脑把调用关系全捋一遍，系统小的时候行，大了就是赌博。

    测试的答案是把「知道」变成可重复执行的检查：每一处重要的行为，都留下一个能自动重跑的验证。这次改动跑一遍全套，绿的证明没碰疼，红的三个明确告诉你疼在哪——而且这张网的价值随时间涨：系统越老、改动越频繁，它拦下的回归越多。

    后端为什么比前端更依赖这张网？前端的状态多在内存与界面上，改坏了刷新一下、看一眼常常就发现；后端的状态沉在数据库里，一次写坏可能影响之后所有读到这批数据的请求，且调用方（别的服务、手机应用）不在你眼前。看不见，就只能靠网。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: dev
      id: dev
      label: 开发者：只改了退款计算一处
    - lane: ci
      id: net
      label: 测试网：红了三个，指明碰疼了哪里
      highlight: true
    messages:
    - id: m1
      from: dev
      to: net
      label: 改动先过网，再谈上线
      active: true
    registers:
    - name: 敌人
      value: 不是写不出，是改 A 坏 B 而不自知
    - name: 后端的特殊性
      value: 状态在数据库里，坏了看不见，只能靠网
  log:
  - at: 本质
    text: 测试是把「知道碰没碰疼」变成可重跑的检查
- id: unit-tests
  title: 第二步：单元测试——纯逻辑的主场，快是它的命
  tldr: 单元测试只测一个函数：给输入、断输出，不连任何外部组件。退款金额计算是它的标准像：优惠券怎么分摊、部分退款怎么算，用几十个用例把规则钉死，毫秒级跑完。
  body: |-
    把退款计算走一遍。总价 300 元的订单用了 30 元优惠券，用户申请退其中一件 100 元的商品：该退多少？规则是优惠券按比例分摊到每件商品，这件商品实际支付 90 元，就退 90 元。这类规则全是边界：退两件怎么算、优惠券比商品贵怎么算、运费退不退——把每个边界写成一个用例，输入输出都钉死，规则改没改对，一跑便知。

    它为什么能成为数量担当？因为它不碰任何外部世界：没有数据库、没有网络、没有文件，纯计算。一个用例 5 毫秒，一千个也只要 5 秒——这个速度决定了开发者愿意在每次改动后都跑一遍，流水线也愿意把它放在第一关。反过来，一旦某个「单元测试」开始连数据库、调接口，它就不再是单元测试了：慢下来只是表象，更糟的是它开始拦不住自己那层该拦的逻辑错误，还抢了集成测试的活。

    纪律就一条：单元测试只测能纯计算的部分。需要数据的逻辑，把数据作为参数喂进去，把规则抽成纯函数——这个抽法本身就在逼着代码把规则和存取分开，正是请求课里分层的一个回响。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: dev
      id: fn
      label: 退款计算函数：纯规则，无外部依赖
    - lane: ci
      id: fast
      label: 一千个用例：5 秒跑完，第一关
      highlight: true
    messages:
    - id: m1
      from: fn
      to: fast
      label: 边界全钉成用例：退一件、退两件、券比货贵
      active: true
    registers:
    - name: 标准像
      value: 300 元订单、30 元券、退 100 元的商品退 90 元
    - name: 纪律
      value: 碰了数据库或网络，它就不再是单元测试
  log:
  - at: 单元层
    text: 快让它能铺满，纯让它的红绿可信
- id: integration-tests
  title: 第三步：集成测试——接缝处的 bug，只有真组件能照出来
  tldr: 第二层测配合：把服务和真数据库、真缓存接起来跑。SQL 语义写错、事务没生效、字段名对不上，这类诞生在接缝处的 bug，单元层永远看不见，只有真组件咬合时才现形。
  body: |-
    举一个单元层必漏的例子。下单接口的代码逻辑全对，可 SQL 里把订单表的买家字段和卖家字段写反了：自己测自己的订单看着没问题，客服一查就发现买家卖家颠倒。单元测试里数据库是假的，永远不会有人真的执行这条 SQL；只有集成测试在真数据库里建好表、插入两个用户的数据、真跑一遍下单再查出来，颠倒当场现形。

    事务是第二个高发区。代码里明明标了事务注解，可因为调用方式不对（同类内部调用绕过了代理），事务根本没生效：扣库存成功、写订单失败，数据就半吊子了。这种 bug 在假数据库上测不出来——假的没有真事务。真组件的规矩因此很硬：数据库要用与生产同种类同版本的（如今多用容器临时起一个，跑完即弃），迁移脚本要真跑，缓存要真连。

    代价也要认：起环境、造数据、跑真 SQL，一个用例 200 毫秒是常态，比单元慢四十倍。所以集成层不求全覆盖，只挑关键路径与高风险接缝：下单、支付、退款这几条钱经过的路，和每处与数据库咬合最紧的地方。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: dev
      id: svc
      label: 服务：下单接口，逻辑看着全对
    - lane: testdb
      id: real
      label: 真数据库：买家卖家字段写反，当场现形
      highlight: true
    messages:
    - id: m1
      from: svc
      to: real
      label: 假数据库测不出的，真实咬合一测便知
      active: true
    registers:
    - name: 高发区
      value: SQL 语义、事务是否真生效、字段对位
    - name: 取舍
      value: 慢四十倍，只覆盖钱经过的路径
  log:
  - at: 集成层
    text: 价值全在真字上，验的是咬合不是想象
- id: test-database
  title: 第四步：测试数据库怎么办——环境要真，数据要独
  tldr: 集成测试的环境安排收成两句：数据库本身要是真的（容器起一个同版本实例），数据必须是各测试独立的（自造、自清、互不依赖）。前者保证测的是真咬合，后者保证红绿是确定的。
  body: |-
    先说环境。如今的标准做法是测试启动时用容器拉起一个与生产同版本的数据库，跑完迁移建好表，测试结束整个销毁。好处是环境一次配置处处一致，新同事拉下代码就能跑；坏处是启动要几秒，所以通常整个测试套件共用一个实例，而不是每个用例起一个。

    再说数据，这是翻车重灾区。反模式是全套测试共用一份固定数据：用户张三、订单一号，大家轮流用。某个测试把订单一号改成已退款，后面测「待发货订单」的用例就时好时坏，失败与否取决于跑的顺序——这类问题排查起来极其耗时，因为它看起来像随机故障。正解是每个测试用工厂方法现场造自己要的数据（造一个用户、两笔订单，三行代码的事），跑完靠事务回滚或统一清理抹掉。测试之间零共享，才能任意并行、任意乱序，红了就一定是真红。

    还有一条边界：第三方支付、短信这类系统外的依赖，集成测试里用桩（stub）替代——它们的真咬合不归你管，归契约与沙箱环境管，下一层就会讲到。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: testdb
      id: env
      label: 容器起的真数据库：与生产同版本
    - lane: dev
      id: data
      label: 每个测试：工厂造数据，跑完回滚清掉
      highlight: true
    messages:
    - id: m1
      from: env
      to: data
      label: 环境共用一个实例，数据坚决不共用
      active: true
    registers:
    - name: 反模式
      value: 共享固定数据，失败跟着顺序走
    - name: 正解
      value: 自造自清，红了就一定是真红
  log:
  - at: 测试数据
    text: 环境求真，数据求独，确定性是地基
- id: contract-tests
  title: 第五步：契约测试——接口的约定，要有可执行的版本
  tldr: 第三层管服务之间的约定：订单服务返回的字段，前端与物流服务都在依赖。契约测试把「依赖哪些字段、什么类型」写成可执行清单，提供方每次改接口先过一遍——不用把两边真的拉起来联调。
  body: |-
    先看它拦的事故。订单服务把响应里的 buyerName 改名成 buyer_name，或者把金额从分改成元——在订单服务自己的测试里，这叫重构，全绿。可物流服务还在按老字段取数据，上线当天物流那边的单子全部打不出面单。这类事故的特点是：每一边单独看都没错，错在约定变了没人通知。

    [[契约测试]]把约定从口头变成可执行文件。消费方（物流服务）写下：我依赖订单详情里的这几个字段、类型如此。提供方（订单服务）的流水线里跑一个验证：用这份契约去调自己的接口，字段缺了、类型变了，当场红灯。流行的工具如 Pact 把这份契约的收集与分发做成了基础设施；没有工具时，一份共享的 JSON 样例加一组校验测试，也能起同样的作用。

    它和集成测试的分工要分清：集成测的是「我和我的组件咬合对不对」，契约测的是「我和别人的约定变没变」。微服务课会讲到，服务拆得越多，约定就越多，这一层就从可选变成必需——拆分之前先备好它，是顺序问题。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: dev
      id: consumer
      label: 消费方：把依赖的字段写成契约
    - lane: ci
      id: verify
      label: 提供方流水线：每次改动先过契约
      highlight: true
    messages:
    - id: m1
      from: consumer
      to: verify
      label: 字段改名或改义，红灯当场亮起
      active: true
    registers:
    - name: 拦的事故
      value: 每边都没错，约定变了没人通知
    - name: 与集成的分工
      value: 集成管自家咬合，契约管与人约定
  log:
  - at: 契约层
    text: 约定写成可执行文件，改接口先过它
- id: pyramid-math
  title: 第六步：金字塔的账——速度决定数量的形状
  tldr: 三层的配比不是审美，是算术：一千个单元 5 秒、一百个集成 20 秒、十个端到端 50 秒。越往上越慢越脆，所以数量必须越往上越少——反过来堆成沙漏的团队，会被自己的测试拖死。
  body: |-
    把时间账摊开算。单元测试每个 5 毫秒，写一千个，总共 5 秒，开发者每次提交都跑得起。集成测试每个 200 毫秒（要连真库、造数据），一百个就是 20 秒，放在流水线的第二段还能接受。端到端测试要把整个系统拉起来、走完一遍真实用户路径，每个 5 秒起步，还经常因为环境抖动误报——十个就是 50 秒外加三天两头的假红灯。

    形状就此定了：[[测试金字塔]]底层多而快，顶层少而精。若反过来，把验证都压在端到端：几百个端到端测试跑一遍要几十分钟，还动不动红几个假的，团队很快学会无视红灯——测试网一旦被无视，就等于没有。这是沙漏形测试套件的标准死法，死因不是测试写得不好，是配比让运行成本超过了团队的耐心。

    落到流水线上的顺序也就明确了：单元先跑（最快、最先发现问题），集成次之，端到端与契约验证放在后面或并行。发布课里流水线的阶段划分，依据的就是这笔时间账。
  derivation: original
  sources:
  - ref: fowler-test-pyramid
    locator: "Martin Fowler: Test Pyramid（金字塔形的测试配比与成本论证）"
    claim: 测试金字塔主张底层单元测试占多数、越往上数量越少，依据是高层测试更慢、更脆、定位成本更高；配比反转会导致套件运行成本失控。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: ci
      id: pyr
      label: 金字塔：单元千个、集成百个、端到端十个
    - lane: prod
      id: time
      label: 总账：5 秒、20 秒、50 秒，逐层变贵
      highlight: true
    messages:
    - id: m1
      from: pyr
      to: time
      label: 数量形状由每层的单价决定
      active: true
    registers:
    - name: 沙漏死法
      value: 端到端太多，跑不起又天天误报，被团队无视
    - name: 流水线顺序
      value: 快的先跑，慢的后跑，契约并行验
  log:
  - at: 配比
    text: 速度定数量，是算术不是审美
- id: mock-boundary
  title: 第七步：桩与 mock 的边界——假的只能用在系统之外
  tldr: 测试里免不了用假货顶替依赖，但边界要划清：自家的数据库、缓存必须用真的，假了就把要验的咬合一起假掉了；系统之外的第三方（支付、短信）才用桩，因为它们的真咬合不归你验。
  body: |-
    先分清两个词。桩（stub）是给依赖准备的固定答复：问支付接口「这笔付了吗」，桩永远答「付了」。mock 在此之上还记录调用：验你有没有按约定调它、参数对不对。两者都是假货，区别在验的侧面不同。

    边界划在哪，看这个依赖的咬合归谁验。数据库是自家系统的一部分：SQL 写得对不对、事务生不生效，全指着集成测试用真库来验——把它换成内存假库，测的全是你对数据库行为的想象，上线后想象与现实的差就是事故。支付接口则相反：它的内部不归你管，你只能验「我调它的参数对不对、它各种答复我处理得对不对」，桩正好胜任，再辅以厂商的沙箱环境做低频的真联调。

    滥用假货的签名很好认：测试全绿，上线全红。若一个团队的集成测试里 mock 掉了数据库与缓存，那他们拥有的其实只是一套很贵的单元测试。审查测试质量时，先数假货都顶替了谁，成色就知道了大半。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: testdb
      id: real
      label: 必须真的：数据库、缓存（自家咬合）
    - lane: dev
      id: stub
      label: 可以假的：支付、短信（系统之外）
      highlight: true
    messages:
    - id: m1
      from: real
      to: stub
      label: 分界线：咬合归谁验，假货就停在哪之外
      active: true
    registers:
    - name: 滥用签名
      value: 测试全绿、上线全红
    - name: 沙箱的位置
      value: 第三方真联调低频做，不进日常套件
  log:
  - at: 假货边界
    text: 假的只能顶替系统之外的依赖
- id: coverage-reading
  title: 第八步：覆盖率的正确读法——它是地图，不是目标
  tldr: 覆盖率只说明代码被执行过，不说明行为被验证过。它的正确用法是查漏：先确认下单、支付、退款这些核心路径都在网里，再拿它找没人管的角落；拿它当 KPI 刷，只会刷出虚假的安全感。
  body: |-
    先拆这个数字的含义。行覆盖率 90%，意思是测试跑下来有九成代码行被执行过。它没说的事有三件：执行时的断言对不对（甚至有没有断言）、边界情况试没试、剩下那一成里有没有退款这种要命的路径。一个只调接口不断言结果的测试，也能把覆盖率刷得很好看。

    正确的读法分两步。第一步先按风险排：钱的路径（下单、支付、退款）、权的路径（登录、权限校验）、数据的路径（迁移、批量任务），这些必须有测试且断言要验到结果，光覆盖率数字不算数。第二步才是拿覆盖率扫雷：它标出的未覆盖区域里，若藏着某个没人注意的分支（比如某个异常处理从没被触发过），那就是下一个事故的候选，补测试或删死代码，二选一。

    为什么不能定成 KPI？因为一旦数字成了目标，团队就会写最容易提升数字的测试——专挑简单的 getter 与工具函数测，把难测的核心逻辑绕过去。数字达标之日，就是它失去参考价值之时。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: ci
      id: cov
      label: 覆盖率报告：九成代码被执行过
    - lane: dev
      id: read
      label: 正确读法：先按风险查核心路径，再扫未覆盖区
      highlight: true
    messages:
    - id: m1
      from: cov
      to: read
      label: 数字回答「哪里没测」，不回答「测得对不对」
      active: true
    registers:
    - name: 先保的路径
      value: 钱、权、数据三类路径，断言要验到结果
    - name: 当 KPI 的下场
      value: 专挑简单代码刷数字，核心逻辑被绕过
  log:
  - at: 覆盖率
    text: 它是查漏的地图，变成目标就失效
- id: manual-testing
  title: 第九步：边界——手测的位置与探索性测试
  tldr: 最后给手测留一个正确的位置：上线前点一遍，只能证明今天这台机器上这条路径能走通，证明不了明天改完还行——不可重复是它的原罪。但探索性测试（带着怀疑去乱点）仍是发现未知问题的手段，不可替代。
  body: |-
    先算手测的账。一个尽责的测试同学把核心路径点一遍要半天，这半天买到的结论只对当前版本有效；下周改了三处代码，结论全部过期，要么再点半天，要么凭感觉跳过。自动测试的边际成本几乎为零：写时贵，跑时免费，且每次改动都能全量重跑。凡是「每次发布都要重复验一遍」的事，迟早都要自动化，没有例外。

    但自动化有一类东西给不了：未知的问题。用例只能验你事先想到要验的；探索性测试是让有经验的人带着怀疑去乱点——输个超长字符串、在支付中途断网、把两个页面对着同一笔订单操作——它找的是用例清单之外的问题。新功能上线前留一段时间做探索，是很多团队的固定动作。

    两者的分工收成一句：已知的、要重复验的，归自动测试；未知的、靠直觉嗅的，归探索。把探索的发现沉淀成新的自动用例，这张网就越用越密——这也是测试资产复利的来源。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: dev
      id: auto
      label: 自动测试：已知的、重复验的
    - lane: prod
      id: explore
      label: 探索性测试：未知的、靠直觉嗅的
      highlight: true
    messages:
    - id: m1
      from: auto
      to: explore
      label: 探索的发现沉淀成新用例，网越用越密
      active: true
    registers:
    - name: 手测的原罪
      value: 结论只对当前版本有效，不可重复
    - name: 探索的价值
      value: 专找用例清单之外的问题
  log:
  - at: 边界
    text: 已知归自动，未知归探索，发现要沉淀
- id: closing-testing
  title: 第十步：收束——一张按失败类型织的网
  tldr: 全课收成一句话：测试是按失败类型分层设防的网——逻辑归单元、配合归集成、约定归契约，数量按速度呈金字塔，数据按独立性自造自清，覆盖率只当查漏的地图。
  body: |-
    把这一课的账并一并。单元测试用速度换数量，把纯逻辑的边界钉死；集成测试用真组件验咬合，专拦 SQL 与事务这类接缝事故；契约测试守住服务之间的约定，让改接口的人当场知道下游会疼。金字塔的形状由每层的单价决定，流水线按快慢分段跑它们。测试数据独立、假货只顶替系统之外，这两条纪律守住的是红绿的确定性。

    审查一个后端的测试成色，就问四个问题：退款这种核心路径在哪一层有断言验到结果的测试？集成测试连的是真库还是假库？测试之间共享不共享数据？契约有没有可执行的版本？四个问题答完，这张网的疏密就清楚了。

    下一课是写服务一侧的最后一课，也是判断课：当系统长到几十个人一起开发，单体与微服务之间怎么选——先把拆分的税算清，再谈拆不拆。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: ci
      id: net
      label: 三层网：单元、集成、契约各就其位
    - lane: dev
      id: four
      label: 审查四问：核心断言、真库假库、数据独立、契约可执行
      highlight: true
    messages:
    - id: m1
      from: net
      to: four
      label: 四问答完，网的疏密就清楚了
      active: true
    registers:
    - name: 口诀
      value: 逻辑归单元、配合归集成、约定归契约
  log:
  - at: 收束
    text: 测试网的成色，决定改版时的胆量
