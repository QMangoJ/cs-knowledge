id: backend/request-lifecycle
subject: backend
slug: request-lifecycle
title: 一个请求的一生：API 服务的写法
order: 7
visual: swimlane
lanes:
- id: client
  label: 客户端
- id: gate
  label: 网关与中间件
- id: app
  label: 应用服务
- id: data
  label: 数据库与下游
logColumns:
- key: at
  label: 阶段
- key: text
  label: 发生了什么
status: published
license: CC-BY-4.0
overview:
- key: 一句话总结
  value: 一个请求的一生是过关的一生：门口三关（限流、认证、校验）决定它进不进得来，屋里三件事（分层处理、幂等防重、统一错误）决定它办得成办不成。每一关只拦一类问题，关与关之间不越界——这是 API 服务能长期维护的骨架。
- key: 门口三关
  value: 限流在最前面数数，洪峰时先牺牲一部分请求保住服务；认证紧随其后确认你是谁；参数校验在业务之前把不合规的输入挡下。三关都不过的请求，不配占用业务代码的时间。
- key: 中间件
  value: 日志、计时、认证、注入追踪编号这类每个接口都要做的横切活计，收成一层层中间件：请求依次穿进去，响应反着穿出来。业务函数只剩下业务本身。
- key: 幂等键
  value: 写接口的防重武器：客户端为一次操作生成唯一编号，服务器凭编号去重。同一个编号来第二次，直接返回第一次的结果——网络重试和用户连点，都造不出第二笔订单。
- key: 统一错误格式
  value: 错误响应要同时服务两个读者：给用户看的话要友好且不泄露内部细节，给机器读的错误码要稳定可判断。HTTP 状态码管大类，业务错误码管细分，日志里再留完整的内部细节。
- key: 谁在用
  value: 这套骨架是所有 Web 框架的共识形状：Express 与 Hono 的中间件链、Spring 的拦截器与过滤器、网关层的限流插件，换的是名字，不换的是关口的位置与分工。
summary: 你在手机上点下「提交订单」，这个请求要走完一条不短的路才算办成事：过网关、被限流数一遍、验明身份、穿过一层层中间件、被校验参数、执行业务、写进数据库，最后还要防着自己被重复提交一遍。本课就追这一个请求走完全程，一关一关看：每关拦什么、不拦什么、放错位置会出什么事。走完之后，一个 API 服务内部该长什么样，你就有了一张完整的地图。
premise: 这节课的问题是：一个请求从用户点下按钮到返回结果，中间到底经过了哪些环节？很多后端事故的根源不在业务逻辑写错，而在关口缺位或错位——没限流被刷垮、没幂等被重复下单、错误格式各接口各写一套。把这条链路拆清楚，就是给服务立骨架。
position: 本课位于后端工程学科的第七段「请求的一生：API 服务的写法」，是写服务一侧的中枢：认证课给的凭证在这一课的中间件里被验，缓存课的读写在这一课的业务层里被调用，安全课的防线有一半就设在这一课的关口上。它不绑任何框架：Express、Hono、Spring 只是把同一套关口换了名字实现。
level: 基础
minutes: 28
objectives:
- 能按顺序画出一个请求的完整链路，并说清每关拦什么
- 能用令牌桶走一遍限流的数字，并说清限流为什么在最前面
- 能解释幂等键如何防住重复下单，以及它与分布式课幂等概念的关系
- 能给一个接口设计统一错误响应：状态码、业务码、用户文案、日志细节各归其位
aiLink: 记住这条链的分工口诀：门口三关管「进不进得来」，屋里三件事管「办得成办不成，办错了怎么收场」。审查任何 API 服务，沿着这条链逐关对照即可。
bridge:
  prev: 上一课讲缓存时，镜头一直对着读路径：一份数据怎么被抄、被删、被重建。可写请求走的是另一条更长的链——从用户点下按钮到落进数据库，中间的关口一个都还没拆过，这一课就来补这条链。
  next: 请求链的最后一关是落数据，而落数据的手艺还没讲透：联表怎么读、为什么列表页会慢成三秒、连接为什么要池化。下一课进 SQL 实务，把和数据库打交道的日常手艺补齐。
design:
- mechanism: 横切活计收进中间件，不进业务函数
  problem: 日志、计时、认证、追踪编号，每个接口都要做一遍。写进每个业务函数里，就是几十份重复代码，改一处要改几十处，漏一处就是一个没日志或没验权的接口。
  choice: 把这些与具体业务无关的活计抽成中间件，按固定顺序挂在业务函数外面：请求依次穿过，响应反向穿出，业务函数只处理业务本身。
  tradeoff: 链路变长，排障时要先搞清问题出在哪一层；中间件的顺序开始变得重要（认证必须在业务之前、计时必须在最外层），顺序写错会静默地错。
  root: 一个请求要做的事分两类：随接口而变的业务，和所有接口都一样的横切。把不变的那类收成管道，可变的那类才配占用业务代码。
- mechanism: 错误响应统一格式且内外有别
  problem: 每个接口各写各的错误格式，前端就要为每个接口写一套解析；更糟的是把数据库报错原文直接返回给用户，既难读又把表结构泄露给了攻击者。
  choice: 全站统一错误结构：HTTP 状态码表达大类，稳定的业务错误码供程序判断，一句给人看的文案，再加一个请求编号供日志追查；内部细节只进日志，不出接口。
  tradeoff: 要维护一份错误码表并约束所有接口遵守，老接口迁移有成本；换来的是前端一套解析走全站、出事时凭编号一捞一个准。
  root: 错误同时有两个读者：用户要的是「出了什么事、我该怎么办」，程序要的是「哪一类错、要不要重试」，运维要的是「细节在哪查」——一份响应必须把这三件事分开装。
- mechanism: 写接口默认带幂等键
  problem: 网络会抖、用户会连点、客户端会自动重试：同一个「提交订单」到达两次是常态而非异常。靠前端禁用按钮防不住，靠后端查「有没有相同订单」又分不清是重复提交还是真的第二单。
  choice: 由客户端为每次操作生成唯一幂等键并随请求发送，服务器记录键与结果：同键再来，直接返回首次结果，不重复执行。
  tradeoff: 服务器要为幂等键留一份带过期时间的存储，客户端要改造成「一次操作一个键、重试不换键」；换来的是重试从危险动作变成安全动作。
  root: 分布式系统里「消息至少到一次」是常态，防重的责任在接收方：幂等键把「执行一次」的语义从网络运气里夺回来，交给协议保证。
quiz:
- q: 限流为什么要放在整条链的最前面？
  options:
  - 因为限流的代码最简单
  - 被拒绝的请求越早被挡下越便宜：放在后面，它已经消耗了认证、查库等一串资源才被拒，洪峰时等于没限
  - 因为网关只能做限流这一件事
  - 放在哪里都一样，习惯而已
  answer: 1
  explain: 限流保的是服务的命，拒绝的成本决定它的位置：门口拒绝一个请求几乎零成本，穿完全链再拒绝，资源已经烧完了。洪峰之下，只有门口限流真能降压。
- q: 用户连点两下「提交订单」，幂等键是怎么防住第二单的？
  options:
  - 前端按钮变灰，点不动
  - 两次点击用的是同一个幂等键，服务器发现这个键已处理过，直接返回第一次的订单结果，不再执行下单
  - 服务器比较两笔订单内容相同就合并
  - 数据库的主键冲突拦住了第二单
  answer: 1
  explain: 关键在「一次操作一个键，重试不换键」：客户端为这次下单意图生成一个键，连点与重试都带着它。服务器凭键去重，而不是靠猜内容——内容相同也可能是用户真的要买两件。
- q: 中间件的执行顺序为什么重要？举例：计时中间件应该放在哪？
  options:
  - 顺序无所谓，框架会自己排
  - 放在最外层：请求最先进入它、响应最后离开它，量到的才是整条链的真实耗时
  - 放在业务函数之后，只量业务耗时
  - 放在认证之后，避免量到未登录请求
  answer: 1
  explain: 中间件是洋葱结构：进入顺序与返回顺序相反。计时要量全程，就得站在最外层把整条链包住；同理认证必须在业务之前，日志要在最外层才能记下被拒的请求。
- q: 接口返回错误时，哪种做法是对的？
  options:
  - 把数据库的报错原文直接返回，用户看不懂也没关系
  - 每个接口自己定格式，灵活优先
  - 统一结构：状态码表大类、业务码供程序判断、文案给人看、请求编号供查日志，内部细节只进日志
  - 一律返回 200，把错误藏在响应体里
  answer: 2
  explain: 错误响应有三个读者：用户、前端程序、运维。统一格式让前端一套解析走全站，编号让日志可追，细节不出接口则不给攻击者送情报。
steps:
- id: full-map
  title: 第一步：先给全景——一个请求要过的关口清单
  tldr: 结论先行：一个请求的完整链路是固定的——网关、限流、认证、中间件、参数校验、业务处理、数据访问、统一返回。这一课后面八步，就是把这张地图逐关走实。
  body: |-
    跟着开场的那笔订单看全景。请求从手机出发，先到[[网关]]：这是全站的统一入口，负责把请求按路径分给后面的服务，顺带终结加密连接。接着是[[限流]]，在门口数一数这个用户、这个接口的请求频率，过线就请回。然后是认证，验上一课讲的那张凭证，确认你是谁。再往里是[[中间件]]的洋葱：日志、计时、追踪编号一层层穿过。到了业务函数门口，参数校验先把不合规的输入挡下；校验过了，业务逻辑才开始执行，它会去读[[缓存]]、写数据库（前两课的领地）；最后结果按统一格式返回，出错也按统一格式返回。

    这张地图的价值在于分工：每一关只拦一类问题。限流不关心你是谁，认证不关心参数合不合法，业务函数不关心日志怎么打。任何一关缺位，对应的那类事故就迟早发生；任何一关越界去管别人的事，代码就会纠缠成一团。

    后面八步按这条链的顺序逐关拆：先门口三关，再屋里三件事（分层、幂等、错误处理），中间穿插两个常被问到的专题——分页与文件上传。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: tap
      label: 用户点下「提交订单」
    - lane: gate
      id: gates
      label: 门口：网关、限流、认证、中间件、校验
    - lane: app
      id: biz
      label: 屋里：业务处理、数据访问、统一返回
      highlight: true
    messages:
    - id: m1
      from: tap
      to: gates
      label: 请求先过五道关，才轮到业务
    - id: m2
      from: gates
      to: biz
      label: 每关只拦一类问题，不越界
      active: true
    registers:
    - name: 门口三关
      value: 限流、认证、校验：决定进不进得来
    - name: 屋里三件事
      value: 分层、幂等、统一错误：决定办得成办不成
  log:
  - at: 全景
    text: 链路是固定的，逐关拆就是后面八步
- id: gateway-entry
  title: 第二步：网关——统一入口在门口做的三件事
  tldr: 网关不处理任何业务，它只做三件门口的事：按路径把请求分给对的服务、终结加密连接、挡下明显不合规的请求（如体积过大的包）。业务服务因此可以躲在内网，只管办事。
  body: |-
    先说它为什么存在。一个系统有十个服务，难道让客户端记十个地址、每个服务各自处理 HTTPS 证书？网关把入口收成一个：客户端只认网关的地址，网关按请求路径把订单请求递给订单服务、把商品请求递给商品服务。服务增减、地址变迁，都在网关这一层消化，客户端无感。

    第二件事是 TLS 终止：加密连接在网关这里解密，往后走内网用明文或内部加密，证书也只需在网关上维护一份。网络学科里讲过的 TLS 握手，落点就在这里。第三件事是粗筛：请求体大得离谱、路径根本不存在这类请求，在门口就回掉，不让它们占用后端一丝资源。

    单体应用没有独立网关时，这三件事通常由 [[Nginx]] 这类[[反向代理]]代劳（部署课会讲它在单机上的样子）；服务多了，才会换成专门的网关组件。形状不变，只是规模不同。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端：只认一个入口地址
    - lane: gate
      id: gw
      label: 网关：分发、解 TLS、粗筛
    - lane: app
      id: svc
      label: 后面的服务：躲在内网只管办事
      highlight: true
    messages:
    - id: m1
      from: c
      to: gw
      label: 所有请求先到这里报到
    - id: m2
      from: gw
      to: svc
      label: 按路径递给对的服务
      active: true
    registers:
    - name: 证书
      value: 只在网关维护一份，服务不用各自操心
    - name: 粗筛
      value: 路径不存在、包体离谱的请求门口就回
  log:
  - at: 网关
    text: 入口收成一个，业务服务躲进内网
- id: rate-limit
  title: 第三步：限流——在门口数数，先保命再谈公平
  tldr: 限流的位置比算法更重要：它必须站在链路最前面，因为被拒绝的请求越早回头越便宜。算法用令牌桶：一只匀速进水的桶，平时攒得下突发，长期看又卡住平均速率。
  body: |-
    先走令牌桶的数字。给某个接口设一条规则：每秒补充 100 个令牌，桶最多攒 200 个。请求来一个，拿走一个令牌；没令牌了，请求被拒（返回 429）。平稳流量下，每秒 100 个请求匀速通过；突然来一波 200 个的突发，桶里攒的存货能让它整波通过；但要是持续每秒来 300 个，桶很快见底，之后就只有 100 个能进、其余全拒——平均速率被死死卡在每秒 100。

    为什么限流站在最前面？算成本账：一个请求在门口被拒，几乎不消耗任何资源；要是让它穿完认证、查完缓存、摸到数据库才被拒，它已经把整条链的资源烧了一遍。洪峰来时，服务是被「处理不完的请求」压垮的，不是被拒绝压垮的——门口限流是唯一真能降压的位置。

    限流的原理与取舍，分布式学科的治理课讲过它在服务之间的样子；这一课把它落在 API 入口：按用户、按接口分别设桶，阈值留出余量，且被拒时要明确告诉客户端稍后再试。它的定位要记牢：限流是保护机制，不是惩罚用户——宁可拒绝 1% 的请求，也不能让 100% 的用户陪着超时。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: gate
      id: bucket
      label: 令牌桶：每秒进 100 个，最多攒 200 个
    - lane: client
      id: flood
      label: 突发流量：先是一波 200，又持续每秒 300
      highlight: true
    messages:
    - id: m1
      from: flood
      to: bucket
      label: 突发靠存货通过，持续超速被卡回每秒 100
      active: true
    registers:
    - name: 突发
      value: 桶里攒的 200 个令牌让整波突发通过
    - name: 持续超速
      value: 每秒只放 100 个，其余返回 429
  log:
  - at: 限流
    text: 位置决定效果：门口拒绝几乎零成本
- id: middleware-onion
  title: 第四步：中间件——横切活计像洋葱一样包住业务
  tldr: 日志、计时、认证、追踪编号，这些每个接口都要做的事，收成一层层中间件包在业务函数外面。请求依次穿进去、响应反着穿出来——这个洋葱结构决定了每层该站在哪。
  body: |-
    跟着请求穿一次洋葱。最外层是日志与计时：请求一进来就打一条记录、起一个表，响应离开时停表、记下耗时与状态码——它必须站在最外面，才能把后面所有环节（包括被拒的请求）都量进去。第二层注入追踪编号：给这个请求发一个全程唯一的编号，写进它碰到的每条日志——这正是观测课里[[链路追踪]]的 trace id 在单体内部的源头，出事时凭这个编号能把一次请求的全部日志一捞到手。第三层是认证：验凭证、把「你是谁」挂到请求上下文里。再往里才是业务函数，它从上下文里直接拿用户身份用，不再自己操心验票。

    顺序为什么不能乱，举两个反例就懂：认证若放在计时之前，未登录的请求连耗时都不配被量，排障时就成了盲区；日志若放在最里层，被限流挡下的请求一条记录都不留，洪峰之夜你连「到底来了多少量」都答不上来。

    业务函数被这样包住之后，剩下的就只有业务：参数进来，结果出去。横切活计想改——比如日志格式全站调整——只动中间件一处，几十个接口同时生效。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: gate
      id: onion
      label: 洋葱：日志计时、追踪编号、认证
    - lane: app
      id: biz
      label: 业务函数：只剩业务本身
      highlight: true
    messages:
    - id: m1
      from: onion
      to: biz
      label: 请求依次穿入，响应反向穿出
      active: true
    registers:
    - name: 最外层
      value: 日志与计时：被拒的请求也要被量到
    - name: 追踪编号
      value: 一次请求一个编号，日志凭它一捞到手
  log:
  - at: 中间件
    text: 横切收成管道，业务函数只管业务
- id: validation
  title: 第五步：参数校验——永远不信客户端送来的东西
  tldr: 业务函数开工之前，先把输入验一遍：类型对不对、范围合不合理、该有的字段全不全。原则只有一句：客户端送来的一切都不可信，前端校验是给用户看的，后端校验才是防线。
  body: |-
    为什么不能信？因为请求不一定来自你的前端页面。任何人都能拿工具直接构造请求发给你的接口：把数量改成 -3，把价格改成 0.01，把别人的用户编号填进地址栏——前端页面里的种种限制，在直接发请求的攻击者面前不存在。

    走一遍订单接口的校验清单。数量必须是正整数且不超过库存上限；商品编号必须真实存在；收货地址必须属于当前登录用户。特别注意价格：它永远以服务端查到的为准，客户端传来的价格字段直接无视——这一条挡掉的是改价下单这类最古老的攻击。校验不通过的，立刻按统一错误格式返回 400，连业务函数的门都不让进。

    校验和安全课的关系在这里点一句：这一课讲的是校验的写法与位置，安全课会从攻击者视角再看一遍——注入与[[越权]]正是绕过或缺失校验的后果。两课讲的是同一道防线的两侧。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: forged
      label: 构造的请求：数量 -3、价格 0.01
    - lane: app
      id: check
      label: 校验关：类型、范围、归属逐项过
      highlight: true
    messages:
    - id: m1
      from: forged
      to: check
      label: 不合规的输入，业务函数的门都不让进
      active: true
    registers:
    - name: 价格铁律
      value: 永远以服务端查到的为准，客户端传的无视
    - name: 校验失败
      value: 立刻返回 400，不占用业务与数据库
  log:
  - at: 校验
    text: 前端校验是体验，后端校验才是防线
- id: layering
  title: 第六步：业务分层——处理函数只做翻译，规则集中，数据收口
  tldr: 请求进了业务层之后再分工：最外层的处理函数只负责翻译（把请求参数翻成业务调用、把结果翻回响应），业务规则集中在一层里，访问数据库的代码再收成一层。改规则不用翻遍接口，换存法不用动业务。
  body: |-
    先看不分层的下场。处理函数里既解析参数、又写业务判断、还直接拼 SQL 查库——一个接口三百行。某天退款规则改了，你要在几十个接口里找哪些地方写过退款判断；某个查询要优化，你得先把散落各处的 SQL 捞全。规则散落，就是后端代码腐烂的头号死法。

    分层的分工是三段。处理函数（handler）只做翻译：校验过的参数进来，它调用业务层，再把业务结果按统一格式翻成响应，它不写任何业务判断。业务层（service）只管规则：能不能退、退多少、库存怎么扣，全站只有这一处说了算。数据访问层（repository）只管存取：SQL 写在这里，上层只说「给我这个订单」，不问它怎么查。

    这套分法不是教条，价值在变更时兑现：改退款规则只动业务层，审查时也只审那一层；给订单查询加[[缓存]]，只动数据访问层。前端工程师其实见过同样的形状——组件、状态管理、接口请求的分离，就是同一思想在前端的投影。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: handler
      label: 处理函数：只翻译，不判断
    - lane: app
      id: service
      label: 业务层：规则全站只有这一处
    - lane: data
      id: repo
      label: 数据访问层：SQL 收在这里
      highlight: true
    messages:
    - id: m1
      from: handler
      to: service
      label: 参数翻成业务调用
    - id: m2
      from: service
      to: repo
      label: 存取只说要什么，不问怎么查
      active: true
    registers:
    - name: 改规则
      value: 只动业务层，审查也只审那一层
    - name: 加缓存
      value: 只动数据访问层，业务无感
  log:
  - at: 分层
    text: 翻译、规则、存取三段分工，变更各归其位
- id: error-format
  title: 第七步：统一错误——一份响应，三个读者
  tldr: 错误响应要同时喂饱三个读者：用户要一句人话，程序要一个稳定的码，运维要一个能捞日志的编号。HTTP 状态码管大类、业务错误码管细分、内部细节只进日志——这是全站统一的格式。
  body: |-
    先定大类，HTTP 状态码就够用：400 是你送的参数不对，401 是你没登录，403 是登录了但没权限，404 是东西不存在，409 是状态冲突（比如重复下单），429 是太频繁，500 才是服务器自己的错。把这几个用对，前端不看响应体就知道该往哪处理——该跳登录跳登录、该提示重试提示重试。

    大类之下再用业务错误码细分，比如 ORDER_STOCK_NOT_ENOUGH（库存不足）与 ORDER_ALREADY_PAID（订单已支付）都是 409，但用户该看到的话完全不同。文案给人看，错误码给程序判断，两者分开维护：文案可以改，码不能动，它是接口契约的一部分。

    最后是那条铁律：数据库报错、堆栈、SQL 原文，永远只进日志，不出接口。一来用户看不懂，二来那是把自家表结构画给攻击者看。出接口的只有一个请求编号，用户报障时凭它能在日志里精确定位到这一次请求的全程记录——观测课的追踪编号在这里接上了。
  derivation: original
  sources:
  - ref: rfc-9457
    locator: "RFC 9457: Problem Details for HTTP APIs 的成员定义"
    claim: RFC 9457 为 HTTP API 定义了标准错误响应结构（type、title、status、detail、instance），使错误格式可跨服务统一并被程序稳定解析。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  code:
    lang: json
    code: |-
      {
        "code": "ORDER_STOCK_NOT_ENOUGH",
        "message": "这件商品刚刚卖完了",
        "requestId": "req_9f3ka21",
        "status": 409
      }
    note: 码给程序、文案给人、编号供查日志；堆栈与 SQL 只进日志不出接口
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: err
      label: 一次失败：库存不足
    - lane: client
      id: readers
      label: 三个读者：用户、前端程序、运维
      highlight: true
    messages:
    - id: m1
      from: err
      to: readers
      label: 文案给人、码给程序、编号供查日志
      active: true
    registers:
    - name: 状态码
      value: 400 参数、401 未登录、403 无权、409 冲突、429 过频
    - name: 铁律
      value: 内部细节只进日志，永远不出接口
  log:
  - at: 错误处理
    text: 统一格式，全站一套解析走到底
- id: idempotency-key
  title: 第八步：幂等键——让重试从危险动作变成安全动作
  tldr: 提交订单最怕的不是失败，是「不知道成没成」时的重试。幂等键的解法：客户端给这次下单生成一个唯一编号，重试时带着同一个编号来，服务器认编号不认次数，第二次直接返回第一次的结果。
  body: |-
    先走一遍没有幂等键的事故。用户点下提交，订单其实已经建好了，可响应在网络里丢了，用户的页面转着圈，最后报错。他再点一次——服务器收到一个全新的请求，又建一单。两笔订单、一笔重复扣款，客服工单就是这么来的。客户端框架的自动重试、网关的超时重发，都会在用户无感时制造同样的重复。

    [[幂等键]]把语义钉死。用户点下提交的那一刻，客户端为「这一次下单意图」生成一个随机编号（比如一个 UUID），放进请求头。服务器收到时先查这个编号处理过没有：没处理过，正常下单，并把「编号 → 订单结果」记下来（存进数据库或 [[Redis]]，留一天即可）；处理过，直接把上次的订单结果原样返回，业务一步都不再执行。连点、重试、重发，带着同一个编号来，全都被收成一单。

    它和[[幂等]]概念的关系在这里点明：分布式学科讲幂等时，说的是消息重复投递时消费方如何只生效一次；这里是同一思想在 API 入口的落地——把「执行一次」从网络的运气，变成协议的保证。支付平台 Stripe 把它做成了公开的标准做法，下单与支付类接口几乎都该带上它。
  derivation: original
  sources:
  - ref: stripe-idempotency
    locator: "Stripe API: Idempotent requests 的语义说明"
    claim: Stripe 的幂等机制要求客户端为请求提供唯一键（Idempotency-Key），服务器保存首次执行的结果，相同键的重复请求直接返回已保存结果而不重复执行。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: retry
      label: 客户端：响应丢了，带着同一个键重试
    - lane: app
      id: dedup
      label: 服务器：先查键，处理过就返回旧结果
    - lane: data
      id: store
      label: 键的账本：编号对应哪笔订单
      highlight: true
    messages:
    - id: m1
      from: retry
      to: dedup
      label: 同一个幂等键第二次到达
    - id: m2
      from: dedup
      to: store
      label: 查到已处理：原样返回，不再执行
      active: true
    registers:
    - name: 键的生命周期
      value: 一次操作一个键，重试不换键，存一天足够
    - name: 防住的
      value: 连点、自动重试、网关重发，全收成一单
  log:
  - at: 幂等
    text: 认编号不认次数，执行一次靠协议保证
- id: pagination-upload
  title: 第九步：两个专题——分页别把全表搬回家，上传别让文件过应用
  tldr: 列表接口一次返回全部数据，是一万条时就拖垮双方的写法；分页有偏移与游标两条路线，深翻页时游标完胜。文件上传则要让文件直达对象存储，应用服务器只发通行证、不搬货。
  body: |-
    先算分页的账。一个订单列表有十万条，接口一次全返回：数据库要查十万行、网络要传几十兆、前端要渲染到卡死。分页是必须的，区别在怎么翻。偏移分页最直白：第 3 页就是跳过前 40 条取 20 条——可翻到第 5000 页时，数据库要先数出前 99980 条再扔掉，越翻越慢（这笔账的 SQL 层细节，下一课还会细算）。[[游标分页]]换了个锚点：记住上一页最后一条的编号，下一页就查「编号比它大的 20 条」，配上索引是定点直达，第 5000 页和第 1 页一样快。代价是没法跳页直达，只能顺序翻——所以后台管理用偏移、信息流用游标，是常见的分工。

    再说文件上传。下单时传一张凭证图，若让文件先传到应用服务器再转存，一是占带宽与内存，二是应用重启就中断。正规做法是直传：客户端先向应用要一张签名好的通行证（预签名 URL），然后拿着它把文件直接传进对象存储（如 [[S3]]），传完再通知应用记下文件地址。应用只发证、不搬货，流量与风险都卸掉了。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: list
      label: 列表翻到第 5000 页
    - lane: data
      id: cursor
      label: 游标分页：锚住最后一条编号，定点直达
      highlight: true
    messages:
    - id: m1
      from: list
      to: cursor
      label: 偏移要先数出前 99980 条，游标不用
      active: true
    registers:
    - name: 分工
      value: 后台管理用偏移（要跳页），信息流用游标（只顺序翻）
    - name: 上传
      value: 预签名直达对象存储，应用只发证不搬货
  log:
  - at: 专题
    text: 分页锚点决定深翻成本，上传直达决定应用负担
- id: closing-chain
  title: 第十步：收束——沿着这条链审查任何 API 服务
  tldr: 全课收成一张审查表：门口三关（限流、认证、校验）逐关问在不在，屋里三件事（分层、幂等、统一错误）逐件问做没做。链上缺哪一环，对应的事故就只是时间问题。
  body: |-
    把这一课的账并一并。一个请求的一生是：网关收口、限流保命、认证验人、中间件包住横切、校验挡输入、分层办业务、统一格式返回。写接口额外多一件：幂等键防重。列表与上传各有固定解法：分页看锚点、上传走直传。

    这张链就是审查表。拿到任何一个 API 服务，从门口开始逐关问：限流在不在最前面？认证是不是每个接口都过？价格这类字段是不是以服务端为准？退款规则是不是只写了一处？下单接口带没带幂等键？错误响应能不能凭编号捞到日志？六个问题问完，这个服务的骨架成色就清楚了——面试里让你「设计一个接口」或「评审一段后端代码」，沿这条链讲，就是完整的答案。

    下一课走进链的最后一环内部：业务层把活派给数据库之后，SQL 写得好不好、连接怎么管、事务划在哪，直接决定这个服务慢不慢、稳不稳。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: chain
      label: 完整的链：门口三关加屋里三件事
    - lane: gate
      id: audit
      label: 审查法：逐关对照，缺环即隐患
      highlight: true
    messages:
    - id: m1
      from: chain
      to: audit
      label: 六个问题问完，骨架成色就清楚了
      active: true
    registers:
    - name: 审查六问
      value: 限流、认证、服务端价格、规则单点、幂等键、错误编号
  log:
  - at: 收束
    text: 请求的一生，就是 API 服务的骨架图
