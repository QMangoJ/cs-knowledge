id: backend/request-lifecycle
subject: backend
slug: request-lifecycle
title: 一个请求的一生：API 服务的写法
order: 7
visual: swimlane
lanes:
- id: client
  label: 客户端
- id: gate
  label: 网关与中间件
- id: app
  label: 应用服务
- id: data
  label: 数据库与下游
logColumns:
- key: at
  label: 阶段
- key: text
  label: 发生了什么
status: published
license: CC-BY-4.0
overview:
- key: 一句话总结
  value: 一个请求的一生就是闯关的一生：门口过筛（网关、限流、认证、参数校验）决定它进不进得来，屋里办事（三层解耦、幂等防重、统一错误）决定它办得稳不稳。每关只拦一类错、绝不越界，就是 API 服务长治久安的骨架。
- key: 门口三关
  value: 限流紧挨入口数令牌，洪峰时果断拒掉溢出流量保命；认证核验凭证认出你是谁；参数校验在进业务前拦住越界输入与篡改价格。不过关的请求连业务函数的门都摸不到。
- key: 中间件
  value: 日志计时、注入追踪编号、核验登录这些所有接口共用的横切活计，抽成洋葱圈一样的中间件套在外面：请求层层穿入，响应反向穿出，业务代码只留纯业务逻辑。
- key: 幂等键
  value: 写接口防重复提交的标配：客户端为每次操作意图生成唯一编号（重试不换号），服务端记下编号与首次结果；同号再来直接返回旧结果，连点与超时重发都造不出第二单。
- key: 统一错误格式
  value: HTTP 状态码分大类，稳定的业务错误码供前端分支判断，人话文案展示给用户，requestId 留给运维捞日志；堆栈与 SQL 报错只进日志，严禁出接口。
- key: 谁在用
  value: Express 与 Hono 的中间件链、Spring 的过滤器与拦截器、API 网关的限流插件，换的只是框架名字；Stripe 公开推广的 Idempotency-Key 则是支付与下单防重的行业范本。
summary: |-
  一个健壮的 API 服务，会把每次请求拆成「门口层层过筛 + 屋里分段办事」的固定流水线。请求进门先由网关统一路由与终结 TLS，限流紧随其后用令牌桶削平洪峰，中间件像洋葱一样包揽日志计时、追踪编号与身份核验，参数校验再把非法输入挡在业务门外。进入业务层后，按处理函数（翻译）、业务层（规则）、数据访问层（存取）三段解耦；针对网络抖动与连点重试，写接口靠幂等键保证「只生效一次」；不论成败都按内外有别的统一结构返回，并配齐游标分页与预签名直传两项高频手艺。
premise: 你在手机上挑好商品、点下「提交订单」，一秒钟后屏幕弹出「下单成功」。表面上看只是一次请求一进一出，可线上大半后端事故都出在这短短一秒里——促销洪峰把服务刷瘫、网络一抖连扣两笔钱、数据库报错原文直接糊在用户屏幕上。从指尖点下按钮到订单落库返回，这条请求到底要闯过哪几道关口，每一关各自拦什么、放错顺序又会惹出什么祸？
position: 本课位于后端工程第七板块「请求的一生：API 服务的写法」，是写服务一侧的中枢骨架课。认证课发出的凭证在本课中间件里核验，缓存课与下一课的 SQL 手艺在本课数据访问层里调用，安全课的一半防线也直接落在本课的参数校验与错误脱敏上。无论用 Express、Hono 还是 Spring，底下的关口次序与职责边界完全相通。
level: 基础
minutes: 28
objectives:
- 按正确顺序画出请求从网关到数据库的完整关口，说清每关职责与错位后果
- 拿具体数字跑一遍令牌桶限流，解释限流为什么必须摆在最前面
- 说清幂等键怎样化解超时重试导致的重复下单，分清「一次意图一个键」的用法
- 设计兼顾用户、前端代码与运维排障三方读者的统一错误响应结构
aiLink: 评审接口代码或让 AI 搭后端脚手架时，顺着「门口管进不进得来（限流、认证、校验），屋里管办得稳不稳（三层解耦、幂等键、统一错误）」逐关点名，漏哪关补哪关。
bridge:
  prev: 上一课一直在打磨读路径上的内存抄本；可一旦用户点下「提交订单」发起写请求，光读得快远远不够，还得闯过限流、验票、校验、防重一连串关口才能安全落库。
  next: 请求闯过层层关口交到数据访问层后，真正的硬仗才刚进数据库：三张表怎么联才不慢成三秒、一行循环怎么会炸出一百条 SQL、连接池配多大才不打穿上限？下一课专攻 SQL 实务。
design:
- mechanism: 横切活计抽进洋葱中间件，业务函数只留纯业务
  problem: 打日志、算耗时、验登录、塞追踪号是全站几十个接口都要干的事；要是复制粘贴进每个接口函数里，改一次日志格式得翻几十个文件，漏写一处就是裸奔接口。
  choice: 把与具体业务无关的公共动作抽成中间件，按固定顺序套在业务函数外层：请求依次穿进去，响应倒着穿出来。
  tradeoff: 调用栈变深，排障得先分清请求拦在了哪一层；且中间件顺序极度敏感（计时与日志必须包在最外圈），排反了就会静默漏记数据。
  root: 请求沿途干的活天然分两类——全站不变的管道活，与随接口变化的业务活；把不变的焊成公共管道，业务代码才不会腐烂。
- mechanism: 错误响应全站同构，且严格内外有别
  problem: 各接口自造错误字段会让前端写满特判分支；更危险的是图省事把数据库报错和堆栈原样吐给客户端，既吓跑用户，又把表结构白送给攻击者。
  choice: 全站统一返回「HTTP 状态码（大类）+ 业务错误码（机器分支）+ 人话提示（展示）+ requestId（查日志）」，内部堆栈与 SQL 报错只写服务端日志。
  tradeoff: 团队得共同维护一张业务错误码表，不能随手塞段报错字符串完事；换来的是前端一套拦截器通吃全站，线上报障凭一串编号秒级定位日志。
  root: 一次报错同时面对三双眼睛——用户要看懂怎么操作、前端代码要稳定跑分支、运维要精准捞现场，必须用不同字段各喂各的。
- mechanism: 写接口由客户端携带幂等键去重
  problem: 手机进电梯断网、用户手快连点、网关超时自动重发，都会让同一个「提交订单」到达服务端两次；光靠前端按钮置灰拦不住重发，靠后端比对商品相同又会误伤真想买两单的买家。
  choice: 客户端为每一次下单意图生成唯一幂等键（重试沿用原键），服务端记录「键 → 首次执行结果」；同键重来直接原样返回首次结果，不再跑下单逻辑。
  tradeoff: 服务端要额外维护带过期时间的幂等键表并处理并发占坑，客户端也得遵守「一次意图一建键、重试绝不换键」；换来的是网络重试彻底变成安全动作。
  root: 网络永远只保证「消息至少到达一次」而保不了「恰好到达一次」，只有把操作意图编号写进协议，接收方才能稳稳兜住「只生效一次」。
quiz:
- q: 为什么限流必须摆在整条请求链的最前面？
  options:
  - 因为限流算法代码最短、最好写
  - 被拒请求越早打回越省成本；如果穿完认证和查库才拒，资源早被洪峰烧光了，等于没限流
  - 因为 API 网关硬件只能跑限流逻辑
  - 摆前摆后效果一样，纯粹是历史习惯
  answer: 1
  explain: 限流的目标是在洪峰下保住服务不死：在入口拒掉一个请求几乎不花 CPU，等它验完签名、查完数据库再拒，服务器早就被拖垮了。
- q: 用户在弱网下连点两次「提交订单」，幂等键是怎么拦住第二笔重复订单的？
  options:
  - 靠浏览器自动把按钮锁死五秒钟
  - 两次点击携带同一个幂等键，服务端查出该键已落单，直接把第一单结果原样返回，不再走扣款建单逻辑
  - 服务端发现五秒内买了同一件商品就自动合并订单
  - 全靠数据库订单号自增主键报错拦住
  answer: 1
  explain: 核心规矩是「一次下单意图对应一个幂等键，重试绝不换键」：服务端认键不认内容，既能稳稳拦住连点与重发，又不会误拦用户退出去重新再买一单。
- q: 在洋葱模型的中间件链里，统计接口耗时的中间件应该放在哪一层？
  options:
  - 随便放哪层，框架会自动算总时间
  - 放在最外层：请求最先进它、响应最后出它，才能把后续认证与业务耗时统统算进去
  - 放在最里层，只算纯业务函数跑了多久
  - 放在认证中间件里层，免得统计未登录请求
  answer: 1
  explain: 洋葱结构先进后出：计时和访问日志只有包在最外圈，才能量到完整的端到端延迟，并把被认证或校验半路打回的异常请求也记录在案。
- q: 下单接口遇到库存不足或异常报错时，哪种返回方式才合规？
  options:
  - 把数据库抛出的异常原文直接塞进 message，方便前端截图报修
  - 每个业务模块自由发挥字段名，怎么顺手怎么定
  - 按全站统一结构返回 HTTP 状态码、稳定业务码、友好提示与 requestId，堆栈和 SQL 细节只留服务端日志
  - HTTP 状态码一律回 200，在正文字符串里写「失败：库存不足」
  answer: 2
  explain: 统一结构兼顾用户提示、前端自动判断与运维凭号捞日志三件事；把内部报错细节留在日志里，也能防止向攻击者泄露表名与代码路径。
steps:
- id: full-map
  title: 一张通关地图：门口拦脏流量，屋里管稳落库
  tldr: 从点下「提交订单」到返回响应，请求依次穿过网关、限流、中间件、参数校验、业务分层与数据层；每道关口只拦一类错，缺位必出事故，越界必成泥潭。
  body: |-
    跟着手机上那次「提交订单」看一眼全程：请求出发后先到[[网关]]，由它终结加密连接并按路径分发给订单服务；紧挨着是[[限流]]，在门口数清频率，超标直接劝退；再往里穿过[[中间件]]洋葱圈，依次挂上访问日志、全程计时、追踪编号并核验登录凭证；走到业务函数门口，参数校验先把越界输入拦下；进屋后才轮到业务逻辑去读[[缓存]]、写数据库，最后按全站统一格式打包返回。

    把整条链摊开，最核心的设计纪律只有四个字：**各守一段**。限流不管你是谁，认证不管商品数量合不合法，业务函数不管日志怎么打格式。漏掉哪一关，对应的线上事故迟早找上门；反过来哪一关手伸太长去管隔壁的事，代码很快就会缠成一团乱麻。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: tap
      label: 用户点下「提交订单」
    - lane: gate
      id: gates
      label: 门口：网关、限流、认证、中间件、校验
    - lane: app
      id: biz
      label: 屋里：业务处理、数据访问、统一返回
      highlight: true
    messages:
    - id: m1
      from: tap
      to: gates
      label: 请求先过五道关，才轮到业务
    - id: m2
      from: gates
      to: biz
      label: 每关只拦一类问题，不越界
      active: true
    registers:
    - name: 门口三关
      value: 限流、认证、校验：决定进不进得来
    - name: 屋里三件事
      value: 分层、幂等、统一错误：决定办得成办不成
  log:
  - at: 全景
    text: 链路是固定的，逐关拆就是后面八步
- id: gateway-entry
  title: 网关守大门：路由分发、终结加密与门口粗筛
  tldr: "[[网关]]挡在所有内网服务最前面，包揽按路径转发、[[TLS]] 解密和异常大包粗筛三件杂活，让客户端只认一个固定入口。"
  body: |-
    假如后台拆出了订单、商品、支付十个服务，总不能让手机 App 记十串地址，再给十套服务各自配一遍 HTTPS 证书。摆在最前面的[[网关]]把入口收拢成唯一大门：客户端永远只连网关地址，网关看一眼路径，把 `/orders` 递给订单服务、`/items` 递给商品服务；后面服务扩容缩容、换机器改 IP，全在网关内部消化。

    顺手接过的第二件活是 [[TLS]] 终止：外网昂贵的加密握手与解密在网关这一层一次性办完，证书也只在这里维护一份，往后走机房内网轻装上阵。第三件活是门口粗筛：路径压根不存在、或者请求体大得离谱的畸形包，在网关门口直接打回，不放进去消耗业务进程一丝内存。

    在单体架构里，这三件活通常由 [[Nginx]] 这类[[反向代理]]直接兼任；等服务拆多了，才会演进成专门的 API 网关组件——名字变了，守大门的职责分毫未变。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: c
      label: 客户端：只认一个入口地址
    - lane: gate
      id: gw
      label: 网关：分发、解 TLS、粗筛
    - lane: app
      id: svc
      label: 后面的服务：躲在内网只管办事
      highlight: true
    messages:
    - id: m1
      from: c
      to: gw
      label: 所有请求先到这里报到
    - id: m2
      from: gw
      to: svc
      label: 按路径递给对的服务
      active: true
    registers:
    - name: 证书
      value: 只在网关维护一份，服务不用各自操心
    - name: 粗筛
      value: 路径不存在、包体离谱的请求门口就回
  log:
  - at: 网关
    text: 入口收成一个，业务服务躲进内网
- id: rate-limit
  title: 限流站在最前排：用令牌桶放行突发、卡死均值
  tldr: "被拒请求越早回头越省成本，所以[[限流]]必须紧挨入口；令牌桶平时攒令牌接住瞬时波峰，面对持续超速则果断返回 429 保命。"
  body: |-
    拿令牌桶算法走一遍真实数字。给下单接口配一只桶：每秒匀速补充 100 个令牌，桶最多存 200 个；请求进门先领一个令牌，领不到当场返回 `429 Too Many Requests`。平时每秒来 100 个请求，随到随走；整点秒杀突然涌来一波 200 个请求，桶里攒下的 200 个存货刚好整波放行；可要是脚本持续每秒狂刷 300 个，存货瞬间见底，往后每秒就只放 100 个进门、其余 200 个全在门口劝退。

    为什么限流非得摆在认证和业务之前？算一笔资源账就明白：在门口拒掉一个请求只花一次内存计数，几乎零成本；要是等它验完签名、查完 Redis、摸到数据库才拒，整条链路的资源早被烧穿了。服务从来不是被「拒绝请求」累死的，而是被「接进来却干不完的请求」拖死的。

    线上通常按用户编号和接口路径分别设桶，并在 `429` 响应里附上建议重试间隔。记住它的定位：限流不是惩罚用户，而是危机时刻主动丢掉 1% 的超额请求，换剩下 99% 的正常请求不跟着全军覆没。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: gate
      id: bucket
      label: 令牌桶：每秒进 100 个，最多攒 200 个
    - lane: client
      id: flood
      label: 突发流量：先是一波 200，又持续每秒 300
      highlight: true
    messages:
    - id: m1
      from: flood
      to: bucket
      label: 突发靠存货通过，持续超速被卡回每秒 100
      active: true
    registers:
    - name: 突发
      value: 桶里攒的 200 个令牌让整波突发通过
    - name: 持续超速
      value: 每秒只放 100 个，其余返回 429
  log:
  - at: 限流
    text: 位置决定效果：门口拒绝几乎零成本
- id: middleware-onion
  title: 中间件洋葱圈：正进反出，层序决定谁能被看见
  tldr: "日志计时、注入[[链路追踪]]编号与登录核验被抽成一层层[[中间件]]套在业务外圈；计时与日志必须放在最外层，才能把半路被拒的请求也记录在案。"
  body: |-
    过了限流，请求开始一层层穿过[[中间件]]洋葱圈。最外层是访问日志与计时器：进门按下秒表，响应出门时停表并记下状态码与耗时；第二层生成全局唯一的 [[trace ID]] 塞进上下文，让后续每行日志都自动带上它（正是观测课[[链路追踪]]在服务内部的起点）；第三层核验登录凭证，把当前用户身份挂进上下文；最中心才是干净的订单业务函数。

    洋葱圈的层序一旦排错，监控就会悄悄失明。比如把认证排在计时外面，未登录被打回 `401` 的请求连秒表都没碰过，耗时统计里彻底消失；再比如把日志放到最里层，被限流或认证拦下的异常流量一条日志都不留，半夜复盘连「当时到底冲进来多少请求」都查无对证。

    把这些横切活计剥进中间件后，业务函数里就只剩纯粹的下单逻辑；哪天全站要统一升级日志字段，改一处中间件，几十个接口瞬间同步生效。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: gate
      id: onion
      label: 洋葱：日志计时、追踪编号、认证
    - lane: app
      id: biz
      label: 业务函数：只剩业务本身
      highlight: true
    messages:
    - id: m1
      from: onion
      to: biz
      label: 请求依次穿入，响应反向穿出
      active: true
    registers:
    - name: 最外层
      value: 日志与计时：被拒的请求也要被量到
    - name: 追踪编号
      value: 一次请求一个编号，日志凭它一捞到手
  log:
  - at: 中间件
    text: 横切收成管道，业务函数只管业务
- id: validation
  title: 参数校验防线：前端校验保体验，后端校验才保命
  tldr: 任何人都能绕过网页直接构造报文，进业务逻辑前必须逐项核验类型、范围与归属，且商品价格一律以服务端查库为准。
  body: |-
    千万别因为「前端表单已经限制了输入」就省掉后端校验——攻击者根本不用你的网页，随手一条命令行就能直接往接口发 `数量 = -3`、`价格 = 0.01`，或者填上别人的收货地址编号。前端校验只是为了提醒正常用户少填错，后端校验才是守门防线。

    落到提交订单接口，进门先过四项死规矩：购买数量必须是正整数且不超过单笔上限；商品编号必须真实在售；收货地址必须归属当前登录用户；最关键的是**价格铁律**——彻底无视客户端传来的任何金额字段，一律按服务端现查的商品单价重新计价，把「一分钱买走商品」的古老漏洞堵死在门外。

    凡有一项不过关，当场按统一格式返回 `400`，绝不放进业务层浪费半点数据库资源。这道关卡与后面安全课紧咬在一起：安全课要讲的注入与[[越权]]，有一半正是校验缺位酿成的苦果。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: forged
      label: 构造的请求：数量 -3、价格 0.01
    - lane: app
      id: check
      label: 校验关：类型、范围、归属逐项过
      highlight: true
    messages:
    - id: m1
      from: forged
      to: check
      label: 不合规的输入，业务函数的门都不让进
      active: true
    registers:
    - name: 价格铁律
      value: 永远以服务端查到的为准，客户端传的无视
    - name: 校验失败
      value: 立刻返回 400，不占用业务与数据库
  log:
  - at: 校验
    text: 前端校验是体验，后端校验才是防线
- id: layering
  title: 业务分层：处理函数只做翻译，业务规则与数据存取各归其位
  tldr: 处理函数只负责把 HTTP 参数翻成业务调用、把结果翻回响应；业务规则全站集中在一处服务层，SQL 存取统一收口到数据访问层，改规则或换缓存互不牵连。
  body: |-
    如果在一个处理函数里同时解析 HTTP 参数、编写业务判断、再直接拼接 SQL 查库，一个接口动辄三百行。等某天退款规则调整，你得翻遍几十个接口去找哪里写过退款判断；想给某个慢查询加层[[缓存]]，又得先把散落各处的 SQL 全捞出来。业务规则到处复制粘贴，是后端代码腐烂的头号死法。

    清晰的分层把职责切成三段：最外层的处理函数（Handler）只做协议翻译，拿到校验后的参数调业务层，再把返回结果装进统一响应格式，绝不夹带业务判断；中间的业务层（Service）独占规则，能不能退、退多少、库存怎么扣，全站只有这一处说了算；最里层的数据访问层（Repository）专管存取，把 SQL 收拢在内，上层只管要订单对象而不问怎么查出来的。

    这套切分不是为了凑目录结构，而是在需求变更时兑现价值：改退款规则只改业务层，代码审查也只盯这一处；给订单查询加缓存只动数据访问层，上层业务完全无感。前端工程师对此其实很眼熟——UI 组件、状态管理（Store）与接口请求层的分离，正是同一套解耦思想在客户端的投影。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: handler
      label: 处理函数：只翻译，不判断
    - lane: app
      id: service
      label: 业务层：规则全站只有这一处
    - lane: data
      id: repo
      label: 数据访问层：SQL 收在这里
      highlight: true
    messages:
    - id: m1
      from: handler
      to: service
      label: 参数翻成业务调用
    - id: m2
      from: service
      to: repo
      label: 存取只说要什么，不问怎么查
      active: true
    registers:
    - name: 改规则
      value: 只动业务层，审查也只审那一层
    - name: 加缓存
      value: 只动数据访问层，业务无感
  log:
  - at: 分层
    text: 翻译、规则、存取三段分工，变更各归其位
- id: error-format
  title: 统一错误响应：一份报错同时服务用户、前端代码与排障运维
  tldr: HTTP 状态码定大类，业务错误码给程序做精确分支，自然语言提示给用户看，请求编号供运维捞日志；数据库报错与堆栈永远只进日志、不出接口。
  body: |-
    先用 [[HTTP]] 状态码把错误大类划清：`400` 是参数不合法，`401` 是未登录，`403` 是已登录但无权限，`404` 是资源不存在，`409` 是业务状态冲突（如重复下单或库存不足），`429` 是请求过频，`500` 才是服务端内部故障。状态码用准了，前端拦截器不用拆响应体就知道该跳登录页、提示稍后重试还是走业务弹窗。

    大类底下再用稳定的业务错误码做细分。同样是 `409`，`ORDER_STOCK_NOT_ENOUGH`（库存不足）和 `ORDER_ALREADY_PAID`（订单已支付）给用户的引导截然不同。把给人看的 `message` 文案与给代码判断的 `code` 分开维护：产品经理随时可以润色提示语，而错误码作为接口契约一旦发布就绝不轻易改动。

    守底线的铁律只有一条：数据库原始报错、调用堆栈和 SQL 原文永远只写进后端日志，绝不吐给客户端——既不拿乱码吓唬用户，更不把自家表结构白送给攻击者。响应里只带回一个 `requestId`（与观测课的 [[trace ID]] 贯通），用户截图报障时，运维凭这串编号就能在日志海里秒级捞出整条执行现场。
  derivation: original
  sources:
  - ref: rfc-9457
    locator: "RFC 9457: Problem Details for HTTP APIs 的成员定义"
    claim: RFC 9457 为 HTTP API 定义了标准错误响应结构（type、title、status、detail、instance），使错误格式可跨服务统一并被程序稳定解析。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  code:
    lang: json
    code: |-
      {
        "code": "ORDER_STOCK_NOT_ENOUGH",
        "message": "这件商品刚刚卖完了",
        "requestId": "req_9f3ka21",
        "status": 409
      }
    note: 码给程序、文案给人、编号供查日志；堆栈与 SQL 只进日志不出接口
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: err
      label: 一次失败：库存不足
    - lane: client
      id: readers
      label: 三个读者：用户、前端程序、运维
      highlight: true
    messages:
    - id: m1
      from: err
      to: readers
      label: 文案给人、码给程序、编号供查日志
      active: true
    registers:
    - name: 状态码
      value: 400 参数、401 未登录、403 无权、409 冲突、429 过频
    - name: 铁律
      value: 内部细节只进日志，永远不出接口
  log:
  - at: 错误处理
    text: 统一格式，全站一套解析走到底
- id: idempotency-key
  title: 幂等键：服务端认编号不认次数，让重试变成安全动作
  tldr: 客户端为每次下单意图生成唯一幂等键，重试时原样带上；服务器先原子占位核验该键，已处理过就原样返回首次结果，连点、超时重试与网关重发全收拢为一单。
  body: |-
    下单支付最怕的不是明确报错，而是「不知道成没成」时的重试：用户点下提交，服务端其实已经建好订单，但响应半路超时丢了；页面报错后用户再点一次，或者客户端框架与[[网关]]自动重发，服务端就会把它当成全新请求再建一单，重复扣款和客诉就此产生。

    [[幂等键]]把「只执行一次」写进了接口契约。用户点提交的瞬间，客户端为这次下单意图生成一个随机唯一编号（如 UUID）塞进请求头 `Idempotency-Key`；无论超时重试几次，只要还是同一笔意图就不换键。服务端收到后先靠数据库唯一索引或 [[Redis]] 原子占位查验该编号：首次到达就正常建单，并把「编号 → 订单结果」存留一天；并发重入时拒绝重复执行，已处理完的重复请求则直接原样返回首次保存的结果，业务逻辑一步都不再重跑。

    分布式课程讲消息消费[[幂等]]，解决的是队列重复投递；幂等键正是同一思想在 API 入口的落地——把「恰好生效一次」从赌网络运气变成协议保证。支付平台 Stripe 早已将其定为公开接口标准，凡是扣款、建单、发券类写接口都应当标配。
  derivation: original
  sources:
  - ref: stripe-idempotency
    locator: "Stripe API: Idempotent requests 的语义说明"
    claim: Stripe 的幂等机制要求客户端为请求提供唯一键（Idempotency-Key），服务器保存首次执行的结果，相同键的重复请求直接返回已保存结果而不重复执行。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: retry
      label: 客户端：响应丢了，带着同一个键重试
    - lane: app
      id: dedup
      label: 服务器：先查键，处理过就返回旧结果
    - lane: data
      id: store
      label: 键的账本：编号对应哪笔订单
      highlight: true
    messages:
    - id: m1
      from: retry
      to: dedup
      label: 同一个幂等键第二次到达
    - id: m2
      from: dedup
      to: store
      label: 查到已处理：原样返回，不再执行
      active: true
    registers:
    - name: 键的生命周期
      value: 一次操作一个键，重试不换键，存一天足够
    - name: 防住的
      value: 连点、自动重试、网关重发，全收成一单
  log:
  - at: 幂等
    text: 认编号不认次数，执行一次靠协议保证
- id: pagination-upload
  title: 列表分页与文件直传：别把整张表和大文件塞进应用服务器
  tldr: 列表必须分页，跳页后台用偏移分页，深翻信息流用定点直达的游标分页；大文件上传则由应用签发预签名 URL，让客户端直传对象存储，应用只发证不搬货。
  body: |-
    订单列表若有十万条记录，接口敢一次全返回，数据库查十万行、网络传几十兆、前端渲染直接卡死。分页怎么翻看场景：偏移分页最直观，第 3 页就是跳过前 40 条取 20 条，可一旦翻到第 5000 页，数据库得老老实实先数出前 99980 条再扔掉，越往后越慢（下一课会拆开这笔 SQL 账）。[[游标分页]]改用上一页最后一条的编号做锚点，下一页直接查「编号大于它的 20 条」，配合索引定点直达，第 5000 页与第 1 页一样快；代价是不能任意跳页，因此管理后台常用偏移分页，用户侧无限下拉信息流常用游标分页。

    大文件上传则是另一类带宽杀手。下单上传凭证图片时，若让文件先流经应用服务器再转存，不仅白白吃光应用内存与带宽，遇上实例重启还会中途断传。标准做法是客户端直传：先向应用申请一张带时效与权限签名的通行证（预签名 URL），客户端拿着它把文件直接传进对象存储（如 [[S3]]），传完再把文件地址报给应用落库。应用进程只负责发证与记账，彻底卸掉搬运大文件的包袱。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: client
      id: list
      label: 列表翻到第 5000 页
    - lane: data
      id: cursor
      label: 游标分页：锚住最后一条编号，定点直达
      highlight: true
    messages:
    - id: m1
      from: list
      to: cursor
      label: 偏移要先数出前 99980 条，游标不用
      active: true
    registers:
    - name: 分工
      value: 后台管理用偏移（要跳页），信息流用游标（只顺序翻）
    - name: 上传
      value: 预签名直达对象存储，应用只发证不搬货
  log:
  - at: 专题
    text: 分页锚点决定深翻成本，上传直达决定应用负担
- id: closing-chain
  title: 接口服务审查六问：顺着请求链路逐关验明骨架成色
  tldr: 门口三关（限流、认证、校验）挡住脏流量与坏输入，屋里三件事（分层、幂等键、统一错误）稳住业务边界；顺着链路连问六句，任何 API 服务的隐患都无处遁形。
  body: |-
    一条生产级 API 请求走过的完整链路至此全部合拢：网关统一收口、限流掐住洪峰、认证核实身份、中间件包办横切逻辑、参数校验拦下脏数据、三层架构隔离业务规则、统一错误响应喂饱三类读者；遇到写接口补上幂等键防重，遇到大列表与大文件则交给游标分页和对象存储直传。

    拿到任何一个后端服务或面试里的接口设计题，直接顺着这条链路连问六句：入口最前面有没有限流兜底？非公开接口是不是全过了统一认证？单价与金额是不是一律以服务端查库为准？核心退款或扣库存规则是不是只写在了唯一一处业务层？下单扣款接口带没带幂等键？报错响应能不能凭 `requestId` 一键捞出后端日志？六问全过，服务的工程骨架就稳稳立住了。

    穿过业务层再往里走，重担就交到了数据库手上：SQL 怎么写才不踩全表扫描、连接池怎么配才不打爆上限、事务边界划在哪才不锁死全站，正是下一课要算清的实务账。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: chain
      label: 完整的链：门口三关加屋里三件事
    - lane: gate
      id: audit
      label: 审查法：逐关对照，缺环即隐患
      highlight: true
    messages:
    - id: m1
      from: chain
      to: audit
      label: 六个问题问完，骨架成色就清楚了
      active: true
    registers:
    - name: 审查六问
      value: 限流、认证、服务端价格、规则单点、幂等键、错误编号
  log:
  - at: 收束
    text: 请求的一生，就是 API 服务的骨架图
