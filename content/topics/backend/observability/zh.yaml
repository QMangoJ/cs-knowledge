overview:
  - key: 一句话总结
    value: 可观测性是只凭系统对外吐出的信号就能倒推内部症结的能力：靠[[指标]]报信看趋势、[[链路追踪]]抓跨服务慢环、[[结构化日志]]还原单笔现场，三者凭同一个 trace_id 串联跳转。
  - key: 日志管什么
    value: 日志以带时间戳的 [[JSON]] 字段记下离散事件，是还原「订单 88231 为什么付完钱没改状态」的唯一铁证；代价是体量随流量线性暴涨，必须按级别限流并设保留期。
  - key: 指标管什么
    value: 指标在采集端就把每分钟数万次请求压成计数与 P99 分位数序列，体量极轻、能存一年以上，是自动告警的唯一底座，但聚合抹掉了单次请求的个体细节。
  - key: 追踪管什么
    value: 链路追踪在入口签发唯一 trace_id，把请求流经 5 个服务的每段跨度（Span）拼成瀑布时间树，专治「每个服务都说自己很快、总耗时却要 2 秒」的跨节点慢病。
  - key: 两张体检表
    value: "[[RED 方法]]站在用户侧看服务（速率、错误、时长）；[[USE 方法]]站在机器侧查硬件资源（利用率、排队饱和度、错误），排障时先 RED 定影响面、再 USE 挖瓶颈。"
  - key: 采样与告警
    value: 高并发追踪混用「头部 1% 随机[[采样]]看基线 + 尾部全留报错与慢请求」控住存储账单；半夜叫醒人的告警只盯用户受损症状，把 CPU 等内部原因留在排查面板上。
  - key: 落地顺序
    value: 从零建设按性价比分三步：先配齐 RED 指标与症状告警，再统一带 trace_id 的结构化日志，最后用 OpenTelemetry 补齐跨服务链路追踪。
summary: |-
  [[可观测性]]让几十台机器组成的线上黑盒持续吐出三类互补信号，靠同一个请求编号（trace_id）跑完排障接力：[[指标]]把海量请求聚合成轻量时间序列，第一时间吹哨「哪里病了」；[[链路追踪]]把跨服务调用拼成耗时瀑布树，一眼揪出「卡在哪一环」；[[结构化日志]]保留单次事件的完整上下文，最终拍板「为什么病」。全课走通这三根支柱的实战接力，配齐面向服务的 [[RED 方法]]与面向硬件资源的 [[USE 方法]]两张体检表，并算清 TB 级账单下的头尾[[采样]]、防狼来了的症状告警纪律与 OpenTelemetry 落地顺序。
premise: 凌晨三点，值班电话突然炸响：电商下单接口耗时从 200ms 飙到了 2s。一笔下单要依次穿过网关、订单、支付、风控、库存 5 个服务、散在 20 台节点上——如果系统平时像闷葫芦一样不往外吐标准化数据，工程师只能挨台机器敲 top 看负载、在几个 GB 的纯文本日志里瞎搜订单号，折腾一小时最后靠批量重启蒙混过关。面对随时在变的分布式黑盒，系统平时到底该吐出哪几类信号，才能让人在几分钟内顺藤摸瓜抓出真凶？
position: 本课位于后端工程学科第四板块「观测：日志、指标与链路追踪」，是「上线与运维侧」前四课的收官一环。它接住了前三课留下的所有反馈回路：集群里探针之外的业务健康靠它度量，流水线金丝雀放量的自动晋升与回滚靠它做裁判。学完本课，打包、编排、发布、观测四块底座彻底闭环；从下一课《认证与会话》起将切入「写服务一侧」，拆解业务服务内部的第一道门禁。
level: 进阶
minutes: 26
objectives:
  - 分清指标、链路追踪与结构化日志各自的职责边界与存储成本，走通凭 trace_id 串联的三棒排障接力
  - 区分预设问题的传统监控与支持高维临时追问的可观测性，说明 P99 尾部延迟为何优于平均耗时
  - 给在线接口配齐 RED 三项核心指标，并用 USE 方法里的「排队饱和度」解释资源未满却变慢的原因
  - 算清高并发链路追踪的存储账，对比头部采样与尾部采样的取舍，写出基于用户症状而非内部原因的告警规则
aiLink: 大模型与多步 Agent 系统把[[可观测性]]推成了头号刚需：流式生成光看总耗时不够，必须拆开盯首字延迟（TTFT）与每秒吐字速度（TPOT）等核心[[指标]]；一次 Agent 任务常在后台串调五六轮改写、向量检索与外部工具，全靠 OpenTelemetry [[链路追踪]]把每步耗时和 [[token]] 账单拼成瀑布树，再借尾部[[采样]]留住慢回答与报错现场的[[结构化日志]]来定位幻觉根因。
bridge:
  prev: 上一课的金丝雀自动裁判与一键回滚留了一笔明显的欠账：放量时对比的新旧版错误率、P99 尾部延迟，还有半夜触发止血的告警，平时到底从哪采上来、出事怎么追到具体哪行代码？本课就来把这套眼睛装齐。
  next: 到这里，把一个服务打包、排班、安全发布并看清运行状态的运维闭环全部走通了。但容器里面跑的那份业务代码自己该怎么写还没开讲——从下一课起切到写服务一侧，先守住第一道大门：用户登录态存在哪、怎么防伪造。
design:
  - mechanism: 三类信号按问题粒度分工，靠 trace_id 互跳
    problem: 指望靠单一信号包打天下必撞南墙：只打日志，算全站趋势得扫几百 GB 文本；只采聚合指标，永远抓不出具体哪笔订单报错；只开全量追踪，磁盘账单三天就能把预算烧穿。
    choice: 按提问粒度拆成三套专职数据结构——指标用预聚合数字管趋势告警，追踪用父子跨度树管跨服务慢环定位，结构化日志用键值事件管单笔根因，并在入口注入同一个 trace_id 贯穿三者。
    tradeoff: 采集、存储与查询后端分成了时序库、追踪库、日志库三套体系，团队接入埋点与日常维护的基础设施复杂度随之上升。
    root: 排障本质上要连答「坏没坏、坏在哪一跳、为什么坏」三个尺度截然不同的问题——唯有让数据结构贴合问题尺度，再用一根共享编号穿针引线，才能兼顾报警速度、排障深度与存储成本。
  - mechanism: 叫醒人的告警只盯用户症状，不盯机器原因
    problem: 如果只要某台节点 CPU 过 90% 或内存过 80% 就半夜打电话，跑批任务和正常缓存预热天天都会假传军情；狼来了一多，全员静音，等真正支付崩盘时反而没人醒。
    choice: 把半夜叫醒人的高优告警严格收敛在用户直接可感的症状上（错误率飙升、P99 延迟越线、支付转化率跳水）；CPU、磁盘队列、连接池等内部原因一律退居排查仪表盘。
    tradeoff: 症状告警吹哨时只告诉你「用户正在流血」，离底层病因还隔着一两跳，需要值班人顺着预设手册（Runbook）去翻追踪和资源面板定位。
    root: 整套生产系统里最稀缺、最不耐消耗的资源是值班工程师的注意力与信任——只有保证每一次电话响起都对应真实的业务受损与明确动作，警报才真正管用。
  - mechanism: 头部随机采样配尾部异常全留
    problem: 每秒五万次请求的微服务集群，每次调用生成十几条追踪跨度，一天就会吐出超六百亿条记录；全量落盘建索引会让配角观测系统比主业务机器还贵。
    choice: 把正常流量与异常流量分开对待：入口处按 1% 低比例头部随机采样保住无偏的全局耗时分布，同时在采集层用尾部采样把报错、超时的慢请求 100% 截留存盘。
    tradeoff: 尾部采样要求采集层先把同一 trace_id 的各段跨度在内存里攒几秒钟等结果出炉，架构比无状态直传重了一截；而被丢弃的 99% 正常样本若偶藏极隐蔽的数据错乱则无法回放。
    root: 观测是为了做统计判断和抓故障现场，不是给每次健康呼吸录高清录像——1% 随机样本足以喂饱统计分布，把宝贵的存储预算全砸在异常样本上才是最优解。
quiz:
  - q: 半夜告警提示支付接口错误率从 0.1% 飙到 4%，想最快摸清「到底是下游 5 个服务里哪一跳在报错」，第一步看什么最直接？
    options:
      - 挨个登录 20 台服务器翻纯文本日志
      - 点开异常时段的链路追踪（Trace），从瀑布时间树上一眼圈出报错或超时的那个跨度（Span）
      - 关掉告警再等半小时看它能不能自愈
      - 直接把 5 个服务全部重启一遍
    answer: 1
    explain: 指标已经跑完了第一棒（报信支付线异常），第二棒定位置正是链路追踪的主场：展开一次失败请求的跨服务瀑布树，哪一跳耗时暴涨或标红一目了然，锁定目标服务后再拿同一个 trace_id 去捞它的日志查根因。
  - q: RED 方法与 USE 方法在排障时怎样分工配合？
    options:
      - RED 只管前端网页，USE 只管后端数据库
      - RED 面向在线服务看用户感受（速率、错误、时长），USE 面向底层硬件资源查瓶颈（利用率、饱和度、错误）
      - RED 是云原生新标准，已经彻底淘汰了 USE
      - 两套方法统计的是完全相同的三个指标，只是缩写顺序不同
    answer: 1
    explain: 排障遵循「先 RED 后 USE」：先看服务的请求速率、错误数与 P99 时长确认用户是否真的受损，确认非代码逻辑问题后，再按 USE 逐项排查该节点的 CPU、内存、磁盘、网卡有没有排队饱和。
  - q: 为什么高并发系统的链路追踪不能 100% 全量落盘，且常把「头部采样」与「尾部采样」搭着用？
    options:
      - 因为追踪数据对排障帮助不大，丢掉 99% 也无所谓
      - 全量落盘每天会产生数百亿条记录、成本失控；头部低比例采样保住整体趋势，尾部采样专门把报错与慢请求全留下来
      - 采样是为了让监控折线图看起来更平滑美观
      - 操作系统内核限制每秒最多只能生成一百个追踪编号
    answer: 1
    explain: 一次请求跨十几个服务就会裂变出十几条 Span，高 QPS 下全量存储与索引账单惊人。头部 1% 随机采样花小钱看全局分布，尾部采样等请求跑完把慢与错的稀缺现场 100% 扣下，兼顾了账单与排障命中率。
  - q: 按照「盯症状而非盯原因」的纪律，下面哪条最适合设为半夜打电话的紧急告警？
    options:
      - 集群中任意一台工作节点的瞬间 CPU 利用率超过 85%
      - 核心下单支付成功率连续 3 分钟跌破基线 2 个百分点
      - 某个后台批处理容器的内存占用达到 75%
      - 每天固定发二十封汇总邮件把所有轻微警告抄送全员
    answer: 1
    explain: CPU 高或内存占七成时用户可能毫无感知（内部原因），半夜乱叫只会酿成告警疲劳；支付成功率下跌则代表真实用户此刻付不出钱（外部症状），必须立刻叫人止血。
steps:
  - id: three-am-blind
    title: 排障摸黑的病根：分布式黑盒没把内部状态吐成数据
    tldr: 排障快慢早在出事前就由系统平时吐出的数据质量定死了；指标、链路追踪、日志各管一类尺度的问题，缺哪一类就会在哪一棒卡壳。
    body: |-
      线上排障抓瞎，缺的不是值班人的努力，而是系统对外暴露的信息。单机时代排障连上去敲几行命令、翻一个本地文件就能摸清底细；到了微服务，一笔下单眨眼跨过网关、订单、支付、风控、库存 5 个进程与几十个容器，状态毫秒级刷新，不往外吐标准信号，工程师面对的就是一堵黑墙。

      借自控制论的[[可观测性]]就一个要求：不登机器临时插探头，单凭系统日常吐出的信号，就能反推出内部发生了什么。在现代后端里，它落成进程内 SDK 加节点 Collector 守护进程持续采集的三类信号——[[指标]]、[[链路追踪]]与日志，好比把浏览器 F12 里的 Performance 曲线、Network 瀑布图和 Console 台账搬上了服务器集群。

      三类信号不能三合一，是因为排障要连答三个粒度迥异的问题：「整条线健不健康」靠指标看趋势，「慢请求卡在哪一跳」靠追踪拆环节，「那一刻代码算错了什么值」靠日志翻现场。少装一根支柱，排障链上就留下一块只能靠重启蒙混的盲区。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: app
          id: blackbox
          label: 线上系统：内部状态在变，外面看不见
        - lane: human
          id: blind
          label: 值班工程师：只能登机器瞎猜
          highlight: true
      messages:
        - id: m1
          from: blackbox
          to: blind
          label: 只有一句「接口变慢」，病根无从查起
          active: true
      registers:
        - name: 缺的不是努力
          value: 是系统没有把内部状态以可用形式说出来
        - name: 三类数据预告
          value: 日志记事件、指标看趋势、追踪定位环节
    log:
      - at: 场景
        text: 排障的上限，由系统平时吐出的数据质量决定
  - id: monitoring-vs-observability
    title: 监控只答预设清单，可观测性靠上下文应付临时追问
    tldr: 监控大屏全绿、客服却被投诉淹没，是因为监控只盯事先写死的聚合口径；可观测性要求采集时带齐高维上下文标签，出了意外能当场切分追问。
    body: |-
      值班室最尴尬的一幕，莫过于墙上几十块监控图一片翠绿，客服群却炸了锅：「华南老版本 App 用户全打不开订单页！」监控没撒谎——全站总成功率和总耗时确实没越线；漏报是因为没人提前配好「按地区 × App 版本 × 运营商拆开看错误率」这张图，局部故障被全站大盘稀释掉了。

      这就是监控与可观测性的分水岭。监控管的是「已知的未知」：提前猜到磁盘会满、总错误率会飙，写死固定考卷让机器日夜巡检；可观测性对付的是「未知的未知」——要求信号产生时就挂上丰富的上下文键值（`trace_id`、`region`、`app_version`、`payment_channel`），哪怕故障组合闻所未闻，也能在查询框里临时切片下钻，几十秒锁定异常交集。

      两者不是替代关系：可观测性是底层数据地基，监控是架在上面的常驻哨兵。先把带齐上下文的数据底子打牢，挑核心口径设成监控告警顺理成章；只堆固定大盘而不留细粒度标签，早晚还会撞上那块「全绿却不可用」的大屏。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: store
          id: dashboard
          label: 监控大屏：预设的指标全绿
        - lane: human
          id: complaint
          label: 用户投诉：某个地区打不开订单页
          highlight: true
      messages:
        - id: m1
          from: dashboard
          to: complaint
          label: 没预设过的问题，监控一概答不上来
          active: true
      registers:
        - name: 监控的本质
          value: 预设问题清单，替你日夜问同样的问题
        - name: 可观测性的要求
          value: 数据带够上下文，没想到的问题也能临时问出来
    log:
      - at: 定义
        text: 先打数据的底子，监控只是它的一个用法
  - id: logs
    title: 结构化日志：按键值记下离散事件，还原单笔请求现场
    tldr: 单笔异常订单的前因后果只有日志能完整还原；改成带 trace_id 的单行 JSON 结构化日志，并严控日志级别与保留期，才能既查得动又存得起。
    body: |-
      遇到「订单 `88231` 微信扣款成功、页面却卡在待支付」的点名客诉，全公司只有日志救得了场：支付回调几分几秒到的、验签过了没、库存返回什么错误码、乐观锁被谁抢了版本号——这些离散事件的精确参数，聚合指标早就抹没了，追踪树也只看得到耗时，唯有代码分支打出的日志能一五一十还原现场。

      想在几十台机器上秒级检索，绝不能各凭心情拼纯文本，而要统一打[[结构化日志]]。容器环境里的标准形态是进程往标准输出（`stdout`）每行印一段单行 [[JSON]]，固定带齐 `timestamp`、`level`、`service`、`trace_id`、`order_id` 与错误码，由节点采集代理收走建索引。最值钱的字段是请求编号 `trace_id`：路过的每个服务都把它写进日志，拿编号一搜，散在五台机器上的记录瞬间按时间排成同一场戏。

      日志的软肋是体量随流量 `1:1` 暴涨：每秒几万请求的核心服务一天能吐上百 GB，乱打日志既拖慢磁盘网络 I/O，又烧穿存储账单。日志治理一半在写、一半在舍：`ERROR` 与关键状态流转全留，`DEBUG` 报文平时关闭、排障时动态打开；热存储只留 7 天供即时查询，到期自动归档清理。
    derivation: original
    sources:
      - ref: opentelemetry-docs
        locator: "Concepts: Signals / Logs（日志作为可观测性信号的定位）"
        claim: OpenTelemetry 把日志定义为带时间戳的事件记录，是三类可观测性信号之一；结构化、带上下文的日志才能与指标、追踪关联查询。
