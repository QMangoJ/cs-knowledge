  - id: metrics
    title: 指标：采集端预聚合时间序列，低成本看趋势与吹响告警
    tldr: 指标在采集端就把每分钟数万次请求压成十来个浮点数，查得快、留得久，能在客诉爆发前二十分钟抓出异常拐点，代价是抹掉了个体身份。
    body: |-
      上午十点，客服群风平浪静，值班告警却先响了：支付错误率曲线从 `0.1%` 爬到了 `2%`。团队赶在大批用户察觉前切流止血——这就是[[指标]]的主场：把请求吞吐、失败数、耗时分布与内存水位浓缩成按时间排列的数字序列，让系统趋势与突变在折线图上一眼现形。

      指标极度便宜的秘诀在于**采集端预聚合**。以 Prometheus 为例，服务只在内存维护几个原子计数器和直方图桶，通过 `/metrics` 接口暴露数字，采集器每 `15` 秒拉取一次落入时序库（TSDB）：哪怕 1 分钟涌入 `60,000` 次下单，存下来的也只是总数、错数和几个分位桶这十来个浮点数。体量与流量脱钩，让它能存一年以上看大促对比，也成了全天候自动轮询告警的唯一合理底座。

      省钱的反面是抹掉了个体：看着错误率涨到 `2%`，你算得出这分钟挂了 `1,200` 笔支付，却问不出「具体哪 1,200 个用户挂了、卡在哪一步」。因此指标在排障接力里专跑第一棒——最快吹哨「哪个服务从几点开始病了」，定位病灶必须交棒给追踪和日志。
    derivation: original
    sources:
      - ref: google-sre-book
        locator: "Monitoring Distributed Systems：指标、四个黄金信号与告警的取舍"
        claim: Google SRE 手册把指标作为监控的主干：以聚合的数字序列呈现延迟、流量、错误与饱和度，并以此为告警依据，强调简单与可行动。
        status: verified
        checkedBy: subagent
        checkedAt: "2026-11-17"
    canvas:
