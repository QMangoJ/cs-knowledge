  - id: use-method
    title: USE 方法：逐项排查硬件资源，用排队饱和度识破假空闲
    tldr: 代码没改接口却变慢时，按 USE 方法逐项核查 CPU、内存、磁盘、网络的利用率、饱和度与错误；衡量排队长度的「饱和度」才是抓延迟飙升的关键。
    body: |-
      订单服务的 RED 报出 `P99` 翻倍，可近期没发版、慢 SQL 也为空——病根多半在机器或容器资源里。性能专家 Brendan Gregg 提出的 [[USE 方法]]，要求对着每一种软硬件资源（[[CPU]]、内存、磁盘 I/O、网卡、连接池）挨个查三项：**利用率（Utilization）**看忙闲比例，**错误（Errors）**看丢包或坏道，最核心也最易漏看的是中间那项：**饱和度（Saturation）**。

      饱和度量的是排队长度（如 CPU 运行队列、磁盘 `await` 队列、连接池等待线程数）。光看利用率极易受骗：一块磁盘 1 分钟平均利用率仅 `60%`，看似还余四成，实则前 36 秒涌入上百个读写排起长龙、后 24 秒闲置——请求只要一排队，延迟立刻成倍跳涨；反过来单核跑满 `100%` 却零排队时，接口照样飞快。

      两张表合起来就是标准排障动线：**先自上而下看 RED** 确认用户真受了伤，**再自下而上查 USE** 钻进异常节点抓资源排队。颠倒顺序一头扎进机器指标，很容易对着一台正常跑满批处理的健康节点白耗半小时。
    derivation: original
    sources:
      - ref: brendangregg-use
        locator: "The USE Method：Utilization、Saturation、Errors 的定义与资源清单"
        claim: USE 方法要求对每种资源检查利用率、饱和度与错误数三项，其中饱和度（排队程度）是定位性能瓶颈的关键，常被只看利用率的做法漏掉。
        status: verified
        checkedBy: subagent
        checkedAt: "2026-11-17"
    canvas:
      kind: swimlane
      actors:
        - lane: collect
          id: uselist
          label: USE 清单：每种资源查利用率、饱和度、错误
        - lane: app
          id: diskqueue
          label: 磁盘：利用率没满，请求却在排长队
          highlight: true
      messages:
        - id: m1
          from: uselist
          to: diskqueue
          label: 延迟从排队里来，饱和度专门抓它
          active: true
      registers:
        - name: 分工
          value: RED 自上而下确认影响，USE 自下而上逐个资源排查
        - name: 易漏项
          value: 利用率会骗人，排队长度才决定延迟涨不涨
    log:
      - at: USE
        text: 给资源看的排查表，主角是饱和度
  - id: sampling-cost
    title: 采样与账单：头部低比例看基线，尾部全留报错与慢请求
    tldr: 五万 QPS 集群一天裂变出逾六百亿条追踪跨度，全量落盘足以烧穿预算；工程上用 1% 头部随机采样保全局统计无偏，配尾部采样把报错与慢请求 100% 扣下。
    body: |-
      链路追踪全量开启的账单能吓出冷汗：一个 `50,000` QPS 的集群，每次请求平均裂变 `15` 条跨度（`Span`），一天 `86,400` 秒就吐出约 `648` 亿条记录，连压缩带索引每天新增几十 TB 存储——观测配角转眼比主业务数据库还贵。大流量下从不争「采不采」，只争「怎么采不漏掉救命现场」。

      [[采样]]分两条路线。**头部采样**在请求刚进网关时掷骰子：拍板留 `1%`，标记随 `traceparent` 带到底，没抽中的 `99%` 零开销；它便宜无偏、算全局分布够用，但一天偶发 5 次的死锁在 `1%` 概率下几乎必漏。**尾部采样**反过来：先让 Collector 把同一 `trace_id` 的跨度在内存攒几秒，等整条链跑完再挑——带 `ERROR` 或耗时超 `1s` 的异常链 `100%` 落盘，正常请求再大批丢弃，代价是采集层得扛住有状态的内存缓冲与分片路由。

      线上常把头尾混搭：正常流量走 `1%` 头部随机保基线，报错与慢请求走尾部全留；日志侧同构——`ERROR` 全留、`DEBUG` 仅排障时定向打开。采样率不是纯技术参数，而是在为「罕见故障的可见性」明码标价。
    derivation: original
    canvas:
      kind: swimlane
      actors:
        - lane: collect
          id: sampler
          label: 采样：进来先掷骰子，或攒齐再决定
        - lane: store
          id: bill
          label: 存储账单：全量是每天 TB 级的量级
          highlight: true
      messages:
        - id: m1
          from: sampler
          to: bill
          label: 正常流量留样本，异常请求尽量全留
          active: true
      registers:
        - name: 头部采样
          value: 进门掷骰子，成本可控，但罕见问题可能漏掉
        - name: 尾部采样
          value: 攒齐再决定，专留出错与慢的，实现更复杂
    log:
      - at: 采样
        text: 采样率是在为罕见问题的可见性定价
  - id: alerting-symptoms
    title: 告警纪律：只为用户受损症状叫醒人，把机器原因留给面板
    tldr: 告警头号杀手是假警泛滥引发的全员麻木；半夜打电话的紧急告警只盯错误率与尾部延迟等用户症状，且每条都必须附带可立即动手的处置手册。
    body: |-
      搞垮告警系统最快的办法，就是什么波动都往值班电话里塞。给每台机器设「CPU 超 `85%` 紧急呼叫」，凌晨跑对账或正常 GC 时电话响个不停，爬起来一看下单丝滑无比。连喊三个月狼来了，全员把告警群静音——第四个月真崩盘时，救命警报就淹死在免打扰里。告警疲劳不是态度问题，而是错把内部原因当成了紧急呼救。

      《Google SRE 手册》的铁律只有八个字：**盯紧症状，不盯原因**。半夜叫醒人的紧急告警，只锚定用户正在流血的外部症状：支付成功率连跌 3 分钟、网关 `5xx` 破 `1%`、下单 `P99` 破 `2s`。CPU、内存、磁盘队列、连接池等内部原因一律留在面板上，等人被叫醒后再拿来当听诊器查病因。

      守住告警信誉还要两条纪律：一是**无手册不上线**，弹窗里必须挂上处置手册（Runbook），点开就写明看哪张图、怎么回滚切流，写不出动作的不配叫醒人；二是**月度修剪噪音**，凡响过却从没触发人工干预的规则果断删改，像省数据库连接一样省值班人的注意力。
    derivation: original
    sources:
      - ref: google-sre-book
        locator: "Monitoring Distributed Systems：告警应基于症状、保持简单与可行动"
        claim: Google SRE 主张告警应针对用户可感知的症状而非内部原因，规则要简单、少而精，每条告警都应指向明确的处理动作，避免告警疲劳。
        status: verified
        checkedBy: subagent
        checkedAt: "2026-11-17"
    canvas:
      kind: swimlane
      actors:
        - lane: store
          id: symptomalarm
          label: 症状告警：错误率与支付成功率越线才响
        - lane: human
          id: trust
          label: 值班的人：响一次就信一次，立刻动手
          highlight: true
      messages:
        - id: m1
          from: symptomalarm
          to: trust
          label: 原因类数字留在仪表盘，不进叫醒通道
          active: true
      registers:
        - name: 判据
          value: 响起时必须对应用户受损且需要人动手
        - name: 卫生习惯
          value: 每条告警写明下一步，定期复盘删减假响
    log:
      - at: 告警
        text: 注意力是最稀缺资源，告警要为它精打细算
  - id: landing-order
    title: 按性价比分三步落地，收拢「打包—编排—发布—观测」闭环
    tldr: 从零搭可观测性按投入产出比分三步走：RED 指标与症状告警先行，带 trace_id 的结构化日志随后，OpenTelemetry 全链路追踪压轴补齐。
    body: |-
      补齐观测能力按性价比分三步最稳：**第一步立[[指标]]与症状告警**，给核心接口配上 RED 三格与叫醒电话，不改业务逻辑当天见效；**第二步推[[结构化日志]]并注入 `trace_id`**，统一单行 JSON 输出，排障从扫文本升级为按字段秒捞；**第三步补跨服务[[链路追踪]]**，等微服务调用链变深再打通 RPC 与消息队列透传，专治跨节点慢病。

      工具上，2019 年 CNCF 将 OpenTracing 与 Google OpenCensus 合并成厂商中立的 **OpenTelemetry（OTel）** 标准，终结了各家埋点互不兼容的割据：代码只需引一套 OTel SDK 埋一次点，由独立的 OTel Collector 守护进程收拢、做尾部采样，再转发给 Prometheus、Jaeger 等任意后端，换存储再也不用重改业务代码。

      带走两句排障口诀：**「指标吹哨看趋势，链路追踪抓慢环，结构化日志定病根；先查 RED 定伤情，再翻 USE 抓排队。」** 上线前过三道安检：配齐 RED 与症状 Runbook 了吗？JSON 日志都带 `trace_id` 了吗？采样能兜住报错与慢请求吗？至此，镜像打包、容器编排、渐进发布与全链路观测四块运维底座彻底咬合成环，下一站就推开容器大门，走进业务服务内部的设计世界。
    derivation: original
    sources:
      - ref: opentelemetry-docs
        locator: "What is OpenTelemetry：统一的日志、指标与追踪采集标准"
        claim: OpenTelemetry 是厂商中立的可观测性框架，统一定义三类信号的采集与导出，一套埋点可对接不同后端，已成为行业收敛的标准。
        status: verified
        checkedBy: subagent
        checkedAt: "2026-11-17"
    canvas:
      kind: swimlane
      actors:
        - lane: collect
          id: otel
          label: 统一采集：一套埋点，三类数据各就各位
        - lane: human
          id: fullmap
          label: 完整地图：打包、编排、发布、观测闭环
          highlight: true
      messages:
        - id: m1
          from: otel
          to: fullmap
          label: 能交付、能运行、能演进、能自知
          active: true
      registers:
        - name: 落地顺序
          value: 指标告警先行，结构化日志随后，追踪最后补
    log:
      - at: 收束
        text: 观测是闭环的最后一块，眼睛装上系统才完整
