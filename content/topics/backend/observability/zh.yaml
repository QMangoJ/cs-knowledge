  - id: traces
    title: 链路追踪：靠 trace_id 串起跨服务跨度，揪出慢在哪一跳
    tldr: 当网关、订单、库存各自监控都说很快、总下单耗时却要 2 秒时，链路追踪靠透传的 trace_id 把各跳跨度拼成瀑布时间树，一眼锁死慢调用。
    body: |-
      微服务最气人的慢病是「人人自证清白」：用户下单转圈等了 `2s`，对质时网关说自己只花 `30ms`，订单组说 `80ms`，库存组说 `50ms`，谁都没撒谎，可加起来连零头都不到，剩下 `1.8s` 漏在了哪段路上？单机视角永远拼不出跨机器的全程账。

      源自 Google 2010 年 `Dapper` 论文的[[链路追踪]]专门记这本全程账。请求一进网关就领一个全局唯一的 `trace_id`，之后每发 [[HTTP]] 或 RPC 调下游，都借标准请求头（如 W3C `traceparent`）把编号连同父节点号一路透传下去。每个服务干完活上报一条记着进出时刻与状态的跨度（`Span`）；后台按父子关系拼成瀑布时间树——就像把浏览器 F12 的 Network 瀑布图穿透到了后端五台机器里：`2s` 里足足 `1.6s` 卡在库存同步等待下游老仓库接口上，铁证如山。

      追踪补上了跨服务定位的空白，但改造也最重：调用链上所有服务、线程池与消息队列都得埋点透传上下文，断一环树就裂成两截；外加一次请求裂变十几条 `Span`，高并发下必须靠采样控住账单。
    derivation: original
    sources:
      - ref: opentelemetry-docs
        locator: "Concepts: Signals / Traces（trace、span 与上下文传播的定义）"
        claim: 链路追踪以 trace 为一次请求的完整记录、span 为其中的一段操作，靠上下文传播把同一编号贯穿各服务，从而还原跨服务的耗时分布。
        status: verified
        checkedBy: subagent
        checkedAt: "2026-11-17"
    canvas:
      kind: swimlane
      actors:
        - lane: app
          id: chain
          label: 一次下单：串过五个服务，总耗时两秒
        - lane: store
          id: tracetree
          label: 追踪时间树：1.6 秒卡在库存等下游那段
          highlight: true
      messages:
        - id: m1
          from: chain
          to: tracetree
          label: 同一编号的跨度拼成一棵树，病灶现形
          active: true
      registers:
        - name: 无可替代
          value: 每个服务都说自己正常时，只有它能算全程账
        - name: 代价
          value: 每个服务都要埋点与透传编号，改造量最大
    log:
      - at: 追踪
        text: 它回答慢在哪个环节，靠的是全程一个编号
  - id: three-pillars-relay
    title: 三支柱实战接力：指标吹哨、追踪定环、日志拍板根因
    tldr: 支付抖动排障二十分钟结案：指标抓出下午两点的异常拐点，追踪把慢点锁死在支付调风控那一跳，再凭同一个 trace_id 捞出风控日志定罪阈值误改。
    body: |-
      把三根支柱放进同一场排障，咬合关系一目了然。下午 `14:00`，第一棒由**指标**吹哨：支付接口错误率与 `P99` 延迟同时陡升，告警响起，几秒内交代清楚「支付链路从 14:00 整开始生病」。

      第二棒交接给**链路追踪**。工程师点开 `14:00` 后的慢请求瀑布树：支付自身逻辑仍只需 `15ms`，但「支付调风控」这一跳子跨度从平日 `50ms` 暴涨到超时报错的 `3s`，瞬间把嫌疑从五个服务缩圈到「支付 → 风控」这一段上。

      第三棒由**结构化日志**拍板。直接点异常跨度上的 `trace_id` 跳进日志台，风控服务同一毫秒的记录整整齐齐排了出来：下游征信调用全在 `500ms` 处被掐断，对照 `13:59` 的配置变更单，原来有人误把超时阈值从 `5s` 改成了 `0.5s`，把正常波动全误杀了。回滚配置后曲线应声回落——少指标要等客诉骂上门，少追踪得拉五个组扯皮，少日志盯住风控也查不出阈值填错，串起三棒的唯一纽带就是那串 `trace_id`。
    derivation: original
