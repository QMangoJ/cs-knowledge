id: backend/observability
subject: backend
slug: observability
title: 可观测性：日志、指标、链路追踪
order: 4
visual: swimlane
lanes:
- id: app
  label: 应用服务
- id: collect
  label: 采集层
- id: store
  label: 存储查询
- id: human
  label: 值班工程师
logColumns:
- key: at
  label: 阶段
- key: text
  label: 发生了什么
status: published
license: CC-BY-4.0
overview:
- key: 一句话总结
  value: 可观测性是系统的一种属性：只看它对外吐出的数据，就能推断内部正在发生什么。它由三类数据支撑——日志记事件、指标看趋势、链路追踪定位环节；三者分工不重叠，缺了哪一类，排障时就会有一类问题永远问不出来。
- key: 日志回答什么
  value: 日志回答「当时具体发生了什么」：某一笔订单为什么失败、某次请求走到哪一步断了，都靠它逐条还原。它是最细的数据，也是最贵的数据——量随业务量线性膨胀，写多了拖慢应用，存多了账单难看，所以要结构化、要分级、要控量。
- key: 指标回答什么
  value: 指标回答「整体怎么样、是否在变坏」：每秒请求数、错误率、第 99 百分位延迟，都是把无数次请求汇成的数字序列。它便宜、能长期保存、天生适合设告警，但只有总数与分布，永远指不出是哪一次请求出了问题。
- key: 追踪回答什么
  value: 链路追踪回答「慢在链条的哪一环」：给一次请求发一个全程的编号，它路过每个服务时各记一段耗时，最后拼成一棵时间树。单看每个服务都正常、合起来却很慢的那类病，只有它能确诊。
- key: 两套体检表
  value: RED 方法给服务看病：每个服务盯请求速率、错误数、响应时长。USE 方法给资源看病：每种资源查利用率、饱和度、错误数。一个面向用户感受，一个面向机器状态，配合起来才不会漏诊。
- key: 采样与成本
  value: 追踪与日志的量都随流量涨，全量保存大系统付不起。采样就是只留一部分记录：随机留百分之一看趋势，或者专留出错与慢的那批查问题。省了多少钱与漏掉多少线索，全在这一个比例的取舍里。
- key: 谁在用
  value: 凡是多服务系统都离不开这三类数据，区别只在完备程度。落地顺序通常是指标与告警先行，结构化日志随后，链路追踪最后——因为追踪的埋点改造成本最高，而它能回答的问题，也确实排在排障链条的后段。
summary: 前面三课把服务打包、编排、发布都安排好了，可故事还差最后一环：上线之后的系统是个黑盒，里面出了什么事，外面的人怎么知道？半夜被告警叫醒时，你手边只有三类线索：日志、指标、链路追踪。本课把这三类数据一次讲透——各自回答什么问题、各自贵在哪里、怎么配合着把一次故障从「发现不对」追到「找到病根」，再加上两套现成的体检表：给服务用的 RED 方法，与给资源用的 USE 方法。
premise: 这节课的问题很朴素：系统跑在几十台机器上，内部状态每时每刻都在变，你不在现场、也钻不进去，出事时凭什么知道发生了什么？答案是，系统必须自己把内部状态持续地说出来——说出来的方式对不对、够不够，决定了你是几分钟定位病根，还是登上机器瞎猜一整夜。
position: 本课位于后端工程学科的第四段「观测：日志、指标与链路追踪」，是全学科的收尾。它接住前三课留下的每个尾巴：编排系统里的副本健康靠它汇报，发布时金丝雀的判定靠它供数，事故时回滚与否的决定也靠它拍板。学完这一课，打包、编排、发布、观测四件事就闭环了。
level: 进阶
minutes: 26
objectives:
- 能说清日志、指标、链路追踪各自回答的问题与各自的代价
- 能用一次完整故障演示三支柱如何接力：指标发现、追踪定位、日志查根因
- 能分清 RED 与 USE 的适用对象，并给一个服务当场配出要盯的核心指标
- 能解释采样为什么必要，以及头部采样与尾部采样的区别
aiLink: 记住三支柱的分工口诀：指标告诉你「病了」，追踪告诉你「病在哪」，日志告诉你「为什么病」。其余内容都是在这三句上展开的成本与方法。
bridge:
  prev: 上一课的发布策略留了一个明显的窟窿：金丝雀放量要盯错误率与延迟、回滚要由告警触发，可这些数字平时从哪来、出事时怎么帮人找到病根，上一课只能先欠着。这一课就是来还这笔账的——把系统对外说话的三种方式讲清楚。
design:
- mechanism: 三类数据按问题分工
  problem: 如果只用一种数据包打天下：只看日志，趋势要靠人肉翻页统计；只看指标，永远定位不到具体哪次请求；只看追踪，存储成本会随流量涨到失控。
  choice: 让日志、指标、追踪各管一类问题：指标管趋势与告警，追踪管跨服务的环节定位，日志管具体事件的细节还原，并用统一的编号与标签让三者能互相跳转。
  tradeoff: 三套数据的采集、存储、查询都要各建一份基础设施，团队要同时养三种系统，复杂度和账单都比单一方案高。
  root: 「系统内部发生了什么」不是一个问题而是三个：是否异常、异常在哪、为何异常——数据的形态必须跟着问题的形态走，一种数据答不好三类问题。
- mechanism: 告警盯症状而非原因
  problem: 按原因告警（比如 CPU 使用率超过 90%）会把大量「机器看着忙、用户其实无感」的情况半夜喊起来，告警一多，人就开始无视，真正的警报也被淹掉。
  choice: 告警只盯用户能感受到的症状：错误率、延迟、关键业务成功率；原因类的指标留在仪表盘上供排查时看，不进告警通道。
  tradeoff: 症状告警响起时，离病根还隔着一层，需要人顺着追踪与日志再往下查；且症状的阈值要结合业务基线慢慢调，没有一劳永逸的数字。
  root: 告警的接收者是人的注意力，这是整个系统里最稀缺的资源：每一次响起都必须对应「用户正在受影响且需要人动手」，否则就是在透支信任。
- mechanism: 用采样换成本可控
  problem: 链路追踪与日志的数据量随请求量线性增长，全量保存时，观测系统自己的存储与索引成本会涨成另一笔大账单，甚至反过来拖慢业务。
  choice: 只保存一部分记录：随机采样保住统计代表性，尾部采样专挑出错与慢的请求留下，在成本与信息量之间按场景配比。
  tradeoff: 被丢掉的那部分记录里，可能恰好藏着某个罕见故障的唯一现场；采样率本质上是在为「罕见问题的可见性」标价。
  root: 观测的目标是支撑判断而不是留全量档案：趋势靠样本就能看清，把全量预算留给异常样本，是这笔账的最优解结构。
quiz:
- q: 半夜告警说某接口错误率从 0.1% 涨到 4%，你想知道「到底是哪一环在出错」，该先看哪类数据？
  options:
  - 日志，因为它最详细
  - 链路追踪，它能把一次请求在各服务的耗时与错误位置拼出来
  - 再等等看指标自己恢复
  - 先重启所有服务
  answer: 1
  explain: 指标已经完成了它的任务（发现异常），下一步是定位：追踪把一次请求经过的每个服务逐段展开，哪一段在报错、哪一段在变慢一目了然。定位到服务之后，再去翻那个服务的日志查根因。
- q: RED 方法与 USE 方法的分工是？
  options:
  - RED 给前端用，USE 给后端用
  - RED 面向服务（速率、错误、时长），USE 面向资源（利用率、饱和度、错误）
  - RED 是新方法，USE 已经过时
  - 两者看的是同一批指标，只是名字不同
  answer: 1
  explain: 两套体检表看的对象不同：RED 站在用户一侧看服务感受，USE 站在机器一侧逐个资源排查。服务慢时先看 RED 确认影响面，再用 USE 找是哪种资源被压垮。
- q: 为什么大流量系统的链路追踪必须采样？
  options:
  - 因为追踪数据没有用，采多少丢多少无所谓
  - 因为全量保存的成本随流量线性上涨，大系统付不起；采样保住趋势判断，尾部采样还能专留异常请求
  - 采样是为了让曲线好看
  - 法律规定不能全量保存
  answer: 1
  explain: 每条追踪都有几十段记录，全量落盘的存储与索引成本会随请求量一起膨胀。随机采样看趋势已经足够，把预算留给出错与慢的那批，才是这笔账的合理花法。
- q: 下面哪条告警设计更合理？
  options:
  - 某台机器 CPU 超过 90% 就半夜打电话
  - 支付成功率跌破基线两个百分点时告警，因为这意味着用户正在受影响且需要人处理
  - 每个服务的每种错误各设一条告警，越多越安全
  - 告警只发邮件，不设升级机制
  answer: 1
  explain: 告警要盯症状而不是原因：CPU 高可能用户毫无感觉，支付成功率跌却是实打实的用户受损。告警的每一次响起，都应对应一件需要人立刻动手的事。
steps:
- id: three-am-blind
  title: 第一步：场景——半夜的告警与一双瞎眼
  tldr: 凌晨三点，告警说下单接口变慢。没有可观测性的团队接下来的一小时是这样的：登机器、翻文件、猜原因、试重启。这一步先把「瞎」的状态看清楚，才知道要补的是什么。
  body: |-
    先看场景。凌晨三点，值班工程师被电话叫醒：监控群里只有一句话——下单接口平均耗时从 200 毫秒涨到了 2 秒。接下来他能做什么？挨个登录可能相关的机器，看 CPU、看内存，都没满；翻应用日志，几个 GB 的文本文件，没有统一格式，搜一个订单号要等半天；问群里「谁刚发过版」，无人应答。折腾一个多小时，最后靠重启一批服务「治」好了，至于到底哪儿坏了、为什么坏的，没人说得清——下次还会再来一遍。

    这个场景里缺的不是努力，是信息。系统在几十台机器上运行，内部状态每分每秒都在变，可它几乎没有把这些状态以可用的形式说出来。工程师在外面，系统在里面，中间隔着一堵墙。

    [[可观测性]]要拆的就是这堵墙：让系统持续地把内部状态变成外部能读的数据，出了任何问题，只看这些数据就能推断里面发生了什么。它落地成的三类数据——日志、[[指标]]、[[链路追踪]]——就是这一课的主角。先把总账立住：三者分工不同，缺一类，就有一类问题永远问不出来。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: blackbox
      label: 线上系统：内部状态在变，外面看不见
    - lane: human
      id: blind
      label: 值班工程师：只能登机器瞎猜
      highlight: true
    messages:
    - id: m1
      from: blackbox
      to: blind
      label: 只有一句「接口变慢」，病根无从查起
      active: true
    registers:
    - name: 缺的不是努力
      value: 是系统没有把内部状态以可用形式说出来
    - name: 三类数据预告
      value: 日志记事件、指标看趋势、追踪定位环节
  log:
  - at: 场景
    text: 排障的上限，由系统平时吐出的数据质量决定
- id: monitoring-vs-observability
  title: 第二步：监控与可观测性，差在哪
  tldr: 仪表盘全绿、用户却在投诉——监控答的是你事先想到的问题，可观测性要答的是你没想到的。这一步把两个词的分界线画清楚，后面三支柱的必要性都从这里来。
  body: |-
    先看一个尴尬场面：值班室的大屏上所有曲线都绿着，客服那边却转来一片投诉，说某个地区的用户打不开订单页。监控没有撒谎——它盯的那几十个指标确实都正常；问题出在，它盯的清单里没有「按地区拆开看错误率」这一项，而这次故障恰好只影响一个地区。监控的本质是预设问题清单：你提前想好要问什么，它就日夜替你问。没想到的，它一概不知。

    可观测性把要求往前推了一步：不预设问题，而是让系统吐出足够丰富、足够细的数据，等出了任何意料之外的状况，你能拿着数据临时拼出新问题来问——「过去一小时，用旧版本 App 的用户里，支付失败的集中在哪个运营商」，这种从没预设过的问题，也要能当场回答。能不能答得出，取决于数据在采集时有没有带上足够的上下文：请求编号、用户与版本标签、每一步的耗时与结果。

    两者不是取代关系：监控是可观测性的一个用法——拿数据里最要紧的那几项设成常驻问题与告警。先把数据的底子打好，监控自然水到渠成；反过来，只堆仪表盘而不打底子，永远会遇到那块全绿的大屏。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: store
      id: dashboard
      label: 监控大屏：预设的指标全绿
    - lane: human
      id: complaint
      label: 用户投诉：某个地区打不开订单页
      highlight: true
    messages:
    - id: m1
      from: dashboard
      to: complaint
      label: 没预设过的问题，监控一概答不上来
      active: true
    registers:
    - name: 监控的本质
      value: 预设问题清单，替你日夜问同样的问题
    - name: 可观测性的要求
      value: 数据带够上下文，没想到的问题也能临时问出来
  log:
  - at: 定义
    text: 先打数据的底子，监控只是它的一个用法
- id: logs
  title: 第三步：日志——回答「当时具体发生了什么」
  tldr: 一笔订单为什么失败，全公司只有日志能还原现场。这一步看日志的本事与它的贵：它是最细的数据，所以要结构化、要分级、要控量，否则贵到用不起也查不动。
  body: |-
    先看它无可替代的场面。用户投诉：订单 88231 付款成功却显示未支付。你要还原那一分钟里发生的事：支付回调几点到的、库存服务当时回了什么、订单状态被谁改过。能回答这些的只有日志——它是一条条离散事件的记录，带着时间戳与上下文，是系统给自己写的流水日记。指标只能告诉你那阵子失败率涨了，追踪只能告诉你慢在哪一环，具体某笔订单的遭遇，只有日志里有。

    日志要好用，前提是写得规矩。反面是纯文本大杂烩：每人随手写一句话，格式各异，出事时只能拿眼睛扫、拿关键词碰运气。规矩的写法叫[[结构化日志]]：每条都是带固定字段的数据——时间、级别、服务名、请求编号、订单号、关键结果——机器能按字段过滤与统计，你才能问出「过去十分钟，所有带这个订单号的记录按时间排好」这种问题。还有一个字段价值连城：把同一次请求的同一个编号写进它路过每个服务的日志里，跨服务的现场就能串起来——这正是下一步追踪的思想种子。

    代价必须算：日志的量随业务量线性膨胀，热门服务一天几十 GB 是常事。写得太多，先拖慢应用（写日志也是要花时间的），再压垮存储账单，最后淹没真正重要的记录。所以要分级：错误与警告全留，调试细节只在排障时临时打开；也要设保留期：热数据留一周，冷数据归档或删除。日志的功课，一半在写，一半在舍。
  derivation: original
  sources:
  - ref: opentelemetry-docs
    locator: "Concepts: Signals / Logs（日志作为可观测性信号的定位）"
    claim: OpenTelemetry 把日志定义为带时间戳的事件记录，是三类可观测性信号之一；结构化、带上下文的日志才能与指标、追踪关联查询。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: orderflow
      label: 订单 88231：付款成功却显示未支付
    - lane: store
      id: logstore
      label: 结构化日志：按订单号一捞，现场按时间排好
      highlight: true
    messages:
    - id: m1
      from: orderflow
      to: logstore
      label: 每个服务都写了带同一编号的那几条
      active: true
    registers:
    - name: 无可替代
      value: 具体某一次请求的遭遇，只有日志里有全程记录
    - name: 贵在哪
      value: 量随业务线性膨胀，要分级、要设保留期
  log:
  - at: 日志
    text: 它回答当时发生了什么，功课一半在写一半在舍
- id: metrics
  title: 第四步：指标——回答「整体怎么样」
  tldr: 错误率曲线在用户投诉之前二十分钟就跳起来了——这是只有指标能做的事。它把无数请求汇成数字序列，便宜、适合长期保存与告警，代价是永远指不出具体哪一次请求。
  body: |-
    先看指标的主场。某天上午，值班工程师还没收到任何投诉，先在图上看到支付接口的错误率从 0.1% 爬到了 2%——告警随之响起。等他们处理完，客服那边才零星出现第一批反馈。指标的本事是把系统的整体状态汇成随时间变化的数字：每秒来了多少请求、百分之几出错了、响应时间排在第 99 位的那个请求有多慢。无数次请求被压缩成一条曲线，趋势与突变一眼可见。

    它为什么便宜？因为它在采集时就做了聚合：一个服务一分钟内处理了六万次请求，指标里只留几个数字——总数、错误数、几个耗时分位点。原始记录不保存，自然存得起、查得快、能留一年以上看季节趋势。这份便宜使它成为告警的唯一合理载体：告警需要持续不断地判断「现在是否异常」，只有指标的体量撑得住这种持续判断。

    代价是同一件事的另一面：聚合把个体抹掉了。错误率涨到 2%，你知道有大约一千个请求失败了，但不知道是哪一千个、分别卡在哪一步。所以指标在排障链条里只负责第一棒——发现问题、圈定范围（哪个服务、从几点开始），定位与根因要交给追踪和日志。把分工记牢：指标告诉你「病了」，不负责告诉你「为什么病」。
  derivation: original
  sources:
  - ref: google-sre-book
    locator: "Monitoring Distributed Systems：指标、四个黄金信号与告警的取舍"
    claim: Google SRE 手册把指标作为监控的主干：以聚合的数字序列呈现延迟、流量、错误与饱和度，并以此为告警依据，强调简单与可行动。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: collect
      id: aggregator
      label: 采集层：六万次请求汇成几个数字
    - lane: store
      id: curve
      label: 错误率曲线：投诉到达前二十分钟先跳起来
      highlight: true
    messages:
    - id: m1
      from: aggregator
      to: curve
      label: 只留总数、错误数与耗时分位，存得起留得久
      active: true
    registers:
    - name: 本事
      value: 趋势与突变一眼可见，是告警的唯一合理载体
    - name: 边界
      value: 聚合抹掉个体，它只负责发现与圈定范围
  log:
  - at: 指标
    text: 它回答整体怎么样，排障链条里它跑第一棒
- id: traces
  title: 第五步：链路追踪——回答「慢在链条的哪一环」
  tldr: 一次下单要过五个服务，总耗时 2 秒，每个服务自己的监控都说正常。追踪把这次请求的全程拼成一棵时间树，哪一段在磨蹭，一眼就定位。
  body: |-
    先看那种最气人的慢。用户说下单要等两秒，你挨个服务去看：网关说自己只花了 30 毫秒，订单服务说 80 毫秒，库存服务说 50 毫秒——每个都「正常」，加起来却对不上那 2 秒。问题在于没人知道这一次请求在每个服务里到底待了多久、时间漏在了哪段路上。单机视角拼不出全程账本。

    [[链路追踪]]就是来记这本全程账的。做法是给每次请求发一个全程唯一的编号：请求进入第一个服务时生成，之后每调下游一个服务就把编号带下去。每个服务处理这段请求时记下一条记录——叫一个跨度（span）：几点进来的、几点出去的、中间调用了谁、结果是成功还是报错。最后把同编号的所有跨度按父子关系拼成一棵时间树：总耗时 2 秒里，1.6 秒卡在库存服务等它下游的那个老接口上——病灶第一次无可辩驳地摆在眼前。

    它补的是日志与指标都答不了的问题：跨服务的环节定位。代价也明确：每个服务都要埋点、要把编号一路透传下去，改造工程量是三支柱里最大的；而且每条追踪都有几十条跨度记录，全量保存贵得离谱——这就引出第九步的采样。在此之前，先看三支柱怎么在一次真实排障里接力。
  derivation: original
  sources:
  - ref: opentelemetry-docs
    locator: "Concepts: Signals / Traces（trace、span 与上下文传播的定义）"
    claim: 链路追踪以 trace 为一次请求的完整记录、span 为其中的一段操作，靠上下文传播把同一编号贯穿各服务，从而还原跨服务的耗时分布。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: app
      id: chain
      label: 一次下单：串过五个服务，总耗时两秒
    - lane: store
      id: tracetree
      label: 追踪时间树：1.6 秒卡在库存等下游那段
      highlight: true
    messages:
    - id: m1
      from: chain
      to: tracetree
      label: 同一编号的跨度拼成一棵树，病灶现形
      active: true
    registers:
    - name: 无可替代
      value: 每个服务都说自己正常时，只有它能算全程账
    - name: 代价
      value: 每个服务都要埋点与透传编号，改造量最大
  log:
  - at: 追踪
    text: 它回答慢在哪个环节，靠的是全程一个编号
- id: three-pillars-relay
  title: 第六步：三支柱接力——一次故障从头查到尾
  tldr: 把前三步串成一场实战：支付变慢事件里，指标先跳出来报信，追踪把病灶圈到某个服务，日志最后说清根因。三者靠同一个请求编号互相跳转，缺一棒都会卡住。
  body: |-
    把前面三步放进同一个故事里。下午两点，指标先动：支付接口的错误率与第 99 百分位延迟同时爬升，告警触发。这是第一棒——它只负责喊「出事了、在支付这条线、从两点开始」，不负责解释。

    第二棒交给追踪。工程师按时间点开几条慢请求的追踪树，发现耗时全堆在同一个位置：支付服务调用风控接口的那一段，平时 50 毫秒，今天要 3 秒。范围从「整个支付链路」缩到「支付到风控这一段」。他顺手还确认了另一件事：支付服务自身的处理耗时没变，病不在自己家里。

    第三棒交给日志。他拿着追踪里那次请求的编号，去风控服务的日志里把全程记录捞出来，看到一排超时记录，时间点正对着风控那边一次配置变更——它的下游超时阈值被人从 5 秒改成了 0.5 秒，慢请求全被误杀。根因清楚，回滚配置，指标回落，全程二十多分钟。回头看这条链：没有指标，故障要等用户投诉才被发现；没有追踪，要在五个服务里挨个猜；没有日志，定位到了风控也不知道它为什么错。三棒的接力点，是那个贯穿全程的请求编号——三套数据能互相跳转，全靠它。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: store
      id: relay1
      label: 指标报信：支付这条线，两点开始异常
    - lane: store
      id: relay2
      label: 追踪定位：耗时堆在支付调风控那一段
    - lane: human
      id: relay3
      label: 日志定根因：阈值被误改，慢请求被误杀
      highlight: true
    messages:
    - id: m1
      from: relay1
      to: relay2
      label: 圈定范围之后，把接力棒交下去
    - id: m2
      from: relay2
      to: relay3
      label: 靠同一个请求编号，在三套数据间跳转
      active: true
    registers:
    - name: 接力点
      value: 贯穿全程的请求编号，让三套数据能互相跳转
  log:
  - at: 接力
    text: 发现、定位、根因，三棒各答一类问题
- id: red-method
  title: 第七步：RED 方法——给服务配一张体检表
  tldr: 新服务上线，先配哪几张图？RED 给了最小答案：每个面向请求的服务只盯三个数——速率、错误、时长。这一步讲清三个数各自防的是哪种死法，以及它和黄金信号的关系。
  body: |-
    先解决一个实际问题：一个服务能产出的指标成百上千，新服务上线时到底先盯哪几个？[[RED 方法]]的答案是三个，首字母正好是 R、E、D。速率（Rate）：每秒进来多少请求——它告诉你压力与流量的形状，也是判断其他两个数有没有意义的分母。错误（Errors）：每秒失败多少个——用户受损的直接计量。时长（Duration）：响应耗时的分布，重点看尾部那批最慢的，而不是平均值——平均值会把慢请求藏起来。

    这套方法由 Tom Wilkie 在微服务监控实践中总结出来，与 Google SRE 手册里的四个黄金信号几乎是同一张表的两种切法：黄金信号是延迟、流量、错误、饱和度，前三项与 RED 一一对应，只多了一项饱和度——系统离满载还有多远。两套表对得上不是巧合：它们都是从「用户感受到的服务质量」倒推出来的最小集合。

    RED 的边界也要清楚：它只适用于面向请求的服务。后台任务、消息消费者这类没有「请求」的角色，硬套三个数会很别扭，得换思路看队列长度与处理延迟。另外它看的是服务这一层，机器层面的病——某个服务慢是因为机器的磁盘被打满——RED 只报得出症状，病因要靠下一步的 USE 方法下钻。
  derivation: original
  sources:
  - ref: grafana-red-method
    locator: "The RED Method: how to instrument your services（Rate、Errors、Duration 的定义）"
    claim: RED 方法要求每个服务监控请求速率、错误数与响应时长三项核心指标，是面向请求的服务的最小监控集合。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  - ref: google-sre-book
    locator: "Monitoring Distributed Systems：The Four Golden Signals"
    claim: Google SRE 的四个黄金信号为延迟、流量、错误与饱和度，与 RED 的三项大体对应，多出饱和度一项。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: collect
      id: redboard
      label: RED 仪表盘：速率、错误、时长三格
    - lane: human
      id: oncall2
      label: 值班的人：一眼判断服务还健不健康
      highlight: true
    messages:
    - id: m1
      from: redboard
      to: oncall2
      label: 三个数倒推出用户感受到的服务质量
      active: true
    registers:
    - name: 时长看尾部
      value: 平均值会藏起慢请求，要看第 99 百分位那批
    - name: 适用边界
      value: 只适用于面向请求的服务，后台任务要换指标
  log:
  - at: RED
    text: 给服务看的体检表，三个数先保命
- id: use-method
  title: 第八步：USE 方法——给资源配一张排查表
  tldr: 服务慢，RED 报了症状，病因要往机器里找。USE 方法说：对每一种资源都查三样——利用率、饱和度、错误。这一步重点讲最容易漏看的饱和度。
  body: |-
    场景接着上一步：某服务的时长指标恶化，RED 的三格都亮了，可服务代码刚查过没问题。这时候要换一张表：[[USE 方法]]，由性能专家 Brendan Gregg 提出，思路是对每一种资源——CPU、内存、磁盘、网络——都固定查三样。利用率：这段时间里资源有多少比例在忙。错误：这段时间里出了多少差错，比如磁盘读写错误、网卡丢包。真正的主角是中间那项：饱和度。

    饱和度量的是排队：资源已经满负荷，还有多少活在等着用它。它为什么关键？因为利用率会骗人。一块磁盘利用率 100%，可能只是它一直在高效工作；可一旦请求开始在它面前排长队，每个请求都要多等一截，延迟就是从这里涨起来的。CPU 也一样：利用率高不必然慢，运行队列排起长队才必然慢。只看利用率的人，会在「机器明明没满」和「明明满了却不慢」之间反复困惑，缺的就是饱和度这一格。

    两张表的分工到这里就完整了：RED 站在用户一侧，自上而下发现问题、确认影响面；USE 站在机器一侧，自下而上逐个资源排查病因。排障时先 RED 后 USE，是因为先要确认「用户真的在受影响」，再去机器里翻才有方向——反过来先钻机器，很容易对着一台忙碌但无害的机器耗掉一小时。
  derivation: original
  sources:
  - ref: brendangregg-use
    locator: "The USE Method：Utilization、Saturation、Errors 的定义与资源清单"
    claim: USE 方法要求对每种资源检查利用率、饱和度与错误数三项，其中饱和度（排队程度）是定位性能瓶颈的关键，常被只看利用率的做法漏掉。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: collect
      id: uselist
      label: USE 清单：每种资源查利用率、饱和度、错误
    - lane: app
      id: diskqueue
      label: 磁盘：利用率没满，请求却在排长队
      highlight: true
    messages:
    - id: m1
      from: uselist
      to: diskqueue
      label: 延迟从排队里来，饱和度专门抓它
      active: true
    registers:
    - name: 分工
      value: RED 自上而下确认影响，USE 自下而上逐个资源排查
    - name: 易漏项
      value: 利用率会骗人，排队长度才决定延迟涨不涨
  log:
  - at: USE
    text: 给资源看的排查表，主角是饱和度
- id: sampling-cost
  title: 第九步：采样与成本——全量保存为什么付不起
  tldr: 追踪好用，但账单吓人：大流量下每条追踪几十条记录，全量落盘的存储能涨到每天 TB 级。采样就是在这笔账前低头：只留一部分，留哪部分大有讲究。
  body: |-
    先算账。一个日活不错的系统，每秒五万个请求，每个请求的追踪有十几条跨度记录——一天下来就是几百亿条记录、TB 级别的存储，还没算索引与查询的开销。观测系统本是配角，这个体量却能长成全公司最贵的数据系统之一。日志那边同理：全量留、留很久，账单同样失控。所以问题从来不是「要不要采样」，而是「怎么采，信息损失最小」。

    采法分两大类。头部[[采样]]在请求刚进来时就掷骰子：比如随机留 1%，其余的从头就不记。它的好处是成本可控、实现简单，留下的是无偏的样本，看趋势、算分布都够用；坏处是罕见问题可能一条都没留住——那个一天只发生三次的诡异故障，1% 的采样率下大概率不在库里。尾部采样反过来：先把一次请求的记录都攒齐，等它结束时再决定去留——出错的、超时的、慢的，全留；正常的随机丢。代价是实现复杂：要在内存里先缓存完整追踪再做决定。

    实际系统常是两者混着用：正常流量走低比例随机采样保底，错误与慢请求走尾部规则全留。日志那边是同构的账：错误级别全留、调试级别只在排障窗口临时开。把这笔账记住：采样率不是技术参数，是在为「罕见问题的可见性」付费，付多少，取决于你多怕漏掉那类问题。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: collect
      id: sampler
      label: 采样：进来先掷骰子，或攒齐再决定
    - lane: store
      id: bill
      label: 存储账单：全量是每天 TB 级的量级
      highlight: true
    messages:
    - id: m1
      from: sampler
      to: bill
      label: 正常流量留样本，异常请求尽量全留
      active: true
    registers:
    - name: 头部采样
      value: 进门掷骰子，成本可控，但罕见问题可能漏掉
    - name: 尾部采样
      value: 攒齐再决定，专留出错与慢的，实现更复杂
  log:
  - at: 采样
    text: 采样率是在为罕见问题的可见性定价
- id: alerting-symptoms
  title: 第十步：告警——只为「用户正在受影响」响起
  tldr: 告警最常见的死法不是太少，而是太多太滥，最后被所有人无视。这一步讲一条定盘的规矩：告警盯症状、不盯原因，每一次响起都必须对应一件需要人立刻动手的事。
  body: |-
    先看滥的下场。某团队给每个服务都设了 CPU 超过 90% 的告警，结果每天响几十次，十次里九次用户毫无感觉——批处理任务把 CPU 跑满是人家的本职工作。三个月后，所有人都把这个告警群设了免打扰。第四个月，真出事那次的告警就躺在免打扰里，和前三个月的狼来了混在一起。告警疲劳不是态度问题，是设计问题：每一次假响，都在透支真响时的信任。

    规矩因此只有一条主线：告警盯症状，不盯原因。症状是用户能感受到的东西：错误率超过基线、延迟尾部恶化、支付成功率下跌。这类告警响起，意味着用户此刻正在受损、且需要人动手处理，响得理直气壮。原因类的数字——CPU、内存、磁盘、连接数——留在仪表盘与 USE 清单里，等人被症状告警叫来之后再看，它们是排查工具，不是叫醒工具。

    还有两条配套的卫生习惯。一是每个告警都要有明确的下一步：点开就知道先看哪张图、先查哪条链，写不出下一步的告警不配响。二是告警要定期复盘删减：响过但从没导致任何动作的，降级为普通通知或直接删掉。Google SRE 手册在这件事上的态度很直白：告警的数量宁可少到漏掉边缘情况，也不能多到让人麻木——因为麻木之后，漏掉的就是一切。
  derivation: original
  sources:
  - ref: google-sre-book
    locator: "Monitoring Distributed Systems：告警应基于症状、保持简单与可行动"
    claim: Google SRE 主张告警应针对用户可感知的症状而非内部原因，规则要简单、少而精，每条告警都应指向明确的处理动作，避免告警疲劳。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: store
      id: symptomalarm
      label: 症状告警：错误率与支付成功率越线才响
    - lane: human
      id: trust
      label: 值班的人：响一次就信一次，立刻动手
