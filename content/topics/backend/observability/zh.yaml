        text: 发现、定位、根因，三棒各答一类问题
  - id: red-method
    title: RED 方法：盯紧速率、错误与尾部时长三格服务体检表
    tldr: 在线服务上线不必堆几十张杂乱折线图，盯住请求速率（Rate）、错误数（Errors）与尾部响应时长（Duration）三格就能精准刻画用户体验。
    body: |-
      一个服务随便就能吐出几百项指标，全塞上大盘只会淹没重点。[[RED 方法]]给出了在线服务的最小体检表：**速率（Rate）**看每秒请求数（QPS），刻画流量压力并充当错误率分母；**错误（Errors）**看每秒失败次数，直接计量用户受损面；**时长（Duration）**看耗时分位分布，死盯 `P95` / `P99` 尾部延迟而非平均值——99 人耗时 `20ms`、1 个大客户卡了 `10s`，算术平均才 `120ms` 看似太平，唯独 `P99` 会当场亮红灯。

      这套口诀由 Tom Wilkie（Cortex 作者、Grafana 副总裁）提炼，与《Google SRE 手册》的「四个黄金信号（延迟、流量、错误、饱和度）」同源：前三项一一对应，RED 专盯外部用户体感，特意把偏向机器容量的「饱和度」留给了硬件排查表。

      用 RED 要守两条边界：一是它只管「一问一答」的请求服务，批处理与消息消费者得改看队列积压深度与单批耗时；二是它只报用户症状，若接口变慢是因为宿主机磁盘写满，深挖硬件病因得换下面的 USE 表。
    derivation: original
    sources:
      - ref: grafana-red-method
        locator: "The RED Method: how to instrument your services（Rate、Errors、Duration 的定义）"
        claim: RED 方法要求每个服务监控请求速率、错误数与响应时长三项核心指标，是面向请求的服务的最小监控集合。
        status: verified
        checkedBy: subagent
        checkedAt: "2026-11-17"
      - ref: google-sre-book
        locator: "Monitoring Distributed Systems：The Four Golden Signals"
        claim: Google SRE 的四个黄金信号为延迟、流量、错误与饱和度，与 RED 的三项大体对应，多出饱和度一项。
        status: verified
        checkedBy: subagent
        checkedAt: "2026-11-17"
    canvas:
      kind: swimlane
      actors:
        - lane: collect
          id: redboard
          label: RED 仪表盘：速率、错误、时长三格
        - lane: human
          id: oncall2
          label: 值班的人：一眼判断服务还健不健康
          highlight: true
      messages:
        - id: m1
          from: redboard
          to: oncall2
          label: 三个数倒推出用户感受到的服务质量
          active: true
      registers:
