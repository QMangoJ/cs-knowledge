- id: service
  title: 第五步：连通——Service 给副本组一个固定门牌
  tldr: Pod 天天重建、IP 天天变，调用方要是记 IP，通讯录得天天重印。Service 站在副本组前面：一个不变的地址，靠标签认领背后的 Pod，再把请求分摊过去。
  body: |-
    先看不用它时的麻烦。订单服务要调用库存服务，库存服务有 3 个副本，IP 分别是三个地址。副本重建一次，IP 就变一次；扩容一次，地址就多一个。订单服务要维护一份天天变的地址清单，还要自己决定每次请求发给谁——每个调用方都要重复造这套轮子，而且清单永远追不上变化。

    [[Service]] 的解法是加一个固定入口：你给它起个名字，它就有一个稳定的 IP 与域名，集群内用名字就能访问到它。它靠标签认领背后的 Pod——创建时说好「把带 app=inventory 标签的 Pod 都算作我的人」，之后不管这批 Pod 怎么增减、重建、换 IP，Service 的名单自动跟着更新。请求打到 Service，它再按轮询之类的方式分给名单里的某个 Pod，顺手把负载均衡也做了。

    代价要心里有数：多了一层转发，多了一点延迟与一处可能出故障的环节；而且 Service 的名单更新不是实时的——Pod 刚被删掉的几秒内，名单里可能还留着它，请求打过去会失败，所以客户端的重试仍然省不掉。把入口稳定下来，不等于把失败消灭掉。
  derivation: original
  sources:
  - ref: kubernetes-docs
    locator: "Concepts: Services, Load Balancing and Networking / Service（标签选择器与固定访问入口）"
    claim: Service 用标签选择器圈定一组 Pod，为其提供稳定的 IP 与 DNS 名称，并把请求分发到组内 Pod，屏蔽 Pod 的增减与 IP 变化。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: user
      id: caller
      label: 调用方：只认 Service 的名字
    - lane: ctrl
      id: svc
      label: Service：地址不变，名单按标签自动更新
      highlight: true
    - lane: node
      id: backendpods
      label: 副本组：增减与重建都在名单之外发生
    messages:
    - id: m1
      from: caller
      to: svc
      label: 请求只打这个固定入口
    - id: m2
      from: svc
      to: backendpods
      label: 按名单把请求分给某个活着的副本
      active: true
    registers:
    - name: 认领方式
      value: 靠标签圈定 Pod 集合，名单随副本增减自动更新
    - name: 提醒
      value: 名单更新有几秒延迟，客户端重试仍然省不掉
  log:
  - at: 连通
    text: 入口固定、名单自更新，调用方不用再追着 IP 跑
- id: scheduler
  title: 第六步：放置——调度器怎么给 Pod 选机器
  tldr: 新 Pod 出生时还没有家，调度器负责给它选一台节点：先按硬条件筛掉不合格的，再按软偏好打分挑最好的。这一步看它做决定时到底在算什么。
  body: |-
    先看它手里有什么信息。每个 Pod 在声明时都会写上自己的资源请求：比如需要 2 个核的 CPU、4GB 内存。集群里每台节点还剩多少，也是明账。调度器（kube-scheduler）的工作分两段。第一段叫过滤：逐台检查硬条件——剩下的资源够不够这个 Pod 申请的量、有没有它不能忍受的污点、有没有它指定必须避开或必须靠近的对象。不合格的直接出局。第二段叫打分：给剩下的合格节点逐项打分，比如哪台更空闲、把同服务的副本摊得更开、镜像已经拉过的节点启动更快，最后挑总分最高的那台，把「这个 Pod 归这台节点」的决定写进集群状态。

    这里有个特别常见的坑：调度器算账用的不是 Pod 实际用多少，而是它声明申请多少。申请写大了，节点明明空着也会被判定「放不下」；申请写小了，一台机器塞进太多 Pod，真忙起来互相抢资源。所以资源请求不是随便填的数，它是调度质量的地基——填得准不准，直接决定集群是浪费还是拥挤。

    还要注意调度器只做决定、不干活：它选完机器就撒手了，Pod 在那台机器上能不能真跑起来，是下一步 kubelet 的事。排障时先分清卡在哪一段：Pod 一直挂在等待状态，多半是没被调度上；已经被分配了机器却起不来，问题在本机执行环节。
  derivation: original
  sources:
  - ref: kubernetes-docs
    locator: "Concepts: Scheduling / kube-scheduler（过滤与打分两阶段）"
    claim: kube-scheduler 为待调度的 Pod 选择节点：先按资源与约束过滤不合格节点，再对剩余节点打分排序，依据是 Pod 声明的资源请求而非实际用量。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: sched
      id: scheduler2
      label: 调度器：先过滤，再打分，只做决定
    - lane: node
      id: nodes
      label: 候选节点：有的资源不够，有的正合适
      highlight: true
    messages:
    - id: m1
      from: scheduler2
      to: nodes
      label: 按声明的资源请求算账，不看实际用量
      active: true
    registers:
    - name: 两阶段
      value: 过滤淘汰不合格节点，打分在合格者里挑最好
    - name: 常见的坑
      value: 资源请求写不准，集群不是浪费就是拥挤
  log:
  - at: 放置
    text: 调度只做决定，依据是声明的资源请求
- id: kubelet
  title: 第七步：落地——kubelet 在每台机器上干什么
  tldr: 决定做完了，谁来执行？每台节点上都住着一个 kubelet：它盯着分给本机的 Pod 清单，指挥容器运行时拉镜像、起容器，再把健康状况源源不断报回控制面。
  body: |-
    把镜头切到一台具体的节点上。[[kubelet]] 是装在每台工作节点上的代理程序，它的日常是：从控制面拿到「这台机器应该有这些 Pod」的清单，对照本机现状，缺哪个就动手补哪个。它指挥本机的容器运行时去拉镜像、按 Pod 的声明把容器一个个建出来、挂上存储、接好网络——上一课讲的那些容器操作，在这里由它逐项落实。

    容器起来之后它的活还没完。Pod 里可以声明两类探针：一类问「活着吗」，答不上来就重启这个容器；一类问「能接客了吗」，没准备好之前，Service 的名单里不会把它算进去。kubelet 周期性地执行这些探针，并把每个 Pod 的状态、每个节点的资源余量持续汇报回控制面——控制面之所以「知道」集群的实际状态，靠的就是所有 kubelet 的汇报拼图。

    排障时这一步的知识很实用：如果 Pod 被分配了机器却一直起不来，看 kubelet 的日志与事件，十有八九是镜像拉不下来、配置对不上或者探针一直不通过——这些都是本机执行环节的问题，跟调度器无关。
  derivation: original
  sources:
  - ref: kubernetes-docs
    locator: "Concepts: Architecture / kubelet（节点代理的职责与探针）"
    claim: kubelet 是每台节点上的代理，负责让分给本机的 Pod 真正运行：驱动容器运行时启动容器、执行存活与就绪探针、向控制面汇报状态。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: ctrl
      id: desired
      label: 控制面：这台机器应有这些 Pod
    - lane: node
      id: kubelet1
      label: kubelet：拉镜像、起容器、跑探针、报状态
      highlight: true
    messages:
    - id: m1
      from: desired
      to: kubelet1
      label: 清单下发到本机，缺哪个补哪个
    - id: m2
      from: kubelet1
      to: desired
      label: 健康与状态持续汇报回去
      active: true
    registers:
    - name: 两类探针
      value: 存活探针决定要不要重启，就绪探针决定要不要接流量
  log:
  - at: 执行
    text: 决定归调度器，落地归每台机器上的 kubelet
- id: declarative-loop
  title: 第八步：声明式与自愈——把前面几步串成一个模型
  tldr: 现在把零件拼成整机：你只写期望状态，一圈圈控制器不停地对比期望与实际、动手补齐差距。节点宕机后应用自己搬家，就是这个模型最有代表性的一幕。
  body: |-
    先看一幕完整的自愈。一台节点突然宕机，它上面的五个 Pod 全部失联。控制面从 kubelet 汇报的中断察觉到这件事，先把这台节点标记为不可用；各个控制器随即发现：好几个服务的实际副本数都比期望少了。于是它们补建新的 Pod，调度器把新 Pod 放到还活着的节点上，那些节点的 kubelet 把容器拉起来，Service 的名单自动更新。全程没有人参与，几分钟后集群回到期望状态——只是少了一台机器的容量。

    这就是[[声明式]]与控制循环合起来的样子。你交出去的不是一串操作命令，而是一份「应该是什么样」的声明；系统内部有许多个控制器，每个都只盯一类对象，不停地循环三件事：读期望、读实际、动手缩小差距。[[自愈]]不是某个单独的功能，而是所有控制器一直在转的自然结果。

    与它相对的是命令式：你一步步命令系统做动作，做错了、做到一半断了，系统就停在中间状态，谁也不知道最终想要什么。声明式的代价是多了一层间接——你想让某件事立刻发生，得改声明再等循环转过来；排查「为什么会这样」也要顺着控制器的视角去理解。但在故障是常态的集群里，这笔交换是划算的：目标被明确记录下来，系统才有机会在任何故障之后自己走回来。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: ctrl
      id: controllers
      label: 控制器群：各自盯一类对象的状态差距
    - lane: node
      id: deadnode
      label: 宕机的节点：上面的 Pod 在别处重建
      highlight: true
    messages:
    - id: m1
      from: controllers
      to: deadnode
      label: 发现副本不够，补建、调度、拉起，一气呵成
      active: true
    registers:
    - name: 循环三件事
      value: 读期望、读实际、动手缩小差距，无限循环
    - name: 自愈的本质
      value: 不是某个功能，是所有控制器一直在转的结果
  log:
  - at: 模型
    text: 声明期望、循环对齐，故障后自己收敛回目标
- id: rolling-update
  title: 第九步：换版——滚动更新的机制，与它的回滚
  tldr: Deployment 换版本时，新旧两个 ReplicaSet 此消彼长：新副本一个个起来、验过，旧副本一个个退场，全程不停机。出问题时回滚，就是把这场交接反着走回去。
  body: |-
    把第四步留的尾巴接上。你改了 Deployment 里的镜像版本，系统不会把旧副本一口气全删掉重来。它会新建一个对应新版本的 ReplicaSet，先让它起一小批新 Pod；新 Pod 就绪之后，再让旧 ReplicaSet 缩掉一批旧 Pod。如此交替，直到旧副本清零、新副本补满。这期间两个版本同时在提供服务，总容量始终维持在可用线以上——这就是滚动更新。

    有两个参数在背后掌舵：最多允许多少个副本暂时超出期望（决定换版的速度），最多允许多少个副本暂时不可用（决定换版期间的容量底线）。把它们都设成保守值，换版慢但稳；放得松，换得快但风险窗口大。策略本身没有对错，只有与业务风险偏好的匹配。

    回滚是这个机制的另一面：Deployment 记着历次的版本记录，回滚就是让旧版本的 ReplicaSet 重新扩回来、新版本的缩回去，走一遍反向的交接。所以回滚不需要你「重新部署一遍旧代码」，它和发布共用同一套数人头机器。至于新版本该先放多少流量试水、看哪些指标决定去留——那是发布策略的账，下一课专门算；这一课把机制看清就够了。
  derivation: original
  sources:
  - ref: kubernetes-docs
    locator: "Concepts: Workloads / Deployment：Updating a Deployment 与 Rolling Back a Deployment"
    claim: Deployment 更新时以滚动方式用新 ReplicaSet 逐步替换旧副本，受最大超出与最大不可用两个参数约束；回滚通过恢复旧 ReplicaSet 的副本数实现。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: ctrl
      id: deploy
      label: Deployment：让新旧两批副本交替增减
    - lane: node
      id: mixpods
      label: 副本群：新版逐个上岗，旧版逐个退场
      highlight: true
    messages:
    - id: m1
      from: deploy
      to: mixpods
      label: 总容量不跌破底线，交接全程不停机
      active: true
    registers:
    - name: 两个参数
      value: 最多超出几个、最多少几个可用，决定换版快慢与风险
    - name: 回滚
      value: 让旧版本的 ReplicaSet 重新扩回来，反向走一遍交接
  log:
  - at: 换版
    text: 新旧交替增减，回滚与发布共用同一套机器
- id: costs
  title: 第十步：代价——Kubernetes 本身也要有人养
  tldr: 管家不是免费的：Kubernetes 自己就是一套复杂系统，概念、组件、故障面都摆在那里。这一步把使用它的真实成本摆出来，免得把它当成不要钱的银弹。
  body: |-
    先数概念成本。从这一课你已经见过 Pod、Deployment、ReplicaSet、Service、调度器、kubelet，再往下还有配置管理、密钥、存储卷、网络策略、权限模型一大串对象等着学。一个新工程师从「会写业务代码」到「能独立排查集群问题」，中间隔着几个月的学习曲线——这不是谁笨，是这套系统的概念面确实大。

    再数运维成本。控制面组件要升级、证书要轮换、版本要跟进；集群出故障时，排查链路比单机长得多：一个请求失败，可能出在应用、Service、网络插件、节点、控制面的任何一环。云厂商的托管服务（比如各家的 Kubernetes 托管版）能把控制面的运维包走，省掉最重的一块，但你的应用对象怎么设计、出了事怎么查，仍然是你自己的事——托管省的是力气，不是理解。

    所以正确的提问方式不是「要不要用最先进的」，而是「我的规模付这份成本划不划算」。下一课之前先把判断线画出来，放在最后一步：如果你的服务数量与机器规模还没让「靠人排班」真正痛起来，这份成本就还没到该付的时候。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: user
      id: team
      label: 团队：要学概念、要养控制面、要查长链路
    - lane: ctrl
      id: k8sitself
      label: Kubernetes 本体：它自己也是一套大系统
      highlight: true
    messages:
    - id: m1
      from: team
      to: k8sitself
      label: 托管能包走控制面运维，包不走理解成本
      active: true
    registers:
    - name: 两笔成本
      value: 概念学习以月计，故障排查链路比单机长得多
  log:
  - at: 代价
    text: 管家也要领工资，先算规模再决定雇不雇
- id: when-k8s
  title: 第十一步：收束——什么时候该上，什么时候先等等
  tldr: 收成一条判断线：服务与机器的规模、发布频率、团队的运维能力，三者有一条没到位，就先用更简单的方案。最后把整课的模型再压缩成一句话带走。
  body: |-
    先给判断线。符合下面这些画面时，Kubernetes 的成本开始算得过来：服务有几十个量级、散在十几台以上的机器上；每周发布很多次，手工排班与发布已经真实地痛；团队里有人能专职管平台。反过来，三个服务、两台机器、一周发一次版的系统，用单机容器编排工具（比如 Docker Compose）甚至云厂商的托管容器服务就够了——它们把放置与重启这些基础活也能干，只是没有这么强的自愈与扩展，把复杂度留到你真正需要的那天再付。

    还要破一个迷思：上了 Kubernetes 不等于有了可靠性。它给的是机制——副本、自愈、滚动更新；用得对不对，取决于你的服务是不是真的无状态、探针配得对不对、资源请求填得准不准。机制是地板，不是天花板。

    整课压缩成一句话：Kubernetes 把「运维一个集群」变成了「维护一份期望状态」——你声明，控制器对齐，调度器放置，kubelet 执行。下一课我们把镜头转向这份声明的上游：新版本的镜像是怎样被流水线造出来、验过、再送到集群手里的。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: user
      id: judge
      label: 做判断的人：规模、频率、人力三条线
    - lane: node
      id: simple
      label: 更简单的方案：单机编排或云托管容器服务
      highlight: true
    messages:
    - id: m1
      from: judge
      to: simple
