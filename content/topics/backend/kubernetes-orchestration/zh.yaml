overview:
- key: 一句话总结
  value: Kubernetes 是一个集群级的管家：你告诉它「这个服务要 3 个副本、用这个版本的镜像」，它负责把副本放到合适的机器上、挂了就补、换版本时逐个替换、给一组副本留一个固定入口。你管声明，它管执行。
- key: 编排四件事
  value: 编排系统要接手的活可以归成四件：放置——每个容器去哪台机器；保数——说好几个副本就一直保持几个；连通——副本换来换去，调用方用的地址不能变；换版——发新版本时不停机地逐个替换，出事能退回去。
- key: Pod
  value: Pod 是调度的最小单位，不是一个容器，而是一组注定要同生共死的容器：它们共享同一个 IP、同一套端口，也能共享存储。最常见的组合是一个主容器，再加一个帮它收集日志或同步配置的边车容器。
- key: 期望状态
  value: 整个系统只认一件事：你声明的期望状态，与集群当前的实际状态。两者不一致，就有控制器动手补齐差距。副本少了补副本，节点死了把上面的应用搬到别的节点重建——自愈不是魔法，是这个对比一直在进行。
- key: 调度与执行
  value: 做决定和干活的是两拨组件：调度器只负责选机器，选好之后在本机待命的 kubelet 负责把容器真正拉起来，并持续汇报每个容器的健康状况。控制面里其余的控制器，各自盯着一类对象的状态差距。
- key: 代价
  value: Kubernetes 自己就是一个需要专人维护的复杂系统：概念多、组件多、出故障时排查的链路也长。服务只有三五个时上它，多半是拿大炮打蚊子；托管服务能省掉养控制面的力气，但省不掉理解这套模型的力气。
- key: 谁在用
  value: 它已经是容器编排的事实标准：各大云厂商都提供托管版本，稍有规模的在线服务基本都跑在它上面。但「标准」不等于「默认必选」——该不该上，取决于你的服务数量、机器规模和发布频率，这笔账本课最后一步会算。
summary: 上一课的容器跑在一台机器上岁月静好，可真实系统是另一幅画面：两百个容器散在二十台机器上，凌晨三点挂掉一个，谁去把它拉起来？流量涨了要扩容，谁来决定新副本放哪台？Kubernetes 就是被请来接手这摊事的编排系统。本课不背命令，只把它的工作模型讲透：编排到底在编排哪四件事、Pod 为什么是最小单位、声明式与自愈是怎么一回事、调度器与 kubelet 各自负责哪一段。
premise: 这节课的问题是：容器解决了一个服务怎么打包、怎么在一台机器上跑，可一堆容器加一堆机器的局面，谁来管？你不可能雇人二十四小时盯着每个容器——凌晨三点挂掉的那一个，等人爬起来处理，黄花菜都凉了。需要一个不知疲倦的管家，它就是这一课的主角。
position: 本课位于后端工程学科的第二段「编排：Kubernetes」，紧接《容器与 Docker》：上一课交付的镜像与容器，在这一课里变成被排班、被补数、被换版的对象。它也为后面两课打底——流水线发布的制品最终要交给编排系统上线，链路追踪要看的请求正是在这些副本之间流动的。
level: 进阶
minutes: 26
prereq:
- backend/docker-containers
objectives:
- 能说清编排要接手的四件事：放置、保数、连通、换版
- 能解释 Pod 为什么是最小调度单位，以及它与容器的关系
- 能讲清 Deployment、ReplicaSet、Service 各自负责什么
- 能描述一次调度与自愈的完整过程：调度器选机器、kubelet 落地、控制器补差距
aiLink: 整课抓住一个模型就够了：你声明期望状态，系统用一圈圈控制循环把实际状态往期望上拉。Pod、副本、调度、自愈，全是这个模型的不同侧面。
bridge:
  prev: 上一课把容器讲清了：镜像负责打包与分发，命名空间与控制组负责隔离与限额，一个服务能在一台机器上安稳地跑。可那一课结尾的问题还悬着——容器上了规模之后，放置、补充、替换这摊排班的活，靠人是盯不过来的。
  next: 集群管家已经就位，可还有一件事它不管：新版本的镜像是怎么被造出来、验过之后送到它手里的。下一课讲 CI/CD 与发布策略——从提交代码到新版本面对真实用户，中间那条自动流水线与两种放量的打法。
design:
- mechanism: 只声明期望状态
  problem: 如果运维靠一条条命令操作集群，命令执行到一半失败、或者两个人同时改，集群就会停在某个谁也说不清的中间状态，事后也无法复现当时到底想要什么。
  choice: 让使用者只提交一份「想要的最终状态」的声明，系统自己比较期望与现实的差距并动手补齐；声明本身存进集群，成为唯一算数的事实来源。
  tradeoff: 声明错了，系统会一丝不苟地把错误状态维持下去；且「为什么现在是这样」要顺着控制器的动作去推，排查比命令式多绕一层。
  root: 集群是一个一直在变的活物，与其记录每一步操作，不如记录目标本身——目标不变，系统就能在故障之后自己把路重新走完。
- mechanism: 控制器循环对齐现状
  problem: 副本会挂、节点会宕机、网络会抖动，任何一次性的检查都保不住状态：你检查完转身，它就又变了。
  choice: 为每类对象设一个控制器，不停地循环做同一件事：看期望、看现状、动手缩小差距。所有控制器的动作拼起来，就是集群的自愈能力。
  tradeoff: 系统永远在「追赶」而不是「到达」，短时不一致是常态；控制器太多时，两个控制器对同一对象的理解不一致还会互相打架。
  root: 在故障是常态的环境里，可靠不是「不出错」，而是「出错后能自己收敛回目标」——控制循环把这件事变成了默认行为。
- mechanism: 调度与执行分家
  problem: 选机器需要全局视野（哪台还有空、哪台更合适），拉容器需要本机权限与实时状态，两件事挤在一个组件里，规模一大就互相拖累。
  choice: 调度器只做决定：给新 Pod 选一台节点并把决定写进状态；每台节点上的 kubelet 只做执行：盯着分给自己的清单，把容器拉起来并汇报健康。
  tradeoff: 决定与执行之间多了一次状态传递，排障时要分清「没被调度上」和「调度上了但没跑起来」是两个不同环节的问题。
  root: 这是分布式系统里反复出现的分工：集中决策换全局最优的大局观，本地执行换故障隔离与扩展性，两边用一份共享状态对接。
quiz:
- q: Pod 与容器的关系，正确的说法是？
  options:
  - Pod 就是容器的另一个名字
  - Pod 是调度单位，一组必须同机运行、共享网络与存储的容器装在一个 Pod 里
  - 一个容器里可以装多个 Pod
  - Pod 是一种特殊的镜像格式
  answer: 1
  explain: 调度器排的是 Pod 不是单个容器：同 Pod 的容器共享同一个 IP 与端口空间、可以共享存储卷，代价是它们必须落在同一台机器上、同生共死。
- q: 你声明某服务要 3 个副本，夜里一个副本崩溃了，接下来会发生什么？
  options:
  - 等运维早上发现再手动拉起
  - ReplicaSet 控制器发现实际只有 2 个，立刻补建一个新 Pod，调度器再给它选一台机器
  - 整个服务自动重启一遍
  - 崩溃的那个 Pod 会被原地修复
  answer: 1
  explain: 这就是控制循环在工作：控制器持续对比期望与实际，少了就补。补建的是新 Pod 而不是修旧的——Pod 被当作随时可替换的消耗品，这也是为什么状态不能存进 Pod 本地。
- q: Pod 的 IP 每次重建都会变，调用方为什么还能稳定地找到这个服务？
  options:
  - Pod 重建时会继承旧 IP
  - Service 提供固定 IP 与域名，靠标签选中背后的 Pod 并分摊请求，Pod 怎么换都不影响入口
  - 调用方每次调用前先查一遍 Pod 列表
  - 因为 Pod 其实很少重建
  answer: 1
  explain: Service 是副本组对外的固定门牌：它盯着带指定标签的 Pod 集合，谁在就把流量分给谁。副本的增减与重建，对调用方完全透明。
- q: 调度器（kube-scheduler）与 kubelet 的分工是？
  options:
  - 调度器负责拉镜像，kubelet 负责选机器
  - 调度器只做决定：给新 Pod 选一台节点；kubelet 只做执行：在本机把容器拉起来并汇报状态
  - 两者是同一个组件的两个名字
  - kubelet 负责整个集群的调度
  answer: 1
  explain: 集中决策、本机执行：调度器站在全局视角挑机器，kubelet 是每台节点上的代理，把分给本机的 Pod 清单变成真实运行的容器，并持续上报探针结果。
steps:
- id: night-shift-problem
  title: 第一步：场景——凌晨三点，挂掉的那个容器
  tldr: 两百个容器、二十台机器，凌晨三点其中一个容器崩了。靠人处理，流程是被告警吵醒、登录、找机器、重启、验证——这一步先把「靠人排班」这条路走到黑，看它到底缺了什么。
  body: |-
    把场景摆具体。一个中等规模的系统：二十台机器，上面跑着两百个容器——几十个服务，每个服务三五个副本，再加上日志收集、监控探针这些配角。凌晨三点，其中一个订单服务的副本崩了。这时候如果一切靠人：值班的人被告警吵醒，爬起来登录机器，先要弄清挂的是哪个服务的哪个副本、在哪台机器上，然后手动把它重新拉起来，再确认服务恢复正常。一套流程走完，快则二十分钟，慢则一个小时，而这期间那个服务一直少一个副本在硬撑。

    更要命的是，这还只是「挂了一个」的情况。真实世界的问题是一串：流量突然涨了，副本不够用，要往哪台机器上加？一台机器要下线维护，上面的十几个容器往哪儿搬？新版本上线，两百个容器按什么顺序换、换到一半发现有问题怎么退？每一件都是排班问题，而排班的频率与规模，早就超过了人能盯的上限。

    所以需要一个不知疲倦的管家：它时刻知道每个服务应该是什么样，发现不对就自己动手纠正。[[Kubernetes]] 就是目前最主流的那个管家——它自称容器编排系统。这一课不急着学它的命令，先把它要接手的活看清楚。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: user
      id: oncall
      label: 值班的人：被告警吵醒再手工处理
    - lane: node
      id: crashed
      label: 崩掉的副本：服务少一条腿在硬撑
      highlight: true
    messages:
    - id: m1
      from: crashed
      to: oncall
      label: 从发现到恢复，快二十分钟慢一小时
      active: true
    registers:
    - name: 规模
      value: 二十台机器、两百个容器，排班频率超过人能盯的上限
    - name: 问题清单
      value: 挂了谁补、扩容往哪放、换版按什么顺序，全是排班问题
  log:
  - at: 场景
    text: 靠人排班的瓶颈不在技术，在频率与规模
- id: four-jobs
  title: 第二步：编排到底在编排什么——四件事
  tldr: 把管家要接手的活拆成四件：放置、保数、连通、换版。后面每个概念都只是这四件事里某一件的具体解法，先把清单立住，后面就不会迷路。
  body: |-
    第一件是放置。来了一个新容器，它该去哪台机器上跑？要考虑的因素很实际：哪台机器还剩得下它要的 CPU 与内存，它和谁不能挤在一起（比如同一服务的两个副本最好别放同一台，一宕机就全没），它和谁最好挨着（比如要频繁通信的两个服务）。这本质上是一个持续进行的装箱问题。

    第二件是保数。说好一个服务保持三个副本，就要一直是三个：挂了一个补一个，机器下线了在别处重建，多了就删掉。第三件是连通：副本天天在增减与重建，IP 地址换来换去，可调用方不能天天改配置——得有一个永远不变的入口，站在副本组前面。第四件是换版：新版本要替换旧版本，替换得平滑——不能停机、不能一次全换（万一新版本有问题就全军覆没），出了事还要能退回旧版。

    记住这四件事的分工：放置归调度器，保数归控制器，连通归 Service，换版归 Deployment。接下来一步拆一件，每件都先看不用它时的痛，再看它怎么解。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: ctrl
      id: manager
      label: 编排系统：四件事一起扛
    - lane: node
      id: fleet
      label: 机器与容器：被放置、被计数、被访问、被替换
      highlight: true
    messages:
    - id: m1
      from: manager
      to: fleet
      label: 放置、保数、连通、换版，四件活同时在转
      active: true
    registers:
    - name: 分工预告
      value: 放置归调度器，保数归控制器，连通归 Service，换版归 Deployment
  log:
  - at: 定义
    text: 编排等于放置、保数、连通、换版四件事的合集
- id: pod
  title: 第三步：Pod——最小单位为什么不是容器
  tldr: 调度器排班的最小单位不是容器，而是 Pod：一组必须待在同一台机器、共享网络与存储的容器。先看一个「两个容器必须同生共死」的场景，就明白为什么要多这一层。
  body: |-
    先看场景。一个 Web 服务容器，每写一行日志就希望有个搭档立刻把日志收集走、转发到日志系统。这个搭档离远了不行：它得读主容器写的同一个日志文件，还得和主容器共用网络身份——外面访问进来的是一个地址，进来之后由搭档里的另一个进程做点预处理也很常见。这类「必须贴在一起」的容器组合，如果按单个容器排班，调度器可能把它们拆到两台机器上，整个搭配当场散架。

    [[Pod]] 就是为这种组合设的单位：一个 Pod 里装一组容器，调度器保证它们落在同一台机器上。它们共享同一个 IP 地址和同一套端口——所以同 Pod 的两个容器不能监听同一个端口，它们之间用本机地址就能互相访问；它们还能挂载同一批存储卷，共享文件。主容器加一个辅助容器是最常见的配方，辅助的那个有个专门的名字，叫边车（sidecar）容器，日志收集、流量代理、配置同步都是它常干的活。

    代价是 Pod 被设计成消耗品：它会被随时删掉重建，IP 会变，本地文件默认也不保留。所以有两条纪律要先记住：不要把需要长期保存的数据只存在 Pod 本地；不要把某个 Pod 的地址写死在别处——找服务要走下一步的 Service。
  derivation: original
  sources:
  - ref: kubernetes-docs
    locator: "Concepts: Workloads / Pods（Pod 的定义与共享网络、存储的语义）"
    claim: Pod 是 Kubernetes 可创建与管理的最小部署单位，一组容器共享网络命名空间（同一 IP 与端口空间）与存储卷，必须同机运行。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: sched
      id: scheduler1
      label: 调度器：以 Pod 为单位安排机器
    - lane: node
      id: pod1
      label: 一个 Pod：主容器加边车容器，同机同 IP
      highlight: true
    messages:
    - id: m1
      from: scheduler1
      to: pod1
      label: 整个 Pod 一起落到一台机器，不拆开
      active: true
    registers:
    - name: 共享
      value: 同 Pod 内容器共享 IP 与端口空间，也能共享存储卷
    - name: 纪律
      value: Pod 随时会被重建，数据别只存本地，地址别写死
  log:
  - at: 单位
    text: 排班排的是 Pod，同生共死的容器装进同一个 Pod
- id: deployment-replicaset
  title: 第四步：保数——Deployment 与 ReplicaSet
  tldr: 你只需要声明「这个服务要 3 个副本」，剩下的数人头工作交给控制器：ReplicaSet 负责数着副本个数，Deployment 在它上面再管版本。这一步看杀掉一个 Pod 之后系统怎么自己补齐。
  body: |-
    还是动手实验最直观。假设你已经声明某服务要 3 个副本，三个 Pod 正在三台机器上跑着。现在你手动删掉其中一个——什么都不用做，几秒钟后，一个新的 Pod 会被建出来、被调度到某台机器上、启动完成，副本数回到 3。补副本的不是人，是控制器在不停地数人头：它发现实际数量比声明的少，就动手补齐。

    这里有两层对象要分清。直接数人头的是 [[ReplicaSet]]，它的工作只有一件：保证带某种标签的 Pod 恰好有声明的那么多个。而你日常打交道的其实是它上层的 [[Deployment]]：你向 Deployment 声明的是「这个应用要 3 个副本、用这个版本的镜像」，它去创建一个 ReplicaSet 来落实数量。为什么中间要隔一层？因为换版本时 Deployment 会再建一个新的 ReplicaSet，让新旧两个 ReplicaSet 一个加、一个减，滚动替换就这么实现的——那是第九步的内容，这里先记住分工：Deployment 管「哪个版本、几个副本」，ReplicaSet 管「数着人头补齐」。

    这套机制的前提是服务能随时多一个、少一个而不出事，也就是所谓无状态：请求处理到一半的状态不能只攒在某个副本的内存里。有状态的服务在 Kubernetes 里有专门的另一套对象，本课不展开，但你要知道 Deployment 这条路默认走的是无状态服务。
  derivation: original
  sources:
  - ref: kubernetes-docs
    locator: "Concepts: Workloads / Deployment 与 ReplicaSet（副本保障与版本管理的分工）"
