  log:
  - at: 动机
    text: 先确认痛是真的，再谈拆不拆
- id: call-becomes-network
  title: 第二步：第一笔税——函数调用变成网络调用
  tldr: 拆完的第一天就要付的税：下单调库存，原来是进程内的一次函数调用，微秒级、要么成要么抛异常；拆开后变成网络调用，毫秒级，还多了一种失败——对方可能已经扣了库存，只是答复在路上丢了。
  body: |-
    先算延迟账。进程内函数调用是纳秒到微秒量级，一次下单在单体内串十几个调用，用户毫无感觉。拆成服务后，每次跨服务调用要走网络、序列化、对方排队与处理，局域网内一次也要零点几到几毫秒——慢了三个数量级。一条链串上十个服务，光调用开销就能吃掉几十毫秒，链越长越疼。这决定了拆分的粒度不能太细：按业务拆成几个粗粒度服务是常态，拆成几十个小碎块，光税就把收益吃光。

    再算失败账，这是更要命的一笔。函数调用的失败是干净的：抛异常，你知道它没成。网络调用有第三种结局：请求发出去，对方执行完了，答复在回程丢了——你不知道成没成。重试可能造成重复扣减，不重试可能漏掉已成的操作。解法在前面的课里都备好了：[[幂等键]]让重试安全，超时与重试预算控制代价，实在拿不准就靠对账兜底。

    这笔税的结论是：拆分不是把代码剪开就完事，是把每一处调用的语义都从「确定的」换成「要防失败的」。调用点越多，税越重——所以拆分前先数调用关系，比先画架构图重要。
  derivation: original
  canvas:
