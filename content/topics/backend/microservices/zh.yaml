- id: gateway-bff
  title: 必配设施二：用[[网关]]收拢大门，严防往里塞业务逻辑
  tldr: 网关站在所有微服务最前排统一终结 TLS、验登录票、做限流与路由分发；一旦往网关里写业务规则，它就会腐化成更难拆的新单体。
  body: |-
    后端拆成三十个服务，总不能让前端网页和手机 App 记住三十个域名，更不能把[[TLS]]解密、JWT 验票、全局[[限流]]的代码在三十个仓库里各抄一遍。API [[网关]]把对外大门重新收拢成唯一入口：外部请求先进门验完身份、扣完限流配额，再按路径转发给身后的订单或商品服务。遇到首页需要同时拉取商品、评价、优惠券三家数据时，网关或按端定制的 BFF（Backend For Frontend，手机端与网页端各配一层轻裁剪层）还能并行调齐拼好一次性回传，省去手机弱网下来回跑三趟。

    用网关最忌讳越界：它只准干与具体业务无关的「横切保安活」，半行优惠券怎么算、库存怎么扣的业务规则都不许沾。不少团队图一时省事往网关里堆业务判断，两年后所有团队发版又得排着队改同一个网关仓库——生生把网关养成了全公司最脆弱的新单体。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: team
      id: client
      label: 客户端：只认一个大门
    - lane: infra
      id: gw
      label: 网关：验票、限流、分发、聚合
    - lane: services
      id: svc
      label: 几十个服务：只管业务，不再各自设门
      highlight: true
    messages:
    - id: m1
      from: client
      to: gw
      label: 所有外部请求先过这道门
    - id: m2
      from: gw
      to: svc
      label: 按路径分发，顺手聚合多服务数据
      active: true
    registers:
    - name: 腐化警报
      value: 网关开始写业务规则，就是新单体在长成
  log:
  - at: 配套二
    text: 入口收成一个，门口的活只做一次
- id: circuit-breaker
  title: 必配设施三：装上[[熔断器]]当保险丝，防慢下游拖垮全站
  tldr: 库存服务慢到 10 秒时，订单服务的 200 个工作线程 2 秒就会全被挂死；熔断器在错误或超时过线时果断跳闸走降级，掐断雪崩传染链。
  body: |-
    多服务调用链上最凶险的不是某个下游直接挂掉报错，而是它「半死不活地变慢」。算一笔雪崩账：订单服务配了 200 个工作线程，平时调库存只需 10 毫秒；某天库存库抖动，每次响应拖到 10 秒，而前台每秒照常涌进 100 笔下单请求——短短 2 秒钟，200 个线程就会全部卡死在等库存回包上，连完全不沾库存的「查历史订单」接口也一起瘫痪，紧接着把更上游的网关也拖死。

    [[熔断器]]（早期由 Netflix Hystrix 做成代码库普及，如今多下沉到 Envoy 等服务网格代理中）就是串在调用链上的自动空气开关。它实时统计对某个下游的调用结果：一旦最近窗口内超时或错误率突破阈值（比如过半），立刻「跳闸断开」——后续请求压根不再发往库存服务，微秒级直接返回失败并触发业务降级（比如提示稍后重试或先收下预约单）；隔几秒进「半开态」放三五个试探请求过去，确认库存恢复回 10 毫秒才重新合闸。记住分布式铁律：慢比报错更具传染性，要死就得快死。
  derivation: original
  sources:
  - ref: envoy-circuit-breaking
    locator: "Envoy 文档: Circuit breaking 的阈值与异常值检测"
    claim: 服务网格与代理层普遍内置熔断：按待处理请求、连接与错误率等阈值限制对故障上游的继续调用，防止级联失败扩散。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: services
      id: ord
      label: 订单服务：200 个线程在等库存
    - lane: services
      id: inv
      label: 库存服务：每个请求慢到 10 秒
    - lane: infra
      id: cb
      label: 熔断器：失败过半就跳闸，走降级
      highlight: true
    messages:
    - id: m1
      from: ord
      to: inv
      label: 两秒内线程全卡在等待上
    - id: m2
      from: cb
      to: ord
      label: 跳闸后请求立刻失败，不再傻等
      active: true
    registers:
    - name: 雪崩的账
      value: 每秒进 100、每个等 10 秒，2 秒占满 200 线程
    - name: 熔断的要义
      value: 慢比失败更具传染性，失败要快
  log:
  - at: 配套三
    text: 保险丝断的是传染链，保的是全链的命
- id: config-center
  title: 必配设施四：用[[配置中心]]热推动态开关，靠本地[[缓存]]兜底
  tldr: 数据库地址等静态项仍走启动环境变量，而限流阈值与[[功能开关]]归配置中心集中存管并秒级热推全网实例，实例本地落盘备份防中心宕机。
  body: |-
    单机部署时改一行 `.env` 重启一个进程不过两秒钟；可到了三十个服务、两百个容器实例的阵列里，大促洪峰突然杀到想把[[限流]]阈值调低一半，或者紧急关掉某个出故障的[[功能开关]]，总不能挨个改配置再把两百个实例全重启一遍。静态配置（数据库地址、监听端口）依旧归启动时的环境变量管，运行期随时要拧的动态旋钮就得请出[[配置中心]]。

    配置中心把全站动态参数收拢在一张带版本审计的控制台里：实例启动时先拉取一份，运行期间管理员在页面上改个开关，中心通过长连接几秒内把新值推给所有在线实例，内存热更新当场生效，改错了还能一键回滚到上一版。不过它自己一旦成了全网依赖，就必须防单点故障：客户端 SDK 每次拿到配置都要顺手在本地磁盘存一份[[缓存]]快照——哪怕配置中心整集群挂掉，所有业务实例也能攥着最后一份有效配置照常接客。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: infra
      id: cc
      label: 配置中心：一处改值，全网推送
    - lane: services
      id: fleet
      label: 几十个实例：热加载新配置，不用重启
      highlight: true
    messages:
    - id: m1
      from: cc
      to: fleet
      label: 限流阈值改一处，几秒内全网生效
      active: true
    registers:
    - name: 与环境变量的分工
      value: 静态配置归注入，动态配置归中心
    - name: 兜底
      value: 中心挂了，实例拿本地缓存的配置继续跑
  log:
  - at: 配套四
    text: 配置从逐台改文件，变成一处改全网生效
- id: three-questions
  title: 拆与不拆的三问标尺：一问不过就老实做模块化单体
  tldr: 剪刀落下前连问三声：痛是人多带来的协作痛吗？业务边界在单体内养清了吗？四件套加可观测与契约测试养得起吗？答不上来就先做模块化单体。
  body: |-
    下次有人提议「把系统重构成微服务」时，先按顺序摆出三道考题。第一问审痛点：眼下难受是因为三十个人发版撞车、故障连坐，还是单纯因为代码写成了谁也不敢动的意大利面条？如果是代码内部职责混乱，拆上网络只会把「单体屎山」升级成没法单步调试的「分布式屎山」。

    第二问审边界：打算下刀的这条分界线（比如订单与履约、商品与营销），已经在代码里当独立模块稳定跑过半年了吗？Martin Fowler 反复强调「Monolith First（单体优先）」，就是因为早期拍脑袋画错一条边界，在单体里挪几个包就能改好，拆成微服务后却要跨三个团队改接口外加在线迁移千万行表数据。第三问审家底：前面列的四件配套设施、覆盖全链的[[链路追踪]]与[[可观测性]]、守住接口的[[契约测试]]，团队现在有人手维护吗？三问但凡卡住一问，标准答案就是退回做「模块化单体」——在同一个进程里严守模块目录隔离、只走公开接口、严禁跨模块直查表，把切口养干净等规模真到了再剪开。
  derivation: original
  sources:
  - ref: fowler-monolith-first
    locator: "Martin Fowler: Monolith First（先单体的论证与适用条件）"
    claim: 几乎所有系统都应先从单体开始：微服务只在系统复杂到一定程度后才划算，过早拆分会付出高昂的分布式代价；成功案例多是先单体长大再拆分。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: team
      id: judge
      label: 做判断的人：对着系统问三遍
    - lane: mono
      id: verdict
      label: 一问不过：先做模块化单体
      highlight: true
    messages:
    - id: m1
      from: judge
      to: verdict
      label: 痛是组织的痛吗、边界清吗、税付得起吗
      active: true
    registers:
    - name: 模块化单体
      value: 按将来的线划模块，养清边界再剪开
  log:
  - at: 判断
    text: 三问全过才拆，不过就先养边界
- id: split-order
  title: 真要拆先拿边缘练手：用绞杀者模式小步切流，拒搞大爆炸
  tldr: 先剥离无状态、错了不致命的短信通知与只读报表练熟基础设施，把横跨资金链的下单支付压到最后；全程靠网关灰度切流，新老并跑可进可退。
  body: |-
    三问全过决定动手拆分时，下刀顺序直接决定手术生死。第一刀绝不能砍向最核心的下单与支付，而要挑边缘、低耦合、容错度高的模块开刀——比如发短信邮件的通知模块（抖动一下顶多晚几秒收到验证码），或者只读不写的统计报表模块（压根不碰分布式事务）。拿它们当先遣队把[[服务发现]]、[[网关]]、[[熔断器]]和[[链路追踪]]在生产流量下趟熟，等团队把半夜排障的手艺练成肌肉记忆，最后再啃横跨库存、订单、账户三套账本的核心交易硬骨头。

    切换手法一律采用「绞杀者模式（Strangler Fig Pattern）」：先在老[[单体]]旁边把独立的通知新服务搭起来，在网关层按[[金丝雀发布]]的套路先拨 `1%` 的线上流量过去比对结果，观察几天严丝合缝后再逐步推到 `10%`、`100%`，出现异常一秒切回老单体；等全量稳定跑满两周，再把单体里的旧代码安安全全删掉。千万别信「封网一个周末把大单体一次性拆成十个微服务」的大爆炸方案——周一早上一旦炸锅，连退回原地的路都已经被自己炸断了。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: services
      id: edge
      label: 先拆：通知、报表、搜索（错了不致命）
    - lane: services
      id: core
      label: 最后拆：下单、支付（闪失就是钱）
    - lane: infra
      id: strangler
      label: 绞杀者：网关切一小部分流量先验
      highlight: true
    messages:
    - id: m1
      from: edge
      to: core
      label: 边缘练手攒经验，核心压阵最后动
      active: true
    registers:
    - name: 推进方式
      value: 新老并行、小步切流，拒绝大爆炸
  log:
  - at: 拆分顺序
    text: 从边缘向核心，拆一截稳一截
- id: closing-micro
  title: 微服务判断课收官：一杆天平与架构评审三步答法
  tldr: 天平左边是多团队互不堵车的组织扩展性，右边是网络部分失败、跨库无事务与四件套运维税；看准规模站在哪一头，比背熟十个组件名管用得多。
  body: |-
    把整课浓缩成天平两端的账本：左边唯一的砝码是「组织扩展性」（独立发版、按需扩容、故障隔离），只有团队涨到几十人后才有分量；右边压着三块铁秤砣——微秒变毫秒且不知成败的网络税、分库后靠 [[Saga]] 与对账硬扛的数据税、外加养活发现/网关/熔断/配置/追踪的基建税。小团队站上去天平必向右塌，大组织站上去左边才压得过右边。

    无论是在公司做架构评审还是在面试场被问「你们为什么拆（或不拆）微服务」，顺着三问给出闭环回答最见功底：① 先报人数与发版排队的真实协作痛点；② 再讲怎样先在模块化单体里把业务表与接口边界养干净；③ 最后亮出用幂等键、Saga 对账、熔断降级与绞杀者切流兜底分布式税的具体落点。算清了传统业务服务的形态账，最后一课我们去驯服后端世界最年轻的新下游——大模型接口。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: team
      id: scale
      label: 一杆秤：组织扩展性 vs 分布式税
    - lane: infra
      id: verdict
      label: 判断顺序：先看痛，再看边界，再看支付能力
      highlight: true
    messages:
    - id: m1
      from: scale
      to: verdict
      label: 两边的分量都随规模变，估准了才动手
      active: true
    registers:
    - name: 总纲
      value: 先想清楚愿意牺牲什么，再挑武器
  log:
  - at: 收束
    text: 微服务是判断题：账估准了，技术反而不难
