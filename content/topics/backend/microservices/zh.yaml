overview:
- key: 一句话总结
  value: 微服务买的是组织扩展性（多团队独立开发、独立发版、独立扩容、故障隔离），付的是分布式重税（函数调用变网络、联表与强事务消失、运维面暴涨几十倍）。它是一道组织与成本的判断题，绝不是默认先进的技术升级。
- key: 单体的痛
  value: 单体只有在规模大了之后才会冒出三种真痛：十个小组攒车发版排长队、边缘慢查询打满连接池拖死核心下单、只为扩一个热点页面被迫把整站复制十份。团队小的时候，这三种痛全不存在。
- key: 拆分的税
  value: 拆开当天就要缴三笔税：调用从微秒变毫秒且多出「对方已执行但回包丢了」的部分失败；各服务分库后跨表 JOIN 与本地事务消失，一致性全靠 Saga 与对账自己兜；部署、监控与排障对象从 1 个裂变成几十个。
- key: 配套设施
  value: 服务发现当动态电话本，网关收拢外部入口做验票限流，熔断器当保险丝切断慢下游雪崩，配置中心集中热推开关参数。这四件套不是赠品，而是拆开后为堵窟窿不得不养的基础设施。
- key: 单体优先
  value: 业界公认（Martin Fowler「Monolith First」）新系统应从单体起步：业务边界没摸准就硬拆，跨服务改边界加迁数据的返工贵上好几倍；先做模块化单体养清界线，等规模痛点坐实再顺着模块切开。
- key: 谁在用
  value: 大型电商与平台（订单、库存、支付、物流各归独立团队）靠微服务解开百人协作死结；反面教训同样遍地都是——十人小团队盲目拆成二十个微服务，被运维与联调拖垮后又含泪合并回单体。
summary: 顺着一个电商系统从 3 人长到 30 人的真实历程算总账：[[微服务]]买来的不是更快的性能，而是符合康威定律的组织扩展性——让多个团队独立发版、独立扩容、故障互不连坐。作为交换，团队必须天天缴三笔分布式重税：进程内函数调用变成毫秒级且会半途失联的网络调用，分库后跨表 JOIN 与本地事务双双消失，还得额外养活[[服务发现]]、[[网关]]、[[熔断器]]与[[配置中心]]四件基础设施。全课把收益单与税单摊在桌面上逐项对账，最后给出「拆不拆三问」与绞杀者渐进拆分路线。
premise: 起步时 3 个人围着一个[[单体]]仓库写电商，改代码、发版、查日志快如闪电。三年后扩到 30 个人挤在同一个仓库里：十个组发版要排号等拼车，一个边缘报表慢查询把数据库[[连接池]]占满导致全站下不了单，大促想给商品详情扩容却只能把整站复制十份。拆微服务的念头就在这时冒了出来——可剪刀落下去之前，怎么判断眼下的痛到底该不该靠微服务治，背后的分布式重税团队又付不付得起？
position: 本课位于后端工程学科第十段「质量与形态：测试与微服务」的后半，是传统服务架构的收束判断课。拆分后要缴的跨库一致性与部分失败税，对应分布式学科的核心机制；拆分后必须补齐的[[网关]]、[[限流]]、动态配置与[[契约测试]]，则把本学科前面几课的零件组装成了一套完整的架构选型框架。
level: 进阶
minutes: 28
objectives:
- 对齐规模阶段说清单体的三种协作之痛与微服务的三笔日常税款
- 算清函数调用变网络调用后的延迟放大账与「不知对方成没成」的失败账
- 说准服务发现、网关、熔断器、配置中心各自堵住哪个分布式窟窿
- 拿「拆不拆三问」评估真实业务系统，规划从边缘向核心推进的绞杀者拆分顺序
aiLink: 记住微服务选型总纲：买的是组织扩展性，缴的是分布式重税。下判断永远连问三声——痛是不是人多带来的协作痛？业务边界在模块化单体里养清了吗？四件套加可观测与契约测试养得起吗？
bridge:
  prev: 上一课织好了三层自动化测试网，改代码时不再提心吊胆。可还有一种痛靠测试救不了：三十个人挤在同一个单体仓库里，发版排长队、慢查询连坐全站——这属于系统形态的痛，本课就来算拆与不拆的总账。
  next: 算清了传统业务服务的拆分账，最后一课把目光转向如今最常接入的新下游——大模型接口。面对逐字慢吐、按 token 烧钱又爱编造事实的模型，流式推送、RAG 向量检索与成本防线怎样搭起来？
design:
- mechanism: 单体优先，沿养清的模块边界拆
  problem: 产品早期需求与业务边界每周都在变，这时凭空猜几条线拆成微服务，一旦猜错，每次改需求都要跨多个仓库改接口、迁数据，返工成本是单体内部重构的好几倍。
  choice: 先建成模块化单体：同进程内按业务划清模块目录、模块间只走公开接口、数据库表按模块划归属。等团队规模坐实了痛点，再顺着现成的模块缝隙剪成独立服务。
  tradeoff: 单体期必须严守代码纪律，忍住「跨模块顺手直查对方表」的诱惑；将来真拆出去时也仍有一笔网络化改造工作量。
  root: 微服务拆分本质上是把低成本的编译期边界硬化成高成本的网络运行期边界——边界画对了换来独立，画错了照缴重税却换来假独立。
- mechanism: 数据库按服务严格私有
  problem: 如果拆成十几个服务进程，底下却继续共用同一个数据库互相 JOIN、互相改表，那就既没换来独立发版（改张表全员陪绑），又白缴了网络调用税，沦为最糟糕的「分布式单体」。
  choice: 每个服务独占自己的数据库，读别家数据一律走接口或订阅异步事件，跨服务写操作靠 Saga 拆成本地事务加反向补偿与定时对账。
  tradeoff: 原本一句 SQL JOIN 能查出的列表得在应用层拼装或做数据冗余，强一致事务不再免费，全靠业务代码自己兜底。
  root: 服务能不能独立发版扩容，归根结底看底层数据解没解耦；库私有是微服务最痛的一刀，也是真独立唯一的地基。
- mechanism: 为部分失败设防：超时、重试预算与熔断
  problem: 网络调用随时会超时或慢十倍，一旦某个下游卡顿，上游工作线程会在几秒内全部堵死在等待上，顺着调用链一层层向上传染成全站雪崩。
  choice: 所有跨服务调用强制设超时，重试严控次数与预算并配幂等键，关键下游挂上熔断器——失败率超标立刻跳闸快速返回降级结果，不陪慢下游死等。
  tradeoff: 超时与熔断阈值需要持续盯着线上指标调优，故障期间走降级也意味着部分非核心功能暂时有损，需要产品与业务提前认账。
  root: 分布式世界里局部故障是日常而非意外，架构前提必须从「调用默认成功」切换为「调用随时失联或变慢」。
quiz:
- q: 拆微服务真正买来的核心收益是什么？
  options:
  - 性能更快，因为服务变小了
  - 组织扩展性：让多个团队能各自开发、独立发版、按需扩容，互不排队也互不连坐
  - 代码量更少
  - 不再需要测试了
  answer: 1
  explain: 微服务治的是多团队协作拥堵（康威定律）：独立发版、独立扩容与故障隔离全是组织解耦的产物。单论纯执行速度，进程内函数调用改成跨网络反而更慢。
- q: 拆分后，下单扣库存从进程内函数调用变成跨服务网络调用，多背上的账主要是？
  options:
  - 没有区别，都是调用
  - 延迟从微秒级涨到毫秒级，且多出「库存其实扣成功了、只是响应包半路丢了」的不确定失败状态
  - 只是代码写起来长一点
  - 数据库变快了
  answer: 1
  explain: 内存函数调用要么成功要么抛异常；跨网调用不仅慢上三个数量级，还会卡在「不知对方成没成」的薛定谔状态，逼着你补齐幂等键、超时预算与异步对账。
- q: 10 个人的创业团队做新产品，业务边界还在高频调整，此时该不该直接上微服务？
  options:
  - 该，早拆早享受
  - 不该：大团队的协作痛还没影，分布式重税倒先背上了；应先用模块化单体养清边界，等规模痛点出现再拆
  - 该，因为以后肯定要拆
  - 看团队里有没有人会 Kubernetes
  answer: 1
  explain: 这正是 Martin Fowler 所说的「单体优先」标准场景：早期边界猜错后的跨服务重构贵得惊人，模块化单体既留好了将来拆分的切口，眼下又不用白缴分布式税。
- q: 调用链上装熔断器（Circuit Breaker）主要防的是哪类事故？
  options:
  - 防 SQL 注入
  - 防一个变慢的下游把上游工作线程全部挂死拖成全站雪崩：错误或超时过线立刻跳闸走降级，恢复后再合闸
  - 防密钥泄露
  - 防缓存穿透
  answer: 1
  explain: 分布式调用链里「慢」比「报错退出」更致命——200 个线程几秒内就会被慢接口占满。熔断器像家里电箱的保险丝，果断切断故障支路，保住主站核心链路存活。
steps:
- id: monolith-pain
  title: 单体的三种痛都长在规模之后：小团队根本没这病
  tldr: 发布排长队、慢查询连坐全站、扩容只能整站复制，这三种痛只有在团队涨到几十人后才会爆发；小规模时硬拆纯属没病吃苦药。
  body: |-
    电商刚起步那会儿，3 个工程师守着一个[[单体]]进程：改完代码几秒编好包，重启一个进程就上线，排障只需翻一份日志。等业务做大、30 个人分成十个小组全挤进这同一个仓库时，三种结构性疼痛才接连找上门。第一痛是发版排队：任何小组改两行代码都得整站重新编译打包，十个组凑一趟班车上线，只要一处报错就得整车一起[[回滚]]。

    第二痛是故障连坐：运营后台一个冷门报表写了条慢查询，瞬间把整个进程的数据库[[连接池]]占满，主站顾客下不了单跟着陪葬。第三痛是扩容粗放：双十一只有商品详情页流量翻十倍，单体却只能把包含了后台报表、财务结算在内的整套巨型进程一起复制十份。

    这正应了 1967 年 Melvin Conway 提出的康威定律——系统的架构终将长成团队沟通结构的样子。看清这一点就明白：[[微服务]]治的全是「人多、流量大」之后的协作拥堵；3 到 10 个人的团队还没这病，提前拆服务等于白背一身债。
  derivation: original
  canvas:
