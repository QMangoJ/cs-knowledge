    text: 调用的语义变了，每处调用都要防失败
- id: data-tax
  title: 第三步：第二笔税——联表与事务一起消失
  tldr: 服务各管一份数据之后，单体里最顺手的两件工具同时没了：跨服务的数据联表查不了，一次下单横跨三库时数据库事务也包不住了。一致性从免费赠品变成要自己设计的东西。
  body: |-
    先看查询的税。单体里订单列表要带买家昵称，一条 JOIN 搞定（SQL 课刚练过）。拆开后订单在订单服务的库里、用户在用户服务的库里，数据库之间不能联表。应用层只能先查订单、再批量调用户服务拼昵称——正是 SQL 课里 N+1 的形状被放大到了服务间；或者把昵称冗余一份存进订单库，拿一致性维护换查询便利。两种解法都要额外工程，没有免费的了。

    再看事务的税。下单要同时扣库存、建订单、扣余额，单体里一个本地事务全包。拆开后是三家的库，本地事务只管得着自家：分布式学科里已经把出路讲透了——两阶段提交重且脆，主流是 Saga 把大事务拆成一串本地事务加补偿，配上幂等与对账。这里不重复，只钉住结论：拆分之前，这套机制的工程量与运维量要先算进总账。

    所以数据税是三笔税里最重的一笔：它不是一次性的迁移成本，而是从此以后每次跨服务查询、每次跨服务一致性都要付的日常成本。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: mono
      id: join
      label: 单体内：一条 JOIN、一个事务，全免费
    - lane: services
      id: split
      label: 拆开后：联表没了、事务只管自家
      highlight: true
    messages:
    - id: m1
      from: join
      to: split
      label: 一致性从赠品变成要自己养的机制
      active: true
    registers:
    - name: 查询税
      value: 接口拼装或数据冗余，二选一都要工程
    - name: 事务税
      value: Saga 加补偿加对账，是日常成本不是一次性成本
  log:
  - at: 第二笔税
    text: 数据不独立是假拆分，独立了就要付一致性的账
- id: service-discovery
  title: 第四步：配套一——服务发现，解决「对方现在住哪」
  tldr: 拆完立刻撞上的第一个窟窿：订单服务要调库存服务，可库存服务有五个实例、地址随扩容缩容天天变。服务发现就是那本电话本：实例上线登记、下线注销，调用方先查电话本再拨号。
  body: |-
    先看窟窿的形状。单体里调用是编译期就定死的函数名；服务化后，调用方手里只有「库存服务」这个名字，它的实例今天在这三台机器、明天扩容成五台、后天一台宕机被替换——地址写死在配置里，第一次扩容就全失效。

    [[服务发现]]的机制是注册与查询两步。每个服务实例启动时，把自己的地址登记到注册中心（[[etcd]] 这类组件常兼任此职）；调用方要调库存服务时，先问注册中心要一份当前可用的实例名单，再挑一个发请求。名单会持续更新：宕机的实例心跳断了会被摘掉，新实例起来会自动进名单。

    两种流派点一句：客户端发现是调用方自己查名单、自己挑（负载均衡逻辑在客户端库里）；服务端发现是调用方把请求发给一个代理，由代理查名单转发。区别在负载均衡的逻辑放哪，不影响「先有电话本」这个本质。没有这本电话本，微服务连互相找到对方都做不到——它是拆分后第一样要补的基础设施。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: services
      id: inv
      label: 库存服务：五个实例，地址天天变
    - lane: infra
      id: reg
      label: 注册中心：上线登记、下线摘除
    - lane: services
      id: ord
      label: 订单服务：先查名单，再挑一个调
      highlight: true
    messages:
    - id: m1
      from: inv
      to: reg
      label: 实例把地址登记进来，心跳保活
    - id: m2
      from: ord
      to: reg
      label: 调用前先问：库存服务现在住哪
      active: true
    registers:
    - name: 名单的新鲜度
      value: 靠心跳维护，宕机实例自动摘除
  log:
  - at: 配套一
    text: 电话本是拆分后第一样要补的东西
- id: gateway-bff
  title: 第五步：配套二——网关，入口从每家门口收成一个大门
  tldr: 对外的入口同样要收口：几十个服务若各自对外，认证、限流、证书要在几十处各做一遍。网关把大门收成一个：门口的活做一次，后面的服务只管业务——它就是请求课那道网关在多服务形态下的放大版。
  body: |-
    先对上号：请求课讲请求链路时，第一关就是网关——那时它站在单体前面。服务拆开后，它的必要性只增不减：客户端（网页、手机应用）不可能记几十个服务的地址，更不可能让每个服务各自处理登录与限流。网关按路径把请求分给对应服务，认证在门口验一次（认证课的凭证在这里被验），限流在门口数一次，证书在门口终结一次。

    它还顺手接下两个多服务特有的活。一是聚合：一个页面要的数据散在三个服务里，网关可以一次并行问齐再拼好返回，省得客户端来回跑三趟；二是给不同客户端备不同的门（BFF，Backend For Frontend）：手机要的字段少而精，网页要的全而细，各自的网关层按端裁剪，免得一个接口伺候所有端越长越胖。

    边界也要划清：网关只做门口的横切活，不写业务规则。它一旦开始写业务，就变成了一个新的、更难拆的单体——这是微服务架构里最常见的腐化路径，审查时要专门盯这一条。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: team
      id: client
      label: 客户端：只认一个大门
    - lane: infra
      id: gw
      label: 网关：验票、限流、分发、聚合
    - lane: services
      id: svc
      label: 几十个服务：只管业务，不再各自设门
      highlight: true
    messages:
    - id: m1
      from: client
      to: gw
      label: 所有外部请求先过这道门
    - id: m2
      from: gw
      to: svc
      label: 按路径分发，顺手聚合多服务数据
      active: true
    registers:
    - name: 腐化警报
      value: 网关开始写业务规则，就是新单体在长成
  log:
  - at: 配套二
    text: 入口收成一个，门口的活只做一次
- id: circuit-breaker
  title: 第六步：配套三——熔断，防一个慢下游拖死全链
  tldr: 多服务最恐怖的故障是传染：一个下游变慢，上游的线程全卡在等它，上游的上游再跟着卡，一条链整体雪崩。熔断器就是装在调用之间的保险丝：下游错多了就断开，请求立刻失败走降级，不再傻等。
  body: |-
    把雪崩的账算出来。订单服务有 200 个工作线程，下单要调库存服务。某天库存服务因为数据库抖动，每个请求要 10 秒才回（平时 10 毫秒）：订单服务的请求以每秒 100 个进来，每个都占住一个线程等 10 秒——2 秒之内，200 个线程全部卡在等库存上。此刻订单服务连不需要库存的查询也答不了了，它的上游再跟着遭殃。一个服务的迟钝，顺着调用链传染成全站事故。

    [[熔断器]]打断传染链。它盯着对某个下游的调用结果：一段时间里失败率过了阈值（比如一半），就跳闸——之后调这个下游的请求直接快速失败，连发都不发，上层立刻走降级答复（比如下单先排队、页面先给缓存数据）。过一阵它放几个试探请求过去，下游恢复了就合闸，没恢复就继续断着。名字来自电路保险丝：宁可这一路断电，不能让短路烧了全屋。

    它的参数（阈值、断开时长、降级内容）要和超时、重试预算一起治理——分布式学科的治理课讲过这套组合在消息与调用治理中的位置，这里落到同步调用链上：熔断保的是「失败要快」，因为慢比失败更具传染性。
  derivation: original
  sources:
  - ref: envoy-circuit-breaking
    locator: "Envoy 文档: Circuit breaking 的阈值与异常值检测"
    claim: 服务网格与代理层普遍内置熔断：按待处理请求、连接与错误率等阈值限制对故障上游的继续调用，防止级联失败扩散。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: services
      id: ord
      label: 订单服务：200 个线程在等库存
    - lane: services
      id: inv
      label: 库存服务：每个请求慢到 10 秒
    - lane: infra
      id: cb
      label: 熔断器：失败过半就跳闸，走降级
      highlight: true
    messages:
    - id: m1
      from: ord
      to: inv
      label: 两秒内线程全卡在等待上
    - id: m2
      from: cb
      to: ord
      label: 跳闸后请求立刻失败，不再傻等
      active: true
    registers:
    - name: 雪崩的账
      value: 每秒进 100、每个等 10 秒，2 秒占满 200 线程
    - name: 熔断的要义
      value: 慢比失败更具传染性，失败要快
  log:
  - at: 配套三
    text: 保险丝断的是传染链，保的是全链的命
- id: config-center
  title: 第七步：配套四——配置中心，几十份配置不能一台台改
  tldr: 最后一个窟窿是配置：单机课里一份环境文件就够了，可几十个服务、每个多个实例，改一个开关要登几十台机器。配置中心把配置收成一处：改一次，所有服务动态生效，还能留痕与回滚。
  body: |-
    先看它和单机配置的分工。部署课里配置经环境变量注入，那适合「进程启动时读一次」的静态配置：数据库地址、端口这类。微服务里多出一类动态配置：限流阈值、功能开关、降级策略——它们要在运行中随时调整，不可能靠改环境变量加重启几十个实例来完成。

    [[配置中心]]的机制是集中存储加推送：所有服务的配置放在一处管理，服务启动时来拉一份，运行中配置变了，中心把新值推给或通知到每个实例，实例热加载生效。改一个全站开关，从「登几十台机器改文件再逐个重启」变成「在一处改一个值，几秒内全网生效」，且每一次修改都有记录、能回滚到上一版。

    代价是它自己成了一个关键基础设施：它挂了，服务要能拿着最后一份配置继续跑（本地缓存兜底）；它的权限要严管，因为能改配置就等于能改全站行为。判断要不要上它，标准和其它配套一样：实例数少时环境变量足够，配置中心是规模逼出来的，不是标配赠品。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: infra
      id: cc
      label: 配置中心：一处改值，全网推送
    - lane: services
      id: fleet
      label: 几十个实例：热加载新配置，不用重启
      highlight: true
    messages:
    - id: m1
      from: cc
      to: fleet
      label: 限流阈值改一处，几秒内全网生效
      active: true
    registers:
    - name: 与环境变量的分工
      value: 静态配置归注入，动态配置归中心
    - name: 兜底
      value: 中心挂了，实例拿本地缓存的配置继续跑
  log:
  - at: 配套四
    text: 配置从逐台改文件，变成一处改全网生效
- id: three-questions
  title: 第八步：判断——拆与不拆的三问
  tldr: 轮到下结论了。对着任何想拆的系统问三遍：痛是不是组织的痛、边界摸清了没有、税付不付得起。三问有一问答不上来，答案就是先不拆，去做模块化单体。
  body: |-
    第一问，看痛的来源：现在的痛是发布排队、故障连坐、扩容粒度这三种组织与规模之痛，还是只是代码写得乱？代码乱是单体内部的卫生问题，拆成服务只会把乱摊到网络上，越拆越乱。痛必须是规模带来的，才轮得到微服务来治。

    第二问，看边界：要拆的这条线，是业务上公认的界线（订单与物流、支付与营销），还是今天拍脑袋画的？边界在单体内先以模块形式存在过、被真实需求检验过，才算摸清。边界没摸清就拆，改一次需求要动三个服务加三份数据迁移，返工的单价是单体内的数倍。

    第三问，看税的支付能力：四样配套（服务发现、网关、熔断、配置中心）加可观测（观测课的三支柱要覆盖每个服务）、加契约测试（上一课的网要先织好）——这些基础设施与人力，团队现在拿得出吗？拿不出，拆完就是每个服务都裸奔，故障率只会比单体更高。

    三问全过，拆；任何一问不过，先做模块化单体：模块边界按将来要拆的线划，模块间只走接口调用、数据按模块归属——这样养着，规模真到了，拆分就是沿现成的线剪开，而不是从头猜。
  derivation: original
  sources:
  - ref: fowler-monolith-first
    locator: "Martin Fowler: Monolith First（先单体的论证与适用条件）"
    claim: 几乎所有系统都应先从单体开始：微服务只在系统复杂到一定程度后才划算，过早拆分会付出高昂的分布式代价；成功案例多是先单体长大再拆分。
    status: verified
    checkedBy: subagent
    checkedAt: "2026-11-17"
  canvas:
    kind: swimlane
    actors:
    - lane: team
      id: judge
      label: 做判断的人：对着系统问三遍
    - lane: mono
      id: verdict
      label: 一问不过：先做模块化单体
      highlight: true
    messages:
    - id: m1
      from: judge
      to: verdict
      label: 痛是组织的痛吗、边界清吗、税付得起吗
      active: true
    registers:
    - name: 模块化单体
      value: 按将来的线划模块，养清边界再剪开
  log:
  - at: 判断
    text: 三问全过才拆，不过就先养边界
- id: split-order
  title: 第九步：真要拆，先拆谁——从边缘向核心推进
  tldr: 若三问全过、决定要拆，顺序也有讲究：先拆无状态、边界清、错了不致命的（通知、报表、搜索），核心交易（下单、支付）最后拆。绞杀者模式让新老并行，拆一截、稳一截。
  body: |-
    先说顺序的逻辑。拆分是一次高风险手术，团队对四样配套设施的熟练度、分布式故障的处理经验，都要在实战中长。先拿边缘服务练手：通知服务发短信邮件，拆错了顶多通知晚到；报表服务只读不写，数据一致性压力最小。这些服务拆完，注册、网关、熔断、追踪全链路都被真实流量验过一遍，团队的手艺也练出来了。

    核心交易最后拆的理由是它的账最重：下单与支付横跨库存、订单、余额，Saga 与对账全套要上，任何闪失都是钱的事故。把它放在团队最有经验的时候拆，前面练手的学费才算没白交。

    方法上用绞杀者模式：新服务先在旁边长出来，网关把对应路径的流量一小部分切过去（金丝雀的思路，发布课讲过），稳了再全量，旧代码最后下线。整个过程新老并行、可进可退，而不是选个周末把大单体一刀两断——大爆炸式拆分失败时，连退回去的路都没有。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: services
      id: edge
      label: 先拆：通知、报表、搜索（错了不致命）
    - lane: services
      id: core
      label: 最后拆：下单、支付（闪失就是钱）
    - lane: infra
      id: strangler
      label: 绞杀者：网关切一小部分流量先验
      highlight: true
    messages:
    - id: m1
      from: edge
      to: core
      label: 边缘练手攒经验，核心压阵最后动
      active: true
    registers:
    - name: 推进方式
      value: 新老并行、小步切流，拒绝大爆炸
  log:
  - at: 拆分顺序
    text: 从边缘向核心，拆一截稳一截
- id: closing-micro
  title: 第十步：收束——先想清楚愿意牺牲什么
  tldr: 全课收成一句总纲：微服务买的是组织扩展性，付的是分布式税。判断顺序是先看痛、再看边界、再看支付能力，最后才谈拆法——这与分布式课里 CAP 的判断是同一个句式：先想清楚愿意牺牲什么，再去挑武器。
  body: |-
    把这一课的账并一并。收益清单只有一项但分量很重：组织扩展性——独立开发、独立发布、独立扩容、故障隔离，全是团队变大之后才兑现的。税单有三笔：调用变网络（延迟与部分失败）、数据要独立（联表与事务消失）、运维对象变几十个（四样配套加可观测与契约测试）。两边的分量都随规模变化：规模小，税重于收益；规模大，收益才压过税。

    这也是为什么这一课是判断课而不是技术课：拆的技术动作本身不难，难的是对着自己的系统把两笔账估准。面试里被问到「你们为什么用微服务」或「该不该拆」，沿着三问讲——痛是不是组织的、边界清不清、税付不付得起——就是完整的答案，比背组件清单有力得多。

    写服务一侧还剩最后一课，换一种服务看：把大模型接成 API，请求链路还是那条链吗？流式输出、检索增强、按 token 计费，是这门新手艺的四件新事。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: team
      id: scale
      label: 一杆秤：组织扩展性 vs 分布式税
    - lane: infra
      id: verdict
      label: 判断顺序：先看痛，再看边界，再看支付能力
      highlight: true
    messages:
    - id: m1
      from: scale
      to: verdict
      label: 两边的分量都随规模变，估准了才动手
      active: true
    registers:
    - name: 总纲
      value: 先想清楚愿意牺牲什么，再挑武器
  log:
  - at: 收束
    text: 微服务是判断题：账估准了，技术反而不难
