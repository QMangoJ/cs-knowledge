      id: fn
      label: 单体内：函数调用，微秒级，成败分明
    - lane: services
      id: net
      label: 拆开后：网络调用，毫秒级，多一种「不知道成没成」
      highlight: true
    messages:
    - id: m1
      from: fn
      to: net
      label: 慢三个量级，失败多一种形态
      active: true
    registers:
    - name: 延迟账
      value: 链串十个服务，调用开销吃掉几十毫秒
    - name: 失败账
      value: 对方可能已执行，答复丢在路上
  log:
  - at: 第一笔税
    text: 调用的语义变了，每处调用都要防失败
- id: data-tax
  title: 第二笔税：分库之后跨表 JOIN 与本地强事务双双消失
  tldr: 服务要想真独立就必须各自独占数据库；分库那一刻起，一句 SQL 联表变成接口拼装或数据冗余，本地 ACID 事务变成 Saga 补偿加对账。
  body: |-
    有些团队嫌拆数据库太痛，只把代码拆成订单、库存、用户三个进程，底下却继续连着同一个大数据库互相 JOIN、互相改表——这是业界最臭名昭著的反模式「分布式单体」：一旦用户表改个字段，三个服务照样得绑在一起发版，半点独立性没捞着，还白缴了网络调用税。

    咬牙把数据库按服务彻底拆私有后，两笔日常重税立刻落到每次开发头上。第一笔是查询税：以前展示订单列表带买家昵称，一句 SQL `JOIN` 搞定；现在订单库和用户库物理隔离，要么先查出订单再拿着一批用户 ID 批量调用户接口拼装，要么在订单表里冗余存一份买家昵称并订阅改名事件同步更新。

    第二笔是事务税：下单同时扣库存、生订单、扣储值卡，单体里靠数据库本地事务就能同生共死；拆成三个独立库后，只能用 [[Saga]] 模式把大动作拆成一串本地事务，中间哪步挂了再挨个跑反向补偿接口把库存加回去，夜间还得跑定时对账脚本兜底。这笔税不是迁库那天交一次就完，而是往后每写一个跨业务需求都要交。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: mono
      id: join
      label: 单体内：一条 JOIN、一个事务，全免费
    - lane: services
      id: split
      label: 拆开后：联表没了、事务只管自家
      highlight: true
    messages:
    - id: m1
      from: join
      to: split
      label: 一致性从赠品变成要自己养的机制
      active: true
    registers:
    - name: 查询税
      value: 接口拼装或数据冗余，二选一都要工程
    - name: 事务税
      value: Saga 加补偿加对账，是日常成本不是一次性成本
  log:
  - at: 第二笔税
    text: 数据不独立是假拆分，独立了就要付一致性的账
- id: service-discovery
  title: 必配设施一：用[[服务发现]]当动态电话本，找准天天搬家的实例
  tldr: 库存服务随时在扩容、缩容、宕机重拉，IP 地址天天变；实例上线去注册中心登记并维持心跳，调用方先查实时名单再发请求。
  body: |-
    单体时代调库存只是编译期定死的函数地址；拆成独立服务并跑在多台机器或容器里后，库存服务上午跑着 3 个实例，中午大促自动扩容到 8 个，下午挂掉 1 个被换到新机器——IP 和端口每小时都在变，写死在配置文件里第一次扩容就全废了。

    [[服务发现]]就是为动态集群建的一本实时电话本（常由 [[etcd]]、Consul 或 Kubernetes 内置的 DNS/Service 承担）。库存实例一启动，先把自己的 IP 端口登记到注册中心并每隔几秒发一次心跳；一旦某个实例宕机断了心跳，注册中心立刻把它从可用名单里划掉。订单服务发请求前先拉取并缓存这份活名单，轮流挑健康的实例拨号——负载均衡逻辑写在调用方 SDK 里叫「客户端发现」，交给基础设施代理转发则叫「服务端发现」。
  derivation: original
  canvas:
    kind: swimlane
    actors:
    - lane: services
      id: inv
      label: 库存服务：五个实例，地址天天变
    - lane: infra
      id: reg
      label: 注册中心：上线登记、下线摘除
