    actors:
    - lane: team
      id: crowd
      label: 三十个人挤在一个仓库里
    - lane: mono
      id: mono
      label: 单体：发版排队、故障连坐、扩容整站
      highlight: true
    messages:
    - id: m1
      from: crowd
      to: mono
      label: 三种痛全是规模过了点才出现
      active: true
    registers:
    - name: 发布
      value: 十个团队攒一车上，出事整车回滚
    - name: 隔离
      value: 一个报表查询能拖死下单
  log:
  - at: 动机
    text: 先确认痛是真的，再谈拆不拆
- id: call-becomes-network
  title: 第一笔税：微秒级函数调用变成会失联的毫秒级网络调用
  tldr: 进程内调库存只需几百纳秒且成败分明；拆成跨网调用不仅慢上三个数量级，还多出「对方已扣完库存、回包却半路丢了」的薛定谔状态。
  body: |-
    剪开代码的第一天，延迟账单立刻翻倍。在单体内，下单模块调库存模块只是一次内存栈帧跳转，耗时几百纳秒，串十几个函数用户毫无察觉；拆成两个独立服务后，每次调用都要经历序列化、过网卡、对端排队反序列化，同机房内网走一遭也要零点几到几毫秒——足足慢了三个数量级。一条链路要是串起 10 个细碎服务，光网络路费就吃掉几十毫秒，所以拆分粒度绝不能碎成几十个迷你块。

    比变慢更棘手的是失败形态变了。内存函数调用要么成功返回，要么抛异常失败，黑白分明；网络调用却会撞上第三种结局：扣库存请求已经送到库存服务并成功落库，偏偏返回的确认包在网络抖动中丢了——站在订单服务眼里只有一个超时报错，根本不知道库存到底扣没扣。直接盲目重试可能把一件商品扣两次，不重试又会漏单，于是每处跨网写调用都不得不绑上[[幂等键]]、超时预算与事后对账。
  derivation: original
  canvas:
    kind: swimlane
