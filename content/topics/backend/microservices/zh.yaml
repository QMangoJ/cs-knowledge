id: backend/microservices
subject: backend
slug: microservices
title: 微服务：什么时候拆，拆完付什么税
order: 12
visual: swimlane
lanes:
- id: team
  label: 开发团队
- id: mono
  label: 单体
- id: services
  label: 微服务群
- id: infra
  label: 基础设施
logColumns:
- key: at
  label: 阶段
- key: text
  label: 发生了什么
status: published
license: CC-BY-4.0
overview:
- key: 一句话总结
  value: 微服务买的是组织扩展性：几十个人、几十个团队能各自开发、各自发布、各自扩容，互不排队。付的税是分布式的全部老问题被请进日常：函数调用变成网络调用、联表与事务消失、运维对象从一个进程变成几十个服务。所以它是一道判断题而不是技术题：先看你的痛是不是组织的痛，再决定付不付这笔税。
- key: 单体的痛
  value: 单体长大后的痛有三种：一改全站发版（发布要排队、出事要整站回滚）、一处崩全站崩（故障不隔离）、热门模块想单独扩容只能整站一起扩。这些痛都出现在规模之后，不出现在规模之前。
- key: 拆分的税
  value: 拆完立刻要付的：调用从微秒变毫秒且会超时会半路失败；每个服务一份库之后，跨服务联表没了、强事务没了，一致性要靠 Saga 与对账补；部署、监控、追踪、配置的对象从一个变成几十个。
- key: 配套设施
  value: 服务发现解决「对方住哪」，网关解决「入口统一」，熔断解决「一个慢下游拖死全链」，配置中心解决「几十份配置怎么改」。这四样不是微服务的赠品，是拆分后必须补上的窟窿——每一个都对应分布式学科里的一课。
- key: 单体优先
  value: 业界共识（Martin Fowler 的说法）是新系统先做单体：边界没摸清时拆，拆错的代价是分布式级的返工；单体先把业务跑通、把模块边界养出来，真到了痛点，再沿着已经清楚的边界拆。模块化单体是中间站，不是落后形态。
- key: 谁在用
  value: 电商与平台型公司（订单、支付、物流、商品各成服务）是微服务的典型用户，它们的共同点是团队规模先到了。反面教材也充足：不少团队在十个人的规模上了微服务，最后把运维成本花光、把功能速度拖垮，又合并回去——税是真的，收益要规模才兑现。
summary: 场景是一个电商系统长大的故事：起步时三个人一个单体，什么都快；三年后三十个人挤在同一个仓库里，发一次版要全站排队，改一行配置要全站重启，热门页面想扩容只能把整台机器升配。拆微服务的念头就是在这时冒出来的。这一课不教怎么拆，先算账：拆分的收益清单与税单逐项摆开，配套的四样基础设施（服务发现、网关、熔断、配置中心）各自补哪个窟窿，最后落到三问判断法——什么情况下拆、什么情况下坚决不拆、拆的时候先拆谁。
premise: 这节课要回答的问题是：微服务到底该不该上？它不是一道技术题——技术上人人拆得动。它是一道判断题：你的系统现在的痛，是不是微服务能治的痛；治这痛要付的分布式税，你的团队付不付得起。算不清这两笔账就动手，是后端架构最常见的昂贵错误。
position: 本课位于后端工程学科第十段「质量与形态：测试与微服务」的后半，是写服务一侧的判断课。它站在前面所有课的肩膀上：拆分后要付的税，分布式学科已经逐项讲过（事务、一致性、治理）；拆分后要用的设施，请求课的网关与限流、部署课的配置、测试课的契约，都是它的零件。这一课的任务是把零件组装成一个决策框架。
level: 进阶
minutes: 28
objectives:
- 能逐项说出单体的三种痛与微服务的三笔税，并判断它们出现在什么规模
- 能走一遍调用变网络的延迟与失败账，说清函数调用与远程调用的本质差别
- 能对上四样配套设施各自补的窟窿：服务发现、网关、熔断、配置中心
- 能用三问判断法给一个场景下结论：拆、不拆、还是先做模块化单体
aiLink: 记住决策的那句总纲：微服务买的是组织扩展性，付的是分布式税。判断顺序永远是先看痛是不是组织的痛，再看税付不付得起，最后才谈怎么拆——和 CAP 那句「先想清楚愿意牺牲什么」是同一个句式。
bridge:
  prev: 上一课把测试网织好了，服务改版时有了胆量。可还有一种痛测试治不了：三十个人挤在一个仓库里，发布排队、故障连坐、扩容只能整站一起——这是形态的痛。这一课就来算拆与不拆的账。
  next: 拆与不拆是传统服务的形态题，下一课换一种服务看：把大模型接成 API 时，后端的骨架还是不是这套？流式输出、RAG、向量检索、按 token 算的账，是 AI 应用后端的新件，也是本学科的收官。
design:
- mechanism: 单体优先，沿已摸清的边界拆
  problem: 系统早期业务边界天天在变，此时按猜测的边界拆成服务，猜错后每改一次边界都要跨服务返工，还要处理数据迁移——代价是单体内部重构的数倍。
  choice: 先做模块化单体：代码内按业务分模块、模块间只走明确接口、数据表按模块归属。边界在单体内养清楚、痛点被规模证实之后，再沿现成的模块界线拆出去。
  tradeoff: 单体阶段要克制「顺手跨模块直查表」的便利，纪律成本一直在付；且真拆的那天仍有网络化改造的工程量，中间站不是免费站。
  root: 拆分的本质是把编译期的边界变成运行期的边界：边界对了，运行期的税换来独立性；边界错了，税照付，独立性是假的。先在便宜的地方把边界试对，是顺序问题。
- mechanism: 数据库按服务私有
  problem: 若拆了服务却共用一个大库，服务之间仍能任意联表、直改对方的数据，等于把单体最耦合的部分原样保留，还额外付了网络调用的税——最坏的组合。
  choice: 每个服务独占自己的数据，要别人的数据只能调接口或订阅事件；跨服务的一致性用 Saga 与对账解决（分布式学科的领地）。
  tradeoff: 查询要多次调接口拼装或冗余存一份，报表要另建汇总通道；一致性从数据库的免费赠品变成要自己设计与运维的机制。
  root: 服务的独立性最终落在数据上：数据不独立，发布与扩容就不可能真独立。库私有是微服务全部税款里最重的一笔，也是收益真正的来源。
- mechanism: 为失败而设计：超时、重试预算、熔断
  problem: 网络调用会超时、会半路失败，下游慢时请求会在每一层堆积，一个服务的迟钝能顺着调用链传染成全站雪崩——这在单体内是不可想象的故障形态。
  choice: 每次远程调用都设超时，重试要有次数与总时长预算，关键链路装熔断器，快速失败并给降级答复；这些参数按链路统一治理。
  tradeoff: 参数调优是持续的运维负担，降级答复意味着功能在故障时是不完整的，需要产品层面一起认账。
  root: 分布式系统的第一性原理是部分失败常态化：设计的前提从「调用会成功」换成「调用随时会失败」，整套机制都是这个前提的推论。
quiz:
- q: 微服务最核心的收益是什么？
  options:
  - 性能更快，因为服务变小了
  - 组织扩展性：多个团队能各自开发、发布、扩容，互不排队、互不连坐
  - 代码量更少
  - 不再需要测试了
  answer: 1
  explain: 微服务的收益在组织不在技术：独立发布、独立扩容、故障隔离，都是「团队与团队之间解耦」的兑现。性能与代码量都不是它的卖点，调用变网络反而更慢。
- q: 拆分后，一次下单从函数调用变成跨服务调用，多付出的账主要是？
  options:
  - 没有区别，都是调用
  - 延迟从微秒量级变毫秒量级，还新增了超时与部分失败：对方可能已执行完，只是答复丢了
  - 只是代码写起来长一点
  - 数据库变快了
  answer: 1
  explain: 进程内调用是微秒级且要么成功要么抛异常；网络调用慢三个量级，且失败形态多一种「不知道对方成没成」。幂等与重试预算（请求课与分布式课的内容）就是为这笔账准备的。
- q: 十个人的团队、新产品、业务边界还在天天变，该不该上微服务？
  options:
  - 该，早拆早享受
  - 不该：痛还没出现，税先付了；先做模块化单体把边界养清楚，规模证实痛点后再沿边界拆
  - 该，因为以后肯定要拆
  - 看团队里有没有人会 Kubernetes
  answer: 1
  explain: 这正是单体优先的场景：边界猜错时，分布式级的返工比单体内重构贵数倍。模块化单体保留了将来拆分的路，又不预付分布式税。
- q: 熔断器防的是什么？
  options:
  - 防 SQL 注入
  - 防一个慢下游把调用链拖死：失败到阈值就快速失败，给上游留活路，下游恢复再合上
  - 防密钥泄露
  - 防缓存穿透
  answer: 1
  explain: 没有熔断时，上游的线程会全卡在等慢下游上，迟钝顺链传染成雪崩。熔断把「等」换成「立刻失败加降级」，是为失败而设计的标准件。
steps:
- id: monolith-pain
  title: 第一步：先看单体的痛——三种痛都长在规模之后
  tldr: 先把拆分的动机说准：单体的痛不是代码难看，是发布排队、故障连坐、扩容只能整站一起。这三种痛有个共同点——团队与流量小的时候，它们一个都不存在。
  body: |-
    跟着开场的电商系统走。起步时三个人一个单体：改什么都快，发版就是重启一个进程，出了问题看一个日志文件。三年后三十个人进来，第一种痛先到：发布排队。任何团队发版都要把整个应用重新构建、整体重启，十个团队的功能攒成一车一起上，出事回滚也是整车退——发布从随时能做到要约时间、要值班表。

    第二种痛是故障连坐。一个不重要的报表功能写了个死循环查询，能把整个应用的数据库连接拖满，下单跟着一起死——所有模块共享一个进程、一份资源，隔离性为零。第三种痛是扩容粒度：大促时只有商品详情热，可单体扩容只能把整个应用复制十份，连报表模块也跟着复制十份，钱花在不需要的地方。

    把三种痛的共同点钉住：它们全是规模的函数——团队人数、流量、模块数过了某个点才疼。小系统硬上微服务去治还不存在的痛，等于为不存在的病预付最贵的药。这就是下一课所有判断的地基。
